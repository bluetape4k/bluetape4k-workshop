spring:
    cloud:
        aws:
            endpoint: ${AWS_ENDPOINT_URL:${testcontainers.floci.aws-endpoint:http://localhost:4566}}
            region:
                static: us-east-1
            credentials:
                access-key: noop
                secret-key: noop
    autoconfigure:
        exclude:
            - io.bluetape4k.aws.spring.s3.S3TransferAutoConfiguration

# Spring Cloud AWS가 S3Client/S3Template을 소유합니다. transfer 자동 설정의
# s3ObjectConverter bean 이름 충돌만 제외하고, S3 Resource 자동 구성은 활성화합니다.
