spring:
    cloud:
        aws:
            endpoint: ${AWS_ENDPOINT_URL:${testcontainers.floci.aws-endpoint:http://localhost:4566}}
            region:
                static: us-east-1
            credentials:
                access-key: noop
                secret-key: noop

# Spring Cloud AWS가 S3Client/S3Template을 소유하는 예제이므로
# bluetape4k S3 자동 설정의 converter 빈과 충돌하지 않도록 비활성화합니다.
bluetape4k:
    aws:
        s3:
            enabled: false
