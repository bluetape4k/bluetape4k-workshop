spring:
    aot:
        enabled: true  # AOT (Ahead Of Time) 컴파일 활성화
    r2dbc:
        pool:
            initial-size: 16
            max-size: 16
        url: r2dbc:h2:mem:///pocdb?options=DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;CASE_INSENSITIVE_IDENTIFIERS=TRUE
        username: sa
        password:

    # sql.init not used — ConnectionFactoryInitializer bean handles schema/data setup explicitly
    # sql:
