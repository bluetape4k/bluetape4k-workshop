spring:
  application:
    name: leader-job-safety-lab
  threads:
    virtual:
      enabled: true
  datasource:
    hikari:
      maximum-pool-size: 12
  transaction:
    default-timeout: 1s

management:
  datadog:
    metrics:
      export:
        enabled: false
  endpoint:
    configprops:
      show-values: never
    env:
      show-values: never

workshop:
  job-safety:
    region: region-a
    namespace-epoch: 1
    timeline-limit: 128
    fencing:
      lease-ttl: 5s
      renew-interval: 2s
    redis:
      uri: redis://localhost:6379
      command-timeout: 500ms
    outbox:
      claim-timeout: 30s
    lab:
      unsafe-enabled: false
    audit:
      transport: MEMORY
      queue-capacity: 32
      max-in-flight: 4
      max-attempts: 3
      attempt-timeout: 2s
      initial-backoff: 100ms
      max-backoff: 1s
      max-payload-bytes: 65536
      recent-history-limit: 32
      recent-history-byte-budget: 524288
      max-buffered-bytes: 75497472
      shutdown-timeout: 2s
