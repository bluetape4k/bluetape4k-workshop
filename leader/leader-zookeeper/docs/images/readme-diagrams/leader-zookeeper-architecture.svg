<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="610" viewBox="0 0 1000 610">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Architects+Daughter&amp;family=Comic+Mono&amp;display=swap');
      .t-title  { font-family: 'Architects Daughter', cursive; font-size: 19px; font-weight: bold; fill: #1E293B; }
      .t-sub    { font-family: 'Architects Daughter', cursive; font-size: 12px; fill: #64748B; }
      .t-band   { font-family: 'Architects Daughter', cursive; font-size: 10px; fill: #94A3B8; letter-spacing: 0.08em; }
      .t-card   { font-family: 'Architects Daughter', cursive; font-size: 13px; fill: #1E293B; }
      .t-detail { font-family: 'Comic Mono', monospace; font-size: 9.5px; fill: #475569; }
      .t-note   { font-family: 'Comic Mono', monospace; font-size: 9px; fill: #64748B; }
      .t-warn   { font-family: 'Comic Mono', monospace; font-size: 9.5px; fill: #B45309; }
    </style>
    <!-- Filled triangular arrowheads per skill spec: markerWidth=9 markerHeight=9 refX=8 refY=4.5 M1,1 L8,4.5 L1,8 Z -->
    <marker id="arr-blue"  markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M1,1 L8,4.5 L1,8 Z" fill="#93C5FD"/></marker>
    <marker id="arr-amber" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M1,1 L8,4.5 L1,8 Z" fill="#F59E0B"/></marker>
    <marker id="arr-teal"  markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M1,1 L8,4.5 L1,8 Z" fill="#14B8A6"/></marker>
  </defs>

  <!-- Canvas background -->
  <rect width="1000" height="610" rx="12" fill="#FAFBFC" stroke="#CBD5E1" stroke-width="1.5"/>

  <!-- Title -->
  <text x="500" y="36" text-anchor="middle" class="t-title">ZooKeeper-Based Distributed Leader Election</text>
  <text x="500" y="52" text-anchor="middle" class="t-sub">bluetape4k-leader-zookeeper · Apache Curator 5.9</text>

  <!-- ═══════════════════════════════════════════════════════════════ -->
  <!-- BAND 1: Application  y=62→158  (96 px tall)                   -->
  <!-- ═══════════════════════════════════════════════════════════════ -->
  <rect x="20" y="62" width="960" height="96" rx="7" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1"/>
  <!-- Band label sits at y=76 (14px from band top), cards start at y=84 -->
  <text x="36" y="76" class="t-band">APPLICATION</text>

  <!-- Instance 1  (center-x=166) -->
  <rect x="72"  y="84" width="188" height="64" rx="6" fill="white" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="166" y="105" text-anchor="middle" class="t-card">Instance 1</text>
  <text x="166" y="119" text-anchor="middle" class="t-detail">BlockingLeaderService</text>
  <text x="166" y="132" text-anchor="middle" class="t-detail">SuspendLeaderZkService</text>

  <!-- Instance 2  (center-x=500) -->
  <rect x="406" y="84" width="188" height="64" rx="6" fill="white" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="500" y="105" text-anchor="middle" class="t-card">Instance 2</text>
  <text x="500" y="119" text-anchor="middle" class="t-detail">GroupLeaderService</text>
  <text x="500" y="132" text-anchor="middle" class="t-detail">SuspendGroupLeaderService</text>

  <!-- Instance 3  (center-x=834) -->
  <rect x="740" y="84" width="188" height="64" rx="6" fill="white" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="834" y="105" text-anchor="middle" class="t-card">Instance 3</text>
  <text x="834" y="119" text-anchor="middle" class="t-detail">BlockingLeaderService</text>
  <text x="834" y="132" text-anchor="middle" class="t-detail">GroupLeaderService</text>

  <!-- Connectors: instance bottom (y=148) → CF top (y=186) — right-angled vertical paths -->
  <path d="M166,148 L166,186" stroke="#93C5FD" stroke-width="1.5" fill="none" marker-end="url(#arr-blue)"/>
  <path d="M500,148 L500,186" stroke="#93C5FD" stroke-width="1.5" fill="none" marker-end="url(#arr-blue)"/>
  <path d="M834,148 L834,186" stroke="#93C5FD" stroke-width="1.5" fill="none" marker-end="url(#arr-blue)"/>

  <!-- ═══════════════════════════════════════════════════════════════ -->
  <!-- BAND 2: Coordination  y=166→258  (92 px tall)                  -->
  <!-- ═══════════════════════════════════════════════════════════════ -->
  <rect x="20" y="166" width="960" height="92" rx="7" fill="#FFFBEB" stroke="#FDE68A" stroke-width="1"/>
  <!-- Band label y=180 (14px from band top=166), CF card starts at y=186 -->
  <text x="36" y="180" class="t-band">COORDINATION</text>

  <!-- CuratorFramework card: x=72, y=186, w=856, h=62 (ends at y=248) -->
  <rect x="72" y="186" width="856" height="62" rx="6" fill="white" stroke="#FCD34D" stroke-width="1.5"/>
  <text x="500" y="208" text-anchor="middle" class="t-card">CuratorFramework</text>
  <text x="500" y="222" text-anchor="middle" class="t-detail">ExponentialBackoffRetry(1000, 3)  ·  blockUntilConnected(10 s)  ·  destroyMethod="close"</text>
  <text x="500" y="237" text-anchor="middle" class="t-detail">ConnectionStateListener: SUSPENDED → LOST → RECONNECTED  |  basePath: /workshop/leader-zookeeper</text>

  <!-- Connectors: CF bottom center-left (x=310,y=248) → Single-Leader top (y=290) -->
  <!--             CF bottom center-right (x=690,y=248) → Group-Leader top  (y=290) -->
  <path d="M310,248 L310,290" stroke="#F59E0B" stroke-width="1.5" fill="none" marker-end="url(#arr-amber)"/>
  <path d="M690,248 L690,290" stroke="#F59E0B" stroke-width="1.5" fill="none" marker-end="url(#arr-amber)"/>

  <!-- ═══════════════════════════════════════════════════════════════ -->
  <!-- BAND 3: Lock Primitives  y=266→382  (116 px tall)              -->
  <!-- ═══════════════════════════════════════════════════════════════ -->
  <rect x="20" y="266" width="960" height="116" rx="7" fill="#F0FDFA" stroke="#99F6E4" stroke-width="1"/>
  <!-- Band label y=280 (14px from band top=266), cards start at y=286 -->
  <text x="36" y="280" class="t-band">LOCK PRIMITIVES</text>

  <!-- Single-Leader card: x=50, y=286, w=430, h=82 (center-x=265, ends at y=368) -->
  <rect x="50" y="286" width="430" height="82" rx="6" fill="white" stroke="#5EEAD4" stroke-width="1.5"/>
  <text x="265" y="306" text-anchor="middle" class="t-card">Single-Leader</text>
  <text x="265" y="320" text-anchor="middle" class="t-detail">ZooKeeperLeaderElector / ZooKeeperSuspendLeaderElector</text>
  <text x="265" y="334" text-anchor="middle" class="t-detail">InterProcessMutex  ·  exactly 1 exclusive holder</text>
  <text x="265" y="348" text-anchor="middle" class="t-detail">znodes: /single, /single-suspend</text>

  <!-- Group-Leader card: x=520, y=286, w=430, h=82 (center-x=735, ends at y=368) -->
  <rect x="520" y="286" width="430" height="82" rx="6" fill="white" stroke="#5EEAD4" stroke-width="1.5"/>
  <text x="735" y="306" text-anchor="middle" class="t-card">Group-Leader</text>
  <text x="735" y="320" text-anchor="middle" class="t-detail">ZooKeeperLeaderGroupElector / ZooKeeperSuspendLeaderGroupElector</text>
  <text x="735" y="334" text-anchor="middle" class="t-detail">InterProcessSemaphoreV2  ·  up to maxLeaders=N holders</text>
  <text x="735" y="348" text-anchor="middle" class="t-detail">znodes: /group, /group-suspend</text>

  <!-- Connectors: lock bottom (y=368) → ZK cylinder top ellipse (y=420) -->
  <path d="M265,368 L265,420" stroke="#14B8A6" stroke-width="1.5" fill="none" marker-end="url(#arr-teal)"/>
  <path d="M735,368 L735,420" stroke="#14B8A6" stroke-width="1.5" fill="none" marker-end="url(#arr-teal)"/>

  <!-- ═══════════════════════════════════════════════════════════════ -->
  <!-- BAND 4: ZooKeeper Ensemble  y=390→530  (140 px tall)           -->
  <!-- ═══════════════════════════════════════════════════════════════ -->
  <rect x="20" y="390" width="960" height="140" rx="7" fill="#F5F3FF" stroke="#C4B5FD" stroke-width="1"/>
  <!-- Band label y=404 (14px from band top=390) -->
  <text x="36" y="404" class="t-band">ZOOKEEPER ENSEMBLE</text>

  <!-- Cylinder: top ellipse cy=428, body y=428→498, bottom ellipse cy=498 -->
  <!-- Body rect (no stroke — covered by ellipses) -->
  <rect x="220" y="428" width="560" height="70" fill="#EDE9FE" stroke="none"/>
  <!-- Side lines -->
  <line x1="220" y1="428" x2="220" y2="498" stroke="#A78BFA" stroke-width="1.5"/>
  <line x1="780" y1="428" x2="780" y2="498" stroke="#A78BFA" stroke-width="1.5"/>
  <!-- Top ellipse (drawn after body so it overlaps the top edge cleanly) -->
  <ellipse cx="500" cy="428" rx="280" ry="22" fill="#EDE9FE" stroke="#A78BFA" stroke-width="1.5"/>
  <!-- Bottom ellipse -->
  <ellipse cx="500" cy="498" rx="280" ry="22" fill="#D8B4FE" stroke="#A78BFA" stroke-width="1.5"/>

  <!-- ZK cylinder labels -->
  <text x="500" y="453" text-anchor="middle" class="t-card">ZooKeeper Ensemble</text>
  <text x="500" y="468" text-anchor="middle" class="t-detail">Ephemeral znodes  ·  Session-bound leadership</text>
  <text x="500" y="483" text-anchor="middle" class="t-detail">On session expiry: znodes deleted → re-election triggered automatically</text>

  <!-- R16 warning pill -->
  <rect x="160" y="512" width="680" height="24" rx="5" fill="#FEF3C7" stroke="#FDE68A" stroke-width="1"/>
  <text x="500" y="528" text-anchor="middle" class="t-warn">⚠  R16: No TTL — autoExtend=true is silently ignored. Tune sessionTimeoutMs for acceptable failover latency.</text>

  <!-- ═══════════════════════════════════════════════════════════════ -->
  <!-- Legend                                                          -->
  <!-- ═══════════════════════════════════════════════════════════════ -->
  <text x="40"  y="564" class="t-note">Leader path:</text>
  <line x1="115" y1="560" x2="158" y2="560" stroke="#93C5FD" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <text x="163" y="564" class="t-note">instance→curator</text>
  <line x1="278" y1="560" x2="321" y2="560" stroke="#F59E0B" stroke-width="1.5" marker-end="url(#arr-amber)"/>
  <text x="326" y="564" class="t-note">curator→lock</text>
  <line x1="415" y1="560" x2="458" y2="560" stroke="#14B8A6" stroke-width="1.5" marker-end="url(#arr-teal)"/>
  <text x="463" y="564" class="t-note">lock→zookeeper</text>
  <text x="590" y="564" class="t-note">runIfLeader() → result (elected)  |  null (skipped — not leader)</text>

  <!-- Footer -->
  <text x="500" y="592" text-anchor="middle" class="t-note">Spring Boot 4.x · Java 21 · Kotlin 2.3 · bluetape4k-leader-zookeeper 0.2.1</text>
</svg>
