  push:
    branches: [ develop, main ]
    paths:
      - 'commerce/**'
      - 'operations/**'
      - 'optimization/**'
      - 'profiles/high-contention/**'
      - 'scripts/high-contention/**'
      - 'exposed/webflux-r2dbc/**'
      - 'exposed/javers-approval-workflow/**'
      - 'exposed/javers-persistence-audit/**'
      - 'spring-data/r2dbc-webflux-exposed/**'
      - 'spring-boot/cache-caffeine/**'
      - 'spring-boot/cache-redis/**'
      - 'spring-boot/resilience4j-coroutines/**'
      - 'spring-boot/text-moderation-api/**'
      - 'json/jackson-examples/**'
      - 'json/jsonview-examples/**'
      - 'graph/event-lineage/**'
      - 'graph/io-pipeline/**'
      - 'graph/recommendation/**'
      - 'graph/knowledge-graph/**'
      - 'graph/social-network/**'
      - 'image-processing/ocr-api/**'
      - 'image-processing/profile-image-moderation/**'
      - 'image-processing/barcode-api/**'
      - 'ktor/exposed-rest/**'
      - 'aws/ktor-dynamodb/**'
      - 'aws/cloudwatch-imds-observability/**'
      - 'aws/eventbridge-scheduler/**'
      - 'aws/sqs-sns-coroutines/**'
      - 'aws/kinesis-coroutines/**'
      - 'aws/storage-abstraction/**'
      - 'aws/s3-spring-cloud/**'
      - 'aws/s3-vectors-access-grants/**'
      - 'aws/bedrock-converse/**'
      - 'aws/settings-boundary/**'
      - 'kotlin/flow-extensions-event-aggregation/**'
      - 'kotlin/flow-extensions-metrics-sampling/**'
      - 'kotlin/flow-extensions-search-pipeline/**'
      - 'leader/backend-comparison-lab/**'
      - 'leader/k8s-lease-micrometer/**'
      - 'leader/job-safety-lab/**'
      - 'leader/tenant-scheduler/**'
      - 'messaging/kafka/**'
      - 'messaging/kafka-outbox-fallback/**'
      - 'messaging/kafka-multi-broker-failover/**'
      - 'spring-modulith/module-boundaries/**'
      - 'shared/**'
      - 'buildSrc/**'
      - 'build-logic/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'settings.gradle.kts'
      - 'docs/images/readme-diagrams/**'
      - 'scripts/validate-readme-diagram-qa.mjs'
      - 'scripts/validate-high-contention-readme.mjs'
      - 'scripts/smoke-validate.sh'
      - '.github/workflows/Examples.yml'
  # Stacked child PRs may target a non-default base; paths still bound the workload.
  pull_request:
    paths:
      - 'commerce/**'
      - 'operations/**'
      - 'optimization/**'
      - 'profiles/high-contention/**'
      - 'scripts/high-contention/**'
      - 'exposed/webflux-r2dbc/**'
      - 'exposed/javers-approval-workflow/**'
      - 'exposed/javers-persistence-audit/**'
      - 'spring-data/r2dbc-webflux-exposed/**'
      - 'spring-boot/cache-caffeine/**'
      - 'spring-boot/cache-redis/**'
      - 'spring-boot/resilience4j-coroutines/**'
      - 'spring-boot/text-moderation-api/**'
      - 'json/jackson-examples/**'
      - 'json/jsonview-examples/**'
      - 'graph/event-lineage/**'
      - 'graph/io-pipeline/**'
      - 'graph/recommendation/**'
      - 'graph/knowledge-graph/**'
      - 'graph/social-network/**'
      - 'image-processing/ocr-api/**'
      - 'image-processing/profile-image-moderation/**'
      - 'image-processing/barcode-api/**'
      - 'ktor/exposed-rest/**'
      - 'aws/ktor-dynamodb/**'
      - 'aws/cloudwatch-imds-observability/**'
      - 'aws/eventbridge-scheduler/**'
      - 'aws/sqs-sns-coroutines/**'
      - 'aws/kinesis-coroutines/**'
      - 'aws/storage-abstraction/**'
      - 'aws/s3-spring-cloud/**'
      - 'aws/s3-vectors-access-grants/**'
      - 'aws/bedrock-converse/**'
      - 'aws/settings-boundary/**'
      - 'kotlin/flow-extensions-event-aggregation/**'
      - 'kotlin/flow-extensions-metrics-sampling/**'
      - 'kotlin/flow-extensions-search-pipeline/**'
      - 'leader/backend-comparison-lab/**'
      - 'leader/k8s-lease-micrometer/**'
      - 'leader/job-safety-lab/**'
      - 'leader/tenant-scheduler/**'
      - 'messaging/kafka/**'
      - 'messaging/kafka-outbox-fallback/**'
      - 'messaging/kafka-multi-broker-failover/**'
      - 'spring-modulith/module-boundaries/**'
      - 'shared/**'
      - 'buildSrc/**'
      - 'build-logic/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'settings.gradle.kts'
      - 'docs/images/readme-diagrams/**'
      - 'scripts/validate-readme-diagram-qa.mjs'
      - 'scripts/validate-high-contention-readme.mjs'
      - 'scripts/smoke-validate.sh'
      - '.github/workflows/Examples.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  JAVA_VERSION: '25'
  JAVA_DISTRIBUTION: 'temurin'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  changes:
    name: Detect Example Changes
    runs-on: ubuntu-latest
    outputs:
      diagram: ${{ steps.paths.outputs.diagram }}
      examples: ${{ steps.paths.outputs.examples }}
      high_contention: ${{ steps.paths.outputs.high_contention }}
      gradle: ${{ steps.paths.outputs.gradle }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Classify changed paths
        id: paths
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          diagram=false
          examples=false
          high_contention=false
          gradle=false

          if [[ "$EVENT_NAME" == "schedule" || "$EVENT_NAME" == "workflow_dispatch" ]]; then
            diagram=true
            examples=true
            high_contention=true
            gradle=true
          else
            if [[ "$EVENT_NAME" == "pull_request" ]]; then
              range="$BASE_SHA...$HEAD_SHA"
            elif [[ -n "$BEFORE_SHA" && ! "$BEFORE_SHA" =~ ^0+$ ]]; then
              range="$BEFORE_SHA...$HEAD_SHA"
            else
              range="$HEAD_SHA^...$HEAD_SHA"
            fi

            while IFS= read -r path; do
              case "$path" in
                .github/workflows/Examples.yml)
                  diagram=true
                  examples=true
                  high_contention=true
                  gradle=true
                  ;;
                *.md|docs/**)
                  diagram=true
                  ;;
                scripts/validate-readme-diagram-qa.mjs)
                  diagram=true
                  ;;
                scripts/validate-high-contention-readme.mjs)
                  high_contention=true
                  gradle=true
                  ;;
                scripts/smoke-validate.sh)
                  diagram=true
                  high_contention=true
                  gradle=true
                  ;;
                profiles/high-contention/**|scripts/high-contention/**)
                  high_contention=true
                  gradle=true
                  ;;
                commerce/**|operations/**)
                  examples=true
                  high_contention=true
                  gradle=true
                  ;;
                *)
                  examples=true
                  gradle=true
                  ;;
              esac
            done < <(git diff --name-only "$range")
          fi

          {
            echo "diagram=$diagram"
            echo "examples=$examples"
            echo "high_contention=$high_contention"
            echo "gradle=$gradle"
          } | tee -a "$GITHUB_OUTPUT"

  validate-wrapper:
    name: Validate Gradle Wrapper
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: changes
    if: needs.changes.outputs.gradle == 'true'
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: gradle/actions/wrapper-validation@v6.3.0

  smoke-examples:
    name: Smoke Examples (H2/default)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs:
      - changes
      - validate-wrapper
    if: >-
      always() &&
      needs.changes.outputs.examples == 'true' &&
      needs.validate-wrapper.result == 'success'
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-java@v6
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}

      - uses: gradle/actions/setup-gradle@v6.3.0
        with:
          gradle-version: wrapper
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      # Representative non-container examples:
      # - spring-data-r2dbc-webflux-exposed: data access + Exposed consumer path
      # - exposed-javers-approval-workflow: in-memory JaVers approval decision path
      # - spring-boot-cache-caffeine: local cache path
      # - spring-boot-resilience4j-coroutines: resilience path
      # - aws-eventbridge-scheduler: local EventBridge + Scheduler boundary path
      # - aws-bedrock-converse: credential-free Bedrock Converse/ConverseStream Flow contract
      # - aws-settings-boundary: credential-free Secrets Manager/secure SSM settings contract
      # - leader-backend-comparison-lab: passive diagnostics plus opt-in health/Micrometer contract without external backends
      # - jackson/jsonview examples: serialization path
      # - operations-job-console-core: framework-neutral state machine and queue projections
      # - leader-job-safety-lab: deterministic safety scenarios without container-backed integration tags
      # - commerce-event-sourced-promotion-voucher-campaign: container-free domain and web contract tests
      # - commerce-usage-metering-billing-ledger: container-free domain and architecture contracts
      # - commerce-usage-metering-billing-event-sourcing: container-free reducer, hash, upcast, and architecture contracts
      # - commerce-usage-billing-*: five independently deployable service contracts and Kafka/PostgreSQL composition proof
      - name: Run H2/default and credential-free observability examples
        run: >-
          ./gradlew
          -x detekt
          -x collectReachabilityMetadata
          :exposed-javers-approval-workflow:test
          :spring-data-r2dbc-webflux-exposed:test
          :spring-boot-cache-caffeine:test
          :spring-boot-resilience4j-coroutines:test
          :spring-boot-text-moderation-api:test
          :jackson-examples:test
          :jsonview-examples:test
          :graph-event-lineage:test
          :graph-io-pipeline:test
          :graph-recommendation:test
          :graph-knowledge-graph:test
          :graph-social-network:test
          :image-processing-ocr-api:test
          :image-processing-profile-image-moderation:test
          :image-processing-barcode-api:test
          :aws-cloudwatch-imds-observability:test
          :aws-eventbridge-scheduler:test
          :aws-kinesis-coroutines:test
          :aws-s3-vectors-access-grants:test
          :aws-bedrock-converse:test
          :aws-settings-boundary:test
          :kotlin-flow-extensions-event-aggregation:test
          :kotlin-flow-extensions-metrics-sampling:test
          :kotlin-flow-extensions-search-pipeline:test
          :leader-backend-comparison-lab:test
          :leader-k8s-lease-micrometer:test
          :leader-job-safety-lab:test
          :commerce-shared:test
          :commerce-event-sourced-promotion-voucher-campaign:test
          :commerce-usage-metering-billing-ledger:test
          :commerce-usage-metering-billing-event-sourcing:test
          :commerce-usage-billing-meter-service:test
          :commerce-usage-billing-usage-service:test
          :commerce-usage-billing-billing-service:test
          :commerce-usage-billing-invoice-service:test
          :commerce-usage-billing-query-service:test
          :commerce-usage-billing-microservices-composition-tests:test
          :leader-tenant-scheduler:test
          :operations-job-console-core:test
          :spring-modulith-module-boundaries:test
          --continue
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.daemon=false"

      - name: Upload smoke example test results
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: smoke-example-test-results
          path: |
            exposed/javers-approval-workflow/build/test-results/test/*.xml
            exposed/javers-approval-workflow/build/reports/tests/test/
            spring-data/r2dbc-webflux-exposed/build/test-results/test/*.xml
            spring-data/r2dbc-webflux-exposed/build/reports/tests/test/
            spring-boot/cache-caffeine/build/test-results/test/*.xml
            spring-boot/cache-caffeine/build/reports/tests/test/
            spring-boot/resilience4j-coroutines/build/test-results/test/*.xml
            spring-boot/resilience4j-coroutines/build/reports/tests/test/
            spring-boot/text-moderation-api/build/test-results/test/*.xml
            spring-boot/text-moderation-api/build/reports/tests/test/
            json/jackson-examples/build/test-results/test/*.xml
            json/jackson-examples/build/reports/tests/test/
            json/jsonview-examples/build/test-results/test/*.xml
            json/jsonview-examples/build/reports/tests/test/
            graph/event-lineage/build/test-results/test/*.xml
            graph/event-lineage/build/reports/tests/test/
            graph/io-pipeline/build/test-results/test/*.xml
            graph/io-pipeline/build/reports/tests/test/
            graph/recommendation/build/test-results/test/*.xml
            graph/recommendation/build/reports/tests/test/
            graph/knowledge-graph/build/test-results/test/*.xml
            graph/knowledge-graph/build/reports/tests/test/
            graph/social-network/build/test-results/test/*.xml
            graph/social-network/build/reports/tests/test/
            image-processing/ocr-api/build/test-results/test/*.xml
            image-processing/ocr-api/build/reports/tests/test/
            image-processing/profile-image-moderation/build/test-results/test/*.xml
            image-processing/profile-image-moderation/build/reports/tests/test/
            image-processing/barcode-api/build/test-results/test/*.xml
            image-processing/barcode-api/build/reports/tests/test/
            commerce/shared/build/test-results/test/*.xml
            commerce/shared/build/reports/tests/test/
            aws/cloudwatch-imds-observability/build/test-results/test/*.xml
            aws/cloudwatch-imds-observability/build/reports/tests/test/
            aws/eventbridge-scheduler/build/test-results/test/*.xml
            aws/eventbridge-scheduler/build/reports/tests/test/
            aws/kinesis-coroutines/build/test-results/test/*.xml
            aws/kinesis-coroutines/build/reports/tests/test/
            aws/s3-vectors-access-grants/build/test-results/test/*.xml
            aws/s3-vectors-access-grants/build/reports/tests/test/
            aws/bedrock-converse/build/test-results/test/*.xml
            aws/bedrock-converse/build/reports/tests/test/
            aws/settings-boundary/build/test-results/test/*.xml
            aws/settings-boundary/build/reports/tests/test/
            kotlin/flow-extensions-event-aggregation/build/test-results/test/*.xml
            kotlin/flow-extensions-event-aggregation/build/reports/tests/test/
            kotlin/flow-extensions-metrics-sampling/build/test-results/test/*.xml
            kotlin/flow-extensions-metrics-sampling/build/reports/tests/test/
            kotlin/flow-extensions-search-pipeline/build/test-results/test/*.xml
            kotlin/flow-extensions-search-pipeline/build/reports/tests/test/
            leader/backend-comparison-lab/build/test-results/test/*.xml
            leader/backend-comparison-lab/build/reports/tests/test/
            leader/k8s-lease-micrometer/build/test-results/test/*.xml
            leader/k8s-lease-micrometer/build/reports/tests/test/
            leader/job-safety-lab/build/test-results/test/*.xml
            leader/job-safety-lab/build/reports/tests/test/
            commerce/usage-metering-billing-ledger/build/test-results/test/*.xml
            commerce/usage-metering-billing-ledger/build/reports/tests/test/
            commerce/usage-metering-billing-event-sourcing/build/test-results/test/*.xml
            commerce/usage-metering-billing-event-sourcing/build/reports/tests/test/
            leader/tenant-scheduler/build/test-results/test/*.xml
            leader/tenant-scheduler/build/reports/tests/test/
            operations/job-console-core/build/test-results/test/*.xml
            operations/job-console-core/build/reports/tests/test/
            spring-modulith/module-boundaries/build/test-results/test/*.xml
            spring-modulith/module-boundaries/build/reports/tests/test/
          retention-days: 7

  diagram-qa:
    name: Diagram QA
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: changes
    if: needs.changes.outputs.diagram == 'true'
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Install diagram QA tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libxml2-utils
          python -m pip install --user cairosvg
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Run README diagram QA
        run: ./scripts/smoke-validate.sh diagram-qa

  container-examples:
    name: Container Examples (sequential)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs:
      - changes
      - validate-wrapper
    if: >-
      always() &&
      needs.changes.outputs.examples == 'true' &&
      needs.validate-wrapper.result == 'success'
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-java@v6
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}

      - uses: gradle/actions/setup-gradle@v6.3.0
        with:
          gradle-version: wrapper
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      # Representative Testcontainers examples run in one sequential lane:
      # - exposed-webflux-r2dbc: PostgreSQL-backed Exposed R2DBC consumer path
      # - exposed-javers-persistence-audit: Redis-backed JaVers audit history
      # - ktor-exposed-rest: PostgreSQL-backed Ktor + Exposed transaction path
      # - aws-ktor-dynamodb: local AWS emulator-backed Ktor + DynamoDB path
      # - aws-s3-spring-cloud: Floci-backed Spring Cloud AWS S3 path
      # - aws-sqs-sns-coroutines: Floci-backed SQS/SNS coroutine messaging path
      # - aws-storage-abstraction: Floci-backed S3 storage abstraction path
      # - graph-event-lineage: Neo4j-backed graph lineage audit path
      # - graph-recommendation: Neo4j/Memgraph-backed recommendation path
      # - graph-knowledge-graph: Neo4j/Memgraph-backed knowledge graph path
      # - graph-social-network: Neo4j/Memgraph-backed social graph path
      # - spring-boot-cache-redis: Redis-backed cache path
      # - messaging-kafka: Kafka-backed messaging path
      # - messaging-kafka-outbox-fallback: PostgreSQL + Kafka fallback relay path
      # - messaging-kafka-multi-broker-failover: three-broker KRaft leader/coordinator recovery path
      # - optimization-planning-contracts: PostgreSQL planning inbox/outbox on Java 25
      # - optimization-field-service-dispatch: PostgreSQL Field Service dispatch and replay path on Java 25
      # - optimization-last-mile-routing: PostgreSQL fixed-matrix routing, callback/outbox, and browser projection on Java 25
      # - optimization-warehouse-allocation: PostgreSQL-authoritative stock reservation and deterministic pick-wave path on Java 25
      # - optimization-shift-coverage: PostgreSQL shift coverage, swap, inbox/outbox and lifecycle path on Java 25
      # - optimization-clinic-appointment-solver: embedded Timefold Solver clinic/resource proposal path on Java 25
      # - commerce-order-lifecycle-fulfillment: PostgreSQL durable lifecycle and replay path
      # - commerce-reservation-control-plane: PostgreSQL-authoritative reservation and advisory Redis path
      # - commerce-event-sourced-promotion-voucher-campaign: PostgreSQL append, projection, rebuild, and recovery path
      # - commerce-promotion-voucher-campaign: PostgreSQL-authoritative capacity with advisory Redis admission
      # - commerce-concert-ticket-flash-sale: PostgreSQL-authoritative inventory with Redis waiting-room admission
      # - operations-job-console-*: shared PostgreSQL/Redis contract plus live Spring MVC and Ktor adapters
      # - commerce-pre-generated-voucher-pool: PostgreSQL-authoritative pre-generated voucher allocation and recovery
      # - leader-job-safety-lab: real Redis fencing takeover plus PostgreSQL stale-writer rejection
      # - commerce-usage-metering-billing-ledger: PostgreSQL-authoritative metering, close, invoice, and reconciliation
      # - commerce-usage-metering-billing-event-sourcing: PostgreSQL event store, replay, fenced projections, and correction
      # - commerce-usage-billing-microservices: five PostgreSQL-owned services connected through Kafka outbox/inbox delivery
      - name: Run container-backed examples
        run: >-
          ./gradlew
          -x detekt
          -x collectReachabilityMetadata
          :exposed-webflux-r2dbc:test
          :exposed-javers-persistence-audit:test
          :ktor-exposed-rest:test
          :aws-ktor-dynamodb:test
          :aws-s3-spring-cloud:test
          :aws-sqs-sns-coroutines:test
          :aws-storage-abstraction:test
          :graph-event-lineage:integrationTest
          :graph-recommendation:integrationTest
          :graph-knowledge-graph:integrationTest
          :graph-social-network:integrationTest
          :spring-boot-cache-redis:test
          :messaging-kafka:test
          :messaging-kafka-outbox-fallback:test
          :optimization-planning-contracts:test
          :optimization-field-service-dispatch:test
          :optimization-last-mile-routing:test
          :optimization-warehouse-allocation:test
          :optimization-shift-coverage:test
          :optimization-clinic-appointment-solver:test
          :commerce-order-lifecycle-fulfillment:test
          :commerce-reservation-control-plane:test
          :commerce-event-sourced-promotion-voucher-campaign:integrationTest
          :commerce-event-sourced-promotion-voucher-campaign:koverXmlReport
          :commerce-promotion-voucher-campaign:test
          :commerce-concert-ticket-flash-sale:test
          :operations-job-console-core:integrationTest
          :operations-job-console-spring:integrationTest
          :operations-job-console-ktor:integrationTest
          :commerce-pre-generated-voucher-pool:test
          :commerce-pre-generated-voucher-pool:koverXmlReport
          :leader-job-safety-lab:integrationTest
          :commerce-usage-metering-billing-ledger:integrationTest
          :commerce-usage-metering-billing-ledger:koverXmlReport
          :commerce-usage-metering-billing-event-sourcing:integrationTest
          :commerce-usage-metering-billing-event-sourcing:koverXmlReport
          :commerce-usage-billing-meter-service:integrationTest
          :commerce-usage-billing-usage-service:integrationTest
          :commerce-usage-billing-billing-service:integrationTest
          :commerce-usage-billing-invoice-service:integrationTest
          :commerce-usage-billing-query-service:integrationTest
          :commerce-usage-billing-microservices-composition-tests:integrationTest
          :commerce-usage-billing-microservices-composition-tests:koverXmlReport
          --continue
          --max-workers=1
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.daemon=false"
          TESTCONTAINERS_RYUK_DISABLED: "true"
          DOCKER_HOST: "unix:///var/run/docker.sock"

      - name: Run Kafka multi-broker failover reference
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.daemon=false"
          TESTCONTAINERS_RYUK_DISABLED: "true"
          DOCKER_HOST: "unix:///var/run/docker.sock"
          KAFKA_FAILOVER_RUN_ID: examples-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          report_root="messaging/kafka-multi-broker-failover/build/reports/kafka-failover"
          mkdir -p "$report_root/$KAFKA_FAILOVER_RUN_ID"
          ./scripts/with-kafka-failover-lock.sh -- ./gradlew \
            :messaging-kafka-multi-broker-failover:test \
            --tests '*KafkaMultiBrokerFailoverIntegrationTest' \
            --max-workers=1 --console=plain \
            > >(tee "$report_root/$KAFKA_FAILOVER_RUN_ID/gradle.stdout.log") \
            2> >(tee "$report_root/$KAFKA_FAILOVER_RUN_ID/gradle.stderr.log" >&2)

      - name: Verify Kafka failover reports
        if: always()
        env:
          KAFKA_FAILOVER_RUN_ID: examples-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          test -n "$(find messaging/kafka-multi-broker-failover/build/test-results/test -name '*.xml' -print -quit)"
          test -n "$(find messaging/kafka-multi-broker-failover/build/reports/tests/test -name '*.html' -print -quit)"
          test -s "messaging/kafka-multi-broker-failover/build/reports/kafka-failover/$KAFKA_FAILOVER_RUN_ID/evidence.jsonl"

      - name: Sanitize Kafka failover artifacts
