  high-contention-correctness:
    name: High-contention CI correctness
    runs-on: ubuntu-latest
    needs:
      - changes
      - validate-wrapper
    if: >-
      always() &&
      needs.changes.outputs.high_contention == 'true' &&
      needs.validate-wrapper.result == 'success'
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: ${{ env.JAVA_DISTRIBUTION }}
      - uses: gradle/actions/setup-gradle@v6.3.0
        with:
          gradle-version: wrapper
          cache-read-only: true
      - name: Validate high-contention contract and runbooks
        run: ./scripts/smoke-validate.sh high-contention-contract
      - name: Run the CI correctness matrix
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx2g -Dorg.gradle.daemon=false"
          TESTCONTAINERS_RYUK_DISABLED: "true"
          DOCKER_HOST: "unix:///var/run/docker.sock"
        run: >-
          ./gradlew
          -x detekt
          -x collectReachabilityMetadata
          highContentionCi
          -PhighContentionRunId=examples-${{ github.run_id }}-${{ github.run_attempt }}
          -Pkotlin.compiler.execution.strategy=in-process
          --max-workers=1
          --stacktrace
      - name: Validate and stage bounded evidence
        if: always()
        run: |
          mkdir -p build/high-contention-upload-stage
          node scripts/high-contention/select-upload.mjs \
            build/reports/high-contention/examples-${{ github.run_id }}-${{ github.run_attempt }} \
            build/reports/high-contention-upload/examples-${{ github.run_id }}-${{ github.run_attempt }} \
            build/high-contention-upload-stage/examples-${{ github.run_id }}-${{ github.run_attempt }} \
            ci-correctness \
            examples-${{ github.run_id }}-${{ github.run_attempt }} \
            ${{ github.run_id }}-${{ github.run_attempt }}
      - name: Upload bounded high-contention evidence
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: high-contention-ci-correctness-examples-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/high-contention-upload-stage/examples-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 7

  examples-status:
    name: Examples Status
    runs-on: ubuntu-latest
    needs:
      - changes
      - validate-wrapper
      - diagram-qa
      - smoke-examples
      - container-examples
      - high-contention-correctness
    if: always()
    steps:
      - name: Check Examples result
        env:
          RESULTS: ${{ join(needs.*.result, ',') }}
        run: |
          echo "Examples results: $RESULTS"
          if echo "$RESULTS" | grep -qE "failure|cancelled"; then
            echo "Examples failed"
            exit 1
          fi
          echo "Examples passed"
