name: CI

on:
  push:
    branches: [ develop, main ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'scripts/**'
      - '.gitignore'
      - '.editorconfig'
      - '.gitleaks.toml'
      - 'CHANGELOG.md'
      - 'LICENSE'
      - '.omc/**'
      - '.claude/**'
  pull_request:
    branches: [ develop, main ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'scripts/**'
      - '.gitignore'
      - '.editorconfig'
      - '.gitleaks.toml'
      - 'CHANGELOG.md'
      - 'LICENSE'
      - '.omc/**'
      - '.claude/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  JAVA_VERSIONS: |-
    21
    25
  JAVA_DISTRIBUTION: 'temurin'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  validate-wrapper:
    name: Validate Gradle Wrapper
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: gradle/actions/wrapper-validation@v6.3.0

  build:
    name: Build (compile only)
    runs-on: ubuntu-latest
    needs: validate-wrapper
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          java-version: ${{ env.JAVA_VERSIONS }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
      - uses: gradle/actions/setup-gradle@v6.3.0
        with:
          gradle-version: wrapper
          cache-read-only: ${{ github.event_name == 'pull_request' }}
          gradle-home-cache-excludes: |
            native-build-tools
      - name: Repair GraalVM reachability metadata cache
        run: ./scripts/repair-graalvm-metadata-cache.sh
      - name: Validate GraalVM metadata cache repair
        run: node --test scripts/graalvm-metadata-cache.test.mjs
      - name: Build (compile only)
        # Keep native metadata extraction deterministic: shared services use one cache path across projects.
        run: ./gradlew build -x detekt -x test -x integrationTest -x stressTest -x migrationCompatibilityTest --no-parallel --max-workers=1 --continue
        env:
          JAVA_HOME: ${{ env.JAVA_HOME_21_X64 }}
          GRADLE_OPTS: "-Dorg.gradle.daemon=false"

  ci-status:
    name: CI Status
    runs-on: ubuntu-latest
    needs:
      - build
    if: always()
    steps:
      - name: Check all jobs
        env:
          RESULTS: ${{ join(needs.*.result, ',') }}
        run: |
          echo "Job results: $RESULTS"
          if echo "$RESULTS" | grep -qE "failure|cancelled"; then
            echo "CI failed"
            exit 1
          fi
          echo "CI passed"
