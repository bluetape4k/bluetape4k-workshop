spring:
  application:
    name: pre-generated-voucher-pool
  datasource:
    url: ${VOUCHER_POOL_DATABASE_URL:jdbc:postgresql://localhost:5432/voucher_pool}
    username: ${VOUCHER_POOL_DATABASE_USERNAME:vouchers}
    password: ${VOUCHER_POOL_DATABASE_PASSWORD:vouchers}
    hikari:
      pool-name: pre-generated-voucher-pool
      maximum-pool-size: 16
      minimum-idle: 4
      connection-timeout: 2000
      validation-timeout: 1000
      idle-timeout: 600000
      max-lifetime: 1800000
      keepalive-time: 120000
  threads:
    virtual:
      enabled: true
  lifecycle:
    timeout-per-shutdown-phase: 30s

server:
  address: ${VOUCHER_POOL_SERVER_ADDRESS:127.0.0.1}
  port: ${VOUCHER_POOL_SERVER_PORT:8080}
  shutdown: graceful

management:
  server:
    address: 127.0.0.1
    port: ${VOUCHER_POOL_MANAGEMENT_PORT:8081}
  endpoints:
    web:
      exposure:
        include: health,prometheus

workshop:
  voucher-pool:
    database:
      hikari-maximum-pool-size: 16
      connection-acquisition-timeout: 2s
      foreground:
        capacity: 12
        permit-wait: 250ms
        transaction-timeout: 5s
        lock-timeout: 5s
      worker:
        capacity: 1
        permit-wait: 1s
        transaction-timeout: 10s
        lock-timeout: 10s
      sse:
        capacity: 3
        permit-wait: 1s
        transaction-timeout: 5s
        lock-timeout: 5s
