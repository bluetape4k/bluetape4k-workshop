<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="810" viewBox="0 0 1280 810" role="img" aria-labelledby="title desc">
  <title id="title">Cache benchmark read throughput on 2026-07-27</title>
  <desc id="desc">Horizontal logarithmic bar chart comparing eight cache read operations in operations per second. Near Cache and Caffeine are fastest, followed by No Cache. Redis-backed warmed hits are around four thousand operations per second, and a forced read-through miss is about seven hundred eighteen operations per second.</desc>
  <style>
    .heading { font-family: "Architects Daughter"; }
    .body { font-family: "Comic Mono"; }
  </style>
  <rect width="1280" height="810" fill="#f8fafc"/>
  <text class="heading" x="64" y="62" fill="#0f172a" font-size="30">Cache read throughput</text>
  <text class="body" x="64" y="96" fill="#475569" font-size="17">Corrected issue #585 contracts | 2026-07-27 | ops/s | logarithmic scale</text>
  <text class="body" x="64" y="126" fill="#64748b" font-size="15">Higher is better for the same operation. Parameterized rows are arithmetic means across productId 1, 100, and 500.</text>

  <g stroke="#cbd5e1" stroke-width="1">
    <line x1="380" y1="156" x2="380" y2="706"/>
    <line x1="532" y1="156" x2="532" y2="706"/>
    <line x1="684" y1="156" x2="684" y2="706"/>
    <line x1="836" y1="156" x2="836" y2="706"/>
    <line x1="988" y1="156" x2="988" y2="706"/>
    <line x1="1140" y1="156" x2="1140" y2="706"/>
  </g>

  <g class="body" fill="#64748b" font-size="14" text-anchor="middle">
    <text x="380" y="730">100</text>
    <text x="532" y="730">1K</text>
    <text x="684" y="730">10K</text>
    <text x="836" y="730">100K</text>
    <text x="988" y="730">1M</text>
    <text x="1140" y="730">10M ops/s</text>
  </g>

  <g class="body" fill="#0f172a" font-size="16" text-anchor="end">
    <text x="352" y="192">Near Cache warmed hit</text>
    <text x="352" y="256">Caffeine warmed hit</text>
    <text x="352" y="320">No Cache repository read</text>
    <text x="352" y="384">Write-Behind warmed hit</text>
    <text x="352" y="448">Write-Through warmed hit</text>
    <text x="352" y="512">Read-Through warmed hit</text>
    <text x="352" y="576">Redis Cache warmed hit</text>
    <text x="352" y="640">Read-Through forced miss</text>
  </g>

  <rect x="380" y="171" width="686.6" height="30" rx="7" fill="#0f766e"/>
  <rect x="380" y="235" width="681.8" height="30" rx="7" fill="#0f766e"/>
  <rect x="380" y="299" width="532.9" height="30" rx="7" fill="#64748b"/>
  <rect x="380" y="363" width="246.6" height="30" rx="7" fill="#2563eb"/>
  <rect x="380" y="427" width="245.1" height="30" rx="7" fill="#2563eb"/>
  <rect x="380" y="491" width="245.0" height="30" rx="7" fill="#2563eb"/>
  <rect x="380" y="555" width="244.0" height="30" rx="7" fill="#2563eb"/>
  <rect x="380" y="619" width="130.2" height="30" rx="7" fill="#d97706"/>

  <g class="body" fill="#0f172a" font-size="15" font-weight="700">
    <text x="1077" y="192">3,287,505.143</text>
    <text x="1072" y="256">3,058,547.710</text>
    <text x="923" y="320">320,764.485</text>
    <text x="637" y="384">4,194.350</text>
    <text x="635" y="448">4,099.116</text>
    <text x="635" y="512">4,090.132</text>
    <text x="634" y="576">4,030.965</text>
    <text x="520" y="640">718.246</text>
  </g>

  <g class="body" font-size="14">
    <rect x="64" y="774" width="14" height="14" rx="3" fill="#0f766e"/>
    <text x="88" y="786" fill="#334155">Local-memory cache</text>
    <rect x="250" y="774" width="14" height="14" rx="3" fill="#64748b"/>
    <text x="274" y="786" fill="#334155">Repository baseline</text>
    <rect x="448" y="774" width="14" height="14" rx="3" fill="#2563eb"/>
    <text x="472" y="786" fill="#334155">Redis-backed warmed hit</text>
    <rect x="688" y="774" width="14" height="14" rx="3" fill="#d97706"/>
    <text x="712" y="786" fill="#334155">Forced loader miss</text>
  </g>
</svg>
