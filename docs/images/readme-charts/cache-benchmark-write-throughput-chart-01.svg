<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="544" viewBox="0 0 1280 544" role="img" aria-label="Cache Benchmark Write Throughput">
<style>
  .title{font-family:'Architects Daughter','Comic Sans MS',cursive;font-size:34px;font-weight:400;fill:#273043}
  .subtitle{font-family:'Comic Sans MS','Comic Neue',cursive;font-size:17px;font-weight:400;fill:#6b7280}
  .label{font-family:'Comic Sans MS','Comic Neue',cursive;font-size:18px;font-weight:400;fill:#273043}
  .value{font-family:'Comic Sans MS','Comic Neue',cursive;font-size:17px;font-weight:400;fill:#273043}
  .note{font-family:'Comic Sans MS','Comic Neue',cursive;font-size:16px;font-weight:400;fill:#6b7280}
</style>
<rect width="1280" height="544" fill="#f6f8fb"/>
<rect x="24" y="24" width="1232" height="496" rx="18" fill="#fff" stroke="#d7e3ee" stroke-width="2"/>

<text class="title" x="56" y="74">Write Throughput — save (ops/s)</text>
<text class="subtitle" x="58" y="106">Higher is better. Write-Behind uses async DB flush; all others are synchronous.</text>

<!-- NoCache -->
<text class="label" x="56" y="160" dominant-baseline="middle">NoCache</text>
<rect x="290" y="138" width="270" height="40" rx="6" fill="#d1d5db"/>
<text class="value" x="565" y="160" dominant-baseline="middle">~8,200</text>

<!-- Caffeine -->
<text class="label" x="56" y="216" dominant-baseline="middle">Caffeine</text>
<rect x="290" y="194" width="266" height="40" rx="6" fill="#86efac"/>
<text class="value" x="561" y="216" dominant-baseline="middle">~8,100</text>

<!-- Redis Cache -->
<text class="label" x="56" y="272" dominant-baseline="middle">Redis Cache</text>
<rect x="290" y="250" width="240" height="40" rx="6" fill="#93c5fd"/>
<text class="value" x="535" y="272" dominant-baseline="middle">~7,300</text>

<!-- Near Cache -->
<text class="label" x="56" y="328" dominant-baseline="middle">Near Cache</text>
<rect x="290" y="306" width="237" height="40" rx="6" fill="#6ee7b7"/>
<text class="value" x="532" y="328" dominant-baseline="middle">~7,200</text>

<!-- Write-Through -->
<text class="label" x="56" y="384" dominant-baseline="middle">Write-Through</text>
<rect x="290" y="362" width="184" height="40" rx="6" fill="#fca5a5"/>
<text class="value" x="479" y="384" dominant-baseline="middle">~5,600</text>

<!-- Write-Behind -->
<text class="label" x="56" y="440" dominant-baseline="middle">Write-Behind</text>
<rect x="290" y="418" width="790" height="40" rx="6" fill="#fbbf24"/>
<text class="value" x="1086" y="440" dominant-baseline="middle">~24,000  ★</text>

<text class="note" x="56" y="497">★ Write-Behind delivers 3× higher write throughput — async DB flush skips synchronous network wait.</text>
</svg>
