<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="550" viewBox="0 0 1280 550" role="img" aria-labelledby="title desc">
  <title id="title">Cache benchmark write throughput on 2026-07-27</title>
  <desc id="desc">Horizontal logarithmic bar chart comparing write-behind cache acceptance, write-through synchronous database persistence, and write-behind database drain. The first two exceed three thousand operations per second, while waiting for the configured write-behind delay and database observation is about one operation per second.</desc>
  <style>
    .heading { font-family: "Architects Daughter"; }
    .body { font-family: "Comic Mono"; }
  </style>
  <rect width="1280" height="550" fill="#f8fafc"/>
  <text class="heading" x="64" y="62" fill="#0f172a" font-size="30">Cache write throughput by completion boundary</text>
  <text class="body" x="64" y="96" fill="#475569" font-size="17">Corrected issue #585 contracts | 2026-07-27 | ops/s | logarithmic scale</text>
  <text class="body" x="64" y="126" fill="#64748b" font-size="15">Higher is better only within the same completion contract. The drain row includes the configured 1-second delay.</text>

  <g stroke="#cbd5e1" stroke-width="1">
    <line x1="380" y1="160" x2="380" y2="424"/>
    <line x1="506.7" y1="160" x2="506.7" y2="424"/>
    <line x1="633.3" y1="160" x2="633.3" y2="424"/>
    <line x1="760" y1="160" x2="760" y2="424"/>
    <line x1="886.7" y1="160" x2="886.7" y2="424"/>
    <line x1="1013.3" y1="160" x2="1013.3" y2="424"/>
    <line x1="1140" y1="160" x2="1140" y2="424"/>
  </g>

  <g class="body" fill="#64748b" font-size="14" text-anchor="middle">
    <text x="380" y="448">0.1</text>
    <text x="506.7" y="448">1</text>
    <text x="633.3" y="448">10</text>
    <text x="760" y="448">100</text>
    <text x="886.7" y="448">1K</text>
    <text x="1013.3" y="448">10K</text>
    <text x="1140" y="448">100K ops/s</text>
  </g>

  <g class="body" fill="#0f172a" font-size="16" text-anchor="end">
    <text x="352" y="213">Write-Behind enqueue</text>
    <text x="352" y="293">Write-Through update</text>
    <text x="352" y="373">Write-Behind drain</text>
  </g>
  <g class="body" fill="#64748b" font-size="13" text-anchor="end">
    <text x="352" y="234">cache accepted, DB queued</text>
    <text x="352" y="314">DB persisted before return</text>
    <text x="352" y="394">DB value observed</text>
  </g>

  <rect x="380" y="190" width="576.4" height="34" rx="7" fill="#7c3aed"/>
  <rect x="380" y="270" width="567.7" height="34" rx="7" fill="#2563eb"/>
  <rect x="380" y="350" width="126.0" height="34" rx="7" fill="#d97706"/>

  <g class="body" fill="#0f172a" font-size="16" font-weight="700">
    <text x="967" y="213">3,551.936</text>
    <text x="959" y="293">3,034.323</text>
    <text x="517" y="373">0.988</text>
  </g>

  <g class="body" font-size="14">
    <rect x="64" y="492" width="14" height="14" rx="3" fill="#7c3aed"/>
    <text x="88" y="504" fill="#334155">Cache accepted</text>
    <rect x="230" y="492" width="14" height="14" rx="3" fill="#2563eb"/>
    <text x="254" y="504" fill="#334155">Synchronous DB completion</text>
    <rect x="500" y="492" width="14" height="14" rx="3" fill="#d97706"/>
    <text x="524" y="504" fill="#334155">Queued DB drain observed</text>
  </g>
</svg>
