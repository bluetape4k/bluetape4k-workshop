<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="820" viewBox="0 0 1680 820">
<defs><style><![CDATA[

@font-face { font-family:'Architects Daughter'; src:local('Architects Daughter'); }
@font-face { font-family:'Comic Mono'; src:local('Comic Mono'); }
svg { background:#f6f9fc; }
.frame { fill:#fff; stroke:#d5e2f0; stroke-width:2.4; }
.title { font-family:'Architects Daughter','Comic Sans MS',cursive; font-size:48px; fill:#1f344f; }
.subtitle,.axis,.desc,.value,.note { font-family:'Comic Mono','SFMono-Regular',monospace; fill:#536782; font-weight:700; }
.subtitle { font-size:19px; }
.axis { font-size:15px; }
.desc { font-size:14px; fill:#60738d; }
.value { font-size:17px; fill:#33465f; }
.label { font-family:'Architects Daughter','Comic Sans MS',cursive; font-size:25px; fill:#20344d; }
.plot { fill:#fbfdff; stroke:#d4e1ef; stroke-width:2; }
.track { fill:#eaf2fa; stroke:#d3e0ee; stroke-width:1.4; }
.bar0 { fill:#6aa3f7; } .bar1 { fill:#5ab88d; } .bar2 { fill:#e4af45; }
.bar3 { fill:#9b82dd; } .bar4 { fill:#5db7bd; } .bar5 { fill:#f07f7a; }
.grid { stroke:#dce7f2; stroke-width:1.1; }
.footer { fill:#f8fbff; stroke:#d4e1ef; stroke-width:2; }

]]></style></defs>
