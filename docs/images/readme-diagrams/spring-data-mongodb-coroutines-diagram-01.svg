<svg xmlns="http://www.w3.org/2000/svg" width="998" height="1153" viewBox="0 0 998 1153" role="img" aria-label="mongodb coroutines Class Structure">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#1f2937" flood-opacity="0.10"/></filter>
  <marker id="openArrow" markerWidth="10" markerHeight="8" refX="8.5" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M 1 1 L 8.5 4 L 1 7" fill="none" stroke="#758297" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <marker id="inherit" markerWidth="11" markerHeight="10" refX="9.5" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 1 L 9.5 5 L 0.5 9 Z" fill="#ffffff" stroke="#758297" stroke-width="1.7"/></marker>
  <style>
    .canvas{fill:#f7f9fc}.frame{fill:#fff;stroke:#d8e0ea;stroke-width:1.5}
    .title{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:43px;font-weight:400;fill:#102033}
    .subtitle{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:15px;font-weight:400;fill:#536273}
    .label{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:25px;font-weight:400;fill:#102033}
    .smallLabel{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:21px;font-weight:400;fill:#102033}
    .mono{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#102033}
    .small{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#536273}
    .strong{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:13px;font-weight:400;fill:#102033}
    .card{stroke-width:2.1;filter:url(#shadow)}.compartment{stroke-width:1.5;fill:none}
    .line{stroke:#758297;stroke-width:2.1;fill:none;marker-end:url(#openArrow)}
    .plainLine{stroke:#758297;stroke-width:2.1;fill:none}
    .dashed{stroke:#758297;stroke-width:2.1;stroke-dasharray:7 6;fill:none;marker-end:url(#openArrow)}
    .inheritLine{stroke:#758297;stroke-width:2.2;fill:none;marker-end:url(#inherit)}
    .implLine{stroke:#758297;stroke-width:2.2;stroke-dasharray:8 7;fill:none;marker-end:url(#inherit)}
  </style>
</defs>
<rect class="canvas" width="998" height="1153"/>
<rect class="frame" x="32" y="28" width="934" height="1097" rx="28"/>
<text class="title" x="66" y="82">mongodb coroutines Class Structure</text>
<text class="subtitle" x="70" y="118">UML classes from the original Mermaid source</text>
<path class="line" d="M274 502 L274 376"/>
<path class="line" d="M724 502 L724 423 L274 423 L274 376"/>
<path class="line" d="M499 782 L499 415 L274 415 L274 376"/>
<g transform="translate(84,180)">
  <rect class="card" x="0" y="0" width="380" height="196" rx="5" fill="#E8F3FF" stroke="#5B8DEF"/>
  <line class="compartment" x1="0" y1="78" x2="380" y2="78" stroke="#5B8DEF"/>
  <text class="small" x="190" y="26" text-anchor="middle"></text>
  <text class="label" x="190" y="61" text-anchor="middle">Person</text>
  <text class="mono" x="18" y="108">+String? firstname</text>
<text class="mono" x="18" y="129">+String? lastname</text>
<text class="mono" x="18" y="150">+Int age</text>
<text class="mono" x="18" y="171">+String? id</text>
</g>
<g transform="translate(534,180)">
  <rect class="card" x="0" y="0" width="380" height="175" rx="5" fill="#EAF7EF" stroke="#58A978"/>
  <line class="compartment" x1="0" y1="78" x2="380" y2="78" stroke="#58A978"/>
  <text class="small" x="190" y="26" text-anchor="middle"></text>
  <text class="label" x="190" y="61" text-anchor="middle">ReactiveMongoConfig</text>
  <text class="mono" x="18" y="108">+mongoClient() MongoClient</text>
<text class="mono" x="18" y="129">+reactiveMongoDatabaseFactory()</text>
<text class="mono" x="18" y="150">ReactiveMongoDatabaseFactory</text>
</g>
<g transform="translate(84,502)">
  <rect class="card" x="0" y="0" width="380" height="154" rx="5" fill="#FFF3D9" stroke="#D6A441"/>
  <line class="compartment" x1="0" y1="78" x2="380" y2="78" stroke="#D6A441"/>
  <text class="small" x="190" y="26" text-anchor="middle">«interface»</text>
  <text class="label" x="190" y="61" text-anchor="middle">PersonReactiveRepository</text>
  <text class="mono" x="18" y="108">+findByFirstname(firstname) Mono~Person~</text>
<text class="mono" x="18" y="129">+findAll() Flux~Person~</text>
</g>
<g transform="translate(534,502)">
  <rect class="card" x="0" y="0" width="380" height="154" rx="5" fill="#FDECEF" stroke="#DC6B82"/>
  <line class="compartment" x1="0" y1="78" x2="380" y2="78" stroke="#DC6B82"/>
  <text class="small" x="190" y="26" text-anchor="middle">«interface»</text>
  <text class="label" x="190" y="61" text-anchor="middle">PersonCoroutineRepository</text>
  <text class="mono" x="18" y="108">+findByFirstname(firstname) Person?</text>
<text class="mono" x="18" y="129">+findAll() Flow~Person~</text>
</g>
<g transform="translate(309,782)">
  <rect class="card" x="0" y="0" width="380" height="175" rx="5" fill="#E9F7F6" stroke="#45A7A1"/>
  <line class="compartment" x1="0" y1="78" x2="380" y2="78" stroke="#45A7A1"/>
  <text class="small" x="190" y="26" text-anchor="middle">«interface»</text>
  <text class="label" x="190" y="61" text-anchor="middle">PersonRepository</text>
  <text class="mono" x="18" y="108">+findOneByFirstname(firstname) Person?</text>
<text class="mono" x="18" y="129">+findOneOrNoneByFirstname(firstname) Person?</text>
<text class="mono" x="18" y="150">+findNullableByFirstname(firstname) Person?</text>
</g>
</svg>
