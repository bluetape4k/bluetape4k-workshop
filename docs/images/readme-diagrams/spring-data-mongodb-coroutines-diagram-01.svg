<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" role="img" aria-label="MongoDB Coroutines Architecture">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#1f2937" flood-opacity="0.10"/></filter>
  <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M1,1 L8,4.5 L1,8 Z" fill="#758297"/></marker>
  <style>
    .canvas{fill:#f7f9fc}.frame{fill:#fff;stroke:#d8e0ea;stroke-width:1.5}
    .title{font-family:"Architects Daughter";font-size:38px;font-weight:400;fill:#102033}
    .subtitle{font-family:"Comic Mono";font-size:14px;font-weight:400;fill:#536273}
    .smallLabel{font-family:"Architects Daughter";font-size:21px;font-weight:400;fill:#102033}
    .small{font-family:"Comic Mono";font-size:12px;font-weight:400;fill:#536273}
    .card{stroke-width:2.1;filter:url(#shadow)}
    .line{stroke:#758297;stroke-width:2.1;fill:none;marker-end:url(#arrow)}
  </style>
</defs>
<rect class="canvas" width="960" height="440"/>
<rect class="frame" x="24" y="20" width="912" height="396" rx="16"/>
<text class="title" x="48" y="66">MongoDB Coroutines Architecture</text>
<text class="subtitle" x="48" y="90">PersonCoroutineRepository · PersonReactiveRepository · ReactiveMongoConfig → MongoDB</text>

<!-- Row 1: Repository layer -->
<rect class="card" x="50" y="115" width="240" height="60" rx="8" fill="#E8F3FF" stroke="#5B8DEF"/>
<text class="smallLabel" x="170" y="143" text-anchor="middle">PersonRepository</text>
<text class="small" x="170" y="162" text-anchor="middle">MongoRepository (blocking)</text>

<rect class="card" x="360" y="115" width="240" height="60" rx="8" fill="#EAF7EF" stroke="#58A978"/>
<text class="smallLabel" x="480" y="143" text-anchor="middle">PersonCoroutineRepo</text>
<text class="small" x="480" y="162" text-anchor="middle">CoroutineCrudRepository</text>

<rect class="card" x="670" y="115" width="240" height="60" rx="8" fill="#FFF3D9" stroke="#D6A441"/>
<text class="smallLabel" x="790" y="143" text-anchor="middle">PersonReactiveRepo</text>
<text class="small" x="790" y="162" text-anchor="middle">ReactiveMongoRepository</text>

<!-- Row 2: Config + Template -->
<rect class="card" x="160" y="240" width="240" height="60" rx="8" fill="#FDECEF" stroke="#DC6B82"/>
<text class="smallLabel" x="280" y="268" text-anchor="middle">ReactiveMongoConfig</text>
<text class="small" x="280" y="287" text-anchor="middle">MongoClient factory</text>

<rect class="card" x="560" y="240" width="240" height="60" rx="8" fill="#F1ECFF" stroke="#8A72D6"/>
<text class="smallLabel" x="680" y="268" text-anchor="middle">ReactiveMongoTemplate</text>
<text class="small" x="680" y="287" text-anchor="middle">find / save / delete</text>

<!-- Row 3: Infrastructure -->
<rect class="card" x="260" y="352" width="440" height="52" rx="8" fill="#E9F7F6" stroke="#45A7A1"/>
<text class="smallLabel" x="480" y="380" text-anchor="middle">MongoDB (Testcontainers)</text>
<text class="small" x="480" y="396" text-anchor="middle">Replica set for transaction support</text>

<!-- Arrows: repos -> Config -->
<path class="line" d="M170 175 L170 222 L260 222 L260 240"/>
<path class="line" d="M480 175 L480 222 L300 222 L300 240"/>
<path class="line" d="M790 175 L790 222 L700 222 L700 240"/>
<!-- Config + Template -> MongoDB -->
<path class="line" d="M280 300 L280 334 L400 334 L400 352"/>
<path class="line" d="M680 300 L680 334 L560 334 L560 352"/>
</svg>
