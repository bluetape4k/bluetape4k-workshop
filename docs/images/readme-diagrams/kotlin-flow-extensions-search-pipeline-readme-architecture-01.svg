<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="780" viewBox="0 0 1120 780" role="img" aria-labelledby="title desc">
  <title id="title">Search Pipeline Architecture</title>
  <desc id="desc">A top-to-bottom layered architecture for a Flow based search pipeline.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9 z" fill="#314a67"/>
    </marker>
    <style>
      .title { font-family: 'Architects Daughter', 'Comic Mono', sans-serif; font-size: 34px; fill: #1f2937; }
      .layer-label, .node-title, .node-body { font-family: 'Comic Mono', 'Architects Daughter', sans-serif; fill: #263238; }
      .layer-label { font-size: 16px; font-weight: 700; letter-spacing: 0; }
      .node-title { font-size: 18px; font-weight: 700; }
      .node-body { font-size: 13px; }
      .layer { rx: 8; fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.5; }
      .layer.input { fill: #eff6ff; }
      .layer.pipeline { fill: #f0fdf4; }
      .layer.output { fill: #fff7ed; }
      .node rect { rx: 7; fill: #ffffff; stroke: #314a67; stroke-width: 2.5; }
      .pipeline-card { stroke: #2d9d78; }
      .adapter-card { stroke: #c78a15; }
      .stop-card { stroke: #7c4dcc; }
      .edge path { fill: none; stroke: #314a67; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1120" height="780" fill="#fbfcfe"/>
  <text class="title" x="560" y="50" text-anchor="middle">Search Pipeline Architecture</text>

  <rect class="layer input" x="48" y="76" width="1024" height="138"/>
  <text class="layer-label" x="72" y="202">Input layer</text>
  <rect class="layer pipeline" x="48" y="248" width="1024" height="330"/>
  <text class="layer-label" x="72" y="276">Flow pipeline layer</text>
  <rect class="layer output" x="48" y="612" width="1024" height="128"/>
  <text class="layer-label" x="72" y="728">Output layer</text>

  <g class="node" data-node="query-ui">
    <rect x="90" y="100" width="240" height="84"/>
    <text class="node-title" x="210" y="132" text-anchor="middle">Query Input</text>
    <text class="node-body" x="210" y="158" text-anchor="middle">raw text Flow</text>
  </g>
  <g class="node" data-node="settings">
    <rect x="440" y="100" width="240" height="84"/>
    <text class="node-title" x="560" y="132" text-anchor="middle">Settings State</text>
    <text class="node-body" x="560" y="158" text-anchor="middle">seeded hot Flow</text>
  </g>
  <g class="node" data-node="session">
    <rect class="stop-card" x="790" y="100" width="240" height="84"/>
    <text class="node-title" x="910" y="132" text-anchor="middle">Session Stop</text>
    <text class="node-body" x="910" y="158" text-anchor="middle">shared close signal</text>
  </g>
  <g class="node" data-node="flow-pipeline">
    <rect class="pipeline-card" x="440" y="290" width="240" height="84"/>
    <text class="node-title" x="560" y="322" text-anchor="middle">SearchPipeline</text>
    <text class="node-body" x="560" y="348" text-anchor="middle">debounce, combine, cancel</text>
  </g>
  <g class="node" data-node="adapter">
    <rect class="adapter-card" x="440" y="470" width="240" height="84"/>
    <text class="node-title" x="560" y="502" text-anchor="middle">SearchAdapter</text>
    <text class="node-body" x="560" y="528" text-anchor="middle">suspend search boundary</text>
  </g>
  <g class="node" data-node="results">
    <rect x="440" y="640" width="240" height="84"/>
    <text class="node-title" x="560" y="672" text-anchor="middle">Search Results</text>
    <text class="node-body" x="560" y="698" text-anchor="middle">redacted logged output</text>
  </g>

  <g class="edge" data-edge="query-ui-&gt;flow-pipeline" data-label="debounced query">
    <path d="M 210 184 L 210 240 L 500 240 L 500 290"/>
  </g>
  <g class="edge" data-edge="settings-&gt;flow-pipeline" data-label="latest settings">
    <path d="M 560 184 L 560 290"/>
  </g>
  <g class="edge" data-edge="session-&gt;flow-pipeline" data-label="stop signal">
    <path d="M 910 184 L 910 240 L 620 240 L 620 290"/>
  </g>
  <g class="edge" data-edge="flow-pipeline-&gt;adapter" data-label="search request">
    <path d="M 560 374 L 560 470"/>
  </g>
  <g class="edge" data-edge="adapter-&gt;results" data-label="search result">
    <path d="M 560 554 L 560 640"/>
  </g>
</svg>
