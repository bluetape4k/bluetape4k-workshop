<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1760" height="920" viewBox="0 0 1760 920" role="img" aria-label="WebFlux WebSocket quote streaming flow">
  <defs>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="124%"><feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#64748B" flood-opacity="0.15"/></filter>
    <marker id="arrowBlue" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 14 7 L 0 14 Z" fill="#2563EB" stroke-dasharray="none"/></marker>
    <marker id="arrowGreen" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 14 7 L 0 14 Z" fill="#16A34A" stroke-dasharray="none"/></marker>
    <marker id="arrowOrange" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 14 7 L 0 14 Z" fill="#EA580C" stroke-dasharray="none"/></marker>
    <style>
      .canvas{fill:#F8FAFC}.frame{fill:#FFFFFF;stroke:#D6E0E8;stroke-width:1.4}.lane{stroke-width:1.6;rx:24}
      .title{font-family:"Architects Daughter";font-size:42px;fill:#102033}.subtitle{font-family:"Comic Mono";font-size:16px;fill:#51606F}
      .laneTitle{font-family:"Architects Daughter";font-size:31px;fill:#243447}.cardTitle{font-family:"Architects Daughter";font-size:30px;fill:#102033}
      .cardText{font-family:"Comic Mono";font-size:15px;fill:#415166}.line{fill:none;stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round}
      .label{font-family:"Comic Mono";font-size:14px;fill:#334155}
    </style>
  </defs>
  <rect class="canvas" width="1760" height="920"/>
  <rect class="frame" x="24" y="24" width="1712" height="872" rx="26"/>
  <text class="title" x="880" y="74" text-anchor="middle">Quote delivery surfaces</text>
  <text class="subtitle" x="880" y="108" text-anchor="middle">WebSocket clients receive periodic text frames; HTTP tests consume the same quotes as NDJSON Flow responses.</text>

  <rect class="lane" x="78" y="154" width="1604" height="280" fill="#EFF6FF" stroke="#BFDBFE"/>
  <text class="laneTitle" x="118" y="198">WebSocket stream</text>
  <g filter="url(#shadow)"><rect x="150" y="250" width="270" height="78" rx="14" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.7"/><text class="cardTitle" x="285" y="284" text-anchor="middle">Browser</text><text class="cardText" x="285" y="310" text-anchor="middle">new WebSocket(...)</text></g>
  <g filter="url(#shadow)"><rect x="570" y="240" width="340" height="98" rx="14" fill="#FFFFFF" stroke="#16A34A" stroke-width="1.7"/><text class="cardTitle" x="740" y="274" text-anchor="middle">Reactive handler</text><text class="cardText" x="740" y="300" text-anchor="middle">session.send(flux)</text><text class="cardText" x="740" y="324" text-anchor="middle">session.receive().log()</text></g>
  <g filter="url(#shadow)"><rect x="1060" y="240" width="320" height="98" rx="14" fill="#FFFFFF" stroke="#EA580C" stroke-width="1.7"/><text class="cardTitle" x="1220" y="274" text-anchor="middle">Quote Flux</text><text class="cardText" x="1220" y="300" text-anchor="middle">every 2 seconds</text><text class="cardText" x="1220" y="324" text-anchor="middle">JSON textMessage</text></g>
  <path class="line" d="M 420 289 L 570 289" stroke="#2563EB" marker-end="url(#arrowBlue)" stroke-linecap="round" stroke-linejoin="round"/>
  <text class="label" x="495" y="270" text-anchor="middle">connect /event-emitter</text>
  <path class="line" d="M 910 289 L 1060 289" stroke="#16A34A" marker-end="url(#arrowGreen)" stroke-linecap="round" stroke-linejoin="round"/>
  <text class="label" x="985" y="270" text-anchor="middle">fetchQuoteStringAsFlux</text>
  <path class="line" d="M 1220 338 L 1220 390 L 285 390 L 285 328" stroke="#EA580C" marker-end="url(#arrowOrange)" stroke-linecap="round" stroke-linejoin="round"/>
  <text class="label" x="752" y="414" text-anchor="middle">periodic Quote JSON frame</text>

  <rect class="lane" x="78" y="512" width="1604" height="250" fill="#F0FDF4" stroke="#BBF7D0"/>
  <text class="laneTitle" x="118" y="556">HTTP NDJSON routes</text>
  <g filter="url(#shadow)"><rect x="150" y="612" width="280" height="76" rx="14" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.7"/><text class="cardTitle" x="290" y="646" text-anchor="middle">WebTestClient</text><text class="cardText" x="290" y="672" text-anchor="middle">GET /quotes/{duration}</text></g>
  <g filter="url(#shadow)"><rect x="580" y="602" width="310" height="96" rx="14" fill="#FFFFFF" stroke="#16A34A" stroke-width="1.7"/><text class="cardTitle" x="735" y="636" text-anchor="middle">coRouter route</text><text class="cardText" x="735" y="662" text-anchor="middle">bodyAndAwait(Flow)</text><text class="cardText" x="735" y="686" text-anchor="middle">application/x-ndjson</text></g>
  <g filter="url(#shadow)"><rect x="1050" y="602" width="350" height="96" rx="14" fill="#FFFFFF" stroke="#EA580C" stroke-width="1.7"/><text class="cardTitle" x="1225" y="636" text-anchor="middle">QuoteGenerator Flow</text><text class="cardText" x="1225" y="662" text-anchor="middle">Event or Quote stream</text><text class="cardText" x="1225" y="686" text-anchor="middle">conflate backpressure</text></g>
  <path class="line" d="M 430 650 L 580 650" stroke="#2563EB" marker-end="url(#arrowBlue)" stroke-linecap="round" stroke-linejoin="round"/>
  <text class="label" x="505" y="631" text-anchor="middle">HTTP request</text>
  <path class="line" d="M 890 650 L 1050 650" stroke="#16A34A" marker-end="url(#arrowGreen)" stroke-linecap="round" stroke-linejoin="round"/>
  <text class="label" x="970" y="631" text-anchor="middle">select duration</text>
  <path class="line" d="M 1225 698 L 1225 724 L 290 724 L 290 688" stroke="#EA580C" marker-end="url(#arrowOrange)" stroke-linecap="round" stroke-linejoin="round"/>
  <text class="label" x="758" y="748" text-anchor="middle">NDJSON stream collected as Reactor Flux then coroutine Flow</text>
</svg>
