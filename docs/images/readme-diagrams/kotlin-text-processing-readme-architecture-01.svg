<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" role="img" aria-label="Kotlin text processing architecture diagram">
  <defs>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="124%"><feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#64748B" flood-opacity="0.16"/></filter>
    <marker id="arrowSlate" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 14 14" data-role="primary" data-tip-direction="positive-x"><path d="M 0 0 L 14 7 L 0 14 Z" fill="#5F7382" stroke="#5F7382" stroke-dasharray="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="0"/></marker>
    <style>
      .canvas{fill:#F8FAFC}.frame{fill:#FFFFFF;stroke:#D6E0E8;stroke-width:1.6}.layerInput{fill:#EEF8F3;stroke:#A9D8C6;stroke-width:2}.layerCore{fill:#F5F1FA;stroke:#CDB9EA;stroke-width:2}.layerText{fill:#FFF6E8;stroke:#E8C27D;stroke-width:2}.layerVerify{fill:#EBF4FC;stroke:#B6D4EC;stroke-width:2}.title{font-family:"Architects Daughter";font-size:42px;fill:#172033}.subtitle{font-family:"Comic Mono";font-size:17px;fill:#536473}.layerTitle{font-family:"Architects Daughter";font-size:27px;fill:#2D4050}.cardTitle{font-family:"Architects Daughter";font-size:26px;fill:#132033}.cardText{font-family:"Comic Mono";font-size:15px;fill:#4F6070}.line{fill:none;stroke:#5F7382;stroke-width:4;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrowSlate)}
    </style>
  </defs>
  <rect class="canvas" width="1600" height="980"/>
  <rect class="frame" x="32" y="28" width="1536" height="924" rx="30"/>
  <text class="title" x="800" y="78" text-anchor="middle">Text Processing Toolkit</text>
  <text class="subtitle" x="800" y="112" text-anchor="middle">A reusable in-memory example for language detection, multilingual search, sensitive redaction, and audit-safe metadata.</text>

  <rect class="layerInput" x="80" y="150" width="1440" height="160" rx="24"/>
  <text class="layerTitle" x="112" y="192">Reader input</text>
  <g filter="url(#shadow)">
    <rect class="card" x="185" y="202" width="330" height="82" rx="18" fill="#FFFFFF" stroke="#6FBF9C" stroke-width="2.4"/>
    <text class="cardTitle" x="350" y="236" text-anchor="middle">SearchDocument</text>
    <text class="cardText" x="350" y="262" text-anchor="middle">id, title, multilingual text</text>
  </g>
  <g filter="url(#shadow)">
    <rect class="card" x="1085" y="202" width="330" height="82" rx="18" fill="#FFFFFF" stroke="#6FBF9C" stroke-width="2.4"/>
    <text class="cardTitle" x="1250" y="236" text-anchor="middle">Query or sensitive text</text>
    <text class="cardText" x="1250" y="262" text-anchor="middle">search terms, PII, or tokens</text>
  </g>

  <rect class="layerCore" x="80" y="335" width="1440" height="180" rx="24"/>
  <text class="layerTitle" x="112" y="378">Processing core</text>
  <g filter="url(#shadow)">
    <rect class="card" x="500" y="385" width="600" height="112" rx="18" fill="#FFFFFF" stroke="#9F7AD6" stroke-width="2.4"/>
    <text class="cardTitle" x="800" y="420" text-anchor="middle">Text processing APIs</text>
    <text class="cardText" x="800" y="446" text-anchor="middle">MultilingualSearchIndex</text>
    <text class="cardText" x="800" y="471" text-anchor="middle">CoroutineMultilingualSearchIndex + SensitiveTextRedactionPipeline</text>
  </g>

  <rect class="layerText" x="80" y="540" width="1440" height="260" rx="24"/>
  <text class="layerTitle" x="112" y="584">Reusable bluetape4k-text components</text>
  <g filter="url(#shadow)">
    <rect class="card" x="145" y="615" width="300" height="86" rx="18" fill="#FFFFFF" stroke="#D8A43B" stroke-width="2.4"/>
    <text class="cardTitle" x="295" y="650" text-anchor="middle">Detection services</text>
    <text class="cardText" x="295" y="676" text-anchor="middle">Lingua detector + Mutex guard</text>
  </g>
  <g filter="url(#shadow)">
    <rect class="card" x="485" y="615" width="270" height="86" rx="18" fill="#FFFFFF" stroke="#D8A43B" stroke-width="2.4"/>
    <text class="cardTitle" x="620" y="650" text-anchor="middle">KoreanProcessor</text>
    <text class="cardText" x="620" y="676" text-anchor="middle">normalize + noun tokens</text>
  </g>
  <g filter="url(#shadow)">
    <rect class="card" x="805" y="615" width="270" height="86" rx="18" fill="#FFFFFF" stroke="#D8A43B" stroke-width="2.4"/>
    <text class="cardTitle" x="940" y="650" text-anchor="middle">JapaneseProcessor</text>
    <text class="cardText" x="940" y="676" text-anchor="middle">Kuromoji noun tokens</text>
  </g>
  <g filter="url(#shadow)">
    <rect class="card" x="1125" y="615" width="300" height="86" rx="18" fill="#FFFFFF" stroke="#D8A43B" stroke-width="2.4"/>
    <text class="cardTitle" x="1275" y="650" text-anchor="middle">TextNormalizer</text>
    <text class="cardText" x="1275" y="676" text-anchor="middle">English/unknown terms</text>
  </g>
  <g filter="url(#shadow)">
    <rect class="card" x="560" y="715" width="480" height="64" rx="16" fill="#FFFFFF" stroke="#D8A43B" stroke-width="2.4"/>
    <text class="cardTitle" x="800" y="752" text-anchor="middle">Aho-Corasick spans + regex rules</text>
  </g>

  <rect class="layerVerify" x="80" y="825" width="1440" height="100" rx="24"/>
  <text class="layerTitle" x="112" y="866">Local verification</text>
  <g filter="url(#shadow)">
    <rect class="card" x="470" y="854" width="660" height="50" rx="16" fill="#FFFFFF" stroke="#6BA6D8" stroke-width="2.4"/>
    <text class="cardTitle" x="800" y="887" text-anchor="middle">JUnit search + redaction + coroutine tests</text>
  </g>

  <path class="flow line" data-connector="document-to-index" d="M 350 284 L 350 323 Q 350 335 362 335 L 788 335 Q 800 335 800 347 L 800 385" marker-end="url(#arrowSlate)"/>
  <path class="flow line" data-connector="query-to-index" d="M 1250 284 L 1250 323 Q 1250 335 1238 335 L 812 335 Q 800 335 800 347 L 800 385" marker-end="url(#arrowSlate)"/>
  <path class="flow line" data-connector="index-to-language-detector" d="M 640 497 L 640 588 Q 640 600 628 600 L 307 600 Q 295 600 295 612 L 295 615" marker-end="url(#arrowSlate)"/>
  <path class="flow line" data-connector="index-to-korean-processor" d="M 720 497 L 720 588 Q 720 600 708 600 L 632 600 Q 620 600 620 612 L 620 615" marker-end="url(#arrowSlate)"/>
  <path class="flow line" data-connector="index-to-japanese-processor" d="M 880 497 L 880 580 Q 880 592 892 592 L 928 592 Q 940 592 940 604 L 940 615" marker-end="url(#arrowSlate)"/>
  <path class="flow line" data-connector="index-to-normalizer" d="M 960 497 L 960 553 Q 960 565 972 565 L 1263 565 Q 1275 565 1275 577 L 1275 615" marker-end="url(#arrowSlate)"/>
  <path class="flow line" data-connector="index-to-highlighter" d="M 800 497 L 800 715" marker-end="url(#arrowSlate)"/>
  <path class="flow line" data-connector="highlighter-to-tests" d="M 800 779 L 800 854" marker-end="url(#arrowSlate)"/>
</svg>
