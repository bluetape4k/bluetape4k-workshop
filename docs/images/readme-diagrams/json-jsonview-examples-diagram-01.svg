<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" role="img" aria-label="JsonView Views Hierarchy">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#1f2937" flood-opacity="0.10"/></filter>
  <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth">
    <path d="M1,1 L8,4.5 L1,8 Z" fill="#758297"/>
  </marker>
  <style>
    .canvas{fill:#f7f9fc}.frame{fill:#fff;stroke:#d8e0ea;stroke-width:1.5}
    .title{font-family:"Architects Daughter";font-size:38px;font-weight:400;fill:#102033}
    .subtitle{font-family:"Comic Mono";font-size:14px;font-weight:400;fill:#536273}
    .smallLabel{font-family:"Architects Daughter";font-size:21px;font-weight:400;fill:#102033}
    .mono{font-family:"Comic Mono";font-size:12px;font-weight:400;fill:#102033}
    .small{font-family:"Comic Mono";font-size:12px;font-weight:400;fill:#536273}
    .card{stroke-width:2.1;filter:url(#shadow)}
    .line{stroke:#758297;stroke-width:2.1;fill:none;marker-end:url(#arrow)}
  </style>
</defs>
<!-- Layout:
     Canvas: 900×400  Frame: x=24 y=20 w=852 h=356
     3 cols: w=256 gap=42px
       Col1: x=24  cx=152  right=280
       Col2: x=322 cx=450  right=578
       Col3: x=620 cx=748  right=876
     Row1: y=98  h=90  bottom=188
     Row2: y=248 h=90  bottom=338
     Gap: 60px ✓  Overlap check: 280<322 ✓ 578<620 ✓
-->
<rect class="canvas" width="900" height="400"/>
<rect class="frame" x="24" y="20" width="852" height="356" rx="28"/>
<text class="title" x="58" y="66">JsonView — Views Hierarchy</text>
<text class="subtitle" x="58" y="92">Views.Public · Views.Analytics · Views.Internal · ArticleController · Spring WebFlux</text>

<!-- Arrows: views → ArticleDTO fields -->
<path class="line" d="M152 188 L152 218 L450 218 L450 248"/>
<path class="line" d="M450 188 L450 248"/>
<path class="line" d="M748 188 L748 218 L450 218 L450 248"/>

<!-- Views.Public  col1 -->
<g transform="translate(24,98)">
  <rect class="card" x="0" y="0" width="256" height="90" rx="12" fill="#E8F3FF" stroke="#5B8DEF"/>
  <text class="smallLabel" x="128" y="22" text-anchor="middle">Views.Public</text>
  <text class="small" x="128" y="42" text-anchor="middle">외부 공개용 — GET /articles</text>
  <text class="mono" x="128" y="62" text-anchor="middle">id · title · category</text>
  <text class="small" x="128" y="80" text-anchor="middle">@JsonView(Views.Public::class)</text>
</g>

<!-- Views.Analytics  col2 -->
<g transform="translate(322,98)">
  <rect class="card" x="0" y="0" width="256" height="90" rx="12" fill="#EAF7EF" stroke="#58A978"/>
  <text class="smallLabel" x="128" y="22" text-anchor="middle">Views.Analytics</text>
  <text class="small" x="128" y="42" text-anchor="middle">통계용 — GET /articles/{id}/analytics</text>
  <text class="mono" x="128" y="62" text-anchor="middle">views · likes</text>
  <text class="small" x="128" y="80" text-anchor="middle">@JsonView(Views.Analytics::class)</text>
</g>

<!-- Views.Internal  col3 -->
<g transform="translate(620,98)">
  <rect class="card" x="0" y="0" width="256" height="90" rx="12" fill="#FFF3D9" stroke="#D6A441"/>
  <text class="smallLabel" x="128" y="22" text-anchor="middle">Views.Internal</text>
  <text class="small" x="128" y="42" text-anchor="middle">관리자용 — extends Public + Analytics</text>
  <text class="mono" x="128" y="62" text-anchor="middle">id · title · category · views · likes</text>
  <text class="small" x="128" y="80" text-anchor="middle">@JsonView(Views.Internal::class)</text>
</g>

<!-- ArticleDTO fields (center, full row) -->
<g transform="translate(24,248)">
  <rect class="card" x="0" y="0" width="852" height="90" rx="12" fill="#F1ECFF" stroke="#8A72D6"/>
  <text class="smallLabel" x="426" y="22" text-anchor="middle">ArticleDTO</text>
  <text class="mono" x="426" y="44" text-anchor="middle">id: Long?  ·  title: String?  ·  category: String?  ·  views: Int?  ·  likes: Int?  ·  content: String?</text>
  <text class="small" x="426" y="66" text-anchor="middle">content has no @JsonView → always excluded when a view is active on the endpoint</text>
  <text class="small" x="426" y="82" text-anchor="middle">GET /articles/{id} (no view) → all fields including content returned</text>
</g>
</svg>
