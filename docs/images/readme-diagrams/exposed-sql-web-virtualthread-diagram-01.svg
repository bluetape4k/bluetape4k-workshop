<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" role="img" aria-label="Exposed SQL Virtual Thread Architecture">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#1f2937" flood-opacity="0.10"/></filter>
  <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth">
    <path d="M1,1 L8,4.5 L1,8 Z" fill="#758297"/>
  </marker>
  <style>
    .canvas{fill:#f7f9fc}.frame{fill:#fff;stroke:#d8e0ea;stroke-width:1.5}
    .title{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:38px;font-weight:400;fill:#102033}
    .subtitle{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:14px;font-weight:400;fill:#536273}
    .smallLabel{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:21px;font-weight:400;fill:#102033}
    .mono{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#102033}
    .small{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#536273}
    .card{stroke-width:2.1;filter:url(#shadow)}
    .line{stroke:#758297;stroke-width:2.1;fill:none;marker-end:url(#arrow)}
  </style>
</defs>
<rect class="canvas" width="960" height="440"/>
<rect class="frame" x="24" y="20" width="912" height="396" rx="18"/>
<text class="title" x="44" y="62">Exposed SQL + Virtual Threads</text>
<text class="subtitle" x="44" y="84">Tomcat VT Executor → SQL DSL repositories → H2 · blocking I/O on virtual threads</text>

<!-- Row 1 -->
<g transform="translate(44,100)">
  <rect class="card" x="0" y="0" width="200" height="80" rx="10" fill="#E8F3FF" stroke="#5B8DEF"/>
  <text class="smallLabel" x="100" y="28" text-anchor="middle">Tomcat</text>
  <text class="small" x="100" y="50" text-anchor="middle">VirtualThreadPerTask</text>
  <text class="small" x="100" y="66" text-anchor="middle">Executor</text>
</g>

<g transform="translate(280,100)">
  <rect class="card" x="0" y="0" width="200" height="80" rx="10" fill="#EAF7EF" stroke="#58A978"/>
  <text class="smallLabel" x="100" y="28" text-anchor="middle">ActorController</text>
  <text class="small" x="100" y="50" text-anchor="middle">GET /actors</text>
  <text class="small" x="100" y="66" text-anchor="middle">POST /actors</text>
</g>

<g transform="translate(516,100)">
  <rect class="card" x="0" y="0" width="200" height="80" rx="10" fill="#FFF3D9" stroke="#D6A441"/>
  <text class="smallLabel" x="100" y="28" text-anchor="middle">MovieController</text>
  <text class="small" x="100" y="50" text-anchor="middle">GET /movies</text>
  <text class="small" x="100" y="66" text-anchor="middle">GET /movies/{id}/actors</text>
</g>

<g transform="translate(752,100)">
  <rect class="card" x="0" y="0" width="180" height="80" rx="10" fill="#FDECEF" stroke="#DC6B82"/>
  <text class="smallLabel" x="90" y="28" text-anchor="middle">TomcatConfig</text>
  <text class="small" x="90" y="50" text-anchor="middle">newVirtualThread</text>
  <text class="small" x="90" y="66" text-anchor="middle">PerTaskExecutor()</text>
</g>

<!-- Row 2 -->
<g transform="translate(44,260)">
  <rect class="card" x="0" y="0" width="200" height="80" rx="10" fill="#E9F7F6" stroke="#45A7A1"/>
  <text class="smallLabel" x="100" y="28" text-anchor="middle">ActorRepository</text>
  <text class="small" x="100" y="50" text-anchor="middle">transaction { SQL DSL }</text>
  <text class="small" x="100" y="66" text-anchor="middle">Actors table</text>
</g>

<g transform="translate(280,260)">
  <rect class="card" x="0" y="0" width="200" height="80" rx="10" fill="#F1ECFF" stroke="#8A72D6"/>
  <text class="smallLabel" x="100" y="28" text-anchor="middle">MovieRepository</text>
  <text class="small" x="100" y="50" text-anchor="middle">transaction { SQL DSL }</text>
  <text class="small" x="100" y="66" text-anchor="middle">Movies + join</text>
</g>

<g transform="translate(516,260)">
  <rect class="card" x="0" y="0" width="200" height="80" rx="10" fill="#EAF7EF" stroke="#58A978"/>
  <text class="smallLabel" x="100" y="28" text-anchor="middle">Exposed SQL DSL</text>
  <text class="small" x="100" y="50" text-anchor="middle">selectAll(), insert { }</text>
  <text class="small" x="100" y="66" text-anchor="middle">update { }, deleteWhere { }</text>
</g>

<g transform="translate(752,260)">
  <rect class="card" x="0" y="0" width="180" height="80" rx="10" fill="#EEF6D9" stroke="#8BA84D"/>
  <text class="smallLabel" x="90" y="28" text-anchor="middle">H2 / MySQL</text>
  <text class="small" x="90" y="50" text-anchor="middle">JDBC (blocking OK</text>
  <text class="small" x="90" y="66" text-anchor="middle">on virtual threads)</text>
</g>

<!-- Arrows row 1 -->
<path class="line" d="M244,140 L278,140"/>
<path class="line" d="M480,140 L514,140"/>
<path class="line" d="M716,140 L750,140"/>

<!-- Vertical -->
<path class="line" d="M144,180 L144,258"/>
<path class="line" d="M380,180 L380,258"/>
<path class="line" d="M616,180 L616,258"/>
<path class="line" d="M842,180 L842,258"/>
</svg>
