<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="2400" viewBox="0 0 1800 2400" role="img" aria-labelledby="title desc">
  <title id="title">Voucher Pool Contention and Recovery Sequence</title>
  <desc id="desc">Concurrent clients reserve pre-generated vouchers through advisory Redis admission, a fixed foreground database permit, application-owned idempotency, and PostgreSQL row locking. The sequence distinguishes transient contention from true exhaustion, releases an idempotency owner after retryable database timeout, and shows bounded worker recovery with owner and revision compare-and-set.</desc>
  <defs>
    <style>
      .bg{fill:#F8FAF7}.title{font-family:"Architects Daughter";font-size:42px;fill:#263238}.subtitle,.msg,.footer,.note{font-family:"Comic Mono";fill:#36464F}.subtitle{font-size:17px}.participant{font-family:"Architects Daughter";font-size:19px;fill:#1F3138}.role{font-family:"Comic Mono";font-size:12px;fill:#546A73}.msg{font-size:13px}.footer{font-size:14px;fill:#60727D}.frame{fill:#FBFCF8;stroke:#41545D;stroke-width:3}.header{fill:#FFFFFF;stroke:#546E7A;stroke-width:2}.lifeline{stroke:#9AAAB1;stroke-width:2;stroke-dasharray:7 8;stroke-linecap:round}.activation{fill:#EAF6EF;stroke:#6F9278;stroke-width:1.5}.call,.return{fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.http{stroke:#4F86C6;marker-end:url(#seq-blue)}.db{stroke:#6E8F4F;marker-end:url(#seq-green)}.event{stroke:#9B7D54;marker-end:url(#seq-amber)}.warning{stroke:#B86868;marker-end:url(#seq-red)}.recovery{stroke:#8C6F33;marker-end:url(#seq-recovery)}.return{stroke:#2D948C;stroke-width:2.6;stroke-dasharray:8 6;marker-end:url(#seq-teal)}.label,.labelPill{fill:#FFFFFF;stroke:#D7E0E4;stroke-width:1.5}.blueLabel{stroke:#9CC2D1}.greenLabel{stroke:#B6C9A4}.amberLabel{stroke:#C8B38F}.redLabel{stroke:#D9ABAB}.tealLabel{stroke:#9DCBC6}.recoveryLabel{stroke:#B59A63}.badge{stroke-width:1.8}.blueBadge{fill:#EAF4F8;stroke:#4F86C6}.greenBadge{fill:#EEF7F0;stroke:#6E8F4F}.amberBadge{fill:#FFF7E8;stroke:#9B7D54}.redBadge{fill:#FFF0F0;stroke:#B86868}.tealBadge{fill:#EBFAF8;stroke:#2D948C}.recoveryBadge{fill:#FFF9EA;stroke:#8C6F33}.badgeText,.num{font-family:"Comic Mono";font-size:12px;font-weight:700}.blueText{fill:#2F6F8E}.greenText{fill:#55783F}.amberText{fill:#7F6038}.redText{fill:#9D4F4F}.tealText{fill:#247C75}.recoveryText{fill:#6F5529}.alt{fill:none;stroke:#D08A39;stroke-width:2.2;stroke-dasharray:12 8}.divider{stroke:#D08A39;stroke-width:1.7;stroke-dasharray:9 7}.branch{fill:#FFFFFF;stroke:#D08A39;stroke-width:1.6}.branchText{font-family:"Architects Daughter";font-size:18px;fill:#8A5A22}.noteBox{fill:#FFF0F0;stroke:#B86868;stroke-width:1.7}.note{font-size:13px;fill:#8D4C4C}
    </style>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%"><feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#263238" flood-opacity="0.12"/></filter>
    <marker id="seq-blue" viewBox="0 0 10 10" markerWidth="16" markerHeight="16" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#4F86C6" stroke="#4F86C6" stroke-dasharray="none" style="stroke-dasharray:none"/></marker>
    <marker id="seq-green" viewBox="0 0 10 10" markerWidth="16" markerHeight="16" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#6E8F4F" stroke="#6E8F4F" stroke-dasharray="none" style="stroke-dasharray:none"/></marker>
    <marker id="seq-amber" viewBox="0 0 10 10" markerWidth="16" markerHeight="16" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#9B7D54" stroke="#9B7D54" stroke-dasharray="none" style="stroke-dasharray:none"/></marker>
    <marker id="seq-red" viewBox="0 0 10 10" markerWidth="16" markerHeight="16" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#B86868" stroke="#B86868" stroke-dasharray="none" style="stroke-dasharray:none"/></marker>
    <marker id="seq-teal" viewBox="0 0 10 10" markerWidth="16" markerHeight="16" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#2D948C" stroke="#2D948C" stroke-dasharray="none" style="stroke-dasharray:none"/></marker>
    <marker id="seq-recovery" viewBox="0 0 10 10" markerWidth="16" markerHeight="16" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#8C6F33" stroke="#8C6F33" stroke-dasharray="none" style="stroke-dasharray:none"/></marker>
  </defs>
  <rect class="bg" width="1800" height="2400"/>
  <rect class="frame" x="22" y="22" width="1756" height="2356" rx="24"/>
  <text class="title" x="900" y="72" text-anchor="middle">Voucher Pool Contention and Recovery</text>
  <text class="subtitle" x="900" y="108" text-anchor="middle">Redis sheds work; fixed permits protect JDBC; PostgreSQL owns every winner, replay, and recovery decision.</text>

  <g filter="url(#shadow)"><rect x="45" y="150" width="250" height="76" rx="10" class="header"/><text x="170" y="181" text-anchor="middle" class="participant">Concurrent Clients</text><text x="170" y="206" text-anchor="middle" class="role">same campaign, bounded callers</text></g>
  <g filter="url(#shadow)"><rect x="335" y="150" width="250" height="76" rx="10" class="header"/><text x="460" y="181" text-anchor="middle" class="participant">Tomcat MVC</text><text x="460" y="206" text-anchor="middle" class="role">HTTP + idempotency boundary</text></g>
  <g filter="url(#shadow)"><rect x="625" y="150" width="250" height="76" rx="10" class="header"/><text x="750" y="181" text-anchor="middle" class="participant">Redis / Local</text><text x="750" y="206" text-anchor="middle" class="role">advisory admission only</text></g>
  <g filter="url(#shadow)"><rect x="915" y="150" width="250" height="76" rx="10" class="header"/><text x="1040" y="181" text-anchor="middle" class="participant">Permit + Hikari</text><text x="1040" y="206" text-anchor="middle" class="role">11 / 1 / 3 permits, max 16</text></g>
  <g filter="url(#shadow)"><rect x="1205" y="150" width="250" height="76" rx="10" class="header"/><text x="1330" y="181" text-anchor="middle" class="participant">PostgreSQL</text><text x="1330" y="206" text-anchor="middle" class="role">sole correctness authority</text></g>
  <g filter="url(#shadow)"><rect x="1495" y="150" width="250" height="76" rx="10" class="header"/><text x="1620" y="181" text-anchor="middle" class="participant">Worker / SSE</text><text x="1620" y="206" text-anchor="middle" class="role">bounded recovery and reads</text></g>

  <path class="lifeline" d="M170 226 V2260"/><path class="lifeline" d="M460 226 V2260"/><path class="lifeline" d="M750 226 V2260"/><path class="lifeline" d="M1040 226 V2260"/><path class="lifeline" d="M1330 226 V2260"/><path class="lifeline" d="M1620 226 V2260"/>
  <rect class="activation" x="453" y="285" width="14" height="1715" rx="7"/><rect class="activation" x="743" y="365" width="14" height="305" rx="7"/><rect class="activation" x="1033" y="765" width="14" height="1215" rx="7"/><rect class="activation" x="1323" y="845" width="14" height="1375" rx="7"/><rect class="activation" x="1613" y="2095" width="14" height="185" rx="7"/>

  <rect x="190" y="255" width="365" height="34" rx="17" class="labelPill blueLabel"/><circle cx="214" cy="272" r="13" class="badge blueBadge"/><text x="214" y="277" text-anchor="middle" class="num blueText">1</text><text x="238" y="277" class="msg blueText">concurrent POST reserve + idempotency key</text><path data-connector="seq-01" d="M170 305 H460" class="call http"/>
  <rect x="485" y="335" width="350" height="34" rx="17" class="labelPill amberLabel"/><circle cx="509" cy="352" r="13" class="badge amberBadge"/><text x="509" y="357" text-anchor="middle" class="num amberText">2</text><text x="533" y="357" class="msg amberText">keyed rate and Bloom advisory check</text><path data-connector="seq-02" d="M460 385 H750" class="call event"/>

  <rect x="74" y="425" width="1652" height="275" rx="18" class="alt"/><rect x="105" y="409" width="255" height="32" rx="16" class="branch"/><text x="232" y="431" text-anchor="middle" class="branchText">alt Redis healthy</text>
  <rect x="500" y="455" width="360" height="34" rx="17" class="labelPill greenLabel"/><circle cx="524" cy="472" r="13" class="badge greenBadge"/><text x="524" y="477" text-anchor="middle" class="num greenText">3</text><text x="548" y="477" class="msg greenText">admission allows bounded database work</text><path data-connector="seq-03" d="M750 505 H460" class="call db"/>
  <line x1="74" y1="550" x2="1726" y2="550" class="divider"/><text x="105" y="579" class="branchText">else Redis timeout or unavailable</text>
  <rect x="470" y="600" width="445" height="34" rx="17" class="labelPill redLabel"/><circle cx="494" cy="617" r="13" class="badge redBadge"/><text x="494" y="622" text-anchor="middle" class="num redText">4</text><text x="518" y="622" class="msg redText">signal UNKNOWN; bounded node-local hard cap</text><path data-connector="seq-04" d="M750 650 H460" class="call warning"/>

  <rect x="585" y="735" width="430" height="34" rx="17" class="labelPill blueLabel"/><circle cx="609" cy="752" r="13" class="badge blueBadge"/><text x="609" y="757" text-anchor="middle" class="num blueText">5</text><text x="633" y="757" class="msg blueText">acquire FOREGROUND permit before JDBC (250 ms)</text><path data-connector="seq-05" d="M460 785 H1040" class="call http"/>
  <rect x="850" y="815" width="415" height="34" rx="17" class="labelPill greenLabel"/><circle cx="874" cy="832" r="13" class="badge greenBadge"/><text x="874" y="837" text-anchor="middle" class="num greenText">6</text><text x="898" y="837" class="msg greenText">short tx: acquire or replay command owner</text><path data-connector="seq-06" d="M1040 865 H1330" class="call db"/>
  <rect x="785" y="895" width="470" height="34" rx="17" class="labelPill tealLabel"/><circle cx="809" cy="912" r="13" class="badge tealBadge"/><text x="809" y="917" text-anchor="middle" class="num tealText">7</text><text x="833" y="917" class="msg tealText">owner acquired or committed descriptor replayed</text><path data-connector="seq-07" d="M1330 945 H460" class="return"/>
  <rect x="645" y="975" width="480" height="34" rx="17" class="labelPill greenLabel"/><circle cx="669" cy="992" r="13" class="badge greenBadge"/><text x="669" y="997" text-anchor="middle" class="num greenText">8</text><text x="693" y="997" class="msg greenText">shared campaign / batch guards + user-limit lock</text><path data-connector="seq-08" d="M460 1025 H1330" class="call db"/>
  <rect x="700" y="1055" width="485" height="34" rx="17" class="labelPill greenLabel"/><circle cx="724" cy="1072" r="13" class="badge greenBadge"/><text x="724" y="1077" text-anchor="middle" class="num greenText">9</text><text x="748" y="1077" class="msg greenText">deterministic AVAILABLE ... FOR UPDATE SKIP LOCKED</text><path data-connector="seq-09" d="M460 1105 H1330" class="call db"/>
  <rect x="695" y="1135" width="515" height="34" rx="17" class="labelPill tealLabel"/><circle cx="719" cy="1152" r="13" class="badge tealBadge"/><text x="719" y="1157" text-anchor="middle" class="num tealText">10</text><text x="743" y="1157" class="msg tealText">commit distinct entry + counter + audit + safe descriptor</text><path data-connector="seq-10" d="M1330 1185 H460" class="return"/>
  <rect x="180" y="1215" width="380" height="34" rx="17" class="labelPill tealLabel"/><circle cx="204" cy="1232" r="13" class="badge tealBadge"/><text x="204" y="1237" text-anchor="middle" class="num tealText">11</text><text x="228" y="1237" class="msg tealText">201 RESERVED or exact stored replay</text><path data-connector="seq-11" d="M460 1265 H170" class="return"/>

  <rect x="74" y="1320" width="1652" height="340" rx="18" class="alt"/><rect x="105" y="1304" width="335" height="32" rx="16" class="branch"/><text x="272" y="1326" text-anchor="middle" class="branchText">alt no unlocked candidate</text>
  <rect x="650" y="1350" width="440" height="34" rx="17" class="labelPill greenLabel"/><circle cx="674" cy="1367" r="13" class="badge greenBadge"/><text x="674" y="1372" text-anchor="middle" class="num greenText">12</text><text x="698" y="1372" class="msg greenText">run matching non-locking existence query</text><path data-connector="seq-12" d="M460 1400 H1330" class="call db"/>
  <rect x="690" y="1430" width="510" height="34" rx="17" class="labelPill redLabel"/><circle cx="714" cy="1447" r="13" class="badge redBadge"/><text x="714" y="1452" text-anchor="middle" class="num redText">13</text><text x="738" y="1452" class="msg redText">eligible exists: 503 POOL_BUSY, no terminal descriptor</text><path data-connector="seq-13" d="M1330 1480 H460" class="call warning"/>
  <line x1="74" y1="1530" x2="1726" y2="1530" class="divider"/><text x="105" y="1559" class="branchText">else true pool exhaustion</text>
  <rect x="705" y="1580" width="490" height="34" rx="17" class="labelPill amberLabel"/><circle cx="729" cy="1597" r="13" class="badge amberBadge"/><text x="729" y="1602" text-anchor="middle" class="num amberText">14</text><text x="753" y="1602" class="msg amberText">none exists: terminal 409 POOL_EXHAUSTED</text><path data-connector="seq-14" d="M1330 1630 H460" class="call event"/>

  <rect x="74" y="1710" width="1652" height="300" rx="18" class="alt"/><rect x="105" y="1694" width="365" height="32" rx="16" class="branch"/><text x="287" y="1716" text-anchor="middle" class="branchText">alt permit / Hikari / lock timeout</text>
  <rect x="600" y="1740" width="565" height="34" rx="17" class="labelPill redLabel"/><circle cx="624" cy="1757" r="13" class="badge redBadge"/><text x="624" y="1762" text-anchor="middle" class="num redText">15</text><text x="648" y="1762" class="msg redText">503 BACKEND_TIMEOUT / Retry-After; no terminal descriptor</text><path data-connector="seq-15" d="M1040 1790 H460" class="call warning"/>
  <rect x="715" y="1820" width="500" height="34" rx="17" class="labelPill amberLabel"/><circle cx="739" cy="1837" r="13" class="badge amberBadge"/><text x="739" y="1842" text-anchor="middle" class="num amberText">16</text><text x="763" y="1842" class="msg amberText">release actual command owner with bounded retry</text><path data-connector="seq-16" d="M460 1870 H1330" class="call event"/>
  <rect x="180" y="1900" width="365" height="34" rx="17" class="labelPill blueLabel"/><circle cx="204" cy="1917" r="13" class="badge blueBadge"/><text x="204" y="1922" text-anchor="middle" class="num blueText">17</text><text x="228" y="1922" class="msg blueText">retry same key after backend recovery</text><path data-connector="seq-17" d="M170 1950 H460" class="call http"/>

  <rect x="74" y="2070" width="1652" height="220" rx="18" class="alt"/><rect x="105" y="2054" width="315" height="32" rx="16" class="branch"/><text x="262" y="2076" text-anchor="middle" class="branchText">loop bounded worker recovery</text>
  <rect x="1225" y="2100" width="430" height="34" rx="17" class="labelPill amberLabel"/><circle cx="1249" cy="2117" r="13" class="badge amberBadge"/><text x="1249" y="2122" text-anchor="middle" class="num amberText">18</text><text x="1273" y="2122" class="msg amberText">acquire WORKER permit (1 s)</text><path data-connector="seq-18" d="M1620 2150 H1040" class="call event"/>
  <rect x="1045" y="2160" width="500" height="34" rx="17" class="labelPill recoveryLabel"/><circle cx="1069" cy="2177" r="13" class="badge recoveryBadge"/><text x="1069" y="2182" text-anchor="middle" class="num recoveryText">19</text><text x="1093" y="2182" class="msg recoveryText">claim owner/revision CAS + bounded SKIP LOCKED chunk</text><path data-connector="seq-19" d="M1040 2210 H1330" class="call recovery"/>
  <rect x="1315" y="2220" width="410" height="34" rx="17" class="labelPill tealLabel"/><circle cx="1339" cy="2237" r="13" class="badge tealBadge"/><text x="1339" y="2242" text-anchor="middle" class="num tealText">20</text><text x="1363" y="2242" class="msg tealText">checkpoint renews; stale finalize rejected</text><path data-connector="seq-20" d="M1330 2270 H1620" class="return"/>

  <rect x="180" y="2305" width="1440" height="42" rx="16" class="noteBox"/><text x="900" y="2332" text-anchor="middle" class="note">SSE uses its three-permit read lane for snapshot and polling only; subscriber writes never hold JDBC.</text>
  <text x="900" y="2370" text-anchor="middle" class="footer">Same-key retries do not duplicate effects; Redis degradation never changes PostgreSQL terminal truth.</text>
</svg>
