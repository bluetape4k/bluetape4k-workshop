<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1580" height="740" viewBox="0 0 1580 740" role="img" aria-label="Chaos Monkey assault flow">
  <defs><filter id="shadow" x="-8%" y="-8%" width="116%" height="124%"><feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#64748B" flood-opacity="0.15"/></filter><marker id="arrowBlue" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 14 7 L 0 14 Z" fill="#2563EB"/></marker><marker id="arrowRed" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 14 7 L 0 14 Z" fill="#DC2626"/></marker><style>.canvas{fill:#F8FAFC}.frame{fill:#FFFFFF;stroke:#D6E0E8;stroke-width:1.4}.title{font-family:"Architects Daughter";font-size:38px;fill:#102033}.subtitle{font-family:"Comic Mono";font-size:15px;fill:#51606F}.cardTitle{font-family:"Architects Daughter";font-size:27px;fill:#102033}.cardText{font-family:"Comic Mono";font-size:15px;fill:#415166}.line{fill:none;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round}.msg{font-family:"Comic Mono";font-size:15px;fill:#334155}</style></defs>
  <rect class="canvas" width="1580" height="740"/><rect class="frame" x="24" y="24" width="1532" height="692" rx="24"/>
  <text class="title" x="790" y="72" text-anchor="middle">Chaos Monkey request path</text><text class="subtitle" x="790" y="104" text-anchor="middle">With the chaos-monkey profile active, watched beans can receive latency or exception assaults before returning a response.</text>
  <g filter="url(#shadow)"><rect x="90" y="170" width="240" height="78" rx="14" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.7"/><text class="cardTitle" x="210" y="204" text-anchor="middle">Client</text><text class="cardText" x="210" y="230" text-anchor="middle">GET /students</text></g>
  <g filter="url(#shadow)"><rect x="420" y="170" width="260" height="78" rx="14" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.7"/><text class="cardTitle" x="550" y="204" text-anchor="middle">Watcher</text><text class="cardText" x="550" y="230" text-anchor="middle">restController=true</text></g>
  <g filter="url(#shadow)"><rect x="780" y="170" width="260" height="78" rx="14" fill="#F0FDF4" stroke="#16A34A" stroke-width="1.7"/><text class="cardTitle" x="910" y="204" text-anchor="middle">StudentService</text><text class="cardText" x="910" y="230" text-anchor="middle">service=true</text></g>
  <g filter="url(#shadow)"><rect x="1140" y="170" width="260" height="78" rx="14" fill="#FFF7ED" stroke="#EA580C" stroke-width="1.7"/><text class="cardTitle" x="1270" y="204" text-anchor="middle">H2 table</text><text class="cardText" x="1270" y="230" text-anchor="middle">student rows</text></g>
  <path class="line" d="M 210 320 L 550 320" stroke="#2563EB" marker-end="url(#arrowBlue)"/><text class="msg" x="380" y="304" text-anchor="middle">1. call watched endpoint</text>
  <path class="line" d="M 550 400 L 910 400" stroke="#DC2626" marker-end="url(#arrowRed)"/><text class="msg" x="730" y="384" text-anchor="middle">2. inject latency or exception</text>
  <path class="line" d="M 910 480 L 1270 480" stroke="#2563EB" marker-end="url(#arrowBlue)"/><text class="msg" x="1090" y="464" text-anchor="middle">3. normal repository path when allowed</text>
  <path class="line" d="M 1270 560 L 210 560" stroke="#2563EB" marker-end="url(#arrowBlue)"/><text class="msg" x="740" y="544" text-anchor="middle">4. response is delayed, failed, or returned normally</text>
</svg>
