<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="1040" viewBox="0 0 1680 1040" role="img" aria-label="Spring MVC virtual thread architecture">
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .title { font-family: 'Architects Daughter', 'Comic Sans MS', cursive; font-size: 34px; fill: #172033; }
      .subtitle { font-family: 'Comic Mono', 'Comic Sans MS', monospace; font-size: 17px; fill: #5b6675; }
      .layer-title { font-family: 'Architects Daughter', 'Comic Sans MS', cursive; font-size: 26px; fill: #263244; }
      .card-title { font-family: 'Architects Daughter', 'Comic Sans MS', cursive; font-size: 28px; fill: #111827; }
      .body { font-family: 'Comic Mono', 'Comic Sans MS', monospace; font-size: 17px; fill: #3d4654; }
      .small { font-family: 'Comic Mono', 'Comic Sans MS', monospace; font-size: 15px; fill: #4b5563; }
      .layer { stroke-width: 1.5; rx: 24; ry: 24; }
      .card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; rx: 18; ry: 18; }
      .service { fill: #f0f9ff; stroke: #93c5fd; }
      .exec { fill: #f0fdf4; stroke: #86efac; }
      .data { fill: #fff7ed; stroke: #fdba74; }
      .line { fill: none; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
      .icon-stroke { fill: none; stroke: #334155; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    </style>
    <marker id="blueArrow" viewBox="0 0 10 10" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#2563eb" stroke-dasharray="none"/>
    </marker>
    <marker id="greenArrow" viewBox="0 0 10 10" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#16a34a" stroke-dasharray="none"/>
    </marker>
    <marker id="orangeArrow" viewBox="0 0 10 10" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#ea580c" stroke-dasharray="none"/>
    </marker>
  </defs>

  <rect class="bg" width="1680" height="1040"/>
  <text class="title" x="70" y="66">Spring MVC on Virtual Threads</text>
  <text class="subtitle" x="70" y="96">Tomcat requests, MVC controllers, blocking JPA/HTTP work, and bluetape4k virtual-thread helpers</text>

  <rect class="layer service" x="70" y="135" width="1540" height="220"/>
  <text class="layer-title" x="105" y="180">Request Surface</text>
  <rect class="card" x="135" y="215" width="310" height="94"/>
  <text class="card-title" x="290" y="252" text-anchor="middle">WebTestClient</text>
  <text class="body" x="290" y="282" text-anchor="middle">controller tests</text>
  <rect class="card" x="510" y="215" width="310" height="94"/>
  <text class="card-title" x="665" y="252" text-anchor="middle">Gatling</text>
  <text class="body" x="665" y="282" text-anchor="middle">JPA load scenario</text>
  <rect class="card" x="885" y="215" width="310" height="94"/>
  <text class="card-title" x="1040" y="252" text-anchor="middle">Client</text>
  <text class="body" x="1040" y="282" text-anchor="middle">HTTP requests</text>
  <rect class="card" x="1260" y="215" width="285" height="94"/>  <text class="card-title" x="1402" y="252" text-anchor="middle">Spring Boot</text>
  <text class="body" x="1402" y="282" text-anchor="middle">application bootstrap</text>

  <rect class="layer service" x="70" y="405" width="1540" height="250"/>
  <text class="layer-title" x="105" y="450">MVC Runtime</text>
  <rect class="card" x="135" y="485" width="350" height="110"/>
  <path class="icon-stroke" d="M177 523h42m-33-18h24m-14 18v37m-24 0h48"/>
  <text class="card-title" x="330" y="522" text-anchor="middle">Embedded Tomcat</text>
  <text class="body" x="330" y="552" text-anchor="middle">protocol handler uses</text>
  <text class="body" x="330" y="576" text-anchor="middle">virtual thread executor</text>
  <rect class="card" x="565" y="485" width="290" height="110"/>
  <text class="card-title" x="710" y="528" text-anchor="middle">VirtualThread</text>
  <text class="body" x="710" y="558" text-anchor="middle">demo endpoints</text>
  <rect class="card" x="930" y="485" width="290" height="110"/>
  <text class="card-title" x="1075" y="528" text-anchor="middle">Member / Team</text>
  <text class="body" x="1075" y="558" text-anchor="middle">MVC + JPA endpoints</text>
  <rect class="card" x="1295" y="485" width="250" height="110"/>  <text class="card-title" x="1420" y="528" text-anchor="middle">Httpbin</text>
  <text class="body" x="1420" y="558" text-anchor="middle">blocking HTTP call</text>

  <rect class="layer exec" x="70" y="705" width="1540" height="145"/>
  <text class="layer-title" x="105" y="750">Virtual-Thread Execution Helpers</text>
  <rect class="card" x="250" y="765" width="360" height="60"/>
  <text class="card-title" x="430" y="804" text-anchor="middle">structuredTaskScopeAll</text>
  <rect class="card" x="690" y="765" width="260" height="60"/>
  <text class="card-title" x="820" y="804" text-anchor="middle">virtualFutureAll</text>
  <rect class="card" x="1060" y="765" width="280" height="60"/>
  <text class="card-title" x="1200" y="804" text-anchor="middle">@Async Executor</text>

  <rect class="layer data" x="70" y="895" width="1540" height="105"/>
  <text class="layer-title" x="105" y="956">Blocking Targets</text>
  <rect class="card" x="380" y="915" width="290" height="65"/>
  <text class="card-title" x="525" y="956" text-anchor="middle">JPA / Querydsl</text>
  <rect class="card" x="760" y="915" width="260" height="65"/>
  <ellipse cx="810" cy="940" rx="30" ry="11" fill="#fff0d8" stroke="#8c6f33" stroke-width="3"/>
  <path d="M780 940v25c0 7 13 12 30 12s30-5 30-12v-25" fill="#fff0d8" stroke="#8c6f33" stroke-width="3"/>
  <path d="M780 956c0 7 13 12 30 12s30-5 30-12" fill="none" stroke="#8c6f33" stroke-width="2.5"/>
  <text class="card-title" x="910" y="956" text-anchor="middle">H2 DB</text>
  <rect class="card" x="1110" y="915" width="310" height="65"/>  <text class="card-title" x="1265" y="956" text-anchor="middle">Testcontainers Httpbin</text>

  <path class="line" d="M1040 309 L1040 380 L310 380 L310 485" stroke="#2563eb" marker-end="url(#blueArrow)" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="line" d="M665 309 L665 382 L310 382 L310 485" stroke="#2563eb" marker-end="url(#blueArrow)" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="line" d="M310 595 L310 675 L430 675 L430 765" stroke="#16a34a" marker-end="url(#greenArrow)" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="line" d="M710 595 L710 675 L820 675 L820 765" stroke="#16a34a" marker-end="url(#greenArrow)" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="line" d="M1420 595 L1420 690 L1200 690 L1200 765" stroke="#16a34a" marker-end="url(#greenArrow)" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="line" d="M1075 595 L1075 680 L980 680 L980 890 L525 890 L525 915" stroke="#ea580c" marker-end="url(#orangeArrow)" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="line" d="M670 948 L760 948" stroke="#ea580c" marker-end="url(#orangeArrow)" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="line" d="M1420 595 L1420 875 L1265 875 L1265 915" stroke="#ea580c" marker-end="url(#orangeArrow)" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
