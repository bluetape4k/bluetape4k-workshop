  <text class="layer-title" x="105" y="750">Virtual-Thread Execution Helpers</text>
  <rect class="card" x="250" y="765" width="360" height="60"/>
  <text class="card-title" x="430" y="804" text-anchor="middle">structuredTaskScopeAll</text>
  <rect class="card" x="690" y="765" width="260" height="60"/>
  <text class="card-title" x="820" y="804" text-anchor="middle">virtualFutureAll</text>
  <rect class="card" x="1060" y="765" width="280" height="60"/>
  <text class="card-title" x="1200" y="804" text-anchor="middle">@Async Executor</text>

