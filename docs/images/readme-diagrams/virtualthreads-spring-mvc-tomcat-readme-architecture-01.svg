  <text class="body" x="1075" y="558" text-anchor="middle">MVC + JPA endpoints</text>
  <rect class="card" x="1295" y="485" width="250" height="110"/>  <text class="card-title" x="1420" y="528" text-anchor="middle">Httpbin</text>
  <text class="body" x="1420" y="558" text-anchor="middle">blocking HTTP call</text>

