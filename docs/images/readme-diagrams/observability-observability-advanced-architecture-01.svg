<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-label="Observability Advanced Architecture">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#1f2937" flood-opacity="0.10"/></filter>
  <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth">
    <path d="M1,1 L8,4.5 L1,8 Z" fill="#758297"/>
  </marker>
  <style>
    .canvas{fill:#f7f9fc}.frame{fill:#fff;stroke:#d8e0ea;stroke-width:1.5}
    .title{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:38px;font-weight:400;fill:#102033}
    .subtitle{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:14px;font-weight:400;fill:#536273}
    .smallLabel{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:21px;font-weight:400;fill:#102033}
    .mono{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#102033}
    .small{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#536273}
    .card{stroke-width:2.1;filter:url(#shadow)}
    .line{stroke:#758297;stroke-width:2.1;fill:none;marker-end:url(#arrow)}
  </style>
</defs>
<!-- Layout:
     Canvas: 960×560  Frame: x=24 y=20 w=912 h=516
     Row1  y=98  h=54  UserController center x=260 w=440 cx=480
     Row2  y=212 h=80  UserService center x=260 w=440 cx=480
     Row3  y=352 h=80  Col1: x=24 w=420 cx=234 (UserCacheRepository)
                        Col2: x=516 w=420 cx=726 (UserRepository)
     Row4  y=492 h=44  Col1: x=24 w=420 cx=234 (Redis)
                        Col2: x=516 w=420 cx=726 (H2 Database)
     Gap col1 right=444 < col2 left=516 ✓ (gap=72px)
-->
<rect class="canvas" width="960" height="560"/>
<rect class="frame" x="24" y="20" width="912" height="516" rx="28"/>
<text class="title" x="58" y="66">Observability Advanced</text>
<text class="subtitle" x="58" y="92">UserController · UserService · Cache-Aside Pattern · Redis · H2/Exposed · Observation Spans</text>

<!-- Arrows -->
<!-- UserController → UserService (straight down) -->
<path class="line" d="M480 152 L480 212"/>
<!-- UserService → UCR + UR (fan-out bus y=332, both start from UserService bottom) -->
<path class="line" d="M480 292 L480 332 L234 332 L234 352"/>
<path class="line" d="M480 292 L480 332 L726 332 L726 352"/>
<!-- UCR → Redis, UR → H2 (straight down) -->
<path class="line" d="M234 432 L234 492"/>
<path class="line" d="M726 432 L726 492"/>

<!-- UserController (center top) -->
<g transform="translate(260,98)">
  <rect class="card" x="0" y="0" width="440" height="54" rx="12" fill="#E8F3FF" stroke="#5B8DEF"/>
  <text class="smallLabel" x="220" y="22" text-anchor="middle">UserController</text>
  <text class="mono" x="220" y="42" text-anchor="middle">GET /users/{id} · POST /users · suspend fun</text>
</g>

<!-- UserService (center) -->
<g transform="translate(260,212)">
  <rect class="card" x="0" y="0" width="440" height="80" rx="12" fill="#EAF7EF" stroke="#58A978"/>
  <text class="smallLabel" x="220" y="22" text-anchor="middle">UserService</text>
  <text class="mono" x="220" y="44" text-anchor="middle">observed("user.service.get") · cache-aside pattern</text>
  <text class="small" x="220" y="64" text-anchor="middle">cache hit → return · miss → DB fetch → cache put</text>
</g>

<!-- UserCacheRepository col1 -->
<g transform="translate(24,352)">
  <rect class="card" x="0" y="0" width="420" height="80" rx="12" fill="#E9F7F6" stroke="#45A7A1"/>
  <text class="smallLabel" x="210" y="22" text-anchor="middle">UserCacheRepository</text>
  <text class="mono" x="210" y="44" text-anchor="middle">observed("user.cache.get/put")</text>
  <text class="small" x="210" y="64" text-anchor="middle">RMapCache&lt;Long, User&gt; · TTL 60s · Redisson</text>
</g>

<!-- UserRepository col2 -->
<g transform="translate(516,352)">
  <rect class="card" x="0" y="0" width="420" height="80" rx="12" fill="#FFF3D9" stroke="#D6A441"/>
  <text class="smallLabel" x="210" y="22" text-anchor="middle">UserRepository</text>
  <text class="mono" x="210" y="44" text-anchor="middle">observed("user.db.find/save")</text>
  <text class="small" x="210" y="64" text-anchor="middle">withContext(IO) · transaction {} · Exposed JDBC</text>
</g>

<!-- Redis col1 -->
<g transform="translate(24,492)">
  <rect class="card" x="0" y="0" width="420" height="44" rx="12" fill="#F1ECFF" stroke="#8A72D6"/>
  <text class="smallLabel" x="210" y="18" text-anchor="middle">Redis</text>
  <text class="small" x="210" y="36" text-anchor="middle">Redisson · Testcontainers singleton · RMapCache</text>
</g>

<!-- H2 Database col2 -->
<g transform="translate(516,492)">
  <rect class="card" x="0" y="0" width="420" height="44" rx="12" fill="#FDECEF" stroke="#DC6B82"/>
  <text class="smallLabel" x="210" y="18" text-anchor="middle">H2 Database</text>
  <text class="small" x="210" y="36" text-anchor="middle">Exposed · Users table · Testcontainers</text>
</g>
</svg>
