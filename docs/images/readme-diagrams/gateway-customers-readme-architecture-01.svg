<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="880" viewBox="0 0 1500 880" role="img" aria-label="Gateway customers service architecture">
  <defs>
    <filter id="shadow" x="-8%" y="-10%" width="116%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#5b7282" flood-opacity="0.15"/>
    </filter>
    <marker id="blueArrow" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" viewBox="0 0 10.7692 10.7692" refX="9" refY="5" orient="auto" data-role="primary" data-tip-direction="positive-x"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#457b9d" stroke-dasharray="none" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="greenArrow" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" viewBox="0 0 10.7692 10.7692" refX="9" refY="5" orient="auto" data-role="primary" data-tip-direction="positive-x"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#5f8f5b" stroke-dasharray="none" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="goldArrow" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" viewBox="0 0 11.6667 11.6667" refX="9" refY="5" orient="auto" data-role="primary" data-tip-direction="positive-x"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#a87332" stroke-dasharray="none" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <style>
      .canvas { fill: #f7fafc; }
      .frame { fill: #fffefd; stroke: #cdd8df; stroke-width: 2; }
      .title { font-family: "Architects Daughter"; font-size: 38px; fill: #1d2b38; }
      .subtitle { font-family: "Comic Mono"; font-size: 16px; fill: #516172; }
      .layerTitle { font-family: "Architects Daughter"; font-size: 24px; fill: #263747; }
      .cardTitle { font-family: "Architects Daughter"; font-size: 26px; fill: #1d2b38; }
      .cardText { font-family: "Comic Mono"; font-size: 15px; fill: #42515f; }
      .smallText { font-family: "Comic Mono"; font-size: 13px; fill: #566575; }
      .layer { stroke-width: 1.6; }
      .card { stroke-width: 2.2; filter: url(#shadow); }
      .lineBlue { fill: none; stroke: #457b9d; stroke-width: 4.2; marker-end: url(#blueArrow); stroke-linecap: round; stroke-linejoin: round; }
      .lineGreen { fill: none; stroke: #5f8f5b; stroke-width: 4.2; marker-end: url(#greenArrow); stroke-linecap: round; stroke-linejoin: round; }
      .lineGold { fill: none; stroke: #a87332; stroke-width: 3.8; marker-end: url(#goldArrow); stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 9 8; }
      .label { font-family: "Comic Mono"; font-size: 14px; font-weight: 700; }
      .labelBox { fill: #ffffff; stroke-width: 1.4; }
    </style>
  </defs>

  <rect class="canvas" width="1500" height="880"/>
  <rect class="frame" x="28" y="28" width="1444" height="824" rx="24"/>
  <text class="title" x="750" y="84" text-anchor="middle">Customers Service</text>
  <text class="subtitle" x="750" y="114" text-anchor="middle">A small WebFlux backend for the gateway workshop, running on port 8081.</text>

  <rect class="layer" x="82" y="164" width="300" height="560" rx="18" fill="#eef6ff" stroke="#b5cfe8"/>
  <text class="layerTitle" x="232" y="207" text-anchor="middle">Caller</text>

  <rect class="layer" x="442" y="164" width="608" height="560" rx="18" fill="#f3fbf0" stroke="#b7d4ae"/>
  <text class="layerTitle" x="746" y="207" text-anchor="middle">Customer Application</text>

  <rect class="layer" x="1110" y="164" width="308" height="560" rx="18" fill="#fff8ea" stroke="#dec289"/>
  <text class="layerTitle" x="1264" y="207" text-anchor="middle">Support</text>

  <rect class="card" x="132" y="302" width="200" height="136" rx="14" fill="#ffffff" stroke="#8eb4d6"/>
  <text class="cardTitle" x="232" y="354" text-anchor="middle">Gateway</text>
  <text class="cardText" x="232" y="386" text-anchor="middle">forwards to :8081</text>
  <text class="smallText" x="232" y="414" text-anchor="middle">/api/v1/customers</text>

  <rect class="card" x="132" y="512" width="200" height="108" rx="14" fill="#ffffff" stroke="#8eb4d6"/>
  <text class="cardTitle" x="232" y="554" text-anchor="middle">Browser</text>
  <text class="cardText" x="232" y="586" text-anchor="middle">opens /</text>

  <rect class="card" x="498" y="250" width="418" height="126" rx="14" fill="#ffffff" stroke="#91b884"/>
  <text class="cardTitle" x="707" y="294" text-anchor="middle">Customer Controller</text>
  <text class="cardText" x="707" y="326" text-anchor="middle">GET /api/v1/customers</text>
  <text class="smallText" x="707" y="352" text-anchor="middle">suspend endpoint returns sample data</text>

  <rect class="card" x="498" y="432" width="418" height="86" rx="14" fill="#f9fbff" stroke="#9db4c8"/>
  <text class="cardTitle" x="707" y="469" text-anchor="middle">Customer</text>
  <text class="smallText" x="707" y="496" text-anchor="middle">Winter, Spring</text>

  <rect class="card" x="498" y="592" width="418" height="126" rx="14" fill="#fffdf6" stroke="#c39a56"/>
  <text class="cardTitle" x="707" y="636" text-anchor="middle">RedirectWebFilter</text>
  <text class="cardText" x="707" y="668" text-anchor="middle">/ -> /swagger-ui.html</text>
  <text class="smallText" x="707" y="694" text-anchor="middle">default landing page</text>

  <rect class="card" x="1160" y="258" width="210" height="118" rx="14" fill="#fffefa" stroke="#d2a85e"/>
  <text class="cardTitle" x="1265" y="300" text-anchor="middle">SwaggerConfig</text>
  <text class="smallText" x="1265" y="329" text-anchor="middle">OpenAPI metadata</text>
  <text class="smallText" x="1265" y="352" text-anchor="middle">BuildProperties</text>

  <rect class="card" x="1160" y="460" width="210" height="130" rx="14" fill="#fffefa" stroke="#d2a85e"/>
  <text class="cardTitle" x="1265" y="502" text-anchor="middle">Observation</text>
  <text class="smallText" x="1265" y="532" text-anchor="middle">ObservedAspect</text>
  <text class="smallText" x="1265" y="555" text-anchor="middle">MeterFilter excludes</text>
  <text class="smallText" x="1265" y="578" text-anchor="middle">actuator/api-docs</text>

  <path class="lineBlue" d="M 332 370 H 498" stroke-linecap="round" stroke-linejoin="round"/>
  <rect class="labelBox" x="356" y="328" width="112" height="30" rx="15" stroke="#8eb4d6"/>
  <text class="label" x="412" y="348" text-anchor="middle" fill="#457b9d">service API</text>

  <path class="lineGreen" d="M 707 376 V 432" stroke-linecap="round" stroke-linejoin="round"/>
  <rect class="labelBox" x="730" y="388" width="116" height="30" rx="15" stroke="#91b884"/>
  <text class="label" x="788" y="408" text-anchor="middle" fill="#5f8f5b">returns list</text>

  <path class="lineGold" d="M 332 566 L 446 566 Q 426 566 426 576 L 426 645 Q 426 655 466 655 L 498 655" stroke-linecap="round" stroke-linejoin="round"/>
  <rect class="labelBox" x="356" y="606" width="88" height="30" rx="15" stroke="#d5a656"/>
  <text class="label" x="400" y="626" text-anchor="middle" fill="#a87332">root</text>

  <path class="lineGold" d="M 916 655 L 1060 655 Q 1070 655 1070 645 L 1070 327 Q 1070 317 1080 317 L 1160 317" stroke-linecap="round" stroke-linejoin="round"/>
  <rect class="labelBox" x="944" y="536" width="116" height="30" rx="15" stroke="#d5a656"/>
  <text class="label" x="1002" y="556" text-anchor="middle" fill="#a87332">swagger</text>

  <path class="lineGold" d="M 916 313 L 1074 313 Q 1084 313 1084 323 L 1084 515 Q 1084 525 1094 525 L 1160 525" stroke-linecap="round" stroke-linejoin="round"/>
  <rect class="labelBox" x="966" y="268" width="116" height="30" rx="15" stroke="#d5a656"/>
  <text class="label" x="1024" y="288" text-anchor="middle" fill="#a87332">metrics</text>
</svg>
