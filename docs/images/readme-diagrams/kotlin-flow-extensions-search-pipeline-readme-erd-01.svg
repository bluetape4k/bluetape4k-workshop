<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="720" viewBox="0 0 1120 720" role="img" aria-labelledby="title desc">
  <title id="title">Search Pipeline Domain Model</title>
  <desc id="desc">Domain model for query, settings, request, result, and adapter types.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9 z" fill="#3b4b5f"/>
    </marker>
    <style>
      .title { font-family: 'Architects Daughter', 'Comic Mono', sans-serif; font-size: 34px; fill: #1f2937; }
      .entity-name, .field, .note { font-family: 'Comic Mono', 'Architects Daughter', sans-serif; fill: #263238; }
      .entity-name { font-size: 19px; font-weight: 700; }
      .field { font-size: 14px; }
      .note { font-size: 13px; fill: #52616f; }
      .entity { fill: #ffffff; stroke: #3b4b5f; stroke-width: 2.5; rx: 7; }
      .validated { stroke: #2d9d78; }
      .adapter { stroke: #c78a15; }
      .edge { fill: none; stroke: #3b4b5f; stroke-width: 2.5; marker-end: url(#arrow); }
      .muted { stroke-dasharray: 8 6; }
    </style>
  </defs>
  <rect width="1120" height="720" fill="#fbfcfe"/>
  <text class="title" x="560" y="56" text-anchor="middle">Search Pipeline Domain Model</text>

  <g transform="translate(80 110)">
    <rect class="entity validated" x="0" y="0" width="250" height="156"/>
    <text class="entity-name" x="22" y="34">SearchQuery</text>
    <text class="field" x="22" y="68">text: String</text>
    <text class="field" x="22" y="96">trim + non-blank</text>
    <text class="field" x="22" y="124">length 1..64</text>
    <text class="note" x="22" y="146">regular class, no copy</text>
  </g>

  <g transform="translate(80 364)">
    <rect class="entity validated" x="0" y="0" width="250" height="194"/>
    <text class="entity-name" x="22" y="34">SearchSettings</text>
    <text class="field" x="22" y="68">tenantId: String</text>
    <text class="field" x="22" y="96">locale: Locale</text>
    <text class="field" x="22" y="124">mode: SearchMode</text>
    <text class="field" x="22" y="152">featureFlags: Set</text>
    <text class="field" x="22" y="180">resultLimit: Int</text>
  </g>

  <g transform="translate(435 246)">
    <rect class="entity" x="0" y="0" width="250" height="156"/>
    <text class="entity-name" x="22" y="34">SearchRequest</text>
    <text class="field" x="22" y="72">query: SearchQuery</text>
    <text class="field" x="22" y="104">settings: SearchSettings</text>
    <text class="note" x="22" y="136">settings snapshot per query</text>
  </g>

  <g transform="translate(790 110)">
    <rect class="entity" x="0" y="0" width="250" height="156"/>
    <text class="entity-name" x="22" y="34">SearchResult</text>
    <text class="field" x="22" y="72">request: SearchRequest</text>
    <text class="field" x="22" y="104">hits: List&lt;SearchHit&gt;</text>
    <text class="field" x="22" y="136">source: String</text>
  </g>

  <g transform="translate(790 364)">
    <rect class="entity" x="0" y="0" width="250" height="156"/>
    <text class="entity-name" x="22" y="34">SearchHit</text>
    <text class="field" x="22" y="72">id: String</text>
    <text class="field" x="22" y="104">title: String</text>
    <text class="field" x="22" y="136">score: Int</text>
  </g>

  <g transform="translate(435 520)">
    <rect class="entity adapter" x="0" y="0" width="250" height="102"/>
    <text class="entity-name" x="22" y="36">SearchAdapter</text>
    <text class="field" x="22" y="72">suspend search(request)</text>
  </g>

  <path class="edge" d="M 330 188 L 374 188 Q 382 188 382 196 L 382 292 Q 382 300 390 300 L 435 300"/>
  <path class="edge" d="M 330 450 L 374 450 Q 382 450 382 442 L 382 356 Q 382 348 390 348 L 435 348"/>
  <path class="edge" d="M 685 300 L 727 300 Q 735 300 735 292 L 735 196 Q 735 188 743 188 L 790 188"/>
  <path class="edge" d="M 915 266 L 915 364"/>
  <path class="edge muted" d="M 560 402 L 560 520"/>
</svg>
