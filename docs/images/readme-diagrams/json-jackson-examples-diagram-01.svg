<svg xmlns="http://www.w3.org/2000/svg" width="920" height="460" viewBox="0 0 920 460" role="img" aria-label="Jackson 3 Examples Architecture">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#1f2937" flood-opacity="0.10"/></filter>
  <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth">
    <path d="M1,1 L8,4.5 L1,8 Z" fill="#758297"/>
  </marker>
  <style>
    .canvas{fill:#f7f9fc}.frame{fill:#fff;stroke:#d8e0ea;stroke-width:1.5}
    .title{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:38px;font-weight:400;fill:#102033}
    .subtitle{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:14px;font-weight:400;fill:#536273}
    .smallLabel{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:21px;font-weight:400;fill:#102033}
    .mono{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#102033}
    .small{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#536273}
    .card{stroke-width:2.1;filter:url(#shadow)}
    .line{stroke:#758297;stroke-width:2.1;fill:none;marker-end:url(#arrow)}
  </style>
</defs>
<!-- Layout:
     Canvas: 920×460  Frame: x=24 y=20 w=872 h=416
     Row1  y=98  h=54  (ObjectMapper: center x=220 w=480 cx=460)
     Row2  y=212 h=80  (3 cols w=260 gap=46: Input | Modules | Output)
     Row3  y=352 h=80  (Annotations: full width)
-->
<rect class="canvas" width="920" height="460"/>
<rect class="frame" x="24" y="20" width="872" height="416" rx="28"/>
<text class="title" x="58" y="66">Jackson 3 Examples</text>
<text class="subtitle" x="58" y="92">Jackson.defaultJsonMapper · KotlinModule · JavaTimeModule · Blackbird · bluetape4k-jackson3</text>

<!-- Arrows -->
<!-- Input → ObjectMapper -->
<path class="line" d="M154 152 L154 182 L400 182 L400 212"/>
<!-- ObjectMapper → Output -->
<path class="line" d="M520 152 L520 182 L766 182 L766 212"/>
<!-- ObjectMapper → Annotations -->
<path class="line" d="M460 152 L460 182 L460 212"/>
<!-- ObjectMapper → Annotation features (bottom) -->
<path class="line" d="M460 292 L460 352"/>

<!-- ObjectMapper (center top) -->
<g transform="translate(220,98)">
  <rect class="card" x="0" y="0" width="480" height="54" rx="12" fill="#EAF7EF" stroke="#58A978"/>
  <text class="smallLabel" x="240" y="22" text-anchor="middle">Jackson.defaultJsonMapper</text>
  <text class="small" x="240" y="42" text-anchor="middle">KotlinModule + JavaTimeModule + Blackbird — pre-registered by bluetape4k</text>
</g>

<!-- Input col1 -->
<g transform="translate(24,212)">
  <rect class="card" x="0" y="0" width="260" height="80" rx="12" fill="#E8F3FF" stroke="#5B8DEF"/>
  <text class="smallLabel" x="130" y="22" text-anchor="middle">Input</text>
  <text class="mono" x="130" y="44" text-anchor="middle">Kotlin data class</text>
  <text class="small" x="130" y="64" text-anchor="middle">Java POJO · Java Time API</text>
</g>

<!-- ObjectMapper center col2 (arrow pass-through) -->
<g transform="translate(330,212)">
  <rect class="card" x="0" y="0" width="260" height="80" rx="12" fill="#E9F7F6" stroke="#45A7A1"/>
  <text class="smallLabel" x="130" y="22" text-anchor="middle">ObjectMapper</text>
  <text class="mono" x="130" y="44" text-anchor="middle">writeValueAsString(obj)</text>
  <text class="mono" x="130" y="64" text-anchor="middle">readValue(json, T::class)</text>
</g>

<!-- Output col3 -->
<g transform="translate(636,212)">
  <rect class="card" x="0" y="0" width="260" height="80" rx="12" fill="#FFF3D9" stroke="#D6A441"/>
  <text class="smallLabel" x="130" y="22" text-anchor="middle">JSON Output</text>
  <text class="mono" x="130" y="44" text-anchor="middle">String · ByteArray</text>
  <text class="small" x="130" y="64" text-anchor="middle">InputStream · OutputStream</text>
</g>

<!-- Annotation features (full width bottom) -->
<g transform="translate(24,352)">
  <rect class="card" x="0" y="0" width="872" height="80" rx="12" fill="#F1ECFF" stroke="#8A72D6"/>
  <text class="smallLabel" x="436" y="22" text-anchor="middle">Key Annotations</text>
  <text class="mono" x="436" y="44" text-anchor="middle">@JsonIgnore · @JsonProperty · @JsonUnwrapped · @JsonView · @JsonTypeInfo · @JsonSubTypes</text>
  <text class="small" x="436" y="64" text-anchor="middle">@JsonRawValue · @JsonRootValue · @JsonManagedReference / @JsonBackReference · @JsonAnySetter / @JsonAnyGetter</text>
</g>
</svg>
