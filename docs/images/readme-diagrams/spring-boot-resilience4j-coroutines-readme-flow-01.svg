<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1840" height="980" viewBox="0 0 1840 980" role="img" aria-label="Spring Boot Resilience4j coroutine request and decorator flow">
  <defs>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#64748B" flood-opacity="0.15"/>
    </filter>
    <marker id="arrowBlue" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 14 7 L 0 14 Z" fill="#2563EB" stroke-dasharray="none"/>
    </marker>
    <marker id="arrowGreen" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 14 7 L 0 14 Z" fill="#16A34A" stroke-dasharray="none"/>
    </marker>
    <marker id="arrowOrange" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 14 7 L 0 14 Z" fill="#EA580C" stroke-dasharray="none"/>
    </marker>
    <marker id="arrowRed" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 14 7 L 0 14 Z" fill="#DC2626" stroke-dasharray="none"/>
    </marker>
    <style>
      .canvas{fill:#F8FAFC}.frame{fill:#FFFFFF;stroke:#D6E0E8;stroke-width:1.4}.lane{stroke-width:1.6;rx:24}
      .title{font-family:"Architects Daughter";font-size:42px;fill:#102033}.subtitle{font-family:"Comic Mono";font-size:16px;fill:#51606F}
      .laneTitle{font-family:"Architects Daughter";font-size:31px;fill:#243447}.cardTitle{font-family:"Architects Daughter";font-size:30px;fill:#102033}
      .cardText{font-family:"Comic Mono";font-size:15px;fill:#415166}.line{fill:none;stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round}
      .label{font-family:"Comic Mono";font-size:14px;fill:#334155}.noteTitle{font-family:"Architects Daughter";font-size:26px;fill:#102033}
      .noteText{font-family:"Comic Mono";font-size:15px;fill:#415166}
    </style>
  </defs>
  <rect class="canvas" width="1840" height="980"/>
  <rect class="frame" x="24" y="24" width="1792" height="932" rx="26"/>
  <text class="title" x="920" y="74" text-anchor="middle">Annotation path versus suspend decorator path</text>
  <text class="subtitle" x="920" y="108" text-anchor="middle">The sample keeps normal Spring AOP paths, then uses bluetape4k decorators when coroutine behavior must be explicit.</text>

  <rect class="lane" x="84" y="154" width="1672" height="300" fill="#EFF6FF" stroke="#BFDBFE"/>
  <text class="laneTitle" x="124" y="200">Spring AOP annotation path</text>
  <g filter="url(#shadow)">
    <rect x="145" y="250" width="230" height="74" rx="14" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.7"/>
    <text class="cardTitle" x="260" y="284" text-anchor="middle">Client</text>
    <text class="cardText" x="260" y="308" text-anchor="middle">HTTP request</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="515" y="240" width="300" height="94" rx="14" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.7"/>
    <text class="cardTitle" x="665" y="274" text-anchor="middle">Spring Controller</text>
    <text class="cardText" x="665" y="300" text-anchor="middle">BackendA or coroutine route</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="960" y="240" width="310" height="94" rx="14" fill="#FFFFFF" stroke="#16A34A" stroke-width="1.7"/>
    <text class="cardTitle" x="1115" y="274" text-anchor="middle">Resilience4j AOP</text>
    <text class="cardText" x="1115" y="300" text-anchor="middle">CircuitBreaker, Retry, Bulkhead</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="1410" y="240" width="250" height="94" rx="14" fill="#FFFFFF" stroke="#16A34A" stroke-width="1.7"/>
    <text class="cardTitle" x="1535" y="274" text-anchor="middle">Service call</text>
    <text class="cardText" x="1535" y="300" text-anchor="middle">success, error, fallback</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="568" y="364" width="690" height="58" rx="14" fill="#FEFCE8" stroke="#FACC15" stroke-width="1.5"/>
    <text class="noteText" x="913" y="399" text-anchor="middle">Flow retry is not handled by @Retry; use Flow.retry(retry) at the stream boundary.</text>
  </g>
  <path class="line" d="M 375 287 L 515 287" stroke="#2563EB" marker-end="url(#arrowBlue)" stroke-linecap="round" stroke-linejoin="round"/>
  <text class="label" x="445" y="268" text-anchor="middle">call endpoint</text>
  <path class="line" d="M 815 287 L 960 287" stroke="#16A34A" marker-end="url(#arrowGreen)" stroke-linecap="round" stroke-linejoin="round"/>
  <text class="label" x="887" y="268" text-anchor="middle">proxy wraps</text>
  <path class="line" d="M 1270 287 L 1410 287" stroke="#16A34A" marker-end="url(#arrowGreen)" stroke-linecap="round" stroke-linejoin="round"/>
  <text class="label" x="1340" y="268" text-anchor="middle">invoke</text>
  <path class="line" d="M 1535 334 L 1535 392 L 1294 392" stroke="#EA580C" marker-end="url(#arrowOrange)" stroke-linecap="round" stroke-linejoin="round"/>
  <text class="label" x="1450" y="374" text-anchor="middle">exception or fallback</text>

  <rect class="lane" x="84" y="520" width="1672" height="300" fill="#F0FDF4" stroke="#BBF7D0"/>
  <text class="laneTitle" x="124" y="566">Programmatic coroutine path</text>
  <g filter="url(#shadow)">
    <rect x="145" y="620" width="250" height="78" rx="14" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.7"/>
    <text class="cardTitle" x="270" y="654" text-anchor="middle">Suspend test</text>
    <text class="cardText" x="270" y="680" text-anchor="middle">or service code</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="525" y="608" width="330" height="102" rx="14" fill="#FFFFFF" stroke="#16A34A" stroke-width="1.7"/>
    <text class="cardTitle" x="690" y="642" text-anchor="middle">SuspendDecorators</text>
    <text class="cardText" x="690" y="668" text-anchor="middle">ofSupplier { suspendCall() }</text>
    <text class="cardText" x="690" y="692" text-anchor="middle">chain is visible in tests</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="995" y="608" width="310" height="102" rx="14" fill="#FFFFFF" stroke="#EA580C" stroke-width="1.7"/>
    <text class="cardTitle" x="1150" y="642" text-anchor="middle">Registry objects</text>
    <text class="cardText" x="1150" y="668" text-anchor="middle">CircuitBreaker + Retry</text>
    <text class="cardText" x="1150" y="692" text-anchor="middle">Spring-managed or test-local</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="1440" y="620" width="230" height="78" rx="14" fill="#FFFFFF" stroke="#16A34A" stroke-width="1.7"/>
    <text class="cardTitle" x="1555" y="654" text-anchor="middle">Result</text>
    <text class="cardText" x="1555" y="680" text-anchor="middle">value, retry, fallback</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="548" y="744" width="720" height="48" rx="14" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="1.5"/>
    <text class="noteText" x="908" y="774" text-anchor="middle">Suspend timeout is explicit: use withTimeout or a programmatic decorator instead of @TimeLimiter.</text>
  </g>
  <path class="line" d="M 395 659 L 525 659" stroke="#2563EB" marker-end="url(#arrowBlue)" stroke-linecap="round" stroke-linejoin="round"/>
  <text class="label" x="460" y="640" text-anchor="middle">wrap supplier</text>
  <path class="line" d="M 855 659 L 995 659" stroke="#EA580C" marker-end="url(#arrowOrange)" stroke-linecap="round" stroke-linejoin="round"/>
  <text class="label" x="925" y="640" text-anchor="middle">attach policies</text>
  <path class="line" d="M 1305 659 L 1440 659" stroke="#16A34A" marker-end="url(#arrowGreen)" stroke-linecap="round" stroke-linejoin="round"/>
  <text class="label" x="1372" y="640" text-anchor="middle">invoke()</text>
  <path class="line" d="M 1555 698 L 1555 756 L 1304 756" stroke="#DC2626" marker-end="url(#arrowRed)" stroke-linecap="round" stroke-linejoin="round"/>
  <text class="label" x="1466" y="738" text-anchor="middle">fallback branch</text>
</svg>
