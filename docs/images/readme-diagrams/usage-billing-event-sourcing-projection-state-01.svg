<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="950" viewBox="0 0 1600 950" role="img" aria-labelledby="title desc"><title id="title">Projection Generation State Diagram</title><desc id="desc">Shadow rebuilds fail in isolation and switch only after a fenced catch-up.</desc><defs><filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#64748B" flood-opacity="0.14"/></filter><marker id="seq-blue" viewBox="0 0 10 10" markerWidth="14" markerHeight="14" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#4F86C6" stroke="#4F86C6" stroke-dasharray="none"/></marker><marker id="seq-green" viewBox="0 0 10 10" markerWidth="14" markerHeight="14" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#6E8F4F" stroke="#6E8F4F" stroke-dasharray="none"/></marker><marker id="seq-amber" viewBox="0 0 10 10" markerWidth="14" markerHeight="14" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#9B7D54" stroke="#9B7D54" stroke-dasharray="none"/></marker><marker id="seq-red" viewBox="0 0 10 10" markerWidth="14" markerHeight="14" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#B86868" stroke="#B86868" stroke-dasharray="none"/></marker><marker id="seq-purple" viewBox="0 0 10 10" markerWidth="14" markerHeight="14" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#8065A8" stroke="#8065A8" stroke-dasharray="none"/></marker><marker id="seq-teal" viewBox="0 0 10 10" markerWidth="14" markerHeight="14" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#2D948C" stroke="#2D948C" stroke-dasharray="none"/></marker><style>
  .bg{fill:#F8FAFC}.frame{fill:#FFF;stroke:#CAD6DF;stroke-width:2}.alt{fill:none;stroke:#DFC69A;stroke-width:2}.zone{stroke-width:2}.blueZone{fill:#EFF6FF;stroke:#A8C7EA}.greenZone{fill:#F0F8F0;stroke:#B8D7AE}.purpleZone{fill:#F8F3FF;stroke:#D7C3EF}.amberZone{fill:#FFF7E8;stroke:#DFC69A}.title{font-family:"Architects Daughter";font-size:40px;fill:#263238}.subtitle,.body,.small,.msg,.footer{font-family:"Comic Mono";fill:#3E4C59}.subtitle{font-size:17px}.zoneTitle{font-family:"Architects Daughter";font-size:25px;fill:#344154}.cardTitle,.participant{font-family:"Architects Daughter";font-size:22px;fill:#16202A}.body{font-size:15px}.small{font-size:13px;fill:#5B6975}.footer{font-size:14px;fill:#60727D}.card{fill:#FFF;stroke:#9FB0BC;stroke-width:2}.blueCard{fill:#EFF6FF;stroke:#4F86C6}.greenCard{fill:#F0F8F0;stroke:#6E8F4F}.amberCard{fill:#FFF7E8;stroke:#9B7D54}.redCard{fill:#FFF0F0;stroke:#B86868}.purpleCard{fill:#F8F3FF;stroke:#8065A8}.edgePath{fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.blueEdge{stroke:#4F86C6;marker-end:url(#seq-blue)}.greenEdge{stroke:#6E8F4F;marker-end:url(#seq-green)}.amberEdge{stroke:#9B7D54;marker-end:url(#seq-amber)}.redEdge{stroke:#B86868;marker-end:url(#seq-red)}.purpleEdge{stroke:#8065A8;marker-end:url(#seq-purple)}.tealEdge{stroke:#2D948C;marker-end:url(#seq-teal)}.dashed{stroke-dasharray:9 7}.lifeline{stroke:#9AAAB1;stroke-width:2;stroke-dasharray:7 8}.activation{fill:#EAF6EF;stroke:#6F9278;stroke-width:1.5}.labelPill{fill:#FFF;stroke:#D7E0E4;stroke-width:1.5}.badge{font-family:"Comic Mono";font-size:13px;font-weight:700}.frameLabel{font-family:"Architects Daughter";font-size:18px;fill:#8B6A3E}
</style></defs><rect class="bg" width="1600" height="950"/><rect class="frame" x="28" y="24" width="1544" height="902" rx="22"/><text class="title" x="800" y="66" text-anchor="middle">Projection Generation State Diagram</text><text class="subtitle" x="800" y="98" text-anchor="middle">Shadow rebuilds fail in isolation and switch only after a fenced catch-up.</text><rect class="zone purpleZone" x="70" y="140" width="1460" height="660" rx="22"/><text class="zoneTitle" x="98" y="182">Generation lifecycle</text><g class="node" data-node="active" filter="url(#shadow)"><rect class="card greenCard" x="100" y="350" width="260" height="100" rx="15"/><text class="cardTitle" x="230" y="383" text-anchor="middle">ACTIVE</text><text class="body" x="230" y="411" text-anchor="middle">serves queries</text><text class="body" x="230" y="433" text-anchor="middle">one alias target</text></g><g class="node" data-node="building" filter="url(#shadow)"><rect class="card blueCard" x="480" y="350" width="280" height="100" rx="15"/><text class="cardTitle" x="620" y="383" text-anchor="middle">BUILDING</text><text class="body" x="620" y="411" text-anchor="middle">private read model</text><text class="body" x="620" y="433" text-anchor="middle">catch up to watermark</text></g><g class="node" data-node="failed" filter="url(#shadow)"><rect class="card redCard" x="880" y="350" width="240" height="100" rx="15"/><text class="cardTitle" x="1000" y="383" text-anchor="middle">FAILED</text><text class="body" x="1000" y="411" text-anchor="middle">poison quarantined</text><text class="body" x="1000" y="433" text-anchor="middle">never serves reads</text></g><g class="node" data-node="retired" filter="url(#shadow)"><rect class="card amberCard" x="1260" y="350" width="240" height="100" rx="15"/><text class="cardTitle" x="1380" y="383" text-anchor="middle">RETIRED</text><text class="body" x="1380" y="411" text-anchor="middle">kept for rollback</text><text class="body" x="1380" y="433" text-anchor="middle">not written</text></g><g class="edge" data-edge="begin-rebuild" data-label="operator begins N+1"><path data-connector="begin-rebuild" class="edgePath blueEdge" d="M360 382 L480 382"/></g><text class="small" x="420" y="370" text-anchor="middle">begin N+1</text><g class="edge" data-edge="building-active" data-label="checkpoint ≥ watermark + fenced alias"><path data-connector="building-active" class="edgePath greenEdge" d="M480 425 L360 425"/></g><text class="small" x="420" y="447" text-anchor="middle">fenced switch</text><g class="edge" data-edge="building-failed" data-label="decode or handler failure"><path data-connector="building-failed" class="edgePath redEdge" d="M760 400 L880 400"/></g><text class="small" x="820" y="388" text-anchor="middle">handler failure</text><g class="edge" data-edge="active-retired" data-label="successful switch retires N"><path data-connector="active-retired" class="edgePath amberEdge" d="M310 450 L310 515 Q 310 530 325 530 L1380 530 Q 1395 530 1395 515 L1395 450"/></g><text class="small" x="850" y="555" text-anchor="middle">successful switch retires N</text><g class="edge" data-edge="retired-active" data-label="conditional rollback"><path data-connector="retired-active" class="edgePath purpleEdge" d="M1365 350 L1365 305 Q 1365 290 1350 290 L230 290 Q 215 290 215 305 L215 350"/></g><text class="small" x="800" y="280" text-anchor="middle">conditional rollback</text><rect class="frame" x="220" y="835" width="1160" height="54" rx="14"/><text class="body" x="800" y="869" text-anchor="middle">Forbidden: FAILED → ACTIVE, unfenced checkpoint write, partial alias switch, and event skipping.</text></svg>