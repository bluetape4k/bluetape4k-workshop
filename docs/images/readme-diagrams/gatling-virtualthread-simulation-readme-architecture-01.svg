<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="980" viewBox="0 0 1700 980" role="img" aria-label="Gatling virtual thread simulation architecture">
  <defs>
    <filter id="shadow" x="-8%" y="-10%" width="116%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#5b7282" flood-opacity="0.15"/>
    </filter>
    <marker id="blueArrow" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" viewBox="0 0 10 10" refX="9" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#457b9d"/></marker>
    <marker id="greenArrow" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" viewBox="0 0 10 10" refX="9" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#5f8f5b"/></marker>
    <marker id="goldArrow" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" viewBox="0 0 10 10" refX="9" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#a87332"/></marker>
    <style>
      .canvas { fill: #f7fafc; }
      .frame { fill: #fffefd; stroke: #cdd8df; stroke-width: 2; }
      .title { font-family: "Architects Daughter"; font-size: 38px; fill: #1d2b38; }
      .subtitle { font-family: "Comic Mono"; font-size: 16px; fill: #516172; }
      .layerTitle { font-family: "Architects Daughter"; font-size: 24px; fill: #263747; }
      .cardTitle { font-family: "Architects Daughter"; font-size: 25px; fill: #1d2b38; }
      .cardText { font-family: "Comic Mono"; font-size: 15px; fill: #42515f; }
      .smallText { font-family: "Comic Mono"; font-size: 13px; fill: #566575; }
      .layer { stroke-width: 1.6; }
      .card { stroke-width: 2.2; filter: url(#shadow); }
      .lineBlue { fill: none; stroke: #457b9d; stroke-width: 4.2; marker-end: url(#blueArrow); stroke-linecap: round; stroke-linejoin: round; }
      .lineGreen { fill: none; stroke: #5f8f5b; stroke-width: 4.2; marker-end: url(#greenArrow); stroke-linecap: round; stroke-linejoin: round; }
      .lineGold { fill: none; stroke: #a87332; stroke-width: 3.8; marker-end: url(#goldArrow); stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 9 8; }
      .label { font-family: "Comic Mono"; font-size: 14px; font-weight: 700; }
      .labelBox { fill: #ffffff; stroke-width: 1.4; }
    </style>
  </defs>

  <rect class="canvas" width="1700" height="980"/>
  <rect class="frame" x="28" y="28" width="1644" height="924" rx="24"/>
  <text class="title" x="850" y="84" text-anchor="middle">Gatling Virtual Thread Simulation</text>
  <text class="subtitle" x="850" y="114" text-anchor="middle">Gatling drives sync and async delay endpoints on a virtual-thread enabled Spring Boot app.</text>

  <rect class="layer" x="82" y="164" width="352" height="650" rx="18" fill="#eef6ff" stroke="#b5cfe8"/>
  <text class="layerTitle" x="258" y="207" text-anchor="middle">Load Driver</text>

  <rect class="layer" x="492" y="164" width="760" height="650" rx="18" fill="#f3fbf0" stroke="#b7d4ae"/>
  <text class="layerTitle" x="872" y="207" text-anchor="middle">Spring Boot Runtime</text>

  <rect class="layer" x="1310" y="164" width="308" height="650" rx="18" fill="#fff8ea" stroke="#dec289"/>
  <text class="layerTitle" x="1464" y="207" text-anchor="middle">Execution Policy</text>

  <rect class="card" x="136" y="266" width="244" height="132" rx="14" fill="#ffffff" stroke="#8eb4d6"/>
  <text class="cardTitle" x="258" y="314" text-anchor="middle">SyncTaskSimulation</text>
  <text class="cardText" x="258" y="346" text-anchor="middle">/sync/1, /sync/2</text>
  <text class="smallText" x="258" y="374" text-anchor="middle">10 -> 20 closed users</text>

  <rect class="card" x="136" y="500" width="244" height="132" rx="14" fill="#ffffff" stroke="#8eb4d6"/>
  <text class="cardTitle" x="258" y="548" text-anchor="middle">AsyncTaskSimulation</text>
  <text class="cardText" x="258" y="580" text-anchor="middle">/async/1, /async/2</text>
  <text class="smallText" x="258" y="608" text-anchor="middle">10 -> 20 closed users</text>

  <rect class="card" x="550" y="252" width="282" height="126" rx="14" fill="#ffffff" stroke="#91b884"/>
  <text class="cardTitle" x="691" y="296" text-anchor="middle">Sync Controller</text>
  <text class="cardText" x="691" y="328" text-anchor="middle">GET /sync/{seconds}</text>
  <text class="smallText" x="691" y="354" text-anchor="middle">returns elapsed millis</text>

  <rect class="card" x="910" y="252" width="282" height="126" rx="14" fill="#ffffff" stroke="#91b884"/>
  <text class="cardTitle" x="1051" y="296" text-anchor="middle">Async Controller</text>
  <text class="cardText" x="1051" y="328" text-anchor="middle">GET /async/{seconds}</text>
  <text class="smallText" x="1051" y="354" text-anchor="middle">returns elapsed millis</text>

  <rect class="card" x="550" y="470" width="282" height="112" rx="14" fill="#f9fbff" stroke="#9db4c8"/>
  <text class="cardTitle" x="691" y="512" text-anchor="middle">SyncTaskService</text>
  <text class="cardText" x="691" y="544" text-anchor="middle">Thread.sleep(seconds)</text>

  <rect class="card" x="910" y="470" width="282" height="112" rx="14" fill="#f9fbff" stroke="#9db4c8"/>
  <text class="cardTitle" x="1051" y="512" text-anchor="middle">AsyncTaskService</text>
  <text class="cardText" x="1051" y="544" text-anchor="middle">@Async delay(seconds)</text>

  <rect class="card" x="618" y="666" width="506" height="92" rx="14" fill="#fffdf6" stroke="#c39a56"/>
  <text class="cardTitle" x="871" y="704" text-anchor="middle">WebTestClient Tests</text>
  <text class="smallText" x="871" y="732" text-anchor="middle">random-port smoke checks for /sync/1 and /async/1</text>

  <rect class="card" x="1352" y="260" width="224" height="132" rx="14" fill="#fffefa" stroke="#d2a85e"/>
  <text class="cardTitle" x="1464" y="305" text-anchor="middle">TomcatConfig</text>
  <text class="cardText" x="1464" y="337" text-anchor="middle">request executor</text>
  <text class="smallText" x="1464" y="364" text-anchor="middle">virtual thread per task</text>

  <rect class="card" x="1352" y="510" width="224" height="142" rx="14" fill="#fffefa" stroke="#d2a85e"/>
  <text class="cardTitle" x="1464" y="555" text-anchor="middle">AsyncConfig</text>
  <text class="cardText" x="1464" y="587" text-anchor="middle">applicationTaskExecutor</text>
  <text class="smallText" x="1464" y="614" text-anchor="middle">virtual threads + MDC</text>

  <path class="lineBlue" d="M 380 332 H 550"/>
  <rect class="labelBox" x="404" y="290" width="92" height="30" rx="15" stroke="#8eb4d6"/>
  <text class="label" x="450" y="310" text-anchor="middle" fill="#457b9d">sync load</text>

  <path class="lineBlue" d="M 380 566 H 452 V 420 H 870 V 315 H 910"/>
  <rect class="labelBox" x="470" y="382" width="102" height="30" rx="15" stroke="#8eb4d6"/>
  <text class="label" x="521" y="402" text-anchor="middle" fill="#457b9d">async load</text>

  <path class="lineGreen" d="M 691 378 V 470"/>
  <path class="lineGreen" d="M 1051 378 V 470"/>
  <path class="lineGold" d="M 1192 315 H 1352"/>
  <rect class="labelBox" x="1218" y="273" width="100" height="30" rx="15" stroke="#d5a656"/>
  <text class="label" x="1268" y="293" text-anchor="middle" fill="#a87332">requests</text>

  <path class="lineGold" d="M 1192 526 H 1270 V 581 H 1352"/>
  <rect class="labelBox" x="1216" y="548" width="100" height="30" rx="15" stroke="#d5a656"/>
  <text class="label" x="1266" y="568" text-anchor="middle" fill="#a87332">@Async</text>
</svg>
