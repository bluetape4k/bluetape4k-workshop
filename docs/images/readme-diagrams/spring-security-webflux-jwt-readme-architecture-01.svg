<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="900" viewBox="0 0 1700 900">
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .title { font-family: 'Architects Daughter', 'Comic Sans MS', cursive; font-size: 34px; fill: #172033; }
      .lane-title { font-family: 'Architects Daughter', 'Comic Sans MS', cursive; font-size: 26px; fill: #344154; }
      .card-title { font-family: 'Architects Daughter', 'Comic Sans MS', cursive; font-size: 27px; fill: #101827; }
      .body { font-family: 'Comic Mono', 'Comic Sans MS', monospace; font-size: 18px; fill: #364152; }
      .small { font-family: 'Comic Mono', 'Comic Sans MS', monospace; font-size: 16px; fill: #4b5563; }
      .lane { stroke-width: 1.5; rx: 24; ry: 24; }
      .card { fill: #fff; stroke: #cbd5e1; stroke-width: 1.5; rx: 18; ry: 18; }
      .line { fill: none; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
    </style>
    <marker id="arrow-blue" viewBox="0 0 10 10" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#2563eb" stroke-dasharray="none"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#059669" stroke-dasharray="none"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#b45309" stroke-dasharray="none"/>
    </marker>
  </defs>
  <rect class="bg" width="1700" height="900"/>
  <text class="title" x="70" y="70">WebFlux JWT Token Issue and Bearer Validation</text>

  <rect class="lane" x="70" y="120" width="750" height="650" fill="#eff6ff" stroke="#bfdbfe"/>
  <text class="lane-title" x="110" y="165">Issue token with HTTP Basic</text>
  <rect class="card" x="160" y="220" width="560" height="74"/>
  <text class="card-title" x="195" y="255">POST /token</text>
  <text class="body" x="195" y="280">Basic user/password</text>
  <rect class="card" x="160" y="360" width="560" height="74"/>
  <text class="card-title" x="195" y="395">MapReactiveUserDetailsService</text>
  <text class="body" x="195" y="420">BCrypt demo user, authority app</text>
  <rect class="card" x="160" y="500" width="560" height="74"/>
  <text class="card-title" x="195" y="535">NimbusJwtEncoder</text>
  <text class="body" x="195" y="560">issuer self, subject user, scope app</text>
  <rect class="card" x="230" y="640" width="420" height="58"/>
  <text class="body" x="270" y="676">private key signs token</text>

  <rect class="lane" x="880" y="120" width="750" height="650" fill="#f0fdf4" stroke="#bbf7d0"/>
  <text class="lane-title" x="920" y="165">Validate bearer token</text>
  <rect class="card" x="980" y="220" width="560" height="74"/>
  <text class="card-title" x="1015" y="255">GET /</text>
  <text class="body" x="1015" y="280">Authorization: Bearer token</text>
  <rect class="card" x="980" y="360" width="560" height="74"/>
  <text class="card-title" x="1015" y="395">SecurityWebFilterChain</text>
  <text class="body" x="1015" y="420">anyExchange authenticated, CSRF off</text>
  <rect class="card" x="980" y="500" width="560" height="74"/>
  <text class="card-title" x="1015" y="535">NimbusReactiveJwtDecoder</text>
  <text class="body" x="1015" y="560">public key validates bearer token</text>
  <rect class="card" x="1050" y="640" width="420" height="58"/>
  <text class="body" x="1090" y="676">HelloController returns greeting</text>

  <rect class="lane" x="320" y="805" width="1060" height="60" fill="#fefce8" stroke="#fde68a"/>
  <text class="body" x="365" y="842">WebTestClient checks: token issuance, bearer success, mock-user success, unauthenticated 401</text>

  <path class="line" d="M440 294 L440 360" stroke="#2563eb" marker-end="url(#arrow-blue)" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="line" d="M440 434 L440 500" stroke="#2563eb" marker-end="url(#arrow-blue)" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="line" d="M440 574 L440 640" stroke="#b45309" marker-end="url(#arrow-amber)" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="line" d="M650 670 L935 670 L935 257 L980 257" stroke="#059669" marker-end="url(#arrow-green)" stroke-linecap="round" stroke-linejoin="round"/>

  <path class="line" d="M1260 294 L1260 360" stroke="#059669" marker-end="url(#arrow-green)" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="line" d="M1260 434 L1260 500" stroke="#059669" marker-end="url(#arrow-green)" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="line" d="M1260 574 L1260 640" stroke="#059669" marker-end="url(#arrow-green)" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="line" d="M440 698 L440 805" stroke="#2563eb" marker-end="url(#arrow-blue)" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="line" d="M1260 698 L1260 805" stroke="#059669" marker-end="url(#arrow-green)" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
