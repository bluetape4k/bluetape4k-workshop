<svg xmlns="http://www.w3.org/2000/svg" width="1740" height="900" viewBox="0 0 1740 900">
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .title { font-family: 'Architects Daughter', 'Comic Sans MS', cursive; font-size: 34px; fill: #172033; }
      .layer-title { font-family: 'Architects Daughter', 'Comic Sans MS', cursive; font-size: 26px; fill: #344154; }
      .body { font-family: 'Comic Mono', 'Comic Sans MS', monospace; font-size: 18px; fill: #364152; }
      .small { font-family: 'Comic Mono', 'Comic Sans MS', monospace; font-size: 16px; fill: #4b5563; }
      .layer { stroke-width: 1.5; rx: 24; ry: 24; }
      .avoid { fill: #fff1f2; stroke: #fecdd3; stroke-width: 1.5; rx: 18; ry: 18; }
      .prefer { fill: #f0fdf4; stroke: #bbf7d0; stroke-width: 1.5; rx: 18; ry: 18; }
      .line { fill: none; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#2563eb" stroke-dasharray="none" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect class="bg" width="1740" height="900"/>
  <text class="title" x="70" y="70">Virtual Thread Usage Rules</text>

  <rect class="layer" x="70" y="120" width="760" height="665" fill="#fff1f2" stroke="#fecdd3"/>
  <text class="layer-title" x="105" y="165">Avoid carrying platform-thread habits</text>
  <rect class="avoid" x="130" y="215" width="640" height="70"/>
  <text class="body" x="165" y="257">CompletableFuture chains for simple blocking work</text>
  <rect class="avoid" x="130" y="325" width="640" height="70"/>
  <text class="body" x="165" y="367">cached/fixed pools for virtual threads</text>
  <rect class="avoid" x="130" y="435" width="640" height="70"/>
  <text class="body" x="165" y="477">fixed thread pools as resource quotas</text>
  <rect class="avoid" x="130" y="545" width="640" height="70"/>
  <text class="body" x="165" y="587">broad inherited ThreadLocal state</text>
  <rect class="avoid" x="130" y="655" width="640" height="70"/>
  <text class="body" x="165" y="697">synchronized sections that can pin carriers</text>

  <rect class="layer" x="910" y="120" width="760" height="665" fill="#f0fdf4" stroke="#bbf7d0"/>
  <text class="layer-title" x="945" y="165">Prefer virtual-thread-friendly boundaries</text>
  <rect class="prefer" x="970" y="215" width="640" height="70"/>
  <text class="body" x="1005" y="257">synchronous code on per-task virtual executor</text>
  <rect class="prefer" x="970" y="325" width="640" height="70"/>
  <text class="body" x="1005" y="367">newVirtualThreadPerTaskExecutor()</text>
  <rect class="prefer" x="970" y="435" width="640" height="70"/>
  <text class="body" x="1005" y="477">Semaphore around the constrained resource</text>
  <rect class="prefer" x="970" y="545" width="640" height="70"/>
  <text class="body" x="1005" y="587">ScopedValue or explicit bounded context</text>
  <rect class="prefer" x="970" y="655" width="640" height="70"/>
  <text class="body" x="1005" y="697">ReentrantLock and Kotlin withLock</text>

  <rect class="layer" x="320" y="820" width="1100" height="50" fill="#fefce8" stroke="#fde68a"/>
  <text class="small" x="390" y="852">Rule2 to Rule6 tests compare each avoid/prefer pair with executable assertions</text>

  <path class="line" d="M770 250 L970 250" stroke="#2563eb" marker-end="url(#arrow)" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="line" d="M770 360 L970 360" stroke="#2563eb" marker-end="url(#arrow)" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="line" d="M770 470 L970 470" stroke="#2563eb" marker-end="url(#arrow)" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="line" d="M770 580 L970 580" stroke="#2563eb" marker-end="url(#arrow)" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="line" d="M770 690 L970 690" stroke="#2563eb" marker-end="url(#arrow)" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
