    </symbol>
    <symbol id="icon-lambda" viewBox="0 0 80 80">
      <rect x="0" y="0" width="80" height="80" fill="#ED7100"/>
      <path d="M28.0075352,66 L15.5907274,66 L29.3235885,37.296 L35.5460249,50.106 L28.0075352,66 Z M30.2196674,34.553 C30.0512768,34.208 29.7004629,33.989 29.3175745,33.989 L29.3145676,33.989 C28.9286723,33.99 28.5778583,34.211 28.4124746,34.558 L13.097944,66.569 C12.9495999,66.879 12.9706487,67.243 13.1550766,67.534 C13.3374998,67.824 13.6582439,68 14.0020416,68 L28.6420072,68 C29.0299071,68 29.3817234,67.777 29.5481094,67.428 L37.563706,50.528 C37.693006,50.254 37.6920037,49.937 37.5586944,49.665 L30.2196674,34.553 Z M64.9953491,66 L52.6587274,66 L32.866809,24.57 C32.7014253,24.222 32.3486067,24 31.9617091,24 L23.8899822,24 L23.8990031,14 L39.7197081,14 L59.4204149,55.429 C59.5857986,55.777 59.9386172,56 60.3255148,56 L64.9953491,56 L64.9953491,66 Z M65.9976745,54 L60.9599868,54 L41.25928,12.571 C41.0938963,12.223 40.7410777,12 40.3531778,12 L22.89768,12 C22.3453987,12 21.8963569,12.447 21.8953545,12.999 L21.884329,24.999 C21.884329,25.265 21.9885708,25.519 22.1780103,25.707 C22.3654452,25.895 22.6200358,26 22.8866544,26 L31.3292417,26 L51.1221625,67.43 C51.2885485,67.778 51.6393624,68 52.02626,68 L65.9976745,68 C66.5519605,68 67,67.552 67,67 L67,55 C67,54.448 66.5519605,54 65.9976745,54 L65.9976745,54 Z" fill="#fff"/>
    </symbol>
    <style>
      text { font-family: "Comic Mono", "Architects Daughter", monospace; fill: #213547; }
      .title { font-family: "Architects Daughter", "Comic Mono", cursive; font-size: 34px; font-weight: 700; }
      .subtitle { font-size: 18px; fill: #607080; }
      .layer-title { font-family: "Architects Daughter", "Comic Mono", cursive; font-size: 22px; fill: #31465c; }
      .card-title { font-size: 20px; font-weight: 700; text-anchor: middle; }
      .card-sub { font-size: 15px; fill: #52677a; text-anchor: middle; }
      .node rect { rx: 8; filter: url(#shadow); stroke-width: 2; }
      .code-card { fill: #f9fbfd; stroke: #9fb8ca; }
      .model-card { fill: #fff9ef; stroke: #d7b26d; }
      .local-card { fill: #f3fbf7; stroke: #85b79b; }
      .aws-card { fill: #fff6f8; stroke: #d995b4; }
      .flow { fill: none; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
      .local-flow { stroke: #4f86c6; }
      .aws-flow { stroke: #b87935; stroke-dasharray: 12 9; }
      .legend { font-size: 15px; fill: #40556a; }
    </style>
  </defs>

  <rect x="0" y="0" width="1280" height="1120" fill="#f4f7fb"/>
  <text class="title" x="64" y="58">EventBridge Scheduler local-first workflow</text>
  <text class="subtitle" x="64" y="88">Order workflow is mapped to an EventBridge event first, then to a delayed Scheduler request.</text>

  <path d="M56 104 H1224 V240 H56 Z" fill="#eaf2fb" stroke="#c7d9e8" stroke-width="2"/>
  <text class="layer-title" x="76" y="136">1. Learner entry</text>
  <path d="M56 268 H1224 V438 H56 Z" fill="#eef6f0" stroke="#c9dfce" stroke-width="2"/>
  <text class="layer-title" x="76" y="300">2. Spring Boot service</text>
  <path d="M56 466 H1224 V664 H56 Z" fill="#fff7e8" stroke="#e2c891" stroke-width="2"/>
  <text class="layer-title" x="76" y="498">3. AWS request models</text>
  <path d="M56 692 H1224 V888 H56 Z" fill="#edf8f5" stroke="#bdddd2" stroke-width="2"/>
  <text class="layer-title" x="76" y="724">4. Local workshop adapters</text>
  <path d="M56 916 H1224 V1066 H56 Z" fill="#fff1f6" stroke="#e0b3c6" stroke-width="2"/>
  <text class="layer-title" x="820" y="948">5. Optional real AWS adapter targets</text>

  <g class="node" data-node="client">
    <rect class="card code-card" x="190" y="140" width="320" height="88"></rect>
    <text class="card-title" x="350" y="176">Learner request</text>
    <text class="card-sub" x="350" y="204">orderId, workflow, idempotency</text>
  </g>

  <g class="node" data-node="service">
    <rect class="card code-card" x="170" y="322" width="360" height="104"></rect>
    <text class="card-title" x="350" y="358">OrderWorkflowService</text>
    <text class="card-sub" x="350" y="386">validates and coordinates boundaries</text>
  </g>
  <g class="node" data-node="properties">
    <rect class="card code-card" x="750" y="322" width="360" height="104"></rect>
    <text class="card-title" x="930" y="358">OrderWorkflowProperties</text>
    <text class="card-sub" x="930" y="386">source, bus, group, target ARN</text>
  </g>

  <g class="node" data-node="eventEntry">
    <rect class="card model-card" x="150" y="530" width="400" height="116"></rect>
    <text class="card-title" x="350" y="570">PutEventsRequestEntry</text>
    <text class="card-sub" x="350" y="598">detail JSON, trace header, event bus</text>
    <text class="card-sub" x="350" y="622">created before delayed schedule</text>
  </g>
  <g class="node" data-node="scheduleRequest">
    <rect class="card model-card" x="730" y="530" width="400" height="116"></rect>
    <text class="card-title" x="930" y="570">SchedulerWorkflowRequest</text>
    <text class="card-sub" x="930" y="598">at(instant), target ARN, payload</text>
    <text class="card-sub" x="930" y="622">created only after publish success</text>
  </g>

  <g class="node" data-node="localPublisher">
    <rect class="card local-card" x="170" y="752" width="360" height="104"></rect>
    <text class="card-title" x="350" y="788">LocalEventBridgePublisher</text>
    <text class="card-sub" x="350" y="816">captures entries in memory</text>
  </g>
  <g class="node" data-node="localScheduler">
    <rect class="card local-card" x="750" y="752" width="360" height="104"></rect>
    <text class="card-title" x="930" y="788">LocalWorkflowScheduler</text>
    <text class="card-sub" x="930" y="816">captures delayed requests in memory</text>
  </g>

  <g class="node" data-node="eventBridge">
    <rect class="card aws-card" x="150" y="970" width="300" height="84"></rect>
    <use href="#icon-eventbridge" x="174" y="988" width="44" height="44"/>
    <text class="card-title" x="316" y="1002">Amazon EventBridge</text>
    <text class="card-sub" x="316" y="1030">manual real adapter</text>
  </g>
  <g class="node" data-node="scheduler">
    <rect class="card aws-card" x="490" y="970" width="300" height="84"></rect>
    <use href="#icon-eventbridge" x="514" y="988" width="44" height="44"/>
    <text class="card-title" x="656" y="1002">EventBridge Scheduler</text>
    <text class="card-sub" x="656" y="1030">manual real adapter</text>
  </g>
  <g class="node" data-node="lambda">
    <rect class="card aws-card" x="830" y="970" width="300" height="84"></rect>
    <use href="#icon-lambda" x="854" y="988" width="44" height="44"/>
    <text class="card-title" x="996" y="1002">AWS Lambda target</text>
    <text class="card-sub" x="996" y="1030">sample target ARN</text>
  </g>

  <path class="flow local-flow" data-connector="client-service" d="M350 228 L350 322"/>
  <polygon data-connector-head="client-service" points="350,322 343,308 357,308" fill="#4f86c6" stroke="#4f86c6" stroke-dasharray="none" style="stroke-dasharray:none"/>

  <path class="flow local-flow" data-connector="service-properties" d="M530 374 L750 374"/>
  <polygon data-connector-head="service-properties" points="750,374 736,367 736,381" fill="#4f86c6" stroke="#4f86c6" stroke-dasharray="none" style="stroke-dasharray:none"/>

  <path class="flow local-flow" data-connector="service-eventEntry" d="M350 426 L350 530"/>
  <polygon data-connector-head="service-eventEntry" points="350,530 343,516 357,516" fill="#4f86c6" stroke="#4f86c6" stroke-dasharray="none" style="stroke-dasharray:none"/>

  <path class="flow local-flow" data-connector="service-scheduleRequest" d="M530 374 L650 374 Q 662 374 662 386 L662 494 Q 662 506 674 506 L918 506 Q 930 506 930 518 L930 530"/>
  <polygon data-connector-head="service-scheduleRequest" points="930,530 923,516 937,516" fill="#4f86c6" stroke="#4f86c6" stroke-dasharray="none" style="stroke-dasharray:none"/>

  <path class="flow local-flow" data-connector="eventEntry-localPublisher" d="M350 646 L350 752"/>
  <polygon data-connector-head="eventEntry-localPublisher" points="350,752 343,738 357,738" fill="#4f86c6" stroke="#4f86c6" stroke-dasharray="none" style="stroke-dasharray:none"/>

  <path class="flow local-flow" data-connector="scheduleRequest-localScheduler" d="M930 646 L930 752"/>
  <polygon data-connector-head="scheduleRequest-localScheduler" points="930,752 923,738 937,738" fill="#4f86c6" stroke="#4f86c6" stroke-dasharray="none" style="stroke-dasharray:none"/>

  <path class="flow aws-flow" data-connector="localPublisher-eventBridge" d="M350 856 L350 910 Q 350 922 338 922 L312 922 Q 300 922 300 934 L300 970"/>
  <polygon data-connector-head="localPublisher-eventBridge" points="300,970 293,956 307,956" fill="#b87935" stroke="#b87935" stroke-dasharray="none" style="stroke-dasharray:none"/>

  <path class="flow aws-flow" data-connector="localScheduler-scheduler" d="M930 856 L930 910 Q 930 922 918 922 L652 922 Q 640 922 640 934 L640 970"/>
  <polygon data-connector-head="localScheduler-scheduler" points="640,970 633,956 647,956" fill="#b87935" stroke="#b87935" stroke-dasharray="none" style="stroke-dasharray:none"/>

  <path class="flow aws-flow" data-connector="scheduler-lambda" d="M790 1012 L830 1012"/>
  <polygon data-connector-head="scheduler-lambda" points="830,1012 816,1005 816,1019" fill="#b87935" stroke="#b87935" stroke-dasharray="none" style="stroke-dasharray:none"/>

  <g transform="translate(905 118)">
    <rect x="0" y="0" width="270" height="92" rx="8" fill="#ffffff" stroke="#c5d1dc" stroke-width="2"/>
    <path d="M18 28 H76" class="flow local-flow"/>
    <polygon points="76,28 62,21 62,35" fill="#4f86c6" stroke="#4f86c6" stroke-dasharray="none" style="stroke-dasharray:none"/>
    <text class="legend" x="92" y="34">default local flow</text>
    <path d="M18 64 H76" class="flow aws-flow"/>
    <polygon points="76,64 62,57 62,71" fill="#b87935" stroke="#b87935" stroke-dasharray="none" style="stroke-dasharray:none"/>
    <text class="legend" x="92" y="70">manual AWS adapter</text>
  </g>
</svg>
