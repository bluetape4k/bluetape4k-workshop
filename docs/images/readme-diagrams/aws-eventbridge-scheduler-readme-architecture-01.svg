<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1120" viewBox="0 0 1280 1120" role="img" aria-labelledby="title desc">
  <title id="title">AWS EventBridge Scheduler workshop architecture</title>
  <desc id="desc">Top-to-bottom local-first flow from learner request to EventBridge event and Scheduler request boundaries.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#163047" flood-opacity="0.15"/>
    </filter>
