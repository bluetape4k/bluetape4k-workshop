<svg xmlns="http://www.w3.org/2000/svg" width="1420" height="1155" viewBox="0 0 1420 1155" role="img" aria-label="CBOR Serialization via Spring MVC">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#1f2937" flood-opacity="0.10"/></filter>
  <marker id="arrowBlue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M1 1 L7 4 L1 7 Z" fill="#5b8def"/></marker>
  <marker id="arrowTeal" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M1 1 L7 4 L1 7 Z" fill="#45a7a1"/></marker>
  <style>
    .canvas{fill:#f7f9fc}
    .frame{fill:#ffffff;stroke:#d8e0ea;stroke-width:1.5}
    .title{font-family:"Architects Daughter";font-size:34px;fill:#102033}
    .subtitle{font-family:"Comic Mono";font-size:13px;fill:#536273}
    .actor{font-family:"Architects Daughter";font-size:17px;fill:#102033}
    .message{font-family:"Comic Mono";font-size:12px;fill:#263445;paint-order:stroke;stroke:#ffffff;stroke-width:4px;stroke-linejoin:round}
    .detail{font-family:"Comic Mono";font-size:11px;fill:#536273}
    .lifeline{stroke:#b8c4d3;stroke-width:1.4;stroke-dasharray:7 6}
    .call{stroke:#5b8def;stroke-width:2.15;fill:none;marker-end:url(#arrowBlue)}
    .return{stroke:#45a7a1;stroke-width:2.05;stroke-dasharray:7 5;fill:none;marker-end:url(#arrowTeal)}
    .box{stroke-width:1.8;filter:url(#shadow)}
  </style>
</defs>
<rect class="canvas" width="1420" height="1155"/>
<rect class="frame" x="24" y="20" width="1372" height="1115" rx="18"/>
<text class="title" x="48" y="58">CBOR Serialization via Spring MVC</text>
<text class="subtitle" x="50" y="84">CborConfig (CBORMapper) → CourseController → CourseRepository</text>
<rect class="box" x="40" y="108" width="220" height="58" rx="10" fill="#e8f3ff" stroke="#7aa0c4"/>
<text class="actor" x="150" y="130" text-anchor="middle" dominant-baseline="middle">HTTP Client Accept:</text>
<text class="actor" x="150" y="144" text-anchor="middle" dominant-baseline="middle">CBOR</text>
<line class="lifeline" x1="150" y1="166" x2="150" y2="1097"/>
<rect class="box" x="320" y="108" width="220" height="58" rx="10" fill="#eaf7ef" stroke="#7aa0c4"/>
<text class="actor" x="430" y="137" text-anchor="middle" dominant-baseline="middle">Cbor Config CBORMapper</text>
<line class="lifeline" x1="430" y1="166" x2="430" y2="1097"/>
<rect class="box" x="600" y="108" width="220" height="58" rx="10" fill="#fff3d9" stroke="#7aa0c4"/>
<text class="actor" x="710" y="130" text-anchor="middle" dominant-baseline="middle">Course Controller</text>
<text class="actor" x="710" y="144" text-anchor="middle" dominant-baseline="middle">@RestController</text>
<line class="lifeline" x1="710" y1="166" x2="710" y2="1097"/>
<rect class="box" x="880" y="108" width="220" height="58" rx="10" fill="#f1ecff" stroke="#7aa0c4"/>
<text class="actor" x="990" y="130" text-anchor="middle" dominant-baseline="middle">HttpMsg Converter</text>
<text class="actor" x="990" y="144" text-anchor="middle" dominant-baseline="middle">CBOR-aware</text>
<line class="lifeline" x1="990" y1="166" x2="990" y2="1097"/>
<rect class="box" x="1160" y="108" width="220" height="58" rx="10" fill="#fdecef" stroke="#7aa0c4"/>
<text class="actor" x="1270" y="130" text-anchor="middle" dominant-baseline="middle">Course Repository</text>
<text class="actor" x="1270" y="144" text-anchor="middle" dominant-baseline="middle">in-memory</text>
<line class="lifeline" x1="1270" y1="166" x2="1270" y2="1097"/>
<path class="call" d="M150 205 L710 205"/>
<rect class="message-label" x="150" y="219" width="560" height="31" rx="7" fill="#ffffff" opacity="0.96" stroke="#dbe3ee"/>
<text class="message" x="430" y="234.5" text-anchor="middle" dominant-baseline="middle">1. GET /courses (Accept: application/cbor)</text>
<path class="call" d="M710 313 L1270 313"/>
<rect class="message-label" x="710" y="327" width="560" height="31" rx="7" fill="#ffffff" opacity="0.96" stroke="#dbe3ee"/>
<text class="message" x="990" y="342.5" text-anchor="middle" dominant-baseline="middle">2. findAll()</text>
<path class="return" d="M1270 421 L710 421"/>
<rect class="message-label" x="710" y="435" width="560" height="31" rx="7" fill="#ffffff" opacity="0.96" stroke="#dbe3ee"/>
<text class="message" x="990" y="450.5" text-anchor="middle" dominant-baseline="middle">3. List&lt;Course&gt;</text>
<path class="call" d="M710 529 L990 529"/>
<rect class="message-label" x="635" y="543" width="430" height="31" rx="7" fill="#ffffff" opacity="0.96" stroke="#dbe3ee"/>
<text class="message" x="850" y="558.5" text-anchor="middle" dominant-baseline="middle">4. HttpMessageConverter selects CBOR</text>
<path class="call" d="M990 637 L430 637"/>
<rect class="message-label" x="430" y="651" width="560" height="31" rx="7" fill="#ffffff" opacity="0.96" stroke="#dbe3ee"/>
<text class="message" x="710" y="666.5" text-anchor="middle" dominant-baseline="middle">5. HttpMsg Converter CBOR-aware to Cbor Config CBORMapper</text>
<path class="call" d="M430 745 L520 745 L520 773 L442 773"/>
<rect class="message-label" x="425" y="787" width="330" height="46" rx="7" fill="#ffffff" opacity="0.96" stroke="#dbe3ee"/>
<text class="message" x="590" y="802.5" text-anchor="middle" dominant-baseline="middle">6. Cbor Config CBORMapper to Cbor</text>
<text class="message" x="590" y="817.5" text-anchor="middle" dominant-baseline="middle">Config CBORMapper</text>
<path class="return" d="M430 853 L150 853"/>
<rect class="message-label" x="75" y="867" width="430" height="31" rx="7" fill="#ffffff" opacity="0.96" stroke="#dbe3ee"/>
<text class="message" x="290" y="882.5" text-anchor="middle" dominant-baseline="middle">7. 200 OK (Content-Type: application/cbor)</text>
<path class="call" d="M150 961 L710 961"/>
<rect class="message-label" x="150" y="975" width="560" height="31" rx="7" fill="#ffffff" opacity="0.96" stroke="#dbe3ee"/>
<text class="message" x="430" y="990.5" text-anchor="middle" dominant-baseline="middle">8. POST /courses (body: CBOR) → save(course)</text>
</svg>
