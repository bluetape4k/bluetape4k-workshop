<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-label="CBOR encoding/decoding sequence through Spring MVC">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#1f2937" flood-opacity="0.10"/></filter>
  <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth">
    <path d="M1,1 L8,4.5 L1,8 Z" fill="#758297"/>
  </marker>
  <style>
    .canvas{fill:#f7f9fc}.frame{fill:#fff;stroke:#d8e0ea;stroke-width:1.5}
    .title{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:38px;font-weight:400;fill:#102033}
    .subtitle{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:14px;font-weight:400;fill:#536273}
    .smallLabel{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:21px;font-weight:400;fill:#102033}
    .mono{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#102033}
    .small{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#536273}
    .card{stroke-width:2.1;filter:url(#shadow)}
    .lifeline{stroke:#b0bbca;stroke-width:1.5;stroke-dasharray:6 4;fill:none}
    .reqArrow{stroke:#5B8DEF;stroke-width:2.1;fill:none;marker-end:url(#arrow)}
    .rspArrow{stroke:#45A7A1;stroke-width:2.1;stroke-dasharray:7 4;fill:none;marker-end:url(#arrow)}
    .msgLabel{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:13px;fill:#102033}
  </style>
</defs>
<rect class="canvas" width="960" height="520"/>
<rect class="frame" x="24" y="20" width="912" height="480" rx="22"/>

<!-- Title -->
<text class="title" x="48" y="66">CBOR Serialization via Spring MVC</text>
<text class="subtitle" x="52" y="88">CborConfig (CBORMapper) → CourseController → CourseRepository</text>

<!-- Participants cx: 100, 280, 480, 700, 880 -->
<!-- Client -->
<g transform="translate(40,104)">
  <rect class="card" x="0" y="0" width="120" height="68" rx="12" fill="#E8F3FF" stroke="#5B8DEF"/>
  <text class="smallLabel" style="font-size:17px" x="60" y="28" text-anchor="middle">HTTP</text>
  <text class="smallLabel" style="font-size:17px" x="60" y="52" text-anchor="middle">Client</text>
  <text class="small" x="60" y="66" text-anchor="middle">Accept: CBOR</text>
</g>
<!-- CborConfig -->
<g transform="translate(220,104)">
  <rect class="card" x="0" y="0" width="120" height="68" rx="12" fill="#F1ECFF" stroke="#8A72D6"/>
  <text class="smallLabel" style="font-size:17px" x="60" y="28" text-anchor="middle">Cbor</text>
  <text class="smallLabel" style="font-size:17px" x="60" y="52" text-anchor="middle">Config</text>
  <text class="small" x="60" y="66" text-anchor="middle">CBORMapper</text>
</g>
<!-- CourseController -->
<g transform="translate(420,104)">
  <rect class="card" x="0" y="0" width="130" height="68" rx="12" fill="#EAF7EF" stroke="#58A978"/>
  <text class="smallLabel" style="font-size:17px" x="65" y="28" text-anchor="middle">Course</text>
  <text class="smallLabel" style="font-size:17px" x="65" y="52" text-anchor="middle">Controller</text>
  <text class="small" x="65" y="66" text-anchor="middle">@RestController</text>
</g>
<!-- HttpMessageConverter -->
<g transform="translate(620,104)">
  <rect class="card" x="0" y="0" width="140" height="68" rx="12" fill="#FFF3D9" stroke="#D6A441"/>
  <text class="smallLabel" style="font-size:17px" x="70" y="26" text-anchor="middle">HttpMsg</text>
  <text class="smallLabel" style="font-size:17px" x="70" y="48" text-anchor="middle">Converter</text>
  <text class="small" x="70" y="66" text-anchor="middle">CBOR-aware</text>
</g>
<!-- CourseRepository -->
<g transform="translate(800,104)">
  <rect class="card" x="0" y="0" width="136" height="68" rx="12" fill="#FDECEF" stroke="#DC6B82"/>
  <text class="smallLabel" style="font-size:17px" x="68" y="26" text-anchor="middle">Course</text>
  <text class="smallLabel" style="font-size:17px" x="68" y="50" text-anchor="middle">Repository</text>
  <text class="small" x="68" y="66" text-anchor="middle">in-memory</text>
</g>

<!-- Lifelines cx: 100, 280, 485, 690, 868 -->
<line class="lifeline" x1="100" y1="172" x2="100" y2="490"/>
<line class="lifeline" x1="280" y1="172" x2="280" y2="490"/>
<line class="lifeline" x1="485" y1="172" x2="485" y2="490"/>
<line class="lifeline" x1="690" y1="172" x2="690" y2="490"/>
<line class="lifeline" x1="868" y1="172" x2="868" y2="490"/>

<!-- Step 1: Client → Controller -->
<text class="msgLabel" x="48" y="206">1. GET /courses (Accept: application/cbor)</text>
<path class="reqArrow" d="M100,210 L477,210"/>

<!-- Step 2: Controller → Repository findAll() -->
<text class="msgLabel" x="497" y="246">2. findAll()</text>
<path class="reqArrow" d="M485,250 L860,250"/>

<!-- Step 3: Repository returns List<Course> -->
<text class="msgLabel" x="497" y="284">3. List&lt;Course&gt;</text>
<path class="rspArrow" d="M860,288 L493,288"/>

<!-- Step 4: Controller → HttpMessageConverter -->
<text class="msgLabel" x="497" y="322">4. HttpMessageConverter selects CBOR</text>
<path class="reqArrow" d="M485,326 L682,326"/>

<!-- Step 5: Converter → CborConfig (CBORMapper encode) -->
<text class="msgLabel" x="116" y="358">5. CBORMapper.writeValue(List&lt;Course&gt;)</text>
<path class="reqArrow" d="M690,362 L288,362"/>

<!-- Step 6: CBORMapper self-loop: encode binary -->
<text class="msgLabel" x="48" y="394">6. encode binary CBOR bytes</text>
<path class="reqArrow" d="M280,398 C235,398 235,418 280,418"/>

<!-- Step 7: Return CBOR bytes back to client -->
<text class="msgLabel" x="116" y="452">7. 200 OK (Content-Type: application/cbor)</text>
<path class="rspArrow" d="M280,456 L108,456"/>

<!-- Step 8: POST → Controller → save -->
<text class="msgLabel" x="48" y="486">8. POST /courses (body: CBOR) → save(course)</text>
<path class="reqArrow" d="M100,490 L477,490"/>
</svg>
