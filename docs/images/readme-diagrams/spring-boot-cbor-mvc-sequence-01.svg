<line class="lifeline" x1="570.5" y1="252" x2="570.5" y2="1196" stroke="#b7c2d1" stroke-width="2" stroke-dasharray="10 10"/>
<rect class="card" x="875.5" y="166" width="251" height="72" rx="20" fill="#FFF3D9" stroke="#D6A441"/>
<text class="smallLabel" x="1001" y="209" text-anchor="middle">CourseRepository</text>
