<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1580" height="760" viewBox="0 0 1580 760" role="img" aria-label="CBOR MVC request flow">
  <defs><filter id="shadow" x="-8%" y="-8%" width="116%" height="124%"><feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#64748B" flood-opacity="0.15"/></filter><marker id="arrowBlue" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 14 7 L 0 14 Z" fill="#2563EB"/></marker><marker id="arrowTeal" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 14 7 L 0 14 Z" fill="#0891B2"/></marker><style>.canvas{fill:#F8FAFC}.frame{fill:#FFFFFF;stroke:#D6E0E8;stroke-width:1.4}.title{font-family:"Architects Daughter";font-size:38px;fill:#102033}.subtitle{font-family:"Comic Mono";font-size:15px;fill:#51606F}.cardTitle{font-family:"Architects Daughter";font-size:27px;fill:#102033}.cardText{font-family:"Comic Mono";font-size:15px;fill:#415166}.line{fill:none;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round}.msg{font-family:"Comic Mono";font-size:15px;fill:#334155}</style></defs>
  <rect class="canvas" width="1580" height="760"/><rect class="frame" x="24" y="24" width="1532" height="712" rx="24"/>
  <text class="title" x="790" y="72" text-anchor="middle">CBOR request flow</text><text class="subtitle" x="790" y="104" text-anchor="middle">Accept: application/cbor selects the converter; Course is returned as a compact binary response.</text>
  <g filter="url(#shadow)"><rect x="90" y="170" width="240" height="78" rx="14" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.7"/><text class="cardTitle" x="210" y="204" text-anchor="middle">Client</text><text class="cardText" x="210" y="230" text-anchor="middle">Accept application/cbor</text></g>
  <g filter="url(#shadow)"><rect x="430" y="170" width="280" height="78" rx="14" fill="#F0FDF4" stroke="#16A34A" stroke-width="1.7"/><text class="cardTitle" x="570" y="204" text-anchor="middle">HttpMessageConverter</text><text class="cardText" x="570" y="230" text-anchor="middle">Jackson CBOR</text></g>
  <g filter="url(#shadow)"><rect x="830" y="170" width="260" height="78" rx="14" fill="#FFF7ED" stroke="#EA580C" stroke-width="1.7"/><text class="cardTitle" x="960" y="204" text-anchor="middle">Controller</text><text class="cardText" x="960" y="230" text-anchor="middle">/courses/{id}</text></g>
  <g filter="url(#shadow)"><rect x="1210" y="170" width="260" height="78" rx="14" fill="#ECFEFF" stroke="#0891B2" stroke-width="1.7"/><text class="cardTitle" x="1340" y="204" text-anchor="middle">Repository</text><text class="cardText" x="1340" y="230" text-anchor="middle">Map&lt;Int, Course&gt;</text></g>
  <path class="line" d="M 210 322 L 960 322" stroke="#2563EB" marker-end="url(#arrowBlue)"/><text class="msg" x="585" y="306" text-anchor="middle">1. GET /courses/1</text>
  <path class="line" d="M 960 402 L 1340 402" stroke="#2563EB" marker-end="url(#arrowBlue)"/><text class="msg" x="1150" y="386" text-anchor="middle">2. getCourse(id)</text>
  <path class="line" d="M 1340 482 L 960 482" stroke="#0891B2" marker-end="url(#arrowTeal)"/><text class="msg" x="1150" y="466" text-anchor="middle">3. Course model</text>
  <path class="line" d="M 960 562 L 570 562" stroke="#0891B2" marker-end="url(#arrowTeal)"/><text class="msg" x="765" y="546" text-anchor="middle">4. serialize Course to CBOR</text>
  <path class="line" d="M 570 642 L 210 642" stroke="#0891B2" marker-end="url(#arrowTeal)"/><text class="msg" x="390" y="626" text-anchor="middle">5. binary response decoded by client</text>
</svg>
