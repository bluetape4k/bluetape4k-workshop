<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" role="img" aria-label="Spring Boot Cache Caffeine Architecture">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#1f2937" flood-opacity="0.10"/></filter>
  <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth">
    <path d="M1,1 L8,4.5 L1,8 Z" fill="#758297"/>
  </marker>
  <style>
    .canvas{fill:#f7f9fc}.frame{fill:#fff;stroke:#d8e0ea;stroke-width:1.5}
    .title{font-family:"Architects Daughter";font-size:38px;font-weight:400;fill:#102033}
    .subtitle{font-family:"Comic Mono";font-size:14px;font-weight:400;fill:#536273}
    .smallLabel{font-family:"Architects Daughter";font-size:21px;font-weight:400;fill:#102033}
    .mono{font-family:"Comic Mono";font-size:12px;font-weight:400;fill:#102033}
    .small{font-family:"Comic Mono";font-size:12px;font-weight:400;fill:#536273}
    .card{stroke-width:2.1;filter:url(#shadow)}
    .line{stroke:#758297;stroke-width:2.1;fill:none;marker-end:url(#arrow)}
  </style>
</defs>
<!--
  Layout:
  Row1 (y=116 h=80):
    CaffeineConfig:      x=48  w=200 cx=148  right=248  bottom=196
    CaffeineCacheManager:x=298 w=210 cx=403  right=508  bottom=196
    CaffeineBean:        x=558 w=200 cx=658  right=758  bottom=196
    VirtualThread:       x=772 w=160 cx=852  right=932  bottom=196

  Row2 (y=252 h=90):
    CountryRepository: x=48  w=230 cx=163  right=278  bottom=342
    CountryPrefetcher: x=320 w=220 cx=430  right=540  bottom=342
    LocalCache:        x=580 w=200 cx=680  right=780  bottom=342
    DB/SlowSource:     x=800 w=136 cx=868  right=936  bottom=342

  Row1 arrows (horizontal, all at y=156 mid-row):
    CaffeineConfig (248,156) → CaffeineCacheManager (298,156): straight
    CaffeineCacheManager (508,156) → CaffeineBean (558,156): straight
    CaffeineBean (758,156) → VirtualThread (772,156): straight

  Row1→Row2 arrows:
    CaffeineCacheManager → CountryRepository:
      from (403,196) down to bus y=220, left to (163,220), down to (163,252)
    CaffeineConfig → CountryPrefetcher:
      from (148,196) down to bus y=230, right to (430,230), down to (430,252)

  Row2 arrows:
    CountryPrefetcher → CountryRepository:
      from left of CountryPrefetcher (320,297) straight left to CountryRepository right (278,297)
      This is fine (no card in between, direct horizontal)
    CountryRepository → LocalCache:
      PROBLEM: direct horizontal at y=297 crosses CountryPrefetcher interior.
      FIX: route via bus lane ABOVE row2 at y=248:
        from CountryRepository top-right corner area (278, 297)
        Actually better: go up from CountryRepository (163,252) → (163,242) → right to LocalCache cx (680,242) → down to LocalCache top (680,252)
        But this conflicts with the row1→row2 bus lanes.
        Use bus at y=348 BELOW row2 (bottom=342):
          CountryRepository bottom (163,342) → (163,352) → right to LocalCache cx (680,352) → up to LocalCache bottom... no
        OR: route around CountryPrefetcher using a jog: right then up-over:
          (278,297) → (310,297) → (310,244) → (680,244) → (680,252)
          310 < 320 (CountryPrefetcher left), so we stay left of Prefetcher, then go above row2 to LocalCache.
    LocalCache → DB/SlowSource:
      from LocalCache right (780,297) → DB left (800,297): straight
-->
<rect class="canvas" width="960" height="440"/>
<rect class="frame" x="24" y="20" width="912" height="400" rx="22"/>

<text class="title" x="48" y="68">Spring Boot Cache Caffeine</text>
<text class="subtitle" x="52" y="92">CaffeineConfig → CacheManager → @Cacheable services → Caffeine local cache</text>

<!-- Row 1: Config layer (top) -->
<!-- CaffeineConfig -->
<g transform="translate(48,116)">
  <rect class="card" x="0" y="0" width="200" height="80" rx="12" fill="#F1ECFF" stroke="#8A72D6"/>
  <text class="smallLabel" x="100" y="34" text-anchor="middle">CaffeineConfig</text>
  <text class="mono" x="100" y="54" text-anchor="middle">@Configuration</text>
  <text class="small" x="100" y="70" text-anchor="middle">@EnableCaching</text>
</g>

<!-- CaffeineCacheManager -->
<g transform="translate(298,116)">
  <rect class="card" x="0" y="0" width="210" height="80" rx="12" fill="#FFF3D9" stroke="#D6A441"/>
  <text class="smallLabel" x="105" y="34" text-anchor="middle">CaffeineCache</text>
  <text class="smallLabel" x="105" y="58" text-anchor="middle">Manager</text>
  <text class="small" x="105" y="75" text-anchor="middle">cache:countries, cache:cities</text>
</g>

<!-- Caffeine Bean -->
<g transform="translate(558,116)">
  <rect class="card" x="0" y="0" width="200" height="80" rx="12" fill="#EAF7EF" stroke="#58A978"/>
  <text class="smallLabel" x="100" y="34" text-anchor="middle">Caffeine Bean</text>
  <text class="mono" x="100" y="54" text-anchor="middle">maxSize=1000</text>
  <text class="small" x="100" y="70" text-anchor="middle">expireAfterAccess=5min</text>
</g>

<!-- VirtualThreadExecutor -->
<g transform="translate(772,116)">
  <rect class="card" x="0" y="0" width="160" height="80" rx="12" fill="#E9F7F6" stroke="#45A7A1"/>
  <text class="smallLabel" x="80" y="34" text-anchor="middle">Virtual</text>
  <text class="smallLabel" x="80" y="58" text-anchor="middle">Thread</text>
  <text class="small" x="80" y="75" text-anchor="middle">Lazy Loading</text>
</g>

<!-- Row 2: Service layer -->
<!-- CountryRepository -->
<g transform="translate(48,252)">
  <rect class="card" x="0" y="0" width="230" height="90" rx="12" fill="#E8F3FF" stroke="#5B8DEF"/>
  <text class="smallLabel" x="115" y="30" text-anchor="middle">Country</text>
  <text class="smallLabel" x="115" y="54" text-anchor="middle">Repository</text>
  <text class="mono" x="115" y="72" text-anchor="middle">@Cacheable @CacheEvict</text>
</g>

<!-- CountryPrefetcher -->
<g transform="translate(320,252)">
  <rect class="card" x="0" y="0" width="220" height="90" rx="12" fill="#FDECEF" stroke="#DC6B82"/>
  <text class="smallLabel" x="110" y="30" text-anchor="middle">Country</text>
  <text class="smallLabel" x="110" y="54" text-anchor="middle">Prefetcher</text>
  <text class="mono" x="110" y="72" text-anchor="middle">@Scheduled fixedDelay=10</text>
</g>

<!-- Local Caffeine Cache -->
<g transform="translate(580,252)">
  <rect class="card" x="0" y="0" width="200" height="90" rx="12" fill="#FFF3D9" stroke="#D6A441"/>
  <text class="smallLabel" x="100" y="30" text-anchor="middle">Caffeine</text>
  <text class="smallLabel" x="100" y="54" text-anchor="middle">Local Cache</text>
  <text class="small" x="100" y="72" text-anchor="middle">In-Memory</text>
</g>

<!-- DB / Slow Source -->
<g transform="translate(800,252)">
  <rect class="card" x="0" y="0" width="136" height="90" rx="12" fill="#f7f0f0" stroke="#b08090"/>
  <text class="smallLabel" x="68" y="34" text-anchor="middle">DB /</text>
  <text class="smallLabel" x="68" y="58" text-anchor="middle">Slow Source</text>
  <text class="small" x="68" y="76" text-anchor="middle">cache miss</text>
</g>

<!-- Arrows Row 1 (horizontal at y=156) -->
<!-- CaffeineConfig → CaffeineCacheManager -->
<path class="line" d="M248,156 L298,156"/>
<!-- CaffeineCacheManager → CaffeineBean -->
<path class="line" d="M508,156 L558,156"/>
<!-- CaffeineBean → VirtualThread -->
<path class="line" d="M758,156 L772,156"/>

<!-- Arrows Row 1 → Row 2 -->
<!-- CaffeineCacheManager (cx=403,196) → CountryRepository (cx=163,252):
     down to bus y=220, left to x=163, down to y=252 -->
<path class="line" d="M403,196 L403,220 L163,220 L163,252"/>

<!-- CaffeineConfig (cx=148,196) → CountryPrefetcher (cx=430,252):
     down to bus y=232, right to x=430, down to y=252 -->
<path class="line" d="M148,196 L148,232 L430,232 L430,252"/>

<!-- Arrows Row 2 -->
<!-- CountryPrefetcher (left=320) → CountryRepository (right=278): direct horizontal -->
<path class="line" d="M320,297 L278,297"/>

<!-- CountryRepository → LocalCache:
     route AROUND CountryPrefetcher via jog above row2.
     From CountryRepository right edge (278,297) go right to x=310 (just left of Prefetcher),
     then up to y=244 (above row2 top=252), right to LocalCache cx=680, down to LocalCache top (680,252). -->
<path class="line" d="M278,270 L310,270 L310,244 L680,244 L680,252"/>

<!-- LocalCache (right=780) → DB (left=800): direct horizontal -->
<path class="line" d="M780,297 L800,297"/>
</svg>
