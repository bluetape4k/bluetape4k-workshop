<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" role="img" aria-label="Vert.x Coroutines Request Sequence">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%">
    <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#1f2937" flood-opacity="0.10"/>
  </filter>
  <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth">
    <path d="M1,1 L8,4.5 L1,8 Z" fill="#758297"/>
  </marker>
  <style>
    .canvas{fill:#f7f9fc}.frame{fill:#fff;stroke:#d8e0ea;stroke-width:1.5}
    .title{font-family:"Architects Daughter";font-size:38px;font-weight:400;fill:#102033}
    .subtitle{font-family:"Comic Mono";font-size:14px;font-weight:400;fill:#536273}
    .smallLabel{font-family:"Architects Daughter";font-size:21px;font-weight:400;fill:#102033}
    .mono{font-family:"Comic Mono";font-size:12px;font-weight:400;fill:#102033}
    .small{font-family:"Comic Mono";font-size:12px;font-weight:400;fill:#536273}
    .card{stroke-width:2.1;filter:url(#shadow)}
    .line{stroke:#758297;stroke-width:2.1;fill:none;marker-end:url(#arrow)}
    .dashed{stroke:#758297;stroke-width:2.1;stroke-dasharray:7 5;fill:none;marker-end:url(#arrow)}
    .lifeline{stroke:#b7c2d1;stroke-width:1.8;stroke-dasharray:8 6;fill:none}
  </style>
</defs>
<rect class="canvas" width="960" height="480"/>
<rect class="frame" x="24" y="20" width="912" height="436" rx="20"/>
<text class="title" x="48" y="66">Vert.x Coroutines Request Sequence</text>
<text class="subtitle" x="48" y="90">HTTP Client · Router · suspendHandler · JDBCPool · coAwait · H2</text>

<!-- Participant headers -->
<rect class="card" x="60" y="108" width="120" height="44" rx="14" fill="#E8F3FF" stroke="#5B8DEF"/>
<text class="smallLabel" style="font-size:17px" x="120" y="136" text-anchor="middle">Client</text>

<rect class="card" x="272" y="108" width="120" height="44" rx="14" fill="#EAF7EF" stroke="#58A978"/>
<text class="smallLabel" style="font-size:17px" x="332" y="136" text-anchor="middle">Router</text>

<rect class="card" x="484" y="108" width="140" height="44" rx="14" fill="#FFF3D9" stroke="#D6A441"/>
<text class="smallLabel" style="font-size:17px" x="554" y="136" text-anchor="middle">suspendHandler</text>

<rect class="card" x="708" y="108" width="120" height="44" rx="14" fill="#FDECEF" stroke="#DC6B82"/>
<text class="smallLabel" style="font-size:17px" x="768" y="136" text-anchor="middle">JDBCPool</text>

<!-- Lifelines -->
<line class="lifeline" x1="120" y1="152" x2="120" y2="428"/>
<line class="lifeline" x1="332" y1="152" x2="332" y2="428"/>
<line class="lifeline" x1="554" y1="152" x2="554" y2="428"/>
<line class="lifeline" x1="768" y1="152" x2="768" y2="428"/>

<!-- Band 1: HTTP request -->
<rect class="card" x="60" y="172" width="320" height="48" rx="12" fill="#E8F3FF" stroke="#5B8DEF"/>
<text class="mono" x="80" y="192" font-weight="700" fill="#102033">1</text>
<text class="mono" x="100" y="192" fill="#102033">GET /movie/:id</text>
<text class="small" x="100" y="210" fill="#536273">HTTP request arrives</text>
<path class="line" d="M162 196 L270 196"/>

<!-- Band 2: route match + suspend -->
<rect class="card" x="272" y="232" width="320" height="48" rx="12" fill="#EAF7EF" stroke="#58A978"/>
<text class="mono" x="292" y="252" font-weight="700" fill="#102033">2</text>
<text class="mono" x="312" y="252" fill="#102033">suspendHandler { ctx }</text>
<text class="small" x="312" y="270" fill="#536273">coroutine launched</text>
<path class="line" d="M374 256 L482 256"/>

<!-- Band 3: JDBCPool query -->
<rect class="card" x="484" y="292" width="320" height="48" rx="12" fill="#FFF3D9" stroke="#D6A441"/>
<text class="mono" x="504" y="312" font-weight="700" fill="#102033">3</text>
<text class="mono" x="524" y="312" fill="#102033">preparedQuery.execute</text>
<text class="small" x="524" y="330" fill="#536273">.coAwait() suspends</text>
<path class="line" d="M626 316 L706 316"/>

<!-- Band 4: DB result return -->
<rect class="card" x="272" y="352" width="532" height="48" rx="12" fill="#FFF3D9" stroke="#D6A441"/>
<text class="mono" x="292" y="372" font-weight="700" fill="#102033">4</text>
<text class="mono" x="312" y="372" fill="#102033">RowSet resumes coroutine</text>
<text class="small" x="312" y="390" fill="#536273">H2 rows → JsonObject</text>
<path class="dashed" d="M706 376 L556 376"/>

<!-- Band 5: response -->
<rect class="card" x="60" y="412" width="532" height="44" rx="12" fill="#E9F7F6" stroke="#45A7A1"/>
<text class="mono" x="80" y="430" font-weight="700" fill="#102033">5</text>
<text class="mono" x="100" y="430" fill="#102033">ctx.response().end(json).coAwait()</text>
<text class="small" x="100" y="446" fill="#536273">200 OK JSON</text>
<path class="dashed" d="M368 434 L122 434"/>
</svg>
