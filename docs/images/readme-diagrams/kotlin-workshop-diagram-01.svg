<svg xmlns="http://www.w3.org/2000/svg" width="920" height="420" viewBox="0 0 920 420" role="img" aria-label="Kotlin Workshop Topics">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#1f2937" flood-opacity="0.10"/></filter>
  <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth">
    <path d="M1,1 L8,4.5 L1,8 Z" fill="#758297"/>
  </marker>
  <style>
    .canvas{fill:#f7f9fc}.frame{fill:#fff;stroke:#d8e0ea;stroke-width:1.5}
    .title{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:38px;font-weight:400;fill:#102033}
    .subtitle{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:14px;font-weight:400;fill:#536273}
    .smallLabel{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:21px;font-weight:400;fill:#102033}
    .mono{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#102033}
    .small{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#536273}
    .card{stroke-width:2.1;filter:url(#shadow)}
    .line{stroke:#758297;stroke-width:2.1;fill:none;marker-end:url(#arrow)}
  </style>
</defs>
<rect class="canvas" width="920" height="420"/>
<rect class="frame" x="24" y="20" width="872" height="376" rx="18"/>
<text class="title" x="44" y="62">Kotlin Workshop Topics</text>
<text class="subtitle" x="44" y="84">coroutines · DSL builders · extension functions · sealed classes · design patterns</text>

<!-- Coroutines -->
<g transform="translate(44,100)">
  <rect class="card" x="0" y="0" width="190" height="90" rx="10" fill="#E8F3FF" stroke="#5B8DEF"/>
  <text class="smallLabel" x="95" y="26" text-anchor="middle">Coroutines</text>
  <text class="small" x="95" y="48" text-anchor="middle">suspend fun, Flow</text>
  <text class="small" x="95" y="64" text-anchor="middle">channels, structured</text>
  <text class="small" x="95" y="80" text-anchor="middle">concurrency</text>
</g>

<!-- DSL Builders -->
<g transform="translate(270,100)">
  <rect class="card" x="0" y="0" width="190" height="90" rx="10" fill="#EAF7EF" stroke="#58A978"/>
  <text class="smallLabel" x="95" y="26" text-anchor="middle">DSL Builders</text>
  <text class="small" x="95" y="48" text-anchor="middle">@DslMarker</text>
  <text class="small" x="95" y="64" text-anchor="middle">BuilderInference</text>
  <text class="small" x="95" y="80" text-anchor="middle">lambda with receiver</text>
</g>

<!-- Extension Functions -->
<g transform="translate(496,100)">
  <rect class="card" x="0" y="0" width="190" height="90" rx="10" fill="#FFF3D9" stroke="#D6A441"/>
  <text class="smallLabel" x="95" y="24" text-anchor="middle">Extension Funs</text>
  <text class="small" x="95" y="46" text-anchor="middle">String.toDto()</text>
  <text class="small" x="95" y="62" text-anchor="middle">Collection.batch()</text>
  <text class="small" x="95" y="78" text-anchor="middle">operator overloading</text>
</g>

<!-- Sealed Classes -->
<g transform="translate(722,100)">
  <rect class="card" x="0" y="0" width="170" height="90" rx="10" fill="#FDECEF" stroke="#DC6B82"/>
  <text class="smallLabel" x="85" y="24" text-anchor="middle">Sealed Classes</text>
  <text class="small" x="85" y="46" text-anchor="middle">sealed class Result</text>
  <text class="small" x="85" y="62" text-anchor="middle">when exhaustive</text>
  <text class="small" x="85" y="78" text-anchor="middle">type hierarchy</text>
</g>

<!-- Design Patterns -->
<g transform="translate(44,264)">
  <rect class="card" x="0" y="0" width="190" height="90" rx="10" fill="#E9F7F6" stroke="#45A7A1"/>
  <text class="smallLabel" x="95" y="26" text-anchor="middle">Design Patterns</text>
  <text class="small" x="95" y="48" text-anchor="middle">Singleton (object)</text>
  <text class="small" x="95" y="64" text-anchor="middle">AbstractFactory</text>
  <text class="small" x="95" y="80" text-anchor="middle">FactoryMethod</text>
</g>

<!-- Value Objects -->
<g transform="translate(270,264)">
  <rect class="card" x="0" y="0" width="190" height="90" rx="10" fill="#F1ECFF" stroke="#8A72D6"/>
  <text class="smallLabel" x="95" y="26" text-anchor="middle">Value Objects</text>
  <text class="small" x="95" y="48" text-anchor="middle">@JvmInline</text>
  <text class="small" x="95" y="64" text-anchor="middle">value class Money</text>
  <text class="small" x="95" y="80" text-anchor="middle">data class wrapper</text>
</g>

<!-- Companion Object -->
<g transform="translate(496,264)">
  <rect class="card" x="0" y="0" width="190" height="90" rx="10" fill="#EEF6D9" stroke="#8BA84D"/>
  <text class="smallLabel" x="95" y="24" text-anchor="middle">Companion Object</text>
  <text class="small" x="95" y="46" text-anchor="middle">companion object { }</text>
  <text class="small" x="95" y="62" text-anchor="middle">KLogging()</text>
  <text class="small" x="95" y="78" text-anchor="middle">factory methods</text>
</g>

<!-- Delegates -->
<g transform="translate(722,264)">
  <rect class="card" x="0" y="0" width="170" height="90" rx="10" fill="#F7F1E7" stroke="#B88A44"/>
  <text class="smallLabel" x="85" y="24" text-anchor="middle">Delegates</text>
  <text class="small" x="85" y="46" text-anchor="middle">by lazy { }</text>
  <text class="small" x="85" y="62" text-anchor="middle">by Delegates.observable</text>
  <text class="small" x="85" y="78" text-anchor="middle">interface delegation</text>
</g>

<!-- Lines -->
<path class="line" d="M234,145 L268,145"/>
<path class="line" d="M460,145 L494,145"/>
<path class="line" d="M686,145 L720,145"/>
<path class="line" d="M234,309 L268,309"/>
<path class="line" d="M460,309 L494,309"/>
<path class="line" d="M686,309 L720,309"/>
</svg>
