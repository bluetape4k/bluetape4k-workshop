<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="850" viewBox="0 0 1600 850" role="img" aria-labelledby="title desc">
  <title id="title">Outbox and inbox recovery state machines</title>
  <desc id="desc">Outbox and inbox state transitions provide replay-safe Kafka delivery.</desc>
  <defs>
    <marker id="navy" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L14,7 L0,14 Z" fill="#356a91" stroke="#356a91"/></marker>
    <marker id="amber" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L14,7 L0,14 Z" fill="#a67331" stroke="#a67331"/></marker>
    <marker id="red" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L14,7 L0,14 Z" fill="#9a4b4b" stroke="#9a4b4b"/></marker>
    <style>.title{font:700 34px 'Architects Daughter',sans-serif;fill:#213447}.head{font:700 26px 'Architects Daughter',sans-serif;fill:#213447}.state{font:700 20px 'Comic Mono',monospace;fill:#263f52}.note{font:16px 'Comic Mono',monospace;fill:#526675}.flow{fill:none;stroke:#356a91;stroke-width:4;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#navy)}.retry{fill:none;stroke:#a67331;stroke-width:4;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#amber)}.stop{fill:none;stroke:#9a4b4b;stroke-width:4;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#red)}</style>
  </defs>
  <rect width="1600" height="850" fill="#f8fbfd"/>
  <text x="70" y="70" class="title">Recovery states: durable decision before Kafka progress</text>
  <rect x="65" y="120" width="700" height="650" rx="26" fill="#eaf3f9" stroke="#b9d0df" stroke-width="2"/><text x="100" y="168" class="head">Producer outbox</text>
  <rect x="140" y="220" width="180" height="70" rx="18" fill="#fff" stroke="#6f9fbe" stroke-width="2"/><text x="176" y="264" class="state">PENDING</text>
  <rect x="400" y="220" width="180" height="70" rx="18" fill="#fff" stroke="#6f9fbe" stroke-width="2"/><text x="438" y="264" class="state">CLAIMED</text>
  <rect x="400" y="390" width="180" height="70" rx="18" fill="#fff" stroke="#83aa89" stroke-width="2"/><text x="425" y="434" class="state">PUBLISHED</text>
  <rect x="140" y="390" width="180" height="70" rx="18" fill="#fff" stroke="#d1a963" stroke-width="2"/><text x="160" y="434" class="state">RETRY_WAIT</text>
  <rect x="270" y="570" width="180" height="70" rx="18" fill="#fff" stroke="#c97979" stroke-width="2"/><text x="276" y="614" class="state">QUARANTINED</text>
  <path class="flow" d="M320 255 H385"/><path class="flow" d="M490 290 V375"/><path class="retry" d="M400 270 H365 Q350 270 350 285 V410 Q350 425 335 425"/><path class="retry" d="M140 425 H105 Q90 425 90 410 V200 Q90 185 105 185 H475 Q490 185 490 200 V205"/><path class="stop" d="M230 460 V535 Q230 550 245 550 H255 Q270 550 270 565 V570"/>
  <text x="120" y="700" class="note">Owner + lease predicates fence claim/complete.</text><text x="120" y="730" class="note">Crash after broker send may replay after lease expiry.</text>
  <rect x="835" y="120" width="700" height="650" rx="26" fill="#edf6ed" stroke="#c1d7c1" stroke-width="2"/><text x="870" y="168" class="head">Consumer inbox</text>
  <rect x="910" y="220" width="180" height="70" rx="18" fill="#fff" stroke="#83aa89" stroke-width="2"/><text x="944" y="264" class="state">RECEIVED</text>
  <rect x="1170" y="220" width="180" height="70" rx="18" fill="#fff" stroke="#83aa89" stroke-width="2"/><text x="1210" y="264" class="state">APPLIED</text>
  <rect x="910" y="390" width="180" height="70" rx="18" fill="#fff" stroke="#d1a963" stroke-width="2"/><text x="930" y="434" class="state">DEFERRED</text>
  <rect x="1170" y="390" width="180" height="70" rx="18" fill="#fff" stroke="#c97979" stroke-width="2"/><text x="1175" y="434" class="state">QUARANTINED</text>
  <rect x="1040" y="570" width="180" height="70" rx="18" fill="#fff" stroke="#6f9fbe" stroke-width="2"/><text x="1055" y="614" class="state">DUPLICATE</text>
  <path class="flow" d="M1090 255 H1155"/><path class="retry" d="M1000 290 V375"/><path class="stop" d="M1090 425 H1155"/><path class="flow" d="M1000 460 V535 Q1000 550 1015 550 H1040"/>
  <text x="890" y="700" class="note">same ID + digest: DUPLICATE; different digest: QUARANTINED.</text><text x="890" y="730" class="note">Offset follows durable inbox or quarantine outcome.</text>
  <text x="70" y="815" class="note">Rounded orthogonal paths show legal recovery transitions; no Kafka offset is a financial authority.</text>
</svg>
