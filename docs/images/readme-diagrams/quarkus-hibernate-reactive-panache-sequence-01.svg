<svg xmlns="http://www.w3.org/2000/svg" width="1420" height="1371" viewBox="0 0 1420 1371" role="img" aria-label="Hibernate Reactive Panache CRUD Sequence">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#1f2937" flood-opacity="0.10"/></filter>
  <marker id="arrowBlue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M1 1 L7 4 L1 7 Z" fill="#5b8def"/></marker>
  <marker id="arrowTeal" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M1 1 L7 4 L1 7 Z" fill="#45a7a1"/></marker>
  <style>
    .canvas{fill:#f7f9fc}
    .frame{fill:#ffffff;stroke:#d8e0ea;stroke-width:1.5}
    .title{font-family:"Architects Daughter";font-size:34px;fill:#102033}
    .subtitle{font-family:"Comic Mono";font-size:13px;fill:#536273}
    .actor{font-family:"Architects Daughter";font-size:17px;fill:#102033}
    .message{font-family:"Comic Mono";font-size:12px;fill:#263445;paint-order:stroke;stroke:#ffffff;stroke-width:4px;stroke-linejoin:round}
    .detail{font-family:"Comic Mono";font-size:11px;fill:#536273}
    .lifeline{stroke:#b8c4d3;stroke-width:1.4;stroke-dasharray:7 6}
    .call{stroke:#5b8def;stroke-width:2.15;fill:none;marker-end:url(#arrowBlue)}
    .return{stroke:#45a7a1;stroke-width:2.05;stroke-dasharray:7 5;fill:none;marker-end:url(#arrowTeal)}
    .box{stroke-width:1.8;filter:url(#shadow)}
  </style>
</defs>
<rect class="canvas" width="1420" height="1371"/>
<rect class="frame" x="24" y="20" width="1372" height="1331" rx="18"/>
<text class="title" x="48" y="58">Hibernate Reactive Panache CRUD Sequence</text>
<text class="subtitle" x="50" y="84">Quarkus · RESTEasy · PanacheEntity · SessionFactory · PostgreSQL</text>
<rect class="box" x="40" y="108" width="220" height="58" rx="10" fill="#e8f3ff" stroke="#7aa0c4"/>
<text class="actor" x="150" y="137" text-anchor="middle" dominant-baseline="middle">Client</text>
<line class="lifeline" x1="150" y1="166" x2="150" y2="1313"/>
<rect class="box" x="320" y="108" width="220" height="58" rx="10" fill="#eaf7ef" stroke="#7aa0c4"/>
<text class="actor" x="430" y="137" text-anchor="middle" dominant-baseline="middle">Resource RESTEasy</text>
<line class="lifeline" x1="430" y1="166" x2="430" y2="1313"/>
<rect class="box" x="600" y="108" width="220" height="58" rx="10" fill="#fff3d9" stroke="#7aa0c4"/>
<text class="actor" x="710" y="130" text-anchor="middle" dominant-baseline="middle">PanacheEntity Reactive</text>
<text class="actor" x="710" y="144" text-anchor="middle" dominant-baseline="middle">ORM</text>
<line class="lifeline" x1="710" y1="166" x2="710" y2="1313"/>
<rect class="box" x="880" y="108" width="220" height="58" rx="10" fill="#f1ecff" stroke="#7aa0c4"/>
<text class="actor" x="990" y="130" text-anchor="middle" dominant-baseline="middle">SessionFactory</text>
<text class="actor" x="990" y="144" text-anchor="middle" dominant-baseline="middle">Hibernate</text>
<line class="lifeline" x1="990" y1="166" x2="990" y2="1313"/>
<rect class="box" x="1160" y="108" width="220" height="58" rx="10" fill="#fdecef" stroke="#7aa0c4"/>
<text class="actor" x="1270" y="130" text-anchor="middle" dominant-baseline="middle">PostgreSQL</text>
<text class="actor" x="1270" y="144" text-anchor="middle" dominant-baseline="middle">Testcontainers</text>
<line class="lifeline" x1="1270" y1="166" x2="1270" y2="1313"/>
<path class="call" d="M150 205 L430 205"/>
<rect class="message-label" x="75" y="219" width="430" height="31" rx="7" fill="#ffffff" opacity="0.96" stroke="#dbe3ee"/>
<text class="message" x="290" y="234.5" text-anchor="middle" dominant-baseline="middle">1. POST /entity body</text>
<path class="call" d="M430 313 L710 313"/>
<rect class="message-label" x="355" y="327" width="430" height="31" rx="7" fill="#ffffff" opacity="0.96" stroke="#dbe3ee"/>
<text class="message" x="570" y="342.5" text-anchor="middle" dominant-baseline="middle">2. entity.persist()</text>
<path class="call" d="M710 421 L990 421"/>
<rect class="message-label" x="635" y="435" width="430" height="31" rx="7" fill="#ffffff" opacity="0.96" stroke="#dbe3ee"/>
<text class="message" x="850" y="450.5" text-anchor="middle" dominant-baseline="middle">3. INSERT INTO entity ...</text>
<path class="call" d="M990 529 L1270 529"/>
<rect class="message-label" x="915" y="543" width="430" height="31" rx="7" fill="#ffffff" opacity="0.96" stroke="#dbe3ee"/>
<text class="message" x="1130" y="558.5" text-anchor="middle" dominant-baseline="middle">4. execute SQL</text>
<path class="return" d="M1270 637 L990 637"/>
<rect class="message-label" x="915" y="651" width="430" height="31" rx="7" fill="#ffffff" opacity="0.96" stroke="#dbe3ee"/>
<text class="message" x="1130" y="666.5" text-anchor="middle" dominant-baseline="middle">5. entity id returned</text>
<path class="return" d="M990 745 L710 745"/>
<rect class="message-label" x="635" y="759" width="430" height="31" rx="7" fill="#ffffff" opacity="0.96" stroke="#dbe3ee"/>
<text class="message" x="850" y="774.5" text-anchor="middle" dominant-baseline="middle">6. Uni&amp;#60;Entity&amp;#62;</text>
<path class="return" d="M710 853 L430 853"/>
<rect class="message-label" x="355" y="867" width="430" height="31" rx="7" fill="#ffffff" opacity="0.96" stroke="#dbe3ee"/>
<text class="message" x="570" y="882.5" text-anchor="middle" dominant-baseline="middle">7. 201 Created response</text>
<path class="return" d="M430 961 L150 961"/>
<rect class="message-label" x="75" y="975" width="430" height="31" rx="7" fill="#ffffff" opacity="0.96" stroke="#dbe3ee"/>
<text class="message" x="290" y="990.5" text-anchor="middle" dominant-baseline="middle">8. GET /entity/{id} — Read</text>
<path class="call" d="M150 1069 L430 1069"/>
<rect class="message-label" x="75" y="1083" width="430" height="46" rx="7" fill="#ffffff" opacity="0.96" stroke="#dbe3ee"/>
<text class="message" x="290" y="1098.5" text-anchor="middle" dominant-baseline="middle">9. GET /entity/{id} → find() → SELECT → entity →</text>
<text class="message" x="290" y="1113.5" text-anchor="middle" dominant-baseline="middle">200 OK</text>
<path class="call" d="M430 1177 L1270 1177"/>
<rect class="message-label" x="570" y="1191" width="560" height="31" rx="7" fill="#ffffff" opacity="0.96" stroke="#dbe3ee"/>
<text class="message" x="850" y="1206.5" text-anchor="middle" dominant-baseline="middle">10. Resource RESTEasy to PostgreSQL Testcontainers</text>
</svg>
