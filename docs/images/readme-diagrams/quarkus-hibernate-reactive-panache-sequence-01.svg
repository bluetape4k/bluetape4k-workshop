<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="520" viewBox="0 0 1040 520" role="img" aria-label="Quarkus Hibernate Reactive Panache Sequence">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#1f2937" flood-opacity="0.09"/></filter>
  <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth">
    <path d="M1,1 L8,4.5 L1,8 Z" fill="#758297"/>
  </marker>
  <style>
    .canvas{fill:#f7f9fc}.frame{fill:#fff;stroke:#d8e0ea;stroke-width:1.5}
    .title{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:38px;font-weight:400;fill:#102033}
    .subtitle{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:14px;font-weight:400;fill:#536273}
    .smallLabel{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:21px;font-weight:400;fill:#102033}
    .mono{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#102033}
    .small{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#536273}
    .card{stroke-width:2.1;filter:url(#shadow)}
    .line{stroke:#758297;stroke-width:2.1;fill:none;marker-end:url(#arrow)}
    .lifeline{stroke:#b0bbca;stroke-width:1.5;stroke-dasharray:6 4;fill:none}
    .reqArrow{stroke:#5B8DEF;stroke-width:2.1;fill:none;marker-end:url(#arrow)}
    .rspArrow{stroke:#45A7A1;stroke-width:2.1;stroke-dasharray:7 4;fill:none;marker-end:url(#arrow)}
    .msgLabel{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:13px;fill:#102033}
    .sectionLabel{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:14px;fill:#8A72D6}
  </style>
</defs>
<rect class="canvas" width="1040" height="520"/>
<rect class="frame" x="24" y="20" width="992" height="476" rx="20"/>

<!-- Title -->
<text class="title" x="48" y="66">Hibernate Reactive Panache CRUD Sequence</text>
<text class="subtitle" x="48" y="90">Quarkus · RESTEasy · PanacheEntity · SessionFactory · PostgreSQL</text>

<!-- Participants at y=108 -->
<!-- x: Client=100, Resource=260, PanacheEntity=460, SessionFactory=660, PostgreSQL=860 -->
<rect class="card" x="26" y="108" width="148" height="56" rx="12" fill="#E8F3FF" stroke="#5B8DEF"/>
<text class="smallLabel" x="100" y="139" text-anchor="middle">Client</text>

<rect class="card" x="186" y="108" width="148" height="56" rx="12" fill="#EAF7EF" stroke="#58A978"/>
<text class="smallLabel" x="260" y="132" text-anchor="middle">Resource</text>
<text class="small" x="260" y="152" text-anchor="middle">RESTEasy</text>

<rect class="card" x="386" y="108" width="148" height="56" rx="12" fill="#FFF3D9" stroke="#D6A441"/>
<text class="smallLabel" x="460" y="132" text-anchor="middle">PanacheEntity</text>
<text class="small" x="460" y="152" text-anchor="middle">Reactive ORM</text>

<rect class="card" x="586" y="108" width="148" height="56" rx="12" fill="#F1ECFF" stroke="#8A72D6"/>
<text class="smallLabel" x="660" y="132" text-anchor="middle">SessionFactory</text>
<text class="small" x="660" y="152" text-anchor="middle">Hibernate</text>

<rect class="card" x="786" y="108" width="148" height="56" rx="12" fill="#FDECEF" stroke="#DC6B82"/>
<text class="smallLabel" x="860" y="132" text-anchor="middle">PostgreSQL</text>
<text class="small" x="860" y="152" text-anchor="middle">Testcontainers</text>

<!-- Lifelines -->
<line class="lifeline" x1="100" y1="164" x2="100" y2="510"/>
<line class="lifeline" x1="260" y1="164" x2="260" y2="510"/>
<line class="lifeline" x1="460" y1="164" x2="460" y2="510"/>
<line class="lifeline" x1="660" y1="164" x2="660" y2="510"/>
<line class="lifeline" x1="860" y1="164" x2="860" y2="510"/>

<!-- Section: POST create -->
<text class="sectionLabel" x="36" y="188">POST /entity — Create</text>

<!-- 1: POST /entity body -->
<text class="msgLabel" x="103" y="210" fill="#5B8DEF">① POST /entity body</text>
<path class="reqArrow" d="M100 220 L260 220"/>

<!-- 2: entity.persist() -->
<text class="msgLabel" x="263" y="243" fill="#5B8DEF">② entity.persist()</text>
<path class="reqArrow" d="M260 253 L460 253"/>

<!-- 3: INSERT INTO ... -->
<text class="msgLabel" x="463" y="276" fill="#5B8DEF">③ INSERT INTO entity ...</text>
<path class="reqArrow" d="M460 286 L660 286"/>
<!-- to PostgreSQL -->
<text class="msgLabel" x="663" y="309" fill="#5B8DEF">④ execute SQL</text>
<path class="reqArrow" d="M660 319 L860 319"/>

<!-- 4: entity id returned -->
<text class="msgLabel" x="663" y="349" fill="#45A7A1">⑤ entity id returned</text>
<path class="rspArrow" d="M860 359 L660 359"/>

<text class="msgLabel" x="463" y="382" fill="#45A7A1">⑥ Uni&#60;Entity&#62;</text>
<path class="rspArrow" d="M660 392 L460 392"/>

<text class="msgLabel" x="263" y="415" fill="#45A7A1">⑦ 201 Created response</text>
<path class="rspArrow" d="M460 425 L260 425"/>
<path class="rspArrow" d="M260 437 L100 437"/>

<!-- Section: GET find -->
<text class="sectionLabel" x="36" y="462">GET /entity/{id} — Read</text>

<text class="msgLabel" x="103" y="480" fill="#5B8DEF">⑧ GET /entity/{id} → find() → SELECT → entity → 200 OK</text>
<path class="reqArrow" d="M100 490 L260 490"/>
<path class="reqArrow" d="M260 500 L860 500"/>
</svg>
