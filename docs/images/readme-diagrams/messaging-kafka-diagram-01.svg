<svg xmlns="http://www.w3.org/2000/svg" width="960" height="460" viewBox="0 0 960 460" role="img" aria-label="Kafka Messaging Architecture">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#1f2937" flood-opacity="0.10"/></filter>
  <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth">
    <path d="M1,1 L8,4.5 L1,8 Z" fill="#758297"/>
  </marker>
  <style>
    .canvas{fill:#f7f9fc}.frame{fill:#fff;stroke:#d8e0ea;stroke-width:1.5}
    .title{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:38px;font-weight:400;fill:#102033}
    .subtitle{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:14px;font-weight:400;fill:#536273}
    .smallLabel{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:21px;font-weight:400;fill:#102033}
    .small{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#536273}
    .card{stroke-width:2.1;filter:url(#shadow)}
    .line{stroke:#758297;stroke-width:2.1;fill:none;marker-end:url(#arrow)}
    .sendto{stroke:#45A7A1;stroke-width:1.8;stroke-dasharray:6 3;fill:none;marker-end:url(#arrow)}
  </style>
</defs>
<rect class="canvas" width="960" height="460"/>
<rect class="frame" x="24" y="20" width="912" height="416" rx="18"/>
<text class="title" x="44" y="62">Kafka Messaging Architecture</text>
<text class="subtitle" x="44" y="84">GET→simple.topic.1·SimpleHandler · POST→greeting.topic.1→@SendTo→logger.topic.1→LoggerHandler</text>

<!-- Row 1: col1=44 col2=262 col3=480 col4=724; card w=190 -->
<!-- GreetingController -->
<g transform="translate(44,106)">
  <rect class="card" x="0" y="0" width="190" height="80" rx="10" fill="#E8F3FF" stroke="#5B8DEF"/>
  <text class="smallLabel" x="95" y="28" text-anchor="middle">Greeting</text>
  <text class="smallLabel" x="95" y="50" text-anchor="middle">Controller</text>
  <text class="small" x="95" y="68" text-anchor="middle">GET/POST /greeting</text>
</g>

<!-- KafkaTemplate -->
<g transform="translate(262,106)">
  <rect class="card" x="0" y="0" width="190" height="80" rx="10" fill="#EAF7EF" stroke="#58A978"/>
  <text class="smallLabel" x="95" y="28" text-anchor="middle">Kafka</text>
  <text class="smallLabel" x="95" y="50" text-anchor="middle">Template</text>
  <text class="small" x="95" y="68" text-anchor="middle">send(topic, key, value)</text>
</g>

<!-- greeting.topic.1 -->
<g transform="translate(480,106)">
  <rect class="card" x="0" y="0" width="190" height="80" rx="10" fill="#FFF3D9" stroke="#D6A441"/>
  <text class="smallLabel" x="95" y="28" text-anchor="middle">greeting</text>
  <text class="smallLabel" x="95" y="50" text-anchor="middle">.topic.1</text>
  <text class="small" x="95" y="68" text-anchor="middle">POST sends here</text>
</g>

<!-- simple.topic.1 -->
<g transform="translate(724,106)">
  <rect class="card" x="0" y="0" width="190" height="80" rx="10" fill="#FDECEF" stroke="#DC6B82"/>
  <text class="smallLabel" x="95" y="28" text-anchor="middle">simple</text>
  <text class="smallLabel" x="95" y="50" text-anchor="middle">.topic.1</text>
  <text class="small" x="95" y="68" text-anchor="middle">GET sends here</text>
</g>

<!-- Row 2: -->
<!-- GreetingMessageHandler -->
<g transform="translate(44,274)">
  <rect class="card" x="0" y="0" width="190" height="90" rx="10" fill="#E9F7F6" stroke="#45A7A1"/>
  <text class="smallLabel" x="95" y="22" text-anchor="middle">Greeting</text>
  <text class="smallLabel" x="95" y="42" text-anchor="middle">MessageHandler</text>
  <text class="small" x="95" y="60" text-anchor="middle">@KafkaListener</text>
  <text class="small" x="95" y="76" text-anchor="middle">@SendTo logger.topic.1</text>
</g>

<!-- logger.topic.1 -->
<g transform="translate(262,274)">
  <rect class="card" x="0" y="0" width="190" height="90" rx="10" fill="#F7F1E7" stroke="#B88A44"/>
  <text class="smallLabel" x="95" y="22" text-anchor="middle">logger</text>
  <text class="smallLabel" x="95" y="42" text-anchor="middle">.topic.1</text>
  <text class="small" x="95" y="60" text-anchor="middle">Kafka Topic</text>
  <text class="small" x="95" y="76" text-anchor="middle">GreetingResult msgs</text>
</g>

<!-- LoggerMessageHandler -->
<g transform="translate(480,274)">
  <rect class="card" x="0" y="0" width="190" height="90" rx="10" fill="#EEF6D9" stroke="#8BA84D"/>
  <text class="smallLabel" x="95" y="22" text-anchor="middle">Logger</text>
  <text class="smallLabel" x="95" y="42" text-anchor="middle">MessageHandler</text>
  <text class="small" x="95" y="60" text-anchor="middle">@KafkaListener</text>
  <text class="small" x="95" y="76" text-anchor="middle">topics=[logger.topic.1]</text>
</g>

<!-- SimpleMessageHandler -->
<g transform="translate(724,274)">
  <rect class="card" x="0" y="0" width="190" height="90" rx="10" fill="#F1ECFF" stroke="#8A72D6"/>
  <text class="smallLabel" x="95" y="22" text-anchor="middle">Simple</text>
  <text class="smallLabel" x="95" y="42" text-anchor="middle">MessageHandler</text>
  <text class="small" x="95" y="60" text-anchor="middle">@KafkaListener</text>
  <text class="small" x="95" y="76" text-anchor="middle">topics=[simple.topic.1]</text>
</g>

<!-- Arrows -->
<!-- Controller → KafkaTemplate -->
<path class="line" d="M234,146 L260,146"/>
<!-- KafkaTemplate → greeting.topic.1 -->
<path class="line" d="M452,146 L478,146"/>
<!-- KafkaTemplate → simple.topic.1 (arc over greeting.topic.1) -->
<path class="line" d="M357,106 C357,72 819,72 819,104"/>
<!-- greeting.topic.1 → GreetingMessageHandler (diagonal) -->
<path class="line" d="M575,186 L139,272"/>
<!-- GreetingMessageHandler @SendTo → logger.topic.1 -->
<path class="sendto" d="M234,319 L260,319"/>
<!-- logger.topic.1 → LoggerMessageHandler -->
<path class="line" d="M452,319 L478,319"/>
<!-- simple.topic.1 → SimpleMessageHandler (vertical) -->
<path class="line" d="M819,186 L819,272"/>
</svg>
