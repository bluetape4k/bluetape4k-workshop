<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" role="img" aria-label="Kafka Messaging Architecture">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#1f2937" flood-opacity="0.10"/></filter>
  <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth">
    <path d="M1,1 L8,4.5 L1,8 Z" fill="#758297"/>
  </marker>
  <style>
    .canvas{fill:#f7f9fc}.frame{fill:#fff;stroke:#d8e0ea;stroke-width:1.5}
    .title{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:38px;font-weight:400;fill:#102033}
    .subtitle{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:14px;font-weight:400;fill:#536273}
    .smallLabel{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:21px;font-weight:400;fill:#102033}
    .small{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#536273}
    .card{stroke-width:2.1;filter:url(#shadow)}
    .line{stroke:#758297;stroke-width:2.1;fill:none;marker-end:url(#arrow)}
    .sendto{stroke:#45A7A1;stroke-width:1.8;stroke-dasharray:6 3;fill:none;marker-end:url(#arrow)}
  </style>
</defs>
<!--
  Layered left-to-right flow layout.

  Flow 1 (GET path, top lane, y=110..190):
    GreetingController → KafkaTemplate → simple.topic.1 → SimpleMessageHandler

  Flow 2 (POST path, bottom lane, y=300..400):
    GreetingController → KafkaTemplate → greeting.topic.1 → GreetingMessageHandler [@SendTo] logger.topic.1 → LoggerMessageHandler

  Shared column centers (x):
    Col1 GreetingController: x=44  w=170 cx=129  right=214
    Col2 KafkaTemplate:      x=252 w=170 cx=337  right=422
    Col3 topics:             x=460 w=170 cx=545  right=630
    Col4 handlers:           x=668 w=200 cx=768  right=868
    (POST flow) Col5 logger.topic.1: x=490 w=170 cx=575  right=660
    (POST flow) Col6 LoggerHandler:  x=680 w=200 cx=780  right=880

  Better approach: use 5 columns for the full topology
    Controller (shared), KafkaTemplate (shared), topic1/topic2, handler1/handler2, logger-topic, logger-handler

  Cleaner 4-col layout with two horizontal lanes:
    Col1 x=44  w=180 cx=134
    Col2 x=256 w=180 cx=346
    Col3 x=468 w=180 cx=558
    Col4 x=680 w=240 cx=800

  Top lane (GET): y=108  h=76
  Bottom lane (POST→@SendTo chain): y=282 h=76, with extra @SendTo lane at y=378 h=60

  But GreetingController needs to connect to both lanes.
  Use a shared controller card spanning or a vertical stem from one controller to both lanes.
-->
<rect class="canvas" width="960" height="480"/>
<rect class="frame" x="24" y="20" width="912" height="436" rx="18"/>
<text class="title" x="44" y="62">Kafka Messaging Architecture</text>
<text class="subtitle" x="44" y="84">GET→simple.topic.1·SimpleHandler · POST→greeting.topic.1→@SendTo→logger.topic.1→LoggerHandler</text>

<!--
  5-column layout:
  Col1 Controller: x=40  w=160 cx=120 right=200
  Col2 KafkaTemplate: x=224 w=160 cx=304 right=384
  Col3 Topics row1: x=408 w=160 cx=488 right=568
  Col4 Handlers row1: x=592 w=168 cx=676 right=760
  (no col5 needed: use extended row2 for @SendTo chain)

  Lane 1 (GET, y=110 h=80):
    GreetingController → KafkaTemplate → simple.topic.1 → SimpleMessageHandler

  Lane 2 (POST, y=286 h=80):
    GreetingController → KafkaTemplate → greeting.topic.1 → GreetingMessageHandler

  Lane 3 (@SendTo result, y=386 h=60):
    @SendTo → logger.topic.1 → LoggerMessageHandler
    logger.topic.1 at col3, LoggerMessageHandler at col4
-->

<!-- Lane 1: GET path -->
<!-- GreetingController -->
<g transform="translate(40,110)">
  <rect class="card" x="0" y="0" width="160" height="80" rx="10" fill="#E8F3FF" stroke="#5B8DEF"/>
  <text class="smallLabel" x="80" y="24" text-anchor="middle">Greeting</text>
  <text class="smallLabel" x="80" y="46" text-anchor="middle">Controller</text>
  <text class="small" x="80" y="66" text-anchor="middle">GET /greeting</text>
</g>

<!-- KafkaTemplate lane1 -->
<g transform="translate(224,110)">
  <rect class="card" x="0" y="0" width="160" height="80" rx="10" fill="#EAF7EF" stroke="#58A978"/>
  <text class="smallLabel" x="80" y="28" text-anchor="middle">Kafka</text>
  <text class="smallLabel" x="80" y="50" text-anchor="middle">Template</text>
  <text class="small" x="80" y="68" text-anchor="middle">send(topic,key,val)</text>
</g>

<!-- simple.topic.1 -->
<g transform="translate(408,110)">
  <rect class="card" x="0" y="0" width="160" height="80" rx="10" fill="#FDECEF" stroke="#DC6B82"/>
  <text class="smallLabel" x="80" y="28" text-anchor="middle">simple</text>
  <text class="smallLabel" x="80" y="50" text-anchor="middle">.topic.1</text>
  <text class="small" x="80" y="68" text-anchor="middle">GET sends here</text>
</g>

<!-- SimpleMessageHandler -->
<g transform="translate(592,110)">
  <rect class="card" x="0" y="0" width="168" height="80" rx="10" fill="#F1ECFF" stroke="#8A72D6"/>
  <text class="smallLabel" x="84" y="24" text-anchor="middle">Simple</text>
  <text class="smallLabel" x="84" y="46" text-anchor="middle">MessageHandler</text>
  <text class="small" x="84" y="66" text-anchor="middle">@KafkaListener</text>
</g>

<!-- Lane 2: POST path -->
<!-- GreetingController (POST) -->
<g transform="translate(40,286)">
  <rect class="card" x="0" y="0" width="160" height="80" rx="10" fill="#E8F3FF" stroke="#5B8DEF"/>
  <text class="smallLabel" x="80" y="24" text-anchor="middle">Greeting</text>
  <text class="smallLabel" x="80" y="46" text-anchor="middle">Controller</text>
  <text class="small" x="80" y="66" text-anchor="middle">POST /greeting</text>
</g>

<!-- KafkaTemplate lane2 -->
<g transform="translate(224,286)">
  <rect class="card" x="0" y="0" width="160" height="80" rx="10" fill="#EAF7EF" stroke="#58A978"/>
  <text class="smallLabel" x="80" y="28" text-anchor="middle">Kafka</text>
  <text class="smallLabel" x="80" y="50" text-anchor="middle">Template</text>
  <text class="small" x="80" y="68" text-anchor="middle">send(topic,key,val)</text>
</g>

<!-- greeting.topic.1 -->
<g transform="translate(408,286)">
  <rect class="card" x="0" y="0" width="160" height="80" rx="10" fill="#FFF3D9" stroke="#D6A441"/>
  <text class="smallLabel" x="80" y="28" text-anchor="middle">greeting</text>
  <text class="smallLabel" x="80" y="50" text-anchor="middle">.topic.1</text>
  <text class="small" x="80" y="68" text-anchor="middle">POST sends here</text>
</g>

<!-- GreetingMessageHandler -->
<g transform="translate(592,286)">
  <rect class="card" x="0" y="0" width="168" height="80" rx="10" fill="#E9F7F6" stroke="#45A7A1"/>
  <text class="smallLabel" x="84" y="24" text-anchor="middle">Greeting</text>
  <text class="smallLabel" x="84" y="46" text-anchor="middle">MessageHandler</text>
  <text class="small" x="84" y="66" text-anchor="middle">@KafkaListener</text>
</g>

<!-- Lane 3: @SendTo chain (below lane 2) -->
<!-- logger.topic.1 -->
<g transform="translate(408,394)">
  <rect class="card" x="0" y="0" width="160" height="68" rx="10" fill="#F7F1E7" stroke="#B88A44"/>
  <text class="smallLabel" x="80" y="22" text-anchor="middle">logger.topic.1</text>
  <text class="small" x="80" y="42" text-anchor="middle">Kafka Topic</text>
  <text class="small" x="80" y="58" text-anchor="middle">GreetingResult msgs</text>
</g>

<!-- LoggerMessageHandler -->
<g transform="translate(592,394)">
  <rect class="card" x="0" y="0" width="168" height="68" rx="10" fill="#EEF6D9" stroke="#8BA84D"/>
  <text class="smallLabel" x="84" y="22" text-anchor="middle">Logger</text>
  <text class="smallLabel" x="84" y="44" text-anchor="middle">MessageHandler</text>
  <text class="small" x="84" y="62" text-anchor="middle">@KafkaListener</text>
</g>

<!-- Arrows Lane 1 (GET) -->
<!-- Controller → KafkaTemplate -->
<path class="line" d="M200,150 L224,150"/>
<!-- KafkaTemplate → simple.topic.1 -->
<path class="line" d="M384,150 L408,150"/>
<!-- simple.topic.1 → SimpleMessageHandler -->
<path class="line" d="M568,150 L592,150"/>

<!-- Arrows Lane 2 (POST) -->
<!-- Controller → KafkaTemplate -->
<path class="line" d="M200,326 L224,326"/>
<!-- KafkaTemplate → greeting.topic.1 -->
<path class="line" d="M384,326 L408,326"/>
<!-- greeting.topic.1 → GreetingMessageHandler -->
<path class="line" d="M568,326 L592,326"/>

<!-- Arrows Lane 3 (@SendTo) -->
<!-- GreetingMessageHandler → logger.topic.1 via @SendTo (dashed, goes down then left to logger.topic.1) -->
<path class="sendto" d="M676,366 L676,380 L488,380 L488,394"/>
<!-- logger.topic.1 → LoggerMessageHandler -->
<path class="line" d="M568,428 L592,428"/>
</svg>
