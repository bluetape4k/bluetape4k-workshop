<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1620" height="940" viewBox="0 0 1620 940" role="img" aria-label="Gateway orders service architecture">
  <defs>
    <filter id="shadow" x="-8%" y="-10%" width="116%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#5b7282" flood-opacity="0.15"/>
    </filter>
    <marker id="blueArrow" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" viewBox="0 0 10.7692 10.7692" refX="9" refY="5" orient="auto" data-role="primary" data-tip-direction="positive-x"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#457b9d" stroke-dasharray="none" stroke-linecap="round" stroke-linejoin="round" stroke="#457b9d" stroke-width="0"/></marker>
    <marker id="greenArrow" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" viewBox="0 0 10.7692 10.7692" refX="9" refY="5" orient="auto" data-role="primary" data-tip-direction="positive-x"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#5f8f5b" stroke-dasharray="none" stroke-linecap="round" stroke-linejoin="round" stroke="#5f8f5b" stroke-width="0"/></marker>
    <marker id="goldArrow" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" viewBox="0 0 11.6667 11.6667" refX="9" refY="5" orient="auto" data-role="primary" data-tip-direction="positive-x"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#a87332" stroke-dasharray="none" stroke-linecap="round" stroke-linejoin="round" stroke="#a87332" stroke-width="0"/></marker>
    <style>
      .canvas { fill: #f7fafc; }
      .frame { fill: #fffefd; stroke: #cdd8df; stroke-width: 2; }
      .title { font-family: "Architects Daughter"; font-size: 38px; fill: #1d2b38; }
      .subtitle { font-family: "Comic Mono"; font-size: 16px; fill: #516172; }
      .layerTitle { font-family: "Architects Daughter"; font-size: 24px; fill: #263747; }
      .cardTitle { font-family: "Architects Daughter"; font-size: 25px; fill: #1d2b38; }
      .cardText { font-family: "Comic Mono"; font-size: 15px; fill: #42515f; }
      .smallText { font-family: "Comic Mono"; font-size: 13px; fill: #566575; }
      .layer { stroke-width: 1.6; }
      .card { stroke-width: 2.2; filter: url(#shadow); }
      .lineBlue { fill: none; stroke: #457b9d; stroke-width: 4.2; marker-end: url(#blueArrow); stroke-linecap: round; stroke-linejoin: round; }
      .lineGreen { fill: none; stroke: #5f8f5b; stroke-width: 4.2; marker-end: url(#greenArrow); stroke-linecap: round; stroke-linejoin: round; }
      .lineGold { fill: none; stroke: #a87332; stroke-width: 3.8; marker-end: url(#goldArrow); stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 9 8; }
      .label { font-family: "Comic Mono"; font-size: 14px; font-weight: 700; }
      .labelBox { fill: #ffffff; stroke-width: 1.4; }
    </style>
  </defs>

  <rect class="canvas" width="1620" height="940"/>
  <rect class="frame" x="28" y="28" width="1564" height="884" rx="24"/>
  <text class="title" x="810" y="84" text-anchor="middle">Orders Service</text>
  <text class="subtitle" x="810" y="114" text-anchor="middle">Order and product WebFlux APIs for the gateway workshop, running on port 8082.</text>

  <rect class="layer" x="82" y="164" width="300" height="610" rx="18" fill="#eef6ff" stroke="#b5cfe8"/>
  <text class="layerTitle" x="232" y="207" text-anchor="middle">Caller</text>

  <rect class="layer" x="442" y="164" width="730" height="610" rx="18" fill="#f3fbf0" stroke="#b7d4ae"/>
  <text class="layerTitle" x="807" y="207" text-anchor="middle">Order Application</text>

  <rect class="layer" x="1232" y="164" width="308" height="610" rx="18" fill="#fff8ea" stroke="#dec289"/>
  <text class="layerTitle" x="1386" y="207" text-anchor="middle">Support</text>

  <rect class="card" x="132" y="300" width="200" height="142" rx="14" fill="#ffffff" stroke="#8eb4d6"/>
  <text class="cardTitle" x="232" y="352" text-anchor="middle">Gateway</text>
  <text class="cardText" x="232" y="384" text-anchor="middle">forwards to :8082</text>
  <text class="smallText" x="232" y="412" text-anchor="middle">orders + products</text>

  <rect class="card" x="132" y="548" width="200" height="108" rx="14" fill="#ffffff" stroke="#8eb4d6"/>
  <text class="cardTitle" x="232" y="590" text-anchor="middle">Browser</text>
  <text class="cardText" x="232" y="622" text-anchor="middle">opens /</text>

  <rect class="card" x="502" y="246" width="286" height="126" rx="14" fill="#ffffff" stroke="#91b884"/>
  <text class="cardTitle" x="645" y="290" text-anchor="middle">Order Controller</text>
  <text class="cardText" x="645" y="322" text-anchor="middle">GET /api/v1/orders</text>
  <text class="smallText" x="645" y="348" text-anchor="middle">Winter, Spring orders</text>

  <rect class="card" x="842" y="246" width="286" height="126" rx="14" fill="#ffffff" stroke="#91b884"/>
  <text class="cardTitle" x="985" y="290" text-anchor="middle">Product Controller</text>
  <text class="cardText" x="985" y="322" text-anchor="middle">GET /api/v1/products</text>
  <text class="smallText" x="985" y="348" text-anchor="middle">Mac Book Pro, iPhone</text>

  <rect class="card" x="604" y="430" width="410" height="90" rx="14" fill="#f9fbff" stroke="#9db4c8"/>
  <text class="cardTitle" x="809" y="468" text-anchor="middle">Uuid.V7</text>
  <text class="smallText" x="809" y="496" text-anchor="middle">sample identifier generator</text>

  <rect class="card" x="502" y="586" width="286" height="96" rx="14" fill="#f9fbff" stroke="#9db4c8"/>
  <text class="cardTitle" x="645" y="625" text-anchor="middle">Order</text>
  <text class="smallText" x="645" y="653" text-anchor="middle">orderNumber, amount, customerName</text>

  <rect class="card" x="842" y="586" width="286" height="96" rx="14" fill="#f9fbff" stroke="#9db4c8"/>
  <text class="cardTitle" x="985" y="625" text-anchor="middle">Product</text>
  <text class="smallText" x="985" y="653" text-anchor="middle">id, name, price</text>

  <rect class="card" x="502" y="724" width="626" height="96" rx="14" fill="#fffdf6" stroke="#c39a56"/>
  <text class="cardTitle" x="815" y="763" text-anchor="middle">RedirectWebFilter</text>
  <text class="cardText" x="815" y="794" text-anchor="middle">/ -> /swagger-ui.html</text>

  <rect class="card" x="1282" y="258" width="210" height="118" rx="14" fill="#fffefa" stroke="#d2a85e"/>
  <text class="cardTitle" x="1387" y="300" text-anchor="middle">SwaggerConfig</text>
  <text class="smallText" x="1387" y="329" text-anchor="middle">OpenAPI metadata</text>
  <text class="smallText" x="1387" y="352" text-anchor="middle">BuildProperties</text>

  <rect class="card" x="1282" y="504" width="210" height="130" rx="14" fill="#fffefa" stroke="#d2a85e"/>
  <text class="cardTitle" x="1387" y="546" text-anchor="middle">Observation</text>
  <text class="smallText" x="1387" y="576" text-anchor="middle">ObservedAspect</text>
  <text class="smallText" x="1387" y="599" text-anchor="middle">MeterFilter excludes</text>
  <text class="smallText" x="1387" y="622" text-anchor="middle">actuator/api-docs</text>

  <path class="lineBlue" d="M 332 348 H 502" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#blueArrow)"/>
  <rect class="labelBox" x="362" y="306" width="112" height="30" rx="15" stroke="#8eb4d6"/>
  <text class="label" x="418" y="326" text-anchor="middle" fill="#457b9d">orders API</text>

  <path class="lineBlue" d="M 332 394 L 410 394 Q 420 394 420 384 L 420 236 Q 420 226 430 226 L 976 226 Q 985 226 985 235 L 985 246" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#blueArrow)"/>
  <rect class="labelBox" x="534" y="188" width="122" height="30" rx="15" stroke="#8eb4d6"/>
  <text class="label" x="595" y="208" text-anchor="middle" fill="#457b9d">products API</text>

  <path class="lineGreen" d="M 645 372 V 430" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#greenArrow)"/>
  <path class="lineGreen" d="M 985 372 V 430" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#greenArrow)"/>
  <rect class="labelBox" x="750" y="386" width="118" height="30" rx="15" stroke="#91b884"/>
  <text class="label" x="809" y="406" text-anchor="middle" fill="#5f8f5b">UUID v7</text>

  <path class="lineGreen" d="M 645 520 V 586" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#greenArrow)"/>
  <path class="lineGreen" d="M 985 520 V 586" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#greenArrow)"/>

  <path class="lineGold" d="M 332 602 L 446 602 Q 426 602 426 612 L 426 762 Q 426 790 466 790 L 502 790" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#goldArrow)"/>
  <rect class="labelBox" x="360" y="694" width="88" height="30" rx="15" stroke="#d5a656"/>
  <text class="label" x="404" y="714" text-anchor="middle" fill="#a87332">root</text>

  <path class="lineGold" d="M 1128 790 L 1190 790 Q 1200 790 1200 762 L 1200 327 Q 1200 317 1210 317 L 1282 317" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#goldArrow)"/>
  <rect class="labelBox" x="1138" y="686" width="116" height="30" rx="15" stroke="#d5a656"/>
  <text class="label" x="1196" y="706" text-anchor="middle" fill="#a87332">swagger</text>

  <path class="lineGold" d="M 1128 309 L 1200 309 Q 1210 309 1210 319 L 1210 559 Q 1210 569 1220 569 L 1282 569" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#goldArrow)"/>
  <rect class="labelBox" x="1138" y="414" width="116" height="30" rx="15" stroke="#d5a656"/>
  <text class="label" x="1196" y="434" text-anchor="middle" fill="#a87332">metrics</text>
</svg>
