<rect class="message-label" x="100.66666666666669" y="975" width="560" height="31" rx="7" fill="#ffffff" opacity="0.96" stroke="#dbe3ee"/>
<text class="message" x="380.6666666666667" y="990.5" text-anchor="middle" dominant-baseline="middle">8. store(&quot;bucket1&quot;, &quot;my-file.txt&quot;, content)</text>
