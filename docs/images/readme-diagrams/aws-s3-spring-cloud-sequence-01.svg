<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc">
  <title id="title">Spring Cloud AWS S3 local sequence</title>
  <desc id="desc">Sequence showing bucket creation, object storage, object listing, and ResourceLoader reads through Spring Cloud AWS and a local Floci S3 endpoint.</desc>
  <defs>
    <style>
      .title { font-family: "Architects Daughter"; font-size: 40px; fill: #263238; }
      .subtitle, .msg, .note, .footer { font-family: "Comic Mono"; fill: #36464f; }
      .subtitle { font-size: 18px; }
      .participant { font-family: "Architects Daughter"; font-size: 20px; fill: #1f3138; }
      .role { font-family: "Comic Mono"; font-size: 13px; fill: #546a73; }
      .msg { font-size: 14px; }
      .note { font-size: 13px; }
      .footer { font-size: 14px; fill: #60727d; }
      .frame { fill: #fbfcf8; stroke: #41545d; stroke-width: 3; }
      .header { fill: #ffffff; stroke: #546e7a; stroke-width: 2; }
      .lifeline { stroke: #9aaab1; stroke-width: 2; stroke-dasharray: 7 8; }
      .activation { fill: #e6f2ec; stroke: #5b7e67; stroke-width: 1.5; }
      .call { fill: none; stroke: #3f7d9c; stroke-width: 3; marker-end: url(#arrowCall); }
      .work { fill: none; stroke: #6e8f4f; stroke-width: 3; marker-end: url(#arrowWork); }
      .return { fill: none; stroke: #9b7d54; stroke-width: 2.5; stroke-dasharray: 8 6; marker-end: url(#arrowReturn); }
      .skip { fill: none; stroke: #b86868; stroke-width: 3; marker-end: url(#arrowSkip); }
      .alt { fill: none; stroke: #78909c; stroke-width: 3; stroke-dasharray: 12 7; }
      .branchDivider { stroke: #78909c; stroke-width: 3; stroke-dasharray: 12 8; }
      .label { fill: #ffffff; stroke: #d7e0e4; stroke-width: 1.5; }
      .label.callLabel { stroke: #9cc2d1; }
      .label.workLabel { stroke: #b6c9a4; }
      .label.returnLabel { stroke: #c8b38f; }
      .label.skipLabel { stroke: #d9abab; }
      .branchSetup { fill: #eef7f0; stroke: #6e8f4f; stroke-width: 1.8; }
      .branchRead { fill: #fff5f5; stroke: #b86868; stroke-width: 1.8; }
      .badge { stroke-width: 1.8; }
      .badge.callBadge { fill: #eaf4f8; stroke: #3f7d9c; }
      .badge.workBadge { fill: #eef7f0; stroke: #6e8f4f; }
      .badge.returnBadge { fill: #fff7e8; stroke: #9b7d54; }
      .badge.skipBadge { fill: #fff0f0; stroke: #b86868; }
      .badgeText { font-family: "Comic Mono"; font-size: 12px; font-weight: 700; }
      .msg.callText, .badgeText.callText { fill: #2f6f8e; }
      .msg.workText, .badgeText.workText { fill: #55783f; }
      .msg.returnText, .badgeText.returnText { fill: #7f6038; }
      .msg.skipText, .badgeText.skipText { fill: #9d4f4f; }
    </style>
    <marker id="arrowCall" viewBox="0 0 10 10" markerWidth="9" markerHeight="9" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#3f7d9c" stroke-dasharray="none"/></marker>
    <marker id="arrowWork" viewBox="0 0 10 10" markerWidth="9" markerHeight="9" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#6e8f4f" stroke-dasharray="none"/></marker>
    <marker id="arrowReturn" viewBox="0 0 10 10" markerWidth="8" markerHeight="8" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#9b7d54" stroke-dasharray="none"/></marker>
    <marker id="arrowSkip" viewBox="0 0 10 10" markerWidth="9" markerHeight="9" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#b86868" stroke-dasharray="none"/></marker>
  </defs>

  <rect x="24" y="24" width="1552" height="1072" rx="20" class="frame"/>
  <text x="800" y="78" text-anchor="middle" class="title">Spring Cloud AWS S3 Flow</text>
  <text x="800" y="108" text-anchor="middle" class="subtitle">The sample creates buckets, stores objects, lists keys, and reads content through a local Floci S3 endpoint.</text>

  <g>
    <rect x="70" y="150" width="170" height="68" rx="10" class="header"/>
    <text x="155" y="179" text-anchor="middle" class="participant">Runner</text>
    <text x="155" y="201" text-anchor="middle" class="role">ApplicationRunner</text>

    <rect x="315" y="150" width="190" height="68" rx="10" class="header"/>
    <text x="410" y="179" text-anchor="middle" class="participant">S3Client</text>
    <text x="410" y="201" text-anchor="middle" class="role">AWS SDK v2</text>

    <rect x="584" y="150" width="210" height="68" rx="10" class="header"/>
    <image x="607" y="168" width="34" height="34" href="data:image/svg+xml;base64," preserveAspectRatio="xMidYMid meet"/>
    <text x="706" y="179" text-anchor="middle" class="participant">S3Template</text>
    <text x="706" y="201" text-anchor="middle" class="role">Spring Cloud AWS</text>

    <rect x="860" y="150" width="200" height="68" rx="10" class="header"/>
    <image x="881" y="168" width="34" height="34" href="data:image/svg+xml;base64," preserveAspectRatio="xMidYMid meet"/>
    <text x="975" y="179" text-anchor="middle" class="participant">S3 Service</text>
    <text x="975" y="201" text-anchor="middle" class="role">bucket + object API</text>

    <rect x="1340" y="150" width="200" height="68" rx="10" class="header"/>
    <image x="1358" y="168" width="34" height="34" href="data:image/svg+xml;base64," preserveAspectRatio="xMidYMid meet"/>
    <text x="1455" y="179" text-anchor="middle" class="participant">FlociServer</text>
    <text x="1455" y="201" text-anchor="middle" class="role">local endpoint</text>
  </g>

  <line x1="155" y1="218" x2="155" y2="982" class="lifeline"/>
  <line x1="410" y1="218" x2="410" y2="982" class="lifeline"/>
  <line x1="690" y1="218" x2="690" y2="982" class="lifeline"/>
  <line x1="975" y1="218" x2="975" y2="982" class="lifeline"/>
  <line x1="1455" y1="218" x2="1455" y2="982" class="lifeline"/>

  <rect x="403" y="302" width="14" height="222" rx="6" class="activation"/>
  <rect x="683" y="520" width="14" height="160" rx="6" class="activation"/>
  <rect x="968" y="360" width="14" height="372" rx="6" class="activation"/>
  <rect x="1448" y="360" width="14" height="372" rx="6" class="activation"/>

  <rect x="84" y="260" width="360" height="34" rx="17" class="label callLabel"/>
  <circle cx="108" cy="277" r="13" class="badge callBadge"/><text x="108" y="282" text-anchor="middle" class="badgeText callText">1</text>
  <text x="132" y="282" class="msg callText">createBucket(bucket1), createBucket(bucket2)</text>
  <path d="M 155 318 L 410 318" class="call"/>

  <rect x="545" y="324" width="330" height="34" rx="17" class="label callLabel"/>
  <circle cx="569" cy="341" r="13" class="badge callBadge"/><text x="569" y="346" text-anchor="middle" class="badgeText callText">2</text>
  <text x="593" y="346" class="msg callText">PUT Bucket requests through SDK</text>
  <path d="M 417 382 L 975 382" class="call"/>

  <rect x="78" y="420" width="1420" height="560" rx="14" class="alt"/>
  <rect x="102" y="438" width="254" height="30" rx="15" class="branchSetup"/>
  <text x="123" y="458" class="note">store objects</text>
  <line x1="78" y1="708" x2="1498" y2="708" class="branchDivider"/>
  <rect x="102" y="726" width="250" height="30" rx="15" class="branchRead"/>
  <text x="123" y="746" class="note">list and read</text>

  <rect x="162" y="488" width="360" height="34" rx="17" class="label workLabel"/>
  <circle cx="186" cy="505" r="13" class="badge workBadge"/><text x="186" y="510" text-anchor="middle" class="badgeText workText">3</text>
  <text x="210" y="510" class="msg workText">store test-file.txt and my-file.txt</text>
  <path d="M 155 548 L 690 548" class="work"/>

  <rect x="770" y="552" width="260" height="34" rx="17" class="label workLabel"/>
  <circle cx="794" cy="569" r="13" class="badge workBadge"/><text x="794" y="574" text-anchor="middle" class="badgeText workText">4</text>
  <text x="818" y="574" class="msg workText">PUT object requests</text>
  <path d="M 697 612 L 975 612" class="work"/>

  <rect x="1125" y="628" width="290" height="34" rx="17" class="label workLabel"/>
  <circle cx="1149" cy="645" r="13" class="badge workBadge"/><text x="1149" y="650" text-anchor="middle" class="badgeText workText">5</text>
  <text x="1173" y="650" class="msg workText">Floci stores S3 objects</text>
  <path d="M 982 688 L 1455 688" class="work"/>

  <rect x="88" y="768" width="292" height="34" rx="17" class="label skipLabel"/>
  <circle cx="112" cy="785" r="13" class="badge skipBadge"/><text x="112" y="790" text-anchor="middle" class="badgeText skipText">6</text>
  <text x="136" y="790" class="msg skipText">listObjects(bucket1)</text>
  <path d="M 155 826 L 410 826" class="skip"/>

  <rect x="494" y="772" width="324" height="34" rx="17" class="label skipLabel"/>
  <circle cx="518" cy="789" r="13" class="badge skipBadge"/><text x="518" y="794" text-anchor="middle" class="badgeText skipText">7</text>
  <text x="542" y="794" class="msg skipText">GET object listing from S3</text>
  <path d="M 417 842 L 975 842" class="skip"/>

  <rect x="260" y="852" width="430" height="34" rx="17" class="label skipLabel"/>
  <circle cx="284" cy="869" r="13" class="badge skipBadge"/><text x="284" y="874" text-anchor="middle" class="badgeText skipText">8</text>
  <text x="308" y="874" class="msg skipText">ResourceLoader reads s3://bucket1/test-file.txt</text>
  <path d="M 155 920 L 690 920" class="skip"/>

  <rect x="776" y="890" width="330" height="34" rx="17" class="label returnLabel"/>
  <circle cx="800" cy="907" r="13" class="badge returnBadge"/><text x="800" y="912" text-anchor="middle" class="badgeText returnText">9</text>
  <text x="824" y="912" class="msg returnText">content is returned to the runner</text>
  <path d="M 975 954 L 690 954 L 690 960 L 155 960" class="return"/>

  <rect x="98" y="1022" width="1404" height="44" rx="12" fill="#ffffff" stroke="#ccd7da" stroke-width="2"/>
  <text x="118" y="1050" class="note">The local path uses FlociServer from bluetape4k-testcontainers, so the sample does not need real AWS credentials.</text>
  <text x="800" y="1088" text-anchor="middle" class="footer">bluetape4k-workshop - aws/s3-spring-cloud README</text>
</svg>
