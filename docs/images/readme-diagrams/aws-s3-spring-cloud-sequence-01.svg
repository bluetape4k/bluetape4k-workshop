<text class="message" x="669.3333333333334" y="1314.5" text-anchor="middle" dominant-baseline="middle">11. GET /?list-type=2 / ObjectListing [test-file.txt,</text>
<text class="message" x="669.3333333333334" y="1329.5" text-anchor="middle" dominant-baseline="middle">my-file.txt]</text>
