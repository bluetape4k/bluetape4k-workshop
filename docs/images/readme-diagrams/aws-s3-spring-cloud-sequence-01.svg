<rect class="message-label" x="594.3333333333335" y="1083" width="438.66666666666663" height="31" rx="7" fill="#ffffff" opacity="0.96" stroke="#dbe3ee"/>
<text class="message" x="813.6666666666667" y="1098.5" text-anchor="middle" dominant-baseline="middle">9. PUT object</text>
