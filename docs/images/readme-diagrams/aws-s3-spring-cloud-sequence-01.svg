<rect class="box" x="626.6666666666666" y="108" width="220" height="58" rx="10" fill="#fff3d9" stroke="#7aa0c4"/>
<text class="actor" x="736.6666666666666" y="130" text-anchor="middle" dominant-baseline="middle">S3Template Spring</text>
<text class="actor" x="736.6666666666666" y="144" text-anchor="middle" dominant-baseline="middle">Cloud AWS</text>
