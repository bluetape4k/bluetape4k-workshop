<svg xmlns="http://www.w3.org/2000/svg" width="1670" height="1134" viewBox="0 0 1670 1134" role="img" aria-labelledby="title desc">
  <title id="title">Spring Cloud AWS S3 Sequence</title>
  <desc id="desc">Local Floci S3 receives the same bucket, object, list, and ResourceLoader calls used by the sample.</desc>
  <defs>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="124%"><feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#64748B" flood-opacity="0.14"/></filter>
    <style>
      .title{font-family:"Architects Daughter";font-size:40px;fill:#263238}.subtitle,.msg,.note,.footer{font-family:"Comic Mono";fill:#36464F}.subtitle{font-size:17px}.participant{font-family:"Architects Daughter";font-size:19px;fill:#1F3138}.role{font-family:"Comic Mono";font-size:12px;fill:#546A73}.msg{font-size:13px}.note{font-size:13px}.footer{font-size:14px;fill:#60727D}.frame{fill:#FBFCF8;stroke:#41545D;stroke-width:3}.header{fill:#FFFFFF;stroke:#546E7A;stroke-width:2}.lifeline{stroke:#9AAAB1;stroke-width:2;stroke-dasharray:7 8;stroke-linecap:round}.activation{fill:#E6F2EC;stroke:#5B7E67;stroke-width:1.5}.call,.work,.return,.skip{fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.call{stroke:#3F7D9C;marker-end:url(#arrow-call);stroke-linecap:round;stroke-linejoin:round}.work{stroke:#6E8F4F;marker-end:url(#arrow-work);stroke-linecap:round;stroke-linejoin:round}.return{stroke:#9B7D54;stroke-width:2.6;stroke-dasharray:8 6;marker-end:url(#arrow-ret);stroke-linecap:round;stroke-linejoin:round}.skip{stroke:#B86868;marker-end:url(#arrow-skip);stroke-linecap:round;stroke-linejoin:round}.label{fill:#FFFFFF;stroke:#D7E0E4;stroke-width:1.5}.callLabel{stroke:#9CC2D1}.workLabel{stroke:#B6C9A4}.returnLabel{stroke:#C8B38F}.skipLabel{stroke:#D9ABAB}.badge{stroke-width:1.8}.callBadge{fill:#EAF4F8;stroke:#3F7D9C}.workBadge{fill:#EEF7F0;stroke:#6E8F4F}.returnBadge{fill:#FFF7E8;stroke:#9B7D54}.skipBadge{fill:#FFF0F0;stroke:#B86868}.badgeText{font-family:"Comic Mono";font-size:12px;font-weight:700}.callText,.badgeText.callText{fill:#2F6F8E}.workText,.badgeText.workText{fill:#55783F}.returnText,.badgeText.returnText{fill:#7F6038}.skipText,.badgeText.skipText{fill:#9D4F4F}.alt{fill:#FFF7ED;fill-opacity:.42;stroke:#D08A39;stroke-width:2.4;stroke-dasharray:12 8}.branch{fill:#FFFFFF;fill-opacity:.82;stroke:#E6C68C;stroke-width:1.5}
    </style>
    <marker id="arrow-call" viewBox="0 0 11.4286 11.4286" markerWidth="16" markerHeight="16" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse" data-role="sequence" data-tip-direction="positive-x"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#3F7D9C" stroke-dasharray="none" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="arrow-work" viewBox="0 0 11.4286 11.4286" markerWidth="16" markerHeight="16" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse" data-role="sequence" data-tip-direction="positive-x"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#6E8F4F" stroke-dasharray="none" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="arrow-ret" viewBox="0 0 11.4286 11.4286" markerWidth="16" markerHeight="16" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse" data-role="sequence" data-tip-direction="positive-x"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#9B7D54" stroke-dasharray="none" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="arrow-skip" viewBox="0 0 11.4286 11.4286" markerWidth="16" markerHeight="16" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse" data-role="sequence" data-tip-direction="positive-x"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#B86868" stroke-dasharray="none" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>
  <rect x="24" y="24" width="1622" height="1086" rx="20" class="frame"/>  <text x="835" y="76" text-anchor="middle" class="title">Spring Cloud AWS S3 Sequence</text>  <text x="835" y="106" text-anchor="middle" class="subtitle">Local Floci S3 receives the same bucket, object, list, and ResourceLoader calls used by the sample.</text>
  <rect x="100" y="406" width="1470" height="230" rx="16" class="alt"/>
  <rect x="100" y="634" width="1470" height="306" rx="16" class="alt"/>
  <g filter="url(#shadow)"><rect x="75" y="156" width="230" height="76" rx="10" class="header"/><text x="190" y="186" text-anchor="middle" class="participant">Runner</text><text x="190" y="211" text-anchor="middle" class="role">ApplicationRunner</text></g>
  <line x1="190" y1="232" x2="190" y2="1022" class="lifeline"/>
  <g filter="url(#shadow)"><rect x="398" y="156" width="230" height="76" rx="10" class="header"/><text x="513" y="186" text-anchor="middle" class="participant">S3Client</text><text x="513" y="211" text-anchor="middle" class="role">AWS SDK v2</text></g>
  <line x1="513" y1="232" x2="513" y2="1022" class="lifeline"/>
  <g filter="url(#shadow)"><rect x="720" y="156" width="230" height="76" rx="10" class="header"/><text x="835" y="186" text-anchor="middle" class="participant">S3Template</text><text x="835" y="211" text-anchor="middle" class="role">Spring Cloud AWS</text></g>
  <line x1="835" y1="232" x2="835" y2="1022" class="lifeline"/>
  <g filter="url(#shadow)"><rect x="1043" y="156" width="230" height="76" rx="10" class="header"/><image x="1059" y="176" width="36" height="36" href="data:image/svg+xml;base64," preserveAspectRatio="xMidYMid meet"/>  <text x="1178" y="186" text-anchor="middle" class="participant">S3 Service</text><text x="1178" y="211" text-anchor="middle" class="role">bucket + object API</text></g>
  <line x1="1158" y1="232" x2="1158" y2="1022" class="lifeline"/>
  <g filter="url(#shadow)"><rect x="1365" y="156" width="230" height="76" rx="10" class="header"/><image x="1381" y="176" width="36" height="36" href="data:image/svg+xml;base64," preserveAspectRatio="xMidYMid meet"/><text x="1500" y="186" text-anchor="middle" class="participant">FlociServer</text>  <text x="1500" y="211" text-anchor="middle" class="role">local S3 endpoint</text></g>
  <line x1="1480" y1="232" x2="1480" y2="1022" class="lifeline"/>
  <rect x="202" y="252" width="400.0" height="34" rx="17" class="label callLabel"/>
  <circle cx="226" cy="269" r="13" class="badge callBadge"/><text x="226" y="274" text-anchor="middle" class="badgeText callText">1</text>
  <text x="250" y="274" class="msg callText">createBucket(bucket1), createBucket(bucket2)</text>
  <path d="M 190 300 L 513 300" class="call" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="684.3" y="328" width="302.5" height="34" rx="17" class="label callLabel"/>
  <circle cx="708.3" cy="345" r="13" class="badge callBadge"/><text x="708.3" y="350" text-anchor="middle" class="badgeText callText">2</text>
  <text x="732.3" y="350" class="msg callText">PUT Bucket requests through SDK</text>
  <path d="M 513 376 L 1158 376" class="call" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="346.3" y="404" width="332.5" height="34" rx="17" class="label workLabel"/>
  <circle cx="370.3" cy="421" r="13" class="badge workBadge"/><text x="370.3" y="426" text-anchor="middle" class="badgeText workText">3</text>
  <text x="394.3" y="426" class="msg workText">store test-file.txt and my-file.txt</text>
  <path d="M 190 452 L 835 452" class="work" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="881.5" y="480" width="230.0" height="34" rx="17" class="label workLabel"/>
  <circle cx="905.5" cy="497" r="13" class="badge workBadge"/><text x="905.5" y="502" text-anchor="middle" class="badgeText workText">4</text>
  <text x="929.5" y="502" class="msg workText">PUT object requests</text>
  <path d="M 835 528 L 1158 528" class="work" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="1197.8" y="556" width="242.5" height="34" rx="17" class="label workLabel"/>
  <circle cx="1221.8" cy="573" r="13" class="badge workBadge"/><text x="1221.8" y="578" text-anchor="middle" class="badgeText workText">5</text>  <text x="1245.8" y="578" class="msg workText">Floci stores S3 objects</text>
  <path d="M 1158 604 L 1480 604" class="work" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="236.5" y="632" width="230.0" height="34" rx="17" class="label skipLabel"/>
  <circle cx="260.5" cy="649" r="13" class="badge skipBadge"/><text x="260.5" y="654" text-anchor="middle" class="badgeText skipText">6</text>
  <text x="284.5" y="654" class="msg skipText">listObjects(bucket1)</text>
  <path d="M 190 680 L 513 680" class="skip" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="703" y="708" width="265.0" height="34" rx="17" class="label skipLabel"/>
  <circle cx="727" cy="725" r="13" class="badge skipBadge"/><text x="727" y="730" text-anchor="middle" class="badgeText skipText">7</text>  <text x="751" y="730" class="msg skipText">GET object listing from S3</text>
  <path d="M 513 756 L 1158 756" class="skip" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="301.3" y="784" width="422.5" height="34" rx="17" class="label skipLabel"/>
  <circle cx="325.3" cy="801" r="13" class="badge skipBadge"/><text x="325.3" y="806" text-anchor="middle" class="badgeText skipText">8</text>
  <text x="349.3" y="806" class="msg skipText">ResourceLoader reads s3://bucket1/test-file.txt</text>
  <path d="M 190 832 L 835 832" class="skip" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="515.3" y="860" width="317.5" height="34" rx="17" class="label returnLabel"/>
  <circle cx="539.3" cy="877" r="13" class="badge returnBadge"/><text x="539.3" y="882" text-anchor="middle" class="badgeText returnText">9</text>
  <text x="563.3" y="882" class="msg returnText">content is returned to the runner</text>
  <path d="M 1158 908 L 190 908" class="return" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="90" y="1046" width="1490" height="40" rx="12" fill="#FFFFFF" stroke="#CCD7DA" stroke-width="2"/>  <text x="835" y="1072" text-anchor="middle" class="footer">FlociServer comes from bluetape4k-testcontainers, so the sample runs without real AWS credentials.</text>
</svg>
