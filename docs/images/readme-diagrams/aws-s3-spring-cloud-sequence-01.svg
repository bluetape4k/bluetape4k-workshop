<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="720" viewBox="0 0 1100 720" role="img" aria-label="Spring Cloud AWS S3 Operation Sequence">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#1f2937" flood-opacity="0.10"/></filter>
  <marker id="arrBlue" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M1,1 L8,4.5 L1,8 Z" fill="#3b82f6"/></marker>
  <marker id="arrGreen" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M1,1 L8,4.5 L1,8 Z" fill="#059669"/></marker>
  <marker id="arrGray" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M1,1 L8,4.5 L1,8 Z" fill="#9ca3af"/></marker>
  <style>
    .canvas{fill:#f7f9fc}.frame{fill:#fff;stroke:#d8e0ea;stroke-width:1.5}
    .title{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:36px;fill:#102033}
    .subtitle{font-family:"Comic Sans MS","Comic Neue",Arial,sans-serif;font-size:13px;fill:#536273}
    .actorLabel{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:18px;fill:#102033}
    .actorSub{font-family:"Comic Sans MS","Comic Neue",Arial,sans-serif;font-size:10px;fill:#536273}
    .bandLabel{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:14px;fill:#1e3a5f}
    .msgLabel{font-family:"Comic Sans MS","Comic Neue",Arial,sans-serif;font-size:11px;fill:#374151}
    .retLabel{font-family:"Comic Sans MS","Comic Neue",Arial,sans-serif;font-size:10px;fill:#536273;font-style:italic}
    .lineBlue{stroke:#3b82f6;stroke-width:2;fill:none;marker-end:url(#arrBlue)}
    .lineGreen{stroke:#059669;stroke-width:2;fill:none;marker-end:url(#arrGreen)}
    .dashGray{stroke:#9ca3af;stroke-width:1.5;stroke-dasharray:6 5;fill:none;marker-end:url(#arrGray)}
  </style>
</defs>
<rect class="canvas" width="1100" height="720"/>
<rect class="frame" x="28" y="24" width="1044" height="672" rx="24"/>

<text class="title" x="64" y="72">Spring Cloud AWS S3 Sequence</text>
<text class="subtitle" x="68" y="100">createBucket · store (upload) · listObjects · getResource (read via Spring Resource)</text>

<!-- ── Actors: cx = 150, 380, 640, 940 ────────────────────────────────── -->
<rect x="50" y="118" width="200" height="66" rx="14" fill="#dbeafe" stroke="#3b82f6" stroke-width="2" filter="url(#shadow)"/>
<text class="actorLabel" x="150" y="144" text-anchor="middle">SpringBootApp</text>
<text class="actorSub" x="150" y="160" text-anchor="middle">ApplicationRunner</text>
<line x1="150" y1="184" x2="150" y2="690" stroke="#bfdbfe" stroke-width="1.5" stroke-dasharray="8 7"/>

<rect x="280" y="118" width="200" height="66" rx="14" fill="#d1fae5" stroke="#059669" stroke-width="2" filter="url(#shadow)"/>
<text class="actorLabel" x="380" y="144" text-anchor="middle">S3Client</text>
<text class="actorSub" x="380" y="160" text-anchor="middle">AWS SDK v2</text>
<line x1="380" y1="184" x2="380" y2="690" stroke="#bbf7d0" stroke-width="1.5" stroke-dasharray="8 7"/>

<rect x="540" y="118" width="200" height="66" rx="14" fill="#dcfce7" stroke="#16a34a" stroke-width="2" filter="url(#shadow)"/>
<text class="actorLabel" x="640" y="144" text-anchor="middle">S3Template</text>
<text class="actorSub" x="640" y="160" text-anchor="middle">Spring Cloud AWS</text>
<line x1="640" y1="184" x2="640" y2="690" stroke="#bbf7d0" stroke-width="1.5" stroke-dasharray="8 7"/>

<rect x="840" y="118" width="212" height="66" rx="14" fill="#fef3c7" stroke="#d97706" stroke-width="2" filter="url(#shadow)"/>
<text class="actorLabel" x="946" y="144" text-anchor="middle">LocalStack S3</text>
<text class="actorSub" x="946" y="160" text-anchor="middle">Testcontainers endpoint</text>
<line x1="946" y1="184" x2="946" y2="690" stroke="#fde68a" stroke-width="1.5" stroke-dasharray="8 7"/>

<!-- ── Band 1: Create Buckets ─────────────────────────────────────────── -->
<rect x="52" y="200" width="998" height="26" rx="7" fill="#dbeafe" opacity="0.6"/>
<text class="bandLabel" x="64" y="219">1. Create Buckets</text>
<!-- App → S3Client -->
<path class="lineBlue" d="M150 238 L380 238"/>
<text class="msgLabel" x="265" y="233" text-anchor="middle">createBucket("bucket1") {}</text>
<!-- S3Client → LocalStack -->
<path class="lineBlue" d="M380 252 L946 252"/>
<text class="msgLabel" x="663" y="247" text-anchor="middle">PUT /bucket1</text>
<!-- LocalStack → S3Client return -->
<path class="dashGray" d="M946 266 L380 266"/>
<text class="retLabel" x="663" y="262" text-anchor="middle">200 OK</text>
<!-- App → S3Client (bucket2) -->
<path class="lineBlue" d="M150 284 L380 284"/>
<text class="msgLabel" x="265" y="279" text-anchor="middle">createBucket("bucket2") {}</text>
<!-- S3Client → LocalStack -->
<path class="lineBlue" d="M380 298 L946 298"/>
<text class="msgLabel" x="663" y="293" text-anchor="middle">PUT /bucket2</text>

<!-- ── Band 2: Upload Files ────────────────────────────────────────────── -->
<rect x="52" y="318" width="998" height="26" rx="7" fill="#d1fae5" opacity="0.6"/>
<text class="bandLabel" x="64" y="337">2. Upload Files (S3Template.store)</text>
<!-- App → S3Template -->
<path class="lineGreen" d="M150 356 L640 356"/>
<text class="msgLabel" x="395" y="351" text-anchor="middle">store("bucket1", "test-file.txt", content)</text>
<!-- S3Template → LocalStack -->
<path class="lineGreen" d="M640 370 L946 370"/>
<text class="msgLabel" x="793" y="365" text-anchor="middle">PUT object</text>
<!-- App → S3Template (2nd file) -->
<path class="lineGreen" d="M150 390 L640 390"/>
<text class="msgLabel" x="395" y="385" text-anchor="middle">store("bucket1", "my-file.txt", content)</text>
<!-- S3Template → LocalStack -->
<path class="lineGreen" d="M640 404 L946 404"/>
<text class="msgLabel" x="793" y="399" text-anchor="middle">PUT object</text>

<!-- ── Band 3: List Objects ────────────────────────────────────────────── -->
<rect x="52" y="424" width="998" height="26" rx="7" fill="#fef3c7" opacity="0.6"/>
<text class="bandLabel" x="64" y="443">3. List Objects</text>
<!-- App → S3Client -->
<path class="lineBlue" d="M150 462 L380 462"/>
<text class="msgLabel" x="265" y="457" text-anchor="middle">listObjects { bucket("bucket1") }</text>
<!-- S3Client → LocalStack -->
<path class="lineBlue" d="M380 476 L946 476"/>
<text class="msgLabel" x="663" y="471" text-anchor="middle">GET /?list-type=2</text>
<!-- LocalStack → S3Client return -->
<path class="dashGray" d="M946 492 L380 492"/>
<text class="retLabel" x="663" y="488" text-anchor="middle">ObjectListing [test-file.txt, my-file.txt]</text>
<!-- S3Client → App return -->
<path class="dashGray" d="M380 506 L150 506"/>
<text class="retLabel" x="265" y="502" text-anchor="middle">List&lt;S3Object&gt;</text>

<!-- ── Band 4: Read via Resource ──────────────────────────────────────── -->
<rect x="52" y="526" width="998" height="26" rx="7" fill="#fce7f3" opacity="0.6"/>
<text class="bandLabel" x="64" y="545">4. Read via ResourceLoader</text>
<!-- App → S3Template -->
<path class="lineGreen" d="M150 564 L640 564"/>
<text class="msgLabel" x="395" y="559" text-anchor="middle">resourceLoader.getResource("s3://bucket1/test-file.txt")</text>
<!-- S3Template → LocalStack -->
<path class="lineGreen" d="M640 580 L946 580"/>
<text class="msgLabel" x="793" y="575" text-anchor="middle">GET object</text>
<!-- LocalStack → S3Template return -->
<path class="dashGray" d="M946 596 L640 596"/>
<text class="retLabel" x="793" y="592" text-anchor="middle">object bytes</text>
<!-- S3Template → App return -->
<path class="dashGray" d="M640 612 L150 612"/>
<text class="retLabel" x="395" y="608" text-anchor="middle">"test file content"</text>
</svg>
