<rect class="message-label" x="17" y="1191" width="438.6666666666667" height="31" rx="7" fill="#ffffff" opacity="0.96" stroke="#dbe3ee"/>
<text class="message" x="236.33333333333334" y="1206.5" text-anchor="middle" dominant-baseline="middle">10. listObjects { bucket(&quot;bucket1&quot;) }</text>
