<rect class="message-label" x="100.66666666666669" y="1623" width="560" height="31" rx="7" fill="#ffffff" opacity="0.96" stroke="#dbe3ee"/>
<text class="message" x="380.6666666666667" y="1638.5" text-anchor="middle" dominant-baseline="middle">14. resourceLoader.getResource(&quot;s3://bucket1/test-file.txt&quot;)</text>
<path class="call" d="M669.3333333333334 1717 L958 1717"/>
<rect class="message-label" x="594.3333333333335" y="1731" width="438.66666666666663" height="31" rx="7" fill="#ffffff" opacity="0.96" stroke="#dbe3ee"/>
