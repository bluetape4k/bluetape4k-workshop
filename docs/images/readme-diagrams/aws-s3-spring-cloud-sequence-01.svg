<rect class="box" x="920" y="108" width="220" height="58" rx="10" fill="#f1ecff" stroke="#7aa0c4"/>
<text class="actor" x="1030" y="123" text-anchor="middle" dominant-baseline="middle">LocalStack S3</text>
<text class="actor" x="1030" y="137" text-anchor="middle" dominant-baseline="middle">Testcontainers</text>
<text class="actor" x="1030" y="151" text-anchor="middle" dominant-baseline="middle">endpoint</text>
<line class="lifeline" x1="1030" y1="166" x2="1030" y2="2069"/>
<path class="call" d="M150 205 L443.3333333333333 205"/>
<rect class="message-label" x="74.99999999999997" y="219" width="443.3333333333333" height="31" rx="7" fill="#ffffff" opacity="0.96" stroke="#dbe3ee"/>
<text class="message" x="296.66666666666663" y="234.5" text-anchor="middle" dominant-baseline="middle">1. createBucket(&quot;bucket1&quot;) {}</text>
<path class="call" d="M443.3333333333333 313 L1030 313"/>
<rect class="message-label" x="456.66666666666663" y="327" width="560" height="31" rx="7" fill="#ffffff" opacity="0.96" stroke="#dbe3ee"/>
<text class="message" x="736.6666666666666" y="342.5" text-anchor="middle" dominant-baseline="middle">2. PUT /bucket1 / 200 OK</text>
<path class="return" d="M1030 421 L443.3333333333333 421"/>
<rect class="message-label" x="456.66666666666663" y="435" width="560" height="31" rx="7" fill="#ffffff" opacity="0.96" stroke="#dbe3ee"/>
<text class="message" x="736.6666666666666" y="450.5" text-anchor="middle" dominant-baseline="middle">3. PUT /bucket2</text>
<path class="call" d="M150 529 L443.3333333333333 529"/>
<rect class="message-label" x="74.99999999999997" y="543" width="443.3333333333333" height="31" rx="7" fill="#ffffff" opacity="0.96" stroke="#dbe3ee"/>
<text class="message" x="296.66666666666663" y="558.5" text-anchor="middle" dominant-baseline="middle">4. createBucket(&quot;bucket2&quot;) {}</text>
<path class="call" d="M443.3333333333333 637 L1030 637"/>
<rect class="message-label" x="456.66666666666663" y="651" width="560" height="31" rx="7" fill="#ffffff" opacity="0.96" stroke="#dbe3ee"/>
<text class="message" x="736.6666666666666" y="666.5" text-anchor="middle" dominant-baseline="middle">5. S3Client AWS SDK v2 to LocalStack S3 Testcontainers endpoint</text>
<path class="call" d="M150 745 L736.6666666666666 745"/>
<rect class="message-label" x="163.33333333333331" y="759" width="560" height="31" rx="7" fill="#ffffff" opacity="0.96" stroke="#dbe3ee"/>
<text class="message" x="443.3333333333333" y="774.5" text-anchor="middle" dominant-baseline="middle">6. store(&quot;bucket1&quot;, &quot;test-file.txt&quot;, content)</text>
<path class="call" d="M736.6666666666666 853 L1030 853"/>
<rect class="message-label" x="661.6666666666665" y="867" width="443.33333333333337" height="31" rx="7" fill="#ffffff" opacity="0.96" stroke="#dbe3ee"/>
<text class="message" x="883.3333333333333" y="882.5" text-anchor="middle" dominant-baseline="middle">7. PUT object</text>
<path class="call" d="M150 961 L736.6666666666666 961"/>
<rect class="message-label" x="163.33333333333331" y="975" width="560" height="31" rx="7" fill="#ffffff" opacity="0.96" stroke="#dbe3ee"/>
<text class="message" x="443.3333333333333" y="990.5" text-anchor="middle" dominant-baseline="middle">8. store(&quot;bucket1&quot;, &quot;my-file.txt&quot;, content)</text>
<path class="call" d="M736.6666666666666 1069 L1030 1069"/>
<rect class="message-label" x="661.6666666666665" y="1083" width="443.33333333333337" height="31" rx="7" fill="#ffffff" opacity="0.96" stroke="#dbe3ee"/>
<text class="message" x="883.3333333333333" y="1098.5" text-anchor="middle" dominant-baseline="middle">9. PUT object</text>
<path class="call" d="M150 1177 L443.3333333333333 1177"/>
<rect class="message-label" x="74.99999999999997" y="1191" width="443.3333333333333" height="31" rx="7" fill="#ffffff" opacity="0.96" stroke="#dbe3ee"/>
<text class="message" x="296.66666666666663" y="1206.5" text-anchor="middle" dominant-baseline="middle">10. listObjects { bucket(&quot;bucket1&quot;) }</text>
<path class="call" d="M443.3333333333333 1285 L1030 1285"/>
<rect class="message-label" x="456.66666666666663" y="1299" width="560" height="46" rx="7" fill="#ffffff" opacity="0.96" stroke="#dbe3ee"/>
<text class="message" x="736.6666666666666" y="1314.5" text-anchor="middle" dominant-baseline="middle">11. GET /?list-type=2 / ObjectListing [test-file.txt,</text>
<text class="message" x="736.6666666666666" y="1329.5" text-anchor="middle" dominant-baseline="middle">my-file.txt]</text>
<path class="return" d="M1030 1393 L443.3333333333333 1393"/>
<rect class="message-label" x="456.66666666666663" y="1407" width="560" height="46" rx="7" fill="#ffffff" opacity="0.96" stroke="#dbe3ee"/>
<text class="message" x="736.6666666666666" y="1422.5" text-anchor="middle" dominant-baseline="middle">12. LocalStack S3 Testcontainers endpoint to S3Client AWS SDK</text>
<text class="message" x="736.6666666666666" y="1437.5" text-anchor="middle" dominant-baseline="middle">v2</text>
<path class="return" d="M443.3333333333333 1501 L150 1501"/>
<rect class="message-label" x="74.99999999999997" y="1515" width="443.3333333333333" height="31" rx="7" fill="#ffffff" opacity="0.96" stroke="#dbe3ee"/>
<text class="message" x="296.66666666666663" y="1530.5" text-anchor="middle" dominant-baseline="middle">13. List&lt;S3Object&gt;</text>
<path class="call" d="M150 1609 L736.6666666666666 1609"/>
<rect class="message-label" x="163.33333333333331" y="1623" width="560" height="31" rx="7" fill="#ffffff" opacity="0.96" stroke="#dbe3ee"/>
<text class="message" x="443.3333333333333" y="1638.5" text-anchor="middle" dominant-baseline="middle">14. resourceLoader.getResource(&quot;s3://bucket1/test-file.txt&quot;)</text>
<path class="call" d="M736.6666666666666 1717 L1030 1717"/>
<rect class="message-label" x="661.6666666666665" y="1731" width="443.33333333333337" height="31" rx="7" fill="#ffffff" opacity="0.96" stroke="#dbe3ee"/>
<text class="message" x="883.3333333333333" y="1746.5" text-anchor="middle" dominant-baseline="middle">15. GET object / object bytes</text>
<path class="return" d="M1030 1825 L736.6666666666666 1825"/>
<rect class="message-label" x="661.6666666666665" y="1839" width="443.33333333333337" height="46" rx="7" fill="#ffffff" opacity="0.96" stroke="#dbe3ee"/>
<text class="message" x="883.3333333333333" y="1854.5" text-anchor="middle" dominant-baseline="middle">16. LocalStack S3 Testcontainers endpoint to</text>
<text class="message" x="883.3333333333333" y="1869.5" text-anchor="middle" dominant-baseline="middle">S3Template Spring Cloud AWS</text>
<path class="return" d="M736.6666666666666 1933 L150 1933"/>
<rect class="message-label" x="163.33333333333331" y="1947" width="560" height="31" rx="7" fill="#ffffff" opacity="0.96" stroke="#dbe3ee"/>
<text class="message" x="443.3333333333333" y="1962.5" text-anchor="middle" dominant-baseline="middle">17. &quot;test file content&quot;</text>
</svg>
