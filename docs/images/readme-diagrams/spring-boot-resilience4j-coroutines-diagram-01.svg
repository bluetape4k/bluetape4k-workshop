<svg xmlns="http://www.w3.org/2000/svg" width="960" height="760" viewBox="0 0 960 760" role="img" aria-label="Spring Boot Resilience4j Circuit Breaker Patterns">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#1f2937" flood-opacity="0.10"/></filter>
  <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth">
    <path d="M1,1 L8,4.5 L1,8 Z" fill="#758297"/>
  </marker>
  <marker id="arrow-green" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth">
    <path d="M1,1 L8,4.5 L1,8 Z" fill="#58A978"/>
  </marker>
  <marker id="arrow-red" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth">
    <path d="M1,1 L8,4.5 L1,8 Z" fill="#DC6B82"/>
  </marker>
  <style>
    .canvas{fill:#f7f9fc}.frame{fill:#fff;stroke:#d8e0ea;stroke-width:1.5}
    .title{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:38px;font-weight:400;fill:#102033}
    .subtitle{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:14px;font-weight:400;fill:#536273}
    .smallLabel{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:21px;font-weight:400;fill:#102033}
    .mono{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#102033}
    .small{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#536273}
    .card{stroke-width:2.1;filter:url(#shadow)}
    .line{stroke:#758297;stroke-width:2.1;fill:none;marker-end:url(#arrow)}
    .lineGreen{stroke:#58A978;stroke-width:2.1;fill:none;marker-end:url(#arrow-green)}
    .lineRed{stroke:#DC6B82;stroke-width:2.1;fill:none;marker-end:url(#arrow-red)}
  </style>
</defs>
<rect class="canvas" width="960" height="760"/>
<rect class="frame" x="24" y="20" width="912" height="720" rx="22"/>

<!-- Title -->
<text class="title" x="48" y="68">Resilience4j — Circuit Breaker Patterns</text>
<text class="subtitle" x="52" y="92">Synchronous and coroutine REST endpoints with CircuitBreaker, RateLimiter, and Retry</text>

<!-- ====== TOP SECTION: Synchronous REST API ====== -->
<text class="small" x="480" y="114" text-anchor="middle" letter-spacing="0.06em" font-size="11" fill="#758297">SYNCHRONOUS REST API</text>

<!-- BackendAController -->
<g transform="translate(48,122)">
  <rect class="card" x="0" y="0" width="248" height="84" rx="12" fill="#E8F3FF" stroke="#5B8DEF"/>
  <text class="smallLabel" x="124" y="26" text-anchor="middle">BackendA</text>
  <text class="smallLabel" x="124" y="50" text-anchor="middle">Controller</text>
  <rect x="50" y="58" width="148" height="18" rx="9" fill="#8A72D6"/>
  <text class="mono" x="124" y="71" text-anchor="middle" fill="#fff">@CircuitBreaker</text>
</g>

<!-- BackendBController -->
<g transform="translate(356,122)">
  <rect class="card" x="0" y="0" width="248" height="84" rx="12" fill="#EAF7EF" stroke="#58A978"/>
  <text class="smallLabel" x="124" y="26" text-anchor="middle">BackendB</text>
  <text class="smallLabel" x="124" y="50" text-anchor="middle">Controller</text>
  <rect x="62" y="58" width="124" height="18" rx="9" fill="#58A978"/>
  <text class="mono" x="124" y="71" text-anchor="middle" fill="#fff">@RateLimiter</text>
</g>

<!-- BackendCController -->
<g transform="translate(664,122)">
  <rect class="card" x="0" y="0" width="248" height="84" rx="12" fill="#FFF3D9" stroke="#D6A441"/>
  <text class="smallLabel" x="124" y="26" text-anchor="middle">BackendC</text>
  <text class="smallLabel" x="124" y="50" text-anchor="middle">Controller</text>
  <rect x="86" y="58" width="76" height="18" rx="9" fill="#D6A441"/>
  <text class="mono" x="124" y="71" text-anchor="middle" fill="#fff">@Retry</text>
</g>

<!-- Arrows down to Services -->
<path class="line" d="M172,206 L172,234"/>
<path class="line" d="M480,206 L480,234"/>
<path class="line" d="M788,206 L788,234"/>

<!-- BackendAService -->
<g transform="translate(48,234)">
  <rect class="card" x="0" y="0" width="248" height="56" rx="12" fill="#F1ECFF" stroke="#8A72D6"/>
  <text class="smallLabel" x="124" y="30" text-anchor="middle">BackendAService</text>
  <text class="small" x="124" y="50" text-anchor="middle">business logic · fallback</text>
</g>

<!-- BackendBService -->
<g transform="translate(356,234)">
  <rect class="card" x="0" y="0" width="248" height="56" rx="12" fill="#EAF7EF" stroke="#58A978"/>
  <text class="smallLabel" x="124" y="30" text-anchor="middle">BackendBService</text>
  <text class="small" x="124" y="50" text-anchor="middle">business logic · rate limit</text>
</g>

<!-- BackendCService -->
<g transform="translate(664,234)">
  <rect class="card" x="0" y="0" width="248" height="56" rx="12" fill="#FFF3D9" stroke="#D6A441"/>
  <text class="smallLabel" x="124" y="30" text-anchor="middle">BackendCService</text>
  <text class="small" x="124" y="50" text-anchor="middle">business logic · retry</text>
</g>

<!-- ====== MIDDLE SECTION: Coroutine REST API ====== -->
<text class="small" x="480" y="328" text-anchor="middle" letter-spacing="0.06em" font-size="11" fill="#758297">COROUTINE REST API (suspend)</text>

<!-- SuspendBackendAController -->
<g transform="translate(100,336)">
  <rect class="card" x="0" y="0" width="280" height="84" rx="12" fill="#FDECEF" stroke="#DC6B82"/>
  <text class="smallLabel" x="140" y="26" text-anchor="middle">SuspendBackendA</text>
  <text class="smallLabel" x="140" y="50" text-anchor="middle">Controller</text>
  <rect x="56" y="58" width="168" height="18" rx="9" fill="#8A72D6"/>
  <text class="mono" x="140" y="71" text-anchor="middle" fill="#fff">@CircuitBreaker</text>
</g>

<!-- SuspendBackendBController -->
<g transform="translate(580,336)">
  <rect class="card" x="0" y="0" width="280" height="84" rx="12" fill="#E9F7F6" stroke="#45A7A1"/>
  <text class="smallLabel" x="140" y="26" text-anchor="middle">SuspendBackendB</text>
  <text class="smallLabel" x="140" y="50" text-anchor="middle">Controller</text>
  <rect x="96" y="58" width="88" height="18" rx="9" fill="#45A7A1"/>
  <text class="mono" x="140" y="71" text-anchor="middle" fill="#fff">@Retry</text>
</g>

<!-- Arrows to co-services -->
<path class="line" d="M240,420 L240,448"/>
<path class="line" d="M720,420 L720,448"/>

<!-- BackendACoService -->
<g transform="translate(100,448)">
  <rect class="card" x="0" y="0" width="280" height="56" rx="12" fill="#FDECEF" stroke="#DC6B82"/>
  <text class="smallLabel" x="140" y="30" text-anchor="middle">BackendACoService</text>
  <text class="small" x="140" y="50" text-anchor="middle">suspend · Flow · fallback</text>
</g>

<!-- BackendBCoService -->
<g transform="translate(580,448)">
  <rect class="card" x="0" y="0" width="280" height="56" rx="12" fill="#E9F7F6" stroke="#45A7A1"/>
  <text class="smallLabel" x="140" y="30" text-anchor="middle">BackendBCoService</text>
  <text class="small" x="140" y="50" text-anchor="middle">suspend · Flow · retry</text>
</g>

<!-- ====== BOTTOM SECTION: CircuitBreaker State Machine ====== -->
<text class="small" x="480" y="546" text-anchor="middle" letter-spacing="0.06em" font-size="11" fill="#758297">CIRCUIT BREAKER STATE MACHINE</text>

<!-- CLOSED state -->
<g transform="translate(48,556)">
  <rect class="card" x="0" y="0" width="220" height="80" rx="16" fill="#EAF7EF" stroke="#58A978"/>
  <text class="smallLabel" x="110" y="32" text-anchor="middle" fill="#1a5c30">CLOSED</text>
  <text class="small" x="110" y="56" text-anchor="middle">normal operation</text>
  <text class="mono" x="110" y="72" text-anchor="middle" fill="#58A978">Redis OK</text>
</g>

<!-- OPEN state -->
<g transform="translate(370,556)">
  <rect class="card" x="0" y="0" width="220" height="80" rx="16" fill="#FDECEF" stroke="#DC6B82"/>
  <text class="smallLabel" x="110" y="32" text-anchor="middle" fill="#8c1a2c">OPEN</text>
  <text class="small" x="110" y="56" text-anchor="middle">trips · rejects calls</text>
  <text class="mono" x="110" y="72" text-anchor="middle" fill="#DC6B82">Caffeine fallback</text>
</g>

<!-- HALF-OPEN state -->
<g transform="translate(692,556)">
  <rect class="card" x="0" y="0" width="220" height="80" rx="16" fill="#FFF3D9" stroke="#D6A441"/>
  <text class="smallLabel" x="110" y="32" text-anchor="middle" fill="#7a4b00">HALF-OPEN</text>
  <text class="small" x="110" y="56" text-anchor="middle">probe requests</text>
  <text class="mono" x="110" y="72" text-anchor="middle" fill="#D6A441">probe Redis</text>
</g>

<!-- State machine transitions (orthogonal paths) -->
<!-- CLOSED → OPEN (top path, above the cards, y=548) -->
<path class="lineRed" d="M268,576 L340,576 L340,572 L370,572"/>
<text class="mono" x="330" y="560" text-anchor="middle" fill="#DC6B82" font-size="10">failures ≥ threshold</text>

<!-- OPEN → HALF-OPEN (top path, y=550) -->
<path class="line" d="M590,568 L650,568 L650,564 L692,564"/>
<text class="mono" x="630" y="556" text-anchor="middle" fill="#758297" font-size="10">waitDuration elapsed</text>

<!-- HALF-OPEN → CLOSED (bottom arc, y=660) -->
<path class="lineGreen" d="M742,636 L742,660 L268,660 L268,636 L268,636"/>
<text class="mono" x="505" y="678" text-anchor="middle" fill="#58A978" font-size="10">probe succeeded → re-close</text>

<!-- HALF-OPEN → OPEN (probe failed, y=648) -->
<path class="lineRed" d="M802,636 L802,648 L480,648 L480,636"/>
<text class="mono" x="630" y="642" text-anchor="middle" fill="#DC6B82" font-size="10">probe failed → re-open</text>

<!-- Config row -->
<g transform="translate(36,696)">
  <rect x="0" y="0" width="888" height="28" rx="10" fill="#F1ECFF" stroke="#8A72D6" stroke-width="1.5" opacity="0.7"/>
  <text class="mono" x="444" y="18" text-anchor="middle" fill="#6A1B9A">slidingWindowSize=5 · minimumCalls=3 · failureRate≥60% · waitOpen=5s · halfOpenPermitted=2</text>
</g>

<!-- ====== Footer band (teal) ====== -->
<g transform="translate(36,730)">
  <rect x="0" y="0" width="888" height="28" rx="12" fill="#E9F7F6" stroke="#45A7A1" stroke-width="1.5"/>
  <text class="small" x="444" y="18" text-anchor="middle">AOP proxies intercept annotated beans · CircuitBreaker state persisted in registry · fallback methods invoked on open state</text>
</g>
</svg>
