<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="820" viewBox="0 0 1700 820" role="img" aria-label="Transactional outbox architecture diagram">
  <defs>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="124%"><feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#64748B" flood-opacity="0.16"/></filter>
    <marker id="arrowBlue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 12 6 L 0 12 Z" fill="#2563EB"/></marker>
    <marker id="arrowGreen" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 12 6 L 0 12 Z" fill="#16A34A"/></marker>
    <marker id="arrowAmber" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 12 6 L 0 12 Z" fill="#C47A12"/></marker>
    <marker id="arrowRed" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 12 6 L 0 12 Z" fill="#DC2626"/></marker>
    <style>
      .canvas{fill:#F8FAFC}.frame{fill:#FFFFFF;stroke:#D6E0E8;stroke-width:1.4}.layer{fill:#F8FAFC;stroke:#CBD5E1;stroke-width:1.4}.title{font-family:"Architects Daughter";font-size:38px;fill:#102033}.subtitle{font-family:"Comic Mono";font-size:14px;fill:#51606F}.layerLabel{font-family:"Architects Daughter";font-size:24px;fill:#263548}.cardTitle{font-family:"Architects Daughter";font-size:28px;fill:#102033}.cardText{font-family:"Comic Mono";font-size:14px;fill:#415166}.smallText{font-family:"Comic Mono";font-size:13px;fill:#475569}.line{fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.label{font-family:"Comic Mono";font-size:13px;fill:#334155}
    </style>
  </defs>
  <rect class="canvas" width="1700" height="820"/>
  <rect class="frame" x="24" y="24" width="1652" height="772" rx="24"/>
  <text class="title" x="850" y="68" text-anchor="middle">Transactional outbox architecture</text>
  <text class="subtitle" x="850" y="98" text-anchor="middle">OrderService writes order and outbox rows in one transaction; OutboxPublisher later sends durable events to Kafka.</text>

  <rect class="layer" x="64" y="136" width="276" height="560" rx="18"/>
  <text class="layerLabel" x="92" y="174">REST API</text>
  <g filter="url(#shadow)">
    <rect x="88" y="278" width="228" height="112" rx="16" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.7"/>
    <text class="cardTitle" x="202" y="322" text-anchor="middle">OrderController</text>
    <text class="cardText" x="202" y="352" text-anchor="middle">POST /api/orders</text>
    <text class="cardText" x="202" y="374" text-anchor="middle">PUT /status</text>
  </g>

  <rect class="layer" x="386" y="136" width="306" height="560" rx="18"/>
  <text class="layerLabel" x="414" y="174">Domain transaction</text>
  <g filter="url(#shadow)">
    <rect x="426" y="278" width="226" height="132" rx="16" fill="#ECFDF5" stroke="#16A34A" stroke-width="1.7"/>
    <text class="cardTitle" x="539" y="324" text-anchor="middle">OrderService</text>
    <text class="cardText" x="539" y="356" text-anchor="middle">validates command</text>
    <text class="cardText" x="539" y="380" text-anchor="middle">writes two rows</text>
  </g>

  <rect class="layer" x="738" y="136" width="340" height="560" rx="18"/>
  <text class="layerLabel" x="766" y="174">PostgreSQL</text>
  <g filter="url(#shadow)">
    <rect x="782" y="200" width="252" height="102" rx="16" fill="#F8FAFC" stroke="#334155" stroke-width="1.7"/>
    <ellipse cx="908" cy="224" rx="58" ry="18" fill="#E0F2FE" stroke="#334155" stroke-width="1.7"/>
    <path d="M 850 224 L 850 266 C 850 290 966 290 966 266 L 966 224" fill="#E0F2FE" stroke="#334155" stroke-width="1.7"/>
    <path d="M 850 266 C 850 290 966 290 966 266" fill="none" stroke="#334155" stroke-width="1.7"/>
    <text class="cardTitle" x="908" y="260" text-anchor="middle">Database</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="790" y="344" width="236" height="110" rx="16" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.7"/>
    <text class="cardTitle" x="908" y="386" text-anchor="middle">orders</text>
    <text class="cardText" x="908" y="416" text-anchor="middle">status + timestamps</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="790" y="506" width="236" height="132" rx="16" fill="#FFF7ED" stroke="#D97706" stroke-width="1.7"/>
    <text class="cardTitle" x="908" y="548" text-anchor="middle">outbox_events</text>
    <text class="cardText" x="908" y="578" text-anchor="middle">payload + status</text>
    <text class="cardText" x="908" y="602" text-anchor="middle">retry_count</text>
  </g>

  <rect class="layer" x="1110" y="136" width="300" height="560" rx="18"/>
  <text class="layerLabel" x="1138" y="174">Publisher</text>
  <g filter="url(#shadow)">
    <rect x="1144" y="410" width="230" height="132" rx="16" fill="#ECFDF5" stroke="#16A34A" stroke-width="1.7"/>
    <text class="cardTitle" x="1259" y="456" text-anchor="middle">OutboxPublisher</text>
    <text class="cardText" x="1259" y="488" text-anchor="middle">@Scheduled 2s</text>
    <text class="cardText" x="1259" y="512" text-anchor="middle">publishEvent(id)</text>
  </g>

  <rect class="layer" x="1454" y="136" width="182" height="560" rx="18"/>
  <text class="layerLabel" x="1482" y="174">Kafka</text>
  <g filter="url(#shadow)">
    <rect x="1488" y="312" width="124" height="94" rx="16" fill="#F8FAFC" stroke="#111827" stroke-width="1.7"/>
    <circle cx="1528" cy="350" r="9" fill="#111827"/>
    <circle cx="1558" cy="332" r="9" fill="#111827"/>
    <circle cx="1558" cy="370" r="9" fill="#111827"/>
    <path d="M 1536 346 L 1550 337" stroke="#111827" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M 1536 354 L 1550 366" stroke="#111827" stroke-width="3.5" stroke-linecap="round"/>
    <text class="cardTitle" x="1550" y="392" text-anchor="middle">Kafka</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="1488" y="462" width="124" height="84" rx="16" fill="#FFF7ED" stroke="#D97706" stroke-width="1.7"/>
    <text class="smallText" x="1550" y="498" text-anchor="middle">order-events</text>
    <text class="smallText" x="1550" y="522" text-anchor="middle">topic</text>
  </g>

  <path class="line" d="M 300 334 L 426 334" stroke="#16A34A" marker-end="url(#arrowGreen)"/>
  <path class="line" d="M 652 344 L 708 344 L 708 384 L 790 384" stroke="#2563EB" marker-end="url(#arrowBlue)"/>
  <text class="label" x="704" y="326">same tx</text>
  <path class="line" d="M 652 374 L 732 374 L 732 554 L 790 554" stroke="#C47A12" marker-end="url(#arrowAmber)"/>
  <path class="line" d="M 1026 572 L 1084 572 L 1084 476 L 1144 476" stroke="#16A34A" marker-end="url(#arrowGreen)"/>
  <text class="label" x="1056" y="506">poll</text>
  <path class="line" d="M 1374 488 L 1430 488 L 1430 504 L 1488 504" stroke="#C47A12" marker-end="url(#arrowAmber)"/>
  <path class="line" d="M 1144 526 L 1098 526 L 1098 622 L 1026 622" stroke="#DC2626" marker-end="url(#arrowRed)"/>
  <text class="label" x="1050" y="652">PUBLISHED / FAILED / DEAD_LETTER</text>
</svg>
