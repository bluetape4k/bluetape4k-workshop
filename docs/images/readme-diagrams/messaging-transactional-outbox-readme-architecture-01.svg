<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="2828.033" height="820" viewBox="0 0 2828.033 820" role="img" aria-label="Transactional outbox architecture diagram">
  <defs>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="124%"><feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#64748B" flood-opacity="0.16"/></filter>
    <marker id="arrowBlue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 12 6 L 0 12 Z" fill="#2563EB" stroke-dasharray="none" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="arrowGreen" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 12 6 L 0 12 Z" fill="#16A34A" stroke-dasharray="none" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="arrowAmber" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 12 6 L 0 12 Z" fill="#C47A12" stroke-dasharray="none" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="arrowRed" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 12 6 L 0 12 Z" fill="#DC2626" stroke-dasharray="none" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <style>
      .canvas{fill:#F8FAFC}.frame{fill:#FFFFFF;stroke:#D6E0E8;stroke-width:1.4}.layer{fill:#F8FAFC;stroke:#CBD5E1;stroke-width:1.4}.title{font-family:"Architects Daughter";font-size:38px;fill:#102033}.subtitle{font-family:"Comic Mono";font-size:14px;fill:#51606F}.layerLabel{font-family:"Architects Daughter";font-size:24px;fill:#263548}.cardTitle{font-family:"Architects Daughter";font-size:28px;fill:#102033}.cardText{font-family:"Comic Mono";font-size:14px;fill:#415166}.smallText{font-family:"Comic Mono";font-size:13px;fill:#475569}.line{fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.label{font-family:"Comic Mono";font-size:13px;fill:#334155}
    </style>
  </defs>
  <rect class="canvas" width="2828.033" height="820"/>
  <rect class="frame" x="39.925" y="24" width="2748.182" height="772" rx="24"/>
  <text class="title" x="1414.016" y="68" text-anchor="middle">Transactional outbox architecture</text>  <text class="subtitle" x="1414.016" y="98" text-anchor="middle">OrderService writes order and outbox rows in one transaction; OutboxPublisher later sends durable events to Kafka.</text>

  <rect class="layer" x="106.468" y="136" width="459.139" height="560" rx="18"/>
  <text class="layerLabel" x="153.047" y="174">REST API</text>
  <g filter="url(#shadow)">
    <rect x="146.393" y="278" width="379.289" height="112" rx="16" fill="#EFF6FF" stroke="#2563EB" stroke-width="2.828"/>
    <text class="cardTitle" x="336.037" y="322" text-anchor="middle">OrderController</text>
    <text class="cardText" x="336.037" y="352" text-anchor="middle">POST /api/orders</text>
    <text class="cardText" x="336.037" y="374" text-anchor="middle">PUT /status</text>
  </g>

  <rect class="layer" x="642.13" y="136" width="509.046" height="560" rx="18"/>
  <text class="layerLabel" x="688.709" y="174">Domain transaction</text>
  <g filter="url(#shadow)">
    <rect x="708.672" y="278" width="375.962" height="132" rx="16" fill="#ECFDF5" stroke="#16A34A" stroke-width="2.828"/>
    <text class="cardTitle" x="896.652" y="324" text-anchor="middle">OrderService</text>
    <text class="cardText" x="896.652" y="356" text-anchor="middle">validates command</text>
    <text class="cardText" x="896.652" y="380" text-anchor="middle">writes two rows</text>
  </g>

  <rect class="layer" x="1227.698" y="136" width="565.607" height="560" rx="18"/>  <text class="layerLabel" x="1274.279" y="174">PostgreSQL</text>
  <g filter="url(#shadow)">
    <rect x="1300.895" y="200" width="419.214" height="102" rx="16" fill="#F8FAFC" stroke="#334155" stroke-width="2.828"/>
    <image data-bluetape4k-icon="database" data-source="docs/icons/generic/database-server.svg" x="1468.913" y="197" width="50" height="50" href="data:image/svg+xml;base64," preserveAspectRatio="xMidYMid meet"/>
    <text class="cardTitle" x="1510.502" y="266" text-anchor="middle">Database</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="1314.203" y="344" width="392.598" height="110" rx="16" fill="#EFF6FF" stroke="#2563EB" stroke-width="2.828"/>
    <text class="cardTitle" x="1510.502" y="386" text-anchor="middle">orders</text>
    <text class="cardText" x="1510.502" y="416" text-anchor="middle">status + timestamps</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="1314.203" y="506" width="392.598" height="132" rx="16" fill="#FFF7ED" stroke="#D97706" stroke-width="2.828"/>
    <text class="cardTitle" x="1510.502" y="548" text-anchor="middle">outbox_events</text>
    <text class="cardText" x="1510.502" y="578" text-anchor="middle">payload + status</text>
    <text class="cardText" x="1510.502" y="602" text-anchor="middle">retry_count</text>
  </g>

  <rect class="layer" x="1846.538" y="136" width="499.064" height="560" rx="18"/>
  <text class="layerLabel" x="1893.119" y="174">Publisher</text>
  <g filter="url(#shadow)">
    <rect x="1903.099" y="410" width="382.616" height="132" rx="16" fill="#ECFDF5" stroke="#16A34A" stroke-width="2.828"/>
    <text class="cardTitle" x="2094.408" y="456" text-anchor="middle">OutboxPublisher</text>
    <text class="cardText" x="2094.408" y="488" text-anchor="middle">@Scheduled 2s</text>
    <text class="cardText" x="2094.408" y="512" text-anchor="middle">publishEvent(id)</text>
  </g>

  <rect class="layer" x="2418.799" y="136" width="302.766" height="560" rx="18"/><text class="layerLabel" x="2465.378" y="174">Kafka</text>
  <g filter="url(#shadow)">
    <rect x="2475.36" y="312" width="206.28" height="94" rx="16" fill="#F8FAFC" stroke="#111827" stroke-width="2.828"/>
    <image data-bluetape4k-icon="kafka" data-source="docs/icons/messaging/kafka.svg" x="2550.547" y="324" width="36" height="36" href="data:image/svg+xml;base64," preserveAspectRatio="xMidYMid meet"/>
    <text class="cardTitle" x="2578.5" y="392" text-anchor="middle">Kafka</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="2475.36" y="462" width="206.28" height="84" rx="16" fill="#FFF7ED" stroke="#D97706" stroke-width="2.828"/><image data-bluetape4k-icon="kafka" data-source="docs/icons/testcontainers/mq/apache-kafka.svg" x="2495.322" y="495" width="18" height="18" href="data:image/svg+xml;base64," preserveAspectRatio="xMidYMid meet"/>
    <text class="smallText" x="2578.5" y="498" text-anchor="middle">order-events</text>
    <text class="smallText" x="2578.5" y="522" text-anchor="middle">topic</text>
  </g>

  <path class="line" d="M 499.064 334 L 708.672 334" stroke="#16A34A" marker-end="url(#arrowGreen)" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="line" d="M 1084.633 344 L 1161.157 344 Q 1177.793 344 1177.793 354 L 1177.793 374 Q 1177.793 384 1194.427 384 L 1314.203 384" stroke="#2563EB" marker-end="url(#arrowBlue)" stroke-linecap="round" stroke-linejoin="round"/>
  <text class="label" x="1171.139" y="326">same tx</text>
  <path class="line" d="M 1084.633 374 L 1201.082 374 Q 1201.082 374 1201.082 384 L 1201.082 544 Q 1201.082 554 1234.352 554 L 1314.203 554" stroke="#C47A12" marker-end="url(#arrowAmber)" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="line" d="M 1706.801 572 L 1786.651 572 Q 1819.921 572 1819.921 562 L 1819.921 486 Q 1819.921 476 1819.921 476 L 1903.099 476" stroke="#16A34A" marker-end="url(#arrowGreen)" stroke-linecap="round" stroke-linejoin="round"/>
  <text class="label" x="1756.708" y="506">poll</text>
  <path class="line" d="M 2285.716 488 L 2367.229 488 Q 2378.874 488 2378.874 495 L 2378.874 497 Q 2378.874 504 2390.519 504 L 2475.36 504" stroke="#C47A12" marker-end="url(#arrowAmber)" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="line" d="M 1903.099 526 L 1843.212 526 Q 1819.921 526 1819.921 536 L 1819.921 612 Q 1819.921 622 1809.941 622 L 1706.801 622" stroke="#DC2626" marker-end="url(#arrowRed)" stroke-linecap="round" stroke-linejoin="round"/>
  <text class="label" x="1746.726" y="652">PUBLISHED / FAILED / DEAD_LETTER</text>
</svg>
