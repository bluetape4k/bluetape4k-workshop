<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="1060" viewBox="0 0 1680 1060" role="img" aria-labelledby="title desc">
  <title id="title">Leader Backend Comparison Lab Sequence</title>
  <desc id="desc">A scheduled tick enters the deterministic leader guard model, one node executes, followers skip, backend loss is represented by an alt branch, and metrics are recorded for inspection.</desc>
  <defs>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="124%"><feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#64748B" flood-opacity="0.14"/></filter>
    <style>
      .title{font-family:"Architects Daughter";font-size:42px;fill:#263238}.subtitle,.msg,.footer,.role{font-family:"Comic Mono";fill:#36464F}.subtitle{font-size:17px}.participant{font-family:"Architects Daughter";font-size:19px;fill:#1F3138}.role{font-size:12px;fill:#546A73}.msg{font-size:13px}.footer{font-size:14px;fill:#60727D}.frame{fill:#FBFCF8;stroke:#41545D;stroke-width:3}.header{fill:#FFFFFF;stroke:#546E7A;stroke-width:2}.lifeline{stroke:#9AAAB1;stroke-width:2;stroke-dasharray:7 8;stroke-linecap:round}.activation{fill:#EAF6EF;stroke:#6F9278;stroke-width:1.5}.call,.return{fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.allowed{stroke:#4F86C6;marker-end:url(#seq-blue)}.state{stroke:#2D948C;marker-end:url(#seq-teal)}.skip{stroke:#D08A39;marker-end:url(#seq-orange)}.loss{stroke:#B86868;stroke-dasharray:12 8;marker-end:url(#seq-red)}.event{stroke:#6E8F4F;marker-end:url(#seq-green)}.return{stroke:#2D948C;stroke-width:2.6;stroke-dasharray:8 6;marker-end:url(#seq-teal)}.label{fill:#FFFFFF;stroke:#D7E0E4;stroke-width:1.5}.blueLabel{stroke:#9CC2D1}.tealLabel{stroke:#9DCBC6}.orangeLabel{stroke:#D8B574}.redLabel{stroke:#D9ABAB}.greenLabel{stroke:#B6C9A4}.badge{stroke-width:1.8}.blueBadge{fill:#EAF4F8;stroke:#4F86C6}.tealBadge{fill:#EBFAF8;stroke:#2D948C}.orangeBadge{fill:#FFF7E8;stroke:#D08A39}.redBadge{fill:#FFF0F0;stroke:#B86868}.greenBadge{fill:#EEF7F0;stroke:#6E8F4F}.badgeText{font-family:"Comic Mono";font-size:12px;font-weight:700}.blueText{fill:#2F6F8E}.tealText{fill:#247C75}.orangeText{fill:#9A641F}.redText{fill:#9D4F4F}.greenText{fill:#55783F}.alt{fill:none;stroke:#D08A39;stroke-width:2.2;stroke-dasharray:12 8}.divider{stroke:#D08A39;stroke-width:1.8;stroke-dasharray:9 7;opacity:.72}.branch{fill:#FFFFFF;stroke:#D08A39;stroke-width:1.6}.branchText{font-family:"Architects Daughter";font-size:18px;fill:#8A5A22}
    </style>
    <marker id="seq-blue" viewBox="0 0 10 10" markerWidth="16" markerHeight="16" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse" data-role="sequence" data-tip-direction="positive-x"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#4F86C6" stroke="#4F86C6" stroke-dasharray="none" style="stroke-dasharray:none" stroke-linecap="round" stroke-linejoin="round" stroke-width="0"/></marker>
    <marker id="seq-teal" viewBox="0 0 10 10" markerWidth="16" markerHeight="16" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse" data-role="sequence" data-tip-direction="positive-x"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#2D948C" stroke="#2D948C" stroke-dasharray="none" style="stroke-dasharray:none" stroke-linecap="round" stroke-linejoin="round" stroke-width="0"/></marker>
    <marker id="seq-orange" viewBox="0 0 10 10" markerWidth="16" markerHeight="16" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse" data-role="sequence" data-tip-direction="positive-x"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#D08A39" stroke="#D08A39" stroke-dasharray="none" style="stroke-dasharray:none" stroke-linecap="round" stroke-linejoin="round" stroke-width="0"/></marker>
    <marker id="seq-red" viewBox="0 0 10 10" markerWidth="16" markerHeight="16" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse" data-role="sequence" data-tip-direction="positive-x"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#B86868" stroke="#B86868" stroke-dasharray="none" style="stroke-dasharray:none" stroke-linecap="round" stroke-linejoin="round" stroke-width="0"/></marker>
    <marker id="seq-green" viewBox="0 0 10 10" markerWidth="16" markerHeight="16" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse" data-role="sequence" data-tip-direction="positive-x"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#6E8F4F" stroke="#6E8F4F" stroke-dasharray="none" style="stroke-dasharray:none" stroke-linecap="round" stroke-linejoin="round" stroke-width="0"/></marker>
  </defs>
  <rect x="24" y="24" width="1632" height="1012" rx="20" class="frame"/>
  <text x="840" y="76" text-anchor="middle" class="title">Leader Backend Comparison Sequence</text>
  <text x="840" y="108" text-anchor="middle" class="subtitle">One scheduled tick runs the same guarded job model against Redis, ZooKeeper, or Kubernetes Lease semantics.</text>

  <g filter="url(#shadow)"><rect x="55" y="154" width="210" height="74" rx="10" class="header"/><text x="160" y="184" text-anchor="middle" class="participant">Scheduler</text><text x="160" y="208" text-anchor="middle" class="role">tick source</text></g>
  <g filter="url(#shadow)"><rect x="335" y="154" width="210" height="74" rx="10" class="header"/><text x="440" y="184" text-anchor="middle" class="participant">Node A</text><text x="440" y="208" text-anchor="middle" class="role">first candidate</text></g>
  <g filter="url(#shadow)"><rect x="615" y="154" width="210" height="74" rx="10" class="header"/><text x="720" y="184" text-anchor="middle" class="participant">LeaderGuard</text><text x="720" y="208" text-anchor="middle" class="role">runIfLeader model</text></g>
  <g filter="url(#shadow)"><rect x="895" y="154" width="210" height="74" rx="10" class="header"/><text x="1000" y="184" text-anchor="middle" class="participant">Backend</text><text x="1000" y="208" text-anchor="middle" class="role">profile semantics</text></g>
  <g filter="url(#shadow)"><rect x="1175" y="154" width="210" height="74" rx="10" class="header"/><text x="1280" y="184" text-anchor="middle" class="participant">Node B</text><text x="1280" y="208" text-anchor="middle" class="role">follower</text></g>
  <g filter="url(#shadow)"><rect x="1415" y="154" width="210" height="74" rx="10" class="header"/><text x="1520" y="184" text-anchor="middle" class="participant">Metrics</text><text x="1520" y="208" text-anchor="middle" class="role">events to inspect</text></g>

  <line x1="160" y1="228" x2="160" y2="956" class="lifeline"/>
  <line x1="440" y1="228" x2="440" y2="956" class="lifeline"/>
  <line x1="720" y1="228" x2="720" y2="956" class="lifeline"/>
  <line x1="1000" y1="228" x2="1000" y2="956" class="lifeline"/>
  <line x1="1280" y1="228" x2="1280" y2="956" class="lifeline"/>
  <line x1="1520" y1="228" x2="1520" y2="956" class="lifeline"/>
  <rect class="activation" x="432" y="300" width="16" height="392" rx="6"/>
  <rect class="activation" x="712" y="380" width="16" height="368" rx="6"/>
  <rect class="activation" x="992" y="460" width="16" height="406" rx="6"/>
  <rect class="activation" x="1272" y="700" width="16" height="228" rx="6"/>
  <rect class="activation" x="1512" y="880" width="16" height="64" rx="6"/>

  <rect x="218" y="282" width="250" height="34" rx="17" class="label labelPill blueLabel"/><circle cx="242" cy="299" r="13" class="badge blueBadge"/><text x="242" y="304" text-anchor="middle" class="badgeText num blueText">1</text><text x="266" y="304" class="msg blueText">scheduled tick</text><path data-connector="seq-1" d="M 160 324 L 440 324" class="call allowed" marker-end="url(#seq-blue)"/>
  <rect x="470" y="362" width="282" height="34" rx="17" class="label labelPill blueLabel"/><circle cx="494" cy="379" r="13" class="badge blueBadge"/><text x="494" y="384" text-anchor="middle" class="badgeText num blueText">2</text><text x="518" y="384" class="msg blueText">runIfLeader(report-sync)</text><path data-connector="seq-2" d="M 440 404 L 720 404" class="call allowed" marker-end="url(#seq-blue)"/>
  <rect x="748" y="442" width="276" height="34" rx="17" class="label labelPill blueLabel"/><circle cx="772" cy="459" r="13" class="badge blueBadge"/><text x="772" y="464" text-anchor="middle" class="badgeText num blueText">3</text><text x="796" y="464" class="msg blueText">try acquire leadership</text><path data-connector="seq-3" d="M 720 484 L 1000 484" class="call allowed" marker-end="url(#seq-blue)"/>
  <rect x="742" y="522" width="268" height="34" rx="17" class="label labelPill tealLabel"/><circle cx="766" cy="539" r="13" class="badge tealBadge"/><text x="766" y="544" text-anchor="middle" class="badgeText num tealText">4</text><text x="790" y="544" class="msg tealText">acquired or skipped</text><path data-connector="seq-4" d="M 1000 564 L 720 564" class="return" marker-end="url(#seq-teal)"/>
  <rect x="468" y="602" width="258" height="34" rx="17" class="label labelPill tealLabel"/><circle cx="492" cy="619" r="13" class="badge tealBadge"/><text x="492" y="624" text-anchor="middle" class="badgeText num tealText">5</text><text x="516" y="624" class="msg tealText">execute guarded job</text><path data-connector="seq-5" d="M 720 644 L 440 644" class="return" marker-end="url(#seq-teal)"/>
  <rect x="820" y="682" width="314" height="34" rx="17" class="label labelPill orangeLabel"/><circle cx="844" cy="699" r="13" class="badge orangeBadge"/><text x="844" y="704" text-anchor="middle" class="badgeText num orangeText">6</text><text x="868" y="704" class="msg orangeText">follower receives skip signal</text><path data-connector="seq-6" d="M 720 724 L 1280 724" class="call skip" marker-end="url(#seq-orange)"/>

  <rect x="78" y="776" width="1524" height="166" rx="16" class="alt"/>
  <rect x="116" y="760" width="248" height="32" rx="16" class="branch"/>
  <text x="240" y="782" text-anchor="middle" class="branchText">alt backend loss</text>
  <line x1="78" y1="846" x2="1602" y2="846" class="divider"/>
  <rect x="1036" y="792" width="288" height="34" rx="17" class="label labelPill redLabel"/><circle cx="1060" cy="809" r="13" class="badge redBadge"/><text x="1060" y="814" text-anchor="middle" class="badgeText num redText">7</text><text x="1084" y="814" class="msg redText">Lease or session is lost</text><path data-connector="seq-7" d="M 1000 834 L 1280 834" class="call loss" marker-end="url(#seq-red)"/>
  <rect x="1288" y="856" width="304" height="34" rx="17" class="label labelPill greenLabel"/><circle cx="1312" cy="873" r="13" class="badge greenBadge"/><text x="1312" y="878" text-anchor="middle" class="badgeText num greenText">8</text><text x="1336" y="878" class="msg greenText">record events and meters</text><path data-connector="seq-8" d="M 1280 898 L 1520 898" class="call event" marker-end="url(#seq-green)"/>

  <rect x="96" y="970" width="1488" height="34" rx="12" fill="#FFFFFF" stroke="#CCD7DA" stroke-width="2"/>
  <text x="840" y="993" text-anchor="middle" class="footer">Reader contract: call labels stay above lines, arrowheads match line colors, and the alt body is transparent.</text>
</svg>
