<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="1260" viewBox="0 0 1680 1260" role="img" aria-labelledby="title desc">
  <title id="title">JaVers Approval Workflow Sequence</title>
  <desc id="desc">A proposal is compared with the current ProductPolicy row, stored as pending review, and then either approved into JaVers history plus the current row or rejected as a decision-only record.</desc>
  <defs>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="124%"><feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#64748B" flood-opacity="0.14"/></filter>
    <style>
      .title{font-family:"Architects Daughter";font-size:42px;fill:#263238}.subtitle,.msg,.footer,.role{font-family:"Comic Mono";fill:#36464F}.subtitle{font-size:17px}.participant{font-family:"Architects Daughter";font-size:19px;fill:#1F3138}.role{font-size:12px;fill:#546A73}.msg{font-size:13px}.footer{font-size:14px;fill:#60727D}.frame{fill:#FBFCF8;stroke:#41545D;stroke-width:3}.header{fill:#FFFFFF;stroke:#546E7A;stroke-width:2}.lifeline{stroke:#9AAAB1;stroke-width:2;stroke-dasharray:7 8;stroke-linecap:round}.activation{fill:#EAF6EF;stroke:#6F9278;stroke-width:1.5}.call,.return{fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.callBlue{stroke:#4F86C6;marker-end:url(#seq-blue)}.callAmber{stroke:#A8793D;marker-end:url(#seq-amber)}.callGreen{stroke:#6E8F4F;marker-end:url(#seq-green)}.callRed{stroke:#B86868;marker-end:url(#seq-red)}.return{stroke:#2D948C;stroke-width:2.6;stroke-dasharray:8 6;marker-end:url(#seq-teal)}.label{fill:#FFFFFF;stroke:#D7E0E4;stroke-width:1.5}.blueLabel{stroke:#9CC2D1}.amberLabel{stroke:#D4B78D}.greenLabel{stroke:#B6C9A4}.redLabel{stroke:#D9ABAB}.tealLabel{stroke:#9DCBC6}.badge{stroke-width:1.8}.blueBadge{fill:#EAF4F8;stroke:#4F86C6}.amberBadge{fill:#FFF7E8;stroke:#A8793D}.greenBadge{fill:#EEF7F0;stroke:#6E8F4F}.redBadge{fill:#FFF0F0;stroke:#B86868}.tealBadge{fill:#EBFAF8;stroke:#2D948C}.badgeText{font-family:"Comic Mono";font-size:12px;font-weight:700}.blueText{fill:#2F6F8E}.amberText{fill:#8A5A22}.greenText{fill:#55783F}.redText{fill:#9D4F4F}.tealText{fill:#247C75}.alt{fill:none;stroke:#D08A39;stroke-width:2.2;stroke-dasharray:12 8}.divider{stroke:#D08A39;stroke-width:1.8;stroke-dasharray:9 7;opacity:.72}.branch{fill:#FFFFFF;stroke:#D08A39;stroke-width:1.6}.branchText{font-family:"Architects Daughter";font-size:18px;fill:#8A5A22}
    </style>
    <marker id="seq-blue" viewBox="0 0 10 10" markerWidth="16" markerHeight="16" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#4F86C6" stroke="#4F86C6" stroke-dasharray="none" style="stroke-dasharray:none" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="seq-amber" viewBox="0 0 10 10" markerWidth="16" markerHeight="16" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#A8793D" stroke="#A8793D" stroke-dasharray="none" style="stroke-dasharray:none" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="seq-green" viewBox="0 0 10 10" markerWidth="16" markerHeight="16" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#6E8F4F" stroke="#6E8F4F" stroke-dasharray="none" style="stroke-dasharray:none" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="seq-red" viewBox="0 0 10 10" markerWidth="16" markerHeight="16" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#B86868" stroke="#B86868" stroke-dasharray="none" style="stroke-dasharray:none" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="seq-teal" viewBox="0 0 10 10" markerWidth="16" markerHeight="16" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#2D948C" stroke="#2D948C" stroke-dasharray="none" style="stroke-dasharray:none" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>
  <rect x="24" y="24" width="1632" height="1212" rx="20" class="frame"/>
  <text x="840" y="76" text-anchor="middle" class="title">Approval Decision Sequence</text>
  <text x="840" y="108" text-anchor="middle" class="subtitle">Diff review happens before commit; only approval writes JaVers history and the current policy row.</text>

  <g filter="url(#shadow)"><rect x="48" y="154" width="200" height="74" rx="10" class="header"/><text x="148" y="184" text-anchor="middle" class="participant">Reviewer / Test</text><text x="148" y="208" text-anchor="middle" class="role">decision actor</text></g>
  <g filter="url(#shadow)"><rect x="304" y="154" width="216" height="74" rx="10" class="header"/><text x="412" y="184" text-anchor="middle" class="participant">ApprovalService</text><text x="412" y="208" text-anchor="middle" class="role">workflow facade</text></g>
  <g filter="url(#shadow)"><rect x="576" y="154" width="206" height="74" rx="10" class="header"/><text x="679" y="184" text-anchor="middle" class="participant">Current Row</text><text x="679" y="208" text-anchor="middle" class="role">product_policies</text></g>
  <g filter="url(#shadow)"><rect x="838" y="154" width="206" height="74" rx="10" class="header"/><text x="941" y="184" text-anchor="middle" class="participant">JaVers Diff</text><text x="941" y="208" text-anchor="middle" class="role">compare engine</text></g>
  <g filter="url(#shadow)"><rect x="1100" y="154" width="206" height="74" rx="10" class="header"/><text x="1203" y="184" text-anchor="middle" class="participant">Decision Row</text><text x="1203" y="208" text-anchor="middle" class="role">policy_proposals</text></g>
  <g filter="url(#shadow)"><rect x="1410" y="154" width="206" height="74" rx="10" class="header"/><text x="1513" y="184" text-anchor="middle" class="participant">JaVers History</text><text x="1513" y="208" text-anchor="middle" class="role">approved snapshots</text></g>

  <line x1="148" y1="228" x2="148" y2="1164" class="lifeline"/>
  <line x1="412" y1="228" x2="412" y2="1164" class="lifeline"/>
  <line x1="679" y1="228" x2="679" y2="1164" class="lifeline"/>
  <line x1="941" y1="228" x2="941" y2="1164" class="lifeline"/>
  <line x1="1203" y1="228" x2="1203" y2="1164" class="lifeline"/>
  <line x1="1513" y1="228" x2="1513" y2="1164" class="lifeline"/>
  <rect class="activation" x="404" y="300" width="16" height="842" rx="6"/>
  <rect class="activation" x="671" y="372" width="16" height="76" rx="6"/>
  <rect class="activation" x="933" y="444" width="16" height="76" rx="6"/>
  <rect class="activation" x="1195" y="522" width="16" height="624" rx="6"/>
  <rect class="activation" x="1505" y="806" width="16" height="78" rx="6"/>
  <rect class="activation" x="671" y="894" width="16" height="78" rx="6"/>

  <rect x="198" y="282" width="280" height="34" rx="17" class="label labelPill blueLabel"/><circle cx="222" cy="299" r="13" class="badge blueBadge"/><text x="222" y="304" text-anchor="middle" class="badgeText num blueText">1</text><text x="246" y="304" class="msg blueText">submitProposal(proposed)</text><path data-connector="seq-1" d="M 148 324 L 412 324" class="call callBlue"/>
  <rect x="444" y="354" width="228" height="34" rx="17" class="label labelPill amberLabel"/><circle cx="468" cy="371" r="13" class="badge amberBadge"/><text x="468" y="376" text-anchor="middle" class="badgeText num amberText">2</text><text x="492" y="376" class="msg amberText">load current policy</text><path data-connector="seq-2" d="M 412 396 L 679 396" class="call callAmber"/>
  <rect x="698" y="426" width="274" height="34" rx="17" class="label labelPill amberLabel"/><circle cx="722" cy="443" r="13" class="badge amberBadge"/><text x="722" y="448" text-anchor="middle" class="badgeText num amberText">3</text><text x="746" y="448" class="msg amberText">compare current/proposed</text><path data-connector="seq-3" d="M 412 468 L 941 468" class="call callAmber"/>
  <rect x="696" y="498" width="292" height="34" rx="17" class="label labelPill tealLabel"/><circle cx="720" cy="515" r="13" class="badge tealBadge"/><text x="720" y="520" text-anchor="middle" class="badgeText num tealText">4</text><text x="744" y="520" class="msg tealText">changed field summary</text><path data-connector="seq-4" d="M 941 540 L 412 540" class="return"/>
  <rect x="754" y="570" width="306" height="34" rx="17" class="label labelPill blueLabel"/><circle cx="778" cy="587" r="13" class="badge blueBadge"/><text x="778" y="592" text-anchor="middle" class="badgeText num blueText">5</text><text x="802" y="592" class="msg blueText">store pending decision</text><path data-connector="seq-5" d="M 412 612 L 1203 612" class="call callBlue"/>
  <rect x="188" y="642" width="278" height="34" rx="17" class="label labelPill tealLabel"/><circle cx="212" cy="659" r="13" class="badge tealBadge"/><text x="212" y="664" text-anchor="middle" class="badgeText num tealText">6</text><text x="236" y="664" class="msg tealText">pending proposal returned</text><path data-connector="seq-6" d="M 412 684 L 148 684" class="return"/>

  <rect x="70" y="710" width="1540" height="424" rx="16" class="alt"/>
  <rect x="108" y="694" width="224" height="32" rx="16" class="branch"/>
  <text x="220" y="716" text-anchor="middle" class="branchText">alt review decision</text>
  <rect x="92" y="742" width="126" height="32" rx="16" class="branch"/>
  <text x="155" y="764" text-anchor="middle" class="branchText">approved</text>
  <line x1="70" y1="1008" x2="1610" y2="1008" class="divider"/>
  <rect x="92" y="1030" width="116" height="32" rx="16" class="branch"/>
  <text x="150" y="1052" text-anchor="middle" class="branchText">rejected</text>

  <rect x="250" y="742" width="246" height="34" rx="17" class="label labelPill greenLabel"/><circle cx="274" cy="759" r="13" class="badge greenBadge"/><text x="274" y="764" text-anchor="middle" class="badgeText num greenText">7</text><text x="298" y="764" class="msg greenText">approveProposal(id)</text><path data-connector="seq-7" d="M 148 800 L 412 800" class="call callGreen"/>
  <rect x="900" y="806" width="300" height="34" rx="17" class="label labelPill greenLabel"/><circle cx="924" cy="823" r="13" class="badge greenBadge"/><text x="924" y="828" text-anchor="middle" class="badgeText num greenText">8</text><text x="948" y="828" class="msg greenText">commit proposed snapshot</text><path data-connector="seq-8" d="M 412 848 L 1513 848" class="call callGreen"/>
  <rect x="444" y="870" width="244" height="34" rx="17" class="label labelPill greenLabel"/><circle cx="468" cy="887" r="13" class="badge greenBadge"/><text x="468" y="892" text-anchor="middle" class="badgeText num greenText">9</text><text x="492" y="892" class="msg greenText">upsert current row</text><path data-connector="seq-9" d="M 412 912 L 679 912" class="call callGreen"/>
  <rect x="762" y="934" width="236" height="34" rx="17" class="label labelPill greenLabel"/><circle cx="786" cy="951" r="13" class="badge greenBadge"/><text x="786" y="956" text-anchor="middle" class="badgeText num greenText">10</text><text x="810" y="956" class="msg greenText">mark approved</text><path data-connector="seq-10" d="M 412 976 L 1203 976" class="call callGreen"/>
  <rect x="220" y="1034" width="236" height="34" rx="17" class="label labelPill redLabel"/><circle cx="244" cy="1051" r="13" class="badge redBadge"/><text x="244" y="1056" text-anchor="middle" class="badgeText num redText">11</text><text x="268" y="1056" class="msg redText">rejectProposal(id)</text><path data-connector="seq-11" d="M 148 1076 L 412 1076" class="call callRed"/>
  <rect x="760" y="1088" width="246" height="34" rx="17" class="label labelPill redLabel"/><circle cx="784" cy="1105" r="13" class="badge redBadge"/><text x="784" y="1110" text-anchor="middle" class="badgeText num redText">12</text><text x="808" y="1110" class="msg redText">mark rejected only</text><path data-connector="seq-12" d="M 412 1130 L 1203 1130" class="call callRed"/>

  <rect x="96" y="1186" width="1488" height="34" rx="12" fill="#FFFFFF" stroke="#CCD7DA" stroke-width="2"/>
  <text x="840" y="1209" text-anchor="middle" class="footer">Reader contract: labels sit above call lines, arrowheads match line colors, and the alt body remains transparent.</text>
</svg>
