<svg xmlns="http://www.w3.org/2000/svg" width="1660" height="760" viewBox="0 0 1660 760">
  <defs>
    <style>
      .bg{fill:#f8fafc}.title{font-family:'Architects Daughter','Comic Sans MS',cursive;font-size:34px;fill:#18212f}
      .layer-title{font-family:'Architects Daughter','Comic Sans MS',cursive;font-size:26px;fill:#344154}
      .card-title{font-family:'Architects Daughter','Comic Sans MS',cursive;font-size:27px;fill:#101827}
      .body{font-family:'Comic Mono','Comic Sans MS',monospace;font-size:18px;fill:#364152}.small{font-family:'Comic Mono','Comic Sans MS',monospace;font-size:15px;fill:#475569}
      .layer{stroke-width:1.5;rx:22;ry:22}.card{fill:#fff;stroke:#cbd5e1;stroke-width:1.5;rx:18;ry:18}.line{fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
    </style>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 12 12" data-role="primary" data-tip-direction="positive-x"><path d="M1,1 L11,6 L1,11 Z" fill="#2563eb" stroke-dasharray="none" stroke="#2563eb" stroke-width="0"/></marker>
  </defs>
  <rect class="bg" width="1660" height="760"/>
  <text class="title" x="70" y="70">Spring Security Workshop Modules</text>
  <rect class="layer" x="70" y="125" width="1520" height="250" fill="#eff6ff" stroke="#bfdbfe"/>
  <text class="layer-title" x="105" y="170">Examples</text>
  <rect class="card" x="130" y="220" width="420" height="100"/>
  <text class="card-title" x="160" y="260">MVC hello</text>
  <text class="body" x="160" y="290">SecurityFilterChain + form login</text>
  <rect class="card" x="620" y="220" width="420" height="100"/>
  <text class="card-title" x="650" y="260">WebFlux hello</text>
  <text class="body" x="650" y="290">SecurityWebFilterChain + form login</text>
  <rect class="card" x="1110" y="220" width="420" height="100"/>
  <text class="card-title" x="1140" y="260">WebFlux JWT</text>
  <text class="body" x="1140" y="290">OAuth2 resource server</text>

  <rect class="layer" x="70" y="440" width="1520" height="190" fill="#f0fdf4" stroke="#bbf7d0"/>
  <text class="layer-title" x="105" y="485">Shared concepts</text>
  <rect class="card" x="235" y="525" width="360" height="60"/>
  <text class="body" x="265" y="562">In-memory user store</text>
  <rect class="card" x="650" y="525" width="360" height="60"/>
  <text class="body" x="680" y="562">Public vs protected routes</text>
  <rect class="card" x="1065" y="525" width="360" height="60"/>
  <text class="body" x="1095" y="562">Authentication entrypoint</text>

  <path class="line" d="M340 320 L340 525" stroke="#2563eb" marker-end="url(#arrow)" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="line" d="M830 320 L830 525" stroke="#2563eb" marker-end="url(#arrow)" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="line" d="M1320 320 L1320 525" stroke="#2563eb" marker-end="url(#arrow)" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
