<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1780" height="900" viewBox="0 0 1780 900" role="img" aria-label="Cache resilience architecture">
  <defs><filter id="shadow" x="-8%" y="-8%" width="116%" height="124%"><feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#64748B" flood-opacity="0.16"/></filter><marker id="arrowBlue" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 14 7 L 0 14 Z" fill="#2563EB" stroke-dasharray="none"/></marker><marker id="arrowRed" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 14 7 L 0 14 Z" fill="#DC2626" stroke-dasharray="none"/></marker><marker id="arrowGreen" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 14 7 L 0 14 Z" fill="#16A34A" stroke-dasharray="none"/></marker><style>.canvas{fill:#F8FAFC}.frame{fill:#FFFFFF;stroke:#D6E0E8;stroke-width:1.4}.layer{stroke-width:1.6;rx:22}.title{font-family:"Architects Daughter";font-size:40px;fill:#102033}.subtitle{font-family:"Comic Mono";font-size:16px;fill:#51606F}.layerTitle{font-family:"Architects Daughter";font-size:29px;fill:#243447}.cardTitle{font-family:"Architects Daughter";font-size:28px;fill:#102033}.cardText{font-family:"Comic Mono";font-size:15px;fill:#415166}.line{fill:none;stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round}</style></defs>
  <rect class="canvas" width="1780" height="900"/><rect class="frame" x="24" y="24" width="1732" height="852" rx="24"/>
  <text class="title" x="890" y="72" text-anchor="middle">Redis cache with Caffeine fallback</text>  <text class="subtitle" x="890" y="106" text-anchor="middle">ResilientProductService wraps Redis reads with Resilience4j and falls back to a short-lived local Caffeine cache when Redis is unhealthy.</text>
  <rect class="layer" x="84" y="154" width="1612" height="150" fill="#EFF6FF" stroke="#BFDBFE"/><text class="layerTitle" x="124" y="198">Service boundary</text>
  <g filter="url(#shadow)"><rect x="190" y="220" width="310" height="64" rx="14" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.7"/><text class="cardTitle" x="345" y="260" text-anchor="middle">API / tests</text></g>
  <g filter="url(#shadow)"><rect x="710" y="210" width="360" height="84" rx="14" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.7"/><text class="cardTitle" x="890" y="244" text-anchor="middle">ResilientProductService</text><text class="cardText" x="890" y="272" text-anchor="middle">get, put, evict product values</text></g>
  <g filter="url(#shadow)"><rect x="1280" y="220" width="310" height="64" rx="14" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.7"/><text class="cardTitle" x="1435" y="260" text-anchor="middle">Actuator health</text></g>
  <rect class="layer" x="84" y="364" width="1612" height="190" fill="#F0FDF4" stroke="#BBF7D0"/><text class="layerTitle" x="124" y="408">Resilience policy</text>
  <g filter="url(#shadow)"><rect x="180" y="450" width="340" height="76" rx="14" fill="#FFFFFF" stroke="#16A34A" stroke-width="1.7"/><text class="cardTitle" x="350" y="482" text-anchor="middle">SuspendDecorators</text><text class="cardText" x="350" y="508" text-anchor="middle">supplier + fallback chain</text></g>
  <g filter="url(#shadow)"><rect x="720" y="438" width="340" height="100" rx="14" fill="#FFFFFF" stroke="#16A34A" stroke-width="1.7"/><text class="cardTitle" x="890" y="470" text-anchor="middle">CircuitBreaker</text>  <text class="cardText" x="890" y="496" text-anchor="middle">redis-cache, 5-call window</text><text class="cardText" x="890" y="522" text-anchor="middle">OPEN waits 5 seconds</text></g>
  <g filter="url(#shadow)"><rect x="1260" y="450" width="340" height="76" rx="14" fill="#FFFFFF" stroke="#16A34A" stroke-width="1.7"/><text class="cardTitle" x="1430" y="482" text-anchor="middle">Caffeine fallback</text><text class="cardText" x="1430" y="508" text-anchor="middle">30-second local TTL</text></g>
  <rect class="layer" x="84" y="614" width="1612" height="150" fill="#FFF7ED" stroke="#FED7AA"/><text class="layerTitle" x="124" y="658">Runtime and chaos</text>
  <g filter="url(#shadow)"><rect x="190" y="690" width="330" height="58" rx="14" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.7"/>  <text class="cardTitle" x="355" y="727" text-anchor="middle">Redis</text></g>
  <g filter="url(#shadow)"><rect x="725" y="690" width="330" height="58" rx="14" fill="#FFFFFF" stroke="#DC2626" stroke-width="1.7"/>  <text class="cardTitle" x="890" y="727" text-anchor="middle">Toxiproxy</text></g>
  <g filter="url(#shadow)"><rect x="1260" y="690" width="330" height="58" rx="14" fill="#FFFFFF" stroke="#DC2626" stroke-width="1.7"/><text class="cardTitle" x="1425" y="727" text-anchor="middle">timeout toxic</text></g>
