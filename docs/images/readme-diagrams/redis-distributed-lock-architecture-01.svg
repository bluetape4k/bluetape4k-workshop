<svg xmlns="http://www.w3.org/2000/svg" width="960" height="580" viewBox="0 0 960 580" role="img" aria-label="Redis Distributed Lock Architecture">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#1f2937" flood-opacity="0.10"/></filter>
  <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth">
    <path d="M1,1 L8,4.5 L1,8 Z" fill="#758297"/>
  </marker>
  <style>
    .canvas{fill:#f7f9fc}.frame{fill:#fff;stroke:#d8e0ea;stroke-width:1.5}
    .title{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:38px;font-weight:400;fill:#102033}
    .subtitle{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:14px;font-weight:400;fill:#536273}
    .smallLabel{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:21px;font-weight:400;fill:#102033}
    .mono{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#102033}
    .small{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#536273}
    .card{stroke-width:2.1;filter:url(#shadow)}
    .line{stroke:#758297;stroke-width:2.1;fill:none;marker-end:url(#arrow)}
  </style>
</defs>
<!-- Layout:
     Canvas: 960×580  Frame: x=24 y=20 w=912 h=536
     Row1  y=98  h=80  4 cols (w=196 gap=40):
       Col1: x=24  cx=122  UnsafeInventoryService
       Col2: x=260 cx=358  LockedInventoryService
       Col3: x=496 cx=594  FencedInventoryService
       Col4: x=732 cx=830  SuspendingFencedInventoryService
     Row2  y=238 h=80  Col1: x=24 w=420 cx=234 (InventoryStore)
                        Col2: x=516 w=420 cx=726 (RedissonClient)
     Row3  y=378 h=80  Col1: x=24 w=420 cx=234 (RLock / RFencedLock)
                        Col2: x=516 w=420 cx=726 (FencedResources)
     Row4  y=518 h=38  Redis Testcontainers full width
-->
<rect class="canvas" width="960" height="580"/>
<rect class="frame" x="24" y="20" width="912" height="536" rx="28"/>
<text class="title" x="58" y="66">Distributed Lock Architecture</text>
<text class="subtitle" x="58" y="92">RLock · RFencedLock · InventoryStore · SuspendingFencedInventoryService · coroutine-safe</text>

<!-- Arrows: 4 services → InventoryStore + RedissonClient (bus y=198) -->
<path class="line" d="M122 178 L122 198 L234 198 L234 238"/>
<path class="line" d="M358 178 L358 198 L234 198 L234 238"/>
<path class="line" d="M594 178 L594 198 L726 198 L726 238"/>
<path class="line" d="M830 178 L830 198 L726 198 L726 238"/>
<!-- UnsafeInventoryService does not use RedissonClient — skip arrows 1&2 to RedissonClient -->
<!-- Arrows: InventoryStore → RLock/RFencedLock, RedissonClient → both cols -->
<path class="line" d="M234 318 L234 378"/>
<path class="line" d="M726 318 L726 378"/>
<!-- Row3 → Row4 (converge) -->
<path class="line" d="M234 458 L234 498 L480 498 L480 518"/>
<path class="line" d="M726 458 L726 498 L480 498 L480 518"/>

<!-- UnsafeInventoryService col1 -->
<g transform="translate(24,98)">
  <rect class="card" x="0" y="0" width="196" height="80" rx="12" fill="#FDECEF" stroke="#DC6B82"/>
  <text class="smallLabel" x="98" y="22" text-anchor="middle">UnsafeInventory</text>
  <text class="mono" x="98" y="44" text-anchor="middle">no lock</text>
  <text class="small" x="98" y="64" text-anchor="middle">race condition baseline</text>
</g>

<!-- LockedInventoryService col2 -->
<g transform="translate(260,98)">
  <rect class="card" x="0" y="0" width="196" height="80" rx="12" fill="#E8F3FF" stroke="#5B8DEF"/>
  <text class="smallLabel" x="98" y="22" text-anchor="middle">LockedInventory</text>
  <text class="mono" x="98" y="44" text-anchor="middle">RLock.tryLock()</text>
  <text class="small" x="98" y="64" text-anchor="middle">waitMs + leaseMs</text>
</g>

<!-- FencedInventoryService col3 -->
<g transform="translate(496,98)">
  <rect class="card" x="0" y="0" width="196" height="80" rx="12" fill="#FFF3D9" stroke="#D6A441"/>
  <text class="smallLabel" x="98" y="22" text-anchor="middle">FencedInventory</text>
  <text class="mono" x="98" y="44" text-anchor="middle">RFencedLock token</text>
  <text class="small" x="98" y="64" text-anchor="middle">tryLockAndGetToken()</text>
</g>

<!-- SuspendingFencedInventoryService col4 -->
<g transform="translate(732,98)">
  <rect class="card" x="0" y="0" width="196" height="80" rx="12" fill="#E9F7F6" stroke="#45A7A1"/>
  <text class="smallLabel" x="98" y="22" text-anchor="middle">SuspendFenced</text>
  <text class="mono" x="98" y="44" text-anchor="middle">getLockId() async</text>
  <text class="small" x="98" y="64" text-anchor="middle">NonCancellable unlock</text>
</g>

<!-- InventoryStore col1 -->
<g transform="translate(24,238)">
  <rect class="card" x="0" y="0" width="420" height="80" rx="12" fill="#F1ECFF" stroke="#8A72D6"/>
  <text class="smallLabel" x="210" y="22" text-anchor="middle">InventoryStore</text>
  <text class="mono" x="210" y="44" text-anchor="middle">ConcurrentHashMap · currentStock() · applyChange()</text>
  <text class="small" x="210" y="64" text-anchor="middle">shared in-memory state · race condition target</text>
</g>

<!-- RedissonClient col2 -->
<g transform="translate(516,238)">
  <rect class="card" x="0" y="0" width="420" height="80" rx="12" fill="#EAF7EF" stroke="#58A978"/>
  <text class="smallLabel" x="210" y="22" text-anchor="middle">RedissonClient</text>
  <text class="mono" x="210" y="44" text-anchor="middle">getLock() · getFencedLock() · getLockId()</text>
  <text class="small" x="210" y="64" text-anchor="middle">Snowflake lock identity · coroutine-safe API</text>
</g>

<!-- RLock/RFencedLock col1 -->
<g transform="translate(24,378)">
  <rect class="card" x="0" y="0" width="420" height="80" rx="12" fill="#E8F3FF" stroke="#5B8DEF"/>
  <text class="smallLabel" x="210" y="22" text-anchor="middle">RLock / RFencedLock</text>
  <text class="mono" x="210" y="44" text-anchor="middle">tryLock(wait, lease, MILLISECONDS)</text>
  <text class="small" x="210" y="64" text-anchor="middle">disable watchdog · isHeldByCurrentThread · unlock()</text>
</g>

<!-- FencedResources col2 -->
<g transform="translate(516,378)">
  <rect class="card" x="0" y="0" width="420" height="80" rx="12" fill="#FFF3D9" stroke="#D6A441"/>
  <text class="smallLabel" x="210" y="22" text-anchor="middle">FencedResources</text>
  <text class="mono" x="210" y="44" text-anchor="middle">forResource(id).apply(token) { ... }</text>
  <text class="small" x="210" y="64" text-anchor="middle">stale token → Rejected · monotone token guarantee</text>
</g>

<!-- Redis (full width bottom) -->
<g transform="translate(24,518)">
  <rect class="card" x="0" y="0" width="912" height="38" rx="12" fill="#E9F7F6" stroke="#45A7A1"/>
  <text class="smallLabel" x="456" y="16" text-anchor="middle">Redis · Testcontainers</text>
  <text class="small" x="456" y="32" text-anchor="middle">Redisson client · lock storage · Testcontainers singleton</text>
</g>
</svg>
