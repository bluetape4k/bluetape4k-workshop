<svg xmlns="http://www.w3.org/2000/svg" width="2196" height="1040" viewBox="0 0 2196 1040">
  <defs>
    <style>
      .bg{fill:#f8fafc}.title{font-family:'Architects Daughter','Comic Sans MS',cursive;font-size:34px;fill:#18212f}
      .layer-title{font-family:'Architects Daughter','Comic Sans MS',cursive;font-size:26px;fill:#344154}
      .card-title{font-family:'Architects Daughter','Comic Sans MS',cursive;font-size:27px;fill:#101827}
      .body{font-family:'Comic Mono','Comic Sans MS',monospace;font-size:18px;fill:#364152}.small{font-family:'Comic Mono','Comic Sans MS',monospace;font-size:15px;fill:#475569}
      .layer{stroke-width:1.5;rx:22;ry:22}.card{fill:#fff;stroke:#cbd5e1;stroke-width:1.5;rx:18;ry:18}
      .line{fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
    </style>
    <marker id="arrow-blue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L11,6 L1,11 Z" fill="#2563eb" stroke-dasharray="none"/></marker>
    <marker id="arrow-green" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L11,6 L1,11 Z" fill="#059669" stroke-dasharray="none"/></marker>
    <marker id="arrow-purple" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L11,6 L1,11 Z" fill="#7c3aed" stroke-dasharray="none"/></marker>
  </defs>
  <rect class="bg" width="2196" height="1040"/>
  <text class="title" x="85.4" y="70">WebFlux + Exposed R2DBC Users API</text>

  <rect class="layer" x="85.4" y="120" width="2025.2" height="225" fill="#eff6ff" stroke="#bfdbfe"/>
  <text class="layer-title" x="128.1" y="165">HTTP entrypoints</text>
  <rect class="card" x="256.2" y="205" width="573.4" height="100"/>
  <text class="card-title" x="292.8" y="245">UserController</text>
  <text class="body" x="292.8" y="276">Annotation routes under /api/users</text>
  <rect class="card" x="1366.4" y="205" width="573.4" height="100"/>
  <text class="card-title" x="1403" y="245">coRouter + UserHandler</text>
  <text class="body" x="1403" y="276">Functional routes under /users</text>

  <rect class="layer" x="85.4" y="395" width="2025.2" height="205" fill="#f0fdf4" stroke="#bbf7d0"/>
  <text class="layer-title" x="128.1" y="440">Coroutine service boundary</text>
  <rect class="card" x="732" y="475" width="732" height="85"/>
  <text class="card-title" x="768.6" y="515">UserService</text>
  <text class="body" x="768.6" y="545">suspendTransaction + user use cases</text>

  <rect class="layer" x="85.4" y="650" width="2025.2" height="160" fill="#faf5ff" stroke="#ddd6fe"/>
  <text class="layer-title" x="128.1" y="695">Exposed R2DBC repository</text>
  <rect class="card" x="732" y="715" width="732" height="70"/>
  <text class="card-title" x="768.6" y="758">UserExposedRepository</text>
  <text class="small" x="1171.2" y="758">R2dbcRepository&lt;Int, UserRecord&gt;</text>

  <rect class="layer" x="85.4" y="860" width="2025.2" height="120" fill="#fefce8" stroke="#fde68a"/>
  <text class="layer-title" x="128.1" y="910">Runtime</text>
  <rect class="card" x="445.3" y="910" width="463.6" height="50"/>
  <text class="body" x="481.9" y="942">ConnectionPool + R2dbcDatabase</text>
  <g transform="translate(1354.2 895)">
    <rect x="0" y="0" width="353.8" height="98" rx="14" fill="#FFFAF2" stroke="#8C6F33" stroke-width="2.44"/>
    <image data-bluetape4k-icon="database" data-source="docs/icons/generic/database-server.svg" x="21.96" y="31" width="38" height="38" href="data:image/svg+xml;base64," preserveAspectRatio="xMidYMid meet"/>
    <text class="card-title" x="100.04" y="50" text-anchor="start">H2 R2DBC</text>
  </g>

  <path class="line" d="M 542.9 305 L 542.9 350 Q 542.9 361 555.1 361 L 1012.6 361 Q 1024.8 361 1024.8 370 L 1024.8 475" stroke="#2563eb" marker-end="url(#arrow-blue)" stroke-linecap="round" stroke-linejoin="round"/>
