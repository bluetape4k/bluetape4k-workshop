  <path class="line" d="M 1098 560 L 1098 715" stroke="#059669" marker-end="url(#arrow-green)" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="line" d="M 1098 785 L 1098 825 Q 1098 835 1085.8 835 L 689.3 835 Q 677.1 835 677.1 845 L 677.1 910" stroke="#7c3aed" marker-end="url(#arrow-purple)" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="line" d="M 908.9 935 L 1354.2 935" stroke="#7c3aed" marker-end="url(#arrow-purple)" stroke-linecap="round" stroke-linejoin="round"/>
