<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1620" height="760" viewBox="0 0 1620 760" role="img" aria-label="Redis cache lookup flow">
  <defs><filter id="shadow" x="-8%" y="-8%" width="116%" height="124%"><feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#64748B" flood-opacity="0.15"/></filter><marker id="arrowBlue" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 14 7 L 0 14 Z" fill="#2563EB" stroke-dasharray="none"/></marker><marker id="arrowRed" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 14 7 L 0 14 Z" fill="#DC2626" stroke-dasharray="none"/></marker><style>.canvas{fill:#F8FAFC}.frame{fill:#FFFFFF;stroke:#D6E0E8;stroke-width:1.4}.title{font-family:"Architects Daughter";font-size:38px;fill:#102033}.subtitle{font-family:"Comic Mono";font-size:15px;fill:#51606F}.cardTitle{font-family:"Architects Daughter";font-size:27px;fill:#102033}.cardText{font-family:"Comic Mono";font-size:15px;fill:#415166}.line{fill:none;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round}.msg{font-family:"Comic Mono";font-size:15px;fill:#334155}</style></defs>
  <rect class="canvas" width="1620" height="760"/><rect class="frame" x="24" y="24" width="1572" height="712" rx="24"/>
  <text class="title" x="810" y="72" text-anchor="middle">Redis cache lookup and eviction flow</text>  <text class="subtitle" x="810" y="104" text-anchor="middle">@Cacheable stores binary LZ4Kryo payloads in Redis; tests verify slow first load, fast Redis hit, and eviction.</text>
  <g filter="url(#shadow)"><rect x="70" y="170" width="230" height="78" rx="14" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.7"/><text class="cardTitle" x="185" y="204" text-anchor="middle">Test caller</text><text class="cardText" x="185" y="230" text-anchor="middle">findByCode(KR)</text></g>
  <g filter="url(#shadow)"><rect x="410" y="170" width="280" height="78" rx="14" fill="#F0FDF4" stroke="#16A34A" stroke-width="1.7"/><text class="cardTitle" x="550" y="204" text-anchor="middle">CountryRepository</text><text class="cardText" x="550" y="230" text-anchor="middle">@Cacheable country:code</text></g>
  <g filter="url(#shadow)"><rect x="810" y="170" width="300" height="78" rx="14" fill="#FFF7ED" stroke="#EA580C" stroke-width="1.7"/><text class="cardTitle" x="960" y="204" text-anchor="middle">Redis CacheManager</text><text class="cardText" x="960" y="230" text-anchor="middle">TTL 1 day</text></g>
  <g filter="url(#shadow)"><rect x="1230" y="170" width="300" height="78" rx="14" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.7"/><rect x="1272" y="194" width="26" height="26" rx="4" fill="#DC2626" transform="rotate(-12 1285 207)"/><rect x="1294" y="189" width="26" height="26" rx="4" fill="#EF4444" transform="rotate(-12 1307 202)"/><rect x="1288" y="215" width="26" height="26" rx="4" fill="#B91C1C" transform="rotate(-12 1301 228)"/>  <text class="cardTitle" x="1400" y="204" text-anchor="middle">Redis</text><text class="cardText" x="1400" y="230" text-anchor="middle">LZ4Kryo value</text></g>
  <path class="line" d="M 185 322 L 550 322" stroke="#2563EB" marker-end="url(#arrowBlue)" stroke-linecap="round" stroke-linejoin="round"/><text class="msg" x="368" y="306" text-anchor="middle">1. first lookup</text>
  <path class="line" d="M 550 402 L 960 402" stroke="#2563EB" marker-end="url(#arrowBlue)" stroke-linecap="round" stroke-linejoin="round"/><text class="msg" x="755" y="386" text-anchor="middle">2. cache miss, invoke method</text>
  <path class="line" d="M 960 482 L 1400 482" stroke="#DC2626" marker-end="url(#arrowRed)" stroke-linecap="round" stroke-linejoin="round"/>  <text class="msg" x="1180" y="466" text-anchor="middle">3. serialize and store in Redis</text>
  <path class="line" d="M 1400 562 L 550 562" stroke="#DC2626" marker-end="url(#arrowRed)" stroke-linecap="round" stroke-linejoin="round"/>  <text class="msg" x="975" y="546" text-anchor="middle">4. next lookup is served by Redis</text>
  <path class="line" d="M 550 642 L 1400 642" stroke="#2563EB" marker-end="url(#arrowBlue)" stroke-linecap="round" stroke-linejoin="round"/>  <text class="msg" x="975" y="626" text-anchor="middle">5. evictCache(code) deletes Redis key</text>
</svg>
