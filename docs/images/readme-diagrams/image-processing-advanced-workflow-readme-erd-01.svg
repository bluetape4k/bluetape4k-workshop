<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="2025.2" height="960" viewBox="0 0 2025.2 960" role="img" aria-label="image-processing advanced workflow persistence ERD">
  <defs>
    <marker id="fkArrow" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" viewBox="0 0 14.2333 11.6667" refX="9" refY="5" orient="auto" data-role="primary" data-tip-direction="positive-x">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#667F8C" stroke-dasharray="none" stroke-linecap="round" stroke-linejoin="round" stroke="#667F8C" stroke-width="0"/>
    </marker>
    <style>
      svg { background: #F8FAFC; }
      .frame { fill: #FFFFFF; stroke: #D9E5EC; stroke-width: 2; }
      .title { font-family: "Architects Daughter"; font-size: 42px; fill: #152437; }
      .subtitle, .footer { font-family: "Comic Mono"; fill: #405260; }
      .subtitle { font-size: 17px; }
      .footer { font-size: 14px; fill: #617684; }
      .table { fill: #FFFFFF; stroke: #78909C; stroke-width: 2.4; }
      .assets { stroke: #6F9FC5; }
      .objects { stroke: #72A57F; }
      .jobs { stroke: #B8944F; }
      .events { stroke: #C98272; }
      .assetHeader { fill: #EEF7FF; }
      .objectHeader { fill: #EEFAF1; }
      .jobHeader { fill: #FFF7E8; }
      .eventHeader { fill: #FFF1EF; }
      .tableName { font-family: "Architects Daughter"; font-size: 28px; fill: #152437; }
      .col { font-family: "Comic Mono"; font-size: 17px; fill: #344955; }
      .type { font-family: "Comic Mono"; font-size: 16px; fill: #657783; }
      .pk { fill: #FFF8DC; stroke: #C9A33A; stroke-width: 1.4; }
      .fk { fill: #EDF7FF; stroke: #73A7CF; stroke-width: 1.4; }
      .rel { fill: none; stroke: #667F8C; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#fkArrow); }
      .labelBox { fill: #FFFFFF; stroke: #D7E0E4; stroke-width: 1.3; }
      .relLabel { font-family: "Comic Mono"; font-size: 14px; fill: #536975; }
    </style>
  </defs>
  <rect class="frame" x="36.6" y="28" width="1952" height="904" rx="18"/>
  <text class="title" x="1012.6" y="82" text-anchor="middle">Image Processing Persistence ERD</text>
  <text class="subtitle" x="1012.6" y="114" text-anchor="middle">Assets deduplicate by checksum; jobs record runs; events record step history; objects store original and variant URLs.</text>

  <g id="assets">
    <rect class="table assets" x="117.12" y="172" width="561.2" height="434" rx="10"/>
    <rect class="assetHeader" x="117.12" y="172" width="561.2" height="58" rx="10"/>
    <text class="tableName" x="397.72" y="210" text-anchor="middle">image_assets</text>
    <rect class="pk" x="151.28" y="254" width="61" height="24" rx="12"/><text class="col" x="234.24" y="273">id</text><text class="type" x="578.28" y="273" text-anchor="end">BIGSERIAL PK</text>
    <text class="col" x="234.24" y="311">external_id</text><text class="type" x="578.28" y="311" text-anchor="end">VARCHAR(36) UQ</text>
    <text class="col" x="234.24" y="349">original_filename</text><text class="type" x="578.28" y="349" text-anchor="end">VARCHAR(255)?</text>
    <text class="col" x="234.24" y="387">content_type</text><text class="type" x="578.28" y="387" text-anchor="end">VARCHAR(100)?</text>
    <text class="col" x="234.24" y="425">byte_size</text><text class="type" x="578.28" y="425" text-anchor="end">BIGINT?</text>
    <text class="col" x="234.24" y="463">width, height</text><text class="type" x="578.28" y="463" text-anchor="end">INTEGER?</text>
    <text class="col" x="234.24" y="501">checksum</text><text class="type" x="578.28" y="501" text-anchor="end">VARCHAR(64) UQ</text>
    <text class="col" x="234.24" y="539">status</text><text class="type" x="578.28" y="539" text-anchor="end">PROCESSING READY FAILED</text>
    <text class="col" x="234.24" y="577">audit columns</text><text class="type" x="578.28" y="577" text-anchor="end">created and updated</text>
  </g>

  <g id="objects">
    <rect class="table objects" x="880.84" y="154" width="561.2" height="394" rx="10"/>
    <rect class="objectHeader" x="880.84" y="154" width="561.2" height="58" rx="10"/>
    <text class="tableName" x="1161.44" y="192" text-anchor="middle">image_objects</text>
    <rect class="pk" x="915" y="236" width="61" height="24" rx="12"/><text class="col" x="997.96" y="255">id</text><text class="type" x="1342" y="255" text-anchor="end">BIGSERIAL PK</text>
    <rect class="fk" x="915" y="274" width="61" height="24" rx="12"/><text class="col" x="997.96" y="293">image_asset_id</text><text class="type" x="1342" y="293" text-anchor="end">FK assets.id</text>
    <text class="col" x="997.96" y="331">kind</text><text class="type" x="1342" y="331" text-anchor="end">ORIGINAL VARIANT</text>
    <text class="col" x="997.96" y="369">variant_name</text><text class="type" x="1342" y="369" text-anchor="end">VARCHAR(100)?</text>
    <text class="col" x="997.96" y="407">s3_key</text><text class="type" x="1342" y="407" text-anchor="end">VARCHAR(512)</text>
    <text class="col" x="997.96" y="445">public_url</text><text class="type" x="1342" y="445" text-anchor="end">TEXT</text>
    <text class="col" x="997.96" y="483">width, height</text><text class="type" x="1342" y="483" text-anchor="end">INTEGER?</text>
    <text class="col" x="997.96" y="521">byte_size, format</text><text class="type" x="1342" y="521" text-anchor="end">BIGINT?, VARCHAR?</text>
  </g>

  <g id="jobs">
    <rect class="table jobs" x="880.84" y="614" width="561.2" height="280" rx="10"/>
    <rect class="jobHeader" x="880.84" y="614" width="561.2" height="58" rx="10"/>
    <text class="tableName" x="1161.44" y="652" text-anchor="middle">image_processing_jobs</text>
    <rect class="pk" x="915" y="696" width="61" height="24" rx="12"/><text class="col" x="997.96" y="715">id</text><text class="type" x="1342" y="715" text-anchor="end">BIGSERIAL PK</text>
    <rect class="fk" x="915" y="734" width="61" height="24" rx="12"/><text class="col" x="997.96" y="753">image_asset_id</text><text class="type" x="1342" y="753" text-anchor="end">FK assets.id</text>
    <text class="col" x="997.96" y="791">status</text><text class="type" x="1342" y="791" text-anchor="end">RUNNING SUCCEEDED FAILED</text>
    <text class="col" x="997.96" y="829">requested_variants</text><text class="type" x="1342" y="829" text-anchor="end">JSONB list</text>
    <text class="col" x="997.96" y="867">timing and error</text><text class="type" x="1342" y="867" text-anchor="end">started, finished, duration</text>
  </g>

  <g id="events">
    <rect class="table events" x="1561.6" y="614" width="366" height="280" rx="10"/>
    <rect class="eventHeader" x="1561.6" y="614" width="366" height="58" rx="10"/>
    <text class="tableName" x="1744.6" y="652" text-anchor="middle">image_processing_events</text>
    <rect class="pk" x="1588.44" y="696" width="61" height="24" rx="12"/><text class="col" x="1664.08" y="715">id</text>
    <rect class="fk" x="1588.44" y="734" width="61" height="24" rx="12"/><text class="col" x="1664.08" y="753">job_id</text>
    <text class="col" x="1664.08" y="791">step</text><text class="type" x="1886.12" y="791" text-anchor="end">VALIDATION...</text>
    <text class="col" x="1664.08" y="829">status</text><text class="type" x="1886.12" y="829" text-anchor="end">COMPLETED FAILED</text>
    <text class="col" x="1664.08" y="867">message, payload</text><text class="type" x="1886.12" y="867" text-anchor="end">TEXT?, JSONB?</text>
  </g>

  <path class="rel" d="M 678.32 294 H 880.84" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#fkArrow)"/>
  <path class="rel" d="M 678.32 754 H 880.84" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#fkArrow)"/>
  <path class="rel" d="M 1442.04 754 H 1561.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#fkArrow)"/>
  <rect class="labelBox" x="727.12" y="248" width="112.24" height="28" rx="14"/>
  <text class="relLabel" x="783.24" y="267" text-anchor="middle">1 asset</text>
  <rect class="labelBox" x="753.96" y="326" width="148.84" height="28" rx="14"/>
  <text class="relLabel" x="828.38" y="345" text-anchor="middle">many objects</text>
  <rect class="labelBox" x="727.12" y="708" width="112.24" height="28" rx="14"/>
  <text class="relLabel" x="783.24" y="727" text-anchor="middle">1 asset</text>
  <rect class="labelBox" x="753.96" y="786" width="126.88" height="28" rx="14"/>
  <text class="relLabel" x="817.4" y="805" text-anchor="middle">many jobs</text>
  <rect class="labelBox" x="1468.88" y="708" width="95.16" height="28" rx="14"/>
  <text class="relLabel" x="1516.46" y="727" text-anchor="middle">1 job</text>
  <rect class="labelBox" x="1461.56" y="786" width="119.56" height="28" rx="14"/>
  <text class="relLabel" x="1521.34" y="805" text-anchor="middle">many events</text>
  <text class="footer" x="1012.6" y="922" text-anchor="middle">`image_objects` uses a DB-created partial unique constraint for one original and one row per variant name.</text>
</svg>
