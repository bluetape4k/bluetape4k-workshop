<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="802" viewBox="0 0 1680 802" role="img" aria-labelledby="title desc">
  <title id="title">Module Event Publication Sequence</title>
  <desc id="desc">The before path couples modules directly; the after path publishes a durable application event.</desc>
  <defs>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="124%"><feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#64748B" flood-opacity="0.14"/></filter>
    <style>
      .title{font-family:"Architects Daughter";font-size:40px;fill:#263238}.subtitle,.msg,.footer{font-family:"Comic Mono";fill:#36464F}.subtitle{font-size:17px}.participant{font-family:"Architects Daughter";font-size:21px;fill:#1F3138}.role{font-family:"Comic Mono";font-size:13px;fill:#546A73}.msg{font-size:14px}.footer{font-size:14px;fill:#60727D}.frame{fill:#FBFCF8;stroke:#41545D;stroke-width:3}.header{fill:#FFFFFF;stroke:#546E7A;stroke-width:2}.lifeline{stroke:#9AAAB1;stroke-width:2;stroke-dasharray:7 8;stroke-linecap:round}.call,.work,.return,.skip{fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.call{stroke:#3F7D9C;marker-end:url(#arrow-call)}.work{stroke:#6E8F4F;marker-end:url(#arrow-work)}.return{stroke:#9B7D54;stroke-width:2.6;stroke-dasharray:8 6;marker-end:url(#arrow-ret)}.skip{stroke:#B86868;marker-end:url(#arrow-skip)}.label{fill:#FFFFFF;stroke:#D7E0E4;stroke-width:1.5}.callLabel{stroke:#9CC2D1}.workLabel{stroke:#B6C9A4}.returnLabel{stroke:#C8B38F}.skipLabel{stroke:#D9ABAB}.badge{stroke-width:1.8}.callBadge{fill:#EAF4F8;stroke:#3F7D9C}.workBadge{fill:#EEF7F0;stroke:#6E8F4F}.returnBadge{fill:#FFF7E8;stroke:#9B7D54}.skipBadge{fill:#FFF0F0;stroke:#B86868}.badgeText{font-family:"Comic Mono";font-size:12px;font-weight:700}.callText,.badgeText.callText{fill:#2F6F8E}.workText,.badgeText.workText{fill:#55783F}.returnText,.badgeText.returnText{fill:#7F6038}.skipText,.badgeText.skipText{fill:#9D4F4F}.alt{fill:#FFF7ED;fill-opacity:.38;stroke:#D08A39;stroke-width:2.2;stroke-dasharray:12 8}.divider{stroke:#D08A39;stroke-width:1.8;stroke-dasharray:9 7;opacity:.7}
    </style>
    <marker id="arrow-call" viewBox="0 0 10 10" markerWidth="13" markerHeight="13" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#3F7D9C" stroke-dasharray="none"/></marker>
    <marker id="arrow-work" viewBox="0 0 10 10" markerWidth="13" markerHeight="13" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#6E8F4F" stroke-dasharray="none"/></marker>
    <marker id="arrow-ret" viewBox="0 0 10 10" markerWidth="13" markerHeight="13" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#9B7D54" stroke-dasharray="none"/></marker>
    <marker id="arrow-skip" viewBox="0 0 10 10" markerWidth="13" markerHeight="13" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#B86868" stroke-dasharray="none"/></marker>
  </defs>
  <rect x="24" y="24" width="1632" height="754" rx="20" class="frame"/>
  <text x="840.0" y="76" text-anchor="middle" class="title">Module Event Publication Sequence</text>
  <text x="840.0" y="106" text-anchor="middle" class="subtitle">The before path couples modules directly; the after path publishes a durable application event.</text>
  <rect x="88" y="250" width="1504" height="180" rx="16" class="alt"/>
  <line x1="88" y1="340" x2="1592" y2="340" class="divider"/>
  <rect x="88" y="430" width="1504" height="260" rx="16" class="alt"/>
  <g filter="url(#shadow)"><rect x="55.0" y="154" width="250" height="74" rx="10" class="header"/>
    <text x="180.0" y="183" text-anchor="middle" class="participant">Order Module</text>
    <text x="180.0" y="208" text-anchor="middle" class="role">command owner</text></g>
  <line x1="180.0" y1="228" x2="180.0" y2="690" class="lifeline"/>
  <g filter="url(#shadow)"><rect x="495.0" y="154" width="250" height="74" rx="10" class="header"/>
    <text x="620.0" y="183" text-anchor="middle" class="participant">Direct Payment</text>
    <text x="620.0" y="208" text-anchor="middle" class="role">before coupling</text></g>
  <line x1="620.0" y1="228" x2="620.0" y2="690" class="lifeline"/>
  <g filter="url(#shadow)"><rect x="935.0" y="154" width="250" height="74" rx="10" class="header"/>
    <text x="1060.0" y="183" text-anchor="middle" class="participant">Event Registry</text>
    <text x="1060.0" y="208" text-anchor="middle" class="role">publication log</text></g>
  <line x1="1060.0" y1="228" x2="1060.0" y2="690" class="lifeline"/>
  <g filter="url(#shadow)"><rect x="1375.0" y="154" width="250" height="74" rx="10" class="header"/>
    <text x="1500.0" y="183" text-anchor="middle" class="participant">Payment Module</text>
    <text x="1500.0" y="208" text-anchor="middle" class="role">event listener</text></g>
  <line x1="1500.0" y1="228" x2="1500.0" y2="690" class="lifeline"/>
  <rect x="202.3" y="274" width="395.4" height="34" rx="17" class="label skipLabel"/>
  <circle cx="226.3" cy="291" r="13" class="badge skipBadge"/><text x="226.3" y="296" text-anchor="middle" class="badgeText skipText">1</text>
  <text x="250.3" y="296" class="msg skipText">before: call payment service directly</text>
  <path d="M 180.0 322 L 620.0 322" class="skip"/>
  <rect x="247.4" y="350" width="305.2" height="34" rx="17" class="label returnLabel"/>
  <circle cx="271.4" cy="367" r="13" class="badge returnBadge"/><text x="271.4" y="372" text-anchor="middle" class="badgeText returnText">2</text>
  <text x="295.4" y="372" class="msg returnText">synchronous payment result</text>
  <path d="M 620.0 398 L 180.0 398" class="return"/>
  <rect x="455.1" y="454" width="329.8" height="34" rx="17" class="label callLabel"/>
  <circle cx="479.1" cy="471" r="13" class="badge callBadge"/><text x="479.1" y="476" text-anchor="middle" class="badgeText callText">3</text>
  <text x="503.1" y="476" class="msg callText">after: publish OrderCompleted</text>
  <path d="M 180.0 502 L 1060.0 502" class="call"/>
  <rect x="1147.9" y="530" width="264.2" height="34" rx="17" class="label workLabel"/>
  <circle cx="1171.9" cy="547" r="13" class="badge workBadge"/><text x="1171.9" y="552" text-anchor="middle" class="badgeText workText">4</text>
  <text x="1195.9" y="552" class="msg workText">deliver durable event</text>
  <path d="M 1060.0 578 L 1500.0 578" class="work"/>
  <rect x="1131.5" y="606" width="297.0" height="34" rx="17" class="label returnLabel"/>
  <circle cx="1155.5" cy="623" r="13" class="badge returnBadge"/><text x="1155.5" y="628" text-anchor="middle" class="badgeText returnText">5</text>
  <text x="1179.5" y="628" class="msg returnText">mark publication complete</text>
  <path d="M 1500.0 654 L 1060.0 654" class="return"/>
  <rect x="90" y="720" width="1500" height="38" rx="12" fill="#FFFFFF" stroke="#CCD7DA" stroke-width="2"/>
  <text x="840.0" y="745" text-anchor="middle" class="footer">Reader contract: ordered calls, branch boundaries, and infrastructure touchpoints stay visible without label overlap.</text>
</svg>
