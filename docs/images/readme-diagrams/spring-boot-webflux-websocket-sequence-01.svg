<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-label="WebFlux WebSocket connection/message sequence">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#1f2937" flood-opacity="0.10"/></filter>
  <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth">
    <path d="M1,1 L8,4.5 L1,8 Z" fill="#758297"/>
  </marker>
  <style>
    .canvas{fill:#f7f9fc}.frame{fill:#fff;stroke:#d8e0ea;stroke-width:1.5}
    .title{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:38px;font-weight:400;fill:#102033}
    .subtitle{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:14px;font-weight:400;fill:#536273}
    .smallLabel{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:21px;font-weight:400;fill:#102033}
    .mono{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#102033}
    .small{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#536273}
    .card{stroke-width:2.1;filter:url(#shadow)}
    .lifeline{stroke:#b0bbca;stroke-width:1.5;stroke-dasharray:6 4;fill:none}
    .reqArrow{stroke:#5B8DEF;stroke-width:2.1;fill:none;marker-end:url(#arrow)}
    .rspArrow{stroke:#45A7A1;stroke-width:2.1;stroke-dasharray:7 4;fill:none;marker-end:url(#arrow)}
    .msgLabel{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:13px;fill:#102033}
  </style>
</defs>
<rect class="canvas" width="960" height="520"/>
<rect class="frame" x="24" y="20" width="912" height="480" rx="22"/>

<!-- Title -->
<text class="title" x="48" y="66">WebFlux WebSocket Flow</text>
<text class="subtitle" x="52" y="88">Netty → ReactiveWebSocketHandler → QuoteGenerator → Flux&lt;Quote&gt; streaming</text>

<!-- Participants cx: 90, 260, 460, 680, 870 -->
<!-- Browser/Client -->
<g transform="translate(34,104)">
  <rect class="card" x="0" y="0" width="112" height="68" rx="12" fill="#E8F3FF" stroke="#5B8DEF"/>
  <text class="smallLabel" x="56" y="28" text-anchor="middle">Browser</text>
  <text class="smallLabel" x="56" y="52" text-anchor="middle">Client</text>
</g>
<!-- Netty (via Router) -->
<g transform="translate(200,104)">
  <rect class="card" x="0" y="0" width="120" height="68" rx="12" fill="#EAF7EF" stroke="#58A978"/>
  <text class="smallLabel" x="60" y="24" text-anchor="middle">Netty +</text>
  <text class="smallLabel" x="60" y="48" text-anchor="middle">Router</text>
  <text class="small" x="60" y="66" text-anchor="middle">/websocket</text>
</g>
<!-- ReactiveWebSocketConfig -->
<g transform="translate(396,104)">
  <rect class="card" x="0" y="0" width="140" height="68" rx="12" fill="#F1ECFF" stroke="#8A72D6"/>
  <text class="smallLabel" x="70" y="24" text-anchor="middle">Reactive</text>
  <text class="smallLabel" x="70" y="48" text-anchor="middle">WS Config</text>
  <text class="small" x="70" y="66" text-anchor="middle">HandlerMapping</text>
</g>
<!-- ReactiveWebSocketHandler -->
<g transform="translate(610,104)">
  <rect class="card" x="0" y="0" width="140" height="68" rx="12" fill="#FFF3D9" stroke="#D6A441"/>
  <text class="smallLabel" x="70" y="24" text-anchor="middle">Reactive WS</text>
  <text class="smallLabel" x="70" y="48" text-anchor="middle">Handler</text>
  <text class="small" x="70" y="66" text-anchor="middle">handle(session)</text>
</g>
<!-- QuoteGenerator -->
<g transform="translate(808,104)">
  <rect class="card" x="0" y="0" width="128" height="68" rx="12" fill="#FDECEF" stroke="#DC6B82"/>
  <text class="smallLabel" x="64" y="28" text-anchor="middle">Quote</text>
  <text class="smallLabel" x="64" y="52" text-anchor="middle">Generator</text>
  <text class="small" x="64" y="68" text-anchor="middle">Flux&lt;Quote&gt;</text>
</g>

<!-- Lifelines cx: 90, 260, 466, 680, 872 -->
<line class="lifeline" x1="90" y1="172" x2="90" y2="490"/>
<line class="lifeline" x1="260" y1="172" x2="260" y2="490"/>
<line class="lifeline" x1="466" y1="172" x2="466" y2="490"/>
<line class="lifeline" x1="680" y1="172" x2="680" y2="490"/>
<line class="lifeline" x1="872" y1="172" x2="872" y2="490"/>

<!-- Step 1: WS Upgrade request -->
<text class="msgLabel" x="48" y="206">1. WebSocket Upgrade (HTTP → WS)</text>
<path class="reqArrow" d="M90,210 L252,210"/>

<!-- Step 2: Router → ReactiveWebSocketConfiguration -->
<text class="msgLabel" x="272" y="242">2. SampleWebfluxRouter: route /websocket</text>
<path class="reqArrow" d="M260,246 L458,246"/>

<!-- Step 3: Config → Handler: handle(session) -->
<text class="msgLabel" x="478" y="278">3. handle(WebSocketSession)</text>
<path class="reqArrow" d="M466,282 L672,282"/>

<!-- Step 4: Handler → QuoteGenerator: fetchQuoteStringAsFlux -->
<text class="msgLabel" x="692" y="314">4. fetchQuoteStringAsFlux(2s)</text>
<path class="reqArrow" d="M680,318 L864,318"/>

<!-- Step 5: QuoteGenerator returns Flux<Quote> -->
<text class="msgLabel" x="692" y="350">5. Flux&lt;Quote&gt;</text>
<path class="rspArrow" d="M864,354 L688,354"/>

<!-- Step 6: Loop - stream messages to client -->
<rect x="48" y="368" width="900" height="54" rx="8" fill="#F1ECFF" stroke="#8A72D6" stroke-width="1.5"/>
<text class="mono" x="60" y="386" fill="#8A72D6">LOOP: every 2s</text>
<text class="msgLabel" x="692" y="406">6. Quote emitted from Flux</text>
<path class="rspArrow" d="M680,412 L98,412"/>

<!-- Step 7: client can also send text -->
<text class="msgLabel" x="48" y="446">7. client sends text frame (session.receive)</text>
<path class="reqArrow" d="M90,450 L672,450"/>

<!-- Step 8: Connection close -->
<text class="msgLabel" x="48" y="482">8. WebSocket CLOSE (Mono&lt;Void&gt; complete)</text>
<path class="rspArrow" d="M260,486 L98,486"/>
</svg>
