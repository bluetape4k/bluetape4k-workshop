<svg xmlns="http://www.w3.org/2000/svg" width="1171.2" height="520" viewBox="0 0 1171.2 520" role="img" aria-label="Spring Cloud Gateway Architecture">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#1f2937" flood-opacity="0.09"/></filter>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 10 10" data-role="secondary" data-tip-direction="positive-x">
    <path d="M1,1 L8,4.5 L1,8 Z" fill="#758297" stroke-dasharray="none"/>
  </marker>
  <style>
    .canvas{fill:#f7f9fc}.frame{fill:#fff;stroke:#d8e0ea;stroke-width:1.5}
    .title{font-family:"Architects Daughter";font-size:38px;font-weight:400;fill:#102033}
    .subtitle{font-family:"Comic Mono";font-size:14px;font-weight:400;fill:#536273}
    .smallLabel{font-family:"Architects Daughter";font-size:21px;font-weight:400;fill:#102033}
    .mono{font-family:"Comic Mono";font-size:12px;font-weight:400;fill:#102033}
    .small{font-family:"Comic Mono";font-size:12px;font-weight:400;fill:#536273}
    .card{stroke-width:2.1;filter:url(#shadow)}
    .line{stroke:#758297;stroke-width:2.1;fill:none;marker-end:url(#arrow);stroke-linecap:round;stroke-linejoin:round}
  </style>
</defs>
<rect class="canvas" width="1171.2" height="520"/>
<rect class="frame" x="29.28" y="20" width="1112.64" height="476" rx="20"/>

<!-- Title -->
<text class="title" x="58.56" y="66">Spring Cloud Gateway Architecture</text>
<text class="subtitle" x="58.56" y="90">GatewayApplication  -  RateLimiter  -  CircuitBreaker  -  Redis  -  Resilience4j</text>

<!-- Row 1: Client HTTP Request -->
<rect class="card" x="402.6" y="108" width="366" height="56" rx="14" fill="#E8F3FF" stroke="#5B8DEF"/>
<text class="smallLabel" x="585.6" y="132" text-anchor="middle">Client HTTP Request</text>
<text class="small" x="585.6" y="152" text-anchor="middle">GatewayApplication  -  /api/** routes</text>

<!-- Row 2: 3 filters -->
<!-- RateLimiter -->
<rect class="card" x="43.92" y="208" width="312.32" height="76" rx="14" fill="#EAF7EF" stroke="#58A978"/>
<text class="smallLabel" x="200.08" y="234" text-anchor="middle">RateLimiter Filter</text>
<text class="small" x="200.08" y="254" text-anchor="middle">RequestRateLimiter</text>  <text class="small" x="200.08" y="271" text-anchor="middle">UserKeyResolver  -  Redis backend</text>

<!-- CircuitBreaker -->
<rect class="card" x="429.44" y="208" width="312.32" height="76" rx="14" fill="#FFF3D9" stroke="#D6A441"/>
<text class="smallLabel" x="585.6" y="234" text-anchor="middle">CircuitBreaker Filter</text>
<text class="small" x="585.6" y="254" text-anchor="middle">Resilience4j</text>
<text class="small" x="585.6" y="271" text-anchor="middle">CircuitBreakerConfig  -  fallback</text>

<!-- RouteFilter -->
<rect class="card" x="814.96" y="208" width="312.32" height="76" rx="14" fill="#F1ECFF" stroke="#8A72D6"/>
<text class="smallLabel" x="971.12" y="234" text-anchor="middle">Route Filter</text>
<text class="small" x="971.12" y="254" text-anchor="middle">NettyConfig</text>
<text class="small" x="971.12" y="271" text-anchor="middle">Thread pool  -  routing rules</text>

<!-- Arrows Row1 -> Row2 -->
<line class="line" x1="463.6" y1="164" x2="244" y2="208" stroke-linecap="round" stroke-linejoin="round"/>
<line class="line" x1="585.6" y1="164" x2="585.6" y2="208" stroke-linecap="round" stroke-linejoin="round"/>
<line class="line" x1="707.6" y1="164" x2="927.2" y2="208" stroke-linecap="round" stroke-linejoin="round"/>

<!-- Row 3: Controllers -->
<rect class="card" x="185.44" y="332" width="312.32" height="64" rx="14" fill="#E9F7F6" stroke="#45A7A1"/>
<text class="smallLabel" x="341.6" y="357" text-anchor="middle">IndexController</text>
<text class="small" x="341.6" y="377" text-anchor="middle">main request handler</text>

<rect class="card" x="673.44" y="332" width="312.32" height="64" rx="14" fill="#FDECEF" stroke="#DC6B82"/>
<text class="smallLabel" x="829.6" y="357" text-anchor="middle">FallbackController</text>
<text class="small" x="829.6" y="377" text-anchor="middle">circuit breaker fallback</text>

<!-- Arrows Row2 -> Row3 -->
<line class="line" x1="200.08" y1="284" x2="305" y2="332" stroke-linecap="round" stroke-linejoin="round"/>
<line class="line" x1="585.6" y1="284" x2="488" y2="332" stroke-linecap="round" stroke-linejoin="round"/>
<line class="line" x1="658.8" y1="284" x2="756.4" y2="332" stroke-linecap="round" stroke-linejoin="round"/>
<line class="line" x1="971.12" y1="284" x2="866.2" y2="332" stroke-linecap="round" stroke-linejoin="round"/>

<!-- Row 4: Redis full width -->
<rect class="card" x="43.92" y="416" width="1080.92" height="48" rx="14" fill="#FDECEF" stroke="#DC6B82"/><image data-bluetape4k-icon="redis" data-source="docs/icons/redis/redis-icon.svg" x="57.9" y="426.0" width="30" height="30" href="data:image/svg+xml;base64," preserveAspectRatio="xMidYMid meet"/>  <text class="smallLabel" x="584.38" y="436" text-anchor="middle">Redis (rate limit storage)</text>
<text class="small" x="584.38" y="454" text-anchor="middle">RequestRateLimiter  -  sliding window counters  -  UserKeyResolver key extraction</text>

<!-- Arrow RateLimiter -> Redis: jog left to x=140 to avoid crossing IndexController (x=152..408) -->
<path class="line" d="M 200.08 284 L 200.08 302 Q 200.08 312 187.88 312 L 183 312 Q 165.92 312 165.92 322 L 165.92 416" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
