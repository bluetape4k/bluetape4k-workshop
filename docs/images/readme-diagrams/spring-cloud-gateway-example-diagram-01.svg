<svg xmlns="http://www.w3.org/2000/svg" width="960" height="460" viewBox="0 0 960 460" role="img" aria-label="Spring Cloud Gateway Architecture">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#1f2937" flood-opacity="0.09"/></filter>
  <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth">
    <path d="M1,1 L8,4.5 L1,8 Z" fill="#758297"/>
  </marker>
  <style>
    .canvas{fill:#f7f9fc}.frame{fill:#fff;stroke:#d8e0ea;stroke-width:1.5}
    .title{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:38px;font-weight:400;fill:#102033}
    .subtitle{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:14px;font-weight:400;fill:#536273}
    .smallLabel{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:21px;font-weight:400;fill:#102033}
    .mono{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#102033}
    .small{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#536273}
    .card{stroke-width:2.1;filter:url(#shadow)}
    .line{stroke:#758297;stroke-width:2.1;fill:none;marker-end:url(#arrow)}
  </style>
</defs>
<rect class="canvas" width="960" height="460"/>
<rect class="frame" x="24" y="20" width="912" height="416" rx="20"/>

<!-- Title -->
<text class="title" x="48" y="66">Spring Cloud Gateway Architecture</text>
<text class="subtitle" x="48" y="90">GatewayApplication · RateLimiter · CircuitBreaker · Redis · Resilience4j</text>

<!-- Row 1: Client HTTP Request -->
<rect class="card" x="330" y="108" width="300" height="56" rx="14" fill="#E8F3FF" stroke="#5B8DEF"/>
<text class="smallLabel" x="480" y="132" text-anchor="middle">Client HTTP Request</text>
<text class="small" x="480" y="152" text-anchor="middle">GatewayApplication · /api/** routes</text>

<!-- Row 2: 3 filters -->
<!-- RateLimiter -->
<rect class="card" x="36" y="208" width="256" height="76" rx="14" fill="#EAF7EF" stroke="#58A978"/>
<text class="smallLabel" x="164" y="234" text-anchor="middle">RateLimiter Filter</text>
<text class="small" x="164" y="254" text-anchor="middle">RequestRateLimiter</text>
<text class="small" x="164" y="271" text-anchor="middle">UserKeyResolver · Redis backend</text>

<!-- CircuitBreaker -->
<rect class="card" x="352" y="208" width="256" height="76" rx="14" fill="#FFF3D9" stroke="#D6A441"/>
<text class="smallLabel" x="480" y="234" text-anchor="middle">CircuitBreaker Filter</text>
<text class="small" x="480" y="254" text-anchor="middle">Resilience4j</text>
<text class="small" x="480" y="271" text-anchor="middle">CircuitBreakerConfig · fallback</text>

<!-- RouteFilter -->
<rect class="card" x="668" y="208" width="256" height="76" rx="14" fill="#F1ECFF" stroke="#8A72D6"/>
<text class="smallLabel" x="796" y="234" text-anchor="middle">Route Filter</text>
<text class="small" x="796" y="254" text-anchor="middle">NettyConfig</text>
<text class="small" x="796" y="271" text-anchor="middle">Thread pool · routing rules</text>

<!-- Arrows Row1 → Row2 -->
<line class="line" x1="380" y1="164" x2="200" y2="208"/>
<line class="line" x1="480" y1="164" x2="480" y2="208"/>
<line class="line" x1="580" y1="164" x2="760" y2="208"/>

<!-- Row 3: Controllers -->
<rect class="card" x="152" y="332" width="256" height="64" rx="14" fill="#E9F7F6" stroke="#45A7A1"/>
<text class="smallLabel" x="280" y="357" text-anchor="middle">IndexController</text>
<text class="small" x="280" y="377" text-anchor="middle">main request handler</text>

<rect class="card" x="552" y="332" width="256" height="64" rx="14" fill="#FDECEF" stroke="#DC6B82"/>
<text class="smallLabel" x="680" y="357" text-anchor="middle">FallbackController</text>
<text class="small" x="680" y="377" text-anchor="middle">circuit breaker fallback</text>

<!-- Arrows Row2 → Row3 -->
<line class="line" x1="164" y1="284" x2="250" y2="332"/>
<line class="line" x1="480" y1="284" x2="400" y2="332"/>
<line class="line" x1="540" y1="284" x2="620" y2="332"/>
<line class="line" x1="796" y1="284" x2="710" y2="332"/>

<!-- Row 4: Redis full width -->
<rect class="card" x="36" y="416" width="886" height="48" rx="14" fill="#FDECEF" stroke="#DC6B82"/>
<text class="smallLabel" x="479" y="436" text-anchor="middle">Redis (rate limit storage)</text>
<text class="small" x="479" y="454" text-anchor="middle">RequestRateLimiter · sliding window counters · UserKeyResolver key extraction</text>

<!-- Arrow RateLimiter → Redis -->
<line class="line" x1="164" y1="284" x2="164" y2="416"/>
</svg>
