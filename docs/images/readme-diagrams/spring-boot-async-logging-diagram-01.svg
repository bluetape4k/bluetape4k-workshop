<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1378 580" width="1378" height="580">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="2" dy="4" stdDeviation="5" flood-color="#1f2937" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <polygon points="1,1 8,4.5 1,8" fill="#6b7280"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1378" height="580" fill="#f6f9fc"/>
  <rect x="20" y="20" width="1338" height="540" rx="16" fill="#fff" stroke="#d7e2ec" stroke-width="1.5"/>

  <!-- Title -->
  <text x="48" y="56" font-family="'Architects Daughter', cursive" font-size="28" fill="#1e293b">Async Logging Architecture</text>
  <text x="48" y="76" font-family="'Comic Sans MS', cursive" font-size="13" fill="#536476">SLF4J async fan-out · logback-spring.xml · three appender backends</text>

  <!-- ── Row 0: SLF4J Logger ── -->
  <text x="689" y="97" font-family="'Architects Daughter', cursive" font-size="11" fill="#94a3b8" text-anchor="middle" letter-spacing="0.08em">LOGGER</text>
  <rect x="559" y="100" width="260" height="80" rx="12" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.8" filter="url(#shadow)"/>
  <text x="689" y="130" font-family="'Architects Daughter', cursive" font-size="18" fill="#1e3a5f" text-anchor="middle">SLF4J Logger</text>
  <text x="689" y="152" font-family="'Comic Sans MS', cursive" font-size="12" fill="#536476" text-anchor="middle">companion object : KLogging()</text>

  <!-- ── Row 1: AsyncAppenders ── -->
  <text x="689" y="217" font-family="'Architects Daughter', cursive" font-size="11" fill="#94a3b8" text-anchor="middle" letter-spacing="0.08em">ASYNC APPENDERS (non-blocking delegation)</text>

  <!-- ASYNC_CONSOLE -->
  <rect x="126" y="222" width="260" height="88" rx="12" fill="#d1fae5" stroke="#059669" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="256" y="250" font-family="'Architects Daughter', cursive" font-size="16" fill="#064e3b" text-anchor="middle">ASYNC_CONSOLE</text>
  <text x="256" y="270" font-family="'Comic Sans MS', cursive" font-size="12" fill="#536476" text-anchor="middle">AsyncAppender</text>
  <rect x="186" y="281" width="140" height="20" rx="10" fill="#059669"/>
  <text x="256" y="295" font-family="'Comic Sans MS', cursive" font-size="11" fill="#fff" text-anchor="middle">queueSize: 256</text>

  <!-- ASYNC_ROLLING_FILE -->
  <rect x="559" y="222" width="260" height="88" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="689" y="250" font-family="'Architects Daughter', cursive" font-size="15" fill="#78350f" text-anchor="middle">ASYNC_ROLLING_FILE</text>
  <text x="689" y="270" font-family="'Comic Sans MS', cursive" font-size="12" fill="#536476" text-anchor="middle">AsyncAppender</text>
  <rect x="619" y="281" width="140" height="20" rx="10" fill="#d97706"/>
  <text x="689" y="295" font-family="'Comic Sans MS', cursive" font-size="11" fill="#fff" text-anchor="middle">queueSize: 512</text>

  <!-- ASYNC_SLACK -->
  <rect x="992" y="222" width="260" height="88" rx="12" fill="#fce7f3" stroke="#db2777" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="1122" y="250" font-family="'Architects Daughter', cursive" font-size="16" fill="#831843" text-anchor="middle">ASYNC_SLACK</text>
  <text x="1122" y="270" font-family="'Comic Sans MS', cursive" font-size="12" fill="#536476" text-anchor="middle">AsyncAppender</text>
  <rect x="1062" y="281" width="120" height="20" rx="10" fill="#db2777"/>
  <text x="1122" y="295" font-family="'Comic Sans MS', cursive" font-size="11" fill="#fff" text-anchor="middle">ERROR only</text>

  <!-- ── Row 2: Real Appenders ── -->
  <text x="689" y="337" font-family="'Architects Daughter', cursive" font-size="11" fill="#94a3b8" text-anchor="middle" letter-spacing="0.08em">REAL APPENDERS</text>

  <!-- ConsoleAppender -->
  <rect x="126" y="342" width="260" height="74" rx="12" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="256" y="368" font-family="'Architects Daughter', cursive" font-size="16" fill="#0c4a6e" text-anchor="middle">ConsoleAppender</text>
  <text x="256" y="388" font-family="'Comic Sans MS', cursive" font-size="12" fill="#536476" text-anchor="middle">stdout · dev / test</text>

  <!-- RollingFileAppender -->
  <rect x="559" y="342" width="260" height="74" rx="12" fill="#fffbeb" stroke="#b45309" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="689" y="368" font-family="'Architects Daughter', cursive" font-size="16" fill="#451a03" text-anchor="middle">RollingFileAppender</text>
  <text x="689" y="388" font-family="'Comic Sans MS', cursive" font-size="12" fill="#536476" text-anchor="middle">logs/app.log · dev / prod</text>

  <!-- Slack Webhook -->
  <rect x="992" y="342" width="260" height="74" rx="12" fill="#fdf2f8" stroke="#9d174d" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="1122" y="368" font-family="'Architects Daughter', cursive" font-size="16" fill="#500724" text-anchor="middle">Slack Webhook</text>
  <text x="1122" y="388" font-family="'Comic Sans MS', cursive" font-size="12" fill="#536476" text-anchor="middle">ERROR alerts · prod</text>

  <!-- ── Arrows: SLF4J → AsyncAppenders ── -->
  <path d="M689,180 C689,205 256,205 256,222" stroke="#6b7280" stroke-width="1.8" fill="none" marker-end="url(#arrow)"/>
  <line x1="689" y1="180" x2="689" y2="222" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
  <path d="M689,180 C689,205 1122,205 1122,222" stroke="#6b7280" stroke-width="1.8" fill="none" marker-end="url(#arrow)"/>

  <!-- ── Arrows: AsyncAppenders → RealAppenders ── -->
  <line x1="256" y1="310" x2="256" y2="342" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="689" y1="310" x2="689" y2="342" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="1122" y1="310" x2="1122" y2="342" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- ── Footer ── -->
  <rect x="36" y="440" width="1306" height="50" rx="10" fill="#f0f9ff" stroke="#7dd3fc" stroke-width="1.2"/>
  <text x="689" y="461" font-family="'Architects Daughter', cursive" font-size="14" fill="#0369a1" text-anchor="middle">AsyncAppender decouples logger thread from I/O — caller never blocks</text>
  <text x="689" y="479" font-family="'Comic Sans MS', cursive" font-size="12" fill="#536476" text-anchor="middle">dev: Console + RollingFile · test: RollingFile · prod: RollingFile + Slack (ERROR)</text>
</svg>
