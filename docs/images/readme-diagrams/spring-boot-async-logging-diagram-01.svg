<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" width="960" height="620">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="2" dy="4" stdDeviation="5" flood-color="#1f2937" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth">
      <path d="M1,1 L8,4.5 L1,8 Z" fill="#758297"/>
    </marker>
    <style>
      .canvas{fill:#f7f9fc}
      .frame{fill:#fff;stroke:#d8e0ea;stroke-width:1.5}
      .title{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:38px;font-weight:400;fill:#102033}
      .subtitle{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:14px;font-weight:400;fill:#536273}
      .smallLabel{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:21px;font-weight:400;fill:#102033}
      .mono{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#102033}
      .small{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#536273}
      .card{stroke-width:2.1;filter:url(#shadow)}
      .line{stroke:#758297;stroke-width:2.1;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>

  <!-- Background -->
  <rect width="960" height="620" class="canvas"/>
  <rect x="24" y="20" width="912" height="580" rx="22" class="frame"/>

  <!-- Title -->
  <text x="48" y="70" class="title">Async Logging Architecture</text>
  <text x="48" y="92" class="subtitle">SLF4J async fan-out · logback-spring.xml · three appender backends</text>

  <!-- ── Row 0: SLF4J Logger ── -->
  <text x="480" y="118" font-family="'Architects Daughter','Comic Sans MS',cursive" font-size="11" fill="#758297" text-anchor="middle" letter-spacing="0.08em">LOGGER</text>
  <rect x="340" y="122" width="280" height="80" rx="14" fill="#E8F3FF" stroke="#5B8DEF" class="card"/>
  <text x="480" y="152" class="smallLabel" text-anchor="middle">SLF4J Logger</text>
  <text x="480" y="174" class="small" text-anchor="middle">companion object : KLogging()</text>

  <!-- ── Row 1: AsyncAppenders label ── -->
  <text x="480" y="228" font-family="'Architects Daughter','Comic Sans MS',cursive" font-size="11" fill="#758297" text-anchor="middle" letter-spacing="0.08em">ASYNC APPENDERS (non-blocking delegation)</text>

  <!-- ASYNC_CONSOLE -->
  <rect x="48" y="234" width="252" height="90" rx="14" fill="#EAF7EF" stroke="#58A978" class="card"/>
  <text x="174" y="263" class="smallLabel" text-anchor="middle">ASYNC_CONSOLE</text>
  <text x="174" y="283" class="small" text-anchor="middle">AsyncAppender</text>
  <rect x="104" y="294" width="140" height="20" rx="10" fill="#58A978"/>
  <text x="174" y="308" class="mono" fill="#fff" text-anchor="middle">queueSize: 256</text>

  <!-- ASYNC_ROLLING_FILE -->
  <rect x="354" y="234" width="252" height="90" rx="14" fill="#FFF3D9" stroke="#D6A441" class="card"/>
  <text x="480" y="263" class="smallLabel" text-anchor="middle">ASYNC_ROLLING_FILE</text>
  <text x="480" y="283" class="small" text-anchor="middle">AsyncAppender</text>
  <rect x="410" y="294" width="140" height="20" rx="10" fill="#D6A441"/>
  <text x="480" y="308" class="mono" fill="#fff" text-anchor="middle">queueSize: 512</text>

  <!-- ASYNC_SLACK -->
  <rect x="660" y="234" width="252" height="90" rx="14" fill="#FDECEF" stroke="#DC6B82" class="card"/>
  <text x="786" y="263" class="smallLabel" text-anchor="middle">ASYNC_SLACK</text>
  <text x="786" y="283" class="small" text-anchor="middle">AsyncAppender</text>
  <rect x="726" y="294" width="120" height="20" rx="10" fill="#DC6B82"/>
  <text x="786" y="308" class="mono" fill="#fff" text-anchor="middle">ERROR only</text>

  <!-- ── Row 2: Real Appenders label ── -->
  <text x="480" y="352" font-family="'Architects Daughter','Comic Sans MS',cursive" font-size="11" fill="#758297" text-anchor="middle" letter-spacing="0.08em">REAL APPENDERS</text>

  <!-- ConsoleAppender -->
  <rect x="48" y="358" width="252" height="76" rx="14" fill="#E8F3FF" stroke="#5B8DEF" class="card"/>
  <text x="174" y="386" class="smallLabel" text-anchor="middle">ConsoleAppender</text>
  <text x="174" y="410" class="small" text-anchor="middle">stdout · dev / test</text>

  <!-- RollingFileAppender -->
  <rect x="354" y="358" width="252" height="76" rx="14" fill="#FFF3D9" stroke="#D6A441" class="card"/>
  <text x="480" y="386" class="smallLabel" text-anchor="middle">RollingFileAppender</text>
  <text x="480" y="410" class="small" text-anchor="middle">logs/app.log · dev / prod</text>

  <!-- Slack Webhook -->
  <rect x="660" y="358" width="252" height="76" rx="14" fill="#FDECEF" stroke="#DC6B82" class="card"/>
  <text x="786" y="386" class="smallLabel" text-anchor="middle">Slack Webhook</text>
  <text x="786" y="410" class="small" text-anchor="middle">ERROR alerts · prod</text>

  <!-- ── Arrows: SLF4J → AsyncAppenders (orthogonal) ── -->
  <!-- SLF4J → ASYNC_CONSOLE -->
  <path d="M 480 202 V 214 H 174 V 234" class="line"/>
  <!-- SLF4J → ASYNC_ROLLING_FILE -->
  <path d="M 480 202 V 234" class="line"/>
  <!-- SLF4J → ASYNC_SLACK -->
  <path d="M 480 202 V 214 H 786 V 234" class="line"/>

  <!-- ── Arrows: AsyncAppenders → Real Appenders ── -->
  <path d="M 174 324 V 358" class="line"/>
  <path d="M 480 324 V 358" class="line"/>
  <path d="M 786 324 V 358" class="line"/>

  <!-- ── Footer (teal) ── -->
  <rect x="36" y="458" width="888" height="54" rx="12" fill="#E9F7F6" stroke="#45A7A1" stroke-width="1.5"/>
  <text x="480" y="480" font-family="'Architects Daughter','Comic Sans MS',cursive" font-size="14" fill="#102033" text-anchor="middle">AsyncAppender decouples logger thread from I/O — caller never blocks</text>
  <text x="480" y="498" class="small" text-anchor="middle">dev: Console + RollingFile · test: RollingFile · prod: RollingFile + Slack (ERROR)</text>
</svg>
