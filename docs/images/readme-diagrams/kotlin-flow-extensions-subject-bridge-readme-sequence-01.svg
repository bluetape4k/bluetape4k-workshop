<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="790" viewBox="0 0 1400 790">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#8aa0b8" flood-opacity="0.22"/>
    </filter>
    <marker id="arrow-blue" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" viewBox="0 0 14 14">
      <path d="M 1 1 L 13 7 L 1 13 Z" fill="#2f7ed8" stroke="#2f7ed8" stroke-width="1" stroke-dasharray="none" style="stroke-dasharray:none"/>
    </marker>
    <marker id="arrow-green" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" viewBox="0 0 14 14">
      <path d="M 1 1 L 13 7 L 1 13 Z" fill="#2f9e44" stroke="#2f9e44" stroke-width="1" stroke-dasharray="none" style="stroke-dasharray:none"/>
    </marker>
    <marker id="arrow-orange" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" viewBox="0 0 14 14">
      <path d="M 1 1 L 13 7 L 1 13 Z" fill="#d97706" stroke="#d97706" stroke-width="1" stroke-dasharray="none" style="stroke-dasharray:none"/>
    </marker>
    <marker id="arrow-purple" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" viewBox="0 0 14 14">
      <path d="M 1 1 L 13 7 L 1 13 Z" fill="#8b5cf6" stroke="#8b5cf6" stroke-width="1" stroke-dasharray="none" style="stroke-dasharray:none"/>
    </marker>
    <style>
      .canvas { fill:#f8fbff; }
      .frame { fill:#ffffff; stroke:#b7c8dc; stroke-width:2.2; }
      .title { font-family:'Architects Daughter','Comic Sans MS',cursive; font-size:34px; fill:#1f3349; text-anchor:middle; }
      .subtitle { font-family:'Comic Mono','Comic Sans MS',monospace; font-size:14px; fill:#52677f; text-anchor:middle; }
      .lane-title { font-family:'Architects Daughter','Comic Sans MS',cursive; font-size:21px; fill:#26384d; }
      .card-title { font-family:'Architects Daughter','Comic Sans MS',cursive; font-size:18px; fill:#1f3349; text-anchor:middle; }
      .card-text { font-family:'Comic Mono','Comic Sans MS',monospace; font-size:12px; fill:#334155; text-anchor:middle; }
      .small { font-family:'Comic Mono','Comic Sans MS',monospace; font-size:11px; fill:#52677f; text-anchor:middle; }
      .label { font-family:'Comic Mono','Comic Sans MS',monospace; font-size:11px; fill:#334155; text-anchor:middle; }
      .card { stroke-width:2; filter:url(#shadow); }
      .blue { fill:#e8f2ff; stroke:#8bb8ec; }
      .green { fill:#eaf8ef; stroke:#92d6a5; }
      .orange { fill:#fff4df; stroke:#e8b765; }
      .purple { fill:#f1edff; stroke:#b7a5f6; }
      .red { fill:#fff0f0; stroke:#eca0a0; }
      .line-blue { fill:none; stroke:#2f7ed8; stroke-width:3.4; stroke-linecap:round; stroke-linejoin:round; marker-end:url(#arrow-blue); }
      .line-green { fill:none; stroke:#2f9e44; stroke-width:3.4; stroke-linecap:round; stroke-linejoin:round; marker-end:url(#arrow-green); }
      .line-orange { fill:none; stroke:#d97706; stroke-width:3.4; stroke-linecap:round; stroke-linejoin:round; marker-end:url(#arrow-orange); }
      .line-purple { fill:none; stroke:#8b5cf6; stroke-width:3.4; stroke-linecap:round; stroke-linejoin:round; marker-end:url(#arrow-purple); }
      .dash { stroke-dasharray:8 7; }
    </style>
  </defs>
  <rect class="canvas" x="0" y="0" width="1400" height="790"/>
  <rect class="frame" x="34" y="32" width="1332" height="726" rx="18"/>
  <text class="title" x="700.0" y="72">Subject Bridge Sequence</text>
  <text class="subtitle" x="700.0" y="98">Callback writes terminate at the bridge; readers consume chosen Flow views</text>
  <rect class="card orange" x="70" y="135" width="170" height="58" rx="14"/>
  <text class="card-title" x="155.0" y="165">Callback SDK</text>
  <text class="card-text" x="155.0" y="191">listener</text>
  <rect class="card blue" x="300" y="135" width="190" height="58" rx="14"/>
  <text class="card-title" x="395.0" y="165">DeviceSubjectBridge</text>
  <text class="card-text" x="395.0" y="191">write methods</text>
  <rect class="card green" x="555" y="135" width="170" height="58" rx="14"/>
  <text class="card-title" x="640.0" y="165">Publish</text>
  <text class="card-text" x="640.0" y="191">events</text>
  <rect class="card green" x="760" y="135" width="170" height="58" rx="14"/>
  <text class="card-title" x="845.0" y="165">Behavior</text>
  <text class="card-text" x="845.0" y="191">latest state</text>
  <rect class="card green" x="965" y="135" width="170" height="58" rx="14"/>
  <text class="card-title" x="1050.0" y="165">Replay</text>
  <text class="card-text" x="1050.0" y="191">history</text>
  <rect class="card purple" x="1180" y="135" width="170" height="58" rx="14"/>
  <text class="card-title" x="1265.0" y="165">Worker</text>
  <text class="card-text" x="1265.0" y="191">unicast</text>
  <path d="M 155 193 L 155 700" stroke="#b9c7d8" stroke-width="2" stroke-dasharray="7 7"/>
  <path d="M 395 193 L 395 700" stroke="#b9c7d8" stroke-width="2" stroke-dasharray="7 7"/>
  <path d="M 640 193 L 640 700" stroke="#b9c7d8" stroke-width="2" stroke-dasharray="7 7"/>
  <path d="M 845 193 L 845 700" stroke="#b9c7d8" stroke-width="2" stroke-dasharray="7 7"/>
  <path d="M 1050 193 L 1050 700" stroke="#b9c7d8" stroke-width="2" stroke-dasharray="7 7"/>
  <path d="M 1265 193 L 1265 700" stroke="#b9c7d8" stroke-width="2" stroke-dasharray="7 7"/>
  <path class="line-blue" d="M 155 250 L 395 250"/>
  <rect x="203" y="215" width="144" height="24" rx="12" fill="#ffffff" stroke="#d5e1ef"/>
  <text class="label" x="275" y="233">1 onEvent</text>
  <path class="line-green" d="M 395 300 L 640 300"/>
  <rect x="448" y="265" width="144" height="24" rx="12" fill="#ffffff" stroke="#d5e1ef"/>
  <text class="label" x="520" y="283">2 publishEvent</text>
  <path class="line-green" d="M 395 350 L 1050 350"/>
  <rect x="648" y="315" width="144" height="24" rx="12" fill="#ffffff" stroke="#d5e1ef"/>
  <text class="label" x="720" y="333">3 record history</text>
  <path class="line-orange" d="M 155 420 L 395 420"/>
  <rect x="203" y="385" width="144" height="24" rx="12" fill="#ffffff" stroke="#d5e1ef"/>
  <text class="label" x="275" y="403">4 onState</text>
  <path class="line-green" d="M 395 470 L 845 470"/>
  <rect x="548" y="435" width="144" height="24" rx="12" fill="#ffffff" stroke="#d5e1ef"/>
  <text class="label" x="620" y="453">5 update latest</text>
  <path class="line-purple" d="M 155 540 L 395 540"/>
  <rect x="203" y="505" width="144" height="24" rx="12" fill="#ffffff" stroke="#d5e1ef"/>
  <text class="label" x="275" y="523">6 enqueueWork</text>
  <path class="line-purple" d="M 395 590 L 1265 590"/>
  <rect x="748" y="555" width="144" height="24" rx="12" fill="#ffffff" stroke="#d5e1ef"/>
  <text class="label" x="820" y="573">7 work item consumed once</text>
  <path class="line-orange dash" d="M 155 655 L 395 655"/>
  <rect x="203" y="620" width="144" height="24" rx="12" fill="#ffffff" stroke="#d5e1ef"/>
  <text class="label" x="275" y="638">8 onError / complete</text>
  <path class="line-orange dash" d="M 395 690 L 1265 690"/>
  <rect x="758" y="655" width="144" height="24" rx="12" fill="#ffffff" stroke="#d5e1ef"/>
  <text class="label" x="830" y="673">9 terminal signal reaches readers</text>
</svg>
