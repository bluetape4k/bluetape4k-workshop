<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="820" viewBox="0 0 1600 820">
  <defs>
    <style>
      .bg{fill:#f8fafc}.title{font-family:'Architects Daughter','Comic Sans MS',cursive;font-size:34px;fill:#18212f}
      .layer-title{font-family:'Architects Daughter','Comic Sans MS',cursive;font-size:26px;fill:#344154}
      .card-title{font-family:'Architects Daughter','Comic Sans MS',cursive;font-size:27px;fill:#101827}
      .body{font-family:'Comic Mono','Comic Sans MS',monospace;font-size:18px;fill:#364152}.card{fill:#fff;stroke:#cbd5e1;stroke-width:1.5;rx:18;ry:18}.layer{stroke-width:1.5;rx:22;ry:22}.line{fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L11,6 L1,11 Z" fill="#2563eb" stroke-dasharray="none"/></marker>
    <marker id="arrow-green" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L11,6 L1,11 Z" fill="#059669" stroke-dasharray="none"/></marker>
  </defs>
  <rect class="bg" width="1600" height="820"/>
  <text class="title" x="70" y="70">MVC Form Login Security</text>

  <rect class="layer" x="70" y="120" width="1460" height="180" fill="#eff6ff" stroke="#bfdbfe"/>
  <text class="layer-title" x="105" y="165">MVC endpoints</text>
  <rect class="card" x="140" y="205" width="360" height="60"/>
  <text class="body" x="170" y="242">/ and /css/** permitAll</text>
  <rect class="card" x="620" y="205" width="360" height="60"/>
  <text class="body" x="650" y="242">/log-in login page</text>
  <rect class="card" x="1100" y="205" width="360" height="60"/>
  <text class="body" x="1130" y="242">/user/** ROLE_USER</text>

  <rect class="layer" x="70" y="360" width="1460" height="180" fill="#f0fdf4" stroke="#bbf7d0"/>
  <text class="layer-title" x="105" y="405">Security configuration</text>
  <rect class="card" x="245" y="445" width="430" height="60"/>
  <text class="card-title" x="275" y="485">SecurityFilterChain</text>
  <rect class="card" x="925" y="445" width="430" height="60"/>
  <text class="card-title" x="955" y="485">InMemoryUserDetailsManager</text>

  <rect class="layer" x="70" y="600" width="1460" height="130" fill="#fefce8" stroke="#fde68a"/>
  <text class="layer-title" x="105" y="645">Authentication result</text>
  <rect class="card" x="330" y="660" width="360" height="50"/>
  <text class="body" x="360" y="692">anonymous -> /log-in</text>
  <rect class="card" x="910" y="660" width="360" height="50"/>
  <text class="body" x="940" y="692">user/password -> allowed</text>

  <path class="line" d="M320 265 L320 445" stroke="#059669" marker-end="url(#arrow-green)" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="line" d="M800 265 L800 325 L460 325 L460 445" stroke="#2563eb" marker-end="url(#arrow)" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="line" d="M1280 265 L1280 325 L460 325" stroke="#2563eb" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="line" d="M460 505 L460 660" stroke="#2563eb" marker-end="url(#arrow)" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="line" d="M1140 505 L1140 660" stroke="#2563eb" marker-end="url(#arrow)" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
