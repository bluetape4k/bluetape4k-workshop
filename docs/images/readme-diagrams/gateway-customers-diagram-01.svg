<svg xmlns="http://www.w3.org/2000/svg" width="820" height="440" viewBox="0 0 820 440" role="img" aria-label="Gateway Customers Architecture">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#1f2937" flood-opacity="0.10"/></filter>
  <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth">
    <path d="M1,1 L8,4.5 L1,8 Z" fill="#758297"/>
  </marker>
  <style>
    .canvas{fill:#f7f9fc}.frame{fill:#fff;stroke:#d8e0ea;stroke-width:1.5}
    .title{font-family:"Architects Daughter";font-size:38px;font-weight:400;fill:#102033}
    .subtitle{font-family:"Comic Mono";font-size:14px;font-weight:400;fill:#536273}
    .smallLabel{font-family:"Architects Daughter";font-size:21px;font-weight:400;fill:#102033}
    .mono{font-family:"Comic Mono";font-size:12px;font-weight:400;fill:#102033}
    .small{font-family:"Comic Mono";font-size:12px;font-weight:400;fill:#536273}
    .card{stroke-width:2.1;filter:url(#shadow)}
    .line{stroke:#758297;stroke-width:2.1;fill:none;marker-end:url(#arrow)}
  </style>
</defs>
<rect class="canvas" width="820" height="440"/>
<rect class="frame" x="24" y="20" width="772" height="396" rx="28"/>
<text class="title" x="58" y="66">Gateway Customers Service</text>
<text class="subtitle" x="58" y="92">Spring Cloud Gateway · CustomerController · WebFlux · Coroutines</text>

<!-- Arrows -->
<path class="line" d="M410 152 L410 202"/>
<path class="line" d="M410 256 L410 306"/>

<!-- API Gateway route -->
<g transform="translate(178,98)">
  <rect class="card" x="0" y="0" width="464" height="54" rx="12" fill="#EAF7EF" stroke="#58A978"/>
  <text class="smallLabel" x="232" y="22" text-anchor="middle">API Gateway :8080</text>
  <text class="small" x="232" y="42" text-anchor="middle">/customer-service/** → RewritePath → :8081</text>
</g>

<!-- CustomerController -->
<g transform="translate(178,202)">
  <rect class="card" x="0" y="0" width="464" height="54" rx="12" fill="#FFF3D9" stroke="#D6A441"/>
  <text class="smallLabel" x="232" y="22" text-anchor="middle">CustomerController :8081</text>
  <text class="mono" x="232" y="42" text-anchor="middle">@RestController · @RequestMapping("/api/v1/customers")</text>
</g>

<!-- Response -->
<g transform="translate(178,306)">
  <rect class="card" x="0" y="0" width="464" height="86" rx="12" fill="#E8F3FF" stroke="#5B8DEF"/>
  <text class="smallLabel" x="232" y="26" text-anchor="middle">GET /api/v1/customers</text>
  <text class="small" x="232" y="50" text-anchor="middle">suspend fun getAll(): List&lt;Customer&gt;</text>
  <text class="mono" x="232" y="70" text-anchor="middle">Customer(name: String)</text>
  <text class="small" x="232" y="86" text-anchor="middle" dy="-2">examples: "Winter", "Spring"</text>
</g>
</svg>
