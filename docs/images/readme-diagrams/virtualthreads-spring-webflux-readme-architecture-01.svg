<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="1030" viewBox="0 0 1680 1030" role="img" aria-label="Spring WebFlux dispatcher architecture">
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .title { font-family: 'Architects Daughter', 'Comic Sans MS', cursive; font-size: 34px; fill: #172033; }
      .subtitle { font-family: 'Comic Mono', 'Comic Sans MS', monospace; font-size: 17px; fill: #5b6675; }
      .layer-title { font-family: 'Architects Daughter', 'Comic Sans MS', cursive; font-size: 26px; fill: #263244; }
      .card-title { font-family: 'Architects Daughter', 'Comic Sans MS', cursive; font-size: 28px; fill: #111827; }
      .body { font-family: 'Comic Mono', 'Comic Sans MS', monospace; font-size: 17px; fill: #3d4654; }
      .small { font-family: 'Comic Mono', 'Comic Sans MS', monospace; font-size: 15px; fill: #4b5563; }
      .layer { stroke-width: 1.5; rx: 24; ry: 24; }
      .card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; rx: 18; ry: 18; }
      .surface { fill: #eff6ff; stroke: #93c5fd; }
      .webflux { fill: #eef2ff; stroke: #a5b4fc; }
      .dispatch { fill: #f0fdf4; stroke: #86efac; }
      .external { fill: #fff7ed; stroke: #fdba74; }
      .line { fill: none; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
      .icon-stroke { fill: none; stroke: #334155; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    </style>
    <marker id="blueArrow" viewBox="0 0 10 10" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#2563eb"/>
    </marker>
    <marker id="greenArrow" viewBox="0 0 10 10" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#16a34a"/>
    </marker>
    <marker id="orangeArrow" viewBox="0 0 10 10" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#ea580c"/>
    </marker>
  </defs>

  <rect class="bg" width="1680" height="1030"/>
  <text class="title" x="70" y="66">Spring WebFlux Dispatcher Comparison</text>
  <text class="subtitle" x="70" y="96">Same coroutine endpoints, four dispatcher choices, Netty runtime tuning, and virtual-thread HTTP calls</text>

  <rect class="layer surface" x="70" y="135" width="1540" height="175"/>
  <text class="layer-title" x="105" y="180">Request Surface</text>
  <rect class="card" x="180" y="205" width="330" height="70"/>
  <text class="card-title" x="345" y="249" text-anchor="middle">WebTestClient</text>
  <rect class="card" x="675" y="205" width="330" height="70"/>
  <text class="card-title" x="840" y="249" text-anchor="middle">Gatling Scenarios</text>
  <rect class="card" x="1170" y="205" width="310" height="70"/>
  <text class="card-title" x="1325" y="249" text-anchor="middle">HTTP Clients</text>

  <rect class="layer webflux" x="70" y="360" width="1540" height="250"/>
  <text class="layer-title" x="105" y="405">WebFlux Runtime</text>
  <rect class="card" x="150" y="445" width="330" height="95"/>
  <path class="icon-stroke" d="M190 482h44m-44 18h44m-22-36v54"/>
  <text class="card-title" x="340" y="482" text-anchor="middle">Reactor Netty</text>
  <text class="body" x="340" y="512" text-anchor="middle">event loops + timeouts</text>
  <rect class="card" x="560" y="445" width="350" height="95"/>
  <text class="card-title" x="735" y="482" text-anchor="middle">Abstract Controller</text>
  <text class="body" x="735" y="512" text-anchor="middle">shared coroutine endpoints</text>
  <rect class="card" x="990" y="445" width="260" height="95"/>
  <text class="card-title" x="1120" y="482" text-anchor="middle">Httpbin</text>
  <text class="body" x="1120" y="512" text-anchor="middle">mono + suspend calls</text>
  <rect class="card" x="1320" y="445" width="230" height="95"/>
  <text class="card-title" x="1435" y="482" text-anchor="middle">@Async</text>
  <text class="body" x="1435" y="512" text-anchor="middle">VT executor</text>

  <rect class="layer dispatch" x="70" y="660" width="1540" height="195"/>
  <text class="layer-title" x="105" y="705">Dispatcher Controllers</text>
  <rect class="card" x="150" y="735" width="300" height="75"/>
  <text class="card-title" x="300" y="767" text-anchor="middle">Default</text>
  <text class="small" x="300" y="792" text-anchor="middle">Dispatchers.Default</text>
  <rect class="card" x="520" y="735" width="300" height="75"/>
  <text class="card-title" x="670" y="767" text-anchor="middle">IO</text>
  <text class="small" x="670" y="792" text-anchor="middle">Dispatchers.IO</text>
  <rect class="card" x="890" y="735" width="300" height="75"/>
  <text class="card-title" x="1040" y="767" text-anchor="middle">Custom</text>
  <text class="small" x="1040" y="792" text-anchor="middle">fixed dispatcher</text>
  <rect class="card" x="1260" y="735" width="300" height="75"/>
  <text class="card-title" x="1410" y="767" text-anchor="middle">Virtual Thread</text>
  <text class="small" x="1410" y="792" text-anchor="middle">executor.asCoroutineDispatcher()</text>

  <rect class="layer external" x="70" y="900" width="1540" height="90"/>
  <text class="layer-title" x="105" y="954">External Blocking Service</text>
  <rect class="card" x="960" y="912" width="470" height="62"/>
  <path class="icon-stroke" d="M1010 943h38m-30-15h22m-22 30h22"/>
  <text class="card-title" x="1235" y="952" text-anchor="middle">Testcontainers Httpbin</text>

  <path class="line" d="M1325 275 L1325 333 L315 333 L315 445" stroke="#2563eb" marker-end="url(#blueArrow)"/>
  <path class="line" d="M840 275 L840 332 L315 332 L315 445" stroke="#2563eb" marker-end="url(#blueArrow)"/>
  <path class="line" d="M315 540 L315 635 L300 635 L300 735" stroke="#16a34a" marker-end="url(#greenArrow)"/>
  <path class="line" d="M735 540 L735 635 L670 635 L670 735" stroke="#16a34a" marker-end="url(#greenArrow)"/>
  <path class="line" d="M735 540 L735 635 L1040 635 L1040 735" stroke="#16a34a" marker-end="url(#greenArrow)"/>
  <path class="line" d="M735 540 L735 635 L1410 635 L1410 735" stroke="#16a34a" marker-end="url(#greenArrow)"/>
  <path class="line" d="M1120 540 L1120 635 L1410 635 L1410 735" stroke="#16a34a" marker-end="url(#greenArrow)"/>
  <path class="line" d="M1120 540 L1120 625 L1585 625 L1585 885 L1235 885 L1235 912" stroke="#ea580c" marker-end="url(#orangeArrow)"/>
</svg>
