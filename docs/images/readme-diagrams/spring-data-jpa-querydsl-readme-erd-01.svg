  <text class="note-title" x="549" y="690" text-anchor="middle">Relationship helper methods</text>
  <text class="note" x="549" y="722" text-anchor="middle">Team.addMember() and Member.changeTeam() update both sides.</text>

  <rect class="note-card" x="1061.4" y="650" width="683.2" height="110" rx="12"/>
  <text class="note-title" x="1403" y="690" text-anchor="middle">Querydsl projection target</text>
