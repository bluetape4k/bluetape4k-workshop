    <text class="col" x="39.04" y="105">PK</text>
    <text class="col" x="124.44" y="105">id</text>
    <text class="col-muted" x="366" y="105">BIGINT</text>
    <text class="col" x="124.44" y="163">name</text>
    <text class="col-muted" x="366" y="163">VARCHAR</text>
