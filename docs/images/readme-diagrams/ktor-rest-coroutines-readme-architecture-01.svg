    <text class="cardText" x="1678.08" y="337" text-anchor="middle">ConcurrentHashMap</text>
    <text class="cardText" x="1678.08" y="361" text-anchor="middle">save, update, delete</text>
    <text class="cardText" x="1678.08" y="385" text-anchor="middle">findAll, findById</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="1574.4" y="466" width="207.36" height="112" rx="16" fill="#ECFEFF" stroke="#0891B2" stroke-width="2.176"/>
