<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1894.4" height="760" viewBox="0 0 1894.4 760" role="img" aria-label="Ktor REST coroutines architecture diagram">
