  <rect class="canvas" width="1894.4" height="760"/>
  <rect class="frame" x="30.72" y="24" width="1832.96" height="712" rx="24"/>
  <text class="title" x="947.2" y="66" text-anchor="middle">Ktor coroutine REST service</text>
  <text class="subtitle" x="947.2" y="94" text-anchor="middle">Application.module wires Ktor plugins, book routes, coroutine service logic, and an in-memory hot stream repository.</text>

  <rect class="layer" x="92.16" y="132" width="296.96" height="504" rx="18"/>
