    <text class="cardText" x="944.64" y="520" text-anchor="middle">domain errors</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="1149.44" y="426" width="284.16" height="122" rx="16" fill="#F0FDFA" stroke="#0D9488" stroke-width="2.176"/>
