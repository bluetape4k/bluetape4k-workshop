    <text class="cardText" x="1291.52" y="496" text-anchor="middle">tools.jackson.*</text>
    <text class="cardText" x="1291.52" y="520" text-anchor="middle">NDJSON writer</text>
  </g>

  <rect class="layer" x="1528.32" y="132" width="299.52" height="504" rx="18"/>
  <text class="layerLabel" x="1564.16" y="168">In-memory state</text>
  <g filter="url(#shadow)">
