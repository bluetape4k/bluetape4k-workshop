    <text class="cardText" x="620.8" y="282" text-anchor="middle">request trace</text>
    <text class="cardText" x="620.8" y="306" text-anchor="middle">KLoggingChannel</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="802.56" y="214" width="307.2" height="116" rx="16" fill="#ECFDF5" stroke="#16A34A" stroke-width="2.176"/>
