  <ns0:text x="525.0" y="578" class="msg callText">CallNotPermitted, MaxRetriesExceeded, RequestNotPermi…</ns0:text>
  <ns0:path d="M 543.0 602 L 871.0 602" class="call" stroke-linecap="round" stroke-linejoin="round" />
