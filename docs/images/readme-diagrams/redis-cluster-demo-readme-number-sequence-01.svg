  <text id="titleText" x="1199.0" y="76" text-anchor="middle" class="title">NumberService cluster sequence</text>
  <text x="1199.0" y="106" text-anchor="middle" class="subtitle">The service writes integer bytes through Spring Data clusterConnection, then reads them back from the hash-slot owner.</text>
  <g filter="url(#shadow)"><rect x="90.0" y="156" width="250" height="76" rx="10" class="header"/>
