<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="760" viewBox="0 0 1500 760" role="img" aria-label="Kafka reply request-reply flow diagram">
  <defs>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="124%"><feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#64748B" flood-opacity="0.16"/></filter>
    <marker id="arrowBlue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 12 6 L 0 12 Z" fill="#2563EB"/></marker>
    <marker id="arrowGreen" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 12 6 L 0 12 Z" fill="#16A34A"/></marker>
    <marker id="arrowAmber" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 12 6 L 0 12 Z" fill="#C47A12"/></marker>
    <style>
      .canvas{fill:#F8FAFC}.frame{fill:#FFFFFF;stroke:#D6E0E8;stroke-width:1.4}.lane{fill:#F8FAFC;stroke:#CBD5E1;stroke-width:1.4}.title{font-family:"Architects Daughter";font-size:36px;fill:#102033}.subtitle{font-family:"Comic Mono";font-size:14px;fill:#51606F}.laneLabel{font-family:"Architects Daughter";font-size:24px;fill:#263548}.cardTitle{font-family:"Architects Daughter";font-size:27px;fill:#102033}.cardText{font-family:"Comic Mono";font-size:14px;fill:#415166}.line{fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
    </style>
  </defs>
  <rect class="canvas" width="1500" height="760"/>
  <rect class="frame" x="24" y="24" width="1452" height="712" rx="24"/>
  <text class="title" x="750" y="66" text-anchor="middle">ReplyingKafkaTemplate request-reply path</text>
  <text class="subtitle" x="750" y="94" text-anchor="middle">The request goes through pingpong; the @SendTo reply returns through the dedicated replies listener container.</text>

  <rect class="lane" x="64" y="132" width="1372" height="244" rx="18"/>
  <text class="laneLabel" x="96" y="172">Request lane</text>
  <g filter="url(#shadow)">
    <rect x="108" y="224" width="176" height="86" rx="16" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.7"/>
    <text class="cardTitle" x="196" y="260" text-anchor="middle">GET /ping</text>
    <text class="cardText" x="196" y="286" text-anchor="middle">HTTP request</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="346" y="210" width="230" height="114" rx="16" fill="#ECFDF5" stroke="#16A34A" stroke-width="1.7"/>
    <text class="cardTitle" x="461" y="252" text-anchor="middle">sendAndReceive</text>
    <text class="cardText" x="461" y="282" text-anchor="middle">ProducerRecord("ping")</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="638" y="224" width="194" height="86" rx="16" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.7"/>
    <text class="cardTitle" x="735" y="260" text-anchor="middle">pingpong</text>
    <text class="cardText" x="735" y="286" text-anchor="middle">request topic</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="894" y="208" width="220" height="118" rx="16" fill="#ECFDF5" stroke="#16A34A" stroke-width="1.7"/>
    <text class="cardTitle" x="1004" y="250" text-anchor="middle">PongHandler</text>
    <text class="cardText" x="1004" y="280" text-anchor="middle">@KafkaListener</text>
    <text class="cardText" x="1004" y="304" text-anchor="middle">returns pong</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="1176" y="224" width="176" height="86" rx="16" fill="#FFF7ED" stroke="#D97706" stroke-width="1.7"/>
    <text class="cardTitle" x="1264" y="260" text-anchor="middle">@SendTo</text>
    <text class="cardText" x="1264" y="286" text-anchor="middle">reply header</text>
  </g>

  <rect class="lane" x="64" y="430" width="1372" height="244" rx="18"/>
  <text class="laneLabel" x="96" y="470">Reply lane</text>
  <g filter="url(#shadow)">
    <rect x="1176" y="522" width="176" height="86" rx="16" fill="#FFF7ED" stroke="#D97706" stroke-width="1.7"/>
    <text class="cardTitle" x="1264" y="558" text-anchor="middle">replies</text>
    <text class="cardText" x="1264" y="584" text-anchor="middle">reply topic</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="878" y="508" width="236" height="114" rx="16" fill="#FFF7ED" stroke="#D97706" stroke-width="1.7"/>
    <text class="cardTitle" x="996" y="550" text-anchor="middle">listenerContainer</text>
    <text class="cardText" x="996" y="580" text-anchor="middle">group repliesGroup</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="600" y="508" width="218" height="114" rx="16" fill="#ECFDF5" stroke="#16A34A" stroke-width="1.7"/>
    <text class="cardTitle" x="709" y="550" text-anchor="middle">await reply</text>
    <text class="cardText" x="709" y="580" text-anchor="middle">replyFuture.await()</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="318" y="522" width="220" height="86" rx="16" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.7"/>
    <text class="cardTitle" x="428" y="558" text-anchor="middle">HTTP 200</text>
    <text class="cardText" x="428" y="584" text-anchor="middle">pong at timestamp</text>
  </g>

  <path class="line" d="M 284 267 L 346 267" stroke="#16A34A" marker-end="url(#arrowGreen)"/>
  <path class="line" d="M 576 267 L 638 267" stroke="#16A34A" marker-end="url(#arrowGreen)"/>
  <path class="line" d="M 832 267 L 894 267" stroke="#16A34A" marker-end="url(#arrowGreen)"/>
  <path class="line" d="M 1114 267 L 1176 267" stroke="#C47A12" marker-end="url(#arrowAmber)"/>
  <path class="line" d="M 1264 310 L 1264 522" stroke="#C47A12" marker-end="url(#arrowAmber)"/>
  <path class="line" d="M 1176 565 L 1114 565" stroke="#C47A12" marker-end="url(#arrowAmber)"/>
  <path class="line" d="M 878 565 L 818 565" stroke="#16A34A" marker-end="url(#arrowGreen)"/>
  <path class="line" d="M 600 565 L 538 565" stroke="#2563EB" marker-end="url(#arrowBlue)"/>
</svg>
