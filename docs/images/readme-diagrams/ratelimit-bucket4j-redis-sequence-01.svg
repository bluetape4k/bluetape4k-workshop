<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="520" viewBox="0 0 1040 520" role="img" aria-label="Bucket4j Redis Rate Limit Sequence">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#1f2937" flood-opacity="0.10"/></filter>
  <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth">
    <path d="M1,1 L8,4.5 L1,8 Z" fill="#758297"/>
  </marker>
  <style>
    .canvas{fill:#f7f9fc}.frame{fill:#fff;stroke:#d8e0ea;stroke-width:1.5}
    .title{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:38px;font-weight:400;fill:#102033}
    .subtitle{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:14px;font-weight:400;fill:#536273}
    .smallLabel{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:18px;font-weight:400;fill:#102033}
    .mono{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:11px;font-weight:400;fill:#102033}
    .small{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:11px;font-weight:400;fill:#536273}
    .card{stroke-width:2.1;filter:url(#shadow)}
    .lifeline{stroke:#b0bbca;stroke-width:1.5;stroke-dasharray:6 4;fill:none}
    .reqArrow{stroke:#5B8DEF;stroke-width:2.1;fill:none;marker-end:url(#arrow)}
    .rspArrow{stroke:#45A7A1;stroke-width:2.1;stroke-dasharray:7 4;fill:none;marker-end:url(#arrow)}
  </style>
</defs>
<!-- 4 Participants:
     Client cx=90      (x=24 w=132)
     WebFilter cx=280  (x=216 w=128)
     DistributedRateLimiter cx=520 (x=432 w=176)
     Redis cx=820 (x=740 w=160)
     Controller cx=980 would be too far — folding controller into WebFilter response
-->
<rect class="canvas" width="1040" height="520"/>
<rect class="frame" x="24" y="20" width="992" height="476" rx="28"/>
<text class="title" x="58" y="64">Redis Rate Limit Sequence</text>
<text class="subtitle" x="58" y="88">WebFilter · DistributedRateLimiter · Redis · Lettuce CAS · 200 OK / 429</text>

<!-- Participant headers (y=100, h=40) -->
<g transform="translate(24,100)">
  <rect class="card" x="0" y="0" width="132" height="40" rx="8" fill="#E8F3FF" stroke="#5B8DEF"/>
  <text class="smallLabel" x="66" y="26" text-anchor="middle">Client</text>
</g>
<g transform="translate(196,100)">
  <rect class="card" x="0" y="0" width="168" height="40" rx="8" fill="#EAF7EF" stroke="#58A978"/>
  <text class="smallLabel" x="84" y="26" text-anchor="middle">UserRateLimit Filter</text>
</g>
<g transform="translate(424,100)">
  <rect class="card" x="0" y="0" width="200" height="40" rx="8" fill="#F1ECFF" stroke="#8A72D6"/>
  <text class="smallLabel" x="100" y="26" text-anchor="middle">DistributedRateLimiter</text>
</g>
<g transform="translate(700,100)">
  <rect class="card" x="0" y="0" width="150" height="40" rx="8" fill="#FDECEF" stroke="#DC6B82"/>
  <text class="smallLabel" x="75" y="26" text-anchor="middle">Redis</text>
</g>
<g transform="translate(920,100)">
  <rect class="card" x="0" y="0" width="96" height="40" rx="8" fill="#FFF3D9" stroke="#D6A441"/>
  <text class="smallLabel" x="48" y="26" text-anchor="middle">Controller</text>
</g>

<!-- Lifelines: cx = 90, 280, 524, 775, 968 -->
<line class="lifeline" x1="90"  y1="140" x2="90"  y2="480"/>
<line class="lifeline" x1="280" y1="140" x2="280" y2="480"/>
<line class="lifeline" x1="524" y1="140" x2="524" y2="480"/>
<line class="lifeline" x1="775" y1="140" x2="775" y2="480"/>
<line class="lifeline" x1="968" y1="140" x2="968" y2="480"/>

<!-- ① GET /api/v1/coroutines/hello: Client → Filter -->
<rect x="90" y="156" width="190" height="24" rx="4" fill="#dbeafe" opacity="0.7"/>
<text class="mono" x="185" y="172" text-anchor="middle">① GET /api/v1/coroutines/hello</text>
<path class="reqArrow" d="M90 168 L272 168"/>

<!-- ② extractKey (IP): Filter → RateLimiter -->
<rect x="280" y="200" width="244" height="24" rx="4" fill="#dbeafe" opacity="0.7"/>
<text class="mono" x="402" y="216" text-anchor="middle">② consume(ipKey, 1)</text>
<path class="reqArrow" d="M280 212 L516 212"/>

<!-- ③ EVAL Lua (atomic CAS): RateLimiter → Redis -->
<rect x="524" y="244" width="251" height="24" rx="4" fill="#dbeafe" opacity="0.7"/>
<text class="mono" x="649" y="260" text-anchor="middle">③ EVAL Lua (atomic CAS)</text>
<path class="reqArrow" d="M524 256 L767 256"/>

<!-- ④ tokensLeft, consumed: Redis → RateLimiter (dashed) -->
<rect x="524" y="288" width="251" height="24" rx="4" fill="#d1fae5" opacity="0.7"/>
<text class="mono" x="649" y="304" text-anchor="middle">④ consumed=1 remaining=9</text>
<path class="rspArrow" d="M775 300 L532 300"/>

<!-- ⑤ ConsumptionProbe result: RateLimiter → Filter (dashed) -->
<rect x="280" y="332" width="244" height="24" rx="4" fill="#d1fae5" opacity="0.7"/>
<text class="mono" x="402" y="348" text-anchor="middle">⑤ ConsumptionProbe (allowed)</text>
<path class="rspArrow" d="M524 344 L288 344"/>

<!-- ⑥ chain.filter(): Filter → Controller -->
<rect x="280" y="376" width="688" height="24" rx="4" fill="#dbeafe" opacity="0.7"/>
<text class="mono" x="624" y="392" text-anchor="middle">⑥ chain.filter() → controller</text>
<path class="reqArrow" d="M280 388 L960 388"/>

<!-- ⑦ 200 OK + X-RateLimit-Remaining: Filter → Client (dashed) -->
<rect x="90" y="420" width="190" height="24" rx="4" fill="#d1fae5" opacity="0.7"/>
<text class="mono" x="185" y="436" text-anchor="middle">⑦ 200 OK + X-RateLimit-Remaining: 9</text>
<path class="rspArrow" d="M280 432 L98 432"/>
</svg>
