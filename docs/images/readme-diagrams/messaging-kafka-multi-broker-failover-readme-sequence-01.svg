<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="1260" viewBox="0 0 1900 1260" role="img" aria-labelledby="title desc">
  <title id="title">Kafka Multi-Broker Failover Recovery Sequence</title>
  <desc id="desc">The harness creates a topic, sends prefix events, injects either a leader or coordinator fault, recovers the cluster, sends suffix events, and records terminal evidence.</desc>
  <defs>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="124%"><feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#64748B" flood-opacity="0.13"/></filter>
    <style>
      .bg{fill:#F8FAFC}.frame{fill:#FFF;stroke:#CAD6DF;stroke-width:2}.title{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:42px;fill:#263238}.subtitle,.msg,.small,.footer{font-family:"Comic Mono","SFMono-Regular",monospace;fill:#3E4C59}.subtitle{font-size:18px}.participant{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:23px;fill:#16202A}.small{font-size:14px;fill:#5B6975}.footer{font-size:14px;fill:#60727D}.card{fill:#FFF;stroke:#9FB0BC;stroke-width:2}.blueCard{fill:#EFF6FF;stroke:#4F86C6}.greenCard{fill:#F0F8F0;stroke:#6E8F4F}.amberCard{fill:#FFF7E8;stroke:#9B7D54}.purpleCard{fill:#F8F3FF;stroke:#8065A8}.redCard{fill:#FFF0F0;stroke:#B86868}.lifeline{stroke:#9AAAB1;stroke-width:2;stroke-dasharray:7 8}.activation{fill:#EAF6EF;stroke:#6F9278;stroke-width:1.5}.connector{fill:none;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round}.blueEdge{stroke:#4F86C6;marker-end:url(#arrow-blue)}.greenEdge{stroke:#6E8F4F;marker-end:url(#arrow-green)}.amberEdge{stroke:#9B7D54;marker-end:url(#arrow-amber)}.purpleEdge{stroke:#8065A8;marker-end:url(#arrow-purple)}.redEdge{stroke:#B86868;marker-end:url(#arrow-red)}.tealEdge{stroke:#2D948C;marker-end:url(#arrow-teal)}.label{fill:#FFF;stroke:#D7E0E4;stroke-width:1.5}.badge{font-family:"Comic Mono","SFMono-Regular",monospace;font-size:13px;font-weight:700}.alt{fill:#FFFCF5;stroke:#D7C3A2;stroke-width:2;stroke-dasharray:10 7}.divider{stroke:#D7C3A2;stroke-width:1.5;stroke-dasharray:7 6}
    </style>
    <marker id="arrow-blue" viewBox="0 0 10 10" markerWidth="16" markerHeight="16" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse" data-role="sequence" data-tip-direction="positive-x"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#4F86C6" stroke="#4F86C6" stroke-width="0" stroke-dasharray="none"/></marker>
    <marker id="arrow-green" viewBox="0 0 10 10" markerWidth="16" markerHeight="16" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse" data-role="sequence" data-tip-direction="positive-x"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#6E8F4F" stroke="#6E8F4F" stroke-width="0" stroke-dasharray="none"/></marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" markerWidth="16" markerHeight="16" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse" data-role="sequence" data-tip-direction="positive-x"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#9B7D54" stroke="#9B7D54" stroke-width="0" stroke-dasharray="none"/></marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" markerWidth="16" markerHeight="16" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse" data-role="sequence" data-tip-direction="positive-x"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#8065A8" stroke="#8065A8" stroke-width="0" stroke-dasharray="none"/></marker>
    <marker id="arrow-red" viewBox="0 0 10 10" markerWidth="16" markerHeight="16" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse" data-role="sequence" data-tip-direction="positive-x"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#B86868" stroke="#B86868" stroke-width="0" stroke-dasharray="none"/></marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" markerWidth="16" markerHeight="16" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse" data-role="sequence" data-tip-direction="positive-x"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#2D948C" stroke="#2D948C" stroke-width="0" stroke-dasharray="none"/></marker>
  </defs>
  <rect class="bg" width="1900" height="1260"/>
  <rect class="frame" x="30" y="25" width="1840" height="1210" rx="22"/>
  <text class="title" x="950" y="70" text-anchor="middle">Kafka Failover - One Evidence-Bounded Recovery Sequence</text>
  <text class="subtitle" x="950" y="104" text-anchor="middle">Both fault paths preserve at-least-once delivery, unique application effects, and a terminal ISR=3 observation.</text>

  <g class="node" data-node="harness" filter="url(#shadow)"><rect class="card blueCard" x="120" y="145" width="280" height="70" rx="14"/><text class="participant" x="260" y="178" text-anchor="middle">Test harness</text><text class="small" x="260" y="201" text-anchor="middle">deadline + fault injector</text></g>
  <g class="node" data-node="admin" filter="url(#shadow)"><rect class="card blueCard" x="420" y="145" width="280" height="70" rx="14"/><text class="participant" x="560" y="178" text-anchor="middle">AdminClient</text><text class="small" x="560" y="201" text-anchor="middle">metadata + group state</text></g>
  <g class="node" data-node="producer" filter="url(#shadow)"><rect class="card greenCard" x="720" y="145" width="280" height="70" rx="14"/><text class="participant" x="860" y="178" text-anchor="middle">Producer</text><text class="small" x="860" y="201" text-anchor="middle">acks=all + bounded retry</text></g>
  <g class="node" data-node="consumer" filter="url(#shadow)"><rect class="card purpleCard" x="1020" y="145" width="280" height="70" rx="14"/><text class="participant" x="1160" y="178" text-anchor="middle">Consumer</text><text class="small" x="1160" y="201" text-anchor="middle">manual ack + callback</text></g>
  <g class="node" data-node="brokers" filter="url(#shadow)"><rect class="card amberCard" x="1320" y="145" width="280" height="70" rx="14"/><text class="participant" x="1460" y="178" text-anchor="middle">Kafka quorum</text><text class="small" x="1460" y="201" text-anchor="middle">kafka-1 / 2 / 3 KRaft</text></g>
  <g class="node" data-node="evidence" filter="url(#shadow)"><rect class="card purpleCard" x="1620" y="145" width="220" height="70" rx="14"/><text class="participant" x="1730" y="178" text-anchor="middle">Evidence</text><text class="small" x="1730" y="201" text-anchor="middle">18-field JSONL</text></g>
  <line class="lifeline" x1="260" y1="215" x2="260" y2="1180"/><line class="lifeline" x1="560" y1="215" x2="560" y2="1180"/><line class="lifeline" x1="860" y1="215" x2="860" y2="1180"/><line class="lifeline" x1="1160" y1="215" x2="1160" y2="1180"/><line class="lifeline" x1="1460" y1="215" x2="1460" y2="1180"/><line class="lifeline" x1="1730" y1="215" x2="1730" y2="1180"/>
  <rect class="activation" x="552" y="250" width="16" height="360" rx="6"/><rect class="activation" x="852" y="400" width="16" height="590" rx="6"/><rect class="activation" x="1152" y="455" width="16" height="540" rx="6"/><rect class="activation" x="1452" y="270" width="16" height="785" rx="6"/><rect class="activation" x="1722" y="1080" width="16" height="80" rx="6"/>

  <g class="edge" data-edge="start-topic" data-label="start KRaft brokers and create reference topic"><rect class="label" x="635" y="246" width="600" height="34" rx="17"/><circle cx="657" cy="263" r="13" fill="#FFF" stroke="#4F86C6" stroke-width="2"/><text class="badge" x="657" y="268" text-anchor="middle">1</text><text class="msg" x="680" y="268">start cluster; create topic with RF=3</text><path data-connector="start-topic" class="connector blueEdge" d="M560 290 L1460 290"/></g>
  <g class="edge" data-edge="assert-topology" data-label="assert partition replicas and ISR"><rect class="label" x="610" y="326" width="625" height="34" rx="17"/><circle cx="632" cy="343" r="13" fill="#FFF" stroke="#4F86C6" stroke-width="2"/><text class="badge" x="632" y="348" text-anchor="middle">2</text><text class="msg" x="655" y="348">assert listeners, replicas, ISR, and min.insync.replicas</text><path data-connector="assert-topology" class="connector blueEdge" d="M560 370 L1460 370"/></g>
  <g class="edge" data-edge="prefix-produce" data-label="publish four prefix events"><rect class="label" x="930" y="406" width="400" height="34" rx="17"/><circle cx="952" cy="423" r="13" fill="#FFF" stroke="#6E8F4F" stroke-width="2"/><text class="badge" x="952" y="428" text-anchor="middle">3</text><text class="msg" x="975" y="428">prefix x4; await acks=all</text><path data-connector="prefix-produce" class="connector greenEdge" d="M860 450 L1460 450"/></g>
  <g class="edge" data-edge="assignment-callback" data-label="record assignment callback"><rect class="label" x="930" y="486" width="430" height="34" rx="17"/><circle cx="952" cy="503" r="13" fill="#FFF" stroke="#8065A8" stroke-width="2"/><text class="badge" x="952" y="508" text-anchor="middle">4</text><text class="msg" x="975" y="508">assignment callback + offsets ISR=3</text><path data-connector="assignment-callback" class="connector purpleEdge" d="M1460 530 L1160 530"/></g>

  <rect class="alt" x="95" y="555" width="1710" height="300" rx="18"/><text class="small" x="130" y="585">alt: broker fault branch</text><line class="divider" x1="130" y1="705" x2="1770" y2="705"/><text class="small" x="150" y="625">data-leader-failover</text><text class="small" x="150" y="752">else group-coordinator-failover</text>
  <g class="edge" data-edge="stop-leader" data-label="stop actual partition leader"><rect class="label" x="275" y="600" width="515" height="34" rx="17"/><circle cx="297" cy="617" r="13" fill="#FFF" stroke="#B86868" stroke-width="2"/><text class="badge" x="297" y="622" text-anchor="middle">5</text><text class="msg" x="320" y="622">stop actual P0 leader (fault-injected)</text><path data-connector="stop-leader" class="connector redEdge" d="M260 650 L1460 650"/></g>
  <g class="edge" data-edge="new-leader" data-label="observe leader on surviving ISR member"><rect class="label" x="635" y="665" width="610" height="34" rx="17"/><circle cx="657" cy="682" r="13" fill="#FFF" stroke="#6E8F4F" stroke-width="2"/><text class="badge" x="657" y="687" text-anchor="middle">6</text><text class="msg" x="680" y="687">new leader in pre-fault ISR within 15s</text><path data-connector="new-leader" class="connector greenEdge" d="M1460 700 L560 700"/></g>
  <g class="edge" data-edge="stop-coordinator" data-label="stop group coordinator broker"><rect class="label" x="270" y="726" width="555" height="34" rx="17"/><circle cx="292" cy="743" r="13" fill="#FFF" stroke="#9B7D54" stroke-width="2"/><text class="badge" x="292" y="748" text-anchor="middle">7</text><text class="msg" x="315" y="748">stop coordinator; keep selected data leader</text><path data-connector="stop-coordinator" class="connector amberEdge" d="M260 776 L1460 776"/></g>
  <g class="edge" data-edge="new-coordinator" data-label="observe coordinator and generation movement"><rect class="label" x="690" y="805" width="660" height="34" rx="17"/><circle cx="712" cy="822" r="13" fill="#FFF" stroke="#8065A8" stroke-width="2"/><text class="badge" x="712" y="827" text-anchor="middle">8</text><text class="msg" x="735" y="827">new coordinator + generation callback within 15s</text><path data-connector="new-coordinator" class="connector purpleEdge" d="M1460 846 L1160 846"/></g>

  <g class="edge" data-edge="suffix-produce" data-label="publish scenario suffix events"><rect class="label" x="825" y="885" width="520" height="34" rx="17"/><circle cx="847" cy="902" r="13" fill="#FFF" stroke="#6E8F4F" stroke-width="2"/><text class="badge" x="847" y="907" text-anchor="middle">9</text><text class="msg" x="870" y="907">suffix x4 or x2; same producer/group</text><path data-connector="suffix-produce" class="connector greenEdge" d="M860 930 L1460 930"/></g>
  <g class="edge" data-edge="replacement-isr" data-label="restart broker and await ISR restoration"><rect class="label" x="340" y="965" width="650" height="34" rx="17"/><circle cx="362" cy="982" r="13" fill="#FFF" stroke="#9B7D54" stroke-width="2"/><text class="badge" x="362" y="987" text-anchor="middle">10</text><text class="msg" x="385" y="987">restart replacement; await replicas=3 and ISR=3</text><path data-connector="replacement-isr" class="connector amberEdge" d="M260 1010 L1460 1010"/></g>
  <g class="edge" data-edge="records-callback" data-label="deliver records and callback state"><rect class="label" x="1015" y="1045" width="510" height="34" rx="17"/><circle cx="1037" cy="1062" r="13" fill="#FFF" stroke="#8065A8" stroke-width="2"/><text class="badge" x="1037" y="1067" text-anchor="middle">11</text><text class="msg" x="1060" y="1067">records + assignment/generation state</text><path data-connector="records-callback" class="connector purpleEdge" d="M1460 1090 L1160 1090"/></g>
  <g class="edge" data-edge="terminal-evidence" data-label="write sanitized terminal evidence"><rect class="label" x="1130" y="1125" width="600" height="34" rx="17"/><circle cx="1152" cy="1142" r="13" fill="#FFF" stroke="#2D948C" stroke-width="2"/><text class="badge" x="1152" y="1147" text-anchor="middle">12</text><text class="msg" x="1175" y="1147">terminal PASS: unique applied IDs, conflict=0</text><path data-connector="terminal-evidence" class="connector tealEdge" d="M1460 1170 L1730 1170"/></g>
  <text class="footer" x="950" y="1210" text-anchor="middle">Redelivery may raise rawDeliveryCount; appliedCount stays unique by logical identity. No raw provider body enters evidence.</text>
</svg>
