<svg xmlns="http://www.w3.org/2000/svg" width="920" height="420" viewBox="0 0 920 420" role="img" aria-label="Vert.x Coroutines Architecture">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%">
    <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#1f2937" flood-opacity="0.10"/>
  </filter>
  <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth">
    <path d="M1,1 L8,4.5 L1,8 Z" fill="#758297"/>
  </marker>
  <style>
    .canvas{fill:#f7f9fc}.frame{fill:#fff;stroke:#d8e0ea;stroke-width:1.5}
    .title{font-family:"Architects Daughter";font-size:38px;font-weight:400;fill:#102033}
    .subtitle{font-family:"Comic Mono";font-size:14px;font-weight:400;fill:#536273}
    .smallLabel{font-family:"Architects Daughter";font-size:21px;font-weight:400;fill:#102033}
    .mono{font-family:"Comic Mono";font-size:12px;font-weight:400;fill:#102033}
    .small{font-family:"Comic Mono";font-size:12px;font-weight:400;fill:#536273}
    .card{stroke-width:2.1;filter:url(#shadow)}
    .line{stroke:#758297;stroke-width:2.1;fill:none;marker-end:url(#arrow)}
  </style>
</defs>
<rect class="canvas" width="920" height="420"/>
<rect class="frame" x="24" y="20" width="872" height="376" rx="20"/>
<text class="title" x="48" y="66">Vert.x Coroutines Architecture</text>
<text class="subtitle" x="48" y="90">CoroutineVerticle · Router · suspendHandler · JDBCPool · coAwait</text>

<!-- Left: CoroutineVerticle -->
<rect class="card" x="48" y="108" width="244" height="240" rx="14" fill="#E8F3FF" stroke="#5B8DEF"/>
<text class="smallLabel" x="170" y="133" text-anchor="middle">CoroutineVerticle</text>
<line x1="48" y1="145" x2="292" y2="145" stroke="#5B8DEF" stroke-width="1"/>
<text class="mono" x="66" y="163" fill="#102033">suspend fun start()</text>
<text class="mono" x="66" y="181" fill="#102033">Router.router(vertx)</text>
<text class="mono" x="66" y="199" fill="#102033">route.suspendHandler {</text>
<text class="mono" x="66" y="215" fill="#102033">  ctx -&gt; pool.query()</text>
<text class="mono" x="66" y="231" fill="#102033">    .coAwait()</text>
<text class="mono" x="66" y="247" fill="#102033">}</text>
<text class="mono" x="66" y="271" fill="#102033">httpServer.listen(8888)</text>
<text class="mono" x="66" y="287" fill="#102033">  .coAwait()</text>
<text class="small" x="66" y="311" fill="#536273">MovieRatingVerticle</text>
<text class="small" x="66" y="327" fill="#536273">no blocking calls</text>

<!-- Arrow 1 -->
<path class="line" d="M294 196 L352 196"/>

<!-- Middle: HTTP Routes -->
<rect class="card" x="354" y="108" width="200" height="240" rx="14" fill="#EAF7EF" stroke="#58A978"/>
<text class="smallLabel" x="454" y="133" text-anchor="middle">HTTP Routes</text>
<line x1="354" y1="145" x2="554" y2="145" stroke="#58A978" stroke-width="1"/>
<text class="mono" x="372" y="166" fill="#102033">GET /movie/:id</text>
<text class="mono" x="372" y="186" fill="#102033">POST /rateMovie/:id</text>
<text class="mono" x="372" y="206" fill="#102033">GET /getRating/:id</text>
<text class="small" x="372" y="234" fill="#536273">suspendHandler</text>
<text class="small" x="372" y="250" fill="#536273">for each route</text>
<text class="small" x="372" y="274" fill="#536273">ctx.response()</text>
<text class="small" x="372" y="290" fill="#536273">  .end(json).coAwait()</text>
<text class="small" x="372" y="314" fill="#536273">BodyHandler.create()</text>
<text class="small" x="372" y="330" fill="#536273">  for POST routes</text>

<!-- Arrow 2 -->
<path class="line" d="M556 196 L614 196"/>

<!-- Right: JDBCPool -->
<rect class="card" x="616" y="108" width="256" height="240" rx="14" fill="#FFF3D9" stroke="#D6A441"/>
<text class="smallLabel" x="744" y="133" text-anchor="middle">JDBCPool (H2)</text>
<line x1="616" y1="145" x2="872" y2="145" stroke="#D6A441" stroke-width="1"/>
<text class="mono" x="634" y="166" fill="#102033">JDBCPool.pool(</text>
<text class="mono" x="634" y="182" fill="#102033">  vertx, connectOpts,</text>
<text class="mono" x="634" y="198" fill="#102033">  poolOptions)</text>
<text class="small" x="634" y="224" fill="#536273">preparedQuery(sql)</text>
<text class="small" x="634" y="240" fill="#536273">  .execute(params)</text>
<text class="small" x="634" y="256" fill="#536273">  .coAwait()</text>
<text class="small" x="634" y="276" fill="#536273">→ RowSet&lt;Row&gt;</text>
<text class="small" x="634" y="292" fill="#536273">  map to JsonObject</text>
<text class="small" x="634" y="316" fill="#536273">H2 in-process DB</text>
<text class="small" x="634" y="332" fill="#536273">(no Testcontainers)</text>

<!-- Bottom note -->
<rect class="card" x="48" y="360" width="824" height="32" rx="8" fill="#f1f5f9" stroke="#d8e0ea" filter="url(#shadow)"/>
<text class="small" x="460" y="381" text-anchor="middle" fill="#536273">coAwait() bridges Vert.x Future to Kotlin coroutine — no thread blocking</text>
</svg>
