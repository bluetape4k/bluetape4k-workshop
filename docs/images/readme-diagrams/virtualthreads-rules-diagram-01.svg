<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" role="img" aria-label="Virtual Threads Rules">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%">
    <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#1f2937" flood-opacity="0.10"/>
  </filter>
  <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth">
    <path d="M1,1 L8,4.5 L1,8 Z" fill="#758297"/>
  </marker>
  <style>
    .canvas{fill:#f7f9fc}.frame{fill:#fff;stroke:#d8e0ea;stroke-width:1.5}
    .title{font-family:"Architects Daughter";font-size:38px;font-weight:400;fill:#102033}
    .subtitle{font-family:"Comic Mono";font-size:14px;font-weight:400;fill:#536273}
    .smallLabel{font-family:"Architects Daughter";font-size:21px;font-weight:400;fill:#102033}
    .mono{font-family:"Comic Mono";font-size:12px;font-weight:400;fill:#102033}
    .small{font-family:"Comic Mono";font-size:12px;font-weight:400;fill:#536273}
    .card{stroke-width:2.1;filter:url(#shadow)}
    .line{stroke:#758297;stroke-width:2.1;fill:none;marker-end:url(#arrow)}
  </style>
</defs>
<rect class="canvas" width="960" height="440"/>
<rect class="frame" x="24" y="20" width="912" height="396" rx="20"/>
<text class="title" x="48" y="66">Virtual Threads Rules</text>
<text class="subtitle" x="48" y="90">Avoid synchronized · Use ReentrantLock · newVirtualThreadPerTaskExecutor · ScopedValue</text>

<!-- Rule 1: synchronized → ReentrantLock -->
<rect class="card" x="48" y="108" width="420" height="140" rx="14" fill="#FDECEF" stroke="#DC6B82"/>
<text class="smallLabel" x="258" y="133" text-anchor="middle">Rule 6: Avoid synchronized</text>
<line x1="48" y1="145" x2="468" y2="145" stroke="#DC6B82" stroke-width="1"/>
<text class="mono" x="68" y="165" fill="#a00000">// DO NOT use</text>
<text class="mono" x="68" y="181" fill="#a00000">synchronized(lock) { … }</text>
<text class="mono" x="68" y="201" fill="#102033">// USE instead</text>
<text class="mono" x="68" y="217" fill="#102033">val lock = ReentrantLock()</text>
<text class="mono" x="68" y="233" fill="#102033">lock.withLock { … }</text>

<!-- Rule 2: fixed pools → Virtual executors -->
<rect class="card" x="492" y="108" width="420" height="140" rx="14" fill="#EAF7EF" stroke="#58A978"/>
<text class="smallLabel" x="702" y="133" text-anchor="middle">Rule: Use Virtual Executors</text>
<line x1="492" y1="145" x2="912" y2="145" stroke="#58A978" stroke-width="1"/>
<text class="mono" x="512" y="165" fill="#a00000">// DO NOT use</text>
<text class="mono" x="512" y="181" fill="#a00000">Executors.newFixedThreadPool(n)</text>
<text class="mono" x="512" y="201" fill="#102033">// USE instead</text>
<text class="mono" x="512" y="217" fill="#102033">Executors</text>
<text class="mono" x="512" y="233" fill="#102033">  .newVirtualThreadPerTaskExecutor()</text>

<!-- Rule 3: ThreadLocal → ScopedValue -->
<rect class="card" x="48" y="264" width="420" height="120" rx="14" fill="#FFF3D9" stroke="#D6A441"/>
<text class="smallLabel" x="258" y="289" text-anchor="middle">Rule: ThreadLocal Caution</text>
<line x1="48" y1="301" x2="468" y2="301" stroke="#D6A441" stroke-width="1"/>
<text class="mono" x="68" y="321" fill="#a00000">// DO NOT leak state</text>
<text class="mono" x="68" y="337" fill="#a00000">ThreadLocal — millions of VTs</text>
<text class="mono" x="68" y="357" fill="#102033">// PREFER</text>
<text class="mono" x="68" y="373" fill="#102033">ScopedValue (JDK 21+)</text>

<!-- Rule 4: Structured Concurrency -->
<rect class="card" x="492" y="264" width="420" height="120" rx="14" fill="#E8F3FF" stroke="#5B8DEF"/>
<text class="smallLabel" x="702" y="289" text-anchor="middle">Structured Concurrency</text>
<line x1="492" y1="301" x2="912" y2="301" stroke="#5B8DEF" stroke-width="1"/>
<text class="mono" x="512" y="321" fill="#102033">StructuredTaskScope</text>
<text class="mono" x="512" y="337" fill="#102033">  .ShutdownOnFailure()</text>
<text class="mono" x="512" y="357" fill="#102033">scope.fork { task1 }</text>
<text class="mono" x="512" y="373" fill="#102033">scope.join() then results</text>

<!-- Bottom note -->
<rect class="card" x="48" y="396" width="864" height="30" rx="8" fill="#f1f5f9" stroke="#d8e0ea" filter="url(#shadow)"/>
<text class="small" x="480" y="417" text-anchor="middle" fill="#536273">Virtual threads mount/unmount on OS carrier threads — synchronized blocks pin the carrier thread</text>
</svg>
