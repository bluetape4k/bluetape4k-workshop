<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1740" viewBox="0 0 1800 1740" role="img" aria-labelledby="title desc">
  <title id="title">Order Lifecycle Split Fulfillment Sequence</title>
  <desc id="desc">An idempotent order submission commits aggregate state and publication rows in PostgreSQL. A deterministic provider succeeds, listeners commit inventory and split one line across two groups, the operator ships one group, cancels only the remaining group quantity, and observes separate cancellation and refund evidence through SSE.</desc>
  <defs>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="124%"><feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#64748B" flood-opacity="0.14"/></filter>
    <style>
      .title{font-family:"Architects Daughter";font-size:44px;fill:#263238}.subtitle,.msg,.footer,.note{font-family:"Comic Mono";fill:#36464F}.subtitle{font-size:17px}.participant{font-family:"Architects Daughter";font-size:19px;fill:#1F3138}.role{font-family:"Comic Mono";font-size:12px;fill:#546A73}.msg{font-size:13px}.footer{font-size:14px;fill:#60727D}.frame{fill:#FBFCF8;stroke:#41545D;stroke-width:3}.header{fill:#FFFFFF;stroke:#546E7A;stroke-width:2}.lifeline{stroke:#9AAAB1;stroke-width:2;stroke-dasharray:7 8;stroke-linecap:round}.activation{fill:#EAF6EF;stroke:#6F9278;stroke-width:1.5}.call,.return{fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.http{stroke:#4F86C6;marker-end:url(#seq-blue)}.db{stroke:#6E8F4F;marker-end:url(#seq-green)}.event{stroke:#9B7D54;marker-end:url(#seq-amber)}.warning{stroke:#B86868;marker-end:url(#seq-red)}.return{stroke:#2D948C;stroke-width:2.6;stroke-dasharray:8 6;marker-end:url(#seq-teal)}.label{fill:#FFFFFF;stroke:#D7E0E4;stroke-width:1.5}.blueLabel{stroke:#9CC2D1}.greenLabel{stroke:#B6C9A4}.amberLabel{stroke:#C8B38F}.redLabel{stroke:#D9ABAB}.tealLabel{stroke:#9DCBC6}.badge{stroke-width:1.8}.blueBadge{fill:#EAF4F8;stroke:#4F86C6}.greenBadge{fill:#EEF7F0;stroke:#6E8F4F}.amberBadge{fill:#FFF7E8;stroke:#9B7D54}.redBadge{fill:#FFF0F0;stroke:#B86868}.tealBadge{fill:#EBFAF8;stroke:#2D948C}.badgeText{font-family:"Comic Mono";font-size:12px;font-weight:700}.blueText{fill:#2F6F8E}.greenText{fill:#55783F}.amberText{fill:#7F6038}.redText{fill:#9D4F4F}.tealText{fill:#247C75}.alt{fill:none;stroke:#D08A39;stroke-width:2.2;stroke-dasharray:12 8}.branch{fill:#FFFFFF;stroke:#D08A39;stroke-width:1.6}.branchText{font-family:"Architects Daughter";font-size:18px;fill:#8A5A22}.noteBox{fill:#FFF0F0;stroke:#B86868;stroke-width:1.7}.note{font-size:13px;fill:#8D4C4C}
    </style>
    <marker id="seq-blue" viewBox="0 0 10 10" markerWidth="16" markerHeight="16" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse" data-role="sequence" data-tip-direction="positive-x"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#4F86C6" stroke="#4F86C6" stroke-dasharray="none" style="stroke-dasharray:none"/></marker>
    <marker id="seq-green" viewBox="0 0 10 10" markerWidth="16" markerHeight="16" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse" data-role="sequence" data-tip-direction="positive-x"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#6E8F4F" stroke="#6E8F4F" stroke-dasharray="none" style="stroke-dasharray:none"/></marker>
    <marker id="seq-amber" viewBox="0 0 10 10" markerWidth="16" markerHeight="16" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse" data-role="sequence" data-tip-direction="positive-x"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#9B7D54" stroke="#9B7D54" stroke-dasharray="none" style="stroke-dasharray:none"/></marker>
    <marker id="seq-red" viewBox="0 0 10 10" markerWidth="16" markerHeight="16" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse" data-role="sequence" data-tip-direction="positive-x"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#B86868" stroke="#B86868" stroke-dasharray="none" style="stroke-dasharray:none"/></marker>
    <marker id="seq-teal" viewBox="0 0 10 10" markerWidth="16" markerHeight="16" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse" data-role="sequence" data-tip-direction="positive-x"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#2D948C" stroke="#2D948C" stroke-dasharray="none" style="stroke-dasharray:none"/></marker>
  </defs>
  <rect x="24" y="24" width="1752" height="1692" rx="20" class="frame"/>
  <text x="900" y="76" text-anchor="middle" class="title">Order Lifecycle Split Fulfillment Sequence</text>
  <text x="900" y="108" text-anchor="middle" class="subtitle">One durable submission becomes two fulfillment groups; only the unshipped quantity is cancelled and refunded.</text>

  <g filter="url(#shadow)"><rect x="55" y="150" width="250" height="74" rx="10" class="header"/><text x="180" y="180" text-anchor="middle" class="participant">Browser / Test</text><text x="180" y="204" text-anchor="middle" class="role">operator and live client</text></g>
  <g filter="url(#shadow)"><rect x="395" y="150" width="250" height="74" rx="10" class="header"/><text x="520" y="180" text-anchor="middle" class="participant">MVC API</text><text x="520" y="204" text-anchor="middle" class="role">idempotency + commands</text></g>
  <g filter="url(#shadow)"><rect x="735" y="150" width="250" height="74" rx="10" class="header"/><text x="860" y="180" text-anchor="middle" class="participant">PostgreSQL</text><text x="860" y="204" text-anchor="middle" class="role">authoritative evidence</text></g>
  <g filter="url(#shadow)"><rect x="1075" y="150" width="250" height="74" rx="10" class="header"/><text x="1200" y="180" text-anchor="middle" class="participant">Modulith + Provider</text><text x="1200" y="204" text-anchor="middle" class="role">durable async boundary</text></g>
  <g filter="url(#shadow)"><rect x="1415" y="150" width="250" height="74" rx="10" class="header"/><text x="1540" y="180" text-anchor="middle" class="participant">Lifecycle listeners</text><text x="1540" y="204" text-anchor="middle" class="role">inventory / refund</text></g>

  <line x1="180" y1="224" x2="180" y2="1645" class="lifeline"/>
  <line x1="520" y1="224" x2="520" y2="1645" class="lifeline"/>
  <line x1="860" y1="224" x2="860" y2="1645" class="lifeline"/>
  <line x1="1200" y1="224" x2="1200" y2="1645" class="lifeline"/>
  <line x1="1540" y1="224" x2="1540" y2="1645" class="lifeline"/>
  <rect class="activation" x="512" y="286" width="16" height="730" rx="6"/>
  <rect class="activation" x="852" y="366" width="16" height="1180" rx="6"/>
  <rect class="activation" x="1192" y="626" width="16" height="190" rx="6"/>
  <rect class="activation" x="1532" y="806" width="16" height="690" rx="6"/>

  <rect x="220" y="258" width="270" height="34" rx="17" class="label labelPill blueLabel"/><circle cx="244" cy="275" r="13" class="badge blueBadge"/><text x="244" y="280" text-anchor="middle" class="badgeText num blueText">1</text><text x="268" y="280" class="msg blueText">POST /orders + idempotency key</text><path data-connector="seq-1" d="M 180 300 L 520 300" class="call http"/>
  <rect x="560" y="348" width="300" height="34" rx="17" class="label labelPill greenLabel"/><circle cx="584" cy="365" r="13" class="badge greenBadge"/><text x="584" y="370" text-anchor="middle" class="badgeText num greenText">2</text><text x="608" y="370" class="msg greenText">acquire + save states + publication</text><path data-connector="seq-2" d="M 520 390 L 860 390" class="call db"/>
  <rect x="560" y="438" width="250" height="34" rx="17" class="label labelPill tealLabel"/><circle cx="584" cy="455" r="13" class="badge tealBadge"/><text x="584" y="460" text-anchor="middle" class="badgeText num tealText">3</text><text x="608" y="460" class="msg tealText">single transaction commit</text><path data-connector="seq-3" d="M 860 480 L 520 480" class="return"/>
  <rect x="220" y="518" width="240" height="34" rx="17" class="label labelPill tealLabel"/><circle cx="244" cy="535" r="13" class="badge tealBadge"/><text x="244" y="540" text-anchor="middle" class="badgeText num tealText">4</text><text x="268" y="540" class="msg tealText">201 Created; replay-safe</text><path data-connector="seq-4" d="M 520 560 L 180 560" class="return"/>
  <rect x="900" y="608" width="270" height="34" rx="17" class="label labelPill amberLabel"/><circle cx="924" cy="625" r="13" class="badge amberBadge"/><text x="924" y="630" text-anchor="middle" class="badgeText num amberText">5</text><text x="948" y="630" class="msg amberText">after commit: OrderSubmitted</text><path data-connector="seq-5" d="M 860 650 L 1200 650" class="call event"/>
  <rect x="900" y="698" width="280" height="34" rx="17" class="label labelPill greenLabel"/><circle cx="924" cy="715" r="13" class="badge greenBadge"/><text x="924" y="720" text-anchor="middle" class="badgeText num greenText">6</text><text x="948" y="720" class="msg greenText">provider inbox: APPLIED</text><path data-connector="seq-6" d="M 1200 740 L 860 740" class="call db"/>
  <rect x="1050" y="788" width="390" height="34" rx="17" class="label labelPill amberLabel"/><circle cx="1074" cy="805" r="13" class="badge amberBadge"/><text x="1074" y="810" text-anchor="middle" class="badgeText num amberText">7</text><text x="1098" y="810" class="msg amberText">deliver PaymentSucceeded</text><path data-connector="seq-7" d="M 860 830 L 1540 830" class="call event"/>
  <rect x="1040" y="878" width="430" height="34" rx="17" class="label labelPill greenLabel"/><circle cx="1064" cy="895" r="13" class="badge greenBadge"/><text x="1064" y="900" text-anchor="middle" class="badgeText num greenText">8</text><text x="1088" y="900" class="msg greenText">commit inventory + split sku-beta across GROUP-1 / GROUP-2</text><path data-connector="seq-8" d="M 1540 920 L 860 920" class="call db"/>
  <rect x="220" y="958" width="290" height="34" rx="17" class="label labelPill tealLabel"/><circle cx="244" cy="975" r="13" class="badge tealBadge"/><text x="244" y="980" text-anchor="middle" class="badgeText num tealText">9</text><text x="268" y="980" class="msg tealText">snapshot: 2 groups + 3 links</text><path data-connector="seq-9" d="M 520 1000 L 180 1000" class="return"/>

  <rect x="74" y="1050" width="1652" height="580" rx="18" class="alt"/>
  <rect x="110" y="1034" width="250" height="32" rx="16" class="branch"/><text x="235" y="1056" text-anchor="middle" class="branchText">partial shipment branch</text>
  <rect x="220" y="1088" width="250" height="34" rx="17" class="label labelPill blueLabel"/><circle cx="244" cy="1105" r="13" class="badge blueBadge"/><text x="244" y="1110" text-anchor="middle" class="badgeText num blueText">10</text><text x="268" y="1110" class="msg blueText">advance GROUP-1 to SHIPPED</text><path data-connector="seq-10" d="M 180 1130 L 520 1130" class="call http"/>
  <rect x="560" y="1168" width="270" height="34" rx="17" class="label labelPill greenLabel"/><circle cx="584" cy="1185" r="13" class="badge greenBadge"/><text x="584" y="1190" text-anchor="middle" class="badgeText num greenText">11</text><text x="608" y="1190" class="msg greenText">persist SHIPPED + revision</text><path data-connector="seq-11" d="M 520 1210 L 860 1210" class="call db"/>
  <rect x="220" y="1248" width="270" height="34" rx="17" class="label labelPill redLabel"/><circle cx="244" cy="1265" r="13" class="badge redBadge"/><text x="244" y="1270" text-anchor="middle" class="badgeText num redText">12</text><text x="268" y="1270" class="msg redText">cancel 1 unit of sku-beta</text><path data-connector="seq-12" d="M 180 1290 L 520 1290" class="call warning"/>
  <rect x="550" y="1328" width="310" height="34" rx="17" class="label labelPill redLabel"/><circle cx="574" cy="1345" r="13" class="badge redBadge"/><text x="574" y="1350" text-anchor="middle" class="badgeText num redText">13</text><text x="598" y="1350" class="msg redText">reduce GROUP-2 only; save cases</text><path data-connector="seq-13" d="M 520 1370 L 860 1370" class="call warning"/>
  <rect x="1050" y="1408" width="300" height="34" rx="17" class="label labelPill amberLabel"/><circle cx="1074" cy="1425" r="13" class="badge amberBadge"/><text x="1074" y="1430" text-anchor="middle" class="badgeText num amberText">14</text><text x="1098" y="1430" class="msg amberText">deliver RefundRequested</text><path data-connector="seq-14" d="M 860 1450 L 1540 1450" class="call event"/>
  <rect x="1050" y="1488" width="360" height="34" rx="17" class="label labelPill greenLabel"/><circle cx="1074" cy="1505" r="13" class="badge greenBadge"/><text x="1074" y="1510" text-anchor="middle" class="badgeText num greenText">15</text><text x="1098" y="1510" class="msg greenText">refund SUCCEEDED + separate audit</text><path data-connector="seq-15" d="M 1540 1530 L 860 1530" class="call db"/>
  <rect x="220" y="1568" width="270" height="34" rx="17" class="label labelPill tealLabel"/><circle cx="244" cy="1585" r="13" class="badge tealBadge"/><text x="244" y="1590" text-anchor="middle" class="badgeText num tealText">16</text><text x="268" y="1590" class="msg tealText">SSE audit cursor refresh</text><path data-connector="seq-16" d="M 520 1610 L 180 1610" class="return"/>

  <rect x="220" y="1650" width="1360" height="38" rx="12" class="noteBox"/>
  <text x="900" y="1675" text-anchor="middle" class="note">bluetape4k-logging records disposition, revision, replay, cancellation, refund, and SSE lifecycle; raw keys and payloads stay out.</text>
  <text x="900" y="1704" text-anchor="middle" class="footer">Duplicate and out-of-order provider events do not reapply terminal state; conflicting payloads remain visible as unresolved PostgreSQL evidence.</text>
</svg>
