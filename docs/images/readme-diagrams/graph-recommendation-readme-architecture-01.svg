  <rect class="canvas" width="1689.6" height="900"/>
  <rect class="frame" x="23.04" y="18" width="1643.52" height="864" rx="24"/>
  <text class="title" x="844.8" y="58" text-anchor="middle">graph-recommendation</text>
  <text class="subtitle" x="844.8" y="84" text-anchor="middle">Social commerce recommendation graph with product and follow recommendations</text>

  <rect x="69.12" y="112" width="1551.36" height="140" rx="20" fill="#EAF3FF" stroke="#9DB9D8" stroke-width="1.92"/>
  <text class="layerTitle" x="112.64" y="146">Entry points</text>
  <text class="layerNote" x="112.64" y="170">Blocking and coroutine tests</text>
  <g filter="url(#shadow)">
    <rect x="409.6" y="142" width="366.08" height="78" rx="12" fill="#FFFFFF" stroke="#8EA9C2" stroke-width="1.92"/>
    <text class="cardTitle" x="592.64" y="172" text-anchor="middle">RecommendationService</text>
    <text class="cardText" x="592.64" y="196" text-anchor="middle">blocking API</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="913.92" y="142" width="366.08" height="78" rx="12" fill="#FFFFFF" stroke="#8EA9C2" stroke-width="1.92"/>
