    <text class="cardText" x="1096.96" y="196" text-anchor="middle">suspend API</text>
  </g>

  <rect x="69.12" y="284" width="1551.36" height="184" rx="20" fill="#EAF8F0" stroke="#93C5A7" stroke-width="1.92"/>
  <text class="layerTitle" x="112.64" y="318">Recommendation operations</text>
  <g filter="url(#shadow)">
    <rect x="148.48" y="372" width="345.6" height="70" rx="12" fill="#FFFFFF" stroke="#86B89B" stroke-width="1.92"/>
    <text class="cardTitle" x="321.28" y="400" text-anchor="middle">Graph mutators</text>
    <text class="cardText" x="321.28" y="424" text-anchor="middle">addUser, addProduct, purchase, follow</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="670.72" y="360" width="345.6" height="94" rx="12" fill="#F7FFF9" stroke="#86B89B" stroke-width="1.92"/>
    <text class="cardTitle" x="843.52" y="390" text-anchor="middle">Product recommendations</text>
    <text class="cardText" x="843.52" y="416" text-anchor="middle">co-buyers and candidate products</text>
    <text class="cardText" x="843.52" y="437" text-anchor="middle">score by distinct co-buyer count</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="1192.96" y="360" width="345.6" height="94" rx="12" fill="#F7FFF9" stroke="#86B89B" stroke-width="1.92"/>
    <text class="cardTitle" x="1365.76" y="390" text-anchor="middle">Follow recommendations</text>
    <text class="cardText" x="1365.76" y="416" text-anchor="middle">2-hop FOLLOWS traversal</text>
    <text class="cardText" x="1365.76" y="437" text-anchor="middle">score by mutual follows</text>
  </g>

  <rect x="69.12" y="500" width="1551.36" height="156" rx="20" fill="#FFF7E8" stroke="#D8B86E" stroke-width="1.92"/>
  <text class="layerTitle" x="112.64" y="534">Typed schema</text>
  <g filter="url(#shadow)">
    <rect x="340.48" y="560" width="320" height="68" rx="12" fill="#FFFFFF" stroke="#C99A35" stroke-width="1.92"/>
    <text class="cardTitle" x="500.48" y="587" text-anchor="middle">User</text>
    <text class="cardText" x="500.48" y="611" text-anchor="middle">userId, name</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="1031.68" y="560" width="320" height="68" rx="12" fill="#FFFFFF" stroke="#C99A35" stroke-width="1.92"/>
    <text class="cardTitle" x="1191.68" y="587" text-anchor="middle">Product</text>
    <text class="cardText" x="1191.68" y="611" text-anchor="middle">productId, name, category</text>
  </g>

  <rect x="69.12" y="688" width="1551.36" height="132" rx="20" fill="#F2F5F8" stroke="#B3BFCA" stroke-width="1.92"/>
  <text class="layerTitle" x="112.64" y="722">Graph runtime backends</text>
  <g filter="url(#shadow)">
    <rect x="366.08" y="728" width="281.6" height="64" rx="12" fill="#FFFFFF" stroke="#A7B3BF" stroke-width="1.92"/>
    <use href="#graphDbIcon" x="391.68" y="741"/>
    <text class="cardTitle" x="532.48" y="756" text-anchor="middle">TinkerGraph</text>
    <text class="cardText" x="532.48" y="780" text-anchor="middle">test, no Docker</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="706.56" y="728" width="281.6" height="64" rx="12" fill="#FFFFFF" stroke="#A7B3BF" stroke-width="1.92"/>
    <use href="#graphDbIcon" x="732.16" y="741"/>
    <text class="cardTitle" x="872.96" y="756" text-anchor="middle">Neo4j</text>
    <text class="cardText" x="872.96" y="780" text-anchor="middle">integrationTest</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="1047.04" y="728" width="281.6" height="64" rx="12" fill="#FFFFFF" stroke="#A7B3BF" stroke-width="1.92"/>
    <use href="#graphDbIcon" x="1072.64" y="741"/>
    <text class="cardTitle" x="1213.44" y="756" text-anchor="middle">Memgraph</text>
    <text class="cardText" x="1213.44" y="780" text-anchor="middle">integrationTest</text>
  </g>

