<svg xmlns="http://www.w3.org/2000/svg" width="960" height="500" viewBox="0 0 960 500" role="img" aria-label="Kotlin Coroutines Architecture">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#1f2937" flood-opacity="0.10"/></filter>
  <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth">
    <path d="M1,1 L8,4.5 L1,8 Z" fill="#758297"/>
  </marker>
  <style>
    .canvas{fill:#f7f9fc}.frame{fill:#fff;stroke:#d8e0ea;stroke-width:1.5}
    .title{font-family:"Architects Daughter";font-size:38px;font-weight:400;fill:#102033}
    .subtitle{font-family:"Comic Mono";font-size:14px;font-weight:400;fill:#536273}
    .smallLabel{font-family:"Architects Daughter";font-size:21px;font-weight:400;fill:#102033}
    .mono{font-family:"Comic Mono";font-size:12px;font-weight:400;fill:#102033}
    .small{font-family:"Comic Mono";font-size:12px;font-weight:400;fill:#536273}
    .card{stroke-width:2.1;filter:url(#shadow)}
    .line{stroke:#758297;stroke-width:2.1;fill:none;marker-end:url(#arrow)}
  </style>
</defs>
<!-- Layout:
     Canvas: 960×500  Frame: x=24 y=20 w=912 h=456
     Row1  y=98   h=54  CoroutineScope (center x=238 w=484 cx=480)
     Row2  y=212  h=80  3 cols: Builders | Dispatchers | Flow/Channel
       Col1: x=24  w=280 cx=164
       Col2: x=344 w=272 cx=480
       Col3: x=656 w=280 cx=796
     Row3  y=352  h=90  Structured Concurrency (full width)
-->
<rect class="canvas" width="960" height="500"/>
<rect class="frame" x="24" y="20" width="912" height="456" rx="28"/>
<text class="title" x="58" y="66">Kotlin Coroutines Architecture</text>
<text class="subtitle" x="58" y="92">CoroutineScope · Builders · Dispatchers · Flow · Channel · bluetape4k-coroutines</text>

<!-- Arrows from CoroutineScope to 3 cols -->
<path class="line" d="M480 152 L480 177 L164 177 L164 212"/>
<path class="line" d="M480 152 L480 212"/>
<path class="line" d="M480 152 L480 177 L796 177 L796 212"/>
<!-- 3 cols → Structured Concurrency -->
<path class="line" d="M164 292 L164 322 L480 322 L480 352"/>
<path class="line" d="M480 292 L480 352"/>
<path class="line" d="M796 292 L796 322 L480 322 L480 352"/>

<!-- CoroutineScope -->
<g transform="translate(238,98)">
  <rect class="card" x="0" y="0" width="484" height="54" rx="12" fill="#EAF7EF" stroke="#58A978"/>
  <text class="smallLabel" x="242" y="22" text-anchor="middle">CoroutineScope</text>
  <text class="small" x="242" y="42" text-anchor="middle">coroutineScope { }  ·  supervisorScope { }  ·  viewModelScope  ·  lifecycleScope</text>
</g>

<!-- Coroutine Builders  col1 -->
<g transform="translate(24,212)">
  <rect class="card" x="0" y="0" width="280" height="80" rx="12" fill="#E8F3FF" stroke="#5B8DEF"/>
  <text class="smallLabel" x="140" y="22" text-anchor="middle">Coroutine Builders</text>
  <text class="mono" x="140" y="44" text-anchor="middle">launch { } → Job</text>
  <text class="mono" x="140" y="64" text-anchor="middle">async { } → Deferred&lt;T&gt;</text>
</g>

<!-- Dispatchers  col2 -->
<g transform="translate(344,212)">
  <rect class="card" x="0" y="0" width="272" height="80" rx="12" fill="#FFF3D9" stroke="#D6A441"/>
  <text class="smallLabel" x="136" y="22" text-anchor="middle">Dispatchers</text>
  <text class="small" x="136" y="44" text-anchor="middle">Default (CPU) · IO (blocking)</text>
  <text class="small" x="136" y="64" text-anchor="middle">Main (UI) · VirtualThread</text>
</g>

<!-- Flow / Channel  col3 -->
<g transform="translate(656,212)">
  <rect class="card" x="0" y="0" width="280" height="80" rx="12" fill="#F1ECFF" stroke="#8A72D6"/>
  <text class="smallLabel" x="140" y="22" text-anchor="middle">Flow / Channel</text>
  <text class="small" x="140" y="44" text-anchor="middle">Flow (cold) · SharedFlow (hot)</text>
  <text class="small" x="140" y="64" text-anchor="middle">StateFlow · Channel (producer-consumer)</text>
</g>

<!-- Structured Concurrency (full width bottom) -->
<g transform="translate(24,352)">
  <rect class="card" x="0" y="0" width="912" height="90" rx="12" fill="#E9F7F6" stroke="#45A7A1"/>
  <text class="smallLabel" x="456" y="22" text-anchor="middle">Structured Concurrency · bluetape4k-coroutines</text>
  <text class="mono" x="456" y="44" text-anchor="middle">withContext(Dispatcher) · CancellationException must rethrow · runSuspendTest { } for JUnit5</text>
  <text class="small" x="456" y="66" text-anchor="middle">PropertyCoroutineContext · KLoggingChannel · Flow&lt;T&gt;.log() · MDCContext</text>
  <text class="small" x="456" y="82" text-anchor="middle">Turbine for Flow testing · assertResult { } · suspendLogging { }</text>
</g>
</svg>
