<svg xmlns="http://www.w3.org/2000/svg" width="1480" height="920" viewBox="0 0 1480 920">
<rect width="1480" height="920" fill="#FBFCF8"/>
<defs>
<style><![CDATA[
text{font-family:"Architects Daughter","Comic Mono";fill:#263238}.title{font-size:36px;font-weight:700}.subtitle{font-size:16px;font-weight:700;fill:#41545D}.participant{font-size:17px;font-weight:700}.role{font-size:12px;fill:#60727D}.frame{fill:none;stroke:#36464F;stroke-width:2.4;rx:22}.box{fill:#FFFFFF;stroke:#546A73;stroke-width:2;rx:10}.lifeline{stroke:#9AAAB1;stroke-width:2;stroke-dasharray:8 9}.activation{fill:#EEF7F0;stroke:#6E8F4F;stroke-width:1.4;rx:5}.labelPill{fill:#FFFFFF;stroke-width:1.5;rx:18}.numCircle{fill:#FFFFFF;stroke-width:1.8}.message{font-size:13px;font-weight:700}.callText{fill:#2F6F8E}.successText{fill:#55783F}.returnText{fill:#247F7D}.rejectText{fill:#9D4F4F}.fallbackText{fill:#7F6038}.noteText{font-size:12px;font-weight:700;fill:#60727D}.call{stroke:#2F6F8E;stroke-width:3.4;fill:none;stroke-linecap:round}.success{stroke:#55783F;stroke-width:3.4;fill:none;stroke-linecap:round}.return{stroke:#247F7D;stroke-width:3.4;fill:none;stroke-linecap:round;stroke-dasharray:10 8}.reject{stroke:#9D4F4F;stroke-width:3.4;fill:none;stroke-linecap:round}.fallback{stroke:#7F6038;stroke-width:3.4;fill:none;stroke-linecap:round;stroke-dasharray:10 8}.alt{fill:none;stroke:#7F6038;stroke-width:2;stroke-dasharray:9 8;rx:18}.branchDivider{stroke:#7F6038;stroke-width:1.4;stroke-dasharray:7 8}.branchHeader{fill:#FFF7E8;stroke:#9B7D54;stroke-width:1.4;rx:14}.foot{fill:#FFFFFF;stroke:#CCD7DA;stroke-width:1.5;rx:10}
]]></style>
<marker id="seqArrow-blue" viewBox="0 0 10 10" markerWidth="16" markerHeight="16" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse" data-role="sequence" data-tip-direction="positive-x"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#2F6F8E" stroke="#2F6F8E" stroke-dasharray="none" style="stroke-dasharray:none" stroke-width="0"/></marker>
<marker id="seqArrow-green" viewBox="0 0 10 10" markerWidth="16" markerHeight="16" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse" data-role="sequence" data-tip-direction="positive-x"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#55783F" stroke="#55783F" stroke-dasharray="none" style="stroke-dasharray:none" stroke-width="0"/></marker>
<marker id="seqArrow-teal" viewBox="0 0 10 10" markerWidth="16" markerHeight="16" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse" data-role="sequence" data-tip-direction="positive-x"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#247F7D" stroke="#247F7D" stroke-dasharray="none" style="stroke-dasharray:none" stroke-width="0"/></marker>
<marker id="seqArrow-red" viewBox="0 0 10 10" markerWidth="16" markerHeight="16" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse" data-role="sequence" data-tip-direction="positive-x"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#9D4F4F" stroke="#9D4F4F" stroke-dasharray="none" style="stroke-dasharray:none" stroke-width="0"/></marker>
<marker id="seqArrow-brown" viewBox="0 0 10 10" markerWidth="16" markerHeight="16" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#7F6038" stroke="#7F6038" stroke-dasharray="none" style="stroke-dasharray:none"/></marker>
</defs>
<rect class="frame" x="24" y="24" width="1432" height="872"/>
<text class="title" x="740" y="74" text-anchor="middle">Profile Upload Moderation Sequence</text>
<text class="subtitle" x="740" y="106" text-anchor="middle">A pending blurred image is returned immediately; moderation later chooses public approval or default fallback.</text>
<g data-participant="client"><rect class="box" x="80" y="150" width="220" height="76"/><text class="participant" x="190" y="184" text-anchor="middle">Client</text><text class="role" x="190" y="207" text-anchor="middle">multipart caller</text><line class="lifeline" x1="190" y1="226" x2="190" y2="804"/><rect class="activation" x="182" y="270" width="16" height="530"/></g>
<g data-participant="api"><rect class="box" x="370" y="150" width="220" height="76"/><text class="participant" x="480" y="184" text-anchor="middle">API Service</text><text class="role" x="480" y="207" text-anchor="middle">controller + service</text><line class="lifeline" x1="480" y1="226" x2="480" y2="804"/><rect class="activation" x="472" y="270" width="16" height="530"/></g>
<g data-participant="storage"><rect class="box" x="660" y="150" width="220" height="76"/><text class="participant" x="770" y="184" text-anchor="middle">Storage</text><text class="role" x="770" y="207" text-anchor="middle">private / pending / public</text><line class="lifeline" x1="770" y1="226" x2="770" y2="804"/><rect class="activation" x="762" y="324" width="16" height="280"/></g>
<g data-participant="moderator"><rect class="box" x="950" y="150" width="220" height="76"/><text class="participant" x="1060" y="184" text-anchor="middle">Moderation Adapter</text><text class="role" x="1060" y="207" text-anchor="middle">policy provider</text><line class="lifeline" x1="1060" y1="226" x2="1060" y2="804"/><rect class="activation" x="1052" y="378" width="16" height="198"/></g>
<g data-participant="view"><rect class="box" x="1240" y="150" width="180" height="76"/><text class="participant" x="1330" y="184" text-anchor="middle">Profile View</text><text class="role" x="1330" y="207" text-anchor="middle">effective URL</text><line class="lifeline" x1="1330" y1="226" x2="1330" y2="804"/><rect class="activation" x="1322" y="556" width="16" height="168"/></g>
<path class="call" data-connector="seq-upload" d="M190 284 L480 284" marker-end="url(#seqArrow-blue)"/><rect class="labelPill" x="210" y="246" width="250" height="30" stroke="#2F6F8E"/><circle class="numCircle" cx="234" cy="261" r="14" stroke="#2F6F8E"/><text class="num callText" x="234" y="266" text-anchor="middle">1</text><text class="message callText" x="260" y="266">Upload multipart</text>
<path class="call" data-connector="seq-store" d="M480 338 L770 338" marker-end="url(#seqArrow-blue)"/><rect class="labelPill" x="505" y="300" width="260" height="30" stroke="#2F6F8E"/><circle class="numCircle" cx="529" cy="315" r="14" stroke="#2F6F8E"/><text class="num callText" x="529" y="320" text-anchor="middle">2</text><text class="message callText" x="555" y="320">Store private + blurred</text>
<path class="call" data-connector="seq-schedule" d="M480 392 L1060 392" marker-end="url(#seqArrow-blue)"/><rect class="labelPill" x="622" y="354" width="276" height="30" stroke="#2F6F8E"/><circle class="numCircle" cx="646" cy="369" r="14" stroke="#2F6F8E"/><text class="num callText" x="646" y="374" text-anchor="middle">3</text><text class="message callText" x="672" y="374">Schedule moderation</text>
<path class="return" data-connector="seq-pending" d="M480 446 L190 446" marker-end="url(#seqArrow-teal)"/><rect class="labelPill" x="210" y="408" width="260" height="30" stroke="#247F7D"/><circle class="numCircle" cx="234" cy="423" r="14" stroke="#247F7D"/><text class="num returnText" x="234" y="428" text-anchor="middle">4</text><text class="message returnText" x="260" y="428">202 pending blur URL</text>
<path class="success" data-connector="seq-decision" d="M1060 500 L480 500" marker-end="url(#seqArrow-green)"/><rect class="labelPill" x="662" y="462" width="220" height="30" stroke="#55783F"/><circle class="numCircle" cx="686" cy="477" r="14" stroke="#55783F"/><text class="num successText" x="686" y="482" text-anchor="middle">5</text><text class="message successText" x="712" y="482">Decision result</text>
<rect class="alt" x="582" y="528" width="810" height="150" fill="none"/><rect class="branchHeader" x="612" y="510" width="214" height="30"/><text class="message fallbackText" x="636" y="531">alt moderation outcome</text><line class="branchDivider" x1="604" y1="604" x2="1370" y2="604"/>
<path class="success" data-connector="seq-approved" d="M480 570 L1330 570" marker-end="url(#seqArrow-green)"/><rect class="labelPill" x="820" y="532" width="290" height="30" stroke="#55783F"/><circle class="numCircle" cx="844" cy="547" r="14" stroke="#55783F"/><text class="num successText" x="844" y="552" text-anchor="middle">6</text><text class="message successText" x="870" y="552">approved: public URL</text>
<path class="reject" data-connector="seq-rejected" d="M480 644 L1330 644" marker-end="url(#seqArrow-red)"/><rect class="labelPill" x="812" y="606" width="334" height="30" stroke="#9D4F4F"/><circle class="numCircle" cx="836" cy="621" r="14" stroke="#9D4F4F"/><text class="num rejectText" x="836" y="626" text-anchor="middle">7</text><text class="message rejectText" x="862" y="626">rejected/failed: default URL</text>
<path class="call" data-connector="seq-poll" d="M190 724 L480 724" marker-end="url(#seqArrow-blue)"/><rect class="labelPill" x="210" y="686" width="250" height="30" stroke="#2F6F8E"/><circle class="numCircle" cx="234" cy="701" r="14" stroke="#2F6F8E"/><text class="num callText" x="234" y="706" text-anchor="middle">8</text><text class="message callText" x="260" y="706">Poll profile image</text>
<path class="return" data-connector="seq-effective" d="M480 778 L190 778" marker-end="url(#seqArrow-teal)"/><rect class="labelPill" x="210" y="740" width="286" height="30" stroke="#247F7D"/><circle class="numCircle" cx="234" cy="755" r="14" stroke="#247F7D"/><text class="num returnText" x="234" y="760" text-anchor="middle">9</text><text class="message returnText" x="260" y="760">Effective URL response</text>
<rect class="foot" x="96" y="836" width="1288" height="42"/><text class="noteText" x="740" y="862" text-anchor="middle">Reader contract: private originals never become public; pending blur is temporary; rejected or failed moderation returns the default image.</text>
</svg>
