<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" role="img" aria-label="API Gateway Architecture">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#1f2937" flood-opacity="0.10"/></filter>
  <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth">
    <path d="M1,1 L8,4.5 L1,8 Z" fill="#758297"/>
  </marker>
  <style>
    .canvas{fill:#f7f9fc}.frame{fill:#fff;stroke:#d8e0ea;stroke-width:1.5}
    .title{font-family:"Architects Daughter";font-size:38px;font-weight:400;fill:#102033}
    .subtitle{font-family:"Comic Mono";font-size:14px;font-weight:400;fill:#536273}
    .smallLabel{font-family:"Architects Daughter";font-size:21px;font-weight:400;fill:#102033}
    .mono{font-family:"Comic Mono";font-size:12px;font-weight:400;fill:#102033}
    .small{font-family:"Comic Mono";font-size:12px;font-weight:400;fill:#536273}
    .card{stroke-width:2.1;filter:url(#shadow)}
    .line{stroke:#758297;stroke-width:2.1;fill:none;marker-end:url(#arrow)}
  </style>
</defs>
<rect class="canvas" width="960" height="440"/>
<rect class="frame" x="24" y="20" width="912" height="396" rx="18"/>
<text class="title" x="44" y="66">API Gateway Architecture</text>
<text class="subtitle" x="44" y="90">/customers/** → CustomerService · /orders/** → OrderService · Bucket4j rate limiting</text>

<!-- Client -->
<g transform="translate(44,110)">
  <rect class="card" x="0" y="0" width="160" height="80" rx="10" fill="#E8F3FF" stroke="#5B8DEF"/>
  <text class="smallLabel" x="80" y="30" text-anchor="middle">HTTP Client</text>
  <text class="small" x="80" y="52" text-anchor="middle">REST requests</text>
  <text class="small" x="80" y="68" text-anchor="middle">:8080</text>
</g>

<!-- API Gateway -->
<g transform="translate(250,110)">
  <rect class="card" x="0" y="0" width="200" height="80" rx="10" fill="#EAF7EF" stroke="#58A978"/>
  <text class="smallLabel" x="100" y="26" text-anchor="middle">API Gateway</text>
  <text class="small" x="100" y="48" text-anchor="middle">Spring WebFlux :8080</text>
  <text class="small" x="100" y="64" text-anchor="middle">RouteLocator config</text>
</g>

<!-- Filters -->
<g transform="translate(496,110)">
  <rect class="card" x="0" y="0" width="200" height="80" rx="10" fill="#FFF3D9" stroke="#D6A441"/>
  <text class="smallLabel" x="100" y="26" text-anchor="middle">Gateway Filters</text>
  <text class="small" x="100" y="48" text-anchor="middle">RedirectWebFilter</text>
  <text class="small" x="100" y="64" text-anchor="middle">Bucket4j Rate Limiter</text>
</g>

<!-- Swagger -->
<g transform="translate(742,110)">
  <rect class="card" x="0" y="0" width="180" height="80" rx="10" fill="#FDECEF" stroke="#DC6B82"/>
  <text class="smallLabel" x="90" y="26" text-anchor="middle">Swagger UI</text>
  <text class="small" x="90" y="48" text-anchor="middle">/swagger-ui.html</text>
  <text class="small" x="90" y="64" text-anchor="middle">aggregated API docs</text>
</g>

<!-- CustomerService -->
<g transform="translate(150,280)">
  <rect class="card" x="0" y="0" width="240" height="100" rx="10" fill="#E9F7F6" stroke="#45A7A1"/>
  <text class="smallLabel" x="120" y="28" text-anchor="middle">CustomerService</text>
  <text class="small" x="120" y="50" text-anchor="middle">:8081</text>
  <text class="small" x="120" y="66" text-anchor="middle">GET/POST /customers</text>
  <text class="small" x="120" y="82" text-anchor="middle">route predicate: /customers/**</text>
</g>

<!-- OrderService -->
<g transform="translate(560,280)">
  <rect class="card" x="0" y="0" width="240" height="100" rx="10" fill="#F1ECFF" stroke="#8A72D6"/>
  <text class="smallLabel" x="120" y="28" text-anchor="middle">OrderService</text>
  <text class="small" x="120" y="50" text-anchor="middle">:8082</text>
  <text class="small" x="120" y="66" text-anchor="middle">GET/POST /orders /products</text>
  <text class="small" x="120" y="82" text-anchor="middle">route predicate: /orders/**</text>
</g>

<!-- Arrows -->
<path class="line" d="M204,150 L248,150"/>
<path class="line" d="M450,150 L494,150"/>
<path class="line" d="M696,150 L740,150"/>
<path class="line" d="M350,190 L270,278"/>
<path class="line" d="M350,190 L680,278"/>
</svg>
