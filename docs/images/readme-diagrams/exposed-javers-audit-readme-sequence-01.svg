<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1160" viewBox="0 0 1600 1160" role="img" aria-labelledby="title desc">
  <title id="title">exposed/javers-audit runtime sequence</title>
  <desc id="desc">Sequence showing ProductAuditService saving, reading, deleting, and diffing Product audit state.</desc>
  <defs>
    <style>
      svg{background:#f8fafc}
      .title{font-family:"Architects Daughter";font-size:40px;fill:#263238}
      .subtitle,.msg,.note,.footer{font-family:"Comic Mono";fill:#36464f}
      .subtitle{font-size:18px}.msg{font-size:14px}.note{font-size:13px}.footer{font-size:14px;fill:#60727d}
      .participant{font-family:"Architects Daughter";font-size:22px;fill:#1f3138}
      .role{font-family:"Comic Mono";font-size:13px;fill:#546a73}
      .frame{fill:#fbfcf8;stroke:#41545d;stroke-width:3}
      .header{fill:#ffffff;stroke:#546e7a;stroke-width:2}
      .lifeline{stroke:#9aaab1;stroke-width:2;stroke-dasharray:7 8}
      .activation{fill:#e6f2ec;stroke:#5b7e67;stroke-width:1.5}
      .call{fill:none;stroke:#3f7d9c;stroke-width:3;marker-end:url(#arrowCall)}
      .audit{fill:none;stroke:#7a64aa;stroke-width:3;marker-end:url(#arrowAudit)}
      .db{fill:none;stroke:#9b6b2f;stroke-width:3;marker-end:url(#arrowDb)}
      .return{fill:none;stroke:#9b7d54;stroke-width:2.5;stroke-dasharray:8 6;marker-end:url(#arrowReturn)}
      .branch{fill:none;stroke:#78909c;stroke-width:3;stroke-dasharray:12 7}
      .branchDivider{stroke:#78909c;stroke-width:3;stroke-dasharray:12 8}
      .branchSave{fill:#eef7f0;stroke:#6e8f4f;stroke-width:1.8}
      .branchRead{fill:#f6f1ff;stroke:#9a83c7;stroke-width:1.8}
      .branchDelete{fill:#fff7e8;stroke:#c79553;stroke-width:1.8}
      .label{fill:#ffffff;stroke:#d7e0e4;stroke-width:1.5}
      .label.callLabel{stroke:#9cc2d1}.label.auditLabel{stroke:#beaee0}.label.dbLabel{stroke:#d2ad7c}.label.returnLabel{stroke:#c8b38f}
      .badge{stroke-width:1.8}
      .badge.callBadge{fill:#eaf4f8;stroke:#3f7d9c}.badge.auditBadge{fill:#f3ecff;stroke:#7a64aa}.badge.dbBadge{fill:#fff4df;stroke:#9b6b2f}.badge.returnBadge{fill:#fff7e8;stroke:#9b7d54}
      .badgeText{font-family:"Comic Mono";font-size:12px;font-weight:700}
      .msg.callText,.badgeText.callText{fill:#2f6f8e}.msg.auditText,.badgeText.auditText{fill:#654f9c}.msg.dbText,.badgeText.dbText{fill:#835a27}.msg.returnText,.badgeText.returnText{fill:#7f6038}
    </style>
    <marker id="arrowCall" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" viewBox="0 0 10 10" refX="9" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#3f7d9c"/></marker>
    <marker id="arrowAudit" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" viewBox="0 0 10 10" refX="9" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#7a64aa"/></marker>
    <marker id="arrowDb" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" viewBox="0 0 10 10" refX="9" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#9b6b2f"/></marker>
    <marker id="arrowReturn" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" viewBox="0 0 10 10" refX="9" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#9b7d54"/></marker>
  </defs>

  <rect x="24" y="24" width="1552" height="1112" rx="20" class="frame"/>
  <text x="800" y="78" text-anchor="middle" class="title">Product Audit Runtime Flow</text>
  <text x="800" y="108" text-anchor="middle" class="subtitle">ProductAuditService writes audit snapshots before the current Exposed row, while diff stays read-only.</text>

  <rect x="80" y="150" width="170" height="68" rx="10" class="header"/>
  <text x="165" y="179" text-anchor="middle" class="participant">Caller</text>
  <text x="165" y="201" text-anchor="middle" class="role">test or app code</text>
  <rect x="360" y="150" width="240" height="68" rx="10" class="header"/>
  <text x="480" y="179" text-anchor="middle" class="participant">ProductAuditService</text>
  <text x="480" y="201" text-anchor="middle" class="role">service boundary</text>
  <rect x="730" y="150" width="180" height="68" rx="10" class="header"/>
  <text x="820" y="179" text-anchor="middle" class="participant">JaVers</text>
  <text x="820" y="201" text-anchor="middle" class="role">snapshot store</text>
  <rect x="1065" y="150" width="210" height="68" rx="10" class="header"/>
  <text x="1170" y="179" text-anchor="middle" class="participant">Exposed JDBC</text>
  <text x="1170" y="201" text-anchor="middle" class="role">ProductTable row</text>
  <rect x="1350" y="150" width="170" height="68" rx="10" class="header"/>
  <text x="1435" y="179" text-anchor="middle" class="participant">Diff</text>
  <text x="1435" y="201" text-anchor="middle" class="role">value compare</text>

  <line x1="165" y1="218" x2="165" y2="1080" class="lifeline"/>
  <line x1="480" y1="218" x2="480" y2="1080" class="lifeline"/>
  <line x1="820" y1="218" x2="820" y2="1080" class="lifeline"/>
  <line x1="1170" y1="218" x2="1170" y2="1080" class="lifeline"/>
  <line x1="1435" y1="218" x2="1435" y2="1080" class="lifeline"/>
  <rect x="473" y="300" width="14" height="612" rx="6" class="activation"/>
  <rect x="813" y="376" width="14" height="324" rx="6" class="activation"/>
  <rect x="1163" y="454" width="14" height="220" rx="6" class="activation"/>
  <rect x="1428" y="900" width="14" height="58" rx="6" class="activation"/>

  <rect x="70" y="254" width="1460" height="280" rx="14" class="branch"/>
  <rect x="96" y="272" width="275" height="30" rx="15" class="branchSave"/>
  <text x="118" y="292" class="note">save(author, product)</text>

  <rect x="90" y="318" width="352" height="34" rx="17" class="label callLabel"/>
  <circle cx="114" cy="335" r="13" class="badge callBadge"/><text x="114" y="340" text-anchor="middle" class="badgeText callText">1</text>
  <text x="138" y="340" class="msg callText">validate author.requireNotBlank()</text>
  <path d="M 165 370 L 480 370" class="call"/>

  <rect x="560" y="354" width="272" height="34" rx="17" class="label auditLabel"/>
  <circle cx="584" cy="371" r="13" class="badge auditBadge"/><text x="584" y="376" text-anchor="middle" class="badgeText auditText">2</text>
  <text x="608" y="376" class="msg auditText">javers.commit(author, product)</text>
  <path d="M 487 410 L 820 410" class="audit"/>

  <rect x="664" y="438" width="384" height="34" rx="17" class="label dbLabel"/>
  <circle cx="688" cy="455" r="13" class="badge dbBadge"/><text x="688" y="460" text-anchor="middle" class="badgeText dbText">3</text>
  <text x="712" y="460" class="msg dbText">transaction { ProductTable.upsert row }</text>
  <path d="M 487 494 L 1170 494" class="db"/>

  <rect x="70" y="582" width="1460" height="222" rx="14" class="branch"/>
  <rect x="96" y="600" width="305" height="30" rx="15" class="branchRead"/>
  <text x="118" y="620" class="note">read snapshots and current audit state</text>

  <rect x="248" y="652" width="310" height="34" rx="17" class="label callLabel"/>
  <circle cx="272" cy="669" r="13" class="badge callBadge"/><text x="272" y="674" text-anchor="middle" class="badgeText callText">4</text>
  <text x="296" y="674" class="msg callText">getHistory(productId)</text>
  <path d="M 165 712 L 480 712" class="call"/>

  <rect x="566" y="652" width="330" height="34" rx="17" class="label auditLabel"/>
  <circle cx="590" cy="669" r="13" class="badge auditBadge"/><text x="590" y="674" text-anchor="middle" class="badgeText auditText">5</text>
  <text x="614" y="674" class="msg auditText">findSnapshots(query), sorted oldest-first</text>
  <path d="M 487 736 L 820 736" class="audit"/>

  <rect x="306" y="742" width="330" height="34" rx="17" class="label returnLabel"/>
  <circle cx="330" cy="759" r="13" class="badge returnBadge"/><text x="330" y="764" text-anchor="middle" class="badgeText returnText">6</text>
  <text x="354" y="764" class="msg returnText">snapshots or latestSnapshotOrNull()</text>
  <path d="M 820 782 L 480 782 L 165 782" class="return"/>

  <rect x="70" y="838" width="1460" height="258" rx="14" class="branch"/>
  <rect x="96" y="856" width="276" height="30" rx="15" class="branchDelete"/>
  <text x="118" y="876" class="note">delete and value-only diff</text>

  <rect x="556" y="914" width="324" height="34" rx="17" class="label auditLabel"/>
  <circle cx="580" cy="931" r="13" class="badge auditBadge"/><text x="580" y="936" text-anchor="middle" class="badgeText auditText">7</text>
  <text x="604" y="936" class="msg auditText">commitShallowDelete(author, product)</text>
  <path d="M 487 966 L 820 966" class="audit"/>

  <rect x="725" y="990" width="360" height="34" rx="17" class="label dbLabel"/>
  <circle cx="749" cy="1007" r="13" class="badge dbBadge"/><text x="749" y="1012" text-anchor="middle" class="badgeText dbText">8</text>
  <text x="773" y="1012" class="msg dbText">deleteWhere { id eq product.id }</text>
  <path d="M 487 1040 L 1170 1040" class="db"/>

  <rect x="1132" y="856" width="338" height="34" rx="17" class="label returnLabel"/>
  <circle cx="1156" cy="873" r="13" class="badge returnBadge"/><text x="1156" y="878" text-anchor="middle" class="badgeText returnText">9</text>
  <text x="1180" y="878" class="msg returnText">diff(old, new): compare only, no write</text>
  <path d="M 480 900 L 1435 900" class="return"/>

  <text x="800" y="1124" text-anchor="middle" class="footer">JaVers owns snapshot history; Exposed owns the latest relational row.</text>
</svg>
