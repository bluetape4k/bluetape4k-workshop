  <rect class="canvas" width="1740" height="900"/><rect class="frame" x="24" y="24" width="1692" height="852" rx="24"/>
  <text class="title" x="870" y="72" text-anchor="middle">Idempotent order boundary</text>
  <text class="subtitle" x="870" y="106" text-anchor="middle">WebFlux validates Idempotency-Key, Redisson performs atomic cache writes, and Redis keeps replayable order responses for 5 minutes.</text>
  <rect class="layer" x="88" y="154" width="1564" height="158" fill="#EFF6FF" stroke="#BFDBFE"/><text class="layerTitle" x="128" y="199">HTTP contract</text>
  <g filter="url(#shadow)"><rect x="200" y="222" width="300" height="64" rx="14" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.7"/><text class="cardTitle" x="350" y="261" text-anchor="middle">Client or WebTestClient</text></g>
  <g filter="url(#shadow)"><rect x="700" y="212" width="340" height="84" rx="14" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.7"/><text class="cardTitle" x="870" y="246" text-anchor="middle">OrderController</text><text class="cardText" x="870" y="272" text-anchor="middle">POST /api/orders</text></g>
  <g filter="url(#shadow)"><rect x="1240" y="212" width="310" height="84" rx="14" fill="#FEFCE8" stroke="#CA8A04" stroke-width="1.7"/><text class="cardTitle" x="1395" y="246" text-anchor="middle">Header guard</text><text class="cardText" x="1395" y="272" text-anchor="middle">missing or blank -> 400</text></g>
  <rect class="layer" x="88" y="374" width="1564" height="190" fill="#F0FDF4" stroke="#BBF7D0"/><text class="layerTitle" x="128" y="420">Idempotency service</text>
  <g filter="url(#shadow)"><rect x="240" y="452" width="360" height="84" rx="14" fill="#FFFFFF" stroke="#16A34A" stroke-width="1.7"/><text class="cardTitle" x="420" y="486" text-anchor="middle">IdempotencyService</text><text class="cardText" x="420" y="512" text-anchor="middle">Created or Replay result</text></g>
  <g filter="url(#shadow)"><rect x="720" y="442" width="340" height="104" rx="14" fill="#FFFFFF" stroke="#16A34A" stroke-width="1.7"/><text class="cardTitle" x="890" y="474" text-anchor="middle">RMapCache</text><text class="cardText" x="890" y="500" text-anchor="middle">idempotency:orders</text><text class="cardText" x="890" y="524" text-anchor="middle">get + putIfAbsent TTL 5m</text></g>
  <g filter="url(#shadow)"><rect x="1200" y="452" width="300" height="84" rx="14" fill="#FFFFFF" stroke="#16A34A" stroke-width="1.7"/><text class="cardTitle" x="1350" y="486" text-anchor="middle">CachedResponse</text><text class="cardText" x="1350" y="512" text-anchor="middle">HTTP status + body</text></g>
  <rect class="layer" x="88" y="634" width="1564" height="154" fill="#FFF7ED" stroke="#FED7AA"/><text class="layerTitle" x="128" y="680">Runtime cache</text>
  <g filter="url(#shadow)"><rect x="280" y="706" width="330" height="58" rx="14" fill="#FFFFFF" stroke="#EA580C" stroke-width="1.7"/><text class="cardTitle" x="445" y="743" text-anchor="middle">RedissonConfig</text></g>
  <g filter="url(#shadow)"><rect x="750" y="696" width="330" height="78" rx="14" fill="#FFFFFF" stroke="#EA580C" stroke-width="1.7"/><text class="cardTitle" x="915" y="728" text-anchor="middle">RedissonClient</text><text class="cardText" x="915" y="754" text-anchor="middle">single server config</text></g>
  <g filter="url(#shadow)"><rect x="1220" y="684" width="320" height="102" rx="14" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.7"/><ellipse cx="1285" cy="718" rx="35" ry="11" fill="#FECACA" stroke="#DC2626" stroke-width="2"/><path d="M1250 718 L1250 758 C1250 764 1266 770 1285 770 C1304 770 1320 764 1320 758 L1320 718" fill="#FEE2E2" stroke="#DC2626" stroke-width="2"/><path d="M1250 738 C1250 744 1266 750 1285 750 C1304 750 1320 744 1320 738" fill="none" stroke="#DC2626" stroke-width="2"/><text class="cardTitle" x="1400" y="722" text-anchor="middle">Redis</text><text class="cardText" x="1400" y="748" text-anchor="middle">Testcontainer</text><text class="small" x="1400" y="770" text-anchor="middle">RedisServer.Launcher</text></g>
  <path class="line" d="M 500 254 L 700 254" stroke="#2563EB" marker-end="url(#arrowBlue)"/><text class="label" x="600" y="236" text-anchor="middle">Idempotency-Key</text>
  <path class="line" d="M 1040 254 L 1240 254" stroke="#2563EB" marker-end="url(#arrowBlue)"/><text class="label" x="1140" y="236" text-anchor="middle">validate header</text>
