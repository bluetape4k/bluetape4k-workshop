  <path class="line" d="M 610 735 L 750 735" stroke="#EA580C" marker-end="url(#arrowRed-ea580c)"/>
  <path class="line" d="M 1080 735 L 1220 735" stroke="#DC2626" marker-end="url(#arrowRed)"/>
