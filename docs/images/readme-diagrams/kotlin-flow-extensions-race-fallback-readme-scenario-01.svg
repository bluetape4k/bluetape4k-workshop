  <text class="card-title" x="205.0" y="246">Sources</text>
  <text class="card-text" x="205.0" y="280">cache / replica</text>
  <text class="card-text" x="205.0" y="302">remote / backup</text>
  <rect class="card-blue" x="430" y="210" width="260" height="120" rx="16"/>
  <text class="card-title" x="560.0" y="246">RaceFallbackCatalog</text>
  <text class="card-text" x="560.0" y="280">choose operator</text>
  <text class="card-text" x="560.0" y="302">per source contract</text>
  <rect class="card-green" x="805" y="165" width="220" height="120" rx="16"/>
  <text class="card-title" x="915.0" y="201">race / amb</text>
  <text class="card-text" x="915.0" y="235">first value wins</text>
  <text class="card-text" x="915.0" y="257">losers cancel</text>
  <rect class="card-green" x="805" y="305" width="220" height="120" rx="16"/>
  <text class="card-title" x="915.0" y="341">concat</text>
  <text class="card-text" x="915.0" y="375">ordered fallback</text>
  <text class="card-text" x="915.0" y="397">priority preserved</text>
  <rect class="card-green" x="805" y="445" width="220" height="120" rx="16"/>
  <text class="card-title" x="915.0" y="481">merge</text>
  <text class="card-text" x="915.0" y="515">all contributions</text>
  <text class="card-text" x="915.0" y="537">arrival order</text>
  <rect class="card-purple" x="1110" y="235" width="220" height="120" rx="16"/>
  <text class="card-title" x="1220.0" y="271">eager concat</text>
  <text class="card-text" x="1220.0" y="305">start early</text>
  <text class="card-text" x="1220.0" y="327">emit in order</text>
  <rect class="card-red" x="1110" y="445" width="220" height="120" rx="16"/>
  <text class="card-title" x="1220.0" y="481">materialize</text>
  <text class="card-text" x="1220.0" y="515">error-as-value</text>
  <text class="card-text" x="1220.0" y="537">dematerialize</text>
  <path class="line-blue" d="M 320 265 L 430 265" marker-end="url(#arrow-blue)"/>
  <path class="line-green" d="M 690 270 L 760 270 Q 780 270 780 212 L 805 212" marker-end="url(#arrow-green)"/>
  <path class="line-green" d="M 690 270 L 760 270 Q 780 270 780 352 L 805 352" marker-end="url(#arrow-green)"/>
  <path class="line-green" d="M 690 270 L 760 270 Q 780 270 780 492 L 805 492" marker-end="url(#arrow-green)"/>
  <path class="line-purple" d="M 1025 352 L 1080 352 Q 1100 352 1100 282 L 1110 282" marker-end="url(#arrow-purple)"/>
  <path class="line-red" d="M 1025 492 L 1080 492 Q 1100 492 1100 492 L 1110 492" marker-end="url(#arrow-red)"/>
  <text class="subtitle" x="700" y="660">Pick race, concat, eager concat, merge, or materialize before writing fallback glue.</text>
