<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="880" viewBox="0 0 1680 880">
  <defs>
    <style>
      .bg{fill:#f8fafc}.title{font-family:'Architects Daughter','Comic Sans MS',cursive;font-size:34px;fill:#18212f}
      .card-title{font-family:'Architects Daughter','Comic Sans MS',cursive;font-size:27px;fill:#101827}
      .body{font-family:'Comic Mono','Comic Sans MS',monospace;font-size:18px;fill:#364152}.small{font-family:'Comic Mono','Comic Sans MS',monospace;font-size:15px;fill:#475569}
      .card{fill:#fff;stroke:#cbd5e1;stroke-width:1.5;rx:18;ry:18}.group{fill:#f1f5f9;stroke:#cbd5e1;stroke-width:1.3;rx:22;ry:22}
      .line{fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L11,6 L1,11 Z" fill="#2563eb"/></marker>
    <marker id="arrow-green" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L11,6 L1,11 Z" fill="#059669"/></marker>
  </defs>
  <rect class="bg" width="1680" height="880"/>
  <text class="title" x="70" y="70">Redis Repository Data Model</text>

  <rect class="group" x="70" y="125" width="720" height="650"/>
  <text class="card-title" x="110" y="175">Person repository</text>
  <rect class="card" x="130" y="225" width="570" height="115"/>
  <text class="card-title" x="160" y="267">persons:{id}</text>
  <text class="body" x="160" y="297">HASH: firstname, lastname, gender, address</text>
  <rect class="card" x="130" y="410" width="570" height="115"/>
  <text class="card-title" x="160" y="452">persons:firstname:{value}</text>
  <text class="body" x="160" y="482">SET index maintained from @Indexed fields</text>
  <rect class="card" x="130" y="595" width="570" height="115"/>
  <text class="card-title" x="160" y="637">children.[n] -> persons:{childId}</text>
  <text class="body" x="160" y="667">@Reference stores keys, not embedded rows</text>

  <rect class="group" x="890" y="125" width="720" height="650"/>
  <text class="card-title" x="930" y="175">Movie repository</text>
  <rect class="card" x="950" y="225" width="570" height="115"/>
  <text class="card-title" x="980" y="267">movies:{id} / actors:{id}</text>
  <text class="body" x="980" y="297">HASH aggregates with indexed fields</text>
  <rect class="card" x="950" y="410" width="570" height="115"/>
  <text class="card-title" x="980" y="452">movieActor:{id}</text>
  <text class="body" x="980" y="482">explicit movieHashId and actorHashId</text>
  <rect class="card" x="950" y="595" width="570" height="115"/>
  <text class="card-title" x="980" y="637">Reference query limitation</text>
  <text class="body" x="980" y="667">query by stored ids when relationships matter</text>

  <path class="line" d="M415 340 L415 410" stroke="#2563eb" marker-end="url(#arrow)"/>
  <path class="line" d="M415 525 L415 595" stroke="#2563eb" marker-end="url(#arrow)"/>
  <path class="line" d="M1235 340 L1235 410" stroke="#059669" marker-end="url(#arrow-green)"/>
  <path class="line" d="M1235 525 L1235 595" stroke="#059669" marker-end="url(#arrow-green)"/>
</svg>
