<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <style>.bg{fill:#f8fafc}.title{font:34px 'Architects Daughter','Comic Sans MS',cursive;fill:#18212f}.subtitle{font:16px 'Comic Mono','Courier New',monospace;fill:#64748b}.zone{stroke-width:1.5}.zone-title{font:24px 'Architects Daughter','Comic Sans MS',cursive;fill:#243044}.card{fill:#fff;stroke:#cbd5e1;stroke-width:1.5}.card-title{font:20px 'Architects Daughter','Comic Sans MS',cursive;fill:#111827}.body{font:14px 'Comic Mono','Courier New',monospace;fill:#475569}.edge{fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}.rule{font:bold 16px 'Comic Mono','Courier New',monospace;fill:#1e293b}</style>
    <marker id="authorityArrow" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 14 14" data-role="primary" data-tip-direction="positive-x"><path d="M1 1 L13 7 L1 13 Z" fill="#2563eb" stroke="#2563eb" stroke-dasharray="none" style="stroke-dasharray:none" stroke-width="0"/></marker>
    <marker id="durableArrow" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 14 14" data-role="primary" data-tip-direction="positive-x"><path d="M1 1 L13 7 L1 13 Z" fill="#059669" stroke="#059669" stroke-dasharray="none" style="stroke-dasharray:none" stroke-width="0"/></marker>
  </defs>
  <rect class="bg" width="1600" height="900"/><text class="title" x="70" y="62">Redis and PostgreSQL Authority — Fast Gate, Durable Truth</text><text class="subtitle" x="72" y="91">Redis reduces hot-path contention; PostgreSQL remains the recovery and correctness boundary.</text>
  <rect class="zone" x="60" y="125" width="410" height="610" rx="24" fill="#eff6ff" stroke="#bfdbfe"/><text class="zone-title" x="90" y="168">Request boundary</text>
  <rect class="card" x="105" y="225" width="320" height="105" rx="18"/><text class="card-title" x="135" y="262">Trusted identity</text><text class="body" x="135" y="288">user subject + client IP</text><text class="body" x="135" y="311">rate-limit dimensions</text>
  <rect class="card" x="105" y="430" width="320" height="115" rx="18"/><text class="card-title" x="135" y="467">Admission grant</text><text class="body" x="135" y="493">single use, short lived</text><text class="body" x="135" y="516">never purchase authority</text>

  <rect class="zone" x="530" y="125" width="450" height="610" rx="24" fill="#fff7ed" stroke="#fed7aa"/><text class="zone-title" x="560" y="168">Redis — temporary coordination</text>
  <rect class="card" x="580" y="225" width="350" height="105" rx="18"/><text class="card-title" x="610" y="262">Atomic USER/IP lease</text><text class="body" x="610" y="288">create, validate, release together</text><text class="body" x="610" y="311">owner token prevents stale release</text>
  <rect class="card" x="580" y="430" width="350" height="115" rx="18"/><text class="card-title" x="610" y="467">Rate limit + waiting room</text><text class="body" x="610" y="493">fail closed for purchase entry</text><text class="body" x="610" y="516">safe to rebuild after loss</text>

  <rect class="zone" x="1040" y="125" width="500" height="610" rx="24" fill="#f0fdf4" stroke="#bbf7d0"/><text class="zone-title" x="1070" y="168">PostgreSQL — durable authority</text>
  <rect class="card" x="1090" y="215" width="400" height="125" rx="18" fill="#ecfdf5" stroke="#86efac"/><text class="card-title" x="1120" y="252">ExposedJdbcRepository</text><text class="body" x="1120" y="278">inventory row locks + USER/IP guards</text><text class="body" x="1120" y="301">attempt, claim, receipt, idempotency</text><text class="body" x="1120" y="324">one transaction for invariants</text>
  <rect class="card" x="1090" y="430" width="400" height="115" rx="18"/><text class="card-title" x="1120" y="467">Restart-safe recovery</text><text class="body" x="1120" y="493">stable operation lookup</text><text class="body" x="1120" y="516">refund/ticket disposition gate</text>
  <path class="edge" data-connector="identity-to-lease" d="M425 277 H580" stroke="#2563eb" marker-end="url(#authorityArrow)"/><path class="edge" data-connector="lease-to-durable-guard" d="M930 277 H1090" stroke="#059669" marker-end="url(#durableArrow)"/><path class="edge" data-connector="grant-to-admission" d="M425 487 H580" stroke="#2563eb" marker-end="url(#authorityArrow)"/><path class="edge" data-connector="admission-to-recovery" d="M930 487 H1090" stroke="#059669" marker-end="url(#durableArrow)"/>
  <rect x="180" y="775" width="1240" height="78" rx="20" fill="#fff" stroke="#cbd5e1"/><text class="rule" x="250" y="808">Redis unavailable means reject new admission; keep liveness and PostgreSQL recovery available.</text><text class="body" x="250" y="834">Never reconstruct sold inventory, payment outcome, or ticket disposition from Redis.</text>
</svg>
