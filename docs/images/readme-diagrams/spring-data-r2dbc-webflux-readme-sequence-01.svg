<rect class="message-label" x="1163" y="759" width="422" height="31" rx="7" fill="#ffffff" opacity="0.96" stroke="#dbe3ee"/>
<text class="message" x="1374" y="774.5" text-anchor="middle" dominant-baseline="middle">6. rows</text>
<path class="return" d="M1238 853 L966 853"/>
<rect class="message-label" x="891" y="867" width="422" height="31" rx="7" fill="#ffffff" opacity="0.96" stroke="#dbe3ee"/>
<text class="message" x="1102" y="882.5" text-anchor="middle" dominant-baseline="middle">7. entity / Flow&lt;T&gt;</text>
<path class="return" d="M966 961 L694 961"/>
<rect class="message-label" x="619" y="975" width="422" height="31" rx="7" fill="#ffffff" opacity="0.96" stroke="#dbe3ee"/>
