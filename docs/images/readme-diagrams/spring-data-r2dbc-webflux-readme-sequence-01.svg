<path class="return" d="M694 1069 L150 1069"/>
<rect class="message-label" x="142" y="1083" width="560" height="31" rx="7" fill="#ffffff" opacity="0.96" stroke="#dbe3ee"/>
<text class="message" x="422" y="1098.5" text-anchor="middle" dominant-baseline="middle">9. ServerResponse</text>
</svg>
