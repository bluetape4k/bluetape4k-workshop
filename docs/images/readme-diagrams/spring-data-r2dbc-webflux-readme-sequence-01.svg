<path class="call" d="M150 205 L422 205"/>
<rect class="message-label" x="75" y="219" width="422" height="31" rx="7" fill="#ffffff" opacity="0.96" stroke="#dbe3ee"/>
<text class="message" x="286" y="234.5" text-anchor="middle" dominant-baseline="middle">1. HTTP Request</text>
<path class="call" d="M422 313 L694 313"/>
<rect class="message-label" x="347" y="327" width="422" height="31" rx="7" fill="#ffffff" opacity="0.96" stroke="#dbe3ee"/>
<text class="message" x="558" y="342.5" text-anchor="middle" dominant-baseline="middle">2. route to handler method</text>
