<rect class="message-label" x="619" y="435" width="422" height="31" rx="7" fill="#ffffff" opacity="0.96" stroke="#dbe3ee"/>
<text class="message" x="830" y="450.5" text-anchor="middle" dominant-baseline="middle">3. suspend service call</text>
<path class="call" d="M966 529 L1238 529"/>
<rect class="message-label" x="891" y="543" width="422" height="31" rx="7" fill="#ffffff" opacity="0.96" stroke="#dbe3ee"/>
<text class="message" x="1102" y="558.5" text-anchor="middle" dominant-baseline="middle">4. findAll() / save() / deleteById()</text>
<path class="call" d="M1238 637 L1510 637"/>
<rect class="message-label" x="1163" y="651" width="422" height="31" rx="7" fill="#ffffff" opacity="0.96" stroke="#dbe3ee"/>
<text class="message" x="1374" y="666.5" text-anchor="middle" dominant-baseline="middle">5. R2DBC SQL</text>
