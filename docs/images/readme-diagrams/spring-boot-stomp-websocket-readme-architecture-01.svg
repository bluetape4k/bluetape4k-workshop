<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1760" height="900" viewBox="0 0 1760 900" role="img" aria-label="STOMP WebSocket architecture">
  <defs>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#64748B" flood-opacity="0.15"/>
    </filter>
    <marker id="arrowBlue" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 14 14" data-role="primary" data-tip-direction="positive-x"><path d="M 0 0 L 14 7 L 0 14 Z" fill="#2563EB" stroke-dasharray="none" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="arrowGreen" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 14 14" data-role="primary" data-tip-direction="positive-x"><path d="M 0 0 L 14 7 L 0 14 Z" fill="#16A34A" stroke-dasharray="none" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="arrowOrange" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 14 14" data-role="primary" data-tip-direction="positive-x"><path d="M 0 0 L 14 7 L 0 14 Z" fill="#EA580C" stroke-dasharray="none" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <style>
      .canvas{fill:#F8FAFC}.frame{fill:#FFFFFF;stroke:#D6E0E8;stroke-width:1.4}.layer{stroke-width:1.6;rx:24}
      .title{font-family:"Architects Daughter";font-size:42px;fill:#102033}.subtitle{font-family:"Comic Mono";font-size:16px;fill:#51606F}
      .layerTitle{font-family:"Architects Daughter";font-size:31px;fill:#243447}.cardTitle{font-family:"Architects Daughter";font-size:31px;fill:#102033}
      .cardText{font-family:"Comic Mono";font-size:15px;fill:#415166}.line{fill:none;stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round}
      .label{font-family:"Comic Mono";font-size:14px;fill:#334155}
    </style>
  </defs>
  <rect class="canvas" width="1760" height="900"/>
  <rect class="frame" x="24" y="24" width="1712" height="852" rx="26"/>
  <text class="title" x="880" y="74" text-anchor="middle">STOMP greeting contract</text>
  <text class="subtitle" x="880" y="108" text-anchor="middle">SockJS clients send to /app/hello; Spring routes to the controller and broadcasts Greeting frames on /topic/greetings.</text>

  <rect class="layer" x="84" y="154" width="1592" height="150" fill="#EFF6FF" stroke="#BFDBFE"/>
  <text class="layerTitle" x="124" y="198">Clients</text>
  <g filter="url(#shadow)">
    <rect x="180" y="220" width="330" height="62" rx="14" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.7"/>
    <text class="cardTitle" x="345" y="258" text-anchor="middle">Static SockJS UI</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="660" y="210" width="390" height="82" rx="14" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.7"/>
    <text class="cardTitle" x="855" y="244" text-anchor="middle">GreetingIntegrationTest</text>
    <text class="cardText" x="855" y="270" text-anchor="middle">WebSocketStompClient + SockJsClient</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="1210" y="220" width="280" height="62" rx="14" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.7"/>
    <text class="cardTitle" x="1350" y="258" text-anchor="middle">STOMP Session</text>
  </g>

  <rect class="layer" x="84" y="366" width="1592" height="190" fill="#F0FDF4" stroke="#BBF7D0"/>
  <text class="layerTitle" x="124" y="410">Spring WebSocket runtime</text>
  <g filter="url(#shadow)">
    <rect x="180" y="448" width="350" height="74" rx="14" fill="#FFFFFF" stroke="#16A34A" stroke-width="1.7"/>
    <text class="cardTitle" x="355" y="480" text-anchor="middle">SockJS endpoint</text>
    <text class="cardText" x="355" y="504" text-anchor="middle">/gs-guide-websocket</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="680" y="438" width="360" height="94" rx="14" fill="#FFFFFF" stroke="#16A34A" stroke-width="1.7"/>
    <text class="cardTitle" x="860" y="472" text-anchor="middle">WebSocketConfig</text>
    <text class="cardText" x="860" y="498" text-anchor="middle">/app prefix and /topic broker</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="1190" y="438" width="350" height="94" rx="14" fill="#FFFFFF" stroke="#16A34A" stroke-width="1.7"/>
    <text class="cardTitle" x="1365" y="472" text-anchor="middle">TomcatConfig</text>
    <text class="cardText" x="1365" y="498" text-anchor="middle">virtual-thread executor</text>
  </g>

  <rect class="layer" x="84" y="626" width="1592" height="150" fill="#FFF7ED" stroke="#FED7AA"/>
  <text class="layerTitle" x="124" y="670">Application message contract</text>
  <g filter="url(#shadow)">
    <rect x="190" y="700" width="330" height="58" rx="14" fill="#FFFFFF" stroke="#EA580C" stroke-width="1.7"/>
    <text class="cardTitle" x="355" y="737" text-anchor="middle">HelloMessage</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="690" y="688" width="360" height="82" rx="14" fill="#FFFFFF" stroke="#EA580C" stroke-width="1.7"/>
    <text class="cardTitle" x="870" y="722" text-anchor="middle">GreetingController</text>
    <text class="cardText" x="870" y="748" text-anchor="middle">@MessageMapping("/hello")</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="1210" y="700" width="310" height="58" rx="14" fill="#FFFFFF" stroke="#EA580C" stroke-width="1.7"/><image data-bluetape4k-icon="kafka" data-source="docs/icons/testcontainers/mq/apache-kafka.svg" x="1222" y="717" width="24" height="24" href="data:image/svg+xml;base64," preserveAspectRatio="xMidYMid meet"/>
    <text class="cardTitle" x="1365" y="737" text-anchor="middle">/topic/greetings</text>
  </g>

  <path class="line" d="M 345 282 L 345 448" stroke="#2563EB" marker-end="url(#arrowBlue)" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="line" d="M 855 292 L 855 438" stroke="#2563EB" marker-end="url(#arrowBlue)" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="line" d="M 1350 282 L 1350 410 Q 1350 420 1340 420 L 1040 420" stroke="#2563EB" marker-end="url(#arrowBlue)" stroke-linecap="round" stroke-linejoin="round"/>
  <text class="label" x="1196" y="402" text-anchor="middle">connect and subscribe</text>

  <path class="line" d="M 530 485 L 680 485" stroke="#16A34A" marker-end="url(#arrowGreen)" stroke-linecap="round" stroke-linejoin="round"/>
  <text class="label" x="605" y="466" text-anchor="middle">registered by</text>
  <path class="line" d="M 1040 485 L 1190 485" stroke="#16A34A" marker-end="url(#arrowGreen)" stroke-linecap="round" stroke-linejoin="round"/>
  <text class="label" x="1115" y="466" text-anchor="middle">runtime executor</text>

  <path class="line" d="M 355 522 L 355 700" stroke="#EA580C" marker-end="url(#arrowOrange)" stroke-linecap="round" stroke-linejoin="round"/>
  <text class="label" x="292" y="610" text-anchor="middle">SEND /app/hello</text>
  <path class="line" d="M 520 729 L 690 729" stroke="#EA580C" marker-end="url(#arrowOrange)" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="line" d="M 1050 729 L 1210 729" stroke="#EA580C" marker-end="url(#arrowOrange)" stroke-linecap="round" stroke-linejoin="round"/>
  <text class="label" x="1130" y="710" text-anchor="middle">broadcast Greeting</text>
</svg>
