<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" role="img" aria-label="Spring Transaction Propagation">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#1f2937" flood-opacity="0.10"/></filter>
  <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth">
    <path d="M1,1 L8,4.5 L1,8 Z" fill="#758297"/>
  </marker>
  <style>
    .canvas{fill:#f7f9fc}.frame{fill:#fff;stroke:#d8e0ea;stroke-width:1.5}
    .title{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:38px;font-weight:400;fill:#102033}
    .subtitle{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:14px;font-weight:400;fill:#536273}
    .smallLabel{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:21px;font-weight:400;fill:#102033}
    .mono{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#102033}
    .small{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#536273}
    .card{stroke-width:2.1;filter:url(#shadow)}
    .line{stroke:#758297;stroke-width:2.1;fill:none;marker-end:url(#arrow)}
  </style>
</defs>
<rect class="canvas" width="960" height="440"/>
<rect class="frame" x="24" y="20" width="912" height="396" rx="18"/>
<text class="title" x="44" y="66">Spring Transaction Propagation</text>
<text class="subtitle" x="44" y="90">REQUIRED · REQUIRES_NEW · NESTED · NOT_SUPPORTED · MANDATORY · SUPPORTS</text>

<!-- Outer transaction (caller) -->
<g transform="translate(44,110)">
  <rect class="card" x="0" y="0" width="190" height="80" rx="10" fill="#E8F3FF" stroke="#5B8DEF"/>
  <text class="smallLabel" x="95" y="30" text-anchor="middle">Outer TX</text>
  <text class="small" x="95" y="52" text-anchor="middle">@Transactional</text>
  <text class="small" x="95" y="68" text-anchor="middle">REQUIRED (default)</text>
</g>

<!-- REQUIRED -->
<g transform="translate(270,110)">
  <rect class="card" x="0" y="0" width="190" height="80" rx="10" fill="#EAF7EF" stroke="#58A978"/>
  <text class="smallLabel" x="95" y="30" text-anchor="middle">REQUIRED</text>
  <text class="small" x="95" y="52" text-anchor="middle">joins existing TX</text>
  <text class="small" x="95" y="68" text-anchor="middle">or creates new</text>
</g>

<!-- REQUIRES_NEW -->
<g transform="translate(496,110)">
  <rect class="card" x="0" y="0" width="190" height="80" rx="10" fill="#FFF3D9" stroke="#D6A441"/>
  <text class="smallLabel" x="95" y="28" text-anchor="middle">REQUIRES_NEW</text>
  <text class="small" x="95" y="50" text-anchor="middle">suspends outer TX</text>
  <text class="small" x="95" y="66" text-anchor="middle">creates independent TX</text>
</g>

<!-- NESTED -->
<g transform="translate(722,110)">
  <rect class="card" x="0" y="0" width="190" height="80" rx="10" fill="#FDECEF" stroke="#DC6B82"/>
  <text class="smallLabel" x="95" y="30" text-anchor="middle">NESTED</text>
  <text class="small" x="95" y="52" text-anchor="middle">savepoint in outer TX</text>
  <text class="small" x="95" y="68" text-anchor="middle">partial rollback</text>
</g>

<!-- NOT_SUPPORTED -->
<g transform="translate(44,270)">
  <rect class="card" x="0" y="0" width="190" height="80" rx="10" fill="#E9F7F6" stroke="#45A7A1"/>
  <text class="smallLabel" x="95" y="28" text-anchor="middle">NOT_SUPPORTED</text>
  <text class="small" x="95" y="50" text-anchor="middle">suspends outer TX</text>
  <text class="small" x="95" y="66" text-anchor="middle">runs non-transactional</text>
</g>

<!-- MANDATORY -->
<g transform="translate(270,270)">
  <rect class="card" x="0" y="0" width="190" height="80" rx="10" fill="#F1ECFF" stroke="#8A72D6"/>
  <text class="smallLabel" x="95" y="30" text-anchor="middle">MANDATORY</text>
  <text class="small" x="95" y="52" text-anchor="middle">must have active TX</text>
  <text class="small" x="95" y="68" text-anchor="middle">else exception</text>
</g>

<!-- SUPPORTS -->
<g transform="translate(496,270)">
  <rect class="card" x="0" y="0" width="190" height="80" rx="10" fill="#EEF6D9" stroke="#8BA84D"/>
  <text class="smallLabel" x="95" y="30" text-anchor="middle">SUPPORTS</text>
  <text class="small" x="95" y="52" text-anchor="middle">joins TX if exists</text>
  <text class="small" x="95" y="68" text-anchor="middle">runs without if none</text>
</g>

<!-- NEVER -->
<g transform="translate(722,270)">
  <rect class="card" x="0" y="0" width="190" height="80" rx="10" fill="#FFF3D9" stroke="#D6A441"/>
  <text class="smallLabel" x="95" y="30" text-anchor="middle">NEVER</text>
  <text class="small" x="95" y="52" text-anchor="middle">no TX allowed</text>
  <text class="small" x="95" y="68" text-anchor="middle">else exception</text>
</g>

<!--
  Arrows from Outer TX (cx=139, right=234) to each target.
  Use bus lane at y=95 (above row1 cards at y=110) to avoid crossing card interiors.
  Each arrow: goes UP from Outer TX top (y=110) to bus y=95,
  travels horizontally to target cx, then DOWN to target card top (y=110).

  Outer TX → REQUIRED (right neighbour: direct horizontal at y=150)
-->
<path class="line" d="M234,150 L268,150"/>

<!--
  Outer TX → REQUIRES_NEW: bus above row1
  Outer TX top: (139, 110) → up to (139, 95) → right to (591, 95) → down to (591, 110)
-->
<path class="line" d="M139,110 L139,95 L591,95 L591,110"/>

<!--
  Outer TX → NESTED: bus above row1
  Outer TX top: (139, 110) → up to (139, 88) → right to (817, 88) → down to (817, 110)
-->
<path class="line" d="M139,110 L139,88 L817,88 L817,110"/>

<!--
  Outer TX → NOT_SUPPORTED: vertical stem (same column)
-->
<path class="line" d="M139,190 L139,268"/>

<!--
  Outer TX → MANDATORY: bus lane at y=240 (gap between rows)
  Start: right of Outer TX (234, 310→ midpoint of NOT_SUPPORTED column)
  Actually use top-of-row2 bus to avoid crossing NOT_SUPPORTED interior.
  Outer TX bottom (139,190) → down to bus y=240 → right to MANDATORY cx (365) → up to MANDATORY top (365,270)
-->
<path class="line" d="M139,190 L139,240 L365,240 L365,268"/>

<!--
  Outer TX → SUPPORTS: bus at y=240
-->
<path class="line" d="M139,190 L139,246 L591,246 L591,268"/>

<!--
  Outer TX → NEVER: bus at y=240
-->
<path class="line" d="M139,190 L139,252 L817,252 L817,268"/>
</svg>
