  <text x="850.0" y="502" class="msg callText">GET /concurrent-flow</text>
  <path d="M 573.0 526 L 1269.0 526" class="call" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="1262.0" y="518" width="14" height="48" rx="4" class="activation"/>
