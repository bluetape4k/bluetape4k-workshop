  <rect x="1610.0" y="366" width="14" height="48" rx="4" class="activation"/>
  <rect x="1778.0" y="404" width="374.0" height="34" rx="17" class="label workLabel"/>
  <circle cx="1802.0" cy="421" r="13" class="badge workBadge"/><text x="1802.0" y="426" text-anchor="middle" class="badgeText workText">3</text>
  <text x="1826.0" y="426" class="msg workText">GET /suspend or /controller/*/suspend</text>
