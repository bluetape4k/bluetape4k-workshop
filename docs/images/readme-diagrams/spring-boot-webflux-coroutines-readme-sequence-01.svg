<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="2538" height="724" viewBox="0 0 2538 724" role="img" aria-labelledby="title desc">
  <title id="title">Coroutine endpoint and Sequence execution</title>
  <desc id="desc">Direct suspend endpoints return one Banner; sequence endpoints call the same suspend endpoint sequentially or through Sequence.async.</desc>
  <defs>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="124%"><feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#64748B" flood-opacity="0.14"/></filter>
    <style>.title{font-family:"Architects Daughter";font-size:40px;fill:#263238}.subtitle,.msg,.note,.footer{font-family:"Comic Mono";fill:#36464F}.subtitle{font-size:17px}.participant{font-family:"Architects Daughter";font-size:19px;fill:#1F3138}.role{font-family:"Comic Mono";font-size:12px;fill:#546A73}.msg{font-size:13px}.footer{font-size:14px;fill:#60727D}.frame{fill:#FBFCF8;stroke:#41545D;stroke-width:3}.header{fill:#FFFFFF;stroke:#546E7A;stroke-width:2}.lifeline{stroke:#9AAAB1;stroke-width:2;stroke-dasharray:7 8;stroke-linecap:round}.activation{fill:#E6F2EC;stroke:#5B7E67;stroke-width:1.5}.call,.work,.return{fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.call{stroke:#3F7D9C;marker-end:url(#arrow-call)}.work{stroke:#6E8F4F;marker-end:url(#arrow-work)}.return{stroke:#9B7D54;stroke-width:2.6;stroke-dasharray:8 6;marker-end:url(#arrow-ret)}.label{fill:#FFFFFF;stroke:#D7E0E4;stroke-width:1.5}.callLabel{stroke:#9CC2D1}.workLabel{stroke:#B6C9A4}.returnLabel{stroke:#C8B38F}.badge{stroke-width:1.8}.callBadge{fill:#EAF4F8;stroke:#3F7D9C}.workBadge{fill:#EEF7F0;stroke:#6E8F4F}.returnBadge{fill:#FFF7E8;stroke:#9B7D54}.badgeText{font-family:"Comic Mono";font-size:12px;font-weight:700}.callText,.badgeText.callText{fill:#2F6F8E}.workText,.badgeText.workText{fill:#55783F}.returnText,.badgeText.returnText{fill:#7F6038}</style>
    <marker id="arrow-call" viewBox="0 0 10 10" markerWidth="14" markerHeight="14" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#3F7D9C" stroke-dasharray="none" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="arrow-work" viewBox="0 0 10 10" markerWidth="14" markerHeight="14" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#6E8F4F" stroke-dasharray="none" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="arrow-ret" viewBox="0 0 10 10" markerWidth="14" markerHeight="14" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#9B7D54" stroke-dasharray="none" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>
  <rect x="24" y="24" width="2490" height="676" rx="20" class="frame"/>
  <text id="titleText" x="1269.0" y="76" text-anchor="middle" class="title">Coroutine endpoint and Sequence execution</text>
  <text x="1269.0" y="106" text-anchor="middle" class="subtitle">Direct suspend endpoints return one Banner; sequence endpoints call the same suspend endpoint sequentially or through Sequence.async.</text>
  <g filter="url(#shadow)"><rect x="90.0" y="156" width="270" height="76" rx="10" class="header"/>
    <text x="225.0" y="186" text-anchor="middle" class="participant">Client</text>
    <text x="225.0" y="211" text-anchor="middle" class="role">WebTestClient or curl</text></g>
  <line x1="225.0" y1="232" x2="225.0" y2="636" class="lifeline"/>
  <g filter="url(#shadow)"><rect x="438.0" y="156" width="270" height="76" rx="10" class="header"/>
    <text x="573.0" y="186" text-anchor="middle" class="participant">Flow builder</text>
    <text x="573.0" y="211" text-anchor="middle" class="role">sequential or async</text></g>
  <line x1="573.0" y1="232" x2="573.0" y2="636" class="lifeline"/>
  <g filter="url(#shadow)"><rect x="786.0" y="156" width="270" height="76" rx="10" class="header"/>
    <text x="921.0" y="186" text-anchor="middle" class="participant">Endpoint style</text>
    <text x="921.0" y="211" text-anchor="middle" class="role">controller or coRouter</text></g>
  <line x1="921.0" y1="232" x2="921.0" y2="636" class="lifeline"/>
  <g filter="url(#shadow)"><rect x="1134.0" y="156" width="270" height="76" rx="10" class="header"/>
    <text x="1269.0" y="186" text-anchor="middle" class="participant">WebClient loopback</text>
    <text x="1269.0" y="211" text-anchor="middle" class="role">httpGet(&quot;/suspend&quot;)</text></g>
  <line x1="1269.0" y1="232" x2="1269.0" y2="636" class="lifeline"/>
  <g filter="url(#shadow)"><rect x="1482.0" y="156" width="270" height="76" rx="10" class="header"/>
    <text x="1617.0" y="186" text-anchor="middle" class="participant">Coroutine scope</text>
    <text x="1617.0" y="211" text-anchor="middle" class="role">Default, IO, VT, handler</text></g>
  <line x1="1617.0" y1="232" x2="1617.0" y2="636" class="lifeline"/>
  <g filter="url(#shadow)"><rect x="1830.0" y="156" width="270" height="76" rx="10" class="header"/>
    <text x="1965.0" y="186" text-anchor="middle" class="participant">Flow response</text>
    <text x="1965.0" y="211" text-anchor="middle" class="role">4 Banner items</text></g>
  <line x1="1965.0" y1="232" x2="1965.0" y2="636" class="lifeline"/>
  <g filter="url(#shadow)"><rect x="2178.0" y="156" width="270" height="76" rx="10" class="header"/>
    <text x="2313.0" y="186" text-anchor="middle" class="participant">Banner response</text>
    <text x="2313.0" y="211" text-anchor="middle" class="role">JSON body or Sequence</text></g>
  <line x1="2313.0" y1="232" x2="2313.0" y2="636" class="lifeline"/>
  <rect x="386.0" y="252" width="374.0" height="34" rx="17" class="label callLabel"/>
  <circle cx="410.0" cy="269" r="13" class="badge callBadge"/><text x="410.0" y="274" text-anchor="middle" class="badgeText callText">1</text>
  <text x="434.0" y="274" class="msg callText">GET /suspend or /controller/*/suspend</text>
