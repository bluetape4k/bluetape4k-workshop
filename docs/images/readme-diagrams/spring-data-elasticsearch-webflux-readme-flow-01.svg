<svg xmlns="http://www.w3.org/2000/svg" width="1840" height="1040" viewBox="0 0 1840 1040">
  <defs>
    <style>
      .canvas { fill: #fbfcff; }
      .title { font-family: "Architects Daughter", "Comic Sans MS", cursive; font-size: 42px; fill: #102033; }
      .subtitle { font-family: "Comic Mono", "SFMono-Regular", monospace; font-size: 16px; fill: #536270; }
      .lane-title { font-family: "Architects Daughter", "Comic Sans MS", cursive; font-size: 27px; fill: #263445; }
      .card-title { font-family: "Architects Daughter", "Comic Sans MS", cursive; font-size: 25px; fill: #102033; }
      .card-small { font-family: "Comic Mono", "SFMono-Regular", monospace; font-size: 14px; fill: #394959; }
      .lane-blue { fill: #eef6ff; stroke: #9cc8ff; }
      .lane-green { fill: #eefaf2; stroke: #9ad8ae; }
      .lane-orange { fill: #fff8eb; stroke: #ffc879; }
      .lane-red { fill: #fff1f0; stroke: #ffaaa3; }
      .lane-purple { fill: #f6f1ff; stroke: #c7b6ff; }
      .card-blue { fill: #ffffff; stroke: #2f6df6; }
      .card-green { fill: #ffffff; stroke: #18964a; }
      .card-orange { fill: #ffffff; stroke: #f07d22; }
      .card-red { fill: #ffffff; stroke: #f04438; }
      .card-purple { fill: #ffffff; stroke: #7c3aed; }
      .line-blue { fill: none; stroke: #2f6df6; stroke-width: 3.2; stroke-linecap: round; stroke-linejoin: round; }
      .line-green { fill: none; stroke: #18a558; stroke-width: 3.2; stroke-linecap: round; stroke-linejoin: round; }
      .line-orange { fill: none; stroke: #f07d22; stroke-width: 3.2; stroke-linecap: round; stroke-linejoin: round; }
      .line-red { fill: none; stroke: #f04438; stroke-width: 3.2; stroke-linecap: round; stroke-linejoin: round; }
      .line-purple { fill: none; stroke: #7c3aed; stroke-width: 3.2; stroke-linecap: round; stroke-linejoin: round; }
    </style>
    <marker id="ewf-arrow-blue" viewBox="0 0 14 14" refX="12" refY="7" markerWidth="12" markerHeight="12" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 1 1 L 13 7 L 1 13 Z" fill="#2f6df6" stroke-dasharray="none"/>
    </marker>
    <marker id="ewf-arrow-green" viewBox="0 0 14 14" refX="12" refY="7" markerWidth="12" markerHeight="12" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 1 1 L 13 7 L 1 13 Z" fill="#18a558" stroke-dasharray="none"/>
    </marker>
    <marker id="ewf-arrow-orange" viewBox="0 0 14 14" refX="12" refY="7" markerWidth="12" markerHeight="12" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 1 1 L 13 7 L 1 13 Z" fill="#f07d22" stroke-dasharray="none"/>
    </marker>
    <marker id="ewf-arrow-red" viewBox="0 0 14 14" refX="12" refY="7" markerWidth="12" markerHeight="12" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 1 1 L 13 7 L 1 13 Z" fill="#f04438" stroke-dasharray="none"/>
    </marker>
    <marker id="ewf-arrow-purple" viewBox="0 0 14 14" refX="12" refY="7" markerWidth="12" markerHeight="12" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 1 1 L 13 7 L 1 13 Z" fill="#7c3aed" stroke-dasharray="none"/>
    </marker>
  </defs>

  <rect class="canvas" x="0" y="0" width="1840" height="1040"/>
  <rect x="24" y="24" width="1792" height="992" rx="22" fill="#ffffff" stroke="#d7e0eb" stroke-width="2"/>

  <text class="title" x="920" y="72" text-anchor="middle">Book request outcomes</text>
  <text class="subtitle" x="920" y="102" text-anchor="middle">Each endpoint uses the same coroutine service but takes a different persistence or error path.</text>

  <rect class="lane-blue" x="80" y="145" width="1680" height="135" rx="18" stroke-width="2"/>
  <text class="lane-title" x="114" y="190">Read all</text>
  <rect class="card-blue" x="330" y="188" width="255" height="64" rx="10" stroke-width="2"/>
  <text class="card-title" x="458" y="216" text-anchor="middle">GET /v1/books</text>
  <text class="card-small" x="458" y="237" text-anchor="middle">controller.getAllBooks</text>
  <rect class="card-blue" x="720" y="188" width="255" height="64" rx="10" stroke-width="2"/>
  <text class="card-title" x="848" y="216" text-anchor="middle">service.getAll</text>
  <text class="card-small" x="848" y="237" text-anchor="middle">repository.findAll</text>
  <rect class="card-blue" x="1110" y="188" width="255" height="64" rx="10" stroke-width="2"/>
  <text class="card-title" x="1238" y="216" text-anchor="middle">books index</text>
  <text class="card-small" x="1238" y="237" text-anchor="middle">return List&lt;Book&gt;</text>
  <path class="line-blue" d="M 585 220 L 708 220" marker-end="url(#ewf-arrow-blue)" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="line-blue" d="M 975 220 L 1098 220" marker-end="url(#ewf-arrow-blue)" stroke-linecap="round" stroke-linejoin="round"/>

  <rect class="lane-green" x="80" y="315" width="1680" height="135" rx="18" stroke-width="2"/>
  <text class="lane-title" x="114" y="360">Create or update</text>
  <rect class="card-green" x="330" y="358" width="255" height="64" rx="10" stroke-width="2"/>
  <text class="card-title" x="458" y="386" text-anchor="middle">POST / PUT</text>
  <text class="card-small" x="458" y="407" text-anchor="middle">ModifyBookRequest</text>
  <rect class="card-green" x="720" y="358" width="255" height="64" rx="10" stroke-width="2"/>
  <text class="card-title" x="848" y="386" text-anchor="middle">validate rules</text>
  <text class="card-small" x="848" y="407" text-anchor="middle">year and duplicate ISBN</text>
  <rect class="card-green" x="1110" y="358" width="255" height="64" rx="10" stroke-width="2"/>
  <text class="card-title" x="1238" y="386" text-anchor="middle">repository.save</text>
  <text class="card-small" x="1238" y="407" text-anchor="middle">persist Book document</text>
  <path class="line-green" d="M 585 390 L 708 390" marker-end="url(#ewf-arrow-green)" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="line-green" d="M 975 390 L 1098 390" marker-end="url(#ewf-arrow-green)" stroke-linecap="round" stroke-linejoin="round"/>

  <rect class="lane-orange" x="80" y="485" width="1680" height="135" rx="18" stroke-width="2"/>
  <text class="lane-title" x="114" y="530">ISBN lookup</text>
  <rect class="card-orange" x="330" y="528" width="255" height="64" rx="10" stroke-width="2"/>
  <text class="card-title" x="458" y="556" text-anchor="middle">GET /{isbn}</text>
  <text class="card-small" x="458" y="577" text-anchor="middle">path variable</text>
  <rect class="card-orange" x="720" y="528" width="255" height="64" rx="10" stroke-width="2"/>
  <text class="card-title" x="848" y="556" text-anchor="middle">findByIsbn</text>
  <text class="card-small" x="848" y="577" text-anchor="middle">suspend repository method</text>
  <rect class="card-orange" x="1110" y="528" width="255" height="64" rx="10" stroke-width="2"/>
  <text class="card-title" x="1238" y="556" text-anchor="middle">Book or 404</text>
  <text class="card-small" x="1238" y="577" text-anchor="middle">not found handled globally</text>
  <path class="line-orange" d="M 585 560 L 708 560" marker-end="url(#ewf-arrow-orange)" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="line-orange" d="M 975 560 L 1098 560" marker-end="url(#ewf-arrow-orange)" stroke-linecap="round" stroke-linejoin="round"/>

  <rect class="lane-purple" x="80" y="655" width="1680" height="135" rx="18" stroke-width="2"/>
  <text class="lane-title" x="114" y="700">Title and author query</text>
  <rect class="card-purple" x="330" y="698" width="255" height="64" rx="10" stroke-width="2"/>
  <text class="card-title" x="458" y="726" text-anchor="middle">GET /query</text>
  <text class="card-small" x="458" y="747" text-anchor="middle">title + author params</text>
  <rect class="card-purple" x="720" y="698" width="255" height="64" rx="10" stroke-width="2"/>
  <text class="card-title" x="848" y="726" text-anchor="middle">NativeQuery</text>
  <text class="card-small" x="848" y="747" text-anchor="middle">bool match clauses</text>
  <rect class="card-purple" x="1110" y="698" width="255" height="64" rx="10" stroke-width="2"/>
  <text class="card-title" x="1238" y="726" text-anchor="middle">Template search</text>
  <text class="card-small" x="1238" y="747" text-anchor="middle">SearchHit to Book</text>
  <path class="line-purple" d="M 585 730 L 708 730" marker-end="url(#ewf-arrow-purple)" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="line-purple" d="M 975 730 L 1098 730" marker-end="url(#ewf-arrow-purple)" stroke-linecap="round" stroke-linejoin="round"/>

  <rect class="lane-red" x="80" y="825" width="1680" height="135" rx="18" stroke-width="2"/>
  <text class="lane-title" x="114" y="870">Delete and errors</text>
  <rect class="card-red" x="330" y="868" width="255" height="64" rx="10" stroke-width="2"/>
  <text class="card-title" x="458" y="896" text-anchor="middle">DELETE /{id}</text>
  <text class="card-small" x="458" y="917" text-anchor="middle">existsById guard</text>
  <rect class="card-red" x="720" y="868" width="255" height="64" rx="10" stroke-width="2"/>
  <text class="card-title" x="848" y="896" text-anchor="middle">delete or throw</text>
  <text class="card-small" x="848" y="917" text-anchor="middle">BookNotFoundException</text>
  <rect class="card-red" x="1110" y="868" width="255" height="64" rx="10" stroke-width="2"/>
  <text class="card-title" x="1238" y="896" text-anchor="middle">mapped response</text>
  <text class="card-small" x="1238" y="917" text-anchor="middle">204, 404, or 400</text>
  <path class="line-red" d="M 585 900 L 708 900" marker-end="url(#ewf-arrow-red)" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="line-red" d="M 975 900 L 1098 900" marker-end="url(#ewf-arrow-red)" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
