<svg xmlns="http://www.w3.org/2000/svg" width="1960" height="1194" viewBox="0 0 1960 1194" role="img" aria-label="Event Publication Flow">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#1f2937" flood-opacity="0.10"/></filter>
  <marker id="openArrow" markerWidth="10" markerHeight="8" refX="8.5" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M 1 1 L 8.5 4 L 1 7" fill="none" stroke="#758297" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <marker id="inherit" markerWidth="11" markerHeight="10" refX="9.5" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 1 L 9.5 5 L 0.5 9 Z" fill="#ffffff" stroke="#758297" stroke-width="1.7"/></marker>
  <style>
    .canvas{fill:#f7f9fc}.frame{fill:#fff;stroke:#d8e0ea;stroke-width:1.5}
    .title{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:43px;font-weight:400;fill:#102033}
    .subtitle{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:15px;font-weight:400;fill:#536273}
    .label{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:25px;font-weight:400;fill:#102033}
    .smallLabel{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:21px;font-weight:400;fill:#102033}
    .mono{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#102033}
    .small{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#536273}
    .strong{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:13px;font-weight:400;fill:#102033}
    .card{stroke-width:2.1;filter:url(#shadow)}.compartment{stroke-width:1.5;fill:none}
    .line{stroke:#758297;stroke-width:2.1;fill:none;marker-end:url(#openArrow)}
    .plainLine{stroke:#758297;stroke-width:2.1;fill:none}
    .dashed{stroke:#758297;stroke-width:2.1;stroke-dasharray:7 6;fill:none;marker-end:url(#openArrow)}
    .inheritLine{stroke:#758297;stroke-width:2.2;fill:none;marker-end:url(#inherit)}
    .implLine{stroke:#758297;stroke-width:2.2;stroke-dasharray:8 7;fill:none;marker-end:url(#inherit)}
  </style>
</defs>
<rect class="canvas" width="1960" height="1194"/>
<rect class="frame" x="32" y="28" width="1896" height="1138" rx="28"/>
<text class="title" x="66" y="82">Event Publication Flow</text>
<text class="subtitle" x="70" y="118">Sequence messages from the original Mermaid source</text>
<rect class="card" x="-10" y="166" width="300" height="72" rx="20" fill="#E8F3FF" stroke="#5B8DEF"/>
<text class="smallLabel" x="140" y="209" text-anchor="middle">Client</text>
<line class="lifeline" x1="140" y1="252" x2="140" y2="1134" stroke="#b7c2d1" stroke-width="2" stroke-dasharray="10 10"/>
<rect class="card" x="410" y="166" width="300" height="72" rx="20" fill="#EAF7EF" stroke="#58A978"/>
<text class="smallLabel" x="560" y="198.5" text-anchor="middle">OrderManagement</text>
<text class="smallLabel" x="560" y="219.5" text-anchor="middle">(@Transactional)</text>
<line class="lifeline" x1="560" y1="252" x2="560" y2="1134" stroke="#b7c2d1" stroke-width="2" stroke-dasharray="10 10"/>
<rect class="card" x="830" y="166" width="300" height="72" rx="20" fill="#FFF3D9" stroke="#D6A441"/>
<text class="smallLabel" x="980" y="198.5" text-anchor="middle">Application Event</text>
<text class="smallLabel" x="980" y="219.5" text-anchor="middle">Publisher</text>
<line class="lifeline" x1="980" y1="252" x2="980" y2="1134" stroke="#b7c2d1" stroke-width="2" stroke-dasharray="10 10"/>
<rect class="card" x="1250" y="166" width="300" height="72" rx="20" fill="#FDECEF" stroke="#DC6B82"/>
<text class="smallLabel" x="1400" y="209" text-anchor="middle">Database</text>
<line class="lifeline" x1="1400" y1="252" x2="1400" y2="1134" stroke="#b7c2d1" stroke-width="2" stroke-dasharray="10 10"/>
<rect class="card" x="1670" y="166" width="300" height="72" rx="20" fill="#E9F7F6" stroke="#45A7A1"/>
<text class="smallLabel" x="1820" y="209" text-anchor="middle">EventListener</text>
<line class="lifeline" x1="1820" y1="252" x2="1820" y2="1134" stroke="#b7c2d1" stroke-width="2" stroke-dasharray="10 10"/>
<rect x="239" y="286" width="222" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="257" y="313" text-anchor="start">1. completeOrder(order)</text>
<path class="line" d="M140 344 L560 344"/>
<rect x="861" y="396" width="238" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="879" y="423" text-anchor="start">2. save(order.complete())</text>
<path class="line" d="M560 454 L1400 454"/>
<rect x="647" y="506" width="246" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="665" y="533" text-anchor="start">3. publish(OrderCompleted)</text>
<path class="line" d="M560 564 L980 564"/>
<rect x="1249" y="616" width="302" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="1267" y="643" text-anchor="start">4. on(OrderCompleted) — immediate</text>
<path class="line" d="M980 674 L1820 674"/>
<rect x="70" y="726" width="1820" height="40" rx="16" fill="#F7F1E7" stroke="#B88A44" stroke-width="1.6" opacity="0.96"/>
<text class="strong" x="92" y="753" text-anchor="start">ALT: @TransactionalEventListener</text>
<rect x="1085" y="794" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="1103" y="821" text-anchor="start">6. TX commit</text>
<path class="dashed" d="M1400 852 L980 852"/>
<rect x="1236.5" y="904" width="327" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="1254.5" y="931" text-anchor="start">7. on(OrderCompleted) — after commit</text>
<path class="line" d="M980 962 L1820 962"/>
<rect x="245" y="1014" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="263" y="1041" text-anchor="start">8. done</text>
<path class="dashed" d="M560 1072 L140 1072"/>
</svg>
