<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" role="img" aria-label="Spring Modulith Events Architecture">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%">
    <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#1f2937" flood-opacity="0.10"/>
  </filter>
  <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth">
    <path d="M1,1 L8,4.5 L1,8 Z" fill="#758297"/>
  </marker>
  <style>
    .canvas{fill:#f7f9fc}.frame{fill:#fff;stroke:#d8e0ea;stroke-width:1.5}
    .title{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:38px;font-weight:400;fill:#102033}
    .subtitle{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:14px;font-weight:400;fill:#536273}
    .smallLabel{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:21px;font-weight:400;fill:#102033}
    .mono{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#102033}
    .small{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#536273}
    .card{stroke-width:2.1;filter:url(#shadow)}
    .line{stroke:#758297;stroke-width:2.1;fill:none;marker-end:url(#arrow)}
    .dashed{stroke:#758297;stroke-width:2.1;stroke-dasharray:7 5;fill:none;marker-end:url(#arrow)}
  </style>
</defs>
<rect class="canvas" width="960" height="440"/>
<rect class="frame" x="24" y="20" width="912" height="396" rx="20"/>
<text class="title" x="48" y="66">Spring Modulith Events Architecture</text>
<text class="subtitle" x="48" y="90">ApplicationEventPublisher · @ApplicationModuleListener · event publication · OrderManagement</text>

<!-- Col 1: Publisher / Command side -->
<rect class="card" x="48" y="108" width="260" height="36" rx="8" fill="#E8F3FF" stroke="#5B8DEF"/>
<text class="smallLabel" x="178" y="132" text-anchor="middle">Publisher</text>

<rect class="card" x="48" y="156" width="260" height="64" rx="10" fill="#ffffff" stroke="#5B8DEF" stroke-width="1.8" filter="url(#shadow)"/>
<text class="mono" x="178" y="179" text-anchor="middle" fill="#102033">OrderManagement</text>
<text class="small" x="178" y="196" text-anchor="middle">places order → publishes</text>
<text class="small" x="178" y="211" text-anchor="middle">OrderPlaced event</text>

<rect class="card" x="48" y="232" width="260" height="64" rx="10" fill="#ffffff" stroke="#5B8DEF" stroke-width="1.8" filter="url(#shadow)"/>
<text class="mono" x="178" y="255" text-anchor="middle" fill="#102033">ApplicationEvent</text>
<text class="mono" x="178" y="271" text-anchor="middle" fill="#102033">Publisher.publishEvent()</text>
<text class="small" x="178" y="285" text-anchor="middle">Spring event bus</text>

<!-- Arrow (event flow) -->
<path class="dashed" d="M310 228 L370 228"/>

<!-- Col 2: Event + Publication log -->
<rect class="card" x="372" y="108" width="220" height="36" rx="8" fill="#EAF7EF" stroke="#58A978"/>
<text class="smallLabel" x="482" y="132" text-anchor="middle">Events</text>

<rect class="card" x="372" y="156" width="220" height="64" rx="10" fill="#ffffff" stroke="#58A978" stroke-width="1.8" filter="url(#shadow)"/>
<text class="mono" x="482" y="178" text-anchor="middle" fill="#102033">OrderPlaced</text>
<text class="small" x="482" y="195" text-anchor="middle">data class / record</text>
<text class="small" x="482" y="209" text-anchor="middle">orderId, customerId</text>

<rect class="card" x="372" y="232" width="220" height="64" rx="10" fill="#ffffff" stroke="#58A978" stroke-width="1.8" filter="url(#shadow)"/>
<text class="mono" x="482" y="255" text-anchor="middle" fill="#102033">EventPublication</text>
<text class="small" x="482" y="271" text-anchor="middle">log in DB</text>
<text class="small" x="482" y="285" text-anchor="middle">retry on failure</text>

<!-- Arrow -->
<path class="dashed" d="M594 228 L654 228"/>

<!-- Col 3: Listeners -->
<rect class="card" x="656" y="108" width="256" height="36" rx="8" fill="#FFF3D9" stroke="#D6A441"/>
<text class="smallLabel" x="784" y="132" text-anchor="middle">Listeners</text>

<rect class="card" x="656" y="156" width="256" height="64" rx="10" fill="#ffffff" stroke="#D6A441" stroke-width="1.8" filter="url(#shadow)"/>
<text class="mono" x="784" y="178" text-anchor="middle" fill="#102033">@ApplicationModule</text>
<text class="mono" x="784" y="194" text-anchor="middle" fill="#102033">Listener</text>
<text class="small" x="784" y="211" text-anchor="middle">transactional event listener</text>

<rect class="card" x="656" y="232" width="256" height="64" rx="10" fill="#ffffff" stroke="#DC6B82" stroke-width="1.8" filter="url(#shadow)"/>
<text class="mono" x="784" y="255" text-anchor="middle" fill="#102033">InventoryManagement</text>
<text class="small" x="784" y="271" text-anchor="middle">onOrderPlaced(event)</text>
<text class="small" x="784" y="285" text-anchor="middle">updates stock</text>

<rect class="card" x="656" y="308" width="256" height="64" rx="10" fill="#ffffff" stroke="#45A7A1" stroke-width="1.8" filter="url(#shadow)"/>
<text class="mono" x="784" y="331" text-anchor="middle" fill="#102033">NotificationManager</text>
<text class="small" x="784" y="347" text-anchor="middle">onOrderPlaced(event)</text>
<text class="small" x="784" y="363" text-anchor="middle">sends notification</text>

<!-- Bottom note -->
<rect class="card" x="48" y="386" width="864" height="30" rx="8" fill="#f1f5f9" stroke="#d8e0ea" filter="url(#shadow)"/>
<text class="small" x="480" y="407" text-anchor="middle" fill="#536273">Events published in same transaction — listeners execute in AFTER_COMMIT phase (or async)</text>
</svg>
