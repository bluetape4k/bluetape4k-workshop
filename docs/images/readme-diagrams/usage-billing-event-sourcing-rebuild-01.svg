<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="950" viewBox="0 0 1600 950" role="img" aria-labelledby="title desc"><title id="title">Online Projection Rebuild</title><desc id="desc">High-watermark capture, shadow catch-up, conditional switch, and bounded rollback.</desc><defs><filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#64748B" flood-opacity="0.14"/></filter><marker id="seq-blue" viewBox="0 0 10 10" markerWidth="14" markerHeight="14" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse" data-role="primary" data-tip-direction="positive-x"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#4F86C6" stroke="#4F86C6" stroke-dasharray="none"/></marker><marker id="seq-green" viewBox="0 0 10 10" markerWidth="14" markerHeight="14" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse" data-role="primary" data-tip-direction="positive-x"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#6E8F4F" stroke="#6E8F4F" stroke-dasharray="none"/></marker><marker id="seq-amber" viewBox="0 0 10 10" markerWidth="14" markerHeight="14" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse" data-role="primary" data-tip-direction="positive-x"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#9B7D54" stroke="#9B7D54" stroke-dasharray="none"/></marker><marker id="seq-red" viewBox="0 0 10 10" markerWidth="14" markerHeight="14" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse" data-role="primary" data-tip-direction="positive-x"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#B86868" stroke="#B86868" stroke-dasharray="none"/></marker><marker id="seq-purple" viewBox="0 0 10 10" markerWidth="14" markerHeight="14" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse" data-role="primary" data-tip-direction="positive-x"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#8065A8" stroke="#8065A8" stroke-dasharray="none"/></marker><marker id="seq-teal" viewBox="0 0 10 10" markerWidth="14" markerHeight="14" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse" data-role="primary" data-tip-direction="positive-x"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#2D948C" stroke="#2D948C" stroke-dasharray="none"/></marker><style>
  .bg{fill:#F8FAFC}.frame{fill:#FFF;stroke:#CAD6DF;stroke-width:2}.alt{fill:none;stroke:#DFC69A;stroke-width:2}.zone{stroke-width:2}.blueZone{fill:#EFF6FF;stroke:#A8C7EA}.greenZone{fill:#F0F8F0;stroke:#B8D7AE}.purpleZone{fill:#F8F3FF;stroke:#D7C3EF}.amberZone{fill:#FFF7E8;stroke:#DFC69A}.title{font-family:"Architects Daughter";font-size:40px;fill:#263238}.subtitle,.body,.small,.msg,.footer{font-family:"Comic Mono";fill:#3E4C59}.subtitle{font-size:17px}.zoneTitle{font-family:"Architects Daughter";font-size:25px;fill:#344154}.cardTitle,.participant{font-family:"Architects Daughter";font-size:22px;fill:#16202A}.body{font-size:15px}.small{font-size:13px;fill:#5B6975}.footer{font-size:14px;fill:#60727D}.card{fill:#FFF;stroke:#9FB0BC;stroke-width:2}.blueCard{fill:#EFF6FF;stroke:#4F86C6}.greenCard{fill:#F0F8F0;stroke:#6E8F4F}.amberCard{fill:#FFF7E8;stroke:#9B7D54}.redCard{fill:#FFF0F0;stroke:#B86868}.purpleCard{fill:#F8F3FF;stroke:#8065A8}.edgePath{fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.blueEdge{stroke:#4F86C6;marker-end:url(#seq-blue)}.greenEdge{stroke:#6E8F4F;marker-end:url(#seq-green)}.amberEdge{stroke:#9B7D54;marker-end:url(#seq-amber)}.redEdge{stroke:#B86868;marker-end:url(#seq-red)}.purpleEdge{stroke:#8065A8;marker-end:url(#seq-purple)}.tealEdge{stroke:#2D948C;marker-end:url(#seq-teal)}.dashed{stroke-dasharray:9 7}.lifeline{stroke:#9AAAB1;stroke-width:2;stroke-dasharray:7 8}.activation{fill:#EAF6EF;stroke:#6F9278;stroke-width:1.5}.labelPill{fill:#FFF;stroke:#D7E0E4;stroke-width:1.5}.badge{font-family:"Comic Mono";font-size:13px;font-weight:700}.frameLabel{font-family:"Architects Daughter";font-size:18px;fill:#8B6A3E}
</style></defs><rect class="bg" width="1600" height="950"/><rect class="frame" x="28" y="24" width="1544" height="902" rx="22"/><text class="title" x="800" y="66" text-anchor="middle">Online Projection Rebuild</text><text class="subtitle" x="800" y="98" text-anchor="middle">High-watermark capture, shadow catch-up, conditional switch, and bounded rollback.</text><rect class="zone blueZone" x="70" y="140" width="1460" height="650" rx="22"/><text class="zoneTitle" x="98" y="182">Safe online rebuild</text><g class="node" data-node="capture" filter="url(#shadow)"><rect class="card blueCard" x="100" y="300" width="240" height="100" rx="15"/><text class="cardTitle" x="220" y="333" text-anchor="middle">1. Capture</text><text class="body" x="220" y="361" text-anchor="middle">event-store watermark</text><text class="body" x="220" y="383" text-anchor="middle">ACTIVE generation N</text></g><g class="node" data-node="create" filter="url(#shadow)"><rect class="card purpleCard" x="400" y="300" width="240" height="100" rx="15"/><text class="cardTitle" x="520" y="333" text-anchor="middle">2. Create N+1</text><text class="body" x="520" y="361" text-anchor="middle">BUILDING tables</text><text class="body" x="520" y="383" text-anchor="middle">isolated writes</text></g><g class="node" data-node="catchup" filter="url(#shadow)"><rect class="card greenCard" x="700" y="300" width="240" height="100" rx="15"/><text class="cardTitle" x="820" y="333" text-anchor="middle">3. Catch up</text><text class="body" x="820" y="361" text-anchor="middle">global position pages</text><text class="body" x="820" y="383" text-anchor="middle">lease + fencing</text></g><g class="node" data-node="switch" filter="url(#shadow)"><rect class="card amberCard" x="1000" y="300" width="240" height="100" rx="15"/><text class="cardTitle" x="1120" y="333" text-anchor="middle">4. Switch</text><text class="body" x="1120" y="361" text-anchor="middle">checkpoint >= watermark</text><text class="body" x="1120" y="383" text-anchor="middle">conditional alias CAS</text></g><g class="node" data-node="observe" filter="url(#shadow)"><rect class="card greenCard" x="1300" y="300" width="240" height="100" rx="15"/><text class="cardTitle" x="1420" y="333" text-anchor="middle">5. Observe</text><text class="body" x="1420" y="361" text-anchor="middle">lag + reconciliation</text><text class="body" x="1420" y="383" text-anchor="middle">rollback window</text></g><g class="edge" data-edge="capture-create" data-label="freeze target"><path data-connector="capture-create" class="edgePath blueEdge" style="marker-end:none" d="M340 350 L400 350"/><polygon data-connector-head="capture-create" data-arrow-direction="right" points="400,350 386,342 386,358" fill="#4F86C6" stroke="#4F86C6" stroke-dasharray="none" style="stroke-dasharray:none"/></g><g class="edge" data-edge="create-catchup" data-label="private generation"><path data-connector="create-catchup" class="edgePath purpleEdge" style="marker-end:none" d="M640 350 L700 350"/><polygon data-connector-head="create-catchup" data-arrow-direction="right" points="700,350 686,342 686,358" fill="#8065A8" stroke="#8065A8" stroke-dasharray="none" style="stroke-dasharray:none"/></g><g class="edge" data-edge="catchup-switch" data-label="fenced ownership"><path data-connector="catchup-switch" class="edgePath greenEdge" style="marker-end:none" d="M940 350 L1000 350"/><polygon data-connector-head="catchup-switch" data-arrow-direction="right" points="1000,350 986,342 986,358" fill="#6E8F4F" stroke="#6E8F4F" stroke-dasharray="none" style="stroke-dasharray:none"/></g><g class="edge" data-edge="switch-observe" data-label="ACTIVE N+1"><path data-connector="switch-observe" class="edgePath amberEdge" style="marker-end:none" d="M1240 350 L1300 350"/><polygon data-connector-head="switch-observe" data-arrow-direction="right" points="1300,350 1286,342 1286,358" fill="#9B7D54" stroke="#9B7D54" stroke-dasharray="none" style="stroke-dasharray:none"/></g><g class="node" data-node="events" filter="url(#shadow)"><rect class="card purpleCard" x="180" y="570" width="400" height="100" rx="15"/><text class="cardTitle" x="380" y="603" text-anchor="middle">Append-only event store</text><text class="body" x="380" y="631" text-anchor="middle">new events continue during rebuild</text></g><g class="node" data-node="old-view" filter="url(#shadow)"><rect class="card greenCard" x="700" y="570" width="300" height="100" rx="15"/><text class="cardTitle" x="850" y="603" text-anchor="middle">Generation N</text><text class="body" x="850" y="631" text-anchor="middle">serves until switch</text></g><g class="node" data-node="new-view" filter="url(#shadow)"><rect class="card blueCard" x="1120" y="570" width="300" height="100" rx="15"/><text class="cardTitle" x="1270" y="603" text-anchor="middle">Generation N+1</text><text class="body" x="1270" y="631" text-anchor="middle">shadow then ACTIVE</text></g><g class="edge" data-edge="events-new" data-label="repeat pages to moving head"><path data-connector="events-new" class="edgePath purpleEdge" style="marker-end:none" d="M500 670 L500 710 Q 500 725 515 725 L1255 725 Q 1270 725 1270 710 L1270 670"/><polygon data-connector-head="events-new" data-arrow-direction="up" points="1270,670 1262,684 1278,684" fill="#8065A8" stroke="#8065A8" stroke-dasharray="none" style="stroke-dasharray:none"/></g><text class="small" x="885" y="750" text-anchor="middle">repeat pages to moving head</text><g class="edge" data-edge="old-new" data-label="atomic alias only"><path data-connector="old-new" class="edgePath amberEdge dashed" style="marker-end:none" d="M1000 620 L1120 620"/><polygon data-connector-head="old-new" data-arrow-direction="right" points="1120,620 1106,612 1106,628" fill="#9B7D54" stroke="#9B7D54" stroke-dasharray="none" style="stroke-dasharray:none"/></g><text class="small" x="1060" y="608" text-anchor="middle">alias CAS</text><text class="footer" x="800" y="860" text-anchor="middle">A failed BUILDING generation leaves the healthy ACTIVE view untouched; rollback targets a retained generation.</text></svg>