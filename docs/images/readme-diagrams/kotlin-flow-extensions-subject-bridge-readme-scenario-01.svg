  <path class="line-green" d="M 600 213 L 650 213 Q 670 213 670 393 L 700 393"/>
  <path class="line-purple" d="M 910 183 L 955 183 Q 975 183 975 226 L 1000 226"/>
  <path class="line-purple" d="M 910 393 L 955 393 Q 975 393 975 371 L 1000 371"/>
  <path class="line-orange" d="M 485 256 L 485 480 Q 485 506 511 506 L 960 506 Q 980 506 980 543 L 1000 543"/>
  <rect x="678" y="473" width="144" height="24" rx="12" fill="#ffffff" stroke="#d5e1ef"/>
  <text class="label" x="750" y="491">termination</text>
  <rect x="105" y="650" width="1190" height="70" rx="14" fill="#eefaf2" stroke="#9bd0aa"/>
  <text class="lane-title" x="130" y="688">Reader contract</text>
  <text class="card-text" x="735" y="690">Choose the Subject by delivery semantics before writing callback glue.</text>
