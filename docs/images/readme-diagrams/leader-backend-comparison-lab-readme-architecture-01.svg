<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="1240" viewBox="0 0 1700 1240" role="img" aria-labelledby="title desc">
  <title id="title">Leader Backend Comparison Lab Architecture</title>
  <desc id="desc">A learner runs the deterministic comparison lab, reads source-backed backend profiles, then follows existing Redis, ZooKeeper, and Kubernetes Lease practice modules for real backend integration.</desc>
  <defs>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="124%"><feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#64748B" flood-opacity="0.12"/></filter>
    <style>
      .bg{fill:#F8FAFC}.title{font-family:"Architects Daughter";font-size:42px;fill:#263238}.subtitle,.body,.small,.legendText,.footer{font-family:"Comic Mono";fill:#3B4A54}.subtitle{font-size:18px}.layerTitle{font-family:"Architects Daughter";font-size:25px;fill:#344154}.cardTitle{font-family:"Architects Daughter";font-size:23px;fill:#16202A}.body{font-size:15px}.small{font-size:13px;fill:#5B6975}.footer{font-size:14px;fill:#60727D}.layer{fill:#FFFFFF;stroke:#CAD6DF;stroke-width:2}.card{stroke-width:2.2}.blue{fill:#EFF6FF;stroke:#4F86C6}.green{fill:#F0F8F0;stroke:#6E8F4F}.amber{fill:#FFF7E8;stroke:#9B7D54}.teal{fill:#EBFAF8;stroke:#2D948C}.red{fill:#FFF0F0;stroke:#B86868}.connector{fill:none;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round}.learn{stroke:#4F86C6}.model{stroke:#2D948C}.practice{stroke:#6E8F4F}.optional{stroke:#B86868;stroke-dasharray:12 8}.arrowHead{stroke-dasharray:none;stroke-linejoin:round}.legendBox{fill:#FFFFFF;stroke:#CAD6DF;stroke-width:1.8}.legendText{font-size:14px}
    </style>
  </defs>
  <rect class="bg" width="1700" height="1240"/>
  <text class="title" x="850" y="66" text-anchor="middle">Leader Backend Comparison Lab</text>
  <text class="subtitle" x="850" y="100" text-anchor="middle">Deterministic profile and failover reports point learners to real Redis, ZooKeeper, and Kubernetes practice modules.</text>

  <rect class="layer" x="70" y="136" width="1560" height="166" rx="20"/>
  <text class="layerTitle" x="106" y="180">Learner entry</text>
  <g class="node" data-node="learner" filter="url(#shadow)"><rect class="card blue" x="670" y="200" width="360" height="86" rx="12"/><text class="cardTitle" x="850" y="234" text-anchor="middle">README + tests</text><text class="body" x="850" y="260" text-anchor="middle">compare backends locally</text></g>

  <rect class="layer" x="70" y="360" width="1560" height="190" rx="20"/>
  <text class="layerTitle" x="106" y="404">Deterministic lab module</text>
  <g class="node" data-node="catalog" filter="url(#shadow)"><rect class="card teal" x="120" y="430" width="360" height="86" rx="12"/><text class="cardTitle" x="300" y="464" text-anchor="middle">LeaderBackendCatalog</text><text class="body" x="300" y="490" text-anchor="middle">source-backed profiles</text></g>
  <g class="node" data-node="failover-lab" filter="url(#shadow)"><rect class="card teal" x="670" y="430" width="360" height="86" rx="12"/><text class="cardTitle" x="850" y="464" text-anchor="middle">LeaderFailoverLab</text><text class="body" x="850" y="490" text-anchor="middle">steady, skip, fail, handoff</text></g>
  <g class="node" data-node="scenario-report" filter="url(#shadow)"><rect class="card teal" x="1170" y="430" width="360" height="86" rx="12"/><text class="cardTitle" x="1350" y="464" text-anchor="middle">ScenarioReport</text><text class="body" x="1350" y="490" text-anchor="middle">events + metrics to inspect</text></g>

  <rect class="layer" x="70" y="608" width="1560" height="190" rx="20"/>
  <text class="layerTitle" x="106" y="652">Backend profiles</text>
  <g class="node" data-node="redis-profile" filter="url(#shadow)"><rect class="card amber" x="120" y="680" width="360" height="86" rx="12"/><text class="cardTitle" x="300" y="714" text-anchor="middle">Redis + Lettuce</text><text class="body" x="300" y="740" text-anchor="middle">TTL lease, Flow events</text></g>
  <g class="node" data-node="zookeeper-profile" filter="url(#shadow)"><rect class="card amber" x="670" y="680" width="360" height="86" rx="12"/><text class="cardTitle" x="850" y="714" text-anchor="middle">ZooKeeper + Curator</text><text class="body" x="850" y="740" text-anchor="middle">session-bound ownership</text></g>
  <g class="node" data-node="kubernetes-profile" filter="url(#shadow)"><rect class="card red" x="1170" y="680" width="360" height="86" rx="12"/><text class="cardTitle" x="1350" y="714" text-anchor="middle">Kubernetes Lease</text><text class="body" x="1350" y="740" text-anchor="middle">opt-in Lease + Micrometer</text></g>

  <rect class="layer" x="70" y="856" width="1560" height="190" rx="20"/>
  <text class="layerTitle" x="106" y="900">Real backend practice modules</text>
  <g class="node" data-node="redis-module" filter="url(#shadow)"><rect class="card green" x="120" y="928" width="360" height="86" rx="12"/><text class="cardTitle" x="300" y="962" text-anchor="middle">leader-election</text><text class="body" x="300" y="988" text-anchor="middle">Redis Testcontainers practice</text></g>
  <g class="node" data-node="zookeeper-module" filter="url(#shadow)"><rect class="card green" x="670" y="928" width="360" height="86" rx="12"/><text class="cardTitle" x="850" y="962" text-anchor="middle">leader-zookeeper</text><text class="body" x="850" y="988" text-anchor="middle">Curator session practice</text></g>
  <g class="node" data-node="kubernetes-module" filter="url(#shadow)"><rect class="card red" x="1170" y="928" width="360" height="86" rx="12"/><text class="cardTitle" x="1350" y="962" text-anchor="middle">k8s-lease-micrometer</text><text class="body" x="1350" y="988" text-anchor="middle">cluster opt-in practice</text></g>

  <g class="edge" data-edge="learner-&gt;catalog" data-label="learner reads backend profile matrix"><path data-connector="learner-to-catalog" class="connector learn" d="M 850 286 L 850 332 Q 850 352 830 352 L 100 352 Q 80 352 80 372 L 80 453 Q 80 473 100 473 L 120 473"/><polygon data-connector-head="learner-to-catalog" class="arrowHead" points="120,473 104,465 104,481" fill="#4F86C6" stroke="#4F86C6" stroke-dasharray="none" style="stroke-dasharray:none"/></g>
  <g class="edge" data-edge="learner-&gt;failover-lab" data-label="learner runs deterministic failover scenarios"><path data-connector="learner-to-failover" class="connector learn" d="M 850 286 L 850 430"/><polygon data-connector-head="learner-to-failover" class="arrowHead" points="850,430 842,414 858,414" fill="#4F86C6" stroke="#4F86C6" stroke-dasharray="none" style="stroke-dasharray:none"/></g>
  <g class="edge" data-edge="catalog-&gt;failover-lab" data-label="catalog supplies backend semantics"><path data-connector="catalog-to-failover" class="connector model" d="M 480 473 L 670 473"/><polygon data-connector-head="catalog-to-failover" class="arrowHead" points="670,473 654,465 654,481" fill="#2D948C" stroke="#2D948C" stroke-dasharray="none" style="stroke-dasharray:none"/></g>
  <g class="edge" data-edge="failover-lab-&gt;scenario-report" data-label="lab emits scenario report"><path data-connector="failover-to-report" class="connector model" d="M 1030 473 L 1170 473"/><polygon data-connector-head="failover-to-report" class="arrowHead" points="1170,473 1154,465 1154,481" fill="#2D948C" stroke="#2D948C" stroke-dasharray="none" style="stroke-dasharray:none"/></g>
  <g class="edge" data-edge="catalog-&gt;redis-profile" data-label="catalog includes Redis TTL profile"><path data-connector="catalog-to-redis" class="connector model" d="M 300 516 L 300 680"/><polygon data-connector-head="catalog-to-redis" class="arrowHead" points="300,680 292,664 308,664" fill="#2D948C" stroke="#2D948C" stroke-dasharray="none" style="stroke-dasharray:none"/></g>
  <g class="edge" data-edge="catalog-&gt;zookeeper-profile" data-label="catalog includes ZooKeeper session profile"><path data-connector="catalog-to-zookeeper" class="connector model" d="M 480 473 L 560 473 Q 580 473 580 493 L 580 620 Q 580 640 600 640 L 830 640 Q 850 640 850 660 L 850 680"/><polygon data-connector-head="catalog-to-zookeeper" class="arrowHead" points="850,680 842,664 858,664" fill="#2D948C" stroke="#2D948C" stroke-dasharray="none" style="stroke-dasharray:none"/></g>
  <g class="edge" data-edge="catalog-&gt;kubernetes-profile" data-label="catalog includes opt-in Kubernetes Lease profile"><path data-connector="catalog-to-kubernetes" class="connector optional" d="M 480 493 L 540 493 Q 560 493 560 513 L 560 600 Q 560 620 580 620 L 1330 620 Q 1350 620 1350 660 L 1350 680"/><polygon data-connector-head="catalog-to-kubernetes" class="arrowHead" points="1350,680 1342,664 1358,664" fill="#B86868" stroke="#B86868" stroke-dasharray="none" style="stroke-dasharray:none"/></g>
  <g class="edge" data-edge="redis-profile-&gt;redis-module" data-label="Redis profile links to real Redis module"><path data-connector="redis-to-module" class="connector practice" d="M 300 766 L 300 928"/><polygon data-connector-head="redis-to-module" class="arrowHead" points="300,928 292,912 308,912" fill="#6E8F4F" stroke="#6E8F4F" stroke-dasharray="none" style="stroke-dasharray:none"/></g>
  <g class="edge" data-edge="zookeeper-profile-&gt;zookeeper-module" data-label="ZooKeeper profile links to Curator module"><path data-connector="zookeeper-to-module" class="connector practice" d="M 850 766 L 850 928"/><polygon data-connector-head="zookeeper-to-module" class="arrowHead" points="850,928 842,912 858,912" fill="#6E8F4F" stroke="#6E8F4F" stroke-dasharray="none" style="stroke-dasharray:none"/></g>
  <g class="edge" data-edge="kubernetes-profile-&gt;kubernetes-module" data-label="Kubernetes profile links to opt-in module"><path data-connector="kubernetes-to-module" class="connector optional" d="M 1350 766 L 1350 928"/><polygon data-connector-head="kubernetes-to-module" class="arrowHead" points="1350,928 1342,912 1358,912" fill="#B86868" stroke="#B86868" stroke-dasharray="none" style="stroke-dasharray:none"/></g>

  <rect class="legendBox" x="176" y="1084" width="1348" height="78" rx="16"/>
  <path d="M 250 1118 L 324 1118" fill="none" stroke="#4F86C6" stroke-width="4" stroke-linecap="round"/><polygon points="324,1118 308,1110 308,1126" fill="#4F86C6"/><text class="legendText" x="342" y="1123">learner action</text>
  <path d="M 520 1118 L 594 1118" fill="none" stroke="#2D948C" stroke-width="4" stroke-linecap="round"/><polygon points="594,1118 578,1110 578,1126" fill="#2D948C"/><text class="legendText" x="612" y="1123">deterministic model data</text>
  <path d="M 900 1118 L 974 1118" fill="none" stroke="#6E8F4F" stroke-width="4" stroke-linecap="round"/><polygon points="974,1118 958,1110 958,1126" fill="#6E8F4F"/><text class="legendText" x="992" y="1123">real practice path</text>
  <path d="M 1204 1118 L 1278 1118" fill="none" stroke="#B86868" stroke-width="4" stroke-linecap="round" stroke-dasharray="12 8"/><polygon points="1278,1118 1262,1110 1262,1126" fill="#B86868"/><text class="legendText" x="1296" y="1123">opt-in backend path</text>
  <text class="footer" x="850" y="1200" text-anchor="middle">Reader contract: the lab compares behavior locally; real backend confidence comes from the linked practice modules.</text>
</svg>
