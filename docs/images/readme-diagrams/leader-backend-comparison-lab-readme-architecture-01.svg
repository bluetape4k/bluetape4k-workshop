<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="1180" viewBox="0 0 1700 1180" role="img" aria-labelledby="title desc">
  <title id="title">Leader Backend Comparison Lab Architecture</title>
  <desc id="desc">A learner runs the deterministic comparison lab, reads source-backed backend profiles, then follows existing Redis, ZooKeeper, and Kubernetes Lease practice modules for real backend integration.</desc>
  <defs>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="124%"><feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#64748B" flood-opacity="0.12"/></filter>
    <style>
      .bg{fill:#F8FAFC}.title{font-family:"Architects Daughter";font-size:42px;fill:#263238}.subtitle,.body,.small,.legendText,.footer{font-family:"Comic Mono";fill:#3B4A54}.subtitle{font-size:18px}.laneTitle{font-family:"Architects Daughter";font-size:25px;fill:#344154}.laneNote{font-family:"Comic Mono";font-size:13px;fill:#677783}.cardTitle{font-family:"Architects Daughter";font-size:23px;fill:#16202A}.body{font-size:15px}.footer{font-size:14px;fill:#60727D}.lane{stroke:#CAD6DF;stroke-width:2}.laneLab{fill:#F8FBFF}.laneRedis{fill:#F7FBF5}.laneZoo{fill:#FCFAF5}.laneK8s{fill:#FFF8F8}.card{stroke-width:2.2}.blue{fill:#EFF6FF;stroke:#4F86C6}.green{fill:#F0F8F0;stroke:#6E8F4F}.amber{fill:#FFF7E8;stroke:#9B7D54}.teal{fill:#EBFAF8;stroke:#2D948C}.red{fill:#FFF0F0;stroke:#B86868}.connector{fill:none;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round}.learn{stroke:#4F86C6}.model{stroke:#2D948C}.practice{stroke:#6E8F4F}.optional{stroke:#B86868;stroke-dasharray:12 8}.arrowHead{stroke-dasharray:none;stroke-linejoin:round}.legendBox{fill:#FFFFFF;stroke:#CAD6DF;stroke-width:1.8}.legendText{font-size:14px}
    </style>
  </defs>
  <rect class="bg" width="1700" height="1180"/>
  <text class="title" x="850" y="66" text-anchor="middle">Leader Backend Comparison Lab</text>
  <text class="subtitle" x="850" y="100" text-anchor="middle">Vertical backend lanes keep the deterministic lab separate from real Redis, ZooKeeper, and Kubernetes practice modules.</text>

  <rect class="lane laneLab" x="74" y="146" width="392" height="830" rx="20"/>
  <text class="laneTitle" x="114" y="194">Lab lane</text>
  <text class="laneNote" x="114" y="220">local comparison, no backend dependency</text>

  <rect class="lane laneRedis" x="498" y="146" width="340" height="830" rx="20"/>
  <text class="laneTitle" x="538" y="194">Redis lane</text>
  <text class="laneNote" x="538" y="220">TTL lease and listener events</text>

  <rect class="lane laneZoo" x="870" y="146" width="340" height="830" rx="20"/>
  <text class="laneTitle" x="910" y="194">ZooKeeper lane</text>
  <text class="laneNote" x="910" y="220">session-bound ownership</text>

  <rect class="lane laneK8s" x="1242" y="146" width="384" height="830" rx="20"/>
  <text class="laneTitle" x="1282" y="194">Kubernetes lane</text>
  <text class="laneNote" x="1282" y="220">opt-in Lease and Micrometer</text>

  <g class="node" data-node="learner" filter="url(#shadow)"><rect class="card blue" x="126" y="276" width="288" height="82" rx="12"/><text class="cardTitle" x="270" y="309" text-anchor="middle">README + tests</text><text class="body" x="270" y="335" text-anchor="middle">compare backends locally</text></g>
  <g class="node" data-node="catalog" filter="url(#shadow)"><rect class="card teal" x="126" y="422" width="288" height="82" rx="12"/><text class="cardTitle" x="270" y="455" text-anchor="middle">LeaderBackendCatalog</text><text class="body" x="270" y="481" text-anchor="middle">source-backed profiles</text></g>
  <g class="node" data-node="failover-lab" filter="url(#shadow)"><rect class="card teal" x="126" y="568" width="288" height="82" rx="12"/><text class="cardTitle" x="270" y="601" text-anchor="middle">LeaderFailoverLab</text><text class="body" x="270" y="627" text-anchor="middle">steady, skip, fail, handoff</text></g>
  <g class="node" data-node="scenario-report" filter="url(#shadow)"><rect class="card teal" x="126" y="714" width="288" height="82" rx="12"/><text class="cardTitle" x="270" y="747" text-anchor="middle">ScenarioReport</text><text class="body" x="270" y="773" text-anchor="middle">events + metrics to inspect</text></g>

  <g class="node" data-node="redis-profile" filter="url(#shadow)"><rect class="card amber" x="536" y="422" width="264" height="82" rx="12"/><text class="cardTitle" x="668" y="455" text-anchor="middle">Redis + Lettuce</text><text class="body" x="668" y="481" text-anchor="middle">TTL lease, Flow events</text></g>
  <g class="node" data-node="redis-module" filter="url(#shadow)"><rect class="card green" x="536" y="714" width="264" height="82" rx="12"/><text class="cardTitle" x="668" y="747" text-anchor="middle">leader-election</text><text class="body" x="668" y="773" text-anchor="middle">Redis Testcontainers practice</text></g>

  <g class="node" data-node="zookeeper-profile" filter="url(#shadow)"><rect class="card amber" x="908" y="422" width="264" height="82" rx="12"/><text class="cardTitle" x="1040" y="455" text-anchor="middle">ZooKeeper + Curator</text><text class="body" x="1040" y="481" text-anchor="middle">session-bound ownership</text></g>
  <g class="node" data-node="zookeeper-module" filter="url(#shadow)"><rect class="card green" x="908" y="714" width="264" height="82" rx="12"/><text class="cardTitle" x="1040" y="747" text-anchor="middle">leader-zookeeper</text><text class="body" x="1040" y="773" text-anchor="middle">Curator session practice</text></g>

  <g class="node" data-node="kubernetes-profile" filter="url(#shadow)"><rect class="card red" x="1284" y="422" width="300" height="82" rx="12"/><text class="cardTitle" x="1434" y="455" text-anchor="middle">Kubernetes Lease</text><text class="body" x="1434" y="481" text-anchor="middle">opt-in Lease + Micrometer</text></g>
  <g class="node" data-node="kubernetes-module" filter="url(#shadow)"><rect class="card red" x="1284" y="714" width="300" height="82" rx="12"/><text class="cardTitle" x="1434" y="747" text-anchor="middle">k8s-lease-micrometer</text><text class="body" x="1434" y="773" text-anchor="middle">cluster opt-in practice</text></g>

  <g class="edge" data-edge="learner-&gt;catalog" data-label="learner reads backend profile matrix"><path data-connector="learner-to-catalog" class="connector learn" d="M 270 358 L 270 422"/><polygon data-connector-head="learner-to-catalog" class="arrowHead" points="270,422 262,406 278,406" fill="#4F86C6" stroke="#4F86C6" stroke-dasharray="none" style="stroke-dasharray:none" data-arrowhead="true" data-role="primary" data-size="14x14" data-tip-direction="positive-x" data-solid-head="true"/></g>
  <g class="edge" data-edge="catalog-&gt;failover-lab" data-label="catalog supplies backend semantics"><path data-connector="catalog-to-failover" class="connector model" d="M 270 504 L 270 568"/><polygon data-connector-head="catalog-to-failover" class="arrowHead" points="270,568 262,552 278,552" fill="#2D948C" stroke="#2D948C" stroke-dasharray="none" style="stroke-dasharray:none" data-arrowhead="true" data-role="primary" data-size="14x14" data-tip-direction="positive-x" data-solid-head="true"/></g>
  <g class="edge" data-edge="failover-lab-&gt;scenario-report" data-label="lab emits scenario report"><path data-connector="failover-to-report" class="connector model" d="M 270 650 L 270 714"/><polygon data-connector-head="failover-to-report" class="arrowHead" points="270,714 262,698 278,698" fill="#2D948C" stroke="#2D948C" stroke-dasharray="none" style="stroke-dasharray:none" data-arrowhead="true" data-role="primary" data-size="14x14" data-tip-direction="positive-x" data-solid-head="true"/></g>

  <g class="edge" data-edge="catalog-&gt;redis-profile" data-label="catalog includes Redis TTL profile"><path data-connector="catalog-to-redis" class="connector model" d="M 414 463 L 536 463"/><polygon data-connector-head="catalog-to-redis" class="arrowHead" points="536,463 520,455 520,471" fill="#2D948C" stroke="#2D948C" stroke-dasharray="none" style="stroke-dasharray:none" data-arrowhead="true" data-role="primary" data-size="14x14" data-tip-direction="positive-x" data-solid-head="true"/></g>
  <g class="edge" data-edge="catalog-&gt;zookeeper-profile" data-label="catalog includes ZooKeeper session profile"><path data-connector="catalog-to-zookeeper" class="connector model" d="M 414 443 L 452 443 Q 472 443 472 423 L 472 412 Q 472 392 492 392 L 1020 392 Q 1040 392 1040 412 L 1040 422"/><polygon data-connector-head="catalog-to-zookeeper" class="arrowHead" points="1040,422 1032,406 1048,406" fill="#2D948C" stroke="#2D948C" stroke-dasharray="none" style="stroke-dasharray:none" data-arrowhead="true" data-role="primary" data-size="14x14" data-tip-direction="positive-x" data-solid-head="true"/></g>
  <g class="edge" data-edge="catalog-&gt;kubernetes-profile" data-label="catalog includes opt-in Kubernetes Lease profile"><path data-connector="catalog-to-kubernetes" class="connector optional" d="M 342 422 L 342 390 Q 342 370 362 370 L 1414 370 Q 1434 370 1434 390 L 1434 422"/><polygon data-connector-head="catalog-to-kubernetes" class="arrowHead" points="1434,422 1426,406 1442,406" fill="#B86868" stroke="#B86868" stroke-dasharray="none" style="stroke-dasharray:none" data-arrowhead="true" data-role="primary" data-size="14x14" data-tip-direction="positive-x" data-solid-head="true"/></g>

  <g class="edge" data-edge="redis-profile-&gt;redis-module" data-label="Redis profile links to real Redis module"><path data-connector="redis-to-module" class="connector practice" d="M 668 504 L 668 714"/><polygon data-connector-head="redis-to-module" class="arrowHead" points="668,714 660,698 676,698" fill="#6E8F4F" stroke="#6E8F4F" stroke-dasharray="none" style="stroke-dasharray:none" data-arrowhead="true" data-role="primary" data-size="14x14" data-tip-direction="positive-x" data-solid-head="true"/></g>
  <g class="edge" data-edge="zookeeper-profile-&gt;zookeeper-module" data-label="ZooKeeper profile links to Curator module"><path data-connector="zookeeper-to-module" class="connector practice" d="M 1040 504 L 1040 714"/><polygon data-connector-head="zookeeper-to-module" class="arrowHead" points="1040,714 1032,698 1048,698" fill="#6E8F4F" stroke="#6E8F4F" stroke-dasharray="none" style="stroke-dasharray:none" data-arrowhead="true" data-role="primary" data-size="14x14" data-tip-direction="positive-x" data-solid-head="true"/></g>
  <g class="edge" data-edge="kubernetes-profile-&gt;kubernetes-module" data-label="Kubernetes profile links to opt-in module"><path data-connector="kubernetes-to-module" class="connector optional" d="M 1434 504 L 1434 714"/><polygon data-connector-head="kubernetes-to-module" class="arrowHead" points="1434,714 1426,698 1442,698" fill="#B86868" stroke="#B86868" stroke-dasharray="none" style="stroke-dasharray:none" data-arrowhead="true" data-role="primary" data-size="14x14" data-tip-direction="positive-x" data-solid-head="true"/></g>

  <rect class="legendBox" x="176" y="1018" width="1348" height="78" rx="16"/>
  <path d="M 250 1052 L 324 1052" fill="none" stroke="#4F86C6" stroke-width="4" stroke-linecap="round"/><polygon points="324,1052 308,1044 308,1060" fill="#4F86C6"/><text class="legendText" x="342" y="1057">learner action</text>
  <path d="M 520 1052 L 594 1052" fill="none" stroke="#2D948C" stroke-width="4" stroke-linecap="round"/><polygon points="594,1052 578,1044 578,1060" fill="#2D948C"/><text class="legendText" x="612" y="1057">deterministic model data</text>
  <path d="M 900 1052 L 974 1052" fill="none" stroke="#6E8F4F" stroke-width="4" stroke-linecap="round"/><polygon points="974,1052 958,1044 958,1060" fill="#6E8F4F"/><text class="legendText" x="992" y="1057">real practice path</text>
  <path d="M 1204 1052 L 1278 1052" fill="none" stroke="#B86868" stroke-width="4" stroke-linecap="round" stroke-dasharray="12 8"/><polygon points="1278,1052 1262,1044 1262,1060" fill="#B86868"/><text class="legendText" x="1296" y="1057">opt-in backend path</text>
  <text class="footer" x="850" y="1138" text-anchor="middle">Reader contract: the lab compares behavior locally; real backend confidence comes from the linked practice modules.</text>
</svg>
