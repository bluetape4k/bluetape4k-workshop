<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1260" viewBox="0 0 1800 1260" role="img" aria-labelledby="title desc">
  <title id="title">Promotion Voucher Campaign Architecture</title>
  <desc id="desc">Browser and live WebTestClient traffic enters Tomcat MVC on Java 25 virtual threads. Application-owned idempotency and voucher command services use Bluetape Exposed repositories and PostgreSQL as the sole correctness authority. Redis admission and Bloom hints, leader reconciliation, and Spring Modulith publications remain advisory or durable side paths.</desc>
  <defs>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="124%"><feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#64748B" flood-opacity="0.13"/></filter>
    <style>
      .bg{fill:#F8FAF7}.title{font-family:"Architects Daughter";font-size:44px;fill:#263238}.subtitle,.body,.small,.legend{font-family:"Comic Mono";fill:#3E4C59}.subtitle{font-size:18px}.layerTitle{font-family:"Architects Daughter";font-size:26px;fill:#344154}.cardTitle{font-family:"Architects Daughter";font-size:22px;fill:#16202A}.body{font-size:15px}.small{font-size:13px;fill:#5B6975}.layer{fill:#FFFFFF;stroke:#CAD6DF;stroke-width:2}.card{stroke-width:2.2}.blue{fill:#EFF6FF;stroke:#4F86C6}.green{fill:#F0F8F0;stroke:#6E8F4F}.amber{fill:#FFF7E8;stroke:#9B7D54}.red{fill:#FFF0F0;stroke:#B86868}.teal{fill:#EBFAF8;stroke:#2D948C}.store{fill:#FFFAF2;stroke:#8C6F33}.connector{fill:none;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round}.http{stroke:#4F86C6;marker-end:url(#arrow-blue)}.db{stroke:#6E8F4F;marker-end:url(#arrow-green)}.advisory{stroke:#9B7D54;stroke-dasharray:9 7;marker-end:url(#arrow-amber)}.durable{stroke:#9B7D54;marker-end:url(#arrow-amber)}.read{stroke:#2D948C;marker-end:url(#arrow-teal)}.observe{stroke:#B86868;stroke-dasharray:9 7;marker-end:url(#arrow-red)}.legendBox{fill:#FFFFFF;stroke:#CAD6DF;stroke-width:1.8}.legend{font-size:14px}
    </style>
    <marker id="arrow-blue" viewBox="0 0 10 10" markerWidth="14" markerHeight="14" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse" data-role="primary" data-tip-direction="positive-x"><path d="M0 0 L10 5 L0 10 Z" fill="#4F86C6" stroke="#4F86C6" stroke-dasharray="none" style="stroke-dasharray:none"/></marker>
    <marker id="arrow-green" viewBox="0 0 10 10" markerWidth="14" markerHeight="14" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse" data-role="primary" data-tip-direction="positive-x"><path d="M0 0 L10 5 L0 10 Z" fill="#6E8F4F" stroke="#6E8F4F" stroke-dasharray="none" style="stroke-dasharray:none"/></marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" markerWidth="14" markerHeight="14" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse" data-role="primary" data-tip-direction="positive-x"><path d="M0 0 L10 5 L0 10 Z" fill="#9B7D54" stroke="#9B7D54" stroke-dasharray="none" style="stroke-dasharray:none"/></marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" markerWidth="14" markerHeight="14" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse" data-role="primary" data-tip-direction="positive-x"><path d="M0 0 L10 5 L0 10 Z" fill="#2D948C" stroke="#2D948C" stroke-dasharray="none" style="stroke-dasharray:none"/></marker>
    <marker id="arrow-red" viewBox="0 0 10 10" markerWidth="14" markerHeight="14" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse" data-role="primary" data-tip-direction="positive-x"><path d="M0 0 L10 5 L0 10 Z" fill="#B86868" stroke="#B86868" stroke-dasharray="none" style="stroke-dasharray:none"/></marker>
  </defs>
  <rect class="bg" width="1800" height="1260"/>
  <text class="title" x="900" y="62" text-anchor="middle">Promotion Voucher Campaign Architecture</text>
  <text class="subtitle" x="900" y="96" text-anchor="middle">PostgreSQL owns every capacity and state decision; Redis and workers remain advisory or recoverable.</text>

  <rect class="layer" x="70" y="130" width="1660" height="190" rx="22"/>
  <text class="layerTitle" x="105" y="173">HTTP and test boundary</text>
  <g class="node" data-node="browser" filter="url(#shadow)"><rect class="card blue" x="135" y="215" width="340" height="72" rx="15"/><text class="cardTitle" x="305" y="246" text-anchor="middle">Browser console</text><text class="body" x="305" y="271" text-anchor="middle">customer + guarded operator + SSE</text></g>
  <g class="node" data-node="webtestclient" filter="url(#shadow)"><rect class="card blue" x="550" y="215" width="340" height="72" rx="15"/><text class="cardTitle" x="720" y="246" text-anchor="middle">Live WebTestClient</text><text class="body" x="720" y="271" text-anchor="middle">RANDOM_PORT + real Tomcat</text></g>
  <g class="node" data-node="tomcat" filter="url(#shadow)"><rect class="card blue" x="965" y="205" width="690" height="92" rx="15"/><text class="cardTitle" x="1310" y="241" text-anchor="middle">Tomcat MVC / Java 25 virtual threads</text><text class="body" x="1310" y="268" text-anchor="middle">8,000 connections / bounded headers, async work, and shutdown</text></g>

  <rect class="layer" x="70" y="370" width="1660" height="265" rx="22"/>
  <text class="layerTitle" x="105" y="413">Application boundary</text>
  <g class="node" data-node="redis" filter="url(#shadow)"><rect class="card amber" x="105" y="462" width="300" height="112" rx="15"/><text class="cardTitle" x="255" y="494" text-anchor="middle">Redis admission + Bloom</text><text class="body" x="255" y="522" text-anchor="middle">Lettuce / Bucket4j risk hints</text><text class="small" x="255" y="549" text-anchor="middle">advisory / timeout degrades open</text></g>
  <g class="node" data-node="idempotency" filter="url(#shadow)"><rect class="card green" x="455" y="462" width="310" height="112" rx="15"/><text class="cardTitle" x="610" y="494" text-anchor="middle">HTTP idempotency</text><text class="body" x="610" y="522" text-anchor="middle">scope + fingerprint + lease</text><text class="small" x="610" y="549" text-anchor="middle">closed terminal response replay</text></g>
  <g class="node" data-node="commands" filter="url(#shadow)"><rect class="card green" x="815" y="452" width="350" height="132" rx="15"/><text class="cardTitle" x="990" y="485" text-anchor="middle">Voucher command services</text><text class="body" x="990" y="514" text-anchor="middle">campaign / allocation / claim / review</text><text class="small" x="990" y="542" text-anchor="middle">12 foreground / 1 worker / 3 SSE permits</text><text class="small" x="990" y="566" text-anchor="middle">5s lock timeout / explicit revisions</text></g>
  <g class="node" data-node="query-sse" filter="url(#shadow)"><rect class="card teal" x="1215" y="462" width="300" height="112" rx="15"/><text class="cardTitle" x="1365" y="494" text-anchor="middle">Query + SSE</text><text class="body" x="1365" y="522" text-anchor="middle">safe snapshots + audit cursor</text><text class="small" x="1365" y="549" text-anchor="middle">one-time code never on GET</text></g>

  <rect class="layer" x="70" y="685" width="1660" height="245" rx="22"/>
  <text class="layerTitle" x="105" y="728">Persistence and recovery boundary</text>
  <g class="node" data-node="repositories" filter="url(#shadow)"><rect class="card green" x="120" y="780" width="690" height="94" rx="15"/><text class="cardTitle" x="465" y="814" text-anchor="middle">Bluetape Exposed repositories</text><text class="body" x="465" y="842" text-anchor="middle">campaigns / claims / reviews / idempotency / audit / inbox</text></g>
  <g class="node" data-node="modulith" filter="url(#shadow)"><rect class="card amber" x="855" y="780" width="350" height="94" rx="15"/><text class="cardTitle" x="1030" y="814" text-anchor="middle">Spring Modulith</text><text class="body" x="1030" y="842" text-anchor="middle">durable after-commit publication</text></g>
  <g class="node" data-node="leader-worker" filter="url(#shadow)"><rect class="card amber" x="1250" y="770" width="350" height="114" rx="15"/><text class="cardTitle" x="1425" y="803" text-anchor="middle">Leader reconciliation worker</text><text class="body" x="1425" y="831" text-anchor="middle">bounded SKIP LOCKED batches</text><text class="small" x="1425" y="858" text-anchor="middle">manual fallback / poison isolation</text></g>

  <rect class="layer" x="70" y="980" width="1660" height="130" rx="22"/>
  <text class="layerTitle" x="105" y="1022">Sole correctness authority</text>
  <g class="node" data-node="postgresql" filter="url(#shadow)"><rect class="card store" x="190" y="1038" width="1420" height="50" rx="14"/><text class="cardTitle" x="900" y="1071" text-anchor="middle">PostgreSQL / capacity row locks / revisions / verifier material / durable replay and audit evidence</text></g>

  <g class="node" data-node="observability" filter="url(#shadow)"><rect class="card red" x="350" y="1134" width="1100" height="60" rx="15"/><text class="cardTitle" x="900" y="1161" text-anchor="middle">Operational observability</text><text class="body" x="900" y="1184" text-anchor="middle">bluetape4k-logging + Micrometer / stable outcomes / secret and high-cardinality redaction</text></g>

  <g class="edge" data-edge="browser-&gt;tomcat" data-label="browser HTTP and SSE"><path data-connector="browser-to-tomcat" class="connector http" d="M305 287 L305 310 Q 305 332 327 332 L1090 332 Q 1112 332 1112 310 L1112 297"/></g>
  <g class="edge" data-edge="webtestclient-&gt;tomcat" data-label="live integration"><path data-connector="webtestclient-to-tomcat" class="connector http" d="M890 251 L965 251"/></g>
  <g class="edge" data-edge="tomcat-&gt;idempotency" data-label="commands"><path data-connector="tomcat-to-idempotency" class="connector http" d="M1160 297 L1160 350 Q 1160 365 1145 365 L625 365 Q 610 365 610 380 L610 462"/></g>
  <g class="edge" data-edge="tomcat-&gt;query-sse" data-label="reads and events"><path data-connector="tomcat-to-query-sse" class="connector read" d="M1365 297 L1365 462"/></g>
  <g class="edge" data-edge="redis-&gt;idempotency" data-label="admission hint"><path data-connector="redis-to-idempotency" class="connector advisory" d="M405 518 L455 518"/></g>
  <g class="edge" data-edge="idempotency-&gt;commands" data-label="new owner only"><path data-connector="idempotency-to-commands" class="connector db" d="M765 518 L815 518"/></g>
  <g class="edge" data-edge="commands-&gt;repositories" data-label="transaction work"><path data-connector="commands-to-repositories" class="connector db" d="M940 584 L940 650 Q 940 665 925 665 L480 665 Q 465 665 465 680 L465 780"/></g>
  <g class="edge" data-edge="query-sse-&gt;repositories" data-label="snapshots and audit"><path data-connector="query-sse-to-repositories" class="connector read" d="M1335 574 L1335 650 Q 1335 672 1313 672 L760 672 Q 738 672 738 694 L738 780"/></g>
  <g class="edge" data-edge="repositories-&gt;modulith" data-label="after commit"><path data-connector="repositories-to-modulith" class="connector durable" d="M810 827 L855 827"/></g>
  <g class="edge" data-edge="modulith-&gt;leader-worker" data-label="durable inbox"><path data-connector="modulith-to-leader-worker" class="connector durable" d="M1205 827 L1250 827"/></g>
  <g class="edge" data-edge="repositories-&gt;postgresql" data-label="authoritative state"><path data-connector="repositories-to-postgresql" class="connector db" d="M465 874 L465 1038"/></g>
  <g class="edge" data-edge="modulith-&gt;postgresql" data-label="publication rows"><path data-connector="modulith-to-postgresql" class="connector db" d="M1030 874 L1030 1038"/></g>
  <g class="edge" data-edge="leader-worker-&gt;postgresql" data-label="bounded recovery"><path data-connector="leader-worker-to-postgresql" class="connector db" d="M1425 884 L1425 1038"/></g>
  <g class="edge" data-edge="postgresql-&gt;observability" data-label="redacted evidence"><path data-connector="postgresql-to-observability" class="connector observe" d="M900 1088 L900 1134"/></g>

  <rect class="legendBox" x="190" y="1210" width="1420" height="38" rx="14"/>
  <text class="legend" x="235" y="1235">Blue: HTTP</text><text class="legend" x="455" y="1235">Green: authoritative DB path</text><text class="legend" x="800" y="1235">Amber solid: durable</text><text class="legend" x="1070" y="1235">Amber dashed: advisory</text><text class="legend" x="1380" y="1235">Teal: query / SSE</text>
</svg>
