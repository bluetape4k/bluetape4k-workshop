<svg xmlns="http://www.w3.org/2000/svg" width="980" height="520" viewBox="0 0 980 520" role="img" aria-label="Spring Cloud Gateway Architecture">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#1f2937" flood-opacity="0.10"/></filter>
  <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth">
    <path d="M1,1 L8,4.5 L1,8 Z" fill="#758297"/>
  </marker>
  <style>
    .canvas{fill:#f7f9fc}.frame{fill:#fff;stroke:#d8e0ea;stroke-width:1.5}
    .title{font-family:"Architects Daughter";font-size:40px;font-weight:400;fill:#102033}
    .subtitle{font-family:"Comic Mono";font-size:14px;font-weight:400;fill:#536273}
    .smallLabel{font-family:"Architects Daughter";font-size:21px;font-weight:400;fill:#102033}
    .mono{font-family:"Comic Mono";font-size:12px;font-weight:400;fill:#102033}
    .small{font-family:"Comic Mono";font-size:12px;font-weight:400;fill:#536273}
    .card{stroke-width:2.1;filter:url(#shadow)}
    .line{stroke:#758297;stroke-width:2.1;fill:none;marker-end:url(#arrow)}
  </style>
</defs>
<rect class="canvas" width="980" height="520"/>
<rect class="frame" x="24" y="20" width="932" height="476" rx="28"/>
<text class="title" x="58" y="68">Spring Cloud Gateway Architecture</text>
<text class="subtitle" x="58" y="96">Spring Cloud Gateway · Route Predicate · RewritePath Filter · WebFlux Coroutines</text>

<!-- Client → Gateway (two entry points) -->
<path class="line" d="M356 168 L356 193 L432 193 L432 222"/>
<path class="line" d="M564 168 L564 193 L528 193 L528 222"/>
<!-- Gateway → Customers -->
<path class="line" d="M432 276 L432 300 L248 300 L248 326"/>
<!-- Gateway → Orders -->
<path class="line" d="M528 276 L528 300 L712 300 L712 326"/>

<!-- HTTP Client -->
<g transform="translate(238,114)">
  <rect class="card" x="0" y="0" width="444" height="54" rx="12" fill="#E8F3FF" stroke="#5B8DEF"/>
  <text class="smallLabel" x="222" y="22" text-anchor="middle">HTTP Client</text>
  <text class="small" x="222" y="42" text-anchor="middle">browser · httpie · /customer-service/** · /order-service/**</text>
</g>

<!-- API Gateway -->
<g transform="translate(310,222)">
  <rect class="card" x="0" y="0" width="360" height="54" rx="12" fill="#EAF7EF" stroke="#58A978"/>
  <text class="smallLabel" x="180" y="22" text-anchor="middle">API Gateway :8080</text>
  <text class="small" x="180" y="42" text-anchor="middle">Spring Cloud Gateway · AddResponseHeader filter</text>
</g>

<!-- Customers Service -->
<g transform="translate(60,326)">
  <rect class="card" x="0" y="0" width="376" height="116" rx="12" fill="#FFF3D9" stroke="#D6A441"/>
  <text class="smallLabel" x="188" y="26" text-anchor="middle">Customers Service :8081</text>
  <text class="small" x="188" y="48" text-anchor="middle">Route: /customer-service/** → RewritePath</text>
  <text class="mono" x="188" y="68" text-anchor="middle">GET /api/v1/customers</text>
  <text class="small" x="188" y="90" text-anchor="middle">→ List&lt;Customer(name)&gt;</text>
  <text class="small" x="188" y="110" text-anchor="middle">WebFlux · Coroutines · suspend fun</text>
</g>

<!-- Orders + Products Service -->
<g transform="translate(524,326)">
  <rect class="card" x="0" y="0" width="376" height="116" rx="12" fill="#F1ECFF" stroke="#8A72D6"/>
  <text class="smallLabel" x="188" y="26" text-anchor="middle">Orders Service :8082</text>
  <text class="small" x="188" y="48" text-anchor="middle">Route: /order-service/** → RewritePath</text>
  <text class="mono" x="188" y="68" text-anchor="middle">GET /api/v1/orders · GET /api/v1/products</text>
  <text class="small" x="188" y="90" text-anchor="middle">→ List&lt;Order&gt; · List&lt;Product&gt;</text>
  <text class="small" x="188" y="110" text-anchor="middle">WebFlux · Coroutines · UUIDv7</text>
</g>
</svg>
