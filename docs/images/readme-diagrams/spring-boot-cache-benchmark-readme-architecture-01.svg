<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1840" height="980" viewBox="0 0 1840 980" role="img" aria-label="Cache benchmark architecture">
  <defs>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="124%"><feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#64748B" flood-opacity="0.16"/></filter>
    <marker id="arrowBlue" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 14 7 L 0 14 Z" fill="#2563EB"/></marker>
    <marker id="arrowTeal" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 14 7 L 0 14 Z" fill="#0891B2"/></marker>
    <style>
      .canvas{fill:#F8FAFC}.frame{fill:#FFFFFF;stroke:#D6E0E8;stroke-width:1.4}.layer{stroke-width:1.6;rx:22}
      .title{font-family:"Architects Daughter";font-size:40px;fill:#102033}.subtitle{font-family:"Comic Mono";font-size:16px;fill:#51606F}
      .layerTitle{font-family:"Architects Daughter";font-size:29px;fill:#243447}.cardTitle{font-family:"Architects Daughter";font-size:27px;fill:#102033}.cardText{font-family:"Comic Mono";font-size:15px;fill:#415166}
      .line{fill:none;stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round}
    </style>
  </defs>
  <rect class="canvas" width="1840" height="980"/>
  <rect class="frame" x="24" y="24" width="1792" height="932" rx="24"/>
  <text class="title" x="920" y="72" text-anchor="middle">Cache benchmark runtime</text>
  <text class="subtitle" x="920" y="106" text-anchor="middle">kotlinx-benchmark runs seven ProductCacheService implementations against H2, Caffeine, Redis, and Redisson near cache.</text>

  <rect class="layer" x="80" y="152" width="1680" height="170" fill="#EFF6FF" stroke="#BFDBFE"/>
  <text class="layerTitle" x="120" y="196">Benchmark harness</text>
  <g filter="url(#shadow)"><rect x="220" y="222" width="300" height="76" rx="14" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.7"/><text class="cardTitle" x="370" y="254" text-anchor="middle">kotlinx-benchmark</text><text class="cardText" x="370" y="280" text-anchor="middle">JMH warmups + iterations</text></g>
  <g filter="url(#shadow)"><rect x="760" y="212" width="320" height="96" rx="14" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.7"/><text class="cardTitle" x="920" y="246" text-anchor="middle">AbstractCacheBenchmark</text><text class="cardText" x="920" y="274" text-anchor="middle">SpringApplicationBuilder</text><text class="cardText" x="920" y="298" text-anchor="middle">one context per trial</text></g>
  <g filter="url(#shadow)"><rect x="1300" y="222" width="300" height="76" rx="14" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.7"/><text class="cardTitle" x="1450" y="254" text-anchor="middle">Profile tasks</text><text class="cardText" x="1450" y="280" text-anchor="middle">noCache ... allProfiles</text></g>

  <rect class="layer" x="80" y="382" width="1680" height="258" fill="#F0FDF4" stroke="#BBF7D0"/>
  <text class="layerTitle" x="120" y="426">Cache strategy services</text>
  <g filter="url(#shadow)"><rect x="140" y="464" width="218" height="72" rx="14" fill="#FFFFFF" stroke="#16A34A" stroke-width="1.7"/><text class="cardTitle" x="249" y="496" text-anchor="middle">No Cache</text><text class="cardText" x="249" y="520" text-anchor="middle">direct repository</text></g>
  <g filter="url(#shadow)"><rect x="396" y="464" width="218" height="72" rx="14" fill="#FFFFFF" stroke="#16A34A" stroke-width="1.7"/><text class="cardTitle" x="505" y="496" text-anchor="middle">Caffeine</text><text class="cardText" x="505" y="520" text-anchor="middle">@Cacheable local</text></g>
  <g filter="url(#shadow)"><rect x="652" y="464" width="218" height="72" rx="14" fill="#FFFFFF" stroke="#16A34A" stroke-width="1.7"/><text class="cardTitle" x="761" y="496" text-anchor="middle">Redis Cache</text><text class="cardText" x="761" y="520" text-anchor="middle">@Cacheable remote</text></g>
  <g filter="url(#shadow)"><rect x="908" y="464" width="218" height="72" rx="14" fill="#FFFFFF" stroke="#16A34A" stroke-width="1.7"/><text class="cardTitle" x="1017" y="496" text-anchor="middle">Near Cache</text><text class="cardText" x="1017" y="520" text-anchor="middle">RLocalCachedMap</text></g>
  <g filter="url(#shadow)"><rect x="1164" y="464" width="218" height="72" rx="14" fill="#FFFFFF" stroke="#16A34A" stroke-width="1.7"/><text class="cardTitle" x="1273" y="496" text-anchor="middle">Read Through</text><text class="cardText" x="1273" y="520" text-anchor="middle">manual get-or-load</text></g>
  <g filter="url(#shadow)"><rect x="524" y="552" width="260" height="72" rx="14" fill="#FFFFFF" stroke="#16A34A" stroke-width="1.7"/><text class="cardTitle" x="654" y="584" text-anchor="middle">Write Through</text><text class="cardText" x="654" y="608" text-anchor="middle">sync Redis + DB</text></g>
  <g filter="url(#shadow)"><rect x="1056" y="552" width="260" height="72" rx="14" fill="#FFFFFF" stroke="#16A34A" stroke-width="1.7"/><text class="cardTitle" x="1186" y="584" text-anchor="middle">Write Behind</text><text class="cardText" x="1186" y="608" text-anchor="middle">cache now, DB async</text></g>
  <g filter="url(#shadow)"><rect x="1482" y="464" width="218" height="72" rx="14" fill="#FFFFFF" stroke="#16A34A" stroke-width="1.7"/><text class="cardTitle" x="1591" y="496" text-anchor="middle">Common API</text><text class="cardText" x="1591" y="520" text-anchor="middle">ProductCacheService</text></g>

  <rect class="layer" x="80" y="700" width="1680" height="160" fill="#FFF7ED" stroke="#FED7AA"/>
