  <g filter="url(#shadow)"><rect x="1240" y="770" width="320" height="72" rx="14" fill="#FFFFFF" stroke="#0891B2" stroke-width="1.7"/><text class="cardTitle" x="1400" y="804" text-anchor="middle">Testcontainers</text><text class="cardText" x="1400" y="830" text-anchor="middle">RedisServer.Launcher</text></g>

