<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="2038.107" height="720" viewBox="0 0 2038.107 720" role="img" aria-label="Redisson examples catalog">
  <defs>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="124%"><feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#64748B" flood-opacity="0.16"/></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 12 6 L 0 12 Z" fill="#2563EB" stroke-dasharray="none" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <style>
      .canvas{fill:#F8FAFC}.frame{fill:#FFFFFF;stroke:#D6E0E8;stroke-width:1.4}.layer{fill:#F8FAFC;stroke:#CBD5E1;stroke-width:1.4}.title{font-family:"Architects Daughter";font-size:38px;fill:#102033}.subtitle{font-family:"Comic Mono";font-size:15px;fill:#51606F}.layerLabel{font-family:"Architects Daughter";font-size:24px;fill:#263548}.cardTitle{font-family:"Architects Daughter";font-size:28px;fill:#102033}.cardText{font-family:"Comic Mono";font-size:15px;fill:#415166}.line{fill:none;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round}
    </style>
  </defs>
  <rect class="canvas" width="2038.107" height="720"/>
  <rect class="frame" x="29.826" y="24" width="1978.455" height="672" rx="24"/>
  <text class="title" x="1019.053" y="70" text-anchor="middle">Redisson examples catalog</text>
  <text class="subtitle" x="1019.053" y="102" text-anchor="middle">The module is a test-backed catalog of Redisson locks, objects, collections, pub/sub, streams, and read/write-through cache patterns.</text>
  <g filter="url(#shadow)">
    <rect x="770.504" y="148" width="497.099" height="94" rx="16" fill="#F0FDF4" stroke="#16A34A" stroke-width="2.113"/>
    <image data-bluetape4k-icon="redis" data-source="docs/icons/redis/redis-icon.svg" x="805.301" y="176" width="36" height="36" href="data:image/svg+xml;base64," preserveAspectRatio="xMidYMid meet"/>
    <text class="cardTitle" x="1056.336" y="188" text-anchor="middle">RedissonClient</text>  <text class="cardText" x="1056.336" y="216" text-anchor="middle">shared Testcontainers Redis backend</text>
  </g>
  <rect class="layer" x="89.478" y="306" width="420.049" height="250" rx="18"/>
  <text class="layerLabel" x="124.275" y="344">Locks and semaphores</text>
  <g filter="url(#shadow)"><rect x="136.702" y="392" width="325.6" height="102" rx="16" fill="#EFF6FF" stroke="#2563EB" stroke-width="2.113"/><text class="cardTitle" x="299.502" y="430" text-anchor="middle">Synchronization</text><text class="cardText" x="299.502" y="462" text-anchor="middle">RLock, RFencedLock</text><text class="cardText" x="299.502" y="488" text-anchor="middle">Semaphore, CountDownLatch</text></g>
  <rect class="layer" x="574.15" y="306" width="420.049" height="250" rx="18"/>
  <text class="layerLabel" x="608.947" y="344">Objects and pub/sub</text>
  <g filter="url(#shadow)"><rect x="621.374" y="392" width="325.6" height="102" rx="16" fill="#FFF7ED" stroke="#EA580C" stroke-width="2.113"/><text class="cardTitle" x="784.174" y="430" text-anchor="middle">Distributed objects</text><text class="cardText" x="784.174" y="462" text-anchor="middle">Bucket, AtomicLong, HLL</text><text class="cardText" x="784.174" y="488" text-anchor="middle">Topic and ReliableTopic</text></g>
  <rect class="layer" x="1058.821" y="306" width="420.049" height="250" rx="18"/>
  <text class="layerLabel" x="1093.618" y="344">Collections and streams</text>
  <g filter="url(#shadow)"><rect x="1106.046" y="392" width="325.6" height="102" rx="16" fill="#F0FDFA" stroke="#0D9488" stroke-width="2.113"/><image data-bluetape4k-icon="redis" data-source="docs/icons/redis/redis-icon.svg" x="1120.959" y="426" width="34" height="34" href="data:image/svg+xml;base64," preserveAspectRatio="xMidYMid meet"/>  <text class="cardTitle" x="1268.846" y="430" text-anchor="middle">Redis structures</text><text class="cardText" x="1268.846" y="462" text-anchor="middle">LocalCachedMap, Stream</text><text class="cardText" x="1268.846" y="488" text-anchor="middle">Queue, SortedSet, RingBuffer</text></g>
  <rect class="layer" x="1543.493" y="306" width="405.136" height="250" rx="18"/>
  <text class="layerLabel" x="1578.29" y="344">Read/write-through</text>
  <g filter="url(#shadow)"><rect x="1590.718" y="392" width="310.687" height="102" rx="16" fill="#FFFBEB" stroke="#D97706" stroke-width="2.113"/><text class="cardTitle" x="1746.061" y="430" text-anchor="middle">Cache as SOR</text><text class="cardText" x="1746.061" y="462" text-anchor="middle">ReadWriteThrough</text><text class="cardText" x="1746.061" y="488" text-anchor="middle">JDBC-backed Actor table</text></g>
</svg>
