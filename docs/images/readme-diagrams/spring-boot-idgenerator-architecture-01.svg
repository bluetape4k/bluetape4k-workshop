<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" role="img" aria-label="Spring Boot ID Generator Architecture">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#1f2937" flood-opacity="0.10"/></filter>
  <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth">
    <path d="M1,1 L8,4.5 L1,8 Z" fill="#758297"/>
  </marker>
  <style>
    .canvas{fill:#f7f9fc}.frame{fill:#fff;stroke:#d8e0ea;stroke-width:1.5}
    .title{font-family:"Architects Daughter";font-size:38px;font-weight:400;fill:#102033}
    .subtitle{font-family:"Comic Mono";font-size:14px;font-weight:400;fill:#536273}
    .smallLabel{font-family:"Architects Daughter";font-size:21px;font-weight:400;fill:#102033}
    .mono{font-family:"Comic Mono";font-size:12px;font-weight:400;fill:#102033}
    .small{font-family:"Comic Mono";font-size:12px;font-weight:400;fill:#536273}
    .card{stroke-width:2.1;filter:url(#shadow)}
    .line{stroke:#758297;stroke-width:2.1;fill:none;marker-end:url(#arrow)}
  </style>
</defs>
<rect class="canvas" width="960" height="440"/>
<rect class="frame" x="24" y="20" width="912" height="400" rx="22"/>

<!-- Title -->
<text class="title" x="48" y="68">Spring Boot ID Generator</text>
<text class="subtitle" x="52" y="92">IdGeneratorController → Snowflake / ULID / KSUID / Hashids strategies</text>

<!-- Row 1: Controller + Client -->
<!-- Client -->
<g transform="translate(48,116)">
  <rect class="card" x="0" y="0" width="200" height="80" rx="12" fill="#E8F3FF" stroke="#5B8DEF"/>
  <text class="smallLabel" x="100" y="38" text-anchor="middle">HTTP Client</text>
  <text class="small" x="100" y="60" text-anchor="middle">GET /ids/{type}</text>
</g>

<!-- IdGeneratorController -->
<g transform="translate(290,116)">
  <rect class="card" x="0" y="0" width="230" height="80" rx="12" fill="#FFF3D9" stroke="#D6A441"/>
  <text class="smallLabel" x="115" y="30" text-anchor="middle">IdGenerator</text>
  <text class="smallLabel" x="115" y="54" text-anchor="middle">Controller</text>
  <text class="small" x="115" y="72" text-anchor="middle">@RestController /ids</text>
</g>

<!-- IdGeneratorApplication -->
<g transform="translate(564,116)">
  <rect class="card" x="0" y="0" width="200" height="80" rx="12" fill="#F1ECFF" stroke="#8A72D6"/>
  <text class="smallLabel" x="100" y="34" text-anchor="middle">IdGenerator</text>
  <text class="smallLabel" x="100" y="58" text-anchor="middle">Application</text>
</g>

<!-- WebFlux -->
<g transform="translate(786,116)">
  <rect class="card" x="0" y="0" width="150" height="80" rx="12" fill="#EAF7EF" stroke="#58A978"/>
  <text class="smallLabel" x="75" y="34" text-anchor="middle">Spring</text>
  <text class="smallLabel" x="75" y="58" text-anchor="middle">WebFlux</text>
</g>

<!-- Row 2: ID strategies -->
<!-- Snowflake -->
<g transform="translate(48,260)">
  <rect class="card" x="0" y="0" width="196" height="100" rx="12" fill="#FDECEF" stroke="#DC6B82"/>
  <text class="smallLabel" x="98" y="30" text-anchor="middle">Snowflake</text>
  <text class="mono" x="98" y="54" text-anchor="middle">Long time-based</text>
  <text class="small" x="98" y="74" text-anchor="middle">Twitter algorithm</text>
  <text class="small" x="98" y="92" text-anchor="middle">GET /ids/snowflake</text>
</g>

<!-- ULID -->
<g transform="translate(264,260)">
  <rect class="card" x="0" y="0" width="196" height="100" rx="12" fill="#E9F7F6" stroke="#45A7A1"/>
  <text class="smallLabel" x="98" y="30" text-anchor="middle">ULID</text>
  <text class="mono" x="98" y="54" text-anchor="middle">26-char Base32</text>
  <text class="small" x="98" y="74" text-anchor="middle">time-sortable</text>
  <text class="small" x="98" y="92" text-anchor="middle">GET /ids/ulid</text>
</g>

<!-- KSUID -->
<g transform="translate(480,260)">
  <rect class="card" x="0" y="0" width="196" height="100" rx="12" fill="#EAF7EF" stroke="#58A978"/>
  <text class="smallLabel" x="98" y="30" text-anchor="middle">KSUID</text>
  <text class="mono" x="98" y="54" text-anchor="middle">27-char Base62</text>
  <text class="small" x="98" y="74" text-anchor="middle">second-sortable</text>
  <text class="small" x="98" y="92" text-anchor="middle">GET /ids/ksuid</text>
</g>

<!-- Hashids -->
<g transform="translate(696,260)">
  <rect class="card" x="0" y="0" width="220" height="100" rx="12" fill="#FFF3D9" stroke="#D6A441"/>
  <text class="smallLabel" x="110" y="30" text-anchor="middle">Hashids</text>
  <text class="mono" x="110" y="54" text-anchor="middle">URL-safe encode</text>
  <text class="small" x="110" y="74" text-anchor="middle">numbers → string</text>
  <text class="small" x="110" y="92" text-anchor="middle">GET /ids/hashids</text>
</g>

<!-- Arrows Row 1 -->
<path class="line" d="M248,156 L290,156"/>
<path class="line" d="M520,156 L564,156"/>
<path class="line" d="M764,156 L786,156"/>

<!-- Row 1 → Row 2: Controller → each strategy -->
<path class="line" d="M405,196 L405,230 L146,230 L146,260"/>
<path class="line" d="M405,196 L405,230 L362,230 L362,260"/>
<path class="line" d="M405,196 L405,230 L578,230 L578,260"/>
<path class="line" d="M405,196 L405,230 L806,230 L806,260"/>
</svg>
