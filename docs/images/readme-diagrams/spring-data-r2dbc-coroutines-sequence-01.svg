<svg xmlns="http://www.w3.org/2000/svg" width="960" height="500" viewBox="0 0 960 500" role="img" aria-label="R2DBC Coroutines Suspend CRUD Sequence">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#1f2937" flood-opacity="0.10"/></filter>
  <marker id="arrowBlue" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M1,1 L8,4.5 L1,8 Z" fill="#5B8DEF"/></marker>
  <marker id="arrowTeal" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M1,1 L8,4.5 L1,8 Z" fill="#45A7A1"/></marker>
  <style>
    .canvas{fill:#f7f9fc}.frame{fill:#fff;stroke:#d8e0ea;stroke-width:1.5}
    .title{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:38px;font-weight:400;fill:#102033}
    .subtitle{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:14px;font-weight:400;fill:#536273}
    .smallLabel{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:21px;font-weight:400;fill:#102033}
    .mono{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#102033}
    .small{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#536273}
    .card{stroke-width:2.1;filter:url(#shadow)}
    .lifeline{stroke:#b0bbca;stroke-width:1.5;stroke-dasharray:6 4;fill:none}
    .reqArrow{stroke:#5B8DEF;stroke-width:2.1;fill:none;marker-end:url(#arrowBlue)}
    .rspArrow{stroke:#45A7A1;stroke-width:2.1;stroke-dasharray:7 4;fill:none;marker-end:url(#arrowTeal)}
  </style>
</defs>
<rect class="canvas" width="960" height="500"/>
<rect class="frame" x="24" y="20" width="912" height="456" rx="16"/>
<text class="title" x="48" y="66">R2DBC Coroutines Suspend CRUD</text>
<text class="subtitle" x="48" y="90">PostController suspend operations → PostRepository → H2 R2DBC</text>

<!-- Participants -->
<rect class="card" x="50" y="108" width="120" height="44" rx="8" fill="#FDECEF" stroke="#DC6B82"/>
<text class="smallLabel" style="font-size:17px" x="110" y="135" text-anchor="middle">Client</text>

<rect class="card" x="230" y="108" width="170" height="44" rx="8" fill="#FFF3D9" stroke="#D6A441"/>
<text class="smallLabel" style="font-size:17px" x="315" y="135" text-anchor="middle">PostController</text>

<rect class="card" x="460" y="108" width="170" height="44" rx="8" fill="#E8F3FF" stroke="#5B8DEF"/>
<text class="smallLabel" style="font-size:17px" x="545" y="135" text-anchor="middle">PostRepository</text>

<rect class="card" x="700" y="108" width="160" height="44" rx="8" fill="#E9F7F6" stroke="#45A7A1"/>
<text class="smallLabel" style="font-size:17px" x="780" y="135" text-anchor="middle">H2 R2DBC</text>

<!-- Lifelines -->
<line class="lifeline" x1="110" y1="152" x2="110" y2="460"/>
<line class="lifeline" x1="315" y1="152" x2="315" y2="460"/>
<line class="lifeline" x1="545" y1="152" x2="545" y2="460"/>
<line class="lifeline" x1="780" y1="152" x2="780" y2="460"/>

<!-- 1. GET /posts -->
<rect fill="#EAF7EF" stroke="#58A978" stroke-width="1.2" x="50" y="172" width="110" height="22" rx="4"/>
<text class="small" x="105" y="187" text-anchor="middle">1. GET /posts</text>
<line class="reqArrow" x1="160" y1="183" x2="307" y2="183"/>

<!-- 2. findAll(): Flow~Post~ -->
<rect fill="#E8F3FF" stroke="#5B8DEF" stroke-width="1.2" x="230" y="204" width="150" height="22" rx="4"/>
<text class="small" x="305" y="219" text-anchor="middle">2. findAll(): Flow~Post~</text>
<line class="reqArrow" x1="315" y1="215" x2="537" y2="215"/>

<!-- 3. SELECT * FROM posts (R2DBC) -->
<rect fill="#E9F7F6" stroke="#45A7A1" stroke-width="1.2" x="460" y="236" width="150" height="22" rx="4"/>
<text class="small" x="535" y="251" text-anchor="middle">3. SELECT (R2DBC)</text>
<line class="reqArrow" x1="545" y1="247" x2="772" y2="247"/>

<!-- 4. result rows -->
<rect fill="#f0faf8" stroke="#45A7A1" stroke-width="1.2" x="460" y="268" width="150" height="22" rx="4"/>
<text class="small" x="535" y="283" text-anchor="middle">4. result rows</text>
<line class="rspArrow" x1="772" y1="279" x2="553" y2="279"/>

<!-- 5. Flow~Post~ emitted -->
<rect fill="#f0f4ff" stroke="#5B8DEF" stroke-width="1.2" x="50" y="300" width="120" height="22" rx="4"/>
<text class="small" x="110" y="315" text-anchor="middle">5. Flow~Post~</text>
<line class="rspArrow" x1="537" y1="311" x2="170" y2="311"/>

<!-- 6. POST /posts -->
<rect fill="#FFF3D9" stroke="#D6A441" stroke-width="1.2" x="50" y="338" width="130" height="22" rx="4"/>
<text class="small" x="115" y="353" text-anchor="middle">6. POST /posts body</text>
<line class="reqArrow" x1="180" y1="349" x2="307" y2="349"/>

<!-- 7. suspend save(post) -->
<rect fill="#E8F3FF" stroke="#5B8DEF" stroke-width="1.2" x="230" y="370" width="150" height="22" rx="4"/>
<text class="small" x="305" y="385" text-anchor="middle">7. suspend save(post)</text>
<line class="reqArrow" x1="315" y1="381" x2="537" y2="381"/>

<!-- 8. INSERT R2DBC -->
<rect fill="#E9F7F6" stroke="#45A7A1" stroke-width="1.2" x="460" y="402" width="150" height="22" rx="4"/>
<text class="small" x="535" y="417" text-anchor="middle">8. INSERT (R2DBC)</text>
<line class="reqArrow" x1="545" y1="413" x2="772" y2="413"/>

<!-- 9. saved Post -->
<rect fill="#f7f2ff" stroke="#8A72D6" stroke-width="1.2" x="50" y="434" width="120" height="22" rx="4"/>
<text class="small" x="110" y="449" text-anchor="middle">9. saved Post</text>
<line class="rspArrow" x1="772" y1="445" x2="170" y2="445"/>
</svg>
