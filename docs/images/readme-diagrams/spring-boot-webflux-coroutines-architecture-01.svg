<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" role="img" aria-label="Spring Boot WebFlux Coroutines Architecture">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#1f2937" flood-opacity="0.10"/></filter>
  <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth">
    <path d="M1,1 L8,4.5 L1,8 Z" fill="#758297"/>
  </marker>
  <style>
    .canvas{fill:#f7f9fc}.frame{fill:#fff;stroke:#d8e0ea;stroke-width:1.5}
    .title{font-family:"Architects Daughter";font-size:38px;font-weight:400;fill:#102033}
    .subtitle{font-family:"Comic Mono";font-size:14px;font-weight:400;fill:#536273}
    .smallLabel{font-family:"Architects Daughter";font-size:21px;font-weight:400;fill:#102033}
    .mono{font-family:"Comic Mono";font-size:12px;font-weight:400;fill:#102033}
    .small{font-family:"Comic Mono";font-size:12px;font-weight:400;fill:#536273}
    .card{stroke-width:2.1;filter:url(#shadow)}
    .line{stroke:#758297;stroke-width:2.1;fill:none;marker-end:url(#arrow)}
  </style>
</defs>
<rect class="canvas" width="960" height="480"/>
<rect class="frame" x="24" y="20" width="912" height="440" rx="22"/>

<!-- Title -->
<text class="title" x="48" y="68">WebFlux + Coroutines</text>
<text class="subtitle" x="52" y="92">coRouter / @RestController → suspend handlers → Dispatchers.IO / VT</text>

<!-- Row 1: Entry points -->
<!-- HTTP Client -->
<g transform="translate(48,116)">
  <rect class="card" x="0" y="0" width="180" height="80" rx="12" fill="#E8F3FF" stroke="#5B8DEF"/>
  <text class="smallLabel" x="90" y="38" text-anchor="middle">HTTP Client</text>
  <text class="small" x="90" y="60" text-anchor="middle">WebTestClient</text>
</g>

<!-- coRouter DSL -->
<g transform="translate(272,116)">
  <rect class="card" x="0" y="0" width="200" height="80" rx="12" fill="#FFF3D9" stroke="#D6A441"/>
  <text class="smallLabel" x="100" y="30" text-anchor="middle">coRouter</text>
  <text class="smallLabel" x="100" y="54" text-anchor="middle">Handler</text>
  <text class="small" x="100" y="72" text-anchor="middle">coRouter DSL /coroutine</text>
</g>

<!-- @RestController -->
<g transform="translate(516,116)">
  <rect class="card" x="0" y="0" width="200" height="80" rx="12" fill="#EAF7EF" stroke="#58A978"/>
  <text class="smallLabel" x="100" y="30" text-anchor="middle">@RestController</text>
  <text class="mono" x="100" y="52" text-anchor="middle">suspend functions</text>
  <text class="small" x="100" y="70" text-anchor="middle">GET /default /io /vt</text>
</g>

<!-- NettyConfig -->
<g transform="translate(758,116)">
  <rect class="card" x="0" y="0" width="150" height="80" rx="12" fill="#F1ECFF" stroke="#8A72D6"/>
  <text class="smallLabel" x="75" y="34" text-anchor="middle">Netty</text>
  <text class="smallLabel" x="75" y="58" text-anchor="middle">Config</text>
</g>

<!-- Row 2: Coroutine controllers -->
<!-- DefaultCoroutineController -->
<g transform="translate(48,260)">
  <rect class="card" x="0" y="0" width="200" height="100" rx="12" fill="#EAF7EF" stroke="#58A978"/>
  <text class="smallLabel" x="100" y="28" text-anchor="middle">Default</text>
  <text class="smallLabel" x="100" y="52" text-anchor="middle">Coroutine</text>
  <text class="mono" x="100" y="74" text-anchor="middle">Dispatchers.Default</text>
</g>

<!-- IOCoroutineController -->
<g transform="translate(264,260)">
  <rect class="card" x="0" y="0" width="200" height="100" rx="12" fill="#FDECEF" stroke="#DC6B82"/>
  <text class="smallLabel" x="100" y="28" text-anchor="middle">IO</text>
  <text class="smallLabel" x="100" y="52" text-anchor="middle">Coroutine</text>
  <text class="mono" x="100" y="74" text-anchor="middle">Dispatchers.IO</text>
</g>

<!-- VTCoroutineController -->
<g transform="translate(480,260)">
  <rect class="card" x="0" y="0" width="200" height="100" rx="12" fill="#E9F7F6" stroke="#45A7A1"/>
  <text class="smallLabel" x="100" y="28" text-anchor="middle">VT</text>
  <text class="smallLabel" x="100" y="52" text-anchor="middle">Coroutine</text>
  <text class="mono" x="100" y="74" text-anchor="middle">Dispatchers.VT</text>
</g>

<!-- Service -->
<g transform="translate(696,260)">
  <rect class="card" x="0" y="0" width="200" height="100" rx="12" fill="#FFF3D9" stroke="#D6A441"/>
  <text class="smallLabel" x="100" y="28" text-anchor="middle">Service</text>
  <text class="mono" x="100" y="52" text-anchor="middle">suspend fun</text>
  <text class="small" x="100" y="74" text-anchor="middle">external API call</text>
</g>

<!-- Arrows Row 1 -->
<path class="line" d="M228,156 L272,156"/>
<path class="line" d="M472,156 L516,156"/>
<path class="line" d="M716,156 L758,156"/>

<!-- Row 1 → Row 2 -->
<!-- Client → Default/IO/VT controllers -->
<path class="line" d="M138,196 L138,230 L148,230 L148,260"/>
<path class="line" d="M138,196 L138,230 L364,230 L364,260"/>
<path class="line" d="M138,196 L138,230 L580,230 L580,260"/>

<!-- coRouter → Service -->
<path class="line" d="M372,196 L372,230 L796,230 L796,260"/>

<!-- Service at Row 2 bottom note -->
<text class="small" x="48" y="400">suspend functions run on coroutine context — blocking work wrapped in withContext(Dispatchers.IO)</text>
</svg>
