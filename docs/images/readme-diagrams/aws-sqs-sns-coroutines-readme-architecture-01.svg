  <rect x="0" y="0" width="1280" height="1190" fill="#f4f7fb"/>
  <text class="title" x="64" y="58">SQS + SNS coroutine messaging workshop</text>
  <text class="subtitle" x="64" y="90">Default path is local-first: publish to SNS, consume from SQS, then classify ack, retry, or dead-letter outcomes.</text>

  <path d="M56 116 H1224 V246 H56 Z" fill="#eaf2fb" stroke="#c7d9e8" stroke-width="2"/>
  <text class="layer-title" x="82" y="152">1. Learner entry</text>
  <path d="M56 276 H1224 V470 H56 Z" fill="#eef6f0" stroke="#c9dfce" stroke-width="2"/>
  <text class="layer-title" x="82" y="312">2. Spring Boot coroutine service</text>
  <path d="M56 500 H1224 V710 H56 Z" fill="#fff7e8" stroke="#e2c891" stroke-width="2"/>
  <text class="layer-title" x="82" y="536">3. AWS messaging boundaries</text>
  <path d="M56 740 H1224 V940 H56 Z" fill="#edf8f5" stroke="#bdddd2" stroke-width="2"/>
  <text class="layer-title" x="82" y="776">4. Local adapters and handler</text>
  <path d="M56 970 H1224 V1138 H56 Z" fill="#eef8fb" stroke="#bedae4" stroke-width="2"/>
  <text class="layer-title" x="82" y="1002">5. Observable reports</text>

  <g class="node" data-node="client">
    <rect class="card code-card" x="440" y="154" width="400" height="76"></rect>
    <text class="card-title" x="640" y="184">Learner test or bootRun</text>
    <text class="card-sub" x="640" y="210">OrderNotificationRequest command</text>
  </g>
  <g class="node" data-node="properties">
    <rect class="card config-card" x="106" y="336" width="320" height="86"></rect>
    <text class="card-title" x="266" y="368">SqsSnsMessagingProperties</text>
    <text class="card-sub" x="266" y="395">topic ARN, queue URL, retry limits</text>
  </g>
  <g class="node" data-node="service">
    <rect class="card code-card" x="462" y="322" width="356" height="110"></rect>
    <text class="card-title" x="640" y="358">OrderNotificationMessagingService</text>
    <text class="card-sub" x="640" y="386">validates, publishes, polls, classifies</text>
    <text class="card-sub" x="640" y="410">rethrows coroutine cancellation</text>
  </g>
  <g class="node" data-node="mapper">
    <rect class="card config-card" x="854" y="336" width="320" height="86"></rect>
    <text class="card-title" x="1014" y="368">Jackson ObjectMapper</text>
    <text class="card-sub" x="1014" y="395">JSON event payload contract</text>
  </g>
  <g class="node" data-node="snsOps">
    <rect class="card code-card" x="162" y="562" width="316" height="92"></rect>
    <text class="card-title" x="320" y="596">SnsOperations</text>
    <text class="card-sub" x="320" y="624">SnsPublishRequest with attributes</text>
  </g>
  <g class="node" data-node="sqsOps">
    <rect class="card code-card" x="802" y="562" width="316" height="92"></rect>
    <text class="card-title" x="960" y="596">SqsOperations</text>
    <text class="card-sub" x="960" y="624">receive, delete, visibility change</text>
  </g>
  <g class="node" data-node="snsTopic">
    <rect class="card aws-card" x="154" y="780" width="332" height="100"></rect>
    <use href="#icon-sns" x="184" y="804" width="52" height="52"/>
    <text class="card-title" x="360" y="816">Amazon SNS topic</text>
    <text class="card-sub" x="360" y="844">fan-out envelope</text>
  </g>
  <g class="node" data-node="sqsQueue">
    <rect class="card aws-card" x="794" y="780" width="332" height="100"></rect>
    <use href="#icon-sqs" x="824" y="804" width="52" height="52"/>
    <text class="card-title" x="1000" y="816">Amazon SQS queue</text>
    <text class="card-sub" x="1000" y="844">receive-count messages</text>
  </g>
  <g class="node" data-node="handler">
    <rect class="card local-card" x="146" y="1028" width="332" height="80"></rect>
    <text class="card-title" x="312" y="1060">OrderNotificationHandler</text>
    <text class="card-sub" x="312" y="1086">learner-owned business action</text>
  </g>
  <g class="node" data-node="reports">
    <rect class="card local-card" x="502" y="1028" width="276" height="80"></rect>
    <text class="card-title" x="640" y="1060">Consume reports</text>
    <text class="card-sub" x="640" y="1086">acked, retry, dead-letter</text>
  </g>
  <g class="node" data-node="metrics">
    <rect class="card metric-card" x="802" y="1028" width="332" height="80"></rect>
    <text class="card-title" x="968" y="1060">OrderNotificationMetrics</text>
    <text class="card-sub" x="968" y="1086">Micrometer counters and timers</text>
  </g>

