<svg xmlns="http://www.w3.org/2000/svg" width="1780" height="1120" viewBox="0 0 1780 1120" role="img" aria-labelledby="title desc">
  <title id="title">DDD Order Audit Architecture</title>
  <desc id="desc">Order commands persist PostgreSQL state and Modulith publication rows in one transaction, then after-commit listeners create fulfillment and JaVers audit records.</desc>
  <defs>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="124%"><feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#64748B" flood-opacity="0.12"/></filter>
    <style>
      .bg{fill:#F8FAFC}.title{font-family:"Architects Daughter";font-size:42px;fill:#263238}.subtitle,.body,.small,.legendText,.footer{font-family:"Comic Mono";fill:#3E4C59}.subtitle{font-size:18px}.layerTitle{font-family:"Architects Daughter";font-size:25px;fill:#344154}.cardTitle{font-family:"Architects Daughter";font-size:24px;fill:#16202A}.body{font-size:16px}.small{font-size:13px;fill:#5B6975}.footer{font-size:14px;fill:#60727D}.layer{fill:#FFFFFF;stroke:#CAD6DF;stroke-width:2}.card{stroke-width:2.2}.blue{fill:#EFF6FF;stroke:#4F86C6}.green{fill:#F0F8F0;stroke:#6E8F4F}.amber{fill:#FFF7E8;stroke:#9B7D54}.red{fill:#FFF0F0;stroke:#B86868}.store{fill:#FFFAF2;stroke:#8C6F33}.connector{fill:none;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round}.command{stroke:#4F86C6;marker-end:url(#arrow-command)}.tx{stroke:#6E8F4F;marker-end:url(#arrow-tx)}.after{stroke:#9B7D54;marker-end:url(#arrow-after)}.replay{stroke:#B86868;marker-end:url(#arrow-replay)}.legendBox{fill:#FFFFFF;stroke:#CAD6DF;stroke-width:1.8}.legendText{font-size:14px}
    </style>
    <marker id="arrow-command" viewBox="0 0 10 10" markerWidth="14" markerHeight="14" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#4F86C6" stroke="#4F86C6" stroke-dasharray="none" style="stroke-dasharray:none"/></marker>
    <marker id="arrow-tx" viewBox="0 0 10 10" markerWidth="14" markerHeight="14" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#6E8F4F" stroke="#6E8F4F" stroke-dasharray="none" style="stroke-dasharray:none"/></marker>
    <marker id="arrow-after" viewBox="0 0 10 10" markerWidth="14" markerHeight="14" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#9B7D54" stroke="#9B7D54" stroke-dasharray="none" style="stroke-dasharray:none"/></marker>
    <marker id="arrow-replay" viewBox="0 0 10 10" markerWidth="14" markerHeight="14" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#B86868" stroke="#B86868" stroke-dasharray="none" style="stroke-dasharray:none"/></marker>
  </defs>
  <rect class="bg" width="1780" height="1120"/>
  <text class="title" x="890" y="64" text-anchor="middle">DDD Order Audit Architecture</text>
  <text class="subtitle" x="890" y="96" text-anchor="middle">PostgreSQL owns command state and publication rows; after-commit handlers own fulfillment and JaVers history.</text>

  <rect class="layer" x="78" y="132" width="1624" height="198" rx="22"/>
  <text class="layerTitle" x="112" y="176">Command model</text>
  <g class="node" data-node="order-command-service" filter="url(#shadow)"><rect class="card blue" x="180" y="215" width="360" height="80" rx="16"/><text class="cardTitle" x="360" y="249" text-anchor="middle">OrderCommandService</text><text class="body" x="360" y="275" text-anchor="middle">place / approve use cases</text></g>
  <g class="node" data-node="order-aggregate" filter="url(#shadow)"><rect class="card blue" x="710" y="215" width="360" height="80" rx="16"/><text class="cardTitle" x="890" y="249" text-anchor="middle">Order aggregate</text><text class="body" x="890" y="275" text-anchor="middle">invariants + safe events</text></g>
  <g class="node" data-node="domain-events" filter="url(#shadow)"><rect class="card blue" x="1240" y="215" width="360" height="80" rx="16"/><text class="cardTitle" x="1420" y="249" text-anchor="middle">Domain events</text><text class="body" x="1420" y="275" text-anchor="middle">OrderPlaced / OrderApproved</text></g>

  <rect class="layer" x="78" y="388" width="1624" height="260" rx="22"/>
  <text class="layerTitle" x="112" y="432">Single PostgreSQL transaction</text>
  <g class="node" data-node="order-jpa-repository" filter="url(#shadow)"><rect class="card green" x="180" y="485" width="360" height="82" rx="16"/><text class="cardTitle" x="360" y="519" text-anchor="middle">OrderJpaRepository</text><text class="body" x="360" y="545" text-anchor="middle">orders + order_lines</text></g>
  <g class="node" data-node="event-publication-registry" filter="url(#shadow)"><rect class="card green" x="710" y="485" width="360" height="82" rx="16"/><text class="cardTitle" x="890" y="519" text-anchor="middle">Event publication registry</text><text class="body" x="890" y="545" text-anchor="middle">same commit as order row</text></g>
  <g class="node" data-node="postgresql-testcontainer" filter="url(#shadow)">
    <rect class="card store" x="1240" y="462" width="360" height="128" rx="16"/>
    <image data-bluetape4k-icon="postgresql" data-source="docs/icons/testcontainers/database/postgresql.svg" x="1394" y="476" width="52" height="52" href="data:image/svg+xml;base64," preserveAspectRatio="xMidYMid meet"/>
    <text class="cardTitle" x="1420" y="552" text-anchor="middle">PostgreSQL Testcontainer</text>
    <text class="body" x="1420" y="576" text-anchor="middle">orders + publications</text>
  </g>

  <rect class="layer" x="78" y="706" width="1624" height="232" rx="22"/>
  <text class="layerTitle" x="112" y="750">After-commit side effects</text>
  <g class="node" data-node="fulfillment-listener" filter="url(#shadow)"><rect class="card amber" x="180" y="800" width="360" height="82" rx="16"/><text class="cardTitle" x="360" y="834" text-anchor="middle">Fulfillment listener</text><text class="body" x="360" y="860" text-anchor="middle">reserves after approval</text></g>
  <g class="node" data-node="javers-audit-service" filter="url(#shadow)"><rect class="card amber" x="710" y="800" width="360" height="82" rx="16"/><text class="cardTitle" x="890" y="834" text-anchor="middle">JaVers audit service</text><text class="body" x="890" y="860" text-anchor="middle">afterCommit snapshots</text></g>
  <g class="node" data-node="replay-controls" filter="url(#shadow)"><rect class="card red" x="1240" y="800" width="360" height="82" rx="16"/><text class="cardTitle" x="1420" y="834" text-anchor="middle">Replay controls</text><text class="body" x="1420" y="860" text-anchor="middle">FAILED row -> resubmit</text></g>

  <g class="edge" data-edge="order-command-service-&gt;order-aggregate" data-label="command validates aggregate"><path data-connector="command-to-aggregate" class="connector command" d="M 540 255 L 710 255"/></g>
  <g class="edge" data-edge="order-aggregate-&gt;domain-events" data-label="aggregate emits domain events"><path data-connector="aggregate-to-events" class="connector command" d="M 1070 255 L 1240 255"/></g>
  <g class="edge" data-edge="order-command-service-&gt;order-jpa-repository" data-label="persist order rows"><path data-connector="service-to-order-repo" class="connector tx" d="M 520 295 L 520 485"/></g>
  <g class="edge" data-edge="order-command-service-&gt;event-publication-registry" data-label="register publication row"><path data-connector="service-to-publication" class="connector tx" d="M 540 275 L 640 275 Q 660 275 660 295 L 660 356 Q 660 376 680 376 L 874 376 Q 890 376 890 392 L 890 485"/></g>
  <g class="edge" data-edge="order-jpa-repository-&gt;event-publication-registry" data-label="same transaction boundary"><path data-connector="repo-to-postgres" class="connector tx" d="M 540 526 L 710 526"/></g>
  <g class="edge" data-edge="event-publication-registry-&gt;postgresql-testcontainer" data-label="publication rows stored"><path data-connector="registry-to-postgres" class="connector tx" d="M 1070 526 L 1240 526"/></g>
  <g class="edge" data-edge="event-publication-registry-&gt;fulfillment-listener" data-label="after-commit fulfillment"><path data-connector="publication-to-fulfillment" class="connector after" d="M 820 567 L 820 675 Q 820 694 801 694 L 379 694 Q 360 694 360 713 L 360 800"/></g>
  <g class="edge" data-edge="event-publication-registry-&gt;javers-audit-service" data-label="after-commit audit"><path data-connector="publication-to-audit" class="connector after" d="M 890 567 L 890 800"/></g>
  <g class="edge" data-edge="event-publication-registry-&gt;replay-controls" data-label="failed publication replay"><path data-connector="publication-to-replay" class="connector replay" d="M 960 567 L 960 655 Q 960 674 979 674 L 1401 674 Q 1420 674 1420 693 L 1420 800"/></g>
  <g class="edge" data-edge="fulfillment-listener-&gt;postgresql-testcontainer" data-label="reservation write"><path data-connector="fulfillment-to-postgres" class="connector after" d="M 540 841 L 620 841 Q 640 841 640 861 L 640 918 Q 640 932 654 932 L 1662 932 Q 1676 932 1676 918 L 1676 540 Q 1676 526 1662 526 L 1600 526"/></g>

  <rect class="legendBox" x="208" y="990" width="1364" height="78" rx="16"/>
  <path d="M 290 1024 L 364 1024" fill="none" stroke="#4F86C6" stroke-width="4" stroke-linecap="round"/><polygon points="364,1024 348,1016 348,1032" fill="#4F86C6"/><text class="legendText" x="382" y="1029">command/event creation</text>
  <path d="M 610 1024 L 684 1024" fill="none" stroke="#6E8F4F" stroke-width="4" stroke-linecap="round"/><polygon points="684,1024 668,1016 668,1032" fill="#6E8F4F"/><text class="legendText" x="702" y="1029">same DB transaction</text>
  <path d="M 940 1024 L 1014 1024" fill="none" stroke="#9B7D54" stroke-width="4" stroke-linecap="round"/><polygon points="1014,1024 998,1016 998,1032" fill="#9B7D54"/><text class="legendText" x="1032" y="1029">after-commit effect</text>
  <path d="M 1260 1024 L 1334 1024" fill="none" stroke="#B86868" stroke-width="4" stroke-linecap="round"/><polygon points="1334,1024 1318,1016 1318,1032" fill="#B86868"/><text class="legendText" x="1352" y="1029">failed publication replay</text>
  <text class="footer" x="890" y="1092" text-anchor="middle">Reader contract: order row and publication row commit together; fulfillment and JaVers happen only after commit.</text>
</svg>
