<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1414" height="648" viewBox="0 0 1414 648" role="img" aria-labelledby="title desc">
  <title id="title">Chaos Monkey request path</title>
  <desc id="desc">With the chaos-monkey profile active, watched beans can receive latency or exception assaults before returning a response.</desc>
  <defs>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="124%"><feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#64748B" flood-opacity="0.14"/></filter>
    <style>.title{font-family:"Architects Daughter";font-size:40px;fill:#263238}.subtitle,.msg,.note,.footer{font-family:"Comic Mono";fill:#36464F}.subtitle{font-size:17px}.participant{font-family:"Architects Daughter";font-size:19px;fill:#1F3138}.role{font-family:"Comic Mono";font-size:12px;fill:#546A73}.msg{font-size:13px}.footer{font-size:14px;fill:#60727D}.frame{fill:#FBFCF8;stroke:#41545D;stroke-width:3}.header{fill:#FFFFFF;stroke:#546E7A;stroke-width:2}.lifeline{stroke:#9AAAB1;stroke-width:2;stroke-dasharray:7 8;stroke-linecap:round}.activation{fill:#E6F2EC;stroke:#5B7E67;stroke-width:1.5}.call,.work,.return{fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.call{stroke:#3F7D9C;marker-end:url(#arrow-call)}.work{stroke:#6E8F4F;marker-end:url(#arrow-work)}.return{stroke:#9B7D54;stroke-width:2.6;stroke-dasharray:8 6;marker-end:url(#arrow-ret)}.label{fill:#FFFFFF;stroke:#D7E0E4;stroke-width:1.5}.callLabel{stroke:#9CC2D1}.workLabel{stroke:#B6C9A4}.returnLabel{stroke:#C8B38F}.badge{stroke-width:1.8}.callBadge{fill:#EAF4F8;stroke:#3F7D9C}.workBadge{fill:#EEF7F0;stroke:#6E8F4F}.returnBadge{fill:#FFF7E8;stroke:#9B7D54}.badgeText{font-family:"Comic Mono";font-size:12px;font-weight:700}.callText,.badgeText.callText{fill:#2F6F8E}.workText,.badgeText.workText{fill:#55783F}.returnText,.badgeText.returnText{fill:#7F6038}</style>
    <marker id="arrow-call" viewBox="0 0 10 10" markerWidth="14" markerHeight="14" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#3F7D9C" stroke-dasharray="none" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="arrow-work" viewBox="0 0 10 10" markerWidth="14" markerHeight="14" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#6E8F4F" stroke-dasharray="none" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="arrow-ret" viewBox="0 0 10 10" markerWidth="14" markerHeight="14" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#9B7D54" stroke-dasharray="none" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>
  <rect x="24" y="24" width="1366" height="600" rx="20" class="frame"/>
  <text id="titleText" x="707.0" y="76" text-anchor="middle" class="title">Chaos Monkey request path</text>
  <text x="707.0" y="106" text-anchor="middle" class="subtitle">With the chaos-monkey profile active, watched beans can receive latency or exception assaults before returning a response.</text>
  <g filter="url(#shadow)"><rect x="90.0" y="156" width="250" height="76" rx="10" class="header"/>
    <text x="215.0" y="186" text-anchor="middle" class="participant">Client</text>
    <text x="215.0" y="211" text-anchor="middle" class="role">GET /students</text></g>
  <line x1="215.0" y1="232" x2="215.0" y2="560" class="lifeline"/>
  <g filter="url(#shadow)"><rect x="418.0" y="156" width="250" height="76" rx="10" class="header"/>
    <text x="543.0" y="186" text-anchor="middle" class="participant">Watcher</text>
    <text x="543.0" y="211" text-anchor="middle" class="role">restController=true</text></g>
  <line x1="543.0" y1="232" x2="543.0" y2="560" class="lifeline"/>
  <g filter="url(#shadow)"><rect x="746.0" y="156" width="250" height="76" rx="10" class="header"/>
    <text x="871.0" y="186" text-anchor="middle" class="participant">StudentService</text>
    <text x="871.0" y="211" text-anchor="middle" class="role">service=true</text></g>
  <line x1="871.0" y1="232" x2="871.0" y2="560" class="lifeline"/>
  <g filter="url(#shadow)"><rect x="1074.0" y="156" width="250" height="76" rx="10" class="header"/>
    <text x="1199.0" y="186" text-anchor="middle" class="participant">H2 table</text>
    <text x="1199.0" y="211" text-anchor="middle" class="role">student rows</text></g>
  <line x1="1199.0" y1="232" x2="1199.0" y2="560" class="lifeline"/>
  <rect x="256.0" y="252" width="246.0" height="34" rx="17" class="label callLabel"/>
  <circle cx="280.0" cy="269" r="13" class="badge callBadge"/><text x="280.0" y="274" text-anchor="middle" class="badgeText callText">1</text>
  <text x="304.0" y="274" class="msg callText">call watched endpoint</text>
  <path d="M 215.0 298 L 543.0 298" class="call" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="536.0" y="290" width="14" height="48" rx="4" class="activation"/>
  <rect x="560.0" y="328" width="294.0" height="34" rx="17" class="label callLabel"/>
  <circle cx="584.0" cy="345" r="13" class="badge callBadge"/><text x="584.0" y="350" text-anchor="middle" class="badgeText callText">2</text>
  <text x="608.0" y="350" class="msg callText">inject latency or exception</text>
  <path d="M 543.0 374 L 871.0 374" class="call" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="864.0" y="366" width="14" height="48" rx="4" class="activation"/>
  <rect x="856.0" y="404" width="358.0" height="34" rx="17" class="label workLabel"/>
  <circle cx="880.0" cy="421" r="13" class="badge workBadge"/><text x="880.0" y="426" text-anchor="middle" class="badgeText workText">3</text>
  <text x="904.0" y="426" class="msg workText">normal repository path when allowed</text>
  <path d="M 871.0 450 L 1199.0 450" class="work" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="1192.0" y="442" width="14" height="48" rx="4" class="activation"/>
  <rect x="477.0" y="480" width="460.0" height="34" rx="17" class="label returnLabel"/>
  <circle cx="501.0" cy="497" r="13" class="badge returnBadge"/><text x="501.0" y="502" text-anchor="middle" class="badgeText returnText">4</text>
  <text x="525.0" y="502" class="msg returnText">response is delayed, failed, or returned normally</text>
  <path d="M 1199.0 526 L 215.0 526" class="return" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="222.0" y="518" width="14" height="48" rx="4" class="activation"/>
  <rect x="90" y="584" width="1234" height="40" rx="12" fill="#FFFFFF" stroke="#CCD7DA" stroke-width="2"/>
  <text x="707.0" y="610" text-anchor="middle" class="footer">Reader contract: participants, ordered messages, returns, and infrastructure boundaries stay visible.</text>
</svg>
