<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" role="img" aria-label="Spring Boot Cache Redis Architecture">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#1f2937" flood-opacity="0.10"/></filter>
  <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth">
    <path d="M1,1 L8,4.5 L1,8 Z" fill="#758297"/>
  </marker>
  <style>
    .canvas{fill:#f7f9fc}.frame{fill:#fff;stroke:#d8e0ea;stroke-width:1.5}
    .title{font-family:"Architects Daughter";font-size:38px;font-weight:400;fill:#102033}
    .subtitle{font-family:"Comic Mono";font-size:14px;font-weight:400;fill:#536273}
    .smallLabel{font-family:"Architects Daughter";font-size:21px;font-weight:400;fill:#102033}
    .mono{font-family:"Comic Mono";font-size:12px;font-weight:400;fill:#102033}
    .small{font-family:"Comic Mono";font-size:12px;font-weight:400;fill:#536273}
    .card{stroke-width:2.1;filter:url(#shadow)}
    .line{stroke:#758297;stroke-width:2.1;fill:none;marker-end:url(#arrow)}
  </style>
</defs>
<rect class="canvas" width="960" height="440"/>
<rect class="frame" x="24" y="20" width="912" height="400" rx="22"/>

<!-- Title -->
<text class="title" x="48" y="68">Spring Boot Cache Redis</text>
<text class="subtitle" x="52" y="92">LettuceRedisCacheConfiguration → RedisCacheManager → @Cacheable services → Redis</text>

<!-- Row 1: Config layer -->
<!-- LettuceRedisCacheConfig -->
<g transform="translate(48,116)">
  <rect class="card" x="0" y="0" width="210" height="80" rx="12" fill="#F1ECFF" stroke="#8A72D6"/>
  <text class="smallLabel" x="105" y="30" text-anchor="middle">Lettuce</text>
  <text class="smallLabel" x="105" y="54" text-anchor="middle">Redis Config</text>
  <text class="small" x="105" y="72" text-anchor="middle">@EnableCaching</text>
</g>

<!-- RedisCacheManager -->
<g transform="translate(308,116)">
  <rect class="card" x="0" y="0" width="210" height="80" rx="12" fill="#FFF3D9" stroke="#D6A441"/>
  <text class="smallLabel" x="105" y="30" text-anchor="middle">RedisCacheManager</text>
  <text class="mono" x="105" y="52" text-anchor="middle">transactionAware</text>
  <text class="small" x="105" y="70" text-anchor="middle">TTL = 1 day</text>
</g>

<!-- LettuceConnectionFactory -->
<g transform="translate(568,116)">
  <rect class="card" x="0" y="0" width="220" height="80" rx="12" fill="#EAF7EF" stroke="#58A978"/>
  <text class="smallLabel" x="110" y="30" text-anchor="middle">Lettuce</text>
  <text class="smallLabel" x="110" y="54" text-anchor="middle">Connection</text>
  <text class="small" x="110" y="72" text-anchor="middle">VirtualThread executor</text>
</g>

<!-- Redis (Testcontainers) -->
<g transform="translate(800,116)">
  <rect class="card" x="0" y="0" width="136" height="80" rx="12" fill="#E9F7F6" stroke="#45A7A1"/>
  <text class="smallLabel" x="68" y="30" text-anchor="middle">Redis</text>
  <text class="small" x="68" y="52" text-anchor="middle">Testcontainers</text>
  <text class="small" x="68" y="70" text-anchor="middle">port 6379</text>
</g>

<!-- Row 2: Service layer -->
<!-- CountryRepository -->
<g transform="translate(48,256)">
  <rect class="card" x="0" y="0" width="220" height="90" rx="12" fill="#E8F3FF" stroke="#5B8DEF"/>
  <text class="smallLabel" x="110" y="30" text-anchor="middle">Country</text>
  <text class="smallLabel" x="110" y="54" text-anchor="middle">Repository</text>
  <text class="mono" x="110" y="74" text-anchor="middle">@Cacheable @CacheEvict</text>
</g>

<!-- CountryPrefetcher -->
<g transform="translate(310,256)">
  <rect class="card" x="0" y="0" width="220" height="90" rx="12" fill="#FDECEF" stroke="#DC6B82"/>
  <text class="smallLabel" x="110" y="30" text-anchor="middle">Country</text>
  <text class="smallLabel" x="110" y="54" text-anchor="middle">Prefetcher</text>
  <text class="mono" x="110" y="74" text-anchor="middle">@Scheduled</text>
</g>

<!-- AsyncConfig -->
<g transform="translate(572,256)">
  <rect class="card" x="0" y="0" width="210" height="90" rx="12" fill="#FFF3D9" stroke="#D6A441"/>
  <text class="smallLabel" x="105" y="30" text-anchor="middle">AsyncConfig</text>
  <text class="small" x="105" y="52" text-anchor="middle">VirtualThread</text>
  <text class="small" x="105" y="70" text-anchor="middle">TaskExecutor</text>
</g>

<!-- RedisTemplate -->
<g transform="translate(796,256)">
  <rect class="card" x="0" y="0" width="140" height="90" rx="12" fill="#EAF7EF" stroke="#58A978"/>
  <text class="smallLabel" x="70" y="30" text-anchor="middle">Redis</text>
  <text class="smallLabel" x="70" y="54" text-anchor="middle">Template</text>
  <text class="small" x="70" y="74" text-anchor="middle">LZ4Kryo serial.</text>
</g>

<!-- Arrows Row 1 -->
<path class="line" d="M258,156 L308,156"/>
<path class="line" d="M518,156 L568,156"/>
<path class="line" d="M788,156 L800,156"/>

<!-- Arrows Row 1 → Row 2 -->
<!-- LettuceRedisConfig → CountryRepository (via CacheManager) -->
<path class="line" d="M413,196 L413,226 L158,226 L158,256"/>
<!-- LettuceRedisConfig → AsyncConfig -->
<path class="line" d="M148,196 L148,236 L677,236 L677,256"/>

<!-- Row 2 arrows -->
<!-- CountryPrefetcher → CountryRepository -->
<path class="line" d="M310,296 L268,296"/>
<!-- CountryRepository → RedisCacheManager (through cache) -->
<path class="line" d="M268,296 L278,296"/>
<!-- RedisTemplate → Redis: vertical up from RedisTemplate top center to Redis bottom center -->
<path class="line" d="M866,256 L866,196"/>
</svg>
