<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" role="img" aria-label="Spring Boot Problem Details Architecture">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#1f2937" flood-opacity="0.10"/></filter>
  <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth">
    <path d="M1,1 L8,4.5 L1,8 Z" fill="#758297"/>
  </marker>
  <style>
    .canvas{fill:#f7f9fc}.frame{fill:#fff;stroke:#d8e0ea;stroke-width:1.5}
    .title{font-family:"Architects Daughter";font-size:38px;font-weight:400;fill:#102033}
    .subtitle{font-family:"Comic Mono";font-size:14px;font-weight:400;fill:#536273}
    .smallLabel{font-family:"Architects Daughter";font-size:21px;font-weight:400;fill:#102033}
    .mono{font-family:"Comic Mono";font-size:12px;font-weight:400;fill:#102033}
    .small{font-family:"Comic Mono";font-size:12px;font-weight:400;fill:#536273}
    .card{stroke-width:2.1;filter:url(#shadow)}
    .line{stroke:#758297;stroke-width:2.1;fill:none;marker-end:url(#arrow)}
  </style>
</defs>
<rect class="canvas" width="960" height="440"/>
<rect class="frame" x="24" y="20" width="912" height="400" rx="22"/>

<!-- Title -->
<text class="title" x="48" y="68">Spring Boot Problem Details</text>
<text class="subtitle" x="52" y="92">RFC 7807 Problem Details: @ControllerAdvice → ProblemHandling → application/problem+json</text>

<!-- Row 1: Client → Controllers → Exceptions -->
<!-- HTTP Client -->
<g transform="translate(48,116)">
  <rect class="card" x="0" y="0" width="180" height="80" rx="12" fill="#E8F3FF" stroke="#5B8DEF"/>
  <text class="smallLabel" x="90" y="38" text-anchor="middle">HTTP Client</text>
  <text class="small" x="90" y="60" text-anchor="middle">WebTestClient</text>
</g>

<!-- TaskController -->
<g transform="translate(274,116)">
  <rect class="card" x="0" y="0" width="200" height="80" rx="12" fill="#EAF7EF" stroke="#58A978"/>
  <text class="smallLabel" x="100" y="30" text-anchor="middle">Task</text>
  <text class="smallLabel" x="100" y="54" text-anchor="middle">Controller</text>
  <text class="small" x="100" y="72" text-anchor="middle">GET/PUT/DELETE /tasks</text>
</g>

<!-- Resilience4jController -->
<g transform="translate(516,116)">
  <rect class="card" x="0" y="0" width="220" height="80" rx="12" fill="#EAF7EF" stroke="#58A978"/>
  <text class="smallLabel" x="110" y="30" text-anchor="middle">Resilience4j</text>
  <text class="smallLabel" x="110" y="54" text-anchor="middle">Controller</text>
  <text class="small" x="110" y="72" text-anchor="middle">CircuitBreaker endpoints</text>
</g>

<!-- Exceptions -->
<g transform="translate(770,116)">
  <rect class="card" x="0" y="0" width="166" height="80" rx="12" fill="#FDECEF" stroke="#DC6B82"/>
  <text class="smallLabel" x="83" y="28" text-anchor="middle">Exceptions</text>
  <text class="small" x="83" y="48" text-anchor="middle">TaskNotFound</text>
  <text class="small" x="83" y="64" text-anchor="middle">InvalidTaskId</text>
  <text class="small" x="83" y="80" text-anchor="middle">AccessDenied</text>
</g>

<!-- Row 2: Exception Handler + Problem Response -->
<!-- RestApiExceptionHandler -->
<g transform="translate(140,264)">
  <rect class="card" x="0" y="0" width="240" height="100" rx="12" fill="#F1ECFF" stroke="#8A72D6"/>
  <text class="smallLabel" x="120" y="28" text-anchor="middle">RestApiException</text>
  <text class="smallLabel" x="120" y="52" text-anchor="middle">Handler</text>
  <text class="mono" x="120" y="72" text-anchor="middle">@ControllerAdvice</text>
  <text class="small" x="120" y="90" text-anchor="middle">ProblemHandling</text>
</g>

<!-- ProblemHandling (Zalando) -->
<g transform="translate(430,264)">
  <rect class="card" x="0" y="0" width="220" height="100" rx="12" fill="#FFF3D9" stroke="#D6A441"/>
  <text class="smallLabel" x="110" y="28" text-anchor="middle">Problem</text>
  <text class="smallLabel" x="110" y="52" text-anchor="middle">Handling</text>
  <text class="mono" x="110" y="72" text-anchor="middle">zalando/problem</text>
  <text class="small" x="110" y="90" text-anchor="middle">spring-webflux-advice</text>
</g>

<!-- Problem Response -->
<g transform="translate(692,264)">
  <rect class="card" x="0" y="0" width="220" height="100" rx="12" fill="#E9F7F6" stroke="#45A7A1"/>
  <text class="smallLabel" x="110" y="26" text-anchor="middle">Problem</text>
  <text class="smallLabel" x="110" y="50" text-anchor="middle">Response</text>
  <text class="mono" x="110" y="70" text-anchor="middle">application/</text>
  <text class="mono" x="110" y="86" text-anchor="middle">problem+json</text>
</g>

<!-- Arrows Row 1 -->
<path class="line" d="M228,156 L274,156"/>
<path class="line" d="M474,156 L516,156"/>
<path class="line" d="M736,156 L770,156"/>

<!-- Row 1 → Row 2: Controllers throw exceptions → ExceptionHandler handles -->
<path class="line" d="M374,196 L374,234 L260,234 L260,264"/>
<path class="line" d="M626,196 L626,234 L380,234 L380,264"/>
<!-- Exceptions → ExceptionHandler: bus to ExceptionHandler top -->
<path class="line" d="M853,196 L853,234 L380,234 L380,264"/>

<!-- ExceptionHandler → ProblemHandling → Response -->
<path class="line" d="M380,314 L430,314"/>
<path class="line" d="M650,314 L692,314"/>
</svg>
