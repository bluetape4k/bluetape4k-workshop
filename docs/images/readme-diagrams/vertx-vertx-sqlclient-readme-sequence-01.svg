<svg xmlns="http://www.w3.org/2000/svg" width="1270" height="1262" viewBox="0 0 1270 1262" role="img" aria-label="Vert.x Sql Client Example Diagram 1">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#1f2937" flood-opacity="0.10"/></filter>
  <marker id="arrowBlue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M1 1 L7 4 L1 7 Z" fill="#5b8def"/></marker>
  <marker id="arrowTeal" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M1 1 L7 4 L1 7 Z" fill="#45a7a1"/></marker>
  <style>
    .canvas{fill:#f7f9fc}
    .frame{fill:#ffffff;stroke:#d8e0ea;stroke-width:1.5}
    .title{font-family:"Architects Daughter";font-size:34px;fill:#102033}
    .subtitle{font-family:"Comic Mono";font-size:13px;fill:#536273}
    .actor{font-family:"Architects Daughter";font-size:17px;fill:#102033}
    .detail{font-family:"Comic Mono";font-size:11px;fill:#536273}
    .message{font-family:"Comic Mono";font-size:12px;fill:#263445;paint-order:stroke;stroke:#ffffff;stroke-width:4px;stroke-linejoin:round}
    .branch{font-family:"Architects Daughter";font-size:15px;fill:#1f3b57}
    .lifeline{stroke:#b8c4d3;stroke-width:1.4;stroke-dasharray:7 6}
    .call{stroke:#5b8def;stroke-width:2.1;fill:none;marker-end:url(#arrowBlue)}
    .return{stroke:#45a7a1;stroke-width:2;stroke-dasharray:7 5;fill:none;marker-end:url(#arrowTeal)}
    .box{stroke-width:1.8;filter:url(#shadow)}
  </style>
</defs>
<rect class="canvas" width="1270" height="1262"/>
<rect class="frame" x="24" y="20" width="1222" height="1222" rx="18"/>
<text class="title" x="48" y="58">Vert.x Sql Client Example Diagram 1</text>
<text class="subtitle" x="50" y="84">sequenceDiagram rendered from the current README model; labels are separated from connector lanes</text>
<rect class="box" x="46" y="116" width="152" height="58" rx="10" fill="#e8f3ff" stroke="#7aa0c4"/>
<text class="actor" x="122" y="145" text-anchor="middle" dominant-baseline="middle">Test</text>
<line class="lifeline" x1="122" y1="174" x2="122" y2="1204"/>
<rect class="box" x="302.5" y="116" width="152" height="58" rx="10" fill="#eaf7ef" stroke="#7aa0c4"/>
<text class="actor" x="378.5" y="137" text-anchor="middle" dominant-baseline="middle">withSuspendTransaction</text>
<text class="actor" x="378.5" y="153" text-anchor="middle" dominant-baseline="middle">{ }</text>
<line class="lifeline" x1="378.5" y1="174" x2="378.5" y2="1204"/>
<rect class="box" x="559" y="116" width="152" height="58" rx="10" fill="#fff3d9" stroke="#7aa0c4"/>
<text class="actor" x="635" y="137" text-anchor="middle" dominant-baseline="middle">JDBCPool /</text>
<text class="actor" x="635" y="153" text-anchor="middle" dominant-baseline="middle">MySQLPool</text>
<line class="lifeline" x1="635" y1="174" x2="635" y2="1204"/>
<rect class="box" x="815.5" y="116" width="152" height="58" rx="10" fill="#f1ecff" stroke="#7aa0c4"/>
<text class="actor" x="891.5" y="145" text-anchor="middle" dominant-baseline="middle">SqlConnection</text>
<line class="lifeline" x1="891.5" y1="174" x2="891.5" y2="1204"/>
<rect class="box" x="1072" y="116" width="152" height="58" rx="10" fill="#fdecef" stroke="#7aa0c4"/>
<text class="actor" x="1148" y="137" text-anchor="middle" dominant-baseline="middle">MySQL</text>
<text class="actor" x="1148" y="153" text-anchor="middle" dominant-baseline="middle">(Testcontainers)</text>
<line class="lifeline" x1="1148" y1="174" x2="1148" y2="1204"/>
<rect x="78" y="188" width="344.5" height="24" rx="6" fill="#ffffff" opacity="0.92" stroke="#dbe3ee"/>
<text class="message" x="250.25" y="194" text-anchor="middle" dominant-baseline="middle">1. pool.withSuspendTransaction { conn</text>
<text class="message" x="250.25" y="208" text-anchor="middle" dominant-baseline="middle">-&gt; }</text>
<path class="call" d="M122 218 L378.5 218"/>
<rect x="334.5" y="242" width="344.5" height="24" rx="6" fill="#ffffff" opacity="0.92" stroke="#dbe3ee"/>
<text class="message" x="506.75" y="255" text-anchor="middle" dominant-baseline="middle">2. begin transaction</text>
<path class="call" d="M378.5 272 L635 272"/>
<rect x="681.5" y="296" width="420" height="24" rx="6" fill="#ffffff" opacity="0.92" stroke="#dbe3ee"/>
<text class="message" x="891.5" y="309" text-anchor="middle" dominant-baseline="middle">3. START TRANSACTION</text>
<path class="call" d="M635 326 L1148 326"/>
<rect x="681.5" y="350" width="420" height="24" rx="6" fill="#ffffff" opacity="0.92" stroke="#dbe3ee"/>
<text class="message" x="891.5" y="363" text-anchor="middle" dominant-baseline="middle">4. OK</text>
<path class="return" d="M1148 380 L635 380"/>
<rect x="334.5" y="404" width="344.5" height="24" rx="6" fill="#ffffff" opacity="0.92" stroke="#dbe3ee"/>
<text class="message" x="506.75" y="417" text-anchor="middle" dominant-baseline="middle">5. SqlConnection</text>
<path class="return" d="M635 434 L378.5 434"/>
<rect x="425" y="458" width="420" height="24" rx="6" fill="#ffffff" opacity="0.92" stroke="#dbe3ee"/>
<text class="message" x="635" y="471" text-anchor="middle" dominant-baseline="middle">6. conn.query(...).execute().coAwait()</text>
<path class="call" d="M378.5 488 L891.5 488"/>
<rect x="847.5" y="512" width="344.5" height="24" rx="6" fill="#ffffff" opacity="0.92" stroke="#dbe3ee"/>
<text class="message" x="1019.75" y="525" text-anchor="middle" dominant-baseline="middle">7. SQL (within transaction)</text>
<path class="call" d="M891.5 542 L1148 542"/>
<rect x="847.5" y="566" width="344.5" height="24" rx="6" fill="#ffffff" opacity="0.92" stroke="#dbe3ee"/>
<text class="message" x="1019.75" y="579" text-anchor="middle" dominant-baseline="middle">8. RowSet</text>
<path class="return" d="M1148 596 L891.5 596"/>
<rect x="425" y="620" width="420" height="24" rx="6" fill="#ffffff" opacity="0.92" stroke="#dbe3ee"/>
<text class="message" x="635" y="633" text-anchor="middle" dominant-baseline="middle">9. RowSet (suspended resume)</text>
<path class="return" d="M891.5 650 L378.5 650"/>
<rect x="50" y="686" width="1170" height="34" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-dasharray="6 4"/>
<text class="branch" x="68" y="705" dominant-baseline="middle">alt: normal completion</text>
<rect x="334.5" y="728" width="344.5" height="24" rx="6" fill="#ffffff" opacity="0.92" stroke="#dbe3ee"/>
<text class="message" x="506.75" y="741" text-anchor="middle" dominant-baseline="middle">11. commit</text>
<path class="call" d="M378.5 758 L635 758"/>
<rect x="681.5" y="782" width="420" height="24" rx="6" fill="#ffffff" opacity="0.92" stroke="#dbe3ee"/>
<text class="message" x="891.5" y="795" text-anchor="middle" dominant-baseline="middle">12. COMMIT</text>
<path class="call" d="M635 812 L1148 812"/>
<rect x="425" y="836" width="420" height="24" rx="6" fill="#ffffff" opacity="0.92" stroke="#dbe3ee"/>
<text class="message" x="635" y="849" text-anchor="middle" dominant-baseline="middle">13. success</text>
<path class="return" d="M1148 866 L122 866"/>
<rect x="50" y="902" width="1170" height="34" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-dasharray="6 4"/>
<text class="branch" x="68" y="921" dominant-baseline="middle">else: exception</text>
<rect x="334.5" y="944" width="344.5" height="24" rx="6" fill="#ffffff" opacity="0.92" stroke="#dbe3ee"/>
<text class="message" x="506.75" y="957" text-anchor="middle" dominant-baseline="middle">15. rollback</text>
<path class="call" d="M378.5 974 L635 974"/>
<rect x="681.5" y="998" width="420" height="24" rx="6" fill="#ffffff" opacity="0.92" stroke="#dbe3ee"/>
<text class="message" x="891.5" y="1011" text-anchor="middle" dominant-baseline="middle">16. ROLLBACK</text>
<path class="call" d="M635 1028 L1148 1028"/>
<rect x="425" y="1052" width="420" height="24" rx="6" fill="#ffffff" opacity="0.92" stroke="#dbe3ee"/>
<text class="message" x="635" y="1065" text-anchor="middle" dominant-baseline="middle">17. exception re-thrown</text>
<path class="return" d="M1148 1082 L122 1082"/>
<line x1="52" y1="1136" x2="1218" y2="1136" stroke="#d8e0ea" stroke-width="1.2" stroke-dasharray="5 5"/>
</svg>
