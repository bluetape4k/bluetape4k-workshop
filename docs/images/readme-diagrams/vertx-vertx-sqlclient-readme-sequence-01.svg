<svg xmlns="http://www.w3.org/2000/svg" width="1270" height="1766" viewBox="0 0 1270 1766" role="img" aria-label="Vert.x Sql Client Example Diagram 1">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#1f2937" flood-opacity="0.10"/></filter>
  <marker id="arrowBlue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M1 1 L7 4 L1 7 Z" fill="#5b8def"/></marker>
  <marker id="arrowTeal" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M1 1 L7 4 L1 7 Z" fill="#45a7a1"/></marker>
  <style>
    .canvas{fill:#f7f9fc}
    .frame{fill:#ffffff;stroke:#d8e0ea;stroke-width:1.5}
    .title{font-family:"Architects Daughter";font-size:34px;fill:#102033}
    .subtitle{font-family:"Comic Mono";font-size:13px;fill:#536273}
    .actor{font-family:"Architects Daughter";font-size:17px;fill:#102033}
    .detail{font-family:"Comic Mono";font-size:11px;fill:#536273}
    .message{font-family:"Comic Mono";font-size:12px;fill:#263445;paint-order:stroke;stroke:#ffffff;stroke-width:4px;stroke-linejoin:round}
    .branch{font-family:"Architects Daughter";font-size:15px;fill:#1f3b57}
    .lifeline{stroke:#b8c4d3;stroke-width:1.4;stroke-dasharray:7 6}
    .call{stroke:#5b8def;stroke-width:2.1;fill:none;marker-end:url(#arrowBlue)}
    .return{stroke:#45a7a1;stroke-width:2;stroke-dasharray:7 5;fill:none;marker-end:url(#arrowTeal)}
    .box{stroke-width:1.8;filter:url(#shadow)}
  </style>
</defs>
<rect class="canvas" width="1270" height="1766"/>
<rect class="frame" x="24" y="20" width="1222" height="1726" rx="18"/>
<text class="title" x="48" y="58">Vert.x Sql Client Example Diagram 1</text>
<text class="subtitle" x="50" y="84">sequenceDiagram rendered from the current README model; labels are separated from connector lanes</text>
<rect class="box" x="30" y="116" width="184" height="58" rx="10" fill="#e8f3ff" stroke="#7aa0c4"/>
<text class="actor" x="122" y="145" text-anchor="middle" dominant-baseline="middle">Test</text>
<line class="lifeline" x1="122" y1="174" x2="122" y2="1708"/>
<rect class="box" x="286.5" y="116" width="184" height="58" rx="10" fill="#eaf7ef" stroke="#7aa0c4"/>
<text class="actor" x="378.5" y="138" text-anchor="middle" dominant-baseline="middle">with Suspend</text>
<text class="actor" x="378.5" y="152" text-anchor="middle" dominant-baseline="middle">Transaction { }</text>
<line class="lifeline" x1="378.5" y1="174" x2="378.5" y2="1708"/>
<rect class="box" x="543" y="116" width="184" height="58" rx="10" fill="#fff3d9" stroke="#7aa0c4"/>
<text class="actor" x="635" y="138" text-anchor="middle" dominant-baseline="middle">JDBCPool / My</text>
<text class="actor" x="635" y="152" text-anchor="middle" dominant-baseline="middle">SQLPool</text>
<line class="lifeline" x1="635" y1="174" x2="635" y2="1708"/>
<rect class="box" x="799.5" y="116" width="184" height="58" rx="10" fill="#f1ecff" stroke="#7aa0c4"/>
<text class="actor" x="891.5" y="145" text-anchor="middle" dominant-baseline="middle">Sql Connection</text>
<line class="lifeline" x1="891.5" y1="174" x2="891.5" y2="1708"/>
<rect class="box" x="1056" y="116" width="184" height="58" rx="10" fill="#fdecef" stroke="#7aa0c4"/>
<text class="actor" x="1148" y="138" text-anchor="middle" dominant-baseline="middle">My SQL</text>
<text class="actor" x="1148" y="152" text-anchor="middle" dominant-baseline="middle">(Testcontainers)</text>
<line class="lifeline" x1="1148" y1="174" x2="1148" y2="1708"/>
<rect x="78" y="162" width="344.5" height="40" rx="6" fill="#ffffff" opacity="0.95" stroke="#dbe3ee"/>
<text class="message" x="250.25" y="175" text-anchor="middle" dominant-baseline="middle">1. pool.withSuspendTransaction { conn</text>
<text class="message" x="250.25" y="189" text-anchor="middle" dominant-baseline="middle">-&gt; }</text>
<path class="call" d="M122 218 L378.5 218"/>
<rect x="334.5" y="258" width="344.5" height="26" rx="6" fill="#ffffff" opacity="0.95" stroke="#dbe3ee"/>
<text class="message" x="506.75" y="271" text-anchor="middle" dominant-baseline="middle">2. begin transaction</text>
<path class="call" d="M378.5 300 L635 300"/>
<rect x="681.5" y="340" width="420" height="26" rx="6" fill="#ffffff" opacity="0.95" stroke="#dbe3ee"/>
<text class="message" x="891.5" y="353" text-anchor="middle" dominant-baseline="middle">3. START TRANSACTION</text>
<path class="call" d="M635 382 L1148 382"/>
<rect x="681.5" y="422" width="420" height="26" rx="6" fill="#ffffff" opacity="0.95" stroke="#dbe3ee"/>
<text class="message" x="891.5" y="435" text-anchor="middle" dominant-baseline="middle">4. OK</text>
<path class="return" d="M1148 464 L635 464"/>
<rect x="334.5" y="504" width="344.5" height="26" rx="6" fill="#ffffff" opacity="0.95" stroke="#dbe3ee"/>
<text class="message" x="506.75" y="517" text-anchor="middle" dominant-baseline="middle">5. SqlConnection</text>
<path class="return" d="M635 546 L378.5 546"/>
<rect x="425" y="586" width="420" height="26" rx="6" fill="#ffffff" opacity="0.95" stroke="#dbe3ee"/>
<text class="message" x="635" y="599" text-anchor="middle" dominant-baseline="middle">6. conn.query(...).execute().coAwait()</text>
<path class="call" d="M378.5 628 L891.5 628"/>
<rect x="847.5" y="668" width="344.5" height="26" rx="6" fill="#ffffff" opacity="0.95" stroke="#dbe3ee"/>
<text class="message" x="1019.75" y="681" text-anchor="middle" dominant-baseline="middle">7. SQL (within transaction)</text>
<path class="call" d="M891.5 710 L1148 710"/>
<rect x="847.5" y="750" width="344.5" height="26" rx="6" fill="#ffffff" opacity="0.95" stroke="#dbe3ee"/>
<text class="message" x="1019.75" y="763" text-anchor="middle" dominant-baseline="middle">8. RowSet</text>
<path class="return" d="M1148 792 L891.5 792"/>
<rect x="425" y="832" width="420" height="26" rx="6" fill="#ffffff" opacity="0.95" stroke="#dbe3ee"/>
<text class="message" x="635" y="845" text-anchor="middle" dominant-baseline="middle">9. RowSet (suspended resume)</text>
<path class="return" d="M891.5 874 L378.5 874"/>
<rect x="50" y="938" width="1170" height="34" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-dasharray="6 4"/>
<text class="branch" x="68" y="957" dominant-baseline="middle">alt: normal completion</text>
<rect x="334.5" y="996" width="344.5" height="26" rx="6" fill="#ffffff" opacity="0.95" stroke="#dbe3ee"/>
<text class="message" x="506.75" y="1009" text-anchor="middle" dominant-baseline="middle">11. commit</text>
<path class="call" d="M378.5 1038 L635 1038"/>
<rect x="681.5" y="1078" width="420" height="26" rx="6" fill="#ffffff" opacity="0.95" stroke="#dbe3ee"/>
<text class="message" x="891.5" y="1091" text-anchor="middle" dominant-baseline="middle">12. COMMIT</text>
<path class="call" d="M635 1120 L1148 1120"/>
<rect x="425" y="1160" width="420" height="26" rx="6" fill="#ffffff" opacity="0.95" stroke="#dbe3ee"/>
<text class="message" x="635" y="1173" text-anchor="middle" dominant-baseline="middle">13. success</text>
<path class="return" d="M1148 1202 L122 1202"/>
<rect x="50" y="1266" width="1170" height="34" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-dasharray="6 4"/>
<text class="branch" x="68" y="1285" dominant-baseline="middle">else: exception</text>
<rect x="334.5" y="1324" width="344.5" height="26" rx="6" fill="#ffffff" opacity="0.95" stroke="#dbe3ee"/>
<text class="message" x="506.75" y="1337" text-anchor="middle" dominant-baseline="middle">15. rollback</text>
<path class="call" d="M378.5 1366 L635 1366"/>
<rect x="681.5" y="1406" width="420" height="26" rx="6" fill="#ffffff" opacity="0.95" stroke="#dbe3ee"/>
<text class="message" x="891.5" y="1419" text-anchor="middle" dominant-baseline="middle">16. ROLLBACK</text>
<path class="call" d="M635 1448 L1148 1448"/>
<rect x="425" y="1488" width="420" height="26" rx="6" fill="#ffffff" opacity="0.95" stroke="#dbe3ee"/>
<text class="message" x="635" y="1501" text-anchor="middle" dominant-baseline="middle">17. exception re-thrown</text>
<path class="return" d="M1148 1530 L122 1530"/>
<line x1="52" y1="1612" x2="1218" y2="1612" stroke="#d8e0ea" stroke-width="1.2" stroke-dasharray="5 5"/>
</svg>
