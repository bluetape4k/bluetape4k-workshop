<svg xmlns="http://www.w3.org/2000/svg" width="1270" height="1911" viewBox="0 0 1270 1911" role="img" aria-label="Vert.x Sql Client Example Diagram 1">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#1f2937" flood-opacity="0.10"/></filter>
  <marker id="arrowBlue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M1 1 L7 4 L1 7 Z" fill="#5b8def"/></marker>
  <marker id="arrowTeal" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M1 1 L7 4 L1 7 Z" fill="#45a7a1"/></marker>
  <style>
    .canvas{fill:#f7f9fc}
    .frame{fill:#ffffff;stroke:#d8e0ea;stroke-width:1.5}
    .title{font-family:"Architects Daughter";font-size:34px;fill:#102033}
    .subtitle{font-family:"Comic Mono";font-size:13px;fill:#536273}
    .actor{font-family:"Architects Daughter";font-size:17px;fill:#102033}
    .message{font-family:"Comic Mono";font-size:12px;fill:#263445;paint-order:stroke;stroke:#ffffff;stroke-width:4px;stroke-linejoin:round}
    .detail{font-family:"Comic Mono";font-size:11px;fill:#536273}
    .lifeline{stroke:#b8c4d3;stroke-width:1.4;stroke-dasharray:7 6}
    .call{stroke:#5b8def;stroke-width:2.15;fill:none;marker-end:url(#arrowBlue)}
    .return{stroke:#45a7a1;stroke-width:2.05;stroke-dasharray:7 5;fill:none;marker-end:url(#arrowTeal)}
    .box{stroke-width:1.8;filter:url(#shadow)}
  </style>
</defs>
<rect class="canvas" width="1270" height="1911"/>
<rect class="frame" x="24" y="20" width="1222" height="1871" rx="18"/>
<text class="title" x="48" y="58">Vert.x Sql Client Example Diagram 1</text>
<text class="subtitle" x="50" y="84">sequenceDiagram rendered from the current README model; labels are separated from connector lanes</text>
<rect class="box" x="2" y="108" width="180" height="58" rx="10" fill="#e8f3ff" stroke="#7aa0c4"/>
<text class="actor" x="92" y="137" text-anchor="middle" dominant-baseline="middle">Test</text>
<line class="lifeline" x1="92" y1="166" x2="92" y2="1853"/>
<rect class="box" x="273.5" y="108" width="180" height="58" rx="10" fill="#eaf7ef" stroke="#7aa0c4"/>
<text class="actor" x="363.5" y="130" text-anchor="middle" dominant-baseline="middle">with Suspend</text>
<text class="actor" x="363.5" y="144" text-anchor="middle" dominant-baseline="middle">Transaction { }</text>
<line class="lifeline" x1="363.5" y1="166" x2="363.5" y2="1853"/>
<rect class="box" x="545" y="108" width="180" height="58" rx="10" fill="#fff3d9" stroke="#7aa0c4"/>
<text class="actor" x="635" y="130" text-anchor="middle" dominant-baseline="middle">JDBCPool / My</text>
<text class="actor" x="635" y="144" text-anchor="middle" dominant-baseline="middle">SQLPool</text>
<line class="lifeline" x1="635" y1="166" x2="635" y2="1853"/>
<rect class="box" x="816.5" y="108" width="180" height="58" rx="10" fill="#f1ecff" stroke="#7aa0c4"/>
<text class="actor" x="906.5" y="137" text-anchor="middle" dominant-baseline="middle">Sql Connection</text>
<line class="lifeline" x1="906.5" y1="166" x2="906.5" y2="1853"/>
<rect class="box" x="1088" y="108" width="180" height="58" rx="10" fill="#fdecef" stroke="#7aa0c4"/>
<text class="actor" x="1178" y="130" text-anchor="middle" dominant-baseline="middle">My SQL</text>
<text class="actor" x="1178" y="144" text-anchor="middle" dominant-baseline="middle">(Testcontainers)</text>
<line class="lifeline" x1="1178" y1="166" x2="1178" y2="1853"/>
<path class="call" d="M92 205 L363.5 205"/>
<rect class="message-label" x="17" y="219" width="421.5" height="31" rx="7" fill="#ffffff" opacity="0.96" stroke="#dbe3ee"/>
<text class="message" x="227.75" y="234.5" text-anchor="middle" dominant-baseline="middle">1. -&gt; }</text>
<path class="call" d="M363.5 313 L635 313"/>
<rect class="message-label" x="288.5" y="327" width="421.5" height="31" rx="7" fill="#ffffff" opacity="0.96" stroke="#dbe3ee"/>
<text class="message" x="499.25" y="342.5" text-anchor="middle" dominant-baseline="middle">2. begin transaction</text>
<path class="call" d="M635 421 L1178 421"/>
<rect class="message-label" x="626.5" y="435" width="560" height="31" rx="7" fill="#ffffff" opacity="0.96" stroke="#dbe3ee"/>
<text class="message" x="906.5" y="450.5" text-anchor="middle" dominant-baseline="middle">3. START TRANSACTION</text>
<path class="return" d="M1178 529 L635 529"/>
<rect class="message-label" x="626.5" y="543" width="560" height="31" rx="7" fill="#ffffff" opacity="0.96" stroke="#dbe3ee"/>
<text class="message" x="906.5" y="558.5" text-anchor="middle" dominant-baseline="middle">4. OK</text>
<path class="return" d="M635 637 L363.5 637"/>
<rect class="message-label" x="288.5" y="651" width="421.5" height="31" rx="7" fill="#ffffff" opacity="0.96" stroke="#dbe3ee"/>
<text class="message" x="499.25" y="666.5" text-anchor="middle" dominant-baseline="middle">5. SqlConnection</text>
<path class="call" d="M363.5 745 L906.5 745"/>
<rect class="message-label" x="355" y="759" width="560" height="31" rx="7" fill="#ffffff" opacity="0.96" stroke="#dbe3ee"/>
<text class="message" x="635" y="774.5" text-anchor="middle" dominant-baseline="middle">6. conn.query(...).execute().coAwait()</text>
<path class="call" d="M906.5 853 L1178 853"/>
<rect class="message-label" x="831.5" y="867" width="421.5" height="31" rx="7" fill="#ffffff" opacity="0.96" stroke="#dbe3ee"/>
<text class="message" x="1042.25" y="882.5" text-anchor="middle" dominant-baseline="middle">7. SQL (within transaction)</text>
<path class="return" d="M1178 961 L906.5 961"/>
<rect class="message-label" x="831.5" y="975" width="421.5" height="31" rx="7" fill="#ffffff" opacity="0.96" stroke="#dbe3ee"/>
<text class="message" x="1042.25" y="990.5" text-anchor="middle" dominant-baseline="middle">8. RowSet</text>
<path class="return" d="M906.5 1069 L363.5 1069"/>
<rect class="message-label" x="355" y="1083" width="560" height="31" rx="7" fill="#ffffff" opacity="0.96" stroke="#dbe3ee"/>
<text class="message" x="635" y="1098.5" text-anchor="middle" dominant-baseline="middle">9. RowSet (suspended resume)</text>
<path class="call" d="M363.5 1177 L635 1177"/>
<rect class="message-label" x="288.5" y="1191" width="421.5" height="31" rx="7" fill="#ffffff" opacity="0.96" stroke="#dbe3ee"/>
<text class="message" x="499.25" y="1206.5" text-anchor="middle" dominant-baseline="middle">10. commit</text>
<path class="call" d="M635 1285 L1178 1285"/>
<rect class="message-label" x="626.5" y="1299" width="560" height="31" rx="7" fill="#ffffff" opacity="0.96" stroke="#dbe3ee"/>
<text class="message" x="906.5" y="1314.5" text-anchor="middle" dominant-baseline="middle">11. COMMIT</text>
<path class="return" d="M1178 1393 L92 1393"/>
<rect class="message-label" x="355" y="1407" width="560" height="31" rx="7" fill="#ffffff" opacity="0.96" stroke="#dbe3ee"/>
<text class="message" x="635" y="1422.5" text-anchor="middle" dominant-baseline="middle">12. success</text>
<path class="call" d="M363.5 1501 L635 1501"/>
<rect class="message-label" x="288.5" y="1515" width="421.5" height="31" rx="7" fill="#ffffff" opacity="0.96" stroke="#dbe3ee"/>
<text class="message" x="499.25" y="1530.5" text-anchor="middle" dominant-baseline="middle">13. rollback</text>
<path class="call" d="M635 1609 L1178 1609"/>
<rect class="message-label" x="626.5" y="1623" width="560" height="31" rx="7" fill="#ffffff" opacity="0.96" stroke="#dbe3ee"/>
<text class="message" x="906.5" y="1638.5" text-anchor="middle" dominant-baseline="middle">14. ROLLBACK</text>
<path class="return" d="M1178 1717 L92 1717"/>
<rect class="message-label" x="355" y="1731" width="560" height="31" rx="7" fill="#ffffff" opacity="0.96" stroke="#dbe3ee"/>
<text class="message" x="635" y="1746.5" text-anchor="middle" dominant-baseline="middle">15. exception re-thrown</text>
</svg>
