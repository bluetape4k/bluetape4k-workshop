<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="700" viewBox="0 0 1360 700" role="img" aria-label="Abstract Factory pattern diagram">
  <defs>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="124%"><feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#64748B" flood-opacity="0.16"/></filter>
    <marker id="arrowBlue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 12 6 L 0 12 Z" fill="#2563EB"/></marker>
    <marker id="arrowGreen" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 12 6 L 0 12 Z" fill="#16A34A"/></marker>
    <style>
      .canvas{fill:#F8FAFC}.frame{fill:#fff;stroke:#D6E0E8;stroke-width:1.4}.layer{fill:#F8FAFC;stroke:#CBD5E1;stroke-width:1.4}.title{font-family:"Architects Daughter";font-size:36px;fill:#102033}.subtitle{font-family:"Comic Mono";font-size:14px;fill:#51606F}.label{font-family:"Architects Daughter";font-size:22px;fill:#172033}.cardTitle{font-family:"Architects Daughter";font-size:25px;fill:#102033}.cardText{font-family:"Comic Mono";font-size:14px;fill:#415166}.line{fill:none;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round}
    </style>
  </defs>
  <rect class="canvas" width="1360" height="700"/>
  <rect class="frame" x="26" y="24" width="1308" height="652" rx="24"/>
  <text class="title" x="680" y="66" text-anchor="middle">Abstract Factory</text>
  <text class="subtitle" x="680" y="94" text-anchor="middle">FactoryMaker selects a kingdom factory; each factory creates a consistent Castle, King, and Army family.</text>

  <rect class="layer" x="70" y="130" width="1220" height="166" rx="18"/>
  <text class="label" x="98" y="164">Selection</text>
  <g filter="url(#shadow)"><rect x="118" y="196" width="260" height="70" rx="14" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.7"/><text class="cardTitle" x="248" y="226" text-anchor="middle">KingdomType</text><text class="cardText" x="248" y="252" text-anchor="middle">ELF or ORC enum</text></g>
  <g filter="url(#shadow)"><rect x="550" y="196" width="260" height="70" rx="14" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1.7"/><text class="cardTitle" x="680" y="226" text-anchor="middle">FactoryMaker</text><text class="cardText" x="680" y="252" text-anchor="middle">makeFactory(type)</text></g>
  <g filter="url(#shadow)"><rect x="982" y="196" width="260" height="70" rx="14" fill="#ECFDF5" stroke="#16A34A" stroke-width="1.7"/><text class="cardTitle" x="1112" y="226" text-anchor="middle">KingdomFactory</text><text class="cardText" x="1112" y="252" text-anchor="middle">createCastle/King/Army</text></g>

  <rect class="layer" x="70" y="342" width="1220" height="236" rx="18"/>
  <text class="label" x="98" y="376">Concrete families</text>
  <g filter="url(#shadow)"><rect x="124" y="424" width="320" height="92" rx="14" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.7"/><text class="cardTitle" x="284" y="458" text-anchor="middle">ElfKingdomFactory</text><text class="cardText" x="284" y="486" text-anchor="middle">ElfCastle, ElfKing, ElfArmy</text></g>
  <g filter="url(#shadow)"><rect x="520" y="424" width="320" height="92" rx="14" fill="#ECFDF5" stroke="#16A34A" stroke-width="1.7"/><text class="cardTitle" x="680" y="458" text-anchor="middle">Product interfaces</text><text class="cardText" x="680" y="486" text-anchor="middle">Castle, King, Army</text></g>
  <g filter="url(#shadow)"><rect x="916" y="424" width="320" height="92" rx="14" fill="#FFF7ED" stroke="#D97706" stroke-width="1.7"/><text class="cardTitle" x="1076" y="458" text-anchor="middle">OrcKingdomFactory</text><text class="cardText" x="1076" y="486" text-anchor="middle">OrcCastle, OrcKing, OrcArmy</text></g>

  <path class="line" d="M 378 231 L 550 231" stroke="#2563EB" marker-end="url(#arrowBlue)"/>
  <path class="line" d="M 810 231 L 982 231" stroke="#16A34A" marker-end="url(#arrowGreen)"/>
  <path class="line" d="M 1090 266 L 1090 326 L 284 326 L 284 424" stroke="#2563EB" marker-end="url(#arrowBlue)"/>
  <path class="line" d="M 1134 266 L 1134 326 L 1076 326 L 1076 424" stroke="#16A34A" marker-end="url(#arrowGreen)"/>
  <path class="line" d="M 444 470 L 520 470" stroke="#2563EB" marker-end="url(#arrowBlue)"/>
  <path class="line" d="M 916 470 L 840 470" stroke="#16A34A" marker-end="url(#arrowGreen)"/>
</svg>
