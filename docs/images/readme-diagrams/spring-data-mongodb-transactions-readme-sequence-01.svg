<svg xmlns="http://www.w3.org/2000/svg" width="1660" height="2019" viewBox="0 0 1660 2019" role="img" aria-label="mongo-transactions demo Diagram 1">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#1f2937" flood-opacity="0.10"/></filter>
  <marker id="arrowBlue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M1 1 L7 4 L1 7 Z" fill="#5b8def"/></marker>
  <marker id="arrowTeal" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M1 1 L7 4 L1 7 Z" fill="#45a7a1"/></marker>
  <style>
    .canvas{fill:#f7f9fc}
    .frame{fill:#ffffff;stroke:#d8e0ea;stroke-width:1.5}
    .title{font-family:"Architects Daughter";font-size:34px;fill:#102033}
    .subtitle{font-family:"Comic Mono";font-size:13px;fill:#536273}
    .actor{font-family:"Architects Daughter";font-size:17px;fill:#102033}
    .message{font-family:"Comic Mono";font-size:12px;fill:#263445;paint-order:stroke;stroke:#ffffff;stroke-width:4px;stroke-linejoin:round}
    .detail{font-family:"Comic Mono";font-size:11px;fill:#536273}
    .lifeline{stroke:#b8c4d3;stroke-width:1.4;stroke-dasharray:7 6}
    .call{stroke:#5b8def;stroke-width:2.15;fill:none;marker-end:url(#arrowBlue)}
    .return{stroke:#45a7a1;stroke-width:2.05;stroke-dasharray:7 5;fill:none;marker-end:url(#arrowTeal)}
    .box{stroke-width:1.8;filter:url(#shadow)}
  </style>
</defs>
<rect class="canvas" width="1660" height="2019"/>
<rect class="frame" x="24" y="20" width="1612" height="1979" rx="18"/>
<text class="title" x="48" y="58">mongo-transactions demo Diagram 1</text>
<text class="subtitle" x="50" y="84">sequenceDiagram rendered from the current README model; labels are separated from connector lanes</text>
<rect class="box" x="40" y="108" width="220" height="58" rx="10" fill="#e8f3ff" stroke="#7aa0c4"/>
<text class="actor" x="150" y="137" text-anchor="middle" dominant-baseline="middle">Test</text>
<line class="lifeline" x1="150" y1="166" x2="150" y2="1961"/>
<rect class="box" x="312" y="108" width="220" height="58" rx="10" fill="#eaf7ef" stroke="#7aa0c4"/>
<text class="actor" x="422" y="130" text-anchor="middle" dominant-baseline="middle">Coroutine Managed</text>
<text class="actor" x="422" y="144" text-anchor="middle" dominant-baseline="middle">Transition Service</text>
<line class="lifeline" x1="422" y1="166" x2="422" y2="1961"/>
<rect class="box" x="584" y="108" width="220" height="58" rx="10" fill="#fff3d9" stroke="#7aa0c4"/>
<text class="actor" x="694" y="130" text-anchor="middle" dominant-baseline="middle">Coroutine Process</text>
<text class="actor" x="694" y="144" text-anchor="middle" dominant-baseline="middle">Repository</text>
<line class="lifeline" x1="694" y1="166" x2="694" y2="1961"/>
<rect class="box" x="856" y="108" width="220" height="58" rx="10" fill="#f1ecff" stroke="#7aa0c4"/>
<text class="actor" x="966" y="130" text-anchor="middle" dominant-baseline="middle">Reactive Mongo</text>
<text class="actor" x="966" y="144" text-anchor="middle" dominant-baseline="middle">Operations</text>
<line class="lifeline" x1="966" y1="166" x2="966" y2="1961"/>
<rect class="box" x="1128" y="108" width="220" height="58" rx="10" fill="#fdecef" stroke="#7aa0c4"/>
<text class="actor" x="1238" y="130" text-anchor="middle" dominant-baseline="middle">Reactive Mongo</text>
<text class="actor" x="1238" y="144" text-anchor="middle" dominant-baseline="middle">Transaction Manager</text>
<line class="lifeline" x1="1238" y1="166" x2="1238" y2="1961"/>
<rect class="box" x="1400" y="108" width="220" height="58" rx="10" fill="#e9f7f6" stroke="#7aa0c4"/>
<text class="actor" x="1510" y="123" text-anchor="middle" dominant-baseline="middle">Mongo DB</text>
<text class="actor" x="1510" y="137" text-anchor="middle" dominant-baseline="middle">(Testcontainers</text>
<text class="actor" x="1510" y="151" text-anchor="middle" dominant-baseline="middle">Replica Set)</text>
<line class="lifeline" x1="1510" y1="166" x2="1510" y2="1961"/>
<path class="call" d="M150 205 L422 205"/>
<rect class="message-label" x="75" y="219" width="422" height="31" rx="7" fill="#ffffff" opacity="0.96" stroke="#dbe3ee"/>
<text class="message" x="286" y="234.5" text-anchor="middle" dominant-baseline="middle">1. run(id) - @Transactional suspend</text>
<path class="call" d="M422 313 L1238 313"/>
<rect class="message-label" x="550" y="327" width="560" height="31" rx="7" fill="#ffffff" opacity="0.96" stroke="#dbe3ee"/>
<text class="message" x="830" y="342.5" text-anchor="middle" dominant-baseline="middle">2. begin transaction (ClientSession)</text>
<path class="return" d="M1238 421 L422 421"/>
<rect class="message-label" x="550" y="435" width="560" height="31" rx="7" fill="#ffffff" opacity="0.96" stroke="#dbe3ee"/>
<text class="message" x="830" y="450.5" text-anchor="middle" dominant-baseline="middle">3. Reactor Context (session bound)</text>
<path class="call" d="M422 529 L694 529"/>
<rect class="message-label" x="347" y="543" width="422" height="31" rx="7" fill="#ffffff" opacity="0.96" stroke="#dbe3ee"/>
<text class="message" x="558" y="558.5" text-anchor="middle" dominant-baseline="middle">4. findById(id) - suspend</text>
<path class="call" d="M694 637 L1510 637"/>
<rect class="message-label" x="822" y="651" width="560" height="31" rx="7" fill="#ffffff" opacity="0.96" stroke="#dbe3ee"/>
<text class="message" x="1102" y="666.5" text-anchor="middle" dominant-baseline="middle">5. query (within session)</text>
<path class="return" d="M1510 745 L694 745"/>
<rect class="message-label" x="822" y="759" width="560" height="31" rx="7" fill="#ffffff" opacity="0.96" stroke="#dbe3ee"/>
<text class="message" x="1102" y="774.5" text-anchor="middle" dominant-baseline="middle">6. Process document</text>
<path class="return" d="M694 853 L422 853"/>
<rect class="message-label" x="347" y="867" width="422" height="31" rx="7" fill="#ffffff" opacity="0.96" stroke="#dbe3ee"/>
<text class="message" x="558" y="882.5" text-anchor="middle" dominant-baseline="middle">7. Process</text>
<path class="call" d="M422 961 L966 961"/>
<rect class="message-label" x="414" y="975" width="560" height="31" rx="7" fill="#ffffff" opacity="0.96" stroke="#dbe3ee"/>
<text class="message" x="694" y="990.5" text-anchor="middle" dominant-baseline="middle">8. update state -&gt; ACTIVE</text>
<path class="call" d="M966 1069 L1510 1069"/>
<rect class="message-label" x="958" y="1083" width="560" height="31" rx="7" fill="#ffffff" opacity="0.96" stroke="#dbe3ee"/>
<text class="message" x="1238" y="1098.5" text-anchor="middle" dominant-baseline="middle">9. update (within session)</text>
<path class="call" d="M422 1177 L966 1177"/>
<rect class="message-label" x="414" y="1191" width="560" height="31" rx="7" fill="#ffffff" opacity="0.96" stroke="#dbe3ee"/>
<text class="message" x="694" y="1206.5" text-anchor="middle" dominant-baseline="middle">10. update state -&gt; DONE</text>
<path class="call" d="M966 1285 L1510 1285"/>
<rect class="message-label" x="958" y="1299" width="560" height="31" rx="7" fill="#ffffff" opacity="0.96" stroke="#dbe3ee"/>
<text class="message" x="1238" y="1314.5" text-anchor="middle" dominant-baseline="middle">11. update (within session)</text>
<path class="call" d="M422 1393 L1238 1393"/>
<rect class="message-label" x="550" y="1407" width="560" height="31" rx="7" fill="#ffffff" opacity="0.96" stroke="#dbe3ee"/>
<text class="message" x="830" y="1422.5" text-anchor="middle" dominant-baseline="middle">12. commit</text>
<path class="return" d="M1238 1501 L150 1501"/>
<rect class="message-label" x="414" y="1515" width="560" height="31" rx="7" fill="#ffffff" opacity="0.96" stroke="#dbe3ee"/>
<text class="message" x="694" y="1530.5" text-anchor="middle" dominant-baseline="middle">13. State.DONE</text>
<path class="call" d="M422 1609 L1238 1609"/>
<rect class="message-label" x="550" y="1623" width="560" height="31" rx="7" fill="#ffffff" opacity="0.96" stroke="#dbe3ee"/>
<text class="message" x="830" y="1638.5" text-anchor="middle" dominant-baseline="middle">14. rollback (IllegalStateException)</text>
<path class="call" d="M1238 1717 L1510 1717"/>
<rect class="message-label" x="1163" y="1731" width="422" height="31" rx="7" fill="#ffffff" opacity="0.96" stroke="#dbe3ee"/>
<text class="message" x="1374" y="1746.5" text-anchor="middle" dominant-baseline="middle">15. rollback -&gt; State remains CREATED</text>
<path class="return" d="M1238 1825 L150 1825"/>
<rect class="message-label" x="414" y="1839" width="560" height="31" rx="7" fill="#ffffff" opacity="0.96" stroke="#dbe3ee"/>
<text class="message" x="694" y="1854.5" text-anchor="middle" dominant-baseline="middle">16. IllegalStateException</text>
</svg>
