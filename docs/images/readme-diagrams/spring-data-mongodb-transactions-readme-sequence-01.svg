  <rect x="1226.0" y="784" width="254.0" height="34" rx="17" class="label returnLabel"/><circle cx="1250.0" cy="801" r="13" class="badge returnBadge"/><text x="1250.0" y="806" text-anchor="middle" class="badgeText returnText">8</text><text x="1274.0" y="806" class="msg returnText">stored state = CREATED</text>
