<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="2334" height="952" viewBox="0 0 2334 952" role="img" aria-labelledby="title desc">
  <title id="title">Process transaction state sequence</title>
  <desc id="desc">start and finish update the document; verify decides whether the transaction commits or rolls back.</desc>
  <defs>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="124%"><feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#64748B" flood-opacity="0.14"/></filter>
    <style>.title{font-family:"Architects Daughter";font-size:40px;fill:#263238}.subtitle,.msg,.footer{font-family:"Comic Mono";fill:#36464F}.subtitle{font-size:17px}.participant{font-family:"Architects Daughter";font-size:19px;fill:#1F3138}.role{font-family:"Comic Mono";font-size:12px;fill:#546A73}.msg{font-size:13px}.footer{font-size:14px;fill:#60727D}.frame{fill:#FBFCF8;stroke:#41545D;stroke-width:3}.header{fill:#FFFFFF;stroke:#546E7A;stroke-width:2}.lifeline{stroke:#9AAAB1;stroke-width:2;stroke-dasharray:7 8;stroke-linecap:round}.activation{fill:#E6F2EC;stroke:#5B7E67;stroke-width:1.5}.call,.work,.return{fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.call{stroke:#3F7D9C;marker-end:url(#arrow-call)}.work{stroke:#6E8F4F;marker-end:url(#arrow-work)}.return{stroke:#9B7D54;stroke-width:2.6;stroke-dasharray:8 6;marker-end:url(#arrow-ret)}.label{fill:#FFFFFF;stroke:#D7E0E4;stroke-width:1.5}.callLabel{stroke:#9CC2D1}.workLabel{stroke:#B6C9A4}.returnLabel{stroke:#C8B38F}.badge{stroke-width:1.8}.callBadge{fill:#EAF4F8;stroke:#3F7D9C}.workBadge{fill:#EEF7F0;stroke:#6E8F4F}.returnBadge{fill:#FFF7E8;stroke:#9B7D54}.badgeText{font-family:"Comic Mono";font-size:12px;font-weight:700}.callText,.badgeText.callText{fill:#2F6F8E}.workText,.badgeText.workText{fill:#55783F}.returnText,.badgeText.returnText{fill:#7F6038}</style>
    <marker id="arrow-call" viewBox="0 0 11.4286 11.4286" markerWidth="16" markerHeight="16" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse" data-role="sequence" data-tip-direction="positive-x"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#3F7D9C" stroke-dasharray="none" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="arrow-work" viewBox="0 0 11.4286 11.4286" markerWidth="16" markerHeight="16" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse" data-role="sequence" data-tip-direction="positive-x"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#6E8F4F" stroke-dasharray="none" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="arrow-ret" viewBox="0 0 11.4286 11.4286" markerWidth="16" markerHeight="16" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse" data-role="sequence" data-tip-direction="positive-x"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#9B7D54" stroke-dasharray="none" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>
  <rect x="24" y="24" width="2286" height="904" rx="20" class="frame"/>
  <text id="titleText" x="1167.0" y="76" text-anchor="middle" class="title">Process transaction state sequence</text>
  <text x="1167.0" y="106" text-anchor="middle" class="subtitle">start and finish update the document; verify decides whether the transaction commits or rolls back.</text>
  <g filter="url(#shadow)"><rect x="90.0" y="156" width="294" height="76" rx="10" class="header"/><text x="237.0" y="186" text-anchor="middle" class="participant">newProcess()</text><text x="237.0" y="211" text-anchor="middle" class="role">state = CREATED</text></g>
  <line x1="237.0" y1="232" x2="237.0" y2="864" class="lifeline"/>
  <g filter="url(#shadow)"><rect x="462.0" y="156" width="294" height="76" rx="10" class="header"/><text x="609.0" y="186" text-anchor="middle" class="participant">start()</text><text x="609.0" y="211" text-anchor="middle" class="role">ACTIVE, count +1</text></g>
  <line x1="609.0" y1="232" x2="609.0" y2="864" class="lifeline"/>
  <g filter="url(#shadow)"><rect x="834.0" y="156" width="294" height="76" rx="10" class="header"/><text x="981.0" y="186" text-anchor="middle" class="participant">Transaction boundary</text><text x="981.0" y="211" text-anchor="middle" class="role">MongoTransactionManager or Reacti…</text></g>
  <line x1="981.0" y1="232" x2="981.0" y2="864" class="lifeline"/>
  <g filter="url(#shadow)"><rect x="1206.0" y="156" width="294" height="76" rx="10" class="header"/><text x="1353.0" y="186" text-anchor="middle" class="participant">verify()</text><text x="1353.0" y="211" text-anchor="middle" class="role">id % 3 check</text></g>
  <line x1="1353.0" y1="232" x2="1353.0" y2="864" class="lifeline"/>
  <g filter="url(#shadow)"><rect x="1578.0" y="156" width="294" height="76" rx="10" class="header"/><text x="1725.0" y="186" text-anchor="middle" class="participant">finish()</text><text x="1725.0" y="211" text-anchor="middle" class="role">DONE, count +1</text></g>
  <line x1="1725.0" y1="232" x2="1725.0" y2="864" class="lifeline"/>
  <g filter="url(#shadow)"><rect x="1950.0" y="156" width="294" height="76" rx="10" class="header"/><text x="2097.0" y="186" text-anchor="middle" class="participant">rollback</text><text x="2097.0" y="211" text-anchor="middle" class="role">stored state = CREATED</text></g>
  <line x1="2097.0" y1="232" x2="2097.0" y2="864" class="lifeline"/>
