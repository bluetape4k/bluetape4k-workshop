  <path d="M 1353.0 450 L 1725.0 450" class="work" stroke-linecap="round" stroke-linejoin="round"/><rect x="1718.0" y="442" width="14" height="48" rx="4" class="activation"/>
  <rect x="1615.0" y="480" width="220.0" height="34" rx="17" class="label callLabel"/><circle cx="1639.0" cy="497" r="13" class="badge callBadge"/><text x="1639.0" y="502" text-anchor="middle" class="badgeText callText">4</text><text x="1663.0" y="502" class="msg callText">id % 3 == 0 fails</text>
  <path d="M 1353.0 526 L 2097.0 526" class="call" stroke-linecap="round" stroke-linejoin="round"/><rect x="2090.0" y="518" width="14" height="48" rx="4" class="activation"/>
  <rect x="482.0" y="556" width="254.0" height="34" rx="17" class="label callLabel"/><circle cx="506.0" cy="573" r="13" class="badge callBadge"/><text x="506.0" y="578" text-anchor="middle" class="badgeText callText">5</text><text x="530.0" y="578" class="msg callText">stored state = CREATED</text>
