<svg xmlns="http://www.w3.org/2000/svg" width="1480" height="1848" viewBox="0 0 1480 1848" role="img" aria-label="mongo-transactions demo Diagram 1">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#1f2937" flood-opacity="0.10"/></filter>
  <marker id="arrowBlue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M1 1 L7 4 L1 7 Z" fill="#5b8def"/></marker>
  <marker id="arrowTeal" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M1 1 L7 4 L1 7 Z" fill="#45a7a1"/></marker>
  <style>
    .canvas{fill:#f7f9fc}
    .frame{fill:#ffffff;stroke:#d8e0ea;stroke-width:1.5}
    .title{font-family:"Architects Daughter";font-size:34px;fill:#102033}
    .subtitle{font-family:"Comic Mono";font-size:13px;fill:#536273}
    .actor{font-family:"Architects Daughter";font-size:17px;fill:#102033}
    .detail{font-family:"Comic Mono";font-size:11px;fill:#536273}
    .message{font-family:"Comic Mono";font-size:12px;fill:#263445;paint-order:stroke;stroke:#ffffff;stroke-width:4px;stroke-linejoin:round}
    .branch{font-family:"Architects Daughter";font-size:15px;fill:#1f3b57}
    .lifeline{stroke:#b8c4d3;stroke-width:1.4;stroke-dasharray:7 6}
    .call{stroke:#5b8def;stroke-width:2.1;fill:none;marker-end:url(#arrowBlue)}
    .return{stroke:#45a7a1;stroke-width:2;stroke-dasharray:7 5;fill:none;marker-end:url(#arrowTeal)}
    .box{stroke-width:1.8;filter:url(#shadow)}
  </style>
</defs>
<rect class="canvas" width="1480" height="1848"/>
<rect class="frame" x="24" y="20" width="1432" height="1808" rx="18"/>
<text class="title" x="48" y="58">mongo-transactions demo Diagram 1</text>
<text class="subtitle" x="50" y="84">sequenceDiagram rendered from the current README model; labels are separated from connector lanes</text>
<rect class="box" x="30" y="116" width="184" height="58" rx="10" fill="#e8f3ff" stroke="#7aa0c4"/>
<text class="actor" x="122" y="145" text-anchor="middle" dominant-baseline="middle">Test</text>
<line class="lifeline" x1="122" y1="174" x2="122" y2="1790"/>
<rect class="box" x="277.2" y="116" width="184" height="58" rx="10" fill="#eaf7ef" stroke="#7aa0c4"/>
<text class="actor" x="369.2" y="138" text-anchor="middle" dominant-baseline="middle">Coroutine Managed</text>
<text class="actor" x="369.2" y="152" text-anchor="middle" dominant-baseline="middle">Transition Service</text>
<line class="lifeline" x1="369.2" y1="174" x2="369.2" y2="1790"/>
<rect class="box" x="524.4" y="116" width="184" height="58" rx="10" fill="#fff3d9" stroke="#7aa0c4"/>
<text class="actor" x="616.4" y="138" text-anchor="middle" dominant-baseline="middle">Coroutine Process</text>
<text class="actor" x="616.4" y="152" text-anchor="middle" dominant-baseline="middle">Repository</text>
<line class="lifeline" x1="616.4" y1="174" x2="616.4" y2="1790"/>
<rect class="box" x="771.5999999999999" y="116" width="184" height="58" rx="10" fill="#f1ecff" stroke="#7aa0c4"/>
<text class="actor" x="863.5999999999999" y="138" text-anchor="middle" dominant-baseline="middle">Reactive Mongo</text>
<text class="actor" x="863.5999999999999" y="152" text-anchor="middle" dominant-baseline="middle">Operations</text>
<line class="lifeline" x1="863.5999999999999" y1="174" x2="863.5999999999999" y2="1790"/>
<rect class="box" x="1018.8" y="116" width="184" height="58" rx="10" fill="#fdecef" stroke="#7aa0c4"/>
<text class="actor" x="1110.8" y="131" text-anchor="middle" dominant-baseline="middle">Reactive Mongo</text>
<text class="actor" x="1110.8" y="145" text-anchor="middle" dominant-baseline="middle">Transaction</text>
<text class="actor" x="1110.8" y="159" text-anchor="middle" dominant-baseline="middle">Manager</text>
<line class="lifeline" x1="1110.8" y1="174" x2="1110.8" y2="1790"/>
<rect class="box" x="1266" y="116" width="184" height="58" rx="10" fill="#e9f7f6" stroke="#7aa0c4"/>
<text class="actor" x="1358" y="131" text-anchor="middle" dominant-baseline="middle">Mongo DB</text>
<text class="actor" x="1358" y="145" text-anchor="middle" dominant-baseline="middle">(Testcontainers</text>
<text class="actor" x="1358" y="159" text-anchor="middle" dominant-baseline="middle">Replica Set)</text>
<line class="lifeline" x1="1358" y1="174" x2="1358" y2="1790"/>
<rect x="78" y="176" width="335.2" height="26" rx="6" fill="#ffffff" opacity="0.95" stroke="#dbe3ee"/>
<text class="message" x="245.6" y="189" text-anchor="middle" dominant-baseline="middle">1. run(id) - @Transactional suspend</text>
<path class="call" d="M122 218 L369.2 218"/>
<rect x="530" y="258" width="420" height="26" rx="6" fill="#ffffff" opacity="0.95" stroke="#dbe3ee"/>
<text class="message" x="740" y="271" text-anchor="middle" dominant-baseline="middle">2. begin transaction (ClientSession)</text>
<path class="call" d="M369.2 300 L1110.8 300"/>
<rect x="530" y="340" width="420" height="26" rx="6" fill="#ffffff" opacity="0.95" stroke="#dbe3ee"/>
<text class="message" x="740" y="353" text-anchor="middle" dominant-baseline="middle">3. Reactor Context (session bound)</text>
<path class="return" d="M1110.8 382 L369.2 382"/>
<rect x="325.19999999999993" y="422" width="335.2" height="26" rx="6" fill="#ffffff" opacity="0.95" stroke="#dbe3ee"/>
<text class="message" x="492.79999999999995" y="435" text-anchor="middle" dominant-baseline="middle">4. findById(id) - suspend</text>
<path class="call" d="M369.2 464 L616.4 464"/>
<rect x="777.2" y="504" width="420" height="26" rx="6" fill="#ffffff" opacity="0.95" stroke="#dbe3ee"/>
<text class="message" x="987.2" y="517" text-anchor="middle" dominant-baseline="middle">5. query (within session)</text>
<path class="call" d="M616.4 546 L1358 546"/>
<rect x="777.2" y="586" width="420" height="26" rx="6" fill="#ffffff" opacity="0.95" stroke="#dbe3ee"/>
<text class="message" x="987.2" y="599" text-anchor="middle" dominant-baseline="middle">6. Process document</text>
<path class="return" d="M1358 628 L616.4 628"/>
<rect x="325.19999999999993" y="668" width="335.2" height="26" rx="6" fill="#ffffff" opacity="0.95" stroke="#dbe3ee"/>
<text class="message" x="492.79999999999995" y="681" text-anchor="middle" dominant-baseline="middle">7. Process</text>
<path class="return" d="M616.4 710 L369.2 710"/>
<rect x="406.4" y="750" width="420" height="26" rx="6" fill="#ffffff" opacity="0.95" stroke="#dbe3ee"/>
<text class="message" x="616.4" y="763" text-anchor="middle" dominant-baseline="middle">8. update state -&gt; ACTIVE</text>
<path class="call" d="M369.2 792 L863.5999999999999 792"/>
<rect x="900.8" y="832" width="420" height="26" rx="6" fill="#ffffff" opacity="0.95" stroke="#dbe3ee"/>
<text class="message" x="1110.8" y="845" text-anchor="middle" dominant-baseline="middle">9. update (within session)</text>
<path class="call" d="M863.5999999999999 874 L1358 874"/>
<rect x="50" y="938" width="1380" height="34" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-dasharray="6 4"/>
<text class="branch" x="68" y="957" dominant-baseline="middle">alt: verify() success (id % 3 != 0)</text>
<rect x="406.4" y="996" width="420" height="26" rx="6" fill="#ffffff" opacity="0.95" stroke="#dbe3ee"/>
<text class="message" x="616.4" y="1009" text-anchor="middle" dominant-baseline="middle">11. update state -&gt; DONE</text>
<path class="call" d="M369.2 1038 L863.5999999999999 1038"/>
<rect x="900.8" y="1078" width="420" height="26" rx="6" fill="#ffffff" opacity="0.95" stroke="#dbe3ee"/>
<text class="message" x="1110.8" y="1091" text-anchor="middle" dominant-baseline="middle">12. update (within session)</text>
<path class="call" d="M863.5999999999999 1120 L1358 1120"/>
<rect x="530" y="1160" width="420" height="26" rx="6" fill="#ffffff" opacity="0.95" stroke="#dbe3ee"/>
<text class="message" x="740" y="1173" text-anchor="middle" dominant-baseline="middle">13. commit</text>
<path class="call" d="M369.2 1202 L1110.8 1202"/>
<rect x="406.4" y="1242" width="420" height="26" rx="6" fill="#ffffff" opacity="0.95" stroke="#dbe3ee"/>
<text class="message" x="616.4" y="1255" text-anchor="middle" dominant-baseline="middle">14. State.DONE</text>
<path class="return" d="M1110.8 1284 L122 1284"/>
<rect x="50" y="1348" width="1380" height="34" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-dasharray="6 4"/>
<text class="branch" x="68" y="1367" dominant-baseline="middle">else: verify() failure (id % 3 == 0)</text>
<rect x="530" y="1406" width="420" height="26" rx="6" fill="#ffffff" opacity="0.95" stroke="#dbe3ee"/>
<text class="message" x="740" y="1419" text-anchor="middle" dominant-baseline="middle">16. rollback (IllegalStateException)</text>
<path class="call" d="M369.2 1448 L1110.8 1448"/>
<rect x="1066.8000000000002" y="1488" width="335.20000000000005" height="26" rx="6" fill="#ffffff" opacity="0.95" stroke="#dbe3ee"/>
<text class="message" x="1234.4" y="1501" text-anchor="middle" dominant-baseline="middle">17. rollback -&gt; State remains CREATED</text>
<path class="call" d="M1110.8 1530 L1358 1530"/>
<rect x="406.4" y="1570" width="420" height="26" rx="6" fill="#ffffff" opacity="0.95" stroke="#dbe3ee"/>
<text class="message" x="616.4" y="1583" text-anchor="middle" dominant-baseline="middle">18. IllegalStateException</text>
<path class="return" d="M1110.8 1612 L122 1612"/>
<line x1="52" y1="1694" x2="1428" y2="1694" stroke="#d8e0ea" stroke-width="1.2" stroke-dasharray="5 5"/>
</svg>
