<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" role="img" aria-label="Elasticsearch Architecture">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#1f2937" flood-opacity="0.10"/></filter>
  <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M1,1 L8,4.5 L1,8 Z" fill="#758297"/></marker>
  <style>
    .canvas{fill:#f7f9fc}.frame{fill:#fff;stroke:#d8e0ea;stroke-width:1.5}
    .title{font-family:"Architects Daughter";font-size:38px;font-weight:400;fill:#102033}
    .subtitle{font-family:"Comic Mono";font-size:14px;font-weight:400;fill:#536273}
    .smallLabel{font-family:"Architects Daughter";font-size:21px;font-weight:400;fill:#102033}
    .small{font-family:"Comic Mono";font-size:12px;font-weight:400;fill:#536273}
    .card{stroke-width:2.1;filter:url(#shadow)}
    .line{stroke:#758297;stroke-width:2.1;fill:none;marker-end:url(#arrow)}
  </style>
</defs>
<rect class="canvas" width="960" height="440"/>
<rect class="frame" x="24" y="20" width="912" height="396" rx="16"/>
<text class="title" x="48" y="66">Elasticsearch Architecture</text>
<text class="subtitle" x="48" y="90">ElasticsearchOperations · ConferenceRepository · ReactiveConferenceRepository → ES Testcontainers</text>

<!-- Row 1: Repositories -->
<rect class="card" x="50" y="116" width="240" height="60" rx="8" fill="#E8F3FF" stroke="#5B8DEF"/>
<text class="smallLabel" x="170" y="144" text-anchor="middle">ConferenceRepository</text>
<text class="small" x="170" y="163" text-anchor="middle">ElasticsearchRepository</text>

<rect class="card" x="360" y="116" width="240" height="60" rx="8" fill="#EAF7EF" stroke="#58A978"/>
<text class="smallLabel" x="480" y="144" text-anchor="middle">ReactiveConferenceRepo</text>
<text class="small" x="480" y="163" text-anchor="middle">ReactiveElasticsearchRepo</text>

<rect class="card" x="670" y="116" width="240" height="60" rx="8" fill="#FFF3D9" stroke="#D6A441"/>
<text class="smallLabel" x="790" y="144" text-anchor="middle">ElasticOps</text>
<text class="small" x="790" y="163" text-anchor="middle">ElasticsearchOperations (blocking)</text>

<!-- Row 2: Config + Reactive Ops -->
<rect class="card" x="130" y="240" width="250" height="60" rx="8" fill="#FDECEF" stroke="#DC6B82"/>
<text class="smallLabel" x="255" y="268" text-anchor="middle">ElasticsearchClientConfig</text>
<text class="small" x="255" y="287" text-anchor="middle">ElasticsearchClient factory</text>

<rect class="card" x="580" y="240" width="250" height="60" rx="8" fill="#F1ECFF" stroke="#8A72D6"/>
<text class="smallLabel" x="705" y="268" text-anchor="middle">ReactiveElasticOps</text>
<text class="small" x="705" y="287" text-anchor="middle">ReactiveElasticsearchOperations</text>

<!-- Row 3: Infrastructure -->
<rect class="card" x="240" y="352" width="480" height="52" rx="8" fill="#E9F7F6" stroke="#45A7A1"/>
<text class="smallLabel" x="480" y="380" text-anchor="middle">Elasticsearch (Testcontainers)</text>
<text class="small" x="480" y="396" text-anchor="middle">Single node cluster for integration testing</text>

<!-- Arrows -->
<path class="line" d="M170 176 L170 222 L230 222 L230 240"/>
<path class="line" d="M480 176 L480 222 L700 222 L700 240"/>
<path class="line" d="M790 176 L790 222 L730 222 L730 240"/>
<!-- Config + ReactiveOps -> ES -->
<path class="line" d="M255 300 L255 334 L380 334 L380 352"/>
<path class="line" d="M705 300 L705 334 L580 334 L580 352"/>
</svg>
