<svg xmlns="http://www.w3.org/2000/svg" width="960" height="580" viewBox="0 0 960 580" role="img" aria-label="Chaos Engineering Architecture">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#1f2937" flood-opacity="0.10"/></filter>
  <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth">
    <path d="M1,1 L8,4.5 L1,8 Z" fill="#758297"/>
  </marker>
  <marker id="arrow-red" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth">
    <path d="M1,1 L8,4.5 L1,8 Z" fill="#DC6B82"/>
  </marker>
  <style>
    .canvas{fill:#f7f9fc}.frame{fill:#fff;stroke:#d8e0ea;stroke-width:1.5}
    .title{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:38px;font-weight:400;fill:#102033}
    .subtitle{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:14px;font-weight:400;fill:#536273}
    .smallLabel{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:21px;font-weight:400;fill:#102033}
    .mono{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#102033}
    .small{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#536273}
    .card{stroke-width:2.1;filter:url(#shadow)}
    .line{stroke:#758297;stroke-width:2.1;fill:none;marker-end:url(#arrow)}
    .inject{stroke:#DC6B82;stroke-width:2.1;stroke-dasharray:7 5;fill:none;marker-end:url(#arrow-red)}
  </style>
</defs>
<rect class="canvas" width="960" height="580"/>
<rect class="frame" x="24" y="20" width="912" height="540" rx="22"/>

<!-- Title -->
<text class="title" x="48" y="68">Chaos Engineering Architecture</text>
<text class="subtitle" x="52" y="92">Spring Chaos Monkey · fault injection at any layer · /actuator/chaosmonkey</text>

<!-- ====== LEFT PANEL: Application Stack (attack targets) ====== -->
<!-- Panel label -->
<text class="small" x="270" y="116" text-anchor="middle" letter-spacing="0.06em" font-size="11" fill="#758297">APPLICATION STACK  (attack targets)</text>

<!-- HTTP Request label -->
<text class="small" x="270" y="136" text-anchor="middle" fill="#5B8DEF">▼ HTTP Request</text>

<!-- StudentController -->
<g transform="translate(60,144)">
  <rect class="card" x="0" y="0" width="420" height="80" rx="14" fill="#E8F3FF" stroke="#5B8DEF"/>
  <text class="smallLabel" x="210" y="30" text-anchor="middle">StudentController</text>
  <text class="small" x="210" y="52" text-anchor="middle">@RestController · GET /students, POST /students</text>
  <rect x="120" y="60" width="180" height="16" rx="8" fill="#5B8DEF"/>
  <text class="mono" x="210" y="73" text-anchor="middle" fill="#fff">@Watcher(CONTROLLER)</text>
</g>

<!-- Arrow down -->
<path class="line" d="M270,224 L270,252"/>

<!-- StudentService -->
<g transform="translate(60,252)">
  <rect class="card" x="0" y="0" width="420" height="80" rx="14" fill="#EAF7EF" stroke="#58A978"/>
  <text class="smallLabel" x="210" y="30" text-anchor="middle">StudentService</text>
  <text class="small" x="210" y="52" text-anchor="middle">@Service · business logic</text>
  <rect x="130" y="60" width="160" height="16" rx="8" fill="#58A978"/>
  <text class="mono" x="210" y="73" text-anchor="middle" fill="#fff">@Watcher(SERVICE)</text>
</g>

<!-- Arrow down -->
<path class="line" d="M270,332 L270,360"/>

<!-- StudentJdbcRepository -->
<g transform="translate(60,360)">
  <rect class="card" x="0" y="0" width="420" height="80" rx="14" fill="#FFF3D9" stroke="#D6A441"/>
  <text class="smallLabel" x="210" y="30" text-anchor="middle">StudentJdbcRepository</text>
  <text class="small" x="210" y="52" text-anchor="middle">@Repository · JDBC operations</text>
  <rect x="120" y="60" width="180" height="16" rx="8" fill="#D6A441"/>
  <text class="mono" x="210" y="73" text-anchor="middle" fill="#fff">@Watcher(REPOSITORY)</text>
</g>

<!-- Arrow down to DB -->
<path class="line" d="M270,440 L270,468"/>

<!-- H2 Database -->
<g transform="translate(130,468)">
  <rect class="card" x="0" y="0" width="280" height="52" rx="12" fill="#F1ECFF" stroke="#8A72D6"/>
  <text class="smallLabel" x="140" y="32" text-anchor="middle">H2 Database</text>
</g>

<!-- ====== RIGHT PANEL: Chaos Monkey (fault injector) ====== -->
<!-- Panel label -->
<text class="small" x="740" y="116" text-anchor="middle" letter-spacing="0.06em" font-size="11" fill="#758297">CHAOS MONKEY  (fault injector)</text>

<!-- ChaosMonkey box -->
<g transform="translate(530,130)">
  <rect class="card" x="0" y="0" width="390" height="120" rx="14" fill="#FFF3D9" stroke="#D6A441"/>
  <text class="smallLabel" x="195" y="30" text-anchor="middle">ChaosMonkey</text>
  <text class="small" x="195" y="52" text-anchor="middle">spring-boot-starter-chaos-monkey</text>
  <!-- Assault type tags -->
  <rect x="10" y="64" width="82" height="20" rx="10" fill="#FDECEF" stroke="#DC6B82" stroke-width="1.2"/>
  <text class="mono" x="51" y="78" text-anchor="middle" fill="#DC6B82">Exception</text>
  <rect x="100" y="64" width="72" height="20" rx="10" fill="#FFF3D9" stroke="#D6A441" stroke-width="1.2"/>
  <text class="mono" x="136" y="78" text-anchor="middle" fill="#D6A441">Latency</text>
  <rect x="180" y="64" width="68" height="20" rx="10" fill="#F1ECFF" stroke="#8A72D6" stroke-width="1.2"/>
  <text class="mono" x="214" y="78" text-anchor="middle" fill="#8A72D6">KillApp</text>
  <rect x="256" y="64" width="68" height="20" rx="10" fill="#E9F7F6" stroke="#45A7A1" stroke-width="1.2"/>
  <text class="mono" x="290" y="78" text-anchor="middle" fill="#45A7A1">Memory</text>
  <!-- Probability note -->
  <text class="small" x="195" y="108" text-anchor="middle">assault level 5 → 20% probability per request</text>
</g>

<!-- Actuator endpoint -->
<g transform="translate(530,274)">
  <rect class="card" x="0" y="0" width="390" height="80" rx="14" fill="#F1ECFF" stroke="#8A72D6"/>
  <text class="smallLabel" x="195" y="28" text-anchor="middle">/actuator/chaosmonkey</text>
  <text class="small" x="195" y="50" text-anchor="middle">enable · disable · configure assaults</text>
  <text class="small" x="195" y="68" text-anchor="middle">Runtime control without redeploy</text>
</g>

<!-- Config note -->
<g transform="translate(530,376)">
  <rect class="card" x="0" y="0" width="390" height="80" rx="14" fill="#EAF7EF" stroke="#58A978"/>
  <text class="small" x="195" y="24" text-anchor="middle">chaos.monkey.enabled: true</text>
  <text class="small" x="195" y="44" text-anchor="middle">assaults.level: 5 · (20% probability)</text>
  <text class="small" x="195" y="64" text-anchor="middle">watchers.controller / service / repository: true</text>
</g>

<!-- ====== Fault injection arrows (orthogonal) ChaosMonkey → each layer ====== -->
<!-- Inject → Controller: right edge of controller card is x=480; chaos monkey left is x=530 -->
<!-- Route: from chaos left at y=170 → go left to x=500 → down to y=184 → left to x=480 -->
<path class="inject" d="M530,180 L500,180 L500,184 L480,184"/>

<!-- Inject → Service: from chaos left at y=270 → go left to x=500 → down to y=292 → left to x=480 -->
<path class="inject" d="M530,270 L500,270 L500,292 L480,292"/>

<!-- Inject → Repository: from chaos left at y=390 → go left to x=500 → down to y=400 → left to x=480 -->
<path class="inject" d="M530,390 L500,390 L500,400 L480,400"/>

<!-- inject labels -->
<text class="mono" x="510" y="172" text-anchor="middle" fill="#DC6B82" font-size="10">inject</text>
<text class="mono" x="510" y="262" text-anchor="middle" fill="#DC6B82" font-size="10">inject</text>
<text class="mono" x="510" y="382" text-anchor="middle" fill="#DC6B82" font-size="10">inject</text>

<!-- ====== Footer band (teal) ====== -->
<g transform="translate(36,516)">
  <rect x="0" y="0" width="888" height="36" rx="12" fill="#E9F7F6" stroke="#45A7A1" stroke-width="1.5"/>
  <text class="small" x="444" y="22" text-anchor="middle">ChaosMonkey intercepts @Watcher-annotated beans via AOP · probability and assault type configurable at runtime</text>
</g>
</svg>
