<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1378 560" width="1378" height="560">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="2" dy="4" stdDeviation="5" flood-color="#1f2937" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <polygon points="1,1 8,4.5 1,8" fill="#6b7280"/>
    </marker>
    <marker id="arrow-red" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <polygon points="1,1 8,4.5 1,8" fill="#ef4444"/>
    </marker>
    <marker id="arrow-blue" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <polygon points="1,1 8,4.5 1,8" fill="#3b82f6"/>
    </marker>
    <marker id="arrow-amber" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <polygon points="1,1 8,4.5 1,8" fill="#d97706"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1378" height="560" fill="#f6f9fc"/>
  <rect x="20" y="20" width="1338" height="520" rx="16" fill="#fff" stroke="#d7e2ec" stroke-width="1.5"/>

  <!-- Title -->
  <text x="48" y="56" font-family="'Architects Daughter', cursive" font-size="28" fill="#1e293b">Chaos Engineering Architecture</text>
  <text x="48" y="76" font-family="'Comic Sans MS', cursive" font-size="13" fill="#536476">Spring Chaos Monkey · fault injection at any layer · /actuator/chaosmonkey</text>

  <!-- ── Left panel: Application Stack ── -->
  <rect x="36" y="96" width="680" height="400" rx="12" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="376" y="93" font-family="'Architects Daughter', cursive" font-size="11" fill="#94a3b8" text-anchor="middle" letter-spacing="0.08em">APPLICATION STACK (attack targets)</text>

  <!-- HTTP Request label -->
  <text x="376" y="116" font-family="'Comic Sans MS', cursive" font-size="12" fill="#3b82f6" text-anchor="middle">▼ HTTP Request</text>

  <!-- StudentController -->
  <rect x="116" y="122" width="520" height="80" rx="12" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.8" filter="url(#shadow)"/>
  <text x="376" y="152" font-family="'Architects Daughter', cursive" font-size="18" fill="#1e3a5f" text-anchor="middle">StudentController</text>
  <text x="376" y="174" font-family="'Comic Sans MS', cursive" font-size="12" fill="#536476" text-anchor="middle">@RestController · GET /students, POST /students</text>
  <rect x="306" y="183" width="140" height="17" rx="8" fill="#3b82f6"/>
  <text x="376" y="195" font-family="'Comic Sans MS', cursive" font-size="10" fill="#fff" text-anchor="middle">@Watcher(CONTROLLER)</text>

  <!-- Arrow down -->
  <line x1="376" y1="202" x2="376" y2="232" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- StudentService -->
  <rect x="116" y="234" width="520" height="80" rx="12" fill="#d1fae5" stroke="#059669" stroke-width="1.8" filter="url(#shadow)"/>
  <text x="376" y="264" font-family="'Architects Daughter', cursive" font-size="18" fill="#064e3b" text-anchor="middle">StudentService</text>
  <text x="376" y="286" font-family="'Comic Sans MS', cursive" font-size="12" fill="#536476" text-anchor="middle">@Service · business logic</text>
  <rect x="306" y="295" width="140" height="17" rx="8" fill="#059669"/>
  <text x="376" y="307" font-family="'Comic Sans MS', cursive" font-size="10" fill="#fff" text-anchor="middle">@Watcher(SERVICE)</text>

  <!-- Arrow down -->
  <line x1="376" y1="314" x2="376" y2="344" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- StudentJdbcRepository -->
  <rect x="116" y="346" width="520" height="80" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="1.8" filter="url(#shadow)"/>
  <text x="376" y="376" font-family="'Architects Daughter', cursive" font-size="18" fill="#78350f" text-anchor="middle">StudentJdbcRepository</text>
  <text x="376" y="398" font-family="'Comic Sans MS', cursive" font-size="12" fill="#536476" text-anchor="middle">@Repository · JDBC operations</text>
  <rect x="306" y="407" width="140" height="17" rx="8" fill="#d97706"/>
  <text x="376" y="419" font-family="'Comic Sans MS', cursive" font-size="10" fill="#fff" text-anchor="middle">@Watcher(REPOSITORY)</text>

  <!-- Arrow down to H2 -->
  <line x1="376" y1="426" x2="376" y2="455" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- H2 DB (cylinder shape) -->
  <rect x="266" y="456" width="220" height="52" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5" filter="url(#shadow)"/>
  <ellipse cx="376" cy="508" rx="110" ry="11" fill="#cbd5e1" stroke="#64748b" stroke-width="1.5"/>
  <line x1="266" y1="456" x2="266" y2="508" stroke="#64748b" stroke-width="1.5"/>
  <line x1="486" y1="456" x2="486" y2="508" stroke="#64748b" stroke-width="1.5"/>
  <ellipse cx="376" cy="456" rx="110" ry="11" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
  <text x="376" y="487" font-family="'Architects Daughter', cursive" font-size="15" fill="#334155" text-anchor="middle">H2 Database</text>

  <!-- ── Right panel: ChaosMonkey ── -->
  <rect x="780" y="96" width="560" height="400" rx="12" fill="#fff7ed" stroke="#d97706" stroke-width="1.5"/>
  <text x="1060" y="93" font-family="'Architects Daughter', cursive" font-size="11" fill="#92400e" text-anchor="middle" letter-spacing="0.08em">CHAOS MONKEY (fault injector)</text>

  <!-- ChaosMonkey box -->
  <rect x="820" y="120" width="480" height="120" rx="14" fill="#fed7aa" stroke="#d97706" stroke-width="2" filter="url(#shadow)"/>
  <text x="1060" y="152" font-family="'Architects Daughter', cursive" font-size="20" fill="#92400e" text-anchor="middle">ChaosMonkey</text>
  <text x="1060" y="174" font-family="'Comic Sans MS', cursive" font-size="12" fill="#536476" text-anchor="middle">spring-boot-starter-chaos-monkey</text>
  <!-- Assault types -->
  <rect x="828" y="188" width="100" height="20" rx="10" fill="#ef4444"/>
  <text x="878" y="202" font-family="'Comic Sans MS', cursive" font-size="10" fill="#fff" text-anchor="middle">Exception</text>
  <rect x="938" y="188" width="90" height="20" rx="10" fill="#f97316"/>
  <text x="983" y="202" font-family="'Comic Sans MS', cursive" font-size="10" fill="#fff" text-anchor="middle">Latency</text>
  <rect x="1038" y="188" width="90" height="20" rx="10" fill="#8b5cf6"/>
  <text x="1083" y="202" font-family="'Comic Sans MS', cursive" font-size="10" fill="#fff" text-anchor="middle">KillApp</text>
  <rect x="1138" y="188" width="90" height="20" rx="10" fill="#0891b2"/>
  <text x="1183" y="202" font-family="'Comic Sans MS', cursive" font-size="10" fill="#fff" text-anchor="middle">Memory</text>

  <!-- Actuator endpoint -->
  <rect x="820" y="270" width="480" height="80" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="1060" y="300" font-family="'Architects Daughter', cursive" font-size="17" fill="#3b0764" text-anchor="middle">/actuator/chaosmonkey</text>
  <text x="1060" y="322" font-family="'Comic Sans MS', cursive" font-size="12" fill="#536476" text-anchor="middle">enable · disable · configure assaults</text>
  <text x="1060" y="340" font-family="'Comic Sans MS', cursive" font-size="11" fill="#7c3aed" text-anchor="middle">Runtime control without redeploy</text>

  <!-- Config note -->
  <rect x="820" y="380" width="480" height="74" rx="12" fill="#f0fdf4" stroke="#86efac" stroke-width="1.2"/>
  <text x="1060" y="406" font-family="'Architects Daughter', cursive" font-size="15" fill="#166534" text-anchor="middle">chaos.monkey.enabled: true</text>
  <text x="1060" y="426" font-family="'Comic Sans MS', cursive" font-size="12" fill="#536476" text-anchor="middle">assaults.level: 5 (20% probability)</text>
  <text x="1060" y="444" font-family="'Comic Sans MS', cursive" font-size="12" fill="#536476" text-anchor="middle">watchers.controller/service/repository: true</text>

  <!-- ── Fault injection arrows (ChaosMonkey → each layer) ── -->
  <!-- ChaosMonkey → StudentController -->
  <path d="M820,162 C740,162 720,162 636,162" stroke="#ef4444" stroke-width="2" stroke-dasharray="7 5" fill="none" marker-end="url(#arrow-red)"/>
  <!-- ChaosMonkey → StudentService -->
  <path d="M820,230 C740,274 720,274 636,274" stroke="#ef4444" stroke-width="2" stroke-dasharray="7 5" fill="none" marker-end="url(#arrow-red)"/>
  <!-- ChaosMonkey → StudentJdbcRepository -->
  <path d="M820,310 C740,374 720,386 636,386" stroke="#ef4444" stroke-width="2" stroke-dasharray="7 5" fill="none" marker-end="url(#arrow-red)"/>

  <!-- Fault labels -->
  <text x="720" y="155" font-family="'Comic Sans MS', cursive" font-size="10" fill="#ef4444" text-anchor="middle">inject</text>
  <text x="720" y="267" font-family="'Comic Sans MS', cursive" font-size="10" fill="#ef4444" text-anchor="middle">inject</text>
  <text x="720" y="379" font-family="'Comic Sans MS', cursive" font-size="10" fill="#ef4444" text-anchor="middle">inject</text>

  <!-- Footer -->
  <rect x="36" y="510" width="1306" height="30" rx="8" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.2"/>
  <text x="689" y="530" font-family="'Comic Sans MS', cursive" font-size="12" fill="#991b1b" text-anchor="middle">ChaosMonkey intercepts @Watcher-annotated beans via AOP · probability and assault type configurable at runtime</text>
</svg>
