  <rect class="region" x="677.377" y="292" width="1556.525" height="180" fill="#FEE2E2" stroke="#F87171"/><text class="noteTitle" x="735.026" y="334">Unsafe baseline</text>
  <g filter="url(#shadow)"><rect x="879.148" y="374" width="432.368" height="66" rx="14" fill="#FFFFFF" stroke="#DC2626" stroke-width="2.45"/><text class="cardTitle" x="1095.332" y="414" text-anchor="middle">findByIdWithoutTenant</text></g>
  <g filter="url(#shadow)"><rect x="1599.762" y="374" width="432.368" height="66" rx="14" fill="#FEE2E2" stroke="#DC2626" stroke-width="2.45"/><text class="cardTitle" x="1815.946" y="414" text-anchor="middle">leaks alpha row</text></g>
  <rect class="region" x="677.377" y="532" width="1556.525" height="240" fill="#ECFDF5" stroke="#86EFAC"/><text class="noteTitle" x="735.026" y="574">Tenant-scoped path</text>
  <g filter="url(#shadow)"><rect x="807.087" y="622" width="490.017" height="76" rx="14" fill="#FFFFFF" stroke="#16A34A" stroke-width="2.45"/><text class="cardTitle" x="1052.095" y="654" text-anchor="middle">Tenant predicate</text><text class="cardText" x="1052.095" y="680" text-anchor="middle">tenant_id = beta AND id = 42</text></g>
  <g filter="url(#shadow)"><rect x="1498.876" y="612" width="518.842" height="96" rx="14" fill="#FFFFFF" stroke="#16A34A" stroke-width="2.45"/><text class="cardTitle" x="1758.297" y="644" text-anchor="middle">TenantKeyFactory</text><text class="cardText" x="1758.297" y="670" text-anchor="middle">tenant:tenant-beta:invoice:42</text><text class="cardText" x="1758.297" y="694" text-anchor="middle">lock and rate-limit share prefix</text></g>
  <path class="line" d="M 547.667 194 L 922.385 194" stroke="#2563EB" marker-end="url(#arrowBlue)" stroke-linecap="round" stroke-linejoin="round"/><text class="msg" x="735.026" y="176" text-anchor="middle">insert alpha invoice</text>
  <path class="line" d="M 547.667 694 L 619.727 694 Q 634.14 694 634.14 684 L 634.14 417 Q 634.14 407 648.552 407 L 879.148 407" stroke="#DC2626" marker-end="url(#arrowRed)" stroke-linecap="round" stroke-linejoin="round"/><text class="msg" x="677.377" y="546" text-anchor="middle">ID only</text>
