<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="900" viewBox="0 0 1700 900" role="img" aria-label="Tenant data isolation scenario">
  <defs><filter id="shadow" x="-8%" y="-8%" width="116%" height="124%"><feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#64748B" flood-opacity="0.15"/></filter><marker id="arrowBlue" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 14 7 L 0 14 Z" fill="#2563EB"/></marker><marker id="arrowGreen" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 14 7 L 0 14 Z" fill="#16A34A"/></marker><marker id="arrowRed" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 14 7 L 0 14 Z" fill="#DC2626"/></marker><style>.canvas{fill:#F8FAFC}.frame{fill:#FFFFFF;stroke:#D6E0E8;stroke-width:1.4}.title{font-family:"Architects Daughter";font-size:40px;fill:#102033}.subtitle{font-family:"Comic Mono";font-size:16px;fill:#51606F}.cardTitle{font-family:"Architects Daughter";font-size:29px;fill:#102033}.cardText{font-family:"Comic Mono";font-size:15px;fill:#415166}.line{fill:none;stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round}.msg{font-family:"Comic Mono";font-size:15px;fill:#334155}.region{fill-opacity:.58;stroke-width:1.6;rx:18}.noteTitle{font-family:"Architects Daughter";font-size:25px;fill:#102033}</style></defs>
  <rect class="canvas" width="1700" height="900"/><rect class="frame" x="24" y="24" width="1652" height="852" rx="24"/>
  <text class="title" x="850" y="72" text-anchor="middle">Same invoice id, different tenant boundary</text><text class="subtitle" x="850" y="106" text-anchor="middle">The unsafe path uses only invoice id; the safe path carries tenant scope through SQL predicates and generated keys.</text>
  <g filter="url(#shadow)"><rect x="120" y="156" width="260" height="76" rx="14" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.7"/><text class="cardTitle" x="250" y="188" text-anchor="middle">tenant-alpha</text><text class="cardText" x="250" y="214" text-anchor="middle">owns invoice 42</text></g>
  <g filter="url(#shadow)"><rect x="120" y="656" width="260" height="76" rx="14" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.7"/><text class="cardTitle" x="250" y="688" text-anchor="middle">tenant-beta</text><text class="cardText" x="250" y="714" text-anchor="middle">requests invoice 42</text></g>
  <g filter="url(#shadow)"><rect x="640" y="156" width="320" height="76" rx="14" fill="#ECFEFF" stroke="#0891B2" stroke-width="1.7"/><text class="cardTitle" x="800" y="188" text-anchor="middle">tenant_invoices</text><text class="cardText" x="800" y="214" text-anchor="middle">tenant_id + id columns</text></g>
  <rect class="region" x="470" y="292" width="1080" height="180" fill="#FEE2E2" stroke="#F87171"/><text class="noteTitle" x="510" y="334">Unsafe baseline</text>
  <g filter="url(#shadow)"><rect x="610" y="374" width="300" height="66" rx="14" fill="#FFFFFF" stroke="#DC2626" stroke-width="1.7"/><text class="cardTitle" x="760" y="414" text-anchor="middle">findByIdWithoutTenant</text></g>
  <g filter="url(#shadow)"><rect x="1110" y="374" width="300" height="66" rx="14" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.7"/><text class="cardTitle" x="1260" y="414" text-anchor="middle">leaks alpha row</text></g>
  <rect class="region" x="470" y="532" width="1080" height="240" fill="#ECFDF5" stroke="#86EFAC"/><text class="noteTitle" x="510" y="574">Tenant-scoped path</text>
  <g filter="url(#shadow)"><rect x="560" y="622" width="340" height="76" rx="14" fill="#FFFFFF" stroke="#16A34A" stroke-width="1.7"/><text class="cardTitle" x="730" y="654" text-anchor="middle">Tenant predicate</text><text class="cardText" x="730" y="680" text-anchor="middle">tenant_id = beta AND id = 42</text></g>
  <g filter="url(#shadow)"><rect x="1040" y="612" width="360" height="96" rx="14" fill="#FFFFFF" stroke="#16A34A" stroke-width="1.7"/><text class="cardTitle" x="1220" y="644" text-anchor="middle">TenantKeyFactory</text><text class="cardText" x="1220" y="670" text-anchor="middle">tenant:tenant-beta:invoice:42</text><text class="cardText" x="1220" y="694" text-anchor="middle">lock and rate-limit share prefix</text></g>
  <path class="line" d="M 380 194 L 640 194" stroke="#2563EB" marker-end="url(#arrowBlue)"/><text class="msg" x="510" y="176" text-anchor="middle">insert alpha invoice</text>
  <path class="line" d="M 380 694 L 440 694 L 440 407 L 610 407" stroke="#DC2626" marker-end="url(#arrowRed)"/><text class="msg" x="470" y="546" text-anchor="middle">ID only</text>
  <path class="line" d="M 910 407 L 1110 407" stroke="#DC2626" marker-end="url(#arrowRed)"/>
  <path class="line" d="M 380 694 L 500 694 L 500 660 L 560 660" stroke="#16A34A" marker-end="url(#arrowGreen)"/><text class="msg" x="480" y="676" text-anchor="middle">tenant + id</text>
  <path class="line" d="M 900 660 L 1040 660" stroke="#16A34A" marker-end="url(#arrowGreen)"/>
  <text class="msg" x="762" y="728" text-anchor="middle">repository returns null because no beta row matches invoice 42</text>
</svg>
