  <rect class="canvas" width="2450.086" height="900"/><rect class="frame" x="34.589" y="24" width="2380.907" height="852" rx="24"/>
  <text class="title" x="1225.042" y="72" text-anchor="middle">Same invoice id, different tenant boundary</text><text class="subtitle" x="1225.042" y="106" text-anchor="middle">The unsafe path uses only invoice id; the safe path carries tenant scope through SQL predicates and generated keys.</text>
  <g filter="url(#shadow)"><rect x="172.947" y="156" width="374.719" height="76" rx="14" fill="#EFF6FF" stroke="#2563EB" stroke-width="2.45"/><text class="cardTitle" x="360.306" y="188" text-anchor="middle">tenant-alpha</text><text class="cardText" x="360.306" y="214" text-anchor="middle">owns invoice 42</text></g>
