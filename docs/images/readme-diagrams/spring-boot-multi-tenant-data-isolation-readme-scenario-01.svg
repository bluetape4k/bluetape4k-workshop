  <path class="line" d="M 547.667 694 L 706.201 694 Q 720.614 694 720.614 684 L 720.614 670 Q 720.614 660 735.026 660 L 807.087 660" stroke="#16A34A" marker-end="url(#arrowGreen)" stroke-linecap="round" stroke-linejoin="round"/><text class="msg" x="691.789" y="676" text-anchor="middle">tenant + id</text>
  <path class="line" d="M 1297.104 660 L 1498.876 660" stroke="#16A34A" marker-end="url(#arrowGreen)" stroke-linecap="round" stroke-linejoin="round"/>
  <text class="msg" x="1098.215" y="728" text-anchor="middle">repository returns null because no beta row matches invoice 42</text>
