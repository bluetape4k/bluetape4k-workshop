<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1180" viewBox="0 0 1800 1180" role="img" aria-labelledby="title desc">
  <title id="title">Leader Job Safety Lab Architecture</title><desc id="desc">Spring API, leader election, resource fencing, PostgreSQL authority, transactional outbox, and external reconciliation boundaries.</desc><defs>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="124%"><feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#64748B" flood-opacity="0.13"/></filter>
    <style>
      .bg{fill:#F8FAFC}.frame{fill:#FFFFFF;stroke:#CAD6DF;stroke-width:2}.layer{stroke-width:2}.blueLayer{fill:#EFF6FF;stroke:#A8C7EA}.greenLayer{fill:#F0F8F0;stroke:#B8D7AE}.amberLayer{fill:#FFF7E8;stroke:#DFC69A}.purpleLayer{fill:#F8F3FF;stroke:#D7C3EF}.title{font-family:"Architects Daughter";font-size:42px;fill:#263238}.subtitle,.body,.small,.footer,.msg{font-family:"Comic Mono";fill:#3E4C59}.subtitle{font-size:18px}.layerTitle{font-family:"Architects Daughter";font-size:26px;fill:#344154}.cardTitle,.participant{font-family:"Architects Daughter";font-size:23px;fill:#16202A}.body{font-size:16px}.small{font-size:13px;fill:#5B6975}.footer{font-size:14px;fill:#60727D}.card{fill:#FFFFFF;stroke:#9FB0BC;stroke-width:2}.blueCard{fill:#EFF6FF;stroke:#4F86C6}.greenCard{fill:#F0F8F0;stroke:#6E8F4F}.amberCard{fill:#FFF7E8;stroke:#9B7D54}.redCard{fill:#FFF0F0;stroke:#B86868}.purpleCard{fill:#F8F3FF;stroke:#8065A8}.connector{fill:none;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round}.blueEdge{stroke:#4F86C6;marker-end:url(#arrow-blue)}.greenEdge{stroke:#6E8F4F;marker-end:url(#arrow-green)}.amberEdge{stroke:#9B7D54;marker-end:url(#arrow-amber)}.redEdge{stroke:#B86868;marker-end:url(#arrow-red)}.purpleEdge{stroke:#8065A8;marker-end:url(#arrow-purple)}.tealEdge{stroke:#2D948C;marker-end:url(#arrow-teal)}.dashed{stroke-dasharray:10 8}.lifeline{stroke:#9AAAB1;stroke-width:2;stroke-dasharray:7 8}.activation{fill:#EAF6EF;stroke:#6F9278;stroke-width:1.5}.label{fill:#FFFFFF;stroke:#D7E0E4;stroke-width:1.5}.badge{font-family:"Comic Mono";font-size:13px;font-weight:700}.legend{font-family:"Comic Mono";font-size:14px;fill:#475569}
    </style>
    <marker id="arrow-blue" viewBox="0 0 10 10" markerWidth="14" markerHeight="14" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#4F86C6" stroke="#4F86C6" stroke-dasharray="none"/></marker><marker id="arrow-green" viewBox="0 0 10 10" markerWidth="14" markerHeight="14" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#6E8F4F" stroke="#6E8F4F" stroke-dasharray="none"/></marker><marker id="arrow-amber" viewBox="0 0 10 10" markerWidth="14" markerHeight="14" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#9B7D54" stroke="#9B7D54" stroke-dasharray="none"/></marker><marker id="arrow-red" viewBox="0 0 10 10" markerWidth="14" markerHeight="14" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#B86868" stroke="#B86868" stroke-dasharray="none"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" markerWidth="14" markerHeight="14" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#8065A8" stroke="#8065A8" stroke-dasharray="none"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" markerWidth="14" markerHeight="14" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#2D948C" stroke="#2D948C" stroke-dasharray="none"/></marker>
  </defs>
  <rect class="bg" width="1800" height="1180"/><text id="title" class="title" x="900" y="62" text-anchor="middle">Leader Job Safety Lab - Safety Boundaries</text><text class="subtitle" x="900" y="96" text-anchor="middle">Leader election limits active runners; only an orderable fence checked by PostgreSQL blocks stale commits.</text>
  <rect class="layer blueLayer" x="70" y="130" width="1660" height="190" rx="22"/><text class="layerTitle" x="106" y="172">HTTP and operator boundary</text>
  <g class="node" data-node="safe-api" filter="url(#shadow)"><rect class="card blueCard" x="150" y="210" width="390" height="78" rx="16"/><text class="cardTitle" x="345" y="246" text-anchor="middle">Safe scenario API</text><text class="body" x="345" y="276" text-anchor="middle">authenticated SAFE comparisons</text></g><g class="node" data-node="security" filter="url(#shadow)"><rect class="card blueCard" x="705" y="210" width="390" height="78" rx="16"/><text class="cardTitle" x="900" y="246" text-anchor="middle">Spring Security</text><text class="body" x="900" y="276" text-anchor="middle">stateless HTTP Basic, deny by default</text></g><g class="node" data-node="operator-api" filter="url(#shadow)"><rect class="card blueCard" x="1260" y="210" width="390" height="78" rx="16"/><text class="cardTitle" x="1455" y="246" text-anchor="middle">Operator API</text><text class="body" x="1455" y="276" text-anchor="middle">reset, deliver, reconcile, unsafe</text></g>
  <rect class="layer greenLayer" x="70" y="375" width="1660" height="300" rx="22"/><text class="layerTitle" x="106" y="417">Execution and durable completion</text>
  <g class="node" data-node="coordinator" filter="url(#shadow)"><rect class="card greenCard" x="125" y="480" width="320" height="112" rx="16"/><text class="cardTitle" x="285" y="516" text-anchor="middle">JobRunCoordinator</text><text class="body" x="285" y="546" text-anchor="middle">leader first</text><text class="body" x="285" y="570" text-anchor="middle">resource fence second</text></g><g class="node" data-node="fenced-execution" filter="url(#shadow)"><rect class="card greenCard" x="520" y="480" width="360" height="112" rx="16"/><text class="cardTitle" x="700" y="516" text-anchor="middle">Fenced execution</text><text class="body" x="700" y="546" text-anchor="middle">authority + fence check</text><text class="body" x="700" y="570" text-anchor="middle">one Exposed transaction</text></g><g class="node" data-node="outbox-worker" filter="url(#shadow)"><rect class="card amberCard" x="955" y="480" width="330" height="112" rx="16"/><text class="cardTitle" x="1120" y="516" text-anchor="middle">Outbox worker</text><text class="body" x="1120" y="546" text-anchor="middle">short claim transaction</text><text class="body" x="1120" y="570" text-anchor="middle">network outside DB</text></g><g class="node" data-node="effect-provider" filter="url(#shadow)"><rect class="card amberCard" x="1360" y="480" width="320" height="112" rx="16"/><text class="cardTitle" x="1520" y="516" text-anchor="middle">External provider</text><text class="body" x="1520" y="546" text-anchor="middle">stable operation ID</text><text class="body" x="1520" y="570" text-anchor="middle">query before retry</text></g>
  <rect class="layer purpleLayer" x="70" y="730" width="1660" height="290" rx="22"/><text class="layerTitle" x="106" y="772">Infrastructure authority</text>
  <g class="node" data-node="redis" filter="url(#shadow)"><rect class="card purpleCard" x="180" y="840" width="570" height="112" rx="16"/><image data-bluetape4k-icon="redis" data-source="docs/icons/redis/redis-icon.svg" x="206" y="864" width="54" height="54" href="data:image/svg+xml;base64,"/><text class="cardTitle" x="280" y="883">Redis + Lettuce</text><text class="body" x="280" y="910">opaque leader lease + monotonic Lua fence</text></g><g class="node" data-node="postgresql" filter="url(#shadow)"><rect class="card greenCard" x="1020" y="840" width="600" height="112" rx="16"/><image data-bluetape4k-icon="postgresql" data-source="docs/icons/testcontainers/database/postgresql.svg" x="1046" y="864" width="54" height="54" href="data:image/svg+xml;base64,"/><text class="cardTitle" x="1120" y="883">PostgreSQL + ExposedJdbcRepository</text><text class="body" x="1120" y="910">topology, rollout, fence, checkpoint, outbox, receipt</text></g>
  <g class="edge" data-edge="safe-api-to-coordinator" data-label="safe scenario execution"><path data-connector="safe-api-to-coordinator" class="connector blueEdge" d="M 345 288 L 345 480"/></g><g class="edge" data-edge="operator-to-outbox" data-label="bounded operator work"><path data-connector="operator-to-outbox" class="connector blueEdge" d="M 1455 288 L 1455 350 Q 1455 366 1439 366 L 1140 366 Q 1120 366 1120 386 L 1120 480"/></g><g class="edge" data-edge="coordinator-to-execution" data-label="fenced mutation"><path data-connector="coordinator-to-execution" class="connector greenEdge" d="M 445 536 L 520 536"/></g><g class="edge" data-edge="execution-to-outbox" data-label="atomic outbox row"><path data-connector="execution-to-outbox" class="connector greenEdge" d="M 880 536 L 955 536"/></g><g class="edge" data-edge="outbox-to-provider" data-label="idempotent external effect"><path data-connector="outbox-to-provider" class="connector amberEdge" d="M 1285 536 L 1360 536"/></g><g class="edge" data-edge="coordinator-to-redis" data-label="leader + Lua fencing"><path data-connector="coordinator-to-redis" class="connector purpleEdge" d="M 285 592 L 285 704 Q 285 720 301 720 L 465 720 Q 485 720 485 740 L 485 840"/></g><g class="edge" data-edge="execution-to-postgresql" data-label="authoritative conditional commit"><path data-connector="execution-to-postgresql" class="connector greenEdge" d="M 700 592 L 700 764 Q 700 780 716 780 L 1130 780 Q 1150 780 1150 800 L 1150 840"/></g><g class="edge" data-edge="outbox-to-postgresql" data-label="claim + receipt"><path data-connector="outbox-to-postgresql" class="connector greenEdge" d="M 1120 592 L 1120 700 Q 1120 716 1136 716 L 1240 716 Q 1260 716 1260 736 L 1260 840"/></g>
  <rect class="frame" x="160" y="1060" width="1480" height="64" rx="16"/><text class="legend" x="220" y="1100">Blue: request / operator boundary</text><text class="legend" x="690" y="1100">Green: PostgreSQL-authoritative commit</text><text class="legend" x="1230" y="1100">Amber: external effect</text>
  <text class="footer" x="900" y="1155" text-anchor="middle">The Redis leader token is opaque and never becomes a fencing token.</text></svg>