<svg xmlns="http://www.w3.org/2000/svg" width="960" height="500" viewBox="0 0 960 500" role="img" aria-label="Bucket4j Redis Architecture">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#1f2937" flood-opacity="0.10"/></filter>
  <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth">
    <path d="M1,1 L8,4.5 L1,8 Z" fill="#758297"/>
  </marker>
  <style>
    .canvas{fill:#f7f9fc}.frame{fill:#fff;stroke:#d8e0ea;stroke-width:1.5}
    .title{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:38px;font-weight:400;fill:#102033}
    .subtitle{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:14px;font-weight:400;fill:#536273}
    .smallLabel{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:21px;font-weight:400;fill:#102033}
    .mono{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#102033}
    .small{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#536273}
    .card{stroke-width:2.1;filter:url(#shadow)}
    .line{stroke:#758297;stroke-width:2.1;fill:none;marker-end:url(#arrow)}
  </style>
</defs>
<!-- Layout:
     Canvas: 960×500  Frame: x=24 y=20 w=912 h=456
     Row1  y=98  h=54  WebFilter center x=260 w=440
     Row2  y=212 h=80  Col1: x=24 w=420 cx=234 (CoroutineController+ReactiveController)
                        Col2: x=516 w=420 cx=726 (UserRateLimitWebFilter)
     Row3  y=352 h=54  DistributedRateLimiter center x=260 w=440
     Row4  y=466 h=50  Col1: x=24 w=420 cx=234 (LettuceBasedProxyManager)
                        Col2: x=516 w=420 cx=726 (Redis Testcontainers)
-->
<rect class="canvas" width="960" height="500"/>
<rect class="frame" x="24" y="20" width="912" height="456" rx="28"/>
<text class="title" x="58" y="66">Bucket4j Redis</text>
<text class="subtitle" x="58" y="92">WebFlux · Coroutines · IP-based · LettuceBasedProxyManager · Redis Testcontainers</text>

<!-- Arrows -->
<!-- Row1 WebFilter → controllers and WebFilter (it intercepts before controllers) -->
<path class="line" d="M480 152 L480 182 L234 182 L234 212"/>
<path class="line" d="M480 182 L726 182 L726 212"/>
<!-- Row2 → Row3 (both converge) -->
<path class="line" d="M234 292 L234 332 L480 332 L480 352"/>
<path class="line" d="M726 292 L726 332 L480 332 L480 352"/>
<!-- Row3 → Row4 -->
<path class="line" d="M480 406 L480 436 L234 436 L234 466"/>
<path class="line" d="M480 436 L726 436 L726 466"/>

<!-- WebFilter (top center) -->
<g transform="translate(260,98)">
  <rect class="card" x="0" y="0" width="440" height="54" rx="12" fill="#EAF7EF" stroke="#58A978"/>
  <text class="smallLabel" x="220" y="22" text-anchor="middle">UserRateLimitWebFilter</text>
  <text class="mono" x="220" y="42" text-anchor="middle">@Order(0) · IP-based key · consume(1) · 429 on limit</text>
</g>

<!-- CoroutineController col1 -->
<g transform="translate(24,212)">
  <rect class="card" x="0" y="0" width="420" height="80" rx="12" fill="#E8F3FF" stroke="#5B8DEF"/>
  <text class="smallLabel" x="210" y="22" text-anchor="middle">CoroutineController</text>
  <text class="mono" x="210" y="44" text-anchor="middle">suspend · GET /api/v1/coroutines/hello</text>
  <text class="small" x="210" y="64" text-anchor="middle">rate-limited on /api/v1/** · v2 unprotected</text>
</g>

<!-- ReactiveController col2 -->
<g transform="translate(516,212)">
  <rect class="card" x="0" y="0" width="420" height="80" rx="12" fill="#FFF3D9" stroke="#D6A441"/>
  <text class="smallLabel" x="210" y="22" text-anchor="middle">ReactiveController</text>
  <text class="mono" x="210" y="44" text-anchor="middle">Mono · GET /api/v1/reactive/hello</text>
  <text class="small" x="210" y="64" text-anchor="middle">rate-limited on /api/v1/** · v2 unprotected</text>
</g>

<!-- DistributedRateLimiter (center) -->
<g transform="translate(260,352)">
  <rect class="card" x="0" y="0" width="440" height="54" rx="12" fill="#F1ECFF" stroke="#8A72D6"/>
  <text class="smallLabel" x="220" y="22" text-anchor="middle">DistributedRateLimiter</text>
  <text class="small" x="220" y="42" text-anchor="middle">LettuceBasedProxyManager · BucketConfiguration · TTL 90s</text>
</g>

<!-- LettuceBasedProxyManager col1 -->
<g transform="translate(24,466)">
  <rect class="card" x="0" y="0" width="420" height="50" rx="12" fill="#E9F7F6" stroke="#45A7A1"/>
  <text class="smallLabel" x="210" y="20" text-anchor="middle">Lettuce ProxyManager</text>
  <text class="small" x="210" y="38" text-anchor="middle">CAS strategy · VirtualThread executor</text>
</g>

<!-- Redis col2 -->
<g transform="translate(516,466)">
  <rect class="card" x="0" y="0" width="420" height="50" rx="12" fill="#FDECEF" stroke="#DC6B82"/>
  <text class="smallLabel" x="210" y="20" text-anchor="middle">Redis</text>
  <text class="small" x="210" y="38" text-anchor="middle">Testcontainers singleton · bucket storage · atomic Lua</text>
</g>
</svg>
