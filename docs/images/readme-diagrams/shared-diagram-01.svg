<svg xmlns="http://www.w3.org/2000/svg" width="920" height="440" viewBox="0 0 920 440" role="img" aria-label="Shared Module Architecture">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#1f2937" flood-opacity="0.10"/></filter>
  <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth">
    <path d="M1,1 L8,4.5 L1,8 Z" fill="#758297"/>
  </marker>
  <style>
    .canvas{fill:#f7f9fc}.frame{fill:#fff;stroke:#d8e0ea;stroke-width:1.5}
    .title{font-family:"Architects Daughter";font-size:38px;font-weight:400;fill:#102033}
    .subtitle{font-family:"Comic Mono";font-size:14px;font-weight:400;fill:#536273}
    .smallLabel{font-family:"Architects Daughter";font-size:21px;font-weight:400;fill:#102033}
    .mono{font-family:"Comic Mono";font-size:12px;font-weight:400;fill:#102033}
    .small{font-family:"Comic Mono";font-size:12px;font-weight:400;fill:#536273}
    .card{stroke-width:2.1;filter:url(#shadow)}
    .line{stroke:#758297;stroke-width:2.1;fill:none;marker-end:url(#arrow)}
  </style>
</defs>
<!-- Layout:
     Canvas: 920×440  Frame: x=24 y=20 w=872 h=396
     Row1  y=108 h=80  3-col (w=260 gap=46):
       Col1: x=24  cx=154  WebClientExtensions
       Col2: x=330 cx=460  RestClientExtensions
       Col3: x=636 cx=766  WebTestClientExtensions
     Row2  y=244 h=80  2-col (w=400 gap=48):
       Col1: x=24  cx=224  AbstractSharedTest
       Col2: x=448 cx=648  AbstractSpringTest
     Row3  y=378 h=38  BluetapeHttpServer full width
-->
<rect class="canvas" width="920" height="440"/>
<rect class="frame" x="24" y="20" width="872" height="396" rx="28"/>
<text class="title" x="58" y="66">Shared Module</text>
<text class="subtitle" x="58" y="90">WebClient · RestClient · WebTestClient HTTP extensions · BluetapeHttpServer Testcontainers</text>

<!-- Arrows: 3 extensions → test bases (bus y=208) -->
<path class="line" d="M154 188 L154 208 L224 208 L224 244"/>
<path class="line" d="M460 188 L460 208 L224 208 L224 244"/>
<path class="line" d="M766 188 L766 208 L648 208 L648 244"/>
<!-- Arrows: AbstractSpringTest → BluetapeHttpServer -->
<path class="line" d="M648 324 L648 358 L460 358 L460 378"/>

<!-- WebClientExtensions col1 -->
<g transform="translate(24,108)">
  <rect class="card" x="0" y="0" width="260" height="80" rx="12" fill="#F1ECFF" stroke="#8A72D6"/>
  <text class="smallLabel" x="130" y="22" text-anchor="middle">WebClientExtensions</text>
  <text class="mono" x="130" y="44" text-anchor="middle">httpGet · httpPost · httpPut</text>
  <text class="small" x="130" y="64" text-anchor="middle">httpPatch · httpDelete · Flow</text>
</g>

<!-- RestClientExtensions col2 -->
<g transform="translate(330,108)">
  <rect class="card" x="0" y="0" width="260" height="80" rx="12" fill="#E8F3FF" stroke="#5B8DEF"/>
  <text class="smallLabel" x="130" y="22" text-anchor="middle">RestClientExtensions</text>
  <text class="mono" x="130" y="44" text-anchor="middle">httpGet · httpPost · httpPut</text>
  <text class="small" x="130" y="64" text-anchor="middle">httpPatch · httpDelete · sync</text>
</g>

<!-- WebTestClientExtensions col3 -->
<g transform="translate(636,108)">
  <rect class="card" x="0" y="0" width="260" height="80" rx="12" fill="#EAF7EF" stroke="#58A978"/>
  <text class="smallLabel" x="130" y="22" text-anchor="middle">WebTestClientExtensions</text>
  <text class="mono" x="130" y="44" text-anchor="middle">httpGet · httpPost · httpPut</text>
  <text class="small" x="130" y="64" text-anchor="middle">httpPatch · httpDelete · test</text>
</g>

<!-- AbstractSharedTest col1 -->
<g transform="translate(24,244)">
  <rect class="card" x="0" y="0" width="400" height="80" rx="12" fill="#FFF3D9" stroke="#D6A441"/>
  <text class="smallLabel" x="200" y="22" text-anchor="middle">AbstractSharedTest</text>
  <text class="mono" x="200" y="44" text-anchor="middle">companion object : KLogging()</text>
  <text class="small" x="200" y="64" text-anchor="middle">base for all workshop tests</text>
</g>

<!-- AbstractSpringTest col2 -->
<g transform="translate(448,244)">
  <rect class="card" x="0" y="0" width="400" height="80" rx="12" fill="#E9F7F6" stroke="#45A7A1"/>
  <text class="smallLabel" x="200" y="22" text-anchor="middle">AbstractSpringTest</text>
  <text class="mono" x="200" y="44" text-anchor="middle">bluetapeHttpServer · baseUrl</text>
  <text class="small" x="200" y="64" text-anchor="middle">extends AbstractSharedTest</text>
</g>

<!-- BluetapeHttpServer (full width) -->
<g transform="translate(24,378)">
  <rect class="card" x="0" y="0" width="872" height="38" rx="12" fill="#E9F7F6" stroke="#45A7A1"/>
  <text class="smallLabel" x="436" y="16" text-anchor="middle">BluetapeHttpServer · Testcontainers</text>
  <text class="small" x="436" y="32" text-anchor="middle">httpbinUrl · singleton via Launcher · HTTP echo server for integration tests</text>
</g>
</svg>
