<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1480" height="760" viewBox="0 0 1480 760" role="img" aria-label="Leader election workshop architecture diagram">
  <defs>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="124%"><feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#64748B" flood-opacity="0.16"/></filter>
    <marker id="arrowBlue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 12 6 L 0 12 Z" fill="#2563EB"/></marker>
    <marker id="arrowGreen" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 12 6 L 0 12 Z" fill="#16A34A"/></marker>
    <marker id="arrowAmber" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 12 6 L 0 12 Z" fill="#C47A12"/></marker>
    <marker id="arrowRed" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 12 6 L 0 12 Z" fill="#DC2626"/></marker>
    <style>
      .canvas{fill:#F8FAFC}.frame{fill:#FFFFFF;stroke:#D6E0E8;stroke-width:1.4}.layer{fill:#F8FAFC;stroke:#CBD5E1;stroke-width:1.4}.title{font-family:"Architects Daughter";font-size:36px;fill:#102033}.subtitle{font-family:"Comic Mono";font-size:14px;fill:#51606F}.layerLabel{font-family:"Architects Daughter";font-size:23px;fill:#263548}.cardTitle{font-family:"Architects Daughter";font-size:27px;fill:#102033}.cardText{font-family:"Comic Mono";font-size:14px;fill:#415166}.line{fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.redisText{font-family:"Architects Daughter";font-size:26px;fill:#102033}
    </style>
  </defs>
  <rect class="canvas" width="1480" height="760"/>
  <rect class="frame" x="24" y="24" width="1432" height="712" rx="24"/>
  <text class="title" x="740" y="66" text-anchor="middle">Redis-backed leader election</text>
  <text class="subtitle" x="740" y="94" text-anchor="middle">Every Spring Boot instance schedules the same jobs, but Redis-backed electors let only the elected instance run each job body.</text>

  <rect class="layer" x="72" y="132" width="344" height="504" rx="18"/>
  <text class="layerLabel" x="100" y="168">Spring Boot instance</text>
  <g filter="url(#shadow)">
    <rect x="112" y="210" width="264" height="108" rx="16" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.7"/>
    <text class="cardTitle" x="244" y="242" text-anchor="middle">Leader Election</text>
    <text class="cardTitle" x="244" y="270" text-anchor="middle">Config</text>
    <text class="cardText" x="244" y="298" text-anchor="middle">RedisClient + connections</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="112" y="364" width="264" height="118" rx="16" fill="#ECFDF5" stroke="#16A34A" stroke-width="1.7"/>
    <text class="cardTitle" x="244" y="396" text-anchor="middle">Leader Scheduled</text>
    <text class="cardTitle" x="244" y="424" text-anchor="middle">Job</text>
    <text class="cardText" x="244" y="452" text-anchor="middle">one try/catch per job</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="112" y="528" width="264" height="82" rx="16" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.7"/>
    <text class="cardTitle" x="244" y="554" text-anchor="middle">Suspend Leader</text>
    <text class="cardTitle" x="244" y="582" text-anchor="middle">Service</text>
  </g>

  <rect class="layer" x="460" y="132" width="390" height="504" rx="18"/>
  <text class="layerLabel" x="488" y="168">Leader workload</text>
  <g filter="url(#shadow)">
    <rect x="505" y="226" width="300" height="116" rx="16" fill="#FFF7ED" stroke="#D97706" stroke-width="1.7"/>
    <text class="cardTitle" x="655" y="266" text-anchor="middle">LeaderGuardedJob</text>
    <text class="cardText" x="655" y="294" text-anchor="middle">unique lockName per bean</text>
    <text class="cardText" x="655" y="318" text-anchor="middle">execute only on leader</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="505" y="396" width="300" height="142" rx="16" fill="#FFF7ED" stroke="#D97706" stroke-width="1.7"/>
    <text class="cardTitle" x="655" y="438" text-anchor="middle">Example jobs</text>
    <text class="cardText" x="655" y="468" text-anchor="middle">CacheWarmupJob</text>
    <text class="cardText" x="655" y="492" text-anchor="middle">StaleWorkflowCleanupJob</text>
    <text class="cardText" x="655" y="516" text-anchor="middle">LockAssert + LockExtender</text>
  </g>

  <rect class="layer" x="894" y="132" width="252" height="504" rx="18"/>
  <text class="layerLabel" x="922" y="168">bluetape4k leader</text>
  <g filter="url(#shadow)">
    <rect x="930" y="226" width="180" height="116" rx="16" fill="#ECFDF5" stroke="#16A34A" stroke-width="1.7"/>
    <text class="cardTitle" x="1020" y="258" text-anchor="middle">Listening</text>
    <text class="cardTitle" x="1020" y="286" text-anchor="middle">Elector</text>
    <text class="cardText" x="1020" y="314" text-anchor="middle">events + listeners</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="930" y="398" width="180" height="116" rx="16" fill="#EEF2FF" stroke="#6366F1" stroke-width="1.7"/>
    <text class="cardTitle" x="1020" y="430" text-anchor="middle">Suspend</text>
    <text class="cardTitle" x="1020" y="458" text-anchor="middle">Elector</text>
    <text class="cardText" x="1020" y="486" text-anchor="middle">dedicated connection</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="930" y="548" width="180" height="62" rx="16" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.7"/>
    <text class="cardTitle" x="1020" y="587" text-anchor="middle">Event Listener</text>
  </g>

  <rect class="layer" x="1190" y="132" width="218" height="504" rx="18"/>
  <text class="layerLabel" x="1218" y="168">Runtime store</text>
  <g filter="url(#shadow)">
    <rect x="1226" y="298" width="146" height="162" rx="16" fill="#FFF1F2" stroke="#DC2626" stroke-width="1.8"/>
    <g transform="translate(1264 326)">
      <path d="M 35 0 L 70 18 L 35 36 L 0 18 Z" fill="#DC2626"/>
      <path d="M 35 22 L 70 40 L 35 58 L 0 40 Z" fill="#EF4444"/>
      <path d="M 35 44 L 70 62 L 35 80 L 0 62 Z" fill="#F87171"/>
      <path d="M 35 0 L 70 18 L 35 36 L 0 18 Z" fill="none" stroke="#991B1B" stroke-width="2"/>
      <path d="M 35 22 L 70 40 L 35 58 L 0 40 Z" fill="none" stroke="#991B1B" stroke-width="2"/>
      <path d="M 35 44 L 70 62 L 35 80 L 0 62 Z" fill="none" stroke="#991B1B" stroke-width="2"/>
    </g>
    <text class="redisText" x="1299" y="428" text-anchor="middle">Redis</text>
    <text class="cardText" x="1299" y="452" text-anchor="middle">SET NX EX lock</text>
  </g>

  <path class="line" d="M 376 423 L 505 284" stroke="#C47A12" marker-end="url(#arrowAmber)"/>
  <path class="line" d="M 655 342 L 655 396" stroke="#C47A12" marker-end="url(#arrowAmber)"/>
  <path class="line" d="M 376 423 L 430 423 L 430 588 L 900 588 L 900 284 L 930 284" stroke="#16A34A" marker-end="url(#arrowGreen)"/>
  <path class="line" d="M 376 569 L 410 569 L 410 618 L 900 618 L 900 456 L 930 456" stroke="#2563EB" marker-end="url(#arrowBlue)"/>
  <path class="line" d="M 1110 284 L 1226 379" stroke="#16A34A" marker-end="url(#arrowGreen)"/>
  <path class="line" d="M 1110 456 L 1226 379" stroke="#2563EB" marker-end="url(#arrowBlue)"/>
  <path class="line" d="M 1110 284 L 1130 284 L 1130 579 L 1110 579" stroke="#DC2626" marker-end="url(#arrowRed)"/>
</svg>
