  <path class="line" d="M 838.4 342 L 838.4 396" stroke="#C47A12" marker-end="url(#arrowAmber)" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="line" d="M 481.28 423 L 537.6 423 Q 552.96 423 552.96 433 L 552.96 578 Q 552.96 588 563.2 588 L 1139.2 588 Q 1123.84 588 1123.84 578 L 1123.84 294 Q 1123.84 284 1164.8 284 L 1190.4 284" stroke="#16A34A" marker-end="url(#arrowGreen)" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="line" d="M 481.28 569 L 512 569 Q 552.96 569 552.96 579 L 552.96 608 Q 552.96 618 537.6 618 L 1139.2 618 Q 1123.84 618 1123.84 608 L 1123.84 466 Q 1123.84 456 1164.8 456 L 1190.4 456" stroke="#2563EB" marker-end="url(#arrowBlue)" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="line" d="M 1420.8 284 L 1569.28 379" stroke="#16A34A" marker-end="url(#arrowGreen)" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="line" d="M 1420.8 456 L 1569.28 379" stroke="#2563EB" marker-end="url(#arrowBlue)" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="line" d="M 1420.8 284 L 1434.88 284 Q 1446.4 284 1446.4 293 L 1446.4 570 Q 1446.4 579 1435.8 579 L 1420.8 579" stroke="#DC2626" marker-end="url(#arrowRed)" stroke-linecap="round" stroke-linejoin="round"/>
