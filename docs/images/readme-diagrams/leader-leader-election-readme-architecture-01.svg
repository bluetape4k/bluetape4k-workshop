<svg xmlns="http://www.w3.org/2000/svg" width="1894.4" height="760" viewBox="0 0 1894.4 760" role="img" aria-label="Leader election workshop architecture diagram">
  <defs>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="124%"><feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#64748B" flood-opacity="0.16" /></filter>
    <marker id="arrowBlue" markerWidth="14" markerHeight="14" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 12 12" data-role="primary" data-tip-direction="positive-x"><path d="M 0 0 L 12 6 L 0 12 Z" fill="#2563EB" stroke-dasharray="none" stroke-linecap="round" stroke-linejoin="round" stroke="#2563EB" stroke-width="0"/></marker>
    <marker id="arrowGreen" markerWidth="14" markerHeight="14" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 12 12" data-role="primary" data-tip-direction="positive-x"><path d="M 0 0 L 12 6 L 0 12 Z" fill="#16A34A" stroke-dasharray="none" stroke-linecap="round" stroke-linejoin="round" stroke="#16A34A" stroke-width="0"/></marker>
    <marker id="arrowAmber" markerWidth="14" markerHeight="14" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 12 12" data-role="primary" data-tip-direction="positive-x"><path d="M 0 0 L 12 6 L 0 12 Z" fill="#C47A12" stroke-dasharray="none" stroke-linecap="round" stroke-linejoin="round" stroke="#C47A12" stroke-width="0"/></marker>
    <marker id="arrowRed" markerWidth="14" markerHeight="14" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 12 12" data-role="primary" data-tip-direction="positive-x"><path d="M 0 0 L 12 6 L 0 12 Z" fill="#DC2626" stroke-dasharray="none" stroke-linecap="round" stroke-linejoin="round" stroke="#DC2626" stroke-width="0"/></marker>
    <style>
      .canvas{fill:#F8FAFC}.frame{fill:#FFFFFF;stroke:#D6E0E8;stroke-width:1.4}.layer{fill:#F8FAFC;stroke:#CBD5E1;stroke-width:1.4}.title{font-family:"Architects Daughter";font-size:36px;fill:#102033}.subtitle{font-family:"Comic Mono";font-size:14px;fill:#51606F}.layerLabel{font-family:"Architects Daughter";font-size:23px;fill:#263548}.cardTitle{font-family:"Architects Daughter";font-size:27px;fill:#102033}.cardText{font-family:"Comic Mono";font-size:14px;fill:#415166}.line{fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.redisText{font-family:"Architects Daughter";font-size:26px;fill:#102033}
    </style>
  </defs>
  <rect class="canvas" width="1894.4" height="760" />
  <rect class="frame" x="30.72" y="24" width="1832.96" height="712" rx="24" />  <text class="title" x="947.2" y="66" text-anchor="middle">Redis-backed leader election</text>  <text class="subtitle" x="947.2" y="94" text-anchor="middle">Every Spring Boot instance schedules the same jobs, but Redis-backed electors let only the elected instance run each job body.</text>

  <rect class="layer" x="92.16" y="132" width="440.32" height="504" rx="18" />
  <text class="layerLabel" x="128" y="168">Spring Boot instance</text>
  <g filter="url(#shadow)">
    <rect x="143.36" y="210" width="337.92" height="108" rx="16" fill="#EFF6FF" stroke="#2563EB" stroke-width="2.176" />
    <text class="cardTitle" x="312.32" y="242" text-anchor="middle">Leader Election</text>
    <text class="cardTitle" x="312.32" y="270" text-anchor="middle">Config</text>
    <text class="cardText" x="312.32" y="298" text-anchor="middle">RedisClient + connections</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="143.36" y="364" width="337.92" height="118" rx="16" fill="#ECFDF5" stroke="#16A34A" stroke-width="2.176" />
    <text class="cardTitle" x="312.32" y="396" text-anchor="middle">Leader Scheduled</text>
    <text class="cardTitle" x="312.32" y="424" text-anchor="middle">Job</text>
    <text class="cardText" x="312.32" y="452" text-anchor="middle">one try/catch per job</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="143.36" y="528" width="337.92" height="82" rx="16" fill="#F0FDFA" stroke="#0D9488" stroke-width="2.176" />
    <text class="cardTitle" x="312.32" y="554" text-anchor="middle">Suspend Leader</text>
    <text class="cardTitle" x="312.32" y="582" text-anchor="middle">Service</text>
  </g>

  <rect class="layer" x="588.8" y="132" width="499.2" height="504" rx="18" />
  <text class="layerLabel" x="624.64" y="168">Leader workload</text>
  <g filter="url(#shadow)">
    <rect x="646.4" y="226" width="384" height="116" rx="16" fill="#FFF7ED" stroke="#D97706" stroke-width="2.176" />
    <text class="cardTitle" x="838.4" y="266" text-anchor="middle">LeaderGuardedJob</text>
    <text class="cardText" x="838.4" y="294" text-anchor="middle">unique lockName per bean</text>
    <text class="cardText" x="838.4" y="318" text-anchor="middle">execute only on leader</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="646.4" y="396" width="384" height="142" rx="16" fill="#FFF7ED" stroke="#D97706" stroke-width="2.176" />
    <text class="cardTitle" x="838.4" y="438" text-anchor="middle">Example jobs</text>
    <text class="cardText" x="838.4" y="468" text-anchor="middle">CacheWarmupJob</text>
    <text class="cardText" x="838.4" y="492" text-anchor="middle">StaleWorkflowCleanupJob</text>
    <text class="cardText" x="838.4" y="516" text-anchor="middle">LockAssert + LockExtender</text>
  </g>

  <rect class="layer" x="1144.32" y="132" width="322.56" height="504" rx="18" />
  <text class="layerLabel" x="1180.16" y="168">bluetape4k leader</text>
  <g filter="url(#shadow)">
    <rect x="1190.4" y="226" width="230.4" height="116" rx="16" fill="#ECFDF5" stroke="#16A34A" stroke-width="2.176" />
    <text class="cardTitle" x="1305.6" y="258" text-anchor="middle">Listening</text>
    <text class="cardTitle" x="1305.6" y="286" text-anchor="middle">Elector</text>
    <text class="cardText" x="1305.6" y="314" text-anchor="middle">events + listeners</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="1190.4" y="398" width="230.4" height="116" rx="16" fill="#EEF2FF" stroke="#6366F1" stroke-width="2.176" />
    <text class="cardTitle" x="1305.6" y="430" text-anchor="middle">Suspend</text>
    <text class="cardTitle" x="1305.6" y="458" text-anchor="middle">Elector</text>
    <text class="cardText" x="1305.6" y="486" text-anchor="middle">dedicated connection</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="1190.4" y="548" width="230.4" height="62" rx="16" fill="#FEF2F2" stroke="#DC2626" stroke-width="2.176" />
    <text class="cardTitle" x="1305.6" y="587" text-anchor="middle">Event Listener</text>
  </g>

  <rect class="layer" x="1523.2" y="132" width="279.04" height="504" rx="18" />
  <text class="layerLabel" x="1559.04" y="168">Runtime store</text>
  <g filter="url(#shadow)">
    <rect x="1569.28" y="298" width="186.88" height="162" rx="16" fill="#FFF1F2" stroke="#DC2626" stroke-width="2.304" /><image data-bluetape4k-icon="redis" data-source="docs/icons/redis/redis-icon.svg" x="1640" y="326" width="48" height="48" href="data:image/svg+xml;base64," preserveAspectRatio="xMidYMid meet" />
    <text class="redisText" x="1662.72" y="428" text-anchor="middle">Redis</text>
    <text class="cardText" x="1662.72" y="452" text-anchor="middle">SET NX EX lock</text>
  </g>

