<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1050" viewBox="0 0 1600 1050" role="img" aria-labelledby="title desc"><title id="title">Deterministic Replay Sequence</title><desc id="desc">Hash verification precedes upcast and reduce; snapshots may accelerate but never own truth.</desc><defs><filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#64748B" flood-opacity="0.14"/></filter><marker id="seq-blue" viewBox="0 0 10 10" markerWidth="14" markerHeight="14" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#4F86C6" stroke="#4F86C6" stroke-dasharray="none"/></marker><marker id="seq-green" viewBox="0 0 10 10" markerWidth="14" markerHeight="14" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#6E8F4F" stroke="#6E8F4F" stroke-dasharray="none"/></marker><marker id="seq-amber" viewBox="0 0 10 10" markerWidth="14" markerHeight="14" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#9B7D54" stroke="#9B7D54" stroke-dasharray="none"/></marker><marker id="seq-red" viewBox="0 0 10 10" markerWidth="14" markerHeight="14" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#B86868" stroke="#B86868" stroke-dasharray="none"/></marker><marker id="seq-purple" viewBox="0 0 10 10" markerWidth="14" markerHeight="14" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#8065A8" stroke="#8065A8" stroke-dasharray="none"/></marker><marker id="seq-teal" viewBox="0 0 10 10" markerWidth="14" markerHeight="14" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#2D948C" stroke="#2D948C" stroke-dasharray="none"/></marker><style>
  .bg{fill:#F8FAFC}.frame{fill:#FFF;stroke:#CAD6DF;stroke-width:2}.alt{fill:none;stroke:#DFC69A;stroke-width:2}.zone{stroke-width:2}.blueZone{fill:#EFF6FF;stroke:#A8C7EA}.greenZone{fill:#F0F8F0;stroke:#B8D7AE}.purpleZone{fill:#F8F3FF;stroke:#D7C3EF}.amberZone{fill:#FFF7E8;stroke:#DFC69A}.title{font-family:"Architects Daughter";font-size:40px;fill:#263238}.subtitle,.body,.small,.msg,.footer{font-family:"Comic Mono";fill:#3E4C59}.subtitle{font-size:17px}.zoneTitle{font-family:"Architects Daughter";font-size:25px;fill:#344154}.cardTitle,.participant{font-family:"Architects Daughter";font-size:22px;fill:#16202A}.body{font-size:15px}.small{font-size:13px;fill:#5B6975}.footer{font-size:14px;fill:#60727D}.card{fill:#FFF;stroke:#9FB0BC;stroke-width:2}.blueCard{fill:#EFF6FF;stroke:#4F86C6}.greenCard{fill:#F0F8F0;stroke:#6E8F4F}.amberCard{fill:#FFF7E8;stroke:#9B7D54}.redCard{fill:#FFF0F0;stroke:#B86868}.purpleCard{fill:#F8F3FF;stroke:#8065A8}.edgePath{fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.blueEdge{stroke:#4F86C6;marker-end:url(#seq-blue)}.greenEdge{stroke:#6E8F4F;marker-end:url(#seq-green)}.amberEdge{stroke:#9B7D54;marker-end:url(#seq-amber)}.redEdge{stroke:#B86868;marker-end:url(#seq-red)}.purpleEdge{stroke:#8065A8;marker-end:url(#seq-purple)}.tealEdge{stroke:#2D948C;marker-end:url(#seq-teal)}.dashed{stroke-dasharray:9 7}.lifeline{stroke:#9AAAB1;stroke-width:2;stroke-dasharray:7 8}.activation{fill:#EAF6EF;stroke:#6F9278;stroke-width:1.5}.labelPill{fill:#FFF;stroke:#D7E0E4;stroke-width:1.5}.badge{font-family:"Comic Mono";font-size:13px;font-weight:700}.frameLabel{font-family:"Architects Daughter";font-size:18px;fill:#8B6A3E}
</style></defs><rect class="bg" width="1600" height="1050"/><rect class="frame" x="28" y="24" width="1544" height="1002" rx="22"/><text class="title" x="800" y="66" text-anchor="middle">Deterministic Replay Sequence</text><text class="subtitle" x="800" y="98" text-anchor="middle">Hash verification precedes upcast and reduce; snapshots may accelerate but never own truth.</text><g filter="url(#shadow)"><rect class="card" x="45" y="140" width="250" height="76" rx="12"/><text class="participant" x="170" y="171" text-anchor="middle">Use case</text><text class="small" x="170" y="196" text-anchor="middle">load aggregate</text></g><line class="lifeline" x1="170" y1="216" x2="170" y2="960"/><g filter="url(#shadow)"><rect class="card" x="360" y="140" width="250" height="76" rx="12"/><text class="participant" x="485" y="171" text-anchor="middle">Snapshot repo</text><text class="small" x="485" y="196" text-anchor="middle">optional seed</text></g><line class="lifeline" x1="485" y1="216" x2="485" y2="960"/><g filter="url(#shadow)"><rect class="card" x="675" y="140" width="250" height="76" rx="12"/><text class="participant" x="800" y="171" text-anchor="middle">Event store</text><text class="small" x="800" y="196" text-anchor="middle">ordered stream</text></g><line class="lifeline" x1="800" y1="216" x2="800" y2="960"/><g filter="url(#shadow)"><rect class="card" x="990" y="140" width="250" height="76" rx="12"/><text class="participant" x="1115" y="171" text-anchor="middle">Codec registry</text><text class="small" x="1115" y="196" text-anchor="middle">upcast + decode</text></g><line class="lifeline" x1="1115" y1="216" x2="1115" y2="960"/><g filter="url(#shadow)"><rect class="card" x="1305" y="140" width="250" height="76" rx="12"/><text class="participant" x="1430" y="171" text-anchor="middle">Reducer</text><text class="small" x="1430" y="196" text-anchor="middle">pure state fold</text></g><line class="lifeline" x1="1430" y1="216" x2="1430" y2="960"/><rect class="activation" x="162" y="300" width="16" height="540" rx="6"/><rect class="activation" x="477" y="350" width="16" height="130" rx="6"/><rect class="activation" x="792" y="490" width="16" height="250" rx="6"/><rect class="activation" x="1107" y="610" width="16" height="160" rx="6"/><rect class="activation" x="1422" y="680" width="16" height="160" rx="6"/><rect class="labelPill" x="143.5" y="288" width="368" height="32" rx="16"/><circle cx="163.5" cy="304" r="12" fill="#FFF" stroke="#9B7D54" stroke-width="2"/><text class="badge num" x="163.5" y="309" text-anchor="middle">1</text><text class="msg" x="183.5" y="309">load latest reducer-version snapshot</text><g class="edge" data-edge="message-1" data-label="load latest reducer-version snapshot"><path data-connector="message-1" class="edgePath amberEdge" style="marker-end:none" d="M170 330 L485 330"/><polygon data-connector-head="message-1" data-arrow-direction="right" points="485,330 471,322 471,338" fill="#9B7D54" stroke="#9B7D54" stroke-dasharray="none" style="stroke-dasharray:none"/></g><rect class="labelPill" x="194.5" y="353" width="266" height="32" rx="16"/><circle cx="214.5" cy="369" r="12" fill="#FFF" stroke="#2D948C" stroke-width="2"/><text class="badge num" x="214.5" y="374" text-anchor="middle">2</text><text class="msg" x="234.5" y="374">seed or absent / corrupt</text><g class="edge" data-edge="message-2" data-label="seed or absent / corrupt"><path data-connector="message-2" class="edgePath tealEdge" style="marker-end:none" d="M485 395 L170 395"/><polygon data-connector-head="message-2" data-arrow-direction="left" points="170,395 184,387 184,403" fill="#2D948C" stroke="#2D948C" stroke-dasharray="none" style="stroke-dasharray:none"/></g><rect class="labelPill" x="309.5" y="458" width="351" height="32" rx="16"/><circle cx="329.5" cy="474" r="12" fill="#FFF" stroke="#4F86C6" stroke-width="2"/><text class="badge num" x="329.5" y="479" text-anchor="middle">3</text><text class="msg" x="349.5" y="479">load stream after snapshot version</text><g class="edge" data-edge="message-3" data-label="load stream after snapshot version"><path data-connector="message-3" class="edgePath blueEdge" style="marker-end:none" d="M170 500 L800 500"/><polygon data-connector-head="message-3" data-arrow-direction="right" points="800,500 786,492 786,508" fill="#4F86C6" stroke="#4F86C6" stroke-dasharray="none" style="stroke-dasharray:none"/></g><rect class="labelPill" x="322.25" y="523" width="325.5" height="32" rx="16"/><circle cx="342.25" cy="539" r="12" fill="#FFF" stroke="#2D948C" stroke-width="2"/><text class="badge num" x="342.25" y="544" text-anchor="middle">4</text><text class="msg" x="362.25" y="544">events ordered by streamVersion</text><g class="edge" data-edge="message-4" data-label="events ordered by streamVersion"><path data-connector="message-4" class="edgePath tealEdge" style="marker-end:none" d="M800 565 L170 565"/><polygon data-connector-head="message-4" data-arrow-direction="left" points="170,565 184,557 184,573" fill="#2D948C" stroke="#2D948C" stroke-dasharray="none" style="stroke-dasharray:none"/></g><rect class="labelPill" x="301" y="588" width="368" height="32" rx="16"/><circle cx="321" cy="604" r="12" fill="#FFF" stroke="#B86868" stroke-width="2"/><text class="badge num" x="321" y="609" text-anchor="middle">5</text><text class="msg" x="341" y="609">verify previousHash + canonical hash</text><g class="edge" data-edge="message-5" data-label="verify previousHash + canonical hash"><path data-connector="message-5" class="edgePath redEdge" style="marker-end:none" d="M170 630 L800 630"/><polygon data-connector-head="message-5" data-arrow-direction="right" points="800,630 786,622 786,638" fill="#B86868" stroke="#B86868" stroke-dasharray="none" style="stroke-dasharray:none"/></g><rect class="labelPill" x="445.75" y="653" width="393.5" height="32" rx="16"/><circle cx="465.75" cy="669" r="12" fill="#FFF" stroke="#8065A8" stroke-width="2"/><text class="badge num" x="465.75" y="674" text-anchor="middle">6</text><text class="msg" x="485.75" y="674">decode schema version through upcasters</text><g class="edge" data-edge="message-6" data-label="decode schema version through upcasters"><path data-connector="message-6" class="edgePath purpleEdge" style="marker-end:none" d="M170 695 L1115 695"/><polygon data-connector-head="message-6" data-arrow-direction="right" points="1115,695 1101,687 1101,703" fill="#8065A8" stroke="#8065A8" stroke-dasharray="none" style="stroke-dasharray:none"/></g><rect class="labelPill" x="1147.5" y="718" width="250" height="32" rx="16"/><circle cx="1167.5" cy="734" r="12" fill="#FFF" stroke="#6E8F4F" stroke-width="2"/><text class="badge num" x="1167.5" y="739" text-anchor="middle">7</text><text class="msg" x="1187.5" y="739">evolve immutable state</text><g class="edge" data-edge="message-7" data-label="evolve immutable state"><path data-connector="message-7" class="edgePath greenEdge" style="marker-end:none" d="M1115 760 L1430 760"/><polygon data-connector-head="message-7" data-arrow-direction="right" points="1430,760 1416,752 1416,768" fill="#6E8F4F" stroke="#6E8F4F" stroke-dasharray="none" style="stroke-dasharray:none"/></g><rect class="labelPill" x="641.5" y="783" width="317" height="32" rx="16"/><circle cx="661.5" cy="799" r="12" fill="#FFF" stroke="#2D948C" stroke-width="2"/><text class="badge num" x="661.5" y="804" text-anchor="middle">8</text><text class="msg" x="681.5" y="804">same state, version, last hash</text><g class="edge" data-edge="message-8" data-label="same state, version, last hash"><path data-connector="message-8" class="edgePath tealEdge" style="marker-end:none" d="M1430 825 L170 825"/><polygon data-connector-head="message-8" data-arrow-direction="left" points="170,825 184,817 184,833" fill="#2D948C" stroke="#2D948C" stroke-dasharray="none" style="stroke-dasharray:none"/></g><rect class="alt" x="350" y="875" width="1100" height="60" rx="14"/><text class="frameLabel" x="375" y="902">loop per event</text><text class="small" x="535" y="902">tamper or broken schema chain fails closed; invalid snapshot restarts from genesis.</text><text class="footer" x="800" y="990" text-anchor="middle">Original stored payload and hash remain unchanged even when an older schema is upcast for today&apos;s reducer.</text></svg>