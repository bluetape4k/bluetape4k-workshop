<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1080" viewBox="0 0 1600 1080" role="img" aria-labelledby="title desc">
  <title id="title">docker-compose-plugin demo sequence</title>
  <desc id="desc">Sequence showing Gradle starting docker-compose services, exposing service info, setting redis.url, and running Redisson assertions.</desc>
  <defs>
    <style>
      svg{background:#f8fafc}.title{font-family:"Architects Daughter";font-size:40px;fill:#263238}.subtitle,.msg,.note,.footer{font-family:"Comic Mono";fill:#36464f}
      .subtitle{font-size:17px}.msg{font-size:14px}.note{font-size:13px}.footer{font-size:14px;fill:#60727d}.participant{font-family:"Architects Daughter";font-size:21px;fill:#1f3138}.role{font-family:"Comic Mono";font-size:13px;fill:#546a73}
      .frame{fill:#fbfcf8;stroke:#41545d;stroke-width:3}.header{fill:#fff;stroke:#546e7a;stroke-width:2}.lifeline{stroke:#9aaab1;stroke-width:2;stroke-dasharray:7 8}.activation{fill:#e6f2ec;stroke:#5b7e67;stroke-width:1.5}
      .call{fill:none;stroke:#3f7d9c;stroke-width:3;marker-end:url(#callArrow)}.compose{fill:none;stroke:#6e8f4f;stroke-width:3;marker-end:url(#composeArrow)}.service{fill:none;stroke:#9b6b2f;stroke-width:3;marker-end:url(#serviceArrow)}.return{fill:none;stroke:#9b7d54;stroke-width:2.5;stroke-dasharray:8 6;marker-end:url(#returnArrow)}
      .alt{fill:#fff;fill-opacity:.24;stroke:#78909c;stroke-width:3;stroke-dasharray:12 7}.branch{fill:#eef7f0;stroke:#6e8f4f;stroke-width:1.8}.label{fill:#fff;stroke:#d7e0e4;stroke-width:1.5}.callLabel{stroke:#9cc2d1}.composeLabel{stroke:#b6c9a4}.serviceLabel{stroke:#d2ad7c}.returnLabel{stroke:#c8b38f}
      .badge{stroke-width:1.8}.callBadge{fill:#eaf4f8;stroke:#3f7d9c}.composeBadge{fill:#eef7f0;stroke:#6e8f4f}.serviceBadge{fill:#fff4df;stroke:#9b6b2f}.returnBadge{fill:#fff7e8;stroke:#9b7d54}.badgeText{font-family:"Comic Mono";font-size:12px;font-weight:700}.callText,.badgeText.callText{fill:#2f6f8e}.composeText,.badgeText.composeText{fill:#55783f}.serviceText,.badgeText.serviceText{fill:#835a27}.returnText,.badgeText.returnText{fill:#7f6038}
    </style>
    <marker id="callArrow" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" viewBox="0 0 10 10" refX="9" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#3f7d9c"/></marker>
    <marker id="composeArrow" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" viewBox="0 0 10 10" refX="9" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#6e8f4f"/></marker>
    <marker id="serviceArrow" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" viewBox="0 0 10 10" refX="9" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#9b6b2f"/></marker>
    <marker id="returnArrow" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" viewBox="0 0 10 10" refX="9" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#9b7d54"/></marker>
  </defs>
  <rect x="24" y="24" width="1552" height="1032" rx="20" class="frame"/>
  <text x="800" y="78" text-anchor="middle" class="title">Gradle Compose Plugin Test Flow</text>
  <text x="800" y="108" text-anchor="middle" class="subtitle">Gradle starts Redis/PostgreSQL, exports service info, then the test consumes redis.url.</text>
  <rect x="80" y="150" width="170" height="68" rx="10" class="header"/><text x="165" y="179" text-anchor="middle" class="participant">Gradle</text><text x="165" y="201" text-anchor="middle" class="role">test task</text>
  <rect x="350" y="150" width="230" height="68" rx="10" class="header"/><text x="465" y="179" text-anchor="middle" class="participant">dockerCompose</text><text x="465" y="201" text-anchor="middle" class="role">Gradle plugin</text>
  <rect x="700" y="150" width="210" height="68" rx="10" class="header"/><text x="805" y="179" text-anchor="middle" class="participant">Docker Compose</text><text x="805" y="201" text-anchor="middle" class="role">redis + postgres</text>
  <rect x="1030" y="150" width="230" height="68" rx="10" class="header"/><text x="1145" y="179" text-anchor="middle" class="participant">System Properties</text><text x="1145" y="201" text-anchor="middle" class="role">redis.url, postgres.url</text>
  <rect x="1370" y="150" width="160" height="68" rx="10" class="header"/><text x="1450" y="179" text-anchor="middle" class="participant">Redisson</text><text x="1450" y="201" text-anchor="middle" class="role">client check</text>
  <line x1="165" y1="218" x2="165" y2="950" class="lifeline"/><line x1="465" y1="218" x2="465" y2="950" class="lifeline"/><line x1="805" y1="218" x2="805" y2="950" class="lifeline"/><line x1="1145" y1="218" x2="1145" y2="950" class="lifeline"/><line x1="1450" y1="218" x2="1450" y2="950" class="lifeline"/>
  <rect x="458" y="300" width="14" height="530" rx="6" class="activation"/><rect x="798" y="392" width="14" height="190" rx="6" class="activation"/><rect x="1138" y="620" width="14" height="140" rx="6" class="activation"/><rect x="1443" y="802" width="14" height="70" rx="6" class="activation"/>
  <rect x="70" y="260" width="1460" height="650" rx="14" class="alt"/><rect x="96" y="278" width="310" height="30" rx="15" class="branch"/><text x="118" y="298" class="note">test task isRequiredBy dockerCompose</text>
  <rect x="92" y="330" width="360" height="34" rx="17" class="label callLabel"/><circle cx="116" cy="347" r="13" class="badge callBadge"/><text x="116" y="352" text-anchor="middle" class="badgeText callText">1</text><text x="140" y="352" class="msg callText">./gradlew :docker-compose-plugin-demo:test</text><path d="M 165 386 L 465 386" class="call"/>
  <rect x="520" y="414" width="390" height="34" rx="17" class="label composeLabel"/><circle cx="544" cy="431" r="13" class="badge composeBadge"/><text x="544" y="436" text-anchor="middle" class="badgeText composeText">2</text><text x="568" y="436" class="msg composeText">compose files: redis + postgres</text><path d="M 472 478 L 805 478" class="compose"/>
  <rect x="588" y="540" width="440" height="34" rx="17" class="label serviceLabel"/><circle cx="612" cy="557" r="13" class="badge serviceBadge"/><text x="612" y="562" text-anchor="middle" class="badgeText serviceText">3</text><text x="636" y="562" class="msg serviceText">startedServices: redis, postgres; map host ports</text><path d="M 805 594 L 805 648" class="service"/>
  <rect x="630" y="660" width="430" height="34" rx="17" class="label returnLabel"/><circle cx="654" cy="677" r="13" class="badge returnBadge"/><text x="654" y="682" text-anchor="middle" class="badgeText returnText">4</text><text x="678" y="682" class="msg returnText">servicesInfos host + port available</text><path d="M 805 716 L 465 716" class="return"/>
  <rect x="820" y="700" width="402" height="34" rx="17" class="label callLabel"/><circle cx="844" cy="717" r="13" class="badge callBadge"/><text x="844" y="722" text-anchor="middle" class="badgeText callText">5</text><text x="868" y="722" class="msg callText">set redis.url and postgres.url</text><path d="M 465 760 L 1145 760" class="call"/>
  <rect x="1030" y="806" width="340" height="34" rx="17" class="label callLabel"/><circle cx="1054" cy="823" r="13" class="badge callBadge"/><text x="1054" y="828" text-anchor="middle" class="badgeText callText">6</text><text x="1078" y="828" class="msg callText">test reads System.getProperty(\"redis.url\")</text><path d="M 1145 862 L 1450 862" class="call"/>
  <rect x="1038" y="900" width="330" height="34" rx="17" class="label returnLabel"/><circle cx="1062" cy="917" r="13" class="badge returnBadge"/><text x="1062" y="922" text-anchor="middle" class="badgeText returnText">7</text><text x="1086" y="922" class="msg returnText">Redisson map write/read assertion</text><path d="M 1450 948 L 465 948" class="return"/>
  <text x="800" y="1010" text-anchor="middle" class="footer">PostgreSQL URL is injected for consumers even though the current test asserts only Redis.</text>
</svg>
