    <text class="cardTitle" x="249.879" y="292" text-anchor="middle">Client</text>
    <text class="cardText" x="249.879" y="324" text-anchor="middle">GET /users/{id}</text>
    <text class="cardText" x="249.879" y="350" text-anchor="middle">POST /users</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="133.774" y="480" width="232.211" height="132" rx="16" fill="#F8FAFC" stroke="#64748B" stroke-width="2.145"/><image data-bluetape4k-icon="prometheus" data-source="docs/icons/testcontainers/infra/prometheus.svg" x="147.8" y="503.0" width="30" height="30" href="data:image/svg+xml;base64," preserveAspectRatio="xMidYMid meet"/>  <text class="cardTitle" x="272" y="526" text-anchor="middle">Prometheus</text>
    <text class="cardText" x="249.879" y="558" text-anchor="middle">scrapes metrics</text>
    <text class="cardText" x="249.879" y="584" text-anchor="middle">after requests run</text>
  </g>

