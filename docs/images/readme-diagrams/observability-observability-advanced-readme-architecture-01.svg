<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="800" viewBox="0 0 1680 800" role="img" aria-label="Observability advanced architecture diagram">
  <defs>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="124%"><feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#64748B" flood-opacity="0.16"/></filter>
    <marker id="arrowBlue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 12 6 L 0 12 Z" fill="#2563EB" stroke-dasharray="none"/></marker>
    <marker id="arrowGreen" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 12 6 L 0 12 Z" fill="#16A34A" stroke-dasharray="none"/></marker>
    <marker id="arrowAmber" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 12 6 L 0 12 Z" fill="#D97706" stroke-dasharray="none"/></marker>
    <marker id="arrowSlate" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#475569" stroke-dasharray="none"/></marker>
    <style>
      .canvas{fill:#F8FAFC}.frame{fill:#FFFFFF;stroke:#D6E0E8;stroke-width:1.4}.layer{fill:#F8FAFC;stroke:#CBD5E1;stroke-width:1.4}.title{font-family:"Architects Daughter";font-size:38px;fill:#102033}.subtitle{font-family:"Comic Mono";font-size:15px;fill:#51606F}.layerLabel{font-family:"Architects Daughter";font-size:24px;fill:#263548}.cardTitle{font-family:"Architects Daughter";font-size:29px;fill:#102033}.cardText{font-family:"Comic Mono";font-size:15px;fill:#415166}.small{font-family:"Comic Mono";font-size:13px;fill:#64748B}.line{fill:none;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round}.soft{stroke-dasharray:8 8}
    </style>
  <marker id="arrowSlate-e11d48" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path stroke-dasharray="none" d="M 0 0 L 10 5 L 0 10 Z" fill="#e11d48"/></marker>
<marker id="arrowSlate-0891b2" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path stroke-dasharray="none" d="M 0 0 L 10 5 L 0 10 Z" fill="#0891b2"/></marker>
<marker id="arrowSlate-64748b" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path stroke-dasharray="none" d="M 0 0 L 10 5 L 0 10 Z" fill="#64748b"/></marker>
</defs>
  <rect class="canvas" width="1680" height="800"/>
  <rect class="frame" x="24" y="24" width="1632" height="752" rx="24"/>
  <text class="title" x="840" y="70" text-anchor="middle">Advanced observability architecture</text>
  <text class="subtitle" x="840" y="102" text-anchor="middle">WebFlux requests produce nested Micrometer observations while Actuator exposes metrics without driving user work.</text>

  <rect class="layer" x="68" y="142" width="258" height="606" rx="18"/>
  <text class="layerLabel" x="96" y="180">HTTP entry</text>
  <g filter="url(#shadow)">
    <rect x="106" y="246" width="184" height="128" rx="16" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.7"/>
    <text class="cardTitle" x="198" y="292" text-anchor="middle">Client</text>
    <text class="cardText" x="198" y="324" text-anchor="middle">GET /users/{id}</text>
    <text class="cardText" x="198" y="350" text-anchor="middle">POST /users</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="106" y="480" width="184" height="132" rx="16" fill="#F8FAFC" stroke="#64748B" stroke-width="1.7"/>  <text class="cardTitle" x="198" y="526" text-anchor="middle">Prometheus</text>
    <text class="cardText" x="198" y="558" text-anchor="middle">scrapes metrics</text>
    <text class="cardText" x="198" y="584" text-anchor="middle">after requests run</text>
  </g>

  <rect class="layer" x="384" y="142" width="328" height="606" rx="18"/>
  <text class="layerLabel" x="412" y="180">Spring WebFlux app</text>
  <g filter="url(#shadow)">
    <rect x="424" y="222" width="248" height="120" rx="16" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.7"/>
    <text class="cardTitle" x="548" y="266" text-anchor="middle">UserController</text>
    <text class="cardText" x="548" y="298" text-anchor="middle">suspend endpoints</text>
    <text class="cardText" x="548" y="324" text-anchor="middle">HTTP span parent</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="424" y="418" width="248" height="132" rx="16" fill="#F0FDF4" stroke="#16A34A" stroke-width="1.7"/>
    <text class="cardTitle" x="548" y="464" text-anchor="middle">UserService</text>
    <text class="cardText" x="548" y="496" text-anchor="middle">cache-aside decision</text>
    <text class="cardText" x="548" y="522" text-anchor="middle">user.service.* spans</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="424" y="626" width="248" height="88" rx="16" fill="#FFF7ED" stroke="#D97706" stroke-width="1.7"/>
    <text class="cardTitle" x="548" y="664" text-anchor="middle">Actuator</text>
    <text class="cardText" x="548" y="694" text-anchor="middle">health, info, metrics</text>
  </g>

  <rect class="layer" x="770" y="142" width="342" height="606" rx="18"/>
  <text class="layerLabel" x="798" y="180">Instrumentation</text>
  <g filter="url(#shadow)">
    <rect x="812" y="230" width="258" height="136" rx="16" fill="#F8FAFC" stroke="#475569" stroke-width="1.7"/>
    <text class="cardTitle" x="941" y="274" text-anchor="middle">observed()</text>
    <text class="cardText" x="941" y="306" text-anchor="middle">start / scope / error</text>
    <text class="cardText" x="941" y="332" text-anchor="middle">finally stop</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="812" y="470" width="258" height="136" rx="16" fill="#F0FDF4" stroke="#16A34A" stroke-width="1.7"/>
    <text class="cardTitle" x="941" y="514" text-anchor="middle">ObservationRegistry</text>
    <text class="cardText" x="941" y="546" text-anchor="middle">parent-child spans</text>
    <text class="cardText" x="941" y="572" text-anchor="middle">coroutine context</text>
  </g>

  <rect class="layer" x="1170" y="142" width="442" height="606" rx="18"/>
  <text class="layerLabel" x="1198" y="180">State backends</text>
  <g filter="url(#shadow)">
    <rect x="1210" y="218" width="166" height="138" rx="16" fill="#FFF1F2" stroke="#E11D48" stroke-width="1.7"/>
    <image x="1267" y="242" width="52" height="52" href="data:image/svg+xml;base64," preserveAspectRatio="xMidYMid meet"/>
    <text class="cardTitle" x="1293" y="318" text-anchor="middle">Redis</text>
    <text class="cardText" x="1293" y="344" text-anchor="middle">RMapCache TTL</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="1410" y="218" width="166" height="138" rx="16" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.7"/>
    <image x="1467" y="238" width="52" height="52" href="data:image/svg+xml;base64," preserveAspectRatio="xMidYMid meet"/>
    <text class="cardTitle" x="1493" y="330" text-anchor="middle">H2 DB</text>
    <text class="cardText" x="1493" y="354" text-anchor="middle">Exposed JDBC</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="1238" y="500" width="306" height="126" rx="16" fill="#ECFEFF" stroke="#0891B2" stroke-width="1.7"/>
    <text class="cardTitle" x="1391" y="544" text-anchor="middle">OTel Bridge</text>
    <text class="cardText" x="1391" y="576" text-anchor="middle">tracing configured</text>
    <text class="cardText" x="1391" y="602" text-anchor="middle">export disabled locally</text>
  </g>

  <path class="line" d="M 290 310 L 424 282" stroke="#2563EB" marker-end="url(#arrowBlue)" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="line" d="M 548 342 L 548 418" stroke="#16A34A" marker-end="url(#arrowGreen)" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="line" d="M 672 448 L 742 448 L 742 298 L 812 298" stroke="#475569" marker-end="url(#arrowSlate)" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="line" d="M 941 366 L 941 470" stroke="#16A34A" marker-end="url(#arrowGreen)" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="line" d="M 672 486 L 756 486 L 756 388 L 1140 388 L 1140 287 L 1210 287" stroke="#E11D48" marker-end="url(#arrowSlate-e11d48)" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="line" d="M 672 522 L 732 522 L 732 408 L 1493 408 L 1493 356" stroke="#2563EB" marker-end="url(#arrowBlue)" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="line" d="M 1070 538 L 1238 563" stroke="#0891B2" marker-end="url(#arrowSlate-0891b2)" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="line soft" d="M 290 546 L 424 670" stroke="#64748B" marker-end="url(#arrowSlate-64748b)" stroke-linecap="round" stroke-linejoin="round"/>
  <text class="small" x="352" y="626" text-anchor="middle">scrape only</text>
</svg>
