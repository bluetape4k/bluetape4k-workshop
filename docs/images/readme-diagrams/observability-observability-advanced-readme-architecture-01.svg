  <rect class="canvas" width="2120.186" height="800"/>
  <rect class="frame" x="30.288" y="24" width="2059.609" height="752" rx="24"/>
  <text class="title" x="1060.093" y="70" text-anchor="middle">Advanced observability architecture</text>
  <text class="subtitle" x="1060.093" y="102" text-anchor="middle">WebFlux requests produce nested Micrometer observations while Actuator exposes metrics without driving user work.</text>

  <rect class="layer" x="85.817" y="142" width="325.6" height="606" rx="18"/>
  <text class="layerLabel" x="121.153" y="180">HTTP entry</text>
  <g filter="url(#shadow)">
