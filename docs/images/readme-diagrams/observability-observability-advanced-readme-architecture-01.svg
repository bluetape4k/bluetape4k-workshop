    <text class="cardText" x="691.584" y="522" text-anchor="middle">user.service.* spans</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="535.095" y="626" width="312.98" height="88" rx="16" fill="#FFF7ED" stroke="#D97706" stroke-width="2.145"/>
    <text class="cardTitle" x="691.584" y="664" text-anchor="middle">Actuator</text>
    <text class="cardText" x="691.584" y="694" text-anchor="middle">health, info, metrics</text>
  </g>

  <rect class="layer" x="971.752" y="142" width="431.609" height="606" rx="18"/>
  <text class="layerLabel" x="1007.088" y="180">Instrumentation</text>
  <g filter="url(#shadow)">
