<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" role="img" aria-label="Spring Data Redis Architecture">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#1f2937" flood-opacity="0.10"/></filter>
  <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M1,1 L8,4.5 L1,8 Z" fill="#758297"/></marker>
  <style>
    .canvas{fill:#f7f9fc}.frame{fill:#fff;stroke:#d8e0ea;stroke-width:1.5}
    .title{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:38px;font-weight:400;fill:#102033}
    .subtitle{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:14px;font-weight:400;fill:#536273}
    .smallLabel{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:21px;font-weight:400;fill:#102033}
    .small{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#536273}
    .card{stroke-width:2.1;filter:url(#shadow)}
    .line{stroke:#758297;stroke-width:2.1;fill:none;marker-end:url(#arrow)}
  </style>
</defs>
<rect class="canvas" width="960" height="440"/>
<rect class="frame" x="24" y="20" width="912" height="396" rx="16"/>
<text class="title" x="48" y="66">Spring Data Redis Architecture</text>
<text class="subtitle" x="48" y="90">StringRedisTemplate · RedisTemplate · PersonRepository (@RedisHash) → Redis Testcontainers</text>

<!-- Row 1: API layer -->
<rect class="card" x="50" y="108" width="200" height="60" rx="8" fill="#E8F3FF" stroke="#5B8DEF"/>
<text class="smallLabel" x="150" y="136" text-anchor="middle">StringRedisTemplate</text>
<text class="small" x="150" y="155" text-anchor="middle">String operations</text>

<rect class="card" x="380" y="108" width="200" height="60" rx="8" fill="#EAF7EF" stroke="#58A978"/>
<text class="smallLabel" x="480" y="136" text-anchor="middle">RedisTemplate</text>
<text class="small" x="480" y="155" text-anchor="middle">Generic operations</text>

<rect class="card" x="710" y="108" width="200" height="60" rx="8" fill="#FFF3D9" stroke="#D6A441"/>
<text class="smallLabel" x="810" y="136" text-anchor="middle">PersonRepository</text>
<text class="small" x="810" y="155" text-anchor="middle">CrudRepository (@RedisHash)</text>

<!-- Row 2: Operations layer -->
<rect class="card" x="50" y="228" width="200" height="60" rx="8" fill="#FDECEF" stroke="#DC6B82"/>
<text class="smallLabel" x="150" y="256" text-anchor="middle">ValueOperations</text>
<text class="small" x="150" y="275" text-anchor="middle">GET / SET / INCR</text>

<rect class="card" x="380" y="228" width="200" height="60" rx="8" fill="#F1ECFF" stroke="#8A72D6"/>
<text class="smallLabel" x="480" y="256" text-anchor="middle">HashOperations</text>
<text class="small" x="480" y="275" text-anchor="middle">HGET / HSET / HMGET</text>

<rect class="card" x="710" y="228" width="200" height="60" rx="8" fill="#E9F7F6" stroke="#45A7A1"/>
<text class="smallLabel" x="810" y="256" text-anchor="middle">Reactive Redis</text>
<text class="small" x="810" y="275" text-anchor="middle">ReactiveRedisTemplate</text>

<!-- Row 3: Redis Server -->
<rect class="card" x="200" y="350" width="560" height="52" rx="8" fill="#FFF3D9" stroke="#D6A441"/>
<text class="smallLabel" x="480" y="378" text-anchor="middle">Redis Server (Testcontainers)</text>
<text class="small" x="480" y="394" text-anchor="middle">String · Hash · List · Set · ZSet · Stream · Pub/Sub</text>

<!-- Arrows -->
<path class="line" d="M150 168 L150 228"/>
<path class="line" d="M480 168 L480 228"/>
<path class="line" d="M810 168 L810 228"/>
<!-- Operations -> Redis -->
<path class="line" d="M150 288 L150 332 L350 332 L350 350"/>
<path class="line" d="M480 288 L480 332 L480 350"/>
<path class="line" d="M810 288 L810 332 L650 332 L650 350"/>
</svg>
