<svg xmlns="http://www.w3.org/2000/svg" width="1624" height="1434" viewBox="0 0 1624 1434" role="img" aria-label="Security Filter Chain (WebFlux)">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#1f2937" flood-opacity="0.10"/></filter>
  <marker id="openArrow" markerWidth="10" markerHeight="8" refX="8.5" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M 1 1 L 8.5 4 L 1 7" fill="none" stroke="#758297" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <marker id="inherit" markerWidth="11" markerHeight="10" refX="9.5" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 1 L 9.5 5 L 0.5 9 Z" fill="#ffffff" stroke="#758297" stroke-width="1.7"/></marker>
  <style>
    .canvas{fill:#f7f9fc}.frame{fill:#fff;stroke:#d8e0ea;stroke-width:1.5}
    .title{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:43px;font-weight:400;fill:#102033}
    .subtitle{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:15px;font-weight:400;fill:#536273}
    .label{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:25px;font-weight:400;fill:#102033}
    .smallLabel{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:21px;font-weight:400;fill:#102033}
    .mono{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#102033}
    .small{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#536273}
    .strong{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:13px;font-weight:400;fill:#102033}
    .card{stroke-width:2.1;filter:url(#shadow)}.compartment{stroke-width:1.5;fill:none}
    .line{stroke:#758297;stroke-width:2.1;fill:none;marker-end:url(#openArrow)}
    .plainLine{stroke:#758297;stroke-width:2.1;fill:none}
    .dashed{stroke:#758297;stroke-width:2.1;stroke-dasharray:7 6;fill:none;marker-end:url(#openArrow)}
    .inheritLine{stroke:#758297;stroke-width:2.2;fill:none;marker-end:url(#inherit)}
    .implLine{stroke:#758297;stroke-width:2.2;stroke-dasharray:8 7;fill:none;marker-end:url(#inherit)}
  </style>
</defs>
<rect class="canvas" width="1624" height="1434"/>
<rect class="frame" x="32" y="28" width="1560" height="1378" rx="28"/>
<text class="title" x="66" y="82">Security Filter Chain (WebFlux)</text>
<text class="subtitle" x="70" y="118">Sequence messages from the original Mermaid source</text>
<rect class="card" x="-10" y="166" width="300" height="72" rx="20" fill="#E8F3FF" stroke="#5B8DEF"/>
<text class="smallLabel" x="140" y="209" text-anchor="middle">Browser</text>
<line class="lifeline" x1="140" y1="252" x2="140" y2="1374" stroke="#b7c2d1" stroke-width="2" stroke-dasharray="10 10"/>
<rect class="card" x="438" y="166" width="300" height="72" rx="20" fill="#EAF7EF" stroke="#58A978"/>
<text class="smallLabel" x="588" y="198.5" text-anchor="middle">Security Web Filter</text>
<text class="smallLabel" x="588" y="219.5" text-anchor="middle">Chain</text>
<line class="lifeline" x1="588" y1="252" x2="588" y2="1374" stroke="#b7c2d1" stroke-width="2" stroke-dasharray="10 10"/>
<rect class="card" x="886" y="166" width="300" height="72" rx="20" fill="#FFF3D9" stroke="#D6A441"/>
<text class="smallLabel" x="1036" y="198.5" text-anchor="middle">Map Reactive User</text>
<text class="smallLabel" x="1036" y="219.5" text-anchor="middle">Details Service</text>
<line class="lifeline" x1="1036" y1="252" x2="1036" y2="1374" stroke="#b7c2d1" stroke-width="2" stroke-dasharray="10 10"/>
<rect class="card" x="1334" y="166" width="300" height="72" rx="20" fill="#FDECEF" stroke="#DC6B82"/>
<text class="smallLabel" x="1484" y="209" text-anchor="middle">MainController</text>
<line class="lifeline" x1="1484" y1="252" x2="1484" y2="1374" stroke="#b7c2d1" stroke-width="2" stroke-dasharray="10 10"/>
<rect x="259" y="286" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="277" y="313" text-anchor="start">1. GET /user/index</text>
<path class="line" d="M140 344 L588 344"/>
<rect x="489" y="396" width="294" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="507" y="423" text-anchor="start">2. check authorization (Reactor)</text>
<path class="line" d="M588 454 C652 454 652 488 588 488"/>
<rect x="70" y="526" width="1484" height="40" rx="16" fill="#F7F1E7" stroke="#B88A44" stroke-width="1.6" opacity="0.96"/>
<text class="strong" x="92" y="553" text-anchor="start">ALT: not authenticated</text>
<rect x="259" y="594" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="277" y="621" text-anchor="start">4. redirect /log-in</text>
<path class="dashed" d="M588 652 L140 652"/>
<rect x="257" y="704" width="214" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="275" y="731" text-anchor="start">5. POST /log-in (form)</text>
<path class="line" d="M140 762 L588 762"/>
<rect x="656.5" y="814" width="311" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="674.5" y="841" text-anchor="start">6. authenticate (BCrypt, reactive)</text>
<path class="line" d="M588 872 L1036 872"/>
<rect x="701" y="924" width="222" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="719" y="951" text-anchor="start">7. Mono&lt;Authentication&gt;</text>
<path class="dashed" d="M1036 982 L588 982"/>
<rect x="253" y="1034" width="222" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="271" y="1061" text-anchor="start">8. redirect /user/index</text>
<path class="dashed" d="M588 1092 L140 1092"/>
<rect x="913" y="1144" width="246" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="931" y="1171" text-anchor="start">9. authorized Mono request</text>
<path class="line" d="M588 1202 L1484 1202"/>
<rect x="707" y="1254" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="725" y="1281" text-anchor="start">10. 200 user page</text>
<path class="dashed" d="M1484 1312 L140 1312"/>
</svg>
