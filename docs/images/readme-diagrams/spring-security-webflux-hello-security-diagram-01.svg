<svg xmlns="http://www.w3.org/2000/svg" width="920" height="420" viewBox="0 0 920 420" role="img" aria-label="Spring Security WebFlux Hello Architecture">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%">
    <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#1f2937" flood-opacity="0.10"/>
  </filter>
  <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth">
    <path d="M1,1 L8,4.5 L1,8 Z" fill="#758297"/>
  </marker>
  <style>
    .canvas{fill:#f7f9fc}.frame{fill:#fff;stroke:#d8e0ea;stroke-width:1.5}
    .title{font-family:"Architects Daughter";font-size:38px;font-weight:400;fill:#102033}
    .subtitle{font-family:"Comic Mono";font-size:14px;font-weight:400;fill:#536273}
    .smallLabel{font-family:"Architects Daughter";font-size:21px;font-weight:400;fill:#102033}
    .mono{font-family:"Comic Mono";font-size:12px;font-weight:400;fill:#102033}
    .small{font-family:"Comic Mono";font-size:12px;font-weight:400;fill:#536273}
    .card{stroke-width:2.1;filter:url(#shadow)}
    .line{stroke:#758297;stroke-width:2.1;fill:none;marker-end:url(#arrow)}
  </style>
</defs>
<rect class="canvas" width="920" height="420"/>
<rect class="frame" x="24" y="20" width="872" height="376" rx="20"/>
<text class="title" x="48" y="66">Spring Security WebFlux Hello</text>
<text class="subtitle" x="48" y="90">SecurityWebFilterChain · ServerHttpSecurity · MapReactiveUserDetailsService · httpBasic</text>

<!-- Col 1: Security Config -->
<rect class="card" x="48" y="108" width="244" height="36" rx="8" fill="#EAF7EF" stroke="#58A978"/>
<text class="smallLabel" x="170" y="132" text-anchor="middle">Security Config</text>

<rect class="card" x="48" y="156" width="244" height="172" rx="12" fill="#ffffff" stroke="#58A978" stroke-width="1.8" filter="url(#shadow)"/>
<text class="mono" x="170" y="178" text-anchor="middle" fill="#102033">SecurityConfiguration</text>
<line x1="48" y1="188" x2="292" y2="188" stroke="#58A978" stroke-width="1"/>
<text class="small" x="68" y="208" fill="#536273">SecurityWebFilterChain</text>
<text class="small" x="68" y="224" fill="#536273">authorizeExchange {</text>
<text class="small" x="68" y="240" fill="#536273">  /public/** permitAll</text>
<text class="small" x="68" y="256" fill="#536273">  /user/** ROLE_USER</text>
<text class="small" x="68" y="272" fill="#536273">  anyExchange authenticated</text>
<text class="small" x="68" y="292" fill="#536273">}</text>
<text class="small" x="68" y="308" fill="#536273">httpBasic { } formLogin { }</text>

<!-- Arrow -->
<path class="line" d="M294 228 L354 228"/>

<!-- Col 2: User Details -->
<rect class="card" x="356" y="108" width="200" height="36" rx="8" fill="#E8F3FF" stroke="#5B8DEF"/>
<text class="smallLabel" x="456" y="132" text-anchor="middle">User Details</text>

<rect class="card" x="356" y="156" width="200" height="172" rx="12" fill="#ffffff" stroke="#5B8DEF" stroke-width="1.8" filter="url(#shadow)"/>
<text class="mono" x="456" y="178" text-anchor="middle" fill="#102033">MapReactiveUser</text>
<text class="mono" x="456" y="194" text-anchor="middle" fill="#102033">DetailsService</text>
<line x1="356" y1="204" x2="556" y2="204" stroke="#5B8DEF" stroke-width="1"/>
<text class="small" x="376" y="224" fill="#536273">username: "user"</text>
<text class="small" x="376" y="240" fill="#536273">password: bcrypt</text>
<text class="small" x="376" y="256" fill="#536273">role: ROLE_USER</text>
<text class="small" x="376" y="280" fill="#536273">ReactiveAuthentication</text>
<text class="small" x="376" y="296" fill="#536273">Manager</text>

<!-- Arrow -->
<path class="line" d="M558 228 L618 228"/>

<!-- Col 3: Controllers -->
<rect class="card" x="620" y="108" width="252" height="36" rx="8" fill="#FFF3D9" stroke="#D6A441"/>
<text class="smallLabel" x="746" y="132" text-anchor="middle">Handlers</text>

<rect class="card" x="620" y="156" width="252" height="72" rx="10" fill="#ffffff" stroke="#D6A441" stroke-width="1.8" filter="url(#shadow)"/>
<text class="mono" x="746" y="182" text-anchor="middle" fill="#102033">HomeController</text>
<text class="small" x="746" y="198" text-anchor="middle">GET / → public access</text>
<text class="small" x="746" y="213" text-anchor="middle">GET /public → permitAll</text>

<rect class="card" x="620" y="240" width="252" height="72" rx="10" fill="#ffffff" stroke="#DC6B82" stroke-width="1.8" filter="url(#shadow)"/>
<text class="mono" x="746" y="266" text-anchor="middle" fill="#102033">UserController</text>
<text class="small" x="746" y="282" text-anchor="middle">GET /user → ROLE_USER</text>
<text class="small" x="746" y="298" text-anchor="middle">suspend fun (reactive)</text>

<!-- Bottom note -->
<rect class="card" x="48" y="344" width="824" height="40" rx="10" fill="#f1f5f9" stroke="#d8e0ea" filter="url(#shadow)"/>
<text class="small" x="460" y="362" text-anchor="middle" fill="#536273">Spring Security Kotlin WebFlux DSL — ServerHttpSecurity lambda configuration</text>
<text class="small" x="460" y="377" text-anchor="middle" fill="#536273">webflux/hello-security module — reactive security filter chain</text>
</svg>
