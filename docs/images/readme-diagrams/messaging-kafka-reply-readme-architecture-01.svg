<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="760" viewBox="0 0 1500 760" role="img" aria-label="Kafka reply architecture diagram">
  <defs>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="124%"><feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#64748B" flood-opacity="0.16"/></filter>
    <marker id="arrowBlue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 12 6 L 0 12 Z" fill="#2563EB" stroke-dasharray="none"/></marker>
    <marker id="arrowGreen" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 12 6 L 0 12 Z" fill="#16A34A" stroke-dasharray="none"/></marker>
    <marker id="arrowAmber" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 12 6 L 0 12 Z" fill="#C47A12" stroke-dasharray="none"/></marker>
    <style>
      .canvas{fill:#F8FAFC}.frame{fill:#FFFFFF;stroke:#D6E0E8;stroke-width:1.4}.layer{fill:#F8FAFC;stroke:#CBD5E1;stroke-width:1.4}.title{font-family:"Architects Daughter";font-size:36px;fill:#102033}.subtitle{font-family:"Comic Mono";font-size:14px;fill:#51606F}.layerLabel{font-family:"Architects Daughter";font-size:23px;fill:#263548}.cardTitle{font-family:"Architects Daughter";font-size:27px;fill:#102033}.cardText{font-family:"Comic Mono";font-size:14px;fill:#415166}.line{fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.kafkaText{font-family:"Architects Daughter";font-size:27px;fill:#102033}
    </style>
  </defs>
  <rect class="canvas" width="1500" height="760"/>
  <rect class="frame" x="24" y="24" width="1452" height="712" rx="24"/>  <text class="title" x="750" y="66" text-anchor="middle">Kafka request-reply architecture</text>
  <text class="subtitle" x="750" y="94" text-anchor="middle">PingApplication sends through ReplyingKafkaTemplate; PongApplication replies with @SendTo through Kafka topics.</text>

  <rect class="layer" x="64" y="132" width="282" height="510" rx="18"/>
  <text class="layerLabel" x="92" y="168">HTTP client</text>
  <g filter="url(#shadow)">
    <rect x="104" y="318" width="202" height="112" rx="16" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.7"/>
    <text class="cardTitle" x="205" y="362" text-anchor="middle">GET /ping</text>
    <text class="cardText" x="205" y="394" text-anchor="middle">expects pong body</text>
  </g>

  <rect class="layer" x="390" y="132" width="386" height="510" rx="18"/>
  <text class="layerLabel" x="418" y="168">PingApplication</text>
  <g filter="url(#shadow)">
    <rect x="430" y="206" width="276" height="106" rx="16" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.7"/>
    <text class="cardTitle" x="568" y="248" text-anchor="middle">PingController</text>
    <text class="cardText" x="568" y="278" text-anchor="middle">suspend GET handler</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="430" y="358" width="276" height="128" rx="16" fill="#ECFDF5" stroke="#16A34A" stroke-width="1.7"/>
    <text class="cardTitle" x="568" y="400" text-anchor="middle">ReplyingKafkaTemplate</text>
    <text class="cardText" x="568" y="430" text-anchor="middle">sendAndReceive(record)</text>
    <text class="cardText" x="568" y="454" text-anchor="middle">onSuccess / onFailure</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="430" y="526" width="276" height="84" rx="16" fill="#FFF7ED" stroke="#D97706" stroke-width="1.7"/>
    <text class="cardTitle" x="568" y="562" text-anchor="middle">Reply listener</text>
    <text class="cardText" x="568" y="588" text-anchor="middle">container topic: replies</text>
  </g>

  <rect class="layer" x="820" y="132" width="298" height="510" rx="18"/>  <text class="layerLabel" x="848" y="168">Kafka runtime</text>
  <g filter="url(#shadow)">
    <rect x="862" y="200" width="214" height="126" rx="16" fill="#F8FAFC" stroke="#111827" stroke-width="1.7"/>
    <g transform="translate(912 220)">
      <circle cx="22" cy="48" r="13" fill="#111827"/>
      <circle cx="72" cy="20" r="13" fill="#111827"/>
      <circle cx="72" cy="76" r="13" fill="#111827"/>
      <path d="M 34 42 L 60 27" stroke="#111827" stroke-width="5" stroke-linecap="round"/>
      <path d="M 34 54 L 60 70" stroke="#111827" stroke-width="5" stroke-linecap="round"/>
    </g>  <text class="kafkaText" x="969" y="306" text-anchor="middle">Kafka</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="862" y="370" width="214" height="100" rx="16" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.7"/>
    <text class="cardTitle" x="969" y="408" text-anchor="middle">pingpong</text>
    <text class="cardText" x="969" y="438" text-anchor="middle">request topic</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="862" y="510" width="214" height="100" rx="16" fill="#FFF7ED" stroke="#D97706" stroke-width="1.7"/>
    <text class="cardTitle" x="969" y="548" text-anchor="middle">replies</text>
    <text class="cardText" x="969" y="578" text-anchor="middle">reply topic</text>
  </g>

  <rect class="layer" x="1162" y="132" width="274" height="510" rx="18"/>
  <text class="layerLabel" x="1190" y="168">PongApplication</text>
  <g filter="url(#shadow)">
    <rect x="1198" y="328" width="202" height="128" rx="16" fill="#ECFDF5" stroke="#16A34A" stroke-width="1.7"/>
    <text class="cardTitle" x="1299" y="374" text-anchor="middle">PongHandler</text>
    <text class="cardText" x="1299" y="406" text-anchor="middle">@KafkaListener</text>
    <text class="cardText" x="1299" y="430" text-anchor="middle">@SendTo reply</text>
  </g>

  <path class="line" d="M 306 374 L 370 374 L 370 259 L 430 259" stroke="#2563EB" marker-end="url(#arrowBlue)" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="line" d="M 568 312 L 568 358" stroke="#16A34A" marker-end="url(#arrowGreen)" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="line" d="M 706 422 L 862 422" stroke="#2563EB" marker-end="url(#arrowBlue)" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="line" d="M 1076 420 L 1148 420 L 1148 392 L 1198 392" stroke="#16A34A" marker-end="url(#arrowGreen)" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="line" d="M 1198 428 L 1138 428 L 1138 560 L 1076 560" stroke="#C47A12" marker-end="url(#arrowAmber)" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="line" d="M 862 560 L 784 560 L 784 568 L 706 568" stroke="#C47A12" marker-end="url(#arrowAmber)" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
