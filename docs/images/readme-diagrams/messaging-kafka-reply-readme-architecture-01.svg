<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="760" viewBox="0 0 1920 760" role="img" aria-label="Kafka reply architecture diagram">
  <defs>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="124%"><feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#64748B" flood-opacity="0.16"/></filter>
    <marker id="arrowBlue" markerWidth="16" markerHeight="16" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 12 12" data-role="sequence" data-tip-direction="positive-x"><path d="M 0 0 L 12 6 L 0 12 Z" fill="#2563EB" stroke-dasharray="none" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="arrowGreen" markerWidth="16" markerHeight="16" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 12 12" data-role="sequence" data-tip-direction="positive-x"><path d="M 0 0 L 12 6 L 0 12 Z" fill="#16A34A" stroke-dasharray="none" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="arrowAmber" markerWidth="16" markerHeight="16" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 12 12" data-role="sequence" data-tip-direction="positive-x"><path d="M 0 0 L 12 6 L 0 12 Z" fill="#C47A12" stroke-dasharray="none" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <style>
      .canvas{fill:#F8FAFC}.frame{fill:#FFFFFF;stroke:#D6E0E8;stroke-width:1.4}.layer{fill:#F8FAFC;stroke:#CBD5E1;stroke-width:1.4}.title{font-family:"Architects Daughter";font-size:36px;fill:#102033}.subtitle{font-family:"Comic Mono";font-size:14px;fill:#51606F}.layerLabel{font-family:"Architects Daughter";font-size:23px;fill:#263548}.cardTitle{font-family:"Architects Daughter";font-size:27px;fill:#102033}.cardText{font-family:"Comic Mono";font-size:14px;fill:#415166}.line{fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.kafkaText{font-family:"Architects Daughter";font-size:27px;fill:#102033}
    </style>
  </defs>
  <rect class="canvas" width="1920" height="760"/>
  <rect class="frame" x="30.72" y="24" width="1858.56" height="712" rx="24"/>  <text class="title" x="960" y="66" text-anchor="middle">Kafka request-reply architecture</text>
  <text class="subtitle" x="960" y="94" text-anchor="middle">PingApplication sends through ReplyingKafkaTemplate; PongApplication replies with @SendTo through Kafka topics.</text>

  <rect class="layer" x="81.92" y="132" width="360.96" height="510" rx="18"/>
  <text class="layerLabel" x="117.76" y="168">HTTP client</text>
  <g filter="url(#shadow)">
    <rect x="133.12" y="318" width="258.56" height="112" rx="16" fill="#EFF6FF" stroke="#2563EB" stroke-width="2.176"/>
    <text class="cardTitle" x="262.4" y="362" text-anchor="middle">GET /ping</text>
    <text class="cardText" x="262.4" y="394" text-anchor="middle">expects pong body</text>
  </g>

  <rect class="layer" x="499.2" y="132" width="494.08" height="510" rx="18"/>
  <text class="layerLabel" x="535.04" y="168">PingApplication</text>
  <g filter="url(#shadow)">
    <rect x="550.4" y="206" width="353.28" height="106" rx="16" fill="#EFF6FF" stroke="#2563EB" stroke-width="2.176"/>
    <text class="cardTitle" x="727.04" y="248" text-anchor="middle">PingController</text>
    <text class="cardText" x="727.04" y="278" text-anchor="middle">suspend GET handler</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="550.4" y="358" width="353.28" height="128" rx="16" fill="#ECFDF5" stroke="#16A34A" stroke-width="2.176"/>
    <text class="cardTitle" x="727.04" y="400" text-anchor="middle">ReplyingKafkaTemplate</text>
    <text class="cardText" x="727.04" y="430" text-anchor="middle">sendAndReceive(record)</text>
    <text class="cardText" x="727.04" y="454" text-anchor="middle">onSuccess / onFailure</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="550.4" y="526" width="353.28" height="84" rx="16" fill="#FFF7ED" stroke="#D97706" stroke-width="2.176"/>
    <text class="cardTitle" x="727.04" y="562" text-anchor="middle">Reply listener</text>
    <text class="cardText" x="727.04" y="588" text-anchor="middle">container topic: replies</text>
  </g>

  <rect class="layer" x="1049.6" y="132" width="381.44" height="510" rx="18"/><text class="layerLabel" x="1085.44" y="168">Kafka runtime</text>
  <g filter="url(#shadow)">
    <rect x="1103.36" y="200" width="273.92" height="126" rx="16" fill="#F8FAFC" stroke="#111827" stroke-width="2.176"/>
    <image data-bluetape4k-icon="kafka" data-source="docs/icons/messaging/kafka.svg" x="1213.16" y="219" width="42" height="42" href="data:image/svg+xml;base64," preserveAspectRatio="xMidYMid meet"/>
    <text class="kafkaText" x="1240.32" y="306" text-anchor="middle">Kafka</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="1103.36" y="370" width="273.92" height="100" rx="16" fill="#EFF6FF" stroke="#2563EB" stroke-width="2.176"/><image data-bluetape4k-icon="kafka" data-source="docs/icons/testcontainers/mq/apache-kafka.svg" x="1118.72" y="403" width="34" height="34" href="data:image/svg+xml;base64," preserveAspectRatio="xMidYMid meet"/>
    <text class="cardTitle" x="1240.32" y="408" text-anchor="middle">pingpong</text>
    <text class="cardText" x="1240.32" y="438" text-anchor="middle">request topic</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="1103.36" y="510" width="273.92" height="100" rx="16" fill="#FFF7ED" stroke="#D97706" stroke-width="2.176"/><image data-bluetape4k-icon="kafka" data-source="docs/icons/testcontainers/mq/apache-kafka.svg" x="1118.72" y="543" width="34" height="34" href="data:image/svg+xml;base64," preserveAspectRatio="xMidYMid meet"/>
    <text class="cardTitle" x="1240.32" y="548" text-anchor="middle">replies</text>
    <text class="cardText" x="1240.32" y="578" text-anchor="middle">reply topic</text>
  </g>

  <rect class="layer" x="1487.36" y="132" width="350.72" height="510" rx="18"/>
  <text class="layerLabel" x="1523.2" y="168">PongApplication</text>
  <g filter="url(#shadow)">
    <rect x="1533.44" y="328" width="258.56" height="128" rx="16" fill="#ECFDF5" stroke="#16A34A" stroke-width="2.176"/>
    <text class="cardTitle" x="1662.72" y="374" text-anchor="middle">PongHandler</text>
    <text class="cardText" x="1662.72" y="406" text-anchor="middle">@KafkaListener</text>
    <text class="cardText" x="1662.72" y="430" text-anchor="middle">@SendTo reply</text>
  </g>

  <path class="line" d="M 391.68 374 L 460.8 374 Q 473.6 374 473.6 364 L 473.6 269 Q 473.6 259 486.4 259 L 550.4 259" stroke="#2563EB" marker-end="url(#arrowBlue)" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="line" d="M 727.04 312 L 727.04 358" stroke="#16A34A" marker-end="url(#arrowGreen)" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="line" d="M 903.68 422 L 1103.36 422" stroke="#2563EB" marker-end="url(#arrowBlue)" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="line" d="M 1377.28 420 L 1456.64 420 Q 1469.44 420 1469.44 410 L 1469.44 402 Q 1469.44 392 1482.24 392 L 1533.44 392" stroke="#16A34A" marker-end="url(#arrowGreen)" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="line" d="M 1533.44 428 L 1469.44 428 Q 1456.64 428 1456.64 438 L 1456.64 550 Q 1456.64 560 1443.84 560 L 1377.28 560" stroke="#C47A12" marker-end="url(#arrowAmber)" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="line" d="M 1103.36 560 L 1007.36 560 Q 1003.52 560 1003.52 563 L 1003.52 565 Q 1003.52 568 999.68 568 L 903.68 568" stroke="#C47A12" marker-end="url(#arrowAmber)" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
