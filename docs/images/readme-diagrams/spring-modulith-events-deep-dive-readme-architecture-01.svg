<svg xmlns="http://www.w3.org/2000/svg" width="1760" height="940" viewBox="0 0 1760 940">
  <defs>
    <style>
      .bg{fill:#f8fafc}.title{font-family:'Architects Daughter','Comic Sans MS',cursive;font-size:34px;fill:#18212f}
      .layer-title{font-family:'Architects Daughter','Comic Sans MS',cursive;font-size:26px;fill:#344154}
      .card-title{font-family:'Architects Daughter','Comic Sans MS',cursive;font-size:27px;fill:#101827}
      .body{font-family:'Comic Mono','Comic Sans MS',monospace;font-size:18px;fill:#364152}.small{font-family:'Comic Mono','Comic Sans MS',monospace;font-size:15px;fill:#475569}
      .layer{stroke-width:1.5;rx:22;ry:22}.card{fill:#fff;stroke:#cbd5e1;stroke-width:1.5;rx:18;ry:18}.line{fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L11,6 L1,11 Z" fill="#2563eb" stroke-dasharray="none"/></marker>
    <marker id="arrow-green" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L11,6 L1,11 Z" fill="#059669" stroke-dasharray="none"/></marker>
  </defs>
  <rect class="bg" width="1760" height="940"/>
  <text class="title" x="70" y="70">Spring Modulith Events Deep Dive</text>

  <rect class="layer" x="70" y="120" width="1620" height="190" fill="#eff6ff" stroke="#bfdbfe"/>
  <text class="layer-title" x="105" y="165">Fundamentals</text>
  <rect class="card" x="140" y="205" width="650" height="70"/>
  <text class="card-title" x="170" y="248">Quickstart events</text>
  <text class="body" x="430" y="248">publisher + listeners</text>
  <rect class="card" x="970" y="205" width="650" height="70"/>
  <text class="card-title" x="1000" y="248">Spring Data aggregate events</text>

  <rect class="layer" x="70" y="365" width="1620" height="190" fill="#f0fdf4" stroke="#bbf7d0"/>
  <text class="layer-title" x="105" y="410">Transactions</text>
  <rect class="card" x="555" y="450" width="650" height="70"/>
  <text class="card-title" x="585" y="485">Transactional publication</text>
  <text class="body" x="585" y="512">plain vs after-commit listener</text>

  <rect class="layer" x="70" y="610" width="1620" height="220" fill="#faf5ff" stroke="#ddd6fe"/>
  <text class="layer-title" x="105" y="655">Architecture comparison</text>
  <rect class="card" x="140" y="700" width="650" height="80"/>
  <text class="card-title" x="170" y="742">Before</text>
  <text class="body" x="170" y="770">OrderManagement calls Inventory directly</text>
  <rect class="card" x="970" y="700" width="650" height="80"/>
  <text class="card-title" x="1000" y="742">After</text>
  <text class="body" x="1000" y="770">OrderCompleted crosses module boundary</text>

  <path class="line" d="M 465 275 L 465 325 Q 465 335 475 335 L 870 335 Q 880 335 880 345 L 880 450" stroke="#2563eb" marker-end="url(#arrow)" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="line" d="M 1295 275 L 1295 325 Q 1295 335 1285 335 L 880 335" stroke="#2563eb" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="line" d="M 880 520 L 880 575 Q 880 585 870 585 L 475 585 Q 465 585 465 595 L 465 700" stroke="#059669" marker-end="url(#arrow-green)" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="line" d="M 880 585 L 1285 585 Q 1295 585 1295 595 L 1295 700" stroke="#059669" marker-end="url(#arrow-green)" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
