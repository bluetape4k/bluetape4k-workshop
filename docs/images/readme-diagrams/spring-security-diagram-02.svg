<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" role="img" aria-label="Spring Security Filter Chain Comparison">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%">
    <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#1f2937" flood-opacity="0.10"/>
  </filter>
  <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth">
    <path d="M1,1 L8,4.5 L1,8 Z" fill="#758297"/>
  </marker>
  <style>
    .canvas{fill:#f7f9fc}.frame{fill:#fff;stroke:#d8e0ea;stroke-width:1.5}
    .title{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:38px;font-weight:400;fill:#102033}
    .subtitle{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:14px;font-weight:400;fill:#536273}
    .smallLabel{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:21px;font-weight:400;fill:#102033}
    .mono{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#102033}
    .small{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#536273}
    .card{stroke-width:2.1;filter:url(#shadow)}
    .line{stroke:#758297;stroke-width:2.1;fill:none;marker-end:url(#arrow)}
  </style>
</defs>
<rect class="canvas" width="960" height="440"/>
<rect class="frame" x="24" y="20" width="912" height="396" rx="20"/>
<text class="title" x="48" y="66">Spring Security Filter Chain Comparison</text>
<text class="subtitle" x="48" y="90">SecurityFilterChain (MVC) vs SecurityWebFilterChain (WebFlux) — DSL configuration</text>

<!-- Left: MVC SecurityFilterChain -->
<rect class="card" x="48" y="108" width="420" height="280" rx="14" fill="#E8F3FF" stroke="#5B8DEF"/>
<text class="smallLabel" x="258" y="133" text-anchor="middle">SecurityFilterChain (MVC)</text>
<line x1="48" y1="145" x2="468" y2="145" stroke="#5B8DEF" stroke-width="1"/>
<text class="mono" x="68" y="167" fill="#102033">http {</text>
<text class="mono" x="68" y="183" fill="#102033">  authorizeHttpRequests {</text>
<text class="mono" x="68" y="199" fill="#102033">    authorize("/public/**", permitAll)</text>
<text class="mono" x="68" y="215" fill="#102033">    authorize("/user/**",</text>
<text class="mono" x="68" y="231" fill="#102033">      hasAuthority("ROLE_USER"))</text>
<text class="mono" x="68" y="247" fill="#102033">    authorize(anyRequest, authenticated)</text>
<text class="mono" x="68" y="263" fill="#102033">  }</text>
<text class="mono" x="68" y="279" fill="#102033">  formLogin {</text>
<text class="mono" x="68" y="295" fill="#102033">    loginPage = "/log-in"</text>
<text class="mono" x="68" y="311" fill="#102033">  }</text>
<text class="mono" x="68" y="327" fill="#102033">}</text>
<text class="small" x="68" y="352" fill="#536273">InMemoryUserDetailsManager</text>
<text class="small" x="68" y="368" fill="#536273">BCryptPasswordEncoder</text>

<!-- Right: WebFlux SecurityWebFilterChain -->
<rect class="card" x="492" y="108" width="420" height="280" rx="14" fill="#EAF7EF" stroke="#58A978"/>
<text class="smallLabel" x="702" y="133" text-anchor="middle">SecurityWebFilterChain (WebFlux)</text>
<line x1="492" y1="145" x2="912" y2="145" stroke="#58A978" stroke-width="1"/>
<text class="mono" x="512" y="167" fill="#102033">http {</text>
<text class="mono" x="512" y="183" fill="#102033">  authorizeExchange {</text>
<text class="mono" x="512" y="199" fill="#102033">    authorize("/public/**", permitAll)</text>
<text class="mono" x="512" y="215" fill="#102033">    authorize("/user/**",</text>
<text class="mono" x="512" y="231" fill="#102033">      hasAuthority("ROLE_USER"))</text>
<text class="mono" x="512" y="247" fill="#102033">    authorize(anyExchange, authenticated)</text>
<text class="mono" x="512" y="263" fill="#102033">  }</text>
<text class="mono" x="512" y="279" fill="#102033">  httpBasic { }</text>
<text class="mono" x="512" y="295" fill="#102033">  formLogin { }</text>
<text class="mono" x="512" y="311" fill="#102033">}</text>
<text class="small" x="512" y="352" fill="#536273">MapReactiveUserDetailsService</text>
<text class="small" x="512" y="368" fill="#536273">ServerHttpSecurity DSL</text>

<!-- Bottom note -->
<rect class="card" x="48" y="400" width="864" height="28" rx="8" fill="#f1f5f9" stroke="#d8e0ea" filter="url(#shadow)"/>
<text class="small" x="480" y="419" text-anchor="middle" fill="#536273">Both use Kotlin DSL security configuration — servlet vs reactive runtime</text>
</svg>
