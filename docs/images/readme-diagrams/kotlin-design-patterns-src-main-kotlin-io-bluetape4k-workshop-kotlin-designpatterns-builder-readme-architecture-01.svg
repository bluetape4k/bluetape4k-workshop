  <rect class="canvas" width="1447.341" height="620"/>
  <rect class="frame" x="26.315" y="24" width="1394.711" height="572" rx="24"/>
  <text class="title" x="723.671" y="66" text-anchor="middle">Builder</text>
  <text class="subtitle" x="723.671" y="94" text-anchor="middle">Hero.Builder separates required identity from optional appearance and equipment choices.</text>

  <g filter="url(#shadow)"><rect x="89.911" y="184" width="263.153" height="94" rx="16" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.864"/><text class="cardTitle" x="221.487" y="220" text-anchor="middle">Required input</text><text class="cardText" x="221.487" y="250" text-anchor="middle">profession and name</text></g>
  <g filter="url(#shadow)"><rect x="440.781" y="150" width="302.626" height="162" rx="16" fill="#ECFDF5" stroke="#16A34A" stroke-width="1.864"/><text class="cardTitle" x="592.094" y="188" text-anchor="middle">Hero.Builder</text><text class="cardText" x="592.094" y="220" text-anchor="middle">withHairType</text><text class="cardText" x="592.094" y="244" text-anchor="middle">withHairColor</text><text class="cardText" x="592.094" y="268" text-anchor="middle">withArmor, withWeapon</text></g>
  <g filter="url(#shadow)"><rect x="831.125" y="184" width="263.153" height="94" rx="16" fill="#FFF7ED" stroke="#D97706" stroke-width="1.864"/><text class="cardTitle" x="962.701" y="220" text-anchor="middle">build()</text><text class="cardText" x="962.701" y="250" text-anchor="middle">private Hero constructor</text></g>
  <g filter="url(#shadow)"><rect x="1181.995" y="184" width="186.4" height="94" rx="16" fill="#F8FAFC" stroke="#64748B" stroke-width="1.864"/><text class="cardTitle" x="1275.195" y="220" text-anchor="middle">Hero</text><text class="cardText" x="1275.195" y="250" text-anchor="middle">read-only values</text></g>

  <g filter="url(#shadow)"><rect x="278.504" y="396" width="890.334" height="92" rx="16" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.864"/><text class="cardTitle" x="723.671" y="432" text-anchor="middle">Kotlin alternative: HeroDataClass</text><text class="cardText" x="723.671" y="462" text-anchor="middle">Default nullable properties can replace a builder when invariants are simple.</text></g>

