<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="884" viewBox="0 0 1060 884" role="img" aria-label="Spring Data R2DBC Demo Diagram 1">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#1f2937" flood-opacity="0.10"/></filter>
  <marker id="arrowBlue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M1 1 L7 4 L1 7 Z" fill="#5b8def"/></marker>
  <marker id="arrowTeal" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M1 1 L7 4 L1 7 Z" fill="#45a7a1"/></marker>
  <style>
    .canvas{fill:#f7f9fc}
    .frame{fill:#ffffff;stroke:#d8e0ea;stroke-width:1.5}
    .title{font-family:"Architects Daughter";font-size:34px;fill:#102033}
    .subtitle{font-family:"Comic Mono";font-size:13px;fill:#536273}
    .actor{font-family:"Architects Daughter";font-size:17px;fill:#102033}
    .detail{font-family:"Comic Mono";font-size:11px;fill:#536273}
    .message{font-family:"Comic Mono";font-size:12px;fill:#263445;paint-order:stroke;stroke:#ffffff;stroke-width:4px;stroke-linejoin:round}
    .branch{font-family:"Architects Daughter";font-size:15px;fill:#1f3b57}
    .lifeline{stroke:#b8c4d3;stroke-width:1.4;stroke-dasharray:7 6}
    .call{stroke:#5b8def;stroke-width:2.1;fill:none;marker-end:url(#arrowBlue)}
    .return{stroke:#45a7a1;stroke-width:2;stroke-dasharray:7 5;fill:none;marker-end:url(#arrowTeal)}
    .box{stroke-width:1.8;filter:url(#shadow)}
  </style>
</defs>
<rect class="canvas" width="1060" height="884"/>
<rect class="frame" x="24" y="20" width="1012" height="844" rx="18"/>
<text class="title" x="48" y="58">Spring Data R2DBC Demo Diagram 1</text>
<text class="subtitle" x="50" y="84">sequenceDiagram rendered from the current README model; labels are separated from connector lanes</text>
<rect class="box" x="46" y="116" width="152" height="58" rx="10" fill="#e8f3ff" stroke="#7aa0c4"/>
<text class="actor" x="122" y="145" text-anchor="middle" dominant-baseline="middle">Test</text>
<line class="lifeline" x1="122" y1="174" x2="122" y2="826"/>
<rect class="box" x="318" y="116" width="152" height="58" rx="10" fill="#eaf7ef" stroke="#7aa0c4"/>
<text class="actor" x="394" y="145" text-anchor="middle" dominant-baseline="middle">CoroutineCrudRepository</text>
<line class="lifeline" x1="394" y1="174" x2="394" y2="826"/>
<rect class="box" x="590" y="116" width="152" height="58" rx="10" fill="#fff3d9" stroke="#7aa0c4"/>
<text class="actor" x="666" y="145" text-anchor="middle" dominant-baseline="middle">R2DBC Driver (H2)</text>
<line class="lifeline" x1="666" y1="174" x2="666" y2="826"/>
<rect class="box" x="862" y="116" width="152" height="58" rx="10" fill="#f1ecff" stroke="#7aa0c4"/>
<text class="actor" x="938" y="145" text-anchor="middle" dominant-baseline="middle">In-Memory H2</text>
<line class="lifeline" x1="938" y1="174" x2="938" y2="826"/>
<rect x="78" y="188" width="360" height="24" rx="6" fill="#ffffff" opacity="0.92" stroke="#dbe3ee"/>
<text class="message" x="258" y="201" text-anchor="middle" dominant-baseline="middle">1. findAll() : Flow&lt;Customer&gt;</text>
<path class="call" d="M122 218 L394 218"/>
<rect x="350" y="242" width="360" height="24" rx="6" fill="#ffffff" opacity="0.92" stroke="#dbe3ee"/>
<text class="message" x="530" y="255" text-anchor="middle" dominant-baseline="middle">2. SELECT (reactive publisher)</text>
<path class="call" d="M394 272 L666 272"/>
<rect x="350" y="296" width="360" height="24" rx="6" fill="#ffffff" opacity="0.92" stroke="#dbe3ee"/>
<text class="message" x="530" y="309" text-anchor="middle" dominant-baseline="middle">3. Flux&lt;Row&gt;</text>
<path class="return" d="M666 326 L394 326"/>
<rect x="78" y="350" width="360" height="24" rx="6" fill="#ffffff" opacity="0.92" stroke="#dbe3ee"/>
<text class="message" x="258" y="363" text-anchor="middle" dominant-baseline="middle">4. Flow&lt;Customer&gt; (backpressure-aware)</text>
<path class="return" d="M394 380 L122 380"/>
<rect x="78" y="404" width="88" height="24" rx="6" fill="#ffffff" opacity="0.92" stroke="#dbe3ee"/>
<text class="message" x="122" y="403" text-anchor="middle" dominant-baseline="middle">5. flow.toList() -</text>
<text class="message" x="122" y="417" text-anchor="middle" dominant-baseline="middle">collect under</text>
<text class="message" x="122" y="431" text-anchor="middle" dominant-baseline="middle">coroutine scope</text>
<path class="call" d="M122 434 L122 434"/>
<rect x="78" y="458" width="360" height="24" rx="6" fill="#ffffff" opacity="0.92" stroke="#dbe3ee"/>
<text class="message" x="258" y="471" text-anchor="middle" dominant-baseline="middle">6. save(customer) - suspend</text>
<path class="call" d="M122 488 L394 488"/>
<rect x="350" y="512" width="360" height="24" rx="6" fill="#ffffff" opacity="0.92" stroke="#dbe3ee"/>
<text class="message" x="530" y="525" text-anchor="middle" dominant-baseline="middle">7. INSERT (Mono publisher)</text>
<path class="call" d="M394 542 L666 542"/>
<rect x="622" y="566" width="360" height="24" rx="6" fill="#ffffff" opacity="0.92" stroke="#dbe3ee"/>
<text class="message" x="802" y="579" text-anchor="middle" dominant-baseline="middle">8. execute SQL</text>
<path class="call" d="M666 596 L938 596"/>
<rect x="622" y="620" width="360" height="24" rx="6" fill="#ffffff" opacity="0.92" stroke="#dbe3ee"/>
<text class="message" x="802" y="633" text-anchor="middle" dominant-baseline="middle">9. rows updated</text>
<path class="return" d="M938 650 L666 650"/>
<rect x="350" y="674" width="360" height="24" rx="6" fill="#ffffff" opacity="0.92" stroke="#dbe3ee"/>
<text class="message" x="530" y="687" text-anchor="middle" dominant-baseline="middle">10. Mono&lt;Customer&gt;</text>
<path class="return" d="M666 704 L394 704"/>
<rect x="78" y="728" width="360" height="24" rx="6" fill="#ffffff" opacity="0.92" stroke="#dbe3ee"/>
<text class="message" x="258" y="741" text-anchor="middle" dominant-baseline="middle">11. Customer (suspend, no callback)</text>
<path class="return" d="M394 758 L122 758"/>
</svg>
