  <circle cx="1177.7" cy="637" r="13" class="badge workBadge"/><text x="1177.7" y="642" text-anchor="middle" class="badgeText workText">5</text>
  <text x="1201.7" y="642" class="msg workText">SELECT NEXT VALUE FOR primary_key</text>
  <path d="M 1170.0 668 L 1500.0 668" class="work" stroke-linecap="round" stroke-linejoin="round"/>
