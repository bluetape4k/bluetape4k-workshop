<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="1192" viewBox="0 0 1060 1192" role="img" aria-label="Spring Data R2DBC Demo Diagram 1">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#1f2937" flood-opacity="0.10"/></filter>
  <marker id="arrowBlue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M1 1 L7 4 L1 7 Z" fill="#5b8def"/></marker>
  <marker id="arrowTeal" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M1 1 L7 4 L1 7 Z" fill="#45a7a1"/></marker>
  <style>
    .canvas{fill:#f7f9fc}
    .frame{fill:#ffffff;stroke:#d8e0ea;stroke-width:1.5}
    .title{font-family:"Architects Daughter";font-size:34px;fill:#102033}
    .subtitle{font-family:"Comic Mono";font-size:13px;fill:#536273}
    .actor{font-family:"Architects Daughter";font-size:17px;fill:#102033}
    .detail{font-family:"Comic Mono";font-size:11px;fill:#536273}
    .message{font-family:"Comic Mono";font-size:12px;fill:#263445;paint-order:stroke;stroke:#ffffff;stroke-width:4px;stroke-linejoin:round}
    .branch{font-family:"Architects Daughter";font-size:15px;fill:#1f3b57}
    .lifeline{stroke:#b8c4d3;stroke-width:1.4;stroke-dasharray:7 6}
    .call{stroke:#5b8def;stroke-width:2.1;fill:none;marker-end:url(#arrowBlue)}
    .return{stroke:#45a7a1;stroke-width:2;stroke-dasharray:7 5;fill:none;marker-end:url(#arrowTeal)}
    .box{stroke-width:1.8;filter:url(#shadow)}
  </style>
</defs>
<rect class="canvas" width="1060" height="1192"/>
<rect class="frame" x="24" y="20" width="1012" height="1152" rx="18"/>
<text class="title" x="48" y="58">Spring Data R2DBC Demo Diagram 1</text>
<text class="subtitle" x="50" y="84">sequenceDiagram rendered from the current README model; labels are separated from connector lanes</text>
<rect class="box" x="30" y="116" width="184" height="58" rx="10" fill="#e8f3ff" stroke="#7aa0c4"/>
<text class="actor" x="122" y="145" text-anchor="middle" dominant-baseline="middle">Test</text>
<line class="lifeline" x1="122" y1="174" x2="122" y2="1134"/>
<rect class="box" x="302" y="116" width="184" height="58" rx="10" fill="#eaf7ef" stroke="#7aa0c4"/>
<text class="actor" x="394" y="138" text-anchor="middle" dominant-baseline="middle">Coroutine Crud</text>
<text class="actor" x="394" y="152" text-anchor="middle" dominant-baseline="middle">Repository</text>
<line class="lifeline" x1="394" y1="174" x2="394" y2="1134"/>
<rect class="box" x="574" y="116" width="184" height="58" rx="10" fill="#fff3d9" stroke="#7aa0c4"/>
<text class="actor" x="666" y="145" text-anchor="middle" dominant-baseline="middle">R2 DBC Driver (H2)</text>
<line class="lifeline" x1="666" y1="174" x2="666" y2="1134"/>
<rect class="box" x="846" y="116" width="184" height="58" rx="10" fill="#f1ecff" stroke="#7aa0c4"/>
<text class="actor" x="938" y="145" text-anchor="middle" dominant-baseline="middle">In-Memory H2</text>
<line class="lifeline" x1="938" y1="174" x2="938" y2="1134"/>
<rect x="78" y="176" width="360" height="26" rx="6" fill="#ffffff" opacity="0.95" stroke="#dbe3ee"/>
<text class="message" x="258" y="189" text-anchor="middle" dominant-baseline="middle">1. findAll() : Flow&lt;Customer&gt;</text>
<path class="call" d="M122 218 L394 218"/>
<rect x="350" y="258" width="360" height="26" rx="6" fill="#ffffff" opacity="0.95" stroke="#dbe3ee"/>
<text class="message" x="530" y="271" text-anchor="middle" dominant-baseline="middle">2. SELECT (reactive publisher)</text>
<path class="call" d="M394 300 L666 300"/>
<rect x="350" y="340" width="360" height="26" rx="6" fill="#ffffff" opacity="0.95" stroke="#dbe3ee"/>
<text class="message" x="530" y="353" text-anchor="middle" dominant-baseline="middle">3. Flux&lt;Row&gt;</text>
<path class="return" d="M666 382 L394 382"/>
<rect x="78" y="422" width="360" height="26" rx="6" fill="#ffffff" opacity="0.95" stroke="#dbe3ee"/>
<text class="message" x="258" y="435" text-anchor="middle" dominant-baseline="middle">4. Flow&lt;Customer&gt; (backpressure-aware)</text>
<path class="return" d="M394 464 L122 464"/>
<rect x="78" y="476" width="88" height="54" rx="6" fill="#ffffff" opacity="0.95" stroke="#dbe3ee"/>
<text class="message" x="122" y="489" text-anchor="middle" dominant-baseline="middle">5. flow.toList() -</text>
<text class="message" x="122" y="503" text-anchor="middle" dominant-baseline="middle">collect under</text>
<text class="message" x="122" y="517" text-anchor="middle" dominant-baseline="middle">coroutine scope</text>
<path class="call" d="M122 546 L122 546"/>
<rect x="78" y="586" width="360" height="26" rx="6" fill="#ffffff" opacity="0.95" stroke="#dbe3ee"/>
<text class="message" x="258" y="599" text-anchor="middle" dominant-baseline="middle">6. save(customer) - suspend</text>
<path class="call" d="M122 628 L394 628"/>
<rect x="350" y="668" width="360" height="26" rx="6" fill="#ffffff" opacity="0.95" stroke="#dbe3ee"/>
<text class="message" x="530" y="681" text-anchor="middle" dominant-baseline="middle">7. INSERT (Mono publisher)</text>
<path class="call" d="M394 710 L666 710"/>
<rect x="622" y="750" width="360" height="26" rx="6" fill="#ffffff" opacity="0.95" stroke="#dbe3ee"/>
<text class="message" x="802" y="763" text-anchor="middle" dominant-baseline="middle">8. execute SQL</text>
<path class="call" d="M666 792 L938 792"/>
<rect x="622" y="832" width="360" height="26" rx="6" fill="#ffffff" opacity="0.95" stroke="#dbe3ee"/>
<text class="message" x="802" y="845" text-anchor="middle" dominant-baseline="middle">9. rows updated</text>
<path class="return" d="M938 874 L666 874"/>
<rect x="350" y="914" width="360" height="26" rx="6" fill="#ffffff" opacity="0.95" stroke="#dbe3ee"/>
<text class="message" x="530" y="927" text-anchor="middle" dominant-baseline="middle">10. Mono&lt;Customer&gt;</text>
<path class="return" d="M666 956 L394 956"/>
<rect x="78" y="996" width="360" height="26" rx="6" fill="#ffffff" opacity="0.95" stroke="#dbe3ee"/>
<text class="message" x="258" y="1009" text-anchor="middle" dominant-baseline="middle">11. Customer (suspend, no callback)</text>
<path class="return" d="M394 1038 L122 1038"/>
</svg>
