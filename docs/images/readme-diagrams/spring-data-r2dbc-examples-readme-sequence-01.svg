  <circle cx="562.8" cy="561" r="13" class="badge callBadge"/><text x="562.8" y="566" text-anchor="middle" class="badgeText callText">4</text>
  <text x="586.8" y="566" class="msg callText">save entity without id</text>
  <path d="M 180.0 592 L 1170.0 592" class="call" stroke-linecap="round" stroke-linejoin="round"/>
