<svg xmlns="http://www.w3.org/2000/svg" width="1760" height="1220" viewBox="0 0 1760 1220" role="img" aria-labelledby="title desc">
  <title id="title">exposed/mvc-virtualthread architecture</title>
  <desc id="desc">Spring MVC virtual-thread architecture showing Tomcat using the shared virtual thread executor, repository and service virtualFuture transactions, exception unwrapping, and PostgreSQL tables.</desc>
  <defs>
    <style>
      svg{background:#f8fafc}
      .frame{fill:#fff;stroke:#d9e5ec;stroke-width:2}
      .title{font-family:"Architects Daughter";font-size:42px;fill:#152437}
      .subtitle,.body,.label,.footer{font-family:"Comic Mono";fill:#405260}
      .subtitle{font-size:17px}.body{font-size:15px}.label{font-size:14px}.footer{font-size:14px;fill:#617684}
      .layer{fill:#fbfdff;stroke:#dbe7ee;stroke-width:2}
      .layerTitle{font-family:"Architects Daughter";font-size:28px;fill:#213a4b}
      .card{stroke-width:2.3;rx:10}
      .web{fill:#eef7ff;stroke:#72a2c8}
      .vt{fill:#f2f6ff;stroke:#758ec6}
      .service{fill:#f0fbf4;stroke:#73a57f}
      .repo{fill:#fff9ea;stroke:#c49c57}
      .handler{fill:#fff0ef;stroke:#c98272}
      .db{fill:#fffaf2;stroke:#957636}
      .cardTitle{font-family:"Architects Daughter";font-size:27px;fill:#152437}
      .cardTitleSmall{font-family:"Architects Daughter";font-size:23px;fill:#152437}
      .chip{fill:#fff;stroke:#d4e0e8;stroke-width:1.4}
      .line{fill:none;stroke:#53738b;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}
      .vtLine{fill:none;stroke:#667eb9;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrowVt)}
      .repoLine{fill:none;stroke:#9c6f27;stroke-width:3.1;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrowRepo)}
      .errorLine{fill:none;stroke:#b75c55;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:8 7;marker-end:url(#arrowError)}
      .schemaLine{fill:none;stroke:#6a8798;stroke-width:2.6;stroke-linecap:round;stroke-dasharray:7 7;marker-end:url(#arrowSchema)}
    </style>
    <marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="15" markerHeight="15" viewBox="0 0 10 10" refX="10" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#53738b" stroke-dasharray="none" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="arrowVt" markerUnits="userSpaceOnUse" markerWidth="15" markerHeight="15" viewBox="0 0 10 10" refX="10" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#667eb9" stroke-dasharray="none" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="arrowRepo" markerUnits="userSpaceOnUse" markerWidth="15" markerHeight="15" viewBox="0 0 10 10" refX="10" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#9c6f27" stroke-dasharray="none" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="arrowError" markerUnits="userSpaceOnUse" markerWidth="13.5" markerHeight="13.5" viewBox="0 0 10 10" refX="10" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#b75c55" stroke-dasharray="none" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="arrowSchema" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" viewBox="0 0 10 10" refX="10" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#6a8798" stroke-dasharray="none" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <g id="databaseIcon">
      <rect x="0" y="0" width="70" height="70" rx="12" fill="#fffaf2" stroke="#28485a" stroke-width="3"/>
      <path d="M17 23v26c0 7 36 7 36 0V23" fill="#fff0d8" stroke="#8c6f33" stroke-width="3.2" stroke-linejoin="round"/>
      <path d="M17 36c0 7 36 7 36 0" fill="none" stroke="#8c6f33" stroke-width="2.6" stroke-linecap="round"/>
      <path d="M17 49c0 7 36 7 36 0" fill="none" stroke="#8c6f33" stroke-width="2.6" stroke-linecap="round"/>
      <ellipse cx="35" cy="23" rx="18" ry="7" fill="#fff0d8" stroke="#8c6f33" stroke-width="3.2"/>
    </g>
  </defs>

  <rect class="frame" x="30" y="28" width="1700" height="1164" rx="18"/>
  <text class="title" x="880" y="82" text-anchor="middle">Spring MVC + Virtual Threads + Exposed JDBC</text>
  <text class="subtitle" x="880" y="114" text-anchor="middle">Tomcat and Exposed work share one virtual-thread executor; transactions are explicit, not @Transactional.</text>

  <rect class="layer" x="78" y="150" width="1604" height="170" rx="15"/>
  <text class="layerTitle" x="108" y="191">Web API</text>
  <rect class="card web" x="190" y="218" width="410" height="76" rx="10"/>
  <text class="cardTitle" x="395" y="252" text-anchor="middle">Author + Book Controllers</text>
  <text class="body" x="395" y="277" text-anchor="middle">delegate and wait on VirtualFuture.get()</text>
  <rect class="card web" x="1185" y="218" width="410" height="76" rx="10"/>
  <text class="cardTitle" x="1390" y="252" text-anchor="middle">Product + Order Controllers</text>
  <text class="body" x="1390" y="277" text-anchor="middle">HTTP endpoints stay thin</text>

  <rect class="layer" x="78" y="365" width="1604" height="186" rx="15"/>
  <text class="layerTitle" x="108" y="406">Virtual Thread Runtime</text>
  <rect class="card vt" x="220" y="435" width="430" height="82" rx="10"/>
  <text class="cardTitle" x="435" y="468" text-anchor="middle">Tomcat Protocol Handler</text>
  <text class="body" x="435" y="494" text-anchor="middle">handler.executor = shared VT executor</text>
  <rect class="card vt" x="725" y="425" width="470" height="102" rx="10"/>
  <text class="cardTitle" x="960" y="460" text-anchor="middle">ExecutorService Bean</text>
  <text class="body" x="960" y="486" text-anchor="middle">newVirtualThreadPerTaskExecutor()</text>
  <text class="body" x="960" y="510" text-anchor="middle">ShutdownQueue.register(executor)</text>
  <rect class="card handler" x="1265" y="435" width="330" height="82" rx="10"/>
  <text class="cardTitleSmall" x="1430" y="468" text-anchor="middle">GlobalExceptionHandler</text>
  <text class="body" x="1430" y="494" text-anchor="middle">unwraps ExecutionException</text>

  <rect class="layer" x="78" y="596" width="1604" height="276" rx="15"/>
  <text class="layerTitle" x="108" y="637">Service and Repository Work</text>
  <rect class="card service" x="170" y="690" width="300" height="104" rx="10"/>
  <text class="cardTitle" x="320" y="728" text-anchor="middle">AuthorService</text>
  <text class="body" x="320" y="755" text-anchor="middle">calls repository futures</text>
  <text class="body" x="320" y="779" text-anchor="middle">combines Author + Book DTOs</text>
  <rect class="card repo" x="540" y="670" width="420" height="144" rx="10"/>
  <text class="cardTitleSmall" x="750" y="705" text-anchor="middle">VirtualFuture Repositories</text>
  <text class="body" x="750" y="735" text-anchor="middle">AuthorRepository / BookRepository</text>
  <text class="body" x="750" y="759" text-anchor="middle">ProductRepository / OrderRepository</text>
  <text class="body" x="750" y="783" text-anchor="middle">each method opens transaction(db)</text>
  <rect class="card service" x="1030" y="690" width="300" height="104" rx="10"/>
  <text class="cardTitle" x="1180" y="728" text-anchor="middle">OrderService</text>
  <text class="body" x="1180" y="755" text-anchor="middle">placeOrder owns one VT transaction</text>
  <text class="body" x="1180" y="779" text-anchor="middle">sorts, locks, writes, decrements</text>
  <rect class="card repo" x="1400" y="670" width="220" height="144" rx="10"/>
  <text class="cardTitleSmall" x="1510" y="705" text-anchor="middle">Direct SQL Path</text>
  <text class="body" x="1510" y="735" text-anchor="middle">OrderTable.insert</text>
  <text class="body" x="1510" y="759" text-anchor="middle">ProductTable.forUpdate</text>
  <text class="body" x="1510" y="783" text-anchor="middle">OrderLineTable.insert</text>

  <rect class="layer" x="78" y="917" width="1604" height="180" rx="15"/><image data-bluetape4k-icon="postgres" data-source="docs/icons/testcontainers/database/postgresql.svg" x="92.0" y="937.0" width="30" height="30" href="data:image/svg+xml;base64," preserveAspectRatio="xMidYMid meet"/>  <text class="layerTitle" x="108" y="960">PostgreSQL Tables</text>
  <rect class="card db" x="280" y="985" width="440" height="96" rx="10"/>
  <use href="#databaseIcon" x="304" y="998"/>
  <text class="cardTitleSmall" x="540" y="1024" text-anchor="middle">Author / Book Tables</text>
  <text class="body" x="540" y="1052" text-anchor="middle">plain Exposed Table definitions</text>
  <rect class="card db" x="960" y="985" width="500" height="96" rx="10"/>
  <use href="#databaseIcon" x="984" y="998"/>
  <text class="cardTitleSmall" x="1240" y="1024" text-anchor="middle">Order / Product Tables</text>
  <text class="body" x="1240" y="1052" text-anchor="middle">locks and rollback stay in service transaction</text>

  <path class="line" d="M 395 294 V 435" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="line" d="M 1390 294 V 435" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="vtLine" d="M 650 476 H 725" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="vtLine" d="M 1195 476 H 1265" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="vtLine" d="M 960 527 L 960 640 Q 960 650 950 650 L 759 650 Q 750 650 750 659 L 750 670" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="vtLine" d="M 960 527 L 960 640 Q 960 650 970 650 L 1170 650 Q 1180 650 1180 660 L 1180 690" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="repoLine" d="M 470 742 H 540" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="repoLine" d="M 1330 742 H 1400" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="repoLine" d="M 750 814 L 750 932 Q 750 942 740 942 L 510 942 Q 500 942 500 952 L 500 985" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="repoLine" d="M 1510 814 L 1510 932 Q 1510 942 1500 942 L 1220 942 Q 1210 942 1210 952 L 1210 985" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="errorLine" d="M 1430 670 V 517" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="schemaLine" d="M 720 1033 H 960" stroke-linecap="round" stroke-linejoin="round"/>
  <rect class="chip" x="782" y="995" width="116" height="30" rx="15"/>
  <text class="label" x="840" y="1015" text-anchor="middle">same DB</text>

  <text class="footer" x="880" y="1165" text-anchor="middle">Reader contract: every blocking JDBC path is explicit about which virtual thread and which transaction owns the work.</text>
</svg>
