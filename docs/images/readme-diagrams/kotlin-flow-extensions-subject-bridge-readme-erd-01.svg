<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#8aa0b8" flood-opacity="0.22"/>
    </filter>
    <marker id="arrow-blue" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" viewBox="0 0 14 14">
      <path d="M 1 1 L 13 7 L 1 13 Z" fill="#2f7ed8" stroke="#2f7ed8" stroke-width="1" stroke-dasharray="none" style="stroke-dasharray:none"/>
    </marker>
    <marker id="arrow-green" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" viewBox="0 0 14 14">
      <path d="M 1 1 L 13 7 L 1 13 Z" fill="#2f9e44" stroke="#2f9e44" stroke-width="1" stroke-dasharray="none" style="stroke-dasharray:none"/>
    </marker>
    <marker id="arrow-orange" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" viewBox="0 0 14 14">
      <path d="M 1 1 L 13 7 L 1 13 Z" fill="#d97706" stroke="#d97706" stroke-width="1" stroke-dasharray="none" style="stroke-dasharray:none"/>
    </marker>
    <marker id="arrow-purple" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" viewBox="0 0 14 14">
      <path d="M 1 1 L 13 7 L 1 13 Z" fill="#8b5cf6" stroke="#8b5cf6" stroke-width="1" stroke-dasharray="none" style="stroke-dasharray:none"/>
    </marker>
    <style>
      .canvas { fill:#f8fbff; }
      .frame { fill:#ffffff; stroke:#b7c8dc; stroke-width:2.2; }
      .title { font-family:'Architects Daughter','Comic Sans MS',cursive; font-size:34px; fill:#1f3349; text-anchor:middle; }
      .subtitle { font-family:'Comic Mono','Comic Sans MS',monospace; font-size:14px; fill:#52677f; text-anchor:middle; }
      .lane-title { font-family:'Architects Daughter','Comic Sans MS',cursive; font-size:21px; fill:#26384d; }
      .card-title { font-family:'Architects Daughter','Comic Sans MS',cursive; font-size:18px; fill:#1f3349; text-anchor:middle; }
      .card-text { font-family:'Comic Mono','Comic Sans MS',monospace; font-size:12px; fill:#334155; text-anchor:middle; }
      .small { font-family:'Comic Mono','Comic Sans MS',monospace; font-size:11px; fill:#52677f; text-anchor:middle; }
      .label { font-family:'Comic Mono','Comic Sans MS',monospace; font-size:11px; fill:#334155; text-anchor:middle; }
      .card { stroke-width:2; filter:url(#shadow); }
      .blue { fill:#e8f2ff; stroke:#8bb8ec; }
      .green { fill:#eaf8ef; stroke:#92d6a5; }
      .orange { fill:#fff4df; stroke:#e8b765; }
      .purple { fill:#f1edff; stroke:#b7a5f6; }
      .red { fill:#fff0f0; stroke:#eca0a0; }
      .line-blue { fill:none; stroke:#2f7ed8; stroke-width:3.4; stroke-linecap:round; stroke-linejoin:round; marker-end:url(#arrow-blue); }
      .line-green { fill:none; stroke:#2f9e44; stroke-width:3.4; stroke-linecap:round; stroke-linejoin:round; marker-end:url(#arrow-green); }
      .line-orange { fill:none; stroke:#d97706; stroke-width:3.4; stroke-linecap:round; stroke-linejoin:round; marker-end:url(#arrow-orange); }
      .line-purple { fill:none; stroke:#8b5cf6; stroke-width:3.4; stroke-linecap:round; stroke-linejoin:round; marker-end:url(#arrow-purple); }
      .dash { stroke-dasharray:8 7; }
    </style>
  </defs>
  <rect class="canvas" x="0" y="0" width="1400" height="820"/>
  <rect class="frame" x="34" y="32" width="1332" height="756" rx="18"/>
  <text class="title" x="700.0" y="72">Subject Bridge Domain Model</text>
  <text class="subtitle" x="700.0" y="98">Small serializable DTOs plus terminal stream outcomes</text>
  <rect class="card orange" x="90" y="180" width="260" height="140" rx="14"/>
  <text class="card-title" x="220.0" y="210">DeviceEvent</text>
  <text class="card-text" x="220.0" y="236">eventId: String</text>
  <text class="card-text" x="220.0" y="254">deviceId: String</text>
  <text class="card-text" x="220.0" y="272">type: DeviceEventType</text>
  <text class="card-text" x="220.0" y="290">payload: String</text>
  <rect class="card green" x="520" y="180" width="260" height="120" rx="14"/>
  <text class="card-title" x="650.0" y="210">DeviceState</text>
  <text class="card-text" x="650.0" y="236">deviceId: String</text>
  <text class="card-text" x="650.0" y="254">status: DeviceStatus</text>
  <text class="card-text" x="650.0" y="272">lastEventId: String</text>
  <rect class="card purple" x="950" y="180" width="260" height="120" rx="14"/>
  <text class="card-title" x="1080.0" y="210">WorkItem</text>
  <text class="card-text" x="1080.0" y="236">workId: String</text>
  <text class="card-text" x="1080.0" y="254">deviceId: String</text>
  <text class="card-text" x="1080.0" y="272">command: String</text>
  <rect class="card blue" x="90" y="450" width="260" height="110" rx="14"/>
  <text class="card-title" x="220.0" y="480">DeviceEventType</text>
  <text class="card-text" x="220.0" y="506">CONNECTED / TELEMETRY</text>
  <text class="card-text" x="220.0" y="524">DISCONNECTED / FAULT</text>
  <rect class="card blue" x="520" y="450" width="260" height="100" rx="14"/>
  <text class="card-title" x="650.0" y="480">DeviceStatus</text>
  <text class="card-text" x="650.0" y="506">ONLINE</text>
  <text class="card-text" x="650.0" y="524">DEGRADED / OFFLINE</text>
  <rect class="card red" x="950" y="450" width="260" height="100" rx="14"/>
  <text class="card-title" x="1080.0" y="480">Terminal Signal</text>
  <text class="card-text" x="1080.0" y="506">complete()</text>
  <text class="card-text" x="1080.0" y="524">emitError(cause?)</text>
  <path class="line-blue" d="M 220 320 L 220 405 Q 220 430 220 450"/>
  <rect x="178" y="375" width="144" height="24" rx="12" fill="#ffffff" stroke="#d5e1ef"/>
  <text class="label" x="250" y="393">type</text>
  <path class="line-green" d="M 650 300 L 650 405 Q 650 430 650 450"/>
  <rect x="608" y="375" width="144" height="24" rx="12" fill="#ffffff" stroke="#d5e1ef"/>
  <text class="label" x="680" y="393">status</text>
  <path class="line-orange" d="M 350 250 L 465 250 Q 495 250 495 240 L 520 240"/>
  <rect x="363" y="210" width="144" height="24" rx="12" fill="#ffffff" stroke="#d5e1ef"/>
  <text class="label" x="435" y="228">lastEventId</text>
  <path class="line-purple" d="M 1080 300 L 1080 405 Q 1080 430 1080 450"/>
  <rect x="1038" y="375" width="144" height="24" rx="12" fill="#ffffff" stroke="#d5e1ef"/>
  <text class="label" x="1110" y="393">ends with</text>
  <path class="line-orange" d="M 350 540 L 380 540 Q 400 540 400 590 L 900 590 Q 930 590 930 500 L 950 500"/>
  <rect x="578" y="485" width="144" height="24" rx="12" fill="#ffffff" stroke="#d5e1ef"/>
  <text class="label" x="650" y="503">errors close flows</text>
</svg>
