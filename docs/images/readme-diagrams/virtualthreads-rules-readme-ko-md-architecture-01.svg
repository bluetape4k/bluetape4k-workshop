<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" role="img" aria-label="Virtual Thread Architecture Overview">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%">
    <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#1f2937" flood-opacity="0.10"/>
  </filter>
  <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth">
    <path d="M1,1 L8,4.5 L1,8 Z" fill="#758297"/>
  </marker>
  <style>
    .canvas{fill:#f7f9fc}.frame{fill:#fff;stroke:#d8e0ea;stroke-width:1.5}
    .title{font-family:"Architects Daughter";font-size:38px;font-weight:400;fill:#102033}
    .subtitle{font-family:"Comic Mono";font-size:14px;font-weight:400;fill:#536273}
    .smallLabel{font-family:"Architects Daughter";font-size:21px;font-weight:400;fill:#102033}
    .mono{font-family:"Comic Mono";font-size:12px;font-weight:400;fill:#102033}
    .small{font-family:"Comic Mono";font-size:12px;font-weight:400;fill:#536273}
    .card{stroke-width:2.1;filter:url(#shadow)}
    .line{stroke:#758297;stroke-width:2.1;fill:none;marker-end:url(#arrow)}
  </style>
</defs>
<rect class="canvas" width="960" height="440"/>
<rect class="frame" x="24" y="20" width="912" height="396" rx="20"/>
<text class="title" x="48" y="66">Virtual Thread Architecture Overview</text>
<text class="subtitle" x="48" y="90">ForkJoinPool · VirtualThread · OS Thread · I/O · CPU · newVirtualThreadPerTaskExecutor</text>

<!-- Row 1: Virtual Threads over ForkJoinPool -->
<rect class="card" x="48" y="108" width="200" height="84" rx="12" fill="#E8F3FF" stroke="#5B8DEF"/>
<text class="smallLabel" x="148" y="143" text-anchor="middle">ForkJoinPool</text>
<text class="small" x="148" y="163" text-anchor="middle">carrier threads</text>
<text class="small" x="148" y="179" text-anchor="middle">(OS threads)</text>

<rect class="card" x="268" y="108" width="200" height="84" rx="12" fill="#EAF7EF" stroke="#58A978"/>
<text class="smallLabel" x="368" y="143" text-anchor="middle">VirtualThread 1</text>
<text class="small" x="368" y="163" text-anchor="middle">mount → work</text>
<text class="small" x="368" y="179" text-anchor="middle">unmount on I/O</text>

<rect class="card" x="488" y="108" width="200" height="84" rx="12" fill="#FFF3D9" stroke="#D6A441"/>
<text class="smallLabel" x="588" y="143" text-anchor="middle">VirtualThread 2</text>
<text class="small" x="588" y="163" text-anchor="middle">mount → work</text>
<text class="small" x="588" y="179" text-anchor="middle">unmount on I/O</text>

<rect class="card" x="708" y="108" width="204" height="84" rx="12" fill="#FDECEF" stroke="#DC6B82"/>
<text class="smallLabel" x="810" y="143" text-anchor="middle">VirtualThread N</text>
<text class="small" x="810" y="163" text-anchor="middle">millions possible</text>
<text class="small" x="810" y="179" text-anchor="middle">cheap to create</text>

<!-- Arrows downward -->
<path class="line" d="M148 194 L148 228"/>
<path class="line" d="M368 194 L368 228"/>
<path class="line" d="M588 194 L588 228"/>
<path class="line" d="M810 194 L810 228"/>

<!-- Row 2: OS thread outcomes -->
<rect class="card" x="48" y="230" width="200" height="72" rx="12" fill="#E9F7F6" stroke="#45A7A1"/>
<text class="smallLabel" x="148" y="261" text-anchor="middle">OS Thread 1</text>
<text class="small" x="148" y="279" text-anchor="middle">carrier thread pool</text>
<text class="small" x="148" y="293" text-anchor="middle">ForkJoinPool</text>

<rect class="card" x="268" y="230" width="200" height="72" rx="12" fill="#F1ECFF" stroke="#8A72D6"/>
<text class="smallLabel" x="368" y="261" text-anchor="middle">OS Thread 2</text>
<text class="small" x="368" y="279" text-anchor="middle">carrier thread pool</text>
<text class="small" x="368" y="293" text-anchor="middle">ForkJoinPool</text>

<rect class="card" x="488" y="230" width="200" height="72" rx="12" fill="#F7F1E7" stroke="#B88A44"/>
<text class="smallLabel" x="588" y="261" text-anchor="middle">I/O Blocking</text>
<text class="small" x="588" y="279" text-anchor="middle">VT unmounts</text>
<text class="small" x="588" y="293" text-anchor="middle">carrier freed</text>

<rect class="card" x="708" y="230" width="204" height="72" rx="12" fill="#EEF6D9" stroke="#8BA84D"/>
<text class="smallLabel" x="810" y="261" text-anchor="middle">CPU Compute</text>
<text class="small" x="810" y="279" text-anchor="middle">VT stays mounted</text>
<text class="small" x="810" y="293" text-anchor="middle">until yield/complete</text>

<!-- Row 3: Bottom feature cards -->
<rect class="card" x="48" y="320" width="280" height="72" rx="12" fill="#E8F3FF" stroke="#5B8DEF"/>
<text class="smallLabel" x="188" y="350" text-anchor="middle">newVirtualThread</text>
<text class="smallLabel" x="188" y="372" text-anchor="middle">PerTaskExecutor</text>

<rect class="card" x="348" y="320" width="280" height="72" rx="12" fill="#EAF7EF" stroke="#58A978"/>
<text class="smallLabel" x="488" y="350" text-anchor="middle">synchronized →</text>
<text class="smallLabel" x="488" y="372" text-anchor="middle">ReentrantLock</text>

<rect class="card" x="648" y="320" width="264" height="72" rx="12" fill="#FFF3D9" stroke="#D6A441"/>
<text class="smallLabel" x="780" y="350" text-anchor="middle">ThreadLocal →</text>
<text class="smallLabel" x="780" y="372" text-anchor="middle">ScopedValue</text>
</svg>
