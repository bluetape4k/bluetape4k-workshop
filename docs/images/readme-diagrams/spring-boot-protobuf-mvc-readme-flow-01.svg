<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="900" viewBox="0 0 1700 900" role="img" aria-label="Protobuf MVC request flow">
  <defs><filter id="shadow" x="-8%" y="-8%" width="116%" height="124%"><feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#64748B" flood-opacity="0.15"/></filter><marker id="arrowBlue" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 14 7 L 0 14 Z" fill="#2563EB" stroke-dasharray="none"/></marker><marker id="arrowGreen" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 14 7 L 0 14 Z" fill="#16A34A" stroke-dasharray="none"/></marker><marker id="arrowOrange" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 14 7 L 0 14 Z" fill="#EA580C" stroke-dasharray="none"/></marker><style>.canvas{fill:#F8FAFC}.frame{fill:#FFFFFF;stroke:#D6E0E8;stroke-width:1.4}.title{font-family:"Architects Daughter";font-size:40px;fill:#102033}.subtitle{font-family:"Comic Mono";font-size:16px;fill:#51606F}.cardTitle{font-family:"Architects Daughter";font-size:29px;fill:#102033}.cardText{font-family:"Comic Mono";font-size:15px;fill:#415166}.line{fill:none;stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round}.msg{font-family:"Comic Mono";font-size:15px;fill:#334155}.life{stroke:#94A3B8;stroke-width:1.7;stroke-dasharray:8 8}.region{fill-opacity:.58;stroke-width:1.6;rx:18}.noteTitle{font-family:"Architects Daughter";font-size:24px;fill:#102033}</style></defs>
  <rect class="canvas" width="1700" height="900"/><rect class="frame" x="24" y="24" width="1652" height="852" rx="24"/>
  <text class="title" x="850" y="72" text-anchor="middle">Course response negotiation</text><text class="subtitle" x="850" y="106" text-anchor="middle">The same Course object can be returned as Protobuf bytes or converted to JSON for tooling and tests.</text>
  <g filter="url(#shadow)"><rect x="100" y="154" width="230" height="72" rx="14" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.7"/><text class="cardTitle" x="215" y="188" text-anchor="middle">Client</text><text class="cardText" x="215" y="212" text-anchor="middle">Accept header</text></g>
  <g filter="url(#shadow)"><rect x="450" y="154" width="280" height="72" rx="14" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.7"/><text class="cardTitle" x="590" y="188" text-anchor="middle">CourseController</text><text class="cardText" x="590" y="212" text-anchor="middle">/courses/{id}</text></g>
  <g filter="url(#shadow)"><rect x="850" y="154" width="280" height="72" rx="14" fill="#F0FDF4" stroke="#16A34A" stroke-width="1.7"/><text class="cardTitle" x="990" y="188" text-anchor="middle">Repository</text><text class="cardText" x="990" y="212" text-anchor="middle">Map&lt;Int, Course&gt;</text></g>
  <g filter="url(#shadow)"><rect x="1260" y="154" width="300" height="72" rx="14" fill="#FFF7ED" stroke="#EA580C" stroke-width="1.7"/><text class="cardTitle" x="1410" y="188" text-anchor="middle">Converter</text><text class="cardText" x="1410" y="212" text-anchor="middle">Protobuf or JSON</text></g>
  <line class="life" x1="215" y1="238" x2="215" y2="790"/><line class="life" x1="590" y1="238" x2="590" y2="790"/><line class="life" x1="990" y1="238" x2="990" y2="790"/><line class="life" x1="1410" y1="238" x2="1410" y2="790"/>
  <rect class="region" x="78" y="292" width="1542" height="190" fill="#ECFDF5" stroke="#86EFAC"/><text class="noteTitle" x="120" y="334">Binary response</text>
  <path class="line" d="M 215 370 L 590 370" stroke="#2563EB" marker-end="url(#arrowBlue)" stroke-linecap="round" stroke-linejoin="round"/><text class="msg" x="402" y="352" text-anchor="middle">GET /courses/1 Accept application/x-protobuf</text>
  <path class="line" d="M 590 408 L 990 408" stroke="#16A34A" marker-end="url(#arrowGreen)" stroke-linecap="round" stroke-linejoin="round"/><text class="msg" x="790" y="390" text-anchor="middle">getCourse(id)</text>
  <path class="line" d="M 990 446 L 1410 446" stroke="#EA580C" marker-end="url(#arrowOrange)" stroke-linecap="round" stroke-linejoin="round"/><text class="msg" x="1200" y="428" text-anchor="middle">Course generated message</text>
  <rect class="region" x="78" y="536" width="1542" height="148" fill="#EFF6FF" stroke="#93C5FD"/><text class="noteTitle" x="120" y="578">JSON interop path</text>
  <path class="line" d="M 990 626 L 1410 626" stroke="#EA580C" marker-end="url(#arrowOrange)" stroke-linecap="round" stroke-linejoin="round"/><text class="msg" x="1200" y="608" text-anchor="middle">MessageOrBuilder.toJson()</text>
  <path class="line" d="M 1410 740 L 215 740" stroke="#2563EB" marker-end="url(#arrowBlue)" stroke-linecap="round" stroke-linejoin="round"/><text class="msg" x="812" y="766" text-anchor="middle">HTTP response is parsed by RestTemplate, WebClient, or Course.parseFrom(bytes)</text>
</svg>
