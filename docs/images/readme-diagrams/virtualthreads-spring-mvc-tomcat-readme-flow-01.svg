<svg xmlns="http://www.w3.org/2000/svg" width="1640" height="1180" viewBox="0 0 1640 1180" role="img" aria-label="Spring MVC virtual thread request flow">
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .title { font-family: 'Architects Daughter', 'Comic Sans MS', cursive; font-size: 34px; fill: #172033; }
      .actor { font-family: 'Architects Daughter', 'Comic Sans MS', cursive; font-size: 27px; fill: #111827; }
      .body { font-family: 'Comic Mono', 'Comic Sans MS', monospace; font-size: 17px; fill: #334155; }
      .small { font-family: 'Comic Mono', 'Comic Sans MS', monospace; font-size: 15px; fill: #475569; }
      .label { font-family: 'Comic Mono', 'Comic Sans MS', monospace; font-size: 16px; fill: #263445; }
      .card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; rx: 18; ry: 18; }
      .lane { stroke: #94a3b8; stroke-width: 1.5; stroke-dasharray: 8 8; }
      .alt { stroke-width: 1.5; rx: 22; ry: 22; opacity: 0.58; }
      .line { fill: none; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
    </style>
    <marker id="blueArrow" viewBox="0 0 10 10" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#2563eb"/>
    </marker>
    <marker id="greenArrow" viewBox="0 0 10 10" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#16a34a"/>
    </marker>
    <marker id="orangeArrow" viewBox="0 0 10 10" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#ea580c"/>
    </marker>
    <marker id="grayArrow" viewBox="0 0 10 10" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#64748b"/>
    </marker>
  </defs>

  <rect class="bg" width="1640" height="1180"/>
  <text class="title" x="70" y="66">Spring MVC Virtual Thread Request Flow</text>

  <rect class="card" x="80" y="105" width="230" height="82"/>
  <text class="actor" x="195" y="142" text-anchor="middle">Client / Gatling</text>
  <text class="small" x="195" y="168" text-anchor="middle">HTTP request</text>
  <rect class="card" x="380" y="105" width="250" height="82"/>
  <text class="actor" x="505" y="142" text-anchor="middle">Tomcat</text>
  <text class="small" x="505" y="168" text-anchor="middle">virtual request thread</text>
  <rect class="card" x="700" y="105" width="250" height="82"/>
  <text class="actor" x="825" y="142" text-anchor="middle">MVC Controller</text>
  <text class="small" x="825" y="168" text-anchor="middle">blocking handler</text>
  <rect class="card" x="1020" y="105" width="250" height="82"/>
  <text class="actor" x="1145" y="142" text-anchor="middle">VT Helpers</text>
  <text class="small" x="1145" y="168" text-anchor="middle">bluetape4k APIs</text>
  <rect class="card" x="1340" y="105" width="220" height="82"/>
  <text class="actor" x="1450" y="142" text-anchor="middle">Blocking Target</text>
  <text class="small" x="1450" y="168" text-anchor="middle">JPA / HTTP</text>

  <line class="lane" x1="195" y1="190" x2="195" y2="1110"/>
  <line class="lane" x1="505" y1="190" x2="505" y2="1110"/>
  <line class="lane" x1="825" y1="190" x2="825" y2="1110"/>
  <line class="lane" x1="1145" y1="190" x2="1145" y2="1110"/>
  <line class="lane" x1="1450" y1="190" x2="1450" y2="1110"/>

  <rect class="alt" x="62" y="235" width="1516" height="210" fill="#eff6ff" stroke="#93c5fd"/>
  <text class="actor" x="95" y="275">Simple MVC request</text>
  <path class="line" d="M195 315 L505 315" stroke="#2563eb" marker-end="url(#blueArrow)"/>
  <text class="label" x="350" y="300" text-anchor="middle">GET /virtual-thread</text>
  <path class="line" d="M505 355 L825 355" stroke="#2563eb" marker-end="url(#blueArrow)"/>
  <text class="label" x="665" y="340" text-anchor="middle">dispatch on virtual thread</text>
  <path class="line" d="M825 395 L1145 395" stroke="#16a34a" marker-end="url(#greenArrow)"/>
  <text class="label" x="985" y="380" text-anchor="middle">@Async uses VT executor</text>
  <path class="line" d="M825 430 L195 430" stroke="#64748b" marker-end="url(#grayArrow)"/>
  <text class="label" x="510" y="415" text-anchor="middle">return current thread name</text>

  <rect class="alt" x="62" y="485" width="1516" height="250" fill="#f0fdf4" stroke="#86efac"/>
  <text class="actor" x="95" y="525">Parallel virtual-thread helpers</text>
  <path class="line" d="M195 570 L505 570" stroke="#2563eb" marker-end="url(#blueArrow)"/>
  <text class="label" x="350" y="555" text-anchor="middle">GET /virtual-thread/multi</text>
  <path class="line" d="M505 610 L825 610" stroke="#2563eb" marker-end="url(#blueArrow)"/>
  <text class="label" x="665" y="595" text-anchor="middle">invoke controller</text>
  <path class="line" d="M825 650 L1145 650" stroke="#16a34a" marker-end="url(#greenArrow)"/>
  <text class="label" x="985" y="635" text-anchor="middle">structuredTaskScopeAll</text>
  <path class="line" d="M1145 690 L1450 690" stroke="#16a34a" marker-end="url(#greenArrow)"/>
  <text class="label" x="1298" y="675" text-anchor="middle">100 blocking subtasks</text>
  <path class="line" d="M1145 720 L825 720" stroke="#64748b" marker-end="url(#grayArrow)"/>

  <rect class="alt" x="62" y="775" width="1516" height="165" fill="#fff7ed" stroke="#fdba74"/>
  <text class="actor" x="95" y="815">MVC + JPA endpoints</text>
  <path class="line" d="M195 855 L505 855" stroke="#2563eb" marker-end="url(#blueArrow)"/>
  <text class="label" x="350" y="840" text-anchor="middle">GET /member or /team</text>
  <path class="line" d="M505 895 L825 895" stroke="#2563eb" marker-end="url(#blueArrow)"/>
  <path class="line" d="M825 895 L1450 895" stroke="#ea580c" marker-end="url(#orangeArrow)"/>
  <text class="label" x="1138" y="880" text-anchor="middle">Spring Data JPA / Querydsl</text>
  <path class="line" d="M1450 925 L195 925" stroke="#64748b" marker-end="url(#grayArrow)"/>

  <rect class="alt" x="62" y="980" width="1516" height="130" fill="#fef2f2" stroke="#fca5a5"/>
  <text class="actor" x="95" y="1020">Blocking external HTTP endpoint</text>
  <path class="line" d="M195 1060 L825 1060" stroke="#2563eb" marker-end="url(#blueArrow)"/>
  <text class="label" x="510" y="1045" text-anchor="middle">GET /httpbin/block/{seconds}</text>
  <path class="line" d="M825 1085 L1450 1085" stroke="#ea580c" marker-end="url(#orangeArrow)"/>
  <text class="label" x="1138" y="1070" text-anchor="middle">WebClient.block against Testcontainers httpbin</text>
</svg>
