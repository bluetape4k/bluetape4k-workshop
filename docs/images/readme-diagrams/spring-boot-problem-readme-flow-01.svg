<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="900" viewBox="0 0 1700 900" role="img" aria-label="Problem error flow">
  <defs><filter id="shadow" x="-8%" y="-8%" width="116%" height="124%"><feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#64748B" flood-opacity="0.15"/></filter><marker id="arrowBlue" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 14 7 L 0 14 Z" fill="#2563EB"/></marker><marker id="arrowGreen" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 14 7 L 0 14 Z" fill="#16A34A"/></marker><marker id="arrowRed" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 14 7 L 0 14 Z" fill="#DC2626"/></marker><style>.canvas{fill:#F8FAFC}.frame{fill:#FFFFFF;stroke:#D6E0E8;stroke-width:1.4}.title{font-family:"Architects Daughter";font-size:40px;fill:#102033}.subtitle{font-family:"Comic Mono";font-size:16px;fill:#51606F}.cardTitle{font-family:"Architects Daughter";font-size:29px;fill:#102033}.cardText{font-family:"Comic Mono";font-size:15px;fill:#415166}.line{fill:none;stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round}.msg{font-family:"Comic Mono";font-size:15px;fill:#334155}.life{stroke:#94A3B8;stroke-width:1.7;stroke-dasharray:8 8}.region{fill-opacity:.58;stroke-width:1.6;rx:18}.noteTitle{font-family:"Architects Daughter";font-size:24px;fill:#102033}</style><marker id="arrowRed-ea580c" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path stroke-dasharray="none" d="M 0 0 L 14 7 L 0 14 Z" fill="#ea580c"/></marker>
</defs>
  <rect class="canvas" width="1700" height="900"/><rect class="frame" x="24" y="24" width="1652" height="852" rx="24"/>
  <text class="title" x="850" y="72" text-anchor="middle">Problem response flow</text><text class="subtitle" x="850" y="106" text-anchor="middle">Exception handlers convert controller failures into RFC 9457 JSON with the right HTTP status and optional headers.</text>
  <g filter="url(#shadow)"><rect x="100" y="154" width="220" height="72" rx="14" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.7"/><text class="cardTitle" x="210" y="188" text-anchor="middle">Client</text><text class="cardText" x="210" y="212" text-anchor="middle">HTTP request</text></g>
  <g filter="url(#shadow)"><rect x="430" y="154" width="300" height="72" rx="14" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.7"/><text class="cardTitle" x="580" y="188" text-anchor="middle">Controller</text><text class="cardText" x="580" y="212" text-anchor="middle">Task or Resilience4j</text></g>
  <g filter="url(#shadow)"><rect x="850" y="154" width="310" height="72" rx="14" fill="#F0FDF4" stroke="#16A34A" stroke-width="1.7"/><text class="cardTitle" x="1005" y="188" text-anchor="middle">AdviceTrait</text><text class="cardText" x="1005" y="212" text-anchor="middle">create(status, ex, request)</text></g>
  <g filter="url(#shadow)"><rect x="1300" y="154" width="280" height="72" rx="14" fill="#FFF7ED" stroke="#EA580C" stroke-width="1.7"/><text class="cardTitle" x="1440" y="188" text-anchor="middle">Problem JSON</text><text class="cardText" x="1440" y="212" text-anchor="middle">RFC 9457 body</text></g>
  <line class="life" x1="210" y1="238" x2="210" y2="800"/><line class="life" x1="580" y1="238" x2="580" y2="800"/><line class="life" x1="1005" y1="238" x2="1005" y2="800"/><line class="life" x1="1440" y1="238" x2="1440" y2="800"/>
  <rect class="region" x="78" y="292" width="1542" height="190" fill="#ECFDF5" stroke="#86EFAC"/><text class="noteTitle" x="120" y="334">Task-domain errors</text>
  <path class="line" d="M 210 370 L 580 370" stroke="#2563EB" marker-end="url(#arrowBlue)"/><text class="msg" x="395" y="352" text-anchor="middle">GET /tasks/-1 or /tasks/999</text>
  <path class="line" d="M 580 408 L 1005 408" stroke="#DC2626" marker-end="url(#arrowRed)"/><text class="msg" x="792" y="390" text-anchor="middle">InvalidTaskIdException or TaskNotFoundException</text>
  <path class="line" d="M 1005 446 L 1440 446" stroke="#16A34A" marker-end="url(#arrowGreen)"/><text class="msg" x="1222" y="428" text-anchor="middle">400 Bad Request or 404 Not Found</text>
  <rect class="region" x="78" y="536" width="1542" height="168" fill="#EFF6FF" stroke="#93C5FD"/><text class="noteTitle" x="120" y="578">Resilience4j errors</text>
  <path class="line" d="M 210 628 L 580 628" stroke="#2563EB" marker-end="url(#arrowBlue)"/><text class="msg" x="395" y="610" text-anchor="middle">call circuit-breaker, retry, bulkhead, rate-limit route</text>
  <path class="line" d="M 580 664 L 1005 664" stroke="#DC2626" marker-end="url(#arrowRed)"/><text class="msg" x="792" y="646" text-anchor="middle">CallNotPermitted, MaxRetriesExceeded, RequestNotPermitted</text>
  <path class="line" d="M 1005 742 L 210 742" stroke="#EA580C" marker-end="url(#arrowRed-ea580c)"/><text class="msg" x="608" y="768" text-anchor="middle">HTTP response: application/problem+json, Retry-After when configured</text>
</svg>
