<svg xmlns="http://www.w3.org/2000/svg" width="920" height="480" viewBox="0 0 920 480" role="img" aria-label="JaVers Audit Architecture">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#1f2937" flood-opacity="0.10"/></filter>
  <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth">
    <path d="M1,1 L8,4.5 L1,8 Z" fill="#758297"/>
  </marker>
  <style>
    .canvas{fill:#f7f9fc}.frame{fill:#fff;stroke:#d8e0ea;stroke-width:1.5}
    .title{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:38px;font-weight:400;fill:#102033}
    .subtitle{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:14px;font-weight:400;fill:#536273}
    .smallLabel{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:21px;font-weight:400;fill:#102033}
    .mono{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#102033}
    .small{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#536273}
    .card{stroke-width:2.1;filter:url(#shadow)}
    .line{stroke:#758297;stroke-width:2.1;fill:none;marker-end:url(#arrow)}
  </style>
</defs>
<!-- Layout:
     Canvas: 920×480  Frame: x=24 y=20 w=872 h=436 inner x=40..880 = 840px
     Row1  y=98   h=54  bottom=152  ProductAuditService (center x=220 w=480 cx=460)
     Row2  y=210  h=90  bottom=300  two cols gap=60px
       Col1: x=40  w=390 cx=235  (JaVers)
       Col2: x=490 w=390 cx=685  (Exposed ProductTable)
     Row3  y=350  h=72  bottom=422  same cols
       Col1: Audit History API
       Col2: H2 In-Memory Database
     Routing lanes: 152→210=58px, 300→350=50px (both ≥50px ✓)
-->
<rect class="canvas" width="920" height="480"/>
<rect class="frame" x="24" y="20" width="872" height="436" rx="28"/>
<text class="title" x="58" y="66">JaVers Audit Architecture</text>
<text class="subtitle" x="58" y="92">ProductAuditService · JaVers in-memory · Exposed ProductTable · H2</text>

<!-- Arrows -->
<!-- ProductAuditService → JaVers (routes left) -->
<path class="line" d="M460 152 L460 177 L235 177 L235 210"/>
<!-- ProductAuditService → Exposed ProductTable (routes right) -->
<path class="line" d="M460 152 L460 177 L685 177 L685 210"/>
<!-- JaVers → Audit History API (straight) -->
<path class="line" d="M235 300 L235 350"/>
<!-- Exposed → H2 Database (straight) -->
<path class="line" d="M685 300 L685 350"/>

<!-- ProductAuditService (center top) -->
<g transform="translate(220,98)">
  <rect class="card" x="0" y="0" width="480" height="54" rx="12" fill="#EAF7EF" stroke="#58A978"/>
  <text class="smallLabel" x="240" y="22" text-anchor="middle">ProductAuditService</text>
  <text class="mono" x="240" y="42" text-anchor="middle">save(author, product)  ·  delete(author, product)</text>
</g>

<!-- JaVers  col1 -->
<g transform="translate(40,210)">
  <rect class="card" x="0" y="0" width="390" height="90" rx="12" fill="#F1ECFF" stroke="#8A72D6"/>
  <text class="smallLabel" x="195" y="22" text-anchor="middle">JaVers</text>
  <text class="small" x="195" y="40" text-anchor="middle">in-memory audit repository</text>
  <text class="mono" x="195" y="58" text-anchor="middle">commit(author, obj)</text>
  <text class="mono" x="195" y="76" text-anchor="middle">commitShallowDelete(author, obj)</text>
</g>

<!-- Exposed ProductTable  col2 -->
<g transform="translate(490,210)">
  <rect class="card" x="0" y="0" width="390" height="90" rx="12" fill="#FFF3D9" stroke="#D6A441"/>
  <text class="smallLabel" x="195" y="22" text-anchor="middle">ProductTable : Exposed</text>
  <text class="small" x="195" y="40" text-anchor="middle">H2 in-memory JDBC</text>
  <text class="mono" x="195" y="58" text-anchor="middle">upsert { id, name, price, category }</text>
  <text class="mono" x="195" y="76" text-anchor="middle">deleteWhere { id eq product.id }</text>
</g>

<!-- Audit History API  col1 -->
<g transform="translate(40,350)">
  <rect class="card" x="0" y="0" width="390" height="72" rx="12" fill="#E8F3FF" stroke="#5B8DEF"/>
  <text class="smallLabel" x="195" y="22" text-anchor="middle">Audit History API</text>
  <text class="mono" x="195" y="42" text-anchor="middle">findSnapshots(query): List&lt;CdoSnapshot&gt;</text>
  <text class="mono" x="195" y="60" text-anchor="middle">latestSnapshotOrNull&lt;T&gt;  ·  compare(a, b)</text>
</g>

<!-- H2 In-Memory Database  col2 -->
<g transform="translate(490,350)">
  <rect class="card" x="0" y="0" width="390" height="72" rx="12" fill="#FDECEF" stroke="#DC6B82"/>
  <text class="smallLabel" x="195" y="22" text-anchor="middle">H2 In-Memory Database</text>
  <text class="small" x="195" y="42" text-anchor="middle">JDBC DataSource · auto DDL on startup</text>
  <text class="mono" x="195" y="60" text-anchor="middle">products table</text>
</g>
</svg>
