<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="2049.6" height="960" viewBox="0 0 2049.6 960" role="img" aria-label="Gateway demo runtime overview">
  <defs>
    <filter id="shadow" x="-8%" y="-10%" width="116%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#5b7282" flood-opacity="0.16"/>
    </filter>
    <marker id="blueArrow" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" viewBox="0 0 13.1385 10.7692" refX="9" refY="5" orient="auto" data-role="primary" data-tip-direction="positive-x">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#457b9d" stroke-dasharray="none" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="greenArrow" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" viewBox="0 0 13.1385 10.7692" refX="9" refY="5" orient="auto" data-role="primary" data-tip-direction="positive-x">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#5f8f5b" stroke-dasharray="none" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="redArrow" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" viewBox="0 0 13.1385 10.7692" refX="9" refY="5" orient="auto" data-role="primary" data-tip-direction="positive-x">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#b44d49" stroke-dasharray="none" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="goldArrow" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" viewBox="0 0 14.2333 11.6667" refX="9" refY="5" orient="auto" data-role="primary" data-tip-direction="positive-x">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#a87332" stroke-dasharray="none" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .canvas { fill: #f7fafc; }
      .frame { fill: #fffefd; stroke: #cdd8df; stroke-width: 2; }
      .title { font-family: "Architects Daughter"; font-size: 38px; fill: #1d2b38; }
      .subtitle { font-family: "Comic Mono"; font-size: 16px; fill: #516172; }
      .layerTitle { font-family: "Architects Daughter"; font-size: 25px; fill: #283747; }
      .cardTitle { font-family: "Architects Daughter"; font-size: 26px; fill: #1d2b38; }
      .cardText { font-family: "Comic Mono"; font-size: 15px; fill: #42515f; }
      .smallText { font-family: "Comic Mono"; font-size: 13px; fill: #566575; }
      .legendText { font-family: "Comic Mono"; font-size: 13px; fill: #607080; }
      .layer { stroke-width: 1.6; }
      .card { stroke-width: 2.2; filter: url(#shadow); }
      .lineBlue { fill: none; stroke: #457b9d; stroke-width: 4.2; marker-end: url(#blueArrow); stroke-linecap: round; stroke-linejoin: round; }
      .lineGreen { fill: none; stroke: #5f8f5b; stroke-width: 4.2; marker-end: url(#greenArrow); stroke-linecap: round; stroke-linejoin: round; }
      .lineRed { fill: none; stroke: #b44d49; stroke-width: 4.2; marker-end: url(#redArrow); stroke-linecap: round; stroke-linejoin: round; }
      .lineGold { fill: none; stroke: #a87332; stroke-width: 3.8; marker-end: url(#goldArrow); stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 9 8; }
      .label { font-family: "Comic Mono"; font-size: 14px; font-weight: 700; }
      .labelBox { fill: #ffffff; stroke-width: 1.4; }
    </style>
    <g id="gatewayIcon">
      <rect x="0" y="0" width="90.28" height="74" rx="16" fill="#edf6ff" stroke="#315f85" stroke-width="4.88"/>
      <path d="M18 22h38M18 37h38M18 52h38" stroke="#315f85" stroke-width="5" stroke-linecap="round"/>
      <circle cx="30.5" cy="22" r="4" fill="#457b9d"/>
      <circle cx="59.78" cy="37" r="4" fill="#457b9d"/>
      <circle cx="30.5" cy="52" r="4" fill="#457b9d"/>
    </g>
  </defs>

  <rect class="canvas" width="2049.6" height="960"/>
  <rect class="frame" x="34.16" y="28" width="1981.28" height="904" rx="24"/>
  <text class="title" x="1024.8" y="84" text-anchor="middle">Gateway Demo Runtime</text>
  <text class="subtitle" x="1024.8" y="114" text-anchor="middle">Spring Cloud Gateway routes public paths to local WebFlux services.</text>

  <rect class="layer" x="92.72" y="164" width="366" height="610" rx="18" fill="#eef6ff" stroke="#b5cfe8"/>
  <text class="layerTitle" x="275.72" y="207" text-anchor="middle">Client Surface</text>

  <rect class="layer" x="531.92" y="164" width="585.6" height="610" rx="18" fill="#f4fbf2" stroke="#b7d4ae"/>
  <text class="layerTitle" x="824.72" y="207" text-anchor="middle">Gateway Runtime</text>

  <rect class="layer" x="1190.72" y="164" width="766.16" height="610" rx="18" fill="#fff8ea" stroke="#dec289"/>
  <text class="layerTitle" x="1573.8" y="207" text-anchor="middle">Downstream Services</text>

  <rect class="card" x="153.72" y="308" width="244" height="144" rx="14" fill="#ffffff" stroke="#8eb4d6"/>
  <text class="cardTitle" x="275.72" y="358" text-anchor="middle">HTTP Client</text>
  <text class="cardText" x="275.72" y="389" text-anchor="middle">calls gateway</text>
  <text class="smallText" x="275.72" y="418" text-anchor="middle">:8080 public paths</text>

  <rect class="card" x="610" y="270" width="429.44" height="166" rx="14" fill="#ffffff" stroke="#91b884"/>
  <use href="#gatewayIcon" x="646.6" y="314"/>
  <text class="cardTitle" x="858.88" y="321" text-anchor="middle">API Gateway</text>
  <text class="cardText" x="858.88" y="353" text-anchor="middle">Spring Cloud Gateway</text>
  <text class="smallText" x="858.88" y="382" text-anchor="middle">port 8080</text>
  <text class="smallText" x="858.88" y="407" text-anchor="middle">RewritePath + response header</text>

  <rect class="card" x="610" y="500" width="429.44" height="124" rx="14" fill="#fffdf6" stroke="#c39a56"/>
  <text class="cardTitle" x="824.72" y="542" text-anchor="middle">Gateway Support</text>
  <text class="cardText" x="824.72" y="574" text-anchor="middle">Swagger UI + OpenAPI</text>
  <text class="smallText" x="824.72" y="599" text-anchor="middle">Bucket4j WebFlux filter</text>

  <rect class="card" x="1305.4" y="248" width="497.76" height="130" rx="14" fill="#fffefa" stroke="#d2a85e"/>
  <text class="cardTitle" x="1554.28" y="291" text-anchor="middle">Customer Service</text>
  <text class="cardText" x="1554.28" y="323" text-anchor="middle">port 8081</text>
  <text class="smallText" x="1554.28" y="349" text-anchor="middle">/api/v1/customers</text>

  <rect class="card" x="1305.4" y="436" width="497.76" height="144" rx="14" fill="#fffefa" stroke="#d2a85e"/>
  <text class="cardTitle" x="1554.28" y="480" text-anchor="middle">Order Service</text>
  <text class="cardText" x="1554.28" y="512" text-anchor="middle">port 8082</text>
  <text class="smallText" x="1554.28" y="538" text-anchor="middle">/api/v1/orders</text>
  <text class="smallText" x="1554.28" y="562" text-anchor="middle">/api/v1/products</text>

  <rect class="card" x="1305.4" y="638" width="497.76" height="94" rx="14" fill="#f9fbff" stroke="#9db4c8" stroke-dasharray="8 7"/>
  <text class="cardTitle" x="1554.28" y="677" text-anchor="middle">WebSocket Echo</text>
  <text class="smallText" x="1554.28" y="707" text-anchor="middle">/echo -> localhost:9000</text>

  <rect class="card" x="697.84" y="810" width="475.8" height="94" rx="14" fill="#fff7f6" stroke="#bc544f"/>
  <image data-bluetape4k-icon="redis" data-source="docs/icons/redis/redis-icon.svg" x="734.44" y="834" width="42" height="42" href="data:image/svg+xml;base64," preserveAspectRatio="xMidYMid meet"/>  <text class="cardTitle" x="988.2" y="850" text-anchor="middle">Redis</text>
  <text class="cardText" x="988.2" y="882" text-anchor="middle">Bucket4j bucket cache</text>

  <path class="lineBlue" d="M 397.72 380 H 610" stroke-linecap="round" stroke-linejoin="round"/>
  <rect class="labelBox" x="422.12" y="337" width="173.24" height="30" rx="15" stroke="#8eb4d6"/>
  <text class="label" x="508.74" y="357" text-anchor="middle" fill="#457b9d">public HTTP</text>

  <path class="lineGreen" d="M 1039.44 324 H 1305.4" stroke-linecap="round" stroke-linejoin="round"/>
  <rect class="labelBox" x="1076.04" y="279" width="190.32" height="30" rx="15" stroke="#91b884"/>
  <text class="label" x="1171.2" y="299" text-anchor="middle" fill="#5f8f5b">/customer-service/**</text>

  <path class="lineGreen" d="M 1039.44 394 L 1134.6 394 Q 1146.8 394 1146.8 404 L 1146.8 498 Q 1146.8 508 1159 508 L 1305.4 508" stroke-linecap="round" stroke-linejoin="round"/>
  <rect class="labelBox" x="1067.5" y="428" width="175.68" height="30" rx="15" stroke="#91b884"/>
  <text class="label" x="1155.34" y="448" text-anchor="middle" fill="#5f8f5b">/order-service/**</text>

  <path class="lineGold" d="M 1039.44 410 L 1122.4 410 Q 1137.04 410 1137.04 420 L 1137.04 675 Q 1137.04 685 1146.8 685 L 1305.4 685" stroke-linecap="round" stroke-linejoin="round"/>
  <rect class="labelBox" x="1068.72" y="632" width="148.84" height="30" rx="15" stroke="#d5a656"/>
  <text class="label" x="1143.14" y="652" text-anchor="middle" fill="#a87332">/echo route</text>

  <path class="lineRed" d="M 824.72 624 V 810" stroke-linecap="round" stroke-linejoin="round"/>
  <rect class="labelBox" x="856.44" y="700" width="173.24" height="30" rx="15" stroke="#bc544f"/>
  <text class="label" x="943.06" y="720" text-anchor="middle" fill="#b44d49">rate-limit state</text>

</svg>
