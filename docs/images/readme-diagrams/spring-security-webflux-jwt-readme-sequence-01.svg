<svg xmlns="http://www.w3.org/2000/svg" width="1270" height="722" viewBox="0 0 1270 722" role="img" aria-label="Spring Security WebFlux JWT Diagram 1">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#1f2937" flood-opacity="0.10"/></filter>
  <marker id="arrowBlue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M1 1 L7 4 L1 7 Z" fill="#5b8def"/></marker>
  <marker id="arrowTeal" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M1 1 L7 4 L1 7 Z" fill="#45a7a1"/></marker>
  <style>
    .canvas{fill:#f7f9fc}
    .frame{fill:#ffffff;stroke:#d8e0ea;stroke-width:1.5}
    .title{font-family:"Architects Daughter";font-size:34px;fill:#102033}
    .subtitle{font-family:"Comic Mono";font-size:13px;fill:#536273}
    .actor{font-family:"Architects Daughter";font-size:17px;fill:#102033}
    .detail{font-family:"Comic Mono";font-size:11px;fill:#536273}
    .message{font-family:"Comic Mono";font-size:12px;fill:#263445;paint-order:stroke;stroke:#ffffff;stroke-width:4px;stroke-linejoin:round}
    .branch{font-family:"Architects Daughter";font-size:15px;fill:#1f3b57}
    .lifeline{stroke:#b8c4d3;stroke-width:1.4;stroke-dasharray:7 6}
    .call{stroke:#5b8def;stroke-width:2.1;fill:none;marker-end:url(#arrowBlue)}
    .return{stroke:#45a7a1;stroke-width:2;stroke-dasharray:7 5;fill:none;marker-end:url(#arrowTeal)}
    .box{stroke-width:1.8;filter:url(#shadow)}
  </style>
</defs>
<rect class="canvas" width="1270" height="722"/>
<rect class="frame" x="24" y="20" width="1222" height="682" rx="18"/>
<text class="title" x="48" y="58">Spring Security WebFlux JWT Diagram 1</text>
<text class="subtitle" x="50" y="84">sequenceDiagram rendered from the current README model; labels are separated from connector lanes</text>
<rect class="box" x="46" y="116" width="152" height="58" rx="10" fill="#e8f3ff" stroke="#7aa0c4"/>
<text class="actor" x="122" y="145" text-anchor="middle" dominant-baseline="middle">Client</text>
<line class="lifeline" x1="122" y1="174" x2="122" y2="664"/>
<rect class="box" x="302.5" y="116" width="152" height="58" rx="10" fill="#eaf7ef" stroke="#7aa0c4"/>
<text class="actor" x="378.5" y="137" text-anchor="middle" dominant-baseline="middle">TokenController</text>
<text class="actor" x="378.5" y="153" text-anchor="middle" dominant-baseline="middle">(POST /token)</text>
<line class="lifeline" x1="378.5" y1="174" x2="378.5" y2="664"/>
<rect class="box" x="559" y="116" width="152" height="58" rx="10" fill="#fff3d9" stroke="#7aa0c4"/>
<text class="actor" x="635" y="137" text-anchor="middle" dominant-baseline="middle">HelloController</text>
<text class="actor" x="635" y="153" text-anchor="middle" dominant-baseline="middle">(GET /)</text>
<line class="lifeline" x1="635" y1="174" x2="635" y2="664"/>
<rect class="box" x="815.5" y="116" width="152" height="58" rx="10" fill="#f1ecff" stroke="#7aa0c4"/>
<text class="actor" x="891.5" y="145" text-anchor="middle" dominant-baseline="middle">JwtEncoder (RSA)</text>
<line class="lifeline" x1="891.5" y1="174" x2="891.5" y2="664"/>
<rect class="box" x="1072" y="116" width="152" height="58" rx="10" fill="#fdecef" stroke="#7aa0c4"/>
<text class="actor" x="1148" y="145" text-anchor="middle" dominant-baseline="middle">NimbusReactiveJwtDecoder</text>
<line class="lifeline" x1="1148" y1="174" x2="1148" y2="664"/>
<rect x="78" y="188" width="344.5" height="24" rx="6" fill="#ffffff" opacity="0.92" stroke="#dbe3ee"/>
<text class="message" x="250.25" y="194" text-anchor="middle" dominant-baseline="middle">1. POST /token (HTTP Basic:</text>
<text class="message" x="250.25" y="208" text-anchor="middle" dominant-baseline="middle">user/password)</text>
<path class="call" d="M122 218 L378.5 218"/>
<rect x="425" y="242" width="420" height="24" rx="6" fill="#ffffff" opacity="0.92" stroke="#dbe3ee"/>
<text class="message" x="635" y="255" text-anchor="middle" dominant-baseline="middle">2. sign JWT (issuer=self, 10h expiry)</text>
<path class="call" d="M378.5 272 L891.5 272"/>
<rect x="425" y="296" width="420" height="24" rx="6" fill="#ffffff" opacity="0.92" stroke="#dbe3ee"/>
<text class="message" x="635" y="309" text-anchor="middle" dominant-baseline="middle">3. signed JWT string</text>
<path class="return" d="M891.5 326 L378.5 326"/>
<rect x="78" y="350" width="344.5" height="24" rx="6" fill="#ffffff" opacity="0.92" stroke="#dbe3ee"/>
<text class="message" x="250.25" y="363" text-anchor="middle" dominant-baseline="middle">4. Bearer token</text>
<path class="return" d="M378.5 380 L122 380"/>
<rect x="168.5" y="404" width="420" height="24" rx="6" fill="#ffffff" opacity="0.92" stroke="#dbe3ee"/>
<text class="message" x="378.5" y="417" text-anchor="middle" dominant-baseline="middle">5. GET / (Authorization: Bearer &lt;token&gt;)</text>
<path class="call" d="M122 434 L635 434"/>
<rect x="681.5" y="458" width="420" height="24" rx="6" fill="#ffffff" opacity="0.92" stroke="#dbe3ee"/>
<text class="message" x="891.5" y="471" text-anchor="middle" dominant-baseline="middle">6. validate &amp; decode token</text>
<path class="call" d="M635 488 L1148 488"/>
<rect x="681.5" y="512" width="420" height="24" rx="6" fill="#ffffff" opacity="0.92" stroke="#dbe3ee"/>
<text class="message" x="891.5" y="525" text-anchor="middle" dominant-baseline="middle">7. principal name</text>
<path class="return" d="M1148 542 L635 542"/>
<rect x="168.5" y="566" width="420" height="24" rx="6" fill="#ffffff" opacity="0.92" stroke="#dbe3ee"/>
<text class="message" x="378.5" y="579" text-anchor="middle" dominant-baseline="middle">8. &quot;Hello, user!&quot;</text>
<path class="return" d="M635 596 L122 596"/>
</svg>
