<svg xmlns="http://www.w3.org/2000/svg" width="920" height="440" viewBox="0 0 920 440" role="img" aria-label="Bucket4j Caffeine Web Architecture">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#1f2937" flood-opacity="0.10"/></filter>
  <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth">
    <path d="M1,1 L8,4.5 L1,8 Z" fill="#758297"/>
  </marker>
  <style>
    .canvas{fill:#f7f9fc}.frame{fill:#fff;stroke:#d8e0ea;stroke-width:1.5}
    .title{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:38px;font-weight:400;fill:#102033}
    .subtitle{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:14px;font-weight:400;fill:#536273}
    .smallLabel{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:21px;font-weight:400;fill:#102033}
    .mono{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#102033}
    .small{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#536273}
    .card{stroke-width:2.1;filter:url(#shadow)}
    .line{stroke:#758297;stroke-width:2.1;fill:none;marker-end:url(#arrow)}
  </style>
</defs>
<!-- Layout:
     Canvas: 920×440  Frame: x=24 y=20 w=872 h=396
     Row1  y=98  h=54  IndexController center x=220 w=480
     Row2  y=212 h=80  Col1: x=24 w=400 cx=224 (Bucket4j Filter)
                        Col2: x=472 w=400 cx=672 (Caffeine Bucket)
     Row3  y=352 h=64  Spring MVC + Bucket4j auto-config full width
     Gap: col1 right=424 < col2 left=472 ✓ (gap=48px)
-->
<rect class="canvas" width="920" height="440"/>
<rect class="frame" x="24" y="20" width="872" height="396" rx="28"/>
<text class="title" x="58" y="66">Bucket4j Caffeine Web</text>
<text class="subtitle" x="58" y="92">Spring MVC · Servlet Filter · Caffeine in-memory · IP-based · bucket4j-spring-boot-starter</text>

<!-- Arrows -->
<path class="line" d="M460 152 L460 182 L224 182 L224 212"/>
<path class="line" d="M460 152 L460 182 L672 182 L672 212"/>
<path class="line" d="M224 292 L224 332 L460 332 L460 352"/>
<path class="line" d="M672 292 L672 332 L460 332 L460 352"/>

<!-- IndexController (center top) -->
<g transform="translate(220,98)">
  <rect class="card" x="0" y="0" width="480" height="54" rx="12" fill="#EAF7EF" stroke="#58A978"/>
  <text class="smallLabel" x="240" y="22" text-anchor="middle">IndexController</text>
  <text class="mono" x="240" y="42" text-anchor="middle">GET /hello · GET /world · Spring MVC @RestController</text>
</g>

<!-- Bucket4j Servlet Filter col1 -->
<g transform="translate(24,212)">
  <rect class="card" x="0" y="0" width="400" height="80" rx="12" fill="#E8F3FF" stroke="#5B8DEF"/>
  <text class="smallLabel" x="200" y="22" text-anchor="middle">Bucket4j Servlet Filter</text>
  <text class="mono" x="200" y="44" text-anchor="middle">IP-based key · tryConsume(1)</text>
  <text class="small" x="200" y="64" text-anchor="middle">X-RateLimit-Remaining · 429 on exhaustion</text>
</g>

<!-- Caffeine Bucket col2 -->
<g transform="translate(472,212)">
  <rect class="card" x="0" y="0" width="400" height="80" rx="12" fill="#FFF3D9" stroke="#D6A441"/>
  <text class="smallLabel" x="200" y="22" text-anchor="middle">Caffeine Bucket</text>
  <text class="mono" x="200" y="44" text-anchor="middle">LocalBucket · in-memory</text>
  <text class="small" x="200" y="64" text-anchor="middle">refillIntervally · single-node only · no Redis</text>
</g>

<!-- Spring MVC + Bucket4j auto-config (full width bottom) -->
<g transform="translate(24,352)">
  <rect class="card" x="0" y="0" width="872" height="64" rx="12" fill="#E9F7F6" stroke="#45A7A1"/>
  <text class="smallLabel" x="436" y="22" text-anchor="middle">Spring MVC + Bucket4j Auto-Config</text>
  <text class="small" x="436" y="42" text-anchor="middle">bucket4j-spring-boot-starter · CaffeineApplication · @SpringBootApplication</text>
  <text class="small" x="436" y="58" text-anchor="middle">single node / local dev — no distributed support</text>
</g>
</svg>
