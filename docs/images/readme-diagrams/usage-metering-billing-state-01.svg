<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1060" viewBox="0 0 1800 1060" role="img" aria-labelledby="title desc"><title id="title">Billing Period and Close Run State Diagram</title><desc id="desc">Billing period and close run one-way transitions, validation failure, retry, and finalization.</desc><defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="124%"><feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#64748B" flood-opacity="0.13"/></filter>
  <style>
    .bg{fill:#F8FAFC}.frame{fill:#FFFFFF;stroke:#CAD6DF;stroke-width:2}.layer{stroke-width:2}.blueLayer{fill:#EFF6FF;stroke:#A8C7EA}.greenLayer{fill:#F0F8F0;stroke:#B8D7AE}.amberLayer{fill:#FFF7E8;stroke:#DFC69A}.purpleLayer{fill:#F8F3FF;stroke:#D7C3EF}.title{font-family:"Architects Daughter";font-size:42px;fill:#263238}.subtitle,.body,.small,.footer,.msg,.legend{font-family:"Comic Mono";fill:#3E4C59}.subtitle{font-size:18px}.layerTitle{font-family:"Architects Daughter";font-size:27px;fill:#344154}.cardTitle,.participant{font-family:"Architects Daughter";font-size:23px;fill:#16202A}.body{font-size:16px}.small{font-size:13px;fill:#5B6975}.footer{font-size:14px;fill:#60727D}.card{fill:#FFFFFF;stroke:#9FB0BC;stroke-width:2}.blueCard{fill:#EFF6FF;stroke:#4F86C6}.greenCard{fill:#F0F8F0;stroke:#6E8F4F}.amberCard{fill:#FFF7E8;stroke:#9B7D54}.redCard{fill:#FFF0F0;stroke:#B86868}.purpleCard{fill:#F8F3FF;stroke:#8065A8}.connector{fill:none;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round}.blueEdge{stroke:#4F86C6;marker-end:url(#arrow-blue)}.greenEdge{stroke:#6E8F4F;marker-end:url(#arrow-green)}.amberEdge{stroke:#9B7D54;marker-end:url(#arrow-amber)}.redEdge{stroke:#B86868;marker-end:url(#arrow-red)}.purpleEdge{stroke:#8065A8;marker-end:url(#arrow-purple)}.tealEdge{stroke:#2D948C;marker-end:url(#arrow-teal)}.dashed{stroke-dasharray:9 7}.lifeline{stroke:#9AAAB1;stroke-width:2;stroke-dasharray:7 8}.activation{fill:#EAF6EF;stroke:#6F9278;stroke-width:1.5}.label{fill:#FFFFFF;stroke:#D7E0E4;stroke-width:1.5}.badge{font-family:"Comic Mono";font-size:13px;font-weight:700}.state{font-family:"Architects Daughter";font-size:22px}
  </style>
  <marker id="arrow-blue" viewBox="0 0 10 10" markerWidth="14" markerHeight="14" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse" data-role="primary" data-tip-direction="positive-x"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#4F86C6" stroke="#4F86C6" stroke-dasharray="none"/></marker><marker id="arrow-green" viewBox="0 0 10 10" markerWidth="14" markerHeight="14" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse" data-role="primary" data-tip-direction="positive-x"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#6E8F4F" stroke="#6E8F4F" stroke-dasharray="none"/></marker><marker id="arrow-amber" viewBox="0 0 10 10" markerWidth="14" markerHeight="14" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse" data-role="primary" data-tip-direction="positive-x"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#9B7D54" stroke="#9B7D54" stroke-dasharray="none"/></marker><marker id="arrow-red" viewBox="0 0 10 10" markerWidth="14" markerHeight="14" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse" data-role="primary" data-tip-direction="positive-x"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#B86868" stroke="#B86868" stroke-dasharray="none"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" markerWidth="14" markerHeight="14" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse" data-role="primary" data-tip-direction="positive-x"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#8065A8" stroke="#8065A8" stroke-dasharray="none"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" markerWidth="14" markerHeight="14" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse" data-role="primary" data-tip-direction="positive-x"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#2D948C" stroke="#2D948C" stroke-dasharray="none"/></marker>
  </defs><rect class="bg" width="1800" height="1060"/><text class="title" x="900" y="66" text-anchor="middle">Billing Lifecycle - Restartable Workflow, Immutable Result</text><text class="subtitle" x="900" y="102" text-anchor="middle">A period freezes once; the close run may restart from its checkpoint but never rewrites financial history.</text>
  <rect class="layer blueLayer" x="80" y="150" width="1640" height="320" rx="22"/><text class="layerTitle" x="115" y="195">Billing period</text><g class="node" data-node="period-open" filter="url(#shadow)"><rect class="card blueCard" x="170" y="275" width="320" height="100" rx="16"/><text class="cardTitle" x="330" y="310" text-anchor="middle">OPEN</text><text class="body" x="330" y="338" text-anchor="middle">accept usage and adjustments</text></g><g class="node" data-node="period-closing" filter="url(#shadow)"><rect class="card amberCard" x="740" y="275" width="320" height="100" rx="16"/><text class="cardTitle" x="900" y="310" text-anchor="middle">CLOSING</text><text class="body" x="900" y="338" text-anchor="middle">cutoffReceivedAt is fixed</text></g><g class="node" data-node="period-finalized" filter="url(#shadow)"><rect class="card greenCard" x="1310" y="275" width="320" height="100" rx="16"/><text class="cardTitle" x="1470" y="310" text-anchor="middle">FINALIZED</text><text class="body" x="1470" y="338" text-anchor="middle">invoice and ledger immutable</text></g><g class="edge" data-edge="period-open-closing" data-label="start close after lateness"><path data-connector="period-open-closing" class="connector amberEdge" d="M490 325 L740 325"/></g><g class="edge" data-edge="period-closing-final" data-label="invoice transaction commits"><path data-connector="period-closing-final" class="connector greenEdge" d="M1060 325 L1310 325"/></g>
  <rect class="layer purpleLayer" x="80" y="530" width="1640" height="390" rx="22"/><text class="layerTitle" x="115" y="575">Close run</text><g class="node" data-node="run-running" filter="url(#shadow)"><rect class="card purpleCard" x="135" y="685" width="290" height="105" rx="16"/><text class="cardTitle" x="280" y="720" text-anchor="middle">RUNNING</text><text class="body" x="280" y="748" text-anchor="middle">(occurredAt, usageId)</text><text class="body" x="280" y="771" text-anchor="middle">checkpoint batches</text></g><g class="node" data-node="run-failed" filter="url(#shadow)"><rect class="card redCard" x="555" y="685" width="290" height="105" rx="16"/><text class="cardTitle" x="700" y="720" text-anchor="middle">FAILED_VALIDATION</text><text class="body" x="700" y="748" text-anchor="middle">stable pricing finding</text><text class="body" x="700" y="771" text-anchor="middle">operator repairs gap</text></g><g class="node" data-node="run-ready" filter="url(#shadow)"><rect class="card amberCard" x="975" y="685" width="290" height="105" rx="16"/><text class="cardTitle" x="1120" y="720" text-anchor="middle">READY_TO_FINALIZE</text><text class="body" x="1120" y="748" text-anchor="middle">all eligible usage priced</text><text class="body" x="1120" y="771" text-anchor="middle">ledger snapshot fixed</text></g><g class="node" data-node="run-final" filter="url(#shadow)"><rect class="card greenCard" x="1395" y="685" width="290" height="105" rx="16"/><text class="cardTitle" x="1540" y="720" text-anchor="middle">FINALIZED</text><text class="body" x="1540" y="748" text-anchor="middle">invoice provenance linked</text><text class="body" x="1540" y="771" text-anchor="middle">no mutable exit</text></g><g class="edge" data-edge="run-running-failed" data-label="price missing"><path data-connector="run-running-failed" class="connector redEdge" d="M425 738 L555 738"/></g><g class="edge" data-edge="run-running-ready" data-label="end of keyset, zero findings"><path data-connector="run-running-ready" class="connector greenEdge" d="M425 705 L460 705 Q 475 705 475 650 Q 475 635 490 635 L1120 635 Q 1135 635 1135 650 L1135 685"/></g><g class="edge" data-edge="run-failed-running" data-label="explicit repair and resume"><path data-connector="run-failed-running" class="connector purpleEdge" d="M700 790 L700 845 Q 700 860 685 860 L295 860 Q 280 860 280 845 L280 790"/></g><g class="edge" data-edge="run-ready-final" data-label="atomic invoice finalization"><path data-connector="run-ready-final" class="connector greenEdge" d="M1265 738 L1395 738"/></g>
  <rect class="frame" x="190" y="955" width="1420" height="62" rx="15"/><text class="body" x="900" y="993" text-anchor="middle">Late usage never reopens FINALIZED: it posts a positive DEBIT_ADJUSTMENT into the unique current OPEN period.</text></svg>