<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="920" viewBox="0 0 1600 920">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#23384d" flood-opacity="0.16"/>
    </filter>
    <marker id="arrow-blue" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L13 7 L1 13 Z" fill="#397ca6" stroke="#397ca6"/></marker>
    <marker id="arrow-green" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L13 7 L1 13 Z" fill="#4f8a55" stroke="#4f8a55"/></marker>
    <marker id="arrow-fault" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L13 7 L1 13 Z" fill="#b95855" stroke="#b95855" stroke-dasharray="none"/></marker>
    <marker id="arrow-purple" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L13 7 L1 13 Z" fill="#7563a8" stroke="#7563a8"/></marker>
    <style>
      .title { font: 48px 'Architects Daughter', cursive; fill: #16283a; }
      .subtitle, .lane, .card-title { font-family: 'Architects Daughter', cursive; fill: #263b50; }
      .subtitle { font-size: 22px; } .lane { font-size: 27px; } .card-title { font-size: 26px; }
      .detail, .label, .legend { font-family: 'Comic Mono', monospace; fill: #43586d; }
      .detail { font-size: 17px; } .label { font-size: 15px; font-weight: 700; } .legend { font-size: 16px; }
      .card { fill: #fffefa; stroke-width: 2.5; filter: url(#shadow); }
      .connector { fill: none; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <rect x="18" y="18" width="1564" height="884" rx="28" fill="#f8faf9" stroke="#ccd9df" stroke-width="2"/>
  <text x="800" y="76" text-anchor="middle" class="title">High-Contention Profile Runner Architecture</text>
  <text x="800" y="110" text-anchor="middle" class="subtitle">One versioned contract, isolated child JVMs, real data paths, fail-closed evidence</text>

  <rect x="55" y="145" width="1490" height="145" rx="24" fill="#eaf3ff" stroke="#91b7d8" stroke-width="2.5"/>
  <text x="82" y="182" class="lane">Contract and build boundary</text>
  <g data-node="contract"><rect class="card" x="115" y="205" width="435" height="62" rx="15" stroke="#6da5cd"/><text x="332" y="235" text-anchor="middle" class="card-title">profiles/high-contention/v1</text><text x="332" y="257" text-anchor="middle" class="detail">suite, profiles, schedules, report schema</text></g>
  <g data-node="build-logic"><rect class="card" x="610" y="205" width="415" height="62" rx="15" stroke="#6da5cd"/><text x="818" y="235" text-anchor="middle" class="card-title">Included build-logic plugins</text><text x="818" y="257" text-anchor="middle" class="detail">root coordinator + profile task registration</text></g>
  <g data-node="entrypoints"><rect class="card" x="1085" y="205" width="400" height="62" rx="15" stroke="#6da5cd"/><text x="1285" y="235" text-anchor="middle" class="card-title">Root entry points</text><text x="1285" y="257" text-anchor="middle" class="detail">highContentionCi / LocalReference</text></g>

  <rect x="55" y="325" width="1490" height="335" rx="24" fill="#edf7f0" stroke="#8fc39c" stroke-width="2.5"/>
  <text x="82" y="364" class="lane">Isolated execution boundary</text>
  <g data-node="coordinator">
    <rect class="card" x="105" y="405" width="315" height="170" rx="18" stroke="#397ca6"/>
    <text x="262" y="443" text-anchor="middle" class="card-title">Root coordinator</text>
    <text x="262" y="475" text-anchor="middle" class="detail">selects one matrix tuple</text><text x="262" y="501" text-anchor="middle" class="detail">allocates exact labels</text><text x="262" y="527" text-anchor="middle" class="detail">enforces deadline reserves</text><text x="262" y="553" text-anchor="middle" class="detail">max active topology = 1</text>
  </g>
  <g data-node="child-boundary">
    <rect x="475" y="390" width="645" height="230" rx="20" fill="#f7fcf8" stroke="#72a77c" stroke-width="2.5" stroke-dasharray="10 7"/>
    <text x="505" y="428" class="card-title">One no-daemon Gradle + Test worker JVM</text><text x="505" y="455" class="detail">one-shot descriptor • Java 25 • isolated project cache</text>
    <g data-node="job-core"><rect class="card" x="515" y="480" width="255" height="50" rx="13" stroke="#72a77c"/><text x="642" y="511" text-anchor="middle" class="card-title">Job Core</text></g>
    <g data-node="job-spring"><rect class="card" x="805" y="480" width="255" height="50" rx="13" stroke="#72a77c"/><text x="932" y="511" text-anchor="middle" class="card-title">Job Spring</text></g>
    <g data-node="job-ktor"><rect class="card" x="515" y="550" width="255" height="50" rx="13" stroke="#72a77c"/><text x="642" y="581" text-anchor="middle" class="card-title">Job Ktor</text></g>
    <g data-node="ticket-spring"><rect class="card" x="805" y="550" width="255" height="50" rx="13" stroke="#72a77c"/><text x="932" y="581" text-anchor="middle" class="card-title">Ticket Spring</text></g>
  </g>
  <g data-node="evidence-gate">
    <rect class="card" x="1170" y="405" width="315" height="170" rx="18" stroke="#7563a8"/>
    <text x="1328" y="443" text-anchor="middle" class="card-title">Evidence gate</text>
    <text x="1328" y="475" text-anchor="middle" class="detail">immutable journal + report</text><text x="1328" y="501" text-anchor="middle" class="detail">schema + digest validation</text><text x="1328" y="527" text-anchor="middle" class="detail">redacted upload allowlist</text><text x="1328" y="553" text-anchor="middle" class="detail">zero-live cleanup required</text>
  </g>

  <rect x="55" y="695" width="1490" height="115" rx="24" fill="#fff6e7" stroke="#d6ad62" stroke-width="2.5"/>
  <text x="82" y="727" class="lane">Real infrastructure and fault path</text>
  <g data-node="postgres"><rect class="card" x="330" y="742" width="330" height="58" rx="15" stroke="#4f8a55"/><text x="495" y="769" text-anchor="middle" class="card-title">PostgreSQL authority</text><text x="495" y="792" text-anchor="middle" class="detail">lease • fence • dedup • checkpoint • state</text></g>
  <g data-node="toxiproxy"><rect class="card" x="815" y="742" width="235" height="58" rx="15" stroke="#b95855"/><text x="932" y="769" text-anchor="middle" class="card-title">Toxiproxy</text><text x="932" y="792" text-anchor="middle" class="detail">cut / restore Redis path</text></g>
  <g data-node="redis"><rect class="card" x="1125" y="742" width="220" height="58" rx="15" stroke="#b67a1d"/><text x="1235" y="769" text-anchor="middle" class="card-title">Redis</text><text x="1235" y="792" text-anchor="middle" class="detail">advisory coordination only</text></g>

  <path class="connector" data-connector="contract-to-build-logic" d="M550 236 H610" stroke="#397ca6" marker-end="url(#arrow-blue)"/><path class="connector" data-connector="build-logic-to-entrypoints" d="M1025 236 H1085" stroke="#397ca6" marker-end="url(#arrow-blue)"/>
  <path class="connector" data-connector="entrypoints-to-coordinator" d="M1285 267 V305 Q1285 315 1275 315 H272 Q262 315 262 325 V405" stroke="#397ca6" marker-end="url(#arrow-blue)"/>
  <path class="connector" data-connector="coordinator-to-child" d="M420 490 H475" stroke="#397ca6" marker-end="url(#arrow-blue)"/><path class="connector" data-connector="child-to-evidence" d="M1120 490 H1170" stroke="#7563a8" marker-end="url(#arrow-purple)"/>
  <path class="connector" data-connector="child-to-postgres" d="M655 620 V670 Q655 685 640 685 H510 Q495 685 495 700 V742" stroke="#4f8a55" marker-end="url(#arrow-green)"/>
  <path class="connector" data-connector="child-to-toxiproxy" d="M935 620 V742" stroke="#b95855" stroke-dasharray="10 8" marker-end="url(#arrow-fault)"/><path class="connector" data-connector="toxiproxy-to-redis" d="M1050 771 H1125" stroke="#b95855" stroke-dasharray="10 8" marker-end="url(#arrow-fault)"/>
  <path class="connector" data-connector="evidence-to-cleanup" d="M1328 575 V655 Q1328 670 1313 670 H1145" stroke="#7563a8"/><text x="1215" y="655" text-anchor="middle" class="label">process + container reaping</text>

  <rect x="260" y="840" width="1080" height="42" rx="16" fill="#ffffff" stroke="#c7d4dc" stroke-width="2"/>
  <line x1="300" y1="861" x2="355" y2="861" stroke="#397ca6" stroke-width="4"/><text x="370" y="867" class="legend">control / selection</text>
  <line x1="575" y1="861" x2="630" y2="861" stroke="#4f8a55" stroke-width="4"/><text x="645" y="867" class="legend">authoritative path</text>
  <line x1="855" y1="861" x2="910" y2="861" stroke="#b95855" stroke-width="4" stroke-dasharray="10 8"/><text x="925" y="867" class="legend">fault-injected path</text>
  <line x1="1125" y1="861" x2="1180" y2="861" stroke="#7563a8" stroke-width="4"/><text x="1195" y="867" class="legend">evidence / cleanup</text>
</svg>
