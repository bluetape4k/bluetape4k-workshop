<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="760" viewBox="0 0 1120 760" role="img" aria-labelledby="title desc">
  <title id="title">Event Aggregation Sequence</title>
  <desc id="desc">Sequence showing bounded aggregation, read model projection, lifecycle collapse, and sanitized audit output.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9 z" fill="#314a67"/>
    </marker>
    <style>
      .title { font-family: 'Architects Daughter', 'Comic Mono'; font-size: 34px; fill: #1f2937; }
      .actor, .message, .note { font-family: 'Comic Mono', 'Architects Daughter'; fill: #263238; }
      .actor { font-size: 16px; font-weight: 700; }
      .message { font-size: 13px; }
      .note { font-size: 13px; fill: #52616f; }
      .box { fill: #ffffff; stroke: #314a67; stroke-width: 2.2; rx: 7; }
      .lifeline { stroke: #94a3b8; stroke-width: 1.5; stroke-dasharray: 7 7; }
      .call { fill: none; stroke: #314a67; stroke-width: 2.6; marker-end: url(#arrow); }
      .return { fill: none; stroke: #2d9d78; stroke-width: 2.6; stroke-dasharray: 8 5; marker-end: url(#arrow); }
      .message-label { fill: #fbfcfe; stroke: #d4dce6; stroke-width: 1.2; rx: 5; }
    </style>
  </defs>
  <rect width="1120" height="760" fill="#fbfcfe"/>
  <text class="title" x="560" y="44" text-anchor="middle">Event Aggregation Sequence</text>

  <rect class="box" x="48" y="64" width="170" height="58"/>
  <text class="actor" x="133" y="99" text-anchor="middle">Event Flow</text>
  <rect class="box" x="260" y="64" width="170" height="58"/>
  <text class="actor" x="345" y="99" text-anchor="middle">Aggregator</text>
  <rect class="box" x="472" y="64" width="170" height="58"/>
  <text class="actor" x="557" y="99" text-anchor="middle">Read Model</text>
  <rect class="box" x="684" y="64" width="170" height="58"/>
  <text class="actor" x="769" y="99" text-anchor="middle">Audit Flow</text>
  <rect class="box" x="896" y="64" width="170" height="58"/>
  <text class="actor" x="981" y="99" text-anchor="middle">Collector</text>

  <path class="lifeline" d="M 133 122 L 133 706"/>
  <path class="lifeline" d="M 345 122 L 345 706"/>
  <path class="lifeline" d="M 557 122 L 557 706"/>
  <path class="lifeline" d="M 769 122 L 769 706"/>
  <path class="lifeline" d="M 981 122 L 981 706"/>

  <path class="call" d="M 133 156 L 345 156"/>
  <rect class="message-label" x="154" y="174" width="170" height="24"/>
  <text class="message" x="239" y="191" text-anchor="middle">events replayed</text>

  <path class="call" d="M 345 242 L 557 242"/>
  <rect class="message-label" x="358" y="260" width="186" height="24"/>
  <text class="message" x="451" y="277" text-anchor="middle">chunk and window</text>

  <path class="call" d="M 345 328 L 557 328"/>
  <rect class="message-label" x="372" y="346" width="158" height="24"/>
  <text class="message" x="451" y="363" text-anchor="middle">scan snapshot</text>

  <path class="return" d="M 557 414 L 981 414"/>
  <rect class="message-label" x="644" y="432" width="250" height="24"/>
  <text class="message" x="769" y="449" text-anchor="middle">summary and read model</text>

  <path class="call" d="M 557 500 L 981 500"/>
  <rect class="message-label" x="642" y="518" width="254" height="24"/>
  <text class="message" x="769" y="535" text-anchor="middle">collapse status changes</text>

  <path class="call" d="M 345 586 L 769 586"/>
  <rect class="message-label" x="444" y="604" width="226" height="24"/>
  <text class="message" x="557" y="621" text-anchor="middle">sanitize audit entry</text>

  <path class="return" d="M 769 672 L 981 672"/>
  <rect class="message-label" x="788" y="690" width="174" height="24"/>
  <text class="message" x="875" y="707" text-anchor="middle">redacted output</text>
</svg>
