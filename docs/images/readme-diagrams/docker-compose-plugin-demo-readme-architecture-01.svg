<svg xmlns="http://www.w3.org/2000/svg" width="1840" height="1040" viewBox="0 0 1840 1040" role="img" aria-labelledby="title desc">
  <title id="title">docker-compose-plugin demo architecture</title>
  <desc id="desc">Architecture showing the Gradle docker-compose plugin starting Redis and PostgreSQL before tests and exposing service URLs.</desc>
  <defs>
    <style>
      svg{background:#f8fafc}.frame{fill:#fff;stroke:#d8e4ef;stroke-width:2}
      .title{font-family:"Architects Daughter";font-size:42px;fill:#142033}.subtitle,.small,.footer{font-family:"Comic Mono";fill:#435469}
      .subtitle{font-size:17px}.small{font-size:15px}.footer{font-size:13px;fill:#5f7181}
      .layer{stroke:#d7e5ee;stroke-width:2}.gradle{fill:#f6fbff}.plugin{fill:#f8fcf7}.services{fill:#fffcf6}.contract{fill:#faf8ff}
      .layerTitle{font-family:"Architects Daughter";font-size:28px;fill:#1f3448}.card{stroke-width:2.4}
      .task{fill:#eef7ff;stroke:#7aa6cf}.pluginCard{fill:#effaf2;stroke:#75a985}.redisCard{fill:#fff2f1;stroke:#c66a60}.pgCard{fill:#fff7e8;stroke:#c59352}.elasticCard{fill:#f7f1ff;stroke:#9b83c7}.disabledCard{fill:#f1f3f6;stroke:#aeb8c2;stroke-dasharray:8 6}
      .cardTitle{font-family:"Architects Daughter";font-size:26px;fill:#142033}.dimTitle{font-family:"Architects Daughter";font-size:25px;fill:#7c8793}
      .line{fill:none;stroke:#52748d;stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}.redisLine{fill:none;stroke:#b74d46;stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#redisArrow)}.pgLine{fill:none;stroke:#9b6b2f;stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#pgArrow)}.disabledLine{fill:none;stroke:#8995a1;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:8 7;marker-end:url(#disabledArrow)}
      .dockerIconFill{fill:#e8f3ff;stroke:#2563eb;stroke-width:3}.dbIcon{fill:#fff0d8;stroke:#8c6f33;stroke-width:3}.elasticIcon{fill:#f7f1ff;stroke:#735ba8;stroke-width:3}
    </style>
    <marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" viewBox="0 0 10 10" refX="9" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#52748d" stroke-dasharray="none" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="redisArrow" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" viewBox="0 0 10 10" refX="9" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#b74d46" stroke-dasharray="none" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="pgArrow" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" viewBox="0 0 10 10" refX="9" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#9b6b2f" stroke-dasharray="none" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="disabledArrow" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" viewBox="0 0 10 10" refX="9" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#8995a1" stroke-dasharray="none" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <g id="dockerIcon"><rect class="dockerIconFill" x="0" y="0" width="66" height="58" rx="12"/><rect x="14" y="24" width="10" height="8" fill="#2563eb"/><rect x="27" y="24" width="10" height="8" fill="#2563eb"/><rect x="40" y="24" width="10" height="8" fill="#2563eb"/><rect x="27" y="13" width="10" height="8" fill="#2563eb"/><path d="M12 36h42c-5 11-15 17-28 17-8 0-14-4-14-17Z" fill="#60a5fa" stroke="#2563eb" stroke-width="2"/></g>
    <g id="postgresIcon"><rect x="0" y="0" width="66" height="66" rx="12" fill="#fffaf2" stroke="#28485a" stroke-width="4"/><ellipse cx="33" cy="20" rx="18" ry="8" class="dbIcon"/><path d="M15 20v27c0 6 9 10 18 10s18-4 18-10V20" class="dbIcon" stroke-linejoin="round"/><path d="M15 34c0 6 9 10 18 10s18-4 18-10" fill="none" stroke="#8c6f33" stroke-width="3"/></g>
    <g id="elasticIcon"><rect x="0" y="0" width="66" height="66" rx="12" fill="#f7f1ff" stroke="#735ba8" stroke-width="4"/><circle cx="33" cy="33" r="20" fill="#facc15" stroke="#735ba8" stroke-width="3"/><path d="M33 13a20 20 0 0 1 19 14H33Z" fill="#06b6d4"/><path d="M33 53a20 20 0 0 1-19-14h19Z" fill="#ec4899"/></g>
  </defs>
  <rect class="frame" x="30" y="28" width="1780" height="984" rx="18"/>
  <text class="title" x="920" y="84" text-anchor="middle">Gradle Docker Compose Plugin Test Runtime</text>
  <text class="subtitle" x="920" y="116" text-anchor="middle">The Gradle test task starts Compose services and injects mapped Redis/PostgreSQL URLs into the JVM.</text>
  <rect class="layer gradle" x="70" y="160" width="1700" height="190" rx="14"/>
  <text class="layerTitle" x="102" y="202">Gradle test task</text>
  <rect class="card task" x="165" y="238" width="490" height="76" rx="10"/><text class="cardTitle" x="410" y="270" text-anchor="middle">tasks.test</text><text class="small" x="410" y="296" text-anchor="middle">depends on dockerCompose; receives system properties</text>
  <rect class="card task" x="1210" y="238" width="440" height="76" rx="10"/><text class="cardTitle" x="1430" y="270" text-anchor="middle">DockerComposePluginTest</text>  <text class="small" x="1430" y="296" text-anchor="middle">uses redis.url and Redisson map assertions</text>
  <rect class="layer plugin" x="70" y="405" width="1700" height="210" rx="14"/>
  <text class="layerTitle" x="102" y="447">docker-compose plugin configuration</text>
  <rect class="card pluginCard" x="250" y="484" width="1340" height="78" rx="10"/><use href="#dockerIcon" x="282" y="494"/><text class="cardTitle" x="920" y="516" text-anchor="middle">dockerCompose block</text>  <text class="small" x="920" y="542" text-anchor="middle">useComposeFiles: docker-compose.yml + docker-compose-postgres.yml; startedServices: redis, postgres</text>
  <rect class="layer services" x="70" y="670" width="1700" height="215" rx="14"/>
  <text class="layerTitle" x="102" y="712">Services wired into test</text>
  <rect class="card redisCard" x="160" y="760" width="440" height="82" rx="10"/><image data-bluetape4k-icon="redis" data-source="docs/icons/redis/redis-icon.svg" x="185" y="778" width="46" height="46" href="data:image/svg+xml;base64," preserveAspectRatio="xMidYMid meet"/>  <text class="cardTitle" x="420" y="794" text-anchor="middle">Redis 7</text>  <text class="small" x="420" y="820" text-anchor="middle">redis.url = redis://host:port</text>
  <rect class="card pgCard" x="665" y="760" width="540" height="82" rx="10"/><use href="#postgresIcon" x="690" y="768"/>  <text class="cardTitle" x="960" y="794" text-anchor="middle">PostgreSQL 18</text>  <text class="small" x="960" y="820" text-anchor="middle">postgres.url = jdbc:postgresql://host:port/postgres</text>
  <rect class="card disabledCard" x="1270" y="744" width="440" height="104" rx="10"/><use href="#elasticIcon" x="1295" y="763"/>  <text class="dimTitle" x="1510" y="778" text-anchor="middle">Elasticsearch</text><text class="dimTitle" x="1510" y="804" text-anchor="middle">compose file</text><text class="small" x="1510" y="828" text-anchor="middle">present in docker-compose-multiple.yml</text><text class="small" x="1510" y="848" text-anchor="middle">not wired into current test task</text>
  <rect class="layer contract" x="70" y="930" width="1700" height="52" rx="14"/><text class="footer" x="920" y="962" text-anchor="middle">Reader contract: the plugin owns service lifecycle; tests consume injected URLs, not Testcontainers APIs.</text>
  <path class="line" d="M 410 314 L 410 445 Q 410 455 420 455 L 760 455 Q 770 455 770 465 L 770 484" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="line" d="M 1430 314 L 1430 445 Q 1430 455 1420 455 L 1080 455 Q 1070 455 1070 465 L 1070 484" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="redisLine" d="M 770 562 L 770 690 Q 770 700 760 700 L 430 700 Q 420 700 420 710 L 420 760" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="pgLine" d="M 920 562 V 760" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="disabledLine" d="M 1070 562 L 1070 690 Q 1070 700 1080 700 L 1500 700 Q 1510 700 1510 710 L 1510 744" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
