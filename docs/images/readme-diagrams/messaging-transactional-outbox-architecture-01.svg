<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-label="Transactional Outbox Architecture">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#1f2937" flood-opacity="0.10"/></filter>
  <marker id="arrow" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse">
    <path d="M2,2 L12,7 L2,12 Z" fill="#758297"/>
  </marker>
  <marker id="arrowGreen" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse">
    <path d="M2,2 L12,7 L2,12 Z" fill="#58A978"/>
  </marker>
  <style>
    .canvas{fill:#f7f9fc}.frame{fill:#fff;stroke:#d8e0ea;stroke-width:1.5}
    .title{font-family:"Architects Daughter";font-size:34px;fill:#102033}
    .subtitle{font-family:"Comic Mono";font-size:14px;fill:#536273}
    .label{font-family:"Architects Daughter";font-size:18px;fill:#102033}
    .mono{font-family:"Comic Mono";font-size:11px;fill:#536273}
    .bandlabel{font-family:"Architects Daughter";font-size:14px;fill:#758297}
    .card{stroke-width:2;filter:url(#shadow)}
    .line{stroke:#758297;stroke-width:2;fill:none;marker-end:url(#arrow)}
    .txline{stroke:#8A72D6;stroke-width:2.5;fill:none;stroke-dasharray:8,4}
    .publine{stroke:#58A978;stroke-width:2;fill:none;marker-end:url(#arrowGreen)}
  </style>
</defs>
<rect class="canvas" width="1200" height="820"/>
<rect class="frame" x="28" y="24" width="1144" height="772" rx="20"/>

<text class="title" x="52" y="68">Transactional Outbox Pattern</text>
<text class="subtitle" x="52" y="92">Spring Boot 4 + Exposed + Kafka · Atomic dual-write with at-least-once delivery</text>

<!--
  BOUNDING BOXES:
  Write panel: x=52-560, y=118-660
  Publish panel: x=600-1140, y=118-660
  Client: x=190-370, y=150-202
  OrderCtrl: x=150-410, y=248-316
  OrderSvc: x=150-410, y=364-432
  TX bracket: x=80-520, y=470-620
  OrderTable: x=90-300, y=508-576
  OutboxTable: x=310-520, y=508-576
  OutboxPublisher: x=660-1060, y=160-232
  outbox_events: x=660-1060, y=286-354
  Kafka: x=720-980, y=408-476
  StatusLifecycle: x=660-1060, y=530-602
  DB: x=380-720, y=700-760
  Gaps in publish path: y=232-286, y=354-408, y=476-530
-->

<!-- Write Path panel -->
<rect x="52" y="118" width="508" height="542" rx="14" fill="#F8FAFD" stroke="#D8E0EA" stroke-width="1"/>
<text class="bandlabel" x="68" y="140">Write Path (HTTP request)</text>

<g transform="translate(190,150)"><rect class="card" x="0" y="0" width="180" height="52" rx="12" fill="#E0ECFF" stroke="#4A7ADB"/><text class="label" x="90" y="34" text-anchor="middle">HTTP Client</text></g>

<g transform="translate(150,248)"><rect class="card" x="0" y="0" width="260" height="68" rx="12" fill="#E8F3FF" stroke="#5B8DEF"/><text class="label" x="130" y="28" text-anchor="middle">OrderController</text><text class="mono" x="130" y="48" text-anchor="middle">POST /api/orders</text></g>

<g transform="translate(150,364)"><rect class="card" x="0" y="0" width="260" height="68" rx="12" fill="#EAF7EF" stroke="#58A978"/><text class="label" x="130" y="28" text-anchor="middle">OrderService</text><text class="mono" x="130" y="48" text-anchor="middle">@Transactional · placeOrder()</text></g>

<!-- TX bracket -->
<rect class="txline" x="80" y="470" width="440" height="150" rx="10"/>
<text class="mono" x="96" y="492" style="fill:#8A72D6;font-size:13px">BEGIN TRANSACTION</text>

<g transform="translate(90,508)"><rect class="card" x="0" y="0" width="210" height="68" rx="10" fill="#FFF3D9" stroke="#D6A441"/><text class="label" x="105" y="28" text-anchor="middle">OrderTable</text><text class="mono" x="105" y="48" text-anchor="middle">LongIdTable · INSERT</text></g>
<g transform="translate(310,508)"><rect class="card" x="0" y="0" width="210" height="68" rx="10" fill="#FFF3D9" stroke="#D6A441"/><text class="label" x="105" y="28" text-anchor="middle">OutboxEventTable</text><text class="mono" x="105" y="48" text-anchor="middle">LongIdTable · INSERT</text></g>

<!-- Publish Path panel -->
<rect x="600" y="118" width="540" height="542" rx="14" fill="#F0FAF0" stroke="#B0DAC0" stroke-width="1"/>
<text class="bandlabel" x="616" y="140">Publish Path (Scheduler · every 2s)</text>

<g transform="translate(660,160)"><rect class="card" x="0" y="0" width="400" height="72" rx="12" fill="#EAF7EF" stroke="#58A978"/><text class="label" x="200" y="30" text-anchor="middle">OutboxPublisher</text><text class="mono" x="200" y="52" text-anchor="middle">@Scheduled · polls PENDING/FAILED · MAX_RETRY=3</text></g>

<g transform="translate(660,286)"><rect class="card" x="0" y="0" width="400" height="68" rx="10" fill="#FFF3D9" stroke="#D6A441"/><text class="label" x="200" y="28" text-anchor="middle">outbox_events</text><text class="mono" x="200" y="48" text-anchor="middle">SELECT WHERE status IN (PENDING, FAILED)</text></g>

<g transform="translate(720,408)"><rect class="card" x="0" y="0" width="260" height="68" rx="12" fill="#FDECEF" stroke="#DC6B82"/><text class="label" x="130" y="28" text-anchor="middle">Kafka</text><text class="mono" x="130" y="48" text-anchor="middle">topic: order-events</text></g>

<g transform="translate(660,530)"><rect class="card" x="0" y="0" width="400" height="72" rx="10" fill="#E9F7F6" stroke="#45A7A1"/><text class="label" x="200" y="30" text-anchor="middle">Status Lifecycle</text><text class="mono" x="200" y="52" text-anchor="middle">PENDING → PUBLISHED | FAILED → DEAD_LETTER</text></g>

<!-- Database -->
<g transform="translate(380,700)">
  <ellipse cx="160" cy="10" rx="160" ry="18" fill="#FDECEF" stroke="#DC6B82" stroke-width="2"/>
  <rect x="0" y="10" width="320" height="36" fill="#FDECEF" stroke="#DC6B82" stroke-width="2"/>
  <line x1="0" y1="10" x2="0" y2="46" stroke="#DC6B82" stroke-width="2"/>
  <line x1="320" y1="10" x2="320" y2="46" stroke="#DC6B82" stroke-width="2"/>
  <ellipse cx="160" cy="46" rx="160" ry="18" fill="#FDECEF" stroke="#DC6B82" stroke-width="2"/>
  <text class="label" x="160" y="42" text-anchor="middle">PostgreSQL</text>
</g>

<!-- ===== ARROWS ===== -->
<!-- Write path (all vertical, no crossings) -->
<path class="line" d="M280,202 L280,246"/>
<path class="line" d="M280,316 L280,362"/>
<path class="line" d="M230,432 L230,470 L195,470 L195,506"/>
<path class="line" d="M330,432 L330,470 L415,470 L415,506"/>

<!-- Tables → DB -->
<path class="line" d="M300,660 L300,680 L500,680 L500,698"/>

<!-- Publish path (all vertical within panel, no crossings) -->
<path class="publine" d="M860,232 L860,284"/>
<path class="publine" d="M860,354 L860,406"/>
<path class="publine" d="M860,476 L860,528"/>

<!-- outbox_events → DB (left side of panel, vertical, no crossing) -->
<path class="publine" d="M660,326 L620,326 L620,680 L580,680 L580,698"/>
</svg>
