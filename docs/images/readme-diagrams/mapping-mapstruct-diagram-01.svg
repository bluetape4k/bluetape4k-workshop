<g transform="translate(92,180)">
  <rect class="card" x="0" y="0" width="340" height="168" rx="5" fill="#E8F3FF" stroke="#5B8DEF"/>
  <line class="compartment" x1="0" y1="78" x2="340" y2="78" stroke="#5B8DEF"/>
  <text class="small" x="170" y="26" text-anchor="middle"></text>
  <text class="label" x="170" y="57" text-anchor="middle">Customer</text>
  <text class="mono" x="18" y="108">+Long id</text>
<text class="mono" x="18" y="132">+String name</text>
<text class="mono" x="18" y="156">+List~OrderItem~ orderItems</text>
</g>
<g transform="translate(502,180)">
  <rect class="card" x="0" y="0" width="340" height="168" rx="5" fill="#EAF7EF" stroke="#58A978"/>
  <line class="compartment" x1="0" y1="78" x2="340" y2="78" stroke="#58A978"/>
  <text class="small" x="170" y="26" text-anchor="middle"></text>
  <text class="label" x="170" y="57" text-anchor="middle">CustomerDto</text>
  <text class="mono" x="18" y="108">+Long customerId</text>
<text class="mono" x="18" y="132">+String customerName</text>
<text class="mono" x="18" y="156">+Set~OrderItemDto~ orders</text>
</g>
<g transform="translate(912,180)">
  <rect class="card" x="0" y="0" width="340" height="144" rx="5" fill="#FFF3D9" stroke="#D6A441"/>
  <line class="compartment" x1="0" y1="78" x2="340" y2="78" stroke="#D6A441"/>
  <text class="small" x="170" y="26" text-anchor="middle">«Mapper Interface»</text>
  <text class="label" x="170" y="57" text-anchor="middle">CustomerMapper</text>
  <text class="mono" x="18" y="108">+toCustomer(customerDto) Customer</text>
<text class="mono" x="18" y="132">+fromCustomer(customer) CustomerDto</text>
</g>
<g transform="translate(1322,180)">
  <rect class="card" x="0" y="0" width="340" height="144" rx="5" fill="#FDECEF" stroke="#DC6B82"/>
  <line class="compartment" x1="0" y1="78" x2="340" y2="78" stroke="#DC6B82"/>
  <text class="small" x="170" y="26" text-anchor="middle"></text>
  <text class="label" x="170" y="57" text-anchor="middle">OrderItem</text>
  <text class="mono" x="18" y="108">+String name</text>
<text class="mono" x="18" y="132">+Long quantity</text>
</g>
<g transform="translate(92,474)">
  <rect class="card" x="0" y="0" width="340" height="144" rx="5" fill="#E9F7F6" stroke="#45A7A1"/>
  <line class="compartment" x1="0" y1="78" x2="340" y2="78" stroke="#45A7A1"/>
  <text class="small" x="170" y="26" text-anchor="middle"></text>
  <text class="label" x="170" y="57" text-anchor="middle">OrderItemDto</text>
  <text class="mono" x="18" y="108">+String name</text>
<text class="mono" x="18" y="132">+Long quantity</text>
</g>
<g transform="translate(502,474)">
  <rect class="card" x="0" y="0" width="340" height="144" rx="5" fill="#F1ECFF" stroke="#8A72D6"/>
  <line class="compartment" x1="0" y1="78" x2="340" y2="78" stroke="#8A72D6"/>
  <text class="small" x="170" y="26" text-anchor="middle">«Mapper Interface»</text>
  <text class="label" x="170" y="57" text-anchor="middle">OrderItemMapper</text>
  <text class="mono" x="18" y="108">+toOrderItem(dto) OrderItem</text>
<text class="mono" x="18" y="132">+fromOrderItem(item) OrderItemDto</text>
</g>
<g transform="translate(912,474)">
  <rect class="card" x="0" y="0" width="340" height="192" rx="5" fill="#F7F1E7" stroke="#B88A44"/>
  <line class="compartment" x1="0" y1="78" x2="340" y2="78" stroke="#B88A44"/>
  <text class="small" x="170" y="26" text-anchor="middle"></text>
  <text class="label" x="170" y="57" text-anchor="middle">Person</text>
  <text class="mono" x="18" y="108">+String firstName</text>
<text class="mono" x="18" y="132">+String lastName</text>
<text class="mono" x="18" y="156">+String phoneNumber</text>
<text class="mono" x="18" y="180">+LocalDate birthDate</text>
</g>
<g transform="translate(1322,474)">
  <rect class="card" x="0" y="0" width="340" height="144" rx="5" fill="#EEF6D9" stroke="#8BA84D"/>
  <line class="compartment" x1="0" y1="78" x2="340" y2="78" stroke="#8BA84D"/>
  <text class="small" x="170" y="26" text-anchor="middle">«Mapper Interface»</text>
  <text class="label" x="170" y="57" text-anchor="middle">PersonConverter</text>
  <text class="mono" x="18" y="108">+convertToDto(person) PersonDto</text>
<text class="mono" x="18" y="132">+convertToModel(personDto) Person</text>
</g>
<g transform="translate(707,792)">
  <rect class="card" x="0" y="0" width="340" height="192" rx="5" fill="#E8F3FF" stroke="#5B8DEF"/>
  <line class="compartment" x1="0" y1="78" x2="340" y2="78" stroke="#5B8DEF"/>
  <text class="small" x="170" y="26" text-anchor="middle"></text>
  <text class="label" x="170" y="57" text-anchor="middle">PersonDto</text>
  <text class="mono" x="18" y="108">+String firstName</text>
<text class="mono" x="18" y="132">+String lastName</text>
<text class="mono" x="18" y="156">+String phone</text>
<text class="mono" x="18" y="180">+LocalDate birthDate</text>
