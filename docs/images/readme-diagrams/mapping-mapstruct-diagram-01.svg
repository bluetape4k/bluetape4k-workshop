<svg xmlns="http://www.w3.org/2000/svg" width="920" height="420" viewBox="0 0 920 420" role="img" aria-label="MapStruct Mapping Architecture">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#1f2937" flood-opacity="0.10"/></filter>
  <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth">
    <path d="M1,1 L8,4.5 L1,8 Z" fill="#758297"/>
  </marker>
  <style>
    .canvas{fill:#f7f9fc}.frame{fill:#fff;stroke:#d8e0ea;stroke-width:1.5}
    .title{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:38px;font-weight:400;fill:#102033}
    .subtitle{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:14px;font-weight:400;fill:#536273}
    .smallLabel{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:21px;font-weight:400;fill:#102033}
    .mono{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#102033}
    .small{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#536273}
    .card{stroke-width:2.1;filter:url(#shadow)}
    .line{stroke:#758297;stroke-width:2.1;fill:none;marker-end:url(#arrow)}
    .compartment{stroke-width:1.5;fill:none}
  </style>
</defs>
<rect class="canvas" width="920" height="420"/>
<rect class="frame" x="24" y="20" width="872" height="376" rx="18"/>
<text class="title" x="44" y="62">MapStruct Mapping</text>
<text class="subtitle" x="44" y="84">@Mapper → generated impl → DTO ↔ Entity conversion at compile time</text>

<!-- PersonConverter -->
<g transform="translate(44,100)">
  <rect class="card" x="0" y="0" width="190" height="100" rx="8" fill="#E8F3FF" stroke="#5B8DEF"/>
  <line class="compartment" x1="0" y1="44" x2="190" y2="44" stroke="#5B8DEF"/>
  <text class="small" x="95" y="22" text-anchor="middle">«Mapper»</text>
  <text class="smallLabel" x="95" y="38" text-anchor="middle">PersonConverter</text>
  <text class="mono" x="8" y="62">convertToDto(Person)</text>
  <text class="mono" x="8" y="80">convertToModel(PersonDto)</text>
</g>

<!-- CustomerMapper -->
<g transform="translate(270,100)">
  <rect class="card" x="0" y="0" width="190" height="100" rx="8" fill="#EAF7EF" stroke="#58A978"/>
  <line class="compartment" x1="0" y1="44" x2="190" y2="44" stroke="#58A978"/>
  <text class="small" x="95" y="22" text-anchor="middle">«Mapper»</text>
  <text class="smallLabel" x="95" y="38" text-anchor="middle">CustomerMapper</text>
  <text class="mono" x="8" y="62">toCustomer(CustomerDto)</text>
  <text class="mono" x="8" y="80">fromCustomer(Customer)</text>
</g>

<!-- OrderItemMapper -->
<g transform="translate(496,100)">
  <rect class="card" x="0" y="0" width="190" height="100" rx="8" fill="#FFF3D9" stroke="#D6A441"/>
  <line class="compartment" x1="0" y1="44" x2="190" y2="44" stroke="#D6A441"/>
  <text class="small" x="95" y="22" text-anchor="middle">«Mapper»</text>
  <text class="smallLabel" x="95" y="38" text-anchor="middle">OrderItemMapper</text>
  <text class="mono" x="8" y="62">toOrderItem(dto)</text>
  <text class="mono" x="8" y="80">fromOrderItem(item)</text>
</g>

<!-- Mappers.getMapper() -->
<g transform="translate(722,100)">
  <rect class="card" x="0" y="0" width="170" height="100" rx="8" fill="#FDECEF" stroke="#DC6B82"/>
  <line class="compartment" x1="0" y1="44" x2="170" y2="44" stroke="#DC6B82"/>
  <text class="small" x="85" y="22" text-anchor="middle">«Factory»</text>
  <text class="smallLabel" x="85" y="38" text-anchor="middle">Mappers</text>
  <text class="mono" x="8" y="62">getMapper(Class)</text>
  <text class="mono" x="8" y="80">@Mapper(componentModel)</text>
</g>

<!-- Domain entities row 2 -->
<g transform="translate(44,268)">
  <rect class="card" x="0" y="0" width="190" height="90" rx="8" fill="#E9F7F6" stroke="#45A7A1"/>
  <line class="compartment" x1="0" y1="40" x2="190" y2="40" stroke="#45A7A1"/>
  <text class="smallLabel" x="95" y="26" text-anchor="middle">Person</text>
  <text class="mono" x="8" y="58">firstName, lastName</text>
  <text class="mono" x="8" y="74">phoneNumber, birthDate</text>
</g>

<g transform="translate(270,268)">
  <rect class="card" x="0" y="0" width="190" height="90" rx="8" fill="#F1ECFF" stroke="#8A72D6"/>
  <line class="compartment" x1="0" y1="40" x2="190" y2="40" stroke="#8A72D6"/>
  <text class="smallLabel" x="95" y="26" text-anchor="middle">PersonDto</text>
  <text class="mono" x="8" y="58">firstName, lastName</text>
  <text class="mono" x="8" y="74">phone, birthDate</text>
</g>

<g transform="translate(496,268)">
  <rect class="card" x="0" y="0" width="190" height="90" rx="8" fill="#EEF6D9" stroke="#8BA84D"/>
  <line class="compartment" x1="0" y1="40" x2="190" y2="40" stroke="#8BA84D"/>
  <text class="smallLabel" x="95" y="26" text-anchor="middle">Customer</text>
  <text class="mono" x="8" y="58">id, name</text>
  <text class="mono" x="8" y="74">List&lt;OrderItem&gt; orderItems</text>
</g>

<g transform="translate(722,268)">
  <rect class="card" x="0" y="0" width="170" height="90" rx="8" fill="#F7F1E7" stroke="#B88A44"/>
  <line class="compartment" x1="0" y1="40" x2="170" y2="40" stroke="#B88A44"/>
  <text class="smallLabel" x="85" y="26" text-anchor="middle">CustomerDto</text>
  <text class="mono" x="8" y="58">customerId, customerName</text>
  <text class="mono" x="8" y="74">Set&lt;OrderItemDto&gt;</text>
</g>

<!-- Arrows -->
<path class="line" d="M139,200 L139,266"/>
<path class="line" d="M365,200 L365,266"/>
<path class="line" d="M591,200 L591,266"/>
<path class="line" d="M807,200 L807,266"/>
</svg>
