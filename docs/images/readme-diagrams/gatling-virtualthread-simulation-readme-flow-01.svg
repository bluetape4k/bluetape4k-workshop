<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1660" height="980" viewBox="0 0 1660 980" role="img" aria-label="Gatling virtual thread load-test flow">
  <defs>
    <filter id="shadow" x="-8%" y="-10%" width="116%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#5b7282" flood-opacity="0.15"/>
    </filter>
    <marker id="blueArrow" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" viewBox="0 0 10 10" refX="9" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#457b9d" stroke-dasharray="none"/></marker>
    <marker id="greenArrow" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" viewBox="0 0 10 10" refX="9" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#5f8f5b" stroke-dasharray="none"/></marker>
    <marker id="goldArrow" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" viewBox="0 0 10 10" refX="9" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#a87332" stroke-dasharray="none"/></marker>
    <style>
      .canvas { fill: #f7fafc; }
      .frame { fill: #fffefd; stroke: #cdd8df; stroke-width: 2; }
      .title { font-family: "Architects Daughter"; font-size: 38px; fill: #1d2b38; }
      .subtitle { font-family: "Comic Mono"; font-size: 16px; fill: #516172; }
      .laneTitle { font-family: "Architects Daughter"; font-size: 24px; fill: #263747; }
      .cardTitle { font-family: "Architects Daughter"; font-size: 25px; fill: #1d2b38; }
      .cardText { font-family: "Comic Mono"; font-size: 15px; fill: #42515f; }
      .smallText { font-family: "Comic Mono"; font-size: 13px; fill: #566575; }
      .lane { stroke-width: 1.6; }
      .card { stroke-width: 2.2; filter: url(#shadow); }
      .flow { fill: none; stroke: #457b9d; stroke-width: 4.4; marker-end: url(#blueArrow); stroke-linecap: round; stroke-linejoin: round; }
      .sync { fill: none; stroke: #5f8f5b; stroke-width: 4.2; marker-end: url(#greenArrow); stroke-linecap: round; stroke-linejoin: round; }
      .report { fill: none; stroke: #a87332; stroke-width: 3.8; marker-end: url(#goldArrow); stroke-linecap: round; stroke-linejoin: round; }
      .label { font-family: "Comic Mono"; font-size: 14px; font-weight: 700; }
      .labelBox { fill: #ffffff; stroke-width: 1.4; }
    </style>
  </defs>

  <rect class="canvas" width="1660" height="980"/>
  <rect class="frame" x="28" y="28" width="1604" height="924" rx="24"/>
  <text class="title" x="830" y="84" text-anchor="middle">Gatling Load-Test Flow</text>
  <text class="subtitle" x="830" y="114" text-anchor="middle">Start the app, run a simulation, drive virtual-thread endpoints, then inspect the generated report.</text>

  <rect class="lane" x="74" y="164" width="1512" height="168" rx="18" fill="#eef6ff" stroke="#b5cfe8"/>
  <text class="laneTitle" x="138" y="222" text-anchor="middle">Setup</text>

  <rect class="lane" x="74" y="392" width="1512" height="268" rx="18" fill="#f3fbf0" stroke="#b7d4ae"/>
  <text class="laneTitle" x="142" y="528" text-anchor="middle">Load Path</text>

  <rect class="lane" x="74" y="720" width="1512" height="146" rx="18" fill="#fff8ea" stroke="#dec289"/>
  <text class="laneTitle" x="142" y="802" text-anchor="middle">Report</text>

  <rect class="card" x="212" y="206" width="270" height="88" rx="14" fill="#ffffff" stroke="#8eb4d6"/>
  <text class="cardTitle" x="347" y="242" text-anchor="middle">bootRun</text>
  <text class="smallText" x="347" y="270" text-anchor="middle">Spring Boot on localhost:8080</text>

  <rect class="card" x="568" y="206" width="300" height="88" rx="14" fill="#ffffff" stroke="#8eb4d6"/>
  <text class="cardTitle" x="718" y="242" text-anchor="middle">gatlingRun</text>
  <text class="smallText" x="718" y="270" text-anchor="middle">select Sync or Async simulation</text>

  <rect class="card" x="954" y="206" width="402" height="88" rx="14" fill="#ffffff" stroke="#8eb4d6"/>
  <text class="cardTitle" x="1155" y="242" text-anchor="middle">Closed Workload</text>
  <text class="smallText" x="1155" y="270" text-anchor="middle">rampConcurrentUsers 10 -> 20 over 10 seconds</text>

  <rect class="card" x="212" y="450" width="300" height="104" rx="14" fill="#ffffff" stroke="#91b884"/>
  <text class="cardTitle" x="362" y="491" text-anchor="middle">Sync Simulation</text>
  <text class="cardText" x="362" y="523" text-anchor="middle">GET /sync/1, /sync/2</text>

  <rect class="card" x="212" y="548" width="300" height="82" rx="14" fill="#ffffff" stroke="#91b884"/>
  <text class="cardTitle" x="362" y="582" text-anchor="middle">Async Simulation</text>
  <text class="cardText" x="362" y="612" text-anchor="middle">GET /async/1, /async/2</text>

  <rect class="card" x="680" y="466" width="330" height="124" rx="14" fill="#f9fbff" stroke="#9db4c8"/>
  <text class="cardTitle" x="845" y="510" text-anchor="middle">Controller</text>
  <text class="cardText" x="845" y="542" text-anchor="middle">measureTimeMillis</text>
  <text class="smallText" x="845" y="568" text-anchor="middle">returns elapsed millis</text>

  <rect class="card" x="1180" y="466" width="300" height="124" rx="14" fill="#f9fbff" stroke="#9db4c8"/>
  <text class="cardTitle" x="1330" y="510" text-anchor="middle">Delay Service</text>
  <text class="cardText" x="1330" y="542" text-anchor="middle">Thread.sleep(seconds)</text>
  <text class="smallText" x="1330" y="568" text-anchor="middle">request VT or async VT</text>

  <rect class="card" x="548" y="750" width="332" height="86" rx="14" fill="#fffdf6" stroke="#c39a56"/>
  <text class="cardTitle" x="714" y="786" text-anchor="middle">Gatling Report</text>
  <text class="smallText" x="714" y="813" text-anchor="middle">build/reports/gatling/...</text>

  <rect class="card" x="994" y="750" width="360" height="86" rx="14" fill="#fffdf6" stroke="#c39a56"/>
  <text class="cardTitle" x="1174" y="786" text-anchor="middle">Compare Curves</text>
  <text class="smallText" x="1174" y="813" text-anchor="middle">latency, RPS, errors, active users</text>

  <path class="flow" d="M 482 250 H 568" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="flow" d="M 868 250 H 954" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="sync" d="M 1155 294 V 410 H 512"/>
  <rect class="labelBox" x="732" y="354" width="174" height="30" rx="15" stroke="#91b884"/>
  <text class="label" x="819" y="374" text-anchor="middle" fill="#5f8f5b">HTTP load begins</text>

  <path class="sync" d="M 512 502 H 680"/>
  <path class="sync" d="M 512 590 H 632 V 548 H 680"/>
  <path class="sync" d="M 1010 528 H 1180"/>

  <path class="report" d="M 1330 590 V 694 H 714 V 750"/>
  <rect class="labelBox" x="928" y="672" width="116" height="30" rx="15" stroke="#d5a656"/>
  <text class="label" x="986" y="692" text-anchor="middle" fill="#a87332">results</text>
  <path class="report" d="M 880 793 H 994"/>
</svg>
