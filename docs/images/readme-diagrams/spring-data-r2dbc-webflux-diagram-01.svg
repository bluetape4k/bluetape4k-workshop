<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" role="img" aria-label="WebFlux R2DBC Architecture">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#1f2937" flood-opacity="0.10"/></filter>
  <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M1,1 L8,4.5 L1,8 Z" fill="#758297"/></marker>
  <style>
    .canvas{fill:#f7f9fc}.frame{fill:#fff;stroke:#d8e0ea;stroke-width:1.5}
    .title{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:38px;font-weight:400;fill:#102033}
    .subtitle{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:14px;font-weight:400;fill:#536273}
    .smallLabel{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:21px;font-weight:400;fill:#102033}
    .mono{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#102033}
    .small{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#536273}
    .card{stroke-width:2.1;filter:url(#shadow)}
    .line{stroke:#758297;stroke-width:2.1;fill:none;marker-end:url(#arrow)}
    .zoneBox{stroke-width:1.5;fill-opacity:0.5;stroke-dasharray:5 3}
  </style>
</defs>
<rect class="canvas" width="960" height="440"/>
<rect class="frame" x="24" y="20" width="912" height="396" rx="16"/>
<text class="title" x="48" y="66">WebFlux R2DBC Architecture</text>
<text class="subtitle" x="48" y="90">coRouter DSL · @RestController · UserService · UserRepository → H2 R2DBC</text>

<!-- Zones -->
<rect class="zoneBox" x="40" y="100" width="390" height="200" rx="10" fill="#EEF4FF" stroke="#5B8DEF"/>
<text class="small" x="235" y="120" text-anchor="middle">Functional Route</text>

<rect class="zoneBox" x="530" y="100" width="390" height="200" rx="10" fill="#EAF7EF" stroke="#58A978"/>
<text class="small" x="725" y="120" text-anchor="middle">Annotation Route</text>

<!-- Row 1: top layer inside zones -->
<rect class="card" x="60" y="130" width="175" height="56" rx="8" fill="#E8F3FF" stroke="#5B8DEF"/>
<text class="smallLabel" x="147" y="158" text-anchor="middle">coRouter DSL</text>
<text class="small" x="147" y="175" text-anchor="middle">Route config</text>

<rect class="card" x="250" y="130" width="160" height="56" rx="8" fill="#FFF3D9" stroke="#D6A441"/>
<text class="smallLabel" x="330" y="158" text-anchor="middle">UserHandler</text>
<text class="small" x="330" y="175" text-anchor="middle">suspend fun</text>

<rect class="card" x="550" y="130" width="170" height="56" rx="8" fill="#EAF7EF" stroke="#58A978"/>
<text class="smallLabel" x="635" y="158" text-anchor="middle">UserController</text>
<text class="small" x="635" y="175" text-anchor="middle">@RestController</text>

<rect class="card" x="740" y="130" width="160" height="56" rx="8" fill="#FDECEF" stroke="#DC6B82"/>
<text class="smallLabel" x="820" y="158" text-anchor="middle">UserService</text>
<text class="small" x="820" y="175" text-anchor="middle">@Transactional</text>

<!-- Row 2: shared UserRepository -->
<rect class="card" x="340" y="240" width="280" height="56" rx="8" fill="#F1ECFF" stroke="#8A72D6"/>
<text class="smallLabel" x="480" y="268" text-anchor="middle">UserRepository</text>
<text class="small" x="480" y="285" text-anchor="middle">CoroutineCrudRepository</text>

<!-- Row 3: Infrastructure -->
<rect class="card" x="200" y="352" width="240" height="52" rx="8" fill="#E9F7F6" stroke="#45A7A1"/>
<text class="smallLabel" x="320" y="380" text-anchor="middle">Spring Data R2DBC</text>
<text class="small" x="320" y="395" text-anchor="middle">Reactive + Coroutine</text>

<rect class="card" x="520" y="352" width="200" height="52" rx="8" fill="#f5f5f5" stroke="#9aa3af"/>
<text class="smallLabel" x="620" y="380" text-anchor="middle">H2 R2DBC</text>
<text class="small" x="620" y="395" text-anchor="middle">In-memory database</text>

<!-- Arrows -->
<!-- coRouter -> UserHandler -->
<path class="line" d="M235 186 L250 186"/>
<!-- UserHandler -> UserRepository -->
<path class="line" d="M330 186 L330 222 L430 222 L430 240"/>
<!-- UserController -> UserService -->
<path class="line" d="M720 186 L740 186"/>
<!-- UserService -> UserRepository -->
<path class="line" d="M820 186 L820 222 L560 222 L560 240"/>
<!-- UserRepository -> Spring Data R2DBC -->
<path class="line" d="M440 296 L440 334 L320 334 L320 352"/>
<!-- Spring Data R2DBC -> H2 -->
<path class="line" d="M440 378 L520 378"/>
</svg>
