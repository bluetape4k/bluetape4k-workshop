<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1780" height="960" viewBox="0 0 1780 960" role="img" aria-label="Seven cache strategy comparison">
  <defs>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="124%"><feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#64748B" flood-opacity="0.14"/></filter>
    <style>
      .canvas{fill:#F8FAFC}.frame{fill:#FFFFFF;stroke:#D6E0E8;stroke-width:1.4}.title{font-family:"Architects Daughter";font-size:40px;fill:#102033}.subtitle{font-family:"Comic Mono";font-size:16px;fill:#51606F}
      .head{font-family:"Architects Daughter";font-size:28px;fill:#102033}.cellTitle{font-family:"Architects Daughter";font-size:25px;fill:#102033}.cellText{font-family:"Comic Mono";font-size:15px;fill:#415166}.tag{font-family:"Comic Mono";font-size:13px;fill:#334155}
      .line{stroke:#CBD5E1;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}.badge{rx:12;stroke-width:1.4}
    </style>
  </defs>
  <rect class="canvas" width="1780" height="960"/>
  <rect class="frame" x="24" y="24" width="1732" height="912" rx="24"/>
  <text class="title" x="890" y="72" text-anchor="middle">7 cache strategy comparison</text>
  <text class="subtitle" x="890" y="106" text-anchor="middle">The benchmark keeps one ProductCacheService contract and swaps the read/write consistency trade-off.</text>

  <text class="head" x="170" y="172" text-anchor="middle">Profile</text>
  <text class="head" x="480" y="172" text-anchor="middle">Read path</text>
  <text class="head" x="800" y="172" text-anchor="middle">Write path</text>
  <text class="head" x="1120" y="172" text-anchor="middle">Shared state</text>
  <text class="head" x="1440" y="172" text-anchor="middle">Best fit</text>
  <line class="line" x1="90" y1="196" x2="1690" y2="196" stroke-linecap="round" stroke-linejoin="round"/>

  <g filter="url(#shadow)"><rect x="90" y="228" width="1600" height="72" rx="16" fill="#FFFFFF" stroke="#E2E8F0"/><text class="cellTitle" x="170" y="270" text-anchor="middle">No Cache</text><text class="cellText" x="480" y="270" text-anchor="middle">DB on every read</text><text class="cellText" x="800" y="270" text-anchor="middle">DB only</text><text class="cellText" x="1120" y="270" text-anchor="middle">H2 repository</text><rect class="badge" x="1342" y="244" width="196" height="34" fill="#F1F5F9" stroke="#CBD5E1"/><text class="tag" x="1440" y="266" text-anchor="middle">baseline</text></g>
  <g filter="url(#shadow)"><rect x="90" y="324" width="1600" height="72" rx="16" fill="#FFFFFF" stroke="#E2E8F0"/><text class="cellTitle" x="170" y="366" text-anchor="middle">Caffeine</text><text class="cellText" x="480" y="366" text-anchor="middle">local @Cacheable hit</text><text class="cellText" x="800" y="366" text-anchor="middle">DB + local cache put</text><text class="cellText" x="1120" y="366" text-anchor="middle">per JVM</text><rect class="badge" x="1342" y="340" width="196" height="34" fill="#DCFCE7" stroke="#86EFAC"/><text class="tag" x="1440" y="362" text-anchor="middle">single-node hot keys</text></g>
  <g filter="url(#shadow)"><rect x="90" y="420" width="1600" height="72" rx="16" fill="#FFFFFF" stroke="#E2E8F0"/><text class="cellTitle" x="170" y="462" text-anchor="middle">Redis Cache</text><text class="cellText" x="480" y="462" text-anchor="middle">Spring Redis cache hit</text>  <text class="cellText" x="800" y="462" text-anchor="middle">DB + Redis put</text>  <text class="cellText" x="1120" y="462" text-anchor="middle">shared Redis TTL</text><rect class="badge" x="1342" y="436" width="196" height="34" fill="#FEE2E2" stroke="#FCA5A5"/><text class="tag" x="1440" y="458" text-anchor="middle">shared read cache</text></g>
  <g filter="url(#shadow)"><rect x="90" y="516" width="1600" height="72" rx="16" fill="#FFFFFF" stroke="#E2E8F0"/><text class="cellTitle" x="170" y="558" text-anchor="middle">Near Cache</text><text class="cellText" x="480" y="558" text-anchor="middle">local map, then DB</text><text class="cellText" x="800" y="558" text-anchor="middle">DB + RLocalCachedMap</text>  <text class="cellText" x="1120" y="558" text-anchor="middle">Redis invalidation</text><rect class="badge" x="1342" y="532" width="196" height="34" fill="#DBEAFE" stroke="#93C5FD"/><text class="tag" x="1440" y="554" text-anchor="middle">multi-node hot keys</text></g>
  <g filter="url(#shadow)"><rect x="90" y="612" width="1600" height="72" rx="16" fill="#FFFFFF" stroke="#E2E8F0"/><text class="cellTitle" x="170" y="654" text-anchor="middle">Read Through</text>  <text class="cellText" x="480" y="654" text-anchor="middle">Redis get-or-load</text>  <text class="cellText" x="800" y="654" text-anchor="middle">DB + Redis set</text>  <text class="cellText" x="1120" y="654" text-anchor="middle">shared Redis key</text><rect class="badge" x="1342" y="628" width="196" height="34" fill="#FEE2E2" stroke="#FCA5A5"/><text class="tag" x="1440" y="650" text-anchor="middle">explicit cache logic</text></g>
  <g filter="url(#shadow)"><rect x="90" y="708" width="1600" height="72" rx="16" fill="#FFFFFF" stroke="#E2E8F0"/><text class="cellTitle" x="170" y="750" text-anchor="middle">Write Through</text><text class="cellText" x="480" y="750" text-anchor="middle">cache first, DB miss</text>  <text class="cellText" x="800" y="750" text-anchor="middle">sync DB + Redis</text><text class="cellText" x="1120" y="750" text-anchor="middle">stronger write path</text><rect class="badge" x="1342" y="724" width="196" height="34" fill="#FEF3C7" stroke="#FCD34D"/><text class="tag" x="1440" y="746" text-anchor="middle">consistency first</text></g>
  <g filter="url(#shadow)"><rect x="90" y="804" width="1600" height="72" rx="16" fill="#FFFFFF" stroke="#E2E8F0"/><text class="cellTitle" x="170" y="846" text-anchor="middle">Write Behind</text><text class="cellText" x="480" y="846" text-anchor="middle">cache first, DB miss</text>  <text class="cellText" x="800" y="846" text-anchor="middle">Redis now, DB async</text><text class="cellText" x="1120" y="846" text-anchor="middle">eventual DB flush</text><rect class="badge" x="1342" y="820" width="196" height="34" fill="#FFEDD5" stroke="#FDBA74"/><text class="tag" x="1440" y="842" text-anchor="middle">bursty writes</text></g>
</svg>
