<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="3366" height="1028" viewBox="0 0 3366 1028" role="img" aria-labelledby="title desc">
  <title id="title">Cache-aside span sequence</title>
  <desc id="desc">The same service span keeps cache hit, cache miss, DB lookup, cache write, and Redis soft-fail behavior readable.</desc>
  <defs>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="124%"><feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#64748B" flood-opacity="0.14"/></filter>
    <style>.title{font-family:"Architects Daughter";font-size:40px;fill:#263238}.subtitle,.msg,.note,.footer{font-family:"Comic Mono";fill:#36464F}.subtitle{font-size:17px}.participant{font-family:"Architects Daughter";font-size:19px;fill:#1F3138}.role{font-family:"Comic Mono";font-size:12px;fill:#546A73}.msg{font-size:13px}.footer{font-size:14px;fill:#60727D}.frame{fill:#FBFCF8;stroke:#41545D;stroke-width:3}.header{fill:#FFFFFF;stroke:#546E7A;stroke-width:2}.lifeline{stroke:#9AAAB1;stroke-width:2;stroke-dasharray:7 8;stroke-linecap:round}.activation{fill:#E6F2EC;stroke:#5B7E67;stroke-width:1.5}.call,.work,.return{fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.call{stroke:#3F7D9C;marker-end:url(#arrow-call)}.work{stroke:#6E8F4F;marker-end:url(#arrow-work)}.return{stroke:#9B7D54;stroke-width:2.6;stroke-dasharray:8 6;marker-end:url(#arrow-ret)}.label{fill:#FFFFFF;stroke:#D7E0E4;stroke-width:1.5}.callLabel{stroke:#9CC2D1}.workLabel{stroke:#B6C9A4}.returnLabel{stroke:#C8B38F}.badge{stroke-width:1.8}.callBadge{fill:#EAF4F8;stroke:#3F7D9C}.workBadge{fill:#EEF7F0;stroke:#6E8F4F}.returnBadge{fill:#FFF7E8;stroke:#9B7D54}.badgeText{font-family:"Comic Mono";font-size:12px;font-weight:700}.callText,.badgeText.callText{fill:#2F6F8E}.workText,.badgeText.workText{fill:#55783F}.returnText,.badgeText.returnText{fill:#7F6038}</style>
    <marker id="arrow-call" viewBox="0 0 10 10" markerWidth="14" markerHeight="14" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#3F7D9C" stroke-dasharray="none" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="arrow-work" viewBox="0 0 10 10" markerWidth="14" markerHeight="14" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#6E8F4F" stroke-dasharray="none" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="arrow-ret" viewBox="0 0 10 10" markerWidth="14" markerHeight="14" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#9B7D54" stroke-dasharray="none" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>
  <rect x="24" y="24" width="3318" height="980" rx="20" class="frame"/>
  <text id="titleText" x="1683.0" y="76" text-anchor="middle" class="title">Cache-aside span sequence</text>
  <text x="1683.0" y="106" text-anchor="middle" class="subtitle">The same service span keeps cache hit, cache miss, DB lookup, cache write, and Redis soft-fail behavior readable.</text>
  <g filter="url(#shadow)"><rect x="90.0" y="156" width="330" height="76" rx="10" class="header"/>
    <image data-bluetape4k-icon="redis" data-source="docs/icons/redis/redis-icon.svg" x="106.0" y="176" width="36" height="36" href="data:image/svg+xml;base64," preserveAspectRatio="xMidYMid meet"/>
    <text x="255.0" y="186" text-anchor="middle" class="participant">user.cache</text>
    <text x="255.0" y="211" text-anchor="middle" class="role">get / Redis read; hit or miss</text></g>
  <line x1="255.0" y1="232" x2="255.0" y2="940" class="lifeline"/>
  <g filter="url(#shadow)"><rect x="498.0" y="156" width="330" height="76" rx="10" class="header"/>
    <text x="663.0" y="186" text-anchor="middle" class="participant">HTTP GET</text>
    <text x="663.0" y="211" text-anchor="middle" class="role">/users/{id}</text></g>
  <line x1="663.0" y1="232" x2="663.0" y2="940" class="lifeline"/>
  <g filter="url(#shadow)"><rect x="906.0" y="156" width="330" height="76" rx="10" class="header"/>
    <text x="1071.0" y="186" text-anchor="middle" class="participant">user.service.get</text>
    <text x="1071.0" y="211" text-anchor="middle" class="role">parent manual span</text></g>
  <line x1="1071.0" y1="232" x2="1071.0" y2="940" class="lifeline"/>
  <g filter="url(#shadow)"><rect x="1314.0" y="156" width="330" height="76" rx="10" class="header"/>
    <text x="1479.0" y="186" text-anchor="middle" class="participant">Cache hit</text>
    <text x="1479.0" y="211" text-anchor="middle" class="role">return cached User</text></g>
  <line x1="1479.0" y1="232" x2="1479.0" y2="940" class="lifeline"/>
  <g filter="url(#shadow)"><rect x="1722.0" y="156" width="330" height="76" rx="10" class="header"/>
    <text x="1887.0" y="186" text-anchor="middle" class="participant">Cache miss</text>
    <text x="1887.0" y="211" text-anchor="middle" class="role">participant</text></g>
  <line x1="1887.0" y1="232" x2="1887.0" y2="940" class="lifeline"/>
  <g filter="url(#shadow)"><rect x="2130.0" y="156" width="330" height="76" rx="10" class="header"/>
    <text x="2295.0" y="186" text-anchor="middle" class="participant">Redis errors become miss/…</text>
    <text x="2295.0" y="211" text-anchor="middle" class="role">participant</text></g>
  <line x1="2295.0" y1="232" x2="2295.0" y2="940" class="lifeline"/>
  <g filter="url(#shadow)"><rect x="2538.0" y="156" width="330" height="76" rx="10" class="header"/>
    <text x="2703.0" y="186" text-anchor="middle" class="participant">observed()</text>
    <text x="2703.0" y="211" text-anchor="middle" class="role">scope + finally stop</text></g>
  <line x1="2703.0" y1="232" x2="2703.0" y2="940" class="lifeline"/>
  <g filter="url(#shadow)"><rect x="2946.0" y="156" width="330" height="76" rx="10" class="header"/>
    <image x="2962.0" y="176" width="36" height="36" href="data:image/svg+xml;base64," preserveAspectRatio="xMidYMid meet"/>
    <text x="3111.0" y="186" text-anchor="middle" class="participant">user.db</text>
    <text x="3111.0" y="211" text-anchor="middle" class="role">find</text></g>
  <line x1="3111.0" y1="232" x2="3111.0" y2="940" class="lifeline"/>
  <rect x="757.0" y="252" width="220.0" height="34" rx="17" class="label callLabel"/>
  <circle cx="781.0" cy="269" r="13" class="badge callBadge"/><text x="781.0" y="274" text-anchor="middle" class="badgeText callText">1</text>
  <text x="805.0" y="274" class="msg callText">hit</text>
  <path d="M 663.0 298 L 1071.0 298" class="call" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="1064.0" y="290" width="14" height="48" rx="4" class="activation"/>
  <rect x="1777.0" y="328" width="220.0" height="34" rx="17" class="label callLabel"/>
  <circle cx="1801.0" cy="345" r="13" class="badge callBadge"/><text x="1801.0" y="350" text-anchor="middle" class="badgeText callText">2</text>
  <text x="1825.0" y="350" class="msg callText">hit</text>
  <path d="M 1071.0 374 L 2703.0 374" class="call" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="2696.0" y="366" width="14" height="48" rx="4" class="activation"/>
  <rect x="553.0" y="404" width="220.0" height="34" rx="17" class="label returnLabel"/>
  <circle cx="577.0" cy="421" r="13" class="badge returnBadge"/><text x="577.0" y="426" text-anchor="middle" class="badgeText returnText">3</text>
  <text x="601.0" y="426" class="msg returnText">hit</text>
  <path d="M 1071.0 450 L 255.0 450" class="return" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="262.0" y="442" width="14" height="48" rx="4" class="activation"/>
  <rect x="757.0" y="480" width="220.0" height="34" rx="17" class="label callLabel"/>
  <circle cx="781.0" cy="497" r="13" class="badge callBadge"/><text x="781.0" y="502" text-anchor="middle" class="badgeText callText">4</text>
  <text x="805.0" y="502" class="msg callText">hit</text>
  <path d="M 255.0 526 L 1479.0 526" class="call" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="1472.0" y="518" width="14" height="48" rx="4" class="activation"/>
  <rect x="961.0" y="556" width="220.0" height="34" rx="17" class="label callLabel"/>
  <circle cx="985.0" cy="573" r="13" class="badge callBadge"/><text x="985.0" y="578" text-anchor="middle" class="badgeText callText">5</text>
  <text x="1009.0" y="578" class="msg callText">miss</text>
  <path d="M 255.0 602 L 1887.0 602" class="call" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="1880.0" y="594" width="14" height="48" rx="4" class="activation"/>
  <rect x="2389.0" y="632" width="220.0" height="34" rx="17" class="label workLabel"/>
  <circle cx="2413.0" cy="649" r="13" class="badge workBadge"/><text x="2413.0" y="654" text-anchor="middle" class="badgeText workText">6</text>
  <text x="2437.0" y="654" class="msg workText">miss</text>
  <path d="M 1887.0 678 L 3111.0 678" class="work" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="3104.0" y="670" width="14" height="48" rx="4" class="activation"/>
  <rect x="1573.0" y="708" width="220.0" height="34" rx="17" class="label returnLabel"/>
  <circle cx="1597.0" cy="725" r="13" class="badge returnBadge"/><text x="1597.0" y="730" text-anchor="middle" class="badgeText returnText">7</text>
  <text x="1621.0" y="730" class="msg returnText">miss</text>
  <path d="M 3111.0 754 L 255.0 754" class="return" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="262.0" y="746" width="14" height="48" rx="4" class="activation"/>
  <rect x="961.0" y="784" width="220.0" height="34" rx="17" class="label callLabel"/>
  <circle cx="985.0" cy="801" r="13" class="badge callBadge"/><text x="985.0" y="806" text-anchor="middle" class="badgeText callText">8</text>
  <text x="1009.0" y="806" class="msg callText">miss</text>
  <path d="M 255.0 830 L 1887.0 830" class="call" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="1880.0" y="822" width="14" height="48" rx="4" class="activation"/>
  <rect x="1573.0" y="860" width="220.0" height="34" rx="17" class="label workLabel"/>
  <circle cx="1597.0" cy="877" r="13" class="badge workBadge"/><text x="1597.0" y="882" text-anchor="middle" class="badgeText workText">9</text>
  <text x="1621.0" y="882" class="msg workText">read failure</text>
  <path d="M 255.0 906 L 3111.0 906" class="work" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="3104.0" y="898" width="14" height="48" rx="4" class="activation"/>
  <rect x="90" y="964" width="3186" height="40" rx="12" fill="#FFFFFF" stroke="#CCD7DA" stroke-width="2"/>
  <text x="1683.0" y="990" text-anchor="middle" class="footer">Reader contract: participants, ordered messages, returns, and infrastructure boundaries stay visible.</text>
</svg>
