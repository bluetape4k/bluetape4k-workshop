<svg xmlns="http://www.w3.org/2000/svg" width="1050" height="1047" viewBox="0 0 1050 1047" role="img" aria-label="Caffeine Rate Limit Sequence">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#1f2937" flood-opacity="0.10"/></filter>
  <marker id="arrowBlue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M1 1 L7 4 L1 7 Z" fill="#5b8def"/></marker>
  <marker id="arrowTeal" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M1 1 L7 4 L1 7 Z" fill="#45a7a1"/></marker>
  <style>
    .canvas{fill:#f7f9fc}
    .frame{fill:#ffffff;stroke:#d8e0ea;stroke-width:1.5}
    .title{font-family:"Architects Daughter";font-size:34px;fill:#102033}
    .subtitle{font-family:"Comic Mono";font-size:13px;fill:#536273}
    .actor{font-family:"Architects Daughter";font-size:17px;fill:#102033}
    .message{font-family:"Comic Mono";font-size:12px;fill:#263445;paint-order:stroke;stroke:#ffffff;stroke-width:4px;stroke-linejoin:round}
    .detail{font-family:"Comic Mono";font-size:11px;fill:#536273}
    .lifeline{stroke:#b8c4d3;stroke-width:1.4;stroke-dasharray:7 6}
    .call{stroke:#5b8def;stroke-width:2.15;fill:none;marker-end:url(#arrowBlue)}
    .return{stroke:#45a7a1;stroke-width:2.05;stroke-dasharray:7 5;fill:none;marker-end:url(#arrowTeal)}
    .box{stroke-width:1.8;filter:url(#shadow)}
  </style>
</defs>
<rect class="canvas" width="1050" height="1047"/>
<rect class="frame" x="24" y="20" width="1002" height="1007" rx="18"/>
<text class="title" x="48" y="58">Caffeine Rate Limit Sequence</text>
<text class="subtitle" x="50" y="84">Bucket4j Filter · tryConsume · IndexController · Caffeine Bucket · 200 OK / 429</text>
<rect class="box" x="2" y="108" width="180" height="58" rx="10" fill="#e8f3ff" stroke="#7aa0c4"/>
<text class="actor" x="92" y="137" text-anchor="middle" dominant-baseline="middle">Client</text>
<line class="lifeline" x1="92" y1="166" x2="92" y2="989"/>
<rect class="box" x="290.6666666666667" y="108" width="180" height="58" rx="10" fill="#eaf7ef" stroke="#7aa0c4"/>
<text class="actor" x="380.6666666666667" y="137" text-anchor="middle" dominant-baseline="middle">Bucket4j Filter</text>
<line class="lifeline" x1="380.6666666666667" y1="166" x2="380.6666666666667" y2="989"/>
<rect class="box" x="579.3333333333334" y="108" width="180" height="58" rx="10" fill="#fff3d9" stroke="#7aa0c4"/>
<text class="actor" x="669.3333333333334" y="137" text-anchor="middle" dominant-baseline="middle">IndexController</text>
<line class="lifeline" x1="669.3333333333334" y1="166" x2="669.3333333333334" y2="989"/>
<rect class="box" x="868" y="108" width="180" height="58" rx="10" fill="#f1ecff" stroke="#7aa0c4"/>
<text class="actor" x="958" y="137" text-anchor="middle" dominant-baseline="middle">Caffeine Bucket</text>
<line class="lifeline" x1="958" y1="166" x2="958" y2="989"/>
<path class="call" d="M92 205 L380.6666666666667 205"/>
<rect class="message-label" x="17" y="219" width="438.6666666666667" height="31" rx="7" fill="#ffffff" opacity="0.96" stroke="#dbe3ee"/>
<text class="message" x="236.33333333333334" y="234.5" text-anchor="middle" dominant-baseline="middle">1. GET /hello (IP-keyed request)</text>
<path class="call" d="M380.6666666666667 313 L470.6666666666667 313 L470.6666666666667 341 L392.6666666666667 341"/>
<rect class="message-label" x="375.66666666666674" y="355" width="330" height="31" rx="7" fill="#ffffff" opacity="0.96" stroke="#dbe3ee"/>
<text class="message" x="540.6666666666667" y="370.5" text-anchor="middle" dominant-baseline="middle">2. extractKey(IP address)</text>
<path class="call" d="M380.6666666666667 421 L958 421"/>
<rect class="message-label" x="389.33333333333337" y="435" width="560" height="31" rx="7" fill="#ffffff" opacity="0.96" stroke="#dbe3ee"/>
<text class="message" x="669.3333333333334" y="450.5" text-anchor="middle" dominant-baseline="middle">3. tryConsume(ipKey, 1)</text>
<path class="return" d="M958 529 L380.6666666666667 529"/>
<rect class="message-label" x="389.33333333333337" y="543" width="560" height="31" rx="7" fill="#ffffff" opacity="0.96" stroke="#dbe3ee"/>
<text class="message" x="669.3333333333334" y="558.5" text-anchor="middle" dominant-baseline="middle">4. remaining=9 (allowed)</text>
<path class="call" d="M380.6666666666667 637 L669.3333333333334 637"/>
<rect class="message-label" x="305.66666666666663" y="651" width="438.6666666666667" height="31" rx="7" fill="#ffffff" opacity="0.96" stroke="#dbe3ee"/>
<text class="message" x="525" y="666.5" text-anchor="middle" dominant-baseline="middle">5. chain.filter() → controller</text>
<path class="return" d="M669.3333333333334 745 L380.6666666666667 745"/>
<rect class="message-label" x="305.66666666666663" y="759" width="438.6666666666667" height="31" rx="7" fill="#ffffff" opacity="0.96" stroke="#dbe3ee"/>
<text class="message" x="525" y="774.5" text-anchor="middle" dominant-baseline="middle">6. &quot;Hello World&quot; response</text>
<path class="return" d="M380.6666666666667 853 L92 853"/>
<rect class="message-label" x="17" y="867" width="438.6666666666667" height="31" rx="7" fill="#ffffff" opacity="0.96" stroke="#dbe3ee"/>
<text class="message" x="236.33333333333334" y="882.5" text-anchor="middle" dominant-baseline="middle">7. 200 OK + X-RateLimit-Remaining: 9</text>
</svg>
