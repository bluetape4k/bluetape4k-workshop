<svg xmlns="http://www.w3.org/2000/svg" width="1376" height="1262" viewBox="0 0 1376 1262" role="img" aria-label="Rate Limit">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#1f2937" flood-opacity="0.10"/></filter>
  <marker id="openArrow" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M 1 1 L 10 5 L 1 9" fill="none" stroke="#758297" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <marker id="inherit" markerWidth="14" markerHeight="12" refX="12" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M 0 1 L 12 6 L 0 11 Z" fill="#ffffff" stroke="#758297" stroke-width="1.8"/></marker>
  <style>
    .canvas{fill:#f7f9fc}.frame{fill:#fff;stroke:#d8e0ea;stroke-width:1.5}
    .title{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:43px;font-weight:400;fill:#102033}
    .subtitle{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:15px;font-weight:400;fill:#536273}
    .label{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:25px;font-weight:400;fill:#102033}
    .smallLabel{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:21px;font-weight:400;fill:#102033}
    .mono{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#102033}
    .small{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#536273}
    .strong{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:13px;font-weight:400;fill:#102033}
    .card{stroke-width:2.1;filter:url(#shadow)}.compartment{stroke-width:1.5;fill:none}
    .line{stroke:#758297;stroke-width:2.1;fill:none;marker-end:url(#openArrow)}
    .plainLine{stroke:#758297;stroke-width:2.1;fill:none}
    .dashed{stroke:#758297;stroke-width:2.1;stroke-dasharray:7 6;fill:none;marker-end:url(#openArrow)}
    .inheritLine{stroke:#758297;stroke-width:2.2;fill:none;marker-end:url(#inherit)}
    .implLine{stroke:#758297;stroke-width:2.2;stroke-dasharray:8 7;fill:none;marker-end:url(#inherit)}
  </style>
</defs>
<rect class="canvas" width="1376" height="1262"/>
<rect class="frame" x="32" y="28" width="1312" height="1206" rx="28"/>
<text class="title" x="66" y="82">Rate Limit</text>
<text class="subtitle" x="70" y="118">Sequence messages from the original Mermaid source</text>
<rect class="card" x="21" y="166" width="238" height="72" rx="20" fill="#E8F3FF" stroke="#5B8DEF"/>
<text class="smallLabel" x="140" y="209" text-anchor="middle">HTTP</text>
<line class="lifeline" x1="140" y1="252" x2="140" y2="1202" stroke="#b7c2d1" stroke-width="2" stroke-dasharray="10 10"/>
<rect class="card" x="386.3333333333333" y="166" width="238" height="72" rx="20" fill="#EAF7EF" stroke="#58A978"/>
<text class="smallLabel" x="505.3333333333333" y="209" text-anchor="middle">Bucket4j</text>
<line class="lifeline" x1="505.3333333333333" y1="252" x2="505.3333333333333" y2="1202" stroke="#b7c2d1" stroke-width="2" stroke-dasharray="10 10"/>
<rect class="card" x="751.6666666666666" y="166" width="238" height="72" rx="20" fill="#FFF3D9" stroke="#D6A441"/>
<text class="smallLabel" x="870.6666666666666" y="209" text-anchor="middle">Caffeine JCache</text>
<line class="lifeline" x1="870.6666666666666" y1="252" x2="870.6666666666666" y2="1202" stroke="#b7c2d1" stroke-width="2" stroke-dasharray="10 10"/>
<rect class="card" x="1117" y="166" width="238" height="72" rx="20" fill="#FDECEF" stroke="#DC6B82"/>
<text class="smallLabel" x="1236" y="209" text-anchor="middle">IndexController</text>
<line class="lifeline" x1="1236" y1="252" x2="1236" y2="1202" stroke="#b7c2d1" stroke-width="2" stroke-dasharray="10 10"/>
<rect x="211.66666666666663" y="286" width="222" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="229.66666666666663" y="313" text-anchor="start">1. GET /hello ( /world)</text>
<path class="line" d="M140 344 L505.3333333333333 344"/>
<rect x="583" y="396" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="601" y="423" text-anchor="start">2. (IP )</text>
<path class="line" d="M505.3333333333333 454 L870.6666666666666 454"/>
<rect x="583" y="506" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="601" y="533" text-anchor="start">3. CAF to F</text>
<path class="dashed" d="M870.6666666666666 564 L505.3333333333333 564"/>
<rect x="70" y="616" width="1236" height="40" rx="16" fill="#F7F1E7" stroke="#B88A44" stroke-width="1.6" opacity="0.96"/>
<text class="strong" x="92" y="643" text-anchor="start">ALT: alt</text>
<rect x="583" y="684" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="601" y="711" text-anchor="start">5. tryConsume(1) →</text>
<path class="line" d="M505.3333333333333 742 L870.6666666666666 742"/>
<rect x="765.6666666666666" y="794" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="783.6666666666666" y="821" text-anchor="start">6. F to IC</text>
<path class="line" d="M505.3333333333333 852 L1236 852"/>
<rect x="583" y="904" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="601" y="931" text-anchor="start">7. 200 OK +</text>
<path class="dashed" d="M1236 962 L140 962"/>
<rect x="70" y="1014" width="1236" height="40" rx="16" fill="#F7F1E7" stroke="#B88A44" stroke-width="1.6" opacity="0.96"/>
<text class="strong" x="92" y="1041" text-anchor="start">ELSE: ()</text>
<rect x="207.66666666666663" y="1082" width="230" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="225.66666666666663" y="1109" text-anchor="start">9. 429 Too Many Requests</text>
<path class="dashed" d="M505.3333333333333 1140 L140 1140"/>
</svg>
