<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" role="img" aria-label="Exposed Domain Model Architecture">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#1f2937" flood-opacity="0.10"/></filter>
  <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth">
    <path d="M1,1 L8,4.5 L1,8 Z" fill="#758297"/>
  </marker>
  <style>
    .canvas{fill:#f7f9fc}.frame{fill:#fff;stroke:#d8e0ea;stroke-width:1.5}
    .title{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:38px;font-weight:400;fill:#102033}
    .subtitle{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:14px;font-weight:400;fill:#536273}
    .smallLabel{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:21px;font-weight:400;fill:#102033}
    .mono{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#102033}
    .small{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#536273}
    .card{stroke-width:2.1;filter:url(#shadow)}
    .line{stroke:#758297;stroke-width:2.1;fill:none;marker-end:url(#arrow)}
    .compartment{stroke-width:1.5;fill:none}
  </style>
</defs>
<rect class="canvas" width="960" height="440"/>
<rect class="frame" x="24" y="20" width="912" height="396" rx="18"/>
<text class="title" x="44" y="66">Exposed Domain Model</text>
<text class="subtitle" x="44" y="90">Actors · Movies · Reviews tables + relationships (1:N, M:N)</text>

<!-- Actors table -->
<g transform="translate(44,110)">
  <rect class="card" x="0" y="0" width="200" height="140" rx="8" fill="#E8F3FF" stroke="#5B8DEF"/>
  <line class="compartment" x1="0" y1="52" x2="200" y2="52" stroke="#5B8DEF"/>
  <text class="smallLabel" x="100" y="34" text-anchor="middle">Actors</text>
  <text class="mono" x="12" y="72">id: Long (PK)</text>
  <text class="mono" x="12" y="90">firstName: String</text>
  <text class="mono" x="12" y="108">lastName: String</text>
  <text class="mono" x="12" y="126">dateOfBirth: DateTime</text>
</g>

<!-- Movies table -->
<g transform="translate(380,110)">
  <rect class="card" x="0" y="0" width="200" height="140" rx="8" fill="#EAF7EF" stroke="#58A978"/>
  <line class="compartment" x1="0" y1="52" x2="200" y2="52" stroke="#58A978"/>
  <text class="smallLabel" x="100" y="34" text-anchor="middle">Movies</text>
  <text class="mono" x="12" y="72">id: Long (PK)</text>
  <text class="mono" x="12" y="90">name: String</text>
  <text class="mono" x="12" y="108">producerName: String</text>
  <text class="mono" x="12" y="126">releaseDate: DateTime</text>
</g>

<!-- Reviews table -->
<g transform="translate(716,110)">
  <rect class="card" x="0" y="0" width="200" height="140" rx="8" fill="#FFF3D9" stroke="#D6A441"/>
  <line class="compartment" x1="0" y1="52" x2="200" y2="52" stroke="#D6A441"/>
  <text class="smallLabel" x="100" y="34" text-anchor="middle">Reviews</text>
  <text class="mono" x="12" y="72">id: Long (PK)</text>
  <text class="mono" x="12" y="90">movie: Movie (FK)</text>
  <text class="mono" x="12" y="108">reviewer: String</text>
  <text class="mono" x="12" y="126">rating: Int</text>
</g>

<!-- ActorsInMovies join table -->
<g transform="translate(200,300)">
  <rect class="card" x="0" y="0" width="200" height="100" rx="8" fill="#FDECEF" stroke="#DC6B82"/>
  <line class="compartment" x1="0" y1="44" x2="200" y2="44" stroke="#DC6B82"/>
  <text class="smallLabel" x="100" y="28" text-anchor="middle">ActorsInMovies</text>
  <text class="mono" x="12" y="62">actor: Actor (FK)</text>
  <text class="mono" x="12" y="80">movie: Movie (FK)</text>
</g>

<!-- Genre table -->
<g transform="translate(560,300)">
  <rect class="card" x="0" y="0" width="200" height="100" rx="8" fill="#E9F7F6" stroke="#45A7A1"/>
  <line class="compartment" x1="0" y1="44" x2="200" y2="44" stroke="#45A7A1"/>
  <text class="smallLabel" x="100" y="28" text-anchor="middle">Genres</text>
  <text class="mono" x="12" y="62">id: Long (PK)</text>
  <text class="mono" x="12" y="80">name: String</text>
</g>

<!-- Relationships -->
<path class="line" d="M244,180 L378,180"/>
<path class="line" d="M580,180 L714,180"/>
<path class="line" d="M144,250 L300,298"/>
<path class="line" d="M480,250 L300,350"/>
<path class="line" d="M480,250 L660,298"/>
</svg>
