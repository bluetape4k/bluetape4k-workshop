  <g filter="url(#shadow)"><rect x="1468.8" y="438" width="324" height="108" rx="14" fill="#FFFFFF" stroke="#16A34A" stroke-width="1.836"/><text class="cardTitle" x="1630.8" y="472" text-anchor="middle">CoroutineHandler</text><text class="cardText" x="1630.8" y="498" text-anchor="middle">suspend ServerResponse</text><text class="cardText" x="1630.8" y="522" text-anchor="middle">bodyAndAwait / bodyValue</text></g>

