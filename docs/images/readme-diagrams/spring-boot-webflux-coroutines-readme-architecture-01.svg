  <rect class="canvas" width="1987.2" height="940"/>
  <rect class="frame" x="25.92" y="24" width="1935.36" height="892" rx="26"/>
  <text class="title" x="993.6" y="74" text-anchor="middle">WebFlux coroutine execution map</text>
  <text class="subtitle" x="993.6" y="108" text-anchor="middle">Annotation controllers and coRouter handlers share WebClient loopback, Flow examples, and tuned Reactor Netty resources.</text>

  <rect class="layer" x="90.72" y="154" width="1805.76" height="150" fill="#EFF6FF" stroke="#BFDBFE"/>
  <text class="layerTitle" x="133.92" y="198">HTTP entrypoints</text>
  <g filter="url(#shadow)"><rect x="162" y="220" width="313.2" height="62" rx="14" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.836"/><text class="cardTitle" x="318.6" y="258" text-anchor="middle">Default Controller</text></g>
  <g filter="url(#shadow)"><rect x="604.8" y="220" width="270" height="62" rx="14" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.836"/><text class="cardTitle" x="739.8" y="258" text-anchor="middle">IO Controller</text></g>
  <g filter="url(#shadow)"><rect x="1004.4" y="220" width="270" height="62" rx="14" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.836"/><text class="cardTitle" x="1139.4" y="258" text-anchor="middle">VT Controller</text></g>
