  <g filter="url(#shadow)"><rect x="626.4" y="704" width="334.8" height="82" rx="14" fill="#FFFFFF" stroke="#EA580C" stroke-width="1.836"/><text class="cardTitle" x="793.8" y="738" text-anchor="middle">Flow.async</text><text class="cardText" x="793.8" y="764" text-anchor="middle">parallel retrieveBanner()</text></g>
  <g filter="url(#shadow)"><rect x="1090.8" y="704" width="334.8" height="82" rx="14" fill="#FFFFFF" stroke="#EA580C" stroke-width="1.836"/><text class="cardTitle" x="1258.2" y="738" text-anchor="middle">WebClient loopback</text><text class="cardText" x="1258.2" y="764" text-anchor="middle">httpGet("/suspend")</text></g>
