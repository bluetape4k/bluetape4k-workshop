  <g filter="url(#shadow)"><rect x="167.4" y="448" width="334.8" height="88" rx="14" fill="#FFFFFF" stroke="#16A34A" stroke-width="1.836"/><text class="cardTitle" x="334.8" y="482" text-anchor="middle">Dispatchers.Default</text><text class="cardText" x="334.8" y="508" text-anchor="middle">baseline controller scope</text></g>
  <g filter="url(#shadow)"><rect x="610.2" y="448" width="302.4" height="88" rx="14" fill="#FFFFFF" stroke="#16A34A" stroke-width="1.836"/><text class="cardTitle" x="761.4" y="482" text-anchor="middle">Dispatchers.IO</text><text class="cardText" x="761.4" y="508" text-anchor="middle">blocking-friendly scope</text></g>
