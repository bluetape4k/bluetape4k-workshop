<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1378 560" width="1378" height="560">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="2" dy="4" stdDeviation="5" flood-color="#1f2937" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <polygon points="1,1 8,4.5 1,8" fill="#6b7280"/>
    </marker>
    <marker id="arrow-blue" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <polygon points="1,1 8,4.5 1,8" fill="#3b82f6"/>
    </marker>
    <marker id="arrow-green" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <polygon points="1,1 8,4.5 1,8" fill="#059669"/>
    </marker>
    <marker id="arrow-amber" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <polygon points="1,1 8,4.5 1,8" fill="#d97706"/>
    </marker>
    <marker id="arrow-red" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <polygon points="1,1 8,4.5 1,8" fill="#ef4444"/>
    </marker>
    <marker id="arrow-purple" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <polygon points="1,1 8,4.5 1,8" fill="#7c3aed"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1378" height="560" fill="#f6f9fc"/>
  <rect x="20" y="20" width="1338" height="520" rx="16" fill="#fff" stroke="#d7e2ec" stroke-width="1.5"/>

  <!-- Title -->
  <text x="48" y="56" font-family="'Architects Daughter', cursive" font-size="28" fill="#1e293b">Caffeine Cache — Cache-Aside Pattern</text>
  <text x="48" y="76" font-family="'Comic Sans MS', cursive" font-size="13" fill="#536476">@Cacheable · CaffeineManager · CountryPrefetcher startup warm-up</text>

  <!-- ── Main flow ── -->

  <!-- CountryRepository -->
  <rect x="40" y="120" width="230" height="100" rx="12" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.8" filter="url(#shadow)"/>
  <text x="155" y="150" font-family="'Architects Daughter', cursive" font-size="17" fill="#1e3a5f" text-anchor="middle">Country</text>
  <text x="155" y="170" font-family="'Architects Daughter', cursive" font-size="17" fill="#1e3a5f" text-anchor="middle">Repository</text>
  <rect x="85" y="181" width="140" height="20" rx="10" fill="#3b82f6"/>
  <text x="155" y="195" font-family="'Comic Sans MS', cursive" font-size="11" fill="#fff" text-anchor="middle">@Cacheable</text>

  <!-- Caffeine Cache (central, prominent) -->
  <rect x="350" y="100" width="310" height="130" rx="14" fill="#fef3c7" stroke="#d97706" stroke-width="2" filter="url(#shadow)"/>
  <text x="505" y="130" font-family="'Architects Daughter', cursive" font-size="19" fill="#78350f" text-anchor="middle">Caffeine Cache</text>
  <text x="505" y="152" font-family="'Comic Sans MS', cursive" font-size="12" fill="#536476" text-anchor="middle">CaffeineManager (Spring Cache)</text>
  <!-- HIT badge -->
  <rect x="358" y="164" width="140" height="22" rx="11" fill="#10b981"/>
  <text x="428" y="179" font-family="'Comic Sans MS', cursive" font-size="11" fill="#fff" text-anchor="middle">HIT → return cached</text>
  <!-- MISS badge -->
  <rect x="504" y="164" width="148" height="22" rx="11" fill="#ef4444"/>
  <text x="578" y="179" font-family="'Comic Sans MS', cursive" font-size="11" fill="#fff" text-anchor="middle">MISS → query H2</text>

  <!-- H2 Database (cylinder) -->
  <rect x="808" y="120" width="220" height="70" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5" filter="url(#shadow)"/>
  <ellipse cx="918" cy="190" rx="110" ry="13" fill="#cbd5e1" stroke="#64748b" stroke-width="1.5"/>
  <line x1="808" y1="120" x2="808" y2="190" stroke="#64748b" stroke-width="1.5"/>
  <line x1="1028" y1="120" x2="1028" y2="190" stroke="#64748b" stroke-width="1.5"/>
  <ellipse cx="918" cy="120" rx="110" ry="13" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
  <text x="918" y="152" font-family="'Architects Daughter', cursive" font-size="16" fill="#334155" text-anchor="middle">H2 Database</text>
  <text x="918" y="172" font-family="'Comic Sans MS', cursive" font-size="12" fill="#64748b" text-anchor="middle">in-memory (test)</text>

  <!-- ── Arrows: main flow ── -->
  <!-- CountryRepository → Caffeine Cache: lookup -->
  <line x1="270" y1="165" x2="350" y2="165" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <text x="310" y="158" font-family="'Comic Sans MS', cursive" font-size="11" fill="#3b82f6" text-anchor="middle">lookup</text>

  <!-- Caffeine Cache → H2 DB (MISS) -->
  <line x1="660" y1="165" x2="808" y2="155" stroke="#ef4444" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow-red)"/>
  <text x="734" y="149" font-family="'Comic Sans MS', cursive" font-size="11" fill="#ef4444" text-anchor="middle">MISS</text>

  <!-- H2 → populate cache (return + populate) -->
  <path d="M918,190 C918,240 505,240 505,230" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4 4" fill="none" marker-end="url(#arrow)"/>
  <text x="710" y="254" font-family="'Comic Sans MS', cursive" font-size="11" fill="#6b7280" text-anchor="middle">populate cache</text>

  <!-- HIT return: dashed arrow from cache back to repo -->
  <path d="M505,100 C505,80 155,80 155,120" stroke="#10b981" stroke-width="1.5" stroke-dasharray="5 4" fill="none" marker-end="url(#arrow-green)"/>
  <text x="330" y="73" font-family="'Comic Sans MS', cursive" font-size="11" fill="#10b981" text-anchor="middle">HIT ↩ return cached</text>

  <!-- ── Supporting components ── -->

  <!-- CountryPrefetcher -->
  <rect x="40" y="340" width="230" height="80" rx="12" fill="#d1fae5" stroke="#059669" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="155" y="368" font-family="'Architects Daughter', cursive" font-size="16" fill="#064e3b" text-anchor="middle">Country</text>
  <text x="155" y="386" font-family="'Architects Daughter', cursive" font-size="16" fill="#064e3b" text-anchor="middle">Prefetcher</text>
  <text x="155" y="406" font-family="'Comic Sans MS', cursive" font-size="11" fill="#536476" text-anchor="middle">@EventListener(AppReady)</text>

  <!-- CaffeineConfig -->
  <rect x="350" y="340" width="230" height="80" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="465" y="368" font-family="'Architects Daughter', cursive" font-size="16" fill="#3b0764" text-anchor="middle">CaffeineConfig</text>
  <text x="465" y="388" font-family="'Comic Sans MS', cursive" font-size="12" fill="#536476" text-anchor="middle">TTL / maximumSize</text>
  <text x="465" y="406" font-family="'Comic Sans MS', cursive" font-size="11" fill="#7c3aed" text-anchor="middle">@Bean CacheManager</text>

  <!-- CountryPrefetcher → CountryRepository: startup preload -->
  <line x1="155" y1="340" x2="155" y2="220" stroke="#059669" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <text x="180" y="285" font-family="'Comic Sans MS', cursive" font-size="11" fill="#059669">preload</text>

  <!-- CaffeineConfig → Caffeine Cache: configure -->
  <line x1="465" y1="340" x2="465" y2="230" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arrow-purple)"/>
  <text x="490" y="290" font-family="'Comic Sans MS', cursive" font-size="11" fill="#7c3aed">configure</text>

  <!-- ── Footer ── -->
  <rect x="36" y="450" width="1306" height="50" rx="10" fill="#fef9c3" stroke="#d97706" stroke-width="1.2"/>
  <text x="689" y="471" font-family="'Architects Daughter', cursive" font-size="14" fill="#92400e" text-anchor="middle">Cache-Aside: check cache → HIT return instantly · MISS query H2 → populate cache</text>
  <text x="689" y="489" font-family="'Comic Sans MS', cursive" font-size="12" fill="#536476" text-anchor="middle">CountryPrefetcher pre-loads all entries on startup — first request always a HIT</text>
</svg>
