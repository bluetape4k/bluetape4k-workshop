<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="2" dy="4" stdDeviation="5" flood-color="#1f2937" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth">
      <path d="M1,1 L8,4.5 L1,8 Z" fill="#758297"/>
    </marker>
    <style>
      .canvas{fill:#f7f9fc}
      .frame{fill:#fff;stroke:#d8e0ea;stroke-width:1.5}
      .title{font-family:"Architects Daughter";font-size:38px;font-weight:400;fill:#102033}
      .subtitle{font-family:"Comic Mono";font-size:14px;font-weight:400;fill:#536273}
      .smallLabel{font-family:"Architects Daughter";font-size:21px;font-weight:400;fill:#102033}
      .mono{font-family:"Comic Mono";font-size:12px;font-weight:400;fill:#102033}
      .small{font-family:"Comic Mono";font-size:12px;font-weight:400;fill:#536273}
      .card{stroke-width:2.1;filter:url(#shadow)}
      .line{stroke:#758297;stroke-width:2.1;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>

  <!-- Background -->
  <rect width="960" height="600" class="canvas"/>
  <rect x="24" y="20" width="912" height="560" rx="22" class="frame"/>

  <!-- Title -->
  <text x="48" y="70" class="title">Caffeine Cache — Cache-Aside Pattern</text>
  <text x="48" y="92" class="subtitle">@Cacheable · CaffeineManager · CountryPrefetcher startup warm-up</text>

  <!-- ── Row 1: Main flow cards ── -->

  <!-- CountryRepository (Blue) -->
  <rect x="48" y="118" width="220" height="110" rx="14" fill="#E8F3FF" stroke="#5B8DEF" class="card"/>
  <text x="158" y="150" class="smallLabel" text-anchor="middle">Country</text>
  <text x="158" y="174" class="smallLabel" text-anchor="middle">Repository</text>
  <rect x="88" y="186" width="140" height="22" rx="11" fill="#5B8DEF"/>
  <text x="158" y="201" class="mono" fill="#fff" text-anchor="middle">@Cacheable</text>

  <!-- Caffeine Cache (Amber, central) -->
  <rect x="330" y="108" width="300" height="130" rx="14" fill="#FFF3D9" stroke="#D6A441" class="card"/>
  <text x="480" y="140" class="smallLabel" text-anchor="middle">Caffeine Cache</text>
  <text x="480" y="162" class="small" text-anchor="middle">CaffeineManager (Spring Cache)</text>
  <!-- HIT badge -->
  <rect x="338" y="174" width="136" height="22" rx="11" fill="#58A978"/>
  <text x="406" y="189" class="mono" fill="#fff" text-anchor="middle">HIT → return cached</text>
  <!-- MISS badge -->
  <rect x="480" y="174" width="142" height="22" rx="11" fill="#DC6B82"/>
  <text x="551" y="189" class="mono" fill="#fff" text-anchor="middle">MISS → query H2</text>

  <!-- H2 Database (Lavender, styled as rounded card) -->
  <rect x="700" y="118" width="212" height="100" rx="14" fill="#F1ECFF" stroke="#8A72D6" class="card"/>
  <text x="806" y="154" class="smallLabel" text-anchor="middle">H2 Database</text>
  <text x="806" y="178" class="small" text-anchor="middle">in-memory (test)</text>
  <text x="806" y="198" class="small" text-anchor="middle">JPA / Exposed</text>

  <!-- ── Row 1 Arrows ── -->
  <!-- CountryRepository → Caffeine Cache: lookup -->
  <path d="M 268 168 H 330" class="line"/>
  <text x="299" y="160" class="small" text-anchor="middle">lookup</text>

  <!-- Caffeine Cache → H2 DB (MISS, orthogonal) -->
  <path d="M 630 155 H 700" class="line"/>
  <text x="665" y="147" class="small" text-anchor="middle">MISS</text>

  <!-- H2 → Caffeine Cache: populate (return down then left) -->
  <path d="M 806 218 V 248 H 480 V 238" class="line"/>
  <text x="660" y="262" class="small" text-anchor="middle">populate cache</text>

  <!-- Caffeine Cache → CountryRepository: HIT return (left-pointing horizontal, below lookup) -->
  <path d="M 330 185 H 268" class="line"/>
  <text x="299" y="200" class="small" text-anchor="middle">HIT ↩ cached</text>

  <!-- ── Row 2: Supporting components ── -->

  <!-- CountryPrefetcher (Green) -->
  <rect x="48" y="340" width="220" height="90" rx="14" fill="#EAF7EF" stroke="#58A978" class="card"/>
  <text x="158" y="372" class="smallLabel" text-anchor="middle">Country</text>
  <text x="158" y="394" class="smallLabel" text-anchor="middle">Prefetcher</text>
  <text x="158" y="416" class="small" text-anchor="middle">@EventListener(AppReady)</text>

  <!-- CaffeineConfig (Lavender) -->
  <rect x="330" y="340" width="220" height="90" rx="14" fill="#F1ECFF" stroke="#8A72D6" class="card"/>
  <text x="440" y="372" class="smallLabel" text-anchor="middle">CaffeineConfig</text>
  <text x="440" y="394" class="small" text-anchor="middle">TTL / maximumSize</text>
  <text x="440" y="414" class="small" text-anchor="middle">@Bean CacheManager</text>

  <!-- CountryPrefetcher → CountryRepository: preload (up) -->
  <path d="M 158 340 V 228" class="line"/>
  <text x="182" y="290" class="small">preload</text>

  <!-- CaffeineConfig → Caffeine Cache: configure (up) -->
  <path d="M 440 340 V 238" class="line"/>
  <text x="466" y="296" class="small">configure</text>

  <!-- ── Footer (teal) ── -->
  <rect x="36" y="454" width="888" height="54" rx="12" fill="#E9F7F6" stroke="#45A7A1" stroke-width="1.5"/>
  <text x="480" y="476" font-family="Architects Daughter" font-size="14" fill="#102033" text-anchor="middle">Cache-Aside: check cache → HIT return instantly · MISS query H2 → populate cache</text>
  <text x="480" y="494" class="small" text-anchor="middle">CountryPrefetcher pre-loads all entries on startup — first request always a HIT</text>
</svg>
