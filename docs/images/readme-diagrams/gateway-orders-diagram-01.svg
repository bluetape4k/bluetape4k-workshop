<svg xmlns="http://www.w3.org/2000/svg" width="960" height="500" viewBox="0 0 960 500" role="img" aria-label="Gateway Orders Architecture">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#1f2937" flood-opacity="0.10"/></filter>
  <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth">
    <path d="M1,1 L8,4.5 L1,8 Z" fill="#758297"/>
  </marker>
  <style>
    .canvas{fill:#f7f9fc}.frame{fill:#fff;stroke:#d8e0ea;stroke-width:1.5}
    .title{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:38px;font-weight:400;fill:#102033}
    .subtitle{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:14px;font-weight:400;fill:#536273}
    .smallLabel{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:21px;font-weight:400;fill:#102033}
    .mono{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#102033}
    .small{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#536273}
    .card{stroke-width:2.1;filter:url(#shadow)}
    .line{stroke:#758297;stroke-width:2.1;fill:none;marker-end:url(#arrow)}
  </style>
</defs>
<!-- Layout:
     Frame inner: x=44..936 = 892px
     Two column cards: w=416 each, gap=60px
       Col1: x=44  cx=252  right=460
       Col2: x=520 cx=728  right=936
     API Gateway: x=248 w=464 cx=480
-->
<rect class="canvas" width="960" height="500"/>
<rect class="frame" x="24" y="20" width="912" height="456" rx="28"/>
<text class="title" x="58" y="66">Gateway Orders Service</text>
<text class="subtitle" x="58" y="92">OrderController · ProductController · WebFlux · Coroutines · UUIDv7</text>

<!-- Gateway → OrderController (routes left) -->
<path class="line" d="M480 152 L480 177 L252 177 L252 202"/>
<!-- Gateway → ProductController (routes right) -->
<path class="line" d="M480 152 L480 177 L728 177 L728 202"/>
<!-- OrderController → Order model (straight) -->
<path class="line" d="M252 256 L252 306"/>
<!-- ProductController → Product model (straight) -->
<path class="line" d="M728 256 L728 306"/>

<!-- API Gateway -->
<g transform="translate(248,98)">
  <rect class="card" x="0" y="0" width="464" height="54" rx="12" fill="#EAF7EF" stroke="#58A978"/>
  <text class="smallLabel" x="232" y="22" text-anchor="middle">API Gateway :8080</text>
  <text class="small" x="232" y="42" text-anchor="middle">/order-service/** → RewritePath → :8082</text>
</g>

<!-- OrderController  col1: x=44 w=416 cx=252 -->
<g transform="translate(44,202)">
  <rect class="card" x="0" y="0" width="416" height="54" rx="12" fill="#F1ECFF" stroke="#8A72D6"/>
  <text class="smallLabel" x="208" y="22" text-anchor="middle">OrderController :8082</text>
  <text class="mono" x="208" y="42" text-anchor="middle">@RequestMapping("/api/v1/orders")</text>
</g>

<!-- ProductController  col2: x=520 w=416 cx=728 -->
<g transform="translate(520,202)">
  <rect class="card" x="0" y="0" width="416" height="54" rx="12" fill="#E8F3FF" stroke="#5B8DEF"/>
  <text class="smallLabel" x="208" y="22" text-anchor="middle">ProductController :8082</text>
  <text class="mono" x="208" y="42" text-anchor="middle">@RequestMapping("/api/v1/products")</text>
</g>

<!-- Order response  col1 -->
<g transform="translate(44,306)">
  <rect class="card" x="0" y="0" width="416" height="100" rx="12" fill="#FFF3D9" stroke="#D6A441"/>
  <text class="smallLabel" x="208" y="26" text-anchor="middle">Order Response</text>
  <text class="mono" x="208" y="48" text-anchor="middle">suspend fun getAll(): List&lt;Order&gt;</text>
  <text class="mono" x="208" y="68" text-anchor="middle">id: UUIDv7  ·  amount: BigDecimal</text>
  <text class="mono" x="208" y="86" text-anchor="middle">customerName: String</text>
</g>

<!-- Product response  col2 -->
<g transform="translate(520,306)">
  <rect class="card" x="0" y="0" width="416" height="100" rx="12" fill="#FDECEF" stroke="#DC6B82"/>
  <text class="smallLabel" x="208" y="26" text-anchor="middle">Product Response</text>
  <text class="mono" x="208" y="48" text-anchor="middle">suspend fun getAll(): List&lt;Product&gt;</text>
  <text class="mono" x="208" y="68" text-anchor="middle">id: UUIDv7  ·  name: String</text>
  <text class="mono" x="208" y="86" text-anchor="middle">price: BigDecimal</text>
</g>
</svg>
