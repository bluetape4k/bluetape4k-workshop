  <rect x="1556.0" y="366" width="14" height="48" rx="4" class="activation"/>
  <rect x="1621.0" y="404" width="220.0" height="34" rx="17" class="label workLabel"/>
  <circle cx="1645.0" cy="421" r="13" class="badge workBadge"/><text x="1645.0" y="426" text-anchor="middle" class="badgeText workText">3</text>
  <text x="1669.0" y="426" class="msg workText">delay(300)</text>
  <path d="M 1563.0 450 L 1899.0 450" class="work" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="1892.0" y="442" width="14" height="48" rx="4" class="activation"/>
  <rect x="600.0" y="480" width="246.0" height="34" rx="17" class="label returnLabel"/>
  <circle cx="624.0" cy="497" r="13" class="badge returnBadge"/><text x="624.0" y="502" text-anchor="middle" class="badgeText returnText">4</text>
  <text x="648.0" y="502" class="msg returnText">not thread-local only</text>
  <path d="M 891.0 526 L 555.0 526" class="return" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="562.0" y="518" width="14" height="48" rx="4" class="activation"/>
  <rect x="1284.0" y="556" width="222.0" height="34" rx="17" class="label returnLabel"/>
  <circle cx="1308.0" cy="573" r="13" class="badge returnBadge"/><text x="1308.0" y="578" text-anchor="middle" class="badgeText returnText">5</text>
  <text x="1332.0" y="578" class="msg returnText">rethrow, not error</text>
  <path d="M 1563.0 602 L 1227.0 602" class="return" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="1234.0" y="594" width="14" height="48" rx="4" class="activation"/>
  <rect x="1957.0" y="632" width="220.0" height="34" rx="17" class="label workLabel"/>
  <circle cx="1981.0" cy="649" r="13" class="badge workBadge"/><text x="1981.0" y="654" text-anchor="middle" class="badgeText workText">6</text>
  <text x="2005.0" y="654" class="msg workText">nested spans</text>
