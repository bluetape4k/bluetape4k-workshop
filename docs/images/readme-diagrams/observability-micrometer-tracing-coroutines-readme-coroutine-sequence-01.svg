<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="2454" height="800" viewBox="0 0 2454 800" role="img" aria-labelledby="title desc">
  <title id="title">Coroutine trace propagation</title>
  <desc id="desc">withObservationSuspending keeps observation scope around delays, WebClient await, and cancellation boundaries.</desc>
  <defs>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="124%"><feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#64748B" flood-opacity="0.14"/></filter>
    <style>.title{font-family:"Architects Daughter";font-size:40px;fill:#263238}.subtitle,.msg,.note,.footer{font-family:"Comic Mono";fill:#36464F}.subtitle{font-size:17px}.participant{font-family:"Architects Daughter";font-size:19px;fill:#1F3138}.role{font-family:"Comic Mono";font-size:12px;fill:#546A73}.msg{font-size:13px}.footer{font-size:14px;fill:#60727D}.frame{fill:#FBFCF8;stroke:#41545D;stroke-width:3}.header{fill:#FFFFFF;stroke:#546E7A;stroke-width:2}.lifeline{stroke:#9AAAB1;stroke-width:2;stroke-dasharray:7 8;stroke-linecap:round}.activation{fill:#E6F2EC;stroke:#5B7E67;stroke-width:1.5}.call,.work,.return{fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.call{stroke:#3F7D9C;marker-end:url(#arrow-call)}.work{stroke:#6E8F4F;marker-end:url(#arrow-work)}.return{stroke:#9B7D54;stroke-width:2.6;stroke-dasharray:8 6;marker-end:url(#arrow-ret)}.label{fill:#FFFFFF;stroke:#D7E0E4;stroke-width:1.5}.callLabel{stroke:#9CC2D1}.workLabel{stroke:#B6C9A4}.returnLabel{stroke:#C8B38F}.badge{stroke-width:1.8}.callBadge{fill:#EAF4F8;stroke:#3F7D9C}.workBadge{fill:#EEF7F0;stroke:#6E8F4F}.returnBadge{fill:#FFF7E8;stroke:#9B7D54}.badgeText{font-family:"Comic Mono";font-size:12px;font-weight:700}.callText,.badgeText.callText{fill:#2F6F8E}.workText,.badgeText.workText{fill:#55783F}.returnText,.badgeText.returnText{fill:#7F6038}</style>
    <marker id="arrow-call" viewBox="0 0 10 10" markerWidth="14" markerHeight="14" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#3F7D9C" stroke-dasharray="none" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="arrow-work" viewBox="0 0 10 10" markerWidth="14" markerHeight="14" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#6E8F4F" stroke-dasharray="none" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="arrow-ret" viewBox="0 0 10 10" markerWidth="14" markerHeight="14" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#9B7D54" stroke-dasharray="none" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>
  <rect x="24" y="24" width="2406" height="752" rx="20" class="frame"/>
  <text id="titleText" x="1227.0" y="76" text-anchor="middle" class="title">Coroutine trace propagation</text>
  <text x="1227.0" y="106" text-anchor="middle" class="subtitle">withObservationSuspending keeps observation scope around delays, WebClient await, and cancellation boundaries.</text>
  <g filter="url(#shadow)"><rect x="90.0" y="156" width="258" height="76" rx="10" class="header"/>
    <text x="219.0" y="186" text-anchor="middle" class="participant">Controller</text>
    <text x="219.0" y="211" text-anchor="middle" class="role">suspend handler</text></g>
  <line x1="219.0" y1="232" x2="219.0" y2="712" class="lifeline"/>
  <g filter="url(#shadow)"><rect x="426.0" y="156" width="258" height="76" rx="10" class="header"/>
    <text x="555.0" y="186" text-anchor="middle" class="participant">Coroutine context</text>
    <text x="555.0" y="211" text-anchor="middle" class="role">not thread-local only</text></g>
  <line x1="555.0" y1="232" x2="555.0" y2="712" class="lifeline"/>
  <g filter="url(#shadow)"><rect x="762.0" y="156" width="258" height="76" rx="10" class="header"/>
    <text x="891.0" y="186" text-anchor="middle" class="participant">pre-processing</text>
    <text x="891.0" y="211" text-anchor="middle" class="role">delay(200)</text></g>
  <line x1="891.0" y1="232" x2="891.0" y2="712" class="lifeline"/>
  <g filter="url(#shadow)"><rect x="1098.0" y="156" width="258" height="76" rx="10" class="header"/>
    <text x="1227.0" y="186" text-anchor="middle" class="participant">Cancellation</text>
    <text x="1227.0" y="211" text-anchor="middle" class="role">rethrow, not error</text></g>
  <line x1="1227.0" y1="232" x2="1227.0" y2="712" class="lifeline"/>
  <g filter="url(#shadow)"><rect x="1434.0" y="156" width="258" height="76" rx="10" class="header"/>
    <text x="1563.0" y="186" text-anchor="middle" class="participant">get-todo-by-id</text>
    <text x="1563.0" y="211" text-anchor="middle" class="role">WebClient await</text></g>
  <line x1="1563.0" y1="232" x2="1563.0" y2="712" class="lifeline"/>
  <g filter="url(#shadow)"><rect x="1770.0" y="156" width="258" height="76" rx="10" class="header"/>
    <text x="1899.0" y="186" text-anchor="middle" class="participant">post-processing</text>
    <text x="1899.0" y="211" text-anchor="middle" class="role">delay(300)</text></g>
  <line x1="1899.0" y1="232" x2="1899.0" y2="712" class="lifeline"/>
  <g filter="url(#shadow)"><rect x="2106.0" y="156" width="258" height="76" rx="10" class="header"/>
    <text x="2235.0" y="186" text-anchor="middle" class="participant">Zipkin trace</text>
    <text x="2235.0" y="211" text-anchor="middle" class="role">nested spans</text></g>
  <line x1="2235.0" y1="232" x2="2235.0" y2="712" class="lifeline"/>
  <rect x="445.0" y="252" width="220.0" height="34" rx="17" class="label callLabel"/>
