<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1382.4" height="880" viewBox="0 0 1382.4 880" role="img" aria-label="graph-abuser-detection seed example graph">
  <defs>
