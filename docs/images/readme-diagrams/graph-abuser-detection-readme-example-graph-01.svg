<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="880" viewBox="0 0 1280 880" role="img" aria-label="graph-abuser-detection seed example graph">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="128%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#64748B" flood-opacity="0.18"/>
    </filter>
    <marker id="arrowDevice" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 12 6 L 0 12 Z" fill="#2563EB" stroke-dasharray="none"/>
    </marker>
    <marker id="arrowIp" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 12 6 L 0 12 Z" fill="#16A34A" stroke-dasharray="none"/>
    </marker>
    <marker id="arrowReferral" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 12 6 L 0 12 Z" fill="#C47A12" stroke-dasharray="none"/>
    </marker>
    <style>
      .canvas { fill: #F8FAFC; }
      .frame { fill: #FFFFFF; stroke: #D6E0E8; stroke-width: 1.4; }
      .title { font-family: "Architects Daughter"; font-size: 34px; fill: #102033; }
      .subtitle { font-family: "Comic Mono"; font-size: 14px; fill: #51606F; }
      .regionTitle { font-family: "Architects Daughter"; font-size: 22px; fill: #102033; }
      .nodeTitle { font-family: "Architects Daughter"; font-size: 25px; fill: #102033; }
      .nodeText { font-family: "Comic Mono"; font-size: 14px; fill: #415166; }
      .legend { font-family: "Comic Mono"; font-size: 13px; fill: #415166; }
      .line { fill: none; stroke-width: 3.2; stroke-linecap: round; stroke-linejoin: round; }
      .labelBox { fill: #FFFFFF; stroke: #CFD8E3; stroke-width: 1; opacity: 0.96; }
      .label { font-family: "Comic Mono"; font-size: 12px; fill: #243244; dominant-baseline: middle; }
    </style>
  </defs>
  <rect class="canvas" width="1280" height="880"/>
  <rect class="frame" x="18" y="18" width="1244" height="844" rx="24"/>
  <text class="title" x="640" y="58" text-anchor="middle">AbuserDetectionSeed example graph</text>
  <text class="subtitle" x="640" y="84" text-anchor="middle">Shared device and IP identifiers connect user-1, user-2, and user-3; unrelated-user stays isolated.</text>

  <rect x="58" y="116" width="1164" height="548" rx="22" fill="#EEF6FF" stroke="#A7BED8" stroke-width="1.5"/>
  <text class="regionTitle" x="94" y="152">Seed fixture topology</text>

  <g filter="url(#shadow)">
    <rect x="124" y="184" width="220" height="88" rx="16" fill="#FFFFFF" stroke="#88A7C0" stroke-width="1.5"/>
    <text class="nodeTitle" x="234" y="218" text-anchor="middle">user-1</text>
    <text class="nodeText" x="234" y="244" text-anchor="middle">country KR</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="124" y="334" width="220" height="88" rx="16" fill="#FFFFFF" stroke="#88A7C0" stroke-width="1.5"/>
    <text class="nodeTitle" x="234" y="368" text-anchor="middle">user-2</text>
    <text class="nodeText" x="234" y="394" text-anchor="middle">country KR</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="124" y="484" width="220" height="88" rx="16" fill="#FFFFFF" stroke="#88A7C0" stroke-width="1.5"/>
    <text class="nodeTitle" x="234" y="518" text-anchor="middle">user-3</text>
    <text class="nodeText" x="234" y="544" text-anchor="middle">country US</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="548" y="214" width="250" height="92" rx="18" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.8"/>
    <text class="nodeTitle" x="673" y="249" text-anchor="middle">device-A</text>
    <text class="nodeText" x="673" y="276" text-anchor="middle">android fingerprint</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="548" y="424" width="250" height="92" rx="18" fill="#F0FDF4" stroke="#16A34A" stroke-width="1.8"/>
    <text class="nodeTitle" x="673" y="459" text-anchor="middle">ipA</text>
    <text class="nodeText" x="673" y="486" text-anchor="middle">192.168.1.1</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="930" y="426" width="222" height="88" rx="16" fill="#FFFFFF" stroke="#88A7C0" stroke-width="1.5"/>
    <text class="nodeTitle" x="1041" y="460" text-anchor="middle">unrelated-user</text>
    <text class="nodeText" x="1041" y="486" text-anchor="middle">country JP</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="930" y="562" width="222" height="78" rx="16" fill="#FFF7ED" stroke="#D97706" stroke-width="1.5"/>
    <text class="nodeTitle" x="1041" y="592" text-anchor="middle">device-B</text>
    <text class="nodeText" x="1041" y="617" text-anchor="middle">private device</text>
  </g>

  <path class="line" d="M 344 208 L 450 208 L 450 238 L 548 238" stroke="#2563EB" marker-end="url(#arrowDevice)" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="line" d="M 344 356 L 470 356 L 470 260 L 548 260" stroke="#2563EB" marker-end="url(#arrowDevice)" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="line" d="M 344 506 L 490 506 L 490 282 L 548 282" stroke="#2563EB" marker-end="url(#arrowDevice)" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="line" d="M 344 246 L 412 246 L 412 446 L 548 446" stroke="#16A34A" marker-end="url(#arrowIp)" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="line" d="M 344 394 L 452 394 L 452 490 L 548 490" stroke="#16A34A" marker-end="url(#arrowIp)" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="line" d="M 1041 514 L 1041 562" stroke="#2563EB" marker-end="url(#arrowDevice)" stroke-linecap="round" stroke-linejoin="round"/>

  <path class="line" d="M 234 272 L 234 334" stroke="#C47A12" stroke-dasharray="8 8" marker-end="url(#arrowReferral)" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="line" d="M 234 422 L 234 484" stroke="#C47A12" stroke-dasharray="8 8" marker-end="url(#arrowReferral)" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="line" d="M 124 528 L 92 528 L 92 228 L 124 228" stroke="#C47A12" stroke-dasharray="8 8" marker-end="url(#arrowReferral)" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="88" y="690" width="1096" height="124" rx="16" fill="#FFFFFF" stroke="#D5E0E8" stroke-width="1.4"/>
  <circle cx="126" cy="724" r="7" fill="#2563EB"/>
  <text class="legend" x="144" y="729">Identifier edge: participates in findAbuseCluster</text>
  <circle cx="650" cy="724" r="7" fill="#16A34A"/>
  <text class="legend" x="668" y="729">Shared IP identifier</text>
  <line x1="126" y1="772" x2="166" y2="772" stroke="#C47A12" stroke-width="3.2" stroke-dasharray="8 8"/>
  <text class="legend" x="182" y="777">Referral loop query only</text>
  <text class="legend" x="668" y="777">Expected cluster for user-1: user-2, user-3</text>
</svg>
