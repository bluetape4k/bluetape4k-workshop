<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" role="img" aria-label="Exposed DAO Web Transaction Architecture">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#1f2937" flood-opacity="0.10"/></filter>
  <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth">
    <path d="M1,1 L8,4.5 L1,8 Z" fill="#758297"/>
  </marker>
  <style>
    .canvas{fill:#f7f9fc}.frame{fill:#fff;stroke:#d8e0ea;stroke-width:1.5}
    .title{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:38px;font-weight:400;fill:#102033}
    .subtitle{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:14px;font-weight:400;fill:#536273}
    .smallLabel{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:21px;font-weight:400;fill:#102033}
    .mono{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#102033}
    .small{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#536273}
    .card{stroke-width:2.1;filter:url(#shadow)}
    .line{stroke:#758297;stroke-width:2.1;fill:none;marker-end:url(#arrow)}
  </style>
</defs>
<rect class="canvas" width="960" height="440"/>
<rect class="frame" x="24" y="20" width="912" height="396" rx="18"/>
<text class="title" x="44" y="66">Exposed DAO Web Transaction</text>
<text class="subtitle" x="44" y="90">DAOFacade → TransactionManager → DAO entities (H2) · CRUD operations</text>

<!-- Row 1: Controllers / Facade layer -->
<g transform="translate(44,110)">
  <rect class="card" x="0" y="0" width="200" height="72" rx="10" fill="#E8F3FF" stroke="#5B8DEF"/>
  <text class="smallLabel" x="100" y="32" text-anchor="middle">UserController</text>
  <text class="small" x="100" y="54" text-anchor="middle">POST /users, GET /users</text>
</g>
<g transform="translate(280,110)">
  <rect class="card" x="0" y="0" width="200" height="72" rx="10" fill="#EAF7EF" stroke="#58A978"/>
  <text class="smallLabel" x="100" y="32" text-anchor="middle">DAOFacade</text>
  <text class="small" x="100" y="54" text-anchor="middle">create / findById / update</text>
</g>
<g transform="translate(516,110)">
  <rect class="card" x="0" y="0" width="200" height="72" rx="10" fill="#FFF3D9" stroke="#D6A441"/>
  <text class="smallLabel" x="100" y="32" text-anchor="middle">TransactionManager</text>
  <text class="small" x="100" y="54" text-anchor="middle">Exposed transaction {}</text>
</g>
<g transform="translate(752,110)">
  <rect class="card" x="0" y="0" width="180" height="72" rx="10" fill="#FDECEF" stroke="#DC6B82"/>
  <text class="smallLabel" x="90" y="32" text-anchor="middle">UserTable</text>
  <text class="small" x="90" y="54" text-anchor="middle">DAO Entity (H2)</text>
</g>

<!-- Row 2: Model / Data layer -->
<g transform="translate(44,250)">
  <rect class="card" x="0" y="0" width="200" height="72" rx="10" fill="#E9F7F6" stroke="#45A7A1"/>
  <text class="smallLabel" x="100" y="32" text-anchor="middle">UserCreateRequest</text>
  <text class="small" x="100" y="54" text-anchor="middle">name: String, age: Int</text>
</g>
<g transform="translate(280,250)">
  <rect class="card" x="0" y="0" width="200" height="72" rx="10" fill="#F1ECFF" stroke="#8A72D6"/>
  <text class="smallLabel" x="100" y="32" text-anchor="middle">User (Entity)</text>
  <text class="small" x="100" y="54" text-anchor="middle">id, name, age</text>
</g>
<g transform="translate(516,250)">
  <rect class="card" x="0" y="0" width="200" height="72" rx="10" fill="#EAF7EF" stroke="#58A978"/>
  <text class="smallLabel" x="100" y="32" text-anchor="middle">UserDTO</text>
  <text class="small" x="100" y="54" text-anchor="middle">id, name, age</text>
</g>
<g transform="translate(752,250)">
  <rect class="card" x="0" y="0" width="180" height="72" rx="10" fill="#EEF6D9" stroke="#8BA84D"/>
  <text class="smallLabel" x="90" y="32" text-anchor="middle">H2 Database</text>
  <text class="small" x="90" y="54" text-anchor="middle">in-memory JDBC</text>
</g>

<!-- Arrows row 1 -->
<path class="line" d="M244,146 L278,146"/>
<path class="line" d="M480,146 L514,146"/>
<path class="line" d="M716,146 L750,146"/>

<!-- Vertical arrows -->
<path class="line" d="M144,182 L144,248"/>
<path class="line" d="M380,182 L380,248"/>
<path class="line" d="M616,182 L616,248"/>
<path class="line" d="M842,182 L842,248"/>
</svg>
