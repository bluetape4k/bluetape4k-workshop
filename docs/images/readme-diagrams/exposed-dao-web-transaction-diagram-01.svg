<svg xmlns="http://www.w3.org/2000/svg" width="1499.136" height="440" viewBox="0 0 1499.136 440" role="img" aria-label="Exposed DAO Web Transaction Architecture">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#1f2937" flood-opacity="0.10"/></filter>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 9 9" data-role="secondary" data-tip-direction="positive-x">
    <path d="M1,1 L8,4.5 L1,8 Z" fill="#758297" stroke-dasharray="none"/>
  </marker>
  <style>
    .canvas{fill:#f7f9fc}.frame{fill:#fff;stroke:#d8e0ea;stroke-width:1.5}
    .title{font-family:"Architects Daughter";font-size:38px;font-weight:400;fill:#102033}
    .subtitle{font-family:"Comic Mono";font-size:14px;font-weight:400;fill:#536273}
    .smallLabel{font-family:"Architects Daughter";font-size:21px;font-weight:400;fill:#102033}
    .mono{font-family:"Comic Mono";font-size:12px;font-weight:400;fill:#102033}
    .small{font-family:"Comic Mono";font-size:12px;font-weight:400;fill:#536273}
    .card{stroke-width:2.1;filter:url(#shadow)}
    .line{stroke:#758297;stroke-width:2.1;fill:none;marker-end:url(#arrow);stroke-linecap:round;stroke-linejoin:round}
  </style>
</defs>
<rect class="canvas" width="1499.136" height="440"/>
<rect class="frame" x="37.478" y="20" width="1424.179" height="396" rx="18"/>
<text class="title" x="68.71" y="66">Exposed DAO Web Transaction</text>
<text class="subtitle" x="68.71" y="90">UserService -> transaction{} -> DAO entities (H2)  -  CRUD operations</text>

<!-- Row 1: Controllers / Facade layer -->
<g transform="translate(68.71,110)">
  <rect class="card" x="0" y="0" width="312.32" height="72" rx="10" fill="#E8F3FF" stroke="#5B8DEF"/>
  <text class="smallLabel" x="156.16" y="32" text-anchor="middle">UserController</text>
  <text class="small" x="156.16" y="54" text-anchor="middle">POST /users, GET /users</text>
</g>
<g transform="translate(437.248,110)">
  <rect class="card" x="0" y="0" width="312.32" height="72" rx="10" fill="#EAF7EF" stroke="#58A978"/>
  <text class="smallLabel" x="156.16" y="32" text-anchor="middle">UserService</text>
  <text class="small" x="156.16" y="54" text-anchor="middle">create / findById / update</text>
</g>
<g transform="translate(805.786,110)">
  <rect class="card" x="0" y="0" width="312.32" height="72" rx="10" fill="#FFF3D9" stroke="#D6A441"/>
  <text class="smallLabel" x="156.16" y="32" text-anchor="middle">TransactionManager</text>
  <text class="small" x="156.16" y="54" text-anchor="middle">Exposed transaction {}</text>
</g>
<g transform="translate(1174.323,110)">
  <rect class="card" x="0" y="0" width="281.088" height="72" rx="10" fill="#FDECEF" stroke="#DC6B82"/>
  <text class="smallLabel" x="140.544" y="32" text-anchor="middle">UserTable</text>
  <text class="small" x="140.544" y="54" text-anchor="middle">DAO Entity (H2)</text>
</g>

<!-- Row 2: Model / Data layer -->
<g transform="translate(68.71,250)">
  <rect class="card" x="0" y="0" width="312.32" height="72" rx="10" fill="#E9F7F6" stroke="#45A7A1"/>
  <text class="smallLabel" x="156.16" y="32" text-anchor="middle">UserCreateRequest</text>
  <text class="small" x="156.16" y="54" text-anchor="middle">name: String, age: Int</text>
</g>
<g transform="translate(437.248,250)">
  <rect class="card" x="0" y="0" width="312.32" height="72" rx="10" fill="#F1ECFF" stroke="#8A72D6"/>
  <text class="smallLabel" x="156.16" y="32" text-anchor="middle">User (Entity)</text>
  <text class="small" x="156.16" y="54" text-anchor="middle">id, name, age</text>
</g>
<g transform="translate(805.786,250)">
  <rect class="card" x="0" y="0" width="312.32" height="72" rx="10" fill="#EAF7EF" stroke="#58A978"/>
  <text class="smallLabel" x="156.16" y="32" text-anchor="middle">UserDTO</text>
  <text class="small" x="156.16" y="54" text-anchor="middle">id, name, age</text>
</g>
<g transform="translate(1174.323,250)">
  <rect class="card" x="0" y="0" width="281.088" height="72" rx="10" fill="#EEF6D9" stroke="#8BA84D"/><image data-bluetape4k-icon="h2" data-source="docs/icons/database/h2.svg" x="14.0" y="10.0" width="30" height="30" href="data:image/svg+xml;base64," preserveAspectRatio="xMidYMid meet"/>
  <text class="smallLabel" x="140.544" y="32" text-anchor="middle">H2 Database</text>
  <text class="small" x="140.544" y="54" text-anchor="middle">in-memory JDBC</text>
</g>

<!-- Arrows row 1 -->
<path class="line" d="M 381.03 146 L 434.125 146" stroke-linecap="round" stroke-linejoin="round"/>
<path class="line" d="M 749.568 146 L 802.662 146" stroke-linecap="round" stroke-linejoin="round"/>
<path class="line" d="M 1118.106 146 L 1171.2 146" stroke-linecap="round" stroke-linejoin="round"/>

<!-- Vertical arrows -->
<path class="line" d="M 224.87 182 L 224.87 248" stroke-linecap="round" stroke-linejoin="round"/>
<path class="line" d="M 593.408 182 L 593.408 248" stroke-linecap="round" stroke-linejoin="round"/>
<path class="line" d="M 961.946 182 L 961.946 248" stroke-linecap="round" stroke-linejoin="round"/>
<path class="line" d="M 1314.867 182 L 1314.867 248" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
