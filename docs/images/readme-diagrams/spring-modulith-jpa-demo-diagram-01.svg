<svg xmlns="http://www.w3.org/2000/svg" width="960" height="460" viewBox="0 0 960 460" role="img" aria-label="Spring Modulith JPA Demo Architecture">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%">
    <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#1f2937" flood-opacity="0.10"/>
  </filter>
  <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth">
    <path d="M1,1 L8,4.5 L1,8 Z" fill="#758297"/>
  </marker>
  <style>
    .canvas{fill:#f7f9fc}.frame{fill:#fff;stroke:#d8e0ea;stroke-width:1.5}
    .title{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:38px;font-weight:400;fill:#102033}
    .subtitle{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:14px;font-weight:400;fill:#536273}
    .smallLabel{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:21px;font-weight:400;fill:#102033}
    .mono{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#102033}
    .small{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#536273}
    .card{stroke-width:2.1;filter:url(#shadow)}
    .line{stroke:#758297;stroke-width:2.1;fill:none;marker-end:url(#arrow)}
  </style>
</defs>
<rect class="canvas" width="960" height="460"/>
<rect class="frame" x="24" y="20" width="912" height="416" rx="20"/>
<text class="title" x="48" y="66">Spring Modulith JPA Demo</text>
<text class="subtitle" x="48" y="90">Module boundaries · @NamedInterface · GatewayManagement · Organization/Department/Employee</text>

<!-- Row 1: Top - GatewayManagement module -->
<rect class="card" x="48" y="108" width="864" height="72" rx="14" fill="#E8F3FF" stroke="#5B8DEF"/>
<text class="smallLabel" x="480" y="133" text-anchor="middle">GatewayManagement Module</text>
<line x1="48" y1="145" x2="912" y2="145" stroke="#5B8DEF" stroke-width="1"/>
<text class="mono" x="80" y="164" fill="#102033">@NamedInterface("gateway")</text>
<text class="small" x="80" y="180" fill="#536273">exposed package — cross-module API surface</text>
<text class="mono" x="420" y="164" fill="#102033">GatewayService</text>
<text class="small" x="420" y="180" fill="#536273">orchestrates cross-module operations</text>

<!-- Arrow downward -->
<path class="line" d="M480 182 L480 218"/>

<!-- Row 2: 3 domain modules -->
<!-- Organization module -->
<rect class="card" x="48" y="220" width="260" height="148" rx="14" fill="#EAF7EF" stroke="#58A978"/>
<text class="smallLabel" x="178" y="245" text-anchor="middle">Organization</text>
<line x1="48" y1="257" x2="308" y2="257" stroke="#58A978" stroke-width="1"/>
<text class="mono" x="68" y="276" fill="#102033">Organization</text>
<text class="small" x="68" y="292" fill="#536273">@Entity, @Table</text>
<text class="small" x="68" y="308" fill="#536273">id, name, code</text>
<text class="small" x="68" y="328" fill="#536273">OrganizationRepository</text>
<text class="small" x="68" y="344" fill="#536273">JpaRepository&lt;Org, Long&gt;</text>
<text class="small" x="68" y="360" fill="#536273">OrganizationService</text>

<!-- Department module -->
<rect class="card" x="350" y="220" width="260" height="148" rx="14" fill="#FFF3D9" stroke="#D6A441"/>
<text class="smallLabel" x="480" y="245" text-anchor="middle">Department</text>
<line x1="350" y1="257" x2="610" y2="257" stroke="#D6A441" stroke-width="1"/>
<text class="mono" x="370" y="276" fill="#102033">Department</text>
<text class="small" x="370" y="292" fill="#536273">@Entity, @Table</text>
<text class="small" x="370" y="308" fill="#536273">id, name, orgId (FK)</text>
<text class="small" x="370" y="328" fill="#536273">DepartmentRepository</text>
<text class="small" x="370" y="344" fill="#536273">JpaRepository&lt;Dept, Long&gt;</text>
<text class="small" x="370" y="360" fill="#536273">DepartmentService</text>

<!-- Employee module -->
<rect class="card" x="652" y="220" width="260" height="148" rx="14" fill="#FDECEF" stroke="#DC6B82"/>
<text class="smallLabel" x="782" y="245" text-anchor="middle">Employee</text>
<line x1="652" y1="257" x2="912" y2="257" stroke="#DC6B82" stroke-width="1"/>
<text class="mono" x="672" y="276" fill="#102033">Employee</text>
<text class="small" x="672" y="292" fill="#536273">@Entity, @Table</text>
<text class="small" x="672" y="308" fill="#536273">id, name, deptId (FK)</text>
<text class="small" x="672" y="328" fill="#536273">EmployeeRepository</text>
<text class="small" x="672" y="344" fill="#536273">JpaRepository&lt;Emp, Long&gt;</text>
<text class="small" x="672" y="360" fill="#536273">EmployeeService</text>

<!-- Bottom band -->
<rect class="card" x="48" y="382" width="864" height="48" rx="10" fill="#E9F7F6" stroke="#45A7A1" filter="url(#shadow)"/>
<text class="small" x="480" y="402" text-anchor="middle" fill="#536273">Module boundaries enforced by Spring Modulith — cross-module access via @NamedInterface only</text>
<text class="small" x="480" y="420" text-anchor="middle" fill="#536273">JPA Testcontainers — H2 in-process for tests · spring-modulith-jpa-demo module</text>
</svg>
