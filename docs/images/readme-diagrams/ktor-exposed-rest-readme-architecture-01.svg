<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1060" viewBox="0 0 1600 1060" role="img" aria-labelledby="title desc">
  <title id="title">Ktor Exposed REST Architecture</title>
  <desc id="desc">Top-to-bottom flow from HTTP client through Ktor routes, Exposed JDBC transaction helper, Hikari pool, and PostgreSQL Testcontainer.</desc>
  <defs>
    <filter id="soft-shadow" x="-8%" y="-8%" width="116%" height="124%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#64748B" flood-opacity="0.16"/>
    </filter>
    <marker id="arrow-blue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1,1 L11,6 L1,11 Z" fill="#3F7D9C" stroke="#3F7D9C" stroke-dasharray="none"/>
    </marker>
    <marker id="arrow-green" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1,1 L11,6 L1,11 Z" fill="#5F8A54" stroke="#5F8A54" stroke-dasharray="none"/>
    </marker>
    <marker id="arrow-amber" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1,1 L11,6 L1,11 Z" fill="#9B7D54" stroke="#9B7D54" stroke-dasharray="none"/>
    </marker>
    <style>
      .canvas{fill:#FBFCF8}
      .frame{fill:#FBFCF8;stroke:#41545D;stroke-width:3}
      .title{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:40px;fill:#263238}
      .subtitle,.layer-text,.card-body,.footer,.legend{font-family:"Comic Mono","Courier New",monospace;fill:#36464F}
      .subtitle{font-size:18px}
      .layer-title{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:25px;fill:#344154}
      .layer-text{font-size:14px;fill:#60727D}
      .card-title{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:25px;fill:#1F3138}
      .card-body{font-size:15px;fill:#52646D}
      .layer{stroke-width:2;rx:18;ry:18}
      .card{fill:#FFFFFF;stroke:#CAD7DC;stroke-width:2;rx:12;ry:12}
      .callout{fill:#FFFFFF;stroke:#D2DDE2;stroke-width:1.6;rx:12;ry:12}
      .line{fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
      .blue{stroke:#3F7D9C;marker-end:url(#arrow-blue)}
      .green{stroke:#5F8A54;marker-end:url(#arrow-green)}
      .amber{stroke:#9B7D54;marker-end:url(#arrow-amber)}
      .legend{font-size:12px;fill:#60727D}
      .footer{font-size:14px;fill:#60727D}
    </style>
  </defs>

  <rect class="canvas" width="1600" height="1060"/>
  <rect class="frame" x="28" y="28" width="1544" height="1004" rx="22"/>
  <text class="title" x="800" y="78" text-anchor="middle">Ktor Exposed REST Architecture</text>
  <text class="subtitle" x="800" y="108" text-anchor="middle">PostgreSQL-backed Ktor routes use bluetape4k-exposed-ktor for transaction and error boundaries.</text>
  <g aria-label="connector legend">
    <path class="line blue" data-connector="legend-request-route" d="M511 128 L551 128"/>
    <text class="legend" x="560" y="132">request route</text>
    <path class="line green" data-connector="legend-repository-call" d="M673 128 L713 128"/>
    <text class="legend" x="722" y="132">repository call</text>
    <path class="line amber" data-connector="legend-postgresql-jdbc" d="M885 128 L925 128"/>
    <text class="legend" x="934" y="132">PostgreSQL JDBC</text>
  </g>

  <rect class="layer" x="80" y="142" width="1440" height="155" fill="#EFF6FF" stroke="#B8D7ED"/>
  <text class="layer-title" x="118" y="185">HTTP Client Layer</text>
  <text class="layer-text" x="118" y="214">Requests enter as JSON and receive safe JSON responses.</text>
  <g class="node" data-node="learner-http-client" filter="url(#soft-shadow)">
    <rect class="card" x="560" y="175" width="480" height="92"/>
    <text class="card-title" x="800" y="212" text-anchor="middle">Learner HTTP Client</text>
    <text class="card-body" x="800" y="241" text-anchor="middle">curl, Ktor test client, or browser tooling</text>
  </g>

  <rect class="layer" x="80" y="350" width="1440" height="210" fill="#F0FDF4" stroke="#BFE3C3"/>
  <text class="layer-title" x="118" y="394">Ktor Application Layer</text>
  <text class="layer-text" x="118" y="423">Routes validate payloads before entering blocking JDBC work.</text>
  <g class="node" data-node="book-routes" filter="url(#soft-shadow)">
    <rect class="card" x="185" y="450" width="345" height="82"/>
    <text class="card-title" x="357.5" y="483" text-anchor="middle">BookRoutes</text>
    <text class="card-body" x="357.5" y="512" text-anchor="middle">CRUD, rollback, failure demo routes</text>
  </g>
  <g class="node" data-node="status-pages" filter="url(#soft-shadow)">
    <rect class="card" x="627.5" y="450" width="345" height="82"/>
    <text class="card-title" x="800" y="483" text-anchor="middle">StatusPages</text>
    <text class="card-body" x="800" y="512" text-anchor="middle">generic + Exposed error responses</text>
  </g>
  <g class="node" data-node="resources" filter="url(#soft-shadow)">
    <rect class="card" x="1070" y="450" width="345" height="82"/>
    <text class="card-title" x="1242.5" y="483" text-anchor="middle">KtorExposedRestResources</text>
    <text class="card-body" x="1242.5" y="512" text-anchor="middle">application-owned pool and dispatcher</text>
  </g>

  <rect class="layer" x="80" y="615" width="1440" height="190" fill="#FFF7ED" stroke="#E8C99F"/>
  <text class="layer-title" x="118" y="659">Exposed Transaction Layer</text>
  <text class="layer-text" x="118" y="688">All JDBC statements run inside call-scoped Exposed transactions.</text>
  <g class="node" data-node="exposed-jdbc-transaction" filter="url(#soft-shadow)">
    <rect class="card" x="355" y="705" width="395" height="72"/>
    <text class="card-title" x="552.5" y="735" text-anchor="middle">exposedJdbcTransaction</text>
    <text class="card-body" x="552.5" y="762" text-anchor="middle">wraps errors, rethrows cancellation</text>
  </g>
  <g class="node" data-node="book-repository" filter="url(#soft-shadow)">
    <rect class="card" x="850" y="705" width="395" height="72"/>
    <text class="card-title" x="1047.5" y="735" text-anchor="middle">BookRepository</text>
    <text class="card-body" x="1047.5" y="762" text-anchor="middle">Exposed DSL for ktor_exposed_books</text>
  </g>

  <rect class="layer" x="80" y="860" width="1440" height="125" fill="#F8FAFC" stroke="#CBD5E1"/>
  <text class="layer-title" x="118" y="904">PostgreSQL Infrastructure Layer</text>
  <text class="layer-text" x="118" y="933">Tests use PostgreSQLServer; runtime uses JDBC env vars.</text>
  <g class="node" data-node="postgresql-testcontainer" filter="url(#soft-shadow)">
    <rect class="card" x="565" y="884" width="470" height="100"/>
    <g data-bluetape4k-icon="testcontainers.postgresql" data-source="docs/icons/testcontainers/database/postgresql.svg" transform="translate(788 890) scale(1)">
      <title>PostgreSQL</title>
      <path fill="#4169E1" d="M23.5594 14.7228a.5269.5269 0 0 0-.0563-.1191c-.139-.2632-.4768-.3418-1.0074-.2321-1.6533.3411-2.2935.1312-2.5256-.0191 1.342-2.0482 2.445-4.522 3.0411-6.8297.2714-1.0507.7982-3.5237.1222-4.7316a1.5641 1.5641 0 0 0-.1509-.235C21.6931.9086 19.8007.0248 17.5099.0005c-1.4947-.0158-2.7705.3461-3.1161.4794a9.449 9.449 0 0 0-.5159-.0816 8.044 8.044 0 0 0-1.3114-.1278c-1.1822-.0184-2.2038.2642-3.0498.8406-.8573-.3211-4.7888-1.645-7.2219.0788C.9359 2.1526.3086 3.8733.4302 6.3043c.0409.818.5069 3.334 1.2423 5.7436.4598 1.5065.9387 2.7019 1.4334 3.582.553.9942 1.1259 1.5933 1.7143 1.7895.4474.1491 1.1327.1441 1.8581-.7279.8012-.9635 1.5903-1.8258 1.9446-2.2069.4351.2355.9064.3625 1.39.3772a.0569.0569 0 0 0 .0004.0041 11.0312 11.0312 0 0 0-.2472.3054c-.3389.4302-.4094.5197-1.5002.7443-.3102.064-1.1344.2339-1.1464.8115-.0025.1224.0329.2309.0919.3268.2269.4231.9216.6097 1.015.6331 1.3345.3335 2.5044.092 3.3714-.6787-.017 2.231.0775 4.4174.3454 5.0874.2212.5529.7618 1.9045 2.4692 1.9043.2505 0 .5263-.0291.8296-.0941 1.7819-.3821 2.5557-1.1696 2.855-2.9059.1503-.8707.4016-2.8753.5388-4.1012.0169-.0703.0357-.1207.057-.1362.0007-.0005.0697-.0471.4272.0307a.3673.3673 0 0 0 .0443.0068l.2539.0223.0149.001c.8468.0384 1.9114-.1426 2.5312-.4308.6438-.2988 1.8057-1.0323 1.5951-1.6698z"/>
    </g>
    <text class="card-title" x="800" y="950" text-anchor="middle">PostgreSQL Testcontainer</text>
    <text class="card-body" x="800" y="974" text-anchor="middle">real JDBC, rollback, readiness, and SQL error tests</text>
  </g>

  <path class="line blue" data-connector="client-to-routes" d="M800 267 L800 322 Q800 334 610 334 Q357.5 334 357.5 450"/>
  <path class="line blue" data-connector="routes-to-transaction" d="M357.5 532 L357.5 592 Q357.5 604 455 604 Q552.5 604 552.5 705"/>
  <path class="line green" data-connector="transaction-to-repository" d="M750 741 L850 741"/>
  <path class="line amber" data-connector="repository-to-postgresql" d="M1047.5 777 L1047.5 838 Q1047.5 850 650 850 Q650 850 650 884"/>

  <rect class="callout" x="120" y="992" width="1360" height="30"/>
  <text class="footer" x="800" y="1013" text-anchor="middle">Contract: route validation is outside the transaction; JDBC work is inside exposedJdbcTransaction; PostgreSQL is supplied by bluetape4k-testcontainers.</text>
</svg>
