<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" role="img" aria-label="Spring Data JPA QueryDSL Architecture">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#1f2937" flood-opacity="0.10"/></filter>
  <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M1,1 L8,4.5 L1,8 Z" fill="#758297"/></marker>
  <style>
    .canvas{fill:#f7f9fc}.frame{fill:#fff;stroke:#d8e0ea;stroke-width:1.5}
    .title{font-family:"Architects Daughter";font-size:38px;font-weight:400;fill:#102033}
    .subtitle{font-family:"Comic Mono";font-size:14px;font-weight:400;fill:#536273}
    .smallLabel{font-family:"Architects Daughter";font-size:21px;font-weight:400;fill:#102033}
    .small{font-family:"Comic Mono";font-size:12px;font-weight:400;fill:#536273}
    .card{stroke-width:2.1;filter:url(#shadow)}
    .line{stroke:#758297;stroke-width:2.1;fill:none;marker-end:url(#arrow)}
  </style>
</defs>
<rect class="canvas" width="960" height="440"/>
<rect class="frame" x="24" y="20" width="912" height="396" rx="16"/>
<text class="title" x="48" y="66">Spring Data JPA + QueryDSL Architecture</text>
<text class="subtitle" x="48" y="90">MemberRepository + QueryDslPredicateExecutor → JPA/Hibernate → H2</text>

<!-- Row 1: Repository -->
<rect class="card" x="280" y="108" width="400" height="60" rx="8" fill="#E8F3FF" stroke="#5B8DEF"/>
<text class="smallLabel" x="480" y="136" text-anchor="middle">MemberRepository</text>
<text class="small" x="480" y="155" text-anchor="middle">JpaRepository + MemberRepositoryCustom + QuerydslPredicateExecutor</text>

<!-- Row 2: Custom impl + Entities -->
<rect class="card" x="50" y="222" width="230" height="60" rx="8" fill="#EAF7EF" stroke="#58A978"/>
<text class="smallLabel" x="165" y="250" text-anchor="middle">MemberRepositoryImpl</text>
<text class="small" x="165" y="269" text-anchor="middle">QueryDSL custom queries</text>

<rect class="card" x="360" y="222" width="160" height="60" rx="8" fill="#FFF3D9" stroke="#D6A441"/>
<text class="smallLabel" x="440" y="250" text-anchor="middle">Member</text>
<text class="small" x="440" y="269" text-anchor="middle">@Entity + LongJpaEntity</text>

<rect class="card" x="600" y="222" width="160" height="60" rx="8" fill="#FDECEF" stroke="#DC6B82"/>
<text class="smallLabel" x="680" y="250" text-anchor="middle">Team</text>
<text class="small" x="680" y="269" text-anchor="middle">@Entity + LongJpaEntity</text>

<rect class="card" x="800" y="222" width="120" height="60" rx="8" fill="#F1ECFF" stroke="#8A72D6"/>
<text class="smallLabel" x="860" y="250" text-anchor="middle">TeamRepo</text>
<text class="small" x="860" y="269" text-anchor="middle">JpaRepository</text>

<!-- Row 3: Infrastructure -->
<rect class="card" x="140" y="350" width="280" height="52" rx="8" fill="#E9F7F6" stroke="#45A7A1"/>
<text class="smallLabel" x="280" y="378" text-anchor="middle">Spring Data JPA / Hibernate</text>
<text class="small" x="280" y="394" text-anchor="middle">EntityManager + JPQL + QueryDSL</text>

<rect class="card" x="540" y="350" width="260" height="52" rx="8" fill="#f5f5f5" stroke="#9aa3af"/>
<text class="smallLabel" x="670" y="378" text-anchor="middle">H2 In-Memory DB</text>
<text class="small" x="670" y="394" text-anchor="middle">@DataJpaTest / integration tests</text>

<!-- Arrows -->
<path class="line" d="M480 168 L480 204 L200 204 L200 222"/>
<path class="line" d="M480 168 L480 222"/>
<path class="line" d="M480 168 L480 204 L680 204 L680 222"/>
<path class="line" d="M480 168 L480 204 L860 204 L860 222"/>
<!-- Impls + Entities -> JPA -->
<path class="line" d="M165 282 L165 334 L240 334 L240 350"/>
<path class="line" d="M440 282 L440 334 L280 334 L280 350"/>
<!-- JPA -> H2 -->
<path class="line" d="M420 376 L540 376"/>
</svg>
