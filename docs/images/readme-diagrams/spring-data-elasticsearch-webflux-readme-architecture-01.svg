<svg xmlns="http://www.w3.org/2000/svg" width="1840" height="1040" viewBox="0 0 1840 1040">
  <defs>
    <style>
      .canvas { fill: #fbfcff; }
      .title { font-family: "Architects Daughter", "Comic Sans MS", cursive; font-size: 42px; fill: #102033; }
      .subtitle { font-family: "Comic Mono", "SFMono-Regular", monospace; font-size: 16px; fill: #536270; }
      .layer-title { font-family: "Architects Daughter", "Comic Sans MS", cursive; font-size: 28px; fill: #263445; }
      .card-title { font-family: "Architects Daughter", "Comic Sans MS", cursive; font-size: 27px; fill: #102033; }
      .card-small { font-family: "Comic Mono", "SFMono-Regular", monospace; font-size: 15px; fill: #394959; }
      .tiny { font-family: "Comic Mono", "SFMono-Regular", monospace; font-size: 13px; fill: #5b6978; }
      .layer-api { fill: #eef6ff; stroke: #9cc8ff; }
      .layer-service { fill: #eefaf2; stroke: #9ad8ae; }
      .layer-data { fill: #fff8eb; stroke: #ffc879; }
      .layer-runtime { fill: #fff1f0; stroke: #ffaaa3; }
      .card-blue { fill: #ffffff; stroke: #2f6df6; }
      .card-green { fill: #ffffff; stroke: #18964a; }
      .card-orange { fill: #ffffff; stroke: #f07d22; }
      .card-red { fill: #ffffff; stroke: #f04438; }
      .line-blue { fill: none; stroke: #2f6df6; stroke-width: 3.2; stroke-linecap: round; stroke-linejoin: round; }
      .line-green { fill: none; stroke: #18a558; stroke-width: 3.2; stroke-linecap: round; stroke-linejoin: round; }
      .line-orange { fill: none; stroke: #f07d22; stroke-width: 3.2; stroke-linecap: round; stroke-linejoin: round; }
      .line-red { fill: none; stroke: #f04438; stroke-width: 3.2; stroke-linecap: round; stroke-linejoin: round; }
    </style>
    <marker id="ew-arrow-blue" viewBox="0 0 16.3333 16.3333" refX="12" refY="7" markerWidth="14" markerHeight="14" orient="auto" markerUnits="userSpaceOnUse" data-role="primary" data-tip-direction="positive-x">
      <path d="M 1 1 L 13 7 L 1 13 Z" fill="#2f6df6" stroke-dasharray="none" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="ew-arrow-green" viewBox="0 0 16.3333 16.3333" refX="12" refY="7" markerWidth="14" markerHeight="14" orient="auto" markerUnits="userSpaceOnUse" data-role="primary" data-tip-direction="positive-x">
      <path d="M 1 1 L 13 7 L 1 13 Z" fill="#18a558" stroke-dasharray="none" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="ew-arrow-orange" viewBox="0 0 16.3333 16.3333" refX="12" refY="7" markerWidth="14" markerHeight="14" orient="auto" markerUnits="userSpaceOnUse" data-role="primary" data-tip-direction="positive-x">
      <path d="M 1 1 L 13 7 L 1 13 Z" fill="#f07d22" stroke-dasharray="none" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="ew-arrow-red" viewBox="0 0 16.3333 16.3333" refX="12" refY="7" markerWidth="14" markerHeight="14" orient="auto" markerUnits="userSpaceOnUse" data-role="primary" data-tip-direction="positive-x">
      <path d="M 1 1 L 13 7 L 1 13 Z" fill="#f04438" stroke-dasharray="none" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect class="canvas" x="0" y="0" width="1840" height="1040"/>
  <rect x="24" y="24" width="1792" height="992" rx="22" fill="#ffffff" stroke="#d7e0eb" stroke-width="2"/>  <text class="title" x="920" y="72" text-anchor="middle">WebFlux book API over Elasticsearch</text>
  <text class="subtitle" x="920" y="102" text-anchor="middle">Coroutine controllers route validated book requests to repository and native query paths.</text>

  <rect class="layer-api" x="80" y="140" width="1680" height="185" rx="18" stroke-width="2"/>
  <text class="layer-title" x="112" y="184">HTTP API layer</text>
  <rect class="card-blue" x="150" y="220" width="300" height="76" rx="10" stroke-width="2"/>
  <text class="card-title" x="300" y="251" text-anchor="middle">WebFlux request</text>
  <text class="card-small" x="300" y="275" text-anchor="middle">/v1/books endpoints</text>
  <rect class="card-blue" x="590" y="220" width="300" height="76" rx="10" stroke-width="2"/>
  <text class="card-title" x="740" y="251" text-anchor="middle">BookController</text>
  <text class="card-small" x="740" y="275" text-anchor="middle">suspend REST methods</text>
  <rect class="card-blue" x="1030" y="220" width="300" height="76" rx="10" stroke-width="2"/>
  <text class="card-title" x="1180" y="251" text-anchor="middle">ModifyBookRequest</text>
  <text class="card-small" x="1180" y="275" text-anchor="middle">Bean validation</text>
  <rect class="card-blue" x="1470" y="220" width="220" height="76" rx="10" stroke-width="2"/>
  <text class="card-title" x="1580" y="251" text-anchor="middle">Swagger</text>
  <text class="card-small" x="1580" y="275" text-anchor="middle">API docs</text>

  <rect class="layer-service" x="80" y="365" width="1680" height="195" rx="18" stroke-width="2"/>
  <text class="layer-title" x="112" y="409">Coroutine service layer</text>
  <rect class="card-green" x="235" y="450" width="330" height="82" rx="10" stroke-width="2"/>
  <text class="card-title" x="400" y="483" text-anchor="middle">DefaultBookService</text>
  <text class="card-small" x="400" y="508" text-anchor="middle">CRUD and ISBN rules</text>
  <rect class="card-green" x="755" y="450" width="330" height="82" rx="10" stroke-width="2"/>
  <text class="card-title" x="920" y="483" text-anchor="middle">NativeQuery builder</text>
  <text class="card-small" x="920" y="508" text-anchor="middle">title + author bool match</text>
  <rect class="card-green" x="1275" y="450" width="330" height="82" rx="10" stroke-width="2"/>
  <text class="card-title" x="1440" y="483" text-anchor="middle">BookExceptionHandler</text>
  <text class="card-small" x="1440" y="508" text-anchor="middle">404 and 400 responses</text>

  <rect class="layer-data" x="80" y="600" width="1680" height="195" rx="18" stroke-width="2"/>  <text class="layer-title" x="112" y="644">Spring Data Elasticsearch layer</text>
  <rect class="card-orange" x="180" y="685" width="360" height="82" rx="10" stroke-width="2"/>
  <text class="card-title" x="360" y="718" text-anchor="middle">BookRepository</text>
  <text class="card-small" x="360" y="743" text-anchor="middle">CoroutineCrudRepository</text>
  <rect class="card-orange" x="650" y="685" width="410" height="82" rx="10" stroke-width="2"/>
  <text class="card-title" x="855" y="718" text-anchor="middle">ReactiveElasticsearchTemplate</text>
  <text class="card-small" x="855" y="743" text-anchor="middle">native search result stream</text>
  <rect class="card-orange" x="1170" y="685" width="390" height="82" rx="10" stroke-width="2"/>
  <text class="card-title" x="1365" y="718" text-anchor="middle">ElasticsearchClientConfig</text>
  <text class="card-small" x="1365" y="743" text-anchor="middle">container URL + basic auth</text>

  <rect class="layer-runtime" x="80" y="835" width="1680" height="125" rx="18" stroke-width="2"/>
  <text class="layer-title" x="112" y="878">Runtime</text>
  <rect class="card-red" x="710" y="866" width="420" height="70" rx="10" stroke-width="2"/>
  <g transform="translate(745 879) scale(0.66)">
    <circle cx="34" cy="34" r="30" fill="#00bfb3"/>
    <path d="M 17 36 A 18 18 0 0 1 52 30" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round"/>
    <path d="M 20 47 A 18 18 0 0 0 53 45" fill="none" stroke="#f2c94c" stroke-width="8" stroke-linecap="round"/>
    <circle cx="54" cy="31" r="8" fill="#343741"/>
  </g>  <text class="card-title" x="950" y="895" text-anchor="middle">Elasticsearch OSS</text>  <text class="card-small" x="950" y="918" text-anchor="middle">Testcontainers books index</text>
  <rect class="card-red" x="1260" y="866" width="260" height="70" rx="10" stroke-width="2"/>
  <text class="card-title" x="1390" y="895" text-anchor="middle">NettyConfig</text>
  <text class="card-small" x="1390" y="918" text-anchor="middle">reactive resources</text>

  <path class="line-blue" d="M 450 258 L 578 258" marker-end="url(#ew-arrow-blue)" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="line-blue" d="M 890 258 L 1018 258" marker-end="url(#ew-arrow-blue)" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="line-green" d="M 740 296 L 740 334 Q 740 344 730 344 L 410 344 Q 400 344 400 354 L 400 438" marker-end="url(#ew-arrow-green)" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="line-green" d="M 1180 296 L 1180 334 Q 1180 344 1170 344 L 930 344 Q 920 344 920 354 L 920 438" marker-end="url(#ew-arrow-green)" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="line-green" d="M 740 296 L 740 334 Q 740 344 750 344 L 1430 344 Q 1440 344 1440 354 L 1440 438" marker-end="url(#ew-arrow-green)" stroke-linecap="round" stroke-linejoin="round"/>

  <path class="line-orange" d="M 400 532 L 400 673" marker-end="url(#ew-arrow-orange)" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="line-orange" d="M 920 532 L 920 673" marker-end="url(#ew-arrow-orange)" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="line-orange" d="M 1365 767 L 1365 810 Q 1365 819 1355 819 L 1050 819 Q 1040 819 1040 830 L 1040 854" marker-end="url(#ew-arrow-orange)" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="line-red" d="M 360 767 L 360 810 Q 360 819 370 819 L 810 819 Q 820 819 820 830 L 820 854" marker-end="url(#ew-arrow-red)" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="line-red" d="M 855 767 L 855 854" marker-end="url(#ew-arrow-red)" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
