<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1040" viewBox="0 0 1800 1040">
  <defs>
    <style>
      .bg{fill:#f8fafc}.title{font-family:'Architects Daughter','Comic Sans MS',cursive;font-size:34px;fill:#18212f}
      .layer-title{font-family:'Architects Daughter','Comic Sans MS',cursive;font-size:26px;fill:#344154}
      .card-title{font-family:'Architects Daughter','Comic Sans MS',cursive;font-size:27px;fill:#101827}
      .body{font-family:'Comic Mono','Comic Sans MS',monospace;font-size:18px;fill:#364152}.small{font-family:'Comic Mono','Comic Sans MS',monospace;font-size:15px;fill:#475569}
      .layer{stroke-width:1.5;rx:22;ry:22}.card{fill:#fff;stroke:#cbd5e1;stroke-width:1.5;rx:18;ry:18}
      .line{fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}.db{fill:#fff;stroke:#94a3b8;stroke-width:2}.dbtop{fill:#e0f2fe;stroke:#0284c7;stroke-width:2}
    </style>
    <marker id="arrow-blue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L11,6 L1,11 Z" fill="#2563eb" stroke-dasharray="none"/></marker>
    <marker id="arrow-green" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L11,6 L1,11 Z" fill="#059669" stroke-dasharray="none"/></marker>
    <marker id="arrow-purple" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L11,6 L1,11 Z" fill="#7c3aed" stroke-dasharray="none"/></marker>
  </defs>
  <rect class="bg" width="1800" height="1040"/>
  <text class="title" x="70" y="70">Spring Data R2DBC WebFlux Users API</text>

  <rect class="layer" x="70" y="120" width="1660" height="225" fill="#eff6ff" stroke="#bfdbfe"/>
  <text class="layer-title" x="105" y="165">HTTP entrypoints</text>
  <rect class="card" x="210" y="205" width="470" height="100"/>
  <text class="card-title" x="240" y="245">UserController</text>
  <text class="body" x="240" y="276">Annotation routes under /api/users</text>
  <rect class="card" x="1120" y="205" width="470" height="100"/>
  <text class="card-title" x="1150" y="245">coRouter + UserHandler</text>
  <text class="body" x="1150" y="276">Functional routes under /users</text>

  <rect class="layer" x="70" y="395" width="1660" height="205" fill="#f0fdf4" stroke="#bbf7d0"/>
  <text class="layer-title" x="105" y="440">Coroutine service boundary</text>
  <rect class="card" x="600" y="475" width="600" height="85"/>
  <text class="card-title" x="630" y="515">UserService</text>
  <text class="body" x="630" y="545">Flow reads + suspend writes with transactions</text>

  <rect class="layer" x="70" y="650" width="1660" height="160" fill="#faf5ff" stroke="#ddd6fe"/>
  <text class="layer-title" x="105" y="695">Spring Data R2DBC repository</text>
  <rect class="card" x="600" y="715" width="600" height="70"/>
  <text class="card-title" x="630" y="758">UserRepository</text>
  <text class="small" x="900" y="758">CoroutineCrudRepository + findByEmail</text>

  <rect class="layer" x="70" y="860" width="1660" height="120" fill="#fefce8" stroke="#fde68a"/>
  <text class="layer-title" x="105" y="910">Runtime</text>
  <rect class="card" x="285" y="910" width="460" height="50"/>
  <text class="body" x="315" y="942">ConnectionFactoryInitializer + SQL resources</text>
  <g transform="translate(1110 895)">
    <path class="db" d="M0,24 C0,4 290,4 290,24 L290,74 C290,94 0,94 0,74 Z"/>
    <ellipse class="dbtop" cx="145" cy="24" rx="145" ry="22"/>
    <path class="db" d="M0,24 C0,44 290,44 290,24"/>
    <text class="card-title" x="101" y="64">H2 R2DBC</text>
  </g>

  <path class="line" d="M445 305 L445 360 L840 360 L840 475" stroke="#2563eb" marker-end="url(#arrow-blue)" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="line" d="M1355 305 L1355 360 L960 360 L960 475" stroke="#2563eb" marker-end="url(#arrow-blue)" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="line" d="M900 560 L900 715" stroke="#059669" marker-end="url(#arrow-green)" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="line" d="M900 785 L900 835 L515 835 L515 910" stroke="#7c3aed" marker-end="url(#arrow-purple)" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="line" d="M745 935 L1110 935" stroke="#7c3aed" marker-end="url(#arrow-purple)" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
