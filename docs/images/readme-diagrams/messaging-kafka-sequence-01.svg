<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" role="img" aria-label="Kafka Greeting Sequence">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#1f2937" flood-opacity="0.10"/></filter>
  <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth">
    <path d="M1,1 L8,4.5 L1,8 Z" fill="#758297"/>
  </marker>
  <style>
    .canvas{fill:#f7f9fc}.frame{fill:#fff;stroke:#d8e0ea;stroke-width:1.5}
    .title{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:38px;font-weight:400;fill:#102033}
    .subtitle{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:14px;font-weight:400;fill:#536273}
    .smallLabel{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:21px;font-weight:400;fill:#102033}
    .strong{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#102033}
    .small{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#536273}
    .card{stroke-width:2.1;filter:url(#shadow)}
    .lifeline{stroke:#b0bbca;stroke-width:1.5;stroke-dasharray:6 4;fill:none}
    .reqArrow{stroke:#5B8DEF;stroke-width:2.1;fill:none;marker-end:url(#arrow)}
    .rspArrow{stroke:#45A7A1;stroke-width:2.1;stroke-dasharray:7 4;fill:none;marker-end:url(#arrow)}
  </style>
</defs>
<rect class="canvas" width="960" height="480"/>
<rect class="frame" x="24" y="20" width="912" height="436" rx="18"/>
<text class="title" x="44" y="62">Kafka Greeting Sequence</text>
<text class="subtitle" x="44" y="84">Controller → KafkaTemplate → Topic → @KafkaListener handler</text>

<!-- Lifeline headers -->
<rect class="card" x="24" y="96" width="160" height="48" rx="14" fill="#E8F3FF" stroke="#5B8DEF"/>
<text class="smallLabel" x="104" y="126" text-anchor="middle">Greeting</text>
<line class="lifeline" x1="104" y1="144" x2="104" y2="448"/>

<rect class="card" x="240" y="96" width="160" height="48" rx="14" fill="#EAF7EF" stroke="#58A978"/>
<text class="smallLabel" x="320" y="126" text-anchor="middle">KafkaTemplate</text>
<line class="lifeline" x1="320" y1="144" x2="320" y2="448"/>

<rect class="card" x="456" y="96" width="160" height="48" rx="14" fill="#FFF3D9" stroke="#D6A441"/>
<text class="smallLabel" x="536" y="120" text-anchor="middle">greeting.topic</text>
<text class="small" x="536" y="136" text-anchor="middle">.1</text>
<line class="lifeline" x1="536" y1="144" x2="536" y2="448"/>

<rect class="card" x="672" y="96" width="160" height="48" rx="14" fill="#FDECEF" stroke="#DC6B82"/>
<text class="smallLabel" x="752" y="120" text-anchor="middle">Greeting</text>
<text class="small" x="752" y="136" text-anchor="middle">MessageHandler</text>
<line class="lifeline" x1="752" y1="144" x2="752" y2="448"/>

<!-- 1: POST /greeting -->
<rect x="108" y="160" width="170" height="26" rx="8" fill="#fff" opacity="0.95"/>
<text class="strong" x="116" y="177">1. POST /greeting {msg}</text>
<path class="reqArrow" d="M104,190 L318,190"/>

<!-- 2: send(topic, key, value) -->
<rect x="324" y="200" width="190" height="26" rx="8" fill="#fff" opacity="0.95"/>
<text class="strong" x="332" y="217">2. send(greeting.topic.1, key, val)</text>
<path class="reqArrow" d="M320,228 L534,228"/>

<!-- 3: message published -->
<rect x="440" y="246" width="170" height="26" rx="8" fill="#fff" opacity="0.95"/>
<text class="strong" x="448" y="263">3. message published</text>

<!-- 4: @KafkaListener callback -->
<rect x="540" y="284" width="190" height="26" rx="8" fill="#fff" opacity="0.95"/>
<text class="strong" x="548" y="301">4. @KafkaListener triggered</text>
<path class="reqArrow" d="M536,312 L750,312"/>

<!-- 5: process greeting -->
<rect x="640" y="330" width="200" height="26" rx="8" fill="#fff" opacity="0.95"/>
<text class="strong" x="648" y="347">5. processGreeting(record)</text>

<!-- 6: ack / commit offset -->
<rect x="440" y="368" width="175" height="26" rx="8" fill="#fff" opacity="0.95"/>
<text class="strong" x="448" y="385">6. commit offset (ack)</text>
<path class="rspArrow" d="M752,396 L538,396"/>

<!-- 7: 201 response -->
<rect x="108" y="412" width="180" height="26" rx="8" fill="#fff" opacity="0.95"/>
<text class="strong" x="116" y="429">7. 201 Created (async)</text>
</svg>
