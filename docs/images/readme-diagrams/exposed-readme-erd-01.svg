<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="1120" viewBox="0 0 1900 1120" role="img" aria-labelledby="title desc">
  <title id="title">Exposed Workshop Domain ERD</title>
  <desc id="desc">Entity relationship diagram for the Exposed workshop domain tables and the isolated JaVers audit products table.</desc>
  <defs>
    <style>
      svg{background:#f8fafc}
      .frame{fill:#ffffff;stroke:#d7e3ef;stroke-width:2}
      .title{font-family:"Architects Daughter";font-size:44px;fill:#142033}
      .subtitle,.schema,.cell,.rel,.note{font-family:"Comic Mono";fill:#425267}
      .subtitle{font-size:17px}
      .schema{font-size:15px;fill:#64748b}
      .schemaLine{stroke:#dce8f3;stroke-width:1.6}
      .table{fill:#ffffff;stroke:#8fb0cc;stroke-width:2}
      .head{fill:#e8f4ff;stroke:#8fb0cc;stroke-width:0}
      .headAudit{fill:#fff0d6;stroke:#e6bd7a;stroke-width:0}
      .tableName{font-family:"Architects Daughter";font-size:28px;fill:#142033}
      .tableMeta{font-family:"Comic Mono";font-size:13px;fill:#52677c}
      .rowLine{stroke:#deebf5;stroke-width:1.4}
      .colLine{stroke:#e7f0f8;stroke-width:1.2}
      .cell{font-size:17px;fill:#1f2d3d}
      .key{font-size:16px;fill:#2563a8;font-weight:700}
      .fk{fill:#a7651e;font-weight:700}
      .muted{fill:#6b7788}
      .relationship{stroke:#5f7790;stroke-width:3;fill:none;stroke-linecap:square;stroke-linejoin:round}
      .crow{stroke:#5f7790;stroke-width:3;fill:none;stroke-linecap:square}
      .rel{font-size:14px;fill:#475569}
      .noteBox{fill:#fbfdff;stroke:#d7e3ef;stroke-width:1.6}
      .noteTitle{font-family:"Architects Daughter";font-size:24px;fill:#142033}
      .note{font-size:15px;fill:#425267}
    </style>
  </defs>

  <rect class="frame" x="36" y="34" width="1828" height="1050" rx="18"/>
  <text class="title" x="950" y="90" text-anchor="middle">Exposed Workshop Domain ERD</text>
  <text class="subtitle" x="950" y="124" text-anchor="middle">Concrete Exposed tables: operational samples share FK-backed Author/Book and Order/Product schemas; JaVers audit keeps a separate Product row.</text>

  <text class="schema" x="120" y="178">schema: operational domain - mvc-jdbc, mvc-virtualthread, webflux-r2dbc</text>
  <line class="schemaLine" x1="120" y1="190" x2="1288" y2="190"/>
  <text class="schema" x="1398" y="178">schema: audit slice - javers-audit</text>
  <line class="schemaLine" x1="1398" y1="190" x2="1782" y2="190"/>

  <g id="relationships">
    <path class="relationship" d="M 516 375 H 662" stroke-linecap="round" stroke-linejoin="round"/>
    <path class="crow" d="M 662 375 L 638 361 M 662 375 L 638 389" stroke-linecap="round" stroke-linejoin="round"/>
    <path class="crow" d="M 526 355 V 395" stroke-linecap="round" stroke-linejoin="round"/>
    <text class="rel" x="589" y="354" text-anchor="middle">author_id</text>

    <path class="relationship" d="M 516 790 H 662" stroke-linecap="round" stroke-linejoin="round"/>
    <path class="crow" d="M 662 790 L 638 776 M 662 790 L 638 804" stroke-linecap="round" stroke-linejoin="round"/>
    <path class="crow" d="M 526 770 V 810" stroke-linecap="round" stroke-linejoin="round"/>
    <text class="rel" x="589" y="769" text-anchor="middle">order_id</text>

    <path class="relationship" d="M 1068 790 H 1168" stroke-linecap="round" stroke-linejoin="round"/>
    <path class="crow" d="M 1068 790 L 1092 776 M 1068 790 L 1092 804" stroke-linecap="round" stroke-linejoin="round"/>
    <path class="crow" d="M 1158 770 V 810" stroke-linecap="round" stroke-linejoin="round"/>
    <text class="rel" x="1118" y="769" text-anchor="middle">product_id</text>
  </g>

  <g id="authors">
    <rect class="table" x="144" y="250" width="372" height="254"/>
    <rect class="head" x="144" y="250" width="372" height="70"/>
    <text class="tableName" x="330" y="290" text-anchor="middle">authors</text>
    <text class="tableMeta" x="330" y="311" text-anchor="middle">AuditableLongIdTable</text>
    <line class="rowLine" x1="144" y1="356" x2="516" y2="356"/>
    <line class="rowLine" x1="144" y1="396" x2="516" y2="396"/>
    <line class="rowLine" x1="144" y1="436" x2="516" y2="436"/>
    <line class="rowLine" x1="144" y1="476" x2="516" y2="476"/>
    <line class="colLine" x1="202" y1="320" x2="202" y2="504"/>
    <line class="colLine" x1="372" y1="320" x2="372" y2="504"/>
    <text class="key" x="160" y="345">PK</text><text class="cell" x="220" y="345">id</text><text class="cell" x="390" y="345">long</text>
    <text class="cell" x="220" y="385">first_name</text><text class="cell" x="390" y="385">varchar(100)</text>
    <text class="cell" x="220" y="425">last_name</text><text class="cell" x="390" y="425">varchar(100)</text>
    <text class="cell" x="220" y="465">email</text><text class="cell" x="390" y="465">varchar(255)</text>
    <text class="cell muted" x="220" y="494">unique index</text>
  </g>

  <g id="books">
    <rect class="table" x="662" y="250" width="406" height="254"/>
    <rect class="head" x="662" y="250" width="406" height="70"/>
    <text class="tableName" x="865" y="290" text-anchor="middle">books</text>
    <text class="tableMeta" x="865" y="311" text-anchor="middle">LongIdTable</text>
    <line class="rowLine" x1="662" y1="356" x2="1068" y2="356"/>
    <line class="rowLine" x1="662" y1="396" x2="1068" y2="396"/>
    <line class="rowLine" x1="662" y1="436" x2="1068" y2="436"/>
    <line class="rowLine" x1="662" y1="476" x2="1068" y2="476"/>
    <line class="colLine" x1="720" y1="320" x2="720" y2="504"/>
    <line class="colLine" x1="900" y1="320" x2="900" y2="504"/>
    <text class="key" x="678" y="345">PK</text><text class="cell" x="738" y="345">id</text><text class="cell" x="918" y="345">long</text>
    <text class="cell" x="738" y="385">title</text><text class="cell" x="918" y="385">varchar(200)</text>
    <text class="cell" x="738" y="425">publish_date</text><text class="cell" x="918" y="425">varchar(20)</text>
    <text class="key fk" x="678" y="465">FK</text><text class="cell fk" x="738" y="465">author_id</text><text class="cell" x="918" y="465">authors.id</text>
  </g>

  <g id="orders">
    <rect class="table" x="144" y="660" width="372" height="254"/>
    <rect class="head" x="144" y="660" width="372" height="70"/>
    <text class="tableName" x="330" y="700" text-anchor="middle">orders</text>
    <text class="tableMeta" x="330" y="721" text-anchor="middle">Table</text>
    <line class="rowLine" x1="144" y1="766" x2="516" y2="766"/>
    <line class="rowLine" x1="144" y1="806" x2="516" y2="806"/>
    <line class="rowLine" x1="144" y1="846" x2="516" y2="846"/>
    <line class="rowLine" x1="144" y1="886" x2="516" y2="886"/>
    <line class="colLine" x1="202" y1="730" x2="202" y2="914"/>
    <line class="colLine" x1="372" y1="730" x2="372" y2="914"/>
    <text class="key" x="160" y="755">PK</text><text class="cell" x="220" y="755">id</text><text class="cell" x="390" y="755">long</text>
    <text class="cell" x="220" y="795">customer_id</text><text class="cell" x="390" y="795">long</text>
    <text class="cell" x="220" y="835">order_date</text><text class="cell" x="390" y="835">epoch millis</text>
    <text class="cell" x="220" y="875">status</text><text class="cell" x="390" y="875">enum name</text>
  </g>

  <g id="order-lines">
    <rect class="table" x="662" y="620" width="406" height="334"/>
    <rect class="head" x="662" y="620" width="406" height="70"/>
    <text class="tableName" x="865" y="660" text-anchor="middle">order_lines</text>
    <text class="tableMeta" x="865" y="681" text-anchor="middle">Table</text>
    <line class="rowLine" x1="662" y1="726" x2="1068" y2="726"/>
    <line class="rowLine" x1="662" y1="766" x2="1068" y2="766"/>
    <line class="rowLine" x1="662" y1="806" x2="1068" y2="806"/>
    <line class="rowLine" x1="662" y1="846" x2="1068" y2="846"/>
    <line class="rowLine" x1="662" y1="886" x2="1068" y2="886"/>
    <line class="rowLine" x1="662" y1="926" x2="1068" y2="926"/>
    <line class="colLine" x1="720" y1="690" x2="720" y2="954"/>
    <line class="colLine" x1="900" y1="690" x2="900" y2="954"/>
    <text class="key" x="678" y="715">PK</text><text class="cell" x="738" y="715">id</text><text class="cell" x="918" y="715">long</text>
    <text class="key fk" x="678" y="755">FK</text><text class="cell fk" x="738" y="755">order_id</text><text class="cell" x="918" y="755">orders.id</text>
    <text class="key fk" x="678" y="795">FK</text><text class="cell fk" x="738" y="795">product_id</text><text class="cell" x="918" y="795">products.id</text>
    <text class="cell" x="738" y="835">quantity</text><text class="cell" x="918" y="835">integer</text>
    <text class="cell" x="738" y="875">unit_price</text><text class="cell" x="918" y="875">decimal(12,2)</text>
  </g>

  <g id="products">
    <rect class="table" x="1168" y="660" width="350" height="254"/>
    <rect class="head" x="1168" y="660" width="350" height="70"/>
    <text class="tableName" x="1343" y="700" text-anchor="middle">products</text>
    <text class="tableMeta" x="1343" y="721" text-anchor="middle">operational Table</text>
    <line class="rowLine" x1="1168" y1="766" x2="1518" y2="766"/>
    <line class="rowLine" x1="1168" y1="806" x2="1518" y2="806"/>
    <line class="rowLine" x1="1168" y1="846" x2="1518" y2="846"/>
    <line class="rowLine" x1="1168" y1="886" x2="1518" y2="886"/>
    <line class="colLine" x1="1226" y1="730" x2="1226" y2="914"/>
    <line class="colLine" x1="1376" y1="730" x2="1376" y2="914"/>
    <text class="key" x="1184" y="755">PK</text><text class="cell" x="1244" y="755">id</text><text class="cell" x="1394" y="755">long</text>
    <text class="cell" x="1244" y="795">name</text><text class="cell" x="1394" y="795">varchar(200)</text>
    <text class="cell" x="1244" y="835">price</text><text class="cell" x="1394" y="835">decimal(12,2)</text>
    <text class="cell" x="1244" y="875">stock</text><text class="cell" x="1394" y="875">integer</text>
  </g>

  <g id="audit-products">
    <rect class="table" x="1398" y="250" width="384" height="254"/>
    <rect class="headAudit" x="1398" y="250" width="384" height="70"/>
    <text class="tableName" x="1590" y="290" text-anchor="middle">products</text>
    <text class="tableMeta" x="1590" y="311" text-anchor="middle">JaVers audit slice Table</text>
    <line class="rowLine" x1="1398" y1="356" x2="1782" y2="356"/>
    <line class="rowLine" x1="1398" y1="396" x2="1782" y2="396"/>
    <line class="rowLine" x1="1398" y1="436" x2="1782" y2="436"/>
    <line class="rowLine" x1="1398" y1="476" x2="1782" y2="476"/>
    <line class="colLine" x1="1456" y1="320" x2="1456" y2="504"/>
    <line class="colLine" x1="1612" y1="320" x2="1612" y2="504"/>
    <text class="key" x="1414" y="345">PK</text><text class="cell" x="1474" y="345">id</text><text class="cell" x="1630" y="345">long</text>
    <text class="cell" x="1474" y="385">name</text><text class="cell" x="1630" y="385">varchar(255)</text>
    <text class="cell" x="1474" y="425">price</text><text class="cell" x="1630" y="425">decimal(19,4)</text>
    <text class="cell" x="1474" y="465">category</text><text class="cell" x="1630" y="465">varchar(100)</text>
  </g>

  <g id="audit-note">
    <rect class="noteBox" x="1550" y="590" width="232" height="188"/>
    <text class="noteTitle" x="1574" y="630">Audit boundary</text>
    <text class="note" x="1576" y="664">No FK to orders</text>
    <text class="note" x="1576" y="690">or order_lines.</text>
    <text class="note" x="1576" y="716">JaVers snapshots</text>
    <text class="note" x="1576" y="742">live outside this</text>
    <text class="note" x="1576" y="768">Exposed table.</text>
  </g>
</svg>
