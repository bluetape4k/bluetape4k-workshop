<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1260" viewBox="0 0 1800 1260" role="img" aria-labelledby="title desc">
  <title id="title">Order Lifecycle Fulfillment Architecture</title>
  <desc id="desc">Browser and live WebTestClient requests enter Tomcat MVC. Application-owned idempotency, command, query, and SSE services coordinate independent lifecycle state machines through durable Spring Modulith publications. Exposed repositories persist authoritative state, audit history, provider inbox evidence, and publications in PostgreSQL while bluetape4k logging records operational decisions.</desc>
  <defs>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="124%"><feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#64748B" flood-opacity="0.13"/></filter>
    <style>
      .bg{fill:#F8FAF7}.title{font-family:"Architects Daughter";font-size:44px;fill:#263238}.subtitle,.body,.small,.legend,.footer{font-family:"Comic Mono";fill:#3E4C59}.subtitle{font-size:18px}.layerTitle{font-family:"Architects Daughter";font-size:26px;fill:#344154}.cardTitle{font-family:"Architects Daughter";font-size:23px;fill:#16202A}.body{font-size:15px}.small{font-size:13px;fill:#5B6975}.layer{fill:#FFFFFF;stroke:#CAD6DF;stroke-width:2}.card{stroke-width:2.2}.blue{fill:#EFF6FF;stroke:#4F86C6}.green{fill:#F0F8F0;stroke:#6E8F4F}.amber{fill:#FFF7E8;stroke:#9B7D54}.red{fill:#FFF0F0;stroke:#B86868}.teal{fill:#EBFAF8;stroke:#2D948C}.store{fill:#FFFAF2;stroke:#8C6F33}.connector{fill:none;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round}.http{stroke:#4F86C6;marker-end:url(#arrow-blue)}.db{stroke:#6E8F4F;marker-end:url(#arrow-green)}.event{stroke:#9B7D54;marker-end:url(#arrow-amber)}.observe{stroke:#B86868;stroke-dasharray:9 7;marker-end:url(#arrow-red)}.read{stroke:#2D948C;marker-end:url(#arrow-teal)}.legendBox{fill:#FFFFFF;stroke:#CAD6DF;stroke-width:1.8}.legend{font-size:14px}.footer{font-size:14px;fill:#60727D}
    </style>
    <marker id="arrow-blue" viewBox="0 0 10 10" markerWidth="14" markerHeight="14" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#4F86C6" stroke="#4F86C6" stroke-dasharray="none" style="stroke-dasharray:none"/></marker>
    <marker id="arrow-green" viewBox="0 0 10 10" markerWidth="14" markerHeight="14" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#6E8F4F" stroke="#6E8F4F" stroke-dasharray="none" style="stroke-dasharray:none"/></marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" markerWidth="14" markerHeight="14" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#9B7D54" stroke="#9B7D54" stroke-dasharray="none" style="stroke-dasharray:none"/></marker>
    <marker id="arrow-red" viewBox="0 0 10 10" markerWidth="14" markerHeight="14" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#B86868" stroke="#B86868" stroke-dasharray="none" style="stroke-dasharray:none"/></marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" markerWidth="14" markerHeight="14" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#2D948C" stroke="#2D948C" stroke-dasharray="none" style="stroke-dasharray:none"/></marker>
  </defs>
  <rect class="bg" width="1800" height="1260"/>
  <text class="title" x="900" y="62" text-anchor="middle">Order Lifecycle Fulfillment Architecture</text>
  <text class="subtitle" x="900" y="96" text-anchor="middle">PostgreSQL owns state and evidence; independent lifecycles cooperate through durable publications.</text>

  <rect class="layer" x="70" y="130" width="1660" height="190" rx="22"/>
  <text class="layerTitle" x="105" y="173">HTTP and test boundary</text>
  <g class="node" data-node="browser-console" filter="url(#shadow)"><rect class="card blue" x="145" y="215" width="340" height="72" rx="15"/><text class="cardTitle" x="315" y="246" text-anchor="middle">Browser console</text><text class="body" x="315" y="271" text-anchor="middle">commands + snapshot-first SSE</text></g>
  <g class="node" data-node="live-web-test-client" filter="url(#shadow)"><rect class="card blue" x="555" y="215" width="340" height="72" rx="15"/><text class="cardTitle" x="725" y="246" text-anchor="middle">Live WebTestClient</text><text class="body" x="725" y="271" text-anchor="middle">RANDOM_PORT + real transport</text></g>
  <g class="node" data-node="tomcat-mvc" filter="url(#shadow)"><rect class="card blue" x="965" y="205" width="690" height="92" rx="15"/><text class="cardTitle" x="1310" y="241" text-anchor="middle">Tomcat MVC on Java 25 virtual threads</text><text class="body" x="1310" y="268" text-anchor="middle">8,000 max connections; bounded request and SSE admission</text></g>

  <rect class="layer" x="70" y="370" width="1660" height="250" rx="22"/>
  <text class="layerTitle" x="105" y="413">Application boundary</text>
  <g class="node" data-node="idempotent-submission" filter="url(#shadow)"><rect class="card green" x="120" y="458" width="330" height="104" rx="15"/><text class="cardTitle" x="285" y="491" text-anchor="middle">Idempotent submission</text><text class="body" x="285" y="518" text-anchor="middle">key hash + payload fingerprint</text><text class="small" x="285" y="544" text-anchor="middle">replay / conflict / lease</text></g>
  <g class="node" data-node="order-command-service" filter="url(#shadow)"><rect class="card green" x="500" y="458" width="330" height="104" rx="15"/><text class="cardTitle" x="665" y="491" text-anchor="middle">OrderCommandService</text><text class="body" x="665" y="518" text-anchor="middle">submit / advance / cancel</text><text class="small" x="665" y="544" text-anchor="middle">transaction + policy checks</text></g>
  <g class="node" data-node="query-and-sse" filter="url(#shadow)"><rect class="card teal" x="880" y="458" width="330" height="104" rx="15"/><text class="cardTitle" x="1045" y="491" text-anchor="middle">Query + SSE services</text><text class="body" x="1045" y="518" text-anchor="middle">snapshot, revision, audit cursor</text><text class="small" x="1045" y="544" text-anchor="middle">slot release on every exit</text></g>
  <g class="node" data-node="deterministic-provider" filter="url(#shadow)"><rect class="card amber" x="1260" y="458" width="330" height="104" rx="15"/><text class="cardTitle" x="1425" y="491" text-anchor="middle">Deterministic provider</text><text class="body" x="1425" y="518" text-anchor="middle">success / delay / duplicate</text><text class="small" x="1425" y="544" text-anchor="middle">out-of-order + conflict evidence</text></g>

  <rect class="layer" x="70" y="670" width="1660" height="250" rx="22"/>
  <text class="layerTitle" x="105" y="713">Independent lifecycle and publication boundary</text>
  <g class="node" data-node="independent-lifecycles" filter="url(#shadow)"><rect class="card amber" x="120" y="755" width="900" height="105" rx="15"/><text class="cardTitle" x="570" y="788" text-anchor="middle">Independent durable state machines</text><text class="body" x="570" y="816" text-anchor="middle">Order / Payment / Inventory / Fulfillment group / Cancellation / Refund</text><text class="small" x="570" y="842" text-anchor="middle">each owns status, revision, reason, transition policy, and audit evidence</text></g>
  <g class="node" data-node="modulith-publications" filter="url(#shadow)"><rect class="card amber" x="1070" y="755" width="540" height="105" rx="15"/><text class="cardTitle" x="1340" y="788" text-anchor="middle">Spring Modulith publications</text><text class="body" x="1340" y="816" text-anchor="middle">after-commit listeners + bounded replay</text><text class="small" x="1340" y="842" text-anchor="middle">failed rows remain operationally visible</text></g>

  <rect class="layer" x="70" y="970" width="1660" height="130" rx="22"/>
  <text class="layerTitle" x="105" y="1012">Authoritative persistence</text>
  <g class="node" data-node="postgresql" filter="url(#shadow)"><rect class="card store" x="210" y="1028" width="1380" height="48" rx="14"/><text class="cardTitle" x="900" y="1060" text-anchor="middle">PostgreSQL via bluetape4k Exposed repositories · aggregates · idempotency · provider inbox · audit · publications</text></g>

  <g class="node" data-node="operational-observability" filter="url(#shadow)"><rect class="card red" x="360" y="1124" width="1080" height="62" rx="15"/><text class="cardTitle" x="900" y="1152" text-anchor="middle">Operational observability</text><text class="body" x="900" y="1175" text-anchor="middle">bluetape4k-logging decision logs + Micrometer metrics; no raw idempotency key or request payload</text></g>

  <g class="edge" data-edge="browser-console-&gt;tomcat-mvc" data-label="browser HTTP and SSE"><path data-connector="browser-console-to-tomcat-mvc" class="connector http" d="M 315 287 L 315 310 Q 315 330 335 330 L 1070 330 Q 1090 330 1090 310 L 1090 297"/></g>
  <g class="edge" data-edge="live-web-test-client-&gt;tomcat-mvc" data-label="live integration transport"><path data-connector="live-web-test-client-to-tomcat-mvc" class="connector http" d="M 895 250 L 965 250"/></g>
  <g class="edge" data-edge="tomcat-mvc-&gt;idempotent-submission" data-label="POST order"><path data-connector="tomcat-mvc-to-idempotent-submission" class="connector http" d="M 1120 297 L 1120 325 Q 1120 345 1100 345 L 305 345 Q 285 345 285 365 L 285 458"/></g>
  <g class="edge" data-edge="tomcat-mvc-&gt;query-and-sse" data-label="GET snapshot and events"><path data-connector="tomcat-mvc-to-query-and-sse" class="connector read" d="M 1180 297 L 1180 458"/></g>
  <g class="edge" data-edge="idempotent-submission-&gt;order-command-service" data-label="new owner only"><path data-connector="idempotent-submission-to-order-command-service" class="connector db" d="M 450 510 L 500 510"/></g>
  <g class="edge" data-edge="order-command-service-&gt;independent-lifecycles" data-label="enforce transitions"><path data-connector="order-command-service-to-independent-lifecycles" class="connector event" d="M 665 562 L 665 755"/></g>
  <g class="edge" data-edge="deterministic-provider-&gt;modulith-publications" data-label="provider events"><path data-connector="deterministic-provider-to-modulith-publications" class="connector event" d="M 1425 562 L 1425 755"/></g>
  <g class="edge" data-edge="independent-lifecycles-&gt;modulith-publications" data-label="durable application events"><path data-connector="independent-lifecycles-to-modulith-publications" class="connector event" d="M 1020 807 L 1070 807"/></g>
  <g class="edge" data-edge="independent-lifecycles-&gt;postgresql" data-label="repository writes"><path data-connector="independent-lifecycles-to-postgresql" class="connector db" d="M 570 860 L 570 1028"/></g>
  <g class="edge" data-edge="modulith-publications-&gt;postgresql" data-label="publication rows"><path data-connector="modulith-publications-to-postgresql" class="connector db" d="M 1340 860 L 1340 1028"/></g>
  <g class="edge" data-edge="postgresql-&gt;operational-observability" data-label="operational evidence"><path data-connector="postgresql-to-operational-observability" class="connector observe" d="M 900 1076 L 900 1124"/></g>

  <rect class="legendBox" x="210" y="1206" width="1380" height="38" rx="14"/>
  <text class="legend" x="250" y="1231">Blue: HTTP</text><text class="legend" x="480" y="1231">Green: PostgreSQL write</text><text class="legend" x="790" y="1231">Amber: durable event</text><text class="legend" x="1080" y="1231">Teal: read / SSE</text><text class="legend" x="1330" y="1231">Red: logs / metrics</text>
</svg>
