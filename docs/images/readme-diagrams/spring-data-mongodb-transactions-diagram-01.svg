<svg xmlns="http://www.w3.org/2000/svg" width="960" height="460" viewBox="0 0 960 460" role="img" aria-label="MongoDB Transactions Architecture">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#1f2937" flood-opacity="0.10"/></filter>
  <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M1,1 L8,4.5 L1,8 Z" fill="#758297"/></marker>
  <style>
    .canvas{fill:#f7f9fc}.frame{fill:#fff;stroke:#d8e0ea;stroke-width:1.5}
    .title{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:38px;font-weight:400;fill:#102033}
    .subtitle{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:14px;font-weight:400;fill:#536273}
    .smallLabel{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:21px;font-weight:400;fill:#102033}
    .small{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#536273}
    .card{stroke-width:2.1;filter:url(#shadow)}
    .line{stroke:#758297;stroke-width:2.1;fill:none;marker-end:url(#arrow)}
  </style>
</defs>
<rect class="canvas" width="960" height="460"/>
<rect class="frame" x="24" y="20" width="912" height="416" rx="16"/>
<text class="title" x="48" y="66">MongoDB Transactions Architecture</text>
<text class="subtitle" x="48" y="90">@Transactional suspend → ReactiveMongoTransactionManager → MongoDB ReplicaSet</text>

<!-- Row 1: Service layer - 3 variants -->
<rect class="card" x="50" y="116" width="210" height="60" rx="8" fill="#E8F3FF" stroke="#5B8DEF"/>
<text class="smallLabel" x="155" y="144" text-anchor="middle">TransitionService</text>
<text class="small" x="155" y="163" text-anchor="middle">Imperative (blocking)</text>

<rect class="card" x="375" y="116" width="210" height="60" rx="8" fill="#EAF7EF" stroke="#58A978"/>
<text class="smallLabel" x="480" y="144" text-anchor="middle">Coroutine Managed</text>
<text class="small" x="480" y="163" text-anchor="middle">@Transactional suspend</text>

<rect class="card" x="700" y="116" width="210" height="60" rx="8" fill="#FFF3D9" stroke="#D6A441"/>
<text class="smallLabel" x="805" y="144" text-anchor="middle">Reactive Managed</text>
<text class="small" x="805" y="163" text-anchor="middle">@Transactional Mono/Flux</text>

<!-- Row 2: Repository layer -->
<rect class="card" x="50" y="240" width="200" height="56" rx="8" fill="#FDECEF" stroke="#DC6B82"/>
<text class="smallLabel" x="150" y="268" text-anchor="middle">ProcessRepository</text>
<text class="small" x="150" y="287" text-anchor="middle">CrudRepository</text>

<rect class="card" x="375" y="240" width="200" height="56" rx="8" fill="#F1ECFF" stroke="#8A72D6"/>
<text class="smallLabel" x="475" y="268" text-anchor="middle">CoroutineProcessRepo</text>
<text class="small" x="475" y="287" text-anchor="middle">CoroutineCrudRepository</text>

<rect class="card" x="700" y="240" width="200" height="56" rx="8" fill="#E9F7F6" stroke="#45A7A1"/>
<text class="smallLabel" x="800" y="268" text-anchor="middle">ReactiveProcessRepo</text>
<text class="small" x="800" y="287" text-anchor="middle">ReactiveCrudRepository</text>

<!-- Row 3: Transaction Manager + MongoDB -->
<rect class="card" x="180" y="358" width="260" height="56" rx="8" fill="#FFF3D9" stroke="#D6A441"/>
<text class="smallLabel" x="310" y="386" text-anchor="middle">ReactiveMongoTxManager</text>
<text class="small" x="310" y="402" text-anchor="middle">begin / commit / rollback</text>

<rect class="card" x="520" y="358" width="240" height="56" rx="8" fill="#E9F7F6" stroke="#45A7A1"/>
<text class="smallLabel" x="640" y="386" text-anchor="middle">MongoDB ReplicaSet</text>
<text class="small" x="640" y="402" text-anchor="middle">Multi-document transactions</text>

<!-- Arrows: Service -> Repo -->
<path class="line" d="M155 176 L155 240"/>
<path class="line" d="M480 176 L480 240"/>
<path class="line" d="M805 176 L805 240"/>
<!-- Repos -> TxManager -->
<path class="line" d="M150 296 L150 340 L280 340 L280 358"/>
<path class="line" d="M475 296 L475 340 L310 340 L310 358"/>
<path class="line" d="M800 296 L800 340 L620 340 L620 358"/>
<!-- TxManager -> MongoDB -->
<path class="line" d="M440 386 L520 386"/>
</svg>
