<g transform="translate(84,180)">
  <rect class="card" x="0" y="0" width="380" height="217" rx="5" fill="#E8F3FF" stroke="#5B8DEF"/>
  <line class="compartment" x1="0" y1="78" x2="380" y2="78" stroke="#5B8DEF"/>
  <text class="small" x="190" y="26" text-anchor="middle"></text>
  <text class="label" x="190" y="61" text-anchor="middle">TransitionService</text>
  <text class="mono" x="18" y="108">+run(id) void</text>
<text class="mono" x="18" y="129">-lookup(id) Process</text>
<text class="mono" x="18" y="150">-start(process) Process</text>
<text class="mono" x="18" y="171">-verify(process) Process</text>
<text class="mono" x="18" y="192">-finish(process) Process</text>
</g>
<g transform="translate(534,180)">
