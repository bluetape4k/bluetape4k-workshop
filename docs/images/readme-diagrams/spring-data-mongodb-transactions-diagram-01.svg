  <text class="label" x="190" y="56.5" text-anchor="middle">Coroutine Managed</text>
<text class="label" x="190" y="81.5" text-anchor="middle">Transition Service</text>
  <text class="mono" x="18" y="124">+run(id) Int</text>
</g>
<g transform="translate(534,523)">
  <rect class="card" x="0" y="0" width="380" height="175" rx="5" fill="#FDECEF" stroke="#DC6B82"/>
  <line class="compartment" x1="0" y1="78" x2="380" y2="78" stroke="#DC6B82"/>
  <text class="small" x="190" y="26" text-anchor="middle"></text>
  <text class="label" x="190" y="61" text-anchor="middle">Process</text>
  <text class="mono" x="18" y="108">+Int id</text>
<text class="mono" x="18" y="129">+State state</text>
<text class="mono" x="18" y="150">+Int transitionCount</text>
</g>
<g transform="translate(84,824)">
  <rect class="card" x="0" y="0" width="380" height="196" rx="5" fill="#E9F7F6" stroke="#45A7A1"/>
  <line class="compartment" x1="0" y1="78" x2="380" y2="78" stroke="#45A7A1"/>
  <text class="small" x="190" y="26" text-anchor="middle">«enumeration»</text>
  <text class="label" x="190" y="61" text-anchor="middle">State</text>
  <text class="mono" x="18" y="108">UNKNOWN</text>
<text class="mono" x="18" y="129">CREATED</text>
<text class="mono" x="18" y="150">ACTIVE</text>
<text class="mono" x="18" y="171">DONE</text>
</g>
<g transform="translate(534,824)">
  <rect class="card" x="0" y="0" width="380" height="149" rx="5" fill="#F1ECFF" stroke="#8A72D6"/>
