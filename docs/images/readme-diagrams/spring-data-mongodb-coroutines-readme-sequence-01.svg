<path class="call" d="M394 596 L666 596"/>
<rect x="622" y="620" width="360" height="24" rx="6" fill="#ffffff" opacity="0.92" stroke="#dbe3ee"/>
<text class="message" x="802" y="633" text-anchor="middle" dominant-baseline="middle">9. query (tailable / regular)</text>
<path class="call" d="M666 650 L938 650"/>
<rect x="622" y="674" width="360" height="24" rx="6" fill="#ffffff" opacity="0.92" stroke="#dbe3ee"/>
