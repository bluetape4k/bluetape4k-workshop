<path class="call" d="M394 272 L666 272"/>
<rect x="622" y="296" width="360" height="24" rx="6" fill="#ffffff" opacity="0.92" stroke="#dbe3ee"/>
<text class="message" x="802" y="309" text-anchor="middle" dominant-baseline="middle">3. query</text>
<path class="call" d="M666 326 L938 326"/>
<rect x="622" y="350" width="360" height="24" rx="6" fill="#ffffff" opacity="0.92" stroke="#dbe3ee"/>
<text class="message" x="802" y="363" text-anchor="middle" dominant-baseline="middle">4. document</text>
<path class="return" d="M938 380 L666 380"/>
<rect x="350" y="404" width="360" height="24" rx="6" fill="#ffffff" opacity="0.92" stroke="#dbe3ee"/>
<text class="message" x="530" y="417" text-anchor="middle" dominant-baseline="middle">5. Mono&lt;Person&gt;</text>
<path class="return" d="M666 434 L394 434"/>
<rect x="78" y="458" width="360" height="24" rx="6" fill="#ffffff" opacity="0.92" stroke="#dbe3ee"/>
