<text class="message" x="258" y="532" text-anchor="middle" dominant-baseline="middle">Flow&lt;Person&gt;</text>
<path class="call" d="M122 542 L394 542"/>
<rect x="350" y="566" width="360" height="24" rx="6" fill="#ffffff" opacity="0.92" stroke="#dbe3ee"/>
