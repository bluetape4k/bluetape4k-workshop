<path class="call" d="M394 300 L666 300"/>
<rect x="622" y="340" width="360" height="26" rx="6" fill="#ffffff" opacity="0.95" stroke="#dbe3ee"/>
<text class="message" x="802" y="353" text-anchor="middle" dominant-baseline="middle">3. query</text>
<path class="call" d="M666 382 L938 382"/>
<rect x="622" y="422" width="360" height="26" rx="6" fill="#ffffff" opacity="0.95" stroke="#dbe3ee"/>
<text class="message" x="802" y="435" text-anchor="middle" dominant-baseline="middle">4. document</text>
<path class="return" d="M938 464 L666 464"/>
<rect x="350" y="504" width="360" height="26" rx="6" fill="#ffffff" opacity="0.95" stroke="#dbe3ee"/>
<text class="message" x="530" y="517" text-anchor="middle" dominant-baseline="middle">5. Mono&lt;Person&gt;</text>
<path class="return" d="M666 546 L394 546"/>
<rect x="78" y="586" width="360" height="26" rx="6" fill="#ffffff" opacity="0.95" stroke="#dbe3ee"/>
<text class="message" x="258" y="599" text-anchor="middle" dominant-baseline="middle">6. Person? (awaitSingleOrNull - suspend)</text>
<path class="return" d="M394 628 L122 628"/>
<rect x="78" y="654" width="360" height="40" rx="6" fill="#ffffff" opacity="0.95" stroke="#dbe3ee"/>
<text class="message" x="258" y="667" text-anchor="middle" dominant-baseline="middle">7. findAllByFirstname(name):</text>
<text class="message" x="258" y="681" text-anchor="middle" dominant-baseline="middle">Flow&lt;Person&gt;</text>
<path class="call" d="M122 710 L394 710"/>
<rect x="350" y="750" width="360" height="26" rx="6" fill="#ffffff" opacity="0.95" stroke="#dbe3ee"/>
<text class="message" x="530" y="763" text-anchor="middle" dominant-baseline="middle">8. Flux publisher (find)</text>
<path class="call" d="M394 792 L666 792"/>
<rect x="622" y="832" width="360" height="26" rx="6" fill="#ffffff" opacity="0.95" stroke="#dbe3ee"/>
<text class="message" x="802" y="845" text-anchor="middle" dominant-baseline="middle">9. query (tailable / regular)</text>
<path class="call" d="M666 874 L938 874"/>
<rect x="622" y="914" width="360" height="26" rx="6" fill="#ffffff" opacity="0.95" stroke="#dbe3ee"/>
<text class="message" x="802" y="927" text-anchor="middle" dominant-baseline="middle">10. documents (backpressure)</text>
<path class="return" d="M938 956 L666 956"/>
<rect x="350" y="996" width="360" height="26" rx="6" fill="#ffffff" opacity="0.95" stroke="#dbe3ee"/>
<text class="message" x="530" y="1009" text-anchor="middle" dominant-baseline="middle">11. Flux&lt;Person&gt;</text>
<path class="return" d="M666 1038 L394 1038"/>
<rect x="78" y="1064" width="360" height="40" rx="6" fill="#ffffff" opacity="0.95" stroke="#dbe3ee"/>
<text class="message" x="258" y="1077" text-anchor="middle" dominant-baseline="middle">12. Flow&lt;Person&gt; (asFlow -</text>
<text class="message" x="258" y="1091" text-anchor="middle" dominant-baseline="middle">backpressure-aware)</text>
<path class="return" d="M394 1120 L122 1120"/>
<rect x="78" y="1132" width="88" height="54" rx="6" fill="#ffffff" opacity="0.95" stroke="#dbe3ee"/>
<text class="message" x="122" y="1145" text-anchor="middle" dominant-baseline="middle">13. flow.toList()</text>
<text class="message" x="122" y="1159" text-anchor="middle" dominant-baseline="middle">- collected under</text>
<text class="message" x="122" y="1173" text-anchor="middle" dominant-baseline="middle">coroutine scope</text>
<path class="call" d="M122 1202 L122 1202"/>
</svg>
