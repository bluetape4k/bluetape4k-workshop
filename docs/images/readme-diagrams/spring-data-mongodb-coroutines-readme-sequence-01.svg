<path class="return" d="M938 704 L666 704"/>
<rect x="350" y="728" width="360" height="24" rx="6" fill="#ffffff" opacity="0.92" stroke="#dbe3ee"/>
<text class="message" x="530" y="741" text-anchor="middle" dominant-baseline="middle">11. Flux&lt;Person&gt;</text>
<path class="return" d="M666 758 L394 758"/>
<rect x="78" y="782" width="360" height="24" rx="6" fill="#ffffff" opacity="0.92" stroke="#dbe3ee"/>
<text class="message" x="258" y="788" text-anchor="middle" dominant-baseline="middle">12. Flow&lt;Person&gt; (asFlow -</text>
<text class="message" x="258" y="802" text-anchor="middle" dominant-baseline="middle">backpressure-aware)</text>
<path class="return" d="M394 812 L122 812"/>
<rect x="78" y="836" width="88" height="24" rx="6" fill="#ffffff" opacity="0.92" stroke="#dbe3ee"/>
<text class="message" x="122" y="835" text-anchor="middle" dominant-baseline="middle">13. flow.toList()</text>
<text class="message" x="122" y="849" text-anchor="middle" dominant-baseline="middle">- collected under</text>
<text class="message" x="122" y="863" text-anchor="middle" dominant-baseline="middle">coroutine scope</text>
<path class="call" d="M122 866 L122 866"/>
</svg>
