<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1620" height="820" viewBox="0 0 1620 820" role="img" aria-label="ZooKeeper leader election architecture diagram">
  <defs>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="124%"><feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#64748B" flood-opacity="0.16"/></filter>
    <marker id="arrowBlue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 12 6 L 0 12 Z" fill="#2563EB" stroke-dasharray="none" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="arrowGreen" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 12 6 L 0 12 Z" fill="#16A34A" stroke-dasharray="none" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="arrowAmber" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 12 6 L 0 12 Z" fill="#C47A12" stroke-dasharray="none" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="arrowPurple" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 12 6 L 0 12 Z" fill="#7C3AED" stroke-dasharray="none" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="arrowCyan" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 12 6 L 0 12 Z" fill="#0891B2" stroke-dasharray="none" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <style>
      .canvas{fill:#F8FAFC}.frame{fill:#FFFFFF;stroke:#D6E0E8;stroke-width:1.4}.layer{fill:#F8FAFC;stroke:#CBD5E1;stroke-width:1.4}.title{font-family:"Architects Daughter";font-size:36px;fill:#102033}.subtitle{font-family:"Comic Mono";font-size:14px;fill:#51606F}.layerLabel{font-family:"Architects Daughter";font-size:23px;fill:#263548}.cardTitle{font-family:"Architects Daughter";font-size:27px;fill:#102033}.cardText{font-family:"Comic Mono";font-size:14px;fill:#415166}.line{fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.zkText{font-family:"Architects Daughter";font-size:26px;fill:#102033}
    </style>
  </defs>
  <rect class="canvas" width="1620" height="820"/>
  <rect class="frame" x="25.92" y="24" width="1568.16" height="772" rx="24"/>  <text class="title" x="810" y="66" text-anchor="middle">ZooKeeper leader election services</text>
  <text class="subtitle" x="810" y="94" text-anchor="middle">Spring services use blocking, suspend, single-leader, and group-leader electors over one shared CuratorFramework client.</text>

  <rect class="layer" x="69.12" y="132" width="367.2" height="560" rx="18"/>
  <text class="layerLabel" x="99.36" y="168">Scheduled services</text>
  <g filter="url(#shadow)">
    <rect x="114.48" y="204" width="276.48" height="92" rx="16" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.836"/>
    <text class="cardTitle" x="252.72" y="240" text-anchor="middle">Blocking Single</text>
    <text class="cardText" x="252.72" y="268" text-anchor="middle">InterProcessMutex path</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="114.48" y="330" width="276.48" height="92" rx="16" fill="#ECFDF5" stroke="#16A34A" stroke-width="1.836"/>
    <text class="cardTitle" x="252.72" y="366" text-anchor="middle">Suspend Single</text>
    <text class="cardText" x="252.72" y="394" text-anchor="middle">coroutine runIfLeader</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="114.48" y="456" width="276.48" height="92" rx="16" fill="#FFF7ED" stroke="#D97706" stroke-width="1.836"/>
    <text class="cardTitle" x="252.72" y="492" text-anchor="middle">Blocking Group</text>
    <text class="cardText" x="252.72" y="520" text-anchor="middle">up to groupMaxLeaders</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="114.48" y="582" width="276.48" height="92" rx="16" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.836"/>
    <text class="cardTitle" x="252.72" y="618" text-anchor="middle">Suspend Group</text>
    <text class="cardText" x="252.72" y="646" text-anchor="middle">coroutine slot holders</text>
  </g>

  <rect class="layer" x="494.64" y="132" width="373.68" height="560" rx="18"/>
  <text class="layerLabel" x="524.88" y="168">bluetape4k electors</text>
  <g filter="url(#shadow)">
    <rect x="544.32" y="204" width="274.32" height="92" rx="16" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.836"/>
    <text class="cardTitle" x="681.48" y="240" text-anchor="middle">ZooKeeperLeader</text>
    <text class="cardText" x="681.48" y="268" text-anchor="middle">basePath /single</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="544.32" y="330" width="274.32" height="92" rx="16" fill="#ECFDF5" stroke="#16A34A" stroke-width="1.836"/>
    <text class="cardTitle" x="681.48" y="366" text-anchor="middle">SuspendLeader</text>
    <text class="cardText" x="681.48" y="394" text-anchor="middle">basePath /single-suspend</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="544.32" y="456" width="274.32" height="92" rx="16" fill="#FFF7ED" stroke="#D97706" stroke-width="1.836"/>
    <text class="cardTitle" x="681.48" y="492" text-anchor="middle">LeaderGroup</text>
    <text class="cardText" x="681.48" y="520" text-anchor="middle">basePath /group</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="544.32" y="582" width="274.32" height="92" rx="16" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.836"/>
    <text class="cardTitle" x="681.48" y="618" text-anchor="middle">SuspendGroup</text>
    <text class="cardText" x="681.48" y="646" text-anchor="middle">basePath /group-suspend</text>
  </g>

  <rect class="layer" x="926.64" y="132" width="282.96" height="560" rx="18"/>
  <text class="layerLabel" x="956.88" y="168">Curator client</text>
  <g filter="url(#shadow)">
    <rect x="954.72" y="300" width="228.96" height="170" rx="16" fill="#F8FAFC" stroke="#64748B" stroke-width="1.836"/>
    <text class="cardTitle" x="1069.2" y="338" text-anchor="middle">Curator</text>
    <text class="cardTitle" x="1069.2" y="366" text-anchor="middle">Framework</text>
    <text class="cardText" x="1069.2" y="394" text-anchor="middle">connection listener</text>
    <text class="cardText" x="1069.2" y="418" text-anchor="middle">blockUntilConnected</text>
    <text class="cardText" x="1069.2" y="442" text-anchor="middle">close on timeout</text>
  </g>

  <rect class="layer" x="1267.92" y="132" width="282.96" height="560" rx="18"/>  <text class="layerLabel" x="1298.16" y="168">ZooKeeper ensemble</text>
  <g filter="url(#shadow)">
    <rect x="1315.44" y="286" width="187.92" height="198" rx="16" fill="#ECFEFF" stroke="#0891B2" stroke-width="1.944"/>
    <g transform="translate(1365.12 318)">
      <circle cx="44.28" cy="16" r="15" fill="#38BDF8" stroke="#0369A1" stroke-width="2"/>
      <circle cx="17.28" cy="62" r="15" fill="#7DD3FC" stroke="#0369A1" stroke-width="2"/>
      <circle cx="71.28" cy="62" r="15" fill="#7DD3FC" stroke="#0369A1" stroke-width="2"/>
      <path d="M 36 28 L 22 50" stroke="#0369A1" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M 46 28 L 60 50" stroke="#0369A1" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    </g>  <text class="zkText" x="1409.4" y="424" text-anchor="middle">ZooKeeper</text>
    <text class="cardText" x="1409.4" y="452" text-anchor="middle">ephemeral znodes</text>
    <text class="cardText" x="1409.4" y="476" text-anchor="middle">session-bound</text>
  </g>

  <path class="line" d="M 390.96 250 L 544.32 250" stroke="#2563EB" marker-end="url(#arrowBlue)" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="line" d="M 390.96 376 L 544.32 376" stroke="#16A34A" marker-end="url(#arrowGreen)" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="line" d="M 390.96 502 L 544.32 502" stroke="#C47A12" marker-end="url(#arrowAmber)" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="line" d="M 390.96 628 L 544.32 628" stroke="#7C3AED" marker-end="url(#arrowPurple)" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="line" d="M 818.64 250 L 885.6 250 Q 896.4 250 896.4 260 L 896.4 342 Q 896.4 352 907.2 352 L 954.72 352" stroke="#2563EB" marker-end="url(#arrowBlue)" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="line" d="M 818.64 376 L 954.72 376" stroke="#16A34A" marker-end="url(#arrowGreen)" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="line" d="M 818.64 502 L 885.6 502 Q 896.4 502 896.4 492 L 896.4 428 Q 896.4 418 907.2 418 L 954.72 418" stroke="#C47A12" marker-end="url(#arrowAmber)" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="line" d="M 818.64 628 L 885.6 628 Q 896.4 628 896.4 618 L 896.4 454 Q 896.4 444 907.2 444 L 954.72 444" stroke="#7C3AED" marker-end="url(#arrowPurple)" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="line" d="M 1183.68 385 L 1315.44 385" stroke="#0891B2" marker-end="url(#arrowCyan)" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
