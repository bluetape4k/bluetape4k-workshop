<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="820" viewBox="0 0 1500 820" role="img" aria-label="ZooKeeper leader election architecture diagram">
  <defs>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="124%"><feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#64748B" flood-opacity="0.16"/></filter>
    <marker id="arrowBlue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 12 6 L 0 12 Z" fill="#2563EB" stroke-dasharray="none"/></marker>
    <marker id="arrowGreen" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 12 6 L 0 12 Z" fill="#16A34A" stroke-dasharray="none"/></marker>
    <marker id="arrowAmber" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 12 6 L 0 12 Z" fill="#C47A12" stroke-dasharray="none"/></marker>
    <marker id="arrowPurple" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 12 6 L 0 12 Z" fill="#7C3AED" stroke-dasharray="none"/></marker>
    <marker id="arrowCyan" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 12 6 L 0 12 Z" fill="#0891B2" stroke-dasharray="none"/></marker>
    <style>
      .canvas{fill:#F8FAFC}.frame{fill:#FFFFFF;stroke:#D6E0E8;stroke-width:1.4}.layer{fill:#F8FAFC;stroke:#CBD5E1;stroke-width:1.4}.title{font-family:"Architects Daughter";font-size:36px;fill:#102033}.subtitle{font-family:"Comic Mono";font-size:14px;fill:#51606F}.layerLabel{font-family:"Architects Daughter";font-size:23px;fill:#263548}.cardTitle{font-family:"Architects Daughter";font-size:27px;fill:#102033}.cardText{font-family:"Comic Mono";font-size:14px;fill:#415166}.line{fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.zkText{font-family:"Architects Daughter";font-size:26px;fill:#102033}
    </style>
  </defs>
  <rect class="canvas" width="1500" height="820"/>
  <rect class="frame" x="24" y="24" width="1452" height="772" rx="24"/>  <text class="title" x="750" y="66" text-anchor="middle">ZooKeeper leader election services</text>
  <text class="subtitle" x="750" y="94" text-anchor="middle">Spring services use blocking, suspend, single-leader, and group-leader electors over one shared CuratorFramework client.</text>

  <rect class="layer" x="64" y="132" width="340" height="560" rx="18"/>
  <text class="layerLabel" x="92" y="168">Scheduled services</text>
  <g filter="url(#shadow)">
    <rect x="106" y="204" width="256" height="92" rx="16" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.7"/>
    <text class="cardTitle" x="234" y="240" text-anchor="middle">Blocking Single</text>
    <text class="cardText" x="234" y="268" text-anchor="middle">InterProcessMutex path</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="106" y="330" width="256" height="92" rx="16" fill="#ECFDF5" stroke="#16A34A" stroke-width="1.7"/>
    <text class="cardTitle" x="234" y="366" text-anchor="middle">Suspend Single</text>
    <text class="cardText" x="234" y="394" text-anchor="middle">coroutine runIfLeader</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="106" y="456" width="256" height="92" rx="16" fill="#FFF7ED" stroke="#D97706" stroke-width="1.7"/>
    <text class="cardTitle" x="234" y="492" text-anchor="middle">Blocking Group</text>
    <text class="cardText" x="234" y="520" text-anchor="middle">up to groupMaxLeaders</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="106" y="582" width="256" height="92" rx="16" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.7"/>
    <text class="cardTitle" x="234" y="618" text-anchor="middle">Suspend Group</text>
    <text class="cardText" x="234" y="646" text-anchor="middle">coroutine slot holders</text>
  </g>

  <rect class="layer" x="458" y="132" width="346" height="560" rx="18"/>
  <text class="layerLabel" x="486" y="168">bluetape4k electors</text>
  <g filter="url(#shadow)">
    <rect x="504" y="204" width="254" height="92" rx="16" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.7"/>
    <text class="cardTitle" x="631" y="240" text-anchor="middle">ZooKeeperLeader</text>
    <text class="cardText" x="631" y="268" text-anchor="middle">basePath /single</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="504" y="330" width="254" height="92" rx="16" fill="#ECFDF5" stroke="#16A34A" stroke-width="1.7"/>
    <text class="cardTitle" x="631" y="366" text-anchor="middle">SuspendLeader</text>
    <text class="cardText" x="631" y="394" text-anchor="middle">basePath /single-suspend</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="504" y="456" width="254" height="92" rx="16" fill="#FFF7ED" stroke="#D97706" stroke-width="1.7"/>
    <text class="cardTitle" x="631" y="492" text-anchor="middle">LeaderGroup</text>
    <text class="cardText" x="631" y="520" text-anchor="middle">basePath /group</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="504" y="582" width="254" height="92" rx="16" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.7"/>
    <text class="cardTitle" x="631" y="618" text-anchor="middle">SuspendGroup</text>
    <text class="cardText" x="631" y="646" text-anchor="middle">basePath /group-suspend</text>
  </g>

  <rect class="layer" x="858" y="132" width="262" height="560" rx="18"/>
  <text class="layerLabel" x="886" y="168">Curator client</text>
  <g filter="url(#shadow)">
    <rect x="884" y="300" width="212" height="170" rx="16" fill="#F8FAFC" stroke="#64748B" stroke-width="1.7"/>
    <text class="cardTitle" x="990" y="338" text-anchor="middle">Curator</text>
    <text class="cardTitle" x="990" y="366" text-anchor="middle">Framework</text>
    <text class="cardText" x="990" y="394" text-anchor="middle">connection listener</text>
    <text class="cardText" x="990" y="418" text-anchor="middle">blockUntilConnected</text>
    <text class="cardText" x="990" y="442" text-anchor="middle">close on timeout</text>
  </g>

  <rect class="layer" x="1174" y="132" width="262" height="560" rx="18"/>  <text class="layerLabel" x="1202" y="168">ZooKeeper ensemble</text>
  <g filter="url(#shadow)">
    <rect x="1218" y="286" width="174" height="198" rx="16" fill="#ECFEFF" stroke="#0891B2" stroke-width="1.8"/>
    <g transform="translate(1264 318)">
      <circle cx="41" cy="16" r="15" fill="#38BDF8" stroke="#0369A1" stroke-width="2"/>
      <circle cx="16" cy="62" r="15" fill="#7DD3FC" stroke="#0369A1" stroke-width="2"/>
      <circle cx="66" cy="62" r="15" fill="#7DD3FC" stroke="#0369A1" stroke-width="2"/>
      <path d="M 36 28 L 22 50" stroke="#0369A1" stroke-width="3" stroke-linecap="round"/>
      <path d="M 46 28 L 60 50" stroke="#0369A1" stroke-width="3" stroke-linecap="round"/>
    </g>  <text class="zkText" x="1305" y="424" text-anchor="middle">ZooKeeper</text>
    <text class="cardText" x="1305" y="452" text-anchor="middle">ephemeral znodes</text>
    <text class="cardText" x="1305" y="476" text-anchor="middle">session-bound</text>
  </g>

  <path class="line" d="M 362 250 L 504 250" stroke="#2563EB" marker-end="url(#arrowBlue)" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="line" d="M 362 376 L 504 376" stroke="#16A34A" marker-end="url(#arrowGreen)" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="line" d="M 362 502 L 504 502" stroke="#C47A12" marker-end="url(#arrowAmber)" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="line" d="M 362 628 L 504 628" stroke="#7C3AED" marker-end="url(#arrowPurple)" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="line" d="M 758 250 L 830 250 L 830 352 L 884 352" stroke="#2563EB" marker-end="url(#arrowBlue)" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="line" d="M 758 376 L 884 376" stroke="#16A34A" marker-end="url(#arrowGreen)" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="line" d="M 758 502 L 830 502 L 830 418 L 884 418" stroke="#C47A12" marker-end="url(#arrowAmber)" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="line" d="M 758 628 L 830 628 L 830 444 L 884 444" stroke="#7C3AED" marker-end="url(#arrowPurple)" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="line" d="M 1096 385 L 1218 385" stroke="#0891B2" marker-end="url(#arrowCyan)" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
