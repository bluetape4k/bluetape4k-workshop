<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1050" viewBox="0 0 1600 1050" role="img" aria-labelledby="title desc"><title id="title">Command Append Sequence</title><desc id="desc">Fenced idempotency and optimistic stream versioning make retries safe.</desc><defs><filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#64748B" flood-opacity="0.14"/></filter><marker id="seq-blue" viewBox="0 0 11.4286 11.4286" markerWidth="16" markerHeight="16" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse" data-role="sequence" data-tip-direction="positive-x"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#4F86C6" stroke="#4F86C6" stroke-dasharray="none"/></marker><marker id="seq-green" viewBox="0 0 11.4286 11.4286" markerWidth="16" markerHeight="16" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse" data-role="sequence" data-tip-direction="positive-x"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#6E8F4F" stroke="#6E8F4F" stroke-dasharray="none"/></marker><marker id="seq-amber" viewBox="0 0 11.4286 11.4286" markerWidth="16" markerHeight="16" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse" data-role="sequence" data-tip-direction="positive-x"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#9B7D54" stroke="#9B7D54" stroke-dasharray="none"/></marker><marker id="seq-red" viewBox="0 0 11.4286 11.4286" markerWidth="16" markerHeight="16" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse" data-role="sequence" data-tip-direction="positive-x"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#B86868" stroke="#B86868" stroke-dasharray="none"/></marker><marker id="seq-purple" viewBox="0 0 11.4286 11.4286" markerWidth="16" markerHeight="16" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse" data-role="sequence" data-tip-direction="positive-x"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#8065A8" stroke="#8065A8" stroke-dasharray="none"/></marker><marker id="seq-teal" viewBox="0 0 11.4286 11.4286" markerWidth="16" markerHeight="16" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse" data-role="sequence" data-tip-direction="positive-x"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#2D948C" stroke="#2D948C" stroke-dasharray="none"/></marker><style>
  .bg{fill:#F8FAFC}.frame{fill:#FFF;stroke:#CAD6DF;stroke-width:2}.alt{fill:none;stroke:#DFC69A;stroke-width:2}.zone{stroke-width:2}.blueZone{fill:#EFF6FF;stroke:#A8C7EA}.greenZone{fill:#F0F8F0;stroke:#B8D7AE}.purpleZone{fill:#F8F3FF;stroke:#D7C3EF}.amberZone{fill:#FFF7E8;stroke:#DFC69A}.title{font-family:"Architects Daughter";font-size:40px;fill:#263238}.subtitle,.body,.small,.msg,.footer{font-family:"Comic Mono";fill:#3E4C59}.subtitle{font-size:17px}.zoneTitle{font-family:"Architects Daughter";font-size:25px;fill:#344154}.cardTitle,.participant{font-family:"Architects Daughter";font-size:22px;fill:#16202A}.body{font-size:15px}.small{font-size:13px;fill:#5B6975}.footer{font-size:14px;fill:#60727D}.card{fill:#FFF;stroke:#9FB0BC;stroke-width:2}.blueCard{fill:#EFF6FF;stroke:#4F86C6}.greenCard{fill:#F0F8F0;stroke:#6E8F4F}.amberCard{fill:#FFF7E8;stroke:#9B7D54}.redCard{fill:#FFF0F0;stroke:#B86868}.purpleCard{fill:#F8F3FF;stroke:#8065A8}.edgePath{fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.blueEdge{stroke:#4F86C6;marker-end:url(#seq-blue)}.greenEdge{stroke:#6E8F4F;marker-end:url(#seq-green)}.amberEdge{stroke:#9B7D54;marker-end:url(#seq-amber)}.redEdge{stroke:#B86868;marker-end:url(#seq-red)}.purpleEdge{stroke:#8065A8;marker-end:url(#seq-purple)}.tealEdge{stroke:#2D948C;marker-end:url(#seq-teal)}.dashed{stroke-dasharray:9 7}.lifeline{stroke:#9AAAB1;stroke-width:2;stroke-dasharray:7 8}.activation{fill:#EAF6EF;stroke:#6F9278;stroke-width:1.5}.labelPill{fill:#FFF;stroke:#D7E0E4;stroke-width:1.5}.badge{font-family:"Comic Mono";font-size:13px;font-weight:700}.frameLabel{font-family:"Architects Daughter";font-size:18px;fill:#8B6A3E}
</style></defs><rect class="bg" width="1600" height="1050"/><rect class="frame" x="28" y="24" width="1544" height="1002" rx="22"/><text class="title" x="800" y="66" text-anchor="middle">Command Append Sequence</text><text class="subtitle" x="800" y="98" text-anchor="middle">Fenced idempotency and optimistic stream versioning make retries safe.</text><g filter="url(#shadow)"><rect class="card" x="45" y="140" width="250" height="76" rx="12"/><text class="participant" x="170" y="171" text-anchor="middle">Client</text><text class="small" x="170" y="196" text-anchor="middle">tenant caller</text></g><line class="lifeline" x1="170" y1="216" x2="170" y2="960"/><g filter="url(#shadow)"><rect class="card" x="360" y="140" width="250" height="76" rx="12"/><text class="participant" x="485" y="171" text-anchor="middle">Controller</text><text class="small" x="485" y="196" text-anchor="middle">security + receipt</text></g><line class="lifeline" x1="485" y1="216" x2="485" y2="960"/><g filter="url(#shadow)"><rect class="card" x="675" y="140" width="250" height="76" rx="12"/><text class="participant" x="800" y="171" text-anchor="middle">Command service</text><text class="small" x="800" y="196" text-anchor="middle">replay invariant</text></g><line class="lifeline" x1="800" y1="216" x2="800" y2="960"/><g filter="url(#shadow)"><rect class="card" x="990" y="140" width="250" height="76" rx="12"/><text class="participant" x="1115" y="171" text-anchor="middle">Event store</text><text class="small" x="1115" y="196" text-anchor="middle">Exposed repository</text></g><line class="lifeline" x1="1115" y1="216" x2="1115" y2="960"/><g filter="url(#shadow)"><rect class="card" x="1305" y="140" width="250" height="76" rx="12"/><text class="participant" x="1430" y="171" text-anchor="middle">PostgreSQL</text><text class="small" x="1430" y="196" text-anchor="middle">durable authority</text></g><line class="lifeline" x1="1430" y1="216" x2="1430" y2="960"/><rect class="activation" x="477" y="300" width="16" height="530" rx="6"/><rect class="activation" x="792" y="440" width="16" height="240" rx="6"/><rect class="activation" x="1107" y="500" width="16" height="270" rx="6"/><rect class="activation" x="1422" y="355" width="16" height="475" rx="6"/><rect class="labelPill" x="169" y="288" width="317" height="32" rx="16"/><circle cx="189" cy="304" r="12" fill="#FFF" stroke="#4F86C6" stroke-width="2"/><text class="badge num" x="189" y="309" text-anchor="middle">1</text><text class="msg" x="209" y="309">POST command + Idempotency-Key</text><g class="edge" data-edge="message-1" data-label="POST command + Idempotency-Key"><path data-connector="message-1" class="edgePath blueEdge" style="marker-end:none" d="M170 330 L485 330"/><polygon data-connector-head="message-1" data-arrow-direction="right" points="485,330 471,322 471,338" fill="#4F86C6" stroke="#4F86C6" stroke-dasharray="none" style="stroke-dasharray:none"/></g><rect class="labelPill" x="794.75" y="348" width="325.5" height="32" rx="16"/><circle cx="814.75" cy="364" r="12" fill="#FFF" stroke="#8065A8" stroke-width="2"/><text class="badge num" x="814.75" y="369" text-anchor="middle">2</text><text class="msg" x="834.75" y="369">insert owner or inspect receipt</text><g class="edge" data-edge="message-2" data-label="insert owner or inspect receipt"><path data-connector="message-2" class="edgePath purpleEdge" style="marker-end:none" d="M485 390 L1430 390"/><polygon data-connector-head="message-2" data-arrow-direction="right" points="1430,390 1416,382 1416,398" fill="#8065A8" stroke="#8065A8" stroke-dasharray="none" style="stroke-dasharray:none"/></g><rect class="labelPill" x="488.25" y="413" width="308.5" height="32" rx="16"/><circle cx="508.25" cy="429" r="12" fill="#FFF" stroke="#6E8F4F" stroke-width="2"/><text class="badge num" x="508.25" y="434" text-anchor="middle">3</text><text class="msg" x="528.25" y="434">replay aggregate and validate</text><g class="edge" data-edge="message-3" data-label="replay aggregate and validate"><path data-connector="message-3" class="edgePath greenEdge" style="marker-end:none" d="M485 455 L800 455"/><polygon data-connector-head="message-3" data-arrow-direction="right" points="800,455 786,447 786,463" fill="#6E8F4F" stroke="#6E8F4F" stroke-dasharray="none" style="stroke-dasharray:none"/></g><rect class="labelPill" x="799" y="478" width="317" height="32" rx="16"/><circle cx="819" cy="494" r="12" fill="#FFF" stroke="#6E8F4F" stroke-width="2"/><text class="badge num" x="819" y="499" text-anchor="middle">4</text><text class="msg" x="839" y="499">append expected stream version</text><g class="edge" data-edge="message-4" data-label="append expected stream version"><path data-connector="message-4" class="edgePath greenEdge" style="marker-end:none" d="M800 520 L1115 520"/><polygon data-connector-head="message-4" data-arrow-direction="right" points="1115,520 1101,512 1101,528" fill="#6E8F4F" stroke="#6E8F4F" stroke-dasharray="none" style="stroke-dasharray:none"/></g><rect class="labelPill" x="1118.25" y="543" width="308.5" height="32" rx="16"/><circle cx="1138.25" cy="559" r="12" fill="#FFF" stroke="#8065A8" stroke-width="2"/><text class="badge num" x="1138.25" y="564" text-anchor="middle">5</text><text class="msg" x="1158.25" y="564">lock head, hash, append event</text><g class="edge" data-edge="message-5" data-label="lock head, hash, append event"><path data-connector="message-5" class="edgePath purpleEdge" style="marker-end:none" d="M1115 585 L1430 585"/><polygon data-connector-head="message-5" data-arrow-direction="right" points="1430,585 1416,577 1416,593" fill="#8065A8" stroke="#8065A8" stroke-dasharray="none" style="stroke-dasharray:none"/></g><rect class="labelPill" x="1118.25" y="608" width="308.5" height="32" rx="16"/><circle cx="1138.25" cy="624" r="12" fill="#FFF" stroke="#2D948C" stroke-width="2"/><text class="badge num" x="1138.25" y="629" text-anchor="middle">6</text><text class="msg" x="1158.25" y="629">global position + new version</text><g class="edge" data-edge="message-6" data-label="global position + new version"><path data-connector="message-6" class="edgePath tealEdge" style="marker-end:none" d="M1430 650 L1115 650"/><polygon data-connector-head="message-6" data-arrow-direction="left" points="1115,650 1129,642 1129,658" fill="#2D948C" stroke="#2D948C" stroke-dasharray="none" style="stroke-dasharray:none"/></g><rect class="labelPill" x="799" y="678" width="317" height="32" rx="16"/><circle cx="819" cy="694" r="12" fill="#FFF" stroke="#8065A8" stroke-width="2"/><text class="badge num" x="819" y="699" text-anchor="middle">7</text><text class="msg" x="839" y="699">terminal response CAS by owner</text><g class="edge" data-edge="message-7" data-label="terminal response CAS by owner"><path data-connector="message-7" class="edgePath purpleEdge" style="marker-end:none" d="M485 720 L1430 720"/><polygon data-connector-head="message-7" data-arrow-direction="right" points="1430,720 1416,712 1416,728" fill="#8065A8" stroke="#8065A8" stroke-dasharray="none" style="stroke-dasharray:none"/></g><rect class="labelPill" x="186" y="753" width="283" height="32" rx="16"/><circle cx="206" cy="769" r="12" fill="#FFF" stroke="#2D948C" stroke-width="2"/><text class="badge num" x="206" y="774" text-anchor="middle">8</text><text class="msg" x="226" y="774">201 or exact stored replay</text><g class="edge" data-edge="message-8" data-label="201 or exact stored replay"><path data-connector="message-8" class="edgePath tealEdge" style="marker-end:none" d="M485 795 L170 795"/><polygon data-connector-head="message-8" data-arrow-direction="left" points="170,795 184,787 184,803" fill="#2D948C" stroke="#2D948C" stroke-dasharray="none" style="stroke-dasharray:none"/></g><rect class="alt" x="360" y="850" width="1080" height="72" rx="14"/><text class="frameLabel" x="385" y="878">alt conflict</text><text class="small" x="385" y="906">same key + different fingerprint -> 409; stale receipt owner cannot commit a terminal response.</text><text class="footer" x="800" y="990" text-anchor="middle">The receipt and domain append share the intended transaction boundary; retries never invent a second fact.</text></svg>