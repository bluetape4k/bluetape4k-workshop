<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1380" height="860" viewBox="0 0 1380 860" role="img" aria-label="Okio examples architecture diagram">
  <defs>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="124%"><feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#64748B" flood-opacity="0.18"/></filter>
    <marker id="arrowBlue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 12 6 L 0 12 Z" fill="#2563EB"/></marker>
    <marker id="arrowGreen" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 12 6 L 0 12 Z" fill="#16A34A"/></marker>
    <marker id="arrowAmber" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 12 6 L 0 12 Z" fill="#C47A12"/></marker>
    <marker id="arrowRose" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 12 6 L 0 12 Z" fill="#D14F6B"/></marker>
    <style>
      .canvas { fill: #F8FAFC; }
      .frame { fill: #FFFFFF; stroke: #D6E0E8; stroke-width: 1.4; }
      .title { font-family: "Architects Daughter"; font-size: 34px; fill: #102033; }
      .subtitle { font-family: "Comic Mono"; font-size: 14px; fill: #51606F; }
      .layerTitle { font-family: "Architects Daughter"; font-size: 22px; fill: #102033; }
      .cardTitle { font-family: "Architects Daughter"; font-size: 23px; fill: #102033; }
      .cardText { font-family: "Comic Mono"; font-size: 14px; fill: #415166; }
      .line { fill: none; stroke-width: 3.2; stroke-linecap: round; stroke-linejoin: round; }
    </style>
    <g id="fileIcon">
      <path d="M 8 4 H 30 L 42 16 V 44 H 8 Z" fill="#E0F2FE" stroke="#2563EB" stroke-width="2"/>
      <path d="M 30 4 V 16 H 42" fill="none" stroke="#2563EB" stroke-width="2"/>
      <path d="M 16 26 H 34 M 16 34 H 30" stroke="#2563EB" stroke-width="2" stroke-linecap="round"/>
    </g>
    <g id="socketIcon">
      <rect x="6" y="12" width="36" height="24" rx="8" fill="#DCFCE7" stroke="#16A34A" stroke-width="2"/>
      <circle cx="18" cy="24" r="3" fill="#16A34A"/>
      <circle cx="30" cy="24" r="3" fill="#16A34A"/>
    </g>
  </defs>
  <rect class="canvas" width="1380" height="860"/>
  <rect class="frame" x="18" y="18" width="1344" height="824" rx="24"/>
  <text class="title" x="690" y="58" text-anchor="middle">Okio examples</text>
  <text class="subtitle" x="690" y="84" text-anchor="middle">Okio Source and Sink wrappers for files, codecs, ciphers, compression, pipes, and coroutine interop</text>

  <rect x="54" y="116" width="1272" height="132" rx="20" fill="#EAF3FF" stroke="#9DB9D8" stroke-width="1.5"/>
  <text class="layerTitle" x="88" y="150">Okio core contracts</text>
  <g filter="url(#shadow)">
    <rect x="236" y="148" width="230" height="68" rx="12" fill="#FFFFFF" stroke="#8EA9C2" stroke-width="1.5"/>
    <text class="cardTitle" x="351" y="176" text-anchor="middle">Buffer</text>
    <text class="cardText" x="351" y="199" text-anchor="middle">segments and ByteString</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="574" y="148" width="230" height="68" rx="12" fill="#FFFFFF" stroke="#8EA9C2" stroke-width="1.5"/>
    <text class="cardTitle" x="689" y="176" text-anchor="middle">Source</text>
    <text class="cardText" x="689" y="199" text-anchor="middle">read into Buffer</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="912" y="148" width="230" height="68" rx="12" fill="#FFFFFF" stroke="#8EA9C2" stroke-width="1.5"/>
    <text class="cardTitle" x="1027" y="176" text-anchor="middle">Sink</text>
    <text class="cardText" x="1027" y="199" text-anchor="middle">write from Buffer</text>
  </g>

  <rect x="54" y="280" width="1272" height="212" rx="20" fill="#EAF8F0" stroke="#93C5A7" stroke-width="1.5"/>
  <text class="layerTitle" x="88" y="314">Wrapper layers</text>
  <g filter="url(#shadow)">
    <rect x="110" y="354" width="230" height="88" rx="12" fill="#FFFFFF" stroke="#86B89B" stroke-width="1.5"/>
    <text class="cardTitle" x="225" y="384" text-anchor="middle">Base64 wrappers</text>
    <text class="cardText" x="225" y="410" text-anchor="middle">Okio and Apache codecs</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="402" y="354" width="230" height="88" rx="12" fill="#FFFFFF" stroke="#86B89B" stroke-width="1.5"/>
    <text class="cardTitle" x="517" y="384" text-anchor="middle">Compression wrappers</text>
    <text class="cardText" x="517" y="410" text-anchor="middle">BZip2, GZip, LZ4, Zstd</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="694" y="354" width="230" height="88" rx="12" fill="#FFFFFF" stroke="#86B89B" stroke-width="1.5"/>
    <text class="cardTitle" x="809" y="384" text-anchor="middle">Cipher wrappers</text>
    <text class="cardText" x="809" y="410" text-anchor="middle">JCE CipherSink and Source</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="986" y="354" width="230" height="88" rx="12" fill="#FFFFFF" stroke="#86B89B" stroke-width="1.5"/>
    <text class="cardTitle" x="1101" y="384" text-anchor="middle">Hashing and Pipe</text>
    <text class="cardText" x="1101" y="410" text-anchor="middle">producer-consumer tests</text>
  </g>

  <rect x="54" y="524" width="1272" height="132" rx="20" fill="#FFF7E8" stroke="#D8B86E" stroke-width="1.5"/>
  <text class="layerTitle" x="88" y="558">I/O adapters</text>
  <g filter="url(#shadow)">
    <rect x="216" y="570" width="260" height="64" rx="12" fill="#FFFFFF" stroke="#C99A35" stroke-width="1.5"/>
    <use href="#fileIcon" x="236" y="579"/>
    <text class="cardTitle" x="366" y="592" text-anchor="middle">FileChannelSource/Sink</text>
    <text class="cardText" x="366" y="616" text-anchor="middle">NIO transferTo and transferFrom</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="560" y="570" width="260" height="64" rx="12" fill="#FFFFFF" stroke="#C99A35" stroke-width="1.5"/>
    <use href="#socketIcon" x="582" y="579"/>
    <text class="cardTitle" x="704" y="592" text-anchor="middle">SuspendedSocket</text>
    <text class="cardText" x="704" y="616" text-anchor="middle">selector-backed coroutine IO</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="904" y="570" width="260" height="64" rx="12" fill="#FFFFFF" stroke="#C99A35" stroke-width="1.5"/>
    <text class="cardTitle" x="1034" y="592" text-anchor="middle">SuspendedPipe</text>
    <text class="cardText" x="1034" y="616" text-anchor="middle">cancelable buffer bridge</text>
  </g>

  <rect x="54" y="688" width="1272" height="94" rx="20" fill="#F2F5F8" stroke="#B3BFCA" stroke-width="1.5"/>
  <text class="layerTitle" x="88" y="724">Tests as executable documentation</text>
  <text class="cardText" x="690" y="752" text-anchor="middle">Buffer, ByteString, Pipe, channels, compression, Base64, cipher, and coroutine interop tests show expected behavior.</text>
  <path class="line" d="M 351 216 L 351 260 L 225 260 L 225 354" stroke="#2563EB" marker-end="url(#arrowBlue)"/>
  <path class="line" d="M 689 216 L 689 260 L 517 260 L 517 354" stroke="#2563EB" marker-end="url(#arrowBlue)"/>
  <path class="line" d="M 1027 216 L 1027 260 L 809 260 L 809 354" stroke="#2563EB" marker-end="url(#arrowBlue)"/>
  <path class="line" d="M 225 442 L 225 510 L 366 510 L 366 570" stroke="#16A34A" marker-end="url(#arrowGreen)"/>
  <path class="line" d="M 809 442 L 809 510 L 704 510 L 704 570" stroke="#16A34A" marker-end="url(#arrowGreen)"/>
  <path class="line" d="M 1101 442 L 1101 510 L 1034 510 L 1034 570" stroke="#16A34A" marker-end="url(#arrowGreen)"/>
  <path class="line" d="M 690 634 L 690 688" stroke="#D14F6B" marker-end="url(#arrowRose)"/>
</svg>
