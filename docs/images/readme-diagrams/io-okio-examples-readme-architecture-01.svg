<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1766.4" height="860" viewBox="0 0 1766.4 860" role="img" aria-label="Okio examples architecture diagram">
  <defs>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="124%"><feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#64748B" flood-opacity="0.18"/></filter>
    <marker id="arrowBlue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 12 6 L 0 12 Z" fill="#2563EB" stroke-dasharray="none" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="arrowGreen" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 12 6 L 0 12 Z" fill="#16A34A" stroke-dasharray="none" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="arrowAmber" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 12 6 L 0 12 Z" fill="#C47A12" stroke-dasharray="none" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="arrowRose" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 12 6 L 0 12 Z" fill="#D14F6B" stroke-dasharray="none" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <style>
      .canvas { fill: #F8FAFC; }
      .frame { fill: #FFFFFF; stroke: #D6E0E8; stroke-width: 1.4; }
      .title { font-family: "Architects Daughter"; font-size: 34px; fill: #102033; }
      .subtitle { font-family: "Comic Mono"; font-size: 14px; fill: #51606F; }
      .layerTitle { font-family: "Architects Daughter"; font-size: 22px; fill: #102033; }
      .cardTitle { font-family: "Architects Daughter"; font-size: 23px; fill: #102033; }
      .cardText { font-family: "Comic Mono"; font-size: 14px; fill: #415166; }
      .line { fill: none; stroke-width: 3.2; stroke-linecap: round; stroke-linejoin: round; }
    </style>
    <g id="fileIcon">
      <path d="M 8 4 H 30 L 42 16 V 44 H 8 Z" fill="#E0F2FE" stroke="#2563EB" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M 30 4 L 30 11 Q 30 16 35 16 L 42 16" fill="none" stroke="#2563EB" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M 16 26 H 34 M 16 34 H 30" stroke="#2563EB" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <g id="socketIcon">
      <rect x="7.68" y="12" width="46.08" height="24" rx="8" fill="#DCFCE7" stroke="#16A34A" stroke-width="2.56"/>
      <circle cx="23.04" cy="24" r="3" fill="#16A34A"/>
      <circle cx="38.4" cy="24" r="3" fill="#16A34A"/>
    </g>
  </defs>
  <rect class="canvas" width="1766.4" height="860"/>
  <rect class="frame" x="23.04" y="18" width="1720.32" height="824" rx="24"/>
  <text class="title" x="883.2" y="58" text-anchor="middle">Okio examples</text>
  <text class="subtitle" x="883.2" y="84" text-anchor="middle">Okio Source and Sink wrappers for files, codecs, ciphers, compression, pipes, and coroutine interop</text>

  <rect x="69.12" y="116" width="1628.16" height="132" rx="20" fill="#EAF3FF" stroke="#9DB9D8" stroke-width="1.92"/>
  <text class="layerTitle" x="112.64" y="150">Okio core contracts</text>
  <g filter="url(#shadow)">
    <rect x="302.08" y="148" width="294.4" height="68" rx="12" fill="#FFFFFF" stroke="#8EA9C2" stroke-width="1.92"/>
    <text class="cardTitle" x="449.28" y="176" text-anchor="middle">Buffer</text>
    <text class="cardText" x="449.28" y="199" text-anchor="middle">segments and ByteString</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="734.72" y="148" width="294.4" height="68" rx="12" fill="#FFFFFF" stroke="#8EA9C2" stroke-width="1.92"/>
    <text class="cardTitle" x="881.92" y="176" text-anchor="middle">Source</text>
    <text class="cardText" x="881.92" y="199" text-anchor="middle">read into Buffer</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="1167.36" y="148" width="294.4" height="68" rx="12" fill="#FFFFFF" stroke="#8EA9C2" stroke-width="1.92"/>
    <text class="cardTitle" x="1314.56" y="176" text-anchor="middle">Sink</text>
    <text class="cardText" x="1314.56" y="199" text-anchor="middle">write from Buffer</text>
  </g>

  <rect x="69.12" y="280" width="1628.16" height="212" rx="20" fill="#EAF8F0" stroke="#93C5A7" stroke-width="1.92"/>
  <text class="layerTitle" x="112.64" y="314">Wrapper layers</text>
  <g filter="url(#shadow)">
    <rect x="140.8" y="354" width="294.4" height="88" rx="12" fill="#FFFFFF" stroke="#86B89B" stroke-width="1.92"/>
    <text class="cardTitle" x="288" y="384" text-anchor="middle">Base64 wrappers</text>
    <text class="cardText" x="288" y="410" text-anchor="middle">Okio and Apache codecs</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="514.56" y="354" width="294.4" height="88" rx="12" fill="#FFFFFF" stroke="#86B89B" stroke-width="1.92"/>
    <text class="cardTitle" x="661.76" y="384" text-anchor="middle">Compression wrappers</text>
    <text class="cardText" x="661.76" y="410" text-anchor="middle">BZip2, GZip, LZ4, Zstd</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="888.32" y="354" width="294.4" height="88" rx="12" fill="#FFFFFF" stroke="#86B89B" stroke-width="1.92"/>
    <text class="cardTitle" x="1035.52" y="384" text-anchor="middle">Cipher wrappers</text>
    <text class="cardText" x="1035.52" y="410" text-anchor="middle">JCE CipherSink and Source</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="1262.08" y="354" width="294.4" height="88" rx="12" fill="#FFFFFF" stroke="#86B89B" stroke-width="1.92"/>
    <text class="cardTitle" x="1409.28" y="384" text-anchor="middle">Hashing and Pipe</text>
    <text class="cardText" x="1409.28" y="410" text-anchor="middle">producer-consumer tests</text>
  </g>

  <rect x="69.12" y="524" width="1628.16" height="132" rx="20" fill="#FFF7E8" stroke="#D8B86E" stroke-width="1.92"/>
  <text class="layerTitle" x="112.64" y="558">I/O adapters</text>
  <g filter="url(#shadow)">
    <rect x="276.48" y="570" width="332.8" height="64" rx="12" fill="#FFFFFF" stroke="#C99A35" stroke-width="1.92"/>
    <use href="#fileIcon" x="302.08" y="579"/>
    <text class="cardTitle" x="468.48" y="592" text-anchor="middle">FileChannelSource/Sink</text>
    <text class="cardText" x="468.48" y="616" text-anchor="middle">NIO transferTo and transferFrom</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="716.8" y="570" width="332.8" height="64" rx="12" fill="#FFFFFF" stroke="#C99A35" stroke-width="1.92"/>
    <use href="#socketIcon" x="744.96" y="579"/>
    <text class="cardTitle" x="901.12" y="592" text-anchor="middle">SuspendedSocket</text>
    <text class="cardText" x="901.12" y="616" text-anchor="middle">selector-backed coroutine IO</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="1157.12" y="570" width="332.8" height="64" rx="12" fill="#FFFFFF" stroke="#C99A35" stroke-width="1.92"/>
    <text class="cardTitle" x="1323.52" y="592" text-anchor="middle">SuspendedPipe</text>
    <text class="cardText" x="1323.52" y="616" text-anchor="middle">cancelable buffer bridge</text>
  </g>

  <rect x="69.12" y="688" width="1628.16" height="94" rx="20" fill="#F2F5F8" stroke="#B3BFCA" stroke-width="1.92"/>
  <text class="layerTitle" x="112.64" y="724">Tests as executable documentation</text>
  <text class="cardText" x="883.2" y="752" text-anchor="middle">Buffer, ByteString, Pipe, channels, compression, Base64, cipher, and coroutine interop tests show expected behavior.</text>
  <path class="line" d="M 449.28 216 L 449.28 250 Q 449.28 264 436.48 264 L 300.8 264 Q 288 264 288 270 L 288 354" stroke="#2563EB" marker-end="url(#arrowBlue)" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="line" d="M 881.92 216 L 881.92 250 Q 881.92 264 869.12 264 L 674.56 264 Q 661.76 264 661.76 270 L 661.76 354" stroke="#2563EB" marker-end="url(#arrowBlue)" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="line" d="M 1314.56 216 L 1314.56 250 Q 1314.56 264 1301.76 264 L 1048.32 264 Q 1035.52 264 1035.52 270 L 1035.52 354" stroke="#2563EB" marker-end="url(#arrowBlue)" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="line" d="M 288 442 L 288 500 Q 288 508 300.8 508 L 455.68 508 Q 468.48 508 468.48 520 L 468.48 570" stroke="#16A34A" marker-end="url(#arrowGreen)" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="line" d="M 1035.52 442 L 1035.52 500 Q 1035.52 508 1022.72 508 L 913.92 508 Q 901.12 508 901.12 520 L 901.12 570" stroke="#16A34A" marker-end="url(#arrowGreen)" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="line" d="M 1409.28 442 L 1409.28 500 Q 1409.28 508 1396.48 508 L 1336.32 508 Q 1323.52 508 1323.52 520 L 1323.52 570" stroke="#16A34A" marker-end="url(#arrowGreen)" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="line" d="M 883.2 634 L 883.2 688" stroke="#D14F6B" marker-end="url(#arrowRose)" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
