<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1480" height="700" viewBox="0 0 1480 700" role="img" aria-label="Ktor REST coroutines request flow diagram">
  <defs>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="124%"><feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#64748B" flood-opacity="0.16"/></filter>
    <marker id="arrowBlue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 12 6 L 0 12 Z" fill="#2563EB" stroke-dasharray="none"/></marker>
    <marker id="arrowGreen" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 12 6 L 0 12 Z" fill="#16A34A" stroke-dasharray="none"/></marker>
    <marker id="arrowTeal" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 12 6 L 0 12 Z" fill="#0D9488" stroke-dasharray="none"/></marker>
    <marker id="arrowCyan" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 12 6 L 0 12 Z" fill="#0891B2" stroke-dasharray="none"/></marker>
    <marker id="arrowAmber" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 12 6 L 0 12 Z" fill="#C47A12" stroke-dasharray="none"/></marker>
    <marker id="arrowRed" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 12 6 L 0 12 Z" fill="#DC2626" stroke-dasharray="none"/></marker>
    <style>
      .canvas{fill:#F8FAFC}.frame{fill:#FFFFFF;stroke:#D6E0E8;stroke-width:1.4}.title{font-family:"Architects Daughter";font-size:36px;fill:#102033}.subtitle{font-family:"Comic Mono";font-size:14px;fill:#51606F}.cardTitle{font-family:"Architects Daughter";font-size:27px;fill:#102033}.cardText{font-family:"Comic Mono";font-size:14px;fill:#415166}.tag{font-family:"Comic Mono";font-size:13px;font-weight:700}.line{fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
    </style>
  </defs>
  <rect class="canvas" width="1480" height="700"/>
  <rect class="frame" x="24" y="24" width="1432" height="652" rx="24"/>
  <text class="title" x="740" y="66" text-anchor="middle">Book request paths</text>
  <text class="subtitle" x="740" y="94" text-anchor="middle">CRUD requests, NDJSON export, SSE delivery, and error mapping stay separate so each contract can be tested directly.</text>

  <g filter="url(#shadow)">
    <rect x="76" y="294" width="172" height="112" rx="16" fill="#F8FAFC" stroke="#64748B" stroke-width="1.7"/>
    <text class="cardTitle" x="162" y="334" text-anchor="middle">Caller</text>
    <text class="cardText" x="162" y="362" text-anchor="middle">curl, browser, test</text>
    <text class="cardText" x="162" y="386" text-anchor="middle">HTTP / SSE</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="332" y="132" width="246" height="116" rx="16" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.7"/>
    <text class="cardTitle" x="455" y="172" text-anchor="middle">CRUD route</text>
    <text class="cardText" x="455" y="200" text-anchor="middle">GET, POST, PUT, DELETE</text>
    <text class="cardText" x="455" y="224" text-anchor="middle">kotlinx JSON body</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="332" y="292" width="246" height="116" rx="16" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.7"/>
    <text class="cardTitle" x="455" y="332" text-anchor="middle">NDJSON export</text>
    <text class="cardText" x="455" y="360" text-anchor="middle">GET /books/export</text>
    <text class="cardText" x="455" y="384" text-anchor="middle">respondBytesWriter</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="332" y="452" width="246" height="116" rx="16" fill="#ECFEFF" stroke="#0891B2" stroke-width="1.7"/>
    <text class="cardTitle" x="455" y="492" text-anchor="middle">SSE route</text>
    <text class="cardText" x="455" y="520" text-anchor="middle">GET /books/stream</text>
    <text class="cardText" x="455" y="544" text-anchor="middle">top-level routing scope</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="716" y="132" width="224" height="116" rx="16" fill="#ECFDF5" stroke="#16A34A" stroke-width="1.7"/>
    <text class="cardTitle" x="828" y="172" text-anchor="middle">BookService</text>
    <text class="cardText" x="828" y="200" text-anchor="middle">validate Book fields</text>
    <text class="cardText" x="828" y="224" text-anchor="middle">raise domain errors</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="716" y="292" width="224" height="116" rx="16" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.7"/>
    <text class="cardTitle" x="828" y="332" text-anchor="middle">Jackson3Support</text>
    <text class="cardText" x="828" y="360" text-anchor="middle">one object per line</text>
    <text class="cardText" x="828" y="384" text-anchor="middle">non-blocking write</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="716" y="452" width="224" height="116" rx="16" fill="#ECFEFF" stroke="#0891B2" stroke-width="1.7"/>
    <text class="cardTitle" x="828" y="492" text-anchor="middle">SharedFlow</text>
    <text class="cardText" x="828" y="520" text-anchor="middle">live-only events</text>
    <text class="cardText" x="828" y="544" text-anchor="middle">Cancellation safe</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1078" y="132" width="236" height="116" rx="16" fill="#FEFCE8" stroke="#CA8A04" stroke-width="1.7"/>
    <text class="cardTitle" x="1196" y="172" text-anchor="middle">Repository</text>
    <text class="cardText" x="1196" y="200" text-anchor="middle">ConcurrentHashMap</text>
    <text class="cardText" x="1196" y="224" text-anchor="middle">emit on save/update</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="1078" y="364" width="236" height="116" rx="16" fill="#FFF7ED" stroke="#D97706" stroke-width="1.7"/>
    <text class="cardTitle" x="1196" y="404" text-anchor="middle">HTTP response</text>
    <text class="cardText" x="1196" y="432" text-anchor="middle">JSON, NDJSON, SSE</text>
    <text class="cardText" x="1196" y="456" text-anchor="middle">or typed error body</text>
  </g>

  <path class="line" d="M 248 350 L 292 350 L 292 190 L 332 190" stroke="#2563EB" marker-end="url(#arrowBlue)" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="line" d="M 248 350 L 332 350" stroke="#0D9488" marker-end="url(#arrowTeal)" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="line" d="M 248 350 L 292 350 L 292 510 L 332 510" stroke="#0891B2" marker-end="url(#arrowCyan)" stroke-linecap="round" stroke-linejoin="round"/>

  <path class="line" d="M 578 190 L 716 190" stroke="#16A34A" marker-end="url(#arrowGreen)" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="line" d="M 940 190 L 1078 190" stroke="#C47A12" marker-end="url(#arrowAmber)" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="line" d="M 1196 248 L 1196 322 L 1030 322 L 1030 422 L 1078 422" stroke="#C47A12" marker-end="url(#arrowAmber)" stroke-linecap="round" stroke-linejoin="round"/>

  <path class="line" d="M 578 350 L 716 350" stroke="#0D9488" marker-end="url(#arrowTeal)" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="line" d="M 940 350 L 1030 350 L 1030 422 L 1078 422" stroke="#0D9488" marker-end="url(#arrowTeal)" stroke-linecap="round" stroke-linejoin="round"/>

  <path class="line" d="M 578 510 L 716 510" stroke="#0891B2" marker-end="url(#arrowCyan)" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="line" d="M 940 510 L 1030 510 L 1030 422 L 1078 422" stroke="#0891B2" marker-end="url(#arrowCyan)" stroke-linecap="round" stroke-linejoin="round"/>

  <path class="line" d="M 828 248 L 828 268 L 994 268 L 994 422 L 1078 422" stroke="#DC2626" marker-end="url(#arrowRed)" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
