<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1160" viewBox="0 0 1800 1160" role="img" aria-labelledby="title desc"><title id="title">Restartable Billing Close and Reconciliation Sequence</title><desc id="desc">Fixed cutoff, keyset batches, price lookup, atomic ledger checkpoint, restart, invoice, late adjustment, and reconciliation.</desc><defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="124%"><feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#64748B" flood-opacity="0.13"/></filter>
  <style>
    .bg{fill:#F8FAFC}.frame{fill:#FFFFFF;stroke:#CAD6DF;stroke-width:2}.layer{stroke-width:2}.blueLayer{fill:#EFF6FF;stroke:#A8C7EA}.greenLayer{fill:#F0F8F0;stroke:#B8D7AE}.amberLayer{fill:#FFF7E8;stroke:#DFC69A}.purpleLayer{fill:#F8F3FF;stroke:#D7C3EF}.title{font-family:"Architects Daughter";font-size:42px;fill:#263238}.subtitle,.body,.small,.footer,.msg,.legend{font-family:"Comic Mono";fill:#3E4C59}.subtitle{font-size:18px}.layerTitle{font-family:"Architects Daughter";font-size:27px;fill:#344154}.cardTitle,.participant{font-family:"Architects Daughter";font-size:23px;fill:#16202A}.body{font-size:16px}.small{font-size:13px;fill:#5B6975}.footer{font-size:14px;fill:#60727D}.card{fill:#FFFFFF;stroke:#9FB0BC;stroke-width:2}.blueCard{fill:#EFF6FF;stroke:#4F86C6}.greenCard{fill:#F0F8F0;stroke:#6E8F4F}.amberCard{fill:#FFF7E8;stroke:#9B7D54}.redCard{fill:#FFF0F0;stroke:#B86868}.purpleCard{fill:#F8F3FF;stroke:#8065A8}.connector{fill:none;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round}.blueEdge{stroke:#4F86C6;marker-end:url(#arrow-blue)}.greenEdge{stroke:#6E8F4F;marker-end:url(#arrow-green)}.amberEdge{stroke:#9B7D54;marker-end:url(#arrow-amber)}.redEdge{stroke:#B86868;marker-end:url(#arrow-red)}.purpleEdge{stroke:#8065A8;marker-end:url(#arrow-purple)}.tealEdge{stroke:#2D948C;marker-end:url(#arrow-teal)}.dashed{stroke-dasharray:9 7}.lifeline{stroke:#9AAAB1;stroke-width:2;stroke-dasharray:7 8}.activation{fill:#EAF6EF;stroke:#6F9278;stroke-width:1.5}.label{fill:#FFFFFF;stroke:#D7E0E4;stroke-width:1.5}.badge{font-family:"Comic Mono";font-size:13px;font-weight:700}.state{font-family:"Architects Daughter";font-size:22px}
  </style>
  <marker id="arrow-blue" viewBox="0 0 10 10" markerWidth="14" markerHeight="14" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#4F86C6" stroke="#4F86C6" stroke-dasharray="none"/></marker><marker id="arrow-green" viewBox="0 0 10 10" markerWidth="14" markerHeight="14" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#6E8F4F" stroke="#6E8F4F" stroke-dasharray="none"/></marker><marker id="arrow-amber" viewBox="0 0 10 10" markerWidth="14" markerHeight="14" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#9B7D54" stroke="#9B7D54" stroke-dasharray="none"/></marker><marker id="arrow-red" viewBox="0 0 10 10" markerWidth="14" markerHeight="14" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#B86868" stroke="#B86868" stroke-dasharray="none"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" markerWidth="14" markerHeight="14" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#8065A8" stroke="#8065A8" stroke-dasharray="none"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" markerWidth="14" markerHeight="14" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#2D948C" stroke="#2D948C" stroke-dasharray="none"/></marker>
  </defs><rect class="bg" width="1800" height="1160"/><rect class="frame" x="30" y="25" width="1740" height="1095" rx="22"/><text class="title" x="900" y="70" text-anchor="middle">Close, Restart, Finalize, and Reconcile</text><text class="subtitle" x="900" y="104" text-anchor="middle">Each batch commits ledger rows with its checkpoint; a crash repeats work, not money.</text><g filter="url(#shadow)"><rect class="card" x="50" y="150" width="280" height="78" rx="12"/><text class="participant" x="190" y="182" text-anchor="middle">Operator / Scheduler</text><text class="small" x="190" y="207" text-anchor="middle">same application use case</text></g><line class="lifeline" x1="190" y1="228" x2="190" y2="1060"/><g filter="url(#shadow)"><rect class="card" x="410" y="150" width="280" height="78" rx="12"/><text class="participant" x="550" y="182" text-anchor="middle">Close Service</text><text class="small" x="550" y="207" text-anchor="middle">bounded keyset worker</text></g><line class="lifeline" x1="550" y1="228" x2="550" y2="1060"/><g filter="url(#shadow)"><rect class="card" x="770" y="150" width="280" height="78" rx="12"/><text class="participant" x="910" y="182" text-anchor="middle">Pricing</text><text class="small" x="910" y="207" text-anchor="middle">occurredAt timeline</text></g><line class="lifeline" x1="910" y1="228" x2="910" y2="1060"/><g filter="url(#shadow)"><rect class="card" x="1130" y="150" width="280" height="78" rx="12"/><text class="participant" x="1270" y="182" text-anchor="middle">Invoice / Adjust</text><text class="small" x="1270" y="207" text-anchor="middle">append-only results</text></g><line class="lifeline" x1="1270" y1="228" x2="1270" y2="1060"/><g filter="url(#shadow)"><rect class="card" x="1490" y="150" width="280" height="78" rx="12"/><text class="participant" x="1630" y="182" text-anchor="middle">PostgreSQL</text><text class="small" x="1630" y="207" text-anchor="middle">single authority</text></g><line class="lifeline" x1="1630" y1="228" x2="1630" y2="1060"/><rect class="activation" x="542" y="305" width="16" height="610" rx="6"/><rect class="activation" x="902" y="485" width="16" height="180" rx="6"/><rect class="activation" x="1262" y="790" width="16" height="210" rx="6"/><rect class="activation" x="1622" y="355" width="16" height="680" rx="6"/><rect class="label labelPill" x="181" y="291" width="378" height="34" rx="17"/><circle cx="203" cy="308" r="13" fill="#FFFFFF" stroke="#4F86C6" stroke-width="2"/><text class="badge num" x="203" y="313" text-anchor="middle">1</text><text class="msg" x="225" y="313">start close after allowed lateness</text><g class="edge" data-edge="sequence-1" data-label="start close after allowed lateness"><path data-connector="sequence-1" class="connector blueEdge" d="M190 335 L550 335"/></g><rect class="label labelPill" x="919" y="356" width="342" height="34" rx="17"/><circle cx="941" cy="373" r="13" fill="#FFFFFF" stroke="#6E8F4F" stroke-width="2"/><text class="badge num" x="941" y="378" text-anchor="middle">2</text><text class="msg" x="963" y="378">OPEN to CLOSING; freeze cutoff</text><g class="edge" data-edge="sequence-2" data-label="OPEN to CLOSING; freeze cutoff"><path data-connector="sequence-2" class="connector greenEdge" d="M550 400 L1630 400"/></g><rect class="label labelPill" x="887.5" y="421" width="405" height="34" rx="17"/><circle cx="909.5" cy="438" r="13" fill="#FFFFFF" stroke="#6E8F4F" stroke-width="2"/><text class="badge num" x="909.5" y="443" text-anchor="middle">3</text><text class="msg" x="931.5" y="443">read next (occurredAt, usageId) batch</text><g class="edge" data-edge="sequence-3" data-label="read next (occurredAt, usageId) batch"><path data-connector="sequence-3" class="connector greenEdge" d="M550 465 L1630 465"/></g><rect class="label labelPill" x="559" y="486" width="342" height="34" rx="17"/><circle cx="581" cy="503" r="13" fill="#FFFFFF" stroke="#8065A8" stroke-width="2"/><text class="badge num" x="581" y="508" text-anchor="middle">4</text><text class="msg" x="603" y="508">select half-open price version</text><g class="edge" data-edge="sequence-4" data-label="select half-open price version"><path data-connector="sequence-4" class="connector purpleEdge" d="M550 530 L910 530"/></g><rect class="label labelPill" x="568" y="551" width="324" height="34" rx="17"/><circle cx="590" cy="568" r="13" fill="#FFFFFF" stroke="#4F86C6" stroke-width="2"/><text class="badge num" x="590" y="573" text-anchor="middle">5</text><text class="msg" x="612" y="573">unit price or validation gap</text><g class="edge" data-edge="sequence-5" data-label="unit price or validation gap"><path data-connector="sequence-5" class="connector tealEdge" d="M910 595 L550 595"/></g><rect class="label labelPill" x="887.5" y="621" width="405" height="34" rx="17"/><circle cx="909.5" cy="638" r="13" fill="#FFFFFF" stroke="#6E8F4F" stroke-width="2"/><text class="badge num" x="909.5" y="643" text-anchor="middle">6</text><text class="msg" x="931.5" y="643">append CHARGE + checkpoint atomically</text><g class="edge" data-edge="sequence-6" data-label="append CHARGE + checkpoint atomically"><path data-connector="sequence-6" class="connector greenEdge" d="M550 665 L1630 665"/></g><rect class="label labelPill" x="190" y="691" width="360" height="34" rx="17"/><circle cx="212" cy="708" r="13" fill="#FFFFFF" stroke="#9B7D54" stroke-width="2"/><text class="badge num" x="212" y="713" text-anchor="middle">7</text><text class="msg" x="234" y="713">restart calls process-next again</text><g class="edge" data-edge="sequence-7" data-label="restart calls process-next again"><path data-connector="sequence-7" class="connector amberEdge" d="M190 735 L550 735"/></g><rect class="label labelPill" x="757" y="766" width="306" height="34" rx="17"/><circle cx="779" cy="783" r="13" fill="#FFFFFF" stroke="#6E8F4F" stroke-width="2"/><text class="badge num" x="779" y="788" text-anchor="middle">8</text><text class="msg" x="801" y="788">READY_TO_FINALIZE snapshot</text><g class="edge" data-edge="sequence-8" data-label="READY_TO_FINALIZE snapshot"><path data-connector="sequence-8" class="connector greenEdge" d="M550 810 L1270 810"/></g><rect class="label labelPill" x="1234" y="831" width="432" height="34" rx="17"/><circle cx="1256" cy="848" r="13" fill="#FFFFFF" stroke="#6E8F4F" stroke-width="2"/><text class="badge num" x="1256" y="853" text-anchor="middle">9</text><text class="msg" x="1278" y="853">invoice + lines + provenance + FINALIZED</text><g class="edge" data-edge="sequence-9" data-label="invoice + lines + provenance + FINALIZED"><path data-connector="sequence-9" class="connector greenEdge" d="M1270 875 L1630 875"/></g><rect class="label labelPill" x="1274.5" y="896" width="351" height="34" rx="17"/><circle cx="1296.5" cy="913" r="13" fill="#FFFFFF" stroke="#9B7D54" stroke-width="2"/><text class="badge num" x="1296.5" y="918" text-anchor="middle">10</text><text class="msg" x="1318.5" y="918">late debit / credit append only</text><g class="edge" data-edge="sequence-10" data-label="late debit / credit append only"><path data-connector="sequence-10" class="connector amberEdge" d="M1270 940 L1630 940"/></g><rect class="label labelPill" x="694" y="966" width="432" height="34" rx="17"/><circle cx="716" cy="983" r="13" fill="#FFFFFF" stroke="#4F86C6" stroke-width="2"/><text class="badge num" x="716" y="988" text-anchor="middle">11</text><text class="msg" x="738" y="988">read-only reconcile; digest-gated repair</text><g class="edge" data-edge="sequence-11" data-label="read-only reconcile; digest-gated repair"><path data-connector="sequence-11" class="connector blueEdge dashed" d="M190 1010 L1630 1010"/></g><text class="footer" x="900" y="1092" text-anchor="middle">Microservice extraction preserves ownership: ingest, pricing, billing, and reconciliation get separate databases plus versioned events and dedup receipts.</text></svg>