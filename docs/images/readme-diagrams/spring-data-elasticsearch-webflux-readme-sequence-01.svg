  <line x1="2183.0" y1="232" x2="2183.0" y2="532" class="lifeline"/>
  <g filter="url(#shadow)"><rect x="2386.0" y="156" width="250" height="76" rx="10" class="header"/><text x="2511.0" y="186" text-anchor="middle" class="participant">findByIsbn</text><text x="2511.0" y="211" text-anchor="middle" class="role">suspend repository method</text></g>
