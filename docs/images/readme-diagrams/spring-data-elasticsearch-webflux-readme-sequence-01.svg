  <g filter="url(#shadow)"><rect x="1730.0" y="156" width="250" height="76" rx="10" class="header"/><text x="1855.0" y="186" text-anchor="middle" class="participant">service.getAll</text><text x="1855.0" y="211" text-anchor="middle" class="role">repository.findAll</text></g>
