<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1740.8" height="940" viewBox="0 0 1740.8 940" role="img" aria-label="graph-social-network architecture diagram">
  <defs>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="124%"><feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#64748B" flood-opacity="0.18"/></filter>
    <marker id="arrowBlue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 12 6 L 0 12 Z" fill="#2563EB" stroke-dasharray="none" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="arrowGreen" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 12 6 L 0 12 Z" fill="#16A34A" stroke-dasharray="none" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="arrowAmber" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 12 6 L 0 12 Z" fill="#C47A12" stroke-dasharray="none" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="arrowRose" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 12 6 L 0 12 Z" fill="#D14F6B" stroke-dasharray="none" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <style>
      .canvas { fill: #F8FAFC; }
      .frame { fill: #FFFFFF; stroke: #D6E0E8; stroke-width: 1.4; }
      .title { font-family: "Architects Daughter"; font-size: 34px; fill: #102033; }
      .subtitle { font-family: "Comic Mono"; font-size: 14px; fill: #51606F; }
      .layerTitle { font-family: "Architects Daughter"; font-size: 22px; fill: #102033; }
      .layerNote { font-family: "Comic Mono"; font-size: 13px; fill: #526273; }
      .cardTitle { font-family: "Architects Daughter"; font-size: 23px; fill: #102033; }
      .cardText { font-family: "Comic Mono"; font-size: 14px; fill: #415166; }
      .line { fill: none; stroke-width: 3.2; stroke-linecap: round; stroke-linejoin: round; }
    </style>
    <g id="graphDbIcon">
      <circle cx="10.24" cy="10" r="5" fill="#A7F3D0" stroke="#0F766E" stroke-width="1.6"/>
      <circle cx="35.84" cy="8" r="6" fill="#BFDBFE" stroke="#2563EB" stroke-width="1.6"/>
      <circle cx="32" cy="29" r="5.5" fill="#FDE68A" stroke="#B45309" stroke-width="1.6"/>
      <path d="M 13 10 L 22 8 M 12 13 L 21 25 M 28 14 L 26 23" stroke="#64748B" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </defs>
  <rect class="canvas" width="1740.8" height="940"/>
  <rect class="frame" x="23.04" y="18" width="1694.72" height="904" rx="24"/>
  <text class="title" x="870.4" y="58" text-anchor="middle">graph-social-network</text>
  <text class="subtitle" x="870.4" y="84" text-anchor="middle">LinkedIn-style person/company graph with blocking and coroutine APIs</text>

  <rect x="69.12" y="112" width="1602.56" height="138" rx="20" fill="#EAF3FF" stroke="#9DB9D8" stroke-width="1.92"/>
  <text class="layerTitle" x="112.64" y="146">Entry points</text>
  <text class="layerNote" x="112.64" y="170">same contract, different execution model</text>
  <g filter="url(#shadow)">
    <rect x="422.4" y="142" width="384" height="78" rx="12" fill="#FFFFFF" stroke="#8EA9C2" stroke-width="1.92"/>
    <text class="cardTitle" x="614.4" y="172" text-anchor="middle">SocialNetworkService</text>
    <text class="cardText" x="614.4" y="196" text-anchor="middle">blocking List and GraphPath API</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="934.4" y="142" width="384" height="78" rx="12" fill="#FFFFFF" stroke="#8EA9C2" stroke-width="1.92"/>
    <text class="cardTitle" x="1126.4" y="172" text-anchor="middle">SocialNetworkSuspendService</text>
    <text class="cardText" x="1126.4" y="196" text-anchor="middle">suspend and cold Flow API</text>
  </g>

  <rect x="69.12" y="282" width="1602.56" height="206" rx="20" fill="#EAF8F0" stroke="#93C5A7" stroke-width="1.92"/>
  <text class="layerTitle" x="112.64" y="316">Social graph operations</text>
  <g filter="url(#shadow)">
    <rect x="148.48" y="362" width="384" height="88" rx="12" fill="#FFFFFF" stroke="#86B89B" stroke-width="1.92"/>
    <text class="cardTitle" x="340.48" y="393" text-anchor="middle">Find-or-create vertices</text>
    <text class="cardText" x="340.48" y="419" text-anchor="middle">addPerson, addCompany</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="678.4" y="350" width="384" height="112" rx="12" fill="#F7FFF9" stroke="#86B89B" stroke-width="1.92"/>
    <text class="cardTitle" x="870.4" y="380" text-anchor="middle">Relationship mutators</text>
    <text class="cardText" x="870.4" y="407" text-anchor="middle">KNOWS as two directed edges</text>
    <text class="cardText" x="870.4" y="430" text-anchor="middle">FOLLOWS and WORKS_AT edges</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="1208.32" y="350" width="384" height="112" rx="12" fill="#F7FFF9" stroke="#86B89B" stroke-width="1.92"/>
    <text class="cardTitle" x="1400.32" y="380" text-anchor="middle">Traversal queries</text>
    <text class="cardText" x="1400.32" y="407" text-anchor="middle">degree, FOAF, colleagues</text>
    <text class="cardText" x="1400.32" y="430" text-anchor="middle">shortest path and all paths</text>
  </g>

  <rect x="69.12" y="520" width="1602.56" height="156" rx="20" fill="#FFF7E8" stroke="#D8B86E" stroke-width="1.92"/>
  <text class="layerTitle" x="112.64" y="554">Typed schema</text>
  <g filter="url(#shadow)">
    <rect x="289.28" y="578" width="332.8" height="70" rx="12" fill="#FFFFFF" stroke="#C99A35" stroke-width="1.92"/>
    <text class="cardTitle" x="455.68" y="607" text-anchor="middle">Person</text>
    <text class="cardText" x="455.68" y="631" text-anchor="middle">personId, name, title, location</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="704" y="578" width="332.8" height="70" rx="12" fill="#FFFFFF" stroke="#C99A35" stroke-width="1.92"/>
    <text class="cardTitle" x="870.4" y="607" text-anchor="middle">Relationship labels</text>
    <text class="cardText" x="870.4" y="631" text-anchor="middle">KNOWS, FOLLOWS, WORKS_AT</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="1118.72" y="578" width="332.8" height="70" rx="12" fill="#FFFFFF" stroke="#C99A35" stroke-width="1.92"/>
    <text class="cardTitle" x="1285.12" y="607" text-anchor="middle">Company</text>
    <text class="cardText" x="1285.12" y="631" text-anchor="middle">companyId, name, industry</text>
  </g>

  <rect x="69.12" y="708" width="1602.56" height="132" rx="20" fill="#F2F5F8" stroke="#B3BFCA" stroke-width="1.92"/>
  <text class="layerTitle" x="112.64" y="742">Graph runtime backends</text>
  <g filter="url(#shadow)">
    <rect x="381.44" y="748" width="281.6" height="64" rx="12" fill="#FFFFFF" stroke="#A7B3BF" stroke-width="1.92"/>
    <use href="#graphDbIcon" x="407.04" y="761"/>
    <text class="cardTitle" x="547.84" y="776" text-anchor="middle">TinkerGraph</text>
    <text class="cardText" x="547.84" y="800" text-anchor="middle">unit tests, no Docker</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="729.6" y="748" width="281.6" height="64" rx="12" fill="#FFFFFF" stroke="#A7B3BF" stroke-width="1.92"/>
    <use href="#graphDbIcon" x="755.2" y="761"/>
    <text class="cardTitle" x="896" y="776" text-anchor="middle">Neo4j</text>
    <text class="cardText" x="896" y="800" text-anchor="middle">integrationTest</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="1077.76" y="748" width="281.6" height="64" rx="12" fill="#FFFFFF" stroke="#A7B3BF" stroke-width="1.92"/>
    <use href="#graphDbIcon" x="1103.36" y="761"/>
    <text class="cardTitle" x="1244.16" y="776" text-anchor="middle">Memgraph</text>
    <text class="cardText" x="1244.16" y="800" text-anchor="middle">integrationTest</text>
  </g>

