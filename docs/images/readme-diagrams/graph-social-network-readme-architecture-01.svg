  <path class="line" d="M 870.4 648 L 870.4 682 Q 870.4 692 857.6 692 L 535.04 692 Q 522.24 692 522.24 702 L 522.24 748" stroke="#D14F6B" marker-end="url(#arrowRose)" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="line" d="M 870.4 648 L 870.4 748" stroke="#D14F6B" marker-end="url(#arrowRose)" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="line" d="M 870.4 648 L 870.4 682 Q 870.4 692 883.2 692 L 1205.76 692 Q 1218.56 692 1218.56 702 L 1218.56 748" stroke="#D14F6B" marker-end="url(#arrowRose)" stroke-linecap="round" stroke-linejoin="round"/>
