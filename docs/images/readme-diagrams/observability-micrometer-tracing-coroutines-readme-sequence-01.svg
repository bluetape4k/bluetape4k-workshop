<svg xmlns="http://www.w3.org/2000/svg" width="1270" height="1356" viewBox="0 0 1270 1356" role="img" aria-label="Micrometer Observation for Spring Boot 4 WebFlux &amp; Coroutines Diagram 1">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#1f2937" flood-opacity="0.10"/></filter>
  <marker id="arrowBlue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M1 1 L7 4 L1 7 Z" fill="#5b8def"/></marker>
  <marker id="arrowTeal" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M1 1 L7 4 L1 7 Z" fill="#45a7a1"/></marker>
  <style>
    .canvas{fill:#f7f9fc}
    .frame{fill:#ffffff;stroke:#d8e0ea;stroke-width:1.5}
    .title{font-family:"Architects Daughter";font-size:32px;fill:#102033}
    .subtitle{font-family:"Comic Mono";font-size:13px;fill:#536273}
    .actor{font-family:"Architects Daughter";font-size:17px;fill:#102033}
    .detail{font-family:"Comic Mono";font-size:11px;fill:#536273}
    .message{font-family:"Comic Mono";font-size:12px;fill:#263445;paint-order:stroke;stroke:#ffffff;stroke-width:4px;stroke-linejoin:round}
    .branch{font-family:"Architects Daughter";font-size:15px;fill:#1f3b57}
    .lifeline{stroke:#b8c4d3;stroke-width:1.4;stroke-dasharray:7 6}
    .call{stroke:#5b8def;stroke-width:2.1;fill:none;marker-end:url(#arrowBlue)}
    .return{stroke:#45a7a1;stroke-width:2;stroke-dasharray:7 5;fill:none;marker-end:url(#arrowTeal)}
    .box{stroke-width:1.8;filter:url(#shadow)}
  </style>
</defs>
<rect class="canvas" width="1270" height="1356"/>
<rect class="frame" x="24" y="20" width="1222" height="1316" rx="18"/>
<text class="title" x="48" y="58">Micrometer Observation for Spring Boot 4 WebFlux &amp; Coroutines Diagram 1</text>
<text class="subtitle" x="50" y="84">sequenceDiagram rendered from the current README model; labels are separated from connector lanes</text>
<rect class="box" x="30" y="116" width="184" height="58" rx="10" fill="#e8f3ff" stroke="#7aa0c4"/>
<text class="actor" x="122" y="145" text-anchor="middle" dominant-baseline="middle">Client</text>
<line class="lifeline" x1="122" y1="174" x2="122" y2="1298"/>
<rect class="box" x="286.5" y="116" width="184" height="58" rx="10" fill="#eaf7ef" stroke="#7aa0c4"/>
<text class="actor" x="378.5" y="138" text-anchor="middle" dominant-baseline="middle">Coroutine</text>
<text class="actor" x="378.5" y="152" text-anchor="middle" dominant-baseline="middle">Controller</text>
<line class="lifeline" x1="378.5" y1="174" x2="378.5" y2="1298"/>
<rect class="box" x="543" y="116" width="184" height="58" rx="10" fill="#fff3d9" stroke="#7aa0c4"/>
<text class="actor" x="635" y="145" text-anchor="middle" dominant-baseline="middle">Coroutine Service</text>
<line class="lifeline" x1="635" y1="174" x2="635" y2="1298"/>
<rect class="box" x="799.5" y="116" width="184" height="58" rx="10" fill="#f1ecff" stroke="#7aa0c4"/>
<text class="actor" x="891.5" y="138" text-anchor="middle" dominant-baseline="middle">Observation</text>
<text class="actor" x="891.5" y="152" text-anchor="middle" dominant-baseline="middle">Registry</text>
<line class="lifeline" x1="891.5" y1="174" x2="891.5" y2="1298"/>
<rect class="box" x="1056" y="116" width="184" height="58" rx="10" fill="#fdecef" stroke="#7aa0c4"/>
<text class="actor" x="1148" y="145" text-anchor="middle" dominant-baseline="middle">Zipkin</text>
<line class="lifeline" x1="1148" y1="174" x2="1148" y2="1298"/>
<rect x="78" y="176" width="344.5" height="26" rx="6" fill="#ffffff" opacity="0.95" stroke="#dbe3ee"/>
<text class="message" x="250.25" y="189" text-anchor="middle" dominant-baseline="middle">1. GET /coroutine/todo/1</text>
<path class="call" d="M122 218 L378.5 218"/>
<rect x="425" y="258" width="420" height="26" rx="6" fill="#ffffff" opacity="0.95" stroke="#dbe3ee"/>
<text class="message" x="635" y="271" text-anchor="middle" dominant-baseline="middle">2. create root span (HTTP server)</text>
<path class="call" d="M378.5 300 L891.5 300"/>
<rect x="334.5" y="340" width="344.5" height="26" rx="6" fill="#ffffff" opacity="0.95" stroke="#dbe3ee"/>
<text class="message" x="506.75" y="353" text-anchor="middle" dominant-baseline="middle">3. getTodo(1)</text>
<path class="call" d="M378.5 382 L635 382"/>
<rect x="591" y="394" width="344.5" height="54" rx="6" fill="#ffffff" opacity="0.95" stroke="#dbe3ee"/>
<text class="message" x="763.25" y="407" text-anchor="middle" dominant-baseline="middle">4.</text>
<text class="message" x="763.25" y="421" text-anchor="middle" dominant-baseline="middle">withObservationSuspending(&quot;pre-process</text>
<text class="message" x="763.25" y="435" text-anchor="middle" dominant-baseline="middle">ing&quot;)</text>
<path class="call" d="M635 464 L891.5 464"/>
<rect x="551" y="528" width="168" height="34" rx="8" fill="#fff8dc" stroke="#e7c86b" stroke-dasharray="5 4"/>
<text class="message" x="635" y="538" text-anchor="middle" dominant-baseline="middle">delay(200) - suspension</text>
<text class="message" x="635" y="552" text-anchor="middle" dominant-baseline="middle">point</text>
<rect x="551" y="610" width="168" height="34" rx="8" fill="#fff8dc" stroke="#e7c86b" stroke-dasharray="5 4"/>
<text class="message" x="635" y="620" text-anchor="middle" dominant-baseline="middle">resumes (may be</text>
<text class="message" x="635" y="634" text-anchor="middle" dominant-baseline="middle">different thread)</text>
<rect x="591" y="668" width="344.5" height="26" rx="6" fill="#ffffff" opacity="0.95" stroke="#dbe3ee"/>
<text class="message" x="763.25" y="681" text-anchor="middle" dominant-baseline="middle">7. pre-processing span closed</text>
<path class="return" d="M891.5 710 L635 710"/>
<rect x="591" y="722" width="344.5" height="54" rx="6" fill="#ffffff" opacity="0.95" stroke="#dbe3ee"/>
<text class="message" x="763.25" y="735" text-anchor="middle" dominant-baseline="middle">8.</text>
<text class="message" x="763.25" y="749" text-anchor="middle" dominant-baseline="middle">withObservationSuspending(&quot;get-todo-by</text>
<text class="message" x="763.25" y="763" text-anchor="middle" dominant-baseline="middle">-id&quot;)</text>
<path class="call" d="M635 792 L891.5 792"/>
<rect x="681.5" y="832" width="420" height="26" rx="6" fill="#ffffff" opacity="0.95" stroke="#dbe3ee"/>
<text class="message" x="891.5" y="845" text-anchor="middle" dominant-baseline="middle">9. (exported after span close)</text>
<path class="call" d="M635 874 L1148 874"/>
<rect x="591" y="914" width="344.5" height="26" rx="6" fill="#ffffff" opacity="0.95" stroke="#dbe3ee"/>
<text class="message" x="763.25" y="927" text-anchor="middle" dominant-baseline="middle">10. get-todo-by-id span closed</text>
<path class="return" d="M891.5 956 L635 956"/>
<rect x="591" y="968" width="344.5" height="54" rx="6" fill="#ffffff" opacity="0.95" stroke="#dbe3ee"/>
<text class="message" x="763.25" y="981" text-anchor="middle" dominant-baseline="middle">11.</text>
<text class="message" x="763.25" y="995" text-anchor="middle" dominant-baseline="middle">withObservationSuspending(&quot;post-proces</text>
<text class="message" x="763.25" y="1009" text-anchor="middle" dominant-baseline="middle">sing&quot;)</text>
<path class="call" d="M635 1038 L891.5 1038"/>
<rect x="425" y="1078" width="420" height="26" rx="6" fill="#ffffff" opacity="0.95" stroke="#dbe3ee"/>
<text class="message" x="635" y="1091" text-anchor="middle" dominant-baseline="middle">12. all child spans closed</text>
<path class="return" d="M891.5 1120 L378.5 1120"/>
<rect x="78" y="1160" width="344.5" height="26" rx="6" fill="#ffffff" opacity="0.95" stroke="#dbe3ee"/>
<text class="message" x="250.25" y="1173" text-anchor="middle" dominant-baseline="middle">13. 200 OK + Todo JSON</text>
<path class="return" d="M378.5 1202 L122 1202"/>
</svg>
