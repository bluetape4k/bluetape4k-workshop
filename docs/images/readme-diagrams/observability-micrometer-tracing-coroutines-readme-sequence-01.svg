<svg xmlns="http://www.w3.org/2000/svg" width="1270" height="992" viewBox="0 0 1270 992" role="img" aria-label="Micrometer Observation for Spring Boot 4 WebFlux &amp; Coroutines Diagram 1">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#1f2937" flood-opacity="0.10"/></filter>
  <marker id="arrowBlue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M1 1 L7 4 L1 7 Z" fill="#5b8def"/></marker>
  <marker id="arrowTeal" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M1 1 L7 4 L1 7 Z" fill="#45a7a1"/></marker>
  <style>
    .canvas{fill:#f7f9fc}
    .frame{fill:#ffffff;stroke:#d8e0ea;stroke-width:1.5}
    .title{font-family:"Architects Daughter";font-size:32px;fill:#102033}
    .subtitle{font-family:"Comic Mono";font-size:13px;fill:#536273}
    .actor{font-family:"Architects Daughter";font-size:17px;fill:#102033}
    .detail{font-family:"Comic Mono";font-size:11px;fill:#536273}
    .message{font-family:"Comic Mono";font-size:12px;fill:#263445;paint-order:stroke;stroke:#ffffff;stroke-width:4px;stroke-linejoin:round}
    .branch{font-family:"Architects Daughter";font-size:15px;fill:#1f3b57}
    .lifeline{stroke:#b8c4d3;stroke-width:1.4;stroke-dasharray:7 6}
    .call{stroke:#5b8def;stroke-width:2.1;fill:none;marker-end:url(#arrowBlue)}
    .return{stroke:#45a7a1;stroke-width:2;stroke-dasharray:7 5;fill:none;marker-end:url(#arrowTeal)}
    .box{stroke-width:1.8;filter:url(#shadow)}
  </style>
</defs>
<rect class="canvas" width="1270" height="992"/>
<rect class="frame" x="24" y="20" width="1222" height="952" rx="18"/>
<text class="title" x="48" y="58">Micrometer Observation for Spring Boot 4 WebFlux &amp; Coroutines Diagram 1</text>
<text class="subtitle" x="50" y="84">sequenceDiagram rendered from the current README model; labels are separated from connector lanes</text>
<rect class="box" x="46" y="116" width="152" height="58" rx="10" fill="#e8f3ff" stroke="#7aa0c4"/>
<text class="actor" x="122" y="145" text-anchor="middle" dominant-baseline="middle">Client</text>
<line class="lifeline" x1="122" y1="174" x2="122" y2="934"/>
<rect class="box" x="302.5" y="116" width="152" height="58" rx="10" fill="#eaf7ef" stroke="#7aa0c4"/>
<text class="actor" x="378.5" y="145" text-anchor="middle" dominant-baseline="middle">CoroutineController</text>
<line class="lifeline" x1="378.5" y1="174" x2="378.5" y2="934"/>
<rect class="box" x="559" y="116" width="152" height="58" rx="10" fill="#fff3d9" stroke="#7aa0c4"/>
<text class="actor" x="635" y="145" text-anchor="middle" dominant-baseline="middle">CoroutineService</text>
<line class="lifeline" x1="635" y1="174" x2="635" y2="934"/>
<rect class="box" x="815.5" y="116" width="152" height="58" rx="10" fill="#f1ecff" stroke="#7aa0c4"/>
<text class="actor" x="891.5" y="145" text-anchor="middle" dominant-baseline="middle">ObservationRegistry</text>
<line class="lifeline" x1="891.5" y1="174" x2="891.5" y2="934"/>
<rect class="box" x="1072" y="116" width="152" height="58" rx="10" fill="#fdecef" stroke="#7aa0c4"/>
<text class="actor" x="1148" y="145" text-anchor="middle" dominant-baseline="middle">Zipkin</text>
<line class="lifeline" x1="1148" y1="174" x2="1148" y2="934"/>
<rect x="78" y="188" width="344.5" height="24" rx="6" fill="#ffffff" opacity="0.92" stroke="#dbe3ee"/>
<text class="message" x="250.25" y="201" text-anchor="middle" dominant-baseline="middle">1. GET /coroutine/todo/1</text>
<path class="call" d="M122 218 L378.5 218"/>
<rect x="425" y="242" width="420" height="24" rx="6" fill="#ffffff" opacity="0.92" stroke="#dbe3ee"/>
<text class="message" x="635" y="255" text-anchor="middle" dominant-baseline="middle">2. create root span (HTTP server)</text>
<path class="call" d="M378.5 272 L891.5 272"/>
<rect x="334.5" y="296" width="344.5" height="24" rx="6" fill="#ffffff" opacity="0.92" stroke="#dbe3ee"/>
<text class="message" x="506.75" y="309" text-anchor="middle" dominant-baseline="middle">3. getTodo(1)</text>
<path class="call" d="M378.5 326 L635 326"/>
<rect x="591" y="350" width="344.5" height="24" rx="6" fill="#ffffff" opacity="0.92" stroke="#dbe3ee"/>
<text class="message" x="763.25" y="356" text-anchor="middle" dominant-baseline="middle">4.</text>
<text class="message" x="763.25" y="370" text-anchor="middle" dominant-baseline="middle">withObservationSuspending(&quot;pre-processing&quot;)</text>
<path class="call" d="M635 380 L891.5 380"/>
<rect x="551" y="416" width="168" height="34" rx="8" fill="#fff8dc" stroke="#e7c86b" stroke-dasharray="5 4"/>
<text class="message" x="635" y="426" text-anchor="middle" dominant-baseline="middle">delay(200) - suspension</text>
<text class="message" x="635" y="440" text-anchor="middle" dominant-baseline="middle">point</text>
<rect x="551" y="470" width="168" height="34" rx="8" fill="#fff8dc" stroke="#e7c86b" stroke-dasharray="5 4"/>
<text class="message" x="635" y="480" text-anchor="middle" dominant-baseline="middle">resumes (may be</text>
<text class="message" x="635" y="494" text-anchor="middle" dominant-baseline="middle">different thread)</text>
<rect x="591" y="512" width="344.5" height="24" rx="6" fill="#ffffff" opacity="0.92" stroke="#dbe3ee"/>
<text class="message" x="763.25" y="525" text-anchor="middle" dominant-baseline="middle">7. pre-processing span closed</text>
<path class="return" d="M891.5 542 L635 542"/>
<rect x="591" y="566" width="344.5" height="24" rx="6" fill="#ffffff" opacity="0.92" stroke="#dbe3ee"/>
<text class="message" x="763.25" y="572" text-anchor="middle" dominant-baseline="middle">8.</text>
<text class="message" x="763.25" y="586" text-anchor="middle" dominant-baseline="middle">withObservationSuspending(&quot;get-todo-by-id&quot;)</text>
<path class="call" d="M635 596 L891.5 596"/>
<rect x="681.5" y="620" width="420" height="24" rx="6" fill="#ffffff" opacity="0.92" stroke="#dbe3ee"/>
<text class="message" x="891.5" y="633" text-anchor="middle" dominant-baseline="middle">9. (exported after span close)</text>
<path class="call" d="M635 650 L1148 650"/>
<rect x="591" y="674" width="344.5" height="24" rx="6" fill="#ffffff" opacity="0.92" stroke="#dbe3ee"/>
<text class="message" x="763.25" y="687" text-anchor="middle" dominant-baseline="middle">10. get-todo-by-id span closed</text>
<path class="return" d="M891.5 704 L635 704"/>
<rect x="591" y="728" width="344.5" height="24" rx="6" fill="#ffffff" opacity="0.92" stroke="#dbe3ee"/>
<text class="message" x="763.25" y="734" text-anchor="middle" dominant-baseline="middle">11.</text>
<text class="message" x="763.25" y="748" text-anchor="middle" dominant-baseline="middle">withObservationSuspending(&quot;post-processing&quot;)</text>
<path class="call" d="M635 758 L891.5 758"/>
<rect x="425" y="782" width="420" height="24" rx="6" fill="#ffffff" opacity="0.92" stroke="#dbe3ee"/>
<text class="message" x="635" y="795" text-anchor="middle" dominant-baseline="middle">12. all child spans closed</text>
<path class="return" d="M891.5 812 L378.5 812"/>
<rect x="78" y="836" width="344.5" height="24" rx="6" fill="#ffffff" opacity="0.92" stroke="#dbe3ee"/>
<text class="message" x="250.25" y="849" text-anchor="middle" dominant-baseline="middle">13. 200 OK + Todo JSON</text>
<path class="return" d="M378.5 866 L122 866"/>
</svg>
