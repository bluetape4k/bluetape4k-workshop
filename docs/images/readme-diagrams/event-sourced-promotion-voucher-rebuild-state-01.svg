<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1100" viewBox="0 0 1800 1100" role="img" aria-labelledby="title desc"><title id="title">Projection Rebuild Generation State</title><desc id="desc">Fenced rebuild generation transitions, validation, active pointer swap, cancellation, retryable failure resume, and retained audit history.</desc><defs>
  <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#64748B" flood-opacity="0.14"/></filter>
  <style>
    .bg{fill:#F8FAFC}.frame{fill:#FFFFFF;stroke:#CBD5E1;stroke-width:2}.layer{stroke-width:2}.blueLayer{fill:#EFF6FF;stroke:#A8C7EA}.greenLayer{fill:#F1F8F1;stroke:#B8D7AE}.amberLayer{fill:#FFF8EA;stroke:#DFC69A}.purpleLayer{fill:#F8F3FF;stroke:#D7C3EF}
    .title{font-family:"Architects Daughter";font-size:42px;fill:#263238}.subtitle,.body,.small,.footer,.msg,.legend{font-family:"Comic Mono";fill:#3E4C59}.subtitle{font-size:18px}.body{font-size:16px}.small{font-size:13px;fill:#5B6975}.footer{font-size:14px;fill:#60727D}.layerTitle{font-family:"Architects Daughter";font-size:27px;fill:#344154}.cardTitle,.participant,.state{font-family:"Architects Daughter";font-size:23px;fill:#16202A}
    .card{fill:#FFFFFF;stroke:#9FB0BC;stroke-width:2}.blueCard{fill:#EFF6FF;stroke:#4F86C6}.greenCard{fill:#F1F8F1;stroke:#6E8F4F}.amberCard{fill:#FFF8EA;stroke:#9B7D54}.redCard{fill:#FFF0F0;stroke:#B86868}.purpleCard{fill:#F8F3FF;stroke:#8065A8}
    .connector{fill:none;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round}.blueEdge{stroke:#4F86C6;marker-end:url(#arrow-blue)}.greenEdge{stroke:#6E8F4F;marker-end:url(#arrow-green)}.amberEdge{stroke:#9B7D54;marker-end:url(#arrow-amber)}.redEdge{stroke:#B86868;marker-end:url(#arrow-red)}.purpleEdge{stroke:#8065A8;marker-end:url(#arrow-purple)}.tealEdge{stroke:#2D948C;marker-end:url(#arrow-teal)}.dashed{stroke-dasharray:9 7}
    .lifeline{stroke:#9AAAB1;stroke-width:2;stroke-dasharray:7 8}.activation{fill:#EAF6EF;stroke:#6F9278;stroke-width:1.5}.label{fill:#FFFFFF;stroke:#D7E0E4;stroke-width:1.5}.badge{font-family:"Comic Mono";font-size:13px;font-weight:700}
  </style>
  <marker id="arrow-blue" viewBox="0 0 10 10" markerWidth="14" markerHeight="14" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#4F86C6" stroke="#4F86C6" stroke-dasharray="none"/></marker><marker id="arrow-green" viewBox="0 0 10 10" markerWidth="14" markerHeight="14" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#6E8F4F" stroke="#6E8F4F" stroke-dasharray="none"/></marker><marker id="arrow-amber" viewBox="0 0 10 10" markerWidth="14" markerHeight="14" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#9B7D54" stroke="#9B7D54" stroke-dasharray="none"/></marker><marker id="arrow-red" viewBox="0 0 10 10" markerWidth="14" markerHeight="14" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#B86868" stroke="#B86868" stroke-dasharray="none"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" markerWidth="14" markerHeight="14" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#8065A8" stroke="#8065A8" stroke-dasharray="none"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" markerWidth="14" markerHeight="14" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#2D948C" stroke="#2D948C" stroke-dasharray="none"/></marker>
  </defs><rect class="bg" width="1800" height="1100"/><text class="title" x="900" y="66" text-anchor="middle">Projection Rebuild - Candidate Before Pointer Swap</text><text class="subtitle" x="900" y="102" text-anchor="middle">The current ACTIVE generation remains readable until a candidate reaches its target and passes digest validation.</text>
  <rect class="layer blueLayer" x="80" y="145" width="1640" height="330" rx="22"/><text class="layerTitle" x="115" y="190">Normal activation path</text>
  <g class="node" data-node="building" filter="url(#shadow)"><rect class="card blueCard" x="135" y="280" width="300" height="105" rx="16"/><text class="cardTitle" x="285" y="315" text-anchor="middle">BUILDING</text><text class="body" x="285" y="342" text-anchor="middle">fenced replay</text><text class="body" x="285" y="365" text-anchor="middle">fixed target position</text></g>
  <g class="node" data-node="validating" filter="url(#shadow)"><rect class="card amberCard" x="575" y="280" width="300" height="105" rx="16"/><text class="cardTitle" x="725" y="315" text-anchor="middle">VALIDATING</text><text class="body" x="725" y="342" text-anchor="middle">position reached</text><text class="body" x="725" y="365" text-anchor="middle">canonical digest check</text></g>
  <g class="node" data-node="active" filter="url(#shadow)"><rect class="card greenCard" x="1015" y="280" width="300" height="105" rx="16"/><text class="cardTitle" x="1165" y="315" text-anchor="middle">ACTIVE</text><text class="body" x="1165" y="342" text-anchor="middle">CAS generation pointer</text><text class="body" x="1165" y="365" text-anchor="middle">serves query and SSE</text></g>
  <g class="node" data-node="retired" filter="url(#shadow)"><rect class="card purpleCard" x="1455" y="280" width="220" height="105" rx="16"/><text class="cardTitle" x="1565" y="315" text-anchor="middle">RETIRED</text><text class="body" x="1565" y="342" text-anchor="middle">audit retention</text><text class="body" x="1565" y="365" text-anchor="middle">no new writes</text></g>
  <path data-connector="building-validating" class="connector greenEdge" d="M435 332 L575 332"/>
  <path data-connector="validating-active" class="connector greenEdge" d="M875 332 L1015 332"/>
  <path data-connector="active-retired" class="connector purpleEdge" d="M1315 332 L1455 332"/>
  <rect class="layer amberLayer" x="80" y="535" width="1640" height="390" rx="22"/><text class="layerTitle" x="115" y="580">Cancellation, failure, and recovery</text>
  <g class="node" data-node="cancelling" filter="url(#shadow)"><rect class="card amberCard" x="145" y="690" width="280" height="105" rx="16"/><text class="cardTitle" x="285" y="725" text-anchor="middle">CANCELLING</text><text class="body" x="285" y="752" text-anchor="middle">increment cancellation revision</text><text class="body" x="285" y="775" text-anchor="middle">reject stale worker</text></g>
  <g class="node" data-node="cancelled" filter="url(#shadow)"><rect class="card redCard" x="535" y="690" width="280" height="105" rx="16"/><text class="cardTitle" x="675" y="725" text-anchor="middle">CANCELLED</text><text class="body" x="675" y="752" text-anchor="middle">checkpoint retained</text><text class="body" x="675" y="775" text-anchor="middle">start a new rebuild</text></g>
  <g class="node" data-node="failed" filter="url(#shadow)"><rect class="card redCard" x="925" y="690" width="280" height="105" rx="16"/><text class="cardTitle" x="1065" y="725" text-anchor="middle">FAILED</text><text class="body" x="1065" y="752" text-anchor="middle">poison or validation gap</text><text class="body" x="1065" y="775" text-anchor="middle">retryable resumes BUILDING</text></g>
  <g class="node" data-node="still-active" filter="url(#shadow)"><rect class="card greenCard" x="1315" y="690" width="300" height="105" rx="16"/><text class="cardTitle" x="1465" y="725" text-anchor="middle">CURRENT ACTIVE</text><text class="body" x="1465" y="752" text-anchor="middle">pointer unchanged</text><text class="body" x="1465" y="775" text-anchor="middle">read availability preserved</text></g>
  <path data-connector="building-cancelling" class="connector amberEdge" d="M285 385 L285 690"/>
  <path data-connector="cancelling-cancelled" class="connector redEdge" d="M425 742 L535 742"/>
  <path data-connector="validating-failed" class="connector redEdge" d="M725 385 L725 510 Q 725 525 740 525 L1050 525 Q 1065 525 1065 540 L1065 690"/>
  <path data-connector="failed-active-preserved" class="connector greenEdge dashed" d="M1205 742 L1315 742"/>
  <rect class="frame" x="180" y="965" width="1440" height="70" rx="15"/><text class="body" x="900" y="994" text-anchor="middle">All mutation endpoints require X-Expected-Generation-Token; stale tokens return 412 and cannot move the active pointer.</text><text class="small" x="900" y="1022" text-anchor="middle">Replace a bad active generation with a new validated rebuild; immutable event rows are never edited.</text></svg>