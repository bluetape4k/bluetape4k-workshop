<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-label="WebFlux Coroutines Dispatcher Strategies">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#1f2937" flood-opacity="0.10"/></filter>
  <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth">
    <path d="M1,1 L8,4.5 L1,8 Z" fill="#758297"/>
  </marker>
  <style>
    .canvas{fill:#f7f9fc}.frame{fill:#fff;stroke:#d8e0ea;stroke-width:1.5}
    .title{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:38px;font-weight:400;fill:#102033}
    .subtitle{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:14px;font-weight:400;fill:#536273}
    .smallLabel{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:21px;font-weight:400;fill:#102033}
    .mono{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#102033}
    .small{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#536273}
    .card{stroke-width:2.1;filter:url(#shadow)}
    .line{stroke:#758297;stroke-width:2.1;fill:none;marker-end:url(#arrow)}
  </style>
</defs>
<rect class="canvas" width="960" height="560"/>
<rect class="frame" x="24" y="20" width="912" height="520" rx="22"/>

<!-- Title -->
<text class="title" x="48" y="68">WebFlux Coroutines — Dispatcher Strategies</text>
<text class="subtitle" x="52" y="92">Dispatchers.IO · VirtualThread · coRouter DSL · Netty event-loop safe</text>

<!-- ====== ROW 1: Coroutine Controllers (all @RestController on Netty) ====== -->
<text class="small" x="480" y="114" text-anchor="middle" letter-spacing="0.06em" font-size="11" fill="#758297">COROUTINE CONTROLLERS  (all @RestController on Netty)</text>

<!-- Controller 1: Default (Dispatchers.IO inferred) -->
<g transform="translate(36,122)">
  <rect class="card" x="0" y="0" width="198" height="120" rx="12" fill="#E8F3FF" stroke="#5B8DEF"/>
  <text class="smallLabel" x="99" y="26" text-anchor="middle">Default</text>
  <text class="smallLabel" x="99" y="50" text-anchor="middle">Coroutine</text>
  <text class="smallLabel" x="99" y="74" text-anchor="middle">Controller</text>
  <rect x="29" y="82" width="140" height="18" rx="9" fill="#5B8DEF"/>
  <text class="mono" x="99" y="95" text-anchor="middle" fill="#fff">Dispatchers.IO</text>
  <text class="small" x="99" y="114" text-anchor="middle">suspend fun</text>
</g>

<!-- Controller 2: IO explicit -->
<g transform="translate(264,122)">
  <rect class="card" x="0" y="0" width="198" height="120" rx="12" fill="#EAF7EF" stroke="#58A978"/>
  <text class="smallLabel" x="99" y="26" text-anchor="middle">IO Coroutine</text>
  <text class="smallLabel" x="99" y="50" text-anchor="middle">Controller</text>
  <rect x="25" y="60" width="148" height="18" rx="9" fill="#58A978"/>
  <text class="mono" x="99" y="73" text-anchor="middle" fill="#fff">Dispatchers.IO explicit</text>
  <text class="small" x="99" y="96" text-anchor="middle">withContext(Dispatchers.IO)</text>
  <text class="small" x="99" y="112" text-anchor="middle">blocking I/O safe</text>
</g>

<!-- Controller 3: VirtualThread -->
<g transform="translate(492,122)">
  <rect class="card" x="0" y="0" width="198" height="120" rx="12" fill="#FFF3D9" stroke="#D6A441"/>
  <text class="smallLabel" x="99" y="26" text-anchor="middle">VT Coroutine</text>
  <text class="smallLabel" x="99" y="50" text-anchor="middle">Controller</text>
  <rect x="19" y="60" width="160" height="18" rx="9" fill="#D6A441"/>
  <text class="mono" x="99" y="73" text-anchor="middle" fill="#fff">VirtualThread Dispatcher</text>
  <text class="small" x="99" y="96" text-anchor="middle">Executors.newVirtualThread</text>
  <text class="small" x="99" y="112" text-anchor="middle">ThreadPerTaskExecutor</text>
</g>

<!-- Controller 4: coRouter -->
<g transform="translate(720,122)">
  <rect class="card" x="0" y="0" width="204" height="120" rx="12" fill="#F1ECFF" stroke="#8A72D6"/>
  <text class="smallLabel" x="102" y="26" text-anchor="middle">Coroutine</text>
  <text class="smallLabel" x="102" y="50" text-anchor="middle">Handler</text>
  <rect x="31" y="60" width="140" height="18" rx="9" fill="#8A72D6"/>
  <text class="mono" x="102" y="73" text-anchor="middle" fill="#fff">coRouter DSL</text>
  <text class="small" x="102" y="96" text-anchor="middle">coRouter { GET("/...") { } }</text>
  <text class="small" x="102" y="112" text-anchor="middle">functional endpoint</text>
</g>

<!-- ====== ROW 2: Dispatcher / Thread Pools ====== -->
<text class="small" x="480" y="278" text-anchor="middle" letter-spacing="0.06em" font-size="11" fill="#758297">DISPATCHER / THREAD POOLS</text>

<!-- Dispatchers.IO pool (covers two controllers) -->
<g transform="translate(36,286)">
  <rect class="card" x="0" y="0" width="426" height="100" rx="14" fill="#EAF7EF" stroke="#58A978"/>
  <text class="smallLabel" x="213" y="30" text-anchor="middle">Dispatchers.IO</text>
  <text class="small" x="213" y="54" text-anchor="middle">Thread pool for blocking I/O · kotlinx.coroutines</text>
  <text class="small" x="213" y="74" text-anchor="middle">Default + IO Coroutine controllers both delegate here</text>
  <text class="mono" x="213" y="92" text-anchor="middle" fill="#58A978">64 threads · shared pool</text>
</g>

<!-- Virtual Threads pool -->
<g transform="translate(492,286)">
  <rect class="card" x="0" y="0" width="198" height="100" rx="14" fill="#FFF3D9" stroke="#D6A441"/>
  <text class="smallLabel" x="99" y="30" text-anchor="middle">Virtual Threads</text>
  <text class="small" x="99" y="54" text-anchor="middle">JDK 21+ Loom</text>
  <text class="small" x="99" y="74" text-anchor="middle">one thread per task</text>
  <text class="mono" x="99" y="92" text-anchor="middle" fill="#D6A441">no carrier pinning</text>
</g>

<!-- Netty Event Loop -->
<g transform="translate(720,286)">
  <rect class="card" x="0" y="0" width="204" height="100" rx="14" fill="#F1ECFF" stroke="#8A72D6"/>
  <text class="smallLabel" x="102" y="30" text-anchor="middle">Netty Event Loop</text>
  <text class="small" x="102" y="54" text-anchor="middle">WebFlux reactor-netty</text>
  <text class="small" x="102" y="74" text-anchor="middle">non-blocking NIO</text>
  <text class="mono" x="102" y="92" text-anchor="middle" fill="#8A72D6">async suspend bridge</text>
</g>

<!-- ====== Arrows: Controllers → Dispatchers (orthogonal) ====== -->
<!-- Default → Dispatchers.IO (straight down) -->
<path class="line" d="M135,242 L135,286"/>
<!-- IO explicit → Dispatchers.IO (down then left) -->
<path class="line" d="M363,242 L363,268 L249,268 L249,286"/>
<!-- VT → VirtualThread pool (straight down) -->
<path class="line" d="M591,242 L591,286"/>
<!-- coRouter → Netty (straight down) -->
<path class="line" d="M822,242 L822,286"/>

<!-- ====== ROW 3: Footer advice ====== -->
<g transform="translate(36,418)">
  <rect class="card" x="0" y="0" width="888" height="92" rx="14" fill="#fff" stroke="#d8e0ea"/>
  <text class="smallLabel" x="444" y="28" text-anchor="middle">Choose the Right Dispatcher</text>
  <text class="small" x="56" y="52" text-anchor="start">Default  </text>
  <text class="mono" x="120" y="52" text-anchor="start">suspend fun with standard Dispatchers.IO — simplest, idiomatic coroutines</text>
  <text class="small" x="56" y="68" text-anchor="start">IO explicit  </text>
  <text class="mono" x="132" y="68" text-anchor="start">withContext(Dispatchers.IO) — explicit blocking I/O isolation within suspend</text>
  <text class="small" x="56" y="84" text-anchor="start">VT  </text>
  <text class="mono" x="82" y="84" text-anchor="start">virtual thread dispatcher — blocking-friendly, Java 21+ Loom integration</text>
</g>

<!-- ====== Footer band (teal) ====== -->
<g transform="translate(36,522)">
  <rect x="0" y="0" width="888" height="28" rx="12" fill="#E9F7F6" stroke="#45A7A1" stroke-width="1.5"/>
  <text class="small" x="444" y="18" text-anchor="middle">All controllers run on Netty NIO event loop · suspend bridges to correct dispatcher · coRouter uses functional DSL style</text>
</g>
</svg>
