<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1378 540" width="1378" height="540">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="2" dy="4" stdDeviation="5" flood-color="#1f2937" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <polygon points="1,1 8,4.5 1,8" fill="#6b7280"/>
    </marker>
    <marker id="arrow-blue" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <polygon points="1,1 8,4.5 1,8" fill="#3b82f6"/>
    </marker>
    <marker id="arrow-green" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <polygon points="1,1 8,4.5 1,8" fill="#059669"/>
    </marker>
    <marker id="arrow-purple" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <polygon points="1,1 8,4.5 1,8" fill="#7c3aed"/>
    </marker>
    <marker id="arrow-amber" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <polygon points="1,1 8,4.5 1,8" fill="#d97706"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1378" height="540" fill="#f6f9fc"/>
  <rect x="20" y="20" width="1338" height="500" rx="16" fill="#fff" stroke="#d7e2ec" stroke-width="1.5"/>

  <!-- Title -->
  <text x="48" y="56" font-family="'Architects Daughter', cursive" font-size="28" fill="#1e293b">WebFlux Coroutines — Dispatcher Strategies</text>
  <text x="48" y="76" font-family="'Comic Sans MS', cursive" font-size="13" fill="#536476">Dispatchers.IO · VirtualThread · coRouter DSL · Netty event-loop safe</text>

  <!-- ── Top row label ── -->
  <text x="689" y="97" font-family="'Architects Daughter', cursive" font-size="11" fill="#94a3b8" text-anchor="middle" letter-spacing="0.08em">COROUTINE CONTROLLERS (all @RestController on Netty)</text>

  <!-- ── Controller 1: Default (Dispatchers.IO inferred) ── -->
  <rect x="36" y="102" width="290" height="120" rx="12" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.8" filter="url(#shadow)"/>
  <text x="181" y="130" font-family="'Architects Daughter', cursive" font-size="15" fill="#1e3a5f" text-anchor="middle">Default</text>
  <text x="181" y="148" font-family="'Architects Daughter', cursive" font-size="15" fill="#1e3a5f" text-anchor="middle">Coroutine</text>
  <text x="181" y="166" font-family="'Architects Daughter', cursive" font-size="15" fill="#1e3a5f" text-anchor="middle">Controller</text>
  <rect x="86" y="177" width="190" height="18" rx="9" fill="#3b82f6"/>
  <text x="181" y="190" font-family="'Comic Sans MS', cursive" font-size="11" fill="#fff" text-anchor="middle">Dispatchers.IO (default)</text>
  <text x="181" y="213" font-family="'Comic Sans MS', cursive" font-size="11" fill="#3b82f6" text-anchor="middle">suspend fun → coroutineScope</text>

  <!-- ── Controller 2: IO Coroutine ── -->
  <rect x="356" y="102" width="290" height="120" rx="12" fill="#d1fae5" stroke="#059669" stroke-width="1.8" filter="url(#shadow)"/>
  <text x="501" y="130" font-family="'Architects Daughter', cursive" font-size="15" fill="#064e3b" text-anchor="middle">IO Coroutine</text>
  <text x="501" y="148" font-family="'Architects Daughter', cursive" font-size="15" fill="#064e3b" text-anchor="middle">Controller</text>
  <rect x="401" y="163" width="200" height="18" rx="9" fill="#059669"/>
  <text x="501" y="176" font-family="'Comic Sans MS', cursive" font-size="11" fill="#fff" text-anchor="middle">Dispatchers.IO explicit</text>
  <text x="501" y="199" font-family="'Comic Sans MS', cursive" font-size="11" fill="#059669" text-anchor="middle">withContext(Dispatchers.IO)</text>
  <text x="501" y="216" font-family="'Comic Sans MS', cursive" font-size="11" fill="#059669" text-anchor="middle">blocking I/O safe</text>

  <!-- ── Controller 3: VirtualThread ── -->
  <rect x="676" y="102" width="290" height="120" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="1.8" filter="url(#shadow)"/>
  <text x="821" y="130" font-family="'Architects Daughter', cursive" font-size="15" fill="#78350f" text-anchor="middle">VT Coroutine</text>
  <text x="821" y="148" font-family="'Architects Daughter', cursive" font-size="15" fill="#78350f" text-anchor="middle">Controller</text>
  <rect x="731" y="163" width="180" height="18" rx="9" fill="#d97706"/>
  <text x="821" y="176" font-family="'Comic Sans MS', cursive" font-size="11" fill="#fff" text-anchor="middle">VirtualThread Dispatcher</text>
  <text x="821" y="199" font-family="'Comic Sans MS', cursive" font-size="11" fill="#d97706" text-anchor="middle">Executors.newVirtualThread</text>
  <text x="821" y="216" font-family="'Comic Sans MS', cursive" font-size="11" fill="#d97706" text-anchor="middle">ThreadPerTaskExecutor</text>

  <!-- ── Controller 4: coRouter ── -->
  <rect x="996" y="102" width="346" height="120" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.8" filter="url(#shadow)"/>
  <text x="1169" y="130" font-family="'Architects Daughter', cursive" font-size="15" fill="#3b0764" text-anchor="middle">Coroutine</text>
  <text x="1169" y="148" font-family="'Architects Daughter', cursive" font-size="15" fill="#3b0764" text-anchor="middle">Handler</text>
  <rect x="1079" y="163" width="180" height="18" rx="9" fill="#7c3aed"/>
  <text x="1169" y="176" font-family="'Comic Sans MS', cursive" font-size="11" fill="#fff" text-anchor="middle">coRouter DSL</text>
  <text x="1169" y="199" font-family="'Comic Sans MS', cursive" font-size="11" fill="#7c3aed" text-anchor="middle">coRouter { GET("/...") { } }</text>
  <text x="1169" y="216" font-family="'Comic Sans MS', cursive" font-size="11" fill="#7c3aed" text-anchor="middle">functional endpoint</text>

  <!-- ── Bottom row label ── -->
  <text x="689" y="268" font-family="'Architects Daughter', cursive" font-size="11" fill="#94a3b8" text-anchor="middle" letter-spacing="0.08em">DISPATCHER / THREAD POOLS</text>

  <!-- Dispatchers.IO pool -->
  <rect x="36" y="274" width="620" height="100" rx="14" fill="#ecfdf5" stroke="#10b981" stroke-width="1.8" filter="url(#shadow)"/>
  <text x="346" y="310" font-family="'Architects Daughter', cursive" font-size="19" fill="#064e3b" text-anchor="middle">Dispatchers.IO</text>
  <text x="346" y="332" font-family="'Comic Sans MS', cursive" font-size="12" fill="#536476" text-anchor="middle">Thread pool for blocking I/O · kotlinx.coroutines</text>
  <text x="346" y="352" font-family="'Comic Sans MS', cursive" font-size="12" fill="#10b981" text-anchor="middle">Default + IO Coroutine controllers both delegate here</text>

  <!-- VirtualThread pool -->
  <rect x="676" y="274" width="290" height="100" rx="14" fill="#fffbeb" stroke="#b45309" stroke-width="1.8" filter="url(#shadow)"/>
  <text x="821" y="310" font-family="'Architects Daughter', cursive" font-size="18" fill="#451a03" text-anchor="middle">Virtual Threads</text>
  <text x="821" y="330" font-family="'Comic Sans MS', cursive" font-size="12" fill="#536476" text-anchor="middle">JDK 21+ loom</text>
  <text x="821" y="350" font-family="'Comic Sans MS', cursive" font-size="12" fill="#b45309" text-anchor="middle">one thread per task</text>

  <!-- Netty Event Loop -->
  <rect x="996" y="274" width="346" height="100" rx="14" fill="#fdf4ff" stroke="#a855f7" stroke-width="1.8" filter="url(#shadow)"/>
  <text x="1169" y="310" font-family="'Architects Daughter', cursive" font-size="18" fill="#4a044e" text-anchor="middle">Netty Event Loop</text>
  <text x="1169" y="330" font-family="'Comic Sans MS', cursive" font-size="12" fill="#536476" text-anchor="middle">WebFlux reactor-netty</text>
  <text x="1169" y="350" font-family="'Comic Sans MS', cursive" font-size="12" fill="#a855f7" text-anchor="middle">non-blocking NIO</text>

  <!-- ── Arrows: Controllers → Dispatchers ── -->
  <!-- Default + IO → Dispatchers.IO -->
  <line x1="181" y1="222" x2="181" y2="274" stroke="#3b82f6" stroke-width="1.8" marker-end="url(#arrow-blue)"/>
  <line x1="501" y1="222" x2="346" y2="274" stroke="#059669" stroke-width="1.8" marker-end="url(#arrow-green)"/>
  <!-- VT → VirtualThread -->
  <line x1="821" y1="222" x2="821" y2="274" stroke="#d97706" stroke-width="1.8" marker-end="url(#arrow-amber)"/>
  <!-- coRouter → Netty -->
  <line x1="1169" y1="222" x2="1169" y2="274" stroke="#7c3aed" stroke-width="1.8" marker-end="url(#arrow-purple)"/>

  <!-- ── Footer ── -->
  <rect x="36" y="400" width="1306" height="94" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="689" y="424" font-family="'Architects Daughter', cursive" font-size="15" fill="#1e293b" text-anchor="middle">Choose the Right Dispatcher</text>

  <!-- Three rules -->
  <text x="80" y="450" font-family="'Comic Sans MS', cursive" font-size="12" fill="#536476">🔵 Default  </text>
  <text x="158" y="450" font-family="'Comic Sans MS', cursive" font-size="12" fill="#374151">suspend fun with standard Dispatchers.IO — simplest, idiomatic coroutines</text>
  <text x="80" y="468" font-family="'Comic Sans MS', cursive" font-size="12" fill="#536476">🟢 IO explicit  </text>
  <text x="172" y="468" font-family="'Comic Sans MS', cursive" font-size="12" fill="#374151">withContext(Dispatchers.IO) — explicit blocking I/O isolation within suspend</text>
  <text x="80" y="486" font-family="'Comic Sans MS', cursive" font-size="12" fill="#536476">🟡 VT  </text>
  <text x="116" y="486" font-family="'Comic Sans MS', cursive" font-size="12" fill="#374151">virtual thread dispatcher — blocking-friendly, Java 21+ Loom integration</text>
</svg>
