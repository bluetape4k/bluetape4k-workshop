<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="722" viewBox="0 0 1060 722" role="img" aria-label="Vert.x WebClient Examples Diagram 1">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#1f2937" flood-opacity="0.10"/></filter>
  <marker id="arrowBlue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M1 1 L7 4 L1 7 Z" fill="#5b8def"/></marker>
  <marker id="arrowTeal" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M1 1 L7 4 L1 7 Z" fill="#45a7a1"/></marker>
  <style>
    .canvas{fill:#f7f9fc}
    .frame{fill:#ffffff;stroke:#d8e0ea;stroke-width:1.5}
    .title{font-family:"Architects Daughter";font-size:34px;fill:#102033}
    .subtitle{font-family:"Comic Mono";font-size:13px;fill:#536273}
    .actor{font-family:"Architects Daughter";font-size:17px;fill:#102033}
    .detail{font-family:"Comic Mono";font-size:11px;fill:#536273}
    .message{font-family:"Comic Mono";font-size:12px;fill:#263445;paint-order:stroke;stroke:#ffffff;stroke-width:4px;stroke-linejoin:round}
    .branch{font-family:"Architects Daughter";font-size:15px;fill:#1f3b57}
    .lifeline{stroke:#b8c4d3;stroke-width:1.4;stroke-dasharray:7 6}
    .call{stroke:#5b8def;stroke-width:2.1;fill:none;marker-end:url(#arrowBlue)}
    .return{stroke:#45a7a1;stroke-width:2;stroke-dasharray:7 5;fill:none;marker-end:url(#arrowTeal)}
    .box{stroke-width:1.8;filter:url(#shadow)}
  </style>
</defs>
<rect class="canvas" width="1060" height="722"/>
<rect class="frame" x="24" y="20" width="1012" height="682" rx="18"/>
<text class="title" x="48" y="58">Vert.x WebClient Examples Diagram 1</text>
<text class="subtitle" x="50" y="84">sequenceDiagram rendered from the current README model; labels are separated from connector lanes</text>
<rect class="box" x="46" y="116" width="152" height="58" rx="10" fill="#e8f3ff" stroke="#7aa0c4"/>
<text class="actor" x="122" y="145" text-anchor="middle" dominant-baseline="middle">suspend caller</text>
<line class="lifeline" x1="122" y1="174" x2="122" y2="664"/>
<rect class="box" x="318" y="116" width="152" height="58" rx="10" fill="#eaf7ef" stroke="#7aa0c4"/>
<text class="actor" x="394" y="145" text-anchor="middle" dominant-baseline="middle">WebClient</text>
<line class="lifeline" x1="394" y1="174" x2="394" y2="664"/>
<rect class="box" x="590" y="116" width="152" height="58" rx="10" fill="#fff3d9" stroke="#7aa0c4"/>
<text class="actor" x="666" y="137" text-anchor="middle" dominant-baseline="middle">Vert.x</text>
<text class="actor" x="666" y="153" text-anchor="middle" dominant-baseline="middle">Future&lt;HttpResponse&gt;</text>
<line class="lifeline" x1="666" y1="174" x2="666" y2="664"/>
<rect class="box" x="862" y="116" width="152" height="58" rx="10" fill="#f1ecff" stroke="#7aa0c4"/>
<text class="actor" x="938" y="137" text-anchor="middle" dominant-baseline="middle">HTTP Server</text>
<text class="actor" x="938" y="153" text-anchor="middle" dominant-baseline="middle">(CoroutineVerticle)</text>
<line class="lifeline" x1="938" y1="174" x2="938" y2="664"/>
<rect x="78" y="188" width="360" height="24" rx="6" fill="#ffffff" opacity="0.92" stroke="#dbe3ee"/>
<text class="message" x="258" y="201" text-anchor="middle" dominant-baseline="middle">1. client.get(port, host, path).send()</text>
<path class="call" d="M122 218 L394 218"/>
<rect x="310" y="254" width="440" height="34" rx="8" fill="#fff8dc" stroke="#e7c86b" stroke-dasharray="5 4"/>
<text class="message" x="530" y="271" text-anchor="middle" dominant-baseline="middle">Returns Future&lt;HttpResponse&gt;</text>
<rect x="350" y="296" width="360" height="24" rx="6" fill="#ffffff" opacity="0.92" stroke="#dbe3ee"/>
<text class="message" x="530" y="309" text-anchor="middle" dominant-baseline="middle">3. Future (non-blocking)</text>
<path class="call" d="M394 326 L666 326"/>
<rect x="184" y="350" width="420" height="24" rx="6" fill="#ffffff" opacity="0.92" stroke="#dbe3ee"/>
<text class="message" x="394" y="363" text-anchor="middle" dominant-baseline="middle">4. .coAwait() - suspend (no thread blocked)</text>
<path class="call" d="M122 380 L666 380"/>
<rect x="622" y="404" width="360" height="24" rx="6" fill="#ffffff" opacity="0.92" stroke="#dbe3ee"/>
<text class="message" x="802" y="417" text-anchor="middle" dominant-baseline="middle">5. HTTP GET request</text>
<path class="call" d="M666 434 L938 434"/>
<rect x="622" y="458" width="360" height="24" rx="6" fill="#ffffff" opacity="0.92" stroke="#dbe3ee"/>
<text class="message" x="802" y="471" text-anchor="middle" dominant-baseline="middle">6. HTTP response</text>
<path class="return" d="M938 488 L666 488"/>
<rect x="184" y="512" width="420" height="24" rx="6" fill="#ffffff" opacity="0.92" stroke="#dbe3ee"/>
<text class="message" x="394" y="525" text-anchor="middle" dominant-baseline="middle">7. HttpResponse (resumed)</text>
<path class="return" d="M666 542 L122 542"/>
<rect x="78" y="566" width="88" height="24" rx="6" fill="#ffffff" opacity="0.92" stroke="#dbe3ee"/>
<text class="message" x="122" y="572" text-anchor="middle" dominant-baseline="middle">8. response.body()</text>
<text class="message" x="122" y="586" text-anchor="middle" dominant-baseline="middle">- direct access</text>
<path class="call" d="M122 596 L122 596"/>
</svg>
