<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="946" viewBox="0 0 1060 946" role="img" aria-label="Vert.x WebClient Examples Diagram 1">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#1f2937" flood-opacity="0.10"/></filter>
  <marker id="arrowBlue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M1 1 L7 4 L1 7 Z" fill="#5b8def"/></marker>
  <marker id="arrowTeal" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M1 1 L7 4 L1 7 Z" fill="#45a7a1"/></marker>
  <style>
    .canvas{fill:#f7f9fc}
    .frame{fill:#ffffff;stroke:#d8e0ea;stroke-width:1.5}
    .title{font-family:"Architects Daughter";font-size:34px;fill:#102033}
    .subtitle{font-family:"Comic Mono";font-size:13px;fill:#536273}
    .actor{font-family:"Architects Daughter";font-size:17px;fill:#102033}
    .detail{font-family:"Comic Mono";font-size:11px;fill:#536273}
    .message{font-family:"Comic Mono";font-size:12px;fill:#263445;paint-order:stroke;stroke:#ffffff;stroke-width:4px;stroke-linejoin:round}
    .branch{font-family:"Architects Daughter";font-size:15px;fill:#1f3b57}
    .lifeline{stroke:#b8c4d3;stroke-width:1.4;stroke-dasharray:7 6}
    .call{stroke:#5b8def;stroke-width:2.1;fill:none;marker-end:url(#arrowBlue)}
    .return{stroke:#45a7a1;stroke-width:2;stroke-dasharray:7 5;fill:none;marker-end:url(#arrowTeal)}
    .box{stroke-width:1.8;filter:url(#shadow)}
  </style>
</defs>
<rect class="canvas" width="1060" height="946"/>
<rect class="frame" x="24" y="20" width="1012" height="906" rx="18"/>
<text class="title" x="48" y="58">Vert.x WebClient Examples Diagram 1</text>
<text class="subtitle" x="50" y="84">sequenceDiagram rendered from the current README model; labels are separated from connector lanes</text>
<rect class="box" x="30" y="116" width="184" height="58" rx="10" fill="#e8f3ff" stroke="#7aa0c4"/>
<text class="actor" x="122" y="145" text-anchor="middle" dominant-baseline="middle">suspend caller</text>
<line class="lifeline" x1="122" y1="174" x2="122" y2="888"/>
<rect class="box" x="302" y="116" width="184" height="58" rx="10" fill="#eaf7ef" stroke="#7aa0c4"/>
<text class="actor" x="394" y="145" text-anchor="middle" dominant-baseline="middle">Web Client</text>
<line class="lifeline" x1="394" y1="174" x2="394" y2="888"/>
<rect class="box" x="574" y="116" width="184" height="58" rx="10" fill="#fff3d9" stroke="#7aa0c4"/>
<text class="actor" x="666" y="138" text-anchor="middle" dominant-baseline="middle">Vert.x Future&lt;Http</text>
<text class="actor" x="666" y="152" text-anchor="middle" dominant-baseline="middle">Response&gt;</text>
<line class="lifeline" x1="666" y1="174" x2="666" y2="888"/>
<rect class="box" x="846" y="116" width="184" height="58" rx="10" fill="#f1ecff" stroke="#7aa0c4"/>
<text class="actor" x="938" y="131" text-anchor="middle" dominant-baseline="middle">HTTP Server</text>
<text class="actor" x="938" y="145" text-anchor="middle" dominant-baseline="middle">(Coroutine</text>
<text class="actor" x="938" y="159" text-anchor="middle" dominant-baseline="middle">Verticle)</text>
<line class="lifeline" x1="938" y1="174" x2="938" y2="888"/>
<rect x="78" y="176" width="360" height="26" rx="6" fill="#ffffff" opacity="0.95" stroke="#dbe3ee"/>
<text class="message" x="258" y="189" text-anchor="middle" dominant-baseline="middle">1. client.get(port, host, path).send()</text>
<path class="call" d="M122 218 L394 218"/>
<rect x="310" y="282" width="440" height="34" rx="8" fill="#fff8dc" stroke="#e7c86b" stroke-dasharray="5 4"/>
<text class="message" x="530" y="299" text-anchor="middle" dominant-baseline="middle">Returns Future&lt;HttpResponse&gt;</text>
<rect x="350" y="340" width="360" height="26" rx="6" fill="#ffffff" opacity="0.95" stroke="#dbe3ee"/>
<text class="message" x="530" y="353" text-anchor="middle" dominant-baseline="middle">3. Future (non-blocking)</text>
<path class="call" d="M394 382 L666 382"/>
<rect x="184" y="422" width="420" height="26" rx="6" fill="#ffffff" opacity="0.95" stroke="#dbe3ee"/>
<text class="message" x="394" y="435" text-anchor="middle" dominant-baseline="middle">4. .coAwait() - suspend (no thread blocked)</text>
<path class="call" d="M122 464 L666 464"/>
<rect x="622" y="504" width="360" height="26" rx="6" fill="#ffffff" opacity="0.95" stroke="#dbe3ee"/>
<text class="message" x="802" y="517" text-anchor="middle" dominant-baseline="middle">5. HTTP GET request</text>
<path class="call" d="M666 546 L938 546"/>
<rect x="622" y="586" width="360" height="26" rx="6" fill="#ffffff" opacity="0.95" stroke="#dbe3ee"/>
<text class="message" x="802" y="599" text-anchor="middle" dominant-baseline="middle">6. HTTP response</text>
<path class="return" d="M938 628 L666 628"/>
<rect x="184" y="668" width="420" height="26" rx="6" fill="#ffffff" opacity="0.95" stroke="#dbe3ee"/>
<text class="message" x="394" y="681" text-anchor="middle" dominant-baseline="middle">7. HttpResponse (resumed)</text>
<path class="return" d="M666 710 L122 710"/>
<rect x="78" y="736" width="88" height="40" rx="6" fill="#ffffff" opacity="0.95" stroke="#dbe3ee"/>
<text class="message" x="122" y="749" text-anchor="middle" dominant-baseline="middle">8. response.body()</text>
<text class="message" x="122" y="763" text-anchor="middle" dominant-baseline="middle">- direct access</text>
<path class="call" d="M122 792 L122 792"/>
</svg>
