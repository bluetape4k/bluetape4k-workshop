<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="620" viewBox="0 0 1320 620" role="img" aria-label="Kotlin design patterns catalog diagram">
  <defs>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="124%"><feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#64748B" flood-opacity="0.16"/></filter>
    <style>
      .canvas{fill:#F8FAFC}.frame{fill:#fff;stroke:#D6E0E8;stroke-width:1.4}.title{font-family:"Architects Daughter";font-size:36px;fill:#102033}.subtitle{font-family:"Comic Mono";font-size:14px;fill:#51606F}.cardTitle{font-family:"Architects Daughter";font-size:27px;fill:#102033}.cardText{font-family:"Comic Mono";font-size:14px;fill:#415166}.label{font-family:"Architects Daughter";font-size:22px;fill:#172033}
    </style>
  </defs>
  <rect class="canvas" width="1320" height="620"/>
  <rect class="frame" x="24" y="24" width="1272" height="572" rx="24"/>
  <text class="title" x="660" y="66" text-anchor="middle">Kotlin design pattern examples</text>
  <text class="subtitle" x="660" y="94" text-anchor="middle">The module keeps small Kotlin implementations for creational and lifecycle-oriented design patterns.</text>

  <text class="label" x="94" y="146">Creational families</text>
  <g filter="url(#shadow)">
    <rect x="84" y="172" width="540" height="150" rx="18" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.7"/>
    <text class="cardTitle" x="354" y="216" text-anchor="middle">Abstract Factory</text>
    <text class="cardText" x="354" y="248" text-anchor="middle">FactoryMaker chooses Elf or Orc factory</text>
    <text class="cardText" x="354" y="272" text-anchor="middle">Each factory creates Castle, King, and Army</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="696" y="172" width="540" height="150" rx="18" fill="#ECFDF5" stroke="#16A34A" stroke-width="1.7"/>
    <text class="cardTitle" x="966" y="216" text-anchor="middle">Builder</text>
    <text class="cardText" x="966" y="248" text-anchor="middle">Hero.Builder keeps required profession and name</text>
    <text class="cardText" x="966" y="272" text-anchor="middle">Optional hair, armor, and weapon are fluent steps</text>
  </g>

  <text class="label" x="94" y="386">Lifecycle and instance control</text>
  <g filter="url(#shadow)">
    <rect x="84" y="412" width="540" height="150" rx="18" fill="#FFF7ED" stroke="#D97706" stroke-width="1.7"/>
    <text class="cardTitle" x="354" y="456" text-anchor="middle">Lazy Loading</text>
    <text class="cardText" x="354" y="488" text-anchor="middle">Native lateinit, ReentrantLock, Kotlin lazy</text>
    <text class="cardText" x="354" y="512" text-anchor="middle">Coroutine DeferredValue for suspend initialization</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="696" y="412" width="540" height="150" rx="18" fill="#F8FAFC" stroke="#64748B" stroke-width="1.7"/>
    <text class="cardTitle" x="966" y="456" text-anchor="middle">Singleton</text>
    <text class="cardText" x="966" y="488" text-anchor="middle">Enum, object, eager, lazy, holder idiom</text>
    <text class="cardText" x="966" y="512" text-anchor="middle">Lock-based variants avoid synchronized blocks</text>
  </g>
</svg>
