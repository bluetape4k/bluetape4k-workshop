<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" role="img" aria-label="Quarkus Architecture Overview">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#1f2937" flood-opacity="0.09"/></filter>
  <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth">
    <path d="M1,1 L8,4.5 L1,8 Z" fill="#758297"/>
  </marker>
  <style>
    .canvas{fill:#f7f9fc}.frame{fill:#fff;stroke:#d8e0ea;stroke-width:1.5}
    .title{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:38px;font-weight:400;fill:#102033}
    .subtitle{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:14px;font-weight:400;fill:#536273}
    .smallLabel{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:21px;font-weight:400;fill:#102033}
    .mono{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#102033}
    .small{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#536273}
    .card{stroke-width:2.1;filter:url(#shadow)}
    .line{stroke:#758297;stroke-width:2.1;fill:none;marker-end:url(#arrow)}
  </style>
</defs>
<rect class="canvas" width="960" height="440"/>
<rect class="frame" x="24" y="20" width="912" height="396" rx="20"/>

<!-- Title -->
<text class="title" x="48" y="66">Quarkus Architecture Overview</text>
<text class="subtitle" x="48" y="90">RESTEasy Reactive · Hibernate Reactive Panache · Kotlin Coroutines · Vert.x</text>

<!-- Row 1: 3-col -->
<!-- RESTEasy Reactive -->
<rect class="card" x="36" y="108" width="270" height="88" rx="14" fill="#E8F3FF" stroke="#5B8DEF"/>
<text class="smallLabel" x="171" y="138" text-anchor="middle">RESTEasy Reactive</text>
<text class="small" x="171" y="159" text-anchor="middle">@Path · @GET · @POST</text>
<text class="small" x="171" y="177" text-anchor="middle">Non-blocking REST endpoints</text>

<!-- Hibernate Reactive Panache -->
<rect class="card" x="344" y="108" width="270" height="88" rx="14" fill="#FFF3D9" stroke="#D6A441"/>
<text class="smallLabel" x="479" y="138" text-anchor="middle">Hibernate Reactive Panache</text>
<text class="small" x="479" y="159" text-anchor="middle">PanacheEntity · PanacheRepository</text>
<text class="small" x="479" y="177" text-anchor="middle">Reactive ORM · Mutiny Uni/Multi</text>

<!-- Kotlin Coroutines -->
<rect class="card" x="652" y="108" width="270" height="88" rx="14" fill="#F1ECFF" stroke="#8A72D6"/>
<text class="smallLabel" x="787" y="138" text-anchor="middle">Kotlin Coroutines</text>
<text class="small" x="787" y="159" text-anchor="middle">suspend fun · withContext</text>
<text class="small" x="787" y="177" text-anchor="middle">Coroutine-aware endpoints</text>

<!-- Row 2: Vert.x event loop + Mutiny -->
<rect class="card" x="36" y="232" width="886" height="72" rx="14" fill="#E9F7F6" stroke="#45A7A1"/>
<text class="smallLabel" x="479" y="258" text-anchor="middle">Vert.x Event Loop + Mutiny Async Model</text>
<text class="small" x="479" y="278" text-anchor="middle">Non-blocking I/O · Reactive streams · Uni&#60;T&#62; / Multi&#60;T&#62; operators</text>

<!-- Row 3: Infra -->
<rect class="card" x="36" y="336" width="886" height="64" rx="14" fill="#FDECEF" stroke="#DC6B82"/>
<text class="smallLabel" x="479" y="361" text-anchor="middle">Quarkus Runtime + GraalVM Native + Testcontainers</text>
<text class="small" x="479" y="381" text-anchor="middle">Native image · Fast startup · Automatic Devservices · PostgreSQL · Redis</text>

<!-- Arrows Row1 → Row2 -->
<line class="line" x1="171" y1="196" x2="250" y2="232"/>
<line class="line" x1="479" y1="196" x2="479" y2="232"/>
<line class="line" x1="787" y1="196" x2="710" y2="232"/>

<!-- Arrow Row2 → Row3 -->
<line class="line" x1="479" y1="304" x2="479" y2="336"/>
</svg>
