<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1760" height="900" viewBox="0 0 1760 900" role="img" aria-label="Spring WebFlux coroutine flow">
  <defs>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="124%"><feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#64748B" flood-opacity="0.15"/></filter>
    <marker id="arrowBlue" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 14 7 L 0 14 Z" fill="#2563EB" stroke-dasharray="none"/></marker>
    <marker id="arrowGreen" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 14 7 L 0 14 Z" fill="#16A34A" stroke-dasharray="none"/></marker>
    <marker id="arrowOrange" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 14 7 L 0 14 Z" fill="#EA580C" stroke-dasharray="none"/></marker>
    <style>
      .canvas{fill:#F8FAFC}.frame{fill:#FFFFFF;stroke:#D6E0E8;stroke-width:1.4}.region{fill-opacity:.58;stroke-width:1.6;rx:18}
      .title{font-family:"Architects Daughter";font-size:42px;fill:#102033}.subtitle{font-family:"Comic Mono";font-size:16px;fill:#51606F}
      .cardTitle{font-family:"Architects Daughter";font-size:30px;fill:#102033}.cardText{font-family:"Comic Mono";font-size:15px;fill:#415166}
      .life{stroke:#94A3B8;stroke-width:1.7;stroke-dasharray:8 8}.line{fill:none;stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round}.label{font-family:"Comic Mono";font-size:14px;fill:#334155}
      .noteTitle{font-family:"Architects Daughter";font-size:26px;fill:#102033}
    </style>
  </defs>
  <rect class="canvas" width="1760" height="900"/>
  <rect class="frame" x="24" y="24" width="1712" height="852" rx="26"/>
  <text class="title" x="880" y="74" text-anchor="middle">Coroutine endpoint and Flow execution</text>
  <text class="subtitle" x="880" y="108" text-anchor="middle">Direct suspend endpoints return one Banner; flow endpoints call the same suspend endpoint sequentially or through Flow.async.</text>

  <g filter="url(#shadow)"><rect x="90" y="178" width="230" height="74" rx="14" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.7"/><text class="cardTitle" x="205" y="212" text-anchor="middle">Client</text><text class="cardText" x="205" y="236" text-anchor="middle">WebTestClient or curl</text></g>
  <g filter="url(#shadow)"><rect x="465" y="168" width="310" height="94" rx="14" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.7"/><text class="cardTitle" x="620" y="202" text-anchor="middle">Endpoint style</text><text class="cardText" x="620" y="228" text-anchor="middle">controller or coRouter</text></g>
  <g filter="url(#shadow)"><rect x="910" y="168" width="310" height="94" rx="14" fill="#F0FDF4" stroke="#16A34A" stroke-width="1.7"/><text class="cardTitle" x="1065" y="202" text-anchor="middle">Coroutine scope</text><text class="cardText" x="1065" y="228" text-anchor="middle">Default, IO, VT, handler</text></g>
  <g filter="url(#shadow)"><rect x="1370" y="178" width="270" height="74" rx="14" fill="#FFF7ED" stroke="#EA580C" stroke-width="1.7"/><text class="cardTitle" x="1505" y="212" text-anchor="middle">Banner response</text><text class="cardText" x="1505" y="236" text-anchor="middle">JSON body or Flow</text></g>
  <line class="life" x1="205" y1="270" x2="205" y2="762"/>
  <line class="life" x1="620" y1="280" x2="620" y2="762"/>
  <line class="life" x1="1065" y1="280" x2="1065" y2="762"/>
  <line class="life" x1="1505" y1="270" x2="1505" y2="762"/>

  <rect class="region" x="72" y="318" width="1616" height="156" fill="#EFF6FF" stroke="#93C5FD"/>
  <text class="noteTitle" x="112" y="360">Single suspend request</text>
  <path class="line" d="M 205 408 L 620 408" stroke="#2563EB" marker-end="url(#arrowBlue)" stroke-linecap="round" stroke-linejoin="round"/>
  <text class="label" x="412" y="390" text-anchor="middle">GET /suspend or /controller/*/suspend</text>
  <path class="line" d="M 620 408 L 1065 408" stroke="#16A34A" marker-end="url(#arrowGreen)" stroke-linecap="round" stroke-linejoin="round"/>
  <text class="label" x="842" y="390" text-anchor="middle">delay and build Banner</text>
  <path class="line" d="M 1065 408 L 1505 408" stroke="#EA580C" marker-end="url(#arrowOrange)" stroke-linecap="round" stroke-linejoin="round"/>
  <text class="label" x="1285" y="390" text-anchor="middle">bodyValueAndAwait or return value</text>

  <rect class="region" x="72" y="542" width="1616" height="214" fill="#ECFDF5" stroke="#86EFAC"/>
  <text class="noteTitle" x="112" y="584">Flow request</text>
  <g filter="url(#shadow)"><rect x="420" y="624" width="260" height="70" rx="14" fill="#FFFFFF" stroke="#16A34A" stroke-width="1.7"/><text class="cardTitle" x="550" y="656" text-anchor="middle">Flow builder</text><text class="cardText" x="550" y="680" text-anchor="middle">sequential or async</text></g>
  <g filter="url(#shadow)"><rect x="815" y="624" width="280" height="70" rx="14" fill="#FFFFFF" stroke="#EA580C" stroke-width="1.7"/><text class="cardTitle" x="955" y="656" text-anchor="middle">WebClient loopback</text><text class="cardText" x="955" y="680" text-anchor="middle">httpGet("/suspend")</text></g>
  <g filter="url(#shadow)"><rect x="1235" y="624" width="250" height="70" rx="14" fill="#FFFFFF" stroke="#EA580C" stroke-width="1.7"/><text class="cardTitle" x="1360" y="656" text-anchor="middle">Flow response</text><text class="cardText" x="1360" y="680" text-anchor="middle">4 Banner items</text></g>
  <path class="line" d="M 205 659 L 420 659" stroke="#2563EB" marker-end="url(#arrowBlue)" stroke-linecap="round" stroke-linejoin="round"/>
  <text class="label" x="312" y="640" text-anchor="middle">GET /concurrent-flow</text>
  <path class="line" d="M 680 659 L 815 659" stroke="#16A34A" marker-end="url(#arrowGreen)" stroke-linecap="round" stroke-linejoin="round"/>
  <text class="label" x="748" y="640" text-anchor="middle">retrieveBanner()</text>
  <path class="line" d="M 1095 659 L 1235 659" stroke="#EA580C" marker-end="url(#arrowOrange)" stroke-linecap="round" stroke-linejoin="round"/>
  <text class="label" x="1165" y="640" text-anchor="middle">emit item</text>
</svg>
