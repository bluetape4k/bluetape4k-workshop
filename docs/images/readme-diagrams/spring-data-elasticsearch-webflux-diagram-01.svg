<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" role="img" aria-label="Elasticsearch WebFlux Architecture">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#1f2937" flood-opacity="0.10"/></filter>
  <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M1,1 L8,4.5 L1,8 Z" fill="#758297"/></marker>
  <style>
    .canvas{fill:#f7f9fc}.frame{fill:#fff;stroke:#d8e0ea;stroke-width:1.5}
    .title{font-family:"Architects Daughter";font-size:38px;font-weight:400;fill:#102033}
    .subtitle{font-family:"Comic Mono";font-size:14px;font-weight:400;fill:#536273}
    .smallLabel{font-family:"Architects Daughter";font-size:21px;font-weight:400;fill:#102033}
    .small{font-family:"Comic Mono";font-size:12px;font-weight:400;fill:#536273}
    .card{stroke-width:2.1;filter:url(#shadow)}
    .line{stroke:#758297;stroke-width:2.1;fill:none;marker-end:url(#arrow)}
  </style>
</defs>
<rect class="canvas" width="960" height="440"/>
<rect class="frame" x="24" y="20" width="912" height="396" rx="16"/>
<text class="title" x="48" y="66">Elasticsearch WebFlux Architecture</text>
<text class="subtitle" x="48" y="90">BookController → BookService → BookRepository → ReactiveElasticsearchOperations → ES</text>

<!-- Row 1: API Layer -->
<rect class="card" x="340" y="108" width="280" height="60" rx="8" fill="#FDECEF" stroke="#DC6B82"/>
<text class="smallLabel" x="480" y="136" text-anchor="middle">BookController</text>
<text class="small" x="480" y="155" text-anchor="middle">@RestController /v1/books (suspend)</text>

<!-- Row 2: Service -->
<rect class="card" x="180" y="218" width="230" height="60" rx="8" fill="#FFF3D9" stroke="#D6A441"/>
<text class="smallLabel" x="295" y="246" text-anchor="middle">BookService</text>
<text class="small" x="295" y="265" text-anchor="middle">interface (suspend)</text>

<rect class="card" x="550" y="218" width="230" height="60" rx="8" fill="#EAF7EF" stroke="#58A978"/>
<text class="smallLabel" x="665" y="246" text-anchor="middle">DefaultBookService</text>
<text class="small" x="665" y="265" text-anchor="middle">@Service implementation</text>

<!-- Row 3: Repository + Validator -->
<rect class="card" x="80" y="330" width="240" height="60" rx="8" fill="#E8F3FF" stroke="#5B8DEF"/>
<text class="smallLabel" x="200" y="358" text-anchor="middle">BookRepository</text>
<text class="small" x="200" y="377" text-anchor="middle">ReactiveElasticsearchRepo</text>

<rect class="card" x="380" y="330" width="230" height="60" rx="8" fill="#F1ECFF" stroke="#8A72D6"/>
<text class="smallLabel" x="495" y="358" text-anchor="middle">ReactiveElasticOps</text>
<text class="small" x="495" y="377" text-anchor="middle">ReactiveElasticsearchOps</text>

<rect class="card" x="670" y="330" width="220" height="60" rx="8" fill="#E9F7F6" stroke="#45A7A1"/>
<text class="smallLabel" x="780" y="358" text-anchor="middle">ES Testcontainers</text>
<text class="small" x="780" y="377" text-anchor="middle">Single node cluster</text>

<!-- Arrows -->
<!-- Controller -> Service -->
<path class="line" d="M480 168 L480 200 L315 200 L315 218"/>
<path class="line" d="M480 168 L480 200 L665 200 L665 218"/>
<!-- DefaultBookService -> BookRepository -->
<path class="line" d="M665 278 L665 312 L450 312 L450 330"/>
<!-- DefaultBookService -> ReactiveElasticOps -->
<path class="line" d="M665 278 L665 312 L495 312 L495 330"/>
<!-- BookRepository -> ES -->
<path class="line" d="M200 390 L200 408 L740 408 L780 390"/>
<!-- ReactiveElasticOps -> ES -->
<path class="line" d="M600 390 L750 390"/>
</svg>
