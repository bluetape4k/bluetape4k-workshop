<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="900" viewBox="0 0 1680 900">
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .title { font-family: 'Architects Daughter', 'Comic Sans MS', cursive; font-size: 34px; fill: #172033; }
      .layer-title { font-family: 'Architects Daughter', 'Comic Sans MS', cursive; font-size: 26px; fill: #344154; }
      .card-title { font-family: 'Architects Daughter', 'Comic Sans MS', cursive; font-size: 27px; fill: #101827; }
      .body { font-family: 'Comic Mono', 'Comic Sans MS', monospace; font-size: 18px; fill: #364152; }
      .small { font-family: 'Comic Mono', 'Comic Sans MS', monospace; font-size: 16px; fill: #4b5563; }
      .layer { stroke-width: 1.5; rx: 24; ry: 24; }
      .card { fill: #fff; stroke: #cbd5e1; stroke-width: 1.5; rx: 18; ry: 18; }
      .line { fill: none; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
    </style>
    <marker id="arrow-blue" viewBox="0 0 11.6667 11.6667" markerWidth="14" markerHeight="14" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse" data-role="primary" data-tip-direction="positive-x">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#2563eb" stroke-dasharray="none" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 11.6667 11.6667" markerWidth="14" markerHeight="14" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse" data-role="primary" data-tip-direction="positive-x">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#059669" stroke-dasharray="none" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect class="bg" width="1680" height="900"/>
  <text class="title" x="70" y="70">Vert.x Coroutine Movie Rating Service</text>

  <rect class="layer" x="70" y="120" width="1540" height="170" fill="#eff6ff" stroke="#bfdbfe"/>
  <text class="layer-title" x="105" y="165">HTTP API</text>
  <rect class="card" x="140" y="200" width="400" height="60"/>
  <text class="body" x="170" y="237">GET /movie/:id</text>
  <rect class="card" x="640" y="200" width="400" height="60"/>
  <text class="body" x="670" y="237">POST /rateMovie/:id</text>
  <rect class="card" x="1140" y="200" width="400" height="60"/>
  <text class="body" x="1170" y="237">GET /getRating/:id</text>

  <rect class="layer" x="70" y="355" width="1540" height="210" fill="#f0fdf4" stroke="#bbf7d0"/>
  <text class="layer-title" x="105" y="400">CoroutineVerticle runtime</text>
  <rect class="card" x="210" y="445" width="480" height="78"/>
  <text class="card-title" x="225" y="480">suspendHandler { }</text>
  <text class="small" x="225" y="505">route handlers stay sequential</text>
  <rect class="card" x="850" y="445" width="430" height="78"/>
  <text class="card-title" x="885" y="480">coAwait()</text>
  <text class="small" x="885" y="505">Vert.x Future -> coroutine suspension</text>
  <rect class="card" x="1320" y="445" width="230" height="78"/>
  <text class="card-title" x="1355" y="480">WebClient</text>
  <text class="small" x="1355" y="505">JUnit route checks</text>

  <rect class="layer" x="70" y="630" width="1540" height="170" fill="#fefce8" stroke="#fde68a"/>
  <text class="layer-title" x="105" y="675">In-memory movie data</text>
  <rect class="card" x="590" y="705" width="500" height="70"/>
  <g transform="translate(620 715) scale(0.34)">
    <rect x="10" y="8" width="108" height="112" rx="18" fill="#fffaf2" stroke="#28485a" stroke-width="6"/>
    <ellipse cx="64" cy="36" rx="34" ry="13" fill="#fff0d8" stroke="#8c6f33" stroke-width="6"/>
    <path d="M30 36v44c0 8 15 14 34 14s34-6 34-14V36" fill="#fff0d8" stroke="#8c6f33" stroke-width="6" stroke-linejoin="round"/>
    <path d="M30 58c0 8 15 14 34 14s34-6 34-14" fill="none" stroke="#8c6f33" stroke-width="5" stroke-linecap="round"/>
    <path d="M30 80c0 8 15 14 34 14s34-6 34-14" fill="none" stroke="#8c6f33" stroke-width="5" stroke-linecap="round"/>
  </g>
  <text class="card-title" x="685" y="738">H2 JDBCPool</text>
  <text class="small" x="685" y="762">MOVIE and RATING tables</text>

  <path class="line" d="M340 260 L340 445" stroke="#2563eb" marker-end="url(#arrow-blue)" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="line" d="M 840 260 L 840 320 Q 840 330 830 330 L 460 330 Q 450 330 450 340 L 450 445" stroke="#2563eb" marker-end="url(#arrow-blue)" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="line" d="M 1340 260 L 1340 320 Q 1340 330 1330 330 L 570 330 Q 560 330 560 340 L 560 445" stroke="#2563eb" marker-end="url(#arrow-blue)" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="line" d="M690 484 L850 484" stroke="#059669" marker-end="url(#arrow-green)" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="line" d="M 1065 523 L 1065 610 Q 1065 614 1055 614 L 960 614 Q 950 614 950 630 L 950 705" stroke="#059669" marker-end="url(#arrow-green)" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
