<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" role="img" aria-label="R2DBC Coroutines Architecture">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#1f2937" flood-opacity="0.10"/></filter>
  <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M1,1 L8,4.5 L1,8 Z" fill="#758297"/></marker>
  <style>
    .canvas{fill:#f7f9fc}.frame{fill:#fff;stroke:#d8e0ea;stroke-width:1.5}
    .title{font-family:"Architects Daughter";font-size:38px;font-weight:400;fill:#102033}
    .subtitle{font-family:"Comic Mono";font-size:14px;font-weight:400;fill:#536273}
    .smallLabel{font-family:"Architects Daughter";font-size:21px;font-weight:400;fill:#102033}
    .mono{font-family:"Comic Mono";font-size:12px;font-weight:400;fill:#102033}
    .small{font-family:"Comic Mono";font-size:12px;font-weight:400;fill:#536273}
    .card{stroke-width:2.1;filter:url(#shadow)}
    .line{stroke:#758297;stroke-width:2.1;fill:none;marker-end:url(#arrow)}
  </style>
</defs>
<rect class="canvas" width="960" height="440"/>
<rect class="frame" x="24" y="20" width="912" height="396" rx="16"/>
<text class="title" x="48" y="66">R2DBC Coroutines Architecture</text>
<text class="subtitle" x="48" y="90">PostController → PostRepository · CommentRepository · MemberRepository → H2 R2DBC</text>

<!-- Row 1: Controller layer y=108 -->
<rect class="card" x="340" y="108" width="280" height="60" rx="8" fill="#FFF3D9" stroke="#D6A441"/>
<text class="smallLabel" x="480" y="136" text-anchor="middle">PostController</text>
<text class="small" x="480" y="155" text-anchor="middle">@RestController /posts</text>

<!-- Row 2: Repository layer y=218 -->
<rect class="card" x="50" y="218" width="220" height="60" rx="8" fill="#E8F3FF" stroke="#5B8DEF"/>
<text class="smallLabel" x="160" y="248" text-anchor="middle">PostRepository</text>
<text class="small" x="160" y="267" text-anchor="middle">CoroutineCrudRepository</text>

<rect class="card" x="370" y="218" width="220" height="60" rx="8" fill="#EAF7EF" stroke="#58A978"/>
<text class="smallLabel" x="480" y="248" text-anchor="middle">CommentRepository</text>
<text class="small" x="480" y="267" text-anchor="middle">CoroutineCrudRepository</text>

<rect class="card" x="690" y="218" width="220" height="60" rx="8" fill="#FDECEF" stroke="#DC6B82"/>
<text class="smallLabel" x="800" y="248" text-anchor="middle">MemberRepository</text>
<text class="small" x="800" y="267" text-anchor="middle">CoroutineCrudRepository</text>

<!-- Row 3: Infrastructure y=340 -->
<rect class="card" x="180" y="340" width="260" height="52" rx="8" fill="#E9F7F6" stroke="#45A7A1"/>
<text class="smallLabel" x="310" y="368" text-anchor="middle">Spring Data R2DBC</text>
<text class="small" x="310" y="383" text-anchor="middle">Kotlin Coroutines support</text>

<rect class="card" x="520" y="340" width="220" height="52" rx="8" fill="#f5f5f5" stroke="#9aa3af"/>
<text class="smallLabel" x="630" y="368" text-anchor="middle">H2 R2DBC</text>
<text class="small" x="630" y="383" text-anchor="middle">In-memory database</text>

<!-- Arrows: Controller -> Repositories -->
<path class="line" d="M480 168 L480 200 L160 200 L160 218"/>
<path class="line" d="M480 168 L480 218"/>
<path class="line" d="M480 168 L480 200 L800 200 L800 218"/>

<!-- Repositories -> Spring Data R2DBC -->
<path class="line" d="M160 278 L160 322 L280 322 L280 340"/>
<path class="line" d="M480 278 L480 322 L310 322 L310 340"/>
<path class="line" d="M800 278 L800 322 L630 322 L630 340"/>

<!-- Spring Data R2DBC -> H2 -->
<path class="line" d="M440 366 L520 366"/>
</svg>
