><g class="edge" data-edge="reconcile-db" data-label="bounded read"><path data-connector="reconcile-db" class="connector amberEdge dashed" d="M1555 602 L1555 740 Q 1555 755 1540 755 L1450 755 Q 1435 755 1435 770 L1435 875"/></g>
