  </defs><rect class="bg" width="1800" height="1160"/><text class="title" x="900" y="62" text-anchor="middle">Usage Metering and Billing Ledger - Authority Map</text><text class="subtitle" x="900" y="98" text-anchor="middle">Mutable workflows are restartable; money and issued invoices are append-only PostgreSQL facts.</text>
  <rect class="layer blueLayer" x="70" y="135" width="1660" height="180" rx="22"/><text class="layerTitle" x="105" y="178">HTTP, security, and operations</text><g class="node" data-node="tenant-api" filter="url(#shadow)"><rect class="card blueCard" x="145" y="215" width="350" height="76" rx="16"/><text class="cardTitle" x="320" y="250" text-anchor="middle">Tenant API</text><text class="body" x="320" y="278" text-anchor="middle">meter, price, usage, period</text></g><g class="node" data-node="receipt" filter="url(#shadow)"><rect class="card purpleCard" x="725" y="215" width="350" height="76" rx="16"/><text class="cardTitle" x="900" y="250" text-anchor="middle">Command receipt</text><text class="body" x="900" y="278" text-anchor="middle">fingerprint, replay, takeover</text></g><g class="node" data-node="operator-api" filter="url(#shadow)"><rect class="card blueCard" x="1305" y="215" width="350" height="76" rx="16"/><text class="cardTitle" x="1480" y="250" text-anchor="middle">Operator API</text><text class="body" x="1480" y="278" text-anchor="middle">close, adjustment, reconcile</text></g>
  <rect class="layer greenLayer" x="70" y="365" width="1660" height="360" rx="22"/><text class="layerTitle" x="105" y="408">Modular business boundaries</text><g class="node" data-node="ingest" filter="url(#shadow)"><rect class="card greenCard" x="120" y="490" width="290" height="112" rx="16"/><text class="cardTitle" x="265" y="525" text-anchor="middle">Ingestion</text><text class="body" x="265" y="553" text-anchor="middle">source uniqueness</text><text class="body" x="265" y="576" text-anchor="middle">server receivedAt</text></g><g class="node" data-node="pricing" filter="url(#shadow)"><rect class="card greenCard" x="455" y="490" width="290" height="112" rx="16"/><text class="cardTitle" x="600" y="525" text-anchor="middle">Pricing</text><text class="body" x="600" y="553" text-anchor="middle">half-open timeline</text><text class="body" x="600" y="576" text-anchor="middle">occurredAt selection</text></g><g class="node" data-node="close" filter="url(#shadow)"><rect class="card greenCard" x="790" y="490" width="290" height="112" rx="16"/><text class="cardTitle" x="935" y="525" text-anchor="middle">Billing close</text><text class="body" x="935" y="553" text-anchor="middle">keyset checkpoint</text><text class="body" x="935" y="576" text-anchor="middle">fixed cutoff</text></g><g class="node" data-node="invoice" filter="url(#shadow)"><rect class="card greenCard" x="1125" y="490" width="260" height="112" rx="16"/><text class="cardTitle" x="1255" y="525" text-anchor="middle">Invoice</text><text class="body" x="1255" y="553" text-anchor="middle">immutable snapshot</text><text class="body" x="1255" y="576" text-anchor="middle">full provenance</text></g><g class="node" data-node="reconcile" filter="url(#shadow)"><rect class="card amberCard" x="1430" y="490" width="250" height="112" rx="16"/><text class="cardTitle" x="1555" y="525" text-anchor="middle">Reconcile</text><text class="body" x="1555" y="553" text-anchor="middle">read only scan</text><text class="body" x="1555" y="576" text-anchor="middle">stale-safe repair</text></g>
  <rect class="layer purpleLayer" x="70" y="780" width="1660" height="245" rx="22"/><text class="layerTitle" x="105" y="823">Single correctness authority</text><g class="node" data-node="postgres" filter="url(#shadow)"><rect class="card purpleCard" x="240" y="875" width="1320" height="100" rx="16"/><text class="cardTitle" x="900" y="910" text-anchor="middle">PostgreSQL + JetBrains Exposed + ExposedJdbcRepository</text><text class="body" x="900" y="938" text-anchor="middle">unique constraints • row locks • conditional updates • append-only ledger and invoice</text></g>
