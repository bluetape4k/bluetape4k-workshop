<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1378 620" width="1378" height="620">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="2" dy="4" stdDeviation="5" flood-color="#1f2937" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <polygon points="1,1 8,4.5 1,8" fill="#6b7280"/>
    </marker>
    <marker id="arrow-blue" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <polygon points="1,1 8,4.5 1,8" fill="#3b82f6"/>
    </marker>
    <marker id="arrow-blue-light" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <polygon points="1,1 8,4.5 1,8" fill="#93c5fd"/>
    </marker>
    <marker id="arrow-purple" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <polygon points="1,1 8,4.5 1,8" fill="#7c3aed"/>
    </marker>
    <marker id="arrow-green" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <polygon points="1,1 8,4.5 1,8" fill="#059669"/>
    </marker>
    <marker id="arrow-amber" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <polygon points="1,1 8,4.5 1,8" fill="#d97706"/>
    </marker>
    <marker id="arrow-emerald" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <polygon points="1,1 8,4.5 1,8" fill="#10b981"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1378" height="620" fill="#f6f9fc"/>
  <!-- Outer frame -->
  <rect x="20" y="20" width="1338" height="580" rx="16" fill="#fff" stroke="#d7e2ec" stroke-width="1.5"/>

  <!-- Title -->
  <text x="48" y="58" font-family="'Architects Daughter', cursive" font-size="28" fill="#1e293b">Leader Election Architecture</text>
  <text x="48" y="78" font-family="'Comic Sans MS', cursive" font-size="13" fill="#536476">Distributed leader election with Redis · bluetape4k-leader library</text>

  <!-- ── Left panel: Multiple Instances ── -->
  <rect x="36" y="100" width="240" height="368" rx="12" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="156" y="97" font-family="'Architects Daughter', cursive" font-size="11" fill="#94a3b8" text-anchor="middle" letter-spacing="0.1em">MULTIPLE INSTANCES</text>

  <!-- Instance 1 (LEADER) -->
  <rect x="52" y="112" width="208" height="84" rx="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.8" filter="url(#shadow)"/>
  <text x="156" y="148" font-family="'Architects Daughter', cursive" font-size="16" fill="#1e3a5f" text-anchor="middle">Instance 1</text>
  <text x="156" y="165" font-family="'Comic Sans MS', cursive" font-size="12" fill="#536476" text-anchor="middle">app-pod-1</text>
  <rect x="108" y="176" width="64" height="20" rx="10" fill="#10b981"/>
  <text x="140" y="190" font-family="'Comic Sans MS', cursive" font-size="12" fill="#fff" text-anchor="middle" font-weight="bold">LEADER</text>

  <!-- Instance 2 (FOLLOWER) -->
  <rect x="52" y="212" width="208" height="84" rx="10" fill="#e0f2fe" stroke="#7dd3fc" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="156" y="248" font-family="'Architects Daughter', cursive" font-size="16" fill="#1e3a5f" text-anchor="middle">Instance 2</text>
  <text x="156" y="265" font-family="'Comic Sans MS', cursive" font-size="12" fill="#536476" text-anchor="middle">app-pod-2</text>
  <rect x="98" y="276" width="80" height="20" rx="10" fill="#94a3b8"/>
  <text x="138" y="290" font-family="'Comic Sans MS', cursive" font-size="12" fill="#fff" text-anchor="middle">FOLLOWER</text>

  <!-- Instance 3 (FOLLOWER) -->
  <rect x="52" y="312" width="208" height="84" rx="10" fill="#e0f2fe" stroke="#7dd3fc" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="156" y="348" font-family="'Architects Daughter', cursive" font-size="16" fill="#1e3a5f" text-anchor="middle">Instance 3</text>
  <text x="156" y="365" font-family="'Comic Sans MS', cursive" font-size="12" fill="#536476" text-anchor="middle">app-pod-3</text>
  <rect x="98" y="376" width="80" height="20" rx="10" fill="#94a3b8"/>
  <text x="138" y="390" font-family="'Comic Sans MS', cursive" font-size="12" fill="#fff" text-anchor="middle">FOLLOWER</text>

  <!-- ── Arrows: Instances → JobService (shifted +70) ── -->
  <path d="M260,154 C300,154 385,165 408,165" stroke="#3b82f6" stroke-width="2.2" fill="none" marker-end="url(#arrow-blue)"/>
  <path d="M260,254 C300,254 385,195 408,185" stroke="#93c5fd" stroke-width="1.5" fill="none" stroke-dasharray="5 4" marker-end="url(#arrow-blue-light)"/>
  <path d="M260,354 C300,354 385,215 408,200" stroke="#93c5fd" stroke-width="1.5" fill="none" stroke-dasharray="5 4" marker-end="url(#arrow-blue-light)"/>

  <!-- ── Center: LeaderScheduledJobService (x shifted +70 → x=410) ── -->
  <rect x="410" y="112" width="272" height="104" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.8" filter="url(#shadow)"/>
  <text x="546" y="136" font-family="'Comic Sans MS', cursive" font-size="12" fill="#536476" text-anchor="middle">@Scheduled  @Service</text>
  <text x="546" y="158" font-family="'Architects Daughter', cursive" font-size="18" fill="#3b0764" text-anchor="middle">LeaderScheduled</text>
  <text x="546" y="178" font-family="'Architects Daughter', cursive" font-size="18" fill="#3b0764" text-anchor="middle">JobService</text>
  <text x="546" y="200" font-family="'Comic Sans MS', cursive" font-size="12" fill="#7c3aed" text-anchor="middle">fixed-delay: PT10S</text>

  <!-- Arrow: JobService → Elector -->
  <line x1="546" y1="216" x2="546" y2="260" stroke="#7c3aed" stroke-width="1.8" marker-end="url(#arrow-purple)"/>

  <!-- LettuceLeaderElector (x=410) -->
  <rect x="410" y="262" width="272" height="84" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.8" filter="url(#shadow)"/>
  <text x="546" y="290" font-family="'Architects Daughter', cursive" font-size="17" fill="#3b0764" text-anchor="middle">LettuceLeaderElector</text>
  <text x="546" y="312" font-family="'Comic Sans MS', cursive" font-size="12" fill="#536476" text-anchor="middle">runIfLeader(lockName) { ... }</text>
  <text x="546" y="330" font-family="'Comic Sans MS', cursive" font-size="12" fill="#536476" text-anchor="middle">bluetape4k-leader</text>

  <!-- ── Arrows: Elector → Jobs ── -->
  <path d="M492,346 Q450,380 438,394" stroke="#059669" stroke-width="1.5" fill="none" stroke-dasharray="5 4" marker-end="url(#arrow-green)"/>
  <path d="M600,346 Q645,380 656,394" stroke="#059669" stroke-width="1.5" fill="none" stroke-dasharray="5 4" marker-end="url(#arrow-green)"/>

  <!-- CacheWarmupJob (x=340, clear of left panel right edge 276) -->
  <rect x="340" y="396" width="192" height="76" rx="10" fill="#d1fae5" stroke="#059669" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="436" y="420" font-family="'Architects Daughter', cursive" font-size="15" fill="#064e3b" text-anchor="middle">CacheWarmupJob</text>
  <text x="436" y="439" font-family="'Comic Sans MS', cursive" font-size="11" fill="#536476" text-anchor="middle">lock: cache-warmup</text>
  <text x="436" y="455" font-family="'Comic Sans MS', cursive" font-size="11" fill="#536476" text-anchor="middle">LeaderGuardedJob</text>

  <!-- StaleWorkflowCleanupJob (x=548) -->
  <rect x="548" y="396" width="216" height="76" rx="10" fill="#d1fae5" stroke="#059669" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="656" y="418" font-family="'Architects Daughter', cursive" font-size="15" fill="#064e3b" text-anchor="middle">StaleWorkflow</text>
  <text x="656" y="436" font-family="'Architects Daughter', cursive" font-size="15" fill="#064e3b" text-anchor="middle">CleanupJob</text>
  <text x="656" y="455" font-family="'Comic Sans MS', cursive" font-size="11" fill="#536476" text-anchor="middle">lock: stale-cleanup</text>

  <!-- ── Arrow: Elector → Redis ── -->
  <path d="M682,304 C750,304 790,292 828,286" stroke="#d97706" stroke-width="2" fill="none" marker-end="url(#arrow-amber)"/>
  <text x="752" y="297" font-family="'Comic Sans MS', cursive" font-size="11" fill="#d97706" text-anchor="middle">SET NX EX</text>

  <!-- Arrow: Redis → Elector (return) -->
  <path d="M828,300 C790,308 750,316 684,318" stroke="#10b981" stroke-width="1.5" fill="none" stroke-dasharray="4 4" marker-end="url(#arrow-emerald)"/>
  <text x="754" y="332" font-family="'Comic Sans MS', cursive" font-size="11" fill="#10b981" text-anchor="middle">OK (Instance 1)</text>
  <text x="754" y="347" font-family="'Comic Sans MS', cursive" font-size="11" fill="#ef4444" text-anchor="middle">FAIL (others)</text>

  <!-- ── Redis ── -->
  <rect x="830" y="240" width="228" height="132" rx="14" fill="#fed7aa" stroke="#d97706" stroke-width="1.8" filter="url(#shadow)"/>
  <circle cx="944" cy="274" r="18" fill="#d97706" opacity="0.2"/>
  <text x="944" y="280" font-size="18" fill="#92400e" text-anchor="middle">&#9881;</text>
  <text x="944" y="308" font-family="'Architects Daughter', cursive" font-size="18" fill="#92400e" text-anchor="middle">Redis</text>
  <text x="944" y="326" font-family="'Comic Sans MS', cursive" font-size="12" fill="#536476" text-anchor="middle">Single-Key Distributed Lock</text>
  <text x="944" y="344" font-family="'Comic Sans MS', cursive" font-size="12" fill="#374151" text-anchor="middle">SET {lockName} NX EX {ttl}</text>

  <!-- ── Footer ── -->
  <rect x="36" y="510" width="1306" height="56" rx="10" fill="#f0fdf4" stroke="#86efac" stroke-width="1.2"/>
  <text x="689" y="534" font-family="'Architects Daughter', cursive" font-size="15" fill="#166534" text-anchor="middle">Exactly ONE instance executes each job at any time</text>
  <text x="689" y="552" font-family="'Comic Sans MS', cursive" font-size="12" fill="#536476" text-anchor="middle">All instances run the scheduler; only the leader wins the Redis lock and calls execute()</text>
</svg>
