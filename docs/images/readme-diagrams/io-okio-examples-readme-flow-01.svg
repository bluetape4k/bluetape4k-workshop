<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="760" viewBox="0 0 1320 760" role="img" aria-label="Okio examples stream flow diagram">
  <defs>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="124%"><feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#64748B" flood-opacity="0.18"/></filter>
    <marker id="arrowGreen" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 12 6 L 0 12 Z" fill="#16A34A" stroke-dasharray="none"/></marker>
    <marker id="arrowBlue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 12 6 L 0 12 Z" fill="#2563EB" stroke-dasharray="none"/></marker>
    <marker id="arrowAmber" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 12 6 L 0 12 Z" fill="#C47A12" stroke-dasharray="none"/></marker>
    <style>
      .canvas { fill: #F8FAFC; }
      .frame { fill: #FFFFFF; stroke: #D6E0E8; stroke-width: 1.4; }
      .title { font-family: "Architects Daughter"; font-size: 34px; fill: #102033; }
      .subtitle { font-family: "Comic Mono"; font-size: 14px; fill: #51606F; }
      .section { font-family: "Architects Daughter"; font-size: 24px; fill: #102033; }
      .cardTitle { font-family: "Architects Daughter"; font-size: 23px; fill: #102033; }
      .cardText { font-family: "Comic Mono"; font-size: 14px; fill: #415166; }
      .line { fill: none; stroke-width: 3.2; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>
  <rect class="canvas" width="1320" height="760"/>
  <rect class="frame" x="18" y="18" width="1284" height="724" rx="24"/>
  <text class="title" x="660" y="58" text-anchor="middle">Stream wrapper flow</text>
  <text class="subtitle" x="660" y="84" text-anchor="middle">Wrappers stay composable because each layer keeps the Source or Sink contract.</text>

  <rect x="60" y="126" width="360" height="520" rx="22" fill="#EAF8F0" stroke="#93C5A7" stroke-width="1.5"/>
  <text class="section" x="240" y="164" text-anchor="middle">Write pipeline</text>
  <g filter="url(#shadow)"><rect x="106" y="196" width="268" height="70" rx="14" fill="#FFFFFF" stroke="#86B89B" stroke-width="1.5"/><text class="cardTitle" x="240" y="224" text-anchor="middle">Buffer</text><text class="cardText" x="240" y="248" text-anchor="middle">plain bytes or ByteString</text></g>
  <g filter="url(#shadow)"><rect x="106" y="314" width="268" height="80" rx="14" fill="#FFFFFF" stroke="#86B89B" stroke-width="1.5"/><text class="cardTitle" x="240" y="344" text-anchor="middle">ForwardingSink</text><text class="cardText" x="240" y="370" text-anchor="middle">Base64, compression, cipher</text></g>
  <g filter="url(#shadow)"><rect x="106" y="452" width="268" height="80" rx="14" fill="#FFFFFF" stroke="#86B89B" stroke-width="1.5"/><text class="cardTitle" x="240" y="482" text-anchor="middle">File or socket Sink</text><text class="cardText" x="240" y="508" text-anchor="middle">FileChannel or coroutine adapter</text></g>
  <path class="line" d="M 240 266 L 240 314" stroke="#16A34A" marker-end="url(#arrowGreen)" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="line" d="M 240 394 L 240 452" stroke="#16A34A" marker-end="url(#arrowGreen)" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="480" y="126" width="360" height="520" rx="22" fill="#EAF3FF" stroke="#9DB9D8" stroke-width="1.5"/>
  <text class="section" x="660" y="164" text-anchor="middle">Read pipeline</text>
  <g filter="url(#shadow)"><rect x="526" y="196" width="268" height="70" rx="14" fill="#FFFFFF" stroke="#8EA9C2" stroke-width="1.5"/><text class="cardTitle" x="660" y="224" text-anchor="middle">File or socket Source</text><text class="cardText" x="660" y="248" text-anchor="middle">read into Buffer</text></g>
  <g filter="url(#shadow)"><rect x="526" y="314" width="268" height="80" rx="14" fill="#FFFFFF" stroke="#8EA9C2" stroke-width="1.5"/><text class="cardTitle" x="660" y="344" text-anchor="middle">ForwardingSource</text><text class="cardText" x="660" y="370" text-anchor="middle">decode, decrypt, decompress</text></g>
  <g filter="url(#shadow)"><rect x="526" y="452" width="268" height="80" rx="14" fill="#FFFFFF" stroke="#8EA9C2" stroke-width="1.5"/><text class="cardTitle" x="660" y="482" text-anchor="middle">BufferedSource API</text><text class="cardText" x="660" y="508" text-anchor="middle">readUtf8, readByteString</text></g>
  <path class="line" d="M 660 266 L 660 314" stroke="#2563EB" marker-end="url(#arrowBlue)" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="line" d="M 660 394 L 660 452" stroke="#2563EB" marker-end="url(#arrowBlue)" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="900" y="126" width="360" height="520" rx="22" fill="#FFF7E8" stroke="#D8B86E" stroke-width="1.5"/>
  <text class="section" x="1080" y="164" text-anchor="middle">Coroutine bridge</text>
  <g filter="url(#shadow)"><rect x="946" y="196" width="268" height="70" rx="14" fill="#FFFFFF" stroke="#C99A35" stroke-width="1.5"/><text class="cardTitle" x="1080" y="224" text-anchor="middle">SuspendedPipe</text><text class="cardText" x="1080" y="248" text-anchor="middle">bounded cancelable buffer</text></g>
  <g filter="url(#shadow)"><rect x="946" y="314" width="268" height="80" rx="14" fill="#FFFFFF" stroke="#C99A35" stroke-width="1.5"/><text class="cardTitle" x="1080" y="344" text-anchor="middle">SuspendedSource/Sink</text><text class="cardText" x="1080" y="370" text-anchor="middle">suspend read and write</text></g>
  <g filter="url(#shadow)"><rect x="946" y="452" width="268" height="80" rx="14" fill="#FFFFFF" stroke="#C99A35" stroke-width="1.5"/><text class="cardTitle" x="1080" y="482" text-anchor="middle">Blocking interop</text><text class="cardText" x="1080" y="508" text-anchor="middle">forward adapters preserve API</text></g>
  <path class="line" d="M 1080 266 L 1080 314" stroke="#C47A12" marker-end="url(#arrowAmber)" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="line" d="M 1080 394 L 1080 452" stroke="#C47A12" marker-end="url(#arrowAmber)" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
