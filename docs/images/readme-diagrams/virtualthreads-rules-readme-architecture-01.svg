<svg xmlns="http://www.w3.org/2000/svg" width="1650" height="840" viewBox="0 0 1650 840">
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .title { font-family: 'Architects Daughter', 'Comic Sans MS', cursive; font-size: 34px; fill: #172033; }
      .layer-title { font-family: 'Architects Daughter', 'Comic Sans MS', cursive; font-size: 26px; fill: #344154; }
      .card-title { font-family: 'Architects Daughter', 'Comic Sans MS', cursive; font-size: 27px; fill: #101827; }
      .body { font-family: 'Comic Mono', 'Comic Sans MS', monospace; font-size: 18px; fill: #364152; }
      .small { font-family: 'Comic Mono', 'Comic Sans MS', monospace; font-size: 16px; fill: #4b5563; }
      .layer { stroke-width: 1.5; rx: 24; ry: 24; }
      .card { fill: #fff; stroke: #cbd5e1; stroke-width: 1.5; rx: 18; ry: 18; }
      .line { fill: none; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#2563eb"/>
    </marker>
  </defs>
  <rect class="bg" width="1650" height="840"/>
  <text class="title" x="70" y="70">Virtual Thread Rules Workshop</text>

  <rect class="layer" x="70" y="120" width="1510" height="220" fill="#eff6ff" stroke="#bfdbfe"/>
  <text class="layer-title" x="105" y="165">Example groups</text>
  <rect class="card" x="135" y="215" width="410" height="80"/>
  <text class="card-title" x="170" y="250">Part 1: creation APIs</text>
  <text class="small" x="170" y="276">builder, factory, per-task executor</text>
  <rect class="card" x="620" y="215" width="410" height="80"/>
  <text class="card-title" x="655" y="250">Part 2: usage rules</text>
  <text class="small" x="655" y="276">pooling, semaphore, context, locks</text>
  <rect class="card" x="1105" y="215" width="410" height="80"/>
  <text class="card-title" x="1140" y="250">Part 3: Kotlin integration</text>
  <text class="small" x="1140" y="276">coroutines and structured scopes</text>

  <rect class="layer" x="70" y="405" width="1510" height="280" fill="#f0fdf4" stroke="#bbf7d0"/>
  <text class="layer-title" x="105" y="450">Rules readers apply</text>
  <rect class="card" x="160" y="500" width="330" height="60"/>
  <text class="body" x="190" y="537">per task, not pooled</text>
  <rect class="card" x="540" y="500" width="330" height="60"/>
  <text class="body" x="570" y="537">Semaphore for limits</text>
  <rect class="card" x="920" y="500" width="330" height="60"/>
  <text class="body" x="950" y="537">avoid broad ThreadLocal</text>
  <rect class="card" x="1300" y="500" width="220" height="60"/>
  <text class="body" x="1330" y="537">prefer locks</text>
  <rect class="card" x="595" y="600" width="460" height="50"/>
  <text class="small" x="625" y="632">StructuredTaskScope for fork-and-join results</text>

  <rect class="layer" x="70" y="735" width="1510" height="60" fill="#fefce8" stroke="#fde68a"/>
  <text class="body" x="520" y="772">Run ./gradlew :virtualthreads-rules:test to execute the examples</text>

  <path class="line" d="M340 295 L340 500" stroke="#2563eb" marker-end="url(#arrow)"/>
  <path class="line" d="M825 295 L825 390 L705 390 L705 500" stroke="#2563eb" marker-end="url(#arrow)"/>
  <path class="line" d="M825 295 L825 390 L1085 390 L1085 500" stroke="#2563eb" marker-end="url(#arrow)"/>
  <path class="line" d="M1310 295 L1310 390 L1410 390 L1410 500" stroke="#2563eb" marker-end="url(#arrow)"/>
  <path class="line" d="M1310 295 L1310 390 L825 390 L825 600" stroke="#2563eb" marker-end="url(#arrow)"/>
</svg>
