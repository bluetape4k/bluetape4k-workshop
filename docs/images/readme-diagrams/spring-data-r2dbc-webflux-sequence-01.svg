<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" role="img" aria-label="WebFlux R2DBC Request Sequence">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#1f2937" flood-opacity="0.10"/></filter>
  <marker id="arrowBlue" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M1,1 L8,4.5 L1,8 Z" fill="#5B8DEF"/></marker>
  <marker id="arrowTeal" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M1,1 L8,4.5 L1,8 Z" fill="#45A7A1"/></marker>
  <style>
    .canvas{fill:#f7f9fc}.frame{fill:#fff;stroke:#d8e0ea;stroke-width:1.5}
    .title{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:38px;font-weight:400;fill:#102033}
    .subtitle{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:14px;font-weight:400;fill:#536273}
    .smallLabel{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:21px;font-weight:400;fill:#102033}
    .small{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#536273}
    .card{stroke-width:2.1;filter:url(#shadow)}
    .lifeline{stroke:#b0bbca;stroke-width:1.5;stroke-dasharray:6 4;fill:none}
    .reqArrow{stroke:#5B8DEF;stroke-width:2.1;fill:none;marker-end:url(#arrowBlue)}
    .rspArrow{stroke:#45A7A1;stroke-width:2.1;stroke-dasharray:7 4;fill:none;marker-end:url(#arrowTeal)}
  </style>
</defs>
<rect class="canvas" width="960" height="480"/>
<rect class="frame" x="24" y="20" width="912" height="436" rx="16"/>
<text class="title" x="48" y="66">WebFlux R2DBC Request Sequence</text>
<text class="subtitle" x="48" y="90">coRouter → UserHandler → UserService → UserRepository → H2 R2DBC</text>

<!-- Participants -->
<rect class="card" x="40" y="108" width="110" height="44" rx="8" fill="#FDECEF" stroke="#DC6B82"/>
<text class="smallLabel" x="95" y="135" text-anchor="middle">Client</text>

<rect class="card" x="200" y="108" width="150" height="44" rx="8" fill="#E8F3FF" stroke="#5B8DEF"/>
<text class="smallLabel" x="275" y="135" text-anchor="middle">UserHandler</text>

<rect class="card" x="410" y="108" width="150" height="44" rx="8" fill="#FFF3D9" stroke="#D6A441"/>
<text class="smallLabel" x="485" y="135" text-anchor="middle">UserService</text>

<rect class="card" x="620" y="108" width="150" height="44" rx="8" fill="#F1ECFF" stroke="#8A72D6"/>
<text class="smallLabel" x="695" y="135" text-anchor="middle">UserRepository</text>

<rect class="card" x="820" y="108" width="110" height="44" rx="8" fill="#E9F7F6" stroke="#45A7A1"/>
<text class="smallLabel" x="875" y="135" text-anchor="middle">H2 R2DBC</text>

<!-- Lifelines -->
<line class="lifeline" x1="95" y1="152" x2="95" y2="440"/>
<line class="lifeline" x1="275" y1="152" x2="275" y2="440"/>
<line class="lifeline" x1="485" y1="152" x2="485" y2="440"/>
<line class="lifeline" x1="695" y1="152" x2="695" y2="440"/>
<line class="lifeline" x1="875" y1="152" x2="875" y2="440"/>

<!-- 1. GET /api/users -->
<rect fill="#EAF7EF" stroke="#58A978" stroke-width="1.2" x="40" y="172" width="120" height="22" rx="4"/>
<text class="small" x="100" y="187" text-anchor="middle">1. GET /api/users</text>
<line class="reqArrow" x1="160" y1="183" x2="267" y2="183"/>

<!-- 2. findAll() -->
<rect fill="#E8F3FF" stroke="#5B8DEF" stroke-width="1.2" x="200" y="204" width="130" height="22" rx="4"/>
<text class="small" x="265" y="219" text-anchor="middle">2. findAll(): Flow~User~</text>
<line class="reqArrow" x1="275" y1="215" x2="477" y2="215"/>

<!-- 3. repository.findAll() -->
<rect fill="#FFF3D9" stroke="#D6A441" stroke-width="1.2" x="410" y="236" width="130" height="22" rx="4"/>
<text class="small" x="475" y="251" text-anchor="middle">3. repo.findAll()</text>
<line class="reqArrow" x1="485" y1="247" x2="687" y2="247"/>

<!-- 4. SELECT users -->
<rect fill="#E9F7F6" stroke="#45A7A1" stroke-width="1.2" x="620" y="268" width="130" height="22" rx="4"/>
<text class="small" x="685" y="283" text-anchor="middle">4. SELECT users</text>
<line class="reqArrow" x1="695" y1="279" x2="812" y2="279"/>

<!-- 5. result rows -->
<rect fill="#f0faf8" stroke="#45A7A1" stroke-width="1.2" x="620" y="300" width="130" height="22" rx="4"/>
<text class="small" x="685" y="315" text-anchor="middle">5. result rows</text>
<line class="rspArrow" x1="812" y1="311" x2="703" y2="311"/>

<!-- 6. Flow~User~ -->
<rect fill="#f0f4ff" stroke="#5B8DEF" stroke-width="1.2" x="40" y="332" width="120" height="22" rx="4"/>
<text class="small" x="100" y="347" text-anchor="middle">6. Flow~User~</text>
<line class="rspArrow" x1="687" y1="343" x2="160" y2="343"/>

<!-- 7. POST /api/users (save) -->
<rect fill="#FFF3D9" stroke="#D6A441" stroke-width="1.2" x="40" y="374" width="130" height="22" rx="4"/>
<text class="small" x="105" y="389" text-anchor="middle">7. POST body</text>
<line class="reqArrow" x1="170" y1="385" x2="267" y2="385"/>

<!-- 8. suspend addUser(dto) -->
<rect fill="#E8F3FF" stroke="#5B8DEF" stroke-width="1.2" x="200" y="406" width="130" height="22" rx="4"/>
<text class="small" x="265" y="421" text-anchor="middle">8. addUser(dto)</text>
<line class="reqArrow" x1="275" y1="417" x2="477" y2="417"/>

<!-- 9. saved User -->
<rect fill="#f7f2ff" stroke="#8A72D6" stroke-width="1.2" x="40" y="415" width="120" height="22" rx="4"/>
<text class="small" x="100" y="447" text-anchor="middle">9. saved User</text>
<line class="rspArrow" x1="812" y1="443" x2="160" y2="443"/>
</svg>
