<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="930" viewBox="0 0 1900 930" role="img" aria-label="Flow parallel enrichment sequence">
<defs>
<style>

      .canvas{fill:#F6FAFB}
      .frame{fill:#FFFFFF;stroke:#C7D4DF;stroke-width:1.8}
      .title{font-family:'Architects Daughter';font-size:38px;fill:#142638}
      .subtitle{font-family:'Comic Mono';font-size:15px;fill:#51606F}
      .lane{stroke-width:2;rx:18}
      .lane-title{font-family:'Architects Daughter';font-size:21px;fill:#102033}
      .lane-detail{font-family:'Comic Mono';font-size:12px;fill:#51606F}
      .card{stroke:#8FA6B6;stroke-width:1.8;rx:14}
      .card-title{font-family:'Architects Daughter';font-size:19px;fill:#102033}
      .card-detail{font-family:'Comic Mono';font-size:12px;fill:#465160}
      .small{font-family:'Comic Mono';font-size:11px;fill:#51606F}
      .line{fill:none;stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round}
      .line-thin{fill:none;stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round}
      .dash{stroke-dasharray:8 7}
      .label{font-family:'Comic Mono';font-size:12px;fill:#263238}
      .pill{fill:#FFFFFF;stroke:#D5E0E8;stroke-width:1.4;rx:12}

</style>

    <marker id="arrow-blue" viewBox="0 0 10 10" markerWidth="14" markerHeight="14" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#2F6F8E" stroke="#2F6F8E" stroke-dasharray="none" style="stroke-dasharray:none"/></marker>
    <marker id="arrow-green" viewBox="0 0 10 10" markerWidth="14" markerHeight="14" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#55783F" stroke="#55783F" stroke-dasharray="none" style="stroke-dasharray:none"/></marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" markerWidth="14" markerHeight="14" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#A46628" stroke="#A46628" stroke-dasharray="none" style="stroke-dasharray:none"/></marker>
    <marker id="arrow-red" viewBox="0 0 10 10" markerWidth="14" markerHeight="14" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#B85E63" stroke="#B85E63" stroke-dasharray="none" style="stroke-dasharray:none"/></marker>

</defs>
<rect x="0" y="0" width="1900" height="930" rx="0" class="canvas" fill="#FBFCF8"/>
<rect x="24" y="24" width="1852" height="882" rx="22" class="frame" fill="#FFFFFF"/>
<text x="950" y="72" class="title" text-anchor="middle">Flow Parallel Enrichment Sequence</text>
<text x="950" y="104" class="subtitle" text-anchor="middle">The real call order: filter, parallel rail, async customer/inventory, promotion, then sequential emission</text>
<rect x="55" y="150" width="250" height="76" rx="14" class="card" fill="#FFFFFF"/>
<text x="180" y="181" class="card-title" text-anchor="middle">Order Source</text>
<text x="180" y="207" class="card-detail" text-anchor="middle">Flow&lt;OrderCommand&gt;</text>
<line x1="180" y1="226" x2="180" y2="850" stroke="#9AAAB1" stroke-width="2" stroke-dasharray="7 8" stroke-linecap="round"/>
<rect x="360" y="150" width="250" height="76" rx="14" class="card" fill="#FFFFFF"/>
<text x="485" y="181" class="card-title" text-anchor="middle">Pipeline</text>
<text x="485" y="207" class="card-detail" text-anchor="middle">filter + parallel</text>
<line x1="485" y1="226" x2="485" y2="850" stroke="#9AAAB1" stroke-width="2" stroke-dasharray="7 8" stroke-linecap="round"/>
<rect x="665" y="150" width="250" height="76" rx="14" class="card" fill="#FFFFFF"/>
<text x="790" y="181" class="card-title" text-anchor="middle">CustomerProfileService</text>
<text x="790" y="207" class="card-detail" text-anchor="middle">profile lookup</text>
<line x1="790" y1="226" x2="790" y2="850" stroke="#9AAAB1" stroke-width="2" stroke-dasharray="7 8" stroke-linecap="round"/>
<rect x="970" y="150" width="250" height="76" rx="14" class="card" fill="#FFFFFF"/>
<text x="1095" y="181" class="card-title" text-anchor="middle">InventoryService</text>
<text x="1095" y="207" class="card-detail" text-anchor="middle">stock snapshot</text>
<line x1="1095" y1="226" x2="1095" y2="850" stroke="#9AAAB1" stroke-width="2" stroke-dasharray="7 8" stroke-linecap="round"/>
<rect x="1275" y="150" width="250" height="76" rx="14" class="card" fill="#FFFFFF"/>
<text x="1400" y="181" class="card-title" text-anchor="middle">PromotionService</text>
<text x="1400" y="207" class="card-detail" text-anchor="middle">discount</text>
<line x1="1400" y1="226" x2="1400" y2="850" stroke="#9AAAB1" stroke-width="2" stroke-dasharray="7 8" stroke-linecap="round"/>
<rect x="1585" y="150" width="250" height="76" rx="14" class="card" fill="#FFFFFF"/>
<text x="1710" y="181" class="card-title" text-anchor="middle">Downstream</text>
<text x="1710" y="207" class="card-detail" text-anchor="middle">collector</text>
<line x1="1710" y1="226" x2="1710" y2="850" stroke="#9AAAB1" stroke-width="2" stroke-dasharray="7 8" stroke-linecap="round"/>
<rect x="242.5" y="254" width="180" height="26" rx="13" class="pill" fill="#FFFFFF"/>
<circle cx="260.5" cy="267" r="11" fill="#EAF4F8" stroke="#2F6F8E" stroke-width="1.5"/>
<text x="260.5" y="271" class="small" text-anchor="middle">1</text>
<text x="280.5" y="271" class="label">emit order flow</text>
<path class="line" d="M 180 290 L 485 290" stroke="#2F6F8E" marker-end="url(#arrow-blue)"/>
<rect x="380.0" y="329" width="210" height="26" rx="13" class="pill" fill="#FFFFFF"/>
<circle cx="398.0" cy="342" r="11" fill="#EAF4F8" stroke="#55783F" stroke-width="1.5"/>
<text x="398.0" y="346" class="small" text-anchor="middle">2</text>
<text x="418.0" y="346" class="label">filter valid orders</text>
<rect x="473" y="358" width="24" height="28" rx="6" fill="#EEF7F0" stroke="#55783F" stroke-width="1.4"/>
<rect x="372.0" y="404" width="226" height="26" rx="13" class="pill" fill="#FFFFFF"/>
<circle cx="390.0" cy="417" r="11" fill="#EAF4F8" stroke="#55783F" stroke-width="1.5"/>
<text x="390.0" y="421" class="small" text-anchor="middle">3</text>
<text x="410.0" y="421" class="label">parallelMap rail work</text>
<rect x="473" y="433" width="24" height="28" rx="6" fill="#EEF7F0" stroke="#55783F" stroke-width="1.4"/>
<rect x="520.5" y="484" width="234" height="26" rx="13" class="pill" fill="#FFFFFF"/>
<circle cx="538.5" cy="497" r="11" fill="#EAF4F8" stroke="#2F6F8E" stroke-width="1.5"/>
<text x="538.5" y="501" class="small" text-anchor="middle">4</text>
<text x="558.5" y="501" class="label">async findByCustomerId</text>
<path class="line" d="M 485 520 L 790 520" stroke="#2F6F8E" marker-end="url(#arrow-blue)"/>
<rect x="681.0" y="554" width="218" height="26" rx="13" class="pill" fill="#FFFFFF"/>
<circle cx="699.0" cy="567" r="11" fill="#EAF4F8" stroke="#2F6F8E" stroke-width="1.5"/>
<text x="699.0" y="571" class="small" text-anchor="middle">5</text>
<text x="719.0" y="571" class="label">async reserve(items)</text>
<path class="line" d="M 485 590 L 1095 590" stroke="#2F6F8E" marker-end="url(#arrow-blue)"/>
<rect x="966.0" y="624" width="258" height="26" rx="13" class="pill" fill="#FFFFFF"/>
<circle cx="984.0" cy="637" r="11" fill="#EAF4F8" stroke="#55783F" stroke-width="1.5"/>
<text x="984.0" y="641" class="small" text-anchor="middle">6</text>
<text x="1004.0" y="641" class="label">estimateDiscount(profile)</text>
<path class="line" d="M 485 660 L 1400 660" stroke="#55783F" marker-end="url(#arrow-green)"/>
<rect x="785.5" y="699" width="314" height="26" rx="13" class="pill" fill="#FFFFFF"/>
<circle cx="803.5" cy="712" r="11" fill="#EAF4F8" stroke="#A46628" stroke-width="1.5"/>
<text x="803.5" y="716" class="small" text-anchor="middle">7</text>
<text x="823.5" y="716" class="label">discount returned</text>
<path class="line-thin dash" d="M 1400 735 L 485 735" stroke="#A46628" marker-end="url(#arrow-amber)"/>
<rect x="392" y="748" width="250" height="26" rx="13" class="pill" fill="#FFFFFF"/>
<circle cx="410" cy="761" r="11" fill="#FFF7E8" stroke="#A46628" stroke-width="1.5"/>
<text x="410" y="765" class="small" text-anchor="middle">7b</text>
<text x="430" y="765" class="label">pipeline builds EnrichedOrder</text>
<rect x="948.5" y="776" width="298" height="26" rx="13" class="pill" fill="#FFFFFF"/>
<circle cx="966.5" cy="789" r="11" fill="#EAF4F8" stroke="#55783F" stroke-width="1.5"/>
<text x="966.5" y="793" class="small" text-anchor="middle">8</text>
<text x="986.5" y="793" class="label">sequential emits EnrichedOrder</text>
<path class="line" d="M 485 812 L 1710 812" stroke="#55783F" marker-end="url(#arrow-green)"/>
<rect x="70" y="850" width="1760" height="42" rx="12" class="lane" fill="#F2F7F2" stroke="#A7D0B0"/>
<text x="950" y="878" class="subtitle" text-anchor="middle">Missing customer or product propagates as an exception from the service call inside the rail.</text>
</svg>
