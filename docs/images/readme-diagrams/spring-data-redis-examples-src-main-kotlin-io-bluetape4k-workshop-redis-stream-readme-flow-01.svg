<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="900" viewBox="0 0 1680 900">
  <defs>
    <style>
      .bg{fill:#f8fafc}.title{font-family:'Architects Daughter','Comic Sans MS',cursive;font-size:34px;fill:#18212f}
      .card-title{font-family:'Architects Daughter','Comic Sans MS',cursive;font-size:27px;fill:#101827}
      .body{font-family:'Comic Mono','Comic Sans MS',monospace;font-size:18px;fill:#364152}.small{font-family:'Comic Mono','Comic Sans MS',monospace;font-size:15px;fill:#475569}
      .card{fill:#fff;stroke:#cbd5e1;stroke-width:1.5;rx:18;ry:18}.lane{fill:#f1f5f9;stroke:#cbd5e1;stroke-width:1.3;rx:22;ry:22}
      .line{fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}.redis{fill:#dc2626}.redis2{fill:#ef4444}.redis3{fill:#f87171}
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L11,6 L1,11 Z" fill="#2563eb"/></marker>
    <marker id="arrow-green" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L11,6 L1,11 Z" fill="#059669"/></marker>
  </defs>
  <rect class="bg" width="1680" height="900"/>
  <text class="title" x="70" y="70">Redis Stream Test Flow</text>

  <rect class="lane" x="80" y="130" width="700" height="625"/>
  <rect class="lane" x="900" y="130" width="700" height="625"/>
  <text class="card-title" x="120" y="180">Append and offset reads</text>
  <text class="card-title" x="940" y="180">Continuous reads</text>

  <rect class="card" x="145" y="225" width="570" height="75"/>
  <text class="card-title" x="175" y="268">XADD fixed IDs</text>
  <text class="body" x="430" y="268">1234-0, 1234-1</text>
  <rect class="card" x="145" y="365" width="570" height="75"/>
  <text class="card-title" x="175" y="408">Reject older ID</text>
  <text class="body" x="430" y="408">RecordId 0-0 fails</text>
  <rect class="card" x="145" y="505" width="570" height="75"/>
  <text class="card-title" x="175" y="548">XREAD offsets</text>
  <text class="body" x="410" y="548">fromStart or after fixedId</text>

  <rect class="card" x="965" y="225" width="570" height="75"/>
  <text class="card-title" x="995" y="268">Start listener</text>
  <text class="body" x="1250" y="268">sync container or receiver</text>
  <rect class="card" x="965" y="365" width="570" height="75"/>
  <text class="card-title" x="995" y="408">XADD new records</text>
  <text class="body" x="995" y="436">listener receives records</text>
  <rect class="card" x="965" y="505" width="570" height="75"/>
  <text class="card-title" x="995" y="548">Assert captured count</text>
  <text class="body" x="995" y="576">2 then 3 records</text>

  <rect class="card" x="580" y="785" width="520" height="75"/>
  <g transform="translate(625 805)">
    <rect class="redis3" x="0" y="26" width="58" height="18" rx="5"/>
    <rect class="redis2" x="0" y="13" width="58" height="18" rx="5"/>
    <rect class="redis" x="0" y="0" width="58" height="18" rx="5"/>
  </g>
  <text class="card-title" x="710" y="831">Redis stream: my-stream</text>

  <path class="line" d="M430 300 L430 365" stroke="#2563eb" marker-end="url(#arrow)"/>
  <path class="line" d="M430 440 L430 505" stroke="#2563eb" marker-end="url(#arrow)"/>
  <path class="line" d="M430 580 L430 660 L720 660 L720 785" stroke="#2563eb" marker-end="url(#arrow)"/>
  <path class="line" d="M1250 300 L1250 365" stroke="#059669" marker-end="url(#arrow-green)"/>
  <path class="line" d="M1250 440 L1250 505" stroke="#059669" marker-end="url(#arrow-green)"/>
  <path class="line" d="M1250 580 L1250 660 L960 660 L960 785" stroke="#059669" marker-end="url(#arrow-green)"/>
</svg>
