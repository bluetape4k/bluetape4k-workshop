<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1320" viewBox="0 0 1500 1320" role="img" aria-labelledby="title desc">
  <title id="title">exposed/javers-persistence-audit architecture</title>
  <desc id="desc">Top-to-bottom architecture for Redis-backed JaVers audit history with Exposed storing only the current order row.</desc>
  <defs>
    <style>
      svg{background:#f8fafc}
      .frame{fill:#ffffff;stroke:#d8e4ef;stroke-width:2}
      .title{font-family:"Architects Daughter";font-size:42px;fill:#142033}
      .subtitle,.small,.footer{font-family:"Comic Mono";fill:#435469}
      .subtitle{font-size:17px}.small{font-size:15px}.footer{font-size:13px;fill:#5f7181}
      .node rect{stroke-width:2.4}
      .input{fill:#eef7ff;stroke:#7aa6cf}.service{fill:#effaf2;stroke:#75a985}.audit{fill:#f7f1ff;stroke:#9b83c7}.redis{fill:#fff1f0;stroke:#d06a63}.db{fill:#fff7e8;stroke:#c59352}.kafka{fill:#fff8f3;stroke:#c77d61}
      .cardTitle{font-family:"Architects Daughter";font-size:28px;fill:#142033}
      .nodeText{font-family:"Comic Mono";font-size:15px;fill:#435469}
      .edge path{fill:none;stroke:#52748d;stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}
      .edge.auditEdge path{stroke:#7a64aa;marker-end:url(#auditArrow)}
      .edge.redisEdge path{stroke:#bd4d45;marker-end:url(#redisArrow)}
      .edge.dbEdge path{stroke:#9b6b2f;marker-end:url(#dbArrow)}
      .edge.kafkaEdge path{stroke:#a05d44;stroke-dasharray:10 7;marker-end:url(#kafkaArrow)}
      .badge{font-family:"Comic Mono";font-size:13px;font-weight:700;fill:#ffffff}
    </style>
    <marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" viewBox="0 0 10 10" refX="9" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#52748d" stroke-dasharray="none" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="auditArrow" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" viewBox="0 0 10 10" refX="9" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#7a64aa" stroke-dasharray="none" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="redisArrow" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" viewBox="0 0 10 10" refX="9" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#bd4d45" stroke-dasharray="none" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="dbArrow" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" viewBox="0 0 10 10" refX="9" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#9b6b2f" stroke-dasharray="none" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="kafkaArrow" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" viewBox="0 0 10 10" refX="9" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#a05d44" stroke-dasharray="none" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>

  <rect class="frame" x="28" y="28" width="1444" height="1264" rx="18"/>
  <text class="title" x="750" y="82" text-anchor="middle">Redis-backed JaVers Audit over Exposed</text>
  <text class="subtitle" x="750" y="115" text-anchor="middle">Top-to-bottom write order: validate request, commit audit history, then materialize the current order row.</text>

  <g class="node" data-node="caller">
    <rect class="input" x="470" y="158" width="560" height="112" rx="12"/>
    <text class="cardTitle" x="750" y="196" text-anchor="middle">Caller / Test</text>
    <text class="nodeText" x="750" y="226" text-anchor="middle">place, markPaid, delete, history, latest, diff</text>
    <text class="nodeText" x="750" y="250" text-anchor="middle">source-backed examples drive the service boundary</text>
  </g>

  <g class="node" data-node="service">
    <rect class="service" x="470" y="342" width="560" height="126" rx="12"/>
    <text class="cardTitle" x="750" y="382" text-anchor="middle">OrderAuditService</text>
    <text class="nodeText" x="750" y="413" text-anchor="middle">validates author and order identity</text>
    <text class="nodeText" x="750" y="438" text-anchor="middle">audit write happens before the current-row write</text>
  </g>

  <g class="node" data-node="javers">
    <rect class="audit" x="470" y="540" width="560" height="128" rx="12"/>
    <text class="cardTitle" x="750" y="580" text-anchor="middle">JaVers + Redisson Repository</text>
    <text class="nodeText" x="750" y="611" text-anchor="middle">commit, commitShallowDelete, QueryBuilder.byInstanceId</text>
    <text class="nodeText" x="750" y="636" text-anchor="middle">oldest-first history and latestSnapshotOrNull reads</text>
  </g>

  <g class="node" data-node="redis">
    <rect class="redis" x="470" y="740" width="560" height="132" rx="12"/>
    <image data-bluetape4k-icon="redis" data-source="docs/icons/testcontainers/storage/redis.svg" x="500" y="771" width="54" height="54" href="data:image/svg+xml;base64," preserveAspectRatio="xMidYMid meet"/>
    <text class="cardTitle" x="750" y="785" text-anchor="middle">Redis Snapshot Store</text>
    <text class="nodeText" x="750" y="816" text-anchor="middle">durable, read-capable JaVers audit history</text>
    <text class="nodeText" x="750" y="841" text-anchor="middle">service rebuild can still read previous commits</text>
  </g>

  <g class="node" data-node="exposed">
    <rect class="db" x="470" y="944" width="560" height="132" rx="12"/>
    <image data-bluetape4k-icon="database-server" data-source="docs/icons/generic/database-server.svg" x="948" y="974" width="58" height="58" href="data:image/svg+xml;base64," preserveAspectRatio="xMidYMid meet"/>
    <text class="cardTitle" x="750" y="989" text-anchor="middle">Exposed OrderTable</text>
    <text class="nodeText" x="735" y="1020" text-anchor="middle">current row only: id, customerId, status</text>
    <text class="nodeText" x="735" y="1045" text-anchor="middle">amount and history stay in separate stores</text>
  </g>

  <g class="node" data-node="kafka">
    <rect class="kafka" x="470" y="1144" width="560" height="86" rx="12"/>
    <image data-bluetape4k-icon="apache-kafka" data-source="docs/icons/testcontainers/mq/apache-kafka.svg" x="956" y="1161" width="46" height="46" href="data:image/svg+xml;base64," preserveAspectRatio="xMidYMid meet"/>
    <text class="cardTitle" x="750" y="1177" text-anchor="middle">Kafka Repository Boundary</text>
    <text class="nodeText" x="735" y="1205" text-anchor="middle">write-only event stream; project before querying</text>
  </g>

  <g class="edge" data-edge="caller-&gt;service" data-label="invoke audited order operation">
    <path d="M 750 270 L 750 342"/>
  </g>
  <g class="edge auditEdge" data-edge="service-&gt;javers" data-label="commit audit snapshot first">
    <path d="M 750 468 L 750 540"/>
  </g>
  <g class="edge redisEdge" data-edge="javers-&gt;redis" data-label="persist read-capable snapshot history">
    <path d="M 750 668 L 750 740"/>
  </g>
  <g class="edge dbEdge" data-edge="redis-&gt;exposed" data-label="then materialize current row through Exposed">
    <path d="M 750 872 L 750 944"/>
  </g>
  <g class="edge kafkaEdge" data-edge="exposed-&gt;kafka" data-label="document write-only stream alternative">
    <path d="M 750 1076 L 750 1144"/>
  </g>

  <text class="footer" x="750" y="1268" text-anchor="middle">Runtime module uses Redis for queryable JaVers history; Kafka is documented as a write-only stream boundary, not a history reader.</text>
</svg>
