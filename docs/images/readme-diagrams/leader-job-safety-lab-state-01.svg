<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1050" viewBox="0 0 1800 1050" role="img" aria-labelledby="title desc"><title id="title">Job Execution State Diagram</title><desc id="desc">Safe execution states with contention, authority rejection, external reconciliation, completion, and failure exits.</desc><defs>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="124%"><feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#64748B" flood-opacity="0.13"/></filter>
    <style>
      .bg{fill:#F8FAFC}.frame{fill:#FFFFFF;stroke:#CAD6DF;stroke-width:2}.layer{stroke-width:2}.blueLayer{fill:#EFF6FF;stroke:#A8C7EA}.greenLayer{fill:#F0F8F0;stroke:#B8D7AE}.amberLayer{fill:#FFF7E8;stroke:#DFC69A}.purpleLayer{fill:#F8F3FF;stroke:#D7C3EF}.title{font-family:"Architects Daughter";font-size:42px;fill:#263238}.subtitle,.body,.small,.footer,.msg{font-family:"Comic Mono";fill:#3E4C59}.subtitle{font-size:18px}.layerTitle{font-family:"Architects Daughter";font-size:26px;fill:#344154}.cardTitle,.participant{font-family:"Architects Daughter";font-size:23px;fill:#16202A}.body{font-size:16px}.small{font-size:13px;fill:#5B6975}.footer{font-size:14px;fill:#60727D}.card{fill:#FFFFFF;stroke:#9FB0BC;stroke-width:2}.blueCard{fill:#EFF6FF;stroke:#4F86C6}.greenCard{fill:#F0F8F0;stroke:#6E8F4F}.amberCard{fill:#FFF7E8;stroke:#9B7D54}.redCard{fill:#FFF0F0;stroke:#B86868}.purpleCard{fill:#F8F3FF;stroke:#8065A8}.connector{fill:none;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round}.blueEdge{stroke:#4F86C6;marker-end:url(#arrow-blue)}.greenEdge{stroke:#6E8F4F;marker-end:url(#arrow-green)}.amberEdge{stroke:#9B7D54;marker-end:url(#arrow-amber)}.redEdge{stroke:#B86868;marker-end:url(#arrow-red)}.purpleEdge{stroke:#8065A8;marker-end:url(#arrow-purple)}.tealEdge{stroke:#2D948C;marker-end:url(#arrow-teal)}.dashed{stroke-dasharray:10 8}.lifeline{stroke:#9AAAB1;stroke-width:2;stroke-dasharray:7 8}.activation{fill:#EAF6EF;stroke:#6F9278;stroke-width:1.5}.label{fill:#FFFFFF;stroke:#D7E0E4;stroke-width:1.5}.badge{font-family:"Comic Mono";font-size:13px;font-weight:700}.legend{font-family:"Comic Mono";font-size:14px;fill:#475569}
    </style>
    <marker id="arrow-blue" viewBox="0 0 10 10" markerWidth="14" markerHeight="14" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse" data-role="primary" data-tip-direction="positive-x"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#4F86C6" stroke="#4F86C6" stroke-dasharray="none" stroke-width="0"/></marker><marker id="arrow-green" viewBox="0 0 10 10" markerWidth="14" markerHeight="14" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse" data-role="primary" data-tip-direction="positive-x"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#6E8F4F" stroke="#6E8F4F" stroke-dasharray="none" stroke-width="0"/></marker><marker id="arrow-amber" viewBox="0 0 10 10" markerWidth="14" markerHeight="14" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse" data-role="primary" data-tip-direction="positive-x"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#9B7D54" stroke="#9B7D54" stroke-dasharray="none" stroke-width="0"/></marker><marker id="arrow-red" viewBox="0 0 10 10" markerWidth="14" markerHeight="14" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse" data-role="primary" data-tip-direction="positive-x"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#B86868" stroke="#B86868" stroke-dasharray="none" stroke-width="0"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" markerWidth="14" markerHeight="14" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse" data-role="primary" data-tip-direction="positive-x"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#8065A8" stroke="#8065A8" stroke-dasharray="none" stroke-width="0"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" markerWidth="14" markerHeight="14" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse" data-role="primary" data-tip-direction="positive-x"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#2D948C" stroke="#2D948C" stroke-dasharray="none"/></marker>
  </defs><rect class="bg" width="1800" height="1050"/><text class="title" x="900" y="66" text-anchor="middle">Job Execution State Diagram</text><text class="subtitle" x="900" y="100" text-anchor="middle">Every exit is explicit: contention skips, stale authority rejects, ambiguous effects reconcile, and only durable receipts complete.</text>
  <g class="node" data-node="requested" filter="url(#shadow)"><rect class="card blueCard" x="90" y="190" width="250" height="84" rx="16"/><text class="cardTitle" x="215" y="226" text-anchor="middle">REQUESTED</text><text class="body" x="215" y="256" text-anchor="middle">stable operation ID</text></g><g class="node" data-node="leader-acquired" filter="url(#shadow)"><rect class="card purpleCard" x="425" y="190" width="250" height="84" rx="16"/><text class="cardTitle" x="550" y="226" text-anchor="middle">LEADER_ACQUIRED</text><text class="body" x="550" y="256" text-anchor="middle">opaque owner only</text></g><g class="node" data-node="fence-acquired" filter="url(#shadow)"><rect class="card purpleCard" x="760" y="190" width="250" height="84" rx="16"/><text class="cardTitle" x="885" y="226" text-anchor="middle">FENCE_ACQUIRED</text><text class="body" x="885" y="256" text-anchor="middle">orderable generation</text></g><g class="node" data-node="running" filter="url(#shadow)"><rect class="card greenCard" x="1095" y="190" width="250" height="84" rx="16"/><text class="cardTitle" x="1220" y="226" text-anchor="middle">RUNNING</text><text class="body" x="1220" y="256" text-anchor="middle">bounded work</text></g><g class="node" data-node="committed" filter="url(#shadow)"><rect class="card greenCard" x="1430" y="190" width="250" height="84" rx="16"/><text class="cardTitle" x="1555" y="226" text-anchor="middle">COMMITTED</text><text class="body" x="1555" y="256" text-anchor="middle">DB + outbox atomic</text></g>
  <g class="node" data-node="effect-pending" filter="url(#shadow)"><rect class="card amberCard" x="1430" y="430" width="250" height="84" rx="16"/><text class="cardTitle" x="1555" y="466" text-anchor="middle">EFFECT_PENDING</text><text class="body" x="1555" y="496" text-anchor="middle">provider outcome unknown</text></g><g class="node" data-node="reconcile" filter="url(#shadow)"><rect class="card amberCard" x="1000" y="430" width="360" height="84" rx="16"/><text class="cardTitle" x="1180" y="466" text-anchor="middle">RECONCILIATION_REQUIRED</text><text class="body" x="1180" y="496" text-anchor="middle">query original operation</text></g><g class="node" data-node="completed" filter="url(#shadow)"><rect class="card greenCard" x="1430" y="690" width="250" height="84" rx="16"/><text class="cardTitle" x="1555" y="726" text-anchor="middle">COMPLETED</text><text class="body" x="1555" y="756" text-anchor="middle">durable receipt</text></g>
  <g class="node" data-node="skipped" filter="url(#shadow)"><rect class="card amberCard" x="90" y="690" width="250" height="84" rx="16"/><text class="cardTitle" x="215" y="726" text-anchor="middle">SKIPPED</text><text class="body" x="215" y="756" text-anchor="middle">leader / fence contended</text></g><g class="node" data-node="rejected" filter="url(#shadow)"><rect class="card redCard" x="550" y="690" width="250" height="84" rx="16"/><text class="cardTitle" x="675" y="726" text-anchor="middle">REJECTED</text><text class="body" x="675" y="756" text-anchor="middle">stale fence / authority</text></g><g class="node" data-node="failed" filter="url(#shadow)"><rect class="card redCard" x="940" y="850" width="250" height="84" rx="16"/><text class="cardTitle" x="1065" y="886" text-anchor="middle">FAILED</text><text class="body" x="1065" y="916" text-anchor="middle">backend / domain failure</text></g>
  <g class="edge" data-edge="requested-leader" data-label="leader acquired"><path data-connector="requested-leader" class="connector blueEdge" d="M 340 232 L 425 232" marker-end="url(#arrow-blue)"/></g><g class="edge" data-edge="leader-fence" data-label="fence acquired"><path data-connector="leader-fence" class="connector purpleEdge" d="M 675 232 L 760 232" marker-end="url(#arrow-purple)"/></g><g class="edge" data-edge="fence-running" data-label="start work"><path data-connector="fence-running" class="connector purpleEdge" d="M 1010 232 L 1095 232" marker-end="url(#arrow-purple)"/></g><g class="edge" data-edge="running-committed" data-label="conditional commit accepted"><path data-connector="running-committed" class="connector greenEdge" d="M 1345 232 L 1430 232" marker-end="url(#arrow-green)"/></g><g class="edge" data-edge="committed-effect" data-label="outbox delivery"><path data-connector="committed-effect" class="connector amberEdge" d="M 1555 274 L 1555 430" marker-end="url(#arrow-amber)"/></g><g class="edge" data-edge="effect-reconcile" data-label="UNKNOWN"><path data-connector="effect-reconcile" class="connector amberEdge" d="M 1430 472 L 1360 472" marker-end="url(#arrow-amber)"/></g><g class="edge" data-edge="reconcile-completed" data-label="query confirms original operation"><path data-connector="reconcile-completed" class="connector greenEdge" d="M 1180 514 L 1180 600 Q 1180 620 1200 620 L 1535 620 Q 1555 620 1555 640 L 1555 690" marker-end="url(#arrow-green)"/></g><g class="edge" data-edge="effect-completed" data-label="confirmed receipt"><path data-connector="effect-completed" class="connector greenEdge" d="M 1630 514 L 1630 640 Q 1630 660 1610 660 Q 1590 660 1590 680 L 1590 690" marker-end="url(#arrow-green)"/></g><g class="edge" data-edge="requested-skipped" data-label="leader contended"><path data-connector="requested-skipped" class="connector amberEdge" d="M 215 274 L 215 690" marker-end="url(#arrow-amber)"/></g><g class="edge" data-edge="fence-skipped" data-label="fence contended"><path data-connector="fence-skipped" class="connector amberEdge" d="M 835 274 L 835 324 Q 835 340 819 340 L 396 340 Q 380 340 380 356 L 380 716 Q 380 732 364 732 L 340 732" marker-end="url(#arrow-amber)"/></g><g class="edge" data-edge="running-rejected" data-label="stale authority or fence"><path data-connector="running-rejected" class="connector redEdge" d="M 1120 274 L 1120 350 Q 1120 370 1100 370 L 990 370 Q 970 370 970 390 L 970 544 Q 970 560 954 560 L 691 560 Q 675 560 675 576 L 675 690" marker-end="url(#arrow-red)"/></g><g class="edge" data-edge="requested-failed" data-label="unrecoverable execution failure"><path data-connector="requested-failed" class="connector redEdge" d="M 90 250 L 66 250 Q 50 250 50 266 L 50 876 Q 50 892 66 892 L 940 892" marker-end="url(#arrow-red)"/></g>
  <text class="footer" x="900" y="1005" text-anchor="middle">COMMITTED is not COMPLETED: a non-fenceable effect closes only after a durable receipt.</text></svg>