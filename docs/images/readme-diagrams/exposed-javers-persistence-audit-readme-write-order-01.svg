<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="980" viewBox="0 0 1400 980" role="img" aria-labelledby="title desc">
  <title id="title">Order audit write order</title>
  <desc id="desc">Top-to-bottom write order for Redis-backed JaVers audit persistence and Exposed current-row materialization.</desc>
  <defs>
    <style>
      svg{background:#f8fafc}
      .frame{fill:#ffffff;stroke:#d8e4ef;stroke-width:2}
      .title{font-family:"Architects Daughter";font-size:40px;fill:#142033}
      .subtitle,.stepText,.footer{font-family:"Comic Mono";fill:#435469}
      .subtitle{font-size:17px}.stepText{font-size:15px}.footer{font-size:13px;fill:#5f7181}
      .stepTitle{font-family:"Architects Daughter";font-size:27px;fill:#142033}
      .step{stroke-width:2.4}.guard{fill:#eef7ff;stroke:#7aa6cf}.audit{fill:#f7f1ff;stroke:#9b83c7}.failure{fill:#fff1f0;stroke:#d06a63}.row{fill:#fff7e8;stroke:#c59352}.read{fill:#effaf2;stroke:#75a985}
      .arrow{fill:none;stroke:#52748d;stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}
      .failArrow{fill:none;stroke:#bd4d45;stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#failArrow)}
      .number{font-family:"Comic Mono";font-size:16px;font-weight:700;fill:#ffffff}
      .circle{fill:#52748d}.failCircle{fill:#bd4d45}
    </style>
    <marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" viewBox="0 0 10 10" refX="9" refY="5" orient="auto" data-role="primary" data-tip-direction="positive-x"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#52748d" stroke-dasharray="none" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="failArrow" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" viewBox="0 0 10 10" refX="9" refY="5" orient="auto" data-role="primary" data-tip-direction="positive-x"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#bd4d45" stroke-dasharray="none" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>

  <rect class="frame" x="28" y="28" width="1344" height="924" rx="18"/>
  <text class="title" x="700" y="82" text-anchor="middle">Order Audit Write Order</text>
  <text class="subtitle" x="700" y="115" text-anchor="middle">The example rejects an unaudited write when the Redis-backed JaVers sink fails.</text>

  <rect class="step guard" x="300" y="162" width="800" height="104" rx="12"/>
  <circle class="circle" cx="346" cy="214" r="18"/><text class="number" x="346" y="220" text-anchor="middle">1</text>
  <text class="stepTitle" x="700" y="202" text-anchor="middle">Validate request</text>
  <text class="stepText" x="700" y="232" text-anchor="middle">author and order id must be present before any persistence happens</text>

  <path class="arrow" d="M 700 266 L 700 318"/>
  <rect class="step audit" x="300" y="318" width="800" height="112" rx="12"/>
  <circle class="circle" cx="346" cy="374" r="18"/><text class="number" x="346" y="380" text-anchor="middle">2</text>
  <text class="stepTitle" x="700" y="360" text-anchor="middle">Commit JaVers snapshot</text>
  <text class="stepText" x="700" y="390" text-anchor="middle">RedissonCdoSnapshotRepository stores durable Redis snapshot history</text>

  <path class="failArrow" d="M 700 430 L 700 482"/>
  <rect class="step failure" x="300" y="482" width="800" height="104" rx="12"/>
  <circle class="failCircle" cx="346" cy="534" r="18"/><text class="number" x="346" y="540" text-anchor="middle">3</text>
  <text class="stepTitle" x="700" y="522" text-anchor="middle">Audit sink gate</text>
  <text class="stepText" x="700" y="552" text-anchor="middle">failure stops here; success continues to the current-row write</text>

  <path class="arrow" d="M 700 586 L 700 638"/>
  <rect class="step row" x="300" y="638" width="800" height="112" rx="12"/>
  <circle class="circle" cx="346" cy="694" r="18"/><text class="number" x="346" y="700" text-anchor="middle">4</text>
  <text class="stepTitle" x="700" y="680" text-anchor="middle">Materialize current row</text>
  <text class="stepText" x="700" y="710" text-anchor="middle">Exposed OrderTable keeps only the latest order state</text>

  <path class="arrow" d="M 700 750 L 700 802"/>
  <rect class="step read" x="300" y="802" width="800" height="104" rx="12"/>
  <circle class="circle" cx="346" cy="854" r="18"/><text class="number" x="346" y="860" text-anchor="middle">5</text>
  <text class="stepTitle" x="700" y="842" text-anchor="middle">Read history from JaVers</text>
  <text class="stepText" x="700" y="872" text-anchor="middle">getHistory and latestSnapshotOrNull read snapshots, while diff is read-only</text>

  <text class="footer" x="700" y="932" text-anchor="middle">No distributed transaction is hidden; the example makes write order and failure behavior explicit.</text>
</svg>
