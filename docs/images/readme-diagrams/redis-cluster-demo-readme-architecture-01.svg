<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1660" height="760" viewBox="0 0 1660 760" role="img" aria-label="Redis Cluster demo architecture">
  <defs>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="124%"><feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#64748B" flood-opacity="0.16"/></filter>
    <marker id="arrowBlue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 12 6 L 0 12 Z" fill="#2563EB"/></marker>
    <marker id="arrowGreen" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 12 6 L 0 12 Z" fill="#16A34A"/></marker>
    <marker id="arrowRed" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 12 6 L 0 12 Z" fill="#DC2626"/></marker>
    <style>
      .canvas{fill:#F8FAFC}.frame{fill:#FFFFFF;stroke:#D6E0E8;stroke-width:1.4}.layer{fill:#F8FAFC;stroke:#CBD5E1;stroke-width:1.4}.title{font-family:"Architects Daughter";font-size:38px;fill:#102033}.subtitle{font-family:"Comic Mono";font-size:15px;fill:#51606F}.layerLabel{font-family:"Architects Daughter";font-size:24px;fill:#263548}.cardTitle{font-family:"Architects Daughter";font-size:28px;fill:#102033}.cardText{font-family:"Comic Mono";font-size:15px;fill:#415166}.nodeText{font-family:"Comic Mono";font-size:13px;fill:#415166}.line{fill:none;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round}.soft{stroke-dasharray:8 8}
    </style>
  </defs>
  <rect class="canvas" width="1660" height="760"/>
  <rect class="frame" x="24" y="24" width="1612" height="712" rx="24"/>
  <text class="title" x="830" y="72" text-anchor="middle">Redis Cluster demo architecture</text>
  <text class="subtitle" x="830" y="104" text-anchor="middle">Testcontainers starts a 3 master / 3 replica Redis Cluster and Spring Data routes cluster operations through Lettuce.</text>

  <rect class="layer" x="72" y="146" width="350" height="500" rx="18"/>
  <text class="layerLabel" x="100" y="184">Spring Boot app</text>
  <g filter="url(#shadow)">
    <rect x="92" y="242" width="292" height="120" rx="16" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.7"/>
    <text class="cardTitle" x="238" y="284" text-anchor="middle">RedisClusterApplication</text>
    <text class="cardText" x="238" y="316" text-anchor="middle">starts launcher singleton</text>
    <text class="cardText" x="238" y="342" text-anchor="middle">registers ClientResources</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="92" y="444" width="292" height="118" rx="16" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.7"/>
    <text class="cardTitle" x="238" y="486" text-anchor="middle">NumberService</text>
    <text class="cardText" x="238" y="518" text-anchor="middle">clusterConnection</text>
    <text class="cardText" x="238" y="544" text-anchor="middle">Int bytes -> doubled bytes</text>
  </g>

  <rect class="layer" x="466" y="146" width="330" height="500" rx="18"/>
  <text class="layerLabel" x="494" y="184">bluetape4k helpers</text>
  <g filter="url(#shadow)">
    <rect x="504" y="228" width="254" height="132" rx="16" fill="#F0FDF4" stroke="#16A34A" stroke-width="1.7"/>
    <rect x="526" y="268" width="42" height="42" rx="10" fill="#E0F2FE" stroke="#0284C7" stroke-width="2.2"/>
    <text x="547" y="295" text-anchor="middle" font-family="Comic Mono" font-size="14" fill="#0369A1">TC</text>
    <text class="cardTitle" x="668" y="270" text-anchor="middle">Redis Cluster</text>
    <text class="cardText" x="668" y="304" text-anchor="middle">Server launcher</text>
    <text class="cardText" x="657" y="330" text-anchor="middle">6 container nodes</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="504" y="444" width="254" height="118" rx="16" fill="#ECFEFF" stroke="#0891B2" stroke-width="1.7"/>
    <text class="cardTitle" x="631" y="486" text-anchor="middle">LettuceLib</text>
    <text class="cardText" x="631" y="518" text-anchor="middle">clientResources(cluster)</text>
    <text class="cardText" x="631" y="544" text-anchor="middle">container port mapping</text>
  </g>

  <rect class="layer" x="860" y="146" width="438" height="500" rx="18"/>
  <text class="layerLabel" x="888" y="184">Redis Cluster topology</text>
  <g filter="url(#shadow)">
    <rect x="900" y="232" width="358" height="318" rx="16" fill="#FFF7ED" stroke="#EA580C" stroke-width="1.7"/>
    <circle cx="1082" cy="274" r="24" fill="#FEE2E2" stroke="#DC2626" stroke-width="2.4"/>
    <text x="1082" y="283" text-anchor="middle" font-family="Comic Mono" font-size="16" fill="#B91C1C">R</text>
    <text class="cardTitle" x="1079" y="324" text-anchor="middle">3 masters + 3 replicas</text>
    <g>
      <rect x="934" y="360" width="88" height="58" rx="12" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.4"/>
      <text class="nodeText" x="978" y="384" text-anchor="middle">Master 1</text>
      <text class="nodeText" x="978" y="404" text-anchor="middle">0-5460</text>
      <rect x="934" y="456" width="88" height="46" rx="12" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.4"/>
      <text class="nodeText" x="978" y="484" text-anchor="middle">Replica 1</text>
    </g>
    <g>
      <rect x="1035" y="360" width="88" height="58" rx="12" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.4"/>
      <text class="nodeText" x="1079" y="384" text-anchor="middle">Master 2</text>
      <text class="nodeText" x="1079" y="404" text-anchor="middle">5461-10922</text>
      <rect x="1035" y="456" width="88" height="46" rx="12" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.4"/>
      <text class="nodeText" x="1079" y="484" text-anchor="middle">Replica 2</text>
    </g>
    <g>
      <rect x="1136" y="360" width="88" height="58" rx="12" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.4"/>
      <text class="nodeText" x="1180" y="384" text-anchor="middle">Master 3</text>
      <text class="nodeText" x="1180" y="404" text-anchor="middle">10923-16383</text>
      <rect x="1136" y="456" width="88" height="46" rx="12" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.4"/>
      <text class="nodeText" x="1180" y="484" text-anchor="middle">Replica 3</text>
    </g>
    <path class="line soft" d="M 978 418 L 978 456" stroke="#DC2626" marker-end="url(#arrowRed)"/>
    <path class="line soft" d="M 1079 418 L 1079 456" stroke="#DC2626" marker-end="url(#arrowRed)"/>
    <path class="line soft" d="M 1180 418 L 1180 456" stroke="#DC2626" marker-end="url(#arrowRed)"/>
  </g>

  <rect class="layer" x="1340" y="146" width="248" height="500" rx="18"/>
  <text class="layerLabel" x="1368" y="184">Tests</text>
  <g filter="url(#shadow)">
    <rect x="1362" y="246" width="204" height="96" rx="16" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.7"/>
    <text class="cardTitle" x="1464" y="286" text-anchor="middle">BasicUsage</text>
    <text class="cardText" x="1464" y="316" text-anchor="middle">single and multi slot</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="1362" y="438" width="204" height="96" rx="16" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.7"/>
    <text class="cardTitle" x="1464" y="478" text-anchor="middle">NumberService</text>
    <text class="cardText" x="1464" y="508" text-anchor="middle">1..99 doubled</text>
  </g>

  <path class="line" d="M 384 302 L 504 294" stroke="#2563EB" marker-end="url(#arrowBlue)"/>
  <path class="line" d="M 384 504 L 504 504" stroke="#0D9488" marker-end="url(#arrowGreen)"/>
  <path class="line" d="M 758 294 L 900 314" stroke="#16A34A" marker-end="url(#arrowGreen)"/>
  <path class="line" d="M 758 504 L 900 482" stroke="#0891B2" marker-end="url(#arrowBlue)"/>
  <path class="line" d="M 1258 392 L 1362 294" stroke="#2563EB" marker-end="url(#arrowBlue)"/>
  <path class="line" d="M 1258 482 L 1362 486" stroke="#0D9488" marker-end="url(#arrowGreen)"/>
</svg>
