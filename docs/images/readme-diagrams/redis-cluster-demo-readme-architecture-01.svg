  <rect class="frame" x="30.72" y="24" width="2063.36" height="712" rx="24"/>  <text class="title" x="1062.4" y="72" text-anchor="middle">Redis Cluster demo architecture</text>
  <text class="subtitle" x="1062.4" y="104" text-anchor="middle">Testcontainers starts a 3 master / 3 replica Redis Cluster and Spring Data routes cluster operations through Lettuce.</text>

