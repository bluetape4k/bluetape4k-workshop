<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1720" height="1160" viewBox="0 0 1720 1160" role="img" aria-label="API Gateway request sequence">
  <defs>
    <marker id="callArrow" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" viewBox="0 0 10 10" refX="9" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#3f7d9c"/></marker>
    <marker id="routeArrow" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" viewBox="0 0 10 10" refX="9" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#5f8f5b"/></marker>
    <marker id="redisArrow" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" viewBox="0 0 10 10" refX="9" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#b44d49"/></marker>
    <marker id="returnArrow" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" viewBox="0 0 10 10" refX="9" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#9b7d54"/></marker>
    <style>
      .canvas { fill: #f7fafc; }
      .frame { fill: #fffefd; stroke: #314451; stroke-width: 2.2; }
      .title { font-family: "Architects Daughter"; font-size: 36px; fill: #1d2b38; }
      .subtitle { font-family: "Comic Mono"; font-size: 15px; fill: #516172; }
      .participant { fill: #f8fbff; stroke: #6f8796; stroke-width: 2; }
      .participantText { font-family: "Architects Daughter"; font-size: 20px; fill: #1d2b38; }
      .participantSub { font-family: "Comic Mono"; font-size: 11px; fill: #596a78; }
      .lifeline { stroke: #90a4b2; stroke-width: 2; stroke-dasharray: 8 8; }
      .activation { fill: #edf7ef; stroke: #89b083; stroke-width: 1.6; }
      .altBox { fill: rgba(238, 246, 255, 0.54); stroke: #8fb4d6; stroke-width: 1.8; }
      .altLabel { font-family: "Comic Mono"; font-size: 14px; font-weight: 700; fill: #3f6f8d; }
      .divider { stroke: #8fb4d6; stroke-width: 1.4; stroke-dasharray: 8 8; }
      .msg { font-family: "Comic Mono"; font-size: 13px; font-weight: 700; }
      .badgeText { font-family: "Comic Mono"; font-size: 12px; font-weight: 700; }
      .label { fill: #ffffff; stroke-width: 1.3; }
      .call { fill: none; stroke: #3f7d9c; stroke-width: 3.6; marker-end: url(#callArrow); stroke-linecap: round; }
      .route { fill: none; stroke: #5f8f5b; stroke-width: 3.6; marker-end: url(#routeArrow); stroke-linecap: round; }
      .redis { fill: none; stroke: #b44d49; stroke-width: 3.6; marker-end: url(#redisArrow); stroke-linecap: round; }
      .return { fill: none; stroke: #9b7d54; stroke-width: 3.2; stroke-dasharray: 8 7; marker-end: url(#returnArrow); stroke-linecap: round; }
      .note { font-family: "Comic Mono"; font-size: 12px; fill: #607080; }
    </style>
  </defs>

  <rect class="canvas" width="1720" height="1160"/>
  <rect class="frame" x="28" y="28" width="1664" height="1104" rx="24"/>
  <text class="title" x="860" y="78" text-anchor="middle">API Gateway Request Flow</text>
  <text class="subtitle" x="860" y="106" text-anchor="middle">A service request checks the Redis-backed rate bucket, then Gateway rewrites and forwards the path.</text>

  <rect class="participant" x="84" y="146" width="160" height="62" rx="10"/>
  <text class="participantText" x="164" y="174" text-anchor="middle">Client</text>
  <text class="participantSub" x="164" y="194" text-anchor="middle">HTTP caller</text>

  <rect class="participant" x="344" y="146" width="190" height="62" rx="10"/>
  <text class="participantText" x="439" y="174" text-anchor="middle">RedirectWebFilter</text>
  <text class="participantSub" x="439" y="194" text-anchor="middle">/ -> swagger</text>

  <rect class="participant" x="638" y="146" width="174" height="62" rx="10"/>
  <text class="participantText" x="725" y="174" text-anchor="middle">Bucket4j</text>
  <text class="participantSub" x="725" y="194" text-anchor="middle">WebFlux filter</text>

  <rect class="participant" x="920" y="146" width="190" height="62" rx="10"/>
  <text class="participantText" x="1015" y="174" text-anchor="middle">Gateway</text>
  <text class="participantSub" x="1015" y="194" text-anchor="middle">route + rewrite</text>

  <rect class="participant" x="1214" y="146" width="190" height="62" rx="10"/>
  <text class="participantText" x="1309" y="174" text-anchor="middle">Redis</text>
  <text class="participantSub" x="1309" y="194" text-anchor="middle">bucket cache</text>

  <rect class="participant" x="1498" y="146" width="160" height="62" rx="10"/>
  <text class="participantText" x="1578" y="174" text-anchor="middle">Service</text>
  <text class="participantSub" x="1578" y="194" text-anchor="middle">8081 / 8082</text>

  <path class="lifeline" d="M 164 208 V 1090"/>
  <path class="lifeline" d="M 439 208 V 1090"/>
  <path class="lifeline" d="M 725 208 V 1090"/>
  <path class="lifeline" d="M 1015 208 V 1090"/>
  <path class="lifeline" d="M 1309 208 V 1090"/>
  <path class="lifeline" d="M 1578 208 V 1090"/>

  <rect class="activation" x="431" y="284" width="16" height="246" rx="8"/>
  <rect class="activation" x="717" y="674" width="16" height="236" rx="8"/>
  <rect class="activation" x="1007" y="898" width="16" height="160" rx="8"/>
  <rect class="activation" x="1301" y="750" width="16" height="96" rx="8"/>
  <rect class="activation" x="1570" y="970" width="16" height="90" rx="8"/>

  <rect class="altBox" x="62" y="258" width="1600" height="840" rx="18"/>
  <text class="altLabel" x="86" y="286">alt</text>
  <line class="divider" x1="62" y1="554" x2="1662" y2="554"/>
  <text class="altLabel" x="86" y="586">service route</text>
  <text class="altLabel" x="86" y="330">root path</text>

  <rect x="188" y="318" width="214" height="32" rx="16" class="label" stroke="#3f7d9c"/>
  <text class="msg" x="295" y="339" text-anchor="middle" fill="#3f7d9c">GET /</text>
  <path class="call" d="M 164 366 L 439 366"/>

  <rect x="480" y="438" width="310" height="32" rx="16" class="label" stroke="#9b7d54"/>
  <text class="msg" x="635" y="459" text-anchor="middle" fill="#9b7d54">rewrite to /swagger-ui.html</text>
  <path class="return" d="M 439 494 L 164 494"/>

  <rect x="190" y="626" width="354" height="32" rx="16" class="label" stroke="#3f7d9c"/>
  <text class="msg" x="367" y="647" text-anchor="middle" fill="#3f7d9c">GET /customer-service/api/v1/customers</text>
  <path class="call" d="M 164 674 L 725 674"/>

  <rect x="772" y="706" width="296" height="32" rx="16" class="label" stroke="#b44d49"/>
  <text class="msg" x="920" y="727" text-anchor="middle" fill="#b44d49">check bucket for request key</text>
  <path class="redis" d="M 725 750 L 1309 750"/>

  <rect x="970" y="790" width="222" height="32" rx="16" class="label" stroke="#9b7d54"/>
  <text class="msg" x="1081" y="811" text-anchor="middle" fill="#9b7d54">bucket allowed</text>
  <path class="return" d="M 1309 846 L 725 846"/>

  <rect x="778" y="872" width="314" height="32" rx="16" class="label" stroke="#5f8f5b"/>
  <text class="msg" x="935" y="893" text-anchor="middle" fill="#5f8f5b">match route + RewritePath</text>
  <path class="route" d="M 725 910 L 1015 910"/>

  <rect x="1112" y="934" width="362" height="32" rx="16" class="label" stroke="#5f8f5b"/>
  <text class="msg" x="1293" y="955" text-anchor="middle" fill="#5f8f5b">GET /api/v1/customers to :8081</text>
  <path class="route" d="M 1015 996 L 1578 996"/>

  <rect x="1068" y="1028" width="292" height="32" rx="16" class="label" stroke="#9b7d54"/>
  <text class="msg" x="1214" y="1049" text-anchor="middle" fill="#9b7d54">response + X-BLUETAPE4K-API</text>
  <path class="return" d="M 1578 1078 L 164 1078"/>
</svg>
