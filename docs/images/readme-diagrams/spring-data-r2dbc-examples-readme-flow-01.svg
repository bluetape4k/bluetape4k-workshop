<svg xmlns="http://www.w3.org/2000/svg" width="1740" height="820" viewBox="0 0 1740 820">
  <defs>
    <style>
      .bg{fill:#f8fafc}.title{font-family:'Architects Daughter','Comic Sans MS',cursive;font-size:34px;fill:#18212f}
      .card-title{font-family:'Architects Daughter','Comic Sans MS',cursive;font-size:27px;fill:#101827}
      .body{font-family:'Comic Mono','Comic Sans MS',monospace;font-size:18px;fill:#364152}.small{font-family:'Comic Mono','Comic Sans MS',monospace;font-size:15px;fill:#475569}
      .card{fill:#fff;stroke:#cbd5e1;stroke-width:1.5;rx:18;ry:18}.lane{fill:#f1f5f9;stroke:#cbd5e1;stroke-width:1.3;rx:20;ry:20}
      .line{fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}.db{fill:#fff;stroke:#94a3b8;stroke-width:2}.dbtop{fill:#e0f2fe;stroke:#0284c7;stroke-width:2}
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L11,6 L1,11 Z" fill="#2563eb" stroke-dasharray="none"/></marker>
    <marker id="arrow-green" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L11,6 L1,11 Z" fill="#059669" stroke-dasharray="none"/></marker>
  </defs>
  <rect class="bg" width="1740" height="820"/>
  <text class="title" x="70" y="70">Integration Test Flow</text>

  <rect class="lane" x="70" y="125" width="500" height="575"/>
  <rect class="lane" x="620" y="125" width="500" height="575"/>
  <rect class="lane" x="1170" y="125" width="500" height="575"/>

  <text class="card-title" x="105" y="175">Basics</text>
  <rect class="card" x="120" y="220" width="400" height="90"/>
  <text class="card-title" x="150" y="258">Prepare customer</text>
  <text class="body" x="150" y="286">DROP / CREATE through DatabaseClient</text>
  <rect class="card" x="120" y="375" width="400" height="90"/>
  <text class="card-title" x="150" y="413">Repository calls</text>
  <text class="body" x="150" y="441">saveAll, findAll, findByLastname</text>
  <rect class="card" x="120" y="530" width="400" height="90"/>
  <text class="card-title" x="150" y="568">Transaction tests</text>
  <text class="body" x="150" y="596">Dave rolls back, Carter commits</text>

  <text class="card-title" x="655" y="175">Entity callback</text>
  <rect class="card" x="670" y="220" width="400" height="90"/>
  <text class="card-title" x="700" y="258">Initialize schema</text>
  <text class="body" x="700" y="286">Sequence + customer table</text>
  <rect class="card" x="670" y="375" width="400" height="90"/>
  <text class="card-title" x="700" y="413">BeforeConvertCallback</text>
  <text class="body" x="700" y="441">SELECT NEXT VALUE FOR primary_key</text>
  <rect class="card" x="670" y="530" width="400" height="90"/>
  <text class="card-title" x="700" y="568">Save customer</text>
  <text class="body" x="700" y="596">copy with generated id</text>

  <text class="card-title" x="1205" y="175">Query-by-Example</text>
  <rect class="card" x="1220" y="220" width="400" height="90"/>
  <text class="card-title" x="1250" y="258">Seed person rows</text>
  <text class="body" x="1250" y="286">White and Schrader examples</text>
  <rect class="card" x="1220" y="375" width="400" height="90"/>
  <text class="card-title" x="1250" y="413">Build matcher</text>
  <text class="body" x="1250" y="441">Kotlin property names</text>
  <rect class="card" x="1220" y="530" width="400" height="90"/>
  <text class="card-title" x="1250" y="568">Execute QBE</text>
  <text class="body" x="1250" y="596">count, findOne, findAll</text>

  <g transform="translate(715 705)">
    <path class="db" d="M0,24 C0,4 310,4 310,24 L310,76 C310,96 0,96 0,76 Z"/>
    <ellipse class="dbtop" cx="155" cy="24" rx="155" ry="22"/>
    <path class="db" d="M0,24 C0,44 310,44 310,24"/>
    <text class="card-title" x="112" y="64">H2 R2DBC</text>
  </g>

