  <line x1="190" y1="232" x2="190" y2="870" class="lifeline"/>
  <g filter="url(#shadow)"><rect x="468" y="156" width="230" height="76" rx="10" class="header"/><text x="583" y="186" text-anchor="middle" class="participant">Repository</text><text x="583" y="211" text-anchor="middle" class="role">suspend boundary</text></g>
  <line x1="583" y1="232" x2="583" y2="870" class="lifeline"/>
  <g filter="url(#shadow)"><rect x="862" y="156" width="230" height="76" rx="10" class="header"/><text x="977" y="186" text-anchor="middle" class="participant">Exposed SQL DSL</text><text x="977" y="211" text-anchor="middle" class="role">query builder</text></g>
  <line x1="977" y1="232" x2="977" y2="870" class="lifeline"/>
  <g filter="url(#shadow)"><rect x="1255" y="156" width="230" height="76" rx="10" class="header"/><image x="1271" y="176" width="36" height="36" href="data:image/svg+xml;base64," preserveAspectRatio="xMidYMid meet"/><text x="1390" y="186" text-anchor="middle" class="participant">Database</text>  <text x="1390" y="211" text-anchor="middle" class="role">H2 / MySQL</text></g>
  <line x1="1370" y1="232" x2="1370" y2="870" class="lifeline"/>
  <rect x="271.5" y="252" width="230.0" height="34" rx="17" class="label callLabel"/>
  <circle cx="295.5" cy="269" r="13" class="badge callBadge"/><text x="295.5" y="274" text-anchor="middle" class="badgeText callText">1</text>
  <text x="319.5" y="274" class="msg callText">GET /movies (suspend)</text>
  <path d="M 190 300 L 583 300" class="call" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-call)"/>
  <rect x="658.8" y="328" width="242.5" height="34" rx="17" class="label workLabel"/>
  <circle cx="682.8" cy="345" r="13" class="badge workBadge"/><text x="682.8" y="350" text-anchor="middle" class="badgeText workText">2</text>
  <text x="706.8" y="350" class="msg workText">newSuspendedTransaction</text>
  <path d="M 583 376 L 977 376" class="work" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-work)"/>
  <rect x="1058.5" y="404" width="230.0" height="34" rx="17" class="label workLabel"/>
  <circle cx="1082.5" cy="421" r="13" class="badge workBadge"/><text x="1082.5" y="426" text-anchor="middle" class="badgeText workText">3</text>
  <text x="1106.5" y="426" class="msg workText">SELECT * FROM movies</text>
  <path d="M 977 452 L 1370 452" class="work" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-work)"/>
  <rect x="1058.5" y="480" width="230.0" height="34" rx="17" class="label returnLabel"/>
  <circle cx="1082.5" cy="497" r="13" class="badge returnBadge"/><text x="1082.5" y="502" text-anchor="middle" class="badgeText returnText">4</text>
  <text x="1106.5" y="502" class="msg returnText">ResultSet rows</text>
  <path d="M 1370 528 L 977 528" class="return" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-ret)"/>
  <rect x="665" y="556" width="230.0" height="34" rx="17" class="label returnLabel"/>
  <circle cx="689" cy="573" r="13" class="badge returnBadge"/><text x="689" y="578" text-anchor="middle" class="badgeText returnText">5</text>
  <text x="713" y="578" class="msg returnText">List&lt;MovieDTO&gt;</text>
  <path d="M 977 604 L 583 604" class="return" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-ret)"/>
  <rect x="271.5" y="632" width="230.0" height="34" rx="17" class="label returnLabel"/>
  <circle cx="295.5" cy="649" r="13" class="badge returnBadge"/><text x="295.5" y="654" text-anchor="middle" class="badgeText returnText">6</text>
  <text x="319.5" y="654" class="msg returnText">200 OK + JSON body</text>
  <path d="M 583 680 L 190 680" class="return" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-ret)"/>
  <rect x="271.5" y="708" width="230.0" height="34" rx="17" class="label callLabel"/>
  <circle cx="295.5" cy="725" r="13" class="badge callBadge"/><text x="295.5" y="730" text-anchor="middle" class="badgeText callText">7</text>
  <text x="319.5" y="730" class="msg callText">POST /actors {dto}</text>
  <path d="M 190 756 L 583 756" class="call" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-call)"/>
  <rect x="90" y="894" width="1380" height="40" rx="12" fill="#FFFFFF" stroke="#CCD7DA" stroke-width="2"/>
  <text x="780" y="920" text-anchor="middle" class="footer">Reader contract: request order, branch ownership, and infrastructure boundary are shown without hiding call labels.</text>
</svg>
