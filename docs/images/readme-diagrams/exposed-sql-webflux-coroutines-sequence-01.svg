<svg xmlns="http://www.w3.org/2000/svg" width="960" height="500" viewBox="0 0 960 500" role="img" aria-label="Exposed SQL WebFlux Coroutines Sequence">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#1f2937" flood-opacity="0.10"/></filter>
  <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth">
    <path d="M1,1 L8,4.5 L1,8 Z" fill="#758297"/>
  </marker>
  <style>
    .canvas{fill:#f7f9fc}.frame{fill:#fff;stroke:#d8e0ea;stroke-width:1.5}
    .title{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:38px;font-weight:400;fill:#102033}
    .subtitle{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:14px;font-weight:400;fill:#536273}
    .smallLabel{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:21px;font-weight:400;fill:#102033}
    .strong{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#102033}
    .small{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#536273}
    .card{stroke-width:2.1;filter:url(#shadow)}
    .lifeline{stroke:#b0bbca;stroke-width:1.5;stroke-dasharray:6 4;fill:none}
    .reqArrow{stroke:#5B8DEF;stroke-width:2.1;fill:none;marker-end:url(#arrow)}
    .rspArrow{stroke:#45A7A1;stroke-width:2.1;stroke-dasharray:7 4;fill:none;marker-end:url(#arrow)}
  </style>
</defs>
<rect class="canvas" width="960" height="500"/>
<rect class="frame" x="24" y="20" width="912" height="456" rx="18"/>
<text class="title" x="44" y="62">WebFlux Coroutine SQL Sequence</text>
<text class="subtitle" x="44" y="84">Controller suspend → Repository → newSuspendedTransaction(IO) → DB</text>

<!-- Lifeline headers -->
<rect class="card" x="24" y="96" width="150" height="48" rx="14" fill="#E8F3FF" stroke="#5B8DEF"/>
<text class="smallLabel" x="99" y="126" text-anchor="middle">Controller</text>
<line class="lifeline" x1="99" y1="144" x2="99" y2="472"/>

<rect class="card" x="230" y="96" width="150" height="48" rx="14" fill="#EAF7EF" stroke="#58A978"/>
<text class="smallLabel" x="305" y="126" text-anchor="middle">Repository</text>
<line class="lifeline" x1="305" y1="144" x2="305" y2="472"/>

<rect class="card" x="436" y="96" width="180" height="48" rx="14" fill="#FFF3D9" stroke="#D6A441"/>
<text class="smallLabel" x="526" y="118" text-anchor="middle">Exposed SQL DSL</text>
<text class="small" x="526" y="136" text-anchor="middle">(suspendedTx)</text>
<line class="lifeline" x1="526" y1="144" x2="526" y2="472"/>

<rect class="card" x="672" y="96" width="150" height="48" rx="14" fill="#FDECEF" stroke="#DC6B82"/>
<text class="smallLabel" x="747" y="120" text-anchor="middle">DB</text>
<text class="small" x="747" y="136" text-anchor="middle">(H2 / MySQL)</text>
<line class="lifeline" x1="747" y1="144" x2="747" y2="472"/>

<!-- 1: GET /movies -->
<rect x="104" y="162" width="160" height="26" rx="8" fill="#fff" opacity="0.95"/>
<text class="strong" x="112" y="179">1. GET /movies (suspend)</text>
<path class="reqArrow" d="M99,190 L303,190"/>

<!-- 2: findAll() -->
<rect x="310" y="200" width="180" height="26" rx="8" fill="#fff" opacity="0.95"/>
<text class="strong" x="318" y="217">2. newSuspendedTransaction</text>
<path class="reqArrow" d="M305,228 L524,228"/>

<!-- 3: SELECT -->
<rect x="530" y="238" width="200" height="26" rx="8" fill="#fff" opacity="0.95"/>
<text class="strong" x="538" y="255">3. SELECT * FROM movies</text>
<path class="reqArrow" d="M526,266 L745,266"/>

<!-- 4: ResultSet -->
<rect x="530" y="284" width="180" height="26" rx="8" fill="#fff" opacity="0.95"/>
<text class="strong" x="538" y="301">4. ResultSet rows</text>
<path class="rspArrow" d="M745,312 L528,312"/>

<!-- 5: List&lt;MovieDTO&gt; -->
<rect x="310" y="330" width="160" height="26" rx="8" fill="#fff" opacity="0.95"/>
<text class="strong" x="318" y="347">5. List&lt;MovieDTO&gt;</text>
<path class="rspArrow" d="M526,358 L307,358"/>

<!-- 6: response -->
<rect x="104" y="376" width="160" height="26" rx="8" fill="#fff" opacity="0.95"/>
<text class="strong" x="112" y="393">6. 200 OK + JSON body</text>
<path class="rspArrow" d="M305,404 L101,404"/>

<!-- 7: POST actor -->
<rect x="104" y="422" width="160" height="26" rx="8" fill="#fff" opacity="0.95"/>
<text class="strong" x="112" y="439">7. POST /actors {dto}</text>
<path class="reqArrow" d="M99,448 L303,448"/>
</svg>
