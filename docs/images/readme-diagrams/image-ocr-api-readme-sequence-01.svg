<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="950" viewBox="0 0 1500 950" role="img" aria-labelledby="title desc">
  <title id="title">Image OCR API Request Sequence</title>
  <desc id="desc">The controller validates upload input, the service decodes the image, then returns fallback data or calls a bounded native OCR engine.</desc>
  <defs>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="124%"><feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#64748B" flood-opacity="0.14"/></filter>
    <marker id="arrow-call" viewBox="0 0 10 10" markerWidth="14" markerHeight="14" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#3F7D9C" stroke-dasharray="none" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="arrow-work" viewBox="0 0 10 10" markerWidth="14" markerHeight="14" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#6E8F4F" stroke-dasharray="none" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="arrow-ret" viewBox="0 0 10 10" markerWidth="14" markerHeight="14" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#9B7D54" stroke-dasharray="none" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <style>
      .title{font-family:"Architects Daughter";font-size:40px;fill:#263238}.subtitle,.msg,.footer{font-family:"Comic Mono";fill:#36464F}.subtitle{font-size:17px}.participant{font-family:"Architects Daughter";font-size:19px;fill:#1F3138}.role{font-family:"Comic Mono";font-size:12px;fill:#546A73}.msg{font-size:13px}.footer{font-size:14px;fill:#60727D}.frame{fill:#FBFCF8;stroke:#41545D;stroke-width:3}.header{fill:#FFFFFF;stroke:#546E7A;stroke-width:2}.lifeline{stroke:#9AAAB1;stroke-width:2;stroke-dasharray:7 8;stroke-linecap:round}.call,.work,.return{fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.call{stroke:#3F7D9C;marker-end:url(#arrow-call)}.work{stroke:#6E8F4F;marker-end:url(#arrow-work)}.return{stroke:#9B7D54;stroke-width:2.6;stroke-dasharray:8 6;marker-end:url(#arrow-ret)}.message-label{fill:#FFFFFF;stroke:#D7E0E4;stroke-width:1.5}.badge{stroke-width:1.8}.callBadge{fill:#EAF4F8;stroke:#3F7D9C}.workBadge{fill:#EEF7F0;stroke:#6E8F4F}.returnBadge{fill:#FFF7E8;stroke:#9B7D54}.badgeText{font-family:"Comic Mono";font-size:12px;font-weight:700}.callText,.badgeText.callText{fill:#2F6F8E}.workText,.badgeText.workText{fill:#55783F}.returnText,.badgeText.returnText{fill:#7F6038}
    </style>
  </defs>
  <rect x="24" y="24" width="1452" height="902" rx="20" class="frame"/>
  <text x="750" y="76" text-anchor="middle" class="title">Image OCR API Request Sequence</text>
  <text x="750" y="106" text-anchor="middle" class="subtitle">Fallback and native paths share upload validation; only the native path calls Tesseract.</text>

  <g filter="url(#shadow)"><rect x="80" y="156" width="220" height="76" rx="10" class="header"/><text x="190" y="186" text-anchor="middle" class="participant">Client</text><text x="190" y="211" text-anchor="middle" class="role">multipart caller</text></g>
  <line x1="190" y1="232" x2="190" y2="846" class="lifeline"/>
  <g filter="url(#shadow)"><rect x="390" y="156" width="220" height="76" rx="10" class="header"/><text x="500" y="186" text-anchor="middle" class="participant">Controller</text><text x="500" y="211" text-anchor="middle" class="role">ImageOcrController</text></g>
  <line x1="500" y1="232" x2="500" y2="846" class="lifeline"/>
  <g filter="url(#shadow)"><rect x="700" y="156" width="220" height="76" rx="10" class="header"/><text x="810" y="186" text-anchor="middle" class="participant">Service</text><text x="810" y="211" text-anchor="middle" class="role">ImageOcrServiceImpl</text></g>
  <line x1="810" y1="232" x2="810" y2="846" class="lifeline"/>
  <g filter="url(#shadow)"><rect x="1010" y="156" width="220" height="76" rx="10" class="header"/><text x="1120" y="186" text-anchor="middle" class="participant">OcrEngine</text><text x="1120" y="211" text-anchor="middle" class="role">Tesseract opt-in</text></g>
  <line x1="1120" y1="232" x2="1120" y2="846" class="lifeline"/>
  <g filter="url(#shadow)"><rect x="1280" y="156" width="150" height="76" rx="10" class="header"/><text x="1355" y="186" text-anchor="middle" class="participant">Response</text><text x="1355" y="211" text-anchor="middle" class="role">JSON or 400</text></g>
  <line x1="1355" y1="232" x2="1355" y2="846" class="lifeline"/>

  <rect x="212" y="306" width="260" height="34" rx="17" class="message-label"/>
  <circle cx="236" cy="323" r="13" class="badge callBadge"/><text x="236" y="328" text-anchor="middle" class="badgeText callText">1</text>
  <text x="260" y="328" class="msg callText">POST image plus language</text>
  <path d="M 190 280 L 500 280" class="call"/>

  <rect x="522" y="386" width="282" height="34" rx="17" class="message-label"/>
  <circle cx="546" cy="403" r="13" class="badge workBadge"/><text x="546" y="408" text-anchor="middle" class="badgeText workText">2</text>
  <text x="570" y="408" class="msg workText">validate media, bytes, pixels</text>
  <path d="M 500 360 L 810 360" class="call"/>

  <rect x="836" y="466" width="252" height="34" rx="17" class="message-label"/>
  <circle cx="860" cy="483" r="13" class="badge returnBadge"/><text x="860" y="488" text-anchor="middle" class="badgeText returnText">3</text>
  <text x="884" y="488" class="msg returnText">400 for invalid uploads</text>
  <path d="M 1355 440 L 190 440" class="return"/>

  <rect x="566" y="546" width="370" height="34" rx="17" class="message-label"/>
  <circle cx="590" cy="563" r="13" class="badge callBadge"/><text x="590" y="568" text-anchor="middle" class="badgeText callText">4</text>
  <text x="614" y="568" class="msg callText">native disabled returns UNAVAILABLE</text>
  <path d="M 810 520 L 1355 520" class="call"/>

  <rect x="835" y="626" width="275" height="34" rx="17" class="message-label"/>
  <circle cx="859" cy="643" r="13" class="badge workBadge"/><text x="859" y="648" text-anchor="middle" class="badgeText workText">5</text>
  <text x="883" y="648" class="msg workText">bounded recognize call</text>
  <path d="M 810 600 L 1120 600" class="call"/>

  <rect x="846" y="706" width="265" height="34" rx="17" class="message-label"/>
  <circle cx="870" cy="723" r="13" class="badge returnBadge"/><text x="870" y="728" text-anchor="middle" class="badgeText returnText">6</text>
  <text x="894" y="728" class="msg returnText">text or sanitized failure</text>
  <path d="M 1120 680 L 810 680" class="return"/>

  <rect x="782" y="786" width="390" height="34" rx="17" class="message-label"/>
  <circle cx="806" cy="803" r="13" class="badge callBadge"/><text x="806" y="808" text-anchor="middle" class="badgeText callText">7</text>
  <text x="830" y="808" class="msg callText">JSON has status, languages, blocks, warnings</text>
  <path d="M 1355 760 L 190 760" class="return"/>

  <rect x="110" y="870" width="1280" height="40" rx="12" fill="#FFFFFF" stroke="#CCD7DA" stroke-width="2"/>
  <text x="750" y="896" text-anchor="middle" class="footer">Reader contract: native OCR is opt-in; fallback still validates real image input before skipping Tesseract.</text>
</svg>
