  <path class="line" d="M 586.24 645 L 711.68 645" stroke="#16A34A" marker-end="url(#arrowGreen)" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="line" d="M 1057.28 645 L 1210.88 645" stroke="#64748B" marker-end="url(#arrowSlate)" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
