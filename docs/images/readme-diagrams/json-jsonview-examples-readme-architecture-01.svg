<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1766.4" height="780" viewBox="0 0 1766.4 780" role="img" aria-label="JsonView examples architecture diagram">
  <defs>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#64748B" flood-opacity="0.17"/>
    </filter>
    <marker id="arrowBlue" markerWidth="14" markerHeight="14" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 12 12" data-role="primary" data-tip-direction="positive-x">
      <path d="M 0 0 L 12 6 L 0 12 Z" fill="#2563EB" stroke-dasharray="none" stroke-linecap="round" stroke-linejoin="round" stroke="#2563EB" stroke-width="0"/>
    </marker>
    <marker id="arrowGreen" markerWidth="14" markerHeight="14" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 12 12" data-role="primary" data-tip-direction="positive-x">
      <path d="M 0 0 L 12 6 L 0 12 Z" fill="#16A34A" stroke-dasharray="none" stroke-linecap="round" stroke-linejoin="round" stroke="#16A34A" stroke-width="0"/>
    </marker>
    <marker id="arrowAmber" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 12 6 L 0 12 Z" fill="#C47A12" stroke-dasharray="none" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrowSlate" markerWidth="14" markerHeight="14" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 12 12" data-role="primary" data-tip-direction="positive-x">
      <path d="M 0 0 L 12 6 L 0 12 Z" fill="#64748B" stroke-dasharray="none" stroke-linecap="round" stroke-linejoin="round" stroke="#64748B" stroke-width="0"/>
    </marker>
    <style>
      .canvas { fill: #F8FAFC; }
      .frame { fill: #FFFFFF; stroke: #D6E0E8; stroke-width: 1.4; }
      .layerApi { fill: #EFF6FF; stroke: #93C5FD; stroke-width: 1.5; }
      .layerContract { fill: #ECFDF5; stroke: #86EFAC; stroke-width: 1.5; }
      .layerRuntime { fill: #FFF7ED; stroke: #FDBA74; stroke-width: 1.5; }
      .title { font-family: "Architects Daughter"; font-size: 36px; fill: #102033; }
      .subtitle { font-family: "Comic Mono"; font-size: 14px; fill: #51606F; }
      .layerLabel { font-family: "Architects Daughter"; font-size: 22px; fill: #172033; }
      .cardTitle { font-family: "Architects Daughter"; font-size: 25px; fill: #102033; }
      .cardText { font-family: "Comic Mono"; font-size: 14px; fill: #415166; }
      .line { fill: none; stroke-width: 3.2; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  <marker id="arrowAmber-d97706" markerWidth="14" markerHeight="14" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 12 12" data-role="primary" data-tip-direction="positive-x">
      <path stroke-dasharray="none" d="M 0 0 L 12 6 L 0 12 Z" fill="#D97706" stroke-linecap="round" stroke-linejoin="round" stroke="#D97706" stroke-width="0"/>
    </marker>
</defs>
  <rect class="canvas" width="1766.4" height="780"/>
  <rect class="frame" x="35.84" y="24" width="1694.72" height="732" rx="24"/>

  <text class="title" x="883.2" y="66" text-anchor="middle">JsonView response filtering</text>
  <text class="subtitle" x="883.2" y="94" text-anchor="middle">Spring endpoints choose a view, Jackson serializes only that view's ArticleDTO fields.</text>

  <rect class="layerApi" x="81.92" y="124" width="1602.56" height="162" rx="18"/>
  <text class="layerLabel" x="117.76" y="158">HTTP API</text>
  <g filter="url(#shadow)">
    <rect x="143.36" y="184" width="314.88" height="74" rx="12" fill="#FFFFFF" stroke="#3B82F6" stroke-width="2.048"/>
    <text class="cardTitle" x="300.8" y="214" text-anchor="middle">GET /articles</text>
    <text class="cardText" x="300.8" y="240" text-anchor="middle">@JsonView(Public)</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="529.92" y="184" width="314.88" height="74" rx="12" fill="#FFFFFF" stroke="#64748B" stroke-width="2.048"/>
    <text class="cardTitle" x="687.36" y="214" text-anchor="middle">GET /articles/{id}</text>
    <text class="cardText" x="687.36" y="240" text-anchor="middle">no view, full DTO</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="916.48" y="184" width="314.88" height="74" rx="12" fill="#FFFFFF" stroke="#D97706" stroke-width="2.048"/>
    <text class="cardTitle" x="1073.92" y="214" text-anchor="middle">GET /{id}/analytics</text>
    <text class="cardText" x="1073.92" y="240" text-anchor="middle">@JsonView(Analytics)</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="1303.04" y="184" width="314.88" height="74" rx="12" fill="#FFFFFF" stroke="#16A34A" stroke-width="2.048"/>
    <text class="cardTitle" x="1460.48" y="214" text-anchor="middle">GET /{id}/internal</text>
    <text class="cardText" x="1460.48" y="240" text-anchor="middle">@JsonView(Internal)</text>
  </g>

  <rect class="layerContract" x="81.92" y="324" width="1602.56" height="186" rx="18"/>
  <text class="layerLabel" x="117.76" y="358">Controller contract</text>
  <g filter="url(#shadow)">
    <rect x="161.28" y="390" width="366.08" height="88" rx="14" fill="#FFFFFF" stroke="#2563EB" stroke-width="2.176"/>
    <text class="cardTitle" x="344.32" y="425" text-anchor="middle">ArticleController</text>
    <text class="cardText" x="344.32" y="452" text-anchor="middle">Flow and suspend handlers</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="701.44" y="390" width="366.08" height="88" rx="14" fill="#FFFFFF" stroke="#16A34A" stroke-width="2.176"/>
    <text class="cardTitle" x="884.48" y="425" text-anchor="middle">ArticleDTO</text>
    <text class="cardText" x="884.48" y="452" text-anchor="middle">id, title, category, content</text>
    <text class="cardText" x="884.48" y="472" text-anchor="middle">views, likes</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="1241.6" y="390" width="366.08" height="88" rx="14" fill="#FFFFFF" stroke="#D97706" stroke-width="2.176"/>
    <text class="cardTitle" x="1424.64" y="425" text-anchor="middle">Views hierarchy</text>
    <text class="cardText" x="1424.64" y="452" text-anchor="middle">Public + Analytics</text>
    <text class="cardText" x="1424.64" y="472" text-anchor="middle">Internal inherits both</text>
  </g>

  <rect class="layerRuntime" x="81.92" y="548" width="1602.56" height="148" rx="18"/>
  <text class="layerLabel" x="117.76" y="582">Serialization and verification</text>
  <g filter="url(#shadow)">
    <rect x="168.96" y="616" width="417.28" height="58" rx="12" fill="#FFFFFF" stroke="#16A34A" stroke-width="2.048"/>
    <text class="cardTitle" x="377.6" y="649" text-anchor="middle">Jackson.defaultJsonMapper</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="711.68" y="616" width="345.6" height="58" rx="12" fill="#FFFFFF" stroke="#D97706" stroke-width="2.048"/>
    <text class="cardTitle" x="884.48" y="649" text-anchor="middle">Filtered JSON response</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="1210.88" y="616" width="345.6" height="58" rx="12" fill="#FFFFFF" stroke="#64748B" stroke-width="2.048"/>
    <text class="cardTitle" x="1383.68" y="649" text-anchor="middle">ArticleControllerTest</text>
  </g>

  <path class="line" d="M 344.32 286 L 344.32 390" stroke="#2563EB" marker-end="url(#arrowBlue)" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="line" d="M 527.36 434 L 701.44 434" stroke="#2563EB" marker-end="url(#arrowBlue)" stroke-linecap="round" stroke-linejoin="round"/>
