<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="740" viewBox="0 0 1920 740" role="img" aria-label="Kafka demo architecture diagram">
  <defs>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="124%"><feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#64748B" flood-opacity="0.16"/></filter>
    <marker id="arrowBlue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 12 6 L 0 12 Z" fill="#2563EB" stroke-dasharray="none" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="arrowGreen" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 12 6 L 0 12 Z" fill="#16A34A" stroke-dasharray="none" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="arrowAmber" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 12 6 L 0 12 Z" fill="#C47A12" stroke-dasharray="none" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <style>
      .canvas{fill:#F8FAFC}.frame{fill:#FFFFFF;stroke:#D6E0E8;stroke-width:1.4}.layer{fill:#F8FAFC;stroke:#CBD5E1;stroke-width:1.4}.title{font-family:"Architects Daughter";font-size:36px;fill:#102033}.subtitle{font-family:"Comic Mono";font-size:14px;fill:#51606F}.layerLabel{font-family:"Architects Daughter";font-size:23px;fill:#263548}.cardTitle{font-family:"Architects Daughter";font-size:27px;fill:#102033}.cardText{font-family:"Comic Mono";font-size:14px;fill:#415166}.line{fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.kafkaText{font-family:"Architects Daughter";font-size:27px;fill:#102033}
    </style>
  </defs>
  <rect class="canvas" width="1920" height="740"/>
  <rect class="frame" x="30.72" y="24" width="1858.56" height="692" rx="24"/>  <text class="title" x="960" y="66" text-anchor="middle">Spring Kafka message demo</text>
  <text class="subtitle" x="960" y="94" text-anchor="middle">A WebFlux controller publishes with KafkaTemplate.suspendSend; Spring Kafka listeners consume simple, greeting, and logger topics.</text>

  <rect class="layer" x="81.92" y="132" width="391.68" height="486" rx="18"/>
  <text class="layerLabel" x="117.76" y="168">HTTP API</text>
  <g filter="url(#shadow)">
    <rect x="133.12" y="260" width="289.28" height="156" rx="16" fill="#EFF6FF" stroke="#2563EB" stroke-width="2.176"/>
    <text class="cardTitle" x="277.76" y="306" text-anchor="middle">GreetingController</text>
    <text class="cardText" x="277.76" y="340" text-anchor="middle">GET /greeting</text>
    <text class="cardText" x="277.76" y="364" text-anchor="middle">POST /greeting</text>
    <text class="cardText" x="277.76" y="388" text-anchor="middle">suspend endpoints</text>
  </g>

  <rect class="layer" x="537.6" y="132" width="384" height="486" rx="18"/>
  <text class="layerLabel" x="573.44" y="168">Producer support</text>
  <g filter="url(#shadow)">
    <rect x="591.36" y="252" width="276.48" height="170" rx="16" fill="#ECFDF5" stroke="#16A34A" stroke-width="2.176"/>
    <text class="cardTitle" x="729.6" y="300" text-anchor="middle">KafkaTemplate</text>
    <text class="cardText" x="729.6" y="334" text-anchor="middle">DefaultKafkaProducerFactory</text>
    <text class="cardText" x="729.6" y="358" text-anchor="middle">bluetape4k suspendSend</text>  <text class="cardText" x="729.6" y="382" text-anchor="middle">Spring Kafka 4 result</text>
  </g>

  <rect class="layer" x="985.6" y="132" width="386.56" height="486" rx="18"/><text class="layerLabel" x="1021.44" y="168">Kafka runtime</text>
  <g filter="url(#shadow)">
    <rect x="1039.36" y="198" width="279.04" height="134" rx="16" fill="#F8FAFC" stroke="#111827" stroke-width="2.176"/>
    <image data-bluetape4k-icon="kafka" data-source="docs/icons/messaging/kafka.svg" x="1151.72" y="219" width="42" height="42" href="data:image/svg+xml;base64," preserveAspectRatio="xMidYMid meet"/>
    <text class="kafkaText" x="1178.88" y="306" text-anchor="middle">Kafka</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="1039.36" y="368" width="279.04" height="178" rx="16" fill="#FFF7ED" stroke="#D97706" stroke-width="2.176"/><image data-bluetape4k-icon="kafka" data-source="docs/icons/testcontainers/mq/apache-kafka.svg" x="1054.72" y="440" width="34" height="34" href="data:image/svg+xml;base64," preserveAspectRatio="xMidYMid meet"/>
    <text class="cardTitle" x="1178.88" y="408" text-anchor="middle">Topics</text>
    <text class="cardText" x="1178.88" y="438" text-anchor="middle">simple.topic.1</text>
    <text class="cardText" x="1178.88" y="462" text-anchor="middle">greeting.topic.1</text>
    <text class="cardText" x="1178.88" y="486" text-anchor="middle">logger.topic.1</text>
    <text class="cardText" x="1178.88" y="518" text-anchor="middle">KafkaServer.Launcher</text>
  </g>

  <rect class="layer" x="1436.16" y="132" width="401.92" height="486" rx="18"/>
  <text class="layerLabel" x="1472" y="168">Listeners</text>
  <g filter="url(#shadow)">
    <rect x="1487.36" y="206" width="299.52" height="96" rx="16" fill="#EFF6FF" stroke="#2563EB" stroke-width="2.176"/>
    <text class="cardTitle" x="1637.12" y="244" text-anchor="middle">Simple Handler</text>
    <text class="cardText" x="1637.12" y="272" text-anchor="middle">String messages</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="1487.36" y="334" width="299.52" height="110" rx="16" fill="#ECFDF5" stroke="#16A34A" stroke-width="2.176"/>
    <text class="cardTitle" x="1637.12" y="372" text-anchor="middle">Greeting Handler</text>
    <text class="cardText" x="1637.12" y="400" text-anchor="middle">GreetingRequest</text>
    <text class="cardText" x="1637.12" y="424" text-anchor="middle">@SendTo logger topic</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="1487.36" y="478" width="299.52" height="96" rx="16" fill="#FFF7ED" stroke="#D97706" stroke-width="2.176"/>
    <text class="cardTitle" x="1637.12" y="516" text-anchor="middle">Logger Handler</text>
    <text class="cardText" x="1637.12" y="544" text-anchor="middle">stores GreetingResult</text>
  </g>

  <path class="line" d="M 422.4 338 L 591.36 338" stroke="#16A34A" marker-end="url(#arrowGreen)" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="line" d="M 867.84 338 L 942.08 338 Q 954.88 338 954.88 348 L 954.88 428 Q 954.88 438 967.68 438 L 1039.36 438" stroke="#C47A12" marker-end="url(#arrowAmber)" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="line" d="M 1178.88 368 L 1178.88 350 Q 1178.88 348 1191.68 348 L 1390.08 348 Q 1402.88 348 1402.88 330 L 1402.88 264 Q 1402.88 254 1415.68 254 L 1487.36 254" stroke="#2563EB" marker-end="url(#arrowBlue)" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="line" d="M 1318.4 389 L 1487.36 389" stroke="#16A34A" marker-end="url(#arrowGreen)" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="line" d="M 1318.4 526 L 1487.36 526" stroke="#C47A12" marker-end="url(#arrowAmber)" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
