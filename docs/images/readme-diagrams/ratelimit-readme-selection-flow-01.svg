<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1640" height="720" viewBox="0 0 1640 720" role="img" aria-label="Rate limiter module selection flow">
  <defs>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="124%"><feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#64748B" flood-opacity="0.16"/></filter>
    <marker id="arrowBlue" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 14 7 L 0 14 Z" fill="#2563EB" stroke-dasharray="none"/></marker>
    <marker id="arrowGreen" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 14 7 L 0 14 Z" fill="#16A34A" stroke-dasharray="none"/></marker>
    <marker id="arrowOrange" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 14 7 L 0 14 Z" fill="#EA580C" stroke-dasharray="none"/></marker>
    <style>
      .canvas{fill:#F8FAFC}.frame{fill:#FFFFFF;stroke:#D6E0E8;stroke-width:1.4}.band{fill:#F8FAFC;stroke:#CBD5E1;stroke-width:1.4}.title{font-family:"Architects Daughter";font-size:38px;fill:#102033}.subtitle{font-family:"Comic Mono";font-size:15px;fill:#51606F}.bandLabel{font-family:"Architects Daughter";font-size:24px;fill:#263548}.cardTitle{font-family:"Architects Daughter";font-size:28px;fill:#102033}.cardText{font-family:"Comic Mono";font-size:15px;fill:#415166}.label{font-family:"Comic Mono";font-size:14px;fill:#475569}.line{fill:none;stroke-width:3.6;stroke-linecap:round;stroke-linejoin:round}
    </style>
  </defs>
  <rect class="canvas" width="1640" height="720"/>
  <rect class="frame" x="24" y="24" width="1592" height="672" rx="24"/>
  <text class="title" x="820" y="70" text-anchor="middle">Which rate limiter example should I open?</text>
  <text class="subtitle" x="820" y="102" text-anchor="middle">Start from the identity and storage model, then choose the smallest module that demonstrates that behavior.</text>

  <rect class="band" x="72" y="148" width="1496" height="196" rx="18"/>
  <text class="bandLabel" x="102" y="186">Choose by identity</text>
  <rect class="band" x="72" y="404" width="1496" height="172" rx="18"/>
  <text class="bandLabel" x="102" y="442">Choose by store and framework</text>

  <g filter="url(#shadow)">
    <rect x="150" y="232" width="238" height="78" rx="16" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.7"/>
    <text class="cardTitle" x="269" y="266" text-anchor="middle">Need user keys?</text>
    <text class="cardText" x="269" y="292" text-anchor="middle">Authorization or X-User-ID</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="526" y="218" width="280" height="106" rx="16" fill="#F0FDF4" stroke="#16A34A" stroke-width="1.7"/>
    <text class="cardTitle" x="666" y="258" text-anchor="middle">bt4k WebFlux</text>  <text class="cardText" x="666" y="290" text-anchor="middle">Redis DistributedRateLimiter</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="964" y="218" width="280" height="106" rx="16" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.7"/>
    <text class="cardTitle" x="1104" y="258" text-anchor="middle">Advanced filters</text>
    <text class="cardText" x="1104" y="290" text-anchor="middle">IP + user + combined keys</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="202" y="478" width="260" height="74" rx="16" fill="#FFF7ED" stroke="#EA580C" stroke-width="1.7"/>  <text class="cardTitle" x="332" y="512" text-anchor="middle">Starter Redis</text>
    <text class="cardText" x="332" y="538" text-anchor="middle">WebFlux, shared buckets</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="690" y="478" width="260" height="74" rx="16" fill="#FFFBEB" stroke="#D97706" stroke-width="1.7"/>
    <text class="cardTitle" x="820" y="512" text-anchor="middle">Starter Caffeine</text>
    <text class="cardText" x="820" y="538" text-anchor="middle">WebMVC, local buckets</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="1178" y="478" width="260" height="74" rx="16" fill="#F0FDF4" stroke="#16A34A" stroke-width="1.7"/>
    <text class="cardTitle" x="1308" y="512" text-anchor="middle">Strategy tests</text>
    <text class="cardText" x="1308" y="538" text-anchor="middle">headers and 429 behavior</text>
  </g>

  <path class="line" d="M 388 271 L 526 271" stroke="#16A34A" marker-end="url(#arrowGreen)" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="line" d="M 806 271 L 964 271" stroke="#2563EB" marker-end="url(#arrowBlue)" stroke-linecap="round" stroke-linejoin="round"/>
  <text class="label" x="456" y="256" text-anchor="middle">yes</text>
  <text class="label" x="884" y="256" text-anchor="middle">compare policies</text>
  <path class="line" d="M 269 310 L 132 310 L 132 515 L 202 515" stroke="#EA580C" marker-end="url(#arrowOrange)" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="line" d="M 666 324 L 666 390 L 820 390 L 820 478" stroke="#EA580C" marker-end="url(#arrowOrange)" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="line" d="M 1104 324 L 1104 390 L 1308 390 L 1308 478" stroke="#16A34A" marker-end="url(#arrowGreen)" stroke-linecap="round" stroke-linejoin="round"/>
  <text class="label" x="168" y="404" text-anchor="middle">IP-only starter</text>
  <text class="label" x="742" y="380" text-anchor="middle">local servlet fit</text>
  <text class="label" x="1214" y="380" text-anchor="middle">verify branches</text>
</svg>
