<svg xmlns="http://www.w3.org/2000/svg" width="2176" height="700" viewBox="0 0 2176 700" role="img" aria-label="Bucket4j advanced architecture diagram">
  <defs>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="124%"><feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#64748B" flood-opacity="0.16" /></filter>
    <marker id="arrowBlue" markerWidth="14" markerHeight="14" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 12 12" data-role="primary" data-tip-direction="positive-x"><path d="M 0 0 L 12 6 L 0 12 Z" fill="#2563EB" stroke-dasharray="none" stroke-linecap="round" stroke-linejoin="round" stroke="#2563EB" stroke-width="0"/></marker>
    <marker id="arrowGreen" markerWidth="14" markerHeight="14" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 12 12" data-role="primary" data-tip-direction="positive-x"><path d="M 0 0 L 12 6 L 0 12 Z" fill="#16A34A" stroke-dasharray="none" stroke-linecap="round" stroke-linejoin="round" stroke="#16A34A" stroke-width="0"/></marker>
    <marker id="arrowAmber" markerWidth="14" markerHeight="14" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 12 12" data-role="primary" data-tip-direction="positive-x"><path d="M 0 0 L 12 6 L 0 12 Z" fill="#D97706" stroke-dasharray="none" stroke-linecap="round" stroke-linejoin="round" stroke="#D97706" stroke-width="0"/></marker>
    <marker id="arrowRose" markerWidth="14" markerHeight="14" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 12 12" data-role="primary" data-tip-direction="positive-x"><path d="M 0 0 L 12 6 L 0 12 Z" fill="#E11D48" stroke-dasharray="none" stroke-linecap="round" stroke-linejoin="round" stroke="#E11D48" stroke-width="0"/></marker>
    <marker id="arrowSlate" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 10 10" data-role="secondary" data-tip-direction="positive-x"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#475569" stroke-dasharray="none" stroke-linecap="round" stroke-linejoin="round" stroke="#475569" stroke-width="0"/></marker>
    <style>
      .canvas{fill:#F8FAFC}.frame{fill:#FFFFFF;stroke:#D6E0E8;stroke-width:1.4}.layer{fill:#F8FAFC;stroke:#CBD5E1;stroke-width:1.4}.title{font-family:"Architects Daughter";font-size:38px;fill:#102033}.subtitle{font-family:"Comic Mono";font-size:15px;fill:#51606F}.layerLabel{font-family:"Architects Daughter";font-size:24px;fill:#263548}.cardTitle{font-family:"Architects Daughter";font-size:28px;fill:#102033}.cardText{font-family:"Comic Mono";font-size:15px;fill:#415166}.line{fill:none;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round}
    </style>
  </defs>
  <rect class="canvas" width="2176" height="700" />
  <rect class="frame" x="30.72" y="24" width="2114.56" height="652" rx="24" />
  <text class="title" x="1088" y="70" text-anchor="middle">Advanced Bucket4j architecture</text>  <text class="subtitle" x="1088" y="102" text-anchor="middle">Three path-isolated coroutine filters share one Redis proxy manager but use separate bucket policies.</text>

  <rect class="layer" x="84.48" y="142" width="363.52" height="522" rx="18" />
  <text class="layerLabel" x="120.32" y="180">Endpoint groups</text>
  <g filter="url(#shadow)">
    <rect x="135.68" y="224" width="261.12" height="96" rx="16" fill="#EFF6FF" stroke="#2563EB" stroke-width="2.176" />
    <text class="cardTitle" x="266.24" y="262" text-anchor="middle">Anonymous</text>
    <text class="cardText" x="266.24" y="292" text-anchor="middle">/api/anonymous/**</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="135.68" y="372" width="261.12" height="96" rx="16" fill="#F0FDF4" stroke="#16A34A" stroke-width="2.176" />
    <text class="cardTitle" x="266.24" y="410" text-anchor="middle">Authenticated</text>
    <text class="cardText" x="266.24" y="440" text-anchor="middle">/api/authenticated/**</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="135.68" y="520" width="261.12" height="96" rx="16" fill="#FFF7ED" stroke="#D97706" stroke-width="2.176" />
    <text class="cardTitle" x="266.24" y="558" text-anchor="middle">Sensitive</text>
    <text class="cardText" x="266.24" y="588" text-anchor="middle">/api/sensitive/**</text>
  </g>

  <rect class="layer" x="532.48" y="142" width="481.28" height="522" rx="18" />
  <text class="layerLabel" x="568.32" y="180">Coroutine WebFilters</text>
  <g filter="url(#shadow)">
    <rect x="588.8" y="216" width="368.64" height="104" rx="16" fill="#EFF6FF" stroke="#2563EB" stroke-width="2.176" />
    <text class="cardTitle" x="773.12" y="256" text-anchor="middle">IpRateLimitWebFilter</text>
    <text class="cardText" x="773.12" y="288" text-anchor="middle">key ip:&lt;address&gt;</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="588.8" y="372" width="368.64" height="104" rx="16" fill="#F0FDF4" stroke="#16A34A" stroke-width="2.176" />
    <text class="cardTitle" x="773.12" y="412" text-anchor="middle">UserRateLimitWebFilter</text>
    <text class="cardText" x="773.12" y="444" text-anchor="middle">key user:&lt;userId&gt;</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="588.8" y="528" width="368.64" height="104" rx="16" fill="#FFF7ED" stroke="#D97706" stroke-width="2.176" />
    <text class="cardTitle" x="773.12" y="568" text-anchor="middle">CombinedRateLimit</text>
    <text class="cardText" x="773.12" y="600" text-anchor="middle">key ip + userId</text>
  </g>

  <rect class="layer" x="1098.24" y="142" width="422.4" height="522" rx="18" />
  <text class="layerLabel" x="1134.08" y="180">Strategy beans</text>
  <g filter="url(#shadow)">
    <rect x="1152" y="212" width="314.88" height="122" rx="16" fill="#F8FAFC" stroke="#475569" stroke-width="2.176" />
    <text class="cardTitle" x="1309.44" y="256" text-anchor="middle">RateLimitConfig</text>
    <text class="cardText" x="1309.44" y="288" text-anchor="middle">3 bucket configs</text>
    <text class="cardText" x="1309.44" y="314" text-anchor="middle">3 suspend limiters</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="1152" y="450" width="314.88" height="122" rx="16" fill="#ECFEFF" stroke="#0891B2" stroke-width="2.176" />
    <text class="cardTitle" x="1309.44" y="494" text-anchor="middle">RequestUtils</text>
    <text class="cardText" x="1309.44" y="526" text-anchor="middle">trust-proxy guarded IP</text>
    <text class="cardText" x="1309.44" y="552" text-anchor="middle">X-User-ID</text>
  </g>

  <rect class="layer" x="1605.12" y="142" width="486.4" height="522" rx="18" />  <text class="layerLabel" x="1640.96" y="180">Redis bucket store</text>
  <g filter="url(#shadow)">
    <rect x="1643.52" y="252" width="407.04" height="130" rx="16" fill="#FFF1F2" stroke="#E11D48" stroke-width="2.176" />
    <image data-bluetape4k-icon="redis" data-source="docs/icons/redis/redis-icon.svg" x="1684.48" y="274" width="40" height="40" href="data:image/svg+xml;base64," preserveAspectRatio="xMidYMid meet" />  <text class="cardTitle" x="1917.44" y="306" text-anchor="middle">Redis</text>
    <text class="cardText" x="1917.44" y="338" text-anchor="middle">Lettuce proxy manager</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="1664" y="464" width="366.08" height="106" rx="16" fill="#F8FAFC" stroke="#475569" stroke-width="2.176" />
    <text class="cardTitle" x="1847.04" y="506" text-anchor="middle">HTTP headers</text>
    <text class="cardText" x="1847.04" y="538" text-anchor="middle">Remaining, Reset, Retry-After</text>
  </g>

  <path class="line" d="M 396.8 272 L 588.8 268" stroke="#2563EB" marker-end="url(#arrowBlue)" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="line" d="M 396.8 420 L 588.8 424" stroke="#16A34A" marker-end="url(#arrowGreen)" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="line" d="M 396.8 568 L 588.8 580" stroke="#D97706" marker-end="url(#arrowAmber)" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="line" d="M 957.44 268 L 1152 273" stroke="#2563EB" marker-end="url(#arrowBlue)" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="line" d="M 957.44 424 L 1085.44 424 Q 1098.24 424 1098.24 414 L 1098.24 283 Q 1098.24 273 1111.04 273 L 1152 273" stroke="#16A34A" marker-end="url(#arrowGreen)" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="line" d="M 957.44 580 L 1085.44 580 Q 1098.24 580 1098.24 570 L 1098.24 344 Q 1098.24 334 1111.04 334 L 1309.44 334" stroke="#D97706" marker-end="url(#arrowAmber)" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="line" d="M 1466.88 273 L 1592.32 273 Q 1605.12 273 1605.12 283 L 1605.12 307 Q 1605.12 317 1617.92 317 L 1664 317" stroke="#E11D48" marker-end="url(#arrowRose)" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="line" d="M 1466.88 511 L 1601.6 511 Q 1605.12 511 1605.12 513.75 L 1605.12 514.25 Q 1605.12 517 1608.64 517 L 1664 517" stroke="#475569" marker-end="url(#arrowSlate)" stroke-linecap="round" stroke-linejoin="round"/>
</svg>