<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="700" viewBox="0 0 1700 700" role="img" aria-label="Bucket4j advanced architecture diagram">
  <defs>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="124%"><feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#64748B" flood-opacity="0.16"/></filter>
    <marker id="arrowBlue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 12 6 L 0 12 Z" fill="#2563EB"/></marker>
    <marker id="arrowGreen" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 12 6 L 0 12 Z" fill="#16A34A"/></marker>
    <marker id="arrowAmber" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 12 6 L 0 12 Z" fill="#D97706"/></marker>
    <marker id="arrowRose" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 12 6 L 0 12 Z" fill="#E11D48"/></marker>
    <marker id="arrowSlate" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#475569"/></marker>
    <style>
      .canvas{fill:#F8FAFC}.frame{fill:#FFFFFF;stroke:#D6E0E8;stroke-width:1.4}.layer{fill:#F8FAFC;stroke:#CBD5E1;stroke-width:1.4}.title{font-family:"Architects Daughter";font-size:38px;fill:#102033}.subtitle{font-family:"Comic Mono";font-size:15px;fill:#51606F}.layerLabel{font-family:"Architects Daughter";font-size:24px;fill:#263548}.cardTitle{font-family:"Architects Daughter";font-size:28px;fill:#102033}.cardText{font-family:"Comic Mono";font-size:15px;fill:#415166}.line{fill:none;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round}
    </style>
  </defs>
  <rect class="canvas" width="1700" height="700"/>
  <rect class="frame" x="24" y="24" width="1652" height="652" rx="24"/>
  <text class="title" x="850" y="70" text-anchor="middle">Advanced Bucket4j architecture</text>
  <text class="subtitle" x="850" y="102" text-anchor="middle">Three path-isolated coroutine filters share one Redis proxy manager but use separate bucket policies.</text>

  <rect class="layer" x="66" y="142" width="284" height="522" rx="18"/>
  <text class="layerLabel" x="94" y="180">Endpoint groups</text>
  <g filter="url(#shadow)">
    <rect x="106" y="224" width="204" height="96" rx="16" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.7"/>
    <text class="cardTitle" x="208" y="262" text-anchor="middle">Anonymous</text>
    <text class="cardText" x="208" y="292" text-anchor="middle">/api/anonymous/**</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="106" y="372" width="204" height="96" rx="16" fill="#F0FDF4" stroke="#16A34A" stroke-width="1.7"/>
    <text class="cardTitle" x="208" y="410" text-anchor="middle">Authenticated</text>
    <text class="cardText" x="208" y="440" text-anchor="middle">/api/authenticated/**</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="106" y="520" width="204" height="96" rx="16" fill="#FFF7ED" stroke="#D97706" stroke-width="1.7"/>
    <text class="cardTitle" x="208" y="558" text-anchor="middle">Sensitive</text>
    <text class="cardText" x="208" y="588" text-anchor="middle">/api/sensitive/**</text>
  </g>

  <rect class="layer" x="416" y="142" width="376" height="522" rx="18"/>
  <text class="layerLabel" x="444" y="180">Coroutine WebFilters</text>
  <g filter="url(#shadow)">
    <rect x="460" y="216" width="288" height="104" rx="16" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.7"/>
    <text class="cardTitle" x="604" y="256" text-anchor="middle">IpRateLimitWebFilter</text>
    <text class="cardText" x="604" y="288" text-anchor="middle">key ip:&lt;address&gt;</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="460" y="372" width="288" height="104" rx="16" fill="#F0FDF4" stroke="#16A34A" stroke-width="1.7"/>
    <text class="cardTitle" x="604" y="412" text-anchor="middle">UserRateLimitWebFilter</text>
    <text class="cardText" x="604" y="444" text-anchor="middle">key user:&lt;userId&gt;</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="460" y="528" width="288" height="104" rx="16" fill="#FFF7ED" stroke="#D97706" stroke-width="1.7"/>
    <text class="cardTitle" x="604" y="568" text-anchor="middle">CombinedRateLimit</text>
    <text class="cardText" x="604" y="600" text-anchor="middle">key ip + userId</text>
  </g>

  <rect class="layer" x="858" y="142" width="330" height="522" rx="18"/>
  <text class="layerLabel" x="886" y="180">Strategy beans</text>
  <g filter="url(#shadow)">
    <rect x="900" y="212" width="246" height="122" rx="16" fill="#F8FAFC" stroke="#475569" stroke-width="1.7"/>
    <text class="cardTitle" x="1023" y="256" text-anchor="middle">RateLimitConfig</text>
    <text class="cardText" x="1023" y="288" text-anchor="middle">3 bucket configs</text>
    <text class="cardText" x="1023" y="314" text-anchor="middle">3 suspend limiters</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="900" y="450" width="246" height="122" rx="16" fill="#ECFEFF" stroke="#0891B2" stroke-width="1.7"/>
    <text class="cardTitle" x="1023" y="494" text-anchor="middle">RequestUtils</text>
    <text class="cardText" x="1023" y="526" text-anchor="middle">trust-proxy guarded IP</text>
    <text class="cardText" x="1023" y="552" text-anchor="middle">X-User-ID</text>
  </g>

  <rect class="layer" x="1254" y="142" width="380" height="522" rx="18"/>
  <text class="layerLabel" x="1282" y="180">Redis bucket store</text>
  <g filter="url(#shadow)">
    <rect x="1300" y="252" width="286" height="130" rx="16" fill="#FFF1F2" stroke="#E11D48" stroke-width="1.7"/>
    <rect x="1334" y="292" width="82" height="36" rx="18" fill="#FFE4E6" stroke="#E11D48" stroke-width="2.8"/>
    <path d="M 1334 310 C 1334 331 1416 331 1416 310" fill="none" stroke="#E11D48" stroke-width="2.8"/>
    <text class="cardTitle" x="1490" y="306" text-anchor="middle">Redis</text>
    <text class="cardText" x="1490" y="338" text-anchor="middle">Lettuce proxy manager</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="1300" y="464" width="286" height="106" rx="16" fill="#F8FAFC" stroke="#475569" stroke-width="1.7"/>
    <text class="cardTitle" x="1443" y="506" text-anchor="middle">HTTP headers</text>
    <text class="cardText" x="1443" y="538" text-anchor="middle">Remaining, Reset, Retry-After</text>
  </g>

  <path class="line" d="M 310 272 L 460 268" stroke="#2563EB" marker-end="url(#arrowBlue)"/>
  <path class="line" d="M 310 420 L 460 424" stroke="#16A34A" marker-end="url(#arrowGreen)"/>
  <path class="line" d="M 310 568 L 460 580" stroke="#D97706" marker-end="url(#arrowAmber)"/>
  <path class="line" d="M 748 268 L 900 273" stroke="#2563EB" marker-end="url(#arrowBlue)"/>
  <path class="line" d="M 748 424 L 858 424 L 858 273 L 900 273" stroke="#16A34A" marker-end="url(#arrowGreen)"/>
  <path class="line" d="M 748 580 L 858 580 L 858 334 L 1023 334 L 1023 334" stroke="#D97706" marker-end="url(#arrowAmber)"/>
  <path class="line" d="M 1146 273 L 1254 273 L 1254 317 L 1300 317" stroke="#E11D48" marker-end="url(#arrowRose)"/>
  <path class="line" d="M 1146 511 L 1254 511 L 1254 517 L 1300 517" stroke="#475569" marker-end="url(#arrowSlate)"/>
</svg>
