<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" role="img" aria-label="Rate Limiter Modules Overview">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#1f2937" flood-opacity="0.10"/></filter>
  <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth">
    <path d="M1,1 L8,4.5 L1,8 Z" fill="#758297"/>
  </marker>
  <style>
    .canvas{fill:#f7f9fc}.frame{fill:#fff;stroke:#d8e0ea;stroke-width:1.5}
    .title{font-family:"Architects Daughter";font-size:38px;font-weight:400;fill:#102033}
    .subtitle{font-family:"Comic Mono";font-size:14px;font-weight:400;fill:#536273}
    .smallLabel{font-family:"Architects Daughter";font-size:21px;font-weight:400;fill:#102033}
    .mono{font-family:"Comic Mono";font-size:12px;font-weight:400;fill:#102033}
    .small{font-family:"Comic Mono";font-size:12px;font-weight:400;fill:#536273}
    .card{stroke-width:2.1;filter:url(#shadow)}
    .line{stroke:#758297;stroke-width:2.1;fill:none;marker-end:url(#arrow)}
  </style>
</defs>
<!-- Layout:
     Canvas: 960×480  Frame: x=24 y=20 w=912 h=436
     Row1  y=98  h=54  Overview center x=240 w=480
     Row2  y=212 h=140 4 cols w=196 gap=40
       Col1: x=24  cx=122  Col2: x=260 cx=358
       Col3: x=496 cx=594  Col4: x=732 cx=830
     Row3  y=412 h=44  Token Bucket full width
-->
<rect class="canvas" width="960" height="480"/>
<rect class="frame" x="24" y="20" width="912" height="436" rx="28"/>
<text class="title" x="58" y="66">Rate Limiter Modules</text>
<text class="subtitle" x="58" y="92">Bucket4j · Token Bucket · Redis · Caffeine · WebFlux · bluetape4k-bucket4j</text>

<!-- Arrows from Overview to 4 modules (bus y=182, all from overview bottom) -->
<path class="line" d="M480 152 L480 182 L122 182 L122 212"/>
<path class="line" d="M480 152 L480 182 L358 182 L358 212"/>
<path class="line" d="M480 152 L480 182 L594 182 L594 212"/>
<path class="line" d="M480 152 L480 182 L830 182 L830 212"/>
<!-- 4 modules → Token Bucket (bus y=392) -->
<path class="line" d="M122 352 L122 392 L480 392 L480 412"/>
<path class="line" d="M358 352 L358 392 L480 392 L480 412"/>
<path class="line" d="M594 352 L594 392 L480 392 L480 412"/>
<path class="line" d="M830 352 L830 392 L480 392 L480 412"/>

<!-- Overview (center top) -->
<g transform="translate(240,98)">
  <rect class="card" x="0" y="0" width="480" height="54" rx="12" fill="#EAF7EF" stroke="#58A978"/>
  <text class="smallLabel" x="240" y="22" text-anchor="middle">Rate Limiter Overview</text>
  <text class="small" x="240" y="42" text-anchor="middle">Token Bucket · KeyResolver · WebFilter · 429 Too Many Requests</text>
</g>

<!-- caffeine-web col1 -->
<g transform="translate(24,212)">
  <rect class="card" x="0" y="0" width="196" height="140" rx="12" fill="#E8F3FF" stroke="#5B8DEF"/>
  <text class="smallLabel" x="98" y="22" text-anchor="middle">caffeine-web</text>
  <text class="mono" x="98" y="44" text-anchor="middle">Spring MVC</text>
  <text class="small" x="98" y="64" text-anchor="middle">Caffeine (in-memory)</text>
  <text class="small" x="98" y="84" text-anchor="middle">IP-based · single node</text>
  <text class="small" x="98" y="104" text-anchor="middle">Servlet Filter</text>
  <text class="small" x="98" y="124" text-anchor="middle">local / dev only</text>
</g>

<!-- bucket4j-redis col2 -->
<g transform="translate(260,212)">
  <rect class="card" x="0" y="0" width="196" height="140" rx="12" fill="#FFF3D9" stroke="#D6A441"/>
  <text class="smallLabel" x="98" y="22" text-anchor="middle">bucket4j-redis</text>
  <text class="mono" x="98" y="44" text-anchor="middle">WebFlux</text>
  <text class="small" x="98" y="64" text-anchor="middle">Redis (Lettuce)</text>
  <text class="small" x="98" y="84" text-anchor="middle">IP-based · distributed</text>
  <text class="small" x="98" y="104" text-anchor="middle">WebFilter</text>
  <text class="small" x="98" y="124" text-anchor="middle">standard starter</text>
</g>

<!-- bluetape4k-webflux col3 -->
<g transform="translate(496,212)">
  <rect class="card" x="0" y="0" width="196" height="140" rx="12" fill="#EAF7EF" stroke="#58A978"/>
  <text class="smallLabel" x="98" y="22" text-anchor="middle">bt4k-webflux</text>
  <text class="mono" x="98" y="44" text-anchor="middle">WebFlux + Coroutines</text>
  <text class="small" x="98" y="64" text-anchor="middle">Redis (Lettuce)</text>
  <text class="small" x="98" y="84" text-anchor="middle">User token / IP</text>
  <text class="small" x="98" y="104" text-anchor="middle">DistributedRateLimiter</text>
  <text class="small" x="98" y="124" text-anchor="middle">⭐ Recommended</text>
</g>

<!-- bucket4j-advanced col4 -->
<g transform="translate(732,212)">
  <rect class="card" x="0" y="0" width="196" height="140" rx="12" fill="#F1ECFF" stroke="#8A72D6"/>
  <text class="smallLabel" x="98" y="22" text-anchor="middle">bt4k-advanced</text>
  <text class="mono" x="98" y="44" text-anchor="middle">WebFlux + Coroutines</text>
  <text class="small" x="98" y="64" text-anchor="middle">Redis (Lettuce)</text>
  <text class="small" x="98" y="84" text-anchor="middle">IP + User + Combined</text>
  <text class="small" x="98" y="104" text-anchor="middle">3 WebFilter strategies</text>
  <text class="small" x="98" y="124" text-anchor="middle">composite bucket key</text>
</g>

<!-- Token Bucket (full width bottom) -->
<g transform="translate(24,412)">
  <rect class="card" x="0" y="0" width="912" height="44" rx="12" fill="#E9F7F6" stroke="#45A7A1"/>
  <text class="smallLabel" x="456" y="18" text-anchor="middle">Token Bucket Algorithm</text>
  <text class="small" x="456" y="36" text-anchor="middle">refillIntervally · refillGreedy · capacity · consumed → 429 Too Many Requests</text>
</g>
</svg>
