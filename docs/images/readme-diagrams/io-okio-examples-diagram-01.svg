<svg xmlns="http://www.w3.org/2000/svg" width="920" height="440" viewBox="0 0 920 440" role="img" aria-label="Okio I/O Pipeline Architecture">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#1f2937" flood-opacity="0.10"/></filter>
  <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth">
    <path d="M1,1 L8,4.5 L1,8 Z" fill="#758297"/>
  </marker>
  <style>
    .canvas{fill:#f7f9fc}.frame{fill:#fff;stroke:#d8e0ea;stroke-width:1.5}
    .title{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:38px;font-weight:400;fill:#102033}
    .subtitle{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:14px;font-weight:400;fill:#536273}
    .smallLabel{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:21px;font-weight:400;fill:#102033}
    .mono{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#102033}
    .small{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#536273}
    .card{stroke-width:2.1;filter:url(#shadow)}
    .line{stroke:#758297;stroke-width:2.1;fill:none;marker-end:url(#arrow)}
  </style>
</defs>
<!-- Layout:
     Canvas: 920×440  Frame: x=24 y=20 w=872 h=396
     3 cols: w=260 each, gap=46px
       Col1: x=24  cx=154  right=284
       Col2: x=330 cx=460  right=590
       Col3: x=636 cx=766  right=896
     Row1: y=98  h=84  bottom=182
     Row2: y=242 h=110 bottom=352
     Horizontal arrows at y=140; vertical arrows gap=60px ✓
-->
<rect class="canvas" width="920" height="440"/>
<rect class="frame" x="24" y="20" width="872" height="396" rx="28"/>
<text class="title" x="58" y="66">Okio I/O Pipeline</text>
<text class="subtitle" x="58" y="92">Source · Buffer · Sink · Base64 · Cipher · GZip · Pipe · Coroutine adapters</text>

<!-- Horizontal flow arrows at y=140 -->
<path class="line" d="M284 140 L330 140"/>
<path class="line" d="M590 140 L636 140"/>
<!-- Vertical arrows row1→row2 (gap=60px) -->
<path class="line" d="M154 182 L154 242"/>
<path class="line" d="M460 182 L460 242"/>
<path class="line" d="M766 182 L766 242"/>

<!-- Source / BufferedSource  col1 -->
<g transform="translate(24,98)">
  <rect class="card" x="0" y="0" width="260" height="84" rx="12" fill="#E8F3FF" stroke="#5B8DEF"/>
  <text class="smallLabel" x="130" y="22" text-anchor="middle">Source / BufferedSource</text>
  <text class="mono" x="130" y="42" text-anchor="middle">read(sink: Buffer, count: Long)</text>
  <text class="small" x="130" y="60" text-anchor="middle">readUtf8() · readByteString()</text>
  <text class="small" x="130" y="76" text-anchor="middle">source.buffered() → BufferedSource</text>
</g>

<!-- Buffer  col2 -->
<g transform="translate(330,98)">
  <rect class="card" x="0" y="0" width="260" height="84" rx="12" fill="#EAF7EF" stroke="#58A978"/>
  <text class="smallLabel" x="130" y="22" text-anchor="middle">Buffer</text>
  <text class="small" x="130" y="42" text-anchor="middle">bidirectional · segment-chain memory</text>
  <text class="mono" x="130" y="60" text-anchor="middle">readXxx()  ·  writeXxx()</text>
  <text class="small" x="130" y="76" text-anchor="middle">snapshot() → immutable ByteString</text>
</g>

<!-- Sink / BufferedSink  col3 -->
<g transform="translate(636,98)">
  <rect class="card" x="0" y="0" width="260" height="84" rx="12" fill="#FFF3D9" stroke="#D6A441"/>
  <text class="smallLabel" x="130" y="22" text-anchor="middle">Sink / BufferedSink</text>
  <text class="mono" x="130" y="42" text-anchor="middle">write(source: Buffer, count: Long)</text>
  <text class="small" x="130" y="60" text-anchor="middle">writeUtf8() · writeByteString()</text>
  <text class="small" x="130" y="76" text-anchor="middle">sink.buffered() → BufferedSink</text>
</g>

<!-- Source Adapters  col1 -->
<g transform="translate(24,242)">
  <rect class="card" x="0" y="0" width="260" height="110" rx="12" fill="#F1ECFF" stroke="#8A72D6"/>
  <text class="smallLabel" x="130" y="22" text-anchor="middle">Source Adapters</text>
  <text class="small" x="130" y="42" text-anchor="middle">FileChannelSource · ByteChannelSource</text>
  <text class="mono" x="130" y="60" text-anchor="middle">InputStreamSource</text>
  <text class="small" x="130" y="80" text-anchor="middle">AbstractBase64Source</text>
  <text class="small" x="130" y="98" text-anchor="middle">asSuspendedSource() — coroutines</text>
</g>

<!-- I/O Decorators  col2 -->
<g transform="translate(330,242)">
  <rect class="card" x="0" y="0" width="260" height="110" rx="12" fill="#E9F7F6" stroke="#45A7A1"/>
  <text class="smallLabel" x="130" y="22" text-anchor="middle">I/O Decorators</text>
  <text class="mono" x="130" y="42" text-anchor="middle">Base64Source / Base64Sink</text>
  <text class="mono" x="130" y="60" text-anchor="middle">GzipSource / GzipSink</text>
  <text class="mono" x="130" y="78" text-anchor="middle">CipherSource / CipherSink</text>
  <text class="small" x="130" y="98" text-anchor="middle">LZ4 · Snappy · BZip2 · Zstd · Pipe</text>
</g>

<!-- Sink Adapters  col3 -->
<g transform="translate(636,242)">
  <rect class="card" x="0" y="0" width="260" height="110" rx="12" fill="#FDECEF" stroke="#DC6B82"/>
  <text class="smallLabel" x="130" y="22" text-anchor="middle">Sink Adapters</text>
  <text class="small" x="130" y="42" text-anchor="middle">FileChannelSink · ByteChannelSink</text>
  <text class="mono" x="130" y="60" text-anchor="middle">OutputStreamSink</text>
  <text class="small" x="130" y="80" text-anchor="middle">AbstractBase64Sink</text>
  <text class="small" x="130" y="98" text-anchor="middle">asSuspendedSink() — coroutines</text>
</g>
</svg>
