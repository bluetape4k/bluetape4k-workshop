<svg xmlns="http://www.w3.org/2000/svg" width="960" height="500" viewBox="0 0 960 500" role="img" aria-label="Vert.x SQLClient Request Sequence">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%">
    <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#1f2937" flood-opacity="0.10"/>
  </filter>
  <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth">
    <path d="M1,1 L8,4.5 L1,8 Z" fill="#758297"/>
  </marker>
  <style>
    .canvas{fill:#f7f9fc}.frame{fill:#fff;stroke:#d8e0ea;stroke-width:1.5}
    .title{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:38px;font-weight:400;fill:#102033}
    .subtitle{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:14px;font-weight:400;fill:#536273}
    .smallLabel{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:21px;font-weight:400;fill:#102033}
    .mono{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#102033}
    .small{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#536273}
    .card{stroke-width:2.1;filter:url(#shadow)}
    .line{stroke:#758297;stroke-width:2.1;fill:none;marker-end:url(#arrow)}
    .dashed{stroke:#758297;stroke-width:2.1;stroke-dasharray:7 5;fill:none;marker-end:url(#arrow)}
    .lifeline{stroke:#b7c2d1;stroke-width:1.8;stroke-dasharray:8 6;fill:none}
  </style>
</defs>
<rect class="canvas" width="960" height="500"/>
<rect class="frame" x="24" y="20" width="912" height="456" rx="20"/>
<text class="title" x="48" y="66">Vert.x SQLClient Request Sequence</text>
<text class="subtitle" x="48" y="90">Test · MySQLBuilder/JDBCPool · preparedQuery · coAwait · RowSet · MySQL8</text>

<!-- Participant headers -->
<rect class="card" x="60" y="108" width="120" height="44" rx="14" fill="#E8F3FF" stroke="#5B8DEF"/>
<text class="smallLabel" style="font-size:17px" x="120" y="136" text-anchor="middle">Test</text>

<rect class="card" x="252" y="108" width="140" height="44" rx="14" fill="#EAF7EF" stroke="#58A978"/>
<text class="smallLabel" style="font-size:17px" x="322" y="136" text-anchor="middle">Pool (MySQL)</text>

<rect class="card" x="472" y="108" width="140" height="44" rx="14" fill="#FFF3D9" stroke="#D6A441"/>
<text class="smallLabel" style="font-size:17px" x="542" y="136" text-anchor="middle">SqlClient</text>

<rect class="card" x="692" y="108" width="140" height="44" rx="14" fill="#FDECEF" stroke="#DC6B82"/>
<text class="smallLabel" style="font-size:17px" x="762" y="136" text-anchor="middle">MySQL8 (TC)</text>

<!-- Lifelines -->
<line class="lifeline" x1="120" y1="152" x2="120" y2="448"/>
<line class="lifeline" x1="322" y1="152" x2="322" y2="448"/>
<line class="lifeline" x1="542" y1="152" x2="542" y2="448"/>
<line class="lifeline" x1="762" y1="152" x2="762" y2="448"/>

<!-- Band 1: build pool -->
<rect class="card" x="60" y="172" width="300" height="48" rx="12" fill="#E8F3FF" stroke="#5B8DEF"/>
<text class="mono" x="80" y="192" font-weight="700" fill="#102033">1</text>
<text class="mono" x="100" y="192" fill="#102033">MySQLBuilder.pool()</text>
<text class="small" x="100" y="210" fill="#536273">.connectingTo(opts).build()</text>
<path class="line" d="M162 196 L250 196"/>

<!-- Band 2: pool connect → MySQL -->
<rect class="card" x="252" y="232" width="520" height="48" rx="12" fill="#EAF7EF" stroke="#58A978"/>
<text class="mono" x="272" y="252" font-weight="700" fill="#102033">2</text>
<text class="mono" x="292" y="252" fill="#102033">pool connect to Testcontainers MySQL8</text>
<text class="small" x="292" y="270" fill="#536273">MySQL8Server.Launcher.mysql singleton</text>
<path class="line" d="M364 256 L690 256"/>

<!-- Band 3: preparedQuery -->
<rect class="card" x="252" y="292" width="320" height="48" rx="12" fill="#FFF3D9" stroke="#D6A441"/>
<text class="mono" x="272" y="312" font-weight="700" fill="#102033">3</text>
<text class="mono" x="292" y="312" fill="#102033">preparedQuery(sql)</text>
<text class="small" x="292" y="330" fill="#536273">.execute(params).coAwait()</text>
<path class="line" d="M364 316 L470 316"/>

<!-- Band 4: SQL execute on MySQL -->
<rect class="card" x="472" y="352" width="320" height="48" rx="12" fill="#FDECEF" stroke="#DC6B82"/>
<text class="mono" x="492" y="372" font-weight="700" fill="#102033">4</text>
<text class="mono" x="512" y="372" fill="#102033">SQL executed on MySQL8</text>
<text class="small" x="512" y="390" fill="#536273">Testcontainers container</text>
<path class="line" d="M584 376 L690 376"/>

<!-- Band 5: RowSet return -->
<rect class="card" x="60" y="412" width="732" height="44" rx="12" fill="#E9F7F6" stroke="#45A7A1"/>
<text class="mono" x="80" y="430" font-weight="700" fill="#102033">5</text>
<text class="mono" x="100" y="430" fill="#102033">RowSet&lt;Row&gt; returned</text>
<text class="small" x="100" y="446" fill="#536273">map rows → domain objects</text>
<path class="dashed" d="M690 434 L122 434"/>
</svg>
