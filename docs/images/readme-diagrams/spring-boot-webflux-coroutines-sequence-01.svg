<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-label="WebFlux coroutines request handling sequence">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#1f2937" flood-opacity="0.10"/></filter>
  <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth">
    <path d="M1,1 L8,4.5 L1,8 Z" fill="#758297"/>
  </marker>
  <style>
    .canvas{fill:#f7f9fc}.frame{fill:#fff;stroke:#d8e0ea;stroke-width:1.5}
    .title{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:38px;font-weight:400;fill:#102033}
    .subtitle{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:14px;font-weight:400;fill:#536273}
    .smallLabel{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:21px;font-weight:400;fill:#102033}
    .mono{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#102033}
    .small{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#536273}
    .card{stroke-width:2.1;filter:url(#shadow)}
    .lifeline{stroke:#b0bbca;stroke-width:1.5;stroke-dasharray:6 4;fill:none}
    .reqArrow{stroke:#5B8DEF;stroke-width:2.1;fill:none;marker-end:url(#arrow)}
    .rspArrow{stroke:#45A7A1;stroke-width:2.1;stroke-dasharray:7 4;fill:none;marker-end:url(#arrow)}
    .msgLabel{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:13px;fill:#102033}
  </style>
</defs>
<rect class="canvas" width="960" height="520"/>
<rect class="frame" x="24" y="20" width="912" height="480" rx="22"/>

<!-- Title -->
<text class="title" x="48" y="66">WebFlux + Coroutines Sequence</text>
<text class="subtitle" x="52" y="88">Netty → suspend fun handler → withContext(Dispatchers.IO) → response</text>

<!-- Participants cx: 90, 260, 480, 700, 870 -->
<!-- HTTP Client -->
<g transform="translate(34,104)">
  <rect class="card" x="0" y="0" width="112" height="68" rx="12" fill="#E8F3FF" stroke="#5B8DEF"/>
  <text class="smallLabel" style="font-size:17px" x="56" y="30" text-anchor="middle">HTTP</text>
  <text class="smallLabel" style="font-size:17px" x="56" y="54" text-anchor="middle">Client</text>
</g>
<!-- Netty Server -->
<g transform="translate(200,104)">
  <rect class="card" x="0" y="0" width="120" height="68" rx="12" fill="#EAF7EF" stroke="#58A978"/>
  <text class="smallLabel" style="font-size:17px" x="60" y="26" text-anchor="middle">Netty</text>
  <text class="smallLabel" style="font-size:17px" x="60" y="50" text-anchor="middle">Server</text>
  <text class="small" x="60" y="66" text-anchor="middle">non-blocking I/O</text>
</g>
<!-- CoroutineController -->
<g transform="translate(416,104)">
  <rect class="card" x="0" y="0" width="150" height="68" rx="12" fill="#FFF3D9" stroke="#D6A441"/>
  <text class="smallLabel" style="font-size:17px" x="75" y="26" text-anchor="middle">Coroutine</text>
  <text class="smallLabel" style="font-size:17px" x="75" y="50" text-anchor="middle">Controller</text>
  <text class="small" x="75" y="66" text-anchor="middle">suspend fun</text>
</g>
<!-- Dispatchers.IO -->
<g transform="translate(630,104)">
  <rect class="card" x="0" y="0" width="140" height="68" rx="12" fill="#F1ECFF" stroke="#8A72D6"/>
  <text class="smallLabel" style="font-size:17px" x="70" y="26" text-anchor="middle">Dispatchers</text>
  <text class="smallLabel" style="font-size:17px" x="70" y="50" text-anchor="middle">.IO</text>
  <text class="small" x="70" y="66" text-anchor="middle">or VT</text>
</g>
<!-- Service -->
<g transform="translate(810,104)">
  <rect class="card" x="0" y="0" width="126" height="68" rx="12" fill="#E9F7F6" stroke="#45A7A1"/>
  <text class="smallLabel" style="font-size:17px" x="63" y="30" text-anchor="middle">Service</text>
  <text class="small" x="63" y="52" text-anchor="middle">suspend fun</text>
  <text class="small" x="63" y="68" text-anchor="middle">external call</text>
</g>

<!-- Lifelines cx: 90, 260, 491, 700, 873 -->
<line class="lifeline" x1="90" y1="172" x2="90" y2="490"/>
<line class="lifeline" x1="260" y1="172" x2="260" y2="490"/>
<line class="lifeline" x1="491" y1="172" x2="491" y2="490"/>
<line class="lifeline" x1="700" y1="172" x2="700" y2="490"/>
<line class="lifeline" x1="873" y1="172" x2="873" y2="490"/>

<!-- Step 1: GET /delay (non-blocking) -->
<text class="msgLabel" x="48" y="206">1. GET /default/delay (non-blocking)</text>
<path class="reqArrow" d="M90,210 L252,210"/>

<!-- Step 2: Netty dispatches to coroutine handler -->
<text class="msgLabel" x="272" y="242">2. suspend fun handle(request)</text>
<path class="reqArrow" d="M260,246 L483,246"/>

<!-- Step 3: Controller → withContext(Dispatchers.IO) -->
<text class="msgLabel" x="504" y="278">3. withContext(Dispatchers.IO)</text>
<path class="reqArrow" d="M491,282 L692,282"/>

<!-- Step 4: Dispatchers.IO → Service: blocking call -->
<text class="msgLabel" x="712" y="314">4. service.processBlocking()</text>
<path class="reqArrow" d="M700,318 L865,318"/>

<!-- Step 5: Service returns result -->
<text class="msgLabel" x="712" y="350">5. result</text>
<path class="rspArrow" d="M865,354 L708,354"/>

<!-- Step 6: Coroutine resumes on Netty thread -->
<text class="msgLabel" x="504" y="386">6. resume coroutine (result)</text>
<path class="rspArrow" d="M700,390 L499,390"/>

<!-- Step 7: Controller returns ResponseEntity -->
<text class="msgLabel" x="272" y="422">7. ResponseEntity (coroutine completes)</text>
<path class="rspArrow" d="M491,426 L268,426"/>

<!-- Step 8: Netty sends response -->
<text class="msgLabel" x="48" y="458">8. 200 OK (response body)</text>
<path class="rspArrow" d="M260,462 L98,462"/>

<!-- Note -->
<text class="small" x="48" y="490">Blocking work dispatched to IO/VT thread pool; Netty event loop is never blocked</text>
</svg>
