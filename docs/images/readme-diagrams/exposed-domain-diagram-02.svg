<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" role="img" aria-label="Exposed Domain Query Patterns">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#1f2937" flood-opacity="0.10"/></filter>
  <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth">
    <path d="M1,1 L8,4.5 L1,8 Z" fill="#758297"/>
  </marker>
  <style>
    .canvas{fill:#f7f9fc}.frame{fill:#fff;stroke:#d8e0ea;stroke-width:1.5}
    .title{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:38px;font-weight:400;fill:#102033}
    .subtitle{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:14px;font-weight:400;fill:#536273}
    .smallLabel{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:21px;font-weight:400;fill:#102033}
    .mono{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#102033}
    .small{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#536273}
    .card{stroke-width:2.1;filter:url(#shadow)}
    .line{stroke:#758297;stroke-width:2.1;fill:none;marker-end:url(#arrow)}
  </style>
</defs>
<rect class="canvas" width="960" height="440"/>
<rect class="frame" x="24" y="20" width="912" height="396" rx="18"/>
<text class="title" x="44" y="66">Exposed Domain Query Patterns</text>
<text class="subtitle" x="44" y="90">join queries · eager loading · lazy loading · SizedIterable</text>

<!-- Join Query -->
<g transform="translate(44,110)">
  <rect class="card" x="0" y="0" width="260" height="120" rx="10" fill="#E8F3FF" stroke="#5B8DEF"/>
  <text class="smallLabel" x="130" y="30" text-anchor="middle">Join Query</text>
  <text class="mono" x="12" y="56">Movies.join(ActorsInMovies,</text>
  <text class="mono" x="12" y="74"> JoinType.INNER)</text>
  <text class="mono" x="12" y="92"> .join(Actors, JoinType.INNER)</text>
  <text class="mono" x="12" y="110"> .selectAll()</text>
</g>

<!-- Eager Loading -->
<g transform="translate(350,110)">
  <rect class="card" x="0" y="0" width="260" height="120" rx="10" fill="#EAF7EF" stroke="#58A978"/>
  <text class="smallLabel" x="130" y="30" text-anchor="middle">Eager Loading</text>
  <text class="mono" x="12" y="56">Movie.find { id eq movieId }</text>
  <text class="mono" x="12" y="74">  .with(Movie::actors)</text>
  <text class="mono" x="12" y="92">  .firstOrNull()</text>
  <text class="mono" x="12" y="110">// batch loads relations</text>
</g>

<!-- Lazy Loading -->
<g transform="translate(656,110)">
  <rect class="card" x="0" y="0" width="260" height="120" rx="10" fill="#FFF3D9" stroke="#D6A441"/>
  <text class="smallLabel" x="130" y="30" text-anchor="middle">Lazy Loading</text>
  <text class="mono" x="12" y="56">val movie = Movie[id]</text>
  <text class="mono" x="12" y="74">// access triggers query:</text>
  <text class="mono" x="12" y="92">movie.actors // SizedIterable</text>
  <text class="mono" x="12" y="110">  .toList()</text>
</g>

<!-- SizedIterable result -->
<g transform="translate(44,280)">
  <rect class="card" x="0" y="0" width="260" height="100" rx="10" fill="#FDECEF" stroke="#DC6B82"/>
  <text class="smallLabel" x="130" y="28" text-anchor="middle">SizedIterable</text>
  <text class="mono" x="12" y="54">actors: SizedIterable&lt;Actor&gt;</text>
  <text class="mono" x="12" y="72">reviews: SizedIterable&lt;Review&gt;</text>
  <text class="mono" x="12" y="90">// DAO relationship accessor</text>
</g>

<!-- DAO Result -->
<g transform="translate(350,280)">
  <rect class="card" x="0" y="0" width="260" height="100" rx="10" fill="#E9F7F6" stroke="#45A7A1"/>
  <text class="smallLabel" x="130" y="28" text-anchor="middle">DAO Result Row</text>
  <text class="mono" x="12" y="54">ResultRow → Entity.wrapRow()</text>
  <text class="mono" x="12" y="72">Entity.wrap(id, row)</text>
  <text class="mono" x="12" y="90">// cached per transaction</text>
</g>

<!-- SQL DSL result -->
<g transform="translate(656,280)">
  <rect class="card" x="0" y="0" width="260" height="100" rx="10" fill="#F1ECFF" stroke="#8A72D6"/>
  <text class="smallLabel" x="130" y="28" text-anchor="middle">SQL DSL Result</text>
  <text class="mono" x="12" y="54">selectAll().map { row -&gt;</text>
  <text class="mono" x="12" y="72">  MovieDTO(row[Movies.name],</text>
  <text class="mono" x="12" y="90">  row[Movies.releaseDate]) }</text>
</g>

<!-- Arrows -->
<path class="line" d="M174,230 L174,278"/>
<path class="line" d="M480,230 L480,278"/>
<path class="line" d="M786,230 L786,278"/>
</svg>
