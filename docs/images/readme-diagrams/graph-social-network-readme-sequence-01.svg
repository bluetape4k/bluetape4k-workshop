  <text x="1672.0" y="502" class="msg callText">exclude alice and direct friends</text>
  <path d="M 1617.0 526 L 1965.0 526" class="call" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-call)"/>
  <rect x="1958.0" y="518" width="14" height="48" rx="4" class="activation"/>
  <rect x="1992.0" y="556" width="294.0" height="34" rx="17" class="label callLabel"/>
