  <text x="2040.0" y="578" class="msg callText">carol via bob, dave via bob</text>
  <path d="M 1965.0 602 L 2313.0 602" class="call" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-call)"/>
