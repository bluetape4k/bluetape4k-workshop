    <text x="1617.0" y="186" text-anchor="middle" class="participant">Direct friends</text>
    <text x="1617.0" y="211" text-anchor="middle" class="role">bob</text></g>
  <line x1="1617.0" y1="232" x2="1617.0" y2="712" class="lifeline"/>
  <g filter="url(#shadow)"><rect x="1830.0" y="156" width="270" height="76" rx="10" class="header"/>
    <text x="1965.0" y="186" text-anchor="middle" class="participant">Depth-2 candidates</text>
