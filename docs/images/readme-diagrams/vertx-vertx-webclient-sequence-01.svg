<svg xmlns="http://www.w3.org/2000/svg" width="1624" height="1146" viewBox="0 0 1624 1146" role="img" aria-label="HTTP">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#1f2937" flood-opacity="0.10"/></filter>
  <marker id="openArrow" markerWidth="10" markerHeight="8" refX="8.5" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M 1 1 L 8.5 4 L 1 7" fill="none" stroke="#758297" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <marker id="inherit" markerWidth="11" markerHeight="10" refX="9.5" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 1 L 9.5 5 L 0.5 9 Z" fill="#ffffff" stroke="#758297" stroke-width="1.7"/></marker>
  <style>
    .canvas{fill:#f7f9fc}.frame{fill:#fff;stroke:#d8e0ea;stroke-width:1.5}
    .title{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:43px;font-weight:400;fill:#102033}
    .subtitle{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:15px;font-weight:400;fill:#536273}
    .label{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:25px;font-weight:400;fill:#102033}
    .smallLabel{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:21px;font-weight:400;fill:#102033}
    .mono{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#102033}
    .small{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#536273}
    .strong{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:13px;font-weight:400;fill:#102033}
    .card{stroke-width:2.1;filter:url(#shadow)}.compartment{stroke-width:1.5;fill:none}
    .line{stroke:#758297;stroke-width:2.1;fill:none;marker-end:url(#openArrow)}
    .plainLine{stroke:#758297;stroke-width:2.1;fill:none}
    .dashed{stroke:#758297;stroke-width:2.1;stroke-dasharray:7 6;fill:none;marker-end:url(#openArrow)}
    .inheritLine{stroke:#758297;stroke-width:2.2;fill:none;marker-end:url(#inherit)}
    .implLine{stroke:#758297;stroke-width:2.2;stroke-dasharray:8 7;fill:none;marker-end:url(#inherit)}
  </style>
</defs>
<rect class="canvas" width="1624" height="1146"/>
<rect class="frame" x="32" y="28" width="1560" height="1090" rx="28"/>
<text class="title" x="66" y="82">HTTP</text>
<text class="subtitle" x="70" y="118">Sequence messages from the original Mermaid source</text>
<rect class="card" x="-10" y="166" width="300" height="72" rx="20" fill="#E8F3FF" stroke="#5B8DEF"/>
<text class="smallLabel" x="140" y="209" text-anchor="middle">suspend caller</text>
<line class="lifeline" x1="140" y1="252" x2="140" y2="1086" stroke="#b7c2d1" stroke-width="2" stroke-dasharray="10 10"/>
<rect class="card" x="438" y="166" width="300" height="72" rx="20" fill="#EAF7EF" stroke="#58A978"/>
<text class="smallLabel" x="588" y="209" text-anchor="middle">WebClient</text>
<line class="lifeline" x1="588" y1="252" x2="588" y2="1086" stroke="#b7c2d1" stroke-width="2" stroke-dasharray="10 10"/>
<rect class="card" x="886" y="166" width="300" height="72" rx="20" fill="#FFF3D9" stroke="#D6A441"/>
<text class="smallLabel" x="1036" y="198.5" text-anchor="middle">Vert.x Future&lt;Http</text>
<text class="smallLabel" x="1036" y="219.5" text-anchor="middle">Response&gt;</text>
<line class="lifeline" x1="1036" y1="252" x2="1036" y2="1086" stroke="#b7c2d1" stroke-width="2" stroke-dasharray="10 10"/>
<rect class="card" x="1334" y="166" width="300" height="72" rx="20" fill="#FDECEF" stroke="#DC6B82"/>
<text class="smallLabel" x="1484" y="198.5" text-anchor="middle">HTTP Server</text>
<text class="smallLabel" x="1484" y="219.5" text-anchor="middle">(CoroutineVerticle)</text>
<line class="lifeline" x1="1484" y1="252" x2="1484" y2="1086" stroke="#b7c2d1" stroke-width="2" stroke-dasharray="10 10"/>
<rect x="192.5" y="286" width="343" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="210.5" y="313" text-anchor="start">1. client.get(port, host, path).send()</text>
<path class="line" d="M140 344 L588 344"/>
<rect x="697" y="396" width="230" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="715" y="423" text-anchor="start">2. Future (non-blocking)</text>
<path class="line" d="M588 454 L1036 454"/>
<rect x="396.5" y="506" width="383" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="414.5" y="533" text-anchor="start">3. .coAwait() — suspend (no thread blocked)</text>
<path class="line" d="M140 564 L1036 564"/>
<rect x="1155" y="616" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="1173" y="643" text-anchor="start">4. HTTP GET request</text>
<path class="line" d="M1036 674 L1484 674"/>
<rect x="1155" y="726" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="1173" y="753" text-anchor="start">5. HTTP response</text>
<path class="dashed" d="M1484 784 L1036 784"/>
<rect x="469" y="836" width="238" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="487" y="863" text-anchor="start">6. HttpResponse (resumed)</text>
<path class="dashed" d="M1036 894 L140 894"/>
<rect x="60" y="946" width="311" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="78" y="973" text-anchor="start">7. response.body() — direct access</text>
<path class="line" d="M140 1004 C204 1004 204 1038 140 1038"/>
</svg>
