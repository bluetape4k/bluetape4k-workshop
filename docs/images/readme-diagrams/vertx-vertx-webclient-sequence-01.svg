<svg xmlns="http://www.w3.org/2000/svg" width="1050" height="831" viewBox="0 0 1050 831" role="img" aria-label="Vert.x WebClient Request Sequence">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#1f2937" flood-opacity="0.10"/></filter>
  <marker id="arrowBlue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M1 1 L7 4 L1 7 Z" fill="#5b8def"/></marker>
  <marker id="arrowTeal" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M1 1 L7 4 L1 7 Z" fill="#45a7a1"/></marker>
  <style>
    .canvas{fill:#f7f9fc}
    .frame{fill:#ffffff;stroke:#d8e0ea;stroke-width:1.5}
    .title{font-family:"Architects Daughter";font-size:34px;fill:#102033}
    .subtitle{font-family:"Comic Mono";font-size:13px;fill:#536273}
    .actor{font-family:"Architects Daughter";font-size:17px;fill:#102033}
    .message{font-family:"Comic Mono";font-size:12px;fill:#263445;paint-order:stroke;stroke:#ffffff;stroke-width:4px;stroke-linejoin:round}
    .detail{font-family:"Comic Mono";font-size:11px;fill:#536273}
    .lifeline{stroke:#b8c4d3;stroke-width:1.4;stroke-dasharray:7 6}
    .call{stroke:#5b8def;stroke-width:2.15;fill:none;marker-end:url(#arrowBlue)}
    .return{stroke:#45a7a1;stroke-width:2.05;stroke-dasharray:7 5;fill:none;marker-end:url(#arrowTeal)}
    .box{stroke-width:1.8;filter:url(#shadow)}
  </style>
</defs>
<rect class="canvas" width="1050" height="831"/>
<rect class="frame" x="24" y="20" width="1002" height="791" rx="18"/>
<text class="title" x="48" y="58">Vert.x WebClient Request Sequence</text>
<text class="subtitle" x="50" y="84">Test · deployVerticle · WebClient · get/send · coAwait · CoroutineServer</text>
<rect class="box" x="2" y="108" width="180" height="58" rx="10" fill="#e8f3ff" stroke="#7aa0c4"/>
<text class="actor" x="92" y="137" text-anchor="middle" dominant-baseline="middle">Test</text>
<line class="lifeline" x1="92" y1="166" x2="92" y2="773"/>
<rect class="box" x="290.6666666666667" y="108" width="180" height="58" rx="10" fill="#eaf7ef" stroke="#7aa0c4"/>
<text class="actor" x="380.6666666666667" y="137" text-anchor="middle" dominant-baseline="middle">WebClient</text>
<line class="lifeline" x1="380.6666666666667" y1="166" x2="380.6666666666667" y2="773"/>
<rect class="box" x="579.3333333333334" y="108" width="180" height="58" rx="10" fill="#fff3d9" stroke="#7aa0c4"/>
<text class="actor" x="669.3333333333334" y="137" text-anchor="middle" dominant-baseline="middle">HttpRequest</text>
<line class="lifeline" x1="669.3333333333334" y1="166" x2="669.3333333333334" y2="773"/>
<rect class="box" x="868" y="108" width="180" height="58" rx="10" fill="#f1ecff" stroke="#7aa0c4"/>
<text class="actor" x="958" y="137" text-anchor="middle" dominant-baseline="middle">CoroutineServer</text>
<line class="lifeline" x1="958" y1="166" x2="958" y2="773"/>
<path class="call" d="M92 205 L958 205"/>
<rect class="message-label" x="245" y="219" width="560" height="46" rx="7" fill="#ffffff" opacity="0.96" stroke="#dbe3ee"/>
<text class="message" x="525" y="234.5" text-anchor="middle" dominant-baseline="middle">1. vertx.deployVerticle(CoroutineServer()) / server listens on</text>
<text class="message" x="525" y="249.5" text-anchor="middle" dominant-baseline="middle">port 9988</text>
<path class="call" d="M92 313 L380.6666666666667 313"/>
<rect class="message-label" x="17" y="327" width="438.6666666666667" height="46" rx="7" fill="#ffffff" opacity="0.96" stroke="#dbe3ee"/>
<text class="message" x="236.33333333333334" y="342.5" text-anchor="middle" dominant-baseline="middle">2. WebClient.create(vertx) / non-blocking HTTP</text>
<text class="message" x="236.33333333333334" y="357.5" text-anchor="middle" dominant-baseline="middle">client</text>
<path class="call" d="M380.6666666666667 421 L669.3333333333334 421"/>
<rect class="message-label" x="305.66666666666663" y="435" width="438.6666666666667" height="46" rx="7" fill="#ffffff" opacity="0.96" stroke="#dbe3ee"/>
<text class="message" x="525" y="450.5" text-anchor="middle" dominant-baseline="middle">3. get(9988, &quot;localhost&quot;, &quot;/api&quot;) /</text>
<text class="message" x="525" y="465.5" text-anchor="middle" dominant-baseline="middle">.as(BodyCodec.string())</text>
<path class="call" d="M669.3333333333334 529 L958 529"/>
<rect class="message-label" x="594.3333333333335" y="543" width="438.66666666666663" height="31" rx="7" fill="#ffffff" opacity="0.96" stroke="#dbe3ee"/>
<text class="message" x="813.6666666666667" y="558.5" text-anchor="middle" dominant-baseline="middle">4. .send().coAwait() / suspend until HttpResponse</text>
<path class="return" d="M958 637 L92 637"/>
<rect class="message-label" x="245" y="651" width="560" height="31" rx="7" fill="#ffffff" opacity="0.96" stroke="#dbe3ee"/>
<text class="message" x="525" y="666.5" text-anchor="middle" dominant-baseline="middle">5. HttpResponse&lt;String&gt; body / statusCode, body.bodyAsString()</text>
</svg>
