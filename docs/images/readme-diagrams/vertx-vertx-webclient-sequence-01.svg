<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" role="img" aria-label="Vert.x WebClient Request Sequence">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%">
    <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#1f2937" flood-opacity="0.10"/>
  </filter>
  <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth">
    <path d="M1,1 L8,4.5 L1,8 Z" fill="#758297"/>
  </marker>
  <style>
    .canvas{fill:#f7f9fc}.frame{fill:#fff;stroke:#d8e0ea;stroke-width:1.5}
    .title{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:38px;font-weight:400;fill:#102033}
    .subtitle{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:14px;font-weight:400;fill:#536273}
    .smallLabel{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:21px;font-weight:400;fill:#102033}
    .mono{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#102033}
    .small{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#536273}
    .card{stroke-width:2.1;filter:url(#shadow)}
    .line{stroke:#758297;stroke-width:2.1;fill:none;marker-end:url(#arrow)}
    .dashed{stroke:#758297;stroke-width:2.1;stroke-dasharray:7 5;fill:none;marker-end:url(#arrow)}
    .lifeline{stroke:#b7c2d1;stroke-width:1.8;stroke-dasharray:8 6;fill:none}
  </style>
</defs>
<rect class="canvas" width="960" height="480"/>
<rect class="frame" x="24" y="20" width="912" height="436" rx="20"/>
<text class="title" x="48" y="66">Vert.x WebClient Request Sequence</text>
<text class="subtitle" x="48" y="90">Test · deployVerticle · WebClient · get/send · coAwait · CoroutineServer</text>

<!-- Participant headers -->
<rect class="card" x="60" y="108" width="120" height="44" rx="14" fill="#E8F3FF" stroke="#5B8DEF"/>
<text class="smallLabel" style="font-size:17px" x="120" y="136" text-anchor="middle">Test</text>

<rect class="card" x="248" y="108" width="150" height="44" rx="14" fill="#EAF7EF" stroke="#58A978"/>
<text class="smallLabel" style="font-size:17px" x="323" y="136" text-anchor="middle">WebClient</text>

<rect class="card" x="476" y="108" width="150" height="44" rx="14" fill="#FFF3D9" stroke="#D6A441"/>
<text class="smallLabel" style="font-size:17px" x="551" y="136" text-anchor="middle">HttpRequest</text>

<rect class="card" x="704" y="108" width="160" height="44" rx="14" fill="#FDECEF" stroke="#DC6B82"/>
<text class="smallLabel" style="font-size:17px" x="784" y="136" text-anchor="middle">CoroutineServer</text>

<!-- Lifelines -->
<line class="lifeline" x1="120" y1="152" x2="120" y2="428"/>
<line class="lifeline" x1="323" y1="152" x2="323" y2="428"/>
<line class="lifeline" x1="551" y1="152" x2="551" y2="428"/>
<line class="lifeline" x1="784" y1="152" x2="784" y2="428"/>

<!-- Band 1: deploy CoroutineServer -->
<rect class="card" x="60" y="172" width="700" height="48" rx="12" fill="#E8F3FF" stroke="#5B8DEF"/>
<text class="mono" x="80" y="192" font-weight="700" fill="#102033">1</text>
<text class="mono" x="100" y="192" fill="#102033">vertx.deployVerticle(CoroutineServer())</text>
<text class="small" x="100" y="210" fill="#536273">server listens on port 9988</text>
<path class="line" d="M162 196 L702 196"/>

<!-- Band 2: create WebClient -->
<rect class="card" x="60" y="232" width="300" height="48" rx="12" fill="#EAF7EF" stroke="#58A978"/>
<text class="mono" x="80" y="252" font-weight="700" fill="#102033">2</text>
<text class="mono" x="100" y="252" fill="#102033">WebClient.create(vertx)</text>
<text class="small" x="100" y="270" fill="#536273">non-blocking HTTP client</text>
<path class="line" d="M162 256 L246 256"/>

<!-- Band 3: build request -->
<rect class="card" x="248" y="292" width="320" height="48" rx="12" fill="#FFF3D9" stroke="#D6A441"/>
<text class="mono" x="268" y="312" font-weight="700" fill="#102033">3</text>
<text class="mono" x="288" y="312" fill="#102033">get(9988, "localhost", "/api")</text>
<text class="small" x="288" y="330" fill="#536273">.as(BodyCodec.string())</text>
<path class="line" d="M365 316 L474 316"/>

<!-- Band 4: send + coAwait -->
<rect class="card" x="476" y="352" width="328" height="48" rx="12" fill="#FDECEF" stroke="#DC6B82"/>
<text class="mono" x="496" y="372" font-weight="700" fill="#102033">4</text>
<text class="mono" x="516" y="372" fill="#102033">.send().coAwait()</text>
<text class="small" x="516" y="390" fill="#536273">suspend until HttpResponse</text>
<path class="line" d="M552 376 L702 376"/>

<!-- Band 5: response -->
<rect class="card" x="60" y="412" width="744" height="44" rx="12" fill="#E9F7F6" stroke="#45A7A1"/>
<text class="mono" x="80" y="430" font-weight="700" fill="#102033">5</text>
<text class="mono" x="100" y="430" fill="#102033">HttpResponse&lt;String&gt; body</text>
<text class="small" x="100" y="446" fill="#536273">statusCode, body.bodyAsString()</text>
<path class="dashed" d="M702 434 L122 434"/>
</svg>
