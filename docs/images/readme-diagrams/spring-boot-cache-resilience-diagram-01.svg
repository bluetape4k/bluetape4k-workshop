<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-label="Spring Boot Cache Resilience Architecture">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#1f2937" flood-opacity="0.10"/></filter>
  <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth">
    <path d="M1,1 L8,4.5 L1,8 Z" fill="#758297"/>
  </marker>
  <marker id="arrowGreen" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth">
    <path d="M1,1 L8,4.5 L1,8 Z" fill="#58A978"/>
  </marker>
  <marker id="arrowRed" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth">
    <path d="M1,1 L8,4.5 L1,8 Z" fill="#DC6B82"/>
  </marker>
  <style>
    .canvas{fill:#f7f9fc}.frame{fill:#fff;stroke:#d8e0ea;stroke-width:1.5}
    .title{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:38px;font-weight:400;fill:#102033}
    .subtitle{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:14px;font-weight:400;fill:#536273}
    .smallLabel{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:21px;font-weight:400;fill:#102033}
    .mono{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#102033}
    .small{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#536273}
    .card{stroke-width:2.1;filter:url(#shadow)}
    .line{stroke:#758297;stroke-width:2.1;fill:none;marker-end:url(#arrow)}
    .lineGreen{stroke:#58A978;stroke-width:2.1;fill:none;marker-end:url(#arrowGreen)}
    .lineRed{stroke:#DC6B82;stroke-width:2.1;fill:none;stroke-dasharray:7 4;marker-end:url(#arrowRed)}
  </style>
</defs>
<rect class="canvas" width="960" height="520"/>
<rect class="frame" x="24" y="20" width="912" height="480" rx="22"/>

<!-- Title -->
<text class="title" x="48" y="68">Cache + Resilience4j</text>
<text class="subtitle" x="52" y="92">ResilientProductService: Redis primary + Caffeine fallback via CircuitBreaker</text>

<!-- Row 1: Client → Service → CircuitBreaker -->
<!-- Client -->
<g transform="translate(48,116)">
  <rect class="card" x="0" y="0" width="150" height="72" rx="12" fill="#E8F3FF" stroke="#5B8DEF"/>
  <text class="smallLabel" x="75" y="30" text-anchor="middle">Client</text>
  <text class="small" x="75" y="52" text-anchor="middle">HTTP / test</text>
</g>

<!-- ResilientProductService -->
<g transform="translate(244,116)">
  <rect class="card" x="0" y="0" width="210" height="72" rx="12" fill="#FFF3D9" stroke="#D6A441"/>
  <text class="smallLabel" x="105" y="26" text-anchor="middle">Resilient</text>
  <text class="smallLabel" x="105" y="50" text-anchor="middle">ProductService</text>
  <text class="small" x="105" y="68" text-anchor="middle">SuspendDecorators</text>
</g>

<!-- CircuitBreaker -->
<g transform="translate(502,116)">
  <rect class="card" x="0" y="0" width="190" height="72" rx="12" fill="#F1ECFF" stroke="#8A72D6"/>
  <text class="smallLabel" x="95" y="26" text-anchor="middle">Circuit</text>
  <text class="smallLabel" x="95" y="50" text-anchor="middle">Breaker</text>
  <text class="small" x="95" y="68" text-anchor="middle">redis-cache instance</text>
</g>

<!-- Redis -->
<g transform="translate(740,116)">
  <rect class="card" x="0" y="0" width="168" height="72" rx="12" fill="#E9F7F6" stroke="#45A7A1"/>
  <text class="smallLabel" x="84" y="30" text-anchor="middle">Redis</text>
  <text class="small" x="84" y="52" text-anchor="middle">Primary cache</text>
  <text class="small" x="84" y="68" text-anchor="middle">TTL 5 min</text>
</g>

<!-- Caffeine (fallback) -->
<g transform="translate(740,228)">
  <rect class="card" x="0" y="0" width="168" height="72" rx="12" fill="#FFF3D9" stroke="#D6A441"/>
  <text class="smallLabel" x="84" y="30" text-anchor="middle">Caffeine</text>
  <text class="small" x="84" y="52" text-anchor="middle">Local fallback</text>
  <text class="small" x="84" y="68" text-anchor="middle">TTL 30 s</text>
</g>

<!-- Arrows Row 1 -->
<path class="line" d="M198,152 L244,152"/>
<path class="line" d="M454,152 L502,152"/>
<!-- CB → Redis (CLOSED - success) -->
<path class="lineGreen" d="M692,140 L740,140"/>
<text class="small" x="716" y="134" text-anchor="middle" fill="#58A978">CLOSED</text>
<!-- CB → Caffeine (OPEN - fallback) -->
<path class="lineRed" d="M597,188 Q597,264 740,264"/>
<text class="small" x="648" y="248" text-anchor="middle" fill="#DC6B82">OPEN→fallback</text>

<!-- CircuitBreaker State Machine box -->
<g transform="translate(48,330)">
  <rect x="0" y="0" width="862" height="170" rx="12" fill="#f7f9fc" stroke="#d8e0ea" stroke-width="1.5"/>
  <text class="mono" x="431" y="22" text-anchor="middle" fill="#536273">CircuitBreaker State Machine (slidingWindow=5, minCalls=3, failureRate=60%, waitOpen=5s)</text>

  <!-- CLOSED state -->
  <circle cx="120" cy="100" r="54" fill="#58A978" filter="url(#shadow)"/>
  <text x="120" y="96" text-anchor="middle" font-family="Comic Sans MS,cursive" font-size="14" fill="#fff" font-weight="bold">CLOSED</text>
  <text x="120" y="114" text-anchor="middle" font-family="Comic Sans MS,cursive" font-size="11" fill="#fff">Redis OK</text>

  <!-- OPEN state -->
  <circle cx="431" cy="100" r="54" fill="#DC6B82" filter="url(#shadow)"/>
  <text x="431" y="96" text-anchor="middle" font-family="Comic Sans MS,cursive" font-size="14" fill="#fff" font-weight="bold">OPEN</text>
  <text x="431" y="114" text-anchor="middle" font-family="Comic Sans MS,cursive" font-size="11" fill="#fff">Caffeine</text>

  <!-- HALF-OPEN state -->
  <circle cx="742" cy="100" r="54" fill="#D6A441" filter="url(#shadow)"/>
  <text x="742" y="96" text-anchor="middle" font-family="Comic Sans MS,cursive" font-size="14" fill="#fff" font-weight="bold">HALF-OPEN</text>
  <text x="742" y="114" text-anchor="middle" font-family="Comic Sans MS,cursive" font-size="11" fill="#fff">probe Redis</text>

  <!-- CLOSED → OPEN -->
  <path d="M172 80 Q301 50 378 80" stroke="#DC6B82" stroke-width="2" fill="none" marker-end="url(#arrowRed)"/>
  <text x="274" y="48" text-anchor="middle" font-family="Comic Sans MS,cursive" font-size="11" fill="#DC6B82">failures &gt;= 60%</text>

  <!-- OPEN → HALF-OPEN -->
  <path d="M483 80 Q612 50 689 80" stroke="#758297" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text x="586" y="48" text-anchor="middle" font-family="Comic Sans MS,cursive" font-size="11" fill="#536273">wait 5s</text>

  <!-- HALF-OPEN → CLOSED (success) -->
  <path d="M720 155 Q431 185 142 155" stroke="#58A978" stroke-width="2" fill="none" marker-end="url(#arrowGreen)"/>
  <text x="431" y="155" text-anchor="middle" font-family="Comic Sans MS,cursive" font-size="11" fill="#58A978">probe success</text>

  <!-- HALF-OPEN → OPEN (failure) -->
  <path d="M700 125 Q565 150 480 125" stroke="#DC6B82" stroke-width="2" fill="none" marker-end="url(#arrowRed)"/>
  <text x="591" y="150" text-anchor="middle" font-family="Comic Sans MS,cursive" font-size="11" fill="#DC6B82">probe failed</text>
</g>
</svg>
