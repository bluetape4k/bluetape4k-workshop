<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-label="Problem Details Error Handling Architecture">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#1f2937" flood-opacity="0.10"/></filter>
  <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth">
    <path d="M1,1 L8,4.5 L1,8 Z" fill="#758297"/>
  </marker>
  <style>
    .canvas{fill:#f7f9fc}.frame{fill:#fff;stroke:#d8e0ea;stroke-width:1.5}
    .title{font-family:"Architects Daughter";font-size:38px;font-weight:400;fill:#102033}
    .subtitle{font-family:"Comic Mono";font-size:14px;font-weight:400;fill:#536273}
    .smallLabel{font-family:"Architects Daughter";font-size:21px;font-weight:400;fill:#102033}
    .mono{font-family:"Comic Mono";font-size:12px;font-weight:400;fill:#102033}
    .small{font-family:"Comic Mono";font-size:12px;font-weight:400;fill:#536273}
    .card{stroke-width:2.1;filter:url(#shadow)}
    .line{stroke:#758297;stroke-width:2.1;fill:none;marker-end:url(#arrow)}
  </style>
</defs>
<rect class="canvas" width="960" height="600"/>
<rect class="frame" x="24" y="20" width="912" height="560" rx="22"/>

<!-- Title -->
<text class="title" x="48" y="68">Problem Details — Error Handling</text>
<text class="subtitle" x="52" y="92">zalando/problem · RFC 9457 Problem Details · @ControllerAdvice exception handling</text>

<!-- ====== ROW 1: Request layer ====== -->

<!-- Row label -->
<text class="small" x="480" y="116" text-anchor="middle" letter-spacing="0.06em" font-size="11" fill="#758297">REQUEST LAYER</text>

<!-- LoggingFilter + RestController -->
<g transform="translate(48,124)">
  <rect class="card" x="0" y="0" width="180" height="96" rx="12" fill="#E8F3FF" stroke="#5B8DEF"/>
  <text class="smallLabel" x="90" y="30" text-anchor="middle">RestController</text>
  <text class="small" x="90" y="52" text-anchor="middle">+ LoggingFilter</text>
  <text class="mono" x="90" y="74" text-anchor="middle">request / response log</text>
  <text class="small" x="90" y="90" text-anchor="middle">MDC tracing</text>
</g>

<!-- TaskController -->
<g transform="translate(264,124)">
  <rect class="card" x="0" y="0" width="180" height="96" rx="12" fill="#EAF7EF" stroke="#58A978"/>
  <text class="smallLabel" x="90" y="30" text-anchor="middle">Task</text>
  <text class="smallLabel" x="90" y="54" text-anchor="middle">Controller</text>
  <text class="small" x="90" y="76" text-anchor="middle">GET/POST /tasks</text>
  <text class="mono" x="90" y="92" text-anchor="middle">@RestController</text>
</g>

<!-- Resilience4jController -->
<g transform="translate(480,124)">
  <rect class="card" x="0" y="0" width="200" height="96" rx="12" fill="#EAF7EF" stroke="#58A978"/>
  <text class="smallLabel" x="100" y="30" text-anchor="middle">Resilience4j</text>
  <text class="smallLabel" x="100" y="54" text-anchor="middle">Controller</text>
  <text class="small" x="100" y="76" text-anchor="middle">+Resilience4jTrait</text>
  <text class="mono" x="100" y="92" text-anchor="middle">@RestController</text>
</g>

<!-- ExampleException source -->
<g transform="translate(718,124)">
  <rect class="card" x="0" y="0" width="178" height="96" rx="12" fill="#FDECEF" stroke="#DC6B82"/>
  <text class="smallLabel" x="89" y="28" text-anchor="middle">Example</text>
  <text class="smallLabel" x="89" y="52" text-anchor="middle">Exception</text>
  <text class="small" x="89" y="72" text-anchor="middle">runtime exception</text>
  <text class="small" x="89" y="88" text-anchor="middle">thrown by service</text>
</g>

<!-- ====== ROW 2: Exception types ====== -->

<!-- Row label -->
<text class="small" x="480" y="256" text-anchor="middle" letter-spacing="0.06em" font-size="11" fill="#758297">EXCEPTION TYPES</text>

<!-- InvalidTaskIdException -->
<g transform="translate(48,264)">
  <rect class="card" x="0" y="0" width="198" height="84" rx="12" fill="#FDECEF" stroke="#DC6B82"/>
  <text class="smallLabel" x="99" y="26" text-anchor="middle">InvalidTaskId</text>
  <text class="smallLabel" x="99" y="50" text-anchor="middle">Exception</text>
  <text class="mono" x="99" y="72" text-anchor="middle">HTTP 400 Bad Request</text>
</g>

<!-- TaskNotFoundException -->
<g transform="translate(270,264)">
  <rect class="card" x="0" y="0" width="190" height="84" rx="12" fill="#FDECEF" stroke="#DC6B82"/>
  <text class="smallLabel" x="95" y="26" text-anchor="middle">TaskNot</text>
  <text class="smallLabel" x="95" y="50" text-anchor="middle">FoundException</text>
  <text class="mono" x="95" y="72" text-anchor="middle">HTTP 404 Not Found</text>
</g>

<!-- BusinessException -->
<g transform="translate(484,264)">
  <rect class="card" x="0" y="0" width="190" height="84" rx="12" fill="#FDECEF" stroke="#DC6B82"/>
  <text class="smallLabel" x="95" y="26" text-anchor="middle">Business</text>
  <text class="smallLabel" x="95" y="50" text-anchor="middle">Exception</text>
  <text class="mono" x="95" y="72" text-anchor="middle">HTTP 422 Unprocessable</text>
</g>

<!-- AbstractThrowableProblem -->
<g transform="translate(698,264)">
  <rect class="card" x="0" y="0" width="198" height="84" rx="12" fill="#FFF3D9" stroke="#D6A441"/>
  <text class="smallLabel" x="99" y="28" text-anchor="middle">AbstractThrowable</text>
  <text class="smallLabel" x="99" y="52" text-anchor="middle">Problem</text>
  <text class="small" x="99" y="72" text-anchor="middle">zalando/problem base · RFC 9457</text>
</g>

<!-- ====== ROW 3: Exception Handler + Traits ====== -->

<!-- Row label -->
<text class="small" x="480" y="390" text-anchor="middle" letter-spacing="0.06em" font-size="11" fill="#758297">EXCEPTION HANDLING</text>

<!-- RestApiExceptionHandler -->
<g transform="translate(48,398)">
  <rect class="card" x="0" y="0" width="280" height="88" rx="12" fill="#F1ECFF" stroke="#8A72D6"/>
  <text class="smallLabel" x="140" y="28" text-anchor="middle">RestApiException</text>
  <text class="smallLabel" x="140" y="52" text-anchor="middle">Handler</text>
  <text class="mono" x="140" y="72" text-anchor="middle">@ControllerAdvice · @ExceptionHandler</text>
  <text class="small" x="140" y="86" text-anchor="middle" fill="#8A72D6">TaskAdviceTrait</text>
</g>

<!-- Resilience4jTrait -->
<g transform="translate(358,398)">
  <rect class="card" x="0" y="0" width="180" height="88" rx="12" fill="#F1ECFF" stroke="#8A72D6"/>
  <text class="smallLabel" x="90" y="28" text-anchor="middle">Resilience4j</text>
  <text class="smallLabel" x="90" y="52" text-anchor="middle">Trait</text>
  <text class="small" x="90" y="72" text-anchor="middle">mixin interface</text>
  <text class="small" x="90" y="86" text-anchor="middle">Kotlin delegation</text>
</g>

<!-- TaskAdviceTrait -->
<g transform="translate(562,398)">
  <rect class="card" x="0" y="0" width="180" height="88" rx="12" fill="#F1ECFF" stroke="#8A72D6"/>
  <text class="smallLabel" x="90" y="28" text-anchor="middle">TaskAdvice</text>
  <text class="smallLabel" x="90" y="52" text-anchor="middle">Trait</text>
  <text class="small" x="90" y="72" text-anchor="middle">mixin interface</text>
  <text class="small" x="90" y="86" text-anchor="middle">Kotlin delegation</text>
</g>

<!-- ProblemResponse -->
<g transform="translate(766,398)">
  <rect class="card" x="0" y="0" width="130" height="88" rx="12" fill="#E9F7F6" stroke="#45A7A1"/>
  <text class="smallLabel" x="65" y="28" text-anchor="middle">Problem</text>
  <text class="smallLabel" x="65" y="52" text-anchor="middle">Response</text>
  <text class="mono" x="65" y="70" text-anchor="middle">application/</text>
  <text class="mono" x="65" y="84" text-anchor="middle">problem+json</text>
</g>

<!-- ====== ARROWS ====== -->

<!-- Row 1: REST controller throws exceptions → row 2 exception types -->
<!-- Controllers bottom y=220; row 2 top y=264; bus at y=242 -->
<path class="line" d="M354,220 L354,242 L147,242 L147,264"/>
<path class="line" d="M580,220 L580,242 L365,242 L365,264"/>
<path class="line" d="M807,220 L807,242 L579,242 L579,264"/>

<!-- ExampleException → AbstractThrowable link (same row horizontal) -->
<path class="line" d="M807,172 L807,200 L897,200 L897,220"/>

<!-- Row 2 → Row 3: exception types caught by handler (bus at y=366) -->
<path class="line" d="M147,348 L147,366 L188,366 L188,398"/>
<path class="line" d="M365,348 L365,366 L188,366 L188,398"/>
<path class="line" d="M579,348 L579,366 L188,366 L188,398"/>
<path class="line" d="M797,348 L797,366 L188,366 L188,398"/>

<!-- Handler → Traits horizontal -->
<path class="line" d="M328,442 L358,442"/>
<path class="line" d="M538,442 L562,442"/>

<!-- Traits/Handler → Problem Response -->
<path class="line" d="M742,442 L766,442"/>

<!-- ====== Footer band (teal) ====== -->
<g transform="translate(36,520)">
  <rect x="0" y="0" width="888" height="52" rx="12" fill="#E9F7F6" stroke="#45A7A1" stroke-width="1.5"/>
  <text class="smallLabel" x="444" y="26" text-anchor="middle">Every exception maps to RFC 9457 Problem Details JSON response</text>
  <text class="small" x="444" y="46" text-anchor="middle">Resilience4jTrait + TaskAdviceTrait mixed into RestApiExceptionHandler via Kotlin interface delegation</text>
</g>
</svg>
