<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1378 580" width="1378" height="580">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="2" dy="4" stdDeviation="5" flood-color="#1f2937" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <polygon points="1,1 8,4.5 1,8" fill="#6b7280"/>
    </marker>
    <marker id="arrow-red" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <polygon points="1,1 8,4.5 1,8" fill="#ef4444"/>
    </marker>
    <marker id="arrow-purple" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <polygon points="1,1 8,4.5 1,8" fill="#7c3aed"/>
    </marker>
    <marker id="arrow-green" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <polygon points="1,1 8,4.5 1,8" fill="#059669"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1378" height="580" fill="#f6f9fc"/>
  <rect x="20" y="20" width="1338" height="540" rx="16" fill="#fff" stroke="#d7e2ec" stroke-width="1.5"/>

  <!-- Title -->
  <text x="48" y="56" font-family="'Architects Daughter', cursive" font-size="28" fill="#1e293b">Problem Details — Error Handling Architecture</text>
  <text x="48" y="76" font-family="'Comic Sans MS', cursive" font-size="13" fill="#536476">zalando/problem · RFC 9457 Problem Details · @ControllerAdvice exception handling</text>

  <!-- ── Zone 1: Request / Controller Layer ── -->
  <rect x="36" y="96" width="340" height="360" rx="12" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.2"/>
  <text x="206" y="93" font-family="'Architects Daughter', cursive" font-size="11" fill="#94a3b8" text-anchor="middle" letter-spacing="0.08em">REQUEST LAYER</text>

  <!-- RestController + LoggingFilter -->
  <rect x="56" y="106" width="300" height="80" rx="12" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="206" y="132" font-family="'Architects Daughter', cursive" font-size="16" fill="#1e3a5f" text-anchor="middle">RestController</text>
  <text x="206" y="152" font-family="'Comic Sans MS', cursive" font-size="12" fill="#536476" text-anchor="middle">LoggingFilter</text>
  <rect x="136" y="163" width="140" height="17" rx="8" fill="#3b82f6"/>
  <text x="206" y="175" font-family="'Comic Sans MS', cursive" font-size="10" fill="#fff" text-anchor="middle">request/response log</text>

  <!-- TaskController -->
  <rect x="56" y="210" width="300" height="70" rx="12" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="206" y="240" font-family="'Architects Daughter', cursive" font-size="16" fill="#0c4a6e" text-anchor="middle">TaskController</text>
  <text x="206" y="260" font-family="'Comic Sans MS', cursive" font-size="12" fill="#536476" text-anchor="middle">GET/POST /tasks</text>
  <rect x="136" y="269" width="140" height="17" rx="8" fill="#0284c7"/>
  <text x="206" y="281" font-family="'Comic Sans MS', cursive" font-size="10" fill="#fff" text-anchor="middle">@RestController</text>

  <!-- Resilience4jController -->
  <rect x="56" y="308" width="300" height="70" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="206" y="335" font-family="'Architects Daughter', cursive" font-size="15" fill="#3b0764" text-anchor="middle">Resilience4j</text>
  <text x="206" y="353" font-family="'Architects Daughter', cursive" font-size="15" fill="#3b0764" text-anchor="middle">Controller</text>
  <rect x="146" y="363" width="120" height="17" rx="8" fill="#7c3aed"/>
  <text x="206" y="375" font-family="'Comic Sans MS', cursive" font-size="10" fill="#fff" text-anchor="middle">+Resilience4jTrait</text>

  <!-- ExampleException -->
  <rect x="56" y="406" width="300" height="40" rx="10" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.2"/>
  <text x="206" y="431" font-family="'Comic Sans MS', cursive" font-size="13" fill="#991b1b" text-anchor="middle">ExampleException</text>

  <!-- ── Zone 2: Exception Types ── -->
  <rect x="396" y="96" width="310" height="360" rx="12" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.2"/>
  <text x="551" y="93" font-family="'Architects Daughter', cursive" font-size="11" fill="#94a3b8" text-anchor="middle" letter-spacing="0.08em">EXCEPTION TYPES</text>

  <!-- InvalidTaskIdException -->
  <rect x="416" y="106" width="270" height="64" rx="12" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="551" y="130" font-family="'Architects Daughter', cursive" font-size="14" fill="#7f1d1d" text-anchor="middle">InvalidTaskId</text>
  <text x="551" y="148" font-family="'Architects Daughter', cursive" font-size="14" fill="#7f1d1d" text-anchor="middle">Exception</text>
  <rect x="481" y="157" width="140" height="16" rx="8" fill="#ef4444"/>
  <text x="551" y="169" font-family="'Comic Sans MS', cursive" font-size="10" fill="#fff" text-anchor="middle">HTTP 400 Bad Request</text>

  <!-- TaskNotFoundException -->
  <rect x="416" y="196" width="270" height="64" rx="12" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="551" y="220" font-family="'Architects Daughter', cursive" font-size="14" fill="#7f1d1d" text-anchor="middle">TaskNot</text>
  <text x="551" y="238" font-family="'Architects Daughter', cursive" font-size="14" fill="#7f1d1d" text-anchor="middle">FoundException</text>
  <rect x="481" y="247" width="140" height="16" rx="8" fill="#ef4444"/>
  <text x="551" y="259" font-family="'Comic Sans MS', cursive" font-size="10" fill="#fff" text-anchor="middle">HTTP 404 Not Found</text>

  <!-- BusinessException -->
  <rect x="416" y="286" width="270" height="64" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="551" y="310" font-family="'Architects Daughter', cursive" font-size="14" fill="#7f1d1d" text-anchor="middle">Business</text>
  <text x="551" y="328" font-family="'Architects Daughter', cursive" font-size="14" fill="#7f1d1d" text-anchor="middle">Exception</text>
  <rect x="481" y="337" width="140" height="16" rx="8" fill="#dc2626"/>
  <text x="551" y="349" font-family="'Comic Sans MS', cursive" font-size="10" fill="#fff" text-anchor="middle">HTTP 422 Unprocessable</text>

  <!-- Problem base -->
  <rect x="416" y="378" width="270" height="64" rx="12" fill="#fff7ed" stroke="#d97706" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="551" y="404" font-family="'Architects Daughter', cursive" font-size="15" fill="#92400e" text-anchor="middle">AbstractThrowable</text>
  <text x="551" y="422" font-family="'Comic Sans MS', cursive" font-size="12" fill="#536476" text-anchor="middle">zalando/problem base</text>
  <rect x="491" y="430" width="120" height="16" rx="8" fill="#d97706"/>
  <text x="551" y="442" font-family="'Comic Sans MS', cursive" font-size="10" fill="#fff" text-anchor="middle">RFC 9457 compatible</text>

  <!-- ── Zone 3: Handler + Response ── -->
  <rect x="726" y="96" width="628" height="360" rx="12" fill="#f0fdf4" stroke="#86efac" stroke-width="1.2"/>
  <text x="1040" y="93" font-family="'Architects Daughter', cursive" font-size="11" fill="#94a3b8" text-anchor="middle" letter-spacing="0.08em">EXCEPTION HANDLING + RESPONSE</text>

  <!-- RestApiExceptionHandler -->
  <rect x="746" y="106" width="580" height="90" rx="12" fill="#d1fae5" stroke="#059669" stroke-width="1.8" filter="url(#shadow)"/>
  <text x="1036" y="138" font-family="'Architects Daughter', cursive" font-size="18" fill="#064e3b" text-anchor="middle">RestApiExceptionHandler</text>
  <text x="1036" y="160" font-family="'Comic Sans MS', cursive" font-size="12" fill="#536476" text-anchor="middle">@ControllerAdvice · @ExceptionHandler</text>
  <rect x="886" y="170" width="120" height="18" rx="9" fill="#059669"/>
  <text x="946" y="183" font-family="'Comic Sans MS', cursive" font-size="10" fill="#fff" text-anchor="middle">TaskAdviceTrait</text>

  <!-- Traits section -->
  <rect x="746" y="218" width="280" height="70" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="886" y="246" font-family="'Architects Daughter', cursive" font-size="16" fill="#3b0764" text-anchor="middle">Resilience4j</text>
  <text x="886" y="264" font-family="'Architects Daughter', cursive" font-size="16" fill="#3b0764" text-anchor="middle">Trait</text>
  <text x="886" y="282" font-family="'Comic Sans MS', cursive" font-size="11" fill="#7c3aed" text-anchor="middle">mixin interface</text>

  <!-- TaskAdviceTrait -->
  <rect x="1046" y="218" width="280" height="70" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="1186" y="250" font-family="'Architects Daughter', cursive" font-size="16" fill="#3b0764" text-anchor="middle">TaskAdvice</text>
  <text x="1186" y="268" font-family="'Architects Daughter', cursive" font-size="16" fill="#3b0764" text-anchor="middle">Trait</text>
  <text x="1186" y="286" font-family="'Comic Sans MS', cursive" font-size="11" fill="#7c3aed" text-anchor="middle">mixin interface</text>

  <!-- ProblemResponse -->
  <rect x="746" y="316" width="580" height="112" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="1.8" filter="url(#shadow)"/>
  <text x="1036" y="348" font-family="'Architects Daughter', cursive" font-size="18" fill="#064e3b" text-anchor="middle">ProblemResponse</text>
  <text x="1036" y="370" font-family="'Comic Sans MS', cursive" font-size="12" fill="#536476" text-anchor="middle">HTTP/1.1 4xx/5xx  Content-Type: application/problem+json</text>
  <text x="1036" y="392" font-family="'Comic Sans MS', cursive" font-size="12" fill="#374151" text-anchor="middle">{ "type": "...", "title": "...", "status": 404,</text>
  <text x="1036" y="412" font-family="'Comic Sans MS', cursive" font-size="12" fill="#374151" text-anchor="middle">  "detail": "Task not found", "instance": "..." }</text>

  <!-- ── Arrows ── -->
  <!-- Controller → Exception types (throws) -->
  <line x1="356" y1="245" x2="416" y2="228" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow-red)"/>
  <line x1="356" y1="343" x2="416" y2="318" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow-red)"/>
  <line x1="356" y1="143" x2="416" y2="135" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow-red)"/>
  <text x="385" y="176" font-family="'Comic Sans MS', cursive" font-size="10" fill="#ef4444">throws</text>

  <!-- Exception types → Handler -->
  <line x1="686" y1="220" x2="746" y2="165" stroke="#ef4444" stroke-width="1.5" marker-end="url(#arrow-red)"/>
  <line x1="686" y1="318" x2="746" y2="175" stroke="#ef4444" stroke-width="1.5" marker-end="url(#arrow-red)"/>
  <text x="714" y="246" font-family="'Comic Sans MS', cursive" font-size="10" fill="#ef4444">catches</text>

  <!-- Handler → ProblemResponse -->
  <line x1="1036" y1="196" x2="1036" y2="316" stroke="#059669" stroke-width="1.8" marker-end="url(#arrow-green)"/>
  <text x="1058" y="262" font-family="'Comic Sans MS', cursive" font-size="11" fill="#059669">returns</text>

  <!-- ── Footer ── -->
  <rect x="36" y="476" width="1306" height="50" rx="10" fill="#f0fdf4" stroke="#86efac" stroke-width="1.2"/>
  <text x="689" y="497" font-family="'Architects Daughter', cursive" font-size="14" fill="#166534" text-anchor="middle">Every exception maps to RFC 9457 Problem Details JSON response</text>
  <text x="689" y="515" font-family="'Comic Sans MS', cursive" font-size="12" fill="#536476" text-anchor="middle">Resilience4jTrait + TaskAdviceTrait mixed into RestApiExceptionHandler via Kotlin interface delegation</text>
</svg>
