<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-label="Docker Compose Gradle Plugin Demo">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#1f2937" flood-opacity="0.10"/></filter>
  <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth">
    <path d="M1,1 L8,4.5 L1,8 Z" fill="#758297"/>
  </marker>
  <style>
    .canvas{fill:#f7f9fc}.frame{fill:#fff;stroke:#d8e0ea;stroke-width:1.5}
    .title{font-family:"Architects Daughter";font-size:40px;font-weight:400;fill:#102033}
    .subtitle{font-family:"Comic Mono";font-size:14px;font-weight:400;fill:#536273}
    .label{font-family:"Architects Daughter";font-size:25px;font-weight:400;fill:#102033}
    .smallLabel{font-family:"Architects Daughter";font-size:21px;font-weight:400;fill:#102033}
    .mono{font-family:"Comic Mono";font-size:12px;font-weight:400;fill:#102033}
    .small{font-family:"Comic Mono";font-size:12px;font-weight:400;fill:#536273}
    .card{stroke-width:2.1;filter:url(#shadow)}
    .line{stroke:#758297;stroke-width:2.1;fill:none;marker-end:url(#arrow)}
    .dashed{stroke:#758297;stroke-width:2.1;stroke-dasharray:7 6;fill:none;marker-end:url(#arrow)}
  </style>
</defs>
<rect class="canvas" width="960" height="560"/>
<rect class="frame" x="24" y="20" width="912" height="516" rx="28"/>
<text class="title" x="58" y="68">Docker Compose Plugin Demo</text>
<text class="subtitle" x="58" y="96">avast/gradle-docker-compose-plugin · docker-compose.yml · System Property injection</text>

<!-- Arrows first -->
<!-- ./gradlew test → docker-compose-plugin (triggers, routes left) -->
<path class="line" d="M480 170 L480 195 L250 195 L250 220"/>
<!-- docker-compose-plugin reads YAML config (dashed, horizontal) -->
<path class="dashed" d="M440 247 L520 247"/>
<!-- docker-compose-plugin → Redis service (straight) -->
<path class="line" d="M250 274 L250 324"/>
<!-- docker-compose-plugin → PostgreSQL service (routes right) -->
<path class="line" d="M250 274 L250 299 L710 299 L710 324"/>
<!-- Redis service → DockerComposePluginTest (routes right via sys prop) -->
<path class="line" d="M250 388 L250 413 L456 413 L456 438"/>
<!-- PostgreSQL service → DockerComposePluginTest (routes left via sys prop) -->
<path class="line" d="M710 388 L710 413 L504 413 L504 438"/>

<!-- Gradle test task -->
<g transform="translate(278,116)">
  <rect class="card" x="0" y="0" width="404" height="54" rx="12" fill="#E8F3FF" stroke="#5B8DEF"/>
  <text class="smallLabel" x="202" y="22" text-anchor="middle">./gradlew test</text>
  <text class="small" x="202" y="42" text-anchor="middle">Gradle task — triggers plugin lifecycle</text>
</g>

<!-- docker-compose-plugin -->
<g transform="translate(60,220)">
  <rect class="card" x="0" y="0" width="380" height="54" rx="12" fill="#EAF7EF" stroke="#58A978"/>
  <text class="smallLabel" x="190" y="22" text-anchor="middle">docker-compose-plugin</text>
  <text class="small" x="190" y="42" text-anchor="middle">avast/gradle-docker-compose-plugin</text>
</g>

<!-- YAML config files -->
<g transform="translate(520,220)">
  <rect class="card" x="0" y="0" width="380" height="54" rx="12" fill="#FFF3D9" stroke="#D6A441"/>
  <text class="smallLabel" x="190" y="22" text-anchor="middle">YAML Config Files</text>
  <text class="small" x="190" y="42" text-anchor="middle">docker-compose.yml · docker-compose-postgres.yml</text>
</g>

<!-- Redis service -->
<g transform="translate(60,324)">
  <rect class="card" x="0" y="0" width="380" height="64" rx="12" fill="#FDECEF" stroke="#DC6B82"/>
  <text class="smallLabel" x="190" y="22" text-anchor="middle">Redis 7</text>
  <text class="small" x="190" y="44" text-anchor="middle">redis:7 · port 6379 · hostname: redis</text>
</g>

<!-- PostgreSQL service -->
<g transform="translate(520,324)">
  <rect class="card" x="0" y="0" width="380" height="64" rx="12" fill="#F1ECFF" stroke="#8A72D6"/>
  <text class="smallLabel" x="190" y="22" text-anchor="middle">PostgreSQL 18</text>
  <text class="small" x="190" y="44" text-anchor="middle">postgres:18-alpine · port 5432</text>
</g>

<!-- DockerComposePluginTest -->
<g transform="translate(278,438)">
  <rect class="card" x="0" y="0" width="404" height="54" rx="12" fill="#E9F7F6" stroke="#45A7A1"/>
  <text class="smallLabel" x="202" y="22" text-anchor="middle">DockerComposePluginTest</text>
  <text class="small" x="202" y="42" text-anchor="middle">reads redis.url via System.getProperty()</text>
</g>

<!-- sys-prop label on arrows -->
<text class="small" x="340" y="409" text-anchor="middle">sys props</text>
</svg>
