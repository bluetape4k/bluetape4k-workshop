<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1080" viewBox="0 0 1600 1080">
  <defs>
    <style>.bg{fill:#f8fafc}.frame{fill:#fff;stroke:#cbd5e1;stroke-width:1.5}.title{font:34px 'Architects Daughter','Comic Sans MS',cursive;fill:#18212f}.subtitle{font:16px 'Comic Mono','Courier New',monospace;fill:#64748b}.header{fill:#eff6ff;stroke:#93c5fd;stroke-width:1.5}.participant{font:19px 'Architects Daughter','Comic Sans MS',cursive;fill:#172033}.role{font:12px 'Comic Mono','Courier New',monospace;fill:#64748b}.lifeline{stroke:#94a3b8;stroke-width:1.5;stroke-dasharray:7 7}.activation{fill:#ffedd5;stroke:#fb923c}.call{fill:none;stroke:#b45309;stroke-width:2.5}.refund{fill:none;stroke:#7c3aed;stroke-width:2.5}.return{fill:none;stroke:#059669;stroke-width:2.5;stroke-dasharray:7 5}.label{fill:#fff;stroke:#cbd5e1}.labelText{font:13px 'Comic Mono','Courier New',monospace;fill:#334155}.num{font:bold 13px 'Comic Mono','Courier New',monospace;fill:#fff}.badge{fill:#b45309}.refundBadge{fill:#7c3aed}.safeBadge{fill:#059669}</style>
    <marker id="seqArrow" markerWidth="16" markerHeight="16" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 10 10" data-role="sequence" data-tip-direction="positive-x"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#b45309" stroke="#b45309" stroke-dasharray="none" style="stroke-dasharray:none"/></marker>
    <marker id="seqRefund" markerWidth="16" markerHeight="16" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 10 10" data-role="sequence" data-tip-direction="positive-x"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#7c3aed" stroke="#7c3aed" stroke-dasharray="none" style="stroke-dasharray:none"/></marker>
    <marker id="seqReturn" markerWidth="16" markerHeight="16" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 10 10" data-role="sequence" data-tip-direction="positive-x"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#059669" stroke="#059669" stroke-dasharray="none" style="stroke-dasharray:none"/></marker>
  </defs>
  <rect class="bg" width="1600" height="1080"/><rect class="frame" x="45" y="35" width="1510" height="995" rx="24"/>
  <text class="title" x="80" y="88">Timeout, Late Approval, Refund, and Safe Restock</text>
  <text class="subtitle" x="82" y="116">A timeout is unknown — reconciliation discovers truth before refund and inventory recovery.</text>
  <rect class="header" x="80" y="155" width="240" height="82" rx="16"/><text class="participant" x="143" y="190">Purchase</text><text class="role" x="112" y="216">durable attempt</text>
  <rect class="header" x="380" y="155" width="240" height="82" rx="16"/><text class="participant" x="444" y="190">Payment PG</text><text class="role" x="416" y="216">operation lookup</text>
  <rect class="header" x="680" y="155" width="240" height="82" rx="16"/><text class="participant" x="750" y="190">Operator</text><text class="role" x="713" y="216">bounded reconcile</text>
  <rect class="header" x="980" y="155" width="240" height="82" rx="16"/><text class="participant" x="1050" y="190">Refund</text><text class="role" x="1017" y="216">stable operation</text>
  <rect class="header" x="1280" y="155" width="240" height="82" rx="16"/><text class="participant" x="1336" y="190">Inventory</text><text class="role" x="1315" y="216">restock gate</text>
  <line class="lifeline" x1="200" y1="237" x2="200" y2="970"/><line class="lifeline" x1="500" y1="237" x2="500" y2="970"/><line class="lifeline" x1="800" y1="237" x2="800" y2="970"/><line class="lifeline" x1="1100" y1="237" x2="1100" y2="970"/><line class="lifeline" x1="1400" y1="237" x2="1400" y2="970"/>
  <rect class="activation" x="492" y="300" width="16" height="190" rx="6"/><rect class="activation" x="792" y="470" width="16" height="220" rx="6"/><rect class="activation" x="1092" y="730" width="16" height="130" rx="6"/>
  <rect class="label labelPill" x="245" y="282" width="210" height="38" rx="19"/><circle class="badge" cx="268" cy="301" r="14"/><text class="num" x="264" y="306">1</text><text class="labelText" x="290" y="306">authorize(op-42)</text><path class="call" d="M200 335 H500" marker-end="url(#seqArrow)"/>
  <rect class="label labelPill" x="245" y="372" width="210" height="38" rx="19"/><circle class="badge" cx="268" cy="391" r="14"/><text class="num" x="264" y="396">2</text><text class="labelText" x="290" y="396">response is lost</text><path class="call" d="M500 425 H200" marker-end="url(#seqArrow)"/>
  <rect class="label labelPill" x="345" y="462" width="260" height="38" rx="19"/><circle class="badge" cx="368" cy="481" r="14"/><text class="num" x="364" y="486">3</text><text class="labelText" x="390" y="486">RECONCILIATION_REQUIRED</text><path class="call" d="M200 515 H800" marker-end="url(#seqArrow)"/>
  <rect class="label labelPill" x="545" y="552" width="210" height="38" rx="19"/><circle class="badge" cx="568" cy="571" r="14"/><text class="num" x="564" y="576">4</text><text class="labelText" x="590" y="576">lookup(op-42)</text><path class="call" d="M800 605 H500" marker-end="url(#seqArrow)"/>
  <rect class="label labelPill" x="345" y="642" width="310" height="38" rx="19"/><circle class="badge" cx="368" cy="661" r="14"/><text class="num" x="364" y="666">5</text><text class="labelText" x="390" y="666">APPROVED, ticket NEVER_ISSUED</text><path class="return" d="M500 695 H200" marker-end="url(#seqReturn)"/>
  <rect class="label labelPill" x="745" y="732" width="310" height="38" rx="19"/><circle class="refundBadge" cx="768" cy="751" r="14"/><text class="num" x="764" y="756">6</text><text class="labelText" x="790" y="756">refund(stable refund ID)</text><path class="refund" d="M200 785 H1100" marker-end="url(#seqRefund)"/>
  <rect class="label labelPill" x="1145" y="842" width="210" height="38" rx="19"/><circle class="safeBadge" cx="1168" cy="861" r="14"/><text class="num" x="1164" y="866">7</text><text class="labelText" x="1190" y="866">restock after success</text><path class="return" d="M1100 895 H1400" marker-end="url(#seqReturn)"/>
  <text class="subtitle" x="95" y="1000">The late approval path suppresses ticket issue; refund success is the only inventory-restock signal.</text>
</svg>
