<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="1120" viewBox="0 0 1680 1120" role="img" aria-labelledby="title desc">
  <title id="title">DDD Order Audit Sequence</title>
  <desc id="desc">Order approval persists state and publication rows, then after-commit listeners reserve fulfillment and write JaVers snapshots; failed publications can be replayed.</desc>
  <defs>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="124%"><feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#64748B" flood-opacity="0.14"/></filter>
    <style>
      .title{font-family:"Architects Daughter";font-size:42px;fill:#263238}.subtitle,.msg,.footer,.note{font-family:"Comic Mono";fill:#36464F}.subtitle{font-size:17px}.participant{font-family:"Architects Daughter";font-size:19px;fill:#1F3138}.role{font-family:"Comic Mono";font-size:12px;fill:#546A73}.msg{font-size:13px}.footer{font-size:14px;fill:#60727D}.frame{fill:#FBFCF8;stroke:#41545D;stroke-width:3}.header{fill:#FFFFFF;stroke:#546E7A;stroke-width:2}.lifeline{stroke:#9AAAB1;stroke-width:2;stroke-dasharray:7 8;stroke-linecap:round}.activation{fill:#EAF6EF;stroke:#6F9278;stroke-width:1.5}.call,.return{fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.command{stroke:#4F86C6;marker-end:url(#seq-blue)}.tx{stroke:#6E8F4F;marker-end:url(#seq-green)}.audit{stroke:#9B7D54;marker-end:url(#seq-amber)}.error{stroke:#B86868;marker-end:url(#seq-red)}.return{stroke:#2D948C;stroke-width:2.6;stroke-dasharray:8 6;marker-end:url(#seq-teal)}.label{fill:#FFFFFF;stroke:#D7E0E4;stroke-width:1.5}.blueLabel{stroke:#9CC2D1}.greenLabel{stroke:#B6C9A4}.amberLabel{stroke:#C8B38F}.redLabel{stroke:#D9ABAB}.tealLabel{stroke:#9DCBC6}.badge{stroke-width:1.8}.blueBadge{fill:#EAF4F8;stroke:#4F86C6}.greenBadge{fill:#EEF7F0;stroke:#6E8F4F}.amberBadge{fill:#FFF7E8;stroke:#9B7D54}.redBadge{fill:#FFF0F0;stroke:#B86868}.tealBadge{fill:#EBFAF8;stroke:#2D948C}.badgeText{font-family:"Comic Mono";font-size:12px;font-weight:700}.blueText{fill:#2F6F8E}.greenText{fill:#55783F}.amberText{fill:#7F6038}.redText{fill:#9D4F4F}.tealText{fill:#247C75}.alt{fill:none;stroke:#D08A39;stroke-width:2.2;stroke-dasharray:12 8}.divider{stroke:#D08A39;stroke-width:1.8;stroke-dasharray:9 7;opacity:.72}.branch{fill:#FFFFFF;stroke:#D08A39;stroke-width:1.6}.branchText{font-family:"Architects Daughter";font-size:18px;fill:#8A5A22}
    </style>
    <marker id="seq-blue" viewBox="0 0 10 10" markerWidth="16" markerHeight="16" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse" data-role="sequence" data-tip-direction="positive-x"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#4F86C6" stroke="#4F86C6" stroke-dasharray="none" style="stroke-dasharray:none" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="seq-green" viewBox="0 0 10 10" markerWidth="16" markerHeight="16" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse" data-role="sequence" data-tip-direction="positive-x"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#6E8F4F" stroke="#6E8F4F" stroke-dasharray="none" style="stroke-dasharray:none" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="seq-amber" viewBox="0 0 10 10" markerWidth="16" markerHeight="16" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse" data-role="sequence" data-tip-direction="positive-x"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#9B7D54" stroke="#9B7D54" stroke-dasharray="none" style="stroke-dasharray:none" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="seq-red" viewBox="0 0 10 10" markerWidth="16" markerHeight="16" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse" data-role="sequence" data-tip-direction="positive-x"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#B86868" stroke="#B86868" stroke-dasharray="none" style="stroke-dasharray:none" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="seq-teal" viewBox="0 0 10 10" markerWidth="16" markerHeight="16" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse" data-role="sequence" data-tip-direction="positive-x"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#2D948C" stroke="#2D948C" stroke-dasharray="none" style="stroke-dasharray:none" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>
  <rect x="24" y="24" width="1632" height="1072" rx="20" class="frame"/>
  <text x="840" y="76" text-anchor="middle" class="title">DDD Order Audit Sequence</text>
  <text x="840" y="108" text-anchor="middle" class="subtitle">Publication rows commit with order state; fulfillment and JaVers run after commit and can be replayed safely.</text>

  <g filter="url(#shadow)"><rect x="55" y="154" width="250" height="74" rx="10" class="header"/><text x="180" y="184" text-anchor="middle" class="participant">Client / Test</text><text x="180" y="208" text-anchor="middle" class="role">command caller</text></g>
  <g filter="url(#shadow)"><rect x="375" y="154" width="250" height="74" rx="10" class="header"/><text x="500" y="184" text-anchor="middle" class="participant">OrderCommandService</text><text x="500" y="208" text-anchor="middle" class="role">transaction boundary</text></g>
  <g filter="url(#shadow)"><rect x="695" y="154" width="250" height="74" rx="10" class="header"/><text x="820" y="184" text-anchor="middle" class="participant">PostgreSQL</text><text x="820" y="208" text-anchor="middle" class="role">orders + publications</text></g>
  <g filter="url(#shadow)"><rect x="1015" y="154" width="250" height="74" rx="10" class="header"/><text x="1140" y="184" text-anchor="middle" class="participant">FulfillmentHandler</text><text x="1140" y="208" text-anchor="middle" class="role">after-commit listener</text></g>
  <g filter="url(#shadow)"><rect x="1335" y="154" width="250" height="74" rx="10" class="header"/><text x="1460" y="184" text-anchor="middle" class="participant">JaVers Audit</text><text x="1460" y="208" text-anchor="middle" class="role">in-memory history</text></g>

  <line x1="180" y1="228" x2="180" y2="1005" class="lifeline"/>
  <line x1="500" y1="228" x2="500" y2="1005" class="lifeline"/>
  <line x1="820" y1="228" x2="820" y2="1005" class="lifeline"/>
  <line x1="1140" y1="228" x2="1140" y2="1005" class="lifeline"/>
  <line x1="1460" y1="228" x2="1460" y2="1005" class="lifeline"/>
  <rect class="activation" x="492" y="300" width="16" height="360" rx="6"/>
  <rect class="activation" x="812" y="380" width="16" height="156" rx="6"/>
  <rect class="activation" x="1132" y="580" width="16" height="235" rx="6"/>
  <rect class="activation" x="1452" y="650" width="16" height="92" rx="6"/>

  <rect x="242" y="282" width="260.0" height="34" rx="17" class="label labelPill blueLabel"/><circle cx="266" cy="299" r="13" class="badge blueBadge"/><text x="266" y="304" text-anchor="middle" class="badgeText num blueText">1</text><text x="290" y="304" class="msg blueText">approve(orderId)</text><path data-connector="seq-1" d="M 180 324 L 500 324" class="call command"/>
  <rect x="548" y="362" width="260.0" height="34" rx="17" class="label labelPill greenLabel"/><circle cx="572" cy="379" r="13" class="badge greenBadge"/><text x="572" y="384" text-anchor="middle" class="badgeText num greenText">2</text><text x="596" y="384" class="msg greenText">save order row</text><path data-connector="seq-2" d="M 500 404 L 820 404" class="call tx"/>
  <rect x="528" y="444" width="275.2" height="34" rx="17" class="label labelPill greenLabel"/><circle cx="552" cy="461" r="13" class="badge greenBadge"/><text x="552" y="466" text-anchor="middle" class="badgeText num greenText">3</text><text x="576" y="466" class="msg greenText">register publication row</text><path data-connector="seq-3" d="M 500 486 L 820 486" class="call tx"/>
  <rect x="570" y="506" width="260.0" height="34" rx="17" class="label labelPill tealLabel"/><circle cx="594" cy="523" r="13" class="badge tealBadge"/><text x="594" y="528" text-anchor="middle" class="badgeText num tealText">4</text><text x="618" y="528" class="msg tealText">transaction commit</text><path data-connector="seq-4" d="M 820 548 L 500 548" class="return reverse"/>
  <rect x="866" y="562" width="260.0" height="34" rx="17" class="label labelPill greenLabel"/><circle cx="890" cy="579" r="13" class="badge greenBadge"/><text x="890" y="584" text-anchor="middle" class="badgeText num greenText">5</text><text x="914" y="584" class="msg greenText">deliver OrderApproved</text><path data-connector="seq-5" d="M 820 604 L 1140 604" class="call tx"/>
  <rect x="880" y="642" width="260.0" height="34" rx="17" class="label labelPill amberLabel"/><circle cx="904" cy="659" r="13" class="badge amberBadge"/><text x="904" y="664" text-anchor="middle" class="badgeText num amberText">6</text><text x="928" y="664" class="msg amberText">insert reservation</text><path data-connector="seq-6" d="M 1140 684 L 820 684" class="call audit reverse"/>
  <rect x="730" y="712" width="301.6" height="34" rx="17" class="label labelPill amberLabel"/><circle cx="754" cy="729" r="13" class="badge amberBadge"/><text x="754" y="734" text-anchor="middle" class="badgeText num amberText">7</text><text x="778" y="734" class="msg amberText">afterCommit JaVers snapshot</text><path data-connector="seq-7" d="M 500 754 L 1460 754" class="call audit"/>
  <rect x="842" y="792" width="260.0" height="34" rx="17" class="label labelPill tealLabel"/><circle cx="866" cy="809" r="13" class="badge tealBadge"/><text x="866" y="814" text-anchor="middle" class="badgeText num tealText">8</text><text x="890" y="814" class="msg tealText">history + diff query</text><path data-connector="seq-8" d="M 1460 834 L 500 834" class="return reverse"/>

  <rect x="82" y="835" width="1516" height="200" rx="16" class="alt"/>
  <rect x="116" y="819" width="168" height="32" rx="16" class="branch"/>
  <text x="200" y="841" text-anchor="middle" class="branchText">failure replay</text>
  <line x1="82" y1="935" x2="1598" y2="935" class="divider"/>
  <rect x="912" y="854" width="260.0" height="34" rx="17" class="label labelPill redLabel"/><circle cx="936" cy="871" r="13" class="badge redBadge"/><text x="936" y="876" text-anchor="middle" class="badgeText num redText">9</text><text x="960" y="876" class="msg redText">mark FAILED</text><path data-connector="seq-9" d="M 1140 900 L 820 900" class="call error reverse"/>
  <rect x="324" y="914" width="301.6" height="34" rx="17" class="label labelPill redLabel"/><circle cx="348" cy="931" r="13" class="badge redBadge"/><text x="348" y="936" text-anchor="middle" class="badgeText num redText">10</text><text x="372" y="936" class="msg redText">resubmit failed publication</text><path data-connector="seq-10" d="M 180 960 L 820 960" class="call error"/>
  <rect x="830" y="964" width="389.6" height="34" rx="17" class="label labelPill greenLabel"/><circle cx="854" cy="981" r="13" class="badge greenBadge"/><text x="854" y="986" text-anchor="middle" class="badgeText num greenText">11</text><text x="878" y="986" class="msg greenText">deliver again; idempotent reservation</text><path data-connector="seq-11" d="M 820 1010 L 1140 1010" class="call tx"/>

  <rect x="96" y="1042" width="1488" height="34" rx="12" fill="#FFFFFF" stroke="#CCD7DA" stroke-width="2"/>
  <text x="840" y="1065" text-anchor="middle" class="footer">Reader contract: labels stay above their lines; replay uses the same orderId and cannot create duplicate reservations.</text>
</svg>
