<svg xmlns="http://www.w3.org/2000/svg" width="960" height="500" viewBox="0 0 960 500" role="img" aria-label="Quarkus REST Coroutine Sequence">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#1f2937" flood-opacity="0.09"/></filter>
  <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth">
    <path d="M1,1 L8,4.5 L1,8 Z" fill="#758297"/>
  </marker>
  <style>
    .canvas{fill:#f7f9fc}.frame{fill:#fff;stroke:#d8e0ea;stroke-width:1.5}
    .title{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:38px;font-weight:400;fill:#102033}
    .subtitle{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:14px;font-weight:400;fill:#536273}
    .smallLabel{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:21px;font-weight:400;fill:#102033}
    .mono{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#102033}
    .small{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#536273}
    .card{stroke-width:2.1;filter:url(#shadow)}
    .line{stroke:#758297;stroke-width:2.1;fill:none;marker-end:url(#arrow)}
    .lifeline{stroke:#b0bbca;stroke-width:1.5;stroke-dasharray:6 4;fill:none}
    .reqArrow{stroke:#5B8DEF;stroke-width:2.1;fill:none;marker-end:url(#arrow)}
    .rspArrow{stroke:#45A7A1;stroke-width:2.1;stroke-dasharray:7 4;fill:none;marker-end:url(#arrow)}
    .msgLabel{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:13px;fill:#102033}
  </style>
</defs>
<rect class="canvas" width="960" height="500"/>
<rect class="frame" x="24" y="20" width="912" height="456" rx="20"/>

<!-- Title -->
<text class="title" x="48" y="66">Quarkus REST + Coroutines Sequence</text>
<text class="subtitle" x="48" y="90">RESTEasy Reactive · suspend fun · withContext(IO) · Coroutine dispatcher</text>

<!-- Participants: Client=110, CoroutineResource=310, Service=530, Database=770 -->
<rect class="card" x="26" y="108" width="168" height="56" rx="12" fill="#E8F3FF" stroke="#5B8DEF"/>
<text class="smallLabel" x="110" y="139" text-anchor="middle">Client</text>

<rect class="card" x="226" y="108" width="168" height="56" rx="12" fill="#EAF7EF" stroke="#58A978"/>
<text class="smallLabel" x="310" y="132" text-anchor="middle">Coroutine</text>
<text class="small" x="310" y="151" text-anchor="middle">Resource</text>

<rect class="card" x="446" y="108" width="168" height="56" rx="12" fill="#FFF3D9" stroke="#D6A441"/>
<text class="smallLabel" x="530" y="132" text-anchor="middle">Service</text>
<text class="small" x="530" y="151" text-anchor="middle">suspend fun</text>

<rect class="card" x="686" y="108" width="168" height="56" rx="12" fill="#FDECEF" stroke="#DC6B82"/>
<text class="smallLabel" x="770" y="132" text-anchor="middle">Database</text>
<text class="small" x="770" y="151" text-anchor="middle">Reactive driver</text>

<!-- Lifelines -->
<line class="lifeline" x1="110" y1="164" x2="110" y2="490"/>
<line class="lifeline" x1="310" y1="164" x2="310" y2="490"/>
<line class="lifeline" x1="530" y1="164" x2="530" y2="490"/>
<line class="lifeline" x1="770" y1="164" x2="770" y2="490"/>

<!-- Messages -->
<!-- 1: GET /resource/{id} -->
<text class="msgLabel" x="113" y="202" fill="#5B8DEF">① GET /resource/{id}</text>
<path class="reqArrow" d="M110 212 L310 212"/>

<!-- 2: suspend fun get(id) -->
<text class="msgLabel" x="313" y="242" fill="#5B8DEF">② suspend fun get(id)</text>
<path class="reqArrow" d="M310 252 L530 252"/>

<!-- 3: withContext(IO) → query -->
<text class="msgLabel" x="533" y="282" fill="#5B8DEF">③ withContext(Dispatchers.IO) → query</text>
<path class="reqArrow" d="M530 292 L770 292"/>

<!-- 4: result row -->
<text class="msgLabel" x="533" y="332" fill="#45A7A1">④ ResultSet / entity row</text>
<path class="rspArrow" d="M770 342 L530 342"/>

<!-- 4b: suspend completes -->
<text class="msgLabel" x="313" y="372" fill="#45A7A1">⑤ suspend completes → dto</text>
<path class="rspArrow" d="M530 382 L310 382"/>

<!-- 5: 200 OK JSON -->
<text class="msgLabel" x="113" y="412" fill="#45A7A1">⑥ 200 OK with JSON response</text>
<path class="rspArrow" d="M310 422 L110 422"/>

<!-- Note: coroutine context -->
<rect x="36" y="448" width="886" height="32" rx="8" fill="#F1ECFF" opacity="0.7"/>
<text class="small" x="479" y="469" text-anchor="middle">Quarkus coroutine dispatcher switches threads transparently · no blocking · reactive I/O throughout</text>
</svg>
