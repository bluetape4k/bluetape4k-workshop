<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="939" viewBox="0 0 1180 939" role="img" aria-label="Quarkus REST + Coroutines Sequence">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#1f2937" flood-opacity="0.10"/></filter>
  <marker id="arrowBlue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L7 4 L1 7 Z" fill="#5b8def"/></marker>
  <marker id="arrowTeal" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L7 4 L1 7 Z" fill="#45a7a1"/></marker>
  <style>
    .canvas{fill:#f7f9fc}
    .frame{fill:#ffffff;stroke:#d8e0ea;stroke-width:1.5}
    .title{font-family:"Architects Daughter";font-size:34px;fill:#102033}
    .subtitle{font-family:"Comic Mono";font-size:13px;fill:#536273}
    .actor{font-family:"Architects Daughter";font-size:17px;fill:#102033}
    .message{font-family:"Comic Mono";font-size:12px;fill:#263445}
    .detail{font-family:"Comic Mono";font-size:11px;fill:#536273}
    .lifeline{stroke:#b8c4d3;stroke-width:1.4;stroke-dasharray:7 6}
    .call{stroke:#5b8def;stroke-width:2.15;fill:none;marker-end:url(#arrowBlue)}
    .return{stroke:#45a7a1;stroke-width:2.05;stroke-dasharray:7 5;fill:none;marker-end:url(#arrowTeal)}
    .box{stroke-width:1.8;filter:url(#shadow)}
  </style>
</defs>
<rect class="canvas" width="1180" height="939"/>
<rect class="frame" x="24" y="20" width="1132" height="899" rx="18"/>
<text class="title" x="48" y="58">Quarkus REST + Coroutines Sequence</text>
<text class="subtitle" x="50" y="84">RESTEasy Reactive  -  suspend fun  -  withContext(IO)  -  Coroutine dispatcher</text>
<rect class="box" x="40" y="108" width="220" height="58" rx="10" fill="#e8f3ff" stroke="#7aa0c4"/>
<text class="actor" x="150" y="137" text-anchor="middle" dominant-baseline="middle">Client</text>
<line class="lifeline" x1="150" y1="166" x2="150" y2="881"/>
<rect class="box" x="333.3333333333333" y="108" width="220" height="58" rx="10" fill="#eaf7ef" stroke="#7aa0c4"/>
<text class="actor" x="443.3333333333333" y="137" text-anchor="middle" dominant-baseline="middle">Coroutine Resource</text>
<line class="lifeline" x1="443.3333333333333" y1="166" x2="443.3333333333333" y2="881"/>
<rect class="box" x="626.6666666666666" y="108" width="220" height="58" rx="10" fill="#fff3d9" stroke="#7aa0c4"/>
<text class="actor" x="736.6666666666666" y="137" text-anchor="middle" dominant-baseline="middle">Service suspend fun</text>
<line class="lifeline" x1="736.6666666666666" y1="166" x2="736.6666666666666" y2="881"/>
<rect class="box" x="920" y="108" width="220" height="58" rx="10" fill="#f1ecff" stroke="#7aa0c4"/>
<text class="actor" x="1030" y="130" text-anchor="middle" dominant-baseline="middle">Database Reactive</text>
<text class="actor" x="1030" y="144" text-anchor="middle" dominant-baseline="middle">driver</text>
<line class="lifeline" x1="1030" y1="166" x2="1030" y2="881"/>
<path class="call" d="M150 205 L443.3333333333333 205"/>
<rect class="message-label" x="74.99999999999997" y="219" width="443.3333333333333" height="31" rx="7" fill="#ffffff" opacity="0.96" stroke="#dbe3ee"/>
<text class="message" x="296.66666666666663" y="234.5" text-anchor="middle" dominant-baseline="middle">1. GET /resource/{id}</text>
<path class="call" d="M443.3333333333333 313 L736.6666666666666 313"/>
<rect class="message-label" x="368.33333333333337" y="327" width="443.3333333333333" height="31" rx="7" fill="#ffffff" opacity="0.96" stroke="#dbe3ee"/>
<text class="message" x="590" y="342.5" text-anchor="middle" dominant-baseline="middle">2. suspend fun get(id)</text>
<path class="call" d="M736.6666666666666 421 L1030 421"/>
<rect class="message-label" x="661.6666666666665" y="435" width="443.33333333333337" height="31" rx="7" fill="#ffffff" opacity="0.96" stroke="#dbe3ee"/>
<text class="message" x="883.3333333333333" y="450.5" text-anchor="middle" dominant-baseline="middle">3. withContext(Dispatchers.IO) -> query</text>
<path class="return" d="M1030 529 L736.6666666666666 529"/>
<rect class="message-label" x="661.6666666666665" y="543" width="443.33333333333337" height="31" rx="7" fill="#ffffff" opacity="0.96" stroke="#dbe3ee"/>
<text class="message" x="883.3333333333333" y="558.5" text-anchor="middle" dominant-baseline="middle">4. ResultSet / entity row</text>
<path class="return" d="M736.6666666666666 637 L443.3333333333333 637"/>
<rect class="message-label" x="368.33333333333337" y="651" width="443.3333333333333" height="31" rx="7" fill="#ffffff" opacity="0.96" stroke="#dbe3ee"/>
<text class="message" x="590" y="666.5" text-anchor="middle" dominant-baseline="middle">5. suspend completes -> dto</text>
<path class="return" d="M443.3333333333333 745 L150 745"/>
<rect class="message-label" x="74.99999999999997" y="759" width="443.3333333333333" height="31" rx="7" fill="#ffffff" opacity="0.96" stroke="#dbe3ee"/>
<text class="message" x="296.66666666666663" y="774.5" text-anchor="middle" dominant-baseline="middle">6. 200 OK with JSON response</text>
</svg>
