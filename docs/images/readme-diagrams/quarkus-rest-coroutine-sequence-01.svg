<svg xmlns="http://www.w3.org/2000/svg" width="1560" height="906" viewBox="0 0 1560 906" role="img" aria-labelledby="title desc">
  <title id="title">Quarkus REST + Coroutines Sequence</title>
  <desc id="desc">A coroutine resource delegates to suspend service work and returns JSON after the blocking query boundary completes.</desc>
  <defs>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="124%"><feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#64748B" flood-opacity="0.14"/></filter>
    <style>
      .title{font-family:"Architects Daughter";font-size:40px;fill:#263238}.subtitle,.msg,.note,.footer{font-family:"Comic Mono";fill:#36464F}.subtitle{font-size:17px}.participant{font-family:"Architects Daughter";font-size:19px;fill:#1F3138}.role{font-family:"Comic Mono";font-size:12px;fill:#546A73}.msg{font-size:13px}.note{font-size:13px}.footer{font-size:14px;fill:#60727D}.frame{fill:#FBFCF8;stroke:#41545D;stroke-width:3}.header{fill:#FFFFFF;stroke:#546E7A;stroke-width:2}.lifeline{stroke:#9AAAB1;stroke-width:2;stroke-dasharray:7 8;stroke-linecap:round}.activation{fill:#E6F2EC;stroke:#5B7E67;stroke-width:1.5}.call,.work,.return,.skip{fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.call{stroke:#3F7D9C;marker-end:url(#arrow-call);stroke-linecap:round;stroke-linejoin:round}.work{stroke:#6E8F4F;marker-end:url(#arrow-work);stroke-linecap:round;stroke-linejoin:round}.return{stroke:#9B7D54;stroke-width:2.6;stroke-dasharray:8 6;marker-end:url(#arrow-ret);stroke-linecap:round;stroke-linejoin:round}.skip{stroke:#B86868;marker-end:url(#arrow-skip);stroke-linecap:round;stroke-linejoin:round}.label{fill:#FFFFFF;stroke:#D7E0E4;stroke-width:1.5}.callLabel{stroke:#9CC2D1}.workLabel{stroke:#B6C9A4}.returnLabel{stroke:#C8B38F}.skipLabel{stroke:#D9ABAB}.badge{stroke-width:1.8}.callBadge{fill:#EAF4F8;stroke:#3F7D9C}.workBadge{fill:#EEF7F0;stroke:#6E8F4F}.returnBadge{fill:#FFF7E8;stroke:#9B7D54}.skipBadge{fill:#FFF0F0;stroke:#B86868}.badgeText{font-family:"Comic Mono";font-size:12px;font-weight:700}.callText,.badgeText.callText{fill:#2F6F8E}.workText,.badgeText.workText{fill:#55783F}.returnText,.badgeText.returnText{fill:#7F6038}.skipText,.badgeText.skipText{fill:#9D4F4F}.alt{fill:#FFF7ED;fill-opacity:.42;stroke:#D08A39;stroke-width:2.4;stroke-dasharray:12 8}.branch{fill:#FFFFFF;fill-opacity:.82;stroke:#E6C68C;stroke-width:1.5}
    </style>
    <marker id="arrow-call" viewBox="0 0 10 10" markerWidth="14" markerHeight="14" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#3F7D9C" stroke-dasharray="none" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="arrow-work" viewBox="0 0 10 10" markerWidth="14" markerHeight="14" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#6E8F4F" stroke-dasharray="none" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="arrow-ret" viewBox="0 0 10 10" markerWidth="14" markerHeight="14" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#9B7D54" stroke-dasharray="none" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="arrow-skip" viewBox="0 0 10 10" markerWidth="14" markerHeight="14" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#B86868" stroke-dasharray="none" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>
  <rect x="24" y="24" width="1512" height="858" rx="20" class="frame"/>
  <text x="780" y="76" text-anchor="middle" class="title">Quarkus REST + Coroutines Sequence</text>
  <text x="780" y="106" text-anchor="middle" class="subtitle">A coroutine resource delegates to suspend service work and returns JSON after the blocking query boundary completes.</text>
  <g filter="url(#shadow)"><rect x="75" y="156" width="230" height="76" rx="10" class="header"/><text x="190" y="186" text-anchor="middle" class="participant">Client</text><text x="190" y="211" text-anchor="middle" class="role">HTTP caller</text></g>
  <line x1="190" y1="232" x2="190" y2="794" class="lifeline"/>
  <g filter="url(#shadow)"><rect x="468" y="156" width="230" height="76" rx="10" class="header"/><text x="583" y="186" text-anchor="middle" class="participant">Coroutine Resource</text><text x="583" y="211" text-anchor="middle" class="role">Quarkus REST</text></g>
  <line x1="583" y1="232" x2="583" y2="794" class="lifeline"/>
  <g filter="url(#shadow)"><rect x="862" y="156" width="230" height="76" rx="10" class="header"/><text x="977" y="186" text-anchor="middle" class="participant">Service</text><text x="977" y="211" text-anchor="middle" class="role">suspend fun</text></g>
  <line x1="977" y1="232" x2="977" y2="794" class="lifeline"/>
  <g filter="url(#shadow)"><rect x="1255" y="156" width="230" height="76" rx="10" class="header"/><image data-bluetape4k-icon="database" data-source="docs/icons/generic/database-server.svg" x="1271" y="176" width="36" height="36" href="data:image/svg+xml;base64," preserveAspectRatio="xMidYMid meet"/><text x="1390" y="186" text-anchor="middle" class="participant">Database</text><text x="1390" y="211" text-anchor="middle" class="role">reactive / JDBC</text></g>
  <line x1="1370" y1="232" x2="1370" y2="794" class="lifeline"/>
  <rect x="271.5" y="252" width="230.0" height="34" rx="17" class="label callLabel"/>
  <circle cx="295.5" cy="269" r="13" class="badge callBadge"/><text x="295.5" y="274" text-anchor="middle" class="badgeText callText">1</text>
  <text x="319.5" y="274" class="msg callText">GET /resource/{id}</text>
  <path d="M 190 300 L 583 300" class="call" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="665" y="328" width="230.0" height="34" rx="17" class="label callLabel"/>
  <circle cx="689" cy="345" r="13" class="badge callBadge"/><text x="689" y="350" text-anchor="middle" class="badgeText callText">2</text>
  <text x="713" y="350" class="msg callText">suspend fun get(id)</text>
  <path d="M 583 376 L 977 376" class="call" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="1003.5" y="404" width="340.0" height="34" rx="17" class="label workLabel"/>
  <circle cx="1027.5" cy="421" r="13" class="badge workBadge"/><text x="1027.5" y="426" text-anchor="middle" class="badgeText workText">3</text>
  <text x="1051.5" y="426" class="msg workText">withContext(Dispatchers.IO) -&gt; query</text>
  <path d="M 977 452 L 1370 452" class="work" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="1056" y="480" width="235.0" height="34" rx="17" class="label returnLabel"/>
  <circle cx="1080" cy="497" r="13" class="badge returnBadge"/><text x="1080" y="502" text-anchor="middle" class="badgeText returnText">4</text>
  <text x="1104" y="502" class="msg returnText">ResultSet / entity row</text>
  <path d="M 1370 528 L 977 528" class="return" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="655" y="556" width="250.0" height="34" rx="17" class="label returnLabel"/>
  <circle cx="679" cy="573" r="13" class="badge returnBadge"/><text x="679" y="578" text-anchor="middle" class="badgeText returnText">5</text>
  <text x="703" y="578" class="msg returnText">suspend completes -&gt; DTO</text>
  <path d="M 977 604 L 583 604" class="return" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="257.8" y="632" width="257.5" height="34" rx="17" class="label returnLabel"/>
  <circle cx="281.8" cy="649" r="13" class="badge returnBadge"/><text x="281.8" y="654" text-anchor="middle" class="badgeText returnText">6</text>
  <text x="305.8" y="654" class="msg returnText">200 OK with JSON response</text>
  <path d="M 583 680 L 190 680" class="return" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="90" y="818" width="1380" height="40" rx="12" fill="#FFFFFF" stroke="#CCD7DA" stroke-width="2"/>
  <text x="780" y="844" text-anchor="middle" class="footer">Reader contract: request order, branch ownership, and infrastructure boundary are shown without hiding call labels.</text>
</svg>
