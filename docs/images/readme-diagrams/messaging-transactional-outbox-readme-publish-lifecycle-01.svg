<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1914.576" height="820" viewBox="0 0 1914.576 820" role="img" aria-label="Transactional outbox publish lifecycle diagram">
  <defs>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="124%"><feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#64748B" flood-opacity="0.16"/></filter>
    <marker id="arrowBlue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 12 6 L 0 12 Z" fill="#2563EB" stroke-dasharray="none" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="arrowGreen" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 12 6 L 0 12 Z" fill="#16A34A" stroke-dasharray="none" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="arrowAmber" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 12 6 L 0 12 Z" fill="#C47A12" stroke-dasharray="none" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="arrowRed" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 12 6 L 0 12 Z" fill="#DC2626" stroke-dasharray="none" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <style>
      .canvas{fill:#F8FAFC}.frame{fill:#FFFFFF;stroke:#D6E0E8;stroke-width:1.4}.lane{fill:#F8FAFC;stroke:#CBD5E1;stroke-width:1.4}.title{font-family:"Architects Daughter";font-size:38px;fill:#102033}.subtitle{font-family:"Comic Mono";font-size:14px;fill:#51606F}.laneLabel{font-family:"Architects Daughter";font-size:25px;fill:#263548}.cardTitle{font-family:"Architects Daughter";font-size:28px;fill:#102033}.cardText{font-family:"Comic Mono";font-size:14px;fill:#415166}.line{fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
    </style>
  </defs>
  <rect class="canvas" width="1914.576" height="820"/>
  <rect class="frame" x="28.719" y="24" width="1857.139" height="772" rx="24"/>
  <text class="title" x="957.288" y="68" text-anchor="middle">Outbox publish lifecycle</text>
  <text class="subtitle" x="957.288" y="98" text-anchor="middle">A committed PENDING row is retried until it becomes PUBLISHED or exhausts retry budget.</text>

  <rect class="lane" x="76.583" y="134" width="1761.41" height="220" rx="18"/>
  <text class="laneLabel" x="114.875" y="174">Order transaction</text>
  <g filter="url(#shadow)">
    <rect x="114.875" y="222" width="265.647" height="86" rx="16" fill="#EFF6FF" stroke="#2563EB" stroke-width="2.034"/>
    <text class="cardTitle" x="247.698" y="258" text-anchor="middle">REST command</text>
    <text class="cardText" x="247.698" y="284" text-anchor="middle">POST or PUT</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="447.532" y="208" width="275.22" height="114" rx="16" fill="#ECFDF5" stroke="#16A34A" stroke-width="2.034"/>
    <text class="cardTitle" x="585.142" y="250" text-anchor="middle">OrderService</text>
    <text class="cardText" x="585.142" y="280" text-anchor="middle">one Spring transaction</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="808.908" y="208" width="275.22" height="114" rx="16" fill="#EFF6FF" stroke="#2563EB" stroke-width="2.034"/>
    <text class="cardTitle" x="946.519" y="250" text-anchor="middle">orders row</text>
    <text class="cardText" x="946.519" y="280" text-anchor="middle">domain state</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="1170.285" y="208" width="303.939" height="114" rx="16" fill="#FFF7ED" stroke="#D97706" stroke-width="2.034"/>
    <text class="cardTitle" x="1322.254" y="250" text-anchor="middle">outbox row</text>
    <text class="cardText" x="1322.254" y="280" text-anchor="middle">status = PENDING</text>
  </g>

  <rect class="lane" x="76.583" y="418" width="1761.41" height="294" rx="18"/>
  <text class="laneLabel" x="114.875" y="458">Publisher transaction</text>
  <g filter="url(#shadow)">
    <rect x="191.458" y="520" width="282.4" height="106" rx="16" fill="#ECFDF5" stroke="#16A34A" stroke-width="2.034"/>
    <text class="cardTitle" x="332.658" y="560" text-anchor="middle">Scheduler poll</text>
    <text class="cardText" x="332.658" y="590" text-anchor="middle">PENDING or FAILED</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="562.407" y="520" width="282.4" height="106" rx="16" fill="#ECFDF5" stroke="#16A34A" stroke-width="2.034"/>
    <text class="cardTitle" x="703.607" y="560" text-anchor="middle">publishEvent(id)</text>
    <text class="cardText" x="703.607" y="590" text-anchor="middle">skip if final state</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="933.356" y="520" width="256.075" height="106" rx="16" fill="#FFF7ED" stroke="#D97706" stroke-width="2.034"/><image data-bluetape4k-icon="kafka" data-source="docs/icons/testcontainers/mq/apache-kafka.svg" x="947.715" y="556" width="34" height="34" href="data:image/svg+xml;base64," preserveAspectRatio="xMidYMid meet"/>  <text class="cardTitle" x="1061.393" y="560" text-anchor="middle">Kafka send</text>
    <text class="cardText" x="1061.393" y="590" text-anchor="middle">topic order-events</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="1277.98" y="470" width="263.254" height="94" rx="16" fill="#DCFCE7" stroke="#16A34A" stroke-width="2.034"/>
    <text class="cardTitle" x="1409.607" y="506" text-anchor="middle">PUBLISHED</text>
    <text class="cardText" x="1409.607" y="532" text-anchor="middle">processed_at set</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="1277.98" y="620" width="263.254" height="94" rx="16" fill="#FEF3C7" stroke="#D97706" stroke-width="2.034"/>
    <text class="cardTitle" x="1409.607" y="656" text-anchor="middle">FAILED</text>
    <text class="cardText" x="1409.607" y="682" text-anchor="middle">retry_count + 1</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="1620.21" y="620" width="165.132" height="94" rx="16" fill="#FEE2E2" stroke="#DC2626" stroke-width="2.034"/>
    <text class="cardTitle" x="1702.776" y="656" text-anchor="middle">DEAD</text>
    <text class="cardText" x="1702.776" y="682" text-anchor="middle">after 3 tries</text>
  </g>

  <path class="line" d="M 380.522 265 L 447.532 265" stroke="#16A34A" marker-end="url(#arrowGreen)" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="line" d="M 722.753 265 L 808.908 265" stroke="#2563EB" marker-end="url(#arrowBlue)" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="line" d="M 1084.129 265 L 1170.285 265" stroke="#C47A12" marker-end="url(#arrowAmber)" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="line" d="M 1322.254 322 L 1322.254 362 Q 1322.254 372 1310.288 372 L 344.624 372 Q 332.658 372 332.658 382 L 332.658 520" stroke="#C47A12" marker-end="url(#arrowAmber)" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="line" d="M 473.858 573 L 562.407 573" stroke="#16A34A" marker-end="url(#arrowGreen)" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="line" d="M 844.807 573 L 933.356 573" stroke="#16A34A" marker-end="url(#arrowGreen)" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="line" d="M 1189.431 548 L 1277.98 518" stroke="#16A34A" marker-end="url(#arrowGreen)" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="line" d="M 1189.431 598 L 1277.98 668" stroke="#C47A12" marker-end="url(#arrowAmber)" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="line" d="M 1541.234 668 L 1620.21 668" stroke="#DC2626" marker-end="url(#arrowRed)" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
