<svg xmlns="http://www.w3.org/2000/svg" width="920" height="420" viewBox="0 0 920 420" role="img" aria-label="Gatling Gradle Plugin Demo Architecture">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#1f2937" flood-opacity="0.10"/></filter>
  <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth">
    <path d="M1,1 L8,4.5 L1,8 Z" fill="#758297"/>
  </marker>
  <style>
    .canvas{fill:#f7f9fc}.frame{fill:#fff;stroke:#d8e0ea;stroke-width:1.5}
    .title{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:38px;font-weight:400;fill:#102033}
    .subtitle{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:14px;font-weight:400;fill:#536273}
    .smallLabel{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:21px;font-weight:400;fill:#102033}
    .mono{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#102033}
    .small{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#536273}
    .card{stroke-width:2.1;filter:url(#shadow)}
    .line{stroke:#758297;stroke-width:2.1;fill:none;marker-end:url(#arrow)}
  </style>
</defs>
<rect class="canvas" width="920" height="420"/>
<rect class="frame" x="24" y="20" width="872" height="376" rx="18"/>
<text class="title" x="44" y="62">Gatling Gradle Plugin Demo</text>
<text class="subtitle" x="44" y="84">GatlingPlugin → Simulation → feeder → scenario → inject → reports</text>

<!-- Gradle Plugin -->
<g transform="translate(44,100)">
  <rect class="card" x="0" y="0" width="190" height="80" rx="10" fill="#E8F3FF" stroke="#5B8DEF"/>
  <text class="smallLabel" x="95" y="26" text-anchor="middle">Gradle Plugin</text>
  <text class="small" x="95" y="48" text-anchor="middle">io.gatling.gradle</text>
  <text class="small" x="95" y="66" text-anchor="middle">gatlingRun task</text>
</g>

<!-- Simulation -->
<g transform="translate(270,100)">
  <rect class="card" x="0" y="0" width="190" height="80" rx="10" fill="#EAF7EF" stroke="#58A978"/>
  <text class="smallLabel" x="95" y="26" text-anchor="middle">Simulation class</text>
  <text class="small" x="95" y="48" text-anchor="middle">BasicSimulation</text>
  <text class="small" x="95" y="66" text-anchor="middle">extends Simulation</text>
</g>

<!-- Scenario -->
<g transform="translate(496,100)">
  <rect class="card" x="0" y="0" width="190" height="80" rx="10" fill="#FFF3D9" stroke="#D6A441"/>
  <text class="smallLabel" x="95" y="26" text-anchor="middle">Scenario</text>
  <text class="small" x="95" y="48" text-anchor="middle">Users: search → browse</text>
  <text class="small" x="95" y="66" text-anchor="middle">Admins: + edit</text>
</g>

<!-- Target server -->
<g transform="translate(722,100)">
  <rect class="card" x="0" y="0" width="170" height="80" rx="10" fill="#FDECEF" stroke="#DC6B82"/>
  <text class="smallLabel" x="85" y="26" text-anchor="middle">Target Server</text>
  <text class="small" x="85" y="48" text-anchor="middle">computer-database</text>
  <text class="small" x="85" y="66" text-anchor="middle">.gatling.io</text>
</g>

<!-- Feeder -->
<g transform="translate(44,256)">
  <rect class="card" x="0" y="0" width="190" height="80" rx="10" fill="#E9F7F6" stroke="#45A7A1"/>
  <text class="smallLabel" x="95" y="26" text-anchor="middle">CSV Feeder</text>
  <text class="small" x="95" y="48" text-anchor="middle">search.csv</text>
  <text class="small" x="95" y="66" text-anchor="middle">provides test data</text>
</g>

<!-- Inject -->
<g transform="translate(270,256)">
  <rect class="card" x="0" y="0" width="190" height="80" rx="10" fill="#F1ECFF" stroke="#8A72D6"/>
  <text class="smallLabel" x="95" y="26" text-anchor="middle">Inject Profile</text>
  <text class="small" x="95" y="48" text-anchor="middle">Users: 10 users / 10s</text>
  <text class="small" x="95" y="66" text-anchor="middle">Admins: 2 users / 10s</text>
</g>

<!-- Assertions -->
<g transform="translate(496,256)">
  <rect class="card" x="0" y="0" width="190" height="80" rx="10" fill="#EEF6D9" stroke="#8BA84D"/>
  <text class="smallLabel" x="95" y="26" text-anchor="middle">Assertions</text>
  <text class="small" x="95" y="48" text-anchor="middle">global.successfulRequests</text>
  <text class="small" x="95" y="66" text-anchor="middle">.percent.gte(95)</text>
</g>

<!-- Reports -->
<g transform="translate(722,256)">
  <rect class="card" x="0" y="0" width="170" height="80" rx="10" fill="#FFF3D9" stroke="#D6A441"/>
  <text class="smallLabel" x="85" y="26" text-anchor="middle">HTML Reports</text>
  <text class="small" x="85" y="48" text-anchor="middle">build/reports</text>
  <text class="small" x="85" y="66" text-anchor="middle">/gatling/</text>
</g>

<!-- Arrows -->
<path class="line" d="M234,140 L268,140"/>
<path class="line" d="M460,140 L494,140"/>
<path class="line" d="M686,140 L720,140"/>
<path class="line" d="M139,180 L139,254"/>
<path class="line" d="M365,180 L365,254"/>
<path class="line" d="M591,180 L591,254"/>
<path class="line" d="M807,180 L807,254"/>
</svg>
