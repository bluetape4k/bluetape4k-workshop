<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1965.911" height="900" viewBox="0 0 1965.911 900" role="img" aria-label="WebFlux WebSocket quote architecture">
  <defs>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="124%"><feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#64748B" flood-opacity="0.15"/></filter>
    <marker id="arrowBlue" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 14 14" data-role="primary" data-tip-direction="positive-x"><path d="M 0 0 L 14 7 L 0 14 Z" fill="#2563EB" stroke-dasharray="none" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="arrowGreen" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 14 14" data-role="primary" data-tip-direction="positive-x"><path d="M 0 0 L 14 7 L 0 14 Z" fill="#16A34A" stroke-dasharray="none" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="arrowOrange" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 14 14" data-role="primary" data-tip-direction="positive-x"><path d="M 0 0 L 14 7 L 0 14 Z" fill="#EA580C" stroke-dasharray="none" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <style>
      .canvas{fill:#F8FAFC}.frame{fill:#FFFFFF;stroke:#D6E0E8;stroke-width:1.4}.layer{stroke-width:1.6;rx:24}
      .title{font-family:"Architects Daughter";font-size:42px;fill:#102033}.subtitle{font-family:"Comic Mono";font-size:16px;fill:#51606F}
      .layerTitle{font-family:"Architects Daughter";font-size:31px;fill:#243447}.cardTitle{font-family:"Architects Daughter";font-size:30px;fill:#102033}
      .cardText{font-family:"Comic Mono";font-size:15px;fill:#415166}.line{fill:none;stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round}
      .label{font-family:"Comic Mono";font-size:14px;fill:#334155}
    </style>
  </defs>
  <rect class="canvas" width="1965.911" height="900"/>
  <rect class="frame" x="26.507" y="24" width="1912.898" height="852" rx="26"/>
  <text class="title" x="982.956" y="74" text-anchor="middle">Raw WebSocket quote streaming</text>
  <text class="subtitle" x="982.956" y="108" text-anchor="middle">The WebSocket stream and NDJSON HTTP routes share QuoteGenerator while Netty handles reactive transport.</text>

  <rect class="layer" x="92.773" y="154" width="1780.364" height="150" fill="#EFF6FF" stroke="#BFDBFE"/>
  <text class="layerTitle" x="136.951" y="198">Clients</text>
  <g filter="url(#shadow)"><rect x="187.756" y="220" width="331.333" height="62" rx="14" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.878"/><text class="cardTitle" x="353.422" y="258" text-anchor="middle">Static index.html</text></g>
  <g filter="url(#shadow)"><rect x="717.889" y="210" width="397.6" height="82" rx="14" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.878"/><text class="cardTitle" x="916.689" y="244" text-anchor="middle">WebSocket client</text><text class="cardText" x="916.689" y="270" text-anchor="middle">ws://localhost/event-emitter</text></g>
  <g filter="url(#shadow)"><rect x="1336.378" y="220" width="353.422" height="62" rx="14" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.878"/><text class="cardTitle" x="1513.089" y="258" text-anchor="middle">WebTestClient</text></g>

  <rect class="layer" x="92.773" y="366" width="1780.364" height="190" fill="#F0FDF4" stroke="#BBF7D0"/>
  <text class="layerTitle" x="136.951" y="410">WebFlux routing</text>
  <g filter="url(#shadow)"><rect x="165.667" y="438" width="386.556" height="94" rx="14" fill="#FFFFFF" stroke="#16A34A" stroke-width="1.878"/><text class="cardTitle" x="358.944" y="472" text-anchor="middle">HandlerMapping</text><text class="cardText" x="358.944" y="498" text-anchor="middle">/event-emitter to handler</text></g>
  <g filter="url(#shadow)"><rect x="684.756" y="438" width="397.6" height="94" rx="14" fill="#FFFFFF" stroke="#16A34A" stroke-width="1.878"/><text class="cardTitle" x="883.556" y="472" text-anchor="middle">ReactiveWebSocketHandler</text><text class="cardText" x="883.556" y="498" text-anchor="middle">session.send + receive log</text></g>
  <g filter="url(#shadow)"><rect x="1248.022" y="438" width="386.556" height="94" rx="14" fill="#FFFFFF" stroke="#16A34A" stroke-width="1.878"/><text class="cardTitle" x="1441.3" y="472" text-anchor="middle">coRouter HTTP routes</text><text class="cardText" x="1441.3" y="498" text-anchor="middle">/quotes and /quotes/{duration}</text></g>

  <rect class="layer" x="92.773" y="626" width="1780.364" height="150" fill="#FFF7ED" stroke="#FED7AA"/>
  <text class="layerTitle" x="136.951" y="670">Quote production and runtime</text>
  <g filter="url(#shadow)"><rect x="209.844" y="700" width="375.511" height="58" rx="14" fill="#FFFFFF" stroke="#EA580C" stroke-width="1.878"/><text class="cardTitle" x="397.6" y="737" text-anchor="middle">QuoteGenerator</text></g>
  <g filter="url(#shadow)"><rect x="773.111" y="690" width="419.689" height="78" rx="14" fill="#FFFFFF" stroke="#EA580C" stroke-width="1.878"/><text class="cardTitle" x="982.956" y="722" text-anchor="middle">Quote and Event JSON</text><text class="cardText" x="982.956" y="746" text-anchor="middle">ticker, price, UUID v7 traceId</text></g>
  <g filter="url(#shadow)"><rect x="1380.556" y="700" width="320.289" height="58" rx="14" fill="#FFFFFF" stroke="#EA580C" stroke-width="1.878"/><text class="cardTitle" x="1540.7" y="737" text-anchor="middle">NettyConfig</text></g>

  <path class="line" d="M 353.422 282 L 353.422 438" stroke="#2563EB" marker-end="url(#arrowBlue)" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="line" d="M 916.689 292 L 916.689 438" stroke="#2563EB" marker-end="url(#arrowBlue)" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="line" d="M 1513.089 282 L 1513.089 438" stroke="#2563EB" marker-end="url(#arrowBlue)" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="line" d="M 552.222 485 L 684.756 485" stroke="#16A34A" marker-end="url(#arrowGreen)" stroke-linecap="round" stroke-linejoin="round"/>
  <text class="label" x="618.489" y="466" text-anchor="middle">adapter dispatch</text>
  <path class="line" d="M 1082.356 485 L 1248.022 485" stroke="#16A34A" marker-end="url(#arrowGreen)" stroke-linecap="round" stroke-linejoin="round"/>
  <text class="label" x="1165.189" y="466" text-anchor="middle">same generator</text>
  <path class="line" d="M 883.556 532 L 883.556 586 Q 883.556 596 872.511 596 L 408.644 596 Q 397.6 596 397.6 606 L 397.6 700" stroke="#EA580C" marker-end="url(#arrowOrange)" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="line" d="M 1441.3 532 L 1441.3 586 Q 1441.3 596 1430.256 596 L 994 596 Q 982.956 596 982.956 606 L 982.956 690" stroke="#EA580C" marker-end="url(#arrowOrange)" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="line" d="M 585.356 729 L 773.111 729" stroke="#EA580C" marker-end="url(#arrowOrange)" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="line" d="M 1192.8 729 L 1380.556 729" stroke="#EA580C" marker-end="url(#arrowOrange)" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
