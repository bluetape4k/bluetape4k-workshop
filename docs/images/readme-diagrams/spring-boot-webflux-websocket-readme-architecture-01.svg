<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1780" height="900" viewBox="0 0 1780 900" role="img" aria-label="WebFlux WebSocket quote architecture">
  <defs>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="124%"><feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#64748B" flood-opacity="0.15"/></filter>
    <marker id="arrowBlue" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 14 7 L 0 14 Z" fill="#2563EB" stroke-dasharray="none"/></marker>
    <marker id="arrowGreen" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 14 7 L 0 14 Z" fill="#16A34A" stroke-dasharray="none"/></marker>
    <marker id="arrowOrange" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 14 7 L 0 14 Z" fill="#EA580C" stroke-dasharray="none"/></marker>
    <style>
      .canvas{fill:#F8FAFC}.frame{fill:#FFFFFF;stroke:#D6E0E8;stroke-width:1.4}.layer{stroke-width:1.6;rx:24}
      .title{font-family:"Architects Daughter";font-size:42px;fill:#102033}.subtitle{font-family:"Comic Mono";font-size:16px;fill:#51606F}
      .layerTitle{font-family:"Architects Daughter";font-size:31px;fill:#243447}.cardTitle{font-family:"Architects Daughter";font-size:30px;fill:#102033}
      .cardText{font-family:"Comic Mono";font-size:15px;fill:#415166}.line{fill:none;stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round}
      .label{font-family:"Comic Mono";font-size:14px;fill:#334155}
    </style>
  </defs>
  <rect class="canvas" width="1780" height="900"/>
  <rect class="frame" x="24" y="24" width="1732" height="852" rx="26"/>
  <text class="title" x="890" y="74" text-anchor="middle">Raw WebSocket quote streaming</text>
  <text class="subtitle" x="890" y="108" text-anchor="middle">The WebSocket stream and NDJSON HTTP routes share QuoteGenerator while Netty handles reactive transport.</text>

  <rect class="layer" x="84" y="154" width="1612" height="150" fill="#EFF6FF" stroke="#BFDBFE"/>
  <text class="layerTitle" x="124" y="198">Clients</text>
  <g filter="url(#shadow)"><rect x="170" y="220" width="300" height="62" rx="14" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.7"/><text class="cardTitle" x="320" y="258" text-anchor="middle">Static index.html</text></g>
  <g filter="url(#shadow)"><rect x="650" y="210" width="360" height="82" rx="14" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.7"/><text class="cardTitle" x="830" y="244" text-anchor="middle">WebSocket client</text><text class="cardText" x="830" y="270" text-anchor="middle">ws://localhost/event-emitter</text></g>
  <g filter="url(#shadow)"><rect x="1210" y="220" width="320" height="62" rx="14" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.7"/><text class="cardTitle" x="1370" y="258" text-anchor="middle">WebTestClient</text></g>

  <rect class="layer" x="84" y="366" width="1612" height="190" fill="#F0FDF4" stroke="#BBF7D0"/>
  <text class="layerTitle" x="124" y="410">WebFlux routing</text>
  <g filter="url(#shadow)"><rect x="150" y="438" width="350" height="94" rx="14" fill="#FFFFFF" stroke="#16A34A" stroke-width="1.7"/><text class="cardTitle" x="325" y="472" text-anchor="middle">HandlerMapping</text><text class="cardText" x="325" y="498" text-anchor="middle">/event-emitter to handler</text></g>
  <g filter="url(#shadow)"><rect x="620" y="438" width="360" height="94" rx="14" fill="#FFFFFF" stroke="#16A34A" stroke-width="1.7"/><text class="cardTitle" x="800" y="472" text-anchor="middle">ReactiveWebSocketHandler</text><text class="cardText" x="800" y="498" text-anchor="middle">session.send + receive log</text></g>
  <g filter="url(#shadow)"><rect x="1130" y="438" width="350" height="94" rx="14" fill="#FFFFFF" stroke="#16A34A" stroke-width="1.7"/><text class="cardTitle" x="1305" y="472" text-anchor="middle">coRouter HTTP routes</text><text class="cardText" x="1305" y="498" text-anchor="middle">/quotes and /quotes/{duration}</text></g>

  <rect class="layer" x="84" y="626" width="1612" height="150" fill="#FFF7ED" stroke="#FED7AA"/>
  <text class="layerTitle" x="124" y="670">Quote production and runtime</text>
  <g filter="url(#shadow)"><rect x="190" y="700" width="340" height="58" rx="14" fill="#FFFFFF" stroke="#EA580C" stroke-width="1.7"/><text class="cardTitle" x="360" y="737" text-anchor="middle">QuoteGenerator</text></g>
  <g filter="url(#shadow)"><rect x="700" y="690" width="380" height="78" rx="14" fill="#FFFFFF" stroke="#EA580C" stroke-width="1.7"/><text class="cardTitle" x="890" y="722" text-anchor="middle">Quote and Event JSON</text><text class="cardText" x="890" y="746" text-anchor="middle">ticker, price, UUID v7 traceId</text></g>
  <g filter="url(#shadow)"><rect x="1250" y="700" width="290" height="58" rx="14" fill="#FFFFFF" stroke="#EA580C" stroke-width="1.7"/><text class="cardTitle" x="1395" y="737" text-anchor="middle">NettyConfig</text></g>

  <path class="line" d="M 320 282 L 320 438" stroke="#2563EB" marker-end="url(#arrowBlue)" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="line" d="M 830 292 L 830 438" stroke="#2563EB" marker-end="url(#arrowBlue)" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="line" d="M 1370 282 L 1370 438" stroke="#2563EB" marker-end="url(#arrowBlue)" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="line" d="M 500 485 L 620 485" stroke="#16A34A" marker-end="url(#arrowGreen)" stroke-linecap="round" stroke-linejoin="round"/>
  <text class="label" x="560" y="466" text-anchor="middle">adapter dispatch</text>
  <path class="line" d="M 980 485 L 1130 485" stroke="#16A34A" marker-end="url(#arrowGreen)" stroke-linecap="round" stroke-linejoin="round"/>
  <text class="label" x="1055" y="466" text-anchor="middle">same generator</text>
  <path class="line" d="M 800 532 L 800 596 L 360 596 L 360 700" stroke="#EA580C" marker-end="url(#arrowOrange)" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="line" d="M 1305 532 L 1305 596 L 890 596 L 890 690" stroke="#EA580C" marker-end="url(#arrowOrange)" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="line" d="M 530 729 L 700 729" stroke="#EA580C" marker-end="url(#arrowOrange)" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="line" d="M 1080 729 L 1250 729" stroke="#EA580C" marker-end="url(#arrowOrange)" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
