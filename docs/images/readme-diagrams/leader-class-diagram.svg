<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-label="Leader Election Component Architecture">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#1f2937" flood-opacity="0.09"/></filter>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 9 9" data-role="secondary" data-tip-direction="positive-x">
    <path d="M1,1 L8,4.5 L1,8 Z" fill="#758297" stroke-dasharray="none" stroke="#758297" stroke-width="0"/>
  </marker>
  <style>
    .canvas{fill:#f7f9fc}.frame{fill:#fff;stroke:#d8e0ea;stroke-width:1.5}
    .title{font-family:"Architects Daughter";font-size:38px;font-weight:400;fill:#102033}
    .subtitle{font-family:"Comic Mono";font-size:14px;font-weight:400;fill:#536273}
    .smallLabel{font-family:"Architects Daughter";font-size:21px;font-weight:400;fill:#102033}
    .mono{font-family:"Comic Mono";font-size:12px;font-weight:400;fill:#102033}
    .small{font-family:"Comic Mono";font-size:12px;font-weight:400;fill:#536273}
    .card{stroke-width:2.1;filter:url(#shadow)}
    .line{stroke:#758297;stroke-width:2.1;fill:none;marker-end:url(#arrow);stroke-linecap:round;stroke-linejoin:round}
  </style>
</defs>
<rect class="canvas" width="960" height="520"/>
<rect class="frame" x="24" y="20" width="912" height="476" rx="20"/>

<!-- Title -->
<text class="title" x="48" y="66">Leader Election Component Architecture</text>  <text class="subtitle" x="48" y="90">Spring Boot  -  LeaderElector  -  Redis/Lettuce  -  bluetape4k-leader</text>

<!-- Row 1: LeaderElectionApp (top center) -->
<rect class="card" x="330" y="108" width="300" height="64" rx="14" fill="#E8F3FF" stroke="#5B8DEF"/>
<text class="smallLabel" x="480" y="136" text-anchor="middle">LeaderElectionApp</text>
<text class="small" x="480" y="157" text-anchor="middle">Spring Boot Application</text>

<!-- Row 2: LeaderElectionConfig | LeaderScheduledJobService -->
<rect class="card" x="60" y="216" width="280" height="68" rx="14" fill="#EAF7EF" stroke="#58A978"/>
<text class="smallLabel" x="200" y="244" text-anchor="middle">LeaderElectionConfig</text>
<text class="small" x="200" y="264" text-anchor="middle">@Configuration  -  creates LettuceLeaderElector</text>

<rect class="card" x="620" y="216" width="280" height="68" rx="14" fill="#EAF7EF" stroke="#58A978"/>
<text class="smallLabel" x="760" y="244" text-anchor="middle">LeaderScheduledJobService</text>
<text class="small" x="760" y="264" text-anchor="middle">@Scheduled  -  dispatches LeaderGuardedJob</text>

<!-- Arrows Row1 -> Row2 -->
<path class="line" d="M 410 172 L 280 216" stroke-linecap="round" stroke-linejoin="round"/>
<path class="line" d="M 550 172 L 680 216" stroke-linecap="round" stroke-linejoin="round"/>

<!-- Row 3: LettuceLeaderElector | Jobs -->
<rect class="card" x="60" y="332" width="280" height="68" rx="14" fill="#FFF3D9" stroke="#D6A441"/>
<text class="smallLabel" x="200" y="360" text-anchor="middle">LettuceLeaderElector</text>
<text class="small" x="200" y="380" text-anchor="middle">LeaderElectionOptions  -  acquire/release</text>

<rect class="card" x="560" y="316" width="180" height="60" rx="14" fill="#F1ECFF" stroke="#8A72D6"/>
<text class="smallLabel" x="650" y="342" text-anchor="middle">CacheWarmupJob</text>
<text class="small" x="650" y="360" text-anchor="middle">LeaderGuardedJob</text>

<rect class="card" x="760" y="316" width="180" height="60" rx="14" fill="#F1ECFF" stroke="#8A72D6"/>
<text class="smallLabel" x="850" y="342" text-anchor="middle">StaleWorkflowJob</text>
<text class="small" x="850" y="360" text-anchor="middle">LeaderGuardedJob</text>

<!-- Arrows Row2 -> Row3 -->
<path class="line" d="M 200 284 L 200 332" stroke-linecap="round" stroke-linejoin="round"/>
<path class="line" d="M 760 284 L 650 316" stroke-linecap="round" stroke-linejoin="round"/>
<path class="line" d="M 780 284 L 860 316" stroke-linecap="round" stroke-linejoin="round"/>

<!-- Row 4: Redis (full width) -->
<rect class="card" x="60" y="430" width="840" height="56" rx="14" fill="#FDECEF" stroke="#DC6B82"/>  <text class="smallLabel" x="480" y="455" text-anchor="middle">Redis (Testcontainers)</text>
<text class="small" x="480" y="473" text-anchor="middle">SETNX leader:{lockName}  -  atomic distributed lock  -  single instance tiebreaker</text>

<!-- Arrow LettuceLeaderElector -> Redis -->
<path class="line" d="M 200 400 L 350 430" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
