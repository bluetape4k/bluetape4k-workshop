  <rect class="card" x="0" y="0" width="340" height="112" rx="5" fill="#FDECEF" stroke="#DC6B82"/>
  <line class="compartment" x1="0" y1="78" x2="340" y2="78" stroke="#DC6B82"/>
  <text class="small" x="170" y="26" text-anchor="middle">«data class - Builder»</text>
  <text class="label" x="170" y="61" text-anchor="middle">HeroDataClass</text>

</g>
<g transform="translate(92,502)">
  <rect class="card" x="0" y="0" width="340" height="133" rx="5" fill="#E9F7F6" stroke="#45A7A1"/>
  <line class="compartment" x1="0" y1="78" x2="340" y2="78" stroke="#45A7A1"/>
  <text class="small" x="170" y="26" text-anchor="middle"></text>
  <text class="label" x="170" y="61" text-anchor="middle">HolderKotlinLazy</text>
  <text class="mono" x="18" y="108">+heavy: Heavy by lazy</text>
</g>
<g transform="translate(502,502)">
  <rect class="card" x="0" y="0" width="340" height="133" rx="5" fill="#F1ECFF" stroke="#8A72D6"/>
  <line class="compartment" x1="0" y1="78" x2="340" y2="78" stroke="#8A72D6"/>
  <text class="small" x="170" y="26" text-anchor="middle"></text>
  <text class="label" x="170" y="61" text-anchor="middle">HolderNative</text>
  <text class="mono" x="18" y="108">+heavy: Heavy</text>
</g>
<g transform="translate(912,502)">
  <rect class="card" x="0" y="0" width="340" height="112" rx="5" fill="#F7F1E7" stroke="#B88A44"/>
  <line class="compartment" x1="0" y1="78" x2="340" y2="78" stroke="#B88A44"/>
  <text class="small" x="170" y="26" text-anchor="middle">«object - Kotlin Singl.»</text>
  <text class="label" x="170" y="61" text-anchor="middle">IvoryTower</text>

</g>
<g transform="translate(1322,502)">
  <rect class="card" x="0" y="0" width="340" height="175" rx="5" fill="#EEF6D9" stroke="#8BA84D"/>
  <line class="compartment" x1="0" y1="78" x2="340" y2="78" stroke="#8BA84D"/>
  <text class="small" x="170" y="26" text-anchor="middle">«interface»</text>
  <text class="label" x="170" y="61" text-anchor="middle">KingdomFactory</text>
  <text class="mono" x="18" y="108">+makeKing() King</text>
<text class="mono" x="18" y="129">+makeCastle() Castle</text>
<text class="mono" x="18" y="150">+makeArmy() Army</text>
</g>
<g transform="translate(707,803)">
  <rect class="card" x="0" y="0" width="340" height="112" rx="5" fill="#E8F3FF" stroke="#5B8DEF"/>
  <line class="compartment" x1="0" y1="78" x2="340" y2="78" stroke="#5B8DEF"/>
  <text class="small" x="170" y="26" text-anchor="middle">«companion object»</text>
  <text class="label" x="170" y="61" text-anchor="middle">KotlinSingleton</text>

</g>
<g transform="translate(502,1065)">
  <rect class="card" x="0" y="0" width="340" height="175" rx="5" fill="#EAF7EF" stroke="#58A978"/>
  <line class="compartment" x1="0" y1="78" x2="340" y2="78" stroke="#58A978"/>
  <text class="small" x="170" y="26" text-anchor="middle"></text>
  <text class="label" x="170" y="61" text-anchor="middle">ElfKingdomFactory</text>
  <text class="mono" x="18" y="108">+makeKing() ElfKing</text>
<text class="mono" x="18" y="129">+makeCastle() ElfCastle</text>
<text class="mono" x="18" y="150">+makeArmy() ElfArmy</text>
</g>
<g transform="translate(912,1065)">
  <rect class="card" x="0" y="0" width="340" height="175" rx="5" fill="#FFF3D9" stroke="#D6A441"/>
  <line class="compartment" x1="0" y1="78" x2="340" y2="78" stroke="#D6A441"/>
  <text class="small" x="170" y="26" text-anchor="middle"></text>
  <text class="label" x="170" y="61" text-anchor="middle">OrcKingdomFactory</text>
  <text class="mono" x="18" y="108">+makeKing() OrcKing</text>
<text class="mono" x="18" y="129">+makeCastle() OrcCastle</text>
<text class="mono" x="18" y="150">+makeArmy() OrcArmy</text>
