<svg xmlns="http://www.w3.org/2000/svg" width="920" height="440" viewBox="0 0 920 440" role="img" aria-label="Kotlin Design Patterns">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#1f2937" flood-opacity="0.10"/></filter>
  <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth">
    <path d="M1,1 L8,4.5 L1,8 Z" fill="#758297"/>
  </marker>
  <style>
    .canvas{fill:#f7f9fc}.frame{fill:#fff;stroke:#d8e0ea;stroke-width:1.5}
    .title{font-family:"Architects Daughter";font-size:38px;font-weight:400;fill:#102033}
    .subtitle{font-family:"Comic Mono";font-size:14px;font-weight:400;fill:#536273}
    .smallLabel{font-family:"Architects Daughter";font-size:21px;font-weight:400;fill:#102033}
    .mono{font-family:"Comic Mono";font-size:12px;font-weight:400;fill:#102033}
    .small{font-family:"Comic Mono";font-size:12px;font-weight:400;fill:#536273}
    .card{stroke-width:2.1;filter:url(#shadow)}
    .line{stroke:#758297;stroke-width:2.1;fill:none;marker-end:url(#arrow)}
  </style>
</defs>
<!-- Layout:
     Canvas: 920×440  Frame: x=24 y=20 w=872 h=396
     Row1  y=98  h=54  title card (center x=220 w=480)
     Row2  y=212 h=100 4 pattern cols
       Col1: x=24  w=196 cx=122  right=220
       Col2: x=236 w=196 cx=334  right=432  (gap=16px → merge spacing OK since no connectors)
       Col3: x=448 w=196 cx=546  right=644
       Col4: x=660 w=196 cx=758  right=856
     Row3  y=362 h=54  Kotlin idioms (full width)
     No overlap: 220<236 ✓ 432<448 ✓ 644<660 ✓
-->
<rect class="canvas" width="920" height="440"/>
<rect class="frame" x="24" y="20" width="872" height="396" rx="28"/>
<text class="title" x="58" y="66">Kotlin Design Patterns</text>
<text class="subtitle" x="58" y="92">Singleton · Builder · Abstract Factory · Lazy Loading — Kotlin idiomatic implementations</text>

<!-- Arrows from overview to patterns -->
<path class="line" d="M480 152 L480 177 L122 177 L122 212"/>
<path class="line" d="M480 152 L480 177 L334 177 L334 212"/>
<path class="line" d="M480 152 L480 177 L546 177 L546 212"/>
<path class="line" d="M480 152 L480 177 L758 177 L758 212"/>
<!-- Pattern cards → Kotlin Idioms -->
<path class="line" d="M122 312 L122 340 L480 340 L480 362"/>
<path class="line" d="M334 312 L334 340 L480 340 L480 362"/>
<path class="line" d="M546 312 L546 340 L480 340 L480 362"/>
<path class="line" d="M758 312 L758 340 L480 340 L480 362"/>

<!-- Overview -->
<g transform="translate(220,98)">
  <rect class="card" x="0" y="0" width="480" height="54" rx="12" fill="#EAF7EF" stroke="#58A978"/>
  <text class="smallLabel" x="240" y="22" text-anchor="middle">Design Patterns — Kotlin Style</text>
  <text class="small" x="240" y="42" text-anchor="middle">Java Design Patterns → idiomatic Kotlin: object, data class, by lazy, companion</text>
</g>

<!-- Singleton  col1 -->
<g transform="translate(24,212)">
  <rect class="card" x="0" y="0" width="196" height="100" rx="12" fill="#E8F3FF" stroke="#5B8DEF"/>
  <text class="smallLabel" x="98" y="22" text-anchor="middle">Singleton</text>
  <text class="mono" x="98" y="44" text-anchor="middle">object IvoryTower</text>
  <text class="small" x="98" y="64" text-anchor="middle">KotlinSingleton</text>
  <text class="small" x="98" y="84" text-anchor="middle">HolderKotlinLazy</text>
</g>

<!-- Builder  col2 -->
<g transform="translate(236,212)">
  <rect class="card" x="0" y="0" width="196" height="100" rx="12" fill="#F1ECFF" stroke="#8A72D6"/>
  <text class="smallLabel" x="98" y="22" text-anchor="middle">Builder</text>
  <text class="mono" x="98" y="44" text-anchor="middle">data class + copy()</text>
  <text class="small" x="98" y="64" text-anchor="middle">HeroDataClass</text>
  <text class="small" x="98" y="84" text-anchor="middle">named params + defaults</text>
</g>

<!-- Abstract Factory  col3 -->
<g transform="translate(448,212)">
  <rect class="card" x="0" y="0" width="196" height="100" rx="12" fill="#FFF3D9" stroke="#D6A441"/>
  <text class="smallLabel" x="98" y="22" text-anchor="middle">Abstract Factory</text>
  <text class="mono" x="98" y="44" text-anchor="middle">interface KingdomFactory</text>
  <text class="small" x="98" y="64" text-anchor="middle">ElfKingdomFactory</text>
  <text class="small" x="98" y="84" text-anchor="middle">OrcKingdomFactory</text>
</g>

<!-- Lazy Loading  col4 -->
<g transform="translate(660,212)">
  <rect class="card" x="0" y="0" width="196" height="100" rx="12" fill="#FDECEF" stroke="#DC6B82"/>
  <text class="smallLabel" x="98" y="22" text-anchor="middle">Lazy Loading</text>
  <text class="mono" x="98" y="44" text-anchor="middle">val heavy by lazy { }</text>
  <text class="small" x="98" y="64" text-anchor="middle">HeavyDeferred</text>
  <text class="small" x="98" y="84" text-anchor="middle">async + Deferred</text>
</g>

<!-- Kotlin Idioms (full width) -->
<g transform="translate(24,362)">
  <rect class="card" x="0" y="0" width="872" height="54" rx="12" fill="#E9F7F6" stroke="#45A7A1"/>
  <text class="smallLabel" x="436" y="20" text-anchor="middle">Kotlin Idioms Applied</text>
  <text class="small" x="436" y="40" text-anchor="middle">object · data class · by lazy · companion object · sealed class · enum class · operator fun invoke</text>
</g>
</svg>
