  <text class="small" x="170" y="26" text-anchor="middle"></text>
  <text class="label" x="170" y="61" text-anchor="middle">Hero</text>
  <text class="mono" x="18" y="108">+name: String</text>
<text class="mono" x="18" y="129">+armor: Armor</text>
<text class="mono" x="18" y="150">+weapon: Weapon</text>
<text class="mono" x="18" y="171">+hairType: HairType</text>
</g>
