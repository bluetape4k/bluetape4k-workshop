    <text class="cardText" x="1249.28" y="410" text-anchor="middle">thumb-128, card-320, detail-1024</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="1523.2" y="354" width="281.6" height="82" rx="12" fill="#FFFFFF" stroke="#86B89B" stroke-width="1.92"/>
    <text class="cardTitle" x="1664" y="384" text-anchor="middle">ImageKeyFactory</text>
    <text class="cardText" x="1664" y="410" text-anchor="middle">safe object keys</text>
  </g>

  <rect x="69.12" y="502" width="1756.16" height="156" rx="20" fill="#FFF7E8" stroke="#D8B86E" stroke-width="1.92"/>
  <text class="layerTitle" x="110.08" y="536">Bluetape4k image runtime</text>
  <g filter="url(#shadow)">
    <rect x="286.72" y="560" width="332.8" height="70" rx="12" fill="#FFFFFF" stroke="#C99A35" stroke-width="1.92"/>
    <text class="cardTitle" x="453.12" y="589" text-anchor="middle">ImageStorage</text>
    <text class="cardText" x="453.12" y="613" text-anchor="middle">upload, delete, health, metrics</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="780.8" y="560" width="332.8" height="70" rx="12" fill="#FFFFFF" stroke="#C99A35" stroke-width="1.92"/>
    <text class="cardTitle" x="947.2" y="589" text-anchor="middle">VIPS Java 25</text>
    <text class="cardText" x="947.2" y="613" text-anchor="middle">decode, resize, WebP encode</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="1274.88" y="560" width="332.8" height="70" rx="12" fill="#FFFFFF" stroke="#C99A35" stroke-width="1.92"/>
