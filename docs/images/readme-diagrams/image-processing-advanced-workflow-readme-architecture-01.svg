    <text class="cardText" x="751.36" y="398" text-anchor="middle">timeout and request semaphore</text>
    <text class="cardText" x="751.36" y="421" text-anchor="middle">T1 start, T2 success, T3 failure</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="1047.04" y="354" width="404.48" height="82" rx="12" fill="#FFFFFF" stroke="#86B89B" stroke-width="1.92"/>
