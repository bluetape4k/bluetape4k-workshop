<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1894.4" height="920" viewBox="0 0 1894.4 920" role="img" aria-label="image-processing advanced workflow architecture diagram">
  <defs>
