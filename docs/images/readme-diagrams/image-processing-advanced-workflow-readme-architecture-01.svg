    <text class="cardTitle" x="678.4" y="174" text-anchor="middle">POST /api/images/derivatives</text>
    <text class="cardText" x="678.4" y="198" text-anchor="middle">multipart upload, 201 response</text>
  </g>
  <g filter="url(#shadow)">
