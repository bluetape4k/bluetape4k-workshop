<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1480" height="920" viewBox="0 0 1480 920" role="img" aria-label="image-processing advanced workflow architecture diagram">
  <defs>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="124%"><feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#64748B" flood-opacity="0.18"/></filter>
    <marker id="arrowBlue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 12 6 L 0 12 Z" fill="#2563EB"/></marker>
    <marker id="arrowGreen" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 12 6 L 0 12 Z" fill="#16A34A"/></marker>
    <marker id="arrowAmber" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 12 6 L 0 12 Z" fill="#C47A12"/></marker>
    <marker id="arrowRose" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 12 6 L 0 12 Z" fill="#D14F6B"/></marker>
    <style>
      .canvas { fill: #F8FAFC; }
      .frame { fill: #FFFFFF; stroke: #D6E0E8; stroke-width: 1.4; }
      .title { font-family: "Architects Daughter"; font-size: 34px; fill: #102033; }
      .subtitle { font-family: "Comic Mono"; font-size: 14px; fill: #51606F; }
      .layerTitle { font-family: "Architects Daughter"; font-size: 22px; fill: #102033; }
      .layerNote { font-family: "Comic Mono"; font-size: 13px; fill: #526273; }
      .cardTitle { font-family: "Architects Daughter"; font-size: 23px; fill: #102033; }
      .cardText { font-family: "Comic Mono"; font-size: 14px; fill: #415166; }
      .line { fill: none; stroke-width: 3.2; stroke-linecap: round; stroke-linejoin: round; }
    </style>
    <g id="s3Icon">
      <rect x="0" y="0" width="46" height="46" rx="8" fill="#7AA116"/>
      <ellipse cx="23" cy="14" rx="14" ry="5" fill="#FFFFFF" opacity="0.92"/>
      <path d="M 9 14 V 31 C 9 36 37 36 37 31 V 14" fill="none" stroke="#FFFFFF" stroke-width="3"/>
      <path d="M 12 25 C 18 29 28 29 34 25" fill="none" stroke="#FFFFFF" stroke-width="2.2"/>
    </g>
    <g id="folderIcon">
      <path d="M 4 14 H 18 L 23 20 H 42 V 38 H 4 Z" fill="#FDE68A" stroke="#B45309" stroke-width="2"/>
      <path d="M 4 20 H 42" stroke="#B45309" stroke-width="2"/>
    </g>
    <g id="dbIcon">
      <ellipse cx="24" cy="10" rx="18" ry="7" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
      <path d="M 6 10 V 38 C 6 47 42 47 42 38 V 10" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
      <path d="M 6 24 C 6 33 42 33 42 24" fill="none" stroke="#2563EB" stroke-width="2"/>
      <path d="M 6 38 C 6 47 42 47 42 38" fill="none" stroke="#2563EB" stroke-width="2"/>
    </g>
  </defs>
  <rect class="canvas" width="1480" height="920"/>
  <rect class="frame" x="18" y="18" width="1444" height="884" rx="24"/>
  <text class="title" x="740" y="58" text-anchor="middle">image-processing-advanced-workflow</text>
  <text class="subtitle" x="740" y="84" text-anchor="middle">Upload validation, Java 25 VIPS derivatives, object storage, public URLs, and persistent job history</text>

  <rect x="54" y="116" width="1372" height="132" rx="20" fill="#EAF3FF" stroke="#9DB9D8" stroke-width="1.5"/>
  <text class="layerTitle" x="86" y="150">HTTP API</text>
  <text class="layerNote" x="86" y="174">create derivatives and read persisted status</text>
  <g filter="url(#shadow)">
    <rect x="380" y="146" width="300" height="74" rx="12" fill="#FFFFFF" stroke="#8EA9C2" stroke-width="1.5"/>
    <text class="cardTitle" x="530" y="174" text-anchor="middle">POST /api/images/derivatives</text>
    <text class="cardText" x="530" y="198" text-anchor="middle">multipart upload, 201 response</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="800" y="146" width="300" height="74" rx="12" fill="#FFFFFF" stroke="#8EA9C2" stroke-width="1.5"/>
    <text class="cardTitle" x="950" y="174" text-anchor="middle">GET asset and history</text>
    <text class="cardText" x="950" y="198" text-anchor="middle">detail, jobs, step events</text>
  </g>

  <rect x="54" y="280" width="1372" height="190" rx="20" fill="#EAF8F0" stroke="#93C5A7" stroke-width="1.5"/>
  <text class="layerTitle" x="86" y="314">Workflow service</text>
  <g filter="url(#shadow)">
    <rect x="112" y="354" width="260" height="82" rx="12" fill="#FFFFFF" stroke="#86B89B" stroke-width="1.5"/>
    <text class="cardTitle" x="242" y="384" text-anchor="middle">UploadImageValidator</text>
    <text class="cardText" x="242" y="410" text-anchor="middle">size, MIME, magic bytes</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="416" y="342" width="342" height="106" rx="12" fill="#F7FFF9" stroke="#86B89B" stroke-width="1.5"/>
    <text class="cardTitle" x="587" y="372" text-anchor="middle">ImageDerivativeWorkflowService</text>
    <text class="cardText" x="587" y="398" text-anchor="middle">timeout and request semaphore</text>
    <text class="cardText" x="587" y="421" text-anchor="middle">T1 start, T2 success, T3 failure</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="818" y="354" width="316" height="82" rx="12" fill="#FFFFFF" stroke="#86B89B" stroke-width="1.5"/>
    <text class="cardTitle" x="976" y="384" text-anchor="middle">FfmVipsDerivativeProcessor</text>
    <text class="cardText" x="976" y="410" text-anchor="middle">thumb-128, card-320, detail-1024</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="1190" y="354" width="220" height="82" rx="12" fill="#FFFFFF" stroke="#86B89B" stroke-width="1.5"/>
    <text class="cardTitle" x="1300" y="384" text-anchor="middle">ImageKeyFactory</text>
    <text class="cardText" x="1300" y="410" text-anchor="middle">safe object keys</text>
  </g>

  <rect x="54" y="502" width="1372" height="156" rx="20" fill="#FFF7E8" stroke="#D8B86E" stroke-width="1.5"/>
  <text class="layerTitle" x="86" y="536">Bluetape4k image runtime</text>
  <g filter="url(#shadow)">
    <rect x="224" y="560" width="260" height="70" rx="12" fill="#FFFFFF" stroke="#C99A35" stroke-width="1.5"/>
    <text class="cardTitle" x="354" y="589" text-anchor="middle">ImageStorage</text>
    <text class="cardText" x="354" y="613" text-anchor="middle">upload, delete, health, metrics</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="610" y="560" width="260" height="70" rx="12" fill="#FFFFFF" stroke="#C99A35" stroke-width="1.5"/>
    <text class="cardTitle" x="740" y="589" text-anchor="middle">VIPS Java 25</text>
    <text class="cardText" x="740" y="613" text-anchor="middle">decode, resize, WebP encode</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="996" y="560" width="260" height="70" rx="12" fill="#FFFFFF" stroke="#C99A35" stroke-width="1.5"/>
    <text class="cardTitle" x="1126" y="589" text-anchor="middle">PublicImageUrlResolver</text>
    <text class="cardText" x="1126" y="613" text-anchor="middle">unsigned public URLs</text>
  </g>

  <rect x="54" y="690" width="1372" height="132" rx="20" fill="#F2F5F8" stroke="#B3BFCA" stroke-width="1.5"/>
  <text class="layerTitle" x="86" y="724">Infrastructure targets</text>
  <g filter="url(#shadow)">
    <rect x="236" y="732" width="250" height="64" rx="12" fill="#FFFFFF" stroke="#A7B3BF" stroke-width="1.5"/>
    <use href="#folderIcon" x="254" y="742"/>
    <text class="cardTitle" x="384" y="760" text-anchor="middle">Local storage</text>
    <text class="cardText" x="384" y="783" text-anchor="middle">default backend</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="566" y="732" width="250" height="64" rx="12" fill="#FFFFFF" stroke="#A7B3BF" stroke-width="1.5"/>
    <use href="#s3Icon" x="586" y="741"/>
    <text class="cardTitle" x="706" y="760" text-anchor="middle">S3 bucket</text>
    <text class="cardText" x="706" y="783" text-anchor="middle">production option</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="910" y="732" width="250" height="64" rx="12" fill="#FFFFFF" stroke="#A7B3BF" stroke-width="1.5"/>
    <use href="#dbIcon" x="928" y="740"/>
    <text class="cardTitle" x="1048" y="760" text-anchor="middle">PostgreSQL</text>
    <text class="cardText" x="1048" y="783" text-anchor="middle">assets, jobs, events</text>
  </g>

  <path class="line" d="M 530 220 L 530 264 L 592 264 L 592 342" stroke="#2563EB" marker-end="url(#arrowBlue)"/>
  <path class="line" d="M 950 220 L 950 264 L 592 264 L 592 342" stroke="#2563EB" marker-end="url(#arrowBlue)"/>
  <path class="line" d="M 372 395 L 416 395" stroke="#16A34A" marker-end="url(#arrowGreen)"/>
  <path class="line" d="M 758 395 L 818 395" stroke="#16A34A" marker-end="url(#arrowGreen)"/>
  <path class="line" d="M 1134 395 L 1190 395" stroke="#16A34A" marker-end="url(#arrowGreen)"/>
  <path class="line" d="M 587 448 L 587 486 L 354 486 L 354 560" stroke="#C47A12" marker-end="url(#arrowAmber)"/>
  <path class="line" d="M 976 436 L 976 486 L 740 486 L 740 560" stroke="#C47A12" marker-end="url(#arrowAmber)"/>
  <path class="line" d="M 1300 436 L 1300 486 L 1126 486 L 1126 560" stroke="#C47A12" marker-end="url(#arrowAmber)"/>
  <path class="line" d="M 354 630 L 354 732" stroke="#D14F6B" marker-end="url(#arrowRose)"/>
  <path class="line" d="M 354 630 L 354 674 L 706 674 L 706 732" stroke="#D14F6B" marker-end="url(#arrowRose)"/>
  <path class="line" d="M 587 448 L 587 674 L 1048 674 L 1048 732" stroke="#D14F6B" marker-end="url(#arrowRose)"/>
</svg>
