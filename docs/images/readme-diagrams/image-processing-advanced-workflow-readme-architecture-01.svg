  <rect class="canvas" width="1894.4" height="920"/>
  <rect class="frame" x="23.04" y="18" width="1848.32" height="884" rx="24"/>
  <text class="title" x="947.2" y="58" text-anchor="middle">image-processing-advanced-workflow</text>
  <text class="subtitle" x="947.2" y="84" text-anchor="middle">Upload validation, Java 25 VIPS derivatives, object storage, public URLs, and persistent job history</text>

  <rect x="69.12" y="116" width="1756.16" height="132" rx="20" fill="#EAF3FF" stroke="#9DB9D8" stroke-width="1.92"/>
  <text class="layerTitle" x="110.08" y="150">HTTP API</text>
  <text class="layerNote" x="110.08" y="174">create derivatives and read persisted status</text>
  <g filter="url(#shadow)">
