<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" role="img" aria-label="Observability Basic Architecture">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#1f2937" flood-opacity="0.10"/></filter>
  <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth">
    <path d="M1,1 L8,4.5 L1,8 Z" fill="#758297"/>
  </marker>
  <style>
    .canvas{fill:#f7f9fc}.frame{fill:#fff;stroke:#d8e0ea;stroke-width:1.5}
    .title{font-family:"Architects Daughter";font-size:38px;font-weight:400;fill:#102033}
    .subtitle{font-family:"Comic Mono";font-size:14px;font-weight:400;fill:#536273}
    .smallLabel{font-family:"Architects Daughter";font-size:21px;font-weight:400;fill:#102033}
    .mono{font-family:"Comic Mono";font-size:12px;font-weight:400;fill:#102033}
    .small{font-family:"Comic Mono";font-size:12px;font-weight:400;fill:#536273}
    .card{stroke-width:2.1;filter:url(#shadow)}
    .line{stroke:#758297;stroke-width:2.1;fill:none;marker-end:url(#arrow)}
  </style>
</defs>
<!-- Layout:
     Canvas: 960×480  Frame: x=24 y=20 w=912 h=436
     Row1  y=98  h=54  OrderController center x=260 w=440 cx=480
     Row2  y=212 h=80  Col1: x=24 w=420 cx=234 (OrderService)
                        Col2: x=516 w=420 cx=726 (InventoryClient)
     Row3  y=352 h=80  Span Hierarchy full width x=24 w=912
     Bus1 y=182: Row1→Row2 connector hub
     Bus2 y=332: Row2→Row3 connector hub
     Gap: col1 right=444 < col2 left=516 ✓ (gap=72px)
-->
<rect class="canvas" width="960" height="480"/>
<rect class="frame" x="24" y="20" width="912" height="436" rx="28"/>
<text class="title" x="58" y="66">Observability Basic</text>
<text class="subtitle" x="58" y="92">OrderController · observed() · InventoryClient · WebClient · Micrometer Span Propagation</text>

<!-- Arrows -->
<!-- OrderController → OrderService + InventoryClient (fan-out via bus y=182, both from controller bottom) -->
<path class="line" d="M480 152 L480 182 L234 182 L234 212"/>
<path class="line" d="M480 152 L480 182 L726 182 L726 212"/>
<!-- OrderService + InventoryClient → Span Hierarchy (converge via bus y=332) -->
<path class="line" d="M234 292 L234 332 L480 332 L480 352"/>
<path class="line" d="M726 292 L726 332 L480 332 L480 352"/>

<!-- OrderController (center top) -->
<g transform="translate(260,98)">
  <rect class="card" x="0" y="0" width="440" height="54" rx="12" fill="#E8F3FF" stroke="#5B8DEF"/>
  <text class="smallLabel" x="220" y="22" text-anchor="middle">OrderController</text>
  <text class="mono" x="220" y="42" text-anchor="middle">@RestController · GET /orders/{id} · suspend fun</text>
</g>

<!-- OrderService col1 -->
<g transform="translate(24,212)">
  <rect class="card" x="0" y="0" width="420" height="80" rx="12" fill="#EAF7EF" stroke="#58A978"/>
  <text class="smallLabel" x="210" y="22" text-anchor="middle">OrderService</text>
  <text class="mono" x="210" y="44" text-anchor="middle">observed("order.service.fetch", registry)</text>
  <text class="small" x="210" y="64" text-anchor="middle">CancellationException rethrown · stop() in finally</text>
</g>

<!-- InventoryClient col2 -->
<g transform="translate(516,212)">
  <rect class="card" x="0" y="0" width="420" height="80" rx="12" fill="#FFF3D9" stroke="#D6A441"/>
  <text class="smallLabel" x="210" y="22" text-anchor="middle">InventoryClient</text>
  <text class="mono" x="210" y="44" text-anchor="middle">WebClient.get("/inventory/{id}")</text>
  <text class="small" x="210" y="64" text-anchor="middle">W3C traceparent · awaitBodyOrNull → MockWebServer</text>
</g>

<!-- Span Hierarchy (full width bottom) -->
<g transform="translate(24,352)">
  <rect class="card" x="0" y="0" width="912" height="80" rx="12" fill="#E9F7F6" stroke="#45A7A1"/>
  <text class="smallLabel" x="456" y="22" text-anchor="middle">Span Hierarchy · ObservationRegistry</text>
  <text class="mono" x="456" y="44" text-anchor="middle">http.server.requests  →  order.service.fetch  →  http.client.requests</text>
  <text class="small" x="456" y="64" text-anchor="middle">TestObservationRegistry · MockWebServer · W3C trace context propagation</text>
</g>
</svg>
