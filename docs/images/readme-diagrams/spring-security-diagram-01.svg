<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" role="img" aria-label="Spring Security Architecture Overview">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%">
    <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#1f2937" flood-opacity="0.10"/>
  </filter>
  <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth">
    <path d="M1,1 L8,4.5 L1,8 Z" fill="#758297"/>
  </marker>
  <style>
    .canvas{fill:#f7f9fc}.frame{fill:#fff;stroke:#d8e0ea;stroke-width:1.5}
    .title{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:38px;font-weight:400;fill:#102033}
    .subtitle{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:14px;font-weight:400;fill:#536273}
    .smallLabel{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:21px;font-weight:400;fill:#102033}
    .mono{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#102033}
    .small{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#536273}
    .card{stroke-width:2.1;filter:url(#shadow)}
    .line{stroke:#758297;stroke-width:2.1;fill:none;marker-end:url(#arrow)}
  </style>
</defs>
<rect class="canvas" width="960" height="440"/>
<rect class="frame" x="24" y="20" width="912" height="396" rx="20"/>
<text class="title" x="48" y="66">Spring Security Architecture Overview</text>
<text class="subtitle" x="48" y="90">MVC Hello · WebFlux Hello · WebFlux JWT — SecurityFilterChain vs SecurityWebFilterChain</text>

<!-- Col 1: MVC Hello -->
<rect class="card" x="48" y="108" width="264" height="36" rx="8" fill="#E8F3FF" stroke="#5B8DEF"/>
<text class="smallLabel" x="180" y="132" text-anchor="middle">MVC Hello</text>

<rect class="card" x="48" y="156" width="264" height="56" rx="10" fill="#ffffff" stroke="#5B8DEF" stroke-width="1.8" filter="url(#shadow)"/>
<text class="mono" x="180" y="178" text-anchor="middle" fill="#102033">SecurityFilterChain</text>
<text class="small" x="180" y="196" text-anchor="middle">Spring MVC / Servlet</text>

<rect class="card" x="48" y="224" width="264" height="56" rx="10" fill="#ffffff" stroke="#5B8DEF" stroke-width="1.8" filter="url(#shadow)"/>
<text class="mono" x="180" y="246" text-anchor="middle" fill="#102033">InMemoryUserDetails</text>
<text class="small" x="180" y="264" text-anchor="middle">BCryptPasswordEncoder</text>

<rect class="card" x="48" y="292" width="264" height="56" rx="10" fill="#ffffff" stroke="#5B8DEF" stroke-width="1.8" filter="url(#shadow)"/>
<text class="mono" x="180" y="314" text-anchor="middle" fill="#102033">formLogin /log-in</text>
<text class="small" x="180" y="332" text-anchor="middle">ROLE_USER for /user/**</text>

<!-- Col 2: WebFlux Hello -->
<rect class="card" x="348" y="108" width="264" height="36" rx="8" fill="#EAF7EF" stroke="#58A978"/>
<text class="smallLabel" x="480" y="132" text-anchor="middle">WebFlux Hello</text>

<rect class="card" x="348" y="156" width="264" height="56" rx="10" fill="#ffffff" stroke="#58A978" stroke-width="1.8" filter="url(#shadow)"/>
<text class="mono" x="480" y="178" text-anchor="middle" fill="#102033">SecurityWebFilterChain</text>
<text class="small" x="480" y="196" text-anchor="middle">Spring WebFlux / Reactive</text>

<rect class="card" x="348" y="224" width="264" height="56" rx="10" fill="#ffffff" stroke="#58A978" stroke-width="1.8" filter="url(#shadow)"/>
<text class="mono" x="480" y="246" text-anchor="middle" fill="#102033">MapReactiveUserDetails</text>
<text class="small" x="480" y="264" text-anchor="middle">ServerHttpSecurity DSL</text>

<rect class="card" x="348" y="292" width="264" height="56" rx="10" fill="#ffffff" stroke="#58A978" stroke-width="1.8" filter="url(#shadow)"/>
<text class="mono" x="480" y="314" text-anchor="middle" fill="#102033">httpBasic, formLogin</text>
<text class="small" x="480" y="332" text-anchor="middle">ROLE_USER for /user/**</text>

<!-- Col 3: WebFlux JWT -->
<rect class="card" x="648" y="108" width="264" height="36" rx="8" fill="#FFF3D9" stroke="#D6A441"/>
<text class="smallLabel" x="780" y="132" text-anchor="middle">WebFlux JWT</text>

<rect class="card" x="648" y="156" width="264" height="56" rx="10" fill="#ffffff" stroke="#D6A441" stroke-width="1.8" filter="url(#shadow)"/>
<text class="mono" x="780" y="178" text-anchor="middle" fill="#102033">oauth2ResourceServer</text>
<text class="small" x="780" y="196" text-anchor="middle">{ jwt { } }</text>

<rect class="card" x="648" y="224" width="264" height="56" rx="10" fill="#ffffff" stroke="#D6A441" stroke-width="1.8" filter="url(#shadow)"/>
<text class="mono" x="780" y="246" text-anchor="middle" fill="#102033">RSA keys (public/private)</text>
<text class="small" x="780" y="264" text-anchor="middle">NimbusJwtEncoder/Decoder</text>

<rect class="card" x="648" y="292" width="264" height="56" rx="10" fill="#ffffff" stroke="#D6A441" stroke-width="1.8" filter="url(#shadow)"/>
<text class="mono" x="780" y="314" text-anchor="middle" fill="#102033">TokenController</text>
<text class="small" x="780" y="332" text-anchor="middle">POST /token → JWT</text>

<!-- Bottom band -->
<rect class="card" x="48" y="360" width="864" height="42" rx="10" fill="#E9F7F6" stroke="#45A7A1" filter="url(#shadow)"/>
<text class="small" x="480" y="386" text-anchor="middle" fill="#536273">spring-security-mvc · spring-security-webflux-hello · spring-security-webflux-jwt modules</text>
</svg>
