<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="960" viewBox="0 0 1400 960" role="img" aria-label="Exposed MVC JDBC Architecture">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#1f2937" flood-opacity="0.10"/></filter>
  <marker id="arrow" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse">
    <path d="M2,2 L12,7 L2,12 Z" fill="#758297"/>
  </marker>
  <marker id="arrowFK" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse">
    <path d="M2,2 L12,7 L2,12 Z" fill="#45A7A1"/>
  </marker>
  <style>
    .canvas{fill:#f7f9fc}.frame{fill:#fff;stroke:#d8e0ea;stroke-width:1.5}
    .title{font-family:"Architects Daughter";font-size:34px;fill:#102033}
    .subtitle{font-family:"Comic Mono";font-size:14px;fill:#536273}
    .label{font-family:"Architects Daughter";font-size:18px;fill:#102033}
    .mono{font-family:"Comic Mono";font-size:11px;fill:#536273}
    .bandlabel{font-family:"Architects Daughter";font-size:14px;fill:#758297}
    .card{stroke-width:2;filter:url(#shadow)}
    .line{stroke:#758297;stroke-width:2;fill:none;marker-end:url(#arrow)}
    .fkline{stroke:#45A7A1;stroke-width:1.8;fill:none;marker-end:url(#arrowFK);stroke-dasharray:6,3}
  </style>
</defs>
<rect class="canvas" width="1400" height="960"/>
<rect class="frame" x="28" y="24" width="1344" height="912" rx="20"/>

<text class="title" x="52" y="68">Exposed MVC JDBC</text>
<text class="subtitle" x="52" y="92">Spring MVC + Exposed JDBC + bluetape4k Repository · @Transactional · PostgreSQL</text>

<!-- Client -->
<g transform="translate(560,112)">
  <rect class="card" x="0" y="0" width="160" height="48" rx="12" fill="#E0ECFF" stroke="#4A7ADB"/>
  <text class="label" x="80" y="32" text-anchor="middle">HTTP Client</text>
</g>

<!-- Domain labels -->
<rect x="52" y="188" width="550" height="18" rx="4" fill="#E8F3FF" stroke="none"/>
<text class="bandlabel" x="327" y="202" text-anchor="middle" style="fill:#5B8DEF">Author / Book Domain</text>
<rect x="618" y="188" width="730" height="18" rx="4" fill="#EAF7EF" stroke="none"/>
<text class="bandlabel" x="983" y="202" text-anchor="middle" style="fill:#58A978">Order / Product Domain</text>

<!--
  MASTER BOUNDING BOX REFERENCE (verify ALL arrows against this):
  Ctrl:  AuthorCtrl x=72-312 y=242-310, BookCtrl x=332-572 y=242-310,
         OrderCtrl x=592-832 y=242-310, ProductCtrl x=852-1092 y=242-310
  Svc:   AuthorSvc x=72-552 y=382-450, OrderSvc x=592-1300 y=382-450
  Repo:  AuthorRepo x=72-262 y=522-590, BookRepo x=278-468 y=522-590,
         OrderRepo x=484-674 y=522-590, OrderLineRepo x=690-930 y=522-590,
         ProductRepo x=946-1186 y=522-590
  Table: same x as repos, y=662-730
  Gaps:  y=310-352, y=460-492, y=600-632, y=740-800
-->

<!-- ===== Presentation ===== -->
<rect x="52" y="212" width="1292" height="108" rx="8" fill="#E8F3FF" stroke="#B8D4F0" stroke-width="1"/>
<text class="bandlabel" x="66" y="232">Presentation</text>

<g transform="translate(72,242)"><rect class="card" x="0" y="0" width="240" height="68" rx="10" fill="#E8F3FF" stroke="#5B8DEF"/><text class="label" x="120" y="26" text-anchor="middle">AuthorController</text><text class="mono" x="120" y="46" text-anchor="middle">@RestController /api/v1/authors</text></g>
<g transform="translate(332,242)"><rect class="card" x="0" y="0" width="240" height="68" rx="10" fill="#E8F3FF" stroke="#5B8DEF"/><text class="label" x="120" y="26" text-anchor="middle">BookController</text><text class="mono" x="120" y="46" text-anchor="middle">@RestController /api/v1/books</text></g>
<g transform="translate(592,242)"><rect class="card" x="0" y="0" width="240" height="68" rx="10" fill="#E8F3FF" stroke="#5B8DEF"/><text class="label" x="120" y="26" text-anchor="middle">OrderController</text><text class="mono" x="120" y="46" text-anchor="middle">@RestController /api/v1/orders</text></g>
<g transform="translate(852,242)"><rect class="card" x="0" y="0" width="240" height="68" rx="10" fill="#E8F3FF" stroke="#5B8DEF"/><text class="label" x="120" y="26" text-anchor="middle">ProductController</text><text class="mono" x="120" y="46" text-anchor="middle">@RestController /api/v1/products</text></g>

<!-- ===== Service ===== -->
<rect x="52" y="352" width="1292" height="108" rx="8" fill="#EAF7EF" stroke="#B0DAC0" stroke-width="1"/>
<text class="bandlabel" x="66" y="372">Service</text>

<g transform="translate(72,382)"><rect class="card" x="0" y="0" width="480" height="68" rx="10" fill="#EAF7EF" stroke="#58A978"/><text class="label" x="240" y="26" text-anchor="middle">AuthorService</text><text class="mono" x="240" y="46" text-anchor="middle">@Transactional · readOnly on reads</text></g>
<g transform="translate(592,382)"><rect class="card" x="0" y="0" width="708" height="68" rx="10" fill="#EAF7EF" stroke="#58A978"/><text class="label" x="354" y="26" text-anchor="middle">OrderService</text><text class="mono" x="354" y="46" text-anchor="middle">@Transactional · lock ordering · FOR UPDATE</text></g>

<!-- ===== Repository ===== -->
<rect x="52" y="492" width="1292" height="108" rx="8" fill="#F1ECFF" stroke="#C8B8E8" stroke-width="1"/>
<text class="bandlabel" x="66" y="512">Repository</text>

<g transform="translate(72,522)"><rect class="card" x="0" y="0" width="190" height="68" rx="10" fill="#F1ECFF" stroke="#8A72D6"/><text class="label" x="95" y="26" text-anchor="middle">AuthorRepository</text><text class="mono" x="95" y="46" text-anchor="middle">: LongAuditableJdbcRepo</text></g>
<g transform="translate(278,522)"><rect class="card" x="0" y="0" width="190" height="68" rx="10" fill="#F1ECFF" stroke="#8A72D6"/><text class="label" x="95" y="26" text-anchor="middle">BookRepository</text><text class="mono" x="95" y="46" text-anchor="middle">: LongJdbcRepository</text></g>
<g transform="translate(484,522)"><rect class="card" x="0" y="0" width="190" height="68" rx="10" fill="#F1ECFF" stroke="#8A72D6"/><text class="label" x="95" y="26" text-anchor="middle">OrderRepository</text><text class="mono" x="95" y="46" text-anchor="middle">plain Exposed</text></g>
<g transform="translate(690,522)"><rect class="card" x="0" y="0" width="240" height="68" rx="10" fill="#F1ECFF" stroke="#8A72D6"/><text class="label" x="120" y="26" text-anchor="middle">OrderLineRepository</text><text class="mono" x="120" y="46" text-anchor="middle">plain Exposed</text></g>
<g transform="translate(946,522)"><rect class="card" x="0" y="0" width="240" height="68" rx="10" fill="#F1ECFF" stroke="#8A72D6"/><text class="label" x="120" y="26" text-anchor="middle">ProductRepository</text><text class="mono" x="120" y="46" text-anchor="middle">plain Exposed · forUpdate</text></g>

<!-- ===== Schema ===== -->
<rect x="52" y="632" width="1292" height="108" rx="8" fill="#FFF3D9" stroke="#E8D5A0" stroke-width="1"/>
<text class="bandlabel" x="66" y="652">Schema</text>

<g transform="translate(72,662)"><rect class="card" x="0" y="0" width="190" height="68" rx="10" fill="#FFF3D9" stroke="#D6A441"/><text class="label" x="95" y="22" text-anchor="middle">AuthorTable</text><text class="mono" x="95" y="42" text-anchor="middle">AuditableLongIdTable</text><text class="mono" x="95" y="58" text-anchor="middle">audit cols auto-wired</text></g>
<g transform="translate(278,662)"><rect class="card" x="0" y="0" width="190" height="68" rx="10" fill="#FFF3D9" stroke="#D6A441"/><text class="label" x="95" y="22" text-anchor="middle">BookTable</text><text class="mono" x="95" y="42" text-anchor="middle">LongIdTable</text><text class="mono" x="95" y="58" text-anchor="middle">FK → Author</text></g>
<g transform="translate(484,662)"><rect class="card" x="0" y="0" width="190" height="68" rx="10" fill="#FFF3D9" stroke="#D6A441"/><text class="label" x="95" y="22" text-anchor="middle">OrderTable</text><text class="mono" x="95" y="42" text-anchor="middle">Table</text><text class="mono" x="95" y="58" text-anchor="middle">status enum</text></g>
<g transform="translate(690,662)"><rect class="card" x="0" y="0" width="240" height="68" rx="10" fill="#FFF3D9" stroke="#D6A441"/><text class="label" x="120" y="22" text-anchor="middle">OrderLineTable</text><text class="mono" x="120" y="42" text-anchor="middle">Table</text><text class="mono" x="120" y="58" text-anchor="middle">FK → Order, Product</text></g>
<g transform="translate(946,662)"><rect class="card" x="0" y="0" width="240" height="68" rx="10" fill="#FFF3D9" stroke="#D6A441"/><text class="label" x="120" y="22" text-anchor="middle">ProductTable</text><text class="mono" x="120" y="42" text-anchor="middle">Table</text><text class="mono" x="120" y="58" text-anchor="middle">stock + price</text></g>

<!-- ===== Database ===== -->
<g transform="translate(480,800)">
  <ellipse cx="160" cy="10" rx="160" ry="18" fill="#FDECEF" stroke="#DC6B82" stroke-width="2"/>
  <rect x="0" y="10" width="320" height="40" fill="#FDECEF" stroke="#DC6B82" stroke-width="2"/>
  <line x1="0" y1="10" x2="0" y2="50" stroke="#DC6B82" stroke-width="2"/>
  <line x1="320" y1="10" x2="320" y2="50" stroke="#DC6B82" stroke-width="2"/>
  <ellipse cx="160" cy="50" rx="160" ry="18" fill="#FDECEF" stroke="#DC6B82" stroke-width="2"/>
  <text class="label" x="160" y="46" text-anchor="middle">PostgreSQL</text>
</g>

<!--
  ARROW VERIFICATION:
  All arrows checked against bounding boxes above.
  Ctrl→Svc: AuthorCtrl(192) inside AuthorSvc(72-552)✓, BookCtrl(452) inside AuthorSvc✓,
            OrderCtrl(712) inside OrderSvc(592-1300)✓, ProductCtrl(972) inside OrderSvc✓
  Svc→Repo: AuthorSvc→AuthorRepo(167): 167 in Svc(72-552)✓ straight
            AuthorSvc→BookRepo(373): 373 in Svc(72-552)✓ straight
            OrderSvc→OrderRepo(579): 579 NOT in OrderSvc(592-1300)✗ → BENT at y=476
            OrderSvc→OrderLineRepo(810): 810 in OrderSvc✓ straight
            OrderSvc→ProductRepo(1066): 1066 in OrderSvc✓ straight
  Repo→Table: all same x, straight vertical ✓
  FK: horizontal between adjacent tables ✓
  Schema→DB: single line ✓
-->

<!-- ===== ARROWS ===== -->

<!-- Client → Presentation (single) -->
<path class="line" d="M640,160 L640,210"/>

<!-- Controller → Service (all straight vertical — all centers inside parent service) -->
<path class="line" d="M192,310 L192,380"/>
<path class="line" d="M452,310 L452,380"/>
<path class="line" d="M712,310 L712,380"/>
<path class="line" d="M972,310 L972,380"/>

<!-- Service → Repository -->
<path class="line" d="M167,450 L167,520"/>
<path class="line" d="M373,450 L373,520"/>
<!-- OrderSvc(592+)→OrderRepo(center 579): bent, starts inside OrderSvc -->
<path class="line" d="M620,450 L620,476 L579,476 L579,520"/>
<path class="line" d="M810,450 L810,520"/>
<path class="line" d="M1066,450 L1066,520"/>

<!-- Repository → Table (straight vertical) -->
<path class="line" d="M167,590 L167,660"/>
<path class="line" d="M373,590 L373,660"/>
<path class="line" d="M579,590 L579,660"/>
<path class="line" d="M810,590 L810,660"/>
<path class="line" d="M1066,590 L1066,660"/>

<!-- FK (horizontal between adjacent tables) -->
<path class="fkline" d="M278,696 L264,696"/>
<path class="fkline" d="M690,696 L676,696"/>
<path class="fkline" d="M930,696 L948,696"/>

<!-- Schema → DB (single) -->
<path class="line" d="M640,740 L640,798"/>
</svg>
