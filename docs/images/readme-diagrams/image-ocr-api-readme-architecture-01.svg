<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1180" viewBox="0 0 1100 1180" role="img" aria-labelledby="title desc">
  <title id="title">Image OCR API Architecture</title>
  <desc id="desc">Multipart image uploads flow top to bottom through controller validation, decoded image checks, fallback or native OCR execution, and structured response mapping.</desc>
  <defs>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#64748B" flood-opacity="0.14"/>
    </filter>
    <marker id="arrowBlue" viewBox="0 0 10 10" markerWidth="14" markerHeight="14" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse" data-role="primary" data-tip-direction="positive-x">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#2563EB" stroke-dasharray="none" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" markerWidth="14" markerHeight="14" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse" data-role="primary" data-tip-direction="positive-x">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#15803D" stroke-dasharray="none" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" markerWidth="14" markerHeight="14" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse" data-role="primary" data-tip-direction="positive-x">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#7C3AED" stroke-dasharray="none" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .canvas{fill:#F8FAFC}.frame{fill:#FFFFFF;stroke:#CBD5E1;stroke-width:2}.title{font-family:"Architects Daughter";font-size:42px;fill:#102033}.subtitle,.cardText,.footer{font-family:"Comic Mono";fill:#415166}.subtitle{font-size:17px}.cardTitle{font-family:"Architects Daughter";font-size:27px;fill:#102033}.cardText{font-size:14px}.node rect{rx:14;filter:url(#shadow)}.line{fill:none;stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round}.blue{stroke:#2563EB;marker-end:url(#arrowBlue)}.green{stroke:#15803D;marker-end:url(#arrowGreen)}.purple{stroke:#7C3AED;marker-end:url(#arrowPurple)}.footer{font-size:14px;fill:#526272}
    </style>
  </defs>

  <rect class="canvas" width="1100" height="1180"/>
  <rect class="frame" x="28" y="24" width="1044" height="1132" rx="24"/>
  <text class="title" x="550" y="78" text-anchor="middle">Image OCR API Architecture</text>
  <text class="subtitle" x="550" y="112" text-anchor="middle">A multipart image flows top-to-bottom through validation, fallback, native OCR, and sanitized response mapping.</text>

  <g class="node" data-node="upload">
    <rect x="410" y="155" width="280" height="88" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
    <text class="cardTitle" x="550" y="191" text-anchor="middle">Multipart upload</text>
    <text class="cardText" x="550" y="217" text-anchor="middle">JPEG, PNG, or WebP</text>
  </g>

  <g class="node" data-node="controller">
    <rect x="395" y="310" width="310" height="92" fill="#F0FDF4" stroke="#15803D" stroke-width="2"/>
    <text class="cardTitle" x="550" y="346" text-anchor="middle">ImageOcrController</text>
    <text class="cardText" x="550" y="372" text-anchor="middle">multipart and language boundary</text>
  </g>

  <g class="node" data-node="validation">
    <rect x="390" y="470" width="320" height="92" fill="#FFF7ED" stroke="#EA580C" stroke-width="2"/>
    <text class="cardTitle" x="550" y="506" text-anchor="middle">Image validation</text>
    <text class="cardText" x="550" y="532" text-anchor="middle">decode, media allowlist, pixel budget</text>
  </g>

  <g class="node" data-node="fallback">
    <rect x="170" y="650" width="320" height="92" fill="#ECFEFF" stroke="#0891B2" stroke-width="2"/>
    <text class="cardTitle" x="330" y="686" text-anchor="middle">Fallback response</text>
    <text class="cardText" x="330" y="712" text-anchor="middle">UNAVAILABLE, no OCR call</text>
  </g>

  <g class="node" data-node="native">
    <rect x="610" y="650" width="320" height="92" fill="#F5F3FF" stroke="#7C3AED" stroke-width="2"/>
    <text class="cardTitle" x="770" y="686" text-anchor="middle">Bounded native OCR</text>
    <text class="cardText" x="770" y="712" text-anchor="middle">single-flight timeout + Tesseract</text>
  </g>

  <g class="node" data-node="mapping">
    <rect x="410" y="830" width="280" height="92" fill="#FDF2F8" stroke="#DB2777" stroke-width="2"/>
    <text class="cardTitle" x="550" y="866" text-anchor="middle">Response mapping</text>
    <text class="cardText" x="550" y="888" text-anchor="middle">text blocks and warnings</text>
    <text class="cardText" x="550" y="912" text-anchor="middle">nullable confidence</text>
  </g>

  <g class="node" data-node="tests">
    <rect x="410" y="990" width="280" height="92" fill="#F7FEE7" stroke="#65A30D" stroke-width="2"/>
    <text class="cardTitle" x="550" y="1026" text-anchor="middle">Smoke tests</text>
    <text class="cardText" x="550" y="1052" text-anchor="middle">fake engine, fallback, sanitized errors</text>
  </g>

  <g class="edge" data-edge="upload-&gt;controller" data-label="POST multipart">
    <path class="line blue" d="M 550 243 L 550 310"/>
  </g>
  <g class="edge" data-edge="controller-&gt;validation" data-label="validate metadata">
    <path class="line green" d="M 550 402 L 550 470"/>
  </g>
  <g class="edge" data-edge="validation-&gt;fallback" data-label="native disabled">
    <path class="line blue" d="M 505 562 L 505 606 L 330 606 L 330 650"/>
  </g>
  <g class="edge" data-edge="validation-&gt;native" data-label="native enabled">
    <path class="line purple" d="M 595 562 L 595 606 L 770 606 L 770 650"/>
  </g>
  <g class="edge" data-edge="fallback-&gt;mapping" data-label="structured fallback">
    <path class="line blue" d="M 330 742 L 330 786 L 505 786 L 505 830"/>
  </g>
  <g class="edge" data-edge="native-&gt;mapping" data-label="OCR text or failure">
    <path class="line purple" d="M 770 742 L 770 786 L 595 786 L 595 830"/>
  </g>
  <g class="edge" data-edge="mapping-&gt;tests" data-label="assert response">
    <path class="line green" d="M 550 922 L 550 990"/>
  </g>

  <rect x="120" y="1102" width="860" height="40" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
  <text class="footer" x="550" y="1127" text-anchor="middle">Reader contract: local OCR API example only; production uploads need auth, scanning, rate limits, storage, and redaction.</text>
</svg>
