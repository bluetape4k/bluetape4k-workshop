<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-label="Spring ApplicationEvent publish/subscribe sequence">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#1f2937" flood-opacity="0.10"/></filter>
  <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth">
    <path d="M1,1 L8,4.5 L1,8 Z" fill="#758297"/>
  </marker>
  <style>
    .canvas{fill:#f7f9fc}.frame{fill:#fff;stroke:#d8e0ea;stroke-width:1.5}
    .title{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:38px;font-weight:400;fill:#102033}
    .subtitle{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:14px;font-weight:400;fill:#536273}
    .smallLabel{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:21px;font-weight:400;fill:#102033}
    .mono{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#102033}
    .small{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#536273}
    .card{stroke-width:2.1;filter:url(#shadow)}
    .lifeline{stroke:#b0bbca;stroke-width:1.5;stroke-dasharray:6 4;fill:none}
    .reqArrow{stroke:#5B8DEF;stroke-width:2.1;fill:none;marker-end:url(#arrow)}
    .rspArrow{stroke:#45A7A1;stroke-width:2.1;stroke-dasharray:7 4;fill:none;marker-end:url(#arrow)}
    .msgLabel{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:13px;fill:#102033}
  </style>
</defs>
<rect class="canvas" width="960" height="520"/>
<rect class="frame" x="24" y="20" width="912" height="480" rx="22"/>

<!-- Title -->
<text class="title" x="48" y="66">ApplicationEvent — Sync Publish/Subscribe</text>
<text class="subtitle" x="52" y="88">Spring @EventListener · CustomEventPublisher → ApplicationEventPublisher → Listeners</text>

<!-- Participants: 5 actors -->
<!-- cx positions: 120, 280, 460, 640, 820 -->

<!-- CustomEventController -->
<g transform="translate(60,104)">
  <rect class="card" x="0" y="0" width="120" height="72" rx="12" fill="#E8F3FF" stroke="#5B8DEF"/>
  <text class="smallLabel" style="font-size:17px" x="60" y="26" text-anchor="middle">Custom</text>
  <text class="smallLabel" style="font-size:17px" x="60" y="50" text-anchor="middle">Event</text>
  <text class="small" x="60" y="68" text-anchor="middle">Controller</text>
</g>
<!-- CustomEventPublisher -->
<g transform="translate(220,104)">
  <rect class="card" x="0" y="0" width="120" height="72" rx="12" fill="#EAF7EF" stroke="#58A978"/>
  <text class="smallLabel" style="font-size:17px" x="60" y="26" text-anchor="middle">Custom</text>
  <text class="smallLabel" style="font-size:17px" x="60" y="50" text-anchor="middle">Event</text>
  <text class="small" x="60" y="68" text-anchor="middle">Publisher</text>
</g>
<!-- ApplicationEventPublisher -->
<g transform="translate(400,104)">
  <rect class="card" x="0" y="0" width="120" height="72" rx="12" fill="#FFF3D9" stroke="#D6A441"/>
  <text class="smallLabel" style="font-size:17px" x="60" y="26" text-anchor="middle">AppEvent</text>
  <text class="smallLabel" style="font-size:17px" x="60" y="50" text-anchor="middle">Publisher</text>
  <text class="small" x="60" y="68" text-anchor="middle">Spring</text>
</g>
<!-- CustomEventListener -->
<g transform="translate(580,104)">
  <rect class="card" x="0" y="0" width="130" height="72" rx="12" fill="#FDECEF" stroke="#DC6B82"/>
  <text class="smallLabel" style="font-size:17px" x="65" y="26" text-anchor="middle">Custom</text>
  <text class="smallLabel" style="font-size:17px" x="65" y="50" text-anchor="middle">Event</text>
  <text class="small" x="65" y="68" text-anchor="middle">Listener</text>
</g>
<!-- AnnotatedCoroutine Listener -->
<g transform="translate(770,104)">
  <rect class="card" x="0" y="0" width="130" height="72" rx="12" fill="#E9F7F6" stroke="#45A7A1"/>
  <text class="smallLabel" style="font-size:17px" x="65" y="26" text-anchor="middle">Coroutine</text>
  <text class="smallLabel" style="font-size:17px" x="65" y="50" text-anchor="middle">Event</text>
  <text class="small" x="65" y="68" text-anchor="middle">Listener</text>
</g>

<!-- Lifelines: cx = 120, 280, 460, 645, 835 -->
<line class="lifeline" x1="120" y1="176" x2="120" y2="490"/>
<line class="lifeline" x1="280" y1="176" x2="280" y2="490"/>
<line class="lifeline" x1="460" y1="176" x2="460" y2="490"/>
<line class="lifeline" x1="645" y1="176" x2="645" y2="490"/>
<line class="lifeline" x1="835" y1="176" x2="835" y2="490"/>

<!-- Step 1: Client → Controller (GET /event) -->
<text class="msgLabel" x="48" y="208">1.</text>
<text class="msgLabel" x="68" y="206" fill="#536273">GET /event?message=hello</text>
<path class="reqArrow" d="M80,210 L112,210"/>

<!-- Step 2: Controller → CustomEventPublisher: publish(message) -->
<text class="msgLabel" x="132" y="244">2. publish(message)</text>
<path class="reqArrow" d="M120,248 L272,248"/>

<!-- Step 3: CustomEventPublisher → AppEventPublisher: publishEvent(CustomEvent) -->
<text class="msgLabel" x="292" y="284">3. publishEvent(CustomEvent)</text>
<path class="reqArrow" d="M280,288 L452,288"/>

<!-- Step 4: AppEventPublisher → CustomEventListener: @EventListener -->
<text class="msgLabel" x="472" y="324">4. @EventListener(CustomEvent)</text>
<path class="reqArrow" d="M460,328 L637,328"/>

<!-- Step 5: CustomEventListener self-loop (handle event) -->
<text class="msgLabel" x="658" y="360">5. handle event (sync)</text>
<path class="reqArrow" d="M645,368 C700,368 700,390 645,390"/>

<!-- Step 6: AppEventPublisher → CoroutineListener: @EventListener suspend -->
<text class="msgLabel" x="472" y="424">6. @EventListener suspend(CustomEvent)</text>
<path class="reqArrow" d="M460,428 L827,428"/>

<!-- Step 7: CoroutineListener self-loop -->
<text class="msgLabel" x="846" y="456">7. handle (suspend)</text>
<path class="reqArrow" d="M835,464 C890,464 890,484 835,484"/>
</svg>
