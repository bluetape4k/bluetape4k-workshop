<rect class="frame" x="24" y="20" width="1222" height="1007" rx="18"/>
<text class="title" x="48" y="58">ApplicationEvent — Sync Publish/Subscribe</text>
<text class="subtitle" x="50" y="84">Spring @EventListener · CustomEventPublisher → ApplicationEventPublisher → Listeners</text>
