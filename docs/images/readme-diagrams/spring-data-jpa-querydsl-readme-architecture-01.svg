  <path class="line-orange" d="M 1300 516 L 1300 552 Q 1300 562 1290 562 L 1120 562 Q 1110 562 1110 572 L 1110 656" marker-end="url(#jq-arrow-orange)" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="line-orange" d="M 1300 516 L 1300 552 Q 1300 562 1310 562 L 1500 562 Q 1510 562 1510 572 L 1510 656" marker-end="url(#jq-arrow-orange)" stroke-linecap="round" stroke-linejoin="round"/>

