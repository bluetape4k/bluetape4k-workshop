  <path class="line-red" d="M 810 877 L 978 877" marker-end="url(#jq-arrow-red)" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="line-red" d="M 710 746 L 710 785 Q 710 795 720 795 L 1200 795 Q 1210 795 1210 805 L 1210 824" marker-end="url(#jq-arrow-red)" stroke-linecap="round" stroke-linejoin="round"/>
