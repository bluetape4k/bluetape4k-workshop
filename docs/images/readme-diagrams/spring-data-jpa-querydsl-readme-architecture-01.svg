  <rect class="canvas" x="0" y="0" width="1800" height="1000"/>
  <rect x="24" y="24" width="1752" height="952" rx="22" fill="#ffffff" stroke="#d7e0eb" stroke-width="2"/>

  <text class="title" x="900" y="72" text-anchor="middle">JPA and Querydsl repository slice</text>
  <text class="subtitle" x="900" y="102" text-anchor="middle">Repository tests drive dynamic predicates, DTO projection, and pageable Querydsl queries over a small JPA model.</text>

  <rect class="layer-test" x="80" y="140" width="1640" height="175" rx="18" stroke-width="2"/>
  <text class="layer-title" x="112" y="184">Test slice and sample data</text>
  <rect class="card-blue" x="160" y="220" width="300" height="70" rx="10" stroke-width="2"/>
  <text class="card-title" x="310" y="249" text-anchor="middle">@DataJpaTest</text>  <text class="card-small" x="310" y="272" text-anchor="middle">H2 in MySQL mode</text>
  <rect class="card-blue" x="620" y="220" width="300" height="70" rx="10" stroke-width="2"/>
  <text class="card-title" x="770" y="249" text-anchor="middle">InitMemberService</text>
  <text class="card-small" x="770" y="272" text-anchor="middle">teamA, teamB, members</text>
  <rect class="card-blue" x="1080" y="220" width="300" height="70" rx="10" stroke-width="2"/>
  <text class="card-title" x="1230" y="249" text-anchor="middle">Repository tests</text>
  <text class="card-small" x="1230" y="272" text-anchor="middle">search and paging assertions</text>

  <rect class="layer-repo" x="80" y="355" width="1640" height="190" rx="18" stroke-width="2"/>
  <text class="layer-title" x="112" y="399">Repository contracts</text>
  <rect class="card-green" x="160" y="438" width="360" height="78" rx="10" stroke-width="2"/>
  <text class="card-title" x="340" y="469" text-anchor="middle">MemberRepository</text>
  <text class="card-small" x="340" y="493" text-anchor="middle">JpaRepository + QuerydslPredicateExecutor</text>
  <rect class="card-green" x="640" y="438" width="360" height="78" rx="10" stroke-width="2"/>
  <text class="card-title" x="820" y="469" text-anchor="middle">MemberRepositoryCustom</text>
  <text class="card-small" x="820" y="493" text-anchor="middle">search, page, optimized count</text>
  <rect class="card-green" x="1120" y="438" width="360" height="78" rx="10" stroke-width="2"/>
  <text class="card-title" x="1300" y="469" text-anchor="middle">MemberRepositoryImpl</text>
  <text class="card-small" x="1300" y="493" text-anchor="middle">custom Querydsl implementation</text>

  <rect class="layer-query" x="80" y="585" width="1640" height="190" rx="18" stroke-width="2"/>
  <text class="layer-title" x="112" y="629">Querydsl composition</text>
  <rect class="card-orange" x="155" y="668" width="310" height="78" rx="10" stroke-width="2"/>
  <text class="card-title" x="310" y="699" text-anchor="middle">JPAQueryFactory</text>
  <text class="card-small" x="310" y="723" text-anchor="middle">EntityManager backed queries</text>
  <rect class="card-orange" x="555" y="668" width="310" height="78" rx="10" stroke-width="2"/>
  <text class="card-title" x="710" y="699" text-anchor="middle">QMember and QTeam</text>
  <text class="card-small" x="710" y="723" text-anchor="middle">generated type-safe paths</text>
  <rect class="card-orange" x="955" y="668" width="310" height="78" rx="10" stroke-width="2"/>
  <text class="card-title" x="1110" y="699" text-anchor="middle">MemberTeamDto</text>
  <text class="card-small" x="1110" y="723" text-anchor="middle">constructor projection</text>
  <rect class="card-orange" x="1355" y="668" width="310" height="78" rx="10" stroke-width="2"/>
  <text class="card-title" x="1510" y="699" text-anchor="middle">PageableExecutionUtils</text>
  <text class="card-small" x="1510" y="723" text-anchor="middle">deferred count execution</text>

  <rect class="layer-runtime" x="80" y="815" width="1640" height="115" rx="18" stroke-width="2"/>
  <text class="layer-title" x="112" y="858">Runtime</text>
  <rect class="card-red" x="430" y="846" width="380" height="62" rx="10" stroke-width="2"/>
  <text class="card-title" x="620" y="873" text-anchor="middle">Hibernate EntityManager</text>
  <text class="card-small" x="620" y="895" text-anchor="middle">lazy Member.team association</text>
  <rect class="card-red" x="990" y="836" width="380" height="82" rx="10" stroke-width="2"/><image data-bluetape4k-icon="database" data-source="docs/icons/generic/database-server.svg" x="1002" y="860" width="34" height="34" href="data:image/svg+xml;base64," preserveAspectRatio="xMidYMid meet"/>
  <text class="card-title" x="1210" y="867" text-anchor="middle">H2 database</text>  <text class="card-small" x="1210" y="892" text-anchor="middle">MySQL compatibility mode</text>

