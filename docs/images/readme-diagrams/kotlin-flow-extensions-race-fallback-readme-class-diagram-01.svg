  <text class="card-text" x="700.0" y="262">fastestHealthy(): Flow&lt;SourceResult&gt;</text>
  <text class="card-text" x="700.0" y="284">orderedFallback(): Flow&lt;SourceResult&gt;</text>
  <text class="card-text" x="700.0" y="306">eagerFallback()/mergeContributions()</text>
  <text class="card-text" x="700.0" y="328">materialized()/dematerialized()</text>
