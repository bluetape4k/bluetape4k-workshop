  <text class="card-title" x="860.0" y="471">concat eager</text>
  <text class="card-text" x="860.0" y="505">start all sources</text>
  <text class="card-text" x="860.0" y="527">preserve order</text>
  <rect class="card-orange" x="1055" y="435" width="250" height="110" rx="16"/>
  <text class="card-title" x="1180.0" y="471">merge</text>
  <text class="card-text" x="1180.0" y="505">all contributions</text>
  <text class="card-text" x="1180.0" y="527">arrival order</text>
