<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1496.336" height="720" viewBox="0 0 1496.336 720" role="img" aria-label="graph-social-network domain model diagram">
  <defs>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="124%"><feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#64748B" flood-opacity="0.18"/></filter>
    <marker id="arrowGreen" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 12 6 L 0 12 Z" fill="#16A34A" stroke-dasharray="none" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="arrowBlue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 12 6 L 0 12 Z" fill="#2563EB" stroke-dasharray="none" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="arrowAmber" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 12 6 L 0 12 Z" fill="#C47A12" stroke-dasharray="none" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <style>
      .canvas { fill: #F8FAFC; }
      .frame { fill: #FFFFFF; stroke: #D6E0E8; stroke-width: 1.4; }
      .title { font-family: "Architects Daughter"; font-size: 34px; fill: #102033; }
      .subtitle { font-family: "Comic Mono"; font-size: 14px; fill: #51606F; }
      .cardTitle { font-family: "Architects Daughter"; font-size: 28px; fill: #102033; }
      .cardText { font-family: "Comic Mono"; font-size: 15px; fill: #415166; }
      .edgeTitle { font-family: "Architects Daughter"; font-size: 21px; fill: #102033; }
      .edgeText { font-family: "Comic Mono"; font-size: 13px; fill: #415166; }
      .line { fill: none; stroke-width: 3.2; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>
  <rect class="canvas" width="1496.336" height="720"/>
  <rect class="frame" x="21.721" y="18" width="1452.894" height="684" rx="24"/>
  <text class="title" x="748.168" y="58" text-anchor="middle">Social network schema</text>
  <text class="subtitle" x="748.168" y="84" text-anchor="middle">Person-to-person edges stay separate from Person-to-company work history.</text>

  <g filter="url(#shadow)">
    <rect x="142.393" y="278" width="374.084" height="184" rx="18" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2.172"/>
    <text class="cardTitle" x="329.435" y="322" text-anchor="middle">Person</text>
    <text class="cardText" x="329.435" y="358" text-anchor="middle">personId</text>
    <text class="cardText" x="329.435" y="384" text-anchor="middle">name</text>
    <text class="cardText" x="329.435" y="410" text-anchor="middle">title</text>
    <text class="cardText" x="329.435" y="436" text-anchor="middle">location</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="979.859" y="278" width="374.084" height="184" rx="18" fill="#FFF7ED" stroke="#D97706" stroke-width="2.172"/>
    <text class="cardTitle" x="1166.901" y="322" text-anchor="middle">Company</text>
    <text class="cardText" x="1166.901" y="358" text-anchor="middle">companyId</text>
    <text class="cardText" x="1166.901" y="384" text-anchor="middle">name</text>
    <text class="cardText" x="1166.901" y="410" text-anchor="middle">industry</text>
    <text class="cardText" x="1166.901" y="436" text-anchor="middle">location</text>
  </g>

  <path class="line" d="M 329.435 278 L 329.435 224 Q 329.435 228 317.368 228 L 214.797 228 Q 202.729 228 202.729 224 L 202.729 278" stroke="#16A34A" marker-end="url(#arrowGreen)" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="line" d="M 383.738 278 L 383.738 224 Q 383.738 228 395.805 228 L 498.376 228 Q 510.444 228 510.444 224 L 510.444 278" stroke="#2563EB" marker-end="url(#arrowBlue)" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="line" d="M 516.477 370 L 979.859 370" stroke="#C47A12" marker-end="url(#arrowAmber)" stroke-linecap="round" stroke-linejoin="round"/>

  <g filter="url(#shadow)">
    <rect x="154.461" y="128" width="287.2" height="84" rx="14" fill="#FFFFFF" stroke="#D5E0E8" stroke-width="1.689"/>
    <text class="edgeTitle" x="298.061" y="159" text-anchor="middle">KNOWS</text>
    <text class="edgeText" x="298.061" y="184" text-anchor="middle">Person -> Person</text>
    <text class="edgeText" x="298.061" y="204" text-anchor="middle">stored as two directed edges</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="518.891" y="128" width="287.2" height="84" rx="14" fill="#FFFFFF" stroke="#D5E0E8" stroke-width="1.689"/>
    <text class="edgeTitle" x="662.491" y="159" text-anchor="middle">FOLLOWS</text>
    <text class="edgeText" x="662.491" y="184" text-anchor="middle">Person -> Person</text>
    <text class="edgeText" x="662.491" y="204" text-anchor="middle">one directed edge only</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="603.361" y="512" width="289.613" height="92" rx="14" fill="#FFFFFF" stroke="#D5E0E8" stroke-width="1.689"/>
    <text class="edgeTitle" x="748.168" y="544" text-anchor="middle">WORKS_AT</text>
    <text class="edgeText" x="748.168" y="570" text-anchor="middle">Person -> Company</text>
    <text class="edgeText" x="748.168" y="590" text-anchor="middle">role, startDate, isCurrent</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="938.83" y="128" width="362.017" height="104" rx="16" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.689"/>
    <text class="edgeTitle" x="1119.839" y="162" text-anchor="middle">Query boundaries</text>
    <text class="edgeText" x="1119.839" y="190" text-anchor="middle">degree and FOAF use KNOWS only</text>
    <text class="edgeText" x="1119.839" y="212" text-anchor="middle">colleagues cross WORKS_AT</text>
  </g>
</svg>
