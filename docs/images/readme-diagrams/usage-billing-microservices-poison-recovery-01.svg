<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="1020" viewBox="0 0 1700 1020" role="img" aria-labelledby="title desc" data-diagram-kind="sequence">
  <title id="title">Poison isolation and audited redrive</title>
  <desc id="desc">Query makes a permanent schema or digest failure durable, while unrelated aggregates keep moving.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,6 L0,12 Z" fill="#356a91" stroke="#356a91"/></marker>
    <marker id="amberArrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,6 L0,12 Z" fill="#a67331" stroke="#a67331"/></marker>
    <marker id="greenArrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,6 L0,12 Z" fill="#4f7b59" stroke="#4f7b59"/></marker>
    <style>
      .title{font:700 36px 'Architects Daughter',sans-serif;fill:#20384b}.subtitle{font:18px 'Comic Mono',monospace;fill:#536d80}.heading{font:700 23px 'Architects Daughter',sans-serif;fill:#20384b}.label{font:700 18px 'Comic Mono',monospace;fill:#20384b}.whiteLabel{font:700 18px 'Comic Mono',monospace;fill:#fff}.whiteSmall{font:14px 'Comic Mono',monospace;fill:#dce8f0}.copy{font:16px 'Comic Mono',monospace;fill:#405a6e}.small{font:14px 'Comic Mono',monospace;fill:#536d80}.flow{fill:none;stroke:#356a91;stroke-width:4;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}.recovery{fill:none;stroke:#a67331;stroke-width:4;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#amberArrow)}.local{fill:none;stroke:#4f7b59;stroke-width:4;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#greenArrow)}.lifeline{stroke:#92a7b7;stroke-width:2;stroke-dasharray:8 8}.activation{fill:#c5dfec;stroke:#356a91;stroke-width:2}.frame{stroke:#6f9fbe;stroke-width:2}.frameLabel{font:700 15px 'Comic Mono',monospace;fill:#20384b}.labelPill{fill:#f8fbfd;stroke:#6f9fbe;stroke-width:1.5}.num{font:700 13px 'Comic Mono',monospace;fill:#20384b}.message{font:13px 'Comic Mono',monospace;fill:#405a6e}
    </style>
  </defs>
  <rect width="1700" height="1020" fill="#f8fbfd"/>
  <text x="70" y="72" class="title">Poison isolation and audited redrive</text>
  <text x="70" y="108" class="subtitle">Query makes a permanent schema or digest failure durable, while unrelated aggregates keep moving.</text>
  <rect x="70" y="125" width="1560" height="810" rx="28" fill="#eef5f9" stroke="#b9d0df" stroke-width="2"/>
  <g>
    <rect x="25" y="150" width="210" height="72" rx="14" fill="#fff" stroke="#6f9fbe" stroke-width="2"/>
    <text x="130" y="180" text-anchor="middle" class="label">Kafka ingress</text>
    <text x="130" y="204" text-anchor="middle" class="small">durable boundary</text>
    <line x1="130" y1="222" x2="130" y2="900" class="lifeline"/>
  </g>
<g>
    <rect x="385" y="150" width="210" height="72" rx="14" fill="#fff" stroke="#6f9fbe" stroke-width="2"/>
    <text x="490" y="180" text-anchor="middle" class="label">Query decoder</text>
    <text x="490" y="204" text-anchor="middle" class="small">durable boundary</text>
    <line x1="490" y1="222" x2="490" y2="900" class="lifeline"/>
  </g>
<g>
    <rect x="745" y="150" width="210" height="72" rx="14" fill="#fff" stroke="#6f9fbe" stroke-width="2"/>
    <text x="850" y="180" text-anchor="middle" class="label">Query DB</text>
    <text x="850" y="204" text-anchor="middle" class="small">Kafka topic</text>
    <line x1="850" y1="222" x2="850" y2="900" class="lifeline"/>
  </g>
<g>
    <rect x="1105" y="150" width="210" height="72" rx="14" fill="#fff" stroke="#6f9fbe" stroke-width="2"/>
    <text x="1210" y="180" text-anchor="middle" class="label">Operator</text>
    <text x="1210" y="204" text-anchor="middle" class="small">durable boundary</text>
    <line x1="1210" y1="222" x2="1210" y2="900" class="lifeline"/>
  </g>
<g>
    <rect x="1465" y="150" width="210" height="72" rx="14" fill="#fff" stroke="#6f9fbe" stroke-width="2"/>
    <text x="1570" y="180" text-anchor="middle" class="label">Retained source</text>
    <text x="1570" y="204" text-anchor="middle" class="small">durable boundary</text>
    <line x1="1570" y1="222" x2="1570" y2="900" class="lifeline"/>
  </g>
  <rect x="100" y="270" width="1500" height="570" rx="12" class="frame" fill="none"/>
  <path d="M100 270 H245 V302 H100" fill="#eaf3f9" stroke="#6f9fbe" stroke-width="2"/>
  <text x="118" y="292" class="frameLabel">alt  permanent contract failure</text>
  <rect x="123" y="340" width="14" height="45" class="activation"/>
      <path class="flow" d="M140 362 H480"/>
      <rect x="149.5" y="312" width="321" height="26" rx="13" class="labelPill"/>
      <text x="164.5" y="329" text-anchor="middle" class="num">1</text>
      <text x="180.5" y="329" class="message">deliver unsupported schema / bad digest</text>
<rect x="483" y="425" width="14" height="45" class="activation"/>
      <path class="flow" d="M500 447 H840"/>
      <rect x="527" y="397" width="286" height="26" rx="13" class="labelPill"/>
      <text x="542" y="414" text-anchor="middle" class="num">2</text>
      <text x="558" y="414" class="message">store quarantine metadata + reason</text>
<rect x="843" y="510" width="14" height="45" class="activation"/>
      <path class="recovery" d="M840 532 H140"/>
      <rect x="361" y="482" width="258" height="26" rx="13" class="labelPill"/>
      <text x="376" y="499" text-anchor="middle" class="num">3</text>
      <text x="392" y="499" class="message">commit offset after quarantine</text>
<rect x="1203" y="595" width="14" height="45" class="activation"/>
      <path class="flow" d="M1200 617 H860"/>
      <rect x="894" y="567" width="272" height="26" rx="13" class="labelPill"/>
      <text x="909" y="584" text-anchor="middle" class="num">4</text>
      <text x="925" y="584" class="message">inspect backlog; request redrive</text>
<rect x="843" y="680" width="14" height="45" class="activation"/>
      <path class="recovery" d="M860 702 H1560"/>
      <rect x="1046" y="652" width="328" height="26" rx="13" class="labelPill"/>
      <text x="1061" y="669" text-anchor="middle" class="num">5</text>
      <text x="1077" y="669" class="message">record auditable retained-source request</text>
<rect x="1563" y="765" width="14" height="45" class="activation"/>
      <path class="recovery" d="M1560 787 H500"/>
      <rect x="865" y="737" width="330" height="26" rx="13" class="labelPill"/>
      <text x="880" y="754" text-anchor="middle" class="num">6</text>
      <text x="896" y="754" class="message">external retrieval/republication (not implemented)</text>
  <text x="110" y="910" class="small">Messages are numbered by durable decision order. A Kafka offset advances only after the receiver commits its local inbox or quarantine decision.</text>
</svg>
