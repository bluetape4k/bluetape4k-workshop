<svg xmlns="http://www.w3.org/2000/svg" width="1378" height="540" viewBox="0 0 1378 540" role="img" aria-label="R2DBC WebFlux + Exposed Architecture">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#1f2937" flood-opacity="0.10"/></filter>
  <marker id="arrowGray" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M 1 1 L 10 5 L 1 9" fill="none" stroke="#6b7280" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <marker id="arrowBlue" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M 1 1 L 10 5 L 1 9" fill="none" stroke="#3b82f6" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <marker id="arrowAmber" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M 1 1 L 10 5 L 1 9" fill="none" stroke="#d97706" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <style>
    .canvas{fill:#f7f9fc}.frame{fill:#fff;stroke:#d8e0ea;stroke-width:1.5}
    .title{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:43px;font-weight:400;fill:#102033}
    .subtitle{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:15px;font-weight:400;fill:#536273}
    .smallLabel{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:21px;font-weight:400;fill:#102033}
    .small{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#536273}
    .zoneLabel{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:16px;font-weight:400;fill:#4b5563}
    .lineBlue{stroke:#3b82f6;stroke-width:2.1;fill:none;marker-end:url(#arrowBlue)}
    .lineGray{stroke:#6b7280;stroke-width:2.1;fill:none;marker-end:url(#arrowGray)}
    .lineAmber{stroke:#d97706;stroke-width:2.1;fill:none;marker-end:url(#arrowAmber)}
    .dashedBlue{stroke:#3b82f6;stroke-width:2.1;stroke-dasharray:7 6;fill:none;marker-end:url(#arrowBlue)}
  </style>
</defs>
<rect class="canvas" width="1378" height="540"/>
<rect class="frame" x="32" y="28" width="1314" height="484" rx="28"/>
<text class="title" x="66" y="82">R2DBC WebFlux + Exposed Architecture</text>
<text class="subtitle" x="70" y="118">WebFlux · coRouter DSL + @RestController · Exposed ORM · newSuspendedTransaction · H2/PostgreSQL</text>

<!-- API Layer zone (left) -->
<rect x="54" y="148" width="556" height="272" rx="16" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
<text class="zoneLabel" x="332" y="170" text-anchor="middle">API Layer</text>

<!-- R2DBC + Exposed zone (right) -->
<rect x="768" y="148" width="556" height="272" rx="16" fill="#fef3c7" stroke="#fcd34d" stroke-width="1.5"/>
<text class="zoneLabel" x="1046" y="170" text-anchor="middle">R2DBC + Exposed Layer</text>

<!-- UserController (API zone) -->
<rect x="104" y="184" width="250" height="64" rx="14" fill="#dbeafe" stroke="#3b82f6" stroke-width="2.1" filter="url(#shadow)"/>
<text class="smallLabel" x="229" y="209" text-anchor="middle">UserController</text>
<text class="small" x="229" y="229" text-anchor="middle">@RestController</text>

<!-- UserHandler (API zone) -->
<rect x="104" y="304" width="250" height="64" rx="14" fill="#d1fae5" stroke="#059669" stroke-width="2.1" filter="url(#shadow)"/>
<text class="smallLabel" x="229" y="329" text-anchor="middle">UserHandler</text>
<text class="small" x="229" y="349" text-anchor="middle">coRouter DSL</text>

<!-- UserExposedRepository (Exposed zone) -->
<rect x="818" y="184" width="280" height="76" rx="14" fill="#fef3c7" stroke="#d97706" stroke-width="2.1" filter="url(#shadow)"/>
<text class="smallLabel" x="958" y="211" text-anchor="middle">UserExposedRepository</text>
<text class="small" x="958" y="232" text-anchor="middle">newSuspendedTransaction</text>
<text class="small" x="958" y="250" text-anchor="middle">Exposed DSL</text>

<!-- UserSchema (Exposed zone) -->
<rect x="818" y="304" width="280" height="64" rx="14" fill="#fef9c3" stroke="#ca8a04" stroke-width="2.1" filter="url(#shadow)"/>
<text class="smallLabel" x="958" y="329" text-anchor="middle">UserSchema</text>
<text class="small" x="958" y="349" text-anchor="middle">LongIdTable (Exposed)</text>

<!-- H2/PostgreSQL cylinder -->
<rect x="893" y="456" width="130" height="40" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/>
<ellipse cx="958" cy="496" rx="65" ry="12" fill="#fde68a" stroke="#ca8a04" stroke-width="2"/>
<ellipse cx="958" cy="456" rx="65" ry="12" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/>
<text class="small" x="958" y="481" text-anchor="middle">H2 / PostgreSQL</text>

<!-- Arrows -->
<!-- UserController → UserExposedRepository (top connection) -->
<path class="lineBlue" d="M 354 216 C 586 216 586 220 818 220"/>
<!-- UserHandler → UserExposedRepository (bottom connection, curves up) -->
<path class="lineBlue" d="M 354 336 C 586 336 586 248 818 248"/>
<!-- UserExposedRepository → UserSchema -->
<path class="lineAmber" d="M 958 260 L 958 304"/>
<!-- UserSchema → H2 cylinder -->
<path class="lineAmber" d="M 958 368 L 958 456"/>
</svg>
