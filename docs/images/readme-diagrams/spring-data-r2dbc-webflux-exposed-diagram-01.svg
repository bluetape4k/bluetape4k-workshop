<svg xmlns="http://www.w3.org/2000/svg" width="960" height="460" viewBox="0 0 960 460" role="img" aria-label="WebFlux Exposed R2DBC Architecture">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#1f2937" flood-opacity="0.10"/></filter>
  <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M1,1 L8,4.5 L1,8 Z" fill="#758297"/></marker>
  <style>
    .canvas{fill:#f7f9fc}.frame{fill:#fff;stroke:#d8e0ea;stroke-width:1.5}
    .title{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:38px;font-weight:400;fill:#102033}
    .subtitle{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:14px;font-weight:400;fill:#536273}
    .smallLabel{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:21px;font-weight:400;fill:#102033}
    .mono{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#102033}
    .small{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#536273}
    .card{stroke-width:2.1;filter:url(#shadow)}
    .line{stroke:#758297;stroke-width:2.1;fill:none;marker-end:url(#arrow)}
  </style>
</defs>
<rect class="canvas" width="960" height="460"/>
<rect class="frame" x="24" y="20" width="912" height="416" rx="16"/>
<text class="title" x="48" y="66">WebFlux + Exposed R2DBC Architecture</text>
<text class="subtitle" x="48" y="90">UserController · UserHandler · UserExposedRepository → UserTable → H2/PostgreSQL</text>

<!-- Row 1: API Layer -->
<rect class="card" x="80" y="116" width="200" height="60" rx="8" fill="#E8F3FF" stroke="#5B8DEF"/>
<text class="smallLabel" x="180" y="144" text-anchor="middle">UserController</text>
<text class="small" x="180" y="163" text-anchor="middle">@RestController</text>

<rect class="card" x="330" y="116" width="200" height="60" rx="8" fill="#EAF7EF" stroke="#58A978"/>
<text class="smallLabel" x="430" y="144" text-anchor="middle">UserHandler</text>
<text class="small" x="430" y="163" text-anchor="middle">coRouter DSL</text>

<rect class="card" x="580" y="116" width="200" height="60" rx="8" fill="#FDECEF" stroke="#DC6B82"/>
<text class="smallLabel" x="680" y="144" text-anchor="middle">UserService</text>
<text class="small" x="680" y="163" text-anchor="middle">@Transactional</text>

<!-- Row 2: Repository Layer -->
<rect class="card" x="230" y="236" width="280" height="60" rx="8" fill="#FFF3D9" stroke="#D6A441"/>
<text class="smallLabel" x="370" y="264" text-anchor="middle">UserExposedRepository</text>
<text class="small" x="370" y="283" text-anchor="middle">newSuspendedTransaction + DSL</text>

<!-- Row 3: Schema + R2DBC connection -->
<rect class="card" x="130" y="350" width="200" height="60" rx="8" fill="#F1ECFF" stroke="#8A72D6"/>
<text class="smallLabel" x="230" y="378" text-anchor="middle">UserSchema</text>
<text class="small" x="230" y="396" text-anchor="middle">IntIdTable (Exposed)</text>

<rect class="card" x="390" y="350" width="220" height="60" rx="8" fill="#E9F7F6" stroke="#45A7A1"/>
<text class="smallLabel" x="500" y="378" text-anchor="middle">R2DBC Connection</text>
<text class="small" x="500" y="396" text-anchor="middle">Pool + H2 / PostgreSQL</text>

<!-- Arrows -->
<!-- Controller -> Repository -->
<path class="line" d="M180 176 L180 218 L310 218 L310 236"/>
<!-- Handler -> Repository -->
<path class="line" d="M430 176 L430 236"/>
<!-- Service -> Repository -->
<path class="line" d="M680 176 L680 218 L500 218 L500 236"/>
<!-- Repository -> Schema -->
<path class="line" d="M330 296 L330 322 L230 322 L230 350"/>
<!-- Repository -> R2DBC -->
<path class="line" d="M430 296 L430 322 L500 322 L500 350"/>
</svg>
