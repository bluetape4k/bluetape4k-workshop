<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1080" viewBox="0 0 1800 1080" role="img" aria-labelledby="title desc"><title id="title">Idempotent Usage Ingestion Sequence</title><desc id="desc">Tenant validation, short receipt transaction, domain commit, terminal CAS, replay, and conflict branches.</desc><defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="124%"><feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#64748B" flood-opacity="0.13"/></filter>
  <style>
    .bg{fill:#F8FAFC}.frame{fill:#FFFFFF;stroke:#CAD6DF;stroke-width:2}.layer{stroke-width:2}.blueLayer{fill:#EFF6FF;stroke:#A8C7EA}.greenLayer{fill:#F0F8F0;stroke:#B8D7AE}.amberLayer{fill:#FFF7E8;stroke:#DFC69A}.purpleLayer{fill:#F8F3FF;stroke:#D7C3EF}.title{font-family:"Architects Daughter";font-size:42px;fill:#263238}.subtitle,.body,.small,.footer,.msg,.legend{font-family:"Comic Mono";fill:#3E4C59}.subtitle{font-size:18px}.layerTitle{font-family:"Architects Daughter";font-size:27px;fill:#344154}.cardTitle,.participant{font-family:"Architects Daughter";font-size:23px;fill:#16202A}.body{font-size:16px}.small{font-size:13px;fill:#5B6975}.footer{font-size:14px;fill:#60727D}.card{fill:#FFFFFF;stroke:#9FB0BC;stroke-width:2}.blueCard{fill:#EFF6FF;stroke:#4F86C6}.greenCard{fill:#F0F8F0;stroke:#6E8F4F}.amberCard{fill:#FFF7E8;stroke:#9B7D54}.redCard{fill:#FFF0F0;stroke:#B86868}.purpleCard{fill:#F8F3FF;stroke:#8065A8}.connector{fill:none;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round}.blueEdge{stroke:#4F86C6;marker-end:url(#arrow-blue)}.greenEdge{stroke:#6E8F4F;marker-end:url(#arrow-green)}.amberEdge{stroke:#9B7D54;marker-end:url(#arrow-amber)}.redEdge{stroke:#B86868;marker-end:url(#arrow-red)}.purpleEdge{stroke:#8065A8;marker-end:url(#arrow-purple)}.tealEdge{stroke:#2D948C;marker-end:url(#arrow-teal)}.dashed{stroke-dasharray:9 7}.lifeline{stroke:#9AAAB1;stroke-width:2;stroke-dasharray:7 8}.activation{fill:#EAF6EF;stroke:#6F9278;stroke-width:1.5}.label{fill:#FFFFFF;stroke:#D7E0E4;stroke-width:1.5}.badge{font-family:"Comic Mono";font-size:13px;font-weight:700}.state{font-family:"Architects Daughter";font-size:22px}
  </style>
  <marker id="arrow-blue" viewBox="0 0 10 10" markerWidth="14" markerHeight="14" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#4F86C6" stroke="#4F86C6" stroke-dasharray="none"/></marker><marker id="arrow-green" viewBox="0 0 10 10" markerWidth="14" markerHeight="14" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#6E8F4F" stroke="#6E8F4F" stroke-dasharray="none"/></marker><marker id="arrow-amber" viewBox="0 0 10 10" markerWidth="14" markerHeight="14" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#9B7D54" stroke="#9B7D54" stroke-dasharray="none"/></marker><marker id="arrow-red" viewBox="0 0 10 10" markerWidth="14" markerHeight="14" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#B86868" stroke="#B86868" stroke-dasharray="none"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" markerWidth="14" markerHeight="14" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#8065A8" stroke="#8065A8" stroke-dasharray="none"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" markerWidth="14" markerHeight="14" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#2D948C" stroke="#2D948C" stroke-dasharray="none"/></marker>
  </defs><rect class="bg" width="1800" height="1080"/><rect class="frame" x="30" y="25" width="1740" height="1015" rx="22"/><text class="title" x="900" y="70" text-anchor="middle">Usage Ingestion - Two Independent Duplicate Guards</text><text class="subtitle" x="900" y="104" text-anchor="middle">The HTTP idempotency key replays a response; the source event key rejects producer duplicates independently.</text><g filter="url(#shadow)"><rect class="card" x="50" y="150" width="280" height="78" rx="12"/><text class="participant" x="190" y="182" text-anchor="middle">Client</text><text class="small" x="190" y="207" text-anchor="middle">tenant-scoped caller</text></g><line class="lifeline" x1="190" y1="228" x2="190" y2="990"/><g filter="url(#shadow)"><rect class="card" x="410" y="150" width="280" height="78" rx="12"/><text class="participant" x="550" y="182" text-anchor="middle">Tenant API</text><text class="small" x="550" y="207" text-anchor="middle">Spring Security</text></g><line class="lifeline" x1="550" y1="228" x2="550" y2="990"/><g filter="url(#shadow)"><rect class="card" x="770" y="150" width="280" height="78" rx="12"/><text class="participant" x="910" y="182" text-anchor="middle">Receipt Service</text><text class="small" x="910" y="207" text-anchor="middle">REQUIRES_NEW</text></g><line class="lifeline" x1="910" y1="228" x2="910" y2="990"/><g filter="url(#shadow)"><rect class="card" x="1130" y="150" width="280" height="78" rx="12"/><text class="participant" x="1270" y="182" text-anchor="middle">Ingestion</text><text class="small" x="1270" y="207" text-anchor="middle">Exposed transaction</text></g><line class="lifeline" x1="1270" y1="228" x2="1270" y2="990"/><g filter="url(#shadow)"><rect class="card" x="1490" y="150" width="280" height="78" rx="12"/><text class="participant" x="1630" y="182" text-anchor="middle">PostgreSQL</text><text class="small" x="1630" y="207" text-anchor="middle">durable authority</text></g><line class="lifeline" x1="1630" y1="228" x2="1630" y2="990"/><rect class="activation" x="542" y="300" width="16" height="600" rx="6"/><rect class="activation" x="902" y="365" width="16" height="200" rx="6"/><rect class="activation" x="1262" y="575" width="16" height="205" rx="6"/><rect class="activation" x="1622" y="430" width="16" height="410" rx="6"/><rect class="label labelPill" x="208" y="286" width="324" height="34" rx="17"/><circle cx="230" cy="303" r="13" fill="#FFFFFF" stroke="#4F86C6" stroke-width="2"/><text class="badge num" x="230" y="308" text-anchor="middle">1</text><text class="msg" x="252" y="308">POST usage + Idempotency-Key</text><g class="edge" data-edge="sequence-1" data-label="POST usage + Idempotency-Key"><path data-connector="sequence-1" class="connector blueEdge" d="M190 330 L550 330"/></g><rect class="label labelPill" x="550" y="351" width="360" height="34" rx="17"/><circle cx="572" cy="368" r="13" fill="#FFFFFF" stroke="#8065A8" stroke-width="2"/><text class="badge num" x="572" y="373" text-anchor="middle">2</text><text class="msg" x="594" y="373">digest key and canonical request</text><g class="edge" data-edge="sequence-2" data-label="digest key and canonical request"><path data-connector="sequence-2" class="connector purpleEdge" d="M550 395 L910 395"/></g><rect class="label labelPill" x="1280" y="416" width="351" height="34" rx="17"/><circle cx="1302" cy="433" r="13" fill="#FFFFFF" stroke="#8065A8" stroke-width="2"/><text class="badge num" x="1302" y="438" text-anchor="middle">3</text><text class="msg" x="1324" y="438">insert owner or inspect receipt</text><g class="edge" data-edge="sequence-3" data-label="insert owner or inspect receipt"><path data-connector="sequence-3" class="connector purpleEdge" d="M910 460 L1630 460"/></g><rect class="label labelPill" x="568" y="481" width="324" height="34" rx="17"/><circle cx="590" cy="498" r="13" fill="#FFFFFF" stroke="#4F86C6" stroke-width="2"/><text class="badge num" x="590" y="503" text-anchor="middle">4</text><text class="msg" x="612" y="503">Acquired / Replay / Conflict</text><g class="edge" data-edge="sequence-4" data-label="Acquired / Replay / Conflict"><path data-connector="sequence-4" class="connector tealEdge" d="M910 525 L550 525"/></g><rect class="label labelPill" x="757" y="561" width="306" height="34" rx="17"/><circle cx="779" cy="578" r="13" fill="#FFFFFF" stroke="#6E8F4F" stroke-width="2"/><text class="badge num" x="779" y="583" text-anchor="middle">5</text><text class="msg" x="801" y="583">tenant-safe ingest command</text><g class="edge" data-edge="sequence-5" data-label="tenant-safe ingest command"><path data-connector="sequence-5" class="connector greenEdge" d="M550 605 L1270 605"/></g><rect class="label labelPill" x="1238.5" y="626" width="423" height="34" rx="17"/><circle cx="1260.5" cy="643" r="13" fill="#FFFFFF" stroke="#6E8F4F" stroke-width="2"/><text class="badge num" x="1260.5" y="648" text-anchor="middle">6</text><text class="msg" x="1282.5" y="648">unique source event + server receivedAt</text><g class="edge" data-edge="sequence-6" data-label="unique source event + server receivedAt"><path data-connector="sequence-6" class="connector greenEdge" d="M1270 670 L1630 670"/></g><rect class="label labelPill" x="1320" y="691" width="260" height="34" rx="17"/><circle cx="1342" cy="708" r="13" fill="#FFFFFF" stroke="#4F86C6" stroke-width="2"/><text class="badge num" x="1342" y="713" text-anchor="middle">7</text><text class="msg" x="1364" y="713">committed usage ID</text><g class="edge" data-edge="sequence-7" data-label="committed usage ID"><path data-connector="sequence-7" class="connector tealEdge" d="M1630 735 L1270 735"/></g><rect class="label labelPill" x="572.5" y="756" width="315" height="34" rx="17"/><circle cx="594.5" cy="773" r="13" fill="#FFFFFF" stroke="#8065A8" stroke-width="2"/><text class="badge num" x="594.5" y="778" text-anchor="middle">8</text><text class="msg" x="616.5" y="778">terminal CAS by owner token</text><g class="edge" data-edge="sequence-8" data-label="terminal CAS by owner token"><path data-connector="sequence-8" class="connector purpleEdge" d="M550 800 L910 800"/></g><rect class="label labelPill" x="217" y="831" width="306" height="34" rx="17"/><circle cx="239" cy="848" r="13" fill="#FFFFFF" stroke="#4F86C6" stroke-width="2"/><text class="badge num" x="239" y="853" text-anchor="middle">9</text><text class="msg" x="261" y="853">201 or exact stored replay</text><g class="edge" data-edge="sequence-9" data-label="201 or exact stored replay"><path data-connector="sequence-9" class="connector tealEdge" d="M550 875 L190 875"/></g><rect class="frame" x="650" y="925" width="1000" height="72" rx="14" fill="none"/><text class="small" x="680" y="950">alt: same key + different fingerprint returns 409 conflict</text><text class="small" x="680" y="976">else: active lease returns 409 + Retry-After; expired lease permits owner-token takeover</text><text class="footer" x="900" y="1024" text-anchor="middle">Raw keys and bodies are never persisted, logged, or used as metric tags.</text></svg>