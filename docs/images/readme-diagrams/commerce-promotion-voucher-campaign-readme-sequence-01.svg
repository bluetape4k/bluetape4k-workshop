<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1900" viewBox="0 0 1800 1900" role="img" aria-labelledby="title desc">
  <title id="title">Voucher Allocation, Review, Redemption, Retry, and Reconciliation</title>
  <desc id="desc">A client allocates a voucher through advisory Redis admission and an authoritative PostgreSQL transaction, optionally completes review and one-time code acknowledgement, redeems the voucher, degrades safely when Redis times out, replays a stored result after response loss, and reconciles durable inbox work.</desc>
  <defs>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="124%"><feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#64748B" flood-opacity="0.14"/></filter>
    <style>
      .title{font-family:"Architects Daughter";font-size:42px;fill:#263238}.subtitle,.msg,.footer,.note{font-family:"Comic Mono";fill:#36464F}.subtitle{font-size:17px}.participant{font-family:"Architects Daughter";font-size:19px;fill:#1F3138}.role{font-family:"Comic Mono";font-size:12px;fill:#546A73}.msg{font-size:13px}.footer{font-size:14px;fill:#60727D}.frame{fill:#FBFCF8;stroke:#41545D;stroke-width:3}.header{fill:#FFFFFF;stroke:#546E7A;stroke-width:2}.lifeline{stroke:#9AAAB1;stroke-width:2;stroke-dasharray:7 8;stroke-linecap:round}.activation{fill:#EAF6EF;stroke:#6F9278;stroke-width:1.5}.call,.return{fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.http{stroke:#4F86C6;marker-end:url(#seq-blue)}.db{stroke:#6E8F4F;marker-end:url(#seq-green)}.event{stroke:#9B7D54;marker-end:url(#seq-amber)}.warning{stroke:#B86868;marker-end:url(#seq-red)}.return{stroke:#2D948C;stroke-width:2.6;stroke-dasharray:8 6;marker-end:url(#seq-teal)}.label,.labelPill{fill:#FFFFFF;stroke:#D7E0E4;stroke-width:1.5}.blueLabel{stroke:#9CC2D1}.greenLabel{stroke:#B6C9A4}.amberLabel{stroke:#C8B38F}.redLabel{stroke:#D9ABAB}.tealLabel{stroke:#9DCBC6}.badge{stroke-width:1.8}.blueBadge{fill:#EAF4F8;stroke:#4F86C6}.greenBadge{fill:#EEF7F0;stroke:#6E8F4F}.amberBadge{fill:#FFF7E8;stroke:#9B7D54}.redBadge{fill:#FFF0F0;stroke:#B86868}.tealBadge{fill:#EBFAF8;stroke:#2D948C}.badgeText,.num{font-family:"Comic Mono";font-size:12px;font-weight:700}.blueText{fill:#2F6F8E}.greenText{fill:#55783F}.amberText{fill:#7F6038}.redText{fill:#9D4F4F}.tealText{fill:#247C75}.alt{fill:none;stroke:#D08A39;stroke-width:2.2;stroke-dasharray:12 8}.divider{stroke:#D08A39;stroke-width:1.7;stroke-dasharray:9 7}.branch{fill:#FFFFFF;stroke:#D08A39;stroke-width:1.6}.branchText{font-family:"Architects Daughter";font-size:18px;fill:#8A5A22}.noteBox{fill:#FFF0F0;stroke:#B86868;stroke-width:1.7}.note{font-size:13px;fill:#8D4C4C}
    </style>
    <marker id="seq-blue" viewBox="0 0 10 10" markerWidth="16" markerHeight="16" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#4F86C6" stroke="#4F86C6" stroke-dasharray="none" style="stroke-dasharray:none"/></marker>
    <marker id="seq-green" viewBox="0 0 10 10" markerWidth="16" markerHeight="16" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#6E8F4F" stroke="#6E8F4F" stroke-dasharray="none" style="stroke-dasharray:none"/></marker>
    <marker id="seq-amber" viewBox="0 0 10 10" markerWidth="16" markerHeight="16" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#9B7D54" stroke="#9B7D54" stroke-dasharray="none" style="stroke-dasharray:none"/></marker>
    <marker id="seq-red" viewBox="0 0 10 10" markerWidth="16" markerHeight="16" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#B86868" stroke="#B86868" stroke-dasharray="none" style="stroke-dasharray:none"/></marker>
    <marker id="seq-teal" viewBox="0 0 10 10" markerWidth="16" markerHeight="16" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#2D948C" stroke="#2D948C" stroke-dasharray="none" style="stroke-dasharray:none"/></marker>
  </defs>
  <rect x="24" y="24" width="1752" height="1852" rx="20" class="frame"/>
  <text x="900" y="74" text-anchor="middle" class="title">Voucher Allocation, Review, Redemption, Retry, and Reconciliation</text>
  <text x="900" y="108" text-anchor="middle" class="subtitle">Redis may change admission evidence; PostgreSQL owns every capacity, replay, and terminal-state decision.</text>

  <g filter="url(#shadow)"><rect x="55" y="150" width="270" height="74" rx="10" class="header"/><text x="190" y="180" text-anchor="middle" class="participant">Browser / Client</text><text x="190" y="204" text-anchor="middle" class="role">customer or guarded operator</text></g>
  <g filter="url(#shadow)"><rect x="410" y="150" width="270" height="74" rx="10" class="header"/><text x="545" y="180" text-anchor="middle" class="participant">Tomcat MVC</text><text x="545" y="204" text-anchor="middle" class="role">idempotency + command boundary</text></g>
  <g filter="url(#shadow)"><rect x="765" y="150" width="270" height="74" rx="10" class="header"/><text x="900" y="180" text-anchor="middle" class="participant">Redis</text><text x="900" y="204" text-anchor="middle" class="role">admission and Bloom hints only</text></g>
  <g filter="url(#shadow)"><rect x="1120" y="150" width="270" height="74" rx="10" class="header"/><text x="1255" y="180" text-anchor="middle" class="participant">PostgreSQL</text><text x="1255" y="204" text-anchor="middle" class="role">authoritative Exposed repositories</text></g>
  <g filter="url(#shadow)"><rect x="1475" y="150" width="270" height="74" rx="10" class="header"/><text x="1610" y="180" text-anchor="middle" class="participant">Leader Worker</text><text x="1610" y="204" text-anchor="middle" class="role">durable bounded reconciliation</text></g>

  <line x1="190" y1="224" x2="190" y2="1838" class="lifeline"/><line x1="545" y1="224" x2="545" y2="1838" class="lifeline"/><line x1="900" y1="224" x2="900" y2="1838" class="lifeline"/><line x1="1255" y1="224" x2="1255" y2="1838" class="lifeline"/><line x1="1610" y1="224" x2="1610" y2="1838" class="lifeline"/>
  <rect class="activation" x="537" y="286" width="16" height="1390" rx="6"/><rect class="activation" x="892" y="350" width="16" height="220" rx="6"/><rect class="activation" x="1247" y="438" width="16" height="1402" rx="6"/><rect class="activation" x="1602" y="1700" width="16" height="140" rx="6"/>

  <rect x="230" y="258" width="290" height="34" rx="17" class="labelPill blueLabel"/><circle cx="254" cy="275" r="13" class="badge blueBadge"/><text x="254" y="280" text-anchor="middle" class="num blueText">1</text><text x="278" y="280" class="msg blueText">POST allocation + idempotency key</text><path data-connector="seq-1" d="M190 300 L545 300" class="call http"/>
  <rect x="580" y="338" width="285" height="34" rx="17" class="labelPill amberLabel"/><circle cx="604" cy="355" r="13" class="badge amberBadge"/><text x="604" y="360" text-anchor="middle" class="num amberText">2</text><text x="628" y="360" class="msg amberText">rate + Bloom advisory check</text><path data-connector="seq-2" d="M545 380 L900 380" class="call event"/>
  <rect x="590" y="418" width="620" height="34" rx="17" class="labelPill greenLabel"/><circle cx="614" cy="435" r="13" class="badge greenBadge"/><text x="614" y="440" text-anchor="middle" class="num greenText">3</text><text x="638" y="440" class="msg greenText">permit before connection / idempotency owner / campaign row lock</text><path data-connector="seq-3" d="M545 460 L1255 460" class="call db"/>
  <rect x="840" y="498" width="370" height="34" rx="17" class="labelPill tealLabel"/><circle cx="864" cy="515" r="13" class="badge tealBadge"/><text x="864" y="520" text-anchor="middle" class="num tealText">4</text><text x="888" y="520" class="msg tealText">commit 201 ALLOCATED or 202 REVIEW</text><path data-connector="seq-4" d="M1255 540 L545 540" class="return"/>
  <rect x="230" y="578" width="300" height="34" rx="17" class="labelPill tealLabel"/><circle cx="254" cy="595" r="13" class="badge tealBadge"/><text x="254" y="600" text-anchor="middle" class="num tealText">5</text><text x="278" y="600" class="msg tealText">response + one-time code if clear</text><path data-connector="seq-5" d="M545 620 L190 620" class="return"/>

  <rect x="74" y="680" width="1652" height="390" rx="18" class="alt"/><rect x="110" y="664" width="270" height="32" rx="16" class="branch"/><text x="245" y="686" text-anchor="middle" class="branchText">alt review required</text>
  <rect x="230" y="718" width="305" height="34" rx="17" class="labelPill redLabel"/><circle cx="254" cy="735" r="13" class="badge redBadge"/><text x="254" y="740" text-anchor="middle" class="num redText">6</text><text x="278" y="740" class="msg redText">operator approves review revisions</text><path data-connector="seq-6" d="M190 760 L545 760" class="call warning"/>
  <rect x="720" y="798" width="470" height="34" rx="17" class="labelPill amberLabel"/><circle cx="744" cy="815" r="13" class="badge amberBadge"/><text x="744" y="820" text-anchor="middle" class="num amberText">7</text><text x="768" y="820" class="msg amberText">commit review decision and issuable claim</text><path data-connector="seq-7" d="M545 840 L1255 840" class="call event"/>
  <rect x="230" y="878" width="300" height="34" rx="17" class="labelPill redLabel"/><circle cx="254" cy="895" r="13" class="badge redBadge"/><text x="254" y="900" text-anchor="middle" class="num redText">8</text><text x="278" y="900" class="msg redText">POST code acknowledgement</text><path data-connector="seq-8" d="M190 920 L545 920" class="call warning"/>
  <rect x="720" y="958" width="470" height="34" rx="17" class="labelPill amberLabel"/><circle cx="744" cy="975" r="13" class="badge amberBadge"/><text x="744" y="980" text-anchor="middle" class="num amberText">9</text><text x="768" y="980" class="msg amberText">persist acknowledgement / return code once</text><path data-connector="seq-9" d="M545 1000 L1255 1000" class="call event"/>

  <rect x="230" y="1098" width="310" height="34" rx="17" class="labelPill blueLabel"/><circle cx="254" cy="1115" r="13" class="badge blueBadge"/><text x="254" y="1120" text-anchor="middle" class="num blueText">10</text><text x="278" y="1120" class="msg blueText">POST redeem + code + revision</text><path data-connector="seq-10" d="M190 1140 L545 1140" class="call http"/>
  <rect x="720" y="1178" width="470" height="34" rx="17" class="labelPill greenLabel"/><circle cx="744" cy="1195" r="13" class="badge greenBadge"/><text x="744" y="1200" text-anchor="middle" class="num greenText">11</text><text x="768" y="1200" class="msg greenText">verify code / lock claim / commit REDEEMED</text><path data-connector="seq-11" d="M545 1220 L1255 1220" class="call db"/>

  <rect x="74" y="1280" width="1652" height="390" rx="18" class="alt"/><rect x="110" y="1264" width="285" height="32" rx="16" class="branch"/><text x="252" y="1286" text-anchor="middle" class="branchText">alt degraded and replay</text>
  <rect x="580" y="1318" width="280" height="34" rx="17" class="labelPill redLabel"/><circle cx="604" cy="1335" r="13" class="badge redBadge"/><text x="604" y="1340" text-anchor="middle" class="num redText">12</text><text x="628" y="1340" class="msg redText">Redis timeout / signal UNKNOWN</text><path data-connector="seq-12" d="M900 1360 L545 1360" class="call warning"/>
  <rect x="720" y="1398" width="470" height="34" rx="17" class="labelPill greenLabel"/><circle cx="744" cy="1415" r="13" class="badge greenBadge"/><text x="744" y="1420" text-anchor="middle" class="num greenText">13</text><text x="768" y="1420" class="msg greenText">continue to PostgreSQL or open review</text><path data-connector="seq-13" d="M545 1440 L1255 1440" class="call db"/>
  <line x1="74" y1="1475" x2="1726" y2="1475" class="divider"/>
  <text x="110" y="1502" class="branchText">else committed response was lost</text>
  <rect x="230" y="1528" width="300" height="34" rx="17" class="labelPill blueLabel"/><circle cx="254" cy="1545" r="13" class="badge blueBadge"/><text x="254" y="1550" text-anchor="middle" class="num blueText">14</text><text x="278" y="1550" class="msg blueText">retry identical command + key</text><path data-connector="seq-14" d="M190 1570 L545 1570" class="call http"/>
  <rect x="720" y="1598" width="470" height="34" rx="17" class="labelPill tealLabel"/><circle cx="744" cy="1615" r="13" class="badge tealBadge"/><text x="744" y="1620" text-anchor="middle" class="num tealText">15</text><text x="768" y="1620" class="msg tealText">read stored descriptor / replay exact outcome</text><path data-connector="seq-15" d="M1255 1640 L545 1640" class="return"/>

  <rect x="1285" y="1718" width="300" height="34" rx="17" class="labelPill amberLabel"/><circle cx="1309" cy="1735" r="13" class="badge amberBadge"/><text x="1309" y="1740" text-anchor="middle" class="num amberText">16</text><text x="1333" y="1740" class="msg amberText">leader claims bounded inbox batch</text><path data-connector="seq-16" d="M1610 1760 L1255 1760" class="call event"/>
  <rect x="1285" y="1788" width="300" height="34" rx="17" class="labelPill greenLabel"/><circle cx="1309" cy="1805" r="13" class="badge greenBadge"/><text x="1309" y="1810" text-anchor="middle" class="num greenText">17</text><text x="1333" y="1810" class="msg greenText">commit audit / inbox outcome once</text><path data-connector="seq-17" d="M1610 1830 L1255 1830" class="call db"/>

  <rect x="220" y="1840" width="1360" height="34" rx="12" class="noteBox"/><text x="900" y="1863" text-anchor="middle" class="note">SSE sends an authoritative snapshot first; reconnect or poll GET when streaming capacity is unavailable. Raw codes and keys stay out of logs.</text>
</svg>
