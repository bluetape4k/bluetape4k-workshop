<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="1080" viewBox="0 0 1680 1080" role="img" aria-labelledby="title desc">
  <title id="title">exposed/mvc-jdbc architecture</title>
  <desc id="desc">Spring MVC and Exposed JDBC architecture showing inherited repositories, explicit order repositories, transaction boundaries, and PostgreSQL tables.</desc>
  <defs>
    <style>
      svg{background:#f8fafc}
      .frame{fill:#ffffff;stroke:#d9e5ec;stroke-width:2}
      .title{font-family:"Architects Daughter";font-size:42px;fill:#152437}
      .subtitle,.body,.label,.footer{font-family:"Comic Mono";fill:#405260}
      .subtitle{font-size:17px}.body{font-size:15px}.label{font-size:14px}.footer{font-size:14px;fill:#617684}
      .layer{fill:#fbfdff;stroke:#dbe7ee;stroke-width:2}
      .layerTitle{font-family:"Architects Daughter";font-size:28px;fill:#213a4b}
      .card{stroke-width:2.3;rx:10}
      .web{fill:#eef7ff;stroke:#72a2c8}
      .service{fill:#f0fbf4;stroke:#73a57f}
      .repo{fill:#fff9ea;stroke:#c49c57}
      .tx{fill:#f7f2ff;stroke:#9d82c0}
      .db{fill:#fffaf2;stroke:#957636}
      .cardTitle{font-family:"Architects Daughter";font-size:27px;fill:#152437}
      .cardTitleSmall{font-family:"Architects Daughter";font-size:24px;fill:#152437}
      .chip{fill:#ffffff;stroke:#d4e0e8;stroke-width:1.4}
      .line{fill:none;stroke:#53738b;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}
      .repoLine{fill:none;stroke:#9c6f27;stroke-width:3.1;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrowRepo)}
      .txLine{fill:none;stroke:#7b66a3;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:8 7;marker-end:url(#arrowTx)}
      .schemaLine{fill:none;stroke:#6a8798;stroke-width:2.6;stroke-linecap:round;stroke-dasharray:7 7;marker-end:url(#arrowSchema)}
    </style>
    <marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="15" markerHeight="15" viewBox="0 0 10 10" refX="10" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#53738b" stroke-dasharray="none" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="arrowRepo" markerUnits="userSpaceOnUse" markerWidth="15" markerHeight="15" viewBox="0 0 10 10" refX="10" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#9c6f27" stroke-dasharray="none" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="arrowTx" markerUnits="userSpaceOnUse" markerWidth="13.5" markerHeight="13.5" viewBox="0 0 10 10" refX="10" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#7b66a3" stroke-dasharray="none" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="arrowSchema" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" viewBox="0 0 10 10" refX="10" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#6a8798" stroke-dasharray="none" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <g id="databaseIcon">
      <rect x="0" y="0" width="70" height="70" rx="12" fill="#fffaf2" stroke="#28485a" stroke-width="3"/>
      <path d="M17 23v26c0 7 36 7 36 0V23" fill="#fff0d8" stroke="#8c6f33" stroke-width="3.2" stroke-linejoin="round"/>
      <path d="M17 36c0 7 36 7 36 0" fill="none" stroke="#8c6f33" stroke-width="2.6" stroke-linecap="round"/>
      <path d="M17 49c0 7 36 7 36 0" fill="none" stroke="#8c6f33" stroke-width="2.6" stroke-linecap="round"/>
      <ellipse cx="35" cy="23" rx="18" ry="7" fill="#fff0d8" stroke="#8c6f33" stroke-width="3.2"/>
    </g>
  </defs>

  <rect class="frame" x="30" y="28" width="1620" height="1024" rx="18"/>
  <text class="title" x="840" y="82" text-anchor="middle">Spring MVC + Exposed JDBC Persistence</text>
  <text class="subtitle" x="840" y="114" text-anchor="middle">Simple CRUD uses bluetape4k repositories; order placement uses explicit locking SQL inside one Spring transaction.</text>

  <rect class="layer" x="78" y="150" width="1524" height="170" rx="15"/>
  <text class="layerTitle" x="108" y="191">Web API</text>

  <rect class="card web" x="185" y="218" width="395" height="76" rx="10"/>
  <text class="cardTitle" x="382.5" y="252" text-anchor="middle">Author + Book Controllers</text>
  <text class="body" x="382.5" y="277" text-anchor="middle">CRUD endpoints delegate without table logic</text>

  <rect class="card web" x="1100" y="218" width="395" height="76" rx="10"/>
  <text class="cardTitle" x="1297.5" y="252" text-anchor="middle">Product + Order Controllers</text>
  <text class="body" x="1297.5" y="277" text-anchor="middle">HTTP requests enter the transactional service</text>

  <rect class="layer" x="78" y="365" width="1524" height="334" rx="15"/>
  <text class="layerTitle" x="108" y="406">Service and Repository Boundary</text>

  <rect class="card service" x="170" y="455" width="330" height="92" rx="10"/>
  <text class="cardTitle" x="335" y="490" text-anchor="middle">AuthorService</text>
  <text class="body" x="335" y="516" text-anchor="middle">reads and writes Author/Book DTOs</text>

  <rect class="card repo" x="560" y="435" width="410" height="132" rx="10"/>
  <text class="cardTitle" x="765" y="472" text-anchor="middle">Inherited Repositories</text>
  <text class="body" x="765" y="500" text-anchor="middle">AuthorRepository: LongAuditableJdbcRepository</text>
  <text class="body" x="765" y="526" text-anchor="middle">BookRepository: LongJdbcRepository + findBy()</text>

  <rect class="card tx" x="170" y="602" width="490" height="54" rx="10"/>
  <text class="cardTitleSmall" x="415" y="636" text-anchor="middle">Spring @Transactional boundary</text>

  <rect class="card service" x="1035" y="435" width="300" height="132" rx="10"/>
  <text class="cardTitle" x="1185" y="472" text-anchor="middle">OrderService</text>
  <text class="body" x="1185" y="500" text-anchor="middle">sorts lines by productId</text>
  <text class="body" x="1185" y="526" text-anchor="middle">checks stock and rolls back</text>

  <rect class="card repo" x="1375" y="435" width="205" height="132" rx="10"/>
  <text class="cardTitleSmall" x="1477.5" y="470" text-anchor="middle">Order Repos</text>
  <text class="body" x="1477.5" y="499" text-anchor="middle">OrderRepository</text>
  <text class="body" x="1477.5" y="524" text-anchor="middle">OrderLineRepository</text>
  <text class="body" x="1477.5" y="549" text-anchor="middle">ProductRepository</text>

  <rect class="layer" x="78" y="748" width="1524" height="210" rx="15"/><image data-bluetape4k-icon="postgres" data-source="docs/icons/testcontainers/database/postgresql.svg" x="92.0" y="766.0" width="30" height="30" href="data:image/svg+xml;base64," preserveAspectRatio="xMidYMid meet"/>  <text class="layerTitle" x="108" y="789">PostgreSQL Tables</text>

  <rect class="card db" x="220" y="820" width="520" height="104" rx="10"/>
  <use href="#databaseIcon" x="250" y="837"/>
  <text class="cardTitle" x="500" y="858" text-anchor="middle">Author / Book Tables</text>
  <text class="body" x="500" y="884" text-anchor="middle">authors has bluetape4k audit columns</text>
  <text class="body" x="500" y="908" text-anchor="middle">books.author_id references authors.id</text>

  <rect class="card db" x="900" y="820" width="590" height="104" rx="10"/>
  <use href="#databaseIcon" x="930" y="837"/>
  <text class="cardTitle" x="1240" y="858" text-anchor="middle">Order / Product Tables</text>
  <text class="body" x="1240" y="884" text-anchor="middle">products are selected FOR UPDATE</text>
  <text class="body" x="1240" y="908" text-anchor="middle">orders and order_lines commit or roll back together</text>

  <path class="line" d="M 382.5 294 V 455" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="line" d="M 1297.5 294 V 435" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="repoLine" d="M 500 501 H 560" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="repoLine" d="M 1335 501 H 1375" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="repoLine" d="M 765 567 L 765 700 Q 765 710 755 710 L 510 710 Q 500 710 500 720 L 500 820" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="repoLine" d="M 1477.5 567 V 820" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="schemaLine" d="M 740 872 H 900" stroke-linecap="round" stroke-linejoin="round"/>
  <rect class="chip" x="762" y="850" width="136" height="30" rx="15"/>
  <text class="label" x="840" y="870" text-anchor="middle">same database</text>

  <text class="footer" x="840" y="1006" text-anchor="middle">Repository inheritance removes CRUD boilerplate; explicit order repositories keep lock and rollback behavior visible.</text>
</svg>
