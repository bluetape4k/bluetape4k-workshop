<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820">

  <defs>
    <marker id="arrow-blue" markerWidth="16" markerHeight="16" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 14 14" data-role="sequence" data-tip-direction="positive-x"><path d="M 0 0 L 14 7 L 0 14 z" fill="#2f80dc" stroke-dasharray="none"/></marker>
    <marker id="arrow-green" markerWidth="16" markerHeight="16" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 14 14" data-role="sequence" data-tip-direction="positive-x"><path d="M 0 0 L 14 7 L 0 14 z" fill="#2f9e44" stroke-dasharray="none"/></marker>
    <marker id="arrow-orange" markerWidth="16" markerHeight="16" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 14 14" data-role="sequence" data-tip-direction="positive-x"><path d="M 0 0 L 14 7 L 0 14 z" fill="#d97706" stroke-dasharray="none"/></marker>
    <marker id="arrow-purple" markerWidth="16" markerHeight="16" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 14 14" data-role="sequence" data-tip-direction="positive-x"><path d="M 0 0 L 14 7 L 0 14 z" fill="#8b5cf6" stroke-dasharray="none"/></marker>
    <marker id="arrow-red" markerWidth="16" markerHeight="16" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 14 14" data-role="sequence" data-tip-direction="positive-x"><path d="M 0 0 L 14 7 L 0 14 z" fill="#dc2626" stroke-dasharray="none"/></marker>
  </defs>
  <style>
    .bg { fill: #f4f8fc; }
    .frame { fill: #ffffff; stroke: #b9c9dc; stroke-width: 3; }
    .title { font: 46px 'Comic Sans MS', 'Marker Felt', cursive; fill: #20364f; text-anchor: middle; }
    .subtitle { font: 20px 'Menlo', monospace; fill: #56677d; text-anchor: middle; font-weight: 700; }
    .lane-blue { fill: #e8f2ff; stroke: #bdd4ee; stroke-width: 2; }
    .lane-green { fill: #eaf8f0; stroke: #b9e0c8; stroke-width: 2; }
    .lane-orange { fill: #fff4df; stroke: #e6c27d; stroke-width: 2; }
    .lane-purple { fill: #f0eafa; stroke: #c9b7f2; stroke-width: 2; }
    .card-blue { fill: #e8f2ff; stroke: #84b4ea; stroke-width: 3; }
    .card-green { fill: #eaf8f0; stroke: #82cf9a; stroke-width: 3; }
    .card-orange { fill: #fff4df; stroke: #e8b956; stroke-width: 3; }
    .card-purple { fill: #f0eafa; stroke: #ad95ec; stroke-width: 3; }
    .card-red { fill: #fff0f0; stroke: #e99a9a; stroke-width: 3; }
    .lane-title { font: 25px 'Comic Sans MS', cursive; fill: #20364f; }
    .card-title { font: 24px 'Comic Sans MS', cursive; fill: #20364f; text-anchor: middle; }
    .card-text { font: 15px 'Menlo', monospace; fill: #314158; text-anchor: middle; font-weight: 700; }
    .small { font: 13px 'Menlo', monospace; fill: #314158; text-anchor: middle; font-weight: 700; }
    .line-blue { fill: none; stroke: #2f80dc; stroke-width: 4; marker-end: url(#arrow-blue); stroke-linecap: round; stroke-linejoin: round; }
    .line-green { fill: none; stroke: #2f9e44; stroke-width: 4; marker-end: url(#arrow-green); stroke-linecap: round; stroke-linejoin: round; }
    .line-orange { fill: none; stroke: #d97706; stroke-width: 4; marker-end: url(#arrow-orange); stroke-linecap: round; stroke-linejoin: round; }
    .line-purple { fill: none; stroke: #8b5cf6; stroke-width: 4; marker-end: url(#arrow-purple); stroke-linecap: round; stroke-linejoin: round; }
    .line-red { fill: none; stroke: #dc2626; stroke-width: 4; marker-end: url(#arrow-red); stroke-linecap: round; stroke-linejoin: round; }
    .dash { stroke-dasharray: 10 9; }
    .life { fill: none; stroke: #9bb4d4; stroke-width: 2; stroke-dasharray: 8 8; stroke-linecap: round; }
  </style>

  <rect class="bg" x="0" y="0" width="1400" height="820"/>
  <rect class="frame" x="34" y="34" width="1332" height="752" rx="22"/>
  <text class="title" x="700.0" y="82">Race/Fallback Sequence</text>
  <text class="subtitle" x="700.0" y="116">Race starts candidates together; first emitted value wins and losers cancel</text>
  <rect class="card-orange" x="70" y="155" width="190" height="75" rx="16"/>
  <text class="card-title" x="165.0" y="191">Caller</text>
  <text class="card-text" x="165.0" y="225">request catalog</text>
  <rect class="card-blue" x="290" y="155" width="300" height="75" rx="16"/>
  <text class="card-title" x="440.0" y="191">RaceFallbackCatalog</text>
  <text class="card-text" x="440.0" y="225">operator choice</text>
  <rect class="card-green" x="640" y="155" width="180" height="75" rx="16"/>
  <text class="card-title" x="730.0" y="191">Cache</text>
  <text class="card-text" x="730.0" y="225">stale / fast</text>
  <rect class="card-green" x="900" y="155" width="180" height="75" rx="16"/>
  <text class="card-title" x="990.0" y="191">Replica</text>
  <text class="card-text" x="990.0" y="225">medium</text>
  <rect class="card-purple" x="1160" y="155" width="180" height="75" rx="16"/>
  <text class="card-title" x="1250.0" y="191">Remote</text>
  <text class="card-text" x="1250.0" y="225">fresh / slow</text>
  <path class="life" d="M 165 230 L 165 690"/>
  <path class="life" d="M 440 230 L 440 690"/>
  <path class="life" d="M 730 230 L 730 690"/>
  <path class="life" d="M 990 230 L 990 690"/>
  <path class="life" d="M 1250 230 L 1250 690"/>
  <path class="line-blue" d="M 165 295 L 440 295"/>
  <text class="small" x="300" y="280">1 choose race</text>
  <path class="line-green" d="M 440 350 L 730 350"/>
  <text class="small" x="590" y="335">2 start cache</text>
  <path class="line-green" d="M 440 400 L 990 400"/>
  <text class="small" x="710" y="385">3 start replica</text>
  <path class="line-purple" d="M 440 450 L 1250 450"/>
  <text class="small" x="850" y="435">4 start remote</text>
  <path class="line-green" d="M 990 510 L 440 510"/>
  <text class="small" x="720" y="495">5 first value wins</text>
  <path class="line-orange dash" d="M 440 565 L 730 565"/>
  <path class="line-orange dash" d="M 440 610 L 1250 610"/>
  <text class="small" x="870" y="595">6 cancel losing sources</text>
  <path class="line-blue" d="M 440 660 L 165 660"/>
  <text class="small" x="300" y="645">7 return winner</text>
</svg>
