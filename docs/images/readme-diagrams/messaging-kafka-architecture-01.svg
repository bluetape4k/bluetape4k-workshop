<svg xmlns="http://www.w3.org/2000/svg" width="960" height="460" viewBox="0 0 960 460" role="img" aria-label="Kafka Architecture">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#1f2937" flood-opacity="0.10"/></filter>
  <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth">
    <path d="M1,1 L8,4.5 L1,8 Z" fill="#758297"/>
  </marker>
  <style>
    .canvas{fill:#f7f9fc}.frame{fill:#fff;stroke:#d8e0ea;stroke-width:1.5}
    .title{font-family:"Architects Daughter";font-size:38px;font-weight:400;fill:#102033}
    .subtitle{font-family:"Comic Mono";font-size:14px;font-weight:400;fill:#536273}
    .smallLabel{font-family:"Architects Daughter";font-size:21px;font-weight:400;fill:#102033}
    .mono{font-family:"Comic Mono";font-size:12px;font-weight:400;fill:#102033}
    .small{font-family:"Comic Mono";font-size:12px;font-weight:400;fill:#536273}
    .card{stroke-width:2.1;filter:url(#shadow)}
    .line{stroke:#758297;stroke-width:2.1;fill:none;marker-end:url(#arrow)}
  </style>
</defs>
<!-- Layout:
     Canvas: 960×460  Frame: x=24 y=20 w=912 h=416
     Row1  y=98  h=54  GreetingController (left x=24 w=380) → KafkaBroker (right x=556 w=380)
     Row2  y=212 h=80  3 Consumers
       Col1: x=24  w=270 cx=159
       Col2: x=344 w=270 cx=479
       Col3: x=664 w=270 cx=799  right=934
     Row3  y=352 h=54  KafkaServer.Launcher (full width)
     Gap check: row1→row2=60px ✓
-->
<rect class="canvas" width="960" height="460"/>
<rect class="frame" x="24" y="20" width="912" height="416" rx="28"/>
<text class="title" x="58" y="66">Kafka Architecture</text>
<text class="subtitle" x="58" y="92">GreetingController · KafkaTemplate · KafkaBroker · Spring Kafka · KafkaServer.Launcher</text>

<!-- Arrows -->
<!-- GreetingController → Kafka Broker (horizontal) -->
<path class="line" d="M404 125 L556 125"/>
<!-- Kafka Broker → 3 consumers -->
<path class="line" d="M746 152 L746 180 L159 180 L159 212"/>
<path class="line" d="M746 152 L746 180 L479 180 L479 212"/>
<path class="line" d="M746 152 L746 180 L799 180 L799 212"/>
<!-- Consumers → KafkaServer.Launcher -->
<path class="line" d="M159 292 L159 322 L480 322 L480 352"/>
<path class="line" d="M479 292 L479 352"/>
<path class="line" d="M799 292 L799 322 L480 322 L480 352"/>

<!-- GreetingController (left) -->
<g transform="translate(24,98)">
  <rect class="card" x="0" y="0" width="380" height="54" rx="12" fill="#E8F3FF" stroke="#5B8DEF"/>
  <text class="smallLabel" x="190" y="22" text-anchor="middle">GreetingController</text>
  <text class="mono" x="190" y="42" text-anchor="middle">KafkaTemplate.send(topic, message)</text>
</g>

<!-- Kafka Broker (right) -->
<g transform="translate(556,98)">
  <rect class="card" x="0" y="0" width="380" height="54" rx="12" fill="#EAF7EF" stroke="#58A978"/>
  <text class="smallLabel" x="190" y="22" text-anchor="middle">Kafka Broker</text>
  <text class="small" x="190" y="42" text-anchor="middle">TOPIC_SIMPLE · TOPIC_GREETING · Testcontainers</text>
</g>

<!-- SimpleMessageHandler  col1 -->
<g transform="translate(24,212)">
  <rect class="card" x="0" y="0" width="270" height="80" rx="12" fill="#FFF3D9" stroke="#D6A441"/>
  <text class="smallLabel" x="135" y="22" text-anchor="middle">SimpleMessageHandler</text>
  <text class="mono" x="135" y="44" text-anchor="middle">@KafkaListener</text>
  <text class="small" x="135" y="64" text-anchor="middle">TOPIC_SIMPLE: String message</text>
</g>

<!-- GreetingMessageHandler  col2 -->
<g transform="translate(344,212)">
  <rect class="card" x="0" y="0" width="270" height="80" rx="12" fill="#F1ECFF" stroke="#8A72D6"/>
  <text class="smallLabel" x="135" y="22" text-anchor="middle">GreetingMessageHandler</text>
  <text class="mono" x="135" y="44" text-anchor="middle">@KafkaListener</text>
  <text class="small" x="135" y="64" text-anchor="middle">TOPIC_GREETING: JSON object</text>
</g>

<!-- LoggerMessageHandler  col3 -->
<g transform="translate(664,212)">
  <rect class="card" x="0" y="0" width="270" height="80" rx="12" fill="#FDECEF" stroke="#DC6B82"/>
  <text class="smallLabel" x="135" y="22" text-anchor="middle">LoggerMessageHandler</text>
  <text class="mono" x="135" y="44" text-anchor="middle">@KafkaListener</text>
  <text class="small" x="135" y="64" text-anchor="middle">all topics — logging only</text>
</g>

<!-- KafkaServer.Launcher (full width) -->
<g transform="translate(24,352)">
  <rect class="card" x="0" y="0" width="912" height="54" rx="12" fill="#E9F7F6" stroke="#45A7A1"/>
  <text class="smallLabel" x="456" y="20" text-anchor="middle">KafkaServer.Launcher.kafka</text>
  <text class="small" x="456" y="40" text-anchor="middle">bluetape4k-testcontainers · Testcontainers Kafka singleton · auto-started on app boot</text>
</g>
</svg>
