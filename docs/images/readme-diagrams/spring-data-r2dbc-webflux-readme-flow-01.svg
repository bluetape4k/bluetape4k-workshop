<svg xmlns="http://www.w3.org/2000/svg" width="1760" height="860" viewBox="0 0 1760 860">
  <defs>
    <style>
      .bg{fill:#f8fafc}.title{font-family:'Architects Daughter','Comic Sans MS',cursive;font-size:34px;fill:#18212f}
      .card-title{font-family:'Architects Daughter','Comic Sans MS',cursive;font-size:27px;fill:#101827}
      .body{font-family:'Comic Mono','Comic Sans MS',monospace;font-size:18px;fill:#364152}.small{font-family:'Comic Mono','Comic Sans MS',monospace;font-size:15px;fill:#475569}
      .card{fill:#fff;stroke:#cbd5e1;stroke-width:1.5;rx:18;ry:18}.lane{fill:#f1f5f9;stroke:#cbd5e1;stroke-width:1.3;rx:20;ry:20}
      .line{fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}.db{fill:#fff;stroke:#94a3b8;stroke-width:2}.dbtop{fill:#e0f2fe;stroke:#0284c7;stroke-width:2}
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L11,6 L1,11 Z" fill="#2563eb"/></marker>
    <marker id="arrow-green" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L11,6 L1,11 Z" fill="#059669"/></marker>
  </defs>
  <rect class="bg" width="1760" height="860"/>
  <text class="title" x="70" y="70">Users API and Database Initialization</text>

  <rect class="lane" x="80" y="125" width="760" height="585"/>
  <rect class="lane" x="920" y="125" width="760" height="585"/>
  <text class="card-title" x="120" y="175">Request path</text>
  <text class="card-title" x="960" y="175">Startup SQL path</text>

  <rect class="card" x="160" y="225" width="560" height="75"/>
  <text class="card-title" x="190" y="268">UserController or UserHandler</text>
  <rect class="card" x="160" y="365" width="560" height="75"/>
  <text class="card-title" x="190" y="408">UserService</text>
  <text class="body" x="410" y="408">transactional use cases</text>
  <rect class="card" x="160" y="505" width="560" height="75"/>
  <text class="card-title" x="190" y="548">UserRepository</text>
  <text class="body" x="420" y="548">findAll, findByEmail, save</text>

  <rect class="card" x="1000" y="225" width="560" height="75"/>
  <text class="card-title" x="1030" y="268">ConnectionFactoryInitializer</text>
  <rect class="card" x="1000" y="365" width="560" height="75"/>
  <text class="card-title" x="1030" y="408">data/schema.sql</text>
  <text class="body" x="1260" y="408">create users</text>
  <rect class="card" x="1000" y="505" width="560" height="75"/>
  <text class="card-title" x="1030" y="548">data/data.sql</text>
  <text class="body" x="1240" y="548">truncate + seed rows</text>

  <g transform="translate(710 735)">
    <path class="db" d="M0,24 C0,4 340,4 340,24 L340,76 C340,96 0,96 0,76 Z"/>
    <ellipse class="dbtop" cx="170" cy="24" rx="170" ry="22"/>
    <path class="db" d="M0,24 C0,44 340,44 340,24"/>
    <text class="card-title" x="121" y="64">users table</text>
  </g>

  <path class="line" d="M440 300 L440 365" stroke="#2563eb" marker-end="url(#arrow)"/>
  <path class="line" d="M440 440 L440 505" stroke="#2563eb" marker-end="url(#arrow)"/>
  <path class="line" d="M440 580 L790 735" stroke="#2563eb" marker-end="url(#arrow)"/>
  <path class="line" d="M1280 300 L1280 365" stroke="#059669" marker-end="url(#arrow-green)"/>
  <path class="line" d="M1280 440 L1280 505" stroke="#059669" marker-end="url(#arrow-green)"/>
  <path class="line" d="M1280 580 L970 735" stroke="#059669" marker-end="url(#arrow-green)"/>
</svg>
