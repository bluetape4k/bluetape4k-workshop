<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520">
  <defs>
    <style>
      .canvas{fill:#f7f9fc}
      .frame{fill:#fff;stroke:#d8e0ea;stroke-width:1.5}
      .title{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:38px;font-weight:400;fill:#102033}
      .subtitle{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:14px;font-weight:400;fill:#536273}
      .smallLabel{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:21px;font-weight:400;fill:#102033}
      .mono{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#102033}
      .small{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#536273}
      .card{stroke-width:2.1;filter:url(#shadow)}
      .line{stroke:#758297;stroke-width:2.1;fill:none;marker-end:url(#arrow)}
    </style>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="2" dy="4" stdDeviation="5" flood-color="#1f2937" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth">
      <path d="M1,1 L8,4.5 L1,8 Z" fill="#758297"/>
    </marker>
  </defs>

  <!-- Canvas background -->
  <rect width="960" height="520" class="canvas"/>
  <!-- Outer frame -->
  <rect x="24" y="20" width="912" height="480" rx="22" class="frame"/>

  <!-- Title -->
  <text x="480" y="65" class="title" text-anchor="middle">Exposed Architecture</text>
  <text x="480" y="87" class="subtitle" text-anchor="middle">JetBrains Exposed ORM — Web layer variations sharing SQL DSL core</text>

  <!-- ══════════════════════════════════════════════════════════════════ -->
  <!-- ROW 1: 4 Web-layer cards  y=105..215                              -->
  <!-- Layout: 4 cols, each w=192, gap=24                                -->
  <!-- x: col1=48  col2=264  col3=480  col4=696                          -->
  <!-- center: 144  360  576  792                                         -->
  <!-- ══════════════════════════════════════════════════════════════════ -->

  <!-- Col 1: sql-webflux-coroutines — blue -->
  <rect x="48" y="105" width="192" height="110" rx="14" class="card" fill="#E8F3FF" stroke="#5B8DEF"/>
  <text x="144" y="138" class="smallLabel" text-anchor="middle">sql-webflux</text>
  <text x="144" y="160" class="smallLabel" text-anchor="middle">coroutines</text>
  <text x="144" y="181" class="small" text-anchor="middle">WebFlux + Coroutines</text>
  <text x="144" y="197" class="mono" text-anchor="middle">Reactive async</text>

  <!-- Col 2: sql-web-virtualthread — green -->
  <rect x="264" y="105" width="192" height="110" rx="14" class="card" fill="#EAF7EF" stroke="#58A978"/>
  <text x="360" y="138" class="smallLabel" text-anchor="middle">sql-web</text>
  <text x="360" y="160" class="smallLabel" text-anchor="middle">virtualthread</text>
  <text x="360" y="181" class="small" text-anchor="middle">WebMVC + Virtual Threads</text>
  <text x="360" y="197" class="mono" text-anchor="middle">Blocking on VT</text>

  <!-- Col 3: dao-web-transaction — amber -->
  <rect x="480" y="105" width="192" height="110" rx="14" class="card" fill="#FFF3D9" stroke="#D6A441"/>
  <text x="576" y="138" class="smallLabel" text-anchor="middle">dao-web</text>
  <text x="576" y="160" class="smallLabel" text-anchor="middle">transaction</text>
  <text x="576" y="181" class="small" text-anchor="middle">DAO + @Transactional</text>
  <text x="576" y="197" class="mono" text-anchor="middle">Spring TX manager</text>

  <!-- Col 4: spring-transaction — lavender -->
  <rect x="696" y="105" width="192" height="110" rx="14" class="card" fill="#F1ECFF" stroke="#8A72D6"/>
  <text x="792" y="138" class="smallLabel" text-anchor="middle">spring</text>
  <text x="792" y="160" class="smallLabel" text-anchor="middle">transaction</text>
  <text x="792" y="181" class="small" text-anchor="middle">Spring @Transactional</text>
  <text x="792" y="197" class="mono" text-anchor="middle">Declarative TX</text>

  <!-- ═══════════════════════════════════════════════════════════════ -->
  <!-- Arrows: each web card → domain band (orthogonal)               -->
  <!-- Domain top y=265  center x=480                                  -->
  <!-- Each card bottom y=215  centers: 144, 360, 576, 792            -->
  <!-- Route: card bottom → down to y=245 → toward 480 → down to 265 -->
  <!-- ═══════════════════════════════════════════════════════════════ -->

  <!-- Col1 (144,215) → down y=245 → right to (480,245) → down to (480,265) -->
  <path d="M 144,215 L 144,245 L 480,245 L 480,265" class="line"/>

  <!-- Col2 (360,215) → down y=245 → right to (480,245) — merges at waypoint -->
  <!-- Use separate path to avoid double-drawing the final segment -->
  <path d="M 360,215 L 360,245 L 480,245" class="line" marker-end="none"/>

  <!-- Col3 (576,215) → down y=245 → left to (480,245) — merges at waypoint -->
  <path d="M 576,215 L 576,245 L 480,245" class="line" marker-end="none"/>

  <!-- Col4 (792,215) → down y=245 → left to (480,245) → down to (480,265) -->
  <path d="M 792,215 L 792,245 L 480,245" class="line" marker-end="none"/>

  <!-- Single arrowhead on the final segment going into domain -->
  <path d="M 480,245 L 480,265" class="line"/>

  <!-- ═══════════════════════════════════════════════════ -->
  <!-- ROW 2: domain / SQL DSL (amber band, full-width)   -->
  <!-- y=265..355                                          -->
  <!-- ═══════════════════════════════════════════════════ -->
  <rect x="72" y="265" width="816" height="90" rx="14" class="card" fill="#FFF3D9" stroke="#D6A441"/>
  <text x="480" y="298" class="smallLabel" text-anchor="middle">domain  ·  SQL DSL</text>
  <text x="480" y="320" class="small" text-anchor="middle">Core JetBrains Exposed DSL shared across all modules</text>
  <text x="480" y="340" class="mono" text-anchor="middle">Table definitions · Query DSL · Transaction helpers</text>

  <!-- Arrow: domain → database -->
  <path d="M 480,355 L 480,393" class="line"/>

  <!-- ═══════════════════════════════════════════════════ -->
  <!-- ROW 3: H2 / MySQL database (teal band, full-width) -->
  <!-- y=393..463                                          -->
  <!-- ═══════════════════════════════════════════════════ -->
  <rect x="72" y="393" width="816" height="70" rx="14" class="card" fill="#E9F7F6" stroke="#45A7A1"/>
  <text x="480" y="424" class="smallLabel" text-anchor="middle">H2 (in-memory)  ·  MySQL</text>
  <text x="480" y="444" class="small" text-anchor="middle">Testcontainers for integration tests</text>
  <text x="480" y="462" class="mono" text-anchor="middle">JDBC DataSource · R2DBC ConnectionFactory</text>

</svg>
