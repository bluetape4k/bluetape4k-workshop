<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1378 600" width="1378" height="600">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="2" dy="4" stdDeviation="5" flood-color="#1f2937" flood-opacity="0.12"/>
    </filter>
    <marker id="dep-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <polygon points="1,1 8,4.5 1,8" fill="#6b7280"/>
    </marker>
    <marker id="dep-arrow-amber" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <polygon points="1,1 8,4.5 1,8" fill="#d97706"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1378" height="600" fill="#f6f9fc"/>
  <!-- Outer frame -->
  <rect x="20" y="20" width="1338" height="560" rx="16" fill="#fff" stroke="#d7e2ec" stroke-width="1.5"/>

  <!-- Title -->
  <text x="689" y="50" font-family="'Architects Daughter', cursive" font-size="28" fill="#1e293b" text-anchor="middle">Exposed Architecture</text>
  <text x="689" y="70" font-family="'Comic Sans MS', cursive" font-size="13" fill="#536476" text-anchor="middle">JetBrains Exposed ORM &#8212; Web layer variations sharing SQL DSL core</text>

  <!-- ============================================================ -->
  <!-- LAYER 1: Web Layer (y=100) -->
  <!-- ============================================================ -->
  <text x="52" y="96" font-family="'Architects Daughter', cursive" font-size="12" fill="#94a3b8" letter-spacing="0.1em">Web Layer</text>

  <!-- Box 1: sql-webflux-coroutines -->
  <rect x="52" y="100" width="274" height="108" rx="12" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="189" y="128" font-family="'Architects Daughter', cursive" font-size="16" fill="#1e3a5f" text-anchor="middle">sql-webflux</text>
  <text x="189" y="148" font-family="'Architects Daughter', cursive" font-size="16" fill="#1e3a5f" text-anchor="middle">coroutines</text>
  <text x="189" y="172" font-family="'Comic Sans MS', cursive" font-size="12" fill="#536476" text-anchor="middle">WebFlux + Coroutines</text>
  <rect x="123" y="185" width="88" height="20" rx="10" fill="#0284c7"/>
  <text x="167" y="199" font-family="'Comic Sans MS', cursive" font-size="11" fill="#fff" text-anchor="middle">REACTIVE</text>

  <!-- Box 2: sql-web-virtualthread -->
  <rect x="352" y="100" width="274" height="108" rx="12" fill="#d1fae5" stroke="#059669" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="489" y="128" font-family="'Architects Daughter', cursive" font-size="16" fill="#064e3b" text-anchor="middle">sql-web</text>
  <text x="489" y="148" font-family="'Architects Daughter', cursive" font-size="16" fill="#064e3b" text-anchor="middle">virtualthread</text>
  <text x="489" y="172" font-family="'Comic Sans MS', cursive" font-size="12" fill="#536476" text-anchor="middle">WebMVC + Virtual Threads</text>
  <rect x="443" y="185" width="60" height="20" rx="10" fill="#059669"/>
  <text x="473" y="199" font-family="'Comic Sans MS', cursive" font-size="11" fill="#fff" text-anchor="middle">MVC</text>

  <!-- Box 3: dao-web-transaction -->
  <rect x="652" y="100" width="274" height="108" rx="12" fill="#ffedd5" stroke="#ea580c" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="789" y="128" font-family="'Architects Daughter', cursive" font-size="16" fill="#7c2d12" text-anchor="middle">dao-web</text>
  <text x="789" y="148" font-family="'Architects Daughter', cursive" font-size="16" fill="#7c2d12" text-anchor="middle">transaction</text>
  <text x="789" y="172" font-family="'Comic Sans MS', cursive" font-size="12" fill="#536476" text-anchor="middle">DAO + @Transactional</text>
  <rect x="751" y="185" width="60" height="20" rx="10" fill="#ea580c"/>
  <text x="781" y="199" font-family="'Comic Sans MS', cursive" font-size="11" fill="#fff" text-anchor="middle">DAO</text>

  <!-- Box 4: spring-transaction -->
  <rect x="952" y="100" width="274" height="108" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="1089" y="128" font-family="'Architects Daughter', cursive" font-size="16" fill="#3b0764" text-anchor="middle">spring</text>
  <text x="1089" y="148" font-family="'Architects Daughter', cursive" font-size="16" fill="#3b0764" text-anchor="middle">transaction</text>
  <text x="1089" y="172" font-family="'Comic Sans MS', cursive" font-size="12" fill="#536476" text-anchor="middle">Spring @Transactional</text>
  <rect x="1065" y="185" width="44" height="20" rx="10" fill="#7c3aed"/>
  <text x="1087" y="199" font-family="'Comic Sans MS', cursive" font-size="11" fill="#fff" text-anchor="middle">TX</text>

  <!-- ============================================================ -->
  <!-- Arrows: Web Layer → Shared Core -->
  <!-- ============================================================ -->
  <!-- Box1 → domain -->
  <path d="M189,208 Q189,235 540,260" stroke="#6b7280" stroke-width="1.8" fill="none" marker-end="url(#dep-arrow)"/>
  <!-- Box2 → domain -->
  <path d="M489,208 Q489,235 620,260" stroke="#6b7280" stroke-width="1.8" fill="none" marker-end="url(#dep-arrow)"/>
  <!-- Box3 → domain -->
  <path d="M789,208 Q789,235 760,260" stroke="#6b7280" stroke-width="1.8" fill="none" marker-end="url(#dep-arrow)"/>
  <!-- Box4 → domain -->
  <path d="M1089,208 Q1089,235 840,260" stroke="#6b7280" stroke-width="1.8" fill="none" marker-end="url(#dep-arrow)"/>

  <!-- ============================================================ -->
  <!-- LAYER 2: Shared Core (y=260) -->
  <!-- ============================================================ -->
  <text x="52" y="256" font-family="'Architects Daughter', cursive" font-size="12" fill="#94a3b8" letter-spacing="0.1em">Shared Core</text>

  <!-- domain (SQL DSL) -->
  <rect x="414" y="262" width="550" height="96" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="2" filter="url(#shadow)"/>
  <text x="689" y="292" font-family="'Architects Daughter', cursive" font-size="20" fill="#92400e" text-anchor="middle">domain</text>
  <text x="689" y="316" font-family="'Architects Daughter', cursive" font-size="16" fill="#92400e" text-anchor="middle">SQL DSL</text>
  <text x="689" y="340" font-family="'Comic Sans MS', cursive" font-size="12" fill="#78350f" text-anchor="middle">Core JetBrains Exposed DSL shared across all modules</text>

  <!-- ============================================================ -->
  <!-- Arrow: domain → DB -->
  <!-- ============================================================ -->
  <line x1="689" y1="358" x2="689" y2="412" stroke="#d97706" stroke-width="2.2" marker-end="url(#dep-arrow-amber)"/>

  <!-- ============================================================ -->
  <!-- LAYER 3: Database (y=412) — Cylinder shape -->
  <!-- ============================================================ -->
  <text x="52" y="406" font-family="'Architects Daughter', cursive" font-size="12" fill="#94a3b8" letter-spacing="0.1em">Database</text>

  <!-- Cylinder: body rect (sides only) -->
  <rect x="469" y="430" width="440" height="80" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5" filter="url(#shadow)"/>
  <!-- Cylinder: bottom cap (darker for depth) -->
  <ellipse cx="689" cy="510" rx="220" ry="18" fill="#cbd5e1" stroke="#64748b" stroke-width="1.5"/>
  <!-- Cylinder: body left/right border lines (cover rect edges) -->
  <line x1="469" y1="430" x2="469" y2="510" stroke="#64748b" stroke-width="1.5"/>
  <line x1="909" y1="430" x2="909" y2="510" stroke="#64748b" stroke-width="1.5"/>
  <!-- Cylinder: top cap (lighter, as if lit from above) -->
  <ellipse cx="689" cy="430" rx="220" ry="18" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>

  <!-- DB Labels -->
  <text x="689" y="463" font-family="'Architects Daughter', cursive" font-size="16" fill="#334155" text-anchor="middle">H2 (in-memory)  /  MySQL</text>
  <text x="689" y="486" font-family="'Comic Sans MS', cursive" font-size="12" fill="#64748b" text-anchor="middle">Testcontainers for integration tests</text>
</svg>
