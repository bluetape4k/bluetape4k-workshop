<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img" aria-label="R2DBC Examples Architecture">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#1f2937" flood-opacity="0.10"/></filter>
  <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M1,1 L8,4.5 L1,8 Z" fill="#758297"/></marker>
  <style>
    .canvas{fill:#f7f9fc}.frame{fill:#fff;stroke:#d8e0ea;stroke-width:1.5}
    .title{font-family:"Architects Daughter";font-size:38px;font-weight:400;fill:#102033}
    .subtitle{font-family:"Comic Mono";font-size:14px;font-weight:400;fill:#536273}
    .smallLabel{font-family:"Architects Daughter";font-size:21px;font-weight:400;fill:#102033}
    .mono{font-family:"Comic Mono";font-size:12px;font-weight:400;fill:#102033}
    .small{font-family:"Comic Mono";font-size:12px;font-weight:400;fill:#536273}
    .card{stroke-width:2.1;filter:url(#shadow)}
    .line{stroke:#758297;stroke-width:2.1;fill:none;marker-end:url(#arrow)}
  </style>
</defs>
<rect class="canvas" width="960" height="420"/>
<rect class="frame" x="24" y="20" width="912" height="376" rx="16"/>
<text class="title" x="48" y="66">R2DBC Examples Architecture</text>
<text class="subtitle" x="48" y="90">CustomerRepository · Customer · TransactionalService → H2 R2DBC in-memory</text>

<!-- Row 1: Controller/Service layer y=108 -->
<rect class="card" x="280" y="108" width="200" height="60" rx="8" fill="#FFF3D9" stroke="#D6A441"/>
<text class="smallLabel" x="380" y="143" text-anchor="middle">TransactionalService</text>

<rect class="card" x="500" y="108" width="200" height="60" rx="8" fill="#FDECEF" stroke="#DC6B82"/>
<text class="smallLabel" x="600" y="136" text-anchor="middle">PersonRepository</text>
<text class="small" x="600" y="155" text-anchor="middle">«CoroutineCrudRepository»</text>

<!-- Row 2: Repository + Entity layer y=218 -->
<rect class="card" x="60" y="218" width="220" height="60" rx="8" fill="#E8F3FF" stroke="#5B8DEF"/>
<text class="smallLabel" x="170" y="248" text-anchor="middle">CustomerRepository</text>
<text class="small" x="170" y="267" text-anchor="middle">«CoroutineCrudRepository»</text>

<rect class="card" x="320" y="218" width="160" height="60" rx="8" fill="#EAF7EF" stroke="#58A978"/>
<text class="smallLabel" x="400" y="248" text-anchor="middle">Customer</text>
<text class="small" x="400" y="267" text-anchor="middle">@Table entity</text>

<rect class="card" x="510" y="218" width="160" height="60" rx="8" fill="#F1ECFF" stroke="#8A72D6"/>
<text class="smallLabel" x="590" y="248" text-anchor="middle">Person</text>
<text class="small" x="590" y="267" text-anchor="middle">@Table entity</text>

<!-- Row 3: Infrastructure y=328 -->
<rect class="card" x="220" y="328" width="260" height="52" rx="8" fill="#E9F7F6" stroke="#45A7A1"/>
<text class="smallLabel" x="350" y="356" text-anchor="middle">Spring Data R2DBC</text>
<text class="small" x="350" y="371" text-anchor="middle">Reactive + Coroutine support</text>

<rect class="card" x="510" y="328" width="200" height="52" rx="8" fill="#f5f5f5" stroke="#9aa3af"/>
<text class="smallLabel" x="610" y="356" text-anchor="middle">H2 R2DBC</text>
<text class="small" x="610" y="371" text-anchor="middle">In-memory database</text>

<!-- Arrows -->
<!-- TransactionalService -> CustomerRepository -->
<path class="line" d="M380 168 L380 200 L170 200 L170 218"/>
<!-- TransactionalService -> Customer -->
<path class="line" d="M420 168 L420 200 L400 200 L400 218"/>
<!-- PersonRepository -> Person -->
<path class="line" d="M590 168 L590 218"/>
<!-- CustomerRepository -> Spring Data R2DBC -->
<path class="line" d="M200 278 L200 312 L300 312 L300 328"/>
<!-- PersonRepository / Customer -> Spring Data R2DBC -->
<path class="line" d="M400 278 L400 312 L350 312 L350 328"/>
<!-- Spring Data R2DBC -> H2 -->
<path class="line" d="M480 354 L510 354"/>
</svg>
