<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="900" viewBox="0 0 1700 900">
  <defs>
    <style>
      .bg{fill:#f8fafc}.title{font-family:'Architects Daughter','Comic Sans MS',cursive;font-size:34px;fill:#18212f}
      .layer-title{font-family:'Architects Daughter','Comic Sans MS',cursive;font-size:26px;fill:#344154}
      .card-title{font-family:'Architects Daughter','Comic Sans MS',cursive;font-size:27px;fill:#101827}
      .body{font-family:'Comic Mono','Comic Sans MS',monospace;font-size:18px;fill:#364152}.small{font-family:'Comic Mono','Comic Sans MS',monospace;font-size:15px;fill:#475569}
      .layer{stroke-width:1.5;rx:22;ry:22}.card{fill:#fff;stroke:#cbd5e1;stroke-width:1.5;rx:18;ry:18}.line{fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
      .redis{fill:#dc2626}.redis2{fill:#ef4444}.redis3{fill:#f87171}
    </style>
    <marker id="arrow-blue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L11,6 L1,11 Z" fill="#2563eb" stroke-dasharray="none"/></marker>
    <marker id="arrow-green" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L11,6 L1,11 Z" fill="#059669" stroke-dasharray="none"/></marker>
  </defs>
  <rect class="bg" width="1700" height="900"/>  <text class="title" x="70" y="70">Redis Stream API Examples</text>

  <rect class="layer" x="70" y="120" width="1560" height="185" fill="#eff6ff" stroke="#bfdbfe"/>
  <text class="layer-title" x="105" y="165">Record factory</text>
  <rect class="card" x="560" y="200" width="580" height="70"/>
  <text class="card-title" x="590" y="243">SensorData</text>
  <text class="body" x="815" y="243">StringRecord for my-stream</text>

  <rect class="layer" x="70" y="360" width="1560" height="210" fill="#f0fdf4" stroke="#bbf7d0"/>
  <text class="layer-title" x="105" y="405">Spring Data Redis stream APIs</text>
  <rect class="card" x="220" y="445" width="500" height="80"/>
  <text class="card-title" x="250" y="490">StringRedisTemplate</text>
  <text class="body" x="250" y="518">sync StreamOperations</text>
  <rect class="card" x="980" y="445" width="500" height="80"/>
  <text class="card-title" x="1010" y="490">ReactiveStringRedisTemplate</text>
  <text class="body" x="1010" y="518">reactive StreamOperations</text>

  <rect class="layer" x="70" y="635" width="1560" height="185" fill="#fff7ed" stroke="#fed7aa"/>  <text class="layer-title" x="105" y="680">Redis runtime</text>
  <rect class="card" x="590" y="710" width="520" height="75"/>
  <g transform="translate(635 730)">
    <rect class="redis3" x="0" y="26" width="58" height="18" rx="5"/>
    <rect class="redis2" x="0" y="13" width="58" height="18" rx="5"/>
    <rect class="redis" x="0" y="0" width="58" height="18" rx="5"/>
  </g>  <text class="card-title" x="720" y="756">Redis Testcontainer</text>
  <text class="body" x="720" y="780">stream key: my-stream</text>

  <path class="line" d="M850 270 L850 330 L470 330 L470 445" stroke="#2563eb" marker-end="url(#arrow-blue)" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="line" d="M850 270 L850 330 L1230 330 L1230 445" stroke="#059669" marker-end="url(#arrow-green)" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="line" d="M470 525 L470 600 L760 600 L760 710" stroke="#2563eb" marker-end="url(#arrow-blue)" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="line" d="M1230 525 L1230 600 L940 600 L940 710" stroke="#059669" marker-end="url(#arrow-green)" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
