<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1080" viewBox="0 0 1500 1080" role="img" aria-labelledby="title desc">
  <title id="title">Idle Timeout Fallback Sequence</title>
  <desc id="desc">Sequence showing latest-query cancellation, adapter idle timeout, fallback emission, normal completion, and session cancellation.</desc>
  <defs>
    <marker id="arrowCall" viewBox="0 0 10 10" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" refX="9" refY="5" orient="auto" data-role="sequence" data-tip-direction="positive-x"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#4f86c6" stroke="#4f86c6" stroke-dasharray="none" style="stroke-dasharray:none" stroke-width="0"/></marker>
    <marker id="arrowWork" viewBox="0 0 10 10" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" refX="9" refY="5" orient="auto" data-role="sequence" data-tip-direction="positive-x"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#6e8f4f" stroke="#6e8f4f" stroke-dasharray="none" style="stroke-dasharray:none" stroke-width="0"/></marker>
    <marker id="arrowAudit" viewBox="0 0 10 10" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" refX="9" refY="5" orient="auto" data-role="sequence" data-tip-direction="positive-x"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#b5832f" stroke="#b5832f" stroke-dasharray="none" style="stroke-dasharray:none" stroke-width="0"/></marker>
    <marker id="arrowError" viewBox="0 0 10 10" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" refX="9" refY="5" orient="auto" data-role="sequence" data-tip-direction="positive-x"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#c85c68" stroke="#c85c68" stroke-dasharray="none" style="stroke-dasharray:none" stroke-width="0"/></marker>
    <marker id="arrowReturn" viewBox="0 0 10 10" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" refX="9" refY="5" orient="auto" data-role="sequence" data-tip-direction="positive-x"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#2b8f88" stroke="#2b8f88" stroke-dasharray="none" style="stroke-dasharray:none" stroke-width="0"/></marker>
    <style>
      .frame { fill: #fbfcf8; stroke: #40545d; stroke-width: 3; rx: 20; }
      .title { font-family: "Architects Daughter", sans-serif; font-size: 40px; fill: #263238; }
      .subtitle, .role, .msg, .note, .badgeText, .branchText { font-family: "Comic Mono", monospace; fill: #36464f; }
      .subtitle { font-size: 16px; }
      .participant { font-family: "Architects Daughter", sans-serif; font-size: 21px; fill: #1f3138; }
      .role { font-size: 13px; fill: #546a73; }
      .header { fill: #ffffff; stroke: #546e7a; stroke-width: 2; rx: 10; }
      .lifeline { stroke: #9aaab1; stroke-width: 2; stroke-dasharray: 7 8; stroke-linecap: round; }
      .activation { fill: #eef8f0; stroke: #6f8f77; stroke-width: 1.8; rx: 6; }
      .activationAudit { fill: #fff7e8; stroke: #9b7d54; stroke-width: 1.8; rx: 6; }
      .activationError { fill: #fff0f1; stroke: #c85c68; stroke-width: 1.8; rx: 6; }
      .call, .work, .audit, .error, .return { fill: none; stroke-width: 3.1; stroke-linecap: round; stroke-linejoin: round; }
      .call { stroke: #4f86c6; marker-end: url(#arrowCall); }
      .work { stroke: #6e8f4f; marker-end: url(#arrowWork); }
      .audit { stroke: #b5832f; marker-end: url(#arrowAudit); }
      .error { stroke: #c85c68; marker-end: url(#arrowError); }
      .return { stroke: #2b8f88; stroke-dasharray: 8 6; marker-end: url(#arrowReturn); }
      .label, .branchLabel { fill: #ffffff; stroke-width: 1.6; rx: 17; }
      .labelCall { stroke: #9cc6df; }
      .labelWork { stroke: #b6c9a4; }
      .labelAudit { stroke: #d0b477; }
      .labelError { stroke: #e1a4aa; }
      .labelReturn { stroke: #9bc9c4; }
      .badgeCircle { fill: #fffefa; stroke-width: 1.6; }
      .badgeCall { stroke: #4f86c6; }
      .badgeWork { stroke: #6e8f4f; }
      .badgeAudit { stroke: #b5832f; }
      .badgeError { stroke: #c85c68; }
      .badgeReturn { stroke: #2b8f88; }
      .badgeText { font-size: 12px; font-weight: 700; text-anchor: middle; }
      .callText { fill: #276b9d; }
      .workText { fill: #55783f; }
      .auditText { fill: #805d22; }
      .errorText { fill: #a3424e; }
      .returnText { fill: #217a74; }
      .msg { font-size: 14px; font-weight: 600; }
      .note { font-size: 13px; fill: #5b6f7a; }
      .branch { fill: none; stroke: #9aaab1; stroke-width: 2; stroke-dasharray: 9 7; rx: 14; }
      .branchLabel { stroke: #b6c3c7; }
      .branchText { font-size: 14px; font-weight: 700; }
      .divider { stroke: #c3cdd0; stroke-width: 1.5; stroke-dasharray: 6 6; }
    </style>
  </defs>

  <rect class="frame" x="24" y="24" width="1452" height="1032"/>
  <text class="title" x="750" y="78" text-anchor="middle">Idle Timeout Fallback Sequence</text>
  <text class="subtitle" x="750" y="108" text-anchor="middle">flatMapLatest keeps the newest request; timeoutOrFallback replaces only an idle adapter call.</text>

  <rect class="header" x="70" y="150" width="220" height="76"/><text class="participant" x="180" y="181" text-anchor="middle">Input Signals</text><text class="role" x="180" y="205" text-anchor="middle">query + session close</text>
  <rect class="header" x="390" y="150" width="250" height="76"/><text class="participant" x="515" y="181" text-anchor="middle">SearchPipeline</text><text class="role" x="515" y="205" text-anchor="middle">flatMapLatest boundary</text>
  <rect class="header" x="740" y="150" width="230" height="76"/><text class="participant" x="855" y="181" text-anchor="middle">SearchAdapter</text><text class="role" x="855" y="205" text-anchor="middle">suspend backend</text>
  <rect class="header" x="1070" y="150" width="220" height="76"/><text class="participant" x="1180" y="181" text-anchor="middle">Fallback Flow</text><text class="role" x="1180" y="205" text-anchor="middle">one result</text>
  <rect class="header" x="1320" y="150" width="130" height="76"/><text class="participant" x="1385" y="181" text-anchor="middle">Collector</text><text class="role" x="1385" y="205" text-anchor="middle">output</text>

  <line class="lifeline" x1="180" y1="226" x2="180" y2="962"/><line class="lifeline" x1="515" y1="226" x2="515" y2="962"/><line class="lifeline" x1="855" y1="226" x2="855" y2="962"/><line class="lifeline" x1="1180" y1="226" x2="1180" y2="962"/><line class="lifeline" x1="1385" y1="226" x2="1385" y2="962"/>
  <rect class="activation" x="506" y="300" width="18" height="590"/><rect class="activation" x="846" y="392" width="18" height="180"/><rect class="activationAudit" x="1171" y="650" width="18" height="100"/><rect class="activation" x="1376" y="482" width="18" height="268"/>

  <rect class="label labelCall" x="210" y="260" width="330" height="34"/><circle class="badgeCircle badgeCall" cx="234" cy="277" r="13"/><text class="badgeText callText" x="234" y="282">1</text><text class="msg callText" x="258" y="282">debounced latest request</text><path class="call" d="M 180 314 L 515 314" data-connector="signals-pipeline-latest" data-source="signals" data-target="pipeline"/>
  <rect class="label labelWork" x="545" y="350" width="300" height="34"/><circle class="badgeCircle badgeWork" cx="569" cy="367" r="13"/><text class="badgeText workText" x="569" y="372">2</text><text class="msg workText" x="593" y="372">flatMapLatest starts search</text><path class="work" d="M 515 404 L 855 404" data-connector="pipeline-adapter-start" data-source="pipeline" data-target="adapter"/>

  <rect class="branch" x="88" y="440" width="1324" height="350"/><rect class="branchLabel" x="112" y="426" width="252" height="34"/><text class="branchText" x="238" y="448" text-anchor="middle">request lifecycle</text><line class="divider" x1="104" y1="620" x2="1396" y2="620"/>
  <rect class="label labelCall" x="390" y="440" width="342" height="34"/><circle class="badgeCircle badgeCall" cx="414" cy="457" r="13"/><text class="badgeText callText" x="414" y="462">3</text><text class="msg callText" x="438" y="462">newer query supersedes A</text><path class="call" d="M 180 494 L 515 494" data-connector="signals-pipeline-newer" data-source="signals" data-target="pipeline"/>
  <rect class="label labelError" x="545" y="530" width="344" height="34"/><circle class="badgeCircle badgeError" cx="569" cy="547" r="13"/><text class="badgeText errorText" x="569" y="552">4</text><text class="msg errorText" x="593" y="552">cancel stale adapter call</text><path class="error" d="M 515 584 L 855 584" data-connector="pipeline-adapter-cancel" data-source="pipeline" data-target="adapter"/>
  <rect class="label labelAudit" x="875" y="640" width="350" height="34"/><circle class="badgeCircle badgeAudit" cx="899" cy="657" r="13"/><text class="badgeText auditText" x="899" y="662">5</text><text class="msg auditText" x="923" y="662">idle timeout selects fallback</text><path class="audit" d="M 515 694 L 1180 694" data-connector="pipeline-fallback-timeout" data-source="pipeline" data-target="fallback"/>
  <path class="return" d="M 1180 730 L 1385 730" data-connector="fallback-collector" data-source="fallback" data-target="collector"/><rect class="label labelReturn" x="1190" y="748" width="242" height="34"/><circle class="badgeCircle badgeReturn" cx="1214" cy="765" r="13"/><text class="badgeText returnText" x="1214" y="770">6</text><text class="msg returnText" x="1238" y="770">emit fallback result</text>

  <rect class="branch" x="88" y="818" width="1324" height="102"/><rect class="branchLabel" x="112" y="804" width="234" height="34"/><text class="branchText" x="229" y="826" text-anchor="middle">terminal signal</text><rect class="label labelReturn" x="545" y="834" width="328" height="34"/><circle class="badgeCircle badgeReturn" cx="569" cy="851" r="13"/><text class="badgeText returnText" x="569" y="856">7</text><text class="msg returnText" x="593" y="856">timely result reaches collector</text><path class="return" d="M 855 888 L 1385 888" data-connector="adapter-collector-timely" data-source="adapter" data-target="collector"/>
  <rect x="96" y="972" width="1308" height="48" rx="12" fill="#ffffff" stroke="#ccd7da" stroke-width="2"/><text class="note" x="750" y="1002" text-anchor="middle">Adapter failure and CancellationException propagate; fallback is reserved for the idle timeout boundary.</text>
</svg>
