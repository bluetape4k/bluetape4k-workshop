<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="640" viewBox="0 0 1400 640" role="img" aria-label="Multi-Tenant Data Isolation Scenario">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#1f2937" flood-opacity="0.10"/></filter>
  <marker id="arrow" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse">
    <path d="M2,2 L12,7 L2,12 Z" fill="#758297"/>
  </marker>
  <style>
    .canvas{fill:#f7f9fc}.frame{fill:#fff;stroke:#d8e0ea;stroke-width:1.5}
    .title{font-family:"Architects Daughter";font-size:34px;fill:#102033}
    .subtitle{font-family:"Comic Mono";font-size:14px;fill:#536273}
    .label{font-family:"Architects Daughter";font-size:18px;fill:#102033}
    .mono{font-family:"Comic Mono";font-size:12px;fill:#536273}
    .card{stroke-width:2;filter:url(#shadow)}
    .line{stroke:#758297;stroke-width:2;fill:none;marker-end:url(#arrow)}
  </style>
</defs>
<rect class="canvas" width="1400" height="640"/>
<rect class="frame" x="28" y="24" width="1344" height="592" rx="20"/>

<text class="title" x="52" y="68">Tenant Data Isolation</text>
<text class="subtitle" x="52" y="92">Every resource key is tenant-prefixed · all boundaries are in-memory (H2, ReentrantLock, ConcurrentHashMap)</text>

<!--
  LAYOUT: 110px vertical spacing between boundaries.
  Col 3 boundaries: Repo y=130, Cache y=240, Lock y=350, Rate y=460, Metrics y=570.
  Centers: 164, 274, 384, 494, 604.
  Service: y=200-520, right edge=620.
  Exit points (top→bottom): 220, 274, 384, 494, 510. All ordered. ✓

  BOUNDING BOXES:
  TenantA: x=52-252, y=250-318. TenantB: x=52-252, y=400-468.
  Service: x=340-620, y=200-520.
  Repo: x=760-1040, y=130-198. Cache: x=760-1040, y=240-308.
  Lock: x=760-1040, y=350-418. Rate: x=760-1040, y=460-528.
  Metrics: x=760-1040, y=570-638.
  DB: x=1100-1320, y=130-198.
  Gap: x=620-760 (140px routing column, no components).
-->

<!-- Col 1: Tenants -->
<g transform="translate(52,220)"><rect class="card" x="0" y="0" width="200" height="68" rx="12" fill="#E0ECFF" stroke="#4A7ADB"/><text class="label" x="100" y="28" text-anchor="middle">Tenant A</text><text class="mono" x="100" y="48" text-anchor="middle">TenantId("acme")</text></g>
<g transform="translate(52,350)"><rect class="card" x="0" y="0" width="200" height="68" rx="12" fill="#F1ECFF" stroke="#8A72D6"/><text class="label" x="100" y="28" text-anchor="middle">Tenant B</text><text class="mono" x="100" y="48" text-anchor="middle">TenantId("globex")</text></g>

<!-- Col 2: Service -->
<g transform="translate(340,170)">
  <rect class="card" x="0" y="0" width="280" height="280" rx="14" fill="#EAF7EF" stroke="#58A978"/>
  <text class="label" x="140" y="30" text-anchor="middle">TenantInvoiceService</text>
  <text class="mono" x="140" y="52" text-anchor="middle">composes all boundaries</text>
  <rect x="16" y="68" width="248" height="26" rx="6" fill="#E9F7F6" stroke="#45A7A1" stroke-width="1"/>
  <text class="mono" x="140" y="87" text-anchor="middle" style="fill:#102033">TenantKeyFactory → prefixed keys</text>
  <rect x="16" y="102" width="248" height="26" rx="6" fill="#E9F7F6" stroke="#45A7A1" stroke-width="1"/>
  <text class="mono" x="140" y="121" text-anchor="middle" style="fill:#102033">tenant_id predicate on query</text>
  <rect x="16" y="136" width="248" height="26" rx="6" fill="#E9F7F6" stroke="#45A7A1" stroke-width="1"/>
  <text class="mono" x="140" y="155" text-anchor="middle" style="fill:#102033">UnsafeRepo for baseline</text>
</g>

<!-- Col 3: 5 boundaries (90px spacing) -->
<g transform="translate(760,120)"><rect class="card" x="0" y="0" width="280" height="60" rx="10" fill="#EAF7EF" stroke="#58A978"/><text class="label" x="140" y="24" text-anchor="middle">Repository</text><text class="mono" x="140" y="44" text-anchor="middle">tenant-scoped · LongJdbcRepo</text></g>
<g transform="translate(760,210)"><rect class="card" x="0" y="0" width="280" height="60" rx="10" fill="#FFF3D9" stroke="#D6A441"/><text class="label" x="140" y="24" text-anchor="middle">Cache</text><text class="mono" x="140" y="44" text-anchor="middle">in-memory ConcurrentHashMap</text></g>
<g transform="translate(760,300)"><rect class="card" x="0" y="0" width="280" height="60" rx="10" fill="#F1ECFF" stroke="#8A72D6"/><text class="label" x="140" y="24" text-anchor="middle">Lock</text><text class="mono" x="140" y="44" text-anchor="middle">in-memory ReentrantLock</text></g>
<g transform="translate(760,390)"><rect class="card" x="0" y="0" width="280" height="60" rx="10" fill="#FDECEF" stroke="#DC6B82"/><text class="label" x="140" y="24" text-anchor="middle">Rate Limiter</text><text class="mono" x="140" y="44" text-anchor="middle">in-memory fixed-window</text></g>
<g transform="translate(760,480)"><rect class="card" x="0" y="0" width="280" height="60" rx="10" fill="#E8F3FF" stroke="#5B8DEF"/><text class="label" x="140" y="24" text-anchor="middle">Metrics</text><text class="mono" x="140" y="44" text-anchor="middle">Micrometer · tag: tenant</text></g>

<!-- Col 4: DB -->
<g transform="translate(1100,120)">
  <ellipse cx="110" cy="10" rx="110" ry="14" fill="#FFF3D9" stroke="#D6A441" stroke-width="2"/>
  <rect x="0" y="10" width="220" height="30" fill="#FFF3D9" stroke="#D6A441" stroke-width="2"/>
  <line x1="0" y1="10" x2="0" y2="40" stroke="#D6A441" stroke-width="2"/>
  <line x1="220" y1="10" x2="220" y2="40" stroke="#D6A441" stroke-width="2"/>
  <ellipse cx="110" cy="40" rx="110" ry="14" fill="#FFF3D9" stroke="#D6A441" stroke-width="2"/>
  <text class="label" x="110" y="36" text-anchor="middle" style="font-size:16px">H2 + Exposed</text>
</g>

<!--
  ARROW VERIFICATION (90px spacing):
  Boundaries centers: 150, 240, 330, 420, 510.
  Service: y=170-450, right=620.
  Exit points (top→bottom): 190(Repo), 240(Cache), 330(Lock), 420(Rate), 440(Metrics).
  Rate(420) exit ABOVE Metrics(440) exit ✓. All ordered ✓.
  Gap x=620-760 clear ✓.
-->

<!-- Tenant → Service -->
<path class="line" d="M252,254 L338,254"/>
<path class="line" d="M252,384 L338,384"/>

<!-- Service → boundaries -->
<path class="line" d="M620,190 L700,190 L700,150 L758,150"/>
<path class="line" d="M620,240 L758,240"/>
<path class="line" d="M620,330 L758,330"/>
<path class="line" d="M620,420 L758,420"/>
<path class="line" d="M620,440 L710,440 L710,510 L758,510"/>

<!-- Repo → DB -->
<path class="line" d="M1040,150 L1098,150"/>
</svg>
