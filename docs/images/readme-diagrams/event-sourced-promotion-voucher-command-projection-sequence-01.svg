  </defs><rect class="bg" width="1800" height="1130"/><rect class="frame" x="30" y="25" width="1740" height="1065" rx="22"/><text class="title" x="900" y="70" text-anchor="middle">Command Commit, Projection Catch-up, and Read Fence</text><text class="subtitle" x="900" y="104" text-anchor="middle">A committed command is authoritative before the replaceable read model catches up.</text>
  <g filter="url(#shadow)"><rect class="card" x="45" y="150" width="270" height="78" rx="12"/><text class="participant" x="180" y="182" text-anchor="middle">Client</text><text class="small" x="180" y="207" text-anchor="middle">tenant-scoped caller</text></g><line class="lifeline" x1="180" y1="228" x2="180" y2="1040"/>
  <g filter="url(#shadow)"><rect class="card" x="385" y="150" width="270" height="78" rx="12"/><text class="participant" x="520" y="182" text-anchor="middle">Command API</text><text class="small" x="520" y="207" text-anchor="middle">idempotent application boundary</text></g><line class="lifeline" x1="520" y1="228" x2="520" y2="1040"/>
  <g filter="url(#shadow)"><rect class="card" x="725" y="150" width="270" height="78" rx="12"/><text class="participant" x="860" y="182" text-anchor="middle">PostgreSQL</text><text class="small" x="860" y="207" text-anchor="middle">event + receipt authority</text></g><line class="lifeline" x1="860" y1="228" x2="860" y2="1040"/>
  <g filter="url(#shadow)"><rect class="card" x="1065" y="150" width="270" height="78" rx="12"/><text class="participant" x="1200" y="182" text-anchor="middle">Projection</text><text class="small" x="1200" y="207" text-anchor="middle">leased generation worker</text></g><line class="lifeline" x1="1200" y1="228" x2="1200" y2="1040"/>
  <g filter="url(#shadow)"><rect class="card" x="1485" y="150" width="270" height="78" rx="12"/><text class="participant" x="1620" y="182" text-anchor="middle">Query / SSE</text><text class="small" x="1620" y="207" text-anchor="middle">position-aware adapter</text></g><line class="lifeline" x1="1620" y1="228" x2="1620" y2="1040"/>
  <rect class="activation" x="512" y="295" width="16" height="245" rx="6"/><rect class="activation" x="852" y="355" width="16" height="475" rx="6"/><rect class="activation" x="1192" y="595" width="16" height="245" rx="6"/><rect class="activation" x="1612" y="780" width="16" height="205" rx="6"/>
  <rect class="label" x="164.5" y="281" width="371" height="34" rx="17"/><circle cx="186.5" cy="298" r="13" fill="#FFFFFF" stroke="#4F86C6" stroke-width="2"/><text class="badge" x="186.5" y="303" text-anchor="middle">1</text><text class="msg" x="208.5" y="303">command + expected revision + key</text><path data-connector="message-1" class="connector blueEdge" d="M180 325 L520 325"/>
  <rect class="label" x="495.5" y="346" width="389" height="34" rx="17"/><circle cx="517.5" cy="363" r="13" fill="#FFFFFF" stroke="#6E8F4F" stroke-width="2"/><text class="badge" x="517.5" y="368" text-anchor="middle">2</text><text class="msg" x="539.5" y="368">lock head; append events atomically</text><path data-connector="message-2" class="connector greenEdge" d="M520 390 L860 390"/>
  <rect class="label" x="482" y="411" width="416" height="34" rx="17"/><circle cx="504" cy="428" r="13" fill="#FFFFFF" stroke="#6E8F4F" stroke-width="2"/><text class="badge" x="504" y="433" text-anchor="middle">3</text><text class="msg" x="526" y="433">commit terminal receipt in transaction</text><path data-connector="message-3" class="connector greenEdge" d="M520 455 L860 455"/>
  <rect class="label" x="128.5" y="476" width="443" height="34" rx="17"/><circle cx="150.5" cy="493" r="13" fill="#FFFFFF" stroke="#2D948C" stroke-width="2"/><text class="badge" x="150.5" y="498" text-anchor="middle">4</text><text class="msg" x="172.5" y="498">201/200 + stream and projection positions</text><path data-connector="message-4" class="connector tealEdge" d="M520 520 L180 520"/>
  <rect class="label" x="889.5" y="581" width="281" height="34" rx="17"/><circle cx="911.5" cy="598" r="13" fill="#FFFFFF" stroke="#8065A8" stroke-width="2"/><text class="badge" x="911.5" y="603" text-anchor="middle">5</text><text class="msg" x="933.5" y="603">lease-fenced batch read</text><path data-connector="message-5" class="connector purpleEdge" d="M1200 625 L860 625"/>
  <rect class="label" x="853.5" y="646" width="353" height="34" rx="17"/><circle cx="875.5" cy="663" r="13" fill="#FFFFFF" stroke="#6E8F4F" stroke-width="2"/><text class="badge" x="875.5" y="668" text-anchor="middle">6</text><text class="msg" x="897.5" y="668">dedup + read model + checkpoint</text><path data-connector="message-6" class="connector greenEdge" d="M1200 690 L860 690"/>
  <rect class="label" x="600" y="746" width="344" height="34" rx="17"/><circle cx="622" cy="763" r="13" fill="#FFFFFF" stroke="#4F86C6" stroke-width="2"/><text class="badge" x="622" y="768" text-anchor="middle">7</text><text class="msg" x="644" y="768">GET with X-Min-Stream-Position</text><path data-connector="message-7" class="connector blueEdge" d="M180 790 L1620 790"/>
  <rect class="label" x="1180" y="811" width="389" height="34" rx="17"/><circle cx="1202" cy="828" r="13" fill="#FFFFFF" stroke="#8065A8" stroke-width="2"/><text class="badge" x="1202" y="833" text-anchor="middle">8</text><text class="msg" x="1224" y="833">read active generation + checkpoint</text><path data-connector="message-8" class="connector purpleEdge" d="M1620 855 L860 855"/>
  <rect class="label" x="570" y="876" width="344" height="34" rx="17"/><circle cx="592" cy="893" r="13" fill="#FFFFFF" stroke="#2D948C" stroke-width="2"/><text class="badge" x="592" y="898" text-anchor="middle">9</text><text class="msg" x="614" y="898">200 fresh or 202 + Retry-After</text><path data-connector="message-9" class="connector tealEdge" d="M1620 920 L180 920"/>
  <rect class="frame" x="370" y="965" width="1260" height="74" rx="14" fill="none"/><text class="small" x="400" y="992">alt: projection lag returns 202 PROJECTION_PENDING; retry the GET, never repair lag by repeating a command</text><text class="small" x="400" y="1018">SSE: snapshot first, then opaque Last-Event-ID; terminal reset requires a fresh snapshot</text><text class="footer" x="900" y="1076" text-anchor="middle">Committed and terminal throughput are measured separately from conflicts, Hikari wait, stream-head wait, and append-fence wait.</text></svg>