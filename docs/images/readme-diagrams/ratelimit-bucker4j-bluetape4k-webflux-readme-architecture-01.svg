<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="2096.603" height="700" viewBox="0 0 2096.603 700" role="img" aria-label="WebFlux Bucket4j rate limit architecture diagram">
  <defs>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="124%"><feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#64748B" flood-opacity="0.16"/></filter>
    <marker id="arrowBlue" markerWidth="14" markerHeight="14" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 12 12" data-role="primary" data-tip-direction="positive-x"><path d="M 0 0 L 12 6 L 0 12 Z" fill="#2563EB" stroke-dasharray="none" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="arrowGreen" markerWidth="14" markerHeight="14" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 12 12" data-role="primary" data-tip-direction="positive-x"><path d="M 0 0 L 12 6 L 0 12 Z" fill="#16A34A" stroke-dasharray="none" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="arrowRose" markerWidth="14" markerHeight="14" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 12 12" data-role="primary" data-tip-direction="positive-x"><path d="M 0 0 L 12 6 L 0 12 Z" fill="#E11D48" stroke-dasharray="none" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="arrowSlate" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 10 10" data-role="secondary" data-tip-direction="positive-x"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#475569" stroke-dasharray="none" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <style>
      .canvas{fill:#F8FAFC}.frame{fill:#FFFFFF;stroke:#D6E0E8;stroke-width:1.4}.layer{fill:#F8FAFC;stroke:#CBD5E1;stroke-width:1.4}.title{font-family:"Architects Daughter";font-size:38px;fill:#102033}.subtitle{font-family:"Comic Mono";font-size:15px;fill:#51606F}.layerLabel{font-family:"Architects Daughter";font-size:24px;fill:#263548}.cardTitle{font-family:"Architects Daughter";font-size:29px;fill:#102033}.cardText{font-family:"Comic Mono";font-size:15px;fill:#415166}.line{fill:none;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round}
    </style>
  </defs>
  <rect class="canvas" width="2096.603" height="700"/>
  <rect class="frame" x="30.312" y="24" width="2035.978" height="652" rx="24"/>
  <text class="title" x="1048.301" y="70" text-anchor="middle">WebFlux user rate limit architecture</text>
  <text class="subtitle" x="1048.301" y="102" text-anchor="middle">v1 WebFlux endpoints consume distributed Bucket4j tokens; v2 endpoints bypass the filter target list.</text>

  <rect class="layer" x="85.885" y="142" width="300.597" height="494" rx="18"/>
  <text class="layerLabel" x="121.249" y="180">HTTP caller</text>
  <g filter="url(#shadow)">
    <rect x="136.405" y="266" width="199.556" height="118" rx="16" fill="#EFF6FF" stroke="#2563EB" stroke-width="2.147"/>
    <text class="cardTitle" x="236.184" y="310" text-anchor="middle">Client</text>
    <text class="cardText" x="236.184" y="342" text-anchor="middle">UID header</text>
    <text class="cardText" x="236.184" y="368" text-anchor="middle">or remote host</text>
  </g>

  <rect class="layer" x="454.685" y="142" width="431.951" height="494" rx="18"/>
  <text class="layerLabel" x="490.049" y="180">WebFilter layer</text>
  <g filter="url(#shadow)">
    <rect x="507.732" y="222" width="325.858" height="118" rx="16" fill="#EFF6FF" stroke="#2563EB" stroke-width="2.147"/>
    <text class="cardTitle" x="670.66" y="266" text-anchor="middle">UserKeyResolver</text>
    <text class="cardText" x="670.66" y="298" text-anchor="middle">X-Bluetape4k-UID</text>
    <text class="cardText" x="670.66" y="324" text-anchor="middle">fallback host</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="507.732" y="418" width="325.858" height="124" rx="16" fill="#F0FDF4" stroke="#16A34A" stroke-width="2.147"/>
    <text class="cardTitle" x="670.66" y="462" text-anchor="middle">TargetProvider</text>
    <text class="cardText" x="670.66" y="494" text-anchor="middle">/api/v1/reactive/**</text>
    <text class="cardText" x="670.66" y="520" text-anchor="middle">/api/v1/coroutines/**</text>
  </g>

  <rect class="layer" x="954.838" y="142" width="479.945" height="494" rx="18"/>
  <text class="layerLabel" x="990.203" y="180">Limiter beans</text>
  <g filter="url(#shadow)">
    <rect x="1010.411" y="218" width="368.8" height="124" rx="16" fill="#ECFEFF" stroke="#0891B2" stroke-width="2.147"/>
    <text class="cardTitle" x="1194.811" y="262" text-anchor="middle">UserRateLimitWebFilter</text>
    <text class="cardText" x="1194.811" y="294" text-anchor="middle">DistributedRateLimiter</text>
    <text class="cardText" x="1194.811" y="320" text-anchor="middle">reactive chain</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="1010.411" y="418" width="368.8" height="124" rx="16" fill="#FFF7ED" stroke="#D97706" stroke-width="2.147"/>
    <text class="cardTitle" x="1194.811" y="462" text-anchor="middle">AsyncUserRateLimit</text>
    <text class="cardText" x="1194.811" y="494" text-anchor="middle">SuspendRateLimiter</text>
    <text class="cardText" x="1194.811" y="520" text-anchor="middle">mono(Dispatchers.IO)</text>
  </g>

  <rect class="layer" x="1502.986" y="142" width="507.732" height="494" rx="18"/>
  <text class="layerLabel" x="1538.351" y="180">Distributed bucket store</text>
  <g filter="url(#shadow)">
    <rect x="1556.033" y="218" width="396.586" height="128" rx="16" fill="#F8FAFC" stroke="#475569" stroke-width="2.147"/>
    <text class="cardTitle" x="1754.326" y="262" text-anchor="middle">Bucket4jConfig</text>
    <text class="cardText" x="1754.326" y="294" text-anchor="middle">10 / 10s + 100 / minute</text>
    <text class="cardText" x="1754.326" y="320" text-anchor="middle">90s expiration strategy</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="1533.299" y="424" width="439.529" height="118" rx="16" fill="#FFF1F2" stroke="#E11D48" stroke-width="2.147"/>
    <image data-bluetape4k-icon="redis" data-source="docs/icons/redis/redis-icon.svg" x="1573.715" y="440" width="40" height="40" href="data:image/svg+xml;base64," preserveAspectRatio="xMidYMid meet"/>  <text class="cardTitle" x="1808.636" y="472" text-anchor="middle">Redis</text>
    <text class="cardText" x="1808.636" y="504" text-anchor="middle">Lettuce proxy manager</text>
  </g>

  <path class="line" d="M 335.962 325 L 507.732 281" stroke="#2563EB" marker-end="url(#arrowBlue)" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="line" d="M 833.589 281 L 1010.411 280" stroke="#2563EB" marker-end="url(#arrowBlue)" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="line" d="M 833.589 480 L 1010.411 480" stroke="#16A34A" marker-end="url(#arrowGreen)" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="line" d="M 1379.211 280 L 1556.033 282" stroke="#475569" marker-end="url(#arrowSlate)" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="line" d="M 1379.211 480 L 1556.033 483" stroke="#E11D48" marker-end="url(#arrowRose)" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="line" d="M 1754.326 346 L 1754.326 424" stroke="#E11D48" marker-end="url(#arrowRose)" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
