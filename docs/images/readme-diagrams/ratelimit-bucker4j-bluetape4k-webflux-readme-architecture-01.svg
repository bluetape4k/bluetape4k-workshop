<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1660" height="700" viewBox="0 0 1660 700" role="img" aria-label="WebFlux Bucket4j rate limit architecture diagram">
  <defs>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="124%"><feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#64748B" flood-opacity="0.16"/></filter>
    <marker id="arrowBlue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 12 6 L 0 12 Z" fill="#2563EB"/></marker>
    <marker id="arrowGreen" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 12 6 L 0 12 Z" fill="#16A34A"/></marker>
    <marker id="arrowRose" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 12 6 L 0 12 Z" fill="#E11D48"/></marker>
    <marker id="arrowSlate" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#475569"/></marker>
    <style>
      .canvas{fill:#F8FAFC}.frame{fill:#FFFFFF;stroke:#D6E0E8;stroke-width:1.4}.layer{fill:#F8FAFC;stroke:#CBD5E1;stroke-width:1.4}.title{font-family:"Architects Daughter";font-size:38px;fill:#102033}.subtitle{font-family:"Comic Mono";font-size:15px;fill:#51606F}.layerLabel{font-family:"Architects Daughter";font-size:24px;fill:#263548}.cardTitle{font-family:"Architects Daughter";font-size:29px;fill:#102033}.cardText{font-family:"Comic Mono";font-size:15px;fill:#415166}.line{fill:none;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round}
    </style>
  </defs>
  <rect class="canvas" width="1660" height="700"/>
  <rect class="frame" x="24" y="24" width="1612" height="652" rx="24"/>
  <text class="title" x="830" y="70" text-anchor="middle">WebFlux user rate limit architecture</text>
  <text class="subtitle" x="830" y="102" text-anchor="middle">v1 WebFlux endpoints consume distributed Bucket4j tokens; v2 endpoints bypass the filter target list.</text>

  <rect class="layer" x="68" y="142" width="238" height="494" rx="18"/>
  <text class="layerLabel" x="96" y="180">HTTP caller</text>
  <g filter="url(#shadow)">
    <rect x="108" y="266" width="158" height="118" rx="16" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.7"/>
    <text class="cardTitle" x="187" y="310" text-anchor="middle">Client</text>
    <text class="cardText" x="187" y="342" text-anchor="middle">UID header</text>
    <text class="cardText" x="187" y="368" text-anchor="middle">or remote host</text>
  </g>

  <rect class="layer" x="360" y="142" width="342" height="494" rx="18"/>
  <text class="layerLabel" x="388" y="180">WebFilter layer</text>
  <g filter="url(#shadow)">
    <rect x="402" y="222" width="258" height="118" rx="16" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.7"/>
    <text class="cardTitle" x="531" y="266" text-anchor="middle">UserKeyResolver</text>
    <text class="cardText" x="531" y="298" text-anchor="middle">X-Bluetape4k-UID</text>
    <text class="cardText" x="531" y="324" text-anchor="middle">fallback host</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="402" y="418" width="258" height="124" rx="16" fill="#F0FDF4" stroke="#16A34A" stroke-width="1.7"/>
    <text class="cardTitle" x="531" y="462" text-anchor="middle">TargetProvider</text>
    <text class="cardText" x="531" y="494" text-anchor="middle">/api/v1/reactive/**</text>
    <text class="cardText" x="531" y="520" text-anchor="middle">/api/v1/coroutines/**</text>
  </g>

  <rect class="layer" x="756" y="142" width="380" height="494" rx="18"/>
  <text class="layerLabel" x="784" y="180">Limiter beans</text>
  <g filter="url(#shadow)">
    <rect x="800" y="218" width="292" height="124" rx="16" fill="#ECFEFF" stroke="#0891B2" stroke-width="1.7"/>
    <text class="cardTitle" x="946" y="262" text-anchor="middle">UserRateLimitWebFilter</text>
    <text class="cardText" x="946" y="294" text-anchor="middle">DistributedRateLimiter</text>
    <text class="cardText" x="946" y="320" text-anchor="middle">reactive chain</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="800" y="418" width="292" height="124" rx="16" fill="#FFF7ED" stroke="#D97706" stroke-width="1.7"/>
    <text class="cardTitle" x="946" y="462" text-anchor="middle">AsyncUserRateLimit</text>
    <text class="cardText" x="946" y="494" text-anchor="middle">SuspendRateLimiter</text>
    <text class="cardText" x="946" y="520" text-anchor="middle">mono(Dispatchers.IO)</text>
  </g>

  <rect class="layer" x="1190" y="142" width="402" height="494" rx="18"/>
  <text class="layerLabel" x="1218" y="180">Distributed bucket store</text>
  <g filter="url(#shadow)">
    <rect x="1232" y="218" width="314" height="128" rx="16" fill="#F8FAFC" stroke="#475569" stroke-width="1.7"/>
    <text class="cardTitle" x="1389" y="262" text-anchor="middle">Bucket4jConfig</text>
    <text class="cardText" x="1389" y="294" text-anchor="middle">10 / 10s + 100 / minute</text>
    <text class="cardText" x="1389" y="320" text-anchor="middle">90s expiration strategy</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="1232" y="424" width="314" height="118" rx="16" fill="#FFF1F2" stroke="#E11D48" stroke-width="1.7"/>
    <rect x="1264" y="458" width="78" height="34" rx="17" fill="#FFE4E6" stroke="#E11D48" stroke-width="2.8"/>
    <path d="M 1264 475 C 1264 496 1342 496 1342 475" fill="none" stroke="#E11D48" stroke-width="2.8"/>
    <text class="cardTitle" x="1432" y="472" text-anchor="middle">Redis</text>
    <text class="cardText" x="1432" y="504" text-anchor="middle">Lettuce proxy manager</text>
  </g>

  <path class="line" d="M 266 325 L 402 281" stroke="#2563EB" marker-end="url(#arrowBlue)"/>
  <path class="line" d="M 660 281 L 800 280" stroke="#2563EB" marker-end="url(#arrowBlue)"/>
  <path class="line" d="M 660 480 L 800 480" stroke="#16A34A" marker-end="url(#arrowGreen)"/>
  <path class="line" d="M 1092 280 L 1232 282" stroke="#475569" marker-end="url(#arrowSlate)"/>
  <path class="line" d="M 1092 480 L 1232 483" stroke="#E11D48" marker-end="url(#arrowRose)"/>
  <path class="line" d="M 1389 346 L 1389 424" stroke="#E11D48" marker-end="url(#arrowRose)"/>
</svg>
