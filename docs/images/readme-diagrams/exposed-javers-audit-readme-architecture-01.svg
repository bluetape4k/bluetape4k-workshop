<svg xmlns="http://www.w3.org/2000/svg" width="1660" height="1080" viewBox="0 0 1660 1080" role="img" aria-labelledby="title desc">
  <title id="title">exposed/javers-audit architecture</title>
  <desc id="desc">Static architecture showing ProductAuditService writing JaVers audit snapshots and the Exposed current ProductTable row.</desc>
  <defs>
    <style>
      svg{background:#f8fafc}
      .frame{fill:#ffffff;stroke:#d8e4ef;stroke-width:2}
      .title{font-family:"Architects Daughter";font-size:42px;fill:#142033}
      .subtitle,.small,.footer{font-family:"Comic Mono";fill:#435469}
      .subtitle{font-size:17px}.small{font-size:15px}.footer{font-size:13px;fill:#5f7181}
      .layer{stroke:#d7e5ee;stroke-width:2}
      .entryLayer{fill:#f6fbff}.serviceLayer{fill:#f8fcf7}.targetLayer{fill:#fffcf6}.readLayer{fill:#faf8ff}
      .layerTitle{font-family:"Architects Daughter";font-size:27px;fill:#1f3448}
      .card{stroke-width:2.4}
      .value{fill:#eef7ff;stroke:#7aa6cf}.service{fill:#effaf2;stroke:#75a985}.audit{fill:#f7f1ff;stroke:#9b83c7}.db{fill:#fff7e8;stroke:#c59352}.read{fill:#f5f8fb;stroke:#91a7b8}
      .cardTitle{font-family:"Architects Daughter";font-size:27px;fill:#142033}
      .line{fill:none;stroke:#52748d;stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}
      .auditLine{fill:none;stroke:#7a64aa;stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#auditArrow)}
      .dbLine{fill:none;stroke:#9b6b2f;stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#dbArrow)}
      .readLine{fill:none;stroke:#6b8191;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:9 7;marker-end:url(#readArrow)}
    </style>
    <marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" viewBox="0 0 10 10" refX="9" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#52748d" stroke-dasharray="none" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="auditArrow" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" viewBox="0 0 10 10" refX="9" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#7a64aa" stroke-dasharray="none" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="dbArrow" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" viewBox="0 0 10 10" refX="9" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#9b6b2f" stroke-dasharray="none" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="readArrow" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" viewBox="0 0 10 10" refX="9" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#6b8191" stroke-dasharray="none" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <g id="dbIcon">
      <rect x="0" y="0" width="70" height="70" rx="13" fill="#fffaf2" stroke="#28485a" stroke-width="4"/>
      <ellipse cx="35" cy="20" rx="19" ry="8" fill="#fff0d8" stroke="#8c6f33" stroke-width="4"/>
      <path d="M16 20v28c0 6 9 10 19 10s19-4 19-10V20" fill="#fff0d8" stroke="#8c6f33" stroke-width="4" stroke-linejoin="round"/>
      <path d="M16 34c0 6 9 10 19 10s19-4 19-10" fill="none" stroke="#8c6f33" stroke-width="3" stroke-linecap="round"/>
      <path d="M16 48c0 6 9 10 19 10s19-4 19-10" fill="none" stroke="#8c6f33" stroke-width="3" stroke-linecap="round"/>
    </g>
  </defs>

  <rect class="frame" x="30" y="28" width="1600" height="1024" rx="18"/>
  <text class="title" x="830" y="84" text-anchor="middle">JaVers Audit Boundary over Exposed JDBC</text>
  <text class="subtitle" x="830" y="116" text-anchor="middle">One immutable Product value feeds two stores: audit snapshots in JaVers and the latest row in ProductTable.</text>

  <rect class="layer entryLayer" x="70" y="158" width="1520" height="180" rx="14"/>
  <text class="layerTitle" x="102" y="200">Input value</text>
  <rect class="card value" x="180" y="228" width="320" height="78" rx="10"/>
  <text class="cardTitle" x="340" y="260" text-anchor="middle">Product</text>
  <text class="small" x="340" y="286" text-anchor="middle">id, name, price, category</text>
  <rect class="card read" x="1130" y="220" width="330" height="94" rx="10"/>
  <text class="cardTitle" x="1295" y="254" text-anchor="middle">Caller / Test</text>
  <text class="small" x="1295" y="280" text-anchor="middle">save, delete, history, latest, diff</text>

  <rect class="layer serviceLayer" x="70" y="392" width="1520" height="200" rx="14"/>
  <text class="layerTitle" x="102" y="434">Service boundary</text>
  <rect class="card service" x="620" y="462" width="420" height="96" rx="10"/>
  <text class="cardTitle" x="830" y="496" text-anchor="middle">ProductAuditService</text>
  <text class="small" x="830" y="522" text-anchor="middle">validates author; orders audit and row writes</text>
  <text class="small" x="830" y="546" text-anchor="middle">diff compares values without persistence</text>

  <rect class="layer targetLayer" x="70" y="648" width="1520" height="235" rx="14"/>
  <text class="layerTitle" x="102" y="690">Persistence targets</text>
  <rect class="card audit" x="170" y="738" width="430" height="100" rx="10"/>
  <text class="cardTitle" x="385" y="772" text-anchor="middle">JaVers in-memory repository</text>
  <text class="small" x="385" y="798" text-anchor="middle">commit / commitShallowDelete</text>
  <text class="small" x="385" y="822" text-anchor="middle">snapshots queried oldest-first</text>
  <rect class="card db" x="1060" y="722" width="440" height="128" rx="10"/>
  <use href="#dbIcon" x="1092" y="751"/>
  <text class="cardTitle" x="1320" y="766" text-anchor="middle">H2 ProductTable</text>
  <text class="small" x="1320" y="792" text-anchor="middle">products(id, name, price, category)</text>
  <text class="small" x="1320" y="816" text-anchor="middle">upsert latest row; delete current row</text>

  <rect class="layer readLayer" x="70" y="920" width="1520" height="82" rx="14"/>
  <text class="small" x="830" y="970" text-anchor="middle">Reader contract: JaVers owns history and diff state; Exposed owns only the current relational row.</text>

  <path class="line" d="M 500 267 L 720 267 Q 730 267 730 277 L 730 462" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="line" d="M 1130 267 L 940 267 Q 930 267 930 277 L 930 462" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="auditLine" d="M 700 558 L 700 680 Q 700 690 690 690 L 395 690 Q 385 690 385 700 L 385 738" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="dbLine" d="M 960 558 L 960 680 Q 960 690 970 690 L 1270 690 Q 1280 690 1280 700 L 1280 722" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="readLine" d="M 600 790 L 820 790 Q 830 790 830 780 L 830 558" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="readLine" d="M 1060 790 L 880 790 Q 870 790 870 780 L 870 558" stroke-linecap="round" stroke-linejoin="round"/>

  <text class="footer" x="830" y="1030" text-anchor="middle">No event bus or application server is hidden here; the example is a service-level audit boundary plus one Exposed table.</text>
</svg>
