<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="980" viewBox="0 0 1680 980" role="img" aria-labelledby="title desc">
  <title id="title">exposed/javers-audit architecture</title>
  <desc id="desc">Static architecture for ProductAuditService committing Product values to JaVers snapshots and Exposed ProductTable.</desc>
  <defs>
    <style>
      svg{background:#f8fafc}
      .frame{fill:#ffffff;stroke:#d8e4ef;stroke-width:2}
      .title{font-family:"Architects Daughter";font-size:42px;fill:#142033}
      .subtitle,.small,.label{font-family:"Comic Mono";fill:#425267}
      .subtitle{font-size:17px}
      .layer{fill:#fbfdff;stroke:#d8e4ef;stroke-width:2}
      .layerTitle{font-family:"Architects Daughter";font-size:27px;fill:#1f3448}
      .card{fill:#ffffff;stroke-width:2.4}
      .product{stroke:#7aa6cf;fill:#eef7ff}
      .service{stroke:#75a985;fill:#f0fbf3}
      .audit{stroke:#b596d8;fill:#f7f1ff}
      .db{stroke:#d2a86b;fill:#fff8eb}
      .titleCard{font-family:"Architects Daughter";font-size:27px;fill:#142033}
      .small{font-size:15px}
      .label{font-size:14px;fill:#53657a}
      .lineLabel{fill:#ffffff;stroke:#d8e4ef;stroke-width:1.4}
      .line{fill:none;stroke:#57758f;stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}
      .side{fill:none;stroke:#8a6bb0;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrowAudit)}
      .dbLine{fill:none;stroke:#a56f2a;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrowDb)}
      .note{fill:#ffffff;stroke:#d8e4ef;stroke-width:1.8}
    </style>
    <marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="15" markerHeight="15" viewBox="0 0 10 10" refX="9" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#57758f"/></marker>
    <marker id="arrowAudit" markerUnits="userSpaceOnUse" markerWidth="15" markerHeight="15" viewBox="0 0 10 10" refX="9" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#8a6bb0"/></marker>
    <marker id="arrowDb" markerUnits="userSpaceOnUse" markerWidth="15" markerHeight="15" viewBox="0 0 10 10" refX="9" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#a56f2a"/></marker>
    <g id="databaseIcon">
      <rect x="0" y="0" width="58" height="58" rx="12" fill="#fffaf2" stroke="#8c6f33" stroke-width="3"/>
      <path d="M15 21v20c0 6 28 6 28 0V21" fill="#fff0d8" stroke="#8c6f33" stroke-width="3" stroke-linejoin="round"/>
      <path d="M15 31c0 6 28 6 28 0" fill="none" stroke="#8c6f33" stroke-width="2.4" stroke-linecap="round"/>
      <ellipse cx="29" cy="21" rx="14" ry="6" fill="#fff0d8" stroke="#8c6f33" stroke-width="3"/>
    </g>
  </defs>

  <rect class="frame" x="30" y="28" width="1620" height="924" rx="18"/>
  <text class="title" x="840" y="82" text-anchor="middle">JaVers Audit + Exposed Current Row</text>
  <text class="subtitle" x="840" y="115" text-anchor="middle">ProductAuditService writes audit history first, then keeps the relational ProductTable in sync.</text>

  <rect class="layer" x="70" y="165" width="1540" height="190" rx="14"/>
  <text class="layerTitle" x="100" y="205">Value and service boundary</text>
  <rect class="card product" x="160" y="235" width="300" height="86" rx="9"/>
  <text class="titleCard" x="310" y="270" text-anchor="middle">Product</text>
  <text class="small" x="310" y="296" text-anchor="middle">id, name, price, category</text>
  <rect class="card service" x="680" y="225" width="340" height="106" rx="9"/>
  <text class="titleCard" x="850" y="260" text-anchor="middle">ProductAuditService</text>
  <text class="small" x="850" y="286" text-anchor="middle">save, delete, history, diff</text>
  <text class="small" x="850" y="310" text-anchor="middle">author validation + transaction calls</text>
  <rect class="card product" x="1220" y="235" width="300" height="86" rx="9"/>
  <text class="titleCard" x="1370" y="270" text-anchor="middle">Test contract</text>
  <text class="small" x="1370" y="296" text-anchor="middle">INITIAL, UPDATE, TERMINAL snapshots</text>

  <path class="line" d="M 460 278 H 680"/>
  <text class="label" x="570" y="256" text-anchor="middle">immutable value</text>
  <path class="line" d="M 1020 278 H 1220"/>
  <text class="label" x="1120" y="256" text-anchor="middle">verified behavior</text>

  <rect class="layer" x="70" y="420" width="1540" height="270" rx="14"/>
  <text class="layerTitle" x="100" y="460">Persistence targets</text>
  <rect class="card audit" x="235" y="500" width="390" height="112" rx="9"/>
  <text class="titleCard" x="430" y="536" text-anchor="middle">JaVers in-memory repository</text>
  <text class="small" x="430" y="562" text-anchor="middle">commit(), commitShallowDelete()</text>
  <text class="small" x="430" y="586" text-anchor="middle">findSnapshots(), latestSnapshotOrNull()</text>
  <rect class="card db" x="1055" y="492" width="390" height="128" rx="9"/>
  <use href="#databaseIcon" x="1082" y="528"/>
  <text class="titleCard" x="1278" y="536" text-anchor="middle">H2 ProductTable</text>
  <text class="small" x="1278" y="562" text-anchor="middle">products(id, name, price, category)</text>
  <text class="small" x="1278" y="586" text-anchor="middle">upsert current row / delete row</text>

  <path class="side" d="M 760 331 V 392 H 430 V 500"/>
  <rect class="lineLabel" x="508" y="363" width="176" height="26" rx="13"/>
  <text class="label" x="596" y="381" text-anchor="middle">audit history path</text>
  <path class="dbLine" d="M 940 331 V 392 H 1250 V 492"/>
  <rect class="lineLabel" x="1017" y="363" width="176" height="26" rx="13"/>
  <text class="label" x="1105" y="381" text-anchor="middle">current row path</text>

  <rect class="layer" x="70" y="745" width="1540" height="145" rx="14"/>
  <text class="layerTitle" x="100" y="785">Reader contract</text>
  <rect class="note" x="255" y="812" width="1170" height="48" rx="10"/>
  <text class="small" x="840" y="843" text-anchor="middle">Diff compares values only; history queries read JaVers snapshots; Exposed stores the latest table row.</text>
</svg>
