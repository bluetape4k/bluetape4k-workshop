<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1180" viewBox="0 0 1100 1180" role="img" aria-labelledby="title desc">
  <title id="title">Graph IO Pipeline Architecture</title>
  <desc id="desc">CSV fixtures flow from top to bottom through GraphIoPipeline, TinkerGraph, graph-io export adapters, graph-io reports, and round-trip tests.</desc>
  <defs>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#64748B" flood-opacity="0.14"/>
    </filter>
    <marker id="arrowBlue" viewBox="0 0 10 10" markerWidth="14" markerHeight="14" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse" data-role="primary" data-tip-direction="positive-x">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#2563EB" stroke-dasharray="none" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" markerWidth="14" markerHeight="14" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse" data-role="primary" data-tip-direction="positive-x">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#15803D" stroke-dasharray="none" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" markerWidth="14" markerHeight="14" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse" data-role="primary" data-tip-direction="positive-x">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#7C3AED" stroke-dasharray="none" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .canvas{fill:#F8FAFC}.frame{fill:#FFFFFF;stroke:#CBD5E1;stroke-width:2}.title{font-family:"Architects Daughter";font-size:42px;fill:#102033}.subtitle,.cardText,.footer{font-family:"Comic Mono";fill:#415166}.subtitle{font-size:17px}.cardTitle{font-family:"Architects Daughter";font-size:27px;fill:#102033}.cardText{font-size:14px}.node rect{rx:14;filter:url(#shadow)}.line{fill:none;stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round}.blue{stroke:#2563EB;marker-end:url(#arrowBlue)}.green{stroke:#15803D;marker-end:url(#arrowGreen)}.purple{stroke:#7C3AED;marker-end:url(#arrowPurple)}.footer{font-size:14px;fill:#526272}
    </style>
  </defs>

  <rect class="canvas" width="1100" height="1180"/>
  <rect class="frame" x="28" y="24" width="1044" height="1132" rx="24"/>
  <text class="title" x="550" y="78" text-anchor="middle">Graph IO Pipeline Architecture</text>
  <text class="subtitle" x="550" y="112" text-anchor="middle">A small CSV fixture flows top-to-bottom through graph-io adapters, reports, and round-trip tests.</text>

  <g class="node" data-node="csv">
    <rect x="430" y="155" width="240" height="88" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
    <text class="cardTitle" x="550" y="191" text-anchor="middle">CSV fixtures</text>
    <text class="cardText" x="550" y="217" text-anchor="middle">vertices.csv + edges.csv</text>
  </g>

  <g class="node" data-node="pipeline">
    <rect x="410" y="310" width="280" height="92" fill="#F0FDF4" stroke="#15803D" stroke-width="2"/>
    <text class="cardTitle" x="550" y="346" text-anchor="middle">GraphIoPipeline</text>
    <text class="cardText" x="550" y="372" text-anchor="middle">scratch import, fail-fast options</text>
  </g>

  <g class="node" data-node="tinkergraph">
    <rect x="410" y="470" width="280" height="92" fill="#FFF7ED" stroke="#EA580C" stroke-width="2"/>
    <text class="cardTitle" x="550" y="506" text-anchor="middle">TinkerGraph</text>
    <text class="cardText" x="550" y="532" text-anchor="middle">3 vertices, 2 edges</text>
  </g>

  <g class="node" data-node="ndjson">
    <rect x="210" y="650" width="280" height="92" fill="#F5F3FF" stroke="#7C3AED" stroke-width="2"/>
    <text class="cardTitle" x="350" y="686" text-anchor="middle">Jackson3 NDJSON</text>
    <text class="cardText" x="350" y="712" text-anchor="middle">line-delimited records</text>
  </g>

  <g class="node" data-node="graphml">
    <rect x="610" y="650" width="280" height="92" fill="#F5F3FF" stroke="#7C3AED" stroke-width="2"/>
    <text class="cardTitle" x="750" y="686" text-anchor="middle">GraphML</text>
    <text class="cardText" x="750" y="712" text-anchor="middle">strict unsupported elements</text>
  </g>

  <g class="node" data-node="reports">
    <rect x="410" y="830" width="280" height="92" fill="#ECFEFF" stroke="#0891B2" stroke-width="2"/>
    <text class="cardTitle" x="550" y="866" text-anchor="middle">Graph IO reports</text>
    <text class="cardText" x="550" y="892" text-anchor="middle">COMPLETED or failures</text>
  </g>

  <g class="node" data-node="tests">
    <rect x="410" y="990" width="280" height="92" fill="#FDF2F8" stroke="#DB2777" stroke-width="2"/>
    <text class="cardTitle" x="550" y="1026" text-anchor="middle">Round-trip tests</text>
    <text class="cardText" x="550" y="1052" text-anchor="middle">counts, labels, properties</text>
  </g>

  <g class="edge" data-edge="csv-&gt;pipeline" data-label="paired CSV import">
    <path class="line blue" d="M 550 243 L 550 310"/>
  </g>
  <g class="edge" data-edge="pipeline-&gt;tinkergraph" data-label="GraphOperations writes">
    <path class="line green" d="M 550 402 L 550 470"/>
  </g>
  <g class="edge" data-edge="tinkergraph-&gt;ndjson" data-label="filtered export">
    <path class="line purple" d="M 505 562 L 505 606 L 350 606 L 350 650"/>
  </g>
  <g class="edge" data-edge="tinkergraph-&gt;graphml" data-label="filtered export">
    <path class="line purple" d="M 595 562 L 595 606 L 750 606 L 750 650"/>
  </g>
  <g class="edge" data-edge="ndjson-&gt;reports" data-label="report contract">
    <path class="line blue" d="M 350 742 L 350 786 L 505 786 L 505 830"/>
  </g>
  <g class="edge" data-edge="graphml-&gt;reports" data-label="report contract">
    <path class="line purple" d="M 750 742 L 750 786 L 595 786 L 595 830"/>
  </g>
  <g class="edge" data-edge="reports-&gt;tests" data-label="assert status">
    <path class="line green" d="M 550 922 L 550 990"/>
  </g>

  <rect x="120" y="1102" width="860" height="40" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
  <text class="footer" x="550" y="1127" text-anchor="middle">Reader contract: format adapters and report checks, not upload sanitization or container-backed graph databases.</text>
</svg>
