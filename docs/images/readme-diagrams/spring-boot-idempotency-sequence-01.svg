<svg xmlns="http://www.w3.org/2000/svg" width="1845" height="1592" viewBox="0 0 1845 1592" role="img" aria-label="idempotency Sequence Flow">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#1f2937" flood-opacity="0.10"/></filter>
  <marker id="openArrow" markerWidth="10" markerHeight="8" refX="8.5" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M 1 1 L 8.5 4 L 1 7" fill="none" stroke="#758297" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <marker id="inherit" markerWidth="11" markerHeight="10" refX="9.5" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 1 L 9.5 5 L 0.5 9 Z" fill="#ffffff" stroke="#758297" stroke-width="1.7"/></marker>
  <style>
    .canvas{fill:#f7f9fc}.frame{fill:#fff;stroke:#d8e0ea;stroke-width:1.5}
    .title{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:43px;font-weight:400;fill:#102033}
    .subtitle{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:15px;font-weight:400;fill:#536273}
    .label{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:25px;font-weight:400;fill:#102033}
    .smallLabel{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:21px;font-weight:400;fill:#102033}
    .mono{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#102033}
    .small{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#536273}
    .strong{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:13px;font-weight:400;fill:#102033}
    .card{stroke-width:2.1;filter:url(#shadow)}.compartment{stroke-width:1.5;fill:none}
    .line{stroke:#758297;stroke-width:2.1;fill:none;marker-end:url(#openArrow)}
    .plainLine{stroke:#758297;stroke-width:2.1;fill:none}
    .dashed{stroke:#758297;stroke-width:2.1;stroke-dasharray:7 6;fill:none;marker-end:url(#openArrow)}
    .inheritLine{stroke:#758297;stroke-width:2.2;fill:none;marker-end:url(#inherit)}
    .implLine{stroke:#758297;stroke-width:2.2;stroke-dasharray:8 7;fill:none;marker-end:url(#inherit)}
  </style>
</defs>
<rect class="canvas" width="1845" height="1592"/>
<rect class="frame" x="32" y="28" width="1781" height="1536" rx="28"/>
<text class="title" x="66" y="82">idempotency Sequence Flow</text>
<text class="subtitle" x="70" y="118">Sequence messages from the original Mermaid source</text>
<rect class="card" x="1.5" y="166" width="277" height="72" rx="20" fill="#E8F3FF" stroke="#5B8DEF"/>
<text class="smallLabel" x="140" y="209" text-anchor="middle">Client</text>
<line class="lifeline" x1="140" y1="252" x2="140" y2="1532" stroke="#b7c2d1" stroke-width="2" stroke-dasharray="10 10"/>
<rect class="card" x="392.75" y="166" width="277" height="72" rx="20" fill="#EAF7EF" stroke="#58A978"/>
<text class="smallLabel" x="531.25" y="209" text-anchor="middle">OrderController</text>
<line class="lifeline" x1="531.25" y1="252" x2="531.25" y2="1532" stroke="#b7c2d1" stroke-width="2" stroke-dasharray="10 10"/>
<rect class="card" x="784" y="166" width="277" height="72" rx="20" fill="#FFF3D9" stroke="#D6A441"/>
<text class="smallLabel" x="922.5" y="209" text-anchor="middle">IdempotencyService</text>
<line class="lifeline" x1="922.5" y1="252" x2="922.5" y2="1532" stroke="#b7c2d1" stroke-width="2" stroke-dasharray="10 10"/>
<rect class="card" x="1175.25" y="166" width="277" height="72" rx="20" fill="#FDECEF" stroke="#DC6B82"/>
<text class="smallLabel" x="1313.75" y="209" text-anchor="middle">Redis</text>
<line class="lifeline" x1="1313.75" y1="252" x2="1313.75" y2="1532" stroke="#b7c2d1" stroke-width="2" stroke-dasharray="10 10"/>
<rect class="card" x="1566.5" y="166" width="277" height="72" rx="20" fill="#E9F7F6" stroke="#45A7A1"/>
<text class="smallLabel" x="1705" y="209" text-anchor="middle">RedisRMapCache</text>
<line class="lifeline" x1="1705" y1="252" x2="1705" y2="1532" stroke="#b7c2d1" stroke-width="2" stroke-dasharray="10 10"/>
<rect x="144.125" y="286" width="383" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="162.125" y="313" text-anchor="start">1. POST /api/orders Idempotency-Key: &lt;uuid&gt;</text>
<path class="line" d="M140 344 L531.25 344"/>
<rect x="591.875" y="396" width="270" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="609.875" y="423" text-anchor="start">2. processOrder(key, request)</text>
<path class="line" d="M531.25 454 L922.5 454"/>
<rect x="1208.75" y="506" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="1226.75" y="533" text-anchor="start">3. GET key</text>
<path class="line" d="M922.5 564 L1705 564"/>
<rect x="70" y="616" width="1705" height="40" rx="16" fill="#F7F1E7" stroke="#B88A44" stroke-width="1.6" opacity="0.96"/>
<text class="strong" x="92" y="643" text-anchor="start">ALT: Cache HIT (replay)</text>
<rect x="1208.75" y="684" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="1226.75" y="711" text-anchor="start">5. CachedResponse</text>
<path class="dashed" d="M1705 742 L922.5 742"/>
<rect x="599.875" y="794" width="254" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="617.875" y="821" text-anchor="start">6. IdempotencyResult.Replay</text>
<path class="dashed" d="M922.5 852 L531.25 852"/>
<rect x="180.125" y="904" width="311" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="198.125" y="931" text-anchor="start">7. 200 OK + original OrderResponse</text>
<path class="dashed" d="M531.25 962 L140 962"/>
<rect x="70" y="1014" width="1705" height="40" rx="16" fill="#F7F1E7" stroke="#B88A44" stroke-width="1.6" opacity="0.96"/>
<text class="strong" x="92" y="1041" text-anchor="start">ELSE: Cache MISS (first write)</text>
<rect x="1208.75" y="1082" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="1226.75" y="1109" text-anchor="start">9. null</text>
<path class="dashed" d="M1705 1140 L922.5 1140"/>
<rect x="1134.25" y="1192" width="359" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="1152.25" y="1219" text-anchor="start">10. putIfAbsent(key, response, TTL=5min)</text>
<path class="line" d="M922.5 1250 L1705 1250"/>
<rect x="591.875" y="1302" width="270" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="609.875" y="1329" text-anchor="start">11. IdempotencyResult.Created</text>
<path class="dashed" d="M922.5 1360 L531.25 1360"/>
<rect x="176.125" y="1412" width="319" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="194.125" y="1439" text-anchor="start">12. 201 Created + new OrderResponse</text>
<path class="dashed" d="M531.25 1470 L140 1470"/>
</svg>
