<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="560" viewBox="0 0 1040 560" role="img" aria-label="Idempotency key check flow sequence">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#1f2937" flood-opacity="0.10"/></filter>
  <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth">
    <path d="M1,1 L8,4.5 L1,8 Z" fill="#758297"/>
  </marker>
  <style>
    .canvas{fill:#f7f9fc}.frame{fill:#fff;stroke:#d8e0ea;stroke-width:1.5}
    .title{font-family:"Architects Daughter";font-size:38px;font-weight:400;fill:#102033}
    .subtitle{font-family:"Comic Mono";font-size:14px;font-weight:400;fill:#536273}
    .smallLabel{font-family:"Architects Daughter";font-size:21px;font-weight:400;fill:#102033}
    .mono{font-family:"Comic Mono";font-size:12px;font-weight:400;fill:#102033}
    .small{font-family:"Comic Mono";font-size:12px;font-weight:400;fill:#536273}
    .card{stroke-width:2.1;filter:url(#shadow)}
    .lifeline{stroke:#b0bbca;stroke-width:1.5;stroke-dasharray:6 4;fill:none}
    .reqArrow{stroke:#5B8DEF;stroke-width:2.1;fill:none;marker-end:url(#arrow)}
    .rspArrow{stroke:#45A7A1;stroke-width:2.1;stroke-dasharray:7 4;fill:none;marker-end:url(#arrow)}
    .altBox{fill:#FFF3D9;stroke:#D6A441;stroke-width:1.5}
    .msgLabel{font-family:"Comic Mono";font-size:13px;fill:#102033}
  </style>
</defs>
<rect class="canvas" width="1040" height="560"/>
<rect class="frame" x="24" y="20" width="992" height="520" rx="22"/>

<!-- Title -->
<text class="title" x="48" y="66">Idempotency Key Check Flow</text>
<text class="subtitle" x="52" y="88">Idempotency-Key header: cache HIT (replay 200) vs MISS (create 201)</text>

<!-- Participants cx: 100, 270, 480, 680, 900 -->
<!-- Client -->
<g transform="translate(44,104)">
  <rect class="card" x="0" y="0" width="112" height="68" rx="12" fill="#E8F3FF" stroke="#5B8DEF"/>
  <text class="smallLabel" style="font-size:17px" x="56" y="30" text-anchor="middle">Client</text>
  <text class="small" x="56" y="52" text-anchor="middle">HTTP</text>
</g>
<!-- OrderController -->
<g transform="translate(212,104)">
  <rect class="card" x="0" y="0" width="120" height="68" rx="12" fill="#EAF7EF" stroke="#58A978"/>
  <text class="smallLabel" style="font-size:17px" x="60" y="28" text-anchor="middle">Order</text>
  <text class="smallLabel" style="font-size:17px" x="60" y="52" text-anchor="middle">Controller</text>
</g>
<!-- IdempotencyService -->
<g transform="translate(412,104)">
  <rect class="card" x="0" y="0" width="140" height="68" rx="12" fill="#FFF3D9" stroke="#D6A441"/>
  <text class="smallLabel" style="font-size:17px" x="70" y="26" text-anchor="middle">Idempotency</text>
  <text class="smallLabel" style="font-size:17px" x="70" y="50" text-anchor="middle">Service</text>
</g>
<!-- Redis -->
<g transform="translate(622,104)">
  <rect class="card" x="0" y="0" width="120" height="68" rx="12" fill="#FDECEF" stroke="#DC6B82"/>
  <text class="smallLabel" style="font-size:17px" x="60" y="30" text-anchor="middle">Redis</text>
  <text class="small" x="60" y="52" text-anchor="middle">RMapCache</text>
</g>
<!-- OrderService -->
<g transform="translate(808,104)">
  <rect class="card" x="0" y="0" width="140" height="68" rx="12" fill="#E9F7F6" stroke="#45A7A1"/>
  <text class="smallLabel" style="font-size:17px" x="70" y="30" text-anchor="middle">Order</text>
  <text class="smallLabel" style="font-size:17px" x="70" y="54" text-anchor="middle">Service</text>
</g>

<!-- Lifelines cx: 100, 272, 482, 682, 878 -->
<line class="lifeline" x1="100" y1="172" x2="100" y2="540"/>
<line class="lifeline" x1="272" y1="172" x2="272" y2="540"/>
<line class="lifeline" x1="482" y1="172" x2="482" y2="540"/>
<line class="lifeline" x1="682" y1="172" x2="682" y2="540"/>
<line class="lifeline" x1="878" y1="172" x2="878" y2="540"/>

<!-- Step 1: POST /orders with Idempotency-Key -->
<text class="msgLabel" x="48" y="206">1. POST /api/orders  Idempotency-Key: &lt;uuid&gt;</text>
<path class="reqArrow" d="M100,210 L264,210"/>

<!-- Step 2: Controller → IdempotencyService -->
<text class="msgLabel" x="284" y="240">2. processOrder(key, request)</text>
<path class="reqArrow" d="M272,244 L474,244"/>

<!-- Step 3: Service → Redis: GET key -->
<text class="msgLabel" x="494" y="274">3. GET key from cache</text>
<path class="reqArrow" d="M482,278 L674,278"/>

<!-- ALT box: Cache HIT -->
<rect class="altBox" x="48" y="294" width="940" height="84" rx="8"/>
<text class="mono" x="60" y="312" fill="#D6A441">ALT: Cache HIT (replay)</text>

<!-- Step 4: Redis returns cached response -->
<text class="msgLabel" x="494" y="330">4. CachedResponse (OrderResponse)</text>
<path class="rspArrow" d="M674,334 L490,334"/>

<!-- Step 5: Service returns replay result -->
<text class="msgLabel" x="284" y="360">5. IdempotencyResult.Replay → 200 OK</text>
<path class="rspArrow" d="M474,364 L280,364"/>
<path class="rspArrow" d="M264,364 L108,364"/>

<!-- ALT box: Cache MISS -->
<rect class="altBox" x="48" y="390" width="940" height="120" rx="8"/>
<text class="mono" x="60" y="408" fill="#D6A441">ELSE: Cache MISS (first write)</text>

<!-- Step 6: Redis returns null -->
<text class="msgLabel" x="494" y="424">6. null (key not found)</text>
<path class="rspArrow" d="M674,428 L490,428"/>

<!-- Step 7: Service → OrderService process -->
<text class="msgLabel" x="494" y="454">7. processNewOrder(request)</text>
<path class="reqArrow" d="M482,458 L870,458"/>

<!-- Step 8: putIfAbsent → Redis, return 201 -->
<text class="msgLabel" x="494" y="486">8. putIfAbsent(key, response, TTL=5min)</text>
<path class="reqArrow" d="M482,490 L674,490"/>
<text class="msgLabel" x="284" y="516">9. IdempotencyResult.Created → 201</text>
<path class="rspArrow" d="M474,518 L108,518"/>
</svg>
