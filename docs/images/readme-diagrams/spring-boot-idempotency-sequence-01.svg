<svg xmlns="http://www.w3.org/2000/svg" width="1670" height="1134" viewBox="0 0 1670 1134" role="img" aria-labelledby="title desc">
  <title id="title">Idempotency-Key Request Sequence</title>
  <desc id="desc">The controller validates the key, Redisson atomically stores the first response, and duplicate calls replay the cached result.</desc>
  <defs>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="124%"><feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#64748B" flood-opacity="0.14"/></filter>
    <style>
      .title{font-family:"Architects Daughter";font-size:40px;fill:#263238}.subtitle,.msg,.note,.footer{font-family:"Comic Mono";fill:#36464F}.subtitle{font-size:17px}.participant{font-family:"Architects Daughter";font-size:19px;fill:#1F3138}.role{font-family:"Comic Mono";font-size:12px;fill:#546A73}.msg{font-size:13px}.note{font-size:13px}.footer{font-size:14px;fill:#60727D}.frame{fill:#FBFCF8;stroke:#41545D;stroke-width:3}.header{fill:#FFFFFF;stroke:#546E7A;stroke-width:2}.lifeline{stroke:#9AAAB1;stroke-width:2;stroke-dasharray:7 8;stroke-linecap:round}.activation{fill:#E6F2EC;stroke:#5B7E67;stroke-width:1.5}.call,.work,.return,.skip{fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.call{stroke:#3F7D9C;marker-end:url(#arrow-call);stroke-linecap:round;stroke-linejoin:round}.work{stroke:#6E8F4F;marker-end:url(#arrow-work);stroke-linecap:round;stroke-linejoin:round}.return{stroke:#9B7D54;stroke-width:2.6;stroke-dasharray:8 6;marker-end:url(#arrow-ret);stroke-linecap:round;stroke-linejoin:round}.skip{stroke:#B86868;marker-end:url(#arrow-skip);stroke-linecap:round;stroke-linejoin:round}.label{fill:#FFFFFF;stroke:#D7E0E4;stroke-width:1.5}.callLabel{stroke:#9CC2D1}.workLabel{stroke:#B6C9A4}.returnLabel{stroke:#C8B38F}.skipLabel{stroke:#D9ABAB}.badge{stroke-width:1.8}.callBadge{fill:#EAF4F8;stroke:#3F7D9C}.workBadge{fill:#EEF7F0;stroke:#6E8F4F}.returnBadge{fill:#FFF7E8;stroke:#9B7D54}.skipBadge{fill:#FFF0F0;stroke:#B86868}.badgeText{font-family:"Comic Mono";font-size:12px;font-weight:700}.callText,.badgeText.callText{fill:#2F6F8E}.workText,.badgeText.workText{fill:#55783F}.returnText,.badgeText.returnText{fill:#7F6038}.skipText,.badgeText.skipText{fill:#9D4F4F}.alt{fill:#FFF7ED;fill-opacity:.42;stroke:#D08A39;stroke-width:2.4;stroke-dasharray:12 8}.branch{fill:#FFFFFF;fill-opacity:.82;stroke:#E6C68C;stroke-width:1.5}
    </style>
    <marker id="arrow-call" viewBox="0 0 10 10" markerWidth="14" markerHeight="14" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#3F7D9C" stroke-dasharray="none" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="arrow-work" viewBox="0 0 10 10" markerWidth="14" markerHeight="14" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#6E8F4F" stroke-dasharray="none" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="arrow-ret" viewBox="0 0 10 10" markerWidth="14" markerHeight="14" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#9B7D54" stroke-dasharray="none" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="arrow-skip" viewBox="0 0 10 10" markerWidth="14" markerHeight="14" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#B86868" stroke-dasharray="none" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>
  <rect x="24" y="24" width="1622" height="1086" rx="20" class="frame"/>
  <text x="835" y="76" text-anchor="middle" class="title">Idempotency-Key Request Sequence</text>
  <text x="835" y="106" text-anchor="middle" class="subtitle">The controller validates the key, Redisson atomically stores the first response, and duplicate calls replay the cached result.</text>
  <rect x="100" y="254" width="1470" height="458" rx="16" class="alt"/>
  <rect x="100" y="710" width="1470" height="230" rx="16" class="alt"/>
  <g filter="url(#shadow)"><rect x="75" y="156" width="230" height="76" rx="10" class="header"/><text x="190" y="186" text-anchor="middle" class="participant">Client</text><text x="190" y="211" text-anchor="middle" class="role">HTTP caller</text></g>
  <line x1="190" y1="232" x2="190" y2="1022" class="lifeline"/>
  <g filter="url(#shadow)"><rect x="398" y="156" width="230" height="76" rx="10" class="header"/><text x="513" y="186" text-anchor="middle" class="participant">OrderController</text><text x="513" y="211" text-anchor="middle" class="role">WebFlux endpoint</text></g>
  <line x1="513" y1="232" x2="513" y2="1022" class="lifeline"/>
  <g filter="url(#shadow)"><rect x="720" y="156" width="230" height="76" rx="10" class="header"/><text x="835" y="186" text-anchor="middle" class="participant">IdempotencyService</text><text x="835" y="211" text-anchor="middle" class="role">guard</text></g>
  <line x1="835" y1="232" x2="835" y2="1022" class="lifeline"/>
  <g filter="url(#shadow)"><rect x="1043" y="156" width="230" height="76" rx="10" class="header"/><text x="1158" y="186" text-anchor="middle" class="participant">RMapCache</text><text x="1158" y="211" text-anchor="middle" class="role">Redisson</text></g>
  <line x1="1158" y1="232" x2="1158" y2="1022" class="lifeline"/>
  <g filter="url(#shadow)"><rect x="1365" y="156" width="230" height="76" rx="10" class="header"/><image data-bluetape4k-icon="redis" data-source="docs/icons/redis/redis-icon.svg" x="1381" y="176" width="36" height="36" href="data:image/svg+xml;base64," preserveAspectRatio="xMidYMid meet"/>  <text x="1500" y="186" text-anchor="middle" class="participant">Redis</text><text x="1500" y="211" text-anchor="middle" class="role">TTL store</text></g>
  <line x1="1480" y1="232" x2="1480" y2="1022" class="lifeline"/>
  <rect x="202" y="252" width="325.0" height="34" rx="17" class="label callLabel"/>
  <circle cx="226" cy="269" r="13" class="badge callBadge"/><text x="226" y="274" text-anchor="middle" class="badgeText callText">1</text>
  <text x="250" y="274" class="msg callText">POST /api/orders + Idempotency-Key</text>
  <path d="M 190 300 L 513 300" class="call" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="522.8" y="328" width="302.5" height="34" rx="17" class="label callLabel"/>
  <circle cx="546.8" cy="345" r="13" class="badge callBadge"/><text x="546.8" y="350" text-anchor="middle" class="badgeText callText">2</text>
  <text x="570.8" y="350" class="msg callText">validate header and reserve key</text>
  <path d="M 513 376 L 835 376" class="call" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="852.8" y="404" width="287.5" height="34" rx="17" class="label workLabel"/>
  <circle cx="876.8" cy="421" r="13" class="badge workBadge"/><text x="876.8" y="426" text-anchor="middle" class="badgeText workText">3</text>
  <text x="900.8" y="426" class="msg workText">putIfAbsent processing marker</text>
  <path d="M 835 452 L 1158 452" class="work" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="1204" y="480" width="230.0" height="34" rx="17" class="label workLabel"/>
  <circle cx="1228" cy="497" r="13" class="badge workBadge"/><text x="1228" y="502" text-anchor="middle" class="badgeText workText">4</text>
  <text x="1252" y="502" class="msg workText">atomic cache write</text>
  <path d="M 1158 528 L 1480 528" class="work" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="1204" y="556" width="230.0" height="34" rx="17" class="label returnLabel"/>
  <circle cx="1228" cy="573" r="13" class="badge returnBadge"/><text x="1228" y="578" text-anchor="middle" class="badgeText returnText">5</text>
  <text x="1252" y="578" class="msg returnText">first accepted key</text>
  <path d="M 1480 604 L 1158 604" class="return" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="552.8" y="632" width="242.5" height="34" rx="17" class="label returnLabel"/>
  <circle cx="576.8" cy="649" r="13" class="badge returnBadge"/><text x="576.8" y="654" text-anchor="middle" class="badgeText returnText">6</text>
  <text x="600.8" y="654" class="msg returnText">Created(CachedResponse)</text>
  <path d="M 835 680 L 513 680" class="return" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="236.5" y="708" width="230.0" height="34" rx="17" class="label skipLabel"/>
  <circle cx="260.5" cy="725" r="13" class="badge skipBadge"/><text x="260.5" y="730" text-anchor="middle" class="badgeText skipText">7</text>
  <text x="284.5" y="730" class="msg skipText">retry with same key</text>
  <path d="M 190 756 L 513 756" class="skip" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="1042.5" y="784" width="230.0" height="34" rx="17" class="label skipLabel"/>
  <circle cx="1066.5" cy="801" r="13" class="badge skipBadge"/><text x="1066.5" y="806" text-anchor="middle" class="badgeText skipText">8</text>
  <text x="1090.5" y="806" class="msg skipText">read cached response</text>
  <path d="M 835 832 L 1480 832" class="skip" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="202" y="860" width="340.0" height="34" rx="17" class="label returnLabel"/>
  <circle cx="226" cy="877" r="13" class="badge returnBadge"/><text x="226" y="882" text-anchor="middle" class="badgeText returnText">9</text>
  <text x="250" y="882" class="msg returnText">HTTP 200 with original OrderResponse</text>
  <path d="M 513 908 L 190 908" class="return" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="90" y="1046" width="1490" height="40" rx="12" fill="#FFFFFF" stroke="#CCD7DA" stroke-width="2"/>
  <text x="835" y="1072" text-anchor="middle" class="footer">Reader contract: request order, branch ownership, and infrastructure boundary are shown without hiding call labels.</text>
</svg>
