<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="800" viewBox="0 0 1400 800" role="img" aria-label="Image Processing Architecture">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#1f2937" flood-opacity="0.10"/></filter>
  <marker id="arrow" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse">
    <path d="M2,2 L12,7 L2,12 Z" fill="#758297"/>
  </marker>
  <style>
    .canvas{fill:#f7f9fc}.frame{fill:#fff;stroke:#d8e0ea;stroke-width:1.5}
    .title{font-family:"Architects Daughter";font-size:34px;fill:#102033}
    .subtitle{font-family:"Comic Mono";font-size:14px;fill:#536273}
    .label{font-family:"Architects Daughter";font-size:18px;fill:#102033}
    .mono{font-family:"Comic Mono";font-size:11px;fill:#536273}
    .bandlabel{font-family:"Architects Daughter";font-size:14px;fill:#758297}
    .card{stroke-width:2;filter:url(#shadow)}
    .line{stroke:#758297;stroke-width:2;fill:none;marker-end:url(#arrow)}
  </style>
</defs>
<rect class="canvas" width="1400" height="800"/>
<rect class="frame" x="28" y="24" width="1344" height="752" rx="20"/>

<text class="title" x="52" y="68">Image Processing Architecture</text>
<text class="subtitle" x="52" y="92">Spring Boot 4 + bluetape4k-images + Java 25 libvips FFM · ImageStorage auto-config</text>

<!-- Client -->
<g transform="translate(180,112)">
  <rect class="card" x="0" y="0" width="200" height="48" rx="12" fill="#E0ECFF" stroke="#4A7ADB"/>
  <text class="label" x="100" y="32" text-anchor="middle">HTTP Client</text>
</g>

<!-- Layer 1: HTTP Edge -->
<rect x="52" y="192" width="900" height="108" rx="8" fill="#E8F3FF" stroke="#B8D4F0" stroke-width="1"/>
<text class="bandlabel" x="66" y="212">HTTP Edge</text>

<g transform="translate(72,222)"><rect class="card" x="0" y="0" width="360" height="68" rx="10" fill="#E8F3FF" stroke="#5B8DEF"/><text class="label" x="180" y="26" text-anchor="middle">ImageDerivativesController</text><text class="mono" x="180" y="46" text-anchor="middle">POST /api/images/derivatives</text></g>
<g transform="translate(480,222)"><rect class="card" x="0" y="0" width="360" height="68" rx="10" fill="#E8F3FF" stroke="#5B8DEF"/><text class="label" x="180" y="26" text-anchor="middle">ExceptionHandler</text><text class="mono" x="180" y="46" text-anchor="middle">@RestControllerAdvice</text></g>

<!-- Layer 2: Workflow -->
<rect x="52" y="332" width="900" height="108" rx="8" fill="#EAF7EF" stroke="#B0DAC0" stroke-width="1"/>
<text class="bandlabel" x="66" y="352">Application Workflow</text>

<g transform="translate(72,362)"><rect class="card" x="0" y="0" width="340" height="68" rx="10" fill="#EAF7EF" stroke="#58A978"/><text class="label" x="170" y="26" text-anchor="middle">WorkflowService</text><text class="mono" x="170" y="46" text-anchor="middle">orchestrates pipeline + Micrometer</text></g>
<g transform="translate(440,362)"><rect class="card" x="0" y="0" width="160" height="68" rx="10" fill="#EAF7EF" stroke="#58A978"/><text class="label" x="80" y="26" text-anchor="middle">Validator</text><text class="mono" x="80" y="46" text-anchor="middle">content-type · magic</text></g>
<g transform="translate(620,362)"><rect class="card" x="0" y="0" width="160" height="68" rx="10" fill="#EAF7EF" stroke="#58A978"/><text class="label" x="80" y="26" text-anchor="middle">ImageKeyFactory</text><text class="mono" x="80" y="46" text-anchor="middle">sanitized keys</text></g>
<g transform="translate(800,362)"><rect class="card" x="0" y="0" width="140" height="68" rx="10" fill="#EAF7EF" stroke="#58A978"/><text class="label" x="70" y="26" text-anchor="middle">UrlResolver</text><text class="mono" x="70" y="46" text-anchor="middle">public URLs</text></g>

<!-- Layer 3: Bluetape4k Stack -->
<rect x="52" y="472" width="900" height="108" rx="8" fill="#F1ECFF" stroke="#C8B8E8" stroke-width="1"/>
<text class="bandlabel" x="66" y="492">Bluetape4k Image Stack (library)</text>

<g transform="translate(72,502)"><rect class="card" x="0" y="0" width="280" height="68" rx="10" fill="#F1ECFF" stroke="#8A72D6"/><text class="label" x="140" y="26" text-anchor="middle">DerivativeProcessor</text><text class="mono" x="140" y="46" text-anchor="middle">interface → FfmVipsProcessor</text></g>
<g transform="translate(380,502)"><rect class="card" x="0" y="0" width="280" height="68" rx="10" fill="#F1ECFF" stroke="#8A72D6"/><text class="label" x="140" y="26" text-anchor="middle">ImageStorage</text><text class="mono" x="140" y="46" text-anchor="middle">library interface · auto-configured</text></g>

<!-- Layer 4: Backends (auto-configured by library) -->
<rect x="52" y="612" width="900" height="108" rx="8" fill="#FFF3D9" stroke="#E8D5A0" stroke-width="1"/>
<text class="bandlabel" x="66" y="632">Storage Backends (library auto-config)</text>

<g transform="translate(72,642)"><rect class="card" x="0" y="0" width="240" height="68" rx="10" fill="#FFF3D9" stroke="#D6A441"/><text class="label" x="120" y="26" text-anchor="middle">S3ImageStorage</text><text class="mono" x="120" y="46" text-anchor="middle">production · public bucket</text></g>
<g transform="translate(340,642)"><rect class="card" x="0" y="0" width="240" height="68" rx="10" fill="#FFF3D9" stroke="#D6A441"/><text class="label" x="120" y="26" text-anchor="middle">LocalImageStorage</text><text class="mono" x="120" y="46" text-anchor="middle">dev / test · temp dir</text></g>

<!-- Observability panel -->
<rect x="1000" y="192" width="340" height="388" rx="14" fill="#FDECEF" stroke="#DC6B82" stroke-width="1.2"/>
<text class="bandlabel" x="1016" y="212" style="fill:#DC6B82">Observability</text>

<g transform="translate(1020,232)"><rect class="card" x="0" y="0" width="300" height="68" rx="10" fill="#FDECEF" stroke="#DC6B82"/><text class="label" x="150" y="26" text-anchor="middle">Micrometer Metrics</text><text class="mono" x="150" y="46" text-anchor="middle">upload · duration · variant counters</text></g>
<g transform="translate(1020,340)"><rect class="card" x="0" y="0" width="300" height="68" rx="10" fill="#FDECEF" stroke="#DC6B82"/><text class="label" x="150" y="26" text-anchor="middle">HealthIndicator</text><text class="mono" x="150" y="46" text-anchor="middle">library auto-configured</text></g>
<g transform="translate(1020,448)"><rect class="card" x="0" y="0" width="300" height="68" rx="10" fill="#FDECEF" stroke="#DC6B82"/><text class="label" x="150" y="26" text-anchor="middle">Config Properties</text><text class="mono" x="150" y="46" text-anchor="middle">@ConfigurationProperties</text></g>

<!-- ARROWS -->
<path class="line" d="M280,160 L280,210"/>
<path class="line" d="M252,290 L252,330"/>
<path class="line" d="M242,430 L242,470"/>
<path class="line" d="M520,430 L520,470"/>
<path class="line" d="M192,570 L192,640"/>
<path class="line" d="M460,570 L460,640"/>
</svg>
