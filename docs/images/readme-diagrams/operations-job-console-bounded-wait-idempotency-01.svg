<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120">
  <defs>
    <marker id="bw-blue" markerWidth="16" markerHeight="16" markerUnits="userSpaceOnUse" orient="auto" data-role="sequence" data-tip-direction="positive-x" viewBox="0 0 16 16" refX="14" refY="8">
      <path d="M0,1 L16,8 L0,15 Z" fill="#3f7f9f"/>
    </marker>
    <marker id="bw-green" markerWidth="16" markerHeight="16" markerUnits="userSpaceOnUse" orient="auto" data-role="sequence" data-tip-direction="positive-x" viewBox="0 0 16 16" refX="14" refY="8">
      <path d="M0,1 L16,8 L0,15 Z" fill="#6e8f4f"/>
    </marker>
    <marker id="bw-amber" markerWidth="16" markerHeight="16" markerUnits="userSpaceOnUse" orient="auto" data-role="sequence" data-tip-direction="positive-x" viewBox="0 0 16 16" refX="14" refY="8">
      <path d="M0,1 L16,8 L0,15 Z" fill="#b4874d"/>
    </marker>
    <marker id="bw-red" markerWidth="16" markerHeight="16" markerUnits="userSpaceOnUse" orient="auto" data-role="sequence" data-tip-direction="positive-x" viewBox="0 0 16 16" refX="14" refY="8">
      <path d="M0,1 L16,8 L0,15 Z" fill="#b56868"/>
    </marker>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto" viewBox="0 0 10 10" refX="9" refY="5"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#3f7f9f"/></marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto" viewBox="0 0 10 10" refX="9" refY="5"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#6e8f4f"/></marker>
    <marker id="arrow-amber" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto" viewBox="0 0 10 10" refX="9" refY="5"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#b4874d"/></marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto" viewBox="0 0 10 10" refX="9" refY="5"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#b56868"/></marker>
  </defs>
  <rect class="frame" x="18" y="18" width="1564" height="1084" rx="28" fill="#fbfaf6" stroke="#526d78" stroke-width="4"/>
  <text class="title" x="800" y="70" text-anchor="middle" font-family="Architects Daughter, Comic Sans MS, cursive" font-size="38" fill="#24333b">Bounded-Wait Idempotency Sequence</text>
  <text class="subtitle" x="800" y="104" text-anchor="middle" font-family="Comic Mono, monospace" font-size="17" fill="#687b83">PostgreSQL is authoritative; replay never recomputes the stored HTTP snapshot.</text>

  <g font-family="Comic Mono, monospace" text-anchor="middle">
    <g>
      <rect class="header" x="64" y="142" width="240" height="78" rx="16" fill="#f5fbfd" stroke="#526d78" stroke-width="3"/>
      <text class="participant" x="184" y="176" font-size="21" fill="#24333b">HTTP caller</text><text class="role" x="184" y="199" font-size="14" fill="#687b83">same key + payload</text>
      <rect class="header" x="384" y="142" width="240" height="78" rx="16" fill="#f5fbfd" stroke="#526d78" stroke-width="3"/>
      <text class="participant" x="504" y="176" font-size="21" fill="#24333b">MVC / Ktor adapter</text><text class="role" x="504" y="199" font-size="14" fill="#687b83">scope + bounds</text>
      <rect class="header" x="704" y="142" width="240" height="78" rx="16" fill="#f5fbfd" stroke="#526d78" stroke-width="3"/>
      <text class="participant" x="824" y="176" font-size="21" fill="#24333b">Coordinator</text><text class="role" x="824" y="199" font-size="14" fill="#687b83">reserve / wait / finalize</text>
      <rect class="header" x="1024" y="142" width="240" height="78" rx="16" fill="#f5fbfd" stroke="#526d78" stroke-width="3"/>
      <text class="participant" x="1144" y="176" font-size="21" fill="#24333b">PostgreSQL</text><text class="role" x="1144" y="199" font-size="14" fill="#687b83">row + snapshot authority</text>
      <rect class="header" x="1344" y="142" width="190" height="78" rx="16" fill="#f5fbfd" stroke="#526d78" stroke-width="3"/>
      <text class="participant" x="1439" y="176" font-size="21" fill="#24333b">Worker / outbox</text><text class="role" x="1439" y="199" font-size="14" fill="#687b83">durable job</text>
    </g>
    <g class="lifeline" stroke="#9eafb4" stroke-width="3" stroke-dasharray="10 10">
      <path class="lifeline" d="M184 220 V1010"/><path class="lifeline" d="M504 220 V1010"/><path class="lifeline" d="M824 220 V1010"/><path class="lifeline" d="M1144 220 V1010"/><path class="lifeline" d="M1439 220 V1010"/>
    </g>
  </g>

  <rect class="activation" x="496" y="342" width="16" height="92" rx="6" fill="#9cc5d3"/>
  <rect class="activation" x="816" y="486" width="16" height="350" rx="6" fill="#b8cc9b"/>
  <rect class="activation" x="1136" y="674" width="16" height="98" rx="6" fill="#d4bc92"/>

  <rect x="44" y="250" width="1490" height="292" rx="18" fill="none" stroke="#c38b48" stroke-width="3" stroke-dasharray="12 10"/>
  <text x="62" y="278" font-family="Comic Mono, monospace" font-size="17" fill="#9a6e3d">admission</text>
  <g font-family="Comic Mono, monospace" font-size="16">
    <rect class="pill" x="238" y="302" width="212" height="32" rx="16" fill="#fff" stroke="#9cc5d3" stroke-width="2"/><circle cx="258" cy="318" r="12" fill="#3f7f9f"/><text class="num" x="258" y="323" text-anchor="middle" fill="#fff">1</text><text class="labelText" x="278" y="323" fill="#3f7f9f">POST /v1/jobs</text>
    <path class="call" d="M184 350 H504" fill="none" stroke="#3f7f9f" stroke-width="4" marker-end="url(#bw-blue)"/>
    <rect class="pill" x="516" y="374" width="242" height="32" rx="16" fill="#fff" stroke="#9cc5d3" stroke-width="2"/><circle cx="536" cy="390" r="12" fill="#3f7f9f"/><text class="num" x="536" y="395" text-anchor="middle" fill="#fff">2</text><text class="labelText" x="556" y="395" fill="#3f7f9f">validate scope / key / body</text>
    <path class="call" d="M504 422 H824" fill="none" stroke="#3f7f9f" stroke-width="4" marker-end="url(#bw-blue)"/>
    <rect class="pill" x="848" y="446" width="212" height="32" rx="16" fill="#fff" stroke="#b8cc9b" stroke-width="2"/><circle cx="868" cy="462" r="12" fill="#6e8f4f"/><text class="num" x="868" y="467" text-anchor="middle" fill="#fff">3</text><text class="labelText" x="888" y="467" fill="#6e8f4f">reserve tuple + generation</text>
    <path class="call" d="M824 494 H1144" fill="none" stroke="#6e8f4f" stroke-width="4" marker-end="url(#bw-green)"/>
  </g>

  <rect class="alt" x="44" y="572" width="1490" height="310" rx="18" fill="none" stroke="#aab7ba" stroke-width="3"/>
  <text x="62" y="600" font-family="Comic Mono, monospace" font-size="17" fill="#687b83">alt: owner / replay / conflict / bounded wait</text>
  <path class="work" d="M824 635 H1144" fill="none" stroke="#6e8f4f" stroke-width="4" marker-end="url(#bw-green)"/>
  <rect class="pill" x="858" y="604" width="210" height="32" rx="16" fill="#fff" stroke="#b8cc9b" stroke-width="2"/><circle cx="878" cy="620" r="12" fill="#6e8f4f"/><text class="num" x="878" y="625" text-anchor="middle" fill="#fff" font-family="Comic Mono, monospace" font-size="16">4</text><text class="labelText" x="898" y="625" fill="#6e8f4f" font-family="Comic Mono, monospace" font-size="16">owner prepares</text>
  <path class="work" d="M1144 680 H1439" fill="none" stroke="#6e8f4f" stroke-width="4" marker-end="url(#bw-green)"/>
  <rect class="pill" x="1154" y="649" width="238" height="32" rx="16" fill="#fff" stroke="#b8cc9b" stroke-width="2"/><circle cx="1174" cy="665" r="12" fill="#6e8f4f"/><text class="num" x="1174" y="670" text-anchor="middle" fill="#fff" font-family="Comic Mono, monospace" font-size="16">5</text><text class="labelText" x="1194" y="670" fill="#6e8f4f" font-family="Comic Mono, monospace" font-size="16">finalize job + snapshot</text>
  <path class="return" d="M1144 760 H824" fill="none" stroke="#b4874d" stroke-width="4" stroke-dasharray="10 8" marker-end="url(#bw-amber)"/>
  <rect class="pill" x="894" y="729" width="230" height="32" rx="16" fill="#fff" stroke="#d4bc92" stroke-width="2"/><circle cx="914" cy="745" r="12" fill="#b4874d"/><text class="num" x="914" y="750" text-anchor="middle" fill="#fff" font-family="Comic Mono, monospace" font-size="16">6</text><text class="labelText" x="934" y="750" fill="#9a6e3d" font-family="Comic Mono, monospace" font-size="16">terminal snapshot / replay</text>
  <path class="error" d="M824 824 H504" fill="none" stroke="#b56868" stroke-width="4" stroke-dasharray="10 8" marker-end="url(#bw-red)"/>
  <rect class="pill" x="584" y="793" width="210" height="32" rx="16" fill="#fff" stroke="#d4bc92" stroke-width="2"/><circle cx="604" cy="809" r="12" fill="#b4874d"/><text class="num" x="604" y="814" text-anchor="middle" fill="#fff" font-family="Comic Mono, monospace" font-size="16">7</text><text class="labelText" x="624" y="814" fill="#9a6e3d" font-family="Comic Mono, monospace" font-size="16">202 / 409 / 429 / 503</text>
  <path class="return" d="M504 850 H184" fill="none" stroke="#b4874d" stroke-width="4" stroke-dasharray="10 8" marker-end="url(#bw-amber)"/>

  <rect x="44" y="910" width="1490" height="80" rx="16" fill="#fff8ed" stroke="#d4bc92" stroke-width="2"/>
  <text x="68" y="942" font-family="Comic Mono, monospace" font-size="16" fill="#9a6e3d">recovery loop: owner disconnect / lease expiry → ABANDONED or takeover → one new generation owner</text>
  <path class="error" d="M504 958 H804 Q824 958 824 978 V1010 Q824 1030 804 1030 H504" fill="none" stroke="#b56868" stroke-width="4" marker-end="url(#bw-red)"/>
  <text x="800" y="1080" text-anchor="middle" font-family="Comic Mono, monospace" font-size="16" fill="#687b83">Durable guarantee ends at committed PostgreSQL job/outbox/history and the stored HTTP snapshot.</text>
</svg>
