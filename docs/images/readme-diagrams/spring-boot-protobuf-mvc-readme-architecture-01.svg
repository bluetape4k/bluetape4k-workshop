  <g filter="url(#shadow)"><rect x="710" y="210" width="340" height="80" rx="14" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.7"/><text class="cardTitle" x="880" y="244" text-anchor="middle">Generated Kotlin DSL</text><text class="cardText" x="880" y="270" text-anchor="middle">course, student, phoneNumber</text></g>
  <g filter="url(#shadow)"><rect x="1280" y="220" width="280" height="60" rx="14" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.7"/><text class="cardTitle" x="1420" y="258" text-anchor="middle">School.Course</text></g>
