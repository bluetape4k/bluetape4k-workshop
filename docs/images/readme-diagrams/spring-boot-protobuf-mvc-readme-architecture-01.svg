  <text class="title" x="880" y="72" text-anchor="middle">Spring MVC Protobuf response boundary</text><text class="subtitle" x="880" y="106" text-anchor="middle">Generated Course messages are loaded from an in-memory repository and serialized by Spring's Protobuf HTTP converter.</text>
