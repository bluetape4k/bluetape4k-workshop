<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1620" height="760" viewBox="0 0 1620 760" role="img" aria-label="Circuit breaker recovery flow">
  <defs><filter id="shadow" x="-8%" y="-8%" width="116%" height="124%"><feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#64748B" flood-opacity="0.15"/></filter><marker id="arrowBlue" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 14 7 L 0 14 Z" fill="#2563EB" stroke-dasharray="none"/></marker><marker id="arrowRed" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 14 7 L 0 14 Z" fill="#DC2626" stroke-dasharray="none"/></marker><marker id="arrowGreen" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 14 7 L 0 14 Z" fill="#16A34A" stroke-dasharray="none"/></marker><style>.canvas{fill:#F8FAFC}.frame{fill:#FFFFFF;stroke:#D6E0E8;stroke-width:1.4}.title{font-family:"Architects Daughter";font-size:38px;fill:#102033}.subtitle{font-family:"Comic Mono";font-size:15px;fill:#51606F}.cardTitle{font-family:"Architects Daughter";font-size:29px;fill:#102033}.cardText{font-family:"Comic Mono";font-size:15px;fill:#415166}.line{fill:none;stroke-width:3.3;stroke-linecap:round;stroke-linejoin:round}.msg{font-family:"Comic Mono";font-size:15px;fill:#334155}</style></defs>
  <rect class="canvas" width="1620" height="760"/><rect class="frame" x="24" y="24" width="1572" height="712" rx="24"/>
  <text class="title" x="810" y="72" text-anchor="middle">CircuitBreaker failure and recovery</text>  <text class="subtitle" x="810" y="104" text-anchor="middle">Toxiproxy injects a fast Redis failure, the breaker opens, reads use Caffeine, and successful probes close the circuit again.</text>
  <g filter="url(#shadow)"><rect x="100" y="220" width="260" height="90" rx="16" fill="#ECFEFF" stroke="#0891B2" stroke-width="1.8"/><text class="cardTitle" x="230" y="258" text-anchor="middle">CLOSED</text>  <text class="cardText" x="230" y="286" text-anchor="middle">Redis reads active</text></g>
  <g filter="url(#shadow)"><rect x="520" y="220" width="260" height="90" rx="16" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.8"/><text class="cardTitle" x="650" y="258" text-anchor="middle">OPEN</text><text class="cardText" x="650" y="286" text-anchor="middle">fallback to Caffeine</text></g>
  <g filter="url(#shadow)"><rect x="940" y="220" width="260" height="90" rx="16" fill="#FEF3C7" stroke="#D97706" stroke-width="1.8"/><text class="cardTitle" x="1070" y="258" text-anchor="middle">HALF-OPEN</text><text class="cardText" x="1070" y="286" text-anchor="middle">2 permitted probes</text></g>
  <g filter="url(#shadow)"><rect x="1280" y="470" width="240" height="76" rx="16" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.8"/><text class="cardTitle" x="1400" y="502" text-anchor="middle">CLOSED</text>  <text class="cardText" x="1400" y="528" text-anchor="middle">Redis recovered</text></g>
  <path class="line" d="M 360 265 L 520 265" stroke="#DC2626" marker-end="url(#arrowRed)" stroke-linecap="round" stroke-linejoin="round"/><text class="msg" x="440" y="246" text-anchor="middle">3/5 failures</text>
  <path class="line" d="M 780 265 L 940 265" stroke="#2563EB" marker-end="url(#arrowBlue)" stroke-linecap="round" stroke-linejoin="round"/><text class="msg" x="860" y="246" text-anchor="middle">wait 5s</text>
  <path class="line" d="M 1200 265 L 1400 265 L 1400 470" stroke="#16A34A" marker-end="url(#arrowGreen)" stroke-linecap="round" stroke-linejoin="round"/><text class="msg" x="1320" y="246" text-anchor="middle">successful probes</text>
  <path class="line" d="M 1070 310 L 1070 430 L 650 430 L 650 310" stroke="#DC2626" marker-end="url(#arrowRed)" stroke-linecap="round" stroke-linejoin="round"/><text class="msg" x="860" y="414" text-anchor="middle">probe fails, reopen</text>
  <g filter="url(#shadow)"><rect x="190" y="510" width="500" height="90" rx="16" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/><text class="cardTitle" x="440" y="546" text-anchor="middle">Failure source</text>  <text class="cardText" x="440" y="574" text-anchor="middle">Toxiproxy timeout(1ms) toxic drops Redis calls fast.</text></g>
  <g filter="url(#shadow)"><rect x="780" y="510" width="420" height="90" rx="16" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/><text class="cardTitle" x="990" y="546" text-anchor="middle">Fallback store</text><text class="cardText" x="990" y="574" text-anchor="middle">Caffeine keeps the latest local value for OPEN reads.</text></g>
</svg>
