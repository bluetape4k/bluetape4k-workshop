<svg xmlns="http://www.w3.org/2000/svg" width="920" height="420" viewBox="0 0 920 420" role="img" aria-label="Okio Class Architecture">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#1f2937" flood-opacity="0.10"/></filter>
  <!-- Filled arrow for regular associations -->
  <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth">
    <path d="M1,1 L8,4.5 L1,8 Z" fill="#758297"/>
  </marker>
  <!-- Hollow triangle for UML generalization/implements (points to parent/interface) -->
  <marker id="inherit" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
    <path d="M1,1 L9,5 L1,9 Z" fill="none" stroke="#758297" stroke-width="1.2"/>
  </marker>
  <style>
    .canvas{fill:#f7f9fc}.frame{fill:#fff;stroke:#d8e0ea;stroke-width:1.5}
    .title{font-family:"Architects Daughter";font-size:38px;font-weight:400;fill:#102033}
    .subtitle{font-family:"Comic Mono";font-size:14px;font-weight:400;fill:#536273}
    .smallLabel{font-family:"Architects Daughter";font-size:21px;font-weight:400;fill:#102033}
    .mono{font-family:"Comic Mono";font-size:12px;font-weight:400;fill:#102033}
    .small{font-family:"Comic Mono";font-size:12px;font-weight:400;fill:#536273}
    .card{stroke-width:2.1;filter:url(#shadow)}
    .line{stroke:#758297;stroke-width:2.1;fill:none;marker-end:url(#arrow)}
    .impl{stroke:#758297;stroke-width:2.1;fill:none;marker-end:url(#inherit)}
  </style>
</defs>
<!--
  Layout:
  Canvas: 920×420  Frame: x=24 y=20 w=872 h=376
  Row1  y=98  h=60  Interfaces (4 cards w=200 gap=8)
    Source:         x=24  cx=124   right=224
    BufferedSource: x=232 cx=332   right=432
    Sink:           x=454 cx=554   right=654
    BufferedSink:   x=662 cx=762   right=862

  Row2  y=218 h=76  Implementations (3 cards)
    ForwardingSource: x=24  cx=154  right=284
    Buffer:           x=320 cx=460  right=580
    ForwardingSink:   x=616 cx=746  right=876

  Row3  y=354 h=46  Concrete Decorators (full width x=24 right=896)

  UML generalization arrows go FROM child (bottom row) TO parent (top row).
  Arrow direction: child → parent, hollow triangle at parent end.
-->
<rect class="canvas" width="920" height="420"/>
<rect class="frame" x="24" y="20" width="872" height="376" rx="28"/>
<text class="title" x="58" y="66">Okio Class Architecture</text>
<text class="subtitle" x="58" y="92">Source · Sink · Buffer · ForwardingSource/Sink · GzipSource/Sink · CipherSource/Sink</text>

<!-- Inheritance arrows: child bottom → bus → interface bottom (hollow triangle points to interface) -->
<!-- ForwardingSource (cx=154, top=218) → Source (cx=124, bottom=158) -->
<path class="impl" d="M154,218 L154,185 L124,185 L124,158"/>
<!-- Buffer (cx=460, top=218) → BufferedSource (cx=332, bottom=158) via bus y=188 -->
<path class="impl" d="M410,218 L410,188 L332,188 L332,158"/>
<!-- Buffer (cx=460, top=218) → BufferedSink (cx=762, bottom=158) via bus y=188 -->
<path class="impl" d="M510,218 L510,188 L762,188 L762,158"/>
<!-- ForwardingSink (cx=746, top=218) → Sink (cx=554, bottom=158) via bus y=195 -->
<path class="impl" d="M746,218 L746,195 L554,195 L554,158"/>

<!-- Decorators arrows: child top → parent bottom -->
<!-- GzipSource/CipherSource (left part of Decorators) → ForwardingSource (cx=154, bottom=294) -->
<path class="impl" d="M154,354 L154,294"/>
<!-- GzipSink/CipherSink (right part of Decorators) → ForwardingSink (cx=746, bottom=294) -->
<path class="impl" d="M746,354 L746,294"/>

<!-- Row1: Interfaces (4 cards w=200) -->
<g transform="translate(24,98)">
  <rect class="card" x="0" y="0" width="200" height="60" rx="8" fill="#E8F3FF" stroke="#5B8DEF"/>
  <text class="small" x="100" y="20" text-anchor="middle">«interface»</text>
  <text class="smallLabel" x="100" y="44" text-anchor="middle">Source</text>
</g>
<g transform="translate(232,98)">
  <rect class="card" x="0" y="0" width="200" height="60" rx="8" fill="#D8EEFF" stroke="#3A7DC9"/>
  <text class="small" x="100" y="20" text-anchor="middle">«interface»</text>
  <text class="smallLabel" x="100" y="44" text-anchor="middle">BufferedSource</text>
</g>
<g transform="translate(454,98)">
  <rect class="card" x="0" y="0" width="200" height="60" rx="8" fill="#FFF3D9" stroke="#D6A441"/>
  <text class="small" x="100" y="20" text-anchor="middle">«interface»</text>
  <text class="smallLabel" x="100" y="44" text-anchor="middle">Sink</text>
</g>
<g transform="translate(662,98)">
  <rect class="card" x="0" y="0" width="200" height="60" rx="8" fill="#FFE9C0" stroke="#B88A44"/>
  <text class="small" x="100" y="20" text-anchor="middle">«interface»</text>
  <text class="smallLabel" x="100" y="44" text-anchor="middle">BufferedSink</text>
</g>

<!-- Row2: Implementations -->
<g transform="translate(24,218)">
  <rect class="card" x="0" y="0" width="260" height="76" rx="12" fill="#F1ECFF" stroke="#8A72D6"/>
  <text class="smallLabel" x="130" y="22" text-anchor="middle">ForwardingSource</text>
  <text class="small" x="130" y="42" text-anchor="middle">delegates read() to delegate Source</text>
  <text class="small" x="130" y="60" text-anchor="middle">AbstractBase64Source · Coroutine adapters</text>
</g>
<g transform="translate(320,218)">
  <rect class="card" x="0" y="0" width="260" height="76" rx="12" fill="#EAF7EF" stroke="#58A978"/>
  <text class="smallLabel" x="130" y="22" text-anchor="middle">Buffer</text>
  <text class="small" x="130" y="42" text-anchor="middle">implements Source + Sink</text>
  <text class="mono" x="130" y="60" text-anchor="middle">segment chain · zero-copy transfer</text>
</g>
<g transform="translate(616,218)">
  <rect class="card" x="0" y="0" width="260" height="76" rx="12" fill="#FDECEF" stroke="#DC6B82"/>
  <text class="smallLabel" x="130" y="22" text-anchor="middle">ForwardingSink</text>
  <text class="small" x="130" y="42" text-anchor="middle">delegates write() to delegate Sink</text>
  <text class="small" x="130" y="60" text-anchor="middle">AbstractBase64Sink · Coroutine adapters</text>
</g>

<!-- Row3: Concrete Decorators (full width) -->
<g transform="translate(24,354)">
  <rect class="card" x="0" y="0" width="872" height="46" rx="12" fill="#E9F7F6" stroke="#45A7A1"/>
  <text class="smallLabel" x="436" y="20" text-anchor="middle">Concrete Decorators</text>
  <text class="small" x="436" y="38" text-anchor="middle">GzipSource / GzipSink  ·  CipherSource / CipherSink  ·  HashingSink  ·  TeeSink  ·  Pipe</text>
</g>
</svg>
