  <line class="compartment" x1="0" y1="78" x2="340" y2="78" stroke="#D6A441"/>
  <text class="small" x="170" y="26" text-anchor="middle">«interface»</text>
  <text class="label" x="170" y="57" text-anchor="middle">BufferedSink</text>
  <text class="mono" x="18" y="108">+writeUtf8(string: String) BufferedSink</text>
<text class="mono" x="18" y="132">+write(byteString: ByteString) BufferedSink</text>
<text class="mono" x="18" y="156">+writeInt(i: Int) BufferedSink</text>
<text class="mono" x="18" y="180">+writeLong(v: Long) BufferedSink</text>
<text class="mono" x="18" y="204">+flush()</text>
</g>
<g transform="translate(502,522)">
  <rect class="card" x="0" y="0" width="340" height="240" rx="5" fill="#FDECEF" stroke="#DC6B82"/>
  <line class="compartment" x1="0" y1="78" x2="340" y2="78" stroke="#DC6B82"/>
  <text class="small" x="170" y="26" text-anchor="middle">«interface»</text>
  <text class="label" x="170" y="57" text-anchor="middle">BufferedSource</text>
  <text class="mono" x="18" y="108">+readUtf8() String</text>
<text class="mono" x="18" y="132">+readByteString() ByteString</text>
<text class="mono" x="18" y="156">+readInt() Int</text>
<text class="mono" x="18" y="180">+readLong() Long</text>
<text class="mono" x="18" y="204">+exhausted() Boolean</text>
<text class="mono" x="18" y="228">+request(byteCount: Long) Boolean</text>
</g>
<g transform="translate(912,522)">
  <rect class="card" x="0" y="0" width="340" height="120" rx="5" fill="#E9F7F6" stroke="#45A7A1"/>
  <line class="compartment" x1="0" y1="78" x2="340" y2="78" stroke="#45A7A1"/>
  <text class="small" x="170" y="26" text-anchor="middle"></text>
  <text class="label" x="170" y="57" text-anchor="middle">ForwardingSink</text>
  <text class="mono" x="18" y="108">#delegate: Sink</text>
</g>
<g transform="translate(1322,522)">
  <rect class="card" x="0" y="0" width="340" height="120" rx="5" fill="#F1ECFF" stroke="#8A72D6"/>
  <line class="compartment" x1="0" y1="78" x2="340" y2="78" stroke="#8A72D6"/>
  <text class="small" x="170" y="26" text-anchor="middle"></text>
  <text class="label" x="170" y="57" text-anchor="middle">ForwardingSource</text>
  <text class="mono" x="18" y="108">#delegate: Source</text>
</g>
<g transform="translate(92,912)">
  <rect class="card" x="0" y="0" width="340" height="192" rx="5" fill="#F7F1E7" stroke="#B88A44"/>
  <line class="compartment" x1="0" y1="78" x2="340" y2="78" stroke="#B88A44"/>
  <text class="small" x="170" y="26" text-anchor="middle"></text>
  <text class="label" x="170" y="57" text-anchor="middle">Buffer</text>
  <text class="mono" x="18" y="108">+size: Long</text>
<text class="mono" x="18" y="132">+clone() Buffer</text>
<text class="mono" x="18" y="156">+snapshot() ByteString</text>
<text class="mono" x="18" y="180">+clear()</text>
</g>
