<g transform="translate(502,180)">
  <rect class="card" x="0" y="0" width="340" height="192" rx="5" fill="#E8F3FF" stroke="#5B8DEF"/>
  <line class="compartment" x1="0" y1="78" x2="340" y2="78" stroke="#5B8DEF"/>
  <text class="small" x="170" y="26" text-anchor="middle">«interface»</text>
  <text class="label" x="170" y="57" text-anchor="middle">Sink</text>
  <text class="mono" x="18" y="108">+write(source: Buffer, byteCount: Long)</text>
<text class="mono" x="18" y="132">+flush()</text>
<text class="mono" x="18" y="156">+timeout() Timeout</text>
<text class="mono" x="18" y="180">+close()</text>
</g>
<g transform="translate(912,180)">
  <rect class="card" x="0" y="0" width="340" height="168" rx="5" fill="#EAF7EF" stroke="#58A978"/>
  <line class="compartment" x1="0" y1="78" x2="340" y2="78" stroke="#58A978"/>
  <text class="small" x="170" y="26" text-anchor="middle">«interface»</text>
  <text class="label" x="170" y="57" text-anchor="middle">Source</text>
  <text class="mono" x="18" y="108">+read(sink: Buffer, byteCount: Long) Long</text>
<text class="mono" x="18" y="132">+timeout() Timeout</text>
<text class="mono" x="18" y="156">+close()</text>
</g>
