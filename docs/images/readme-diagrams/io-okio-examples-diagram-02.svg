<g transform="translate(538,180)">
  <rect class="card" x="0" y="0" width="330" height="133" rx="5" fill="#E8F3FF" stroke="#5B8DEF"/>
  <line class="compartment" x1="0" y1="78" x2="330" y2="78" stroke="#5B8DEF"/>
  <text class="small" x="165" y="26" text-anchor="middle"></text>
  <text class="label" x="165" y="61" text-anchor="middle">ForwardingSink</text>
  <text class="mono" x="18" y="108">#delegate: Sink</text>
</g>
<g transform="translate(96,481)">
  <rect class="card" x="0" y="0" width="330" height="112" rx="5" fill="#EAF7EF" stroke="#58A978"/>
  <line class="compartment" x1="0" y1="78" x2="330" y2="78" stroke="#58A978"/>
  <text class="small" x="165" y="26" text-anchor="middle"></text>
  <text class="label" x="165" y="61" text-anchor="middle">CipherSink</text>

</g>
<g transform="translate(538,481)">
  <rect class="card" x="0" y="0" width="330" height="196" rx="5" fill="#FFF3D9" stroke="#D6A441"/>
  <line class="compartment" x1="0" y1="78" x2="330" y2="78" stroke="#D6A441"/>
  <text class="small" x="165" y="26" text-anchor="middle">«interface»</text>
  <text class="label" x="165" y="61" text-anchor="middle">Sink</text>
  <text class="mono" x="18" y="108">+write(source: Buffer, byteCount: Long)</text>
<text class="mono" x="18" y="129">+flush()</text>
<text class="mono" x="18" y="150">+timeout() Timeout</text>
<text class="mono" x="18" y="171">+close()</text>
</g>
<g transform="translate(980,481)">
  <rect class="card" x="0" y="0" width="330" height="112" rx="5" fill="#FDECEF" stroke="#DC6B82"/>
  <line class="compartment" x1="0" y1="78" x2="330" y2="78" stroke="#DC6B82"/>
  <text class="small" x="165" y="26" text-anchor="middle"></text>
  <text class="label" x="165" y="61" text-anchor="middle">GzipSink</text>

</g>
<g transform="translate(538,845)">
  <rect class="card" x="0" y="0" width="330" height="238" rx="5" fill="#E9F7F6" stroke="#45A7A1"/>
  <line class="compartment" x1="0" y1="78" x2="330" y2="78" stroke="#45A7A1"/>
  <text class="small" x="165" y="26" text-anchor="middle">«interface»</text>
  <text class="label" x="165" y="61" text-anchor="middle">BufferedSink</text>
  <text class="mono" x="18" y="108">+writeUtf8(string: String) BufferedSink</text>
<text class="mono" x="18" y="129">+write(byteString: ByteString)</text>
<text class="mono" x="18" y="150">BufferedSink</text>
<text class="mono" x="18" y="171">+writeInt(i: Int) BufferedSink</text>
<text class="mono" x="18" y="192">+writeLong(v: Long) BufferedSink</text>
<text class="mono" x="18" y="213">+flush()</text>
</g>
<g transform="translate(538,1251)">
  <rect class="card" x="0" y="0" width="330" height="196" rx="5" fill="#F1ECFF" stroke="#8A72D6"/>
  <line class="compartment" x1="0" y1="78" x2="330" y2="78" stroke="#8A72D6"/>
  <text class="small" x="165" y="26" text-anchor="middle"></text>
  <text class="label" x="165" y="61" text-anchor="middle">Buffer</text>
  <text class="mono" x="18" y="108">+size: Long</text>
<text class="mono" x="18" y="129">+clone() Buffer</text>
<text class="mono" x="18" y="150">+snapshot() ByteString</text>
<text class="mono" x="18" y="171">+clear()</text>
</g>
<g transform="translate(538,1615)">
  <rect class="card" x="0" y="0" width="330" height="238" rx="5" fill="#F7F1E7" stroke="#B88A44"/>
  <line class="compartment" x1="0" y1="78" x2="330" y2="78" stroke="#B88A44"/>
  <text class="small" x="165" y="26" text-anchor="middle">«interface»</text>
  <text class="label" x="165" y="61" text-anchor="middle">BufferedSource</text>
  <text class="mono" x="18" y="108">+readUtf8() String</text>
<text class="mono" x="18" y="129">+readByteString() ByteString</text>
<text class="mono" x="18" y="150">+readInt() Int</text>
<text class="mono" x="18" y="171">+readLong() Long</text>
<text class="mono" x="18" y="192">+exhausted() Boolean</text>
<text class="mono" x="18" y="213">+request(byteCount: Long) Boolean</text>
</g>
<g transform="translate(538,2021)">
  <rect class="card" x="0" y="0" width="330" height="175" rx="5" fill="#EEF6D9" stroke="#8BA84D"/>
  <line class="compartment" x1="0" y1="78" x2="330" y2="78" stroke="#8BA84D"/>
  <text class="small" x="165" y="26" text-anchor="middle">«interface»</text>
  <text class="label" x="165" y="61" text-anchor="middle">Source</text>
  <text class="mono" x="18" y="108">+read(sink: Buffer, byteCount: Long) Long</text>
<text class="mono" x="18" y="129">+timeout() Timeout</text>
<text class="mono" x="18" y="150">+close()</text>
</g>
<g transform="translate(538,2364)">
  <rect class="card" x="0" y="0" width="330" height="133" rx="5" fill="#E8F3FF" stroke="#5B8DEF"/>
  <line class="compartment" x1="0" y1="78" x2="330" y2="78" stroke="#5B8DEF"/>
  <text class="small" x="165" y="26" text-anchor="middle"></text>
  <text class="label" x="165" y="61" text-anchor="middle">ForwardingSource</text>
