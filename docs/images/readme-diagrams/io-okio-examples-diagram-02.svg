<g transform="translate(502,180)">
  <rect class="card" x="0" y="0" width="340" height="196" rx="5" fill="#E8F3FF" stroke="#5B8DEF"/>
  <line class="compartment" x1="0" y1="78" x2="340" y2="78" stroke="#5B8DEF"/>
  <text class="small" x="170" y="26" text-anchor="middle">«interface»</text>
  <text class="label" x="170" y="61" text-anchor="middle">Sink</text>
  <text class="mono" x="18" y="108">+write(source: Buffer, byteCount: Long)</text>
<text class="mono" x="18" y="129">+flush()</text>
<text class="mono" x="18" y="150">+timeout() Timeout</text>
<text class="mono" x="18" y="171">+close()</text>
</g>
<g transform="translate(912,180)">
  <rect class="card" x="0" y="0" width="340" height="175" rx="5" fill="#EAF7EF" stroke="#58A978"/>
  <line class="compartment" x1="0" y1="78" x2="340" y2="78" stroke="#58A978"/>
  <text class="small" x="170" y="26" text-anchor="middle">«interface»</text>
  <text class="label" x="170" y="61" text-anchor="middle">Source</text>
  <text class="mono" x="18" y="108">+read(sink: Buffer, byteCount: Long) Long</text>
<text class="mono" x="18" y="129">+timeout() Timeout</text>
<text class="mono" x="18" y="150">+close()</text>
</g>
<g transform="translate(92,526)">
  <rect class="card" x="0" y="0" width="340" height="238" rx="5" fill="#FFF3D9" stroke="#D6A441"/>
  <line class="compartment" x1="0" y1="78" x2="340" y2="78" stroke="#D6A441"/>
  <text class="small" x="170" y="26" text-anchor="middle">«interface»</text>
  <text class="label" x="170" y="61" text-anchor="middle">BufferedSink</text>
  <text class="mono" x="18" y="108">+writeUtf8(string: String) BufferedSink</text>
<text class="mono" x="18" y="129">+write(byteString: ByteString)</text>
<text class="mono" x="18" y="150">BufferedSink</text>
<text class="mono" x="18" y="171">+writeInt(i: Int) BufferedSink</text>
<text class="mono" x="18" y="192">+writeLong(v: Long) BufferedSink</text>
<text class="mono" x="18" y="213">+flush()</text>
</g>
<g transform="translate(502,526)">
  <rect class="card" x="0" y="0" width="340" height="238" rx="5" fill="#FDECEF" stroke="#DC6B82"/>
  <line class="compartment" x1="0" y1="78" x2="340" y2="78" stroke="#DC6B82"/>
  <text class="small" x="170" y="26" text-anchor="middle">«interface»</text>
  <text class="label" x="170" y="61" text-anchor="middle">BufferedSource</text>
  <text class="mono" x="18" y="108">+readUtf8() String</text>
<text class="mono" x="18" y="129">+readByteString() ByteString</text>
<text class="mono" x="18" y="150">+readInt() Int</text>
<text class="mono" x="18" y="171">+readLong() Long</text>
<text class="mono" x="18" y="192">+exhausted() Boolean</text>
<text class="mono" x="18" y="213">+request(byteCount: Long) Boolean</text>
</g>
<g transform="translate(912,526)">
  <rect class="card" x="0" y="0" width="340" height="133" rx="5" fill="#E9F7F6" stroke="#45A7A1"/>
  <line class="compartment" x1="0" y1="78" x2="340" y2="78" stroke="#45A7A1"/>
  <text class="small" x="170" y="26" text-anchor="middle"></text>
  <text class="label" x="170" y="61" text-anchor="middle">ForwardingSink</text>
  <text class="mono" x="18" y="108">#delegate: Sink</text>
</g>
<g transform="translate(1322,526)">
  <rect class="card" x="0" y="0" width="340" height="133" rx="5" fill="#F1ECFF" stroke="#8A72D6"/>
  <line class="compartment" x1="0" y1="78" x2="340" y2="78" stroke="#8A72D6"/>
  <text class="small" x="170" y="26" text-anchor="middle"></text>
  <text class="label" x="170" y="61" text-anchor="middle">ForwardingSource</text>
  <text class="mono" x="18" y="108">#delegate: Source</text>
</g>
<g transform="translate(92,914)">
  <rect class="card" x="0" y="0" width="340" height="196" rx="5" fill="#F7F1E7" stroke="#B88A44"/>
  <line class="compartment" x1="0" y1="78" x2="340" y2="78" stroke="#B88A44"/>
  <text class="small" x="170" y="26" text-anchor="middle"></text>
  <text class="label" x="170" y="61" text-anchor="middle">Buffer</text>
  <text class="mono" x="18" y="108">+size: Long</text>
<text class="mono" x="18" y="129">+clone() Buffer</text>
<text class="mono" x="18" y="150">+snapshot() ByteString</text>
<text class="mono" x="18" y="171">+clear()</text>
</g>
