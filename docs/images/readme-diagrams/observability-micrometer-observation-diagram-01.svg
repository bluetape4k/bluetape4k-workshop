<svg xmlns="http://www.w3.org/2000/svg" width="920" height="460" viewBox="0 0 920 460" role="img" aria-label="Micrometer Observation Architecture">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#1f2937" flood-opacity="0.10"/></filter>
  <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth">
    <path d="M1,1 L8,4.5 L1,8 Z" fill="#758297"/>
  </marker>
  <style>
    .canvas{fill:#f7f9fc}.frame{fill:#fff;stroke:#d8e0ea;stroke-width:1.5}
    .title{font-family:"Architects Daughter";font-size:38px;font-weight:400;fill:#102033}
    .subtitle{font-family:"Comic Mono";font-size:14px;font-weight:400;fill:#536273}
    .smallLabel{font-family:"Architects Daughter";font-size:21px;font-weight:400;fill:#102033}
    .mono{font-family:"Comic Mono";font-size:12px;font-weight:400;fill:#102033}
    .small{font-family:"Comic Mono";font-size:12px;font-weight:400;fill:#536273}
    .card{stroke-width:2.1;filter:url(#shadow)}
    .line{stroke:#758297;stroke-width:2.1;fill:none;marker-end:url(#arrow)}
  </style>
</defs>
<!-- Layout:
     Canvas: 920×460  Frame: x=24 y=20 w=872 h=416
     Row1  y=98  h=54  GreetingController center x=220 w=480 cx=460
     Row2  y=212 h=80  GreetingService center x=220 w=480 cx=460
     Row3  y=352 h=80  3 cols (w=260 gap=46):
       Col1: x=24  w=260 cx=154  (ObservedAspect)
       Col2: x=330 w=260 cx=460  (ObservationRegistry)
       Col3: x=636 w=260 cx=766  (ObservationTextPublisher)
     Bus y=322: Row2→Row3 connector
-->
<rect class="canvas" width="920" height="460"/>
<rect class="frame" x="24" y="20" width="872" height="416" rx="28"/>
<text class="title" x="58" y="66">Micrometer Observation</text>
<text class="subtitle" x="58" y="92">@Observed · ObservedAspect AOP · ObservationRegistry · Spring MVC · ObservationTextPublisher</text>

<!-- Arrows -->
<!-- GreetingController → GreetingService (straight down) -->
<path class="line" d="M460 152 L460 212"/>
<!-- GreetingService → 3 cols (fan-out bus y=322, all starting from GreetingService bottom) -->
<path class="line" d="M460 292 L460 322 L154 322 L154 352"/>
<path class="line" d="M460 292 L460 352"/>
<path class="line" d="M460 292 L460 322 L766 322 L766 352"/>

<!-- GreetingController (center top) -->
<g transform="translate(220,98)">
  <rect class="card" x="0" y="0" width="480" height="54" rx="12" fill="#EAF7EF" stroke="#58A978"/>
  <text class="smallLabel" x="240" y="22" text-anchor="middle">GreetingController</text>
  <text class="mono" x="240" y="42" text-anchor="middle">GET /greeting · GET /greeting/for?name=X · Spring MVC</text>
</g>

<!-- GreetingService (center) -->
<g transform="translate(220,212)">
  <rect class="card" x="0" y="0" width="480" height="80" rx="12" fill="#E8F3FF" stroke="#5B8DEF"/>
  <text class="smallLabel" x="240" y="22" text-anchor="middle">GreetingService</text>
  <text class="mono" x="240" y="44" text-anchor="middle">@Observed(name = "greetingService")</text>
  <text class="small" x="240" y="64" text-anchor="middle">Observation.createNotStarted() · observe(Supplier) · observeOrNull</text>
</g>

<!-- ObservedAspect col1 -->
<g transform="translate(24,352)">
  <rect class="card" x="0" y="0" width="260" height="80" rx="12" fill="#FFF3D9" stroke="#D6A441"/>
  <text class="smallLabel" x="130" y="22" text-anchor="middle">ObservedAspect</text>
  <text class="mono" x="130" y="44" text-anchor="middle">AOP · @Observed</text>
  <text class="small" x="130" y="64" text-anchor="middle">ObservationAspectConfig</text>
</g>

<!-- ObservationRegistry col2 -->
<g transform="translate(330,352)">
  <rect class="card" x="0" y="0" width="260" height="80" rx="12" fill="#F1ECFF" stroke="#8A72D6"/>
  <text class="smallLabel" x="130" y="22" text-anchor="middle">ObservationRegistry</text>
  <text class="mono" x="130" y="44" text-anchor="middle">auto-configured</text>
  <text class="small" x="130" y="64" text-anchor="middle">TestObservationRegistry in tests</text>
</g>

<!-- ObservationTextPublisher col3 -->
<g transform="translate(636,352)">
  <rect class="card" x="0" y="0" width="260" height="80" rx="12" fill="#FDECEF" stroke="#DC6B82"/>
  <text class="smallLabel" x="130" y="22" text-anchor="middle">ObservationPublisher</text>
  <text class="mono" x="130" y="44" text-anchor="middle">ObservationTextPublisher</text>
  <text class="small" x="130" y="64" text-anchor="middle">logs spans · ObservationFilterConfig</text>
</g>
</svg>
