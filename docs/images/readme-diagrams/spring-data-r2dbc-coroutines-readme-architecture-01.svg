<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="980" viewBox="0 0 1800 980">
  <defs>
    <style>
      .canvas { fill: #fbfcff; }
      .title { font-family: "Architects Daughter", "Comic Sans MS", cursive; font-size: 42px; fill: #102033; }
      .subtitle { font-family: "Comic Mono", "SFMono-Regular", monospace; font-size: 16px; fill: #536270; }
      .layer-title { font-family: "Architects Daughter", "Comic Sans MS", cursive; font-size: 28px; fill: #263445; }
      .card-title { font-family: "Architects Daughter", "Comic Sans MS", cursive; font-size: 27px; fill: #102033; }
      .card-small { font-family: "Comic Mono", "SFMono-Regular", monospace; font-size: 15px; fill: #394959; }
      .layer-api { fill: #eef6ff; stroke: #9cc8ff; }
      .layer-repo { fill: #eefaf2; stroke: #9ad8ae; }
      .layer-r2dbc { fill: #fff8eb; stroke: #ffc879; }
      .layer-runtime { fill: #fff1f0; stroke: #ffaaa3; }
      .card-blue { fill: #ffffff; stroke: #2f6df6; }
      .card-green { fill: #ffffff; stroke: #18964a; }
      .card-orange { fill: #ffffff; stroke: #f07d22; }
      .card-red { fill: #ffffff; stroke: #f04438; }
      .line-blue { fill: none; stroke: #2f6df6; stroke-width: 3.2; stroke-linecap: round; stroke-linejoin: round; }
      .line-green { fill: none; stroke: #18a558; stroke-width: 3.2; stroke-linecap: round; stroke-linejoin: round; }
      .line-orange { fill: none; stroke: #f07d22; stroke-width: 3.2; stroke-linecap: round; stroke-linejoin: round; }
      .line-red { fill: none; stroke: #f04438; stroke-width: 3.2; stroke-linecap: round; stroke-linejoin: round; }
    </style>
    <marker id="r2c-blue" viewBox="0 0 14 14" refX="12" refY="7" markerWidth="12" markerHeight="12" orient="auto" markerUnits="userSpaceOnUse"><path d="M 1 1 L 13 7 L 1 13 Z" fill="#2f6df6" stroke-dasharray="none" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="r2c-green" viewBox="0 0 14 14" refX="12" refY="7" markerWidth="12" markerHeight="12" orient="auto" markerUnits="userSpaceOnUse"><path d="M 1 1 L 13 7 L 1 13 Z" fill="#18a558" stroke-dasharray="none" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="r2c-orange" viewBox="0 0 14 14" refX="12" refY="7" markerWidth="12" markerHeight="12" orient="auto" markerUnits="userSpaceOnUse"><path d="M 1 1 L 13 7 L 1 13 Z" fill="#f07d22" stroke-dasharray="none" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="r2c-red" viewBox="0 0 14 14" refX="12" refY="7" markerWidth="12" markerHeight="12" orient="auto" markerUnits="userSpaceOnUse"><path d="M 1 1 L 13 7 L 1 13 Z" fill="#f04438" stroke-dasharray="none" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>
  <rect class="canvas" x="0" y="0" width="1800" height="980"/>
  <rect x="24" y="24" width="1752" height="932" rx="22" fill="#ffffff" stroke="#d7e0eb" stroke-width="2"/>
  <text class="title" x="900" y="72" text-anchor="middle">R2DBC coroutine REST slice</text>
  <text class="subtitle" x="900" y="102" text-anchor="middle">WebFlux endpoints call suspend repositories backed by bluetape4k R2DBC extension functions.</text>

  <rect class="layer-api" x="80" y="140" width="1640" height="175" rx="18" stroke-width="2"/>
  <text class="layer-title" x="112" y="184">HTTP and startup layer</text>
  <rect class="card-blue" x="170" y="220" width="320" height="72" rx="10" stroke-width="2"/>
  <text class="card-title" x="330" y="250" text-anchor="middle">PostController</text>
  <text class="card-small" x="330" y="274" text-anchor="middle">/posts REST endpoints</text>
  <rect class="card-blue" x="740" y="220" width="320" height="72" rx="10" stroke-width="2"/>  <text class="card-title" x="900" y="250" text-anchor="middle">DatabaseInitializer</text>
  <text class="card-small" x="900" y="274" text-anchor="middle">seeds posts and comments</text>
  <rect class="card-blue" x="1310" y="220" width="320" height="72" rx="10" stroke-width="2"/>
  <text class="card-title" x="1470" y="250" text-anchor="middle">RestWebExceptionHandler</text>
  <text class="card-small" x="1470" y="274" text-anchor="middle">PostNotFound handling</text>

  <rect class="layer-repo" x="80" y="355" width="1640" height="200" rx="18" stroke-width="2"/>
  <text class="layer-title" x="112" y="399">Repository layer</text>
  <rect class="card-green" x="145" y="445" width="350" height="78" rx="10" stroke-width="2"/>
  <text class="card-title" x="320" y="476" text-anchor="middle">PostRepository</text>
  <text class="card-small" x="320" y="500" text-anchor="middle">count, findAll, insert</text>
  <rect class="card-green" x="600" y="445" width="350" height="78" rx="10" stroke-width="2"/>
  <text class="card-title" x="775" y="476" text-anchor="middle">CommentRepository</text>
  <text class="card-small" x="775" y="500" text-anchor="middle">post_id query and count</text>
  <rect class="card-green" x="1055" y="445" width="350" height="78" rx="10" stroke-width="2"/>
  <text class="card-title" x="1230" y="476" text-anchor="middle">MemberRepository</text>
  <text class="card-small" x="1230" y="500" text-anchor="middle">CoroutineCrudRepository</text>

  <rect class="layer-r2dbc" x="80" y="595" width="1640" height="155" rx="18" stroke-width="2"/>
  <text class="layer-title" x="112" y="639">R2DBC access</text>
  <rect class="card-orange" x="235" y="665" width="360" height="58" rx="10" stroke-width="2"/>
  <text class="card-title" x="415" y="701" text-anchor="middle">R2dbcEntityOperations</text>
  <rect class="card-orange" x="720" y="665" width="360" height="58" rx="10" stroke-width="2"/>  <text class="card-title" x="900" y="701" text-anchor="middle">DatabaseClient</text>
  <rect class="card-orange" x="1205" y="665" width="360" height="58" rx="10" stroke-width="2"/>
  <text class="card-title" x="1385" y="701" text-anchor="middle">*Suspending extensions</text>

  <rect class="layer-runtime" x="80" y="790" width="1640" height="115" rx="18" stroke-width="2"/>
  <text class="layer-title" x="112" y="833">Runtime</text>
  <rect class="card-red" x="650" y="820" width="500" height="64" rx="10" stroke-width="2"/><image data-bluetape4k-icon="database" data-source="docs/icons/generic/database-server.svg" x="662" y="839" width="26" height="26" href="data:image/svg+xml;base64," preserveAspectRatio="xMidYMid meet"/>
  <g transform="translate(690 833)"><ellipse cx="28" cy="10" rx="28" ry="10" fill="#ffffff" stroke="#f04438" stroke-width="3"/><path d="M 0 10 L 0 42 C 0 55 56 55 56 42 L 56 10" fill="#fff7f7" stroke="#f04438" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M 0 42 C 0 55 56 55 56 42" fill="none" stroke="#f04438" stroke-width="3"/></g>  <text class="card-title" x="930" y="850" text-anchor="middle">H2 R2DBC database</text>
  <text class="card-small" x="930" y="874" text-anchor="middle">r2dbc:h2:mem:///test</text>

  <path class="line-blue" d="M 330 292 L 330 433" marker-end="url(#r2c-blue)" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="line-blue" d="M 900 292 L 900 325 Q 900 335 890 335 L 785 335 Q 775 335 775 345 L 775 433" marker-end="url(#r2c-blue)" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="line-green" d="M 320 523 L 320 565 Q 320 575 330 575 L 405 575 Q 415 575 415 585 L 415 653" marker-end="url(#r2c-green)" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="line-green" d="M 775 523 L 775 565 Q 775 575 765 575 L 425 575 Q 415 575 415 585 L 415 653" marker-end="url(#r2c-green)" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="line-green" d="M 1230 523 L 1230 565 Q 1230 575 1240 575 L 1375 575 Q 1385 575 1385 585 L 1385 653" marker-end="url(#r2c-green)" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="line-orange" d="M 415 723 L 415 760 Q 415 770 425 770 L 840 770 Q 850 770 850 780 L 850 808" marker-end="url(#r2c-orange)" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="line-orange" d="M 900 723 L 900 808" marker-end="url(#r2c-orange)" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="line-orange" d="M 1385 723 L 1385 760 Q 1385 770 1375 770 L 1010 770 Q 1000 770 1000 780 L 1000 808" marker-end="url(#r2c-orange)" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
