<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="840" viewBox="0 0 1680 840" role="img" aria-label="Caffeine cache architecture">
  <defs>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="124%"><feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#64748B" flood-opacity="0.16"/></filter>
    <marker id="arrowBlue" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 14 7 L 0 14 Z" fill="#2563EB" stroke-dasharray="none"/></marker>
    <marker id="arrowGreen" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 14 7 L 0 14 Z" fill="#16A34A" stroke-dasharray="none"/></marker>
    <style>.canvas{fill:#F8FAFC}.frame{fill:#FFFFFF;stroke:#D6E0E8;stroke-width:1.4}.layer{stroke-width:1.6;rx:22}.title{font-family:"Architects Daughter";font-size:40px;fill:#102033}.subtitle{font-family:"Comic Mono";font-size:16px;fill:#51606F}.layerTitle{font-family:"Architects Daughter";font-size:29px;fill:#243447}.cardTitle{font-family:"Architects Daughter";font-size:28px;fill:#102033}.cardText{font-family:"Comic Mono";font-size:15px;fill:#415166}.line{fill:none;stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round}</style>
  </defs>
  <rect class="canvas" width="1680" height="840"/>
  <rect class="frame" x="24" y="24" width="1632" height="792" rx="24"/>
  <text class="title" x="840" y="72" text-anchor="middle">Caffeine local cache demo</text>
  <text class="subtitle" x="840" y="106" text-anchor="middle">Spring Cache annotations use a bluetape4k Caffeine DSL builder with virtual-thread executors and scheduled cache warming.</text>
  <rect class="layer" x="86" y="156" width="1508" height="150" fill="#EFF6FF" stroke="#BFDBFE"/><text class="layerTitle" x="126" y="200">Application entry</text>
  <g filter="url(#shadow)"><rect x="210" y="220" width="300" height="62" rx="14" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.7"/><text class="cardTitle" x="360" y="259" text-anchor="middle">CaffeineCacheApplication</text></g>
  <g filter="url(#shadow)"><rect x="690" y="220" width="300" height="62" rx="14" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.7"/><text class="cardTitle" x="840" y="259" text-anchor="middle">Spring Boot tests</text></g>
  <g filter="url(#shadow)"><rect x="1170" y="220" width="300" height="62" rx="14" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.7"/><text class="cardTitle" x="1320" y="259" text-anchor="middle">CountryPrefetcher</text></g>
  <rect class="layer" x="86" y="366" width="1508" height="170" fill="#F0FDF4" stroke="#BBF7D0"/><text class="layerTitle" x="126" y="410">Cache configuration</text>
  <g filter="url(#shadow)"><rect x="180" y="446" width="330" height="72" rx="14" fill="#FFFFFF" stroke="#16A34A" stroke-width="1.7"/><text class="cardTitle" x="345" y="477" text-anchor="middle">CaffeineConfig</text><text class="cardText" x="345" y="502" text-anchor="middle">@EnableCaching</text></g>
  <g filter="url(#shadow)"><rect x="660" y="436" width="360" height="92" rx="14" fill="#FFFFFF" stroke="#16A34A" stroke-width="1.7"/><text class="cardTitle" x="840" y="468" text-anchor="middle">bluetape4k caffeine DSL</text><text class="cardText" x="840" y="494" text-anchor="middle">maximumSize 1000, expire 5m</text><text class="cardText" x="840" y="518" text-anchor="middle">VirtualThreadExecutor</text></g>
  <g filter="url(#shadow)"><rect x="1170" y="446" width="300" height="72" rx="14" fill="#FFFFFF" stroke="#16A34A" stroke-width="1.7"/><text class="cardTitle" x="1320" y="477" text-anchor="middle">TaskScheduler</text><text class="cardText" x="1320" y="502" text-anchor="middle">virtual scheduled thread</text></g>
  <rect class="layer" x="86" y="596" width="1508" height="150" fill="#FFF7ED" stroke="#FED7AA"/><text class="layerTitle" x="126" y="640">Cached domain access</text>
  <g filter="url(#shadow)"><rect x="245" y="668" width="310" height="58" rx="14" fill="#FFFFFF" stroke="#EA580C" stroke-width="1.7"/><text class="cardTitle" x="400" y="705" text-anchor="middle">CountryRepository</text></g>
  <g filter="url(#shadow)"><rect x="685" y="668" width="310" height="58" rx="14" fill="#FFFFFF" stroke="#EA580C" stroke-width="1.7"/><text class="cardTitle" x="840" y="705" text-anchor="middle">cache:contries</text></g>
  <g filter="url(#shadow)"><rect x="1125" y="668" width="310" height="58" rx="14" fill="#FFFFFF" stroke="#EA580C" stroke-width="1.7"/><text class="cardTitle" x="1280" y="705" text-anchor="middle">Country payload</text></g>
