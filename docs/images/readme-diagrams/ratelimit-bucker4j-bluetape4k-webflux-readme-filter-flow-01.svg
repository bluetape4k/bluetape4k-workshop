<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1660" height="700" viewBox="0 0 1660 700" role="img" aria-label="WebFlux Bucket4j filter decision flow">
  <defs>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="124%"><feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#64748B" flood-opacity="0.16"/></filter>
    <marker id="arrowBlue" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 14 7 L 0 14 Z" fill="#2563EB"/></marker>
    <marker id="arrowGreen" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 14 7 L 0 14 Z" fill="#16A34A"/></marker>
    <marker id="arrowAmber" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 14 7 L 0 14 Z" fill="#D97706"/></marker>
    <marker id="arrowRose" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 14 7 L 0 14 Z" fill="#E11D48"/></marker>
    <style>
      .canvas{fill:#F8FAFC}.frame{fill:#FFFFFF;stroke:#D6E0E8;stroke-width:1.4}.band{fill:#F8FAFC;stroke:#CBD5E1;stroke-width:1.4}.title{font-family:"Architects Daughter";font-size:38px;fill:#102033}.subtitle{font-family:"Comic Mono";font-size:15px;fill:#51606F}.bandLabel{font-family:"Architects Daughter";font-size:24px;fill:#263548}.cardTitle{font-family:"Architects Daughter";font-size:29px;fill:#102033}.cardText{font-family:"Comic Mono";font-size:15px;fill:#415166}.label{font-family:"Comic Mono";font-size:14px;fill:#475569}.line{fill:none;stroke-width:3.6;stroke-linecap:round;stroke-linejoin:round}.soft{stroke-dasharray:8 8}
    </style>
  <marker id="arrowBlue-64748b" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path stroke-dasharray="none" d="M 0 0 L 14 7 L 0 14 Z" fill="#64748b"/></marker>
</defs>
  <rect class="canvas" width="1660" height="700"/>
  <rect class="frame" x="24" y="24" width="1612" height="652" rx="24"/>
  <text class="title" x="830" y="70" text-anchor="middle">Filter decision flow</text>
  <text class="subtitle" x="830" y="102" text-anchor="middle">Target paths consume one distributed token; missing keys and empty buckets stop before the handler.</text>

  <rect class="band" x="70" y="148" width="1520" height="290" rx="18"/>
  <text class="bandLabel" x="100" y="186">Main request path</text>
  <rect class="band" x="70" y="492" width="1520" height="160" rx="18"/>
  <text class="bandLabel" x="100" y="530">Failure and bypass outcomes</text>

  <g filter="url(#shadow)">
    <rect x="126" y="236" width="196" height="108" rx="16" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.7"/>
    <text class="cardTitle" x="224" y="278" text-anchor="middle">Request</text>
    <text class="cardText" x="224" y="310" text-anchor="middle">WebFlux exchange</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="432" y="236" width="226" height="108" rx="16" fill="#F0FDF4" stroke="#16A34A" stroke-width="1.7"/>
    <text class="cardTitle" x="545" y="278" text-anchor="middle">Target match?</text>
    <text class="cardText" x="545" y="310" text-anchor="middle">v1 reactive/coroutine</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="772" y="236" width="226" height="108" rx="16" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.7"/>
    <text class="cardTitle" x="885" y="278" text-anchor="middle">Resolve key</text>
    <text class="cardText" x="885" y="310" text-anchor="middle">UID header or host</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="1112" y="236" width="244" height="108" rx="16" fill="#FFF1F2" stroke="#E11D48" stroke-width="1.7"/>
    <text class="cardTitle" x="1234" y="282" text-anchor="middle">Consume token</text>
    <text class="cardText" x="1234" y="314" text-anchor="middle">Bucket4j Redis bucket</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="196" y="548" width="246" height="76" rx="16" fill="#F8FAFC" stroke="#64748B" stroke-width="1.7"/>
    <text class="cardTitle" x="319" y="596" text-anchor="middle">Bypass handler</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="534" y="548" width="246" height="76" rx="16" fill="#FFF7ED" stroke="#D97706" stroke-width="1.7"/>
    <text class="cardTitle" x="657" y="596" text-anchor="middle">400 Bad Request</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="872" y="548" width="246" height="76" rx="16" fill="#FEE2E2" stroke="#E11D48" stroke-width="1.7"/>
    <text class="cardTitle" x="995" y="596" text-anchor="middle">429 Too Many</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="1210" y="548" width="246" height="76" rx="16" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.7"/>
    <text class="cardTitle" x="1333" y="596" text-anchor="middle">Continue chain</text>
  </g>

  <path class="line" d="M 322 290 L 432 290" stroke="#2563EB" marker-end="url(#arrowBlue)"/>
  <path class="line" d="M 658 290 L 772 290" stroke="#16A34A" marker-end="url(#arrowGreen)"/>
  <path class="line" d="M 998 290 L 1112 290" stroke="#2563EB" marker-end="url(#arrowBlue)"/>
  <path class="line" d="M 1356 290 L 1466 290 L 1466 586 L 1456 586" stroke="#16A34A" marker-end="url(#arrowGreen)"/>

  <path class="line soft" d="M 545 344 L 545 468 L 319 468 L 319 548" stroke="#64748B" marker-end="url(#arrowBlue-64748b)"/>
  <path class="line soft" d="M 885 344 L 885 464 L 657 464 L 657 548" stroke="#D97706" marker-end="url(#arrowAmber)"/>
  <path class="line soft" d="M 1234 344 L 1234 464 L 995 464 L 995 548" stroke="#E11D48" marker-end="url(#arrowRose)"/>
  <path class="line soft" d="M 1234 344 L 1234 464 L 1333 464 L 1333 548" stroke="#16A34A" marker-end="url(#arrowGreen)"/>
  <text class="label" x="430" y="456" text-anchor="middle">not target</text>
  <text class="label" x="772" y="456" text-anchor="middle">missing key</text>
  <text class="label" x="1118" y="456" text-anchor="middle">empty bucket</text>
  <text class="label" x="1296" y="456" text-anchor="middle">consumed</text>
</svg>
