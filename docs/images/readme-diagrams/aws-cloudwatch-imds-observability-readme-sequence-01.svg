<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1220" viewBox="0 0 1500 1220" role="img" aria-labelledby="title desc">
  <title id="title">CloudWatch and IMDS Observability Workshop Sequence</title>
  <desc id="desc">Best-practices sequence diagram with numbered calls, transparent alt frame, branch-specific colors, participant roles, lifelines, and activation bars.</desc>
  <defs>
    <marker id="seqArrowBlue" markerWidth="10" markerHeight="10" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#2563eb" stroke="#2563eb"/>
    </marker>
    <marker id="seqArrowPurple" markerWidth="10" markerHeight="10" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#7c3aed" stroke="#7c3aed"/>
    </marker>
    <marker id="seqArrowGreen" markerWidth="10" markerHeight="10" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#16a34a" stroke="#16a34a"/>
    </marker>
    <marker id="seqArrowAmber" markerWidth="10" markerHeight="10" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#d97706" stroke="#d97706"/>
    </marker>
    <marker id="seqArrowOrange" markerWidth="10" markerHeight="10" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#ea580c" stroke="#ea580c"/>
    </marker>
    <marker id="seqArrowRed" markerWidth="10" markerHeight="10" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#dc2626" stroke="#dc2626"/>
    </marker>
    <marker id="seqArrowReturn" markerWidth="10" markerHeight="10" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#0f766e" stroke="#0f766e"/>
    </marker>
    <style>
      .frame { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 2; rx: 8; }
      .title { font-family: "Architects Daughter"; font-size: 34px; font-weight: 700; fill: #0f172a; }
      .subtitle { font-family: "Comic Mono"; font-size: 17px; font-weight: 400; fill: #475569; }
      .header { fill: #ffffff; stroke: #94a3b8; stroke-width: 2; rx: 8; }
      .participant { font-family: "Architects Daughter"; font-size: 18px; font-weight: 700; fill: #111827; }
      .role { font-family: "Comic Mono"; font-size: 13px; font-weight: 400; fill: #64748b; }
      .lifeline { stroke: #94a3b8; stroke-width: 2; stroke-dasharray: 8 8; }
      .activation { fill: #e0f2fe; stroke: #0284c7; stroke-width: 2; rx: 5; }
      .activationService { fill: #dcfce7; stroke: #16a34a; stroke-width: 2; rx: 5; }
      .activationOps { fill: #fef3c7; stroke: #d97706; stroke-width: 2; rx: 5; }
      .call { fill: none; stroke: #2563eb; stroke-width: 3; marker-end: url(#seqArrowBlue); }
      .callPurple { fill: none; stroke: #7c3aed; stroke-width: 3; marker-end: url(#seqArrowPurple); }
      .callGreen { fill: none; stroke: #16a34a; stroke-width: 3; marker-end: url(#seqArrowGreen); }
      .callAmber { fill: none; stroke: #d97706; stroke-width: 3; marker-end: url(#seqArrowAmber); }
      .callOrange { fill: none; stroke: #ea580c; stroke-width: 3; marker-end: url(#seqArrowOrange); }
      .return { fill: none; stroke: #0f766e; stroke-width: 3; marker-end: url(#seqArrowReturn); }
      .error { fill: none; stroke: #dc2626; stroke-width: 3; stroke-dasharray: 8 6; marker-end: url(#seqArrowRed); }
      .label { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.5; rx: 8; }
      .badge { font-family: "Comic Mono"; font-size: 14px; font-weight: 700; fill: #0f172a; }
      .labelText { font-family: "Comic Mono"; font-size: 14px; font-weight: 600; fill: #1f2937; }
      .note { font-family: "Comic Mono"; font-size: 13px; font-weight: 400; fill: #64748b; }
      .alt { fill: none; fill-opacity: 0; stroke: #64748b; stroke-width: 2; rx: 8; }
      .branchDivider { stroke: #94a3b8; stroke-width: 2; stroke-dasharray: 8 8; }
      .branchTitle { font-family: "Comic Mono"; font-size: 14px; font-weight: 700; fill: #334155; }
    </style>
  </defs>

  <rect class="frame" x="35" y="35" width="1430" height="1150" rx="8"/>
  <text class="title" x="70" y="82">CloudWatch + IMDS Observability Sequence</text>
  <text class="subtitle" x="70" y="112">Local publish intent is always safe; IMDS and real AWS behavior stay behind explicit opt-in boundaries.</text>

  <rect class="header" x="80" y="150" width="190" height="78" rx="8"/>
  <text class="participant" x="118" y="181">Learner</text>
  <text class="role" x="118" y="207">HTTP client</text>
  <rect class="header" x="360" y="150" width="210" height="78" rx="8"/>
  <text class="participant" x="392" y="181">Controller</text>
  <text class="role" x="392" y="207">REST boundary</text>
  <rect class="header" x="660" y="150" width="220" height="78" rx="8"/>
  <text class="participant" x="698" y="181">Service</text>
  <text class="role" x="698" y="207">Telemetry policy</text>
  <rect class="header" x="970" y="150" width="230" height="78" rx="8"/>
  <text class="participant" x="1004" y="181">Local / AWS Ops</text>
  <text class="role" x="1004" y="207">CloudWatch adapters</text>
  <rect class="header" x="1270" y="150" width="170" height="78" rx="8"/>
  <text class="participant" x="1310" y="181">IMDS</text>
  <text class="role" x="1310" y="207">Opt-in metadata</text>

  <path class="lifeline" d="M 175 228 L 175 1115"/>
  <path class="lifeline" d="M 465 228 L 465 1115"/>
  <path class="lifeline" d="M 770 228 L 770 1115"/>
  <path class="lifeline" d="M 1085 228 L 1085 1115"/>
  <path class="lifeline" d="M 1355 228 L 1355 1115"/>

  <rect class="activation" x="456" y="278" width="18" height="762" rx="5"/>
  <rect class="activationService" x="761" y="330" width="18" height="650" rx="5"/>
  <rect class="activationOps" x="1076" y="486" width="18" height="280" rx="5"/>
  <rect class="activationOps" x="1346" y="830" width="18" height="78" rx="5"/>

  <path class="call" d="M 175 290 L 456 290"/>
  <rect class="label" x="216" y="250" width="240" height="32" rx="8"/>
  <text class="badge" x="229" y="271">1</text>
  <text class="labelText" x="252" y="271">POST order telemetry</text>

  <path class="call" d="M 474 342 L 761 342"/>
  <rect class="label" x="500" y="298" width="260" height="32" rx="8"/>
  <text class="badge" x="513" y="319">2</text>
  <text class="labelText" x="536" y="319">Validate and start timer</text>

  <path class="call" d="M 779 498 L 1076 498"/>
  <rect class="label" x="810" y="454" width="255" height="32" rx="8"/>
  <text class="badge" x="823" y="475">3</text>
  <text class="labelText" x="846" y="475">Put metric datum</text>

  <path class="callPurple" d="M 779 560 L 1076 560"/>
  <rect class="label" x="810" y="516" width="255" height="32" rx="8"/>
  <text class="badge" x="823" y="537">4</text>
  <text class="labelText" x="846" y="537">Put sanitized log event</text>

  <path class="callGreen" d="M 779 622 L 1076 622"/>
  <rect class="label" x="810" y="578" width="255" height="32" rx="8"/>
  <text class="badge" x="823" y="599">5</text>
  <text class="labelText" x="846" y="599">Publish meter snapshot</text>

  <rect class="alt" x="610" y="690" width="800" height="255" rx="8"/>
  <text class="branchTitle" x="630" y="720">alt metadata boundary</text>
  <path class="branchDivider" d="M 610 790 L 1410 790"/>
  <text class="branchTitle" x="630" y="815">else includeMetadata=true or metadata.enabled=true</text>

  <path class="callOrange" d="M 779 746 L 1076 746"/>
  <rect class="label" x="812" y="702" width="250" height="32" rx="8"/>
  <text class="badge" x="825" y="723">6</text>
  <text class="labelText" x="848" y="723">Default skips metadata</text>
  <text class="note" x="820" y="773">No IMDS path is touched by default local POST.</text>

  <path class="callAmber" d="M 779 854 L 1346 854"/>
  <rect class="label" x="1020" y="810" width="350" height="32" rx="8"/>
  <text class="badge" x="1033" y="831">7</text>
  <text class="labelText" x="1056" y="831">Read instanceId, region, and AZ only</text>
  <text class="note" x="890" y="890">Credential document paths are intentionally not requested.</text>

  <path class="return" d="M 1076 972 L 779 972"/>
  <rect class="label" x="824" y="928" width="250" height="32" rx="8"/>
  <text class="badge" x="837" y="949">8</text>
  <text class="labelText" x="860" y="949">Independent publish states</text>

  <path class="return" d="M 761 1032 L 474 1032"/>
  <path class="return" d="M 456 1032 L 175 1032"/>
  <rect class="label" x="250" y="990" width="310" height="32" rx="8"/>
  <text class="badge" x="263" y="1011">9</text>
  <text class="labelText" x="286" y="1011">Report or normalized 400 error</text>

  <path class="error" d="M 474 390 L 175 390"/>
  <text class="note" x="225" y="420">Blank eventId returns a sanitized error message.</text>
</svg>
