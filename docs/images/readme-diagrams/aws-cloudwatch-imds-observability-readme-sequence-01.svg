<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1220" viewBox="0 0 1500 1220" role="img" aria-labelledby="title desc">
  <title id="title">CloudWatch and IMDS Observability Workshop Sequence</title>
  <desc id="desc">Best-practices sequence diagram with numbered calls, transparent alt frame, branch-specific colors, participant roles, lifelines, and activation bars.</desc>
  <defs>
    <marker id="seqArrowBlue" markerWidth="16" markerHeight="16" viewBox="0 0 16 16" refX="9" refY="5" markerUnits="userSpaceOnUse" orient="auto" data-role="sequence" data-tip-direction="positive-x">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#4f86c6" stroke="#4f86c6" stroke-dasharray="none"/>
    </marker>
    <marker id="seqArrowPurple" markerWidth="16" markerHeight="16" viewBox="0 0 16 16" refX="9" refY="5" markerUnits="userSpaceOnUse" orient="auto" data-role="sequence" data-tip-direction="positive-x">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#8a6a3b" stroke="#8a6a3b" stroke-dasharray="none"/>
    </marker>
    <marker id="seqArrowGreen" markerWidth="16" markerHeight="16" viewBox="0 0 16 16" refX="9" refY="5" markerUnits="userSpaceOnUse" orient="auto" data-role="sequence" data-tip-direction="positive-x">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#5d8c47" stroke="#5d8c47" stroke-dasharray="none"/>
    </marker>
    <marker id="seqArrowAmber" markerWidth="16" markerHeight="16" viewBox="0 0 16 16" refX="9" refY="5" markerUnits="userSpaceOnUse" orient="auto" data-role="sequence" data-tip-direction="positive-x">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#b9822d" stroke="#b9822d" stroke-dasharray="none"/>
    </marker>
    <marker id="seqArrowOrange" markerWidth="16" markerHeight="16" viewBox="0 0 16 16" refX="9" refY="5" markerUnits="userSpaceOnUse" orient="auto" data-role="sequence" data-tip-direction="positive-x">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#9a6a2e" stroke="#9a6a2e" stroke-dasharray="none"/>
    </marker>
    <marker id="seqArrowRed" markerWidth="16" markerHeight="16" viewBox="0 0 16 16" refX="9" refY="5" markerUnits="userSpaceOnUse" orient="auto" data-role="sequence" data-tip-direction="positive-x">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#bd5a62" stroke="#bd5a62" stroke-dasharray="none" style="stroke-dasharray:none"/>
    </marker>
    <marker id="seqArrowReturn" markerWidth="16" markerHeight="16" viewBox="0 0 16 16" refX="9" refY="5" markerUnits="userSpaceOnUse" orient="auto" data-role="sequence" data-tip-direction="positive-x">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#2b8f88" stroke="#2b8f88" stroke-dasharray="none"/>
    </marker>
    <style>
      .frame { fill: #fbfcf8; stroke: #40545d; stroke-width: 3; rx: 8; }
      .title { font-family: "Architects Daughter"; font-size: 34px; font-weight: 700; fill: #263238; }
      .subtitle { font-family: "Comic Mono"; font-size: 17px; font-weight: 400; fill: #3f4f57; }
      .header { fill: #fffefa; stroke: #536d79; stroke-width: 2; rx: 8; }
      .participant { font-family: "Architects Daughter"; font-size: 18px; font-weight: 700; fill: #1f2933; }
      .role { font-family: "Comic Mono"; font-size: 13px; font-weight: 400; fill: #596b74; }
      .lifeline { stroke: #8aa0aa; stroke-width: 2; stroke-dasharray: 8 8; }
      .activation { fill: #eef8f0; stroke: #6f8f77; stroke-width: 2; rx: 5; }
      .activationService { fill: #eef8f0; stroke: #6f8f77; stroke-width: 2; rx: 5; }
      .activationOps { fill: #fff8e8; stroke: #b9822d; stroke-width: 2; rx: 5; }
      .call { fill: none; stroke: #4f86c6; stroke-width: 3; marker-end: url(#seqArrowBlue); }
      .callPurple { fill: none; stroke: #8a6a3b; stroke-width: 3; marker-end: url(#seqArrowPurple); }
      .callGreen { fill: none; stroke: #5d8c47; stroke-width: 3; marker-end: url(#seqArrowGreen); }
      .callAmber { fill: none; stroke: #b9822d; stroke-width: 3; marker-end: url(#seqArrowAmber); }
      .callOrange { fill: none; stroke: #9a6a2e; stroke-width: 3; marker-end: url(#seqArrowOrange); }
      .return { fill: none; stroke: #2b8f88; stroke-width: 3; marker-end: url(#seqArrowReturn); }
      .error { fill: none; stroke: #bd5a62; stroke-width: 3; stroke-dasharray: 8 6; marker-end: url(#seqArrowRed); }
      .label { fill: #ffffff; stroke-width: 1.5; rx: 8; }
      .labelBlue { stroke: #9cc6df; }
      .labelBrown { stroke: #c8a66e; }
      .labelGreen { stroke: #a7c68f; }
      .labelAmber { stroke: #d6b069; }
      .labelReturn { stroke: #9bc9c4; }
      .labelRed { stroke: #d9a0a6; }
      .badgeCircle { fill: #fffefa; stroke-width: 1.5; }
      .badgeBlue { stroke: #4f86c6; }
      .badgeBrown { stroke: #8a6a3b; }
      .badgeGreen { stroke: #5d8c47; }
      .badgeAmber { stroke: #b9822d; }
      .badgeReturn { stroke: #2b8f88; }
      .badgeRed { stroke: #bd5a62; }
      .badge { font-family: "Comic Mono"; font-size: 14px; font-weight: 700; fill: #263238; text-anchor: middle; }
      .labelText { font-family: "Comic Mono"; font-size: 14px; font-weight: 600; fill: #263238; }
      .labelTextBlue { fill: #276b9d; }
      .labelTextBrown { fill: #7c582e; }
      .labelTextGreen { fill: #4f783c; }
      .labelTextAmber { fill: #8e641f; }
      .labelTextReturn { fill: #217a74; }
      .labelTextRed { fill: #9e4851; }
      .note { font-family: "Comic Mono"; font-size: 13px; font-weight: 400; fill: #5b6f7a; }
      .alt { fill: none; fill-opacity: 0; stroke: #78909c; stroke-width: 2; stroke-dasharray: 10 8; rx: 8; }
      .branchDivider { stroke: #94a3b8; stroke-width: 2; stroke-dasharray: 8 8; }
      .branchTitle { font-family: "Comic Mono"; font-size: 14px; font-weight: 700; fill: #334155; }
    </style>
  </defs>

  <rect class="frame" x="35" y="35" width="1430" height="1150" rx="8"/>
  <text class="title" x="70" y="82">CloudWatch + IMDS Observability Sequence</text>
  <text class="subtitle" x="70" y="112">Local publish intent is always safe; IMDS and real AWS behavior stay behind explicit opt-in boundaries.</text>

  <rect class="header" x="80" y="150" width="190" height="78" rx="8"/>
  <text class="participant" x="118" y="181">Learner</text>
  <text class="role" x="118" y="207">HTTP client</text>
  <rect class="header" x="360" y="150" width="210" height="78" rx="8"/>
  <text class="participant" x="392" y="181">Controller</text>
  <text class="role" x="392" y="207">REST boundary</text>
  <rect class="header" x="660" y="150" width="220" height="78" rx="8"/>
  <text class="participant" x="698" y="181">Service</text>
  <text class="role" x="698" y="207">Telemetry policy</text>
  <rect class="header" x="970" y="150" width="230" height="78" rx="8"/>
  <text class="participant" x="1004" y="181">Local / AWS Ops</text>
  <text class="role" x="1004" y="207">CloudWatch adapters</text>
  <rect class="header" x="1270" y="150" width="170" height="78" rx="8"/>
  <text class="participant" x="1310" y="181">IMDS</text>
  <text class="role" x="1310" y="207">Opt-in metadata</text>

  <path class="lifeline" d="M 175 228 L 175 1115"/>
  <path class="lifeline" d="M 465 228 L 465 1115"/>
  <path class="lifeline" d="M 770 228 L 770 1115"/>
  <path class="lifeline" d="M 1085 228 L 1085 1115"/>
  <path class="lifeline" d="M 1355 228 L 1355 1115"/>

  <rect class="activation" x="456" y="278" width="18" height="762" rx="5"/>
  <rect class="activationService" x="761" y="330" width="18" height="650" rx="5"/>
  <rect class="activationOps" x="1076" y="486" width="18" height="280" rx="5"/>
  <rect class="activationOps" x="1346" y="830" width="18" height="78" rx="5"/>

  <path class="call" d="M 175 290 L 456 290"/>
  <rect class="label labelPill labelBlue" x="216" y="250" width="240" height="32" rx="8"/>
  <circle class="badgeCircle badgeBlue" cx="240" cy="266" r="13"/>
  <text class="badge num" x="240" y="271">1</text>
  <text class="labelText labelTextBlue" x="268" y="271">POST order telemetry</text>

  <path class="call" d="M 474 342 L 761 342"/>
  <rect class="label labelPill labelBlue" x="500" y="298" width="260" height="32" rx="8"/>
  <circle class="badgeCircle badgeBlue" cx="524" cy="314" r="13"/>
  <text class="badge num" x="524" y="319">2</text>
  <text class="labelText labelTextBlue" x="552" y="319">Validate and start timer</text>

  <path class="error" d="M 474 390 L 175 390"/>
  <rect class="label labelPill labelRed" x="218" y="350" width="270" height="32" rx="8"/>
  <circle class="badgeCircle badgeRed" cx="242" cy="366" r="13"/>
  <text class="badge num" x="242" y="371">3</text>
  <text class="labelText labelTextRed" x="270" y="371">Reject blank eventId</text>
  <text class="note" x="225" y="420">Blank eventId returns a sanitized error message.</text>

  <path class="call" d="M 779 498 L 1076 498"/>
  <rect class="label labelPill labelBlue" x="810" y="454" width="255" height="32" rx="8"/>
  <circle class="badgeCircle badgeBlue" cx="834" cy="470" r="13"/>
  <text class="badge num" x="834" y="475">4</text>
  <text class="labelText labelTextBlue" x="862" y="475">Put metric datum</text>

  <path class="callPurple" d="M 779 560 L 1076 560"/>
  <rect class="label labelPill labelBrown" x="810" y="516" width="255" height="32" rx="8"/>
  <circle class="badgeCircle badgeBrown" cx="834" cy="532" r="13"/>
  <text class="badge num" x="834" y="537">5</text>
  <text class="labelText labelTextBrown" x="862" y="537">Put sanitized log event</text>

  <path class="callGreen" d="M 779 622 L 1076 622"/>
  <rect class="label labelPill labelGreen" x="810" y="578" width="255" height="32" rx="8"/>
  <circle class="badgeCircle badgeGreen" cx="834" cy="594" r="13"/>
  <text class="badge num" x="834" y="599">6</text>
  <text class="labelText labelTextGreen" x="862" y="599">Publish meter snapshot</text>

  <rect class="alt" x="610" y="690" width="800" height="255" rx="8"/>
  <text class="branchTitle" x="630" y="720">alt metadata boundary</text>
  <path class="branchDivider" d="M 610 790 L 1410 790"/>
  <text class="branchTitle" x="630" y="815">else includeMetadata=true or metadata.enabled=true</text>

  <path class="callOrange" d="M 779 746 L 1076 746"/>
  <rect class="label labelPill labelBrown" x="812" y="702" width="250" height="32" rx="8"/>
  <circle class="badgeCircle badgeBrown" cx="836" cy="718" r="13"/>
  <text class="badge num" x="836" y="723">7</text>
  <text class="labelText labelTextBrown" x="864" y="723">Default skips metadata</text>
  <text class="note" x="820" y="773">No IMDS path is touched by default local POST.</text>

  <path class="callAmber" d="M 779 854 L 1346 854"/>
  <rect class="label labelPill labelAmber" x="1020" y="810" width="350" height="32" rx="8"/>
  <circle class="badgeCircle badgeAmber" cx="1044" cy="826" r="13"/>
  <text class="badge num" x="1044" y="831">8</text>
  <text class="labelText labelTextAmber" x="1072" y="831">Read instanceId, region, and AZ only</text>
  <text class="note" x="890" y="890">Credential document paths are intentionally not requested.</text>

  <path class="return" d="M 1076 972 L 779 972"/>
  <rect class="label labelPill labelReturn" x="824" y="928" width="250" height="32" rx="8"/>
  <circle class="badgeCircle badgeReturn" cx="848" cy="944" r="13"/>
  <text class="badge num" x="848" y="949">9</text>
  <text class="labelText labelTextReturn" x="876" y="949">Independent publish states</text>

  <path class="return" d="M 761 1032 L 474 1032"/>
  <path class="return" d="M 456 1032 L 175 1032"/>
  <rect class="label labelPill labelReturn" x="250" y="990" width="310" height="32" rx="8"/>
  <circle class="badgeCircle badgeReturn" cx="274" cy="1006" r="13"/>
  <text class="badge num" x="274" y="1011">10</text>
  <text class="labelText labelTextReturn" x="302" y="1011">Report or normalized 400 error</text>

</svg>
