  <path class="line" d="M 404.48 485 L 448 485 Q 476.16 485 476.16 495 L 476.16 562 Q 476.16 572 473.6 572 L 960 572 Q 967.68 572 967.68 562 L 967.68 380 Q 967.68 370 985.6 370 L 1039.36 370" stroke="#2563EB" marker-end="url(#arrowBlue)" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="line" d="M 870.4 315 L 944.64 315 Q 957.44 315 957.44 325 L 957.44 330 Q 957.44 340 970.24 340 L 1039.36 340" stroke="#16A34A" marker-end="url(#arrowGreen)" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="line" d="M 870.4 485 L 944.64 485 Q 957.44 485 957.44 475 L 957.44 410 Q 957.44 400 970.24 400 L 1039.36 400" stroke="#C47A12" marker-end="url(#arrowAmber)" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="line" d="M 1310.72 338 L 1479.68 266" stroke="#2563EB" marker-end="url(#arrowBlue)" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="line" d="M 1310.72 374 L 1479.68 419" stroke="#16A34A" marker-end="url(#arrowGreen)" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="line" d="M 1175.04 422 L 1175.04 550 Q 1175.04 560 1187.84 560 L 1479.68 560" stroke="#C47A12" marker-end="url(#arrowAmber)" stroke-linecap="round" stroke-linejoin="round"/>
  <text class="label" x="488.96" y="552">HTTP observation</text>
</svg>
