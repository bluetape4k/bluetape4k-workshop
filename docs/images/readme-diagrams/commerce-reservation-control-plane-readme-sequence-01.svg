<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1300" viewBox="0 0 1500 1300" role="img" aria-labelledby="title desc">
  <title id="title">Reservation Hold, Retry, Expiry, and Promotion Sequence</title>
  <desc id="desc">Numbered reservation sequence with PostgreSQL authority, advisory Redis, leader sweep, idempotent replay, and stale-state rejection.</desc>
  <defs>
    <marker id="seqArrowBlue" markerWidth="16" markerHeight="16" viewBox="0 0 16 16" refX="9" refY="5" markerUnits="userSpaceOnUse" orient="auto" data-role="sequence" data-tip-direction="positive-x"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#4f86c6" stroke="#4f86c6" stroke-dasharray="none" stroke-width="0"/></marker>
    <marker id="seqArrowGreen" markerWidth="16" markerHeight="16" viewBox="0 0 16 16" refX="9" refY="5" markerUnits="userSpaceOnUse" orient="auto" data-role="sequence" data-tip-direction="positive-x"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#5d8c47" stroke="#5d8c47" stroke-dasharray="none" stroke-width="0"/></marker>
    <marker id="seqArrowOrange" markerWidth="16" markerHeight="16" viewBox="0 0 16 16" refX="9" refY="5" markerUnits="userSpaceOnUse" orient="auto" data-role="sequence" data-tip-direction="positive-x"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#b9822d" stroke="#b9822d" stroke-dasharray="none" stroke-width="0"/></marker>
    <marker id="seqArrowPurple" markerWidth="16" markerHeight="16" viewBox="0 0 16 16" refX="9" refY="5" markerUnits="userSpaceOnUse" orient="auto" data-role="sequence" data-tip-direction="positive-x"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#7c3aed" stroke="#7c3aed" stroke-dasharray="none" stroke-width="0"/></marker>
    <marker id="seqArrowRed" markerWidth="16" markerHeight="16" viewBox="0 0 16 16" refX="9" refY="5" markerUnits="userSpaceOnUse" orient="auto" data-role="sequence" data-tip-direction="positive-x"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#bd5a62" stroke="#bd5a62" stroke-dasharray="none" style="stroke-dasharray:none" stroke-width="0"/></marker>
    <style>
      .frame { fill: #fbfcf8; stroke: #40545d; stroke-width: 3; rx: 8; }
      .title { font-family: "Architects Daughter"; font-size: 34px; font-weight: 700; fill: #263238; }
      .subtitle { font-family: "Comic Mono"; font-size: 17px; fill: #3f4f57; }
      .header { fill: #fffefa; stroke: #536d79; stroke-width: 2; rx: 8; }
      .participant { font-family: "Architects Daughter"; font-size: 18px; font-weight: 700; fill: #1f2933; }
      .role { font-family: "Comic Mono"; font-size: 13px; fill: #596b74; }
      .lifeline { stroke: #8aa0aa; stroke-width: 2; stroke-dasharray: 8 8; }
      .activation { fill: #eef8f0; stroke: #6f8f77; stroke-width: 2; rx: 5; }
      .activationOps { fill: #fff8e8; stroke: #b9822d; stroke-width: 2; rx: 5; }
      .call { fill: none; stroke: #4f86c6; stroke-width: 3; marker-end: url(#seqArrowBlue); }
      .authority { fill: none; stroke: #5d8c47; stroke-width: 3; marker-end: url(#seqArrowGreen); }
      .advisory { fill: none; stroke: #b9822d; stroke-width: 3; marker-end: url(#seqArrowOrange); }
      .async { fill: none; stroke: #7c3aed; stroke-width: 3; marker-end: url(#seqArrowPurple); }
      .error { fill: none; stroke: #bd5a62; stroke-width: 3; stroke-dasharray: 8 6; marker-end: url(#seqArrowRed); }
      .label { fill: #ffffff; stroke-width: 1.5; rx: 8; }
      .labelBlue { stroke: #9cc6df; }
      .labelGreen { stroke: #a7c68f; }
      .labelAmber { stroke: #d6b069; }
      .labelPurple { stroke: #c4b5fd; }
      .labelRed { stroke: #d9a0a6; }
      .badgeCircle { fill: #fffefa; stroke-width: 1.5; }
      .badgeBlue { stroke: #4f86c6; }
      .badgeGreen { stroke: #5d8c47; }
      .badgeAmber { stroke: #b9822d; }
      .badgePurple { stroke: #7c3aed; }
      .badgeRed { stroke: #bd5a62; }
      .badge { font-family: "Comic Mono"; font-size: 14px; font-weight: 700; fill: #263238; text-anchor: middle; }
      .labelText { font-family: "Comic Mono"; font-size: 14px; font-weight: 600; fill: #263238; }
      .labelTextBlue { fill: #276b9d; }
      .labelTextGreen { fill: #4f783c; }
      .labelTextAmber { fill: #8e641f; }
      .labelTextPurple { fill: #6d28d9; }
      .labelTextRed { fill: #9e4851; }
      .alt { fill: none; fill-opacity: 0; stroke: #78909c; stroke-width: 2; stroke-dasharray: 10 8; rx: 8; }
      .branchDivider { stroke: #94a3b8; stroke-width: 2; stroke-dasharray: 8 8; }
      .branchTitle { font-family: "Comic Mono"; font-size: 14px; font-weight: 700; fill: #334155; }
      .note { font-family: "Comic Mono"; font-size: 13px; fill: #5b6f7a; }
    </style>
  </defs>

  <rect class="frame" x="35" y="35" width="1430" height="1230" rx="8"/>
  <text class="title" x="70" y="82">Hold, Retry, Expiry, and Promotion</text>
  <text class="subtitle" x="70" y="112">Redis changes admission mode; PostgreSQL remains the reservation authority.</text>

  <rect class="header" x="55" y="150" width="180" height="78" rx="8"/><text class="participant" x="92" y="181">Browser</text><text class="role" x="92" y="207">Owner credential</text>
  <rect class="header" x="305" y="150" width="180" height="78" rx="8"/><text class="participant" x="342" y="181">Spring MVC</text><text class="role" x="342" y="207">Command boundary</text>
  <rect class="header" x="555" y="150" width="180" height="78" rx="8"/><text class="participant" x="610" y="181">Redis</text><text class="role" x="592" y="207">Advisory only</text>
  <rect class="header" x="805" y="150" width="180" height="78" rx="8"/><text class="participant" x="842" y="181">PostgreSQL</text><text class="role" x="842" y="207">Authoritative</text>
  <rect class="header" x="1055" y="150" width="180" height="78" rx="8"/><text class="participant" x="1092" y="181">Sweeper</text><text class="role" x="1092" y="207">Leader worker</text>
  <rect class="header" x="1280" y="150" width="150" height="78" rx="8"/><text class="participant" x="1298" y="181">Provider</text><text class="role" x="1298" y="207">Deduplicates</text>

  <path class="lifeline" d="M 145 228 L 145 1190"/><path class="lifeline" d="M 395 228 L 395 1190"/><path class="lifeline" d="M 645 228 L 645 1190"/><path class="lifeline" d="M 895 228 L 895 1190"/><path class="lifeline" d="M 1145 228 L 1145 1190"/><path class="lifeline" d="M 1355 228 L 1355 1190"/>
  <rect class="activation" x="386" y="270" width="18" height="865" rx="5"/><rect class="activation" x="886" y="370" width="18" height="765" rx="5"/><rect class="activationOps" x="1136" y="650" width="18" height="260" rx="5"/>

  <path class="call" d="M 145 285 L 386 285" marker-end="url(#seqArrowBlue)"/><rect class="label labelPill labelBlue" x="185" y="245" width="200" height="32" rx="8"/><circle class="badgeCircle badgeBlue" cx="209" cy="261" r="13"/><text class="badge num" x="209" y="266">1</text><text class="labelText labelTextBlue" x="237" y="266">POST hold + key</text>
  <path class="advisory" d="M 404 340 L 645 340" marker-end="url(#seqArrowOrange)"/><rect class="label labelPill labelAmber" x="440" y="300" width="200" height="32" rx="8"/><circle class="badgeCircle badgeAmber" cx="464" cy="316" r="13"/><text class="badge num" x="464" y="321">2</text><text class="labelText labelTextAmber" x="492" y="321">permit + 2s lock</text>
  <path class="authority" d="M 404 395 L 886 395" marker-end="url(#seqArrowGreen)"/><rect class="label labelPill labelGreen" x="570" y="355" width="310" height="32" rx="8"/><circle class="badgeCircle badgeGreen" cx="594" cy="371" r="13"/><text class="badge num" x="594" y="376">3</text><text class="labelText labelTextGreen" x="622" y="376">idempotency + capacity CAS</text>
  <path class="authority" d="M 886 450 L 404 450" marker-end="url(#seqArrowGreen)"/><rect class="label labelPill labelGreen" x="570" y="410" width="310" height="32" rx="8"/><circle class="badgeCircle badgeGreen" cx="594" cy="426" r="13"/><text class="badge num" x="594" y="431">4</text><text class="labelText labelTextGreen" x="622" y="431">commit 201 hold snapshot</text>
  <path class="call" d="M 145 505 L 386 505" marker-end="url(#seqArrowBlue)"/><rect class="label labelPill labelBlue" x="175" y="465" width="210" height="32" rx="8"/><circle class="badgeCircle badgeBlue" cx="199" cy="481" r="13"/><text class="badge num" x="199" y="486">5</text><text class="labelText labelTextBlue" x="227" y="486">retry same key</text>
  <path class="authority" d="M 404 560 L 886 560" marker-end="url(#seqArrowGreen)"/><rect class="label labelPill labelGreen" x="570" y="520" width="310" height="32" rx="8"/><circle class="badgeCircle badgeGreen" cx="594" cy="536" r="13"/><text class="badge num" x="594" y="541">6</text><text class="labelText labelTextGreen" x="622" y="541">replay terminal response</text>

  <rect class="alt" x="520" y="610" width="900" height="360" rx="8"/><text class="branchTitle" x="540" y="640">alt Redis available - leader sweep runs</text><path class="branchDivider" d="M 520 930 L 1420 930"/><text class="branchTitle" x="540" y="955">else Redis unavailable - automatic sweep pauses; HTTP commands remain safe</text>
  <path class="advisory" d="M 1136 680 L 645 680" marker-end="url(#seqArrowOrange)"/><rect class="label labelPill labelAmber" x="780" y="640" width="350" height="32" rx="8"/><circle class="badgeCircle badgeAmber" cx="804" cy="656" r="13"/><text class="badge num" x="804" y="661">7</text><text class="labelText labelTextAmber" x="832" y="661">acquire 15s leader lease</text>
  <path class="authority" d="M 1136 800 L 904 800" marker-end="url(#seqArrowGreen)"/><rect class="label labelPill labelGreen" x="930" y="760" width="200" height="32" rx="8"/><circle class="badgeCircle badgeGreen" cx="954" cy="776" r="13"/><text class="badge num" x="954" y="781">8</text><text class="labelText labelTextGreen" x="982" y="781">resource tx</text>
  <path class="authority" d="M 904 855 L 1136 855" marker-end="url(#seqArrowGreen)"/><rect class="label labelPill labelGreen" x="930" y="815" width="200" height="32" rx="8"/><circle class="badgeCircle badgeGreen" cx="954" cy="831" r="13"/><text class="badge num" x="954" y="836">9</text><text class="labelText labelTextGreen" x="982" y="836">FIFO offer</text>
  <path class="async" d="M 904 910 L 1355 910" marker-end="url(#seqArrowPurple)"/><rect class="label labelPill labelPurple" x="1065" y="870" width="285" height="32" rx="8"/><circle class="badgeCircle badgePurple" cx="1089" cy="886" r="13"/><text class="badge num" x="1089" y="891">10</text><text class="labelText labelTextPurple" x="1117" y="891">durable deliveryId</text>

  <path class="call" d="M 145 1025 L 386 1025" marker-end="url(#seqArrowBlue)"/><rect class="label labelPill labelBlue" x="170" y="985" width="215" height="32" rx="8"/><circle class="badgeCircle badgeBlue" cx="194" cy="1001" r="13"/><text class="badge num" x="194" y="1006">11</text><text class="labelText labelTextBlue" x="222" y="1006">confirm old hold</text>
  <path class="authority" d="M 404 1080 L 886 1080" marker-end="url(#seqArrowGreen)"/><rect class="label labelPill labelGreen" x="570" y="1040" width="310" height="32" rx="8"/><circle class="badgeCircle badgeGreen" cx="594" cy="1056" r="13"/><text class="badge num" x="594" y="1061">12</text><text class="labelText labelTextGreen" x="622" y="1061">read terminal state</text>
  <path class="error" d="M 886 1135 L 145 1135" marker-end="url(#seqArrowRed)"/><rect class="label labelPill labelRed" x="430" y="1095" width="315" height="32" rx="8"/><circle class="badgeCircle badgeRed" cx="454" cy="1111" r="13"/><text class="badge num" x="454" y="1116">13</text><text class="labelText labelTextRed" x="482" y="1116">410 HOLD_EXPIRED</text>
  <text class="note" x="70" y="1220">The durable outcome is replayable even when the original HTTP response was lost.</text>
</svg>
