<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1380" height="840" viewBox="0 0 1380 840" role="img" aria-label="Jackson examples architecture diagram">
  <defs>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="124%"><feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#64748B" flood-opacity="0.18"/></filter>
    <marker id="arrowBlue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 12 6 L 0 12 Z" fill="#2563EB" stroke-dasharray="none"/></marker>
    <marker id="arrowGreen" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 12 6 L 0 12 Z" fill="#16A34A" stroke-dasharray="none"/></marker>
    <marker id="arrowAmber" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 12 6 L 0 12 Z" fill="#C47A12" stroke-dasharray="none"/></marker>
    <style>
      .canvas { fill: #F8FAFC; }
      .frame { fill: #FFFFFF; stroke: #D6E0E8; stroke-width: 1.4; }
      .title { font-family: "Architects Daughter"; font-size: 34px; fill: #102033; }
      .subtitle { font-family: "Comic Mono"; font-size: 14px; fill: #51606F; }
      .layerTitle { font-family: "Architects Daughter"; font-size: 22px; fill: #102033; }
      .cardTitle { font-family: "Architects Daughter"; font-size: 23px; fill: #102033; }
      .cardText { font-family: "Comic Mono"; font-size: 14px; fill: #415166; }
      .line { fill: none; stroke-width: 3.2; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>
  <rect class="canvas" width="1380" height="840"/>
  <rect class="frame" x="18" y="18" width="1344" height="804" rx="24"/>
  <text class="title" x="690" y="58" text-anchor="middle">Jackson examples</text>
  <text class="subtitle" x="690" y="84" text-anchor="middle">Jackson 3 mapper defaults plus annotation-focused serialization tests</text>

  <rect x="54" y="116" width="1272" height="138" rx="20" fill="#EAF3FF" stroke="#9DB9D8" stroke-width="1.5"/>
  <text class="layerTitle" x="88" y="150">Shared test harness</text>
  <g filter="url(#shadow)">
    <rect x="190" y="148" width="288" height="74" rx="12" fill="#FFFFFF" stroke="#8EA9C2" stroke-width="1.5"/>
    <text class="cardTitle" x="334" y="176" text-anchor="middle">AbstractJacksonTest</text>
    <text class="cardText" x="334" y="200" text-anchor="middle">mapper, faker, JsonPath config</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="546" y="148" width="288" height="74" rx="12" fill="#FFFFFF" stroke="#8EA9C2" stroke-width="1.5"/>
    <text class="cardTitle" x="690" y="176" text-anchor="middle">Jackson.defaultJsonMapper</text>
    <text class="cardText" x="690" y="200" text-anchor="middle">Kotlin, JavaTime, Blackbird</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="902" y="148" width="288" height="74" rx="12" fill="#FFFFFF" stroke="#8EA9C2" stroke-width="1.5"/>
    <text class="cardTitle" x="1046" y="176" text-anchor="middle">JsonPathSupport</text>
    <text class="cardText" x="1046" y="200" text-anchor="middle">typed readAs helper</text>
  </g>

  <rect x="54" y="286" width="1272" height="220" rx="20" fill="#EAF8F0" stroke="#93C5A7" stroke-width="1.5"/>
  <text class="layerTitle" x="88" y="320">Annotation scenarios</text>
  <g filter="url(#shadow)"><rect x="110" y="356" width="220" height="76" rx="12" fill="#FFFFFF" stroke="#86B89B" stroke-width="1.5"/><text class="cardTitle" x="220" y="385" text-anchor="middle">Field shape</text><text class="cardText" x="220" y="410" text-anchor="middle">ignore, rename, unwrapped</text></g>
  <g filter="url(#shadow)"><rect x="400" y="356" width="220" height="76" rx="12" fill="#FFFFFF" stroke="#86B89B" stroke-width="1.5"/><text class="cardTitle" x="510" y="385" text-anchor="middle">View and raw JSON</text><text class="cardText" x="510" y="410" text-anchor="middle">JsonView, RawValue</text></g>
  <g filter="url(#shadow)"><rect x="690" y="356" width="220" height="76" rx="12" fill="#FFFFFF" stroke="#86B89B" stroke-width="1.5"/><text class="cardTitle" x="800" y="385" text-anchor="middle">Object graph</text><text class="cardText" x="800" y="410" text-anchor="middle">polymorphism, cyclic refs</text></g>
  <g filter="url(#shadow)"><rect x="980" y="356" width="220" height="76" rx="12" fill="#FFFFFF" stroke="#86B89B" stroke-width="1.5"/><text class="cardTitle" x="1090" y="385" text-anchor="middle">Dynamic and time</text><text class="cardText" x="1090" y="410" text-anchor="middle">AnyGetter, JavaTime</text></g>

  <rect x="54" y="538" width="1272" height="150" rx="20" fill="#FFF7E8" stroke="#D8B86E" stroke-width="1.5"/>
  <text class="layerTitle" x="88" y="572">Reader workflow</text>
  <g filter="url(#shadow)"><rect x="178" y="596" width="246" height="62" rx="12" fill="#FFFFFF" stroke="#C99A35" stroke-width="1.5"/><text class="cardTitle" x="301" y="620" text-anchor="middle">Kotlin model</text><text class="cardText" x="301" y="642" text-anchor="middle">data class or class</text></g>
  <g filter="url(#shadow)"><rect x="566" y="596" width="246" height="62" rx="12" fill="#FFFFFF" stroke="#C99A35" stroke-width="1.5"/><text class="cardTitle" x="689" y="620" text-anchor="middle">JSON document</text><text class="cardText" x="689" y="642" text-anchor="middle">writeValue and readValue</text></g>
  <g filter="url(#shadow)"><rect x="954" y="596" width="246" height="62" rx="12" fill="#FFFFFF" stroke="#C99A35" stroke-width="1.5"/><text class="cardTitle" x="1077" y="620" text-anchor="middle">JsonPath assertion</text><text class="cardText" x="1077" y="642" text-anchor="middle">verify shape and values</text></g>

  <path class="line" d="M 334 222 L 334 270 L 220 270 L 220 356" stroke="#2563EB" marker-end="url(#arrowBlue)" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="line" d="M 690 222 L 690 270 L 800 270 L 800 356" stroke="#2563EB" marker-end="url(#arrowBlue)" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="line" d="M 1046 222 L 1046 270 L 1090 270 L 1090 356" stroke="#2563EB" marker-end="url(#arrowBlue)" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="line" d="M 220 432 L 220 520 L 301 520 L 301 596" stroke="#16A34A" marker-end="url(#arrowGreen)" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="line" d="M 800 432 L 800 520 L 689 520 L 689 596" stroke="#16A34A" marker-end="url(#arrowGreen)" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="line" d="M 1090 432 L 1090 520 L 1077 520 L 1077 596" stroke="#16A34A" marker-end="url(#arrowGreen)" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="line" d="M 424 627 L 566 627" stroke="#C47A12" marker-end="url(#arrowAmber)" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="line" d="M 812 627 L 954 627" stroke="#C47A12" marker-end="url(#arrowAmber)" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
