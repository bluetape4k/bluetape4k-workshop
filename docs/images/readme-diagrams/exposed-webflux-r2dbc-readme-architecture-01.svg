<svg xmlns="http://www.w3.org/2000/svg" width="1760" height="1280" viewBox="0 0 1760 1280" role="img" aria-labelledby="title desc">
  <title id="title">exposed/webflux-r2dbc architecture</title>
  <desc id="desc">Spring WebFlux and Exposed R2DBC architecture showing coroutine controllers, service-owned suspend transactions, Flow repositories, R2DBC connection pool, JDBC schema initialization, and PostgreSQL tables.</desc>
  <defs>
    <style>
      svg{background:#f8fafc}
      .frame{fill:#fff;stroke:#d9e5ec;stroke-width:2}
      .title{font-family:"Architects Daughter";font-size:42px;fill:#152437}
      .subtitle,.body,.label,.footer{font-family:"Comic Mono";fill:#405260}
      .subtitle{font-size:17px}.body{font-size:15px}.label{font-size:14px}.footer{font-size:14px;fill:#617684}
      .layer{fill:#fbfdff;stroke:#dbe7ee;stroke-width:2}
      .layerTitle{font-family:"Architects Daughter";font-size:28px;fill:#213a4b}
      .card{stroke-width:2.3;rx:10}
      .web{fill:#eef7ff;stroke:#72a2c8}.svc{fill:#f0fbf4;stroke:#73a57f}.repo{fill:#fff9ea;stroke:#c49c57}
      .r2dbc{fill:#f2f6ff;stroke:#758ec6}.jdbc{fill:#fff0ef;stroke:#c98272}.db{fill:#fffaf2;stroke:#957636}
      .innerLayer{fill:#ffffff;stroke:#d6e1e8;stroke-width:2}
      .cardTitle{font-family:"Architects Daughter";font-size:27px;fill:#152437}
      .cardTitleSmall{font-family:"Architects Daughter";font-size:23px;fill:#152437}
      .chip{fill:#fff;stroke:#d4e0e8;stroke-width:1.4}
      .line{fill:none;stroke:#53738b;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}
      .txLine{fill:none;stroke:#667eb9;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrowTx)}
      .repoLine{fill:none;stroke:#9c6f27;stroke-width:3.1;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrowRepo)}
      .jdbcLine{fill:none;stroke:#b75c55;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:8 7;marker-end:url(#arrowJdbc)}
      .scopeLine{fill:none;stroke:#667eb9;stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:7 7;marker-end:url(#arrowScope)}
      .schemaLine{fill:none;stroke:#6a8798;stroke-width:2.6;stroke-linecap:round;stroke-dasharray:7 7;marker-end:url(#arrowSchema)}
    </style>
    <marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" viewBox="0 0 9.3333 9.3333" refX="10" refY="5" orient="auto" data-role="primary" data-tip-direction="positive-x"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#53738b" stroke-dasharray="none" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="arrowTx" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" viewBox="0 0 9.3333 9.3333" refX="10" refY="5" orient="auto" data-role="primary" data-tip-direction="positive-x"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#667eb9" stroke-dasharray="none" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="arrowRepo" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" viewBox="0 0 9.3333 9.3333" refX="10" refY="5" orient="auto" data-role="primary" data-tip-direction="positive-x"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#9c6f27" stroke-dasharray="none" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="arrowJdbc" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" viewBox="0 0 10.3704 10.3704" refX="10" refY="5" orient="auto" data-role="primary" data-tip-direction="positive-x"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#b75c55" stroke-dasharray="none" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="arrowScope" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" viewBox="0 0 10.3704 10.3704" refX="10" refY="5" orient="auto" data-role="primary" data-tip-direction="positive-x"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#667eb9" stroke-dasharray="none" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="arrowSchema" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" viewBox="0 0 11.6667 11.6667" refX="10" refY="5" orient="auto" data-role="primary" data-tip-direction="positive-x"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#6a8798" stroke-dasharray="none" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <g id="databaseIcon">
      <rect x="0" y="0" width="70" height="70" rx="12" fill="#fffaf2" stroke="#28485a" stroke-width="3"/>
      <path d="M17 23v26c0 7 36 7 36 0V23" fill="#fff0d8" stroke="#8c6f33" stroke-width="3.2" stroke-linejoin="round"/>
      <path d="M17 36c0 7 36 7 36 0" fill="none" stroke="#8c6f33" stroke-width="2.6" stroke-linecap="round"/>
      <path d="M17 49c0 7 36 7 36 0" fill="none" stroke="#8c6f33" stroke-width="2.6" stroke-linecap="round"/>
      <ellipse cx="35" cy="23" rx="18" ry="7" fill="#fff0d8" stroke="#8c6f33" stroke-width="3.2"/>
    </g>
  </defs>

  <rect class="frame" x="30" y="28" width="1700" height="1224" rx="18"/>
  <text class="title" x="880" y="82" text-anchor="middle">Spring WebFlux + Coroutines + Exposed R2DBC</text>
  <text class="subtitle" x="880" y="114" text-anchor="middle">Services own suspendTransaction boundaries; repositories expose Flow and suspend query primitives.</text>

  <rect class="layer" x="78" y="150" width="1604" height="170" rx="15"/>
  <text class="layerTitle" x="108" y="191">Reactive Web API</text>
  <rect class="card web" x="190" y="218" width="410" height="76" rx="10"/>
  <text class="cardTitle" x="395" y="252" text-anchor="middle">Author + Book Controllers</text>
  <text class="body" x="395" y="277" text-anchor="middle">suspend WebFlux endpoints</text>
  <rect class="card web" x="1185" y="218" width="410" height="76" rx="10"/>
  <text class="cardTitle" x="1390" y="252" text-anchor="middle">Product + Order Controllers</text>
  <text class="body" x="1390" y="277" text-anchor="middle">return coroutine results to WebFlux</text>

  <rect class="layer" x="78" y="365" width="1604" height="255" rx="15"/>
  <text class="layerTitle" x="108" y="406">Coroutine Transaction Boundary</text>
  <rect class="card svc" x="170" y="455" width="330" height="104" rx="10"/>
  <text class="cardTitle" x="335" y="493" text-anchor="middle">AuthorService</text>
  <text class="body" x="335" y="520" text-anchor="middle">suspendTransaction(db)</text>
  <text class="body" x="335" y="544" text-anchor="middle">collects Flow inside TX</text>
  <rect class="card svc" x="1265" y="455" width="330" height="104" rx="10"/>
  <text class="cardTitle" x="1430" y="493" text-anchor="middle">OrderService</text>
  <text class="body" x="1430" y="520" text-anchor="middle">one order transaction</text>
  <text class="body" x="1430" y="544" text-anchor="middle">sorts, locks, writes, decrements</text>
  <rect class="card r2dbc" x="610" y="435" width="520" height="124" rx="10"/>  <text class="cardTitle" x="870" y="472" text-anchor="middle">R2dbcDatabase</text>
  <text class="body" x="870" y="500" text-anchor="middle">ConnectionPool + ConnectionFactoryOptions</text>
  <text class="body" x="870" y="524" text-anchor="middle">dispatcher = Dispatchers.IO</text>

  <rect class="layer" x="78" y="665" width="1604" height="210" rx="15"/>
  <text class="layerTitle" x="108" y="706">Flow Repository Work</text>
  <rect class="card repo" x="250" y="742" width="470" height="96" rx="10"/>
  <text class="cardTitleSmall" x="485" y="777" text-anchor="middle">Author / Book Repositories</text>
  <text class="body" x="485" y="805" text-anchor="middle">Flow&lt;DTO&gt; selects and suspend writes</text>
  <rect class="card repo" x="1040" y="742" width="470" height="96" rx="10"/>
  <text class="cardTitleSmall" x="1275" y="777" text-anchor="middle">Order / Product Repositories</text>
  <text class="body" x="1275" y="805" text-anchor="middle">FOR UPDATE product lock and stock update</text>

  <rect class="layer" x="78" y="920" width="1604" height="238" rx="15"/><text class="layerTitle" x="108" y="962">PostgreSQL Runtime</text>
  <rect class="card jdbc" x="150" y="1000" width="400" height="74" rx="10"/>  <text class="cardTitleSmall" x="350" y="1032" text-anchor="middle">DatabaseInitializer</text>
  <text class="body" x="350" y="1058" text-anchor="middle">JDBC/Hikari schema creation only</text>
  <rect class="innerLayer" x="680" y="980" width="960" height="150" rx="13"/>  <text class="cardTitleSmall" x="710" y="1014">Database Tables</text>
  <rect class="card db" x="710" y="1026" width="380" height="88" rx="10"/>
  <use href="#databaseIcon" x="734" y="1035"/>
  <text class="cardTitleSmall" x="955" y="1061" text-anchor="middle">Author / Book Tables</text>
  <text class="body" x="955" y="1088" text-anchor="middle">plain Exposed Table definitions</text>
  <rect class="card db" x="1220" y="1026" width="390" height="88" rx="10"/>
  <use href="#databaseIcon" x="1244" y="1035"/>
  <text class="cardTitleSmall" x="1470" y="1061" text-anchor="middle">Order / Product Tables</text>
  <text class="body" x="1470" y="1088" text-anchor="middle">row locks protect stock mutation</text>

  <path class="line" d="M 395 294 V 455" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="line" d="M 1390 294 L 1390 410 Q 1390 420 1400 420 L 1420 420 Q 1430 420 1430 430 L 1430 455" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="txLine" d="M 500 507 H 610" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="txLine" d="M 1265 507 H 1130" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="repoLine" d="M 335 559 V 742" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="repoLine" d="M 1430 559 V 742" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="scopeLine" d="M 870 559 V 665" stroke-linecap="round" stroke-linejoin="round"/>
  <rect class="chip" x="948" y="632" width="128" height="30" rx="15"/>
  <text class="label" x="1012" y="652" text-anchor="middle">TX scope</text>
  <path class="repoLine" d="M 485 838 L 485 950 Q 485 960 495 960 L 890 960 Q 900 960 900 970 L 900 1026" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="repoLine" d="M 1275 838 L 1275 950 Q 1275 960 1285 960 L 1425 960 Q 1435 960 1435 970 L 1435 1026" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="jdbcLine" d="M 550 1037 H 680" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="schemaLine" d="M 1090 1070 H 1220" stroke-linecap="round" stroke-linejoin="round"/>
  <rect class="chip" x="1115" y="1100" width="78" height="30" rx="15"/>
  <text class="label" x="1154" y="1120" text-anchor="middle">same DB</text>

  <text class="footer" x="880" y="1225" text-anchor="middle">Reader contract: reactive request handling stays coroutine-first; blocking JDBC appears only during one-shot schema initialization.</text>
</svg>
