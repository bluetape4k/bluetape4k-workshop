      <path d="M13 30c0 5 8 9 19 9s19-4 19-9" fill="none" stroke="#8c6f33" stroke-width="2.8" stroke-linecap="round"/>
      <path d="M13 42c0 5 8 9 19 9s19-4 19-9" fill="none" stroke="#8c6f33" stroke-width="2.8" stroke-linecap="round"/>
      <ellipse cx="36.28" cy="18" rx="19" ry="7" fill="#fff0d8" stroke="#8c6f33" stroke-width="3"/>
    </g>
