    </g>
    <style>
      svg{background:#f7fafc}
      .frame{fill:#ffffff;stroke:#d6e1eb;stroke-width:2}
      .title{font-family:"Architects Daughter";font-size:48px;fill:#142033}
      .subtitle,.detail,.mono,.footer{font-family:"Comic Mono";fill:#516273}
      .subtitle{font-size:17px}
      .layer{fill:#fbfdff;stroke:#d8e4ee;stroke-width:1.8}
      .layerTitle{font-family:"Architects Daughter";font-size:28px;fill:#1b3048}
      .layerDetail{font-family:"Comic Mono";font-size:13px;fill:#647285}
      .card{stroke-width:2.2;filter:url(#shadow)}
      .cardTitle{font-family:"Architects Daughter";font-size:28px;fill:#142033}
      .smallTitle{font-family:"Architects Daughter";font-size:25px;fill:#142033}
      .detail{font-size:14px}
      .mono{font-size:13px;fill:#2f4052}
      .edge{fill:none;stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round}
      .note{fill:#ffffff;stroke:#d8e4ee;stroke-width:1.6}
      .chip{font-family:"Comic Mono";font-size:13px;fill:#304154}
    </style>
  </defs>

  <rect class="frame" x="40.815" y="34" width="2072.495" height="1092" rx="24"/>
  <text id="titleText" class="title" x="1077.062" y="92" text-anchor="middle">Exposed Workshop Examples</text>
  <text class="subtitle" x="1077.062" y="127" text-anchor="middle">Pick the module by HTTP style and transaction boundary; each sample keeps the same reader-facing domain shape.</text>

  <g id="layers">
    <rect class="layer" x="86.165" y="164" width="1981.795" height="288" rx="18"/>
    <text class="layerTitle" x="126.98" y="207">Runnable modules</text>
    <text class="layerDetail" x="129.248" y="230">Spring MVC, virtual threads, WebFlux/R2DBC, and JaVers audit slices</text>

    <rect class="layer" x="86.165" y="488" width="1981.795" height="190" rx="18"/>
    <text class="layerTitle" x="126.98" y="531">Transaction boundary</text>
    <text class="layerDetail" x="129.248" y="554">where Exposed work is committed or suspended</text>

    <rect class="layer" x="86.165" y="720" width="1981.795" height="238" rx="18"/>
    <text class="layerTitle" x="126.98" y="763">Persistence runtime</text>
    <text class="layerDetail" x="129.248" y="786">database or audit repository used by tests and local runs</text>
  </g>

  <g id="edges">
    <path class="edge" d="M 555.538 405 V 560" stroke="#c47a2c" marker-end="url(#arrow-amber)" stroke-linecap="round" stroke-linejoin="round"/>
    <path class="edge" d="M 555.538 668 V 815" stroke="#c47a2c" marker-end="url(#arrow-amber)" stroke-linecap="round" stroke-linejoin="round"/>

    <path class="edge" d="M 986.363 405 V 560" stroke="#2f8b57" marker-end="url(#arrow-green)" stroke-linecap="round" stroke-linejoin="round"/>
    <path class="edge" d="M 986.363 668 V 815" stroke="#2f8b57" marker-end="url(#arrow-green)" stroke-linecap="round" stroke-linejoin="round"/>

    <path class="edge" d="M 1417.188 405 V 560" stroke="#7c5bc4" marker-end="url(#arrow-purple)" stroke-linecap="round" stroke-linejoin="round"/>
    <path class="edge" d="M 1417.188 668 V 815" stroke="#7c5bc4" marker-end="url(#arrow-purple)" stroke-linecap="round" stroke-linejoin="round"/>

    <path class="edge" d="M 1848.013 405 V 560" stroke="#386fd8" marker-end="url(#arrow-blue)" stroke-linecap="round" stroke-linejoin="round"/>
    <path class="edge" d="M 1848.013 668 V 815" stroke="#386fd8" marker-end="url(#arrow-blue)" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <g id="module-cards">
    <rect class="card" x="374.137" y="258" width="362.8" height="147" rx="14" fill="#fff5e8" stroke="#d79a50"/>
    <text class="cardTitle" x="555.538" y="296" text-anchor="middle">javers-audit</text>
    <text class="detail" x="555.538" y="326" text-anchor="middle">ProductAuditService</text>
    <text class="detail" x="555.538" y="350" text-anchor="middle">commit, diff, history</text>
    <text class="mono" x="555.538" y="378" text-anchor="middle">JaVers + Exposed JDBC</text>

    <rect class="card" x="804.962" y="258" width="362.8" height="147" rx="14" fill="#eaf7ef" stroke="#62aa7a"/>
    <text class="cardTitle" x="986.363" y="296" text-anchor="middle">mvc-jdbc</text>
    <text class="detail" x="986.363" y="326" text-anchor="middle">Spring MVC controllers</text>
    <text class="detail" x="986.363" y="350" text-anchor="middle">Author/Book + Order APIs</text>
    <text class="mono" x="986.363" y="378" text-anchor="middle">blocking JDBC sample</text>

    <rect class="card" x="1235.788" y="258" width="362.8" height="147" rx="14" fill="#f3edff" stroke="#8b72d6"/>
    <text class="cardTitle" x="1417.188" y="296" text-anchor="middle">mvc-virtualthread</text>
    <text class="detail" x="1417.188" y="326" text-anchor="middle">Spring MVC on Tomcat VT</text>
    <text class="detail" x="1417.188" y="350" text-anchor="middle">repository futures</text>
    <text class="mono" x="1417.188" y="378" text-anchor="middle">JDBC without @Transactional</text>

    <rect class="card" x="1666.612" y="258" width="362.8" height="147" rx="14" fill="#e8f3ff" stroke="#5b8def"/>
    <text class="cardTitle" x="1848.013" y="296" text-anchor="middle">webflux-r2dbc</text>
    <text class="detail" x="1848.013" y="326" text-anchor="middle">WebFlux controllers</text>
    <text class="detail" x="1848.013" y="350" text-anchor="middle">suspend services + Flow</text>
    <text class="mono" x="1848.013" y="378" text-anchor="middle">non-blocking R2DBC sample</text>
  </g>

  <g id="tx-cards">
    <rect class="card" x="374.137" y="560" width="362.8" height="108" rx="14" fill="#fffaf2" stroke="#d79a50"/>
    <text class="smallTitle" x="555.538" y="598" text-anchor="middle">JaVers commit first</text>
    <text class="detail" x="555.538" y="626" text-anchor="middle">commit / shallow delete</text>
    <text class="mono" x="555.538" y="648" text-anchor="middle">then transaction { upsert/delete }</text>

    <rect class="card" x="804.962" y="560" width="362.8" height="108" rx="14" fill="#f0fbf4" stroke="#62aa7a"/>
    <text class="smallTitle" x="986.363" y="598" text-anchor="middle">@Transactional</text>
    <text class="detail" x="986.363" y="626" text-anchor="middle">Spring owns JDBC boundary</text>
    <text class="mono" x="986.363" y="648" text-anchor="middle">SELECT FOR UPDATE in service use case</text>

    <rect class="card" x="1235.788" y="560" width="362.8" height="108" rx="14" fill="#f8f3ff" stroke="#8b72d6"/>
    <text class="smallTitle" x="1417.188" y="598" text-anchor="middle">virtualFuture</text>
    <text class="detail" x="1417.188" y="626" text-anchor="middle">ExecutorService carrier</text>
    <text class="mono" x="1417.188" y="648" text-anchor="middle">transaction(db) inside VT task</text>

    <rect class="card" x="1666.612" y="560" width="362.8" height="108" rx="14" fill="#f0f7ff" stroke="#5b8def"/>
    <text class="smallTitle" x="1848.013" y="598" text-anchor="middle">suspendTransaction</text>
    <text class="detail" x="1848.013" y="626" text-anchor="middle">Coroutine service boundary</text>
    <text class="mono" x="1848.013" y="648" text-anchor="middle">R2dbcDatabase + Flow repositories</text>
  </g>

  <g id="runtime-cards">
    <rect class="card" x="374.137" y="815" width="362.8" height="135" rx="14" fill="#fffaf2" stroke="#d79a50"/>
    <use data-bluetape4k-icon="database" data-source="docs/icons/generic/database-server.svg" href="#database-server-icon" x="396.812" y="850"/>
    <text class="smallTitle" x="589.55" y="855" text-anchor="middle">H2 + JaVers</text>
    <text class="detail" x="589.55" y="886" text-anchor="middle">in-memory audit repository</text>
    <text class="detail" x="589.55" y="912" text-anchor="middle">ProductTable row state</text>

    <rect class="card" x="804.962" y="815" width="362.8" height="135" rx="14" fill="#f0fbf4" stroke="#62aa7a"/>
    <use href="#postgres-icon" x="828.771" y="850"/>  <text class="smallTitle" x="1020.375" y="846" text-anchor="middle">PostgreSQL</text>
    <text class="smallTitle" x="1020.375" y="876" text-anchor="middle">JDBC</text>  <text class="detail" x="1020.375" y="906" text-anchor="middle">Testcontainers-backed tests</text>
    <text class="detail" x="1020.375" y="930" text-anchor="middle">schema created by initializer</text>

    <rect class="card" x="1235.788" y="815" width="362.8" height="135" rx="14" fill="#f8f3ff" stroke="#8b72d6"/>
    <use href="#postgres-icon" x="1259.596" y="850"/>  <text class="smallTitle" x="1451.2" y="846" text-anchor="middle">PostgreSQL</text>
    <text class="smallTitle" x="1451.2" y="876" text-anchor="middle">JDBC</text>
    <text class="detail" x="1451.2" y="906" text-anchor="middle">virtual-thread blocking work</text>
    <text class="detail" x="1451.2" y="930" text-anchor="middle">deadlock-safe product ordering</text>

    <rect class="card" x="1666.612" y="815" width="362.8" height="135" rx="14" fill="#f0f7ff" stroke="#5b8def"/>
    <use href="#postgres-icon" x="1690.421" y="850"/>  <text class="smallTitle" x="1882.025" y="846" text-anchor="middle">PostgreSQL</text>
    <text class="smallTitle" x="1882.025" y="876" text-anchor="middle">R2DBC</text>
    <text class="detail" x="1882.025" y="906" text-anchor="middle">reactive driver + pool</text>
    <text class="detail" x="1882.025" y="930" text-anchor="middle">JDBC initializer for schema</text>
  </g>

  <g id="domain-note">
    <rect class="note" x="374.137" y="1030" width="1655.275" height="58" rx="14"/>
    <text class="smallTitle" x="412.685" y="1065">Reader contract</text>
    <text class="footer" x="671.18" y="1064">MVC and WebFlux modules implement Author/Book plus Product/Order/OrderLine CRUD; audit focuses on Product history and diff.</text>
  </g>
</svg>
