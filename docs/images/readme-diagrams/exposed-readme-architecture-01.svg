      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#7c5bc4" stroke-dasharray="none" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" markerWidth="15" markerHeight="15" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#c47a2c" stroke-dasharray="none" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
