<svg xmlns="http://www.w3.org/2000/svg" width="2154.125" height="1160" viewBox="0 0 2154.125 1160" role="img" aria-labelledby="title desc">
  <title id="title">Exposed Workshop Module Map</title>
  <desc id="desc">Architecture diagram comparing the four exposed workshop modules by HTTP style, transaction boundary, and persistence target.</desc>
