  <path class="line" d="M 1103.36 226 L 1103.36 284 Q 1103.36 276 1116.16 276 L 1336.32 276 Q 1349.12 276 1349.12 304 L 1349.12 366" stroke="#3B82F6" marker-end="url(#arrowBlue)" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="line" d="M 532.48 420 L 652.8 420" stroke="#16A34A" marker-end="url(#arrowGreen)" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="line" d="M 1036.8 420 L 1157.12 420" stroke="#16A34A" marker-end="url(#arrowGreen)" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="line" d="M 844.8 474 L 844.8 534.75 Q 844.8 536 843.2 536 L 842.56 536 Q 840.96 536 840.96 537.25 L 840.96 578" stroke="#C47A12" marker-end="url(#arrowAmber)" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="line" d="M 1349.12 474 L 1349.12 526 Q 1349.12 506 1336.32 506 L 1222.4 506 Q 1209.6 506 1209.6 546 L 1209.6 578" stroke="#C47A12" marker-end="url(#arrowAmber)" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="line" d="M 840.96 648 L 840.96 696 Q 840.96 696 828.16 696 L 517.12 696 Q 504.32 696 504.32 716 L 504.32 750" stroke="#D14F6B" marker-end="url(#arrowRose)" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="line" d="M 840.96 648 L 840.96 704.75 Q 840.96 706 842.56 706 L 843.2 706 Q 844.8 706 844.8 707.25 L 844.8 750" stroke="#D14F6B" marker-end="url(#arrowRose)" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="line" d="M 840.96 648 L 840.96 696 Q 840.96 696 853.76 696 L 1172.48 696 Q 1185.28 696 1185.28 716 L 1185.28 750" stroke="#D14F6B" marker-end="url(#arrowRose)" stroke-linecap="round" stroke-linejoin="round"/>

</svg>
