<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1689.6" height="920" viewBox="0 0 1689.6 920" role="img" aria-label="graph-abuser-detection architecture diagram">
  <defs>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#64748B" flood-opacity="0.18"/>
    </filter>
    <marker id="arrowBlue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 12 6 L 0 12 Z" fill="#3B82F6" stroke-dasharray="none" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrowGreen" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 12 6 L 0 12 Z" fill="#16A34A" stroke-dasharray="none" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrowAmber" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 12 6 L 0 12 Z" fill="#C47A12" stroke-dasharray="none" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrowRose" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 12 6 L 0 12 Z" fill="#D14F6B" stroke-dasharray="none" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .canvas { fill: #F7FAFC; }
      .frame { fill: #FFFFFF; stroke: #D6E0E8; stroke-width: 1.4; }
      .title { font-family: "Architects Daughter"; font-size: 34px; fill: #132033; }
      .subtitle { font-family: "Comic Mono"; font-size: 14px; fill: #506070; }
      .layerTitle { font-family: "Architects Daughter"; font-size: 22px; fill: #102033; }
      .layerNote { font-family: "Comic Mono"; font-size: 13px; fill: #526273; }
      .cardTitle { font-family: "Architects Daughter"; font-size: 23px; fill: #102033; }
      .cardText { font-family: "Comic Mono"; font-size: 14px; fill: #425166; }
      .tiny { font-family: "Comic Mono"; font-size: 12px; fill: #425166; }
      .line { fill: none; stroke-width: 3.2; stroke-linecap: round; stroke-linejoin: round; }
      .labelBox { fill: #FFFFFF; stroke: #D2DCE5; stroke-width: 1; opacity: 0.96; }
      .label { font-family: "Comic Mono"; font-size: 12px; fill: #243244; dominant-baseline: middle; }
    </style>
    <g id="graphDbIcon">
      <circle cx="10.24" cy="10" r="5" fill="#A7F3D0" stroke="#0F766E" stroke-width="1.6"/>
      <circle cx="35.84" cy="8" r="6" fill="#BFDBFE" stroke="#2563EB" stroke-width="1.6"/>
      <circle cx="32" cy="29" r="5.5" fill="#FDE68A" stroke="#B45309" stroke-width="1.6"/>
      <path d="M 13 10 L 22 8 M 12 13 L 21 25 M 28 14 L 26 23" stroke="#64748B" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <g id="tinkerIcon">
      <rect x="0" y="0" width="48.64" height="38" rx="10" fill="#ECFDF5" stroke="#16A34A" stroke-width="2.048"/>
      <circle cx="15.36" cy="12" r="4" fill="#16A34A"/>
      <circle cx="33.28" cy="12" r="4" fill="#22C55E"/>
      <circle cx="24.32" cy="27" r="4" fill="#4ADE80"/>
      <path d="M 15 13 L 23 13 M 14 15 L 18 24 M 24 15 L 20 24" stroke="#166534" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </defs>
  <rect class="canvas" width="1689.6" height="920"/>
  <rect class="frame" x="23.04" y="18" width="1643.52" height="884" rx="24"/>

  <text class="title" x="844.8" y="58" text-anchor="middle">graph-abuser-detection</text>
  <text class="subtitle" x="844.8" y="84" text-anchor="middle">Identity graph services, typed schema, algorithms, and graph test backends</text>

  <g id="reader-layer">
    <rect x="69.12" y="112" width="1551.36" height="148" rx="20" fill="#EAF3FF" stroke="#9DB9D8" stroke-width="1.92"/>
    <text class="layerTitle" x="112.64" y="146">Reader entry points</text>
    <text class="layerNote" x="112.64" y="170">Service API selection</text>
    <g filter="url(#shadow)">
      <rect x="399.36" y="142" width="373.76" height="84" rx="12" fill="#FFFFFF" stroke="#8EA9C2" stroke-width="1.92"/>
      <text class="cardTitle" x="586.24" y="172" text-anchor="middle">Blocking tests</text>
      <text class="cardText" x="586.24" y="197" text-anchor="middle">AbuserDetectionService</text>
    </g>
    <g filter="url(#shadow)">
      <rect x="916.48" y="142" width="373.76" height="84" rx="12" fill="#FFFFFF" stroke="#8EA9C2" stroke-width="1.92"/>
      <text class="cardTitle" x="1103.36" y="172" text-anchor="middle">Coroutine tests</text>
      <text class="cardText" x="1103.36" y="197" text-anchor="middle">AbuserDetectionSuspendService</text>
    </g>
  </g>

  <g id="service-layer">
    <rect x="69.12" y="292" width="1551.36" height="198" rx="20" fill="#EAF8F0" stroke="#93C5A7" stroke-width="1.92"/>
    <text class="layerTitle" x="112.64" y="326">Service and algorithm boundary</text>
    <text class="layerNote" x="112.64" y="350">Same contract; different return style.</text>
    <g filter="url(#shadow)">
      <rect x="148.48" y="382" width="384" height="76" rx="12" fill="#FFFFFF" stroke="#86B89B" stroke-width="1.92"/>
      <text class="cardTitle" x="340.48" y="411" text-anchor="middle">Vertex and edge mutators</text>
      <text class="cardText" x="340.48" y="436" text-anchor="middle">find-or-create vertices; create edges</text>
    </g>
    <g filter="url(#shadow)">
      <rect x="652.8" y="366" width="384" height="108" rx="12" fill="#F7FFF9" stroke="#86B89B" stroke-width="1.92"/>
      <text class="cardTitle" x="844.8" y="397" text-anchor="middle">Cluster and evidence queries</text>
      <text class="cardText" x="844.8" y="423" text-anchor="middle">findAbuseCluster</text>
      <text class="cardText" x="844.8" y="444" text-anchor="middle">explainSuspicion</text>
    </g>
    <g filter="url(#shadow)">
      <rect x="1157.12" y="366" width="384" height="108" rx="12" fill="#F7FFF9" stroke="#86B89B" stroke-width="1.92"/>
      <text class="cardTitle" x="1349.12" y="397" text-anchor="middle">Graph algorithms</text>
      <text class="cardText" x="1349.12" y="423" text-anchor="middle">detectReferralLoops</text>
      <text class="cardText" x="1349.12" y="444" text-anchor="middle">rankSuspiciousUsers</text>
    </g>
  </g>

  <g id="schema-layer">
    <rect x="69.12" y="522" width="1551.36" height="158" rx="20" fill="#FFF7E8" stroke="#D8B86E" stroke-width="1.92"/>
    <text class="layerTitle" x="112.64" y="556">Typed graph schema</text>
    <g filter="url(#shadow)">
      <rect x="320" y="578" width="304.64" height="70" rx="12" fill="#FFFFFF" stroke="#C99A35" stroke-width="1.92"/>
      <text class="cardTitle" x="472.32" y="606" text-anchor="middle">User vertices</text>
      <text class="cardText" x="472.32" y="631" text-anchor="middle">userId, country</text>
    </g>
    <g filter="url(#shadow)">
      <rect x="688.64" y="578" width="304.64" height="70" rx="12" fill="#FFFFFF" stroke="#C99A35" stroke-width="1.92"/>
      <text class="cardTitle" x="840.96" y="606" text-anchor="middle">Identifier vertices</text>
      <text class="cardText" x="840.96" y="631" text-anchor="middle">device, IP, phone hash, token</text>
    </g>
    <g filter="url(#shadow)">
      <rect x="1057.28" y="578" width="304.64" height="70" rx="12" fill="#FFFFFF" stroke="#C99A35" stroke-width="1.92"/>
      <text class="cardTitle" x="1209.6" y="606" text-anchor="middle">Referral edges</text>
      <text class="cardText" x="1209.6" y="631" text-anchor="middle">REFERRED_BY cycles only</text>
    </g>
  </g>

  <g id="runtime-layer">
    <rect x="69.12" y="712" width="1551.36" height="138" rx="20" fill="#F2F5F8" stroke="#B3BFCA" stroke-width="1.92"/>
    <text class="layerTitle" x="112.64" y="746">Graph runtime backends</text>
    <g filter="url(#shadow)">
      <rect x="363.52" y="750" width="281.6" height="72" rx="12" fill="#FFFFFF" stroke="#A7B3BF" stroke-width="1.92"/>
      <use href="#tinkerIcon" x="389.12" y="767"/>
      <text class="cardTitle" x="529.92" y="779" text-anchor="middle">TinkerGraph</text>
      <text class="cardText" x="529.92" y="804" text-anchor="middle">test, no Docker</text>
    </g>
    <g filter="url(#shadow)">
      <rect x="704" y="750" width="281.6" height="72" rx="12" fill="#FFFFFF" stroke="#A7B3BF" stroke-width="1.92"/>
      <use href="#graphDbIcon" x="729.6" y="767"/>
      <text class="cardTitle" x="870.4" y="779" text-anchor="middle">Neo4j</text>
      <text class="cardText" x="870.4" y="804" text-anchor="middle">integrationTest</text>
    </g>
    <g filter="url(#shadow)">
      <rect x="1044.48" y="750" width="281.6" height="72" rx="12" fill="#FFFFFF" stroke="#A7B3BF" stroke-width="1.92"/>
      <use href="#graphDbIcon" x="1070.08" y="767"/>
      <text class="cardTitle" x="1210.88" y="779" text-anchor="middle">Memgraph</text>
      <text class="cardText" x="1210.88" y="804" text-anchor="middle">integrationTest</text>
    </g>
  </g>

