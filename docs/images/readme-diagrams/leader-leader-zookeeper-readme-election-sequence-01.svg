    <text x="215.0" y="186" text-anchor="middle" class="participant">Candidates</text>
    <text x="215.0" y="211" text-anchor="middle" class="role">all instances compete</text></g>
  <line x1="215.0" y1="232" x2="215.0" y2="864" class="lifeline"/>
  <g filter="url(#shadow)"><rect x="418.0" y="156" width="250" height="76" rx="10" class="header"/>
    <text x="543.0" y="186" text-anchor="middle" class="participant">No lease TTL</text>
    <text x="543.0" y="211" text-anchor="middle" class="role">Session loss deletes ephemeral zn…</text></g>
  <line x1="543.0" y1="232" x2="543.0" y2="864" class="lifeline"/>
  <g filter="url(#shadow)"><rect x="746.0" y="156" width="250" height="76" rx="10" class="header"/>
    <text x="871.0" y="186" text-anchor="middle" class="participant">Ephemeral node</text>
    <text x="871.0" y="211" text-anchor="middle" class="role">/single/{lockName}</text></g>
  <line x1="871.0" y1="232" x2="871.0" y2="864" class="lifeline"/>
