    <text x="1199.0" y="186" text-anchor="middle" class="participant">Semaphore znodes</text>
    <text x="1199.0" y="211" text-anchor="middle" class="role">/group/{lockName}</text></g>
  <line x1="1199.0" y1="232" x2="1199.0" y2="864" class="lifeline"/>
  <g filter="url(#shadow)"><rect x="1402.0" y="156" width="250" height="76" rx="10" class="header"/>
    <text x="1527.0" y="186" text-anchor="middle" class="participant">One winner</text>
    <text x="1527.0" y="211" text-anchor="middle" class="role">executes job body</text></g>
  <line x1="1527.0" y1="232" x2="1527.0" y2="864" class="lifeline"/>
  <g filter="url(#shadow)"><rect x="1730.0" y="156" width="250" height="76" rx="10" class="header"/>
    <text x="1855.0" y="186" text-anchor="middle" class="participant">N holders</text>
