  <line x1="1855.0" y1="232" x2="1855.0" y2="864" class="lifeline"/>
  <g filter="url(#shadow)"><rect x="2058.0" y="156" width="250" height="76" rx="10" class="header"/>
    <text x="2183.0" y="186" text-anchor="middle" class="participant">Others skip</text>
    <text x="2183.0" y="211" text-anchor="middle" class="role">result is null</text></g>
  <line x1="2183.0" y1="232" x2="2183.0" y2="864" class="lifeline"/>
  <g filter="url(#shadow)"><rect x="2386.0" y="156" width="250" height="76" rx="10" class="header"/>
    <text x="2511.0" y="186" text-anchor="middle" class="participant">No slot</text>
    <text x="2511.0" y="211" text-anchor="middle" class="role">result is null</text></g>
