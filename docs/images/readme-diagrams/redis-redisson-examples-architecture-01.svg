<svg xmlns="http://www.w3.org/2000/svg" width="960" height="500" viewBox="0 0 960 500" role="img" aria-label="Redisson Examples Architecture">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#1f2937" flood-opacity="0.10"/></filter>
  <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth">
    <path d="M1,1 L8,4.5 L1,8 Z" fill="#758297"/>
  </marker>
  <style>
    .canvas{fill:#f7f9fc}.frame{fill:#fff;stroke:#d8e0ea;stroke-width:1.5}
    .title{font-family:"Architects Daughter";font-size:38px;font-weight:400;fill:#102033}
    .subtitle{font-family:"Comic Mono";font-size:14px;font-weight:400;fill:#536273}
    .smallLabel{font-family:"Architects Daughter";font-size:21px;font-weight:400;fill:#102033}
    .mono{font-family:"Comic Mono";font-size:12px;font-weight:400;fill:#102033}
    .small{font-family:"Comic Mono";font-size:12px;font-weight:400;fill:#536273}
    .card{stroke-width:2.1;filter:url(#shadow)}
    .line{stroke:#758297;stroke-width:2.1;fill:none;marker-end:url(#arrow)}
  </style>
</defs>
<!-- Layout:
     Canvas: 960×500  Frame: x=24 y=20 w=912 h=456
     Row1  y=110 h=80  4 cols (w=196 gap=40):
       Col1: x=24  cx=122  Locks
       Col2: x=260 cx=358  Collections
       Col3: x=496 cx=594  Objects
       Col4: x=732 cx=830  ReadWriteThrough
     Row2  y=252 h=80  AbstractRedissonTest full width cx=480
     Row3  y=392 h=62  Col1: x=24 w=420 cx=234 (RedissonClient)
                        Col2: x=516 w=420 cx=726 (Redis Testcontainers)
-->
<rect class="canvas" width="960" height="500"/>
<rect class="frame" x="24" y="20" width="912" height="456" rx="28"/>
<text class="title" x="58" y="66">Redisson Examples</text>
<text class="subtitle" x="58" y="90">LZ4ForyComposite codec · VirtualThreadExecutor · 4 categories · Redis Testcontainers</text>

<!-- Arrows: 4 categories → AbstractRedissonTest (straight down) -->
<path class="line" d="M122 190 L122 252"/>
<path class="line" d="M358 190 L358 252"/>
<path class="line" d="M594 190 L594 252"/>
<path class="line" d="M830 190 L830 252"/>
<!-- Arrows: AbstractRedissonTest → RedissonClient + Redis -->
<path class="line" d="M234 332 L234 392"/>
<path class="line" d="M726 332 L726 392"/>

<!-- Locks col1 -->
<g transform="translate(24,110)">
  <rect class="card" x="0" y="0" width="196" height="80" rx="12" fill="#FDECEF" stroke="#DC6B82"/>
  <text class="smallLabel" x="98" y="22" text-anchor="middle">Locks</text>
  <text class="mono" x="98" y="44" text-anchor="middle">RLock · FairLock · FencedLock</text>
  <text class="small" x="98" y="64" text-anchor="middle">MultiLock · Semaphore · Latch</text>
</g>

<!-- Collections col2 -->
<g transform="translate(260,110)">
  <rect class="card" x="0" y="0" width="196" height="80" rx="12" fill="#E8F3FF" stroke="#5B8DEF"/>
  <text class="smallLabel" x="98" y="22" text-anchor="middle">Collections</text>
  <text class="mono" x="98" y="44" text-anchor="middle">Queue · Stream · Deque</text>
  <text class="small" x="98" y="64" text-anchor="middle">LocalCachedMap · SortedSet</text>
</g>

<!-- Objects col3 -->
<g transform="translate(496,110)">
  <rect class="card" x="0" y="0" width="196" height="80" rx="12" fill="#FFF3D9" stroke="#D6A441"/>
  <text class="smallLabel" x="98" y="22" text-anchor="middle">Objects</text>
  <text class="mono" x="98" y="44" text-anchor="middle">AtomicLong · Topic · Bucket</text>
  <text class="small" x="98" y="64" text-anchor="middle">RateLimiter · BloomFilter</text>
</g>

<!-- ReadWriteThrough col4 -->
<g transform="translate(732,110)">
  <rect class="card" x="0" y="0" width="196" height="80" rx="12" fill="#F1ECFF" stroke="#8A72D6"/>
  <text class="smallLabel" x="98" y="22" text-anchor="middle" font-size="16">ReadWriteThrough</text>
  <text class="mono" x="98" y="44" text-anchor="middle">MapLoader · MapWriter</text>
  <text class="small" x="98" y="64" text-anchor="middle">RetryableMapWriter · JDBC</text>
</g>

<!-- AbstractRedissonTest (full width) -->
<g transform="translate(24,252)">
  <rect class="card" x="0" y="0" width="912" height="80" rx="12" fill="#EAF7EF" stroke="#58A978"/>
  <text class="smallLabel" x="456" y="22" text-anchor="middle">AbstractRedissonTest</text>
  <text class="mono" x="456" y="44" text-anchor="middle">redissonClient · commands (Lettuce) · scope · randomName() · faker</text>
  <text class="small" x="456" y="64" text-anchor="middle">KLoggingChannel · beforeAll() sets notify-keyspace-events=AKE</text>
</g>

<!-- RedissonClient col1 -->
<g transform="translate(24,392)">
  <rect class="card" x="0" y="0" width="420" height="62" rx="12" fill="#E8F3FF" stroke="#5B8DEF"/>
  <text class="smallLabel" x="210" y="20" text-anchor="middle">RedissonClient</text>
  <text class="mono" x="210" y="40" text-anchor="middle">LZ4ForyComposite · VirtualThreadExecutor</text>
  <text class="small" x="210" y="56" text-anchor="middle">pool=128 · threads=256 · nettyThreads=128 · tcpNoDelay</text>
</g>

<!-- Redis Testcontainers col2 -->
<g transform="translate(516,392)">
  <rect class="card" x="0" y="0" width="420" height="62" rx="12" fill="#E9F7F6" stroke="#45A7A1"/>
  <text class="smallLabel" x="210" y="20" text-anchor="middle">Redis · Testcontainers</text>
  <text class="mono" x="210" y="40" text-anchor="middle">RedisServer.Launcher.redis · singleton</text>
  <text class="small" x="210" y="56" text-anchor="middle">url: redis://localhost:{port} · Lettuce raw commands</text>
</g>
</svg>
