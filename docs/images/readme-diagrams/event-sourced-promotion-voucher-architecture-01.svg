<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1240" viewBox="0 0 1800 1240" role="img" aria-labelledby="title desc"><title id="title">Event-Sourced Promotion Voucher Architecture</title><desc id="desc">Command authority, append-only event store, bounded projection workers, rebuild generations, and public read paths.</desc><defs>
  <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#64748B" flood-opacity="0.14"/></filter>
  <style>
    .bg{fill:#F8FAFC}.frame{fill:#FFFFFF;stroke:#CBD5E1;stroke-width:2}.layer{stroke-width:2}.blueLayer{fill:#EFF6FF;stroke:#A8C7EA}.greenLayer{fill:#F1F8F1;stroke:#B8D7AE}.amberLayer{fill:#FFF8EA;stroke:#DFC69A}.purpleLayer{fill:#F8F3FF;stroke:#D7C3EF}
    .title{font-family:"Architects Daughter";font-size:42px;fill:#263238}.subtitle,.body,.small,.footer,.msg,.legend{font-family:"Comic Mono";fill:#3E4C59}.subtitle{font-size:18px}.body{font-size:16px}.small{font-size:13px;fill:#5B6975}.footer{font-size:14px;fill:#60727D}.layerTitle{font-family:"Architects Daughter";font-size:27px;fill:#344154}.cardTitle,.participant,.state{font-family:"Architects Daughter";font-size:23px;fill:#16202A}
    .card{fill:#FFFFFF;stroke:#9FB0BC;stroke-width:2}.blueCard{fill:#EFF6FF;stroke:#4F86C6}.greenCard{fill:#F1F8F1;stroke:#6E8F4F}.amberCard{fill:#FFF8EA;stroke:#9B7D54}.redCard{fill:#FFF0F0;stroke:#B86868}.purpleCard{fill:#F8F3FF;stroke:#8065A8}
    .connector{fill:none;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round}.blueEdge{stroke:#4F86C6;marker-end:url(#arrow-blue)}.greenEdge{stroke:#6E8F4F;marker-end:url(#arrow-green)}.amberEdge{stroke:#9B7D54;marker-end:url(#arrow-amber)}.redEdge{stroke:#B86868;marker-end:url(#arrow-red)}.purpleEdge{stroke:#8065A8;marker-end:url(#arrow-purple)}.tealEdge{stroke:#2D948C;marker-end:url(#arrow-teal)}.dashed{stroke-dasharray:9 7}
    .lifeline{stroke:#9AAAB1;stroke-width:2;stroke-dasharray:7 8}.activation{fill:#EAF6EF;stroke:#6F9278;stroke-width:1.5}.label{fill:#FFFFFF;stroke:#D7E0E4;stroke-width:1.5}.badge{font-family:"Comic Mono";font-size:13px;font-weight:700}
  </style>
  <marker id="arrow-blue" viewBox="0 0 10 10" markerWidth="14" markerHeight="14" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse" data-role="primary" data-tip-direction="positive-x"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#4F86C6" stroke="#4F86C6" stroke-dasharray="none"/></marker><marker id="arrow-green" viewBox="0 0 10 10" markerWidth="14" markerHeight="14" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse" data-role="primary" data-tip-direction="positive-x"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#6E8F4F" stroke="#6E8F4F" stroke-dasharray="none"/></marker><marker id="arrow-amber" viewBox="0 0 10 10" markerWidth="14" markerHeight="14" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse" data-role="primary" data-tip-direction="positive-x"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#9B7D54" stroke="#9B7D54" stroke-dasharray="none"/></marker><marker id="arrow-red" viewBox="0 0 10 10" markerWidth="14" markerHeight="14" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse" data-role="primary" data-tip-direction="positive-x"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#B86868" stroke="#B86868" stroke-dasharray="none"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" markerWidth="14" markerHeight="14" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse" data-role="primary" data-tip-direction="positive-x"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#8065A8" stroke="#8065A8" stroke-dasharray="none"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" markerWidth="14" markerHeight="14" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse" data-role="primary" data-tip-direction="positive-x"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#2D948C" stroke="#2D948C" stroke-dasharray="none"/></marker>
  </defs><rect class="bg" width="1800" height="1240"/><text class="title" x="900" y="62" text-anchor="middle">Event-Sourced Voucher Campaign - Responsibility Map</text><text class="subtitle" x="900" y="98" text-anchor="middle">PostgreSQL is the event authority; projections are replaceable, fenced, and observable.</text>
  <rect class="layer blueLayer" x="70" y="135" width="1660" height="190" rx="22"/><text class="layerTitle" x="105" y="178">HTTP and application boundaries</text>
  <g class="node" data-node="commands" filter="url(#shadow)"><rect class="card blueCard" x="120" y="215" width="350" height="82" rx="16"/><text class="cardTitle" x="295" y="250" text-anchor="middle">Command APIs</text><text class="body" x="295" y="277" text-anchor="middle">expected version + receipt</text></g>
  <g class="node" data-node="queries" filter="url(#shadow)"><rect class="card blueCard" x="725" y="215" width="350" height="82" rx="16"/><text class="cardTitle" x="900" y="250" text-anchor="middle">Query and SSE</text><text class="body" x="900" y="277" text-anchor="middle">position headers + cursor</text></g>
  <g class="node" data-node="operators" filter="url(#shadow)"><rect class="card amberCard" x="1330" y="215" width="350" height="82" rx="16"/><text class="cardTitle" x="1505" y="250" text-anchor="middle">Operator APIs</text><text class="body" x="1505" y="277" text-anchor="middle">retry • rebuild • reconcile</text></g>
  <rect class="layer greenLayer" x="70" y="370" width="1660" height="390" rx="22"/><text class="layerTitle" x="105" y="413">Transactional workers and semantic persistence boundaries</text>
  <g class="node" data-node="command-service" filter="url(#shadow)"><rect class="card greenCard" x="170" y="500" width="350" height="115" rx="16"/><text class="cardTitle" x="345" y="535" text-anchor="middle">Command Service</text><text class="body" x="345" y="562" text-anchor="middle">aggregate replay</text><text class="body" x="345" y="585" text-anchor="middle">atomic terminal receipt</text></g>
  <g class="node" data-node="projection-worker" filter="url(#shadow)"><rect class="card greenCard" x="725" y="500" width="350" height="115" rx="16"/><text class="cardTitle" x="900" y="535" text-anchor="middle">Projection Worker</text><text class="body" x="900" y="562" text-anchor="middle">lease + dedup</text><text class="body" x="900" y="585" text-anchor="middle">read model + checkpoint</text></g>
  <g class="node" data-node="rebuild-worker" filter="url(#shadow)"><rect class="card purpleCard" x="1280" y="500" width="350" height="115" rx="16"/><text class="cardTitle" x="1455" y="535" text-anchor="middle">Rebuild Worker</text><text class="body" x="1455" y="562" text-anchor="middle">candidate generation</text><text class="body" x="1455" y="585" text-anchor="middle">digest validation</text></g>
  <g class="node" data-node="permit-gate" filter="url(#shadow)"><rect class="card amberCard" x="170" y="675" width="1460" height="68" rx="16"/><text class="cardTitle" x="900" y="710" text-anchor="middle">Hikari Permit Gate</text><text class="body" x="900" y="737" text-anchor="middle">foreground • projection • rebuild • independent readiness</text></g>
  <rect class="layer purpleLayer" x="70" y="815" width="1660" height="270" rx="22"/><text class="layerTitle" x="105" y="858">Single durable authority</text>
  <g class="node" data-node="postgres" filter="url(#shadow)"><rect class="card purpleCard" x="170" y="925" width="1460" height="110" rx="16"/><text class="cardTitle" x="900" y="960" text-anchor="middle">PostgreSQL + HikariCP + JetBrains Exposed</text><text class="body" x="900" y="987" text-anchor="middle">event log • stream heads • receipts • snapshots • leases • checkpoints • poison records • generation pointer • audit</text></g>
  <path data-connector="commands-service" class="connector blueEdge" d="M295 297 L295 500"/>
  <path data-connector="queries-projection" class="connector blueEdge" d="M900 297 L900 500"/>
  <path data-connector="operators-rebuild" class="connector amberEdge" d="M1505 297 L1505 500"/>
  <path data-connector="command-permit" class="connector greenEdge" d="M345 615 L345 675"/>
  <path data-connector="projection-permit" class="connector greenEdge" d="M900 615 L900 675"/>
  <path data-connector="rebuild-permit" class="connector purpleEdge" d="M1455 615 L1455 675"/>
  <path data-connector="permit-db" class="connector amberEdge" d="M900 743 L900 925"/>
  <rect class="frame" x="170" y="1125" width="1460" height="64" rx="14"/><text class="legend" x="250" y="1164">Blue: caller path</text><text class="legend" x="680" y="1164">Green: authoritative transaction</text><text class="legend" x="1180" y="1164">Amber/Purple: bounded recovery</text></svg>