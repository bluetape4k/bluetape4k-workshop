<svg xmlns="http://www.w3.org/2000/svg" width="920" height="420" viewBox="0 0 920 420" role="img" aria-label="Virtual Thread Spring WebFlux Architecture">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%">
    <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#1f2937" flood-opacity="0.10"/>
  </filter>
  <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth">
    <path d="M1,1 L8,4.5 L1,8 Z" fill="#758297"/>
  </marker>
  <style>
    .canvas{fill:#f7f9fc}.frame{fill:#fff;stroke:#d8e0ea;stroke-width:1.5}
    .title{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:38px;font-weight:400;fill:#102033}
    .subtitle{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:14px;font-weight:400;fill:#536273}
    .smallLabel{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:21px;font-weight:400;fill:#102033}
    .mono{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#102033}
    .small{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#536273}
    .card{stroke-width:2.1;filter:url(#shadow)}
    .line{stroke:#758297;stroke-width:2.1;fill:none;marker-end:url(#arrow)}
  </style>
</defs>
<rect class="canvas" width="920" height="420"/>
<rect class="frame" x="24" y="20" width="872" height="376" rx="20"/>
<text class="title" x="48" y="66">Spring WebFlux + Virtual Threads</text>
<text class="subtitle" x="48" y="90">Netty · NettyConfig · AbstractDispatcherController · IO/Custom/VirtualThread/Default dispatchers</text>

<!-- Col 1: Netty Config -->
<rect class="card" x="48" y="108" width="220" height="36" rx="8" fill="#E8F3FF" stroke="#5B8DEF"/>
<text class="smallLabel" x="158" y="132" text-anchor="middle">Netty</text>

<rect class="card" x="48" y="156" width="220" height="72" rx="12" fill="#ffffff" stroke="#5B8DEF" stroke-width="1.8" filter="url(#shadow)"/>
<text class="mono" x="158" y="179" text-anchor="middle" fill="#102033">NettyConfig</text>
<text class="small" x="158" y="196" text-anchor="middle">NettyReactiveWeb</text>
<text class="small" x="158" y="211" text-anchor="middle">ServerFactory</text>

<rect class="card" x="48" y="240" width="220" height="72" rx="12" fill="#ffffff" stroke="#5B8DEF" stroke-width="1.8" filter="url(#shadow)"/>
<text class="mono" x="158" y="263" text-anchor="middle" fill="#102033">LoopResources</text>
<text class="small" x="158" y="280" text-anchor="middle">event-loop threads</text>
<text class="small" x="158" y="295" text-anchor="middle">4 to processors*8</text>

<!-- Arrow -->
<path class="line" d="M270 228 L330 228"/>

<!-- Col 2: AbstractDispatcherController -->
<rect class="card" x="332" y="108" width="240" height="36" rx="8" fill="#EAF7EF" stroke="#58A978"/>
<text class="smallLabel" x="452" y="132" text-anchor="middle">Controller Base</text>

<rect class="card" x="332" y="156" width="240" height="156" rx="12" fill="#ffffff" stroke="#58A978" stroke-width="1.8" filter="url(#shadow)"/>
<text class="mono" x="452" y="180" text-anchor="middle" fill="#102033">AbstractDispatcher</text>
<text class="mono" x="452" y="196" text-anchor="middle" fill="#102033">Controller</text>
<line x1="332" y1="208" x2="572" y2="208" stroke="#58A978" stroke-width="1"/>
<text class="small" x="352" y="227" fill="#536273">GET /suspend</text>
<text class="small" x="352" y="243" fill="#536273">  suspend fun → Banner</text>
<text class="small" x="352" y="259" fill="#536273">GET /deferred</text>
<text class="small" x="352" y="275" fill="#536273">  async { Banner }</text>
<text class="small" x="352" y="291" fill="#536273">GET /sequential-flow</text>
<text class="small" x="352" y="307" fill="#536273">GET /concurrent-flow</text>

<!-- Arrow -->
<path class="line" d="M574 228 L634 228"/>

<!-- Col 3: Dispatcher variants -->
<rect class="card" x="636" y="108" width="236" height="36" rx="8" fill="#FFF3D9" stroke="#D6A441"/>
<text class="smallLabel" x="754" y="132" text-anchor="middle">Dispatchers</text>

<rect class="card" x="636" y="156" width="236" height="40" rx="10" fill="#ffffff" stroke="#58A978" stroke-width="1.8" filter="url(#shadow)"/>
<text class="mono" x="754" y="181" text-anchor="middle" fill="#102033">IODispatcherController</text>

<rect class="card" x="636" y="206" width="236" height="40" rx="10" fill="#ffffff" stroke="#D6A441" stroke-width="1.8" filter="url(#shadow)"/>
<text class="mono" x="754" y="231" text-anchor="middle" fill="#102033">CustomDispatcherController</text>

<rect class="card" x="636" y="256" width="236" height="40" rx="10" fill="#ffffff" stroke="#DC6B82" stroke-width="1.8" filter="url(#shadow)"/>
<text class="mono" x="754" y="281" text-anchor="middle" fill="#102033">VirtualThreadDispatcher</text>

<rect class="card" x="636" y="306" width="236" height="40" rx="10" fill="#ffffff" stroke="#45A7A1" stroke-width="1.8" filter="url(#shadow)"/>
<text class="mono" x="754" y="331" text-anchor="middle" fill="#102033">DefaultDispatcherController</text>

<!-- Bottom note -->
<rect class="card" x="48" y="360" width="824" height="32" rx="8" fill="#f1f5f9" stroke="#d8e0ea" filter="url(#shadow)"/>
<text class="small" x="460" y="381" text-anchor="middle" fill="#536273">abstract val dispatcher: CoroutineDispatcher — 4 concrete impls swap the execution context</text>
</svg>
