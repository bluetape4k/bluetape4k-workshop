<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" role="img" aria-label="Image Processing Workflow Scenario">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#1f2937" flood-opacity="0.10"/></filter>
  <marker id="arrow" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse">
    <path d="M2,2 L12,7 L2,12 Z" fill="#758297"/>
  </marker>
  <style>
    .canvas{fill:#f7f9fc}.frame{fill:#fff;stroke:#d8e0ea;stroke-width:1.5}
    .title{font-family:"Architects Daughter";font-size:32px;fill:#102033}
    .subtitle{font-family:"Comic Mono";font-size:14px;fill:#536273}
    .label{font-family:"Architects Daughter";font-size:18px;fill:#102033}
    .mono{font-family:"Comic Mono";font-size:12px;fill:#536273}
    .step{font-family:"Architects Daughter";font-size:14px;fill:#fff}
    .card{stroke-width:2;filter:url(#shadow)}
    .line{stroke:#758297;stroke-width:2;fill:none;marker-end:url(#arrow)}
  </style>
</defs>
<rect class="canvas" width="1200" height="480"/>
<rect class="frame" x="28" y="24" width="1144" height="432" rx="20"/>

<text class="title" x="52" y="68">Image Upload Workflow</text>
<text class="subtitle" x="52" y="90">Upload → Validate → Process (libvips WebP) → Store → Return Public URLs</text>

<!-- Step badges + cards in a horizontal pipeline -->
<!-- Step 1: Upload -->
<g transform="translate(52,120)">
  <circle cx="24" cy="24" r="20" fill="#5B8DEF"/>
  <text class="step" x="24" y="30" text-anchor="middle">1</text>
  <rect class="card" x="0" y="56" width="180" height="72" rx="12" fill="#E8F3FF" stroke="#5B8DEF"/>
  <text class="label" x="90" y="84" text-anchor="middle">Upload</text>
  <text class="mono" x="90" y="106" text-anchor="middle">POST multipart file</text>
</g>

<!-- Step 2: Validate -->
<g transform="translate(272,120)">
  <circle cx="24" cy="24" r="20" fill="#58A978"/>
  <text class="step" x="24" y="30" text-anchor="middle">2</text>
  <rect class="card" x="0" y="56" width="180" height="72" rx="12" fill="#EAF7EF" stroke="#58A978"/>
  <text class="label" x="90" y="84" text-anchor="middle">Validate</text>
  <text class="mono" x="90" y="106" text-anchor="middle">content-type + magic bytes</text>
</g>

<!-- Step 3: Process -->
<g transform="translate(492,120)">
  <circle cx="24" cy="24" r="20" fill="#D6A441"/>
  <text class="step" x="24" y="30" text-anchor="middle">3</text>
  <rect class="card" x="0" y="56" width="180" height="72" rx="12" fill="#FFF3D9" stroke="#D6A441"/>
  <text class="label" x="90" y="84" text-anchor="middle">Process</text>
  <text class="mono" x="90" y="106" text-anchor="middle">libvips WebP derivatives</text>
</g>

<!-- Step 4: Store -->
<g transform="translate(712,120)">
  <circle cx="24" cy="24" r="20" fill="#8A72D6"/>
  <text class="step" x="24" y="30" text-anchor="middle">4</text>
  <rect class="card" x="0" y="56" width="180" height="72" rx="12" fill="#F1ECFF" stroke="#8A72D6"/>
  <text class="label" x="90" y="84" text-anchor="middle">Store</text>
  <text class="mono" x="90" y="106" text-anchor="middle">original + variants → S3</text>
</g>

<!-- Step 5: URL -->
<g transform="translate(932,120)">
  <circle cx="24" cy="24" r="20" fill="#DC6B82"/>
  <text class="step" x="24" y="30" text-anchor="middle">5</text>
  <rect class="card" x="0" y="56" width="180" height="72" rx="12" fill="#FDECEF" stroke="#DC6B82"/>
  <text class="label" x="90" y="84" text-anchor="middle">Return URLs</text>
  <text class="mono" x="90" y="106" text-anchor="middle">unsigned public URLs</text>
</g>

<!-- Arrows between steps -->
<path class="line" d="M232,196 L270,196"/>
<path class="line" d="M452,196 L490,196"/>
<path class="line" d="M672,196 L710,196"/>
<path class="line" d="M892,196 L930,196"/>

<!-- Detail cards below pipeline -->
<g transform="translate(52,280)">
  <rect class="card" x="0" y="0" width="250" height="80" rx="10" fill="#E9F7F6" stroke="#45A7A1"/>
  <text class="label" x="125" y="24" text-anchor="middle">Variant Generation</text>
  <text class="mono" x="125" y="44" text-anchor="middle">thumb (150px) · card (400px)</text>
  <text class="mono" x="125" y="62" text-anchor="middle">detail (1200px) · parallel workers</text>
</g>
<g transform="translate(340,280)">
  <rect class="card" x="0" y="0" width="250" height="80" rx="10" fill="#FFF8E1" stroke="#EAB308"/>
  <text class="label" x="125" y="24" text-anchor="middle">Storage Backends</text>
  <text class="mono" x="125" y="44" text-anchor="middle">prod → S3 public bucket</text>
  <text class="mono" x="125" y="62" text-anchor="middle">dev/test → LocalImageStorage</text>
</g>
<g transform="translate(628,280)">
  <rect class="card" x="0" y="0" width="250" height="80" rx="10" fill="#E8F3FF" stroke="#5B8DEF"/>
  <text class="label" x="125" y="24" text-anchor="middle">Safety Guards</text>
  <text class="mono" x="125" y="44" text-anchor="middle">maxPixels limit · content-type</text>
  <text class="mono" x="125" y="62" text-anchor="middle">magic-byte check · size limit</text>
</g>
<g transform="translate(916,280)">
  <rect class="card" x="0" y="0" width="230" height="80" rx="10" fill="#FDECEF" stroke="#DC6B82"/>
  <text class="label" x="115" y="24" text-anchor="middle">Observability</text>
  <text class="mono" x="115" y="44" text-anchor="middle">Micrometer counters</text>
  <text class="mono" x="115" y="62" text-anchor="middle">upload · duration · failure</text>
</g>

<!-- Connecting lines from pipeline to detail cards -->
<path class="line" d="M582,248 L177,278"/>
<path class="line" d="M582,248 L465,278"/>
<path class="line" d="M582,248 L753,278"/>
<path class="line" d="M582,248 L1031,278"/>
</svg>
