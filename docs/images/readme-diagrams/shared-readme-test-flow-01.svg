<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1540" height="620" viewBox="0 0 1540 620" role="img" aria-label="Workshop shared WebTestClient flow">
  <defs><filter id="shadow" x="-8%" y="-8%" width="116%" height="124%"><feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#64748B" flood-opacity="0.16"/></filter><marker id="arrow" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 14 7 L 0 14 Z" fill="#2563EB"/></marker><style>.canvas{fill:#F8FAFC}.frame{fill:#FFFFFF;stroke:#D6E0E8;stroke-width:1.4}.title{font-family:"Architects Daughter";font-size:38px;fill:#102033}.subtitle{font-family:"Comic Mono";font-size:15px;fill:#51606F}.cardTitle{font-family:"Architects Daughter";font-size:28px;fill:#102033}.cardText{font-family:"Comic Mono";font-size:15px;fill:#415166}.line{fill:none;stroke:#2563EB;stroke-width:3.6;stroke-linecap:round;stroke-linejoin:round}</style></defs>
  <rect class="canvas" width="1540" height="620"/><rect class="frame" x="24" y="24" width="1492" height="572" rx="24"/>
  <text class="title" x="770" y="72" text-anchor="middle">WebTestClient helper flow</text>
  <text class="subtitle" x="770" y="104" text-anchor="middle">Shared test extensions collapse request creation, exchange, and expected HTTP status into a single call.</text>
  <g filter="url(#shadow)"><rect x="108" y="260" width="230" height="98" rx="16" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.7"/><text class="cardTitle" x="223" y="300" text-anchor="middle">Test code</text><text class="cardText" x="223" y="330" text-anchor="middle">httpPost(uri, body, CREATED)</text></g>
  <g filter="url(#shadow)"><rect x="470" y="250" width="250" height="118" rx="16" fill="#FFF7ED" stroke="#EA580C" stroke-width="1.7"/><text class="cardTitle" x="595" y="292" text-anchor="middle">Extension</text><text class="cardText" x="595" y="324" text-anchor="middle">uri + headers + body</text><text class="cardText" x="595" y="350" text-anchor="middle">exchange()</text></g>
  <g filter="url(#shadow)"><rect x="852" y="250" width="250" height="118" rx="16" fill="#F0FDF4" stroke="#16A34A" stroke-width="1.7"/><text class="cardTitle" x="977" y="292" text-anchor="middle">Status assertion</text><text class="cardText" x="977" y="324" text-anchor="middle">expectStatus()</text><text class="cardText" x="977" y="350" text-anchor="middle">isEqualTo(httpStatus)</text></g>
  <g filter="url(#shadow)"><rect x="1234" y="260" width="220" height="98" rx="16" fill="#ECFEFF" stroke="#0891B2" stroke-width="1.7"/><text class="cardTitle" x="1344" y="300" text-anchor="middle">ResponseSpec</text><text class="cardText" x="1344" y="330" text-anchor="middle">continue body assertions</text></g>
  <path class="line" d="M 338 309 L 470 309" marker-end="url(#arrow)"/><path class="line" d="M 720 309 L 852 309" marker-end="url(#arrow)"/><path class="line" d="M 1102 309 L 1234 309" marker-end="url(#arrow)"/>
</svg>
