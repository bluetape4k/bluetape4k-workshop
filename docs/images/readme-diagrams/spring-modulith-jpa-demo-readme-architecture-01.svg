<svg xmlns="http://www.w3.org/2000/svg" width="1780" height="980" viewBox="0 0 1780 980">
  <defs>
    <style>
      .bg{fill:#f8fafc}.title{font-family:'Architects Daughter','Comic Sans MS',cursive;font-size:34px;fill:#18212f}
      .layer-title{font-family:'Architects Daughter','Comic Sans MS',cursive;font-size:26px;fill:#344154}
      .card-title{font-family:'Architects Daughter','Comic Sans MS',cursive;font-size:27px;fill:#101827}
      .body{font-family:'Comic Mono','Comic Sans MS',monospace;font-size:18px;fill:#364152}.small{font-family:'Comic Mono','Comic Sans MS',monospace;font-size:15px;fill:#475569}
      .layer{stroke-width:1.5;rx:22;ry:22}.card{fill:#fff;stroke:#cbd5e1;stroke-width:1.5;rx:18;ry:18}
      .line{fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}.db{fill:#fff;stroke:#94a3b8;stroke-width:2}.dbtop{fill:#e0f2fe;stroke:#0284c7;stroke-width:2}
    </style>
    <marker id="arrow-blue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L11,6 L1,11 Z" fill="#2563eb" stroke-dasharray="none"/></marker>
    <marker id="arrow-green" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L11,6 L1,11 Z" fill="#059669" stroke-dasharray="none"/></marker>
    <marker id="arrow-purple" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L11,6 L1,11 Z" fill="#7c3aed" stroke-dasharray="none"/></marker>
  </defs>
  <rect class="bg" width="1780" height="980"/>
  <text class="title" x="70" y="70">Spring Modulith JPA Demo</text>

  <rect class="layer" x="70" y="120" width="1640" height="180" fill="#eff6ff" stroke="#bfdbfe"/>
  <text class="layer-title" x="105" y="165">HTTP gateway</text>
  <rect class="card" x="565" y="200" width="650" height="70"/>
  <text class="card-title" x="595" y="243">GatewayManagement</text>
  <text class="body" x="885" y="243">REST API under /api</text>

  <rect class="layer" x="70" y="355" width="1640" height="230" fill="#f0fdf4" stroke="#bbf7d0"/>
  <text class="layer-title" x="105" y="400">Application modules</text>
  <rect class="card" x="130" y="445" width="430" height="90"/>
  <text class="card-title" x="160" y="485">Organization</text>
  <text class="body" x="160" y="515">External API + events</text>
  <rect class="card" x="675" y="445" width="430" height="90"/>
  <text class="card-title" x="705" y="485">Department</text>
  <text class="body" x="705" y="515">External/Internal APIs</text>
  <rect class="card" x="1220" y="445" width="430" height="90"/>
  <text class="card-title" x="1250" y="485">Employee</text>
  <text class="body" x="1250" y="515">External/Internal APIs</text>

  <rect class="layer" x="70" y="650" width="1640" height="190" fill="#fefce8" stroke="#fde68a"/>
  <text class="layer-title" x="105" y="695">Persistence</text>
  <rect class="card" x="210" y="735" width="360" height="55"/>
  <text class="body" x="240" y="770">OrganizationRepository</text>
  <rect class="card" x="710" y="735" width="360" height="55"/>
  <text class="body" x="740" y="770">DepartmentRepository</text>
  <rect class="card" x="1210" y="735" width="360" height="55"/>
  <text class="body" x="1240" y="770">EmployeeRepository</text>
  <g transform="translate(745 865)">
    <path class="db" d="M0,24 C0,4 290,4 290,24 L290,74 C290,94 0,94 0,74 Z"/>
    <ellipse class="dbtop" cx="145" cy="24" rx="145" ry="22"/>
    <path class="db" d="M0,24 C0,44 290,44 290,24"/>
    <text class="card-title" x="105" y="64">H2 JPA</text>
  </g>

