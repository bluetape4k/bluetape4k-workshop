    <marker id="arrow-blue" markerWidth="14" markerHeight="14" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 12 12" data-role="primary" data-tip-direction="positive-x"><path d="M1,1 L11,6 L1,11 Z" fill="#2563eb" stroke-dasharray="none" stroke="#2563eb" stroke-width="0"/></marker>
    <marker id="arrow-green" markerWidth="14" markerHeight="14" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 12 12" data-role="primary" data-tip-direction="positive-x"><path d="M1,1 L11,6 L1,11 Z" fill="#059669" stroke-dasharray="none" stroke="#059669" stroke-width="0"/></marker>
    <marker id="arrow-purple" markerWidth="14" markerHeight="14" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 12 12" data-role="primary" data-tip-direction="positive-x"><path d="M1,1 L11,6 L1,11 Z" fill="#7c3aed" stroke-dasharray="none" stroke="#7c3aed" stroke-width="0"/></marker>
