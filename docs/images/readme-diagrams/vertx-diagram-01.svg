<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" role="img" aria-label="Vert.x Workshop Architecture">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%">
    <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#1f2937" flood-opacity="0.10"/>
  </filter>
  <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth">
    <path d="M1,1 L8,4.5 L1,8 Z" fill="#758297"/>
  </marker>
  <style>
    .canvas{fill:#f7f9fc}.frame{fill:#fff;stroke:#d8e0ea;stroke-width:1.5}
    .title{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:38px;font-weight:400;fill:#102033}
    .subtitle{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:14px;font-weight:400;fill:#536273}
    .smallLabel{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:21px;font-weight:400;fill:#102033}
    .mono{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#102033}
    .small{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#536273}
    .card{stroke-width:2.1;filter:url(#shadow)}
    .line{stroke:#758297;stroke-width:2.1;fill:none;marker-end:url(#arrow)}
  </style>
</defs>
<rect class="canvas" width="960" height="440"/>
<rect class="frame" x="24" y="20" width="912" height="396" rx="20"/>
<text class="title" x="48" y="66">Vert.x Workshop Architecture</text>
<text class="subtitle" x="48" y="90">CoroutineVerticle · WebClient · SQLClient · Testcontainers</text>

<!-- Column 1: Coroutines -->
<rect class="card" x="48" y="108" width="264" height="36" rx="8" fill="#E8F3FF" stroke="#5B8DEF"/>
<text class="smallLabel" x="180" y="132" text-anchor="middle">Coroutines</text>

<rect class="card" x="48" y="156" width="264" height="52" rx="10" fill="#ffffff" stroke="#5B8DEF" stroke-width="1.8" filter="url(#shadow)"/>
<text class="mono" x="180" y="177" text-anchor="middle" fill="#102033">CoroutineVerticle</text>
<text class="small" x="180" y="195" text-anchor="middle">extends AbstractVerticle</text>

<rect class="card" x="48" y="220" width="264" height="52" rx="10" fill="#ffffff" stroke="#5B8DEF" stroke-width="1.8" filter="url(#shadow)"/>
<text class="mono" x="180" y="241" text-anchor="middle" fill="#102033">suspendHandler { }</text>
<text class="small" x="180" y="259" text-anchor="middle">coroutine-aware HTTP routes</text>

<rect class="card" x="48" y="284" width="264" height="52" rx="10" fill="#ffffff" stroke="#5B8DEF" stroke-width="1.8" filter="url(#shadow)"/>
<text class="mono" x="180" y="305" text-anchor="middle" fill="#102033">coAwait()</text>
<text class="small" x="180" y="323" text-anchor="middle">suspend + Future bridge</text>

<!-- Column 2: WebClient -->
<rect class="card" x="348" y="108" width="264" height="36" rx="8" fill="#EAF7EF" stroke="#58A978"/>
<text class="smallLabel" x="480" y="132" text-anchor="middle">WebClient</text>

<rect class="card" x="348" y="156" width="264" height="52" rx="10" fill="#ffffff" stroke="#58A978" stroke-width="1.8" filter="url(#shadow)"/>
<text class="mono" x="480" y="177" text-anchor="middle" fill="#102033">WebClient.create(vertx)</text>
<text class="small" x="480" y="195" text-anchor="middle">non-blocking HTTP client</text>

<rect class="card" x="348" y="220" width="264" height="52" rx="10" fill="#ffffff" stroke="#58A978" stroke-width="1.8" filter="url(#shadow)"/>
<text class="mono" x="480" y="241" text-anchor="middle" fill="#102033">get(port, host, path)</text>
<text class="small" x="480" y="259" text-anchor="middle">.send().coAwait()</text>

<rect class="card" x="348" y="284" width="264" height="52" rx="10" fill="#ffffff" stroke="#58A978" stroke-width="1.8" filter="url(#shadow)"/>
<text class="mono" x="480" y="305" text-anchor="middle" fill="#102033">CoroutineServer (port 9988)</text>
<text class="small" x="480" y="323" text-anchor="middle">test server verticle</text>

<!-- Column 3: SQLClient -->
<rect class="card" x="648" y="108" width="264" height="36" rx="8" fill="#FFF3D9" stroke="#D6A441"/>
<text class="smallLabel" x="780" y="132" text-anchor="middle">SQLClient</text>

<rect class="card" x="648" y="156" width="264" height="52" rx="10" fill="#ffffff" stroke="#D6A441" stroke-width="1.8" filter="url(#shadow)"/>
<text class="mono" x="780" y="177" text-anchor="middle" fill="#102033">MySQLBuilder.pool()</text>
<text class="small" x="780" y="195" text-anchor="middle">.connectingTo(connectOptions)</text>

<rect class="card" x="648" y="220" width="264" height="52" rx="10" fill="#ffffff" stroke="#D6A441" stroke-width="1.8" filter="url(#shadow)"/>
<text class="mono" x="780" y="241" text-anchor="middle" fill="#102033">JDBCPool.pool(vertx,…)</text>
<text class="small" x="780" y="259" text-anchor="middle">H2 in-process pool</text>

<rect class="card" x="648" y="284" width="264" height="52" rx="10" fill="#ffffff" stroke="#D6A441" stroke-width="1.8" filter="url(#shadow)"/>
<text class="mono" x="780" y="305" text-anchor="middle" fill="#102033">preparedQuery.execute</text>
<text class="small" x="780" y="323" text-anchor="middle">.coAwait() → RowSet</text>

<!-- Bottom band -->
<rect class="card" x="48" y="350" width="864" height="44" rx="10" fill="#0d2435" stroke="#0d2435" filter="url(#shadow)"/>
<text class="smallLabel" x="480" y="378" text-anchor="middle" fill="#ffffff">Testcontainers — MySQL8Server.Launcher.mysql singleton</text>
</svg>
