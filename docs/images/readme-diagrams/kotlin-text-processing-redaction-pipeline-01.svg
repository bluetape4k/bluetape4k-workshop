<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="1180" viewBox="0 0 1320 1180" role="img" aria-label="Kotlin text processing redaction pipeline diagram">
  <defs>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="124%"><feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#64748B" flood-opacity="0.16"/></filter>
    <marker id="arrowBlue" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 14 14" data-role="primary" data-tip-direction="positive-x"><path d="M 0 0 L 14 7 L 0 14 Z" fill="#4F86C6" stroke="#4F86C6" stroke-dasharray="none" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <style>
      .canvas{fill:#F8FAFC}.frame{fill:#FFFFFF;stroke:#D6E0E8;stroke-width:1.6}.lane{fill:#FFF6E8;stroke:#E8C27D;stroke-width:2}.title{font-family:"Architects Daughter";font-size:42px;fill:#172033}.subtitle{font-family:"Comic Mono";font-size:17px;fill:#536473}.laneTitle{font-family:"Architects Daughter";font-size:27px;fill:#2D4050}.cardTitle{font-family:"Architects Daughter";font-size:28px;fill:#132033}.cardText{font-family:"Comic Mono";font-size:15px;fill:#4F6070}.noteTitle{font-family:"Architects Daughter";font-size:24px;fill:#132033}.noteText{font-family:"Comic Mono";font-size:14px;fill:#4F6070}.line{fill:none;stroke:#4F86C6;stroke-width:4;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrowBlue)}
    </style>
  </defs>
  <rect class="canvas" width="1320" height="1180"/>
  <rect class="frame" x="32" y="28" width="1256" height="1124" rx="30"/>
  <text class="title" x="660" y="78" text-anchor="middle">Sensitive Text Redaction Pipeline</text>
  <text class="subtitle" x="660" y="112" text-anchor="middle">The example keeps original offsets stable while masking PII-like values and returning audit-safe metadata.</text>

  <rect class="lane" x="92" y="150" width="1136" height="852" rx="24"/>
  <text class="laneTitle" x="126" y="194">Redaction request path</text>

  <g filter="url(#shadow)">
    <rect class="card" x="380" y="220" width="560" height="78" rx="18" fill="#FFFFFF" stroke="#D8A43B" stroke-width="2.4"/>
    <text class="cardTitle" x="660" y="254" text-anchor="middle">1. Validate caller text and policy</text>
    <text class="cardText" x="660" y="280" text-anchor="middle">bounded text length, safe rule ids, no unsafe regex patterns</text>
  </g>
  <g filter="url(#shadow)">
    <rect class="card" x="380" y="345" width="560" height="78" rx="18" fill="#FFFFFF" stroke="#D8A43B" stroke-width="2.4"/>
    <text class="cardTitle" x="660" y="379" text-anchor="middle">2. Normalize and detect language</text>
    <text class="cardText" x="660" y="405" text-anchor="middle">TextNormalizer plus one guarded Lingua confidence pass</text>
  </g>
  <g filter="url(#shadow)">
    <rect class="card" x="380" y="470" width="560" height="78" rx="18" fill="#FFFFFF" stroke="#D8A43B" stroke-width="2.4"/>
    <text class="cardTitle" x="660" y="504" text-anchor="middle">3. Find sensitive spans</text>
    <text class="cardText" x="660" y="530" text-anchor="middle">regex rules for PII shapes, Aho-Corasick for configured terms</text>
  </g>
  <g filter="url(#shadow)">
    <rect class="card" x="380" y="595" width="560" height="78" rx="18" fill="#FFFFFF" stroke="#D8A43B" stroke-width="2.4"/>
    <text class="cardTitle" x="660" y="629" text-anchor="middle">4. Merge overlaps, keep adjacency</text>
    <text class="cardText" x="660" y="655" text-anchor="middle">highest priority wins category; adjacent ranges stay separate</text>
  </g>
  <g filter="url(#shadow)">
    <rect class="card" x="380" y="720" width="560" height="78" rx="18" fill="#FFFFFF" stroke="#D8A43B" stroke-width="2.4"/>
    <text class="cardTitle" x="660" y="754" text-anchor="middle">5. Mask original code-unit ranges</text>
    <text class="cardText" x="660" y="780" text-anchor="middle">same-length output preserves original start/end offsets</text>
  </g>
  <g filter="url(#shadow)">
    <rect class="card" x="380" y="845" width="560" height="78" rx="18" fill="#FFFFFF" stroke="#D8A43B" stroke-width="2.4"/>
    <text class="cardTitle" x="660" y="879" text-anchor="middle">6. Return safe result metadata</text>
    <text class="cardText" x="660" y="905" text-anchor="middle">redacted text, merged spans, language, confidence, no raw matches</text>
  </g>

  <path class="line" data-connector="validate-to-detect" d="M 660 298 L 660 345"/>
  <path class="line" data-connector="detect-to-find" d="M 660 423 L 660 470"/>
  <path class="line" data-connector="find-to-merge" d="M 660 548 L 660 595"/>
  <path class="line" data-connector="merge-to-mask" d="M 660 673 L 660 720"/>
  <path class="line" data-connector="mask-to-result" d="M 660 798 L 660 845"/>

  <g filter="url(#shadow)">
    <rect x="190" y="1038" width="940" height="72" rx="18" fill="#EEF8F3" stroke="#A9D8C6" stroke-width="2"/>
    <text class="noteTitle" x="660" y="1068" text-anchor="middle">Policy boundary</text>
    <text class="noteText" x="660" y="1093" text-anchor="middle">This is a fixture-sized workshop detector, not a replacement for a production DLP or compliance classifier.</text>
  </g>
</svg>
