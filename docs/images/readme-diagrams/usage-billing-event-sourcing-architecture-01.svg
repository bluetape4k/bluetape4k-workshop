<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="950" viewBox="0 0 1600 950" role="img" aria-labelledby="title desc"><title id="title">Event-Sourced Usage Billing - Authority Map</title><desc id="desc">Commands append facts; replay and projections derive every current view.</desc><defs><filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#64748B" flood-opacity="0.14"/></filter><marker id="seq-blue" viewBox="0 0 10 10" markerWidth="14" markerHeight="14" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse" data-role="primary" data-tip-direction="positive-x"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#4F86C6" stroke="#4F86C6" stroke-dasharray="none"/></marker><marker id="seq-green" viewBox="0 0 10 10" markerWidth="14" markerHeight="14" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse" data-role="primary" data-tip-direction="positive-x"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#6E8F4F" stroke="#6E8F4F" stroke-dasharray="none"/></marker><marker id="seq-amber" viewBox="0 0 10 10" markerWidth="14" markerHeight="14" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse" data-role="primary" data-tip-direction="positive-x"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#9B7D54" stroke="#9B7D54" stroke-dasharray="none"/></marker><marker id="seq-red" viewBox="0 0 10 10" markerWidth="14" markerHeight="14" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse" data-role="primary" data-tip-direction="positive-x"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#B86868" stroke="#B86868" stroke-dasharray="none"/></marker><marker id="seq-purple" viewBox="0 0 10 10" markerWidth="14" markerHeight="14" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse" data-role="primary" data-tip-direction="positive-x"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#8065A8" stroke="#8065A8" stroke-dasharray="none"/></marker><marker id="seq-teal" viewBox="0 0 10 10" markerWidth="14" markerHeight="14" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse" data-role="primary" data-tip-direction="positive-x"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#2D948C" stroke="#2D948C" stroke-dasharray="none"/></marker><style>
  .bg{fill:#F8FAFC}.frame{fill:#FFF;stroke:#CAD6DF;stroke-width:2}.alt{fill:none;stroke:#DFC69A;stroke-width:2}.zone{stroke-width:2}.blueZone{fill:#EFF6FF;stroke:#A8C7EA}.greenZone{fill:#F0F8F0;stroke:#B8D7AE}.purpleZone{fill:#F8F3FF;stroke:#D7C3EF}.amberZone{fill:#FFF7E8;stroke:#DFC69A}.title{font-family:"Architects Daughter";font-size:40px;fill:#263238}.subtitle,.body,.small,.msg,.footer{font-family:"Comic Mono";fill:#3E4C59}.subtitle{font-size:17px}.zoneTitle{font-family:"Architects Daughter";font-size:25px;fill:#344154}.cardTitle,.participant{font-family:"Architects Daughter";font-size:22px;fill:#16202A}.body{font-size:15px}.small{font-size:13px;fill:#5B6975}.footer{font-size:14px;fill:#60727D}.card{fill:#FFF;stroke:#9FB0BC;stroke-width:2}.blueCard{fill:#EFF6FF;stroke:#4F86C6}.greenCard{fill:#F0F8F0;stroke:#6E8F4F}.amberCard{fill:#FFF7E8;stroke:#9B7D54}.redCard{fill:#FFF0F0;stroke:#B86868}.purpleCard{fill:#F8F3FF;stroke:#8065A8}.edgePath{fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.blueEdge{stroke:#4F86C6;marker-end:url(#seq-blue)}.greenEdge{stroke:#6E8F4F;marker-end:url(#seq-green)}.amberEdge{stroke:#9B7D54;marker-end:url(#seq-amber)}.redEdge{stroke:#B86868;marker-end:url(#seq-red)}.purpleEdge{stroke:#8065A8;marker-end:url(#seq-purple)}.tealEdge{stroke:#2D948C;marker-end:url(#seq-teal)}.dashed{stroke-dasharray:9 7}.lifeline{stroke:#9AAAB1;stroke-width:2;stroke-dasharray:7 8}.activation{fill:#EAF6EF;stroke:#6F9278;stroke-width:1.5}.labelPill{fill:#FFF;stroke:#D7E0E4;stroke-width:1.5}.badge{font-family:"Comic Mono";font-size:13px;font-weight:700}.frameLabel{font-family:"Architects Daughter";font-size:18px;fill:#8B6A3E}
</style></defs><rect class="bg" width="1600" height="950"/><rect class="frame" x="28" y="24" width="1544" height="902" rx="22"/><text class="title" x="800" y="66" text-anchor="middle">Event-Sourced Usage Billing - Authority Map</text><text class="subtitle" x="800" y="98" text-anchor="middle">Commands append facts; replay and projections derive every current view.</text><rect class="zone blueZone" x="70" y="130" width="1460" height="170" rx="22"/><text class="zoneTitle" x="98" y="172">HTTP and application boundary</text><g class="node" data-node="tenant-api" filter="url(#shadow)"><rect class="card blueCard" x="120" y="205" width="300" height="75" rx="15"/><text class="cardTitle" x="270" y="238" text-anchor="middle">Tenant API</text><text class="body" x="270" y="266" text-anchor="middle">command receipt + security</text></g><g class="node" data-node="commands" filter="url(#shadow)"><rect class="card greenCard" x="650" y="205" width="300" height="75" rx="15"/><text class="cardTitle" x="800" y="238" text-anchor="middle">Command services</text><text class="body" x="800" y="266" text-anchor="middle">replay before append</text></g><g class="node" data-node="operator" filter="url(#shadow)"><rect class="card amberCard" x="1180" y="205" width="300" height="75" rx="15"/><text class="cardTitle" x="1330" y="238" text-anchor="middle">Operator API</text><text class="body" x="1330" y="266" text-anchor="middle">rebuild, rollback, reconcile</text></g><rect class="zone purpleZone" x="70" y="340" width="1460" height="260" rx="22"/><text class="zoneTitle" x="98" y="382">Correctness authority</text><g class="node" data-node="event-store" filter="url(#shadow)"><rect class="card purpleCard" x="130" y="445" width="360" height="100" rx="15"/><text class="cardTitle" x="310" y="478" text-anchor="middle">Append-only event store</text><text class="body" x="310" y="506" text-anchor="middle">stream version + hash chain</text><text class="body" x="310" y="528" text-anchor="middle">global position keyset</text></g><g class="node" data-node="snapshot" filter="url(#shadow)"><rect class="card amberCard" x="620" y="445" width="360" height="100" rx="15"/><text class="cardTitle" x="800" y="478" text-anchor="middle">Optional snapshots</text><text class="body" x="800" y="506" text-anchor="middle">validated acceleration only</text><text class="body" x="800" y="528" text-anchor="middle">corrupt means replay genesis</text></g><g class="node" data-node="projection" filter="url(#shadow)"><rect class="card greenCard" x="1110" y="445" width="360" height="100" rx="15"/><text class="cardTitle" x="1290" y="478" text-anchor="middle">Projection generations</text><text class="body" x="1290" y="506" text-anchor="middle">lease + owner fencing</text><text class="body" x="1290" y="528" text-anchor="middle">marker + view + checkpoint</text></g><rect class="zone greenZone" x="70" y="640" width="1460" height="200" rx="22"/><text class="zoneTitle" x="98" y="682">Derived query and operations</text><g class="node" data-node="reconcile" filter="url(#shadow)"><rect class="card amberCard" x="180" y="720" width="340" height="90" rx="15"/><text class="cardTitle" x="350" y="753" text-anchor="middle">Reconciliation</text><text class="body" x="350" y="781" text-anchor="middle">event replay vs ACTIVE view</text></g><g class="node" data-node="read-model" filter="url(#shadow)"><rect class="card greenCard" x="630" y="720" width="340" height="90" rx="15"/><text class="cardTitle" x="800" y="753" text-anchor="middle">Billing read model</text><text class="body" x="800" y="781" text-anchor="middle">tenant + generation scoped</text></g><g class="node" data-node="health" filter="url(#shadow)"><rect class="card blueCard" x="1080" y="720" width="340" height="90" rx="15"/><text class="cardTitle" x="1250" y="753" text-anchor="middle">Health and metrics</text><text class="body" x="1250" y="781" text-anchor="middle">lag, failure, quarantine</text></g><g class="edge" data-edge="api-command" data-label="authenticated command"><path data-connector="api-command" class="edgePath blueEdge" style="marker-end:none" d="M 420 243 H 650"/><polygon data-connector-head="api-command" data-arrow-direction="right" points="650,243 636,235 636,251" fill="#4F86C6" stroke="#4F86C6" stroke-dasharray="none" style="stroke-dasharray:none"/></g><g class="edge" data-edge="command-store" data-label="append expected version"><path data-connector="command-store" class="edgePath greenEdge" style="marker-end:none" d="M 800 280 L 800 320 Q 800 330 790 330 L 310 330 Q 300 330 300 340 V 445"/><polygon data-connector-head="command-store" data-arrow-direction="down" points="300,445 292,431 308,431" fill="#6E8F4F" stroke="#6E8F4F" stroke-dasharray="none" style="stroke-dasharray:none"/></g><g class="edge" data-edge="operator-projection" data-label="bounded recovery"><path data-connector="operator-projection" class="edgePath amberEdge" style="marker-end:none" d="M 1330 280 V 445"/><polygon data-connector-head="operator-projection" data-arrow-direction="down" points="1330,445 1322,431 1338,431" fill="#9B7D54" stroke="#9B7D54" stroke-dasharray="none" style="stroke-dasharray:none"/></g><g class="edge" data-edge="store-snapshot" data-label="validated seed"><path data-connector="store-snapshot" class="edgePath amberEdge" style="marker-end:none" d="M 490 495 H 620"/><polygon data-connector-head="store-snapshot" data-arrow-direction="right" points="620,495 606,487 606,503" fill="#9B7D54" stroke="#9B7D54" stroke-dasharray="none" style="stroke-dasharray:none"/></g><g class="edge" data-edge="store-projection" data-label="global position feed"><path data-connector="store-projection" class="edgePath purpleEdge" style="marker-end:none" d="M 490 525 L 520 525 Q 535 525 535 540 L 535 565 Q 535 580 550 580 L 1070 580 Q 1080 580 1080 570 L 1080 520 Q 1080 505 1090 505 H 1110"/><polygon data-connector-head="store-projection" data-arrow-direction="right" points="1110,505 1100.5,499.571 1100.5,510.429" fill="#8065A8" stroke="#8065A8" stroke-dasharray="none" style="stroke-dasharray:none"/></g><g class="edge" data-edge="projection-read" data-label="active alias"><path data-connector="projection-read" class="edgePath greenEdge" style="marker-end:none" d="M 1200 545 L 1200 650 Q 1200 665 1185 665 L 815 665 Q 800 665 800 680 V 720"/><polygon data-connector-head="projection-read" data-arrow-direction="down" points="800,720 792,706 808,706" fill="#6E8F4F" stroke="#6E8F4F" stroke-dasharray="none" style="stroke-dasharray:none"/></g><g class="edge" data-edge="projection-health" data-label="lag and failure"><path data-connector="projection-health" class="edgePath blueEdge" style="marker-end:none" d="M 1350 545 V 720"/><polygon data-connector-head="projection-health" data-arrow-direction="down" points="1350,720 1342,706 1358,706" fill="#4F86C6" stroke="#4F86C6" stroke-dasharray="none" style="stroke-dasharray:none"/></g><g class="edge" data-edge="store-reconcile" data-label="authoritative replay"><path data-connector="store-reconcile" class="edgePath amberEdge dashed" style="marker-end:none" d="M 300 545 V 720"/><polygon data-connector-head="store-reconcile" data-arrow-direction="down" points="300,720 292,706 308,706" fill="#9B7D54" stroke="#9B7D54" stroke-dasharray="none" style="stroke-dasharray:none"/></g><g class="edge" data-edge="read-reconcile" data-label="actual total"><path data-connector="read-reconcile" class="edgePath amberEdge" style="marker-end:none" d="M 630 765 H 520"/><polygon data-connector-head="read-reconcile" data-arrow-direction="left" points="520,765 534,757 534,773" fill="#9B7D54" stroke="#9B7D54" stroke-dasharray="none" style="stroke-dasharray:none"/></g><text class="footer" x="800" y="895" text-anchor="middle">PostgreSQL + JetBrains Exposed + ExposedJdbcRepository; no raw SQL and no mutable billing truth.</text></svg>