<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="950" viewBox="0 0 1600 950" role="img" aria-labelledby="title desc"><title id="title">Event-Sourced Usage Billing - Authority Map</title><desc id="desc">Commands append facts; replay and projections derive every current view.</desc><defs><filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#64748B" flood-opacity="0.14"/></filter><marker id="seq-blue" viewBox="0 0 10 10" markerWidth="14" markerHeight="14" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#4F86C6" stroke="#4F86C6" stroke-dasharray="none"/></marker><marker id="seq-green" viewBox="0 0 10 10" markerWidth="14" markerHeight="14" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#6E8F4F" stroke="#6E8F4F" stroke-dasharray="none"/></marker><marker id="seq-amber" viewBox="0 0 10 10" markerWidth="14" markerHeight="14" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#9B7D54" stroke="#9B7D54" stroke-dasharray="none"/></marker><marker id="seq-red" viewBox="0 0 10 10" markerWidth="14" markerHeight="14" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#B86868" stroke="#B86868" stroke-dasharray="none"/></marker><marker id="seq-purple" viewBox="0 0 10 10" markerWidth="14" markerHeight="14" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#8065A8" stroke="#8065A8" stroke-dasharray="none"/></marker><marker id="seq-teal" viewBox="0 0 10 10" markerWidth="14" markerHeight="14" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#2D948C" stroke="#2D948C" stroke-dasharray="none"/></marker><style>
  .bg{fill:#F8FAFC}.frame{fill:#FFF;stroke:#CAD6DF;stroke-width:2}.alt{fill:none;stroke:#DFC69A;stroke-width:2}.zone{stroke-width:2}.blueZone{fill:#EFF6FF;stroke:#A8C7EA}.greenZone{fill:#F0F8F0;stroke:#B8D7AE}.purpleZone{fill:#F8F3FF;stroke:#D7C3EF}.amberZone{fill:#FFF7E8;stroke:#DFC69A}.title{font-family:"Architects Daughter";font-size:40px;fill:#263238}.subtitle,.body,.small,.msg,.footer{font-family:"Comic Mono";fill:#3E4C59}.subtitle{font-size:17px}.zoneTitle{font-family:"Architects Daughter";font-size:25px;fill:#344154}.cardTitle,.participant{font-family:"Architects Daughter";font-size:22px;fill:#16202A}.body{font-size:15px}.small{font-size:13px;fill:#5B6975}.footer{font-size:14px;fill:#60727D}.card{fill:#FFF;stroke:#9FB0BC;stroke-width:2}.blueCard{fill:#EFF6FF;stroke:#4F86C6}.greenCard{fill:#F0F8F0;stroke:#6E8F4F}.amberCard{fill:#FFF7E8;stroke:#9B7D54}.redCard{fill:#FFF0F0;stroke:#B86868}.purpleCard{fill:#F8F3FF;stroke:#8065A8}.edgePath{fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.blueEdge{stroke:#4F86C6;marker-end:url(#seq-blue)}.greenEdge{stroke:#6E8F4F;marker-end:url(#seq-green)}.amberEdge{stroke:#9B7D54;marker-end:url(#seq-amber)}.redEdge{stroke:#B86868;marker-end:url(#seq-red)}.purpleEdge{stroke:#8065A8;marker-end:url(#seq-purple)}.tealEdge{stroke:#2D948C;marker-end:url(#seq-teal)}.dashed{stroke-dasharray:9 7}.lifeline{stroke:#9AAAB1;stroke-width:2;stroke-dasharray:7 8}.activation{fill:#EAF6EF;stroke:#6F9278;stroke-width:1.5}.labelPill{fill:#FFF;stroke:#D7E0E4;stroke-width:1.5}.badge{font-family:"Comic Mono";font-size:13px;font-weight:700}.frameLabel{font-family:"Architects Daughter";font-size:18px;fill:#8B6A3E}
</style></defs><rect class="bg" width="1600" height="950"/><rect class="frame" x="28" y="24" width="1544" height="902" rx="22"/><text class="title" x="800" y="66" text-anchor="middle">Event-Sourced Usage Billing - Authority Map</text><text class="subtitle" x="800" y="98" text-anchor="middle">Commands append facts; replay and projections derive every current view.</text><rect class="zone blueZone" x="70" y="130" width="1460" height="170" rx="22"/><text class="zoneTitle" x="98" y="172">HTTP and application boundary</text><g class="node" data-node="tenant-api" filter="url(#shadow)"><rect class="card blueCard" x="120" y="205" width="300" height="75" rx="15"/><text class="cardTitle" x="270" y="238" text-anchor="middle">Tenant API</text><text class="body" x="270" y="266" text-anchor="middle">command receipt + security</text></g><g class="node" data-node="commands" filter="url(#shadow)"><rect class="card greenCard" x="650" y="205" width="300" height="75" rx="15"/><text class="cardTitle" x="800" y="238" text-anchor="middle">Command services</text><text class="body" x="800" y="266" text-anchor="middle">replay before append</text></g><g class="node" data-node="operator" filter="url(#shadow)"><rect class="card amberCard" x="1180" y="205" width="300" height="75" rx="15"/><text class="cardTitle" x="1330" y="238" text-anchor="middle">Operator API</text><text class="body" x="1330" y="266" text-anchor="middle">rebuild, rollback, reconcile</text></g><rect class="zone purpleZone" x="70" y="340" width="1460" height="260" rx="22"/><text class="zoneTitle" x="98" y="382">Correctness authority</text><g class="node" data-node="event-store" filter="url(#shadow)"><rect class="card purpleCard" x="130" y="445" width="360" height="100" rx="15"/><text class="cardTitle" x="310" y="478" text-anchor="middle">Append-only event store</text><text class="body" x="310" y="506" text-anchor="middle">stream version + hash chain</text><text class="body" x="310" y="528" text-anchor="middle">global position keyset</text></g><g class="node" data-node="snapshot" filter="url(#shadow)"><rect class="card amberCard" x="620" y="445" width="360" height="100" rx="15"/><text class="cardTitle" x="800" y="478" text-anchor="middle">Optional snapshots</text><text class="body" x="800" y="506" text-anchor="middle">validated acceleration only</text><text class="body" x="800" y="528" text-anchor="middle">corrupt means replay genesis</text></g><g class="node" data-node="projection" filter="url(#shadow)"><rect class="card greenCard" x="1110" y="445" width="360" height="100" rx="15"/><text class="cardTitle" x="1290" y="478" text-anchor="middle">Projection generations</text><text class="body" x="1290" y="506" text-anchor="middle">lease + owner fencing</text><text class="body" x="1290" y="528" text-anchor="middle">marker + view + checkpoint</text></g><rect class="zone greenZone" x="70" y="640" width="1460" height="200" rx="22"/><text class="zoneTitle" x="98" y="682">Derived query and operations</text><g class="node" data-node="reconcile" filter="url(#shadow)"><rect class="card amberCard" x="180" y="720" width="340" height="90" rx="15"/><text class="cardTitle" x="350" y="753" text-anchor="middle">Reconciliation</text><text class="body" x="350" y="781" text-anchor="middle">event replay vs ACTIVE view</text></g><g class="node" data-node="read-model" filter="url(#shadow)"><rect class="card greenCard" x="630" y="720" width="340" height="90" rx="15"/><text class="cardTitle" x="800" y="753" text-anchor="middle">Billing read model</text><text class="body" x="800" y="781" text-anchor="middle">tenant + generation scoped</text></g><g class="node" data-node="health" filter="url(#shadow)"><rect class="card blueCard" x="1080" y="720" width="340" height="90" rx="15"/><text class="cardTitle" x="1250" y="753" text-anchor="middle">Health and metrics</text><text class="body" x="1250" y="781" text-anchor="middle">lag, failure, quarantine</text></g><g class="edge" data-edge="api-command" data-label="authenticated command"><path data-connector="api-command" class="edgePath blueEdge" d="M420 243 L650 243"/></g><g class="edge" data-edge="command-store" data-label="append expected version"><path data-connector="command-store" class="edgePath greenEdge" d="M800 280 L800 320 Q800 330 790 330 L310 330 Q300 330 300 340 L300 445"/></g><g class="edge" data-edge="operator-projection" data-label="bounded recovery"><path data-connector="operator-projection" class="edgePath amberEdge" d="M1330 280 L1330 445"/></g><g class="edge" data-edge="store-snapshot" data-label="validated seed"><path data-connector="store-snapshot" class="edgePath amberEdge" d="M490 495 L620 495"/></g><g class="edge" data-edge="store-projection" data-label="global position feed"><path data-connector="store-projection" class="edgePath purpleEdge" d="M490 525 L520 525 Q535 525 535 590 Q535 605 550 605 L1275 605 Q1290 605 1290 590 L1290 545"/></g><g class="edge" data-edge="projection-read" data-label="active alias"><path data-connector="projection-read" class="edgePath greenEdge" d="M1275 545 L1275 660 Q1275 675 1260 675 L815 675 Q800 675 800 690 L800 720"/></g><g class="edge" data-edge="projection-health" data-label="lag and failure"><path data-connector="projection-health" class="edgePath blueEdge" d="M1350 545 L1350 720"/></g><g class="edge" data-edge="store-reconcile" data-label="authoritative replay"><path data-connector="store-reconcile" class="edgePath amberEdge dashed" d="M300 545 L300 720"/></g><g class="edge" data-edge="read-reconcile" data-label="actual total"><path data-connector="read-reconcile" class="edgePath amberEdge" d="M630 765 L520 765"/></g><text class="footer" x="800" y="895" text-anchor="middle">PostgreSQL + JetBrains Exposed + ExposedJdbcRepository; no raw SQL and no mutable billing truth.</text></svg>