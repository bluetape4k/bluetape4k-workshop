<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="960" viewBox="0 0 1120 960" role="img" aria-label="S3 Vectors and Access Grants workshop architecture">
  <defs>
    <marker id="archArrowBlue" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M1 1 L9 5 L1 9 Z" fill="#4f78b8"/>
    </marker>
    <marker id="archArrowGreen" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M1 1 L9 5 L1 9 Z" fill="#4f8f70"/>
    </marker>
    <style>
      .canvas{fill:#f7f9fc}
      .frame{fill:#ffffff;stroke:#d9e2ec;stroke-width:1.5}
      .layer{fill:#f1f5fa;stroke:#cad5e2;stroke-width:1.4}
      .layerText{font-family:"Architects Daughter", "Comic Sans MS", cursive;font-size:22px;fill:#203040}
      .title{font-family:"Architects Daughter", "Comic Sans MS", cursive;font-size:36px;font-weight:700;fill:#162033}
      .subtitle{font-family:"Comic Mono", "Comic Sans MS", cursive;font-size:14px;fill:#526274}
      .cardTitle{font-family:"Architects Daughter", "Comic Sans MS", cursive;font-size:21px;font-weight:700;fill:#172032}
      .cardText{font-family:"Comic Mono", "Comic Sans MS", cursive;font-size:13px;fill:#405166}
      .legend{font-family:"Comic Mono", "Comic Sans MS", cursive;font-size:12px;fill:#405166}
      .node rect{fill:#ffffff;stroke-width:2.2}
      [data-kind="app"] rect{stroke:#4f78b8}
      [data-kind="facade"] rect{stroke:#4f8f70}
      [data-kind="aws"] rect{stroke:#b07a2b}
      .edge path{fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
      .solid{stroke:#4f78b8;marker-end:url(#archArrowBlue)}
      .dashed{stroke:#4f8f70;stroke-dasharray:8 6;marker-end:url(#archArrowGreen)}
    </style>
  </defs>

  <rect class="canvas" x="0" y="0" width="1120" height="960"/>
  <rect class="frame" x="28" y="24" width="1064" height="912" rx="18"/>
  <text class="title" x="560" y="72" text-anchor="middle">S3 Vectors + Access Grants Workshop</text>
  <text class="subtitle" x="560" y="104" text-anchor="middle">Local-first Spring Boot example with explicit AWS service boundaries and redacted data-access decisions.</text>

  <rect class="layer" x="70" y="130" width="980" height="92" rx="12"/>
  <text class="layerText" x="100" y="162">1. Client layer</text>
  <rect class="layer" x="70" y="250" width="980" height="190" rx="12"/>
  <text class="layerText" x="100" y="282">2. Workshop application layer</text>
  <rect class="layer" x="70" y="470" width="980" height="140" rx="12"/>
  <text class="layerText" x="100" y="502">3. bluetape4k AWS facade layer</text>
  <rect class="layer" x="70" y="640" width="980" height="220" rx="12"/>
  <text class="layerText" x="100" y="672">4. AWS service boundary layer</text>

  <g class="node" data-node="client" data-kind="app">
    <rect x="400" y="145" width="320" height="62" rx="10"/>
    <text class="cardTitle" x="560" y="171" text-anchor="middle">REST learner</text>
    <text class="cardText" x="560" y="194" text-anchor="middle">upsert document / search vector</text>
  </g>
  <g class="node" data-node="controller" data-kind="app">
    <rect x="380" y="295" width="360" height="70" rx="10"/>
    <text class="cardTitle" x="560" y="323" text-anchor="middle">S3VectorsAccessController</text>
    <text class="cardText" x="560" y="348" text-anchor="middle">HTTP DTOs stay credential-free</text>
  </g>
  <g class="node" data-node="service" data-kind="app">
    <rect x="380" y="380" width="360" height="70" rx="10"/>
    <text class="cardTitle" x="560" y="408" text-anchor="middle">S3VectorsAccessService</text>
    <text class="cardText" x="560" y="433" text-anchor="middle">rank locally, gate object access</text>
  </g>
  <g class="node" data-node="vectorsOps" data-kind="facade">
    <rect x="130" y="525" width="330" height="70" rx="10"/>
    <text class="cardTitle" x="295" y="553" text-anchor="middle">S3VectorsOperations</text>
    <text class="cardText" x="295" y="578" text-anchor="middle">PutVectors / QueryVectors</text>
  </g>
  <g class="node" data-node="accessOps" data-kind="facade">
    <rect x="660" y="525" width="330" height="70" rx="10"/>
    <text class="cardTitle" x="825" y="553" text-anchor="middle">S3AccessGrantsOperations</text>
    <text class="cardText" x="825" y="578" text-anchor="middle">GetDataAccess READ boundary</text>
  </g>
  <g class="node" data-node="s3Vectors" data-kind="aws">
    <rect x="130" y="700" width="330" height="70" rx="10"/>
    <text class="cardTitle" x="295" y="728" text-anchor="middle">Amazon S3 Vectors</text>
    <text class="cardText" x="295" y="753" text-anchor="middle">vector bucket + index</text>
  </g>
  <g class="node" data-node="accessGrants" data-kind="aws">
    <rect x="660" y="700" width="330" height="70" rx="10"/>
    <text class="cardTitle" x="825" y="728" text-anchor="middle">S3 Access Grants</text>
    <text class="cardText" x="825" y="753" text-anchor="middle">permission decision, no secret output</text>
  </g>
  <g class="node" data-node="objectData" data-kind="aws">
    <rect x="380" y="805" width="360" height="70" rx="10"/>
    <text class="cardTitle" x="560" y="833" text-anchor="middle">Amazon S3 object data</text>
    <text class="cardText" x="560" y="858" text-anchor="middle">selected document is reachable only after grant</text>
  </g>

  <g class="edge" data-edge="client-&gt;controller" data-label="HTTP command">
    <path class="solid" d="M 560 207 L 560 295"/>
  </g>
  <g class="edge" data-edge="controller-&gt;service" data-label="Validated request DTO">
    <path class="solid" d="M 560 365 L 560 380"/>
  </g>
  <g class="edge" data-edge="service-&gt;vectorsOps" data-label="Vector upsert and query">
    <path class="solid" d="M 560 450 L 560 515 L 490 515 L 490 560 L 460 560"/>
  </g>
  <g class="edge" data-edge="service-&gt;accessOps" data-label="Access decision after top match">
    <path class="dashed" d="M 560 450 L 560 515 L 630 515 L 630 560 L 660 560"/>
  </g>
  <g class="edge" data-edge="vectorsOps-&gt;s3Vectors" data-label="AWS SDK S3 Vectors request">
    <path class="solid" d="M 295 595 L 295 700"/>
  </g>
  <g class="edge" data-edge="accessOps-&gt;accessGrants" data-label="AWS SDK S3 Control request">
    <path class="dashed" d="M 825 595 L 825 700"/>
  </g>
  <g class="edge" data-edge="accessGrants-&gt;objectData" data-label="Temporary object access decision">
    <path class="dashed" d="M 825 770 L 825 790 L 560 790 L 560 805"/>
  </g>

  <rect x="86" y="890" width="650" height="28" rx="8" fill="#ffffff" stroke="#cad5e2"/>
  <path d="M 104 904 L 170 904" class="solid" fill="none" stroke-width="2.5"/>
  <text class="legend" x="184" y="908">solid: vector write/query path</text>
  <path d="M 470 904 L 536 904" class="dashed" fill="none" stroke-width="2.5"/>
  <text class="legend" x="550" y="908">dashed: access grant decision</text>
</svg>
