    <style>
      .canvas{fill:#F8FAFC}.frame{fill:#FFFFFF;stroke:#D6E0E8;stroke-width:1.4}.layer{fill:#F8FAFC;stroke:#CBD5E1;stroke-width:1.4}.title{font-family:"Architects Daughter";font-size:38px;fill:#102033}.subtitle{font-family:"Comic Mono";font-size:15px;fill:#51606F}.layerLabel{font-family:"Architects Daughter";font-size:24px;fill:#263548}.cardTitle{font-family:"Architects Daughter";font-size:28px;fill:#102033}.cardText{font-family:"Comic Mono";font-size:15px;fill:#415166}.line{fill:none;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round}.soft{stroke-dasharray:8 8}
    </style>
  <marker id="arrowBlue-0891b2" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path stroke-dasharray="none" d="M 0 0 L 12 6 L 0 12 Z" fill="#0891b2" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="arrowRed-ea580c" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path stroke-dasharray="none" d="M 0 0 L 12 6 L 0 12 Z" fill="#ea580c" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
  <rect class="canvas" width="1792.8" height="740"/>
  <rect class="frame" x="25.92" y="24" width="1740.96" height="692" rx="24"/>  <text class="title" x="896.4" y="72" text-anchor="middle">Redis distributed lock workshop</text>
  <text class="subtitle" x="896.4" y="104" text-anchor="middle">The tests compare unsafe stock deduction, Redisson RLock, RFencedLock tokens, and coroutine-safe unlock.</text>

  <rect class="layer" x="77.76" y="146" width="343.44" height="470" rx="18"/>
  <text class="layerLabel" x="108" y="184">Inventory model</text>
  <g filter="url(#shadow)">
    <rect x="118.8" y="260" width="261.36" height="108" rx="16" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.836"/>
    <text class="cardTitle" x="249.48" y="300" text-anchor="middle">InventoryStore</text>
    <text class="cardText" x="249.48" y="332" text-anchor="middle">in-memory stock</text>
    <text class="cardText" x="249.48" y="358" text-anchor="middle">reset before each test</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="118.8" y="438" width="261.36" height="96" rx="16" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.836"/>
    <text class="cardTitle" x="249.48" y="478" text-anchor="middle">Unsafe service</text>
    <text class="cardText" x="249.48" y="508" text-anchor="middle">race proves oversell</text>
  </g>

  <rect class="layer" x="488.16" y="146" width="360.72" height="470" rx="18"/>
  <text class="layerLabel" x="518.4" y="184">Redisson locks</text>
  <g filter="url(#shadow)">
    <rect x="531.36" y="238" width="274.32" height="112" rx="16" fill="#F0FDF4" stroke="#16A34A" stroke-width="1.836"/>
    <image data-bluetape4k-icon="redis" data-source="docs/icons/redis/redis-icon.svg" x="550.8" y="276" width="33" height="33" href="data:image/svg+xml;base64," preserveAspectRatio="xMidYMid meet"/>  <text class="cardTitle" x="702" y="282" text-anchor="middle">Redis Server</text>  <text class="cardText" x="693.36" y="314" text-anchor="middle">Testcontainers singleton</text>
    <text class="cardText" x="693.36" y="340" text-anchor="middle">redissonClient DSL</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="531.36" y="426" width="274.32" height="112" rx="16" fill="#ECFEFF" stroke="#0891B2" stroke-width="1.836"/>
    <text class="cardTitle" x="668.52" y="468" text-anchor="middle">RLock</text>
    <text class="cardText" x="668.52" y="500" text-anchor="middle">tryLock(wait, lease)</text>
    <text class="cardText" x="668.52" y="526" text-anchor="middle">mutual exclusion</text>
  </g>

  <rect class="layer" x="915.84" y="146" width="382.32" height="470" rx="18"/>
  <text class="layerLabel" x="946.08" y="184">Fencing guard</text>
  <g filter="url(#shadow)">
    <rect x="959.04" y="238" width="295.92" height="112" rx="16" fill="#FFF7ED" stroke="#EA580C" stroke-width="1.836"/>
    <text class="cardTitle" x="1107" y="280" text-anchor="middle">RFencedLock</text>
    <text class="cardText" x="1107" y="312" text-anchor="middle">monotonic token</text>
    <text class="cardText" x="1107" y="338" text-anchor="middle">stale holders rejected</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="959.04" y="426" width="295.92" height="112" rx="16" fill="#FFFBEB" stroke="#D97706" stroke-width="1.836"/>
    <text class="cardTitle" x="1107" y="468" text-anchor="middle">FencedResource</text>
    <text class="cardText" x="1107" y="500" text-anchor="middle">CAS lastSeenToken</text>
    <text class="cardText" x="1107" y="526" text-anchor="middle">null means rejected</text>
  </g>

  <rect class="layer" x="1365.12" y="146" width="349.92" height="470" rx="18"/>
  <text class="layerLabel" x="1395.36" y="184">Concurrency tests</text>
  <g filter="url(#shadow)">
    <rect x="1408.32" y="250" width="263.52" height="104" rx="16" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.836"/>
    <text class="cardTitle" x="1540.08" y="292" text-anchor="middle">Thread Tester</text>
    <text class="cardText" x="1540.08" y="324" text-anchor="middle">MultithreadingTester</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="1408.32" y="432" width="263.52" height="104" rx="16" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.836"/>
    <text class="cardTitle" x="1540.08" y="474" text-anchor="middle">Suspend Tester</text>
    <text class="cardText" x="1540.08" y="506" text-anchor="middle">SuspendedJobTester</text>
  </g>

