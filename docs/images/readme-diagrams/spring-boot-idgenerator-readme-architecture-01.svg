  <g filter="url(#shadow)"><rect x="536" y="696" width="280" height="78" rx="14" fill="#FFFFFF" stroke="#EA580C" stroke-width="1.7"/><text class="cardTitle" x="676" y="728" text-anchor="middle">UlidGenerator</text><text class="cardText" x="676" y="754" text-anchor="middle">26 chars, monotonic</text></g>
  <g filter="url(#shadow)"><rect x="894" y="696" width="280" height="78" rx="14" fill="#FFFFFF" stroke="#EA580C" stroke-width="1.7"/><text class="cardTitle" x="1034" y="728" text-anchor="middle">KsuidGenerator</text><text class="cardText" x="1034" y="754" text-anchor="middle">27 chars, sortable</text></g>
  <g filter="url(#shadow)"><rect x="1252" y="696" width="330" height="78" rx="14" fill="#FFFFFF" stroke="#EA580C" stroke-width="1.7"/><text class="cardTitle" x="1417" y="728" text-anchor="middle">Hashids</text><text class="cardText" x="1417" y="754" text-anchor="middle">salt + minHashLength 8</text></g>
