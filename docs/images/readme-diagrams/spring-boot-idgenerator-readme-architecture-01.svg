  <rect class="canvas" width="1760" height="900"/><rect class="frame" x="24" y="24" width="1712" height="852" rx="24"/>
  <text class="title" x="880" y="72" text-anchor="middle">ID Generator REST facade</text><text class="subtitle" x="880" y="106" text-anchor="middle">One WebFlux controller exposes Snowflake, ULID, KSUID, and Hashids from bluetape4k-idgenerators.</text>
  <rect class="layer" x="86" y="154" width="1588" height="150" fill="#EFF6FF" stroke="#BFDBFE"/><text class="layerTitle" x="126" y="198">HTTP endpoints</text>
  <g filter="url(#shadow)"><rect x="166" y="220" width="310" height="60" rx="14" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.7"/><text class="cardTitle" x="321" y="258" text-anchor="middle">/ids/snowflake</text></g>
  <g filter="url(#shadow)"><rect x="548" y="220" width="310" height="60" rx="14" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.7"/><text class="cardTitle" x="703" y="258" text-anchor="middle">/ids/ulid</text></g>
  <g filter="url(#shadow)"><rect x="930" y="220" width="310" height="60" rx="14" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.7"/><text class="cardTitle" x="1085" y="258" text-anchor="middle">/ids/ksuid</text></g>
  <g filter="url(#shadow)"><rect x="1312" y="220" width="310" height="60" rx="14" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.7"/><text class="cardTitle" x="1467" y="258" text-anchor="middle">/ids/hashids</text></g>
  <rect class="layer" x="86" y="366" width="1588" height="190" fill="#F0FDF4" stroke="#BBF7D0"/><text class="layerTitle" x="126" y="410">Controller and response mapping</text>
  <g filter="url(#shadow)"><rect x="250" y="454" width="380" height="74" rx="14" fill="#FFFFFF" stroke="#16A34A" stroke-width="1.7"/><text class="cardTitle" x="440" y="486" text-anchor="middle">IdGeneratorController</text><text class="cardText" x="440" y="512" text-anchor="middle">GET routes under /ids</text></g>
  <g filter="url(#shadow)"><rect x="760" y="444" width="330" height="94" rx="14" fill="#FFFFFF" stroke="#16A34A" stroke-width="1.7"/><text class="cardTitle" x="925" y="476" text-anchor="middle">Batch guard</text><text class="cardText" x="925" y="502" text-anchor="middle">count.coerceIn(1, 1000)</text><text class="cardText" x="925" y="526" text-anchor="middle">applies to batch routes</text></g>
  <g filter="url(#shadow)"><rect x="1220" y="444" width="330" height="94" rx="14" fill="#FFFFFF" stroke="#16A34A" stroke-width="1.7"/><text class="cardTitle" x="1385" y="476" text-anchor="middle">Response DTOs</text><text class="cardText" x="1385" y="502" text-anchor="middle">Snowflake, String, Batch</text><text class="cardText" x="1385" y="526" text-anchor="middle">Hashids encode/decode</text></g>
  <rect class="layer" x="86" y="626" width="1588" height="158" fill="#FFF7ED" stroke="#FED7AA"/><text class="layerTitle" x="126" y="672">Generator families</text>
