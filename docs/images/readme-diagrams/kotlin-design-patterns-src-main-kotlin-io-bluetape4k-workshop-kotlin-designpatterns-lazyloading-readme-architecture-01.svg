<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="760" viewBox="0 0 1360 760" role="img" aria-label="Lazy Loading pattern diagram">
  <defs>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="124%"><feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#64748B" flood-opacity="0.16"/></filter>
    <marker id="arrowAmber" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 12 6 L 0 12 Z" fill="#C47A12" stroke-dasharray="none"/></marker>
    <marker id="arrowGreen" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 12 6 L 0 12 Z" fill="#16A34A" stroke-dasharray="none"/></marker>
    <style>
      .canvas{fill:#F8FAFC}.frame{fill:#fff;stroke:#D6E0E8;stroke-width:1.4}.layer{fill:#F8FAFC;stroke:#CBD5E1;stroke-width:1.4}.title{font-family:"Architects Daughter";font-size:36px;fill:#102033}.subtitle{font-family:"Comic Mono";font-size:14px;fill:#51606F}.label{font-family:"Architects Daughter";font-size:22px;fill:#172033}.cardTitle{font-family:"Architects Daughter";font-size:25px;fill:#102033}.cardText{font-family:"Comic Mono";font-size:14px;fill:#415166}.line{fill:none;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round}
    </style>
  </defs>
  <rect class="canvas" width="1360" height="760"/>
  <rect class="frame" x="26" y="24" width="1308" height="712" rx="24"/>
  <text class="title" x="680" y="66" text-anchor="middle">Lazy Loading</text>
  <text class="subtitle" x="680" y="94" text-anchor="middle">Each holder keeps construction cheap until the caller actually asks for the expensive Heavy value.</text>

  <rect class="layer" x="74" y="132" width="850" height="498" rx="18"/>
  <text class="label" x="102" y="166">Holder strategies</text>
  <g filter="url(#shadow)"><rect x="116" y="196" width="250" height="68" rx="14" fill="#FFF7ED" stroke="#D97706" stroke-width="1.7"/><text class="cardTitle" x="241" y="224" text-anchor="middle">HolderNative</text><text class="cardText" x="241" y="248" text-anchor="middle">lateinit first access</text></g>
  <g filter="url(#shadow)"><rect x="116" y="296" width="250" height="68" rx="14" fill="#FFF7ED" stroke="#D97706" stroke-width="1.7"/><text class="cardTitle" x="241" y="324" text-anchor="middle">HolderThreadSafe</text><text class="cardText" x="241" y="348" text-anchor="middle">ReentrantLock guard</text></g>
  <g filter="url(#shadow)"><rect x="116" y="396" width="250" height="68" rx="14" fill="#FFF7ED" stroke="#D97706" stroke-width="1.7"/><text class="cardTitle" x="241" y="424" text-anchor="middle">HolderKotlinLazy</text><text class="cardText" x="241" y="448" text-anchor="middle">lazy SYNCHRONIZED</text></g>
  <g filter="url(#shadow)"><rect x="116" y="526" width="250" height="68" rx="14" fill="#ECFDF5" stroke="#16A34A" stroke-width="1.7"/><text class="cardTitle" x="241" y="554" text-anchor="middle">HeavyDeferredValue</text><text class="cardText" x="241" y="578" text-anchor="middle">DeferredValue await</text></g>
  <g filter="url(#shadow)"><rect x="470" y="526" width="250" height="68" rx="14" fill="#ECFDF5" stroke="#16A34A" stroke-width="1.7"/><text class="cardTitle" x="595" y="554" text-anchor="middle">HeavyDeferred</text><text class="cardText" x="595" y="578" text-anchor="middle">suspend getHeavy()</text></g>

  <g filter="url(#shadow)"><rect x="1014" y="186" width="240" height="420" rx="18" fill="#FFFFFF" stroke="#64748B" stroke-width="1.8"/><text class="cardTitle" x="1134" y="382" text-anchor="middle">Heavy instance</text><text class="cardText" x="1134" y="412" text-anchor="middle">constructed once on demand</text></g>

  <path class="line" d="M 366 230 L 1014 230" stroke="#C47A12" marker-end="url(#arrowAmber)" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="line" d="M 366 330 L 1014 330" stroke="#C47A12" marker-end="url(#arrowAmber)" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="line" d="M 366 430 L 1014 430" stroke="#C47A12" marker-end="url(#arrowAmber)" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="line" d="M 366 560 L 470 560" stroke="#16A34A" marker-end="url(#arrowGreen)" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="line" d="M 720 560 L 1014 560" stroke="#16A34A" marker-end="url(#arrowGreen)" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
