<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1692.928" height="760" viewBox="0 0 1692.928 760" role="img" aria-label="Lazy Loading pattern diagram">
  <defs>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="124%"><feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#64748B" flood-opacity="0.16"/></filter>
    <marker id="arrowAmber" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 12 6 L 0 12 Z" fill="#C47A12" stroke-dasharray="none" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="arrowGreen" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 12 6 L 0 12 Z" fill="#16A34A" stroke-dasharray="none" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <style>
      .canvas{fill:#F8FAFC}.frame{fill:#fff;stroke:#D6E0E8;stroke-width:1.4}.layer{fill:#F8FAFC;stroke:#CBD5E1;stroke-width:1.4}.title{font-family:"Architects Daughter";font-size:36px;fill:#102033}.subtitle{font-family:"Comic Mono";font-size:14px;fill:#51606F}.label{font-family:"Architects Daughter";font-size:22px;fill:#172033}.cardTitle{font-family:"Architects Daughter";font-size:25px;fill:#102033}.cardText{font-family:"Comic Mono";font-size:14px;fill:#415166}.line{fill:none;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round}
    </style>
  </defs>
  <rect class="canvas" width="1692.928" height="760"/>
  <rect class="frame" x="32.365" y="24" width="1628.198" height="712" rx="24"/>
  <text class="title" x="846.464" y="66" text-anchor="middle">Lazy Loading</text>
  <text class="subtitle" x="846.464" y="94" text-anchor="middle">Each holder keeps construction cheap until the caller actually asks for the expensive Heavy value.</text>

  <rect class="layer" x="92.115" y="132" width="1058.08" height="498" rx="18"/>
  <text class="label" x="126.97" y="166">Holder strategies</text>
  <g filter="url(#shadow)"><rect x="144.397" y="196" width="311.2" height="68" rx="14" fill="#FFF7ED" stroke="#D97706" stroke-width="2.116"/><text class="cardTitle" x="299.997" y="224" text-anchor="middle">HolderNative</text><text class="cardText" x="299.997" y="248" text-anchor="middle">lateinit first access</text></g>
  <g filter="url(#shadow)"><rect x="144.397" y="296" width="311.2" height="68" rx="14" fill="#FFF7ED" stroke="#D97706" stroke-width="2.116"/><text class="cardTitle" x="299.997" y="324" text-anchor="middle">HolderThreadSafe</text><text class="cardText" x="299.997" y="348" text-anchor="middle">ReentrantLock guard</text></g>
  <g filter="url(#shadow)"><rect x="144.397" y="396" width="311.2" height="68" rx="14" fill="#FFF7ED" stroke="#D97706" stroke-width="2.116"/><text class="cardTitle" x="299.997" y="424" text-anchor="middle">HolderKotlinLazy</text><text class="cardText" x="299.997" y="448" text-anchor="middle">lazy SYNCHRONIZED</text></g>
  <g filter="url(#shadow)"><rect x="144.397" y="526" width="311.2" height="68" rx="14" fill="#ECFDF5" stroke="#16A34A" stroke-width="2.116"/><text class="cardTitle" x="299.997" y="554" text-anchor="middle">HeavyDeferredValue</text><text class="cardText" x="299.997" y="578" text-anchor="middle">DeferredValue await</text></g>
  <g filter="url(#shadow)"><rect x="585.056" y="526" width="311.2" height="68" rx="14" fill="#ECFDF5" stroke="#16A34A" stroke-width="2.116"/><text class="cardTitle" x="740.656" y="554" text-anchor="middle">HeavyDeferred</text><text class="cardText" x="740.656" y="578" text-anchor="middle">suspend getHeavy()</text></g>

  <g filter="url(#shadow)"><rect x="1262.227" y="186" width="298.752" height="420" rx="18" fill="#FFFFFF" stroke="#64748B" stroke-width="2.241"/><text class="cardTitle" x="1411.603" y="382" text-anchor="middle">Heavy instance</text><text class="cardText" x="1411.603" y="412" text-anchor="middle">constructed once on demand</text></g>

  <path class="line" d="M 455.597 230 L 1262.227 230" stroke="#C47A12" marker-end="url(#arrowAmber)" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="line" d="M 455.597 330 L 1262.227 330" stroke="#C47A12" marker-end="url(#arrowAmber)" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="line" d="M 455.597 430 L 1262.227 430" stroke="#C47A12" marker-end="url(#arrowAmber)" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="line" d="M 455.597 560 L 585.056 560" stroke="#16A34A" marker-end="url(#arrowGreen)" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="line" d="M 896.256 560 L 1262.227 560" stroke="#16A34A" marker-end="url(#arrowGreen)" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
