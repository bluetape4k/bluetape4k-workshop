<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-label="Bucket4j Advanced Architecture">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#1f2937" flood-opacity="0.10"/></filter>
  <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth">
    <path d="M1,1 L8,4.5 L1,8 Z" fill="#758297"/>
  </marker>
  <style>
    .canvas{fill:#f7f9fc}.frame{fill:#fff;stroke:#d8e0ea;stroke-width:1.5}
    .title{font-family:"Architects Daughter";font-size:38px;font-weight:400;fill:#102033}
    .subtitle{font-family:"Comic Mono";font-size:14px;font-weight:400;fill:#536273}
    .smallLabel{font-family:"Architects Daughter";font-size:21px;font-weight:400;fill:#102033}
    .mono{font-family:"Comic Mono";font-size:12px;font-weight:400;fill:#102033}
    .small{font-family:"Comic Mono";font-size:12px;font-weight:400;fill:#536273}
    .card{stroke-width:2.1;filter:url(#shadow)}
    .line{stroke:#758297;stroke-width:2.1;fill:none;marker-end:url(#arrow)}
  </style>
</defs>
<!-- Layout:
     Canvas: 960×560  Frame: x=24 y=20 w=912 h=516
     Row1  y=98  h=54  RateLimitDemoController center x=260 w=440
     Row2  y=212 h=80  3 cols w=260 gap=46:
       Col1: x=24  cx=154  IpRateLimitWebFilter
       Col2: x=330 cx=460  UserRateLimitWebFilter
       Col3: x=636 cx=766  CombinedRateLimitWebFilter
     Row3  y=352 h=80  same 3 cols:
       Col1: ipRateLimiter
       Col2: userRateLimiter
       Col3: combinedRateLimiter
     Row4  y=492 h=44  LettuceBasedProxyManager + Redis full width
-->
<rect class="canvas" width="960" height="560"/>
<rect class="frame" x="24" y="20" width="912" height="516" rx="28"/>
<text class="title" x="58" y="66">bt4k-advanced Rate Limit</text>
<text class="subtitle" x="58" y="92">3 Strategies: IP · User · Combined(IP+userId) · DistributedSuspendRateLimiter · Redis</text>

<!-- Arrows: Controller → 3 filters (bus y=182, all from controller bottom) -->
<path class="line" d="M480 152 L480 182 L154 182 L154 212"/>
<path class="line" d="M480 152 L480 182 L460 182 L460 212"/>
<path class="line" d="M480 152 L480 182 L766 182 L766 212"/>
<!-- Arrows: 3 filters → 3 rate limiters (straight down) -->
<path class="line" d="M154 292 L154 352"/>
<path class="line" d="M460 292 L460 352"/>
<path class="line" d="M766 292 L766 352"/>
<!-- Arrows: 3 rate limiters → ProxyManager+Redis (converge bus y=472) -->
<path class="line" d="M154 432 L154 472 L480 472 L480 492"/>
<path class="line" d="M460 432 L460 472 L480 472 L480 492"/>
<path class="line" d="M766 432 L766 472 L480 472 L480 492"/>

<!-- RateLimitDemoController (center top) -->
<g transform="translate(260,98)">
  <rect class="card" x="0" y="0" width="440" height="54" rx="12" fill="#EAF7EF" stroke="#58A978"/>
  <text class="smallLabel" x="220" y="22" text-anchor="middle">RateLimitDemoController</text>
  <text class="mono" x="220" y="42" text-anchor="middle">GET /api/anonymous · /authenticated · /sensitive</text>
</g>

<!-- IpRateLimitWebFilter col1 -->
<g transform="translate(24,212)">
  <rect class="card" x="0" y="0" width="260" height="80" rx="12" fill="#E8F3FF" stroke="#5B8DEF"/>
  <text class="smallLabel" x="130" y="22" text-anchor="middle">IpRateLimitFilter</text>
  <text class="mono" x="130" y="44" text-anchor="middle">key = clientIP</text>
  <text class="small" x="130" y="64" text-anchor="middle">/api/anonymous/** · @Order(10)</text>
</g>

<!-- UserRateLimitWebFilter col2 -->
<g transform="translate(330,212)">
  <rect class="card" x="0" y="0" width="260" height="80" rx="12" fill="#FFF3D9" stroke="#D6A441"/>
  <text class="smallLabel" x="130" y="22" text-anchor="middle">UserRateLimitFilter</text>
  <text class="mono" x="130" y="44" text-anchor="middle">key = X-User-ID header</text>
  <text class="small" x="130" y="64" text-anchor="middle">/api/authenticated/** · @Order(11)</text>
</g>

<!-- CombinedRateLimitWebFilter col3 -->
<g transform="translate(636,212)">
  <rect class="card" x="0" y="0" width="260" height="80" rx="12" fill="#FDECEF" stroke="#DC6B82"/>
  <text class="smallLabel" x="130" y="22" text-anchor="middle">CombinedRateLimitFilter</text>
  <text class="mono" x="130" y="44" text-anchor="middle">key = ip:userId</text>
  <text class="small" x="130" y="64" text-anchor="middle">/api/sensitive/** · @Order(12)</text>
</g>

<!-- ipRateLimiter col1 -->
<g transform="translate(24,352)">
  <rect class="card" x="0" y="0" width="260" height="80" rx="12" fill="#E8F3FF" stroke="#5B8DEF"/>
  <text class="smallLabel" x="130" y="22" text-anchor="middle">ipRateLimiter</text>
  <text class="mono" x="130" y="44" text-anchor="middle">20/10s · 100/min</text>
  <text class="small" x="130" y="64" text-anchor="middle">ipBucketProxyProvider</text>
</g>

<!-- userRateLimiter col2 -->
<g transform="translate(330,352)">
  <rect class="card" x="0" y="0" width="260" height="80" rx="12" fill="#FFF3D9" stroke="#D6A441"/>
  <text class="smallLabel" x="130" y="22" text-anchor="middle">userRateLimiter</text>
  <text class="mono" x="130" y="44" text-anchor="middle">50/10s · 200/min</text>
  <text class="small" x="130" y="64" text-anchor="middle">userBucketProxyProvider</text>
</g>

<!-- combinedRateLimiter col3 -->
<g transform="translate(636,352)">
  <rect class="card" x="0" y="0" width="260" height="80" rx="12" fill="#FDECEF" stroke="#DC6B82"/>
  <text class="smallLabel" x="130" y="22" text-anchor="middle">combinedRateLimiter</text>
  <text class="mono" x="130" y="44" text-anchor="middle">10/10s · 50/min</text>
  <text class="small" x="130" y="64" text-anchor="middle">combinedBucketProxyProvider</text>
</g>

<!-- LettuceBasedProxyManager + Redis (full width bottom) -->
<g transform="translate(24,492)">
  <rect class="card" x="0" y="0" width="912" height="44" rx="12" fill="#E9F7F6" stroke="#45A7A1"/>
  <text class="smallLabel" x="456" y="18" text-anchor="middle">LettuceBasedProxyManager · Redis</text>
  <text class="small" x="456" y="36" text-anchor="middle">shared ProxyManager · TTL 90s · VirtualThreadExecutor · Testcontainers singleton</text>
</g>
</svg>
