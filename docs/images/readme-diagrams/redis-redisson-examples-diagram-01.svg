<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-label="Redisson Examples Catalog">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#1f2937" flood-opacity="0.10"/></filter>
  <style>
    .canvas{fill:#f7f9fc}.frame{fill:#fff;stroke:#d8e0ea;stroke-width:1.5}
    .title{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:38px;font-weight:400;fill:#102033}
    .subtitle{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:14px;font-weight:400;fill:#536273}
    .smallLabel{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:21px;font-weight:400;fill:#102033}
    .mono{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#102033}
    .small{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#536273}
    .card{stroke-width:2.1;filter:url(#shadow)}
  </style>
</defs>
<!-- Layout:
     Canvas: 960×600  Frame: x=24 y=20 w=912 h=556
     Row1  y=108 h=164  2-col (w=440 gap=28):
       Col1: x=24  cx=246  Locks
       Col2: x=492 cx=714  Collections
     Row2  y=320 h=164  same 2-col:
       Col1: Objects
       Col2: ReadWriteThrough
     Row3  y=532 h=42  Redis + AbstractRedissonTest full width
     Col1 right=464 < Col2 left=492 ✓
-->
<rect class="canvas" width="960" height="600"/>
<rect class="frame" x="24" y="20" width="912" height="556" rx="28"/>
<text class="title" x="58" y="66">Redisson Examples Catalog</text>
<text class="subtitle" x="58" y="90">Locks · Collections · Objects · Read/Write-Through · All via RedissonClient + Redis Testcontainers</text>

<!-- Locks col1 row1 -->
<g transform="translate(24,108)">
  <rect class="card" x="0" y="0" width="440" height="164" rx="12" fill="#FDECEF" stroke="#DC6B82"/>
  <text class="smallLabel" x="220" y="24" text-anchor="middle">Locks</text>
  <text class="mono" x="220" y="48" text-anchor="middle">RLock.tryLock(wait, lease, MILLISECONDS)</text>
  <text class="mono" x="220" y="66" text-anchor="middle">RFairLock · RSpinLock · RFencedLock</text>
  <text class="small" x="220" y="84" text-anchor="middle">RMultiLock (composite of N locks)</text>
  <text class="small" x="220" y="102" text-anchor="middle">RReadWriteLock · readLock() / writeLock()</text>
  <text class="small" x="220" y="120" text-anchor="middle">RSemaphore · RPermitExpirableSemaphore</text>
  <text class="small" x="220" y="138" text-anchor="middle">RCountDownLatch · isHeldByCurrentThread()</text>
</g>

<!-- Collections col2 row1 -->
<g transform="translate(492,108)">
  <rect class="card" x="0" y="0" width="440" height="164" rx="12" fill="#E8F3FF" stroke="#5B8DEF"/>
  <text class="smallLabel" x="220" y="24" text-anchor="middle">Collections</text>
  <text class="mono" x="220" y="48" text-anchor="middle">RQueue · RBlockingDeque · RStream</text>
  <text class="mono" x="220" y="66" text-anchor="middle">RRingBuffer · RPriorityQueue / Deque</text>
  <text class="small" x="220" y="84" text-anchor="middle">RSortedSet · RScoredSortedSet (score-based)</text>
  <text class="small" x="220" y="102" text-anchor="middle">RLocalCachedMap (near-cache + Redis sync)</text>
  <text class="small" x="220" y="120" text-anchor="middle">RBoundedBlockingQueue (capacity limit)</text>
  <text class="small" x="220" y="138" text-anchor="middle">RListMultimapCache · RSetMultimapCache</text>
</g>

<!-- Objects col1 row2 -->
<g transform="translate(24,320)">
  <rect class="card" x="0" y="0" width="440" height="164" rx="12" fill="#FFF3D9" stroke="#D6A441"/>
  <text class="smallLabel" x="220" y="24" text-anchor="middle">Objects</text>
  <text class="mono" x="220" y="48" text-anchor="middle">RAtomicLong · RBucket · RTopic</text>
  <text class="mono" x="220" y="66" text-anchor="middle">RRateLimiter · RBloomFilter</text>
  <text class="small" x="220" y="84" text-anchor="middle">RHyperLogLog · RIdGenerator (Snowflake)</text>
  <text class="small" x="220" y="102" text-anchor="middle">RGeo (geospatial) · RReliableTopic</text>
  <text class="small" x="220" y="120" text-anchor="middle">RBinaryStream · RBatch (pipelined)</text>
  <text class="small" x="220" y="138" text-anchor="middle">pub/sub listener · keyspace notifications</text>
</g>

<!-- ReadWriteThrough col2 row2 -->
<g transform="translate(492,320)">
  <rect class="card" x="0" y="0" width="440" height="164" rx="12" fill="#F1ECFF" stroke="#8A72D6"/>
  <text class="smallLabel" x="220" y="24" text-anchor="middle">ReadWriteThrough</text>
  <text class="mono" x="220" y="48" text-anchor="middle">RMapCache with MapLoader&lt;Int, Actor&gt;</text>
  <text class="mono" x="220" y="66" text-anchor="middle">MapWriter&lt;Int, Actor&gt; · async write</text>
  <text class="small" x="220" y="84" text-anchor="middle">RetryableMapWriter (attempts=3, delay=100ms)</text>
  <text class="small" x="220" y="102" text-anchor="middle">loadAllKeys() · load(key) · write(map)</text>
  <text class="small" x="220" y="120" text-anchor="middle">Actor entity · JDBC DataSource · H2</text>
  <text class="small" x="220" y="138" text-anchor="middle">delete(keys) · writerRetryInterval=100ms</text>
</g>

<!-- Redis + AbstractRedissonTest (full width bottom) -->
<g transform="translate(24,532)">
  <rect class="card" x="0" y="0" width="912" height="42" rx="12" fill="#E9F7F6" stroke="#45A7A1"/>
  <text class="smallLabel" x="456" y="17" text-anchor="middle">Redis · AbstractRedissonTest</text>
  <text class="small" x="456" y="34" text-anchor="middle">RedisServer.Launcher singleton · LZ4ForyComposite · VirtualThreadExecutor · notify-keyspace-events=AKE</text>
</g>
</svg>
