<svg xmlns="http://www.w3.org/2000/svg" width="960" height="460" viewBox="0 0 960 460" role="img" aria-label="SmallRye Mutiny Reactive Architecture">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#1f2937" flood-opacity="0.09"/></filter>
  <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth">
    <path d="M1,1 L8,4.5 L1,8 Z" fill="#758297"/>
  </marker>
  <style>
    .canvas{fill:#f7f9fc}.frame{fill:#fff;stroke:#d8e0ea;stroke-width:1.5}
    .title{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:38px;font-weight:400;fill:#102033}
    .subtitle{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:14px;font-weight:400;fill:#536273}
    .smallLabel{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:21px;font-weight:400;fill:#102033}
    .mono{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#102033}
    .small{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#536273}
    .card{stroke-width:2.1;filter:url(#shadow)}
    .line{stroke:#758297;stroke-width:2.1;fill:none;marker-end:url(#arrow)}
  </style>
</defs>
<rect class="canvas" width="960" height="460"/>
<rect class="frame" x="24" y="20" width="912" height="416" rx="20"/>

<!-- Title -->
<text class="title" x="48" y="66">SmallRye Mutiny Reactive Architecture</text>
<text class="subtitle" x="48" y="90">Uni&#60;T&#62; · Multi&#60;T&#62; · Operators · Vert.x Integration · Reactive streams</text>

<!-- Row 1: Uni and Multi -->
<!-- Uni<T> -->
<rect class="card" x="36" y="108" width="420" height="96" rx="14" fill="#E8F3FF" stroke="#5B8DEF"/>
<text class="smallLabel" x="246" y="136" text-anchor="middle">Uni&#60;T&#62;</text>
<text class="small" x="246" y="158" text-anchor="middle">0 or 1 item · async single result</text>
<text class="small" x="246" y="176" text-anchor="middle">Uni.createFrom().item() · .createFrom().failure()</text>
<text class="small" x="246" y="193" text-anchor="middle">.onItem().transform() · .onFailure().recoverWithItem()</text>

<!-- Multi<T> -->
<rect class="card" x="504" y="108" width="420" height="96" rx="14" fill="#EAF7EF" stroke="#58A978"/>
<text class="smallLabel" x="714" y="136" text-anchor="middle">Multi&#60;T&#62;</text>
<text class="small" x="714" y="158" text-anchor="middle">0 to N items · async stream</text>
<text class="small" x="714" y="176" text-anchor="middle">Multi.createFrom().items() · .createFrom().ticks()</text>
<text class="small" x="714" y="193" text-anchor="middle">.onItem().transform() · .select().first(n)</text>

<!-- Row 2: Operators (3-col) -->
<!-- onItem() -->
<rect class="card" x="36" y="244" width="264" height="72" rx="14" fill="#FFF3D9" stroke="#D6A441"/>
<text class="smallLabel" x="168" y="270" text-anchor="middle">onItem()</text>
<text class="small" x="168" y="289" text-anchor="middle">transform · transformToUni</text>
<text class="small" x="168" y="306" text-anchor="middle">invoke · delayIt</text>

<!-- onFailure() -->
<rect class="card" x="348" y="244" width="264" height="72" rx="14" fill="#FDECEF" stroke="#DC6B82"/>
<text class="smallLabel" x="480" y="270" text-anchor="middle">onFailure()</text>
<text class="small" x="480" y="289" text-anchor="middle">recoverWithItem · recoverWithUni</text>
<text class="small" x="480" y="306" text-anchor="middle">retry · retry().atMost(n)</text>

<!-- subscribe() -->
<rect class="card" x="660" y="244" width="264" height="72" rx="14" fill="#F1ECFF" stroke="#8A72D6"/>
<text class="smallLabel" x="792" y="270" text-anchor="middle">subscribe()</text>
<text class="small" x="792" y="289" text-anchor="middle">with(item, failure)</text>
<text class="small" x="792" y="306" text-anchor="middle">asIterable() · await()</text>

<!-- Arrows Row1 → Row2 -->
<line class="line" x1="246" y1="204" x2="200" y2="244"/>
<line class="line" x1="480" y1="204" x2="480" y2="244"/>
<line class="line" x1="714" y1="204" x2="760" y2="244"/>

<!-- Row 3: Infra -->
<rect class="card" x="36" y="352" width="886" height="64" rx="14" fill="#E9F7F6" stroke="#45A7A1"/>
<text class="smallLabel" x="479" y="378" text-anchor="middle">Mutiny + Vert.x Integration · Operators · Transformers</text>
<text class="small" x="479" y="400" text-anchor="middle">Reactive SQL client · Event Bus · WebClient · non-blocking I/O · back-pressure</text>

<!-- Arrows Row2 → Row3 -->
<line class="line" x1="168" y1="316" x2="250" y2="352"/>
<line class="line" x1="480" y1="316" x2="480" y2="352"/>
<line class="line" x1="792" y1="316" x2="710" y2="352"/>
</svg>
