<svg xmlns="http://www.w3.org/2000/svg" width="920" height="520" viewBox="0 0 920 520" role="img" aria-label="Gatling Virtual Thread Load Testing">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#1f2937" flood-opacity="0.10"/></filter>
  <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth">
    <path d="M1,1 L8,4.5 L1,8 Z" fill="#758297"/>
  </marker>
  <style>
    .canvas{fill:#f7f9fc}.frame{fill:#fff;stroke:#d8e0ea;stroke-width:1.5}
    .title{font-family:"Architects Daughter";font-size:38px;font-weight:400;fill:#102033}
    .subtitle{font-family:"Comic Mono";font-size:14px;font-weight:400;fill:#536273}
    .smallLabel{font-family:"Architects Daughter";font-size:21px;font-weight:400;fill:#102033}
    .mono{font-family:"Comic Mono";font-size:12px;font-weight:400;fill:#102033}
    .small{font-family:"Comic Mono";font-size:12px;font-weight:400;fill:#536273}
    .card{stroke-width:2.1;filter:url(#shadow)}
    .line{stroke:#758297;stroke-width:2.1;fill:none;marker-end:url(#arrow)}
  </style>
</defs>
<!-- Layout:
     Canvas: 920×520  Frame: x=24 y=20 w=872 h=476
     Inner: x=40..880 = 840px
     Two cols: w=390 each, gap=60px
       Col1: x=40  cx=235  right=430
       Col2: x=490 cx=685  right=880
     Row1  y=98   h=80  bottom=178  (Simulations)
     Row2  y=240  h=70  bottom=310  (Spring Boot center x=220 w=480 cx=460)
     Row3  y=368  h=80  bottom=448  (Controllers)
     Routing: row1→row2=62px, row2→row3=58px (both ≥50px ✓)
     Overlap check: Col1 right=430 < Col2 left=490 ✓
-->
<rect class="canvas" width="920" height="520"/>
<rect class="frame" x="24" y="20" width="872" height="476" rx="28"/>
<text class="title" x="58" y="66">Gatling Virtual Thread Load Testing</text>
<text class="subtitle" x="58" y="92">SyncTaskSimulation · AsyncTaskSimulation · Tomcat VirtualThread · Spring Boot :8080</text>

<!-- Arrows -->
<!-- SyncTaskSimulation → Spring Boot (routes to left side of center) -->
<path class="line" d="M235 178 L235 208 L440 208 L440 240"/>
<!-- AsyncTaskSimulation → Spring Boot (routes to right side of center) -->
<path class="line" d="M685 178 L685 208 L480 208 L480 240"/>
<!-- Spring Boot → SyncTaskController (routes left) -->
<path class="line" d="M460 310 L460 338 L235 338 L235 368"/>
<!-- Spring Boot → AsyncTaskController (routes right) -->
<path class="line" d="M460 310 L460 338 L685 338 L685 368"/>

<!-- SyncTaskSimulation  col1 -->
<g transform="translate(40,98)">
  <rect class="card" x="0" y="0" width="390" height="80" rx="12" fill="#E8F3FF" stroke="#5B8DEF"/>
  <text class="smallLabel" x="195" y="22" text-anchor="middle">SyncTaskSimulation</text>
  <text class="mono" x="195" y="44" text-anchor="middle">GET /sync/{seconds}</text>
  <text class="small" x="195" y="64" text-anchor="middle">rampConcurrentUsers 10→20 during 10s</text>
</g>

<!-- AsyncTaskSimulation  col2 -->
<g transform="translate(490,98)">
  <rect class="card" x="0" y="0" width="390" height="80" rx="12" fill="#F1ECFF" stroke="#8A72D6"/>
  <text class="smallLabel" x="195" y="22" text-anchor="middle">AsyncTaskSimulation</text>
  <text class="mono" x="195" y="44" text-anchor="middle">GET /async/{seconds}</text>
  <text class="small" x="195" y="64" text-anchor="middle">rampConcurrentUsers 10→20 during 10s</text>
</g>

<!-- Spring Boot :8080 (center) -->
<g transform="translate(220,240)">
  <rect class="card" x="0" y="0" width="480" height="70" rx="12" fill="#EAF7EF" stroke="#58A978"/>
  <text class="smallLabel" x="240" y="22" text-anchor="middle">Spring Boot :8080</text>
  <text class="small" x="240" y="42" text-anchor="middle">Tomcat · VirtualThread per request (TomcatConfig)</text>
  <text class="small" x="240" y="58" text-anchor="middle">@Async · async-vt-exec virtual thread pool</text>
</g>

<!-- SyncTaskController  col1 -->
<g transform="translate(40,368)">
  <rect class="card" x="0" y="0" width="390" height="80" rx="12" fill="#FFF3D9" stroke="#D6A441"/>
  <text class="smallLabel" x="195" y="22" text-anchor="middle">SyncTaskController</text>
  <text class="mono" x="195" y="44" text-anchor="middle">GET /sync/{seconds}: Long</text>
  <text class="small" x="195" y="64" text-anchor="middle">measureTimeMillis { syncTaskService.delay(s) }</text>
</g>

<!-- AsyncTaskController  col2 -->
<g transform="translate(490,368)">
  <rect class="card" x="0" y="0" width="390" height="80" rx="12" fill="#FDECEF" stroke="#DC6B82"/>
  <text class="smallLabel" x="195" y="22" text-anchor="middle">AsyncTaskController</text>
  <text class="mono" x="195" y="44" text-anchor="middle">GET /async/{seconds}: Long</text>
  <text class="small" x="195" y="64" text-anchor="middle">measureTimeMillis { asyncTaskService.delay(s) }</text>
</g>
</svg>
