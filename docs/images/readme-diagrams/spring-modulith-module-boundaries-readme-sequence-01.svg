<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="1040" viewBox="0 0 1680 1040" role="img" aria-labelledby="title desc">
  <title id="title">Spring Modulith Module Boundary Sequence</title>
  <desc id="desc">Ordering reads catalog through an exported API, publishes an order event, and payment plus notification react through the exported event contract while a direct internal import is rejected.</desc>
  <defs>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="124%"><feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#64748B" flood-opacity="0.14"/></filter>
    <style>
      .title{font-family:"Architects Daughter";font-size:42px;fill:#263238}.subtitle,.msg,.footer,.role{font-family:"Comic Mono";fill:#36464F}.subtitle{font-size:17px}.participant{font-family:"Architects Daughter";font-size:19px;fill:#1F3138}.role{font-size:12px;fill:#546A73}.msg{font-size:13px}.footer{font-size:14px;fill:#60727D}.frame{fill:#FBFCF8;stroke:#41545D;stroke-width:3}.header{fill:#FFFFFF;stroke:#546E7A;stroke-width:2}.lifeline{stroke:#9AAAB1;stroke-width:2;stroke-dasharray:7 8;stroke-linecap:round}.activation{fill:#EAF6EF;stroke:#6F9278;stroke-width:1.5}.call,.return{fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.allowed{stroke:#4F86C6;marker-end:url(#seq-blue)}.event{stroke:#6E8F4F;marker-end:url(#seq-green)}.rejected{stroke:#B86868;stroke-dasharray:12 8;marker-end:url(#seq-red)}.return{stroke:#2D948C;stroke-width:2.6;stroke-dasharray:8 6;marker-end:url(#seq-teal)}.label{fill:#FFFFFF;stroke:#D7E0E4;stroke-width:1.5}.blueLabel{stroke:#9CC2D1}.greenLabel{stroke:#B6C9A4}.redLabel{stroke:#D9ABAB}.tealLabel{stroke:#9DCBC6}.badge{stroke-width:1.8}.blueBadge{fill:#EAF4F8;stroke:#4F86C6}.greenBadge{fill:#EEF7F0;stroke:#6E8F4F}.redBadge{fill:#FFF0F0;stroke:#B86868}.tealBadge{fill:#EBFAF8;stroke:#2D948C}.badgeText{font-family:"Comic Mono";font-size:12px;font-weight:700}.blueText{fill:#2F6F8E}.greenText{fill:#55783F}.redText{fill:#9D4F4F}.tealText{fill:#247C75}.alt{fill:none;stroke:#D08A39;stroke-width:2.2;stroke-dasharray:12 8}.divider{stroke:#D08A39;stroke-width:1.8;stroke-dasharray:9 7;opacity:.72}.branch{fill:#FFFFFF;stroke:#D08A39;stroke-width:1.6}.branchText{font-family:"Architects Daughter";font-size:18px;fill:#8A5A22}
    </style>
    <marker id="seq-blue" viewBox="0 0 10 10" markerWidth="16" markerHeight="16" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse" data-role="sequence" data-tip-direction="positive-x"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#4F86C6" stroke="#4F86C6" stroke-dasharray="none" style="stroke-dasharray:none" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="seq-green" viewBox="0 0 10 10" markerWidth="16" markerHeight="16" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse" data-role="sequence" data-tip-direction="positive-x"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#6E8F4F" stroke="#6E8F4F" stroke-dasharray="none" style="stroke-dasharray:none" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="seq-red" viewBox="0 0 10 10" markerWidth="16" markerHeight="16" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse" data-role="sequence" data-tip-direction="positive-x"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#B86868" stroke="#B86868" stroke-dasharray="none" style="stroke-dasharray:none" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="seq-teal" viewBox="0 0 10 10" markerWidth="16" markerHeight="16" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse" data-role="sequence" data-tip-direction="positive-x"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#2D948C" stroke="#2D948C" stroke-dasharray="none" style="stroke-dasharray:none" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>
  <rect x="24" y="24" width="1632" height="992" rx="20" class="frame"/>
  <text x="840" y="76" text-anchor="middle" class="title">Module Boundary Sequence</text>
  <text x="840" y="108" text-anchor="middle" class="subtitle">Ordering calls only catalog :: api, then payment and notification react through ordering :: events.</text>

  <g filter="url(#shadow)"><rect x="55" y="154" width="210" height="74" rx="10" class="header"/><text x="160" y="184" text-anchor="middle" class="participant">Client / Test</text><text x="160" y="208" text-anchor="middle" class="role">caller</text></g>
  <g filter="url(#shadow)"><rect x="335" y="154" width="210" height="74" rx="10" class="header"/><text x="440" y="184" text-anchor="middle" class="participant">OrderingService</text><text x="440" y="208" text-anchor="middle" class="role">ordering module</text></g>
  <g filter="url(#shadow)"><rect x="615" y="154" width="210" height="74" rx="10" class="header"/><text x="720" y="184" text-anchor="middle" class="participant">Catalog :: api</text><text x="720" y="208" text-anchor="middle" class="role">named interface</text></g>
  <g filter="url(#shadow)"><rect x="895" y="154" width="210" height="74" rx="10" class="header"/><text x="1000" y="184" text-anchor="middle" class="participant">Payment</text><text x="1000" y="208" text-anchor="middle" class="role">event consumer</text></g>
  <g filter="url(#shadow)"><rect x="1175" y="154" width="210" height="74" rx="10" class="header"/><text x="1280" y="184" text-anchor="middle" class="participant">Notification</text><text x="1280" y="208" text-anchor="middle" class="role">event consumer</text></g>
  <g filter="url(#shadow)"><rect x="1415" y="154" width="210" height="74" rx="10" class="header"/><text x="1520" y="184" text-anchor="middle" class="participant">Verifier</text><text x="1520" y="208" text-anchor="middle" class="role">ApplicationModules</text></g>

  <line x1="160" y1="228" x2="160" y2="940" class="lifeline"/>
  <line x1="440" y1="228" x2="440" y2="940" class="lifeline"/>
  <line x1="720" y1="228" x2="720" y2="940" class="lifeline"/>
  <line x1="1000" y1="228" x2="1000" y2="940" class="lifeline"/>
  <line x1="1280" y1="228" x2="1280" y2="940" class="lifeline"/>
  <line x1="1520" y1="228" x2="1520" y2="940" class="lifeline"/>
  <rect class="activation" x="432" y="300" width="16" height="312" rx="6"/>
  <rect class="activation" x="712" y="380" width="16" height="88" rx="6"/>
  <rect class="activation" x="992" y="560" width="16" height="98" rx="6"/>
  <rect class="activation" x="1272" y="640" width="16" height="98" rx="6"/>
  <rect class="activation" x="1512" y="810" width="16" height="84" rx="6"/>

  <rect x="218" y="282" width="250.0" height="34" rx="17" class="label labelPill blueLabel"/><circle cx="242" cy="299" r="13" class="badge blueBadge"/><text x="242" y="304" text-anchor="middle" class="badgeText num blueText">1</text><text x="266" y="304" class="msg blueText">placeOrder(request)</text><path data-connector="seq-1" d="M 160 324 L 440 324" class="call allowed"/>
  <rect x="478" y="362" width="250.0" height="34" rx="17" class="label labelPill blueLabel"/><circle cx="502" cy="379" r="13" class="badge blueBadge"/><text x="502" y="384" text-anchor="middle" class="badgeText num blueText">2</text><text x="526" y="384" class="msg blueText">findItem(sku)</text><path data-connector="seq-2" d="M 440 404 L 720 404" class="call allowed"/>
  <rect x="474" y="442" width="250.0" height="34" rx="17" class="label labelPill tealLabel"/><circle cx="498" cy="459" r="13" class="badge tealBadge"/><text x="498" y="464" text-anchor="middle" class="badgeText num tealText">3</text><text x="522" y="464" class="msg tealText">CatalogItemSnapshot</text><path data-connector="seq-3" d="M 720 484 L 440 484" class="return"/>
  <rect x="542" y="542" width="272.4" height="34" rx="17" class="label labelPill greenLabel"/><circle cx="566" cy="559" r="13" class="badge greenBadge"/><text x="566" y="564" text-anchor="middle" class="badgeText num greenText">4</text><text x="590" y="564" class="msg greenText">publish OrderPlacedEvent</text><path data-connector="seq-4" d="M 440 584 L 1000 584" class="call event"/>
  <rect x="648" y="622" width="272.4" height="34" rx="17" class="label labelPill greenLabel"/><circle cx="672" cy="639" r="13" class="badge greenBadge"/><text x="672" y="644" text-anchor="middle" class="badgeText num greenText">5</text><text x="696" y="644" class="msg greenText">publish OrderPlacedEvent</text><path data-connector="seq-5" d="M 440 664 L 1280 664" class="call event"/>
  <rect x="204" y="702" width="250.0" height="34" rx="17" class="label labelPill tealLabel"/><circle cx="228" cy="719" r="13" class="badge tealBadge"/><text x="228" y="724" text-anchor="middle" class="badgeText num tealText">6</text><text x="252" y="724" class="msg tealText">OrderReceipt</text><path data-connector="seq-6" d="M 440 744 L 160 744" class="return"/>

  <rect x="78" y="775" width="1524" height="156" rx="16" class="alt"/>
  <rect x="116" y="759" width="224" height="32" rx="16" class="branch"/>
  <text x="228" y="781" text-anchor="middle" class="branchText">boundary check</text>
  <line x1="78" y1="846" x2="1602" y2="846" class="divider"/>
  <rect x="344" y="792" width="281.0" height="34" rx="17" class="label labelPill blueLabel"/><circle cx="368" cy="809" r="13" class="badge blueBadge"/><text x="368" y="814" text-anchor="middle" class="badgeText num blueText">7</text><text x="392" y="814" class="msg blueText">verify valid module graph</text><path data-connector="seq-7" d="M 160 834 L 1520 834" class="call allowed"/>
  <rect x="992" y="856" width="367.0" height="34" rx="17" class="label labelPill redLabel"/><circle cx="1016" cy="873" r="13" class="badge redBadge"/><text x="1016" y="878" text-anchor="middle" class="badgeText num redText">8</text><text x="1040" y="878" class="msg redText">reject payment -&gt; ordering.internal</text><path data-connector="seq-8" d="M 1520 898 L 1000 898" class="call rejected"/>

  <rect x="96" y="958" width="1488" height="34" rx="12" fill="#FFFFFF" stroke="#CCD7DA" stroke-width="2"/>
  <text x="840" y="981" text-anchor="middle" class="footer">Reader contract: call labels stay above lines, arrowheads match line colors, and the branch body is transparent.</text>
</svg>
