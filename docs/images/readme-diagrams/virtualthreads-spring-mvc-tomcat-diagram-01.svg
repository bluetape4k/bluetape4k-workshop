<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" role="img" aria-label="Virtual Thread Spring MVC Tomcat Architecture">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%">
    <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#1f2937" flood-opacity="0.10"/>
  </filter>
  <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth">
    <path d="M1,1 L8,4.5 L1,8 Z" fill="#758297"/>
  </marker>
  <style>
    .canvas{fill:#f7f9fc}.frame{fill:#fff;stroke:#d8e0ea;stroke-width:1.5}
    .title{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:38px;font-weight:400;fill:#102033}
    .subtitle{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:14px;font-weight:400;fill:#536273}
    .smallLabel{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:21px;font-weight:400;fill:#102033}
    .mono{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#102033}
    .small{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#536273}
    .card{stroke-width:2.1;filter:url(#shadow)}
    .line{stroke:#758297;stroke-width:2.1;fill:none;marker-end:url(#arrow)}
  </style>
</defs>
<rect class="canvas" width="960" height="440"/>
<rect class="frame" x="24" y="20" width="912" height="396" rx="20"/>
<text class="title" x="48" y="66">Spring MVC + Virtual Threads (Tomcat)</text>
<text class="subtitle" x="48" y="90">TomcatProtocolHandlerCustomizer · newVirtualThreadPerTaskExecutor · DispatcherServlet · MVC Controllers</text>

<!-- Col 1: Config -->
<rect class="card" x="48" y="108" width="240" height="36" rx="8" fill="#E8F3FF" stroke="#5B8DEF"/>
<text class="smallLabel" x="168" y="132" text-anchor="middle">Config</text>

<rect class="card" x="48" y="156" width="240" height="80" rx="12" fill="#ffffff" stroke="#5B8DEF" stroke-width="1.8" filter="url(#shadow)"/>
<text class="mono" x="168" y="179" text-anchor="middle" fill="#102033">TomcatProtocol</text>
<text class="mono" x="168" y="195" text-anchor="middle" fill="#102033">HandlerCustomizer</text>
<text class="small" x="168" y="212" text-anchor="middle">@Bean configuration</text>
<text class="small" x="168" y="225" text-anchor="middle">sets Tomcat executor</text>

<rect class="card" x="48" y="252" width="240" height="80" rx="12" fill="#ffffff" stroke="#5B8DEF" stroke-width="1.8" filter="url(#shadow)"/>
<text class="mono" x="168" y="278" text-anchor="middle" fill="#102033">VirtualThreadConfig</text>
<text class="small" x="168" y="296" text-anchor="middle">Executors.newThread</text>
<text class="small" x="168" y="311" text-anchor="middle">PerTaskExecutor(…)</text>
<text class="small" x="168" y="326" text-anchor="middle">vt-executor-{n}</text>

<!-- Arrow: Config → MVC -->
<path class="line" d="M290 230 L350 230"/>

<!-- Col 2: Tomcat + Executor -->
<rect class="card" x="352" y="108" width="240" height="36" rx="8" fill="#EAF7EF" stroke="#58A978"/>
<text class="smallLabel" x="472" y="132" text-anchor="middle">Tomcat Runtime</text>

<rect class="card" x="352" y="156" width="240" height="80" rx="12" fill="#ffffff" stroke="#58A978" stroke-width="1.8" filter="url(#shadow)"/>
<text class="mono" x="472" y="184" text-anchor="middle" fill="#102033">Tomcat Connector</text>
<text class="small" x="472" y="203" text-anchor="middle">accepts HTTP connections</text>
<text class="small" x="472" y="218" text-anchor="middle">port 8080</text>

<rect class="card" x="352" y="252" width="240" height="80" rx="12" fill="#FFF3D9" stroke="#D6A441"/>
<text class="mono" x="472" y="278" text-anchor="middle" fill="#102033">VirtualThread</text>
<text class="mono" x="472" y="294" text-anchor="middle" fill="#102033">PerTaskExecutor</text>
<text class="small" x="472" y="312" text-anchor="middle">each request = new</text>
<text class="small" x="472" y="327" text-anchor="middle">virtual thread</text>

<!-- Arrow: Tomcat → Controllers -->
<path class="line" d="M594 230 L654 230"/>

<!-- Col 3: MVC Controllers -->
<rect class="card" x="656" y="108" width="256" height="36" rx="8" fill="#FFF3D9" stroke="#D6A441"/>
<text class="smallLabel" x="784" y="132" text-anchor="middle">MVC Controllers</text>

<rect class="card" x="656" y="156" width="256" height="52" rx="10" fill="#ffffff" stroke="#D6A441" stroke-width="1.8" filter="url(#shadow)"/>
<text class="mono" x="784" y="183" text-anchor="middle" fill="#102033">MemberController</text>
<text class="small" x="784" y="199" text-anchor="middle">/members/**</text>

<rect class="card" x="656" y="218" width="256" height="52" rx="10" fill="#ffffff" stroke="#DC6B82" stroke-width="1.8" filter="url(#shadow)"/>
<text class="mono" x="784" y="245" text-anchor="middle" fill="#102033">TeamController</text>
<text class="small" x="784" y="261" text-anchor="middle">/teams/**</text>

<rect class="card" x="656" y="280" width="256" height="52" rx="10" fill="#ffffff" stroke="#45A7A1" stroke-width="1.8" filter="url(#shadow)"/>
<text class="mono" x="784" y="307" text-anchor="middle" fill="#102033">VirtualThreadController</text>
<text class="small" x="784" y="323" text-anchor="middle">/virtual-threads/**</text>

<!-- Bottom note -->
<rect class="card" x="48" y="352" width="864" height="52" rx="10" fill="#0d2435" stroke="#0d2435" filter="url(#shadow)"/>
<text class="small" x="480" y="374" text-anchor="middle" fill="#dbeafe">Each HTTP request handled on its own Virtual Thread — no thread pool exhaustion</text>
<text class="small" x="480" y="393" text-anchor="middle" fill="#dbeafe">protocolHandler.executor = Executors.newVirtualThreadPerTaskExecutor()</text>
</svg>
