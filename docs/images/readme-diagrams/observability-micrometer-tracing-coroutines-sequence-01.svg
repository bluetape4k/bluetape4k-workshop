<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="560" viewBox="0 0 1040 560" role="img" aria-label="Micrometer Tracing Coroutines Sequence">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#1f2937" flood-opacity="0.10"/></filter>
  <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth">
    <path d="M1,1 L8,4.5 L1,8 Z" fill="#758297"/>
  </marker>
  <marker id="arrowBack" markerWidth="9" markerHeight="9" refX="1" refY="4.5" orient="auto" markerUnits="strokeWidth">
    <path d="M8,1 L1,4.5 L8,8 Z" fill="#45A7A1"/>
  </marker>
  <style>
    .canvas{fill:#f7f9fc}.frame{fill:#fff;stroke:#d8e0ea;stroke-width:1.5}
    .title{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:38px;font-weight:400;fill:#102033}
    .subtitle{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:14px;font-weight:400;fill:#536273}
    .smallLabel{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:18px;font-weight:400;fill:#102033}
    .mono{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:11px;font-weight:400;fill:#102033}
    .small{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:11px;font-weight:400;fill:#536273}
    .card{stroke-width:2.1;filter:url(#shadow)}
    .lifeline{stroke:#b0bbca;stroke-width:1.5;stroke-dasharray:6 4;fill:none}
    .reqArrow{stroke:#5B8DEF;stroke-width:2.1;fill:none;marker-end:url(#arrow)}
    .rspArrow{stroke:#45A7A1;stroke-width:2.1;stroke-dasharray:7 4;fill:none;marker-end:url(#arrow)}
    .spanArrow{stroke:#8A72D6;stroke-width:2.1;fill:none;marker-end:url(#arrow)}
  </style>
</defs>
<!-- 5 Participants:
     Client cx=84   (x=24 w=120)
     CoroutineController cx=284  (x=204 w=160)
     CoroutineService cx=504  (x=424 w=160)
     ObservationRegistry cx=724  (x=644 w=160)
     Zipkin cx=924  (x=864 w=120)
-->
<rect class="canvas" width="1040" height="560"/>
<rect class="frame" x="24" y="20" width="992" height="516" rx="28"/>
<text class="title" x="58" y="64">Tracing Coroutines Sequence</text>
<text class="subtitle" x="58" y="88">withObservationSuspending · CoroutineService · ObservationRegistry · OTel Bridge · Zipkin</text>

<!-- Participant headers (y=100, h=40) -->
<g transform="translate(24,100)">
  <rect class="card" x="0" y="0" width="120" height="40" rx="8" fill="#E8F3FF" stroke="#5B8DEF"/>
  <text class="smallLabel" style="font-size:17px" x="60" y="26" text-anchor="middle">Client</text>
</g>
<g transform="translate(204,100)">
  <rect class="card" x="0" y="0" width="160" height="40" rx="8" fill="#EAF7EF" stroke="#58A978"/>
  <text class="smallLabel" style="font-size:17px" x="80" y="26" text-anchor="middle">CoroutineController</text>
</g>
<g transform="translate(424,100)">
  <rect class="card" x="0" y="0" width="160" height="40" rx="8" fill="#FFF3D9" stroke="#D6A441"/>
  <text class="smallLabel" style="font-size:17px" x="80" y="26" text-anchor="middle">CoroutineService</text>
</g>
<g transform="translate(644,100)">
  <rect class="card" x="0" y="0" width="160" height="40" rx="8" fill="#F1ECFF" stroke="#8A72D6"/>
  <text class="smallLabel" style="font-size:17px" x="80" y="26" text-anchor="middle">ObservationRegistry</text>
</g>
<g transform="translate(864,100)">
  <rect class="card" x="0" y="0" width="120" height="40" rx="8" fill="#FDECEF" stroke="#DC6B82"/>
  <text class="smallLabel" style="font-size:17px" x="60" y="26" text-anchor="middle">Zipkin</text>
</g>

<!-- Lifelines (y=140 to y=520) -->
<line class="lifeline" x1="84"  y1="140" x2="84"  y2="520"/>
<line class="lifeline" x1="284" y1="140" x2="284" y2="520"/>
<line class="lifeline" x1="504" y1="140" x2="504" y2="520"/>
<line class="lifeline" x1="724" y1="140" x2="724" y2="520"/>
<line class="lifeline" x1="924" y1="140" x2="924" y2="520"/>

<!-- ① GET /coroutine/todos/{id}: Client → CoroutineController -->
<rect x="84" y="156" width="200" height="24" rx="4" fill="#dbeafe" opacity="0.7"/>
<text class="mono" x="184" y="172" text-anchor="middle">① GET /coroutine/todos/{id}</text>
<path class="reqArrow" d="M84 168 L276 168"/>

<!-- ② getTodo(id): CoroutineController → CoroutineService -->
<rect x="284" y="200" width="220" height="24" rx="4" fill="#dbeafe" opacity="0.7"/>
<text class="mono" x="394" y="216" text-anchor="middle">② getTodo(id) — suspend</text>
<path class="reqArrow" d="M284 212 L496 212"/>

<!-- ③ withObservationSuspending("pre-processing"): CoroutineService → ObservationRegistry -->
<rect x="504" y="244" width="220" height="24" rx="4" fill="#ede9fe" opacity="0.7"/>
<text class="mono" x="614" y="260" text-anchor="middle">③ span: "pre-processing"</text>
<path class="spanArrow" d="M504 256 L716 256"/>

<!-- ④ withObservationSuspending("get-todo-by-id"): CoroutineService → ObservationRegistry -->
<rect x="504" y="288" width="220" height="24" rx="4" fill="#ede9fe" opacity="0.7"/>
<text class="mono" x="614" y="304" text-anchor="middle">④ span: "get-todo-by-id"</text>
<path class="spanArrow" d="M504 300 L716 300"/>

<!-- ⑤ awaitBodyOrNull → jsonplaceholder (self-loop on CoroutineService) -->
<rect x="506" y="332" width="190" height="24" rx="4" fill="#fef3c7" opacity="0.7"/>
<text class="mono" x="601" y="348" text-anchor="middle">⑤ awaitBodyOrNull→ jsonplaceholder</text>
<path class="reqArrow" d="M504 344 L534 344 L534 364 L512 364"/>

<!-- ⑥ withObservationSuspending("post-processing"): CoroutineService → ObservationRegistry -->
<rect x="504" y="376" width="220" height="24" rx="4" fill="#ede9fe" opacity="0.7"/>
<text class="mono" x="614" y="392" text-anchor="middle">⑥ span: "post-processing"</text>
<path class="spanArrow" d="M504 388 L716 388"/>

<!-- ⑦ exportSpans (OTel): ObservationRegistry → Zipkin -->
<rect x="724" y="420" width="200" height="24" rx="4" fill="#fce7f3" opacity="0.7"/>
<text class="mono" x="824" y="436" text-anchor="middle">⑦ exportSpans (OTel bridge)</text>
<path class="reqArrow" d="M724 432 L916 432"/>

<!-- ⑧ Todo response: CoroutineController → Client (dashed) -->
<rect x="84" y="464" width="200" height="24" rx="4" fill="#d1fae5" opacity="0.7"/>
<text class="mono" x="184" y="480" text-anchor="middle">⑧ Todo response</text>
<path class="rspArrow" d="M284 476 L92 476"/>
</svg>
