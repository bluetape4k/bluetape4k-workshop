  <path class="line-green" d="M 1465 288 L 1465 330 L 775 330 L 775 428" marker-end="url(#mc-arrow-green)" stroke-linecap="round" stroke-linejoin="round"/>

  <path class="line-orange" d="M 325 522 L 325 580 L 445 580 L 445 658" marker-end="url(#mc-arrow-orange)" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="line-orange" d="M 775 522 L 775 580 L 915 580 L 915 658" marker-end="url(#mc-arrow-orange)" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="line-orange" d="M 1225 522 L 1225 580 L 915 580 L 915 658" marker-end="url(#mc-arrow-orange)" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="line-red" d="M 445 728 L 445 775 L 880 775 L 880 813" marker-end="url(#mc-arrow-red)" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="line-red" d="M 915 728 L 915 813" marker-end="url(#mc-arrow-red)" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="line-red" d="M 1340 728 L 1340 775 L 980 775 L 980 813" marker-end="url(#mc-arrow-red)" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
