<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="980" viewBox="0 0 1800 980">
  <defs>
    <style>
      .canvas { fill: #fbfcff; }
      .title { font-family: "Architects Daughter", "Comic Sans MS", cursive; font-size: 42px; fill: #102033; }
      .subtitle { font-family: "Comic Mono", "SFMono-Regular", monospace; font-size: 16px; fill: #536270; }
      .layer-title { font-family: "Architects Daughter", "Comic Sans MS", cursive; font-size: 28px; fill: #263445; }
      .card-title { font-family: "Architects Daughter", "Comic Sans MS", cursive; font-size: 27px; fill: #102033; }
      .card-small { font-family: "Comic Mono", "SFMono-Regular", monospace; font-size: 15px; fill: #394959; }
      .layer-test { fill: #eef6ff; stroke: #9cc8ff; }
      .layer-repo { fill: #eefaf2; stroke: #9ad8ae; }
      .layer-config { fill: #fff8eb; stroke: #ffc879; }
      .layer-runtime { fill: #fff1f0; stroke: #ffaaa3; }
      .card-blue { fill: #ffffff; stroke: #2f6df6; }
      .card-green { fill: #ffffff; stroke: #18964a; }
      .card-orange { fill: #ffffff; stroke: #f07d22; }
      .card-red { fill: #ffffff; stroke: #f04438; }
      .line-blue { fill: none; stroke: #2f6df6; stroke-width: 3.2; stroke-linecap: round; stroke-linejoin: round; }
      .line-green { fill: none; stroke: #18a558; stroke-width: 3.2; stroke-linecap: round; stroke-linejoin: round; }
      .line-orange { fill: none; stroke: #f07d22; stroke-width: 3.2; stroke-linecap: round; stroke-linejoin: round; }
      .line-red { fill: none; stroke: #f04438; stroke-width: 3.2; stroke-linecap: round; stroke-linejoin: round; }
    </style>
    <marker id="mc-arrow-blue" viewBox="0 0 14 14" refX="12" refY="7" markerWidth="12" markerHeight="12" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 1 1 L 13 7 L 1 13 Z" fill="#2f6df6" stroke-dasharray="none"/>
    </marker>
    <marker id="mc-arrow-green" viewBox="0 0 14 14" refX="12" refY="7" markerWidth="12" markerHeight="12" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 1 1 L 13 7 L 1 13 Z" fill="#18a558" stroke-dasharray="none"/>
    </marker>
    <marker id="mc-arrow-orange" viewBox="0 0 14 14" refX="12" refY="7" markerWidth="12" markerHeight="12" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 1 1 L 13 7 L 1 13 Z" fill="#f07d22" stroke-dasharray="none"/>
    </marker>
    <marker id="mc-arrow-red" viewBox="0 0 14 14" refX="12" refY="7" markerWidth="12" markerHeight="12" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 1 1 L 13 7 L 1 13 Z" fill="#f04438" stroke-dasharray="none"/>
    </marker>
  </defs>

  <rect class="canvas" x="0" y="0" width="1800" height="980"/>
  <rect x="24" y="24" width="1752" height="932" rx="22" fill="#ffffff" stroke="#d7e0eb" stroke-width="2"/>
  <text class="title" x="900" y="72" text-anchor="middle">MongoDB repository styles with coroutines</text>
  <text class="subtitle" x="900" y="102" text-anchor="middle">Blocking, reactive, and coroutine repository contracts share one Person document and one Testcontainers MongoDB server.</text>

  <rect class="layer-test" x="80" y="140" width="1640" height="170" rx="18" stroke-width="2"/>
  <text class="layer-title" x="112" y="184">Tests and document model</text>
  <rect class="card-blue" x="180" y="218" width="310" height="70" rx="10" stroke-width="2"/>
  <text class="card-title" x="335" y="247" text-anchor="middle">Spring Boot tests</text>
  <text class="card-small" x="335" y="270" text-anchor="middle">repository and template examples</text>
  <rect class="card-blue" x="745" y="218" width="310" height="70" rx="10" stroke-width="2"/>
  <text class="card-title" x="900" y="247" text-anchor="middle">Person document</text>
  <text class="card-small" x="900" y="270" text-anchor="middle">id, firstname, lastname, age</text>
  <rect class="card-blue" x="1310" y="218" width="310" height="70" rx="10" stroke-width="2"/>
  <text class="card-title" x="1465" y="247" text-anchor="middle">Capped collection</text>
  <text class="card-small" x="1465" y="270" text-anchor="middle">required for tailable cursor</text>

  <rect class="layer-repo" x="80" y="350" width="1640" height="210" rx="18" stroke-width="2"/>
  <text class="layer-title" x="112" y="394">Repository contracts</text>
  <rect class="card-green" x="145" y="440" width="360" height="82" rx="10" stroke-width="2"/>
  <text class="card-title" x="325" y="473" text-anchor="middle">PersonRepository</text>
  <text class="card-small" x="325" y="498" text-anchor="middle">CrudRepository nullability</text>
  <rect class="card-green" x="595" y="440" width="360" height="82" rx="10" stroke-width="2"/>
  <text class="card-title" x="775" y="473" text-anchor="middle">ReactiveRepository</text>
  <text class="card-small" x="775" y="498" text-anchor="middle">Mono, Flux, @Tailable</text>
  <rect class="card-green" x="1045" y="440" width="360" height="82" rx="10" stroke-width="2"/>
  <text class="card-title" x="1225" y="473" text-anchor="middle">CoroutineRepository</text>
  <text class="card-small" x="1225" y="498" text-anchor="middle">suspend and Flow results</text>

  <rect class="card-green" x="1460" y="440" width="210" height="82" rx="10" stroke-width="2"/>
  <text class="card-title" x="1565" y="473" text-anchor="middle">Metrics</text>
  <text class="card-small" x="1565" y="498" text-anchor="middle">invocation listener</text>

  <rect class="layer-config" x="80" y="600" width="1640" height="155" rx="18" stroke-width="2"/>
  <text class="layer-title" x="112" y="644">Mongo configuration</text>
  <rect class="card-orange" x="250" y="670" width="390" height="58" rx="10" stroke-width="2"/>
  <text class="card-title" x="445" y="706" text-anchor="middle">MongoClientConfig</text>
  <rect class="card-orange" x="720" y="670" width="390" height="58" rx="10" stroke-width="2"/>
  <text class="card-title" x="915" y="706" text-anchor="middle">ReactiveMongoConfig</text>
  <rect class="card-orange" x="1190" y="670" width="300" height="58" rx="10" stroke-width="2"/>  <text class="card-title" x="1340" y="706" text-anchor="middle">people database</text>

  <rect class="layer-runtime" x="80" y="795" width="1640" height="115" rx="18" stroke-width="2"/>
  <text class="layer-title" x="112" y="838">Runtime</text>
  <rect class="card-red" x="650" y="825" width="500" height="64" rx="10" stroke-width="2"/>
  <g transform="translate(690 837)">
    <path d="M 32 0 C 12 24 15 50 33 64 C 51 46 51 20 32 0 Z" fill="#13aa52" stroke="#0f8d45" stroke-width="2"/>
    <path d="M 33 12 C 30 27 31 43 34 58" fill="none" stroke="#ffffff" stroke-width="2.5"/>
  </g>  <text class="card-title" x="930" y="854" text-anchor="middle">MongoDB Testcontainer</text>
  <text class="card-small" x="930" y="877" text-anchor="middle">MongoDBServer.Launcher.mongoDB</text>

  <path class="line-blue" d="M 490 253 L 733 253" marker-end="url(#mc-arrow-blue)" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="line-blue" d="M 1055 253 L 1298 253" marker-end="url(#mc-arrow-blue)" stroke-linecap="round" stroke-linejoin="round"/>
