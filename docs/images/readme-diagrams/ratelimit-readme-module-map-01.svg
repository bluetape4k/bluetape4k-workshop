<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="2160.864" height="720" viewBox="0 0 2160.864 720" role="img" aria-label="Rate limiter module map">
  <defs>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="124%"><feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#64748B" flood-opacity="0.16"/></filter>
    <marker id="arrowBlue" markerWidth="14" markerHeight="14" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 12 12" data-role="primary" data-tip-direction="positive-x"><path d="M 0 0 L 12 6 L 0 12 Z" fill="#2563EB" stroke-dasharray="none" stroke-linecap="round" stroke-linejoin="round" stroke="#2563EB" stroke-width="0"/></marker>
    <marker id="arrowGreen" markerWidth="14" markerHeight="14" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 12 12" data-role="primary" data-tip-direction="positive-x"><path d="M 0 0 L 12 6 L 0 12 Z" fill="#16A34A" stroke-dasharray="none" stroke-linecap="round" stroke-linejoin="round" stroke="#16A34A" stroke-width="0"/></marker>
    <marker id="arrowOrange" markerWidth="14" markerHeight="14" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 12 12" data-role="primary" data-tip-direction="positive-x"><path d="M 0 0 L 12 6 L 0 12 Z" fill="#EA580C" stroke-dasharray="none" stroke-linecap="round" stroke-linejoin="round" stroke="#EA580C" stroke-width="0"/></marker>
    <style>
      .canvas{fill:#F8FAFC}.frame{fill:#FFFFFF;stroke:#D6E0E8;stroke-width:1.4}.layer{fill:#F8FAFC;stroke:#CBD5E1;stroke-width:1.4}.title{font-family:"Architects Daughter";font-size:38px;fill:#102033}.subtitle{font-family:"Comic Mono";font-size:15px;fill:#51606F}.layerLabel{font-family:"Architects Daughter";font-size:24px;fill:#263548}.cardTitle{font-family:"Architects Daughter";font-size:28px;fill:#102033}.cardText{font-family:"Comic Mono";font-size:15px;fill:#415166}.line{fill:none;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round}
    </style>
  </defs>
  <rect class="canvas" width="2160.864" height="720"/>
  <rect class="frame" x="31.622" y="24" width="2097.619" height="672" rx="24"/>
  <text class="title" x="1080.432" y="72" text-anchor="middle">Rate limiter workshop modules</text>  <text class="subtitle" x="1080.432" y="104" text-anchor="middle">Choose between a bluetape4k Redis limiter, advanced strategy filters, starter Redis, and starter Caffeine.</text>

  <rect class="layer" x="94.867" y="148" width="458.525" height="440" rx="18"/>
  <text class="layerLabel" x="131.76" y="186">Recommended path</text>
  <g filter="url(#shadow)">
    <rect x="144.936" y="246" width="358.387" height="146" rx="16" fill="#F0FDF4" stroke="#16A34A" stroke-width="2.24"/>
    <image data-bluetape4k-icon="redis" data-source="docs/icons/redis/redis-icon.svg" x="179.194" y="280" width="37" height="37" href="data:image/svg+xml;base64," preserveAspectRatio="xMidYMid meet"/>
    <text class="cardTitle" x="355.752" y="286" text-anchor="middle">bt4k WebFlux</text>
    <text class="cardText" x="355.752" y="322" text-anchor="middle">User token or IP key</text>
    <text class="cardText" x="355.752" y="348" text-anchor="middle">DistributedRateLimiter</text>  <text class="cardText" x="355.752" y="374" text-anchor="middle">Redis Lettuce store</text>
  </g>

  <rect class="layer" x="621.907" y="148" width="458.525" height="440" rx="18"/>
  <text class="layerLabel" x="658.8" y="186">Strategy lab</text>
  <g filter="url(#shadow)">
    <rect x="671.976" y="246" width="358.387" height="146" rx="16" fill="#EFF6FF" stroke="#2563EB" stroke-width="2.24"/>
    <text class="cardTitle" x="851.17" y="292" text-anchor="middle">Advanced filters</text>
    <text class="cardText" x="851.17" y="326" text-anchor="middle">IP, user, combined keys</text>
    <text class="cardText" x="851.17" y="352" text-anchor="middle">standard retry headers</text>  <text class="cardText" x="851.17" y="378" text-anchor="middle">Redis proxy manager</text>
  </g>

  <rect class="layer" x="1148.947" y="148" width="400.55" height="440" rx="18"/>  <text class="layerLabel" x="1185.84" y="186">Starter + Redis</text>
  <g filter="url(#shadow)">
    <rect x="1199.016" y="246" width="300.413" height="146" rx="16" fill="#FFF7ED" stroke="#EA580C" stroke-width="2.24"/>
    <image data-bluetape4k-icon="redis" data-source="docs/icons/redis/redis-icon.svg" x="1214.827" y="280" width="37" height="37" href="data:image/svg+xml;base64," preserveAspectRatio="xMidYMid meet"/>  <text class="cardTitle" x="1394.021" y="292" text-anchor="middle">Redis starter</text>
    <text class="cardText" x="1383.48" y="326" text-anchor="middle">filter-method: webflux</text>
    <text class="cardText" x="1383.48" y="352" text-anchor="middle">shared bucket state</text>
    <text class="cardText" x="1383.48" y="378" text-anchor="middle">starter configuration</text>
  </g>

  <rect class="layer" x="1618.013" y="148" width="447.984" height="440" rx="18"/>
  <text class="layerLabel" x="1654.906" y="186">Starter + local cache</text>
  <g filter="url(#shadow)">
    <rect x="1668.082" y="246" width="347.846" height="146" rx="16" fill="#FFFBEB" stroke="#D97706" stroke-width="2.24"/>
    <rect x="1694.434" y="288" width="84.326" height="30" rx="15" fill="#FEF3C7" stroke="#D97706" stroke-width="3.162"/>
    <path d="M 1286 303 C 1286 322 1350 322 1350 303" fill="none" stroke="#D97706" stroke-width="2.4"/>
    <text class="cardTitle" x="1915.79" y="292" text-anchor="middle">Caffeine servlet</text>
    <text class="cardText" x="1910.52" y="326" text-anchor="middle">filter-method: servlet</text>
    <text class="cardText" x="1910.52" y="352" text-anchor="middle">single JVM buckets</text>
    <text class="cardText" x="1910.52" y="378" text-anchor="middle">local/dev fit</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="685.152" y="480" width="790.56" height="72" rx="16" fill="#ECFEFF" stroke="#0891B2" stroke-width="2.24"/>
    <text class="cardTitle" x="1080.432" y="516" text-anchor="middle">Token bucket behavior</text>
    <text class="cardText" x="1080.432" y="542" text-anchor="middle">consume one token, allow while available, return 429 when exhausted</text>
  </g>

  <path class="line" d="M 503.323 320 L 671.976 320" stroke="#16A34A" marker-end="url(#arrowGreen)" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="line" d="M 1030.363 320 L 1199.016 320" stroke="#2563EB" marker-end="url(#arrowBlue)" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="line" d="M 1499.429 320 L 1668.082 320" stroke="#EA580C" marker-end="url(#arrowOrange)" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="line" d="M 851.17 392 L 851.17 480" stroke="#2563EB" marker-end="url(#arrowBlue)" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="line" d="M 1349.222 392 L 1349.222 480" stroke="#EA580C" marker-end="url(#arrowOrange)" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
