<rect class="box" x="1010" y="116" width="152" height="58" rx="10" fill="#fdecef" stroke="#7aa0c4"/>
<text class="actor" x="1086" y="145" text-anchor="middle" dominant-baseline="middle">ApplicationEventPublisher</text>
<line class="lifeline" x1="1086" y1="174" x2="1086" y2="664"/>
<rect class="box" x="1251" y="116" width="152" height="58" rx="10" fill="#e9f7f6" stroke="#7aa0c4"/>
<text class="actor" x="1327" y="145" text-anchor="middle" dominant-baseline="middle">DepartmentManagement</text>
