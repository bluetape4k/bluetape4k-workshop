<svg xmlns="http://www.w3.org/2000/svg" width="1841.357" height="1134" viewBox="0 0 1841.357 1134" role="img" aria-labelledby="title desc">
  <title id="title">Generator Request Sequence</title>
  <desc id="desc">HTTP endpoints expose Snowflake, ULID, KSUID, and Hashids generation through one controller surface.</desc>
  <defs>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="124%"><feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#64748B" flood-opacity="0.14"/></filter>
    <style>
      .title{font-family:"Architects Daughter";font-size:40px;fill:#263238}.subtitle,.msg,.note,.footer{font-family:"Comic Mono";fill:#36464F}.subtitle{font-size:17px}.participant{font-family:"Architects Daughter";font-size:19px;fill:#1F3138}.role{font-family:"Comic Mono";font-size:12px;fill:#546A73}.msg{font-size:13px}.note{font-size:13px}.footer{font-size:14px;fill:#60727D}.frame{fill:#FBFCF8;stroke:#41545D;stroke-width:3}.header{fill:#FFFFFF;stroke:#546E7A;stroke-width:2}.lifeline{stroke:#9AAAB1;stroke-width:2;stroke-dasharray:7 8;stroke-linecap:round}.activation{fill:#E6F2EC;stroke:#5B7E67;stroke-width:1.5}.call,.work,.return,.skip{fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.call{stroke:#3F7D9C;marker-end:url(#arrow-call);stroke-linecap:round;stroke-linejoin:round}.work{stroke:#6E8F4F;marker-end:url(#arrow-work);stroke-linecap:round;stroke-linejoin:round}.return{stroke:#9B7D54;stroke-width:2.6;stroke-dasharray:8 6;marker-end:url(#arrow-ret);stroke-linecap:round;stroke-linejoin:round}.skip{stroke:#B86868;marker-end:url(#arrow-skip);stroke-linecap:round;stroke-linejoin:round}.label{fill:#FFFFFF;stroke:#D7E0E4;stroke-width:1.5}.callLabel{stroke:#9CC2D1}.workLabel{stroke:#B6C9A4}.returnLabel{stroke:#C8B38F}.skipLabel{stroke:#D9ABAB}.badge{stroke-width:1.8}.callBadge{fill:#EAF4F8;stroke:#3F7D9C}.workBadge{fill:#EEF7F0;stroke:#6E8F4F}.returnBadge{fill:#FFF7E8;stroke:#9B7D54}.skipBadge{fill:#FFF0F0;stroke:#B86868}.badgeText{font-family:"Comic Mono";font-size:12px;font-weight:700}.callText,.badgeText.callText{fill:#2F6F8E}.workText,.badgeText.workText{fill:#55783F}.returnText,.badgeText.returnText{fill:#7F6038}.skipText,.badgeText.skipText{fill:#9D4F4F}.alt{fill:#FFF7ED;fill-opacity:.42;stroke:#D08A39;stroke-width:2.4;stroke-dasharray:12 8}.branch{fill:#FFFFFF;fill-opacity:.82;stroke:#E6C68C;stroke-width:1.5}
    </style>
    <marker id="arrow-call" viewBox="0 0 11.4286 11.4286" markerWidth="16" markerHeight="16" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse" data-role="sequence" data-tip-direction="positive-x"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#3F7D9C" stroke-dasharray="none" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="arrow-work" viewBox="0 0 11.4286 11.4286" markerWidth="16" markerHeight="16" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse" data-role="sequence" data-tip-direction="positive-x"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#6E8F4F" stroke-dasharray="none" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="arrow-ret" viewBox="0 0 11.4286 11.4286" markerWidth="16" markerHeight="16" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse" data-role="sequence" data-tip-direction="positive-x"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#9B7D54" stroke-dasharray="none" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="arrow-skip" viewBox="0 0 11.4286 11.4286" markerWidth="16" markerHeight="16" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse" data-role="sequence" data-tip-direction="positive-x"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#B86868" stroke-dasharray="none" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>
  <rect x="26.463" y="24" width="1788.431" height="1086" rx="20" class="frame"/>
  <text x="920.678" y="76" text-anchor="middle" class="title">Generator Request Sequence</text>
  <text x="920.678" y="106" text-anchor="middle" class="subtitle">HTTP endpoints expose Snowflake, ULID, KSUID, and Hashids generation through one controller surface.</text>
  <g filter="url(#shadow)"><rect x="82.696" y="156" width="253.6" height="76" rx="10" class="header"/><text x="209.496" y="186" text-anchor="middle" class="participant">Client</text><text x="209.496" y="211" text-anchor="middle" class="role">HTTP caller</text></g>
  <line x1="209.496" y1="232" x2="209.496" y2="1022" class="lifeline"/>
  <g filter="url(#shadow)"><rect x="438.838" y="156" width="253.6" height="76" rx="10" class="header"/><text x="565.638" y="186" text-anchor="middle" class="participant">IdGeneratorController</text><text x="565.638" y="211" text-anchor="middle" class="role">GET /ids/**</text></g>
  <line x1="565.638" y1="232" x2="565.638" y2="1022" class="lifeline"/>
  <g filter="url(#shadow)"><rect x="793.878" y="156" width="253.6" height="76" rx="10" class="header"/><text x="920.678" y="186" text-anchor="middle" class="participant">Generator</text><text x="920.678" y="211" text-anchor="middle" class="role">Snowflake / ULID / KSUID</text></g>
  <line x1="920.678" y1="232" x2="920.678" y2="1022" class="lifeline"/>
  <g filter="url(#shadow)"><rect x="1150.021" y="156" width="253.6" height="76" rx="10" class="header"/><text x="1276.821" y="186" text-anchor="middle" class="participant">Hashids</text><text x="1276.821" y="211" text-anchor="middle" class="role">encode/decode</text></g>
  <line x1="1276.821" y1="232" x2="1276.821" y2="1022" class="lifeline"/>
  <g filter="url(#shadow)"><rect x="1505.061" y="156" width="253.6" height="76" rx="10" class="header"/><text x="1631.861" y="186" text-anchor="middle" class="participant">Response</text><text x="1631.861" y="211" text-anchor="middle" class="role">DTO body</text></g>
  <line x1="1631.861" y1="232" x2="1631.861" y2="1022" class="lifeline"/>
  <rect x="222.727" y="252" width="350.078" height="34" rx="17" class="label callLabel"/>
  <circle cx="249.19" cy="269" r="13" class="badge callBadge"/><text x="249.19" y="274" text-anchor="middle" class="badgeText callText">1</text>
  <text x="275.652" y="274" class="msg callText">GET /ids/snowflake or /parse/{id}</text>
  <path d="M 209.496 300 L 565.638 300" class="call" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="592.983" y="328" width="300.461" height="34" rx="17" class="label workLabel"/>
  <circle cx="619.446" cy="345" r="13" class="badge workBadge"/><text x="619.446" y="350" text-anchor="middle" class="badgeText workText">2</text>
  <text x="645.908" y="350" class="msg workText">generate or parse Snowflake</text>
  <path d="M 565.638 376 L 920.678 376" class="work" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="1088.826" y="404" width="374.887" height="34" rx="17" class="label returnLabel"/>
  <circle cx="1115.289" cy="421" r="13" class="badge returnBadge"/><text x="1115.289" y="426" text-anchor="middle" class="badgeText returnText">3</text>
  <text x="1141.751" y="426" class="msg returnText">SnowflakeResponse or BatchIdResponse</text>
  <path d="M 920.678 452 L 1631.861 452" class="return" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="237.392" y="480" width="300.461" height="34" rx="17" class="label callLabel"/>
  <circle cx="263.854" cy="497" r="13" class="badge callBadge"/><text x="263.854" y="502" text-anchor="middle" class="badgeText callText">4</text>
  <text x="290.317" y="502" class="msg callText">GET /ids/ulid or /ids/ksuid</text>
  <path d="M 209.496 528 L 565.638 528" class="call" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="592.983" y="556" width="300.461" height="34" rx="17" class="label workLabel"/>
  <circle cx="619.446" cy="573" r="13" class="badge workBadge"/><text x="619.446" y="578" text-anchor="middle" class="badgeText workText">5</text>
  <text x="645.908" y="578" class="msg workText">generate ULID / KSUID batch</text>
  <path d="M 565.638 604 L 920.678 604" class="work" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="1149.47" y="632" width="253.6" height="34" rx="17" class="label returnLabel"/>
  <circle cx="1175.932" cy="649" r="13" class="badge returnBadge"/><text x="1175.932" y="654" text-anchor="middle" class="badgeText returnText">6</text>
  <text x="1202.395" y="654" class="msg returnText">ULID / KSUID body</text>
  <path d="M 920.678 680 L 1631.861 680" class="return" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="260.767" y="708" width="253.6" height="34" rx="17" class="label callLabel"/>
  <circle cx="287.23" cy="725" r="13" class="badge callBadge"/><text x="287.23" y="730" text-anchor="middle" class="badgeText callText">7</text>
  <text x="313.692" y="730" class="msg callText">GET /ids/hashids/{id}</text>
  <path d="M 209.496 756 L 565.638 756" class="call" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="725.517" y="784" width="391.426" height="34" rx="17" class="label workLabel"/>
  <circle cx="751.979" cy="801" r="13" class="badge workBadge"/><text x="751.979" y="806" text-anchor="middle" class="badgeText workText">8</text>
  <text x="778.442" y="806" class="msg workText">Hashids(salt, minLength).encode/decode</text>
  <path d="M 565.638 832 L 1276.821 832" class="work" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="1316.515" y="860" width="275.652" height="34" rx="17" class="label returnLabel"/>
  <circle cx="1342.977" cy="877" r="13" class="badge returnBadge"/><text x="1342.977" y="882" text-anchor="middle" class="badgeText returnText">9</text>
  <text x="1369.44" y="882" class="msg returnText">encoded or decoded value</text>
  <path d="M 1276.821 908 L 1631.861 908" class="return" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="99.235" y="1046" width="1642.887" height="40" rx="12" fill="#FFFFFF" stroke="#CCD7DA" stroke-width="2.205"/>
  <text x="920.678" y="1072" text-anchor="middle" class="footer">Reader contract: request order, branch ownership, and infrastructure boundary are shown without hiding call labels.</text>
</svg>
