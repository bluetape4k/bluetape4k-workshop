<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="900" viewBox="0 0 1700 900" role="img" aria-label="ID generator request flow">
  <defs><filter id="shadow" x="-8%" y="-8%" width="116%" height="124%"><feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#64748B" flood-opacity="0.15"/></filter><marker id="arrowBlue" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 14 7 L 0 14 Z" fill="#2563EB"/></marker><marker id="arrowGreen" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 14 7 L 0 14 Z" fill="#16A34A"/></marker><marker id="arrowOrange" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 14 7 L 0 14 Z" fill="#EA580C"/></marker><style>.canvas{fill:#F8FAFC}.frame{fill:#FFFFFF;stroke:#D6E0E8;stroke-width:1.4}.title{font-family:"Architects Daughter";font-size:40px;fill:#102033}.subtitle{font-family:"Comic Mono";font-size:16px;fill:#51606F}.cardTitle{font-family:"Architects Daughter";font-size:29px;fill:#102033}.cardText{font-family:"Comic Mono";font-size:15px;fill:#415166}.line{fill:none;stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round}.msg{font-family:"Comic Mono";font-size:15px;fill:#334155}.life{stroke:#94A3B8;stroke-width:1.7;stroke-dasharray:8 8}.region{fill-opacity:.58;stroke-width:1.6;rx:18}.noteTitle{font-family:"Architects Daughter";font-size:24px;fill:#102033}</style></defs>
  <rect class="canvas" width="1700" height="900"/><rect class="frame" x="24" y="24" width="1652" height="852" rx="24"/>
  <text class="title" x="850" y="72" text-anchor="middle">Generator request flow</text><text class="subtitle" x="850" y="106" text-anchor="middle">Each endpoint calls the matching generator and returns the response shape that helps compare ID behavior.</text>
  <g filter="url(#shadow)"><rect x="110" y="154" width="220" height="72" rx="14" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.7"/><text class="cardTitle" x="220" y="188" text-anchor="middle">Client</text><text class="cardText" x="220" y="212" text-anchor="middle">curl or WebTestClient</text></g>
  <g filter="url(#shadow)"><rect x="470" y="154" width="320" height="72" rx="14" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.7"/><text class="cardTitle" x="630" y="188" text-anchor="middle">IdGeneratorController</text><text class="cardText" x="630" y="212" text-anchor="middle">GET /ids/**</text></g>
  <g filter="url(#shadow)"><rect x="930" y="154" width="280" height="72" rx="14" fill="#FFF7ED" stroke="#EA580C" stroke-width="1.7"/><text class="cardTitle" x="1070" y="188" text-anchor="middle">Generator</text><text class="cardText" x="1070" y="212" text-anchor="middle">Snowflake / ULID / KSUID</text></g>
  <g filter="url(#shadow)"><rect x="1370" y="154" width="230" height="72" rx="14" fill="#F0FDF4" stroke="#16A34A" stroke-width="1.7"/><text class="cardTitle" x="1485" y="188" text-anchor="middle">Response</text><text class="cardText" x="1485" y="212" text-anchor="middle">DTO body</text></g>
  <line class="life" x1="220" y1="238" x2="220" y2="802"/><line class="life" x1="630" y1="238" x2="630" y2="802"/><line class="life" x1="1070" y1="238" x2="1070" y2="802"/><line class="life" x1="1485" y1="238" x2="1485" y2="802"/>
  <rect class="region" x="82" y="288" width="1536" height="164" fill="#ECFDF5" stroke="#86EFAC"/><text class="noteTitle" x="124" y="328">Snowflake</text>
  <path class="line" d="M 220 356 L 630 356" stroke="#2563EB" marker-end="url(#arrowBlue)"/><text class="msg" x="425" y="338" text-anchor="middle">GET /ids/snowflake or /parse/{id}</text>
  <path class="line" d="M 630 390 L 1070 390" stroke="#EA580C" marker-end="url(#arrowOrange)"/><text class="msg" x="850" y="372" text-anchor="middle">nextId(), parse(id), nextIds(count)</text>
  <path class="line" d="M 1070 424 L 1485 424" stroke="#16A34A" marker-end="url(#arrowGreen)"/><text class="msg" x="1278" y="406" text-anchor="middle">SnowflakeResponse or BatchIdResponse</text>
  <rect class="region" x="82" y="496" width="1536" height="122" fill="#EFF6FF" stroke="#93C5FD"/><text class="noteTitle" x="124" y="536">ULID and KSUID</text>
  <path class="line" d="M 220 574 L 630 574" stroke="#2563EB" marker-end="url(#arrowBlue)"/><text class="msg" x="425" y="556" text-anchor="middle">GET /ids/ulid, /ids/ksuid, or batch</text>
  <path class="line" d="M 630 594 L 1070 594" stroke="#EA580C" marker-end="url(#arrowOrange)"/><text class="msg" x="850" y="620" text-anchor="middle">nextId() or List(count) nextId()</text>
  <rect class="region" x="82" y="662" width="1536" height="116" fill="#FFF7ED" stroke="#FED7AA"/><text class="noteTitle" x="124" y="702">Hashids</text>
  <path class="line" d="M 220 738 L 630 738" stroke="#2563EB" marker-end="url(#arrowBlue)"/><text class="msg" x="425" y="720" text-anchor="middle">encode?numbers=... or decode/{hash}</text>
  <path class="line" d="M 630 758 L 1070 758" stroke="#EA580C" marker-end="url(#arrowOrange)"/><text class="msg" x="850" y="784" text-anchor="middle">Hashids(salt, minLength).encode/decode</text>
  <path class="line" d="M 1485 832 L 220 832" stroke="#16A34A" marker-end="url(#arrowGreen)"/><text class="msg" x="852" y="858" text-anchor="middle">HTTP 200 JSON response with generated, parsed, or decoded values</text>
</svg>
