<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-label="Bucket4j Bluetape4k WebFlux Architecture">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#1f2937" flood-opacity="0.10"/></filter>
  <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth">
    <path d="M1,1 L8,4.5 L1,8 Z" fill="#758297"/>
  </marker>
  <style>
    .canvas{fill:#f7f9fc}.frame{fill:#fff;stroke:#d8e0ea;stroke-width:1.5}
    .title{font-family:"Architects Daughter";font-size:38px;font-weight:400;fill:#102033}
    .subtitle{font-family:"Comic Mono";font-size:14px;font-weight:400;fill:#536273}
    .smallLabel{font-family:"Architects Daughter";font-size:21px;font-weight:400;fill:#102033}
    .mono{font-family:"Comic Mono";font-size:12px;font-weight:400;fill:#102033}
    .small{font-family:"Comic Mono";font-size:12px;font-weight:400;fill:#536273}
    .card{stroke-width:2.1;filter:url(#shadow)}
    .line{stroke:#758297;stroke-width:2.1;fill:none;marker-end:url(#arrow)}
  </style>
</defs>
<!-- Layout:
     Canvas: 960×520  Frame: x=24 y=20 w=912 h=476
     Row1  y=98  h=54  Col1: x=24 w=420 cx=234 (CoroutineController)
                        Col2: x=516 w=420 cx=726 (ReactiveController)
     Row2  y=212 h=80  Col1: x=24 w=420 cx=234 (UserRateLimitWebFilter)
                        Col2: x=516 w=420 cx=726 (AsyncUserRateLimitWebFilter)
     Row3  y=352 h=80  Col1: x=24 w=420 cx=234 (DistributedRateLimiter)
                        Col2: x=516 w=420 cx=726 (DistributedSuspendRateLimiter)
     Row4  y=492 h=44  Full width: LettuceBasedProxyManager + Redis
     Gap: col1 right=444 < col2 left=516 ✓
-->
<rect class="canvas" width="960" height="520"/>
<rect class="frame" x="24" y="20" width="912" height="476" rx="28"/>
<text class="title" x="58" y="66">bt4k-bucket4j WebFlux</text>
<text class="subtitle" x="58" y="92">bluetape4k-bucket4j · DistributedRateLimiter · UserRateLimitWebFilter · Redis · WebFlux + Coroutines</text>

<!-- Arrows Row1→Row2: col1 and col2 straight down -->
<path class="line" d="M234 152 L234 212"/>
<path class="line" d="M726 152 L726 212"/>
<!-- Arrows Row2→Row3: col1 and col2 straight down -->
<path class="line" d="M234 292 L234 352"/>
<path class="line" d="M726 292 L726 352"/>
<!-- Arrows Row3→Row4: converge to full-width -->
<path class="line" d="M234 432 L234 472 L480 472 L480 492"/>
<path class="line" d="M726 432 L726 472 L480 472 L480 492"/>

<!-- CoroutineController col1 -->
<g transform="translate(24,98)">
  <rect class="card" x="0" y="0" width="420" height="54" rx="12" fill="#E8F3FF" stroke="#5B8DEF"/>
  <text class="smallLabel" x="210" y="22" text-anchor="middle">CoroutineController</text>
  <text class="mono" x="210" y="42" text-anchor="middle">suspend · GET /api/v1/coroutines/hello</text>
</g>

<!-- ReactiveController col2 -->
<g transform="translate(516,98)">
  <rect class="card" x="0" y="0" width="420" height="54" rx="12" fill="#FFF3D9" stroke="#D6A441"/>
  <text class="smallLabel" x="210" y="22" text-anchor="middle">ReactiveController</text>
  <text class="mono" x="210" y="42" text-anchor="middle">Mono · GET /api/v1/reactive/hello</text>
</g>

<!-- UserRateLimitWebFilter col1 -->
<g transform="translate(24,212)">
  <rect class="card" x="0" y="0" width="420" height="80" rx="12" fill="#EAF7EF" stroke="#58A978"/>
  <text class="smallLabel" x="210" y="22" text-anchor="middle">UserRateLimitWebFilter</text>
  <text class="mono" x="210" y="44" text-anchor="middle">DistributedRateLimiter (sync)</text>
  <text class="small" x="210" y="64" text-anchor="middle">@Order(0) · UserKeyResolver · Mono-based</text>
</g>

<!-- AsyncUserRateLimitWebFilter col2 -->
<g transform="translate(516,212)">
  <rect class="card" x="0" y="0" width="420" height="80" rx="12" fill="#E9F7F6" stroke="#45A7A1"/>
  <text class="smallLabel" x="210" y="22" text-anchor="middle">AsyncUserRateLimitWebFilter</text>
  <text class="mono" x="210" y="44" text-anchor="middle">DistributedSuspendRateLimiter (async)</text>
  <text class="small" x="210" y="64" text-anchor="middle">@Order(1) · coroutine suspend · mono { }</text>
</g>

<!-- DistributedRateLimiter col1 -->
<g transform="translate(24,352)">
  <rect class="card" x="0" y="0" width="420" height="80" rx="12" fill="#F1ECFF" stroke="#8A72D6"/>
  <text class="smallLabel" x="210" y="22" text-anchor="middle">DistributedRateLimiter</text>
  <text class="mono" x="210" y="44" text-anchor="middle">BucketProxyProvider · consume()</text>
  <text class="small" x="210" y="64" text-anchor="middle">capacity=10 per 10s · 100 per minute</text>
</g>

<!-- DistributedSuspendRateLimiter col2 -->
<g transform="translate(516,352)">
  <rect class="card" x="0" y="0" width="420" height="80" rx="12" fill="#FDECEF" stroke="#DC6B82"/>
  <text class="smallLabel" x="210" y="22" text-anchor="middle">DistributedSuspendRateLimiter</text>
  <text class="mono" x="210" y="44" text-anchor="middle">AsyncBucketProxyProvider · suspendConsume()</text>
  <text class="small" x="210" y="64" text-anchor="middle">async CAS · VirtualThread executor</text>
</g>

<!-- LettuceBasedProxyManager + Redis (full width bottom) -->
<g transform="translate(24,492)">
  <rect class="card" x="0" y="0" width="912" height="44" rx="12" fill="#EAF7EF" stroke="#58A978"/>
  <text class="smallLabel" x="456" y="18" text-anchor="middle">LettuceBasedProxyManager + Redis</text>
  <text class="small" x="456" y="36" text-anchor="middle">ExpirationAfterWriteStrategy · VirtualThreadExecutor · Testcontainers singleton</text>
</g>
</svg>
