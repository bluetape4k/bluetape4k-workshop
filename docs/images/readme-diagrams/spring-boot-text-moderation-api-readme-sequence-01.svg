<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1080" viewBox="0 0 1500 1080" role="img" aria-labelledby="title desc">
  <title id="title">spring-boot-text-moderation-api sequence</title>
  <desc id="desc">Best-practices sequence diagram for validation and success flows in the text moderation API.</desc>
  <defs>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Architects+Daughter&amp;display=swap");
      @font-face { font-family: "Comic Mono"; src: local("Comic Mono"); }
      text { font-family: "Comic Mono", monospace; fill: #263238; }
      .title { font-family: "Architects Daughter", cursive; font-size: 38px; fill: #172026; }
      .subtitle { font-size: 18px; fill: #51626d; }
      .participant { font-family: "Architects Daughter", cursive; font-size: 22px; fill: #18272f; }
      .role { font-size: 14px; fill: #5a6b75; }
      .message { font-size: 15px; fill: #263238; }
      .note { font-size: 15px; fill: #5a6b75; }
      .lifeline, .life { stroke: #9fb0b9; stroke-width: 2; stroke-dasharray: 8 9; }
      .activation { fill: #ffffff; stroke: #6d8190; stroke-width: 2; rx: 5; ry: 5; }
      .call { fill: none; stroke: #506c7a; stroke-width: 3.2; stroke-linecap: round; marker-end: url(#seqArrow); }
      .return { fill: none; stroke: #7c8b94; stroke-width: 3; stroke-dasharray: 8 7; stroke-linecap: round; marker-end: url(#seqArrow); }
      .message-label { fill: none; stroke: none; opacity: 0; }
      .label { fill: #ffffff; stroke: #aec7d4; stroke-width: 1.8; rx: 16; ry: 16; filter: url(#labelShadow); }
      .box { fill: #ffffff; stroke: #98b7c7; stroke-width: 2.2; rx: 17; ry: 17; filter: url(#labelShadow); }
      .header { fill: none; stroke: none; rx: 17; ry: 17; }
      .frame { fill: #f8fbfc; stroke: #d7e2e7; stroke-width: 2; rx: 34; ry: 34; }
      .alt { fill: #f4f0fb; fill-opacity: 0.12; stroke: #b9a2db; stroke-width: 2; rx: 18; ry: 18; }
      .branchDivider { stroke: #b9a2db; stroke-width: 2; stroke-dasharray: 9 8; }
    </style>
    <filter id="labelShadow" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#1a2c34" flood-opacity="0.12"/>
    </filter>
    <marker id="seqArrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 10 10">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#506c7a"/>
    </marker>
  </defs>

  <rect class="frame" x="24" y="24" width="1452" height="1032"/>
  <text class="title" x="64" y="76">Text Moderation Request Flow</text>
  <text class="subtitle" x="64" y="108">Validation branch and local text-component reuse in one Spring MVC request</text>

  <g id="participants">
    <rect class="box" x="70" y="146" width="180" height="76"/>
    <rect class="header" x="70" y="146" width="180" height="76"/>
    <text class="participant" x="160" y="178" text-anchor="middle">Client</text>
    <text class="role" x="160" y="202" text-anchor="middle">JSON caller</text>

    <rect class="box" x="300" y="146" width="200" height="76"/>
    <rect class="header" x="300" y="146" width="200" height="76"/>
    <text class="participant" x="400" y="178" text-anchor="middle">Controller</text>
    <text class="role" x="400" y="202" text-anchor="middle">MVC endpoint</text>

    <rect class="box" x="550" y="146" width="200" height="76"/>
    <rect class="header" x="550" y="146" width="200" height="76"/>
    <text class="participant" x="650" y="178" text-anchor="middle">Service</text>
    <text class="role" x="650" y="202" text-anchor="middle">moderation core</text>

    <rect class="box" x="800" y="146" width="200" height="76"/>
    <rect class="header" x="800" y="146" width="200" height="76"/>
    <text class="participant" x="900" y="178" text-anchor="middle">Detector</text>
    <text class="role" x="900" y="202" text-anchor="middle">Lingua bean</text>

    <rect class="box" x="1050" y="146" width="200" height="76"/>
    <rect class="header" x="1050" y="146" width="200" height="76"/>
    <text class="participant" x="1150" y="178" text-anchor="middle">Matcher</text>
    <text class="role" x="1150" y="202" text-anchor="middle">Aho-Corasick</text>

    <rect class="box" x="1290" y="146" width="160" height="76"/>
    <rect class="header" x="1290" y="146" width="160" height="76"/>
    <text class="participant" x="1370" y="178" text-anchor="middle">Advice</text>
    <text class="role" x="1370" y="202" text-anchor="middle">error mapper</text>
  </g>

  <line class="lifeline life" x1="160" y1="222" x2="160" y2="1032"/>
  <line class="lifeline life" x1="400" y1="222" x2="400" y2="1032"/>
  <line class="lifeline life" x1="650" y1="222" x2="650" y2="1032"/>
  <line class="lifeline life" x1="900" y1="222" x2="900" y2="1032"/>
  <line class="lifeline life" x1="1150" y1="222" x2="1150" y2="1032"/>
  <line class="lifeline life" x1="1370" y1="222" x2="1370" y2="1032"/>

  <rect class="activation" x="391" y="270" width="18" height="730"/>
  <rect class="activation" x="641" y="350" width="18" height="530"/>
  <rect class="activation" x="891" y="705" width="18" height="60"/>
  <rect class="activation" x="1141" y="825" width="18" height="60"/>
  <rect class="activation" x="1361" y="500" width="18" height="70"/>

  <path class="call" d="M 160 270 L 400 270"/>
  <rect class="message-label" x="205" y="284" width="150" height="34"/>
  <rect class="label" x="205" y="224" width="150" height="34"/>
  <text class="message" x="280" y="246" text-anchor="middle">POST analyze JSON</text>

  <path class="call" d="M 409 350 L 650 350"/>
  <rect class="message-label" x="455" y="364" width="148" height="34"/>
  <rect class="label" x="455" y="304" width="148" height="34"/>
  <text class="message" x="529" y="326" text-anchor="middle">analyze(text)</text>

  <rect class="alt" x="520" y="400" width="895" height="625"/>
  <text class="note" x="544" y="430">alt invalid input</text>
  <line class="branchDivider" x1="544" y1="620" x2="1390" y2="620"/>
  <text class="note" x="544" y="650">else valid text</text>

  <path class="call" d="M 659 500 L 1370 500"/>
  <rect class="message-label" x="915" y="514" width="198" height="34"/>
  <rect class="label" x="915" y="452" width="198" height="34"/>
  <text class="message" x="1014" y="474" text-anchor="middle">map validation error</text>

  <path class="return" d="M 1361 570 L 160 570"/>
  <rect class="message-label" x="650" y="584" width="250" height="34"/>
  <rect class="label" x="650" y="522" width="250" height="34"/>
  <text class="message" x="775" y="544" text-anchor="middle">400 invalid or 413 too large</text>

  <path class="call" d="M 659 705 L 900 705"/>
  <rect class="message-label" x="710" y="719" width="140" height="34"/>
  <rect class="label" x="710" y="657" width="140" height="34"/>
  <text class="message" x="780" y="679" text-anchor="middle">detect language</text>

  <path class="return" d="M 891 765 L 650 765"/>
  <rect class="message-label" x="720" y="779" width="122" height="34"/>
  <rect class="label" x="720" y="717" width="122" height="34"/>
  <text class="message" x="781" y="739" text-anchor="middle">language score</text>

  <path class="call" d="M 659 825 L 1150 825"/>
  <rect class="message-label" x="835" y="839" width="138" height="34"/>
  <rect class="label" x="835" y="777" width="138" height="34"/>
  <text class="message" x="904" y="799" text-anchor="middle">parse + mask</text>

  <path class="return" d="M 1141 885 L 650 885"/>
  <rect class="message-label" x="828" y="899" width="154" height="34"/>
  <rect class="label" x="828" y="837" width="154" height="34"/>
  <text class="message" x="905" y="859" text-anchor="middle">masked matches</text>

  <path class="return" d="M 641 945 L 400 945"/>
  <rect class="message-label" x="460" y="959" width="140" height="34"/>
  <rect class="label" x="460" y="897" width="140" height="34"/>
  <text class="message" x="530" y="919" text-anchor="middle">200 response</text>

  <path class="return" d="M 391 1000 L 160 1000"/>
  <rect class="message-label" x="215" y="1014" width="128" height="34"/>
  <rect class="label" x="215" y="952" width="128" height="34"/>
  <text class="message" x="279" y="974" text-anchor="middle">masked JSON</text>
</svg>
