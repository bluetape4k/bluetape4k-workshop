<svg xmlns="http://www.w3.org/2000/svg" width="1625.641" height="900" viewBox="0 0 1625.641 900" role="img" aria-labelledby="title desc">
  <title id="title">AWS Storage Abstraction Architecture</title>
  <desc id="desc">Architecture diagram showing a Spring profile selected StorageService interface with local, S3, and S3 presigned implementations.</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="7" stdDeviation="7" flood-color="#18304a" flood-opacity="0.13"/>
    </filter>
    <marker id="arrow-blue" viewBox="0 0 9.3333 9.3333" markerWidth="14" markerHeight="14" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse" data-role="primary" data-tip-direction="positive-x">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#2f6de0" stroke-dasharray="none" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 9.3333 9.3333" markerWidth="14" markerHeight="14" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse" data-role="primary" data-tip-direction="positive-x">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#2f8b57" stroke-dasharray="none" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 9.3333 9.3333" markerWidth="14" markerHeight="14" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse" data-role="primary" data-tip-direction="positive-x">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#7953b6" stroke-dasharray="none" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      svg{background:#f6f8fb}
      .frame{fill:#ffffff;stroke:#d8e2ed;stroke-width:2}
      .title{font-family:"Architects Daughter";font-size:46px;fill:#142033}
      .subtitle,.detail,.mono,.chip{font-family:"Comic Mono";fill:#526274}
      .subtitle{font-size:17px}
      .layer{fill:#f9fbfd;stroke:#d8e2ed;stroke-width:1.8}
      .layerTitle{font-family:"Architects Daughter";font-size:28px;fill:#1b3048}
      .layerDetail{font-family:"Comic Mono";font-size:13px;fill:#5a6979}
      .card{stroke-width:2.2;filter:url(#shadow)}
      .cardTitle{font-family:"Architects Daughter";font-size:27px;fill:#142033}
      .smallTitle{font-family:"Architects Daughter";font-size:24px;fill:#142033}
      .detail{font-size:14px}
      .mono{font-size:13px;fill:#2e3f52}
      .chip{font-size:13px;fill:#223246}
      .edge{fill:none;stroke-width:3.8;stroke-linecap:round;stroke-linejoin:round}
      .note{fill:#ffffff;stroke:#d8e2ed;stroke-width:1.6}
    </style>
  </defs>

  <rect class="frame" x="32.513" y="26" width="1560.615" height="848" rx="24"/>
  <text id="titleText" class="title" x="812.821" y="82" text-anchor="middle">AWS Storage Abstraction</text>  <text class="subtitle" x="812.821" y="116" text-anchor="middle">One coroutine StorageService contract; Spring profiles select local files, S3, or presigned S3 URLs.</text>

  <g id="layers">
    <rect class="layer" x="84.533" y="155" width="338.133" height="590" rx="16"/>
    <text class="layerTitle" x="119.214" y="198">Application boundary</text>
    <text class="layerDetail" x="121.381" y="222">code depends on interface only</text>

    <rect class="layer" x="466.017" y="155" width="639.419" height="590" rx="16"/>
    <text class="layerTitle" x="500.697" y="198">Profile-selected services</text>  <text class="layerDetail" x="502.865" y="222">local, s3, or s3-presigned</text>

    <rect class="layer" x="1129.279" y="155" width="411.829" height="590" rx="16"/>
    <text class="layerTitle" x="1163.959" y="198">Storage target</text>  <text class="layerDetail" x="1166.126" y="222">filesystem or S3-compatible endpoint</text>
  </g>

  <g id="connections">
    <path class="edge" d="M 254.684 303 V 340" stroke="#2f6de0" marker-end="url(#arrow-blue)" stroke-linecap="round" stroke-linejoin="round"/>
    <path class="edge" d="M 381.484 380 H 520.205" stroke="#2f8b57" marker-end="url(#arrow-green)" stroke-linecap="round" stroke-linejoin="round"/>
    <path class="edge" d="M 381.484 487 H 520.205" stroke="#2f6de0" marker-end="url(#arrow-blue)" stroke-linecap="round" stroke-linejoin="round"/>
    <path class="edge" d="M 381.484 594 H 520.205" stroke="#7953b6" marker-end="url(#arrow-purple)" stroke-linecap="round" stroke-linejoin="round"/>
    <path class="edge" d="M 1062.085 380 H 1192.137" stroke="#2f8b57" marker-end="url(#arrow-green)" stroke-linecap="round" stroke-linejoin="round"/>
    <path class="edge" d="M 1062.085 487 H 1192.137" stroke="#2f6de0" marker-end="url(#arrow-blue)" stroke-linecap="round" stroke-linejoin="round"/>
    <path class="edge" d="M 1062.085 594 H 1192.137" stroke="#7953b6" marker-end="url(#arrow-purple)" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <g id="application-cards">
    <rect class="card" x="119.884" y="240" width="306" height="63" rx="12" fill="#e8f3ff" stroke="#5b8def"/>
    <text class="smallTitle" x="300" y="268" text-anchor="middle">StorageApplication</text>
    <text class="detail" x="300" y="289" text-anchor="middle">Spring Boot entrypoint</text>

    <rect class="card" x="127.884" y="340" width="253.6" height="294" rx="14" fill="#e9f7f6" stroke="#45a7a1"/>
    <text class="cardTitle" x="254.684" y="381" text-anchor="middle">StorageService</text>
    <text class="detail" x="254.684" y="415" text-anchor="middle">upload(key, bytes, type)</text>
    <text class="detail" x="254.684" y="442" text-anchor="middle">download(key)</text>
    <text class="detail" x="254.684" y="469" text-anchor="middle">getUrl(key)</text>
    <text class="detail" x="254.684" y="496" text-anchor="middle">delete(key)</text>
    <rect x="163.648" y="554" width="182.072" height="34" rx="17" fill="#ffffff" stroke="#9ccfd0"/>
    <text class="mono" x="254.684" y="575" text-anchor="middle">suspend functions</text>
  </g>

  <g id="implementation-cards">
    <rect class="card" x="520.205" y="332" width="541.88" height="96" rx="14" fill="#eaf7ef" stroke="#58a978"/>
    <text class="cardTitle" x="791.145" y="367" text-anchor="middle">LocalStorageService</text>
    <text class="detail" x="791.145" y="394" text-anchor="middle">java.nio.file.Files under storage.local.base-path</text>
    <text class="mono" x="791.145" y="414" text-anchor="middle">@Profile("local") - no Docker</text>

    <rect class="card" x="520.205" y="439" width="541.88" height="96" rx="14" fill="#e8f3ff" stroke="#5b8def"/>
    <text class="cardTitle" x="791.145" y="474" text-anchor="middle">S3StorageService</text>
    <text class="detail" x="791.145" y="501" text-anchor="middle">S3Client put/get/delete inside Dispatchers.IO</text>  <text class="mono" x="791.145" y="521" text-anchor="middle">@Profile("s3") - direct S3 URL</text>

    <rect class="card" x="520.205" y="546" width="541.88" height="96" rx="14" fill="#f1ecff" stroke="#8a72d6"/>
    <text class="cardTitle" x="791.145" y="581" text-anchor="middle">S3PresignedStorageService</text>
    <text class="detail" x="791.145" y="608" text-anchor="middle">S3Client plus S3Presigner for GET links</text>  <text class="mono" x="791.145" y="628" text-anchor="middle">@Profile("s3-presigned") - default 900s TTL</text>
  </g>

  <g id="target-cards">
    <rect class="card" x="1192.137" y="332" width="316.458" height="96" rx="14" fill="#fff7e6" stroke="#d6a441"/>
    <path d="M1132 373 h28 l10 10 v26 h-48 v-36 z" fill="#f5c762" stroke="#9d7621" stroke-width="2"/>
    <path d="M1132 373 v-12 h18 l8 12" fill="#ffe29a" stroke="#9d7621" stroke-width="2"/>
    <text class="smallTitle" x="1378.544" y="368" text-anchor="middle">Local filesystem</text>
    <text class="detail" x="1378.544" y="396" text-anchor="middle">file:// URL</text>
    <text class="detail" x="1378.544" y="416" text-anchor="middle">/tmp workshop storage</text>

    <rect class="card" x="1192.137" y="449" width="316.458" height="173" rx="14" fill="#eef8ef" stroke="#66a65d"/><image data-bluetape4k-icon="localstack" data-source="docs/icons/testcontainers/aws/localstack.svg" x="1206.1" y="466.0" width="30" height="30" href="data:image/svg+xml;base64," preserveAspectRatio="xMidYMid meet"/>  <text class="smallTitle" x="1391.549" y="489" text-anchor="middle">S3-compatible</text>
    <text class="smallTitle" x="1391.549" y="519" text-anchor="middle">bucket</text>
    <text class="detail" x="1391.549" y="548" text-anchor="middle">workshop bucket</text>
    <text class="detail" x="1391.549" y="574" text-anchor="middle">FlociServer in tests</text>  <text class="detail" x="1391.549" y="600" text-anchor="middle">AWS S3 in production</text>
    <text class="mono" x="1391.549" y="617" text-anchor="middle">X-Amz-Expires=900</text>
  </g>

  <g id="reader-note">
    <rect class="note" x="95.371" y="786" width="1434.899" height="52" rx="14"/>
    <text class="smallTitle" x="121.381" y="820">Reader cue</text>
    <text class="detail" x="281.778" y="819">Switch profiles to change the backend; application code keeps the same StorageService dependency and coroutine contract.</text>
  </g>
</svg>
