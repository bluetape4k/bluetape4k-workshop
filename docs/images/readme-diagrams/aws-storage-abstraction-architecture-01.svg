<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="580" viewBox="0 0 1060 580" role="img" aria-label="AWS Storage Abstraction Architecture">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#1f2937" flood-opacity="0.10"/></filter>
  <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth">
    <path d="M1,1 L8,4.5 L1,8 Z" fill="#758297"/>
  </marker>
  <style>
    .canvas{fill:#f7f9fc}.frame{fill:#fff;stroke:#d8e0ea;stroke-width:1.5}
    .title{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:40px;font-weight:400;fill:#102033}
    .subtitle{font-family:"Comic Mono","Comic Sans MS","Comic Sans","Comic Neue",cursive;font-size:14px;font-weight:400;fill:#536273}
    .label{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:25px;font-weight:400;fill:#102033}
    .smallLabel{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:21px;font-weight:400;fill:#102033}
    .tinyLabel{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:18px;font-weight:400;fill:#102033}
    .mono{font-family:"Comic Mono","Comic Sans MS","Comic Sans","Comic Neue",cursive;font-size:12px;font-weight:400;fill:#102033}
    .small{font-family:"Comic Mono","Comic Sans MS","Comic Sans","Comic Neue",cursive;font-size:12px;font-weight:400;fill:#536273}
    .card{stroke-width:2.1;filter:url(#shadow)}
    .line{stroke:#758297;stroke-width:2.1;fill:none;marker-end:url(#arrow)}
    .dashed{stroke:#758297;stroke-width:2.1;stroke-dasharray:7 6;fill:none;marker-end:url(#arrow)}
  </style>
</defs>
<rect class="canvas" width="1060" height="580"/>
<rect class="frame" x="24" y="20" width="1012" height="540" rx="28"/>
<text class="title" x="60" y="70">AWS Storage Abstraction Architecture</text>
<text class="subtitle" x="60" y="98">Spring Profiles - AWS SDK v2 - Coroutines - FlociServer (Testcontainers)</text>

<!-- Arrows drawn first so cards render on top -->
<!-- StorageApplication → StorageService (straight) -->
<path class="line" d="M530 172 L530 222"/>
<!-- StorageService → LocalStorageService (left) -->
<path class="line" d="M404 276 L404 302 L222 302 L222 328"/>
<!-- StorageService → S3StorageService (center straight) -->
<path class="line" d="M530 276 L530 328"/>
<!-- StorageService → S3PresignedStorageService (right) -->
<path class="line" d="M656 276 L656 302 L858 302 L858 328"/>
<!-- LocalStorageService → Local Filesystem (straight) -->
<path class="line" d="M222 396 L222 446"/>
<!-- S3StorageService → S3 Compatible Storage (straight) -->
<path class="line" d="M540 396 L540 446"/>
<!-- S3PresignedStorageService → S3 Compatible Storage (routes left to cx) -->
<path class="line" d="M858 396 L858 421 L726 421 L726 446"/>

<!-- StorageApplication -->
<g transform="translate(278,118)">
  <rect class="card" x="0" y="0" width="504" height="54" rx="12" fill="#E8F3FF" stroke="#5B8DEF"/>
  <text class="label" x="252" y="34" text-anchor="middle">StorageApplication</text>
</g>

<!-- StorageService interface -->
<g transform="translate(278,222)">
  <rect class="card" x="0" y="0" width="504" height="54" rx="12" fill="#E9F7F6" stroke="#45A7A1"/>
  <text class="smallLabel" x="252" y="21" text-anchor="middle">StorageService</text>
  <text class="small" x="252" y="41" text-anchor="middle">interface: upload - download - getUrl - delete</text>
</g>

<!-- LocalStorageService -->
<g transform="translate(82,328)">
  <rect class="card" x="0" y="0" width="280" height="68" rx="12" fill="#EAF7EF" stroke="#58A978"/>
  <text class="smallLabel" x="140" y="22" text-anchor="middle">LocalStorageService</text>
  <text class="small" x="140" y="40" text-anchor="middle">java.nio.file.Files</text>
  <text class="mono" x="140" y="57" text-anchor="middle">@Profile("local")</text>
</g>

<!-- S3StorageService -->
<g transform="translate(400,328)">
  <rect class="card" x="0" y="0" width="280" height="68" rx="12" fill="#E8F3FF" stroke="#5B8DEF"/>
  <text class="smallLabel" x="140" y="22" text-anchor="middle">S3StorageService</text>
  <text class="small" x="140" y="40" text-anchor="middle">S3Client - withContext(IO)</text>
  <text class="mono" x="140" y="57" text-anchor="middle">@Profile("s3")</text>
</g>

<!-- S3PresignedStorageService -->
<g transform="translate(718,328)">
  <rect class="card" x="0" y="0" width="280" height="68" rx="12" fill="#F1ECFF" stroke="#8A72D6"/>
  <text class="tinyLabel" x="140" y="19" text-anchor="middle">S3Presigned</text>
  <text class="tinyLabel" x="140" y="37" text-anchor="middle">StorageService</text>
  <text class="small" x="140" y="52" text-anchor="middle">S3Client - S3Presigner (15 min TTL)</text>
  <text class="mono" x="140" y="65" text-anchor="middle">@Profile("s3-presigned")</text>
</g>

<!-- Local Filesystem backend -->
<g transform="translate(82,446)">
  <rect class="card" x="0" y="0" width="280" height="64" rx="12" fill="#FFF3D9" stroke="#D6A441"/>
  <text class="smallLabel" x="140" y="22" text-anchor="middle">Local Filesystem</text>
  <text class="small" x="140" y="44" text-anchor="middle">java.nio.file.Files - /tmp - no Docker</text>
</g>

<!-- S3 Compatible Storage backend -->
<g transform="translate(454,446)">
  <rect class="card" x="0" y="0" width="544" height="64" rx="12" fill="#EAF7EF" stroke="#58A978"/>
  <text class="smallLabel" x="272" y="22" text-anchor="middle">S3 Compatible Storage</text>
  <text class="small" x="272" y="44" text-anchor="middle">FlociServer (Testcontainers) - AWS S3 (production)</text>
</g>
</svg>
