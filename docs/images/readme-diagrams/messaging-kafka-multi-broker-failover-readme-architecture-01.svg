<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1080" viewBox="0 0 1800 1080" role="img" aria-labelledby="title desc">
  <title id="title">Kafka Multi-Broker Failover Reference Architecture</title>
  <desc id="desc">A bounded JUnit harness drives explicit Kafka clients against three isolated KRaft brokers and writes redacted conformance evidence.</desc>
  <defs>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="124%"><feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#64748B" flood-opacity="0.13"/></filter>
    <style>
      .bg{fill:#F8FAFC}.title{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:42px;fill:#263238}.subtitle,.body,.small,.footer{font-family:"Comic Mono","SFMono-Regular",monospace;fill:#3E4C59}.subtitle{font-size:18px}.layer-title{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:28px;fill:#344154}.card-title{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:25px;fill:#16202A}.body{font-size:17px}.small{font-size:14px;fill:#5B6975}.footer{font-size:14px;fill:#60727D}.layer{stroke-width:2}.frame{fill:#FFF;stroke:#CAD6DF;stroke-width:2}.card{fill:#FFF;stroke:#9FB0BC;stroke-width:2}.blueLayer{fill:#EFF6FF;stroke:#A8C7EA}.greenLayer{fill:#F0F8F0;stroke:#B8D7AE}.amberLayer{fill:#FFF7E8;stroke:#DFC69A}.purpleLayer{fill:#F8F3FF;stroke:#D7C3EF}.blueCard{fill:#EFF6FF;stroke:#4F86C6}.greenCard{fill:#F0F8F0;stroke:#6E8F4F}.amberCard{fill:#FFF7E8;stroke:#9B7D54}.purpleCard{fill:#F8F3FF;stroke:#8065A8}.redCard{fill:#FFF0F0;stroke:#B86868}.connector{fill:none;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round}.blueEdge{stroke:#4F86C6;marker-end:url(#arrow-blue)}.greenEdge{stroke:#6E8F4F;marker-end:url(#arrow-green)}.amberEdge{stroke:#9B7D54;marker-end:url(#arrow-amber)}.purpleEdge{stroke:#8065A8;marker-end:url(#arrow-purple)}.redEdge{stroke:#B86868;marker-end:url(#arrow-red)}.tealEdge{stroke:#2D948C;marker-end:url(#arrow-teal)}.dashed{stroke-dasharray:9 7}.network{fill:#FFFFFF;stroke:#8EA7B8;stroke-width:2;stroke-dasharray:12 8}.badge{font-family:"Comic Mono","SFMono-Regular",monospace;font-size:13px;font-weight:700;fill:#3E4C59}
    </style>
    <marker id="arrow-blue" viewBox="0 0 10 10" markerWidth="14" markerHeight="14" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse" data-role="primary" data-tip-direction="positive-x"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#4F86C6" stroke="#4F86C6" stroke-width="0" stroke-dasharray="none"/></marker>
    <marker id="arrow-green" viewBox="0 0 10 10" markerWidth="14" markerHeight="14" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse" data-role="primary" data-tip-direction="positive-x"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#6E8F4F" stroke="#6E8F4F" stroke-width="0" stroke-dasharray="none"/></marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" markerWidth="14" markerHeight="14" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse" data-role="primary" data-tip-direction="positive-x"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#9B7D54" stroke="#9B7D54" stroke-width="0" stroke-dasharray="none"/></marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" markerWidth="14" markerHeight="14" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse" data-role="primary" data-tip-direction="positive-x"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#8065A8" stroke="#8065A8" stroke-width="0" stroke-dasharray="none"/></marker>
    <marker id="arrow-red" viewBox="0 0 10 10" markerWidth="14" markerHeight="14" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse" data-role="primary" data-tip-direction="positive-x"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#B86868" stroke="#B86868" stroke-width="0" stroke-dasharray="none"/></marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" markerWidth="14" markerHeight="14" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse" data-role="primary" data-tip-direction="positive-x"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#2D948C" stroke="#2D948C" stroke-width="0" stroke-dasharray="none"/></marker>
  </defs>
  <rect class="bg" width="1800" height="1080"/>
  <rect class="frame" x="30" y="25" width="1740" height="1030" rx="22"/>
  <text class="title" x="900" y="70" text-anchor="middle">Kafka Multi-Broker Failover - Bounded Reference</text>
  <text class="subtitle" x="900" y="105" text-anchor="middle">Explicit clients prove leader/coordinator movement, replacement ISR=3, and redacted 18-field evidence.</text>

  <rect class="layer blueLayer" x="75" y="145" width="1650" height="205" rx="22"/>
  <text class="layer-title" x="110" y="190">Test harness and contracts</text>
  <g class="node" data-node="harness" filter="url(#shadow)"><rect class="card blueCard" x="125" y="225" width="430" height="90" rx="16"/><text class="card-title" x="340" y="262" text-anchor="middle">Integration harness</text><text class="body" x="340" y="289" text-anchor="middle">JUnit 5 + bounded deadlines</text></g>
  <g class="node" data-node="clients" filter="url(#shadow)"><rect class="card blueCard" x="685" y="225" width="430" height="90" rx="16"/><text class="card-title" x="900" y="262" text-anchor="middle">Explicit Kafka clients</text><text class="body" x="900" y="289" text-anchor="middle">Admin / producer / consumer</text></g>
  <g class="node" data-node="contracts" filter="url(#shadow)"><rect class="card purpleCard" x="1245" y="225" width="430" height="90" rx="16"/><text class="card-title" x="1460" y="262" text-anchor="middle">Evidence contracts</text><text class="body" x="1460" y="289" text-anchor="middle">18 fields + black-box conformance</text></g>

  <rect class="layer greenLayer" x="75" y="390" width="1650" height="425" rx="22"/>
  <text class="layer-title" x="110" y="435">Isolated Docker network - three KRaft broker/controllers</text>
  <rect class="network" x="110" y="465" width="1580" height="345" rx="18"/>
  <text class="small" x="140" y="495">BROKER and CONTROLLER listeners stay inside this network; only random mapped loopback PLAINTEXT reaches the host.</text>
  <g class="node" data-node="broker-1" filter="url(#shadow)"><rect class="card greenCard" x="155" y="525" width="390" height="145" rx="16"/><text class="card-title" x="350" y="562" text-anchor="middle">Broker 1</text><text class="body" x="350" y="590" text-anchor="middle">node.id=1 / kafka-1</text><text class="small" x="350" y="616" text-anchor="middle">KRaft voter + PLAINTEXT</text><text class="small" x="350" y="640" text-anchor="middle">partition replica / ISR member</text></g>
  <g class="node" data-node="broker-2" filter="url(#shadow)"><rect class="card greenCard" x="705" y="525" width="390" height="145" rx="16"/><text class="card-title" x="900" y="562" text-anchor="middle">Broker 2</text><text class="body" x="900" y="590" text-anchor="middle">node.id=2 / kafka-2</text><text class="small" x="900" y="616" text-anchor="middle">KRaft voter + PLAINTEXT</text><text class="small" x="900" y="640" text-anchor="middle">partition replica / ISR member</text></g>
  <g class="node" data-node="broker-3" filter="url(#shadow)"><rect class="card greenCard" x="1255" y="525" width="390" height="145" rx="16"/><text class="card-title" x="1450" y="562" text-anchor="middle">Broker 3</text><text class="body" x="1450" y="590" text-anchor="middle">node.id=3 / kafka-3</text><text class="small" x="1450" y="616" text-anchor="middle">KRaft voter + PLAINTEXT</text><text class="small" x="1450" y="640" text-anchor="middle">partition replica / ISR member</text></g>
  <g class="node" data-node="topic" filter="url(#shadow)"><rect class="card amberCard" x="705" y="735" width="390" height="58" rx="14"/><text class="body" x="900" y="760" text-anchor="middle">kafka-failover-reference</text><text class="small" x="900" y="781" text-anchor="middle">3 partitions / RF=3 / min ISR=2</text></g>

  <g class="edge" data-edge="harness-&gt;clients" data-label="starts clients under deadlines"><path data-connector="harness-clients" class="connector blueEdge" d="M555 270 L685 270"/></g>
  <g class="edge" data-edge="clients-&gt;broker-1" data-label="host loopback client traffic"><path data-connector="clients-brokers" class="connector blueEdge" d="M760 315 L760 400 Q760 415 745 415 L335 415 Q320 415 320 430 L320 525"/></g>
  <g class="edge" data-edge="clients-&gt;broker-2" data-label="host loopback client traffic"><path data-connector="clients-broker-2" class="connector blueEdge" d="M900 315 L900 525"/></g>
  <g class="edge" data-edge="clients-&gt;broker-3" data-label="host loopback client traffic"><path data-connector="clients-broker-3" class="connector blueEdge" d="M1040 315 L1040 400 Q1040 415 1055 415 L1465 415 Q1480 415 1480 430 L1480 525"/></g>
  <g class="edge" data-edge="broker-1-&gt;topic" data-label="replica and ISR state"><path data-connector="broker-1-topic" class="connector greenEdge" d="M350 670 L350 685 Q350 695 365 695 L700 695 Q720 695 720 715 L720 735"/></g>
  <g class="edge" data-edge="broker-2-&gt;topic" data-label="replica and ISR state"><path data-connector="broker-2-topic" class="connector greenEdge" d="M900 670 L900 735"/></g>
  <g class="edge" data-edge="broker-3-&gt;topic" data-label="replica and ISR state"><path data-connector="broker-3-topic" class="connector greenEdge" d="M1450 670 L1450 685 Q1450 695 1435 695 L1100 695 Q1080 695 1080 715 L1080 735"/></g>

  <rect class="layer amberLayer" x="75" y="855" width="1650" height="145" rx="22"/>
  <text class="layer-title" x="110" y="900">Observable outcome</text>
  <g class="node" data-node="evidence" filter="url(#shadow)"><rect class="card amberCard" x="155" y="920" width="650" height="52" rx="14"/><text class="body" x="480" y="952" text-anchor="middle">run-scoped evidence.jsonl + performance.jsonl</text></g>
  <g class="node" data-node="conformance" filter="url(#shadow)"><rect class="card purpleCard" x="945" y="920" width="700" height="52" rx="14"/><text class="body" x="1295" y="952" text-anchor="middle">sanitizer + #559 black-box fixture + terminal PASS/FAIL</text></g>
  <g class="edge" data-edge="topic-&gt;evidence" data-label="bounded state observation"><path data-connector="topic-evidence" class="connector amberEdge" d="M900 793 L900 810 Q900 825 885 825 L480 825 Q465 825 465 840 L465 920"/></g>
  <g class="edge" data-edge="evidence-&gt;conformance" data-label="18-field contract validation"><path data-connector="evidence-conformance" class="connector purpleEdge" d="M805 946 L945 946"/></g>
  <text class="footer" x="900" y="1032" text-anchor="middle">No payload, event ID, bootstrap endpoint, credential, owner token, or raw provider log crosses the evidence boundary.</text>
</svg>
