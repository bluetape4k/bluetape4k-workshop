<rect class="frame" x="24" y="20" width="1222" height="1115" rx="18"/>
<text class="title" x="48" y="58">QueryDSL Predicate Query Sequence</text>
<text class="subtitle" x="50" y="84">MemberRepository.findAll(condition) → QueryDSL predicate → JPA/Hibernate → H2</text>
