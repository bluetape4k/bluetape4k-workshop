<svg xmlns="http://www.w3.org/2000/svg" width="960" height="460" viewBox="0 0 960 460" role="img" aria-label="bluetape4k Workshop Overview">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#1f2937" flood-opacity="0.09"/></filter>
  <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth">
    <path d="M1,1 L8,4.5 L1,8 Z" fill="#758297"/>
  </marker>
  <style>
    .canvas{fill:#f7f9fc}.frame{fill:#fff;stroke:#d8e0ea;stroke-width:1.5}
    .title{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:38px;font-weight:400;fill:#102033}
    .subtitle{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:14px;font-weight:400;fill:#536273}
    .smallLabel{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:21px;font-weight:400;fill:#102033}
    .mono{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#102033}
    .small{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#536273}
    .card{stroke-width:2.1;filter:url(#shadow)}
    .line{stroke:#758297;stroke-width:2.1;fill:none;marker-end:url(#arrow)}
  </style>
</defs>
<rect class="canvas" width="960" height="460"/>
<rect class="frame" x="24" y="20" width="912" height="416" rx="20"/>

<!-- Title -->
<text class="title" x="48" y="66">bluetape4k Workshop</text>
<text class="subtitle" x="48" y="90">Kotlin 2.3 · Java 25 · Spring Boot 4 · bluetape4k 1.5</text>

<!-- 2x3 grid of module categories -->
<!-- Row 1 -->
<!-- Spring Boot -->
<rect class="card" x="36" y="108" width="280" height="96" rx="14" fill="#E8F3FF" stroke="#5B8DEF"/>
<text class="smallLabel" x="176" y="136" text-anchor="middle">Spring Boot</text>
<text class="small" x="176" y="157" text-anchor="middle">WebFlux · MVC · Cache</text>
<text class="small" x="176" y="175" text-anchor="middle">Resilience4j · Security</text>
<text class="small" x="176" y="193" text-anchor="middle">spring-boot/ · spring-security/</text>

<!-- Spring Data -->
<rect class="card" x="340" y="108" width="280" height="96" rx="14" fill="#EAF7EF" stroke="#58A978"/>
<text class="smallLabel" x="480" y="136" text-anchor="middle">Spring Data</text>
<text class="small" x="480" y="157" text-anchor="middle">R2DBC · JPA/QueryDSL</text>
<text class="small" x="480" y="175" text-anchor="middle">MongoDB · Elasticsearch</text>
<text class="small" x="480" y="193" text-anchor="middle">spring-data/ · exposed/</text>

<!-- Redis / Rate Limit -->
<rect class="card" x="644" y="108" width="280" height="96" rx="14" fill="#FFF3D9" stroke="#D6A441"/>
<text class="smallLabel" x="784" y="136" text-anchor="middle">Redis / RateLimit</text>
<text class="small" x="784" y="157" text-anchor="middle">Redisson · Cluster</text>
<text class="small" x="784" y="175" text-anchor="middle">Bucket4j · Caffeine</text>
<text class="small" x="784" y="193" text-anchor="middle">redis/ · ratelimit/</text>

<!-- Row 2 -->
<!-- Observability -->
<rect class="card" x="36" y="240" width="280" height="96" rx="14" fill="#FDECEF" stroke="#DC6B82"/>
<text class="smallLabel" x="176" y="268" text-anchor="middle">Observability</text>
<text class="small" x="176" y="289" text-anchor="middle">Micrometer Observation</text>
<text class="small" x="176" y="307" text-anchor="middle">Tracing · Coroutine spans</text>
<text class="small" x="176" y="325" text-anchor="middle">observability/</text>

<!-- Vertx / Virtual Threads -->
<rect class="card" x="340" y="240" width="280" height="96" rx="14" fill="#F1ECFF" stroke="#8A72D6"/>
<text class="smallLabel" x="480" y="268" text-anchor="middle">Vert.x / VThreads</text>
<text class="small" x="480" y="289" text-anchor="middle">Vert.x Coroutines · SQL Client</text>
<text class="small" x="480" y="307" text-anchor="middle">Virtual Threads + MVC/WebFlux</text>
<text class="small" x="480" y="325" text-anchor="middle">vertx/ · virtualthreads/</text>

<!-- Exposed / Gateway -->
<rect class="card" x="644" y="240" width="280" height="96" rx="14" fill="#E9F7F6" stroke="#45A7A1"/>
<text class="smallLabel" x="784" y="268" text-anchor="middle">Exposed / Gateway</text>
<text class="small" x="784" y="289" text-anchor="middle">JetBrains Exposed ORM</text>
<text class="small" x="784" y="307" text-anchor="middle">Spring Cloud Gateway</text>
<text class="small" x="784" y="325" text-anchor="middle">exposed/ · gateway/</text>

<!-- Bottom: shared stack -->
<rect class="card" x="36" y="368" width="886" height="48" rx="14" fill="#f1f5f9" stroke="#b0bbca"/>
<text class="small" x="479" y="387" text-anchor="middle" font-style="italic">Shared: bluetape4k-logging · bluetape4k-junit5 · bluetape4k-coroutines · bluetape4k-testcontainers · Kotlin 2.3 · Java 25</text>
<text class="small" x="479" y="406" text-anchor="middle" font-style="italic">Tests: JUnit 5 · MockK · Testcontainers · ZGC · -Xms2G -Xmx4G</text>
</svg>
