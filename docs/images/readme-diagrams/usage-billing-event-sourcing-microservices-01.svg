<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="950" viewBox="0 0 1600 950" role="img" aria-labelledby="title desc"><title id="title">Microservice Extraction Guide</title><desc id="desc">Separate database ownership and versioned events replace shared tables; no XA and no broker exactly-once claim.</desc><defs><filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#64748B" flood-opacity="0.14"/></filter><marker id="seq-blue" viewBox="0 0 10 10" markerWidth="14" markerHeight="14" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#4F86C6" stroke="#4F86C6" stroke-dasharray="none"/></marker><marker id="seq-green" viewBox="0 0 10 10" markerWidth="14" markerHeight="14" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#6E8F4F" stroke="#6E8F4F" stroke-dasharray="none"/></marker><marker id="seq-amber" viewBox="0 0 10 10" markerWidth="14" markerHeight="14" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#9B7D54" stroke="#9B7D54" stroke-dasharray="none"/></marker><marker id="seq-red" viewBox="0 0 10 10" markerWidth="14" markerHeight="14" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#B86868" stroke="#B86868" stroke-dasharray="none"/></marker><marker id="seq-purple" viewBox="0 0 10 10" markerWidth="14" markerHeight="14" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#8065A8" stroke="#8065A8" stroke-dasharray="none"/></marker><marker id="seq-teal" viewBox="0 0 10 10" markerWidth="14" markerHeight="14" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#2D948C" stroke="#2D948C" stroke-dasharray="none"/></marker><style>
  .bg{fill:#F8FAFC}.frame{fill:#FFF;stroke:#CAD6DF;stroke-width:2}.alt{fill:none;stroke:#DFC69A;stroke-width:2}.zone{stroke-width:2}.blueZone{fill:#EFF6FF;stroke:#A8C7EA}.greenZone{fill:#F0F8F0;stroke:#B8D7AE}.purpleZone{fill:#F8F3FF;stroke:#D7C3EF}.amberZone{fill:#FFF7E8;stroke:#DFC69A}.title{font-family:"Architects Daughter";font-size:40px;fill:#263238}.subtitle,.body,.small,.msg,.footer{font-family:"Comic Mono";fill:#3E4C59}.subtitle{font-size:17px}.zoneTitle{font-family:"Architects Daughter";font-size:25px;fill:#344154}.cardTitle,.participant{font-family:"Architects Daughter";font-size:22px;fill:#16202A}.body{font-size:15px}.small{font-size:13px;fill:#5B6975}.footer{font-size:14px;fill:#60727D}.card{fill:#FFF;stroke:#9FB0BC;stroke-width:2}.blueCard{fill:#EFF6FF;stroke:#4F86C6}.greenCard{fill:#F0F8F0;stroke:#6E8F4F}.amberCard{fill:#FFF7E8;stroke:#9B7D54}.redCard{fill:#FFF0F0;stroke:#B86868}.purpleCard{fill:#F8F3FF;stroke:#8065A8}.edgePath{fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.blueEdge{stroke:#4F86C6;marker-end:url(#seq-blue)}.greenEdge{stroke:#6E8F4F;marker-end:url(#seq-green)}.amberEdge{stroke:#9B7D54;marker-end:url(#seq-amber)}.redEdge{stroke:#B86868;marker-end:url(#seq-red)}.purpleEdge{stroke:#8065A8;marker-end:url(#seq-purple)}.tealEdge{stroke:#2D948C;marker-end:url(#seq-teal)}.dashed{stroke-dasharray:9 7}.lifeline{stroke:#9AAAB1;stroke-width:2;stroke-dasharray:7 8}.activation{fill:#EAF6EF;stroke:#6F9278;stroke-width:1.5}.labelPill{fill:#FFF;stroke:#D7E0E4;stroke-width:1.5}.badge{font-family:"Comic Mono";font-size:13px;font-weight:700}.frameLabel{font-family:"Architects Daughter";font-size:18px;fill:#8B6A3E}
</style></defs><rect class="bg" width="1600" height="950"/><rect class="frame" x="28" y="24" width="1544" height="902" rx="22"/><text class="title" x="800" y="66" text-anchor="middle">Microservice Extraction Guide</text><text class="subtitle" x="800" y="98" text-anchor="middle">Separate database ownership and versioned events replace shared tables; no XA and no broker exactly-once claim.</text><rect class="zone greenZone" x="60" y="135" width="1480" height="580" rx="22"/><text class="zoneTitle" x="88" y="177">Service-owned authority</text><g class="node" data-node="meter" filter="url(#shadow)"><rect class="card blueCard" x="90" y="235" width="250" height="110" rx="15"/><text class="cardTitle" x="215" y="268" text-anchor="middle">Meter Service</text><text class="body" x="215" y="296" text-anchor="middle">meter + price streams</text><text class="body" x="215" y="318" text-anchor="middle">own PostgreSQL</text></g><g class="node" data-node="usage" filter="url(#shadow)"><rect class="card greenCard" x="390" y="235" width="250" height="110" rx="15"/><text class="cardTitle" x="515" y="268" text-anchor="middle">Usage Service</text><text class="body" x="515" y="296" text-anchor="middle">usage streams + inbox</text><text class="body" x="515" y="318" text-anchor="middle">own PostgreSQL</text></g><g class="node" data-node="billing" filter="url(#shadow)"><rect class="card purpleCard" x="690" y="235" width="250" height="110" rx="15"/><text class="cardTitle" x="815" y="268" text-anchor="middle">Billing Service</text><text class="body" x="815" y="296" text-anchor="middle">period + rating streams</text><text class="body" x="815" y="318" text-anchor="middle">own PostgreSQL</text></g><g class="node" data-node="invoice" filter="url(#shadow)"><rect class="card amberCard" x="990" y="235" width="250" height="110" rx="15"/><text class="cardTitle" x="1115" y="268" text-anchor="middle">Invoice Service</text><text class="body" x="1115" y="296" text-anchor="middle">invoice + adjustment</text><text class="body" x="1115" y="318" text-anchor="middle">own PostgreSQL</text></g><g class="node" data-node="projection" filter="url(#shadow)"><rect class="card greenCard" x="1290" y="235" width="220" height="110" rx="15"/><text class="cardTitle" x="1400" y="268" text-anchor="middle">Query Service</text><text class="body" x="1400" y="296" text-anchor="middle">generation views</text><text class="body" x="1400" y="318" text-anchor="middle">rebuildable DB</text></g><g class="node" data-node="kafka" filter="url(#shadow)"><rect class="card purpleCard" x="470" y="505" width="660" height="105" rx="15"/><text class="cardTitle" x="800" y="538" text-anchor="middle">Kafka event transport</text><text class="body" x="800" y="566" text-anchor="middle">transactional outbox → at-least-once → tenant/event inbox dedup</text><text class="body" x="800" y="588" text-anchor="middle">schema compatibility + replayable provenance</text></g><g class="edge" data-edge="meter-kafka" data-label="PriceActivated"><path data-connector="meter-kafka" class="edgePath blueEdge" d="M215 345 L215 530 Q 215 545 230 545 L470 545"/></g><g class="edge" data-edge="usage-kafka" data-label="UsageAccepted"><path data-connector="usage-kafka" class="edgePath greenEdge" d="M515 345 L515 505"/></g><g class="edge" data-edge="billing-kafka" data-label="UsageRated / Finalized"><path data-connector="billing-kafka" class="edgePath purpleEdge" d="M815 345 L815 505"/></g><g class="edge" data-edge="invoice-kafka" data-label="InvoiceIssued / Adjustment"><path data-connector="invoice-kafka" class="edgePath amberEdge" d="M1115 345 L1115 450 Q 1115 465 1100 465 L980 465 Q 965 465 965 505"/></g><g class="edge" data-edge="kafka-projection" data-label="consume with inbox dedup"><path data-connector="kafka-projection" class="edgePath greenEdge" d="M1130 555 L1240 555 Q 1255 555 1255 390 Q 1255 375 1270 375 L1385 375 Q 1400 375 1400 360 L1400 345"/></g><rect class="frame" x="180" y="755" width="1240" height="76" rx="14"/><text class="body" x="800" y="785" text-anchor="middle">No shared database • no distributed transaction • no claim of end-to-end exactly-once</text><text class="small" x="800" y="813" text-anchor="middle">Each service commits domain event + outbox locally; consumers make effects idempotent with inbox receipts.</text><text class="footer" x="800" y="880" text-anchor="middle">Follow-up boundary and failure analysis: GitHub issue #555.</text></svg>