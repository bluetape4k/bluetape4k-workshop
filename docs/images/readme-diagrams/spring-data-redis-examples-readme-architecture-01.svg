  <path class="line" d="M880 600 L880 765" stroke="#059669" marker-end="url(#arrow-green)" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="line" d="M 1365 600 L 1365 670 Q 1365 680 1355 680 L 1000 680 Q 990 680 990 690 L 990 765" stroke="#7c3aed" marker-end="url(#arrow-purple)" stroke-linecap="round" stroke-linejoin="round"/>
