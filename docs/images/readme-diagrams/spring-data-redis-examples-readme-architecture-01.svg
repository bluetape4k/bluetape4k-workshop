<svg xmlns="http://www.w3.org/2000/svg" width="1760" height="980" viewBox="0 0 1760 980">
  <defs>
    <style>
      .bg{fill:#f8fafc}.title{font-family:'Architects Daughter','Comic Sans MS',cursive;font-size:34px;fill:#18212f}
      .layer-title{font-family:'Architects Daughter','Comic Sans MS',cursive;font-size:26px;fill:#344154}
      .card-title{font-family:'Architects Daughter','Comic Sans MS',cursive;font-size:27px;fill:#101827}
      .body{font-family:'Comic Mono','Comic Sans MS',monospace;font-size:18px;fill:#364152}.small{font-family:'Comic Mono','Comic Sans MS',monospace;font-size:15px;fill:#475569}
      .layer{stroke-width:1.5;rx:22;ry:22}.card{fill:#fff;stroke:#cbd5e1;stroke-width:1.5;rx:18;ry:18}
      .line{fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}.redis{fill:#dc2626}.redis2{fill:#ef4444}.redis3{fill:#f87171}
    </style>
    <marker id="arrow-blue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L11,6 L1,11 Z" fill="#2563eb"/></marker>
    <marker id="arrow-green" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L11,6 L1,11 Z" fill="#059669"/></marker>
    <marker id="arrow-purple" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L11,6 L1,11 Z" fill="#7c3aed"/></marker>
  </defs>
  <rect class="bg" width="1760" height="980"/>
  <text class="title" x="70" y="70">Spring Data Redis Examples</text>

  <rect class="layer" x="70" y="120" width="1620" height="250" fill="#eff6ff" stroke="#bfdbfe"/>
  <text class="layer-title" x="105" y="165">Example areas</text>
  <rect class="card" x="125" y="205" width="330" height="105"/>
  <text class="card-title" x="155" y="245">Person repository</text>
  <text class="body" x="155" y="276">hash, index, reference</text>
  <rect class="card" x="515" y="205" width="330" height="105"/>
  <text class="card-title" x="545" y="245">Movie repository</text>
  <text class="body" x="545" y="276">movie, actor, relation</text>
  <rect class="card" x="905" y="205" width="330" height="105"/>
  <text class="card-title" x="935" y="245">Commands</text>
  <text class="body" x="935" y="276">key and geo operations</text>
  <rect class="card" x="1295" y="205" width="330" height="105"/>
  <text class="card-title" x="1325" y="245">Reactive + Streams</text>
  <text class="body" x="1325" y="276">reactive ops and stream tests</text>

  <rect class="layer" x="70" y="430" width="1620" height="220" fill="#f0fdf4" stroke="#bbf7d0"/>
  <text class="layer-title" x="105" y="475">Spring Data Redis APIs</text>
  <rect class="card" x="190" y="515" width="410" height="85"/>
  <text class="card-title" x="220" y="555">Redis repositories</text>
  <text class="body" x="220" y="582">CrudRepository + QBE</text>
  <rect class="card" x="675" y="515" width="410" height="85"/>
  <text class="card-title" x="705" y="555">Redis templates</text>
  <text class="body" x="705" y="582">sync and reactive operations</text>
  <rect class="card" x="1160" y="515" width="410" height="85"/>
  <text class="card-title" x="1190" y="555">Stream API</text>
  <text class="body" x="1190" y="582">consumer group tests</text>

  <rect class="layer" x="70" y="710" width="1620" height="170" fill="#fff7ed" stroke="#fed7aa"/>
  <text class="layer-title" x="105" y="755">Runtime</text>
  <rect class="card" x="645" y="765" width="470" height="80"/>
  <g transform="translate(690 785)">
    <rect class="redis3" x="0" y="26" width="58" height="18" rx="5"/>
    <rect class="redis2" x="0" y="13" width="58" height="18" rx="5"/>
    <rect class="redis" x="0" y="0" width="58" height="18" rx="5"/>
  </g>
  <text class="card-title" x="775" y="810">Redis Testcontainer</text>
  <text class="body" x="775" y="837">host/port from spring.data.redis</text>

  <path class="line" d="M290 310 L290 515" stroke="#2563eb" marker-end="url(#arrow-blue)"/>
  <path class="line" d="M680 310 L680 390 L395 390 L395 515" stroke="#2563eb" marker-end="url(#arrow-blue)"/>
  <path class="line" d="M1070 310 L1070 390 L880 390 L880 515" stroke="#059669" marker-end="url(#arrow-green)"/>
  <path class="line" d="M1460 310 L1460 515" stroke="#7c3aed" marker-end="url(#arrow-purple)"/>
  <path class="line" d="M395 600 L395 680 L770 680 L770 765" stroke="#2563eb" marker-end="url(#arrow-blue)"/>
  <path class="line" d="M880 600 L880 765" stroke="#059669" marker-end="url(#arrow-green)"/>
  <path class="line" d="M1365 600 L1365 680 L990 680 L990 765" stroke="#7c3aed" marker-end="url(#arrow-purple)"/>
</svg>
