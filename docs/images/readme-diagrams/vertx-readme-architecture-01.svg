<svg xmlns="http://www.w3.org/2000/svg" width="1580" height="780" viewBox="0 0 1580 780">
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .title { font-family: 'Architects Daughter', 'Comic Sans MS', cursive; font-size: 34px; fill: #172033; }
      .layer-title { font-family: 'Architects Daughter', 'Comic Sans MS', cursive; font-size: 26px; fill: #344154; }
      .card-title { font-family: 'Architects Daughter', 'Comic Sans MS', cursive; font-size: 27px; fill: #101827; }
      .body { font-family: 'Comic Mono', 'Comic Sans MS', monospace; font-size: 18px; fill: #364152; }
      .small { font-family: 'Comic Mono', 'Comic Sans MS', monospace; font-size: 16px; fill: #4b5563; }
      .layer { stroke-width: 1.5; rx: 24; ry: 24; }
      .card { fill: #fff; stroke: #cbd5e1; stroke-width: 1.5; rx: 18; ry: 18; }
      .line { fill: none; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#2563eb"/>
    </marker>
  </defs>
  <rect class="bg" width="1580" height="780"/>
  <text class="title" x="70" y="70">Vert.x Workshop Module Map</text>

  <rect class="layer" x="70" y="120" width="1440" height="290" fill="#eff6ff" stroke="#bfdbfe"/>
  <text class="layer-title" x="105" y="165">Choose the example by API surface</text>

  <rect class="card" x="130" y="220" width="390" height="120"/>
  <text class="card-title" x="165" y="260">coroutines</text>
  <text class="body" x="165" y="292">CoroutineVerticle HTTP service</text>
  <text class="small" x="165" y="318">routing, WebClient, H2/JDBC lookup</text>

  <rect class="card" x="595" y="220" width="390" height="120"/>
  <text class="card-title" x="630" y="260">vertx-sqlclient</text>
  <text class="body" x="630" y="292">SQL client examples</text>
  <text class="small" x="630" y="318">JDBC pool, templates, data objects</text>

  <rect class="card" x="1060" y="220" width="390" height="120"/>
  <text class="card-title" x="1095" y="260">vertx-webclient</text>
  <text class="body" x="1095" y="292">request and response examples</text>
  <text class="small" x="1095" y="318">response decoding, coroutine calls</text>

  <rect class="layer" x="70" y="475" width="1440" height="210" fill="#f0fdf4" stroke="#bbf7d0"/>
  <text class="layer-title" x="105" y="520">Shared Vert.x foundation</text>
  <rect class="card" x="185" y="565" width="330" height="70"/>
  <text class="body" x="220" y="607">Vert.x core + Kotlin APIs</text>
  <rect class="card" x="625" y="565" width="330" height="70"/>
  <text class="body" x="660" y="607">bluetape4k-vertx helpers</text>
  <rect class="card" x="1065" y="565" width="330" height="70"/>
  <text class="body" x="1100" y="607">JUnit 5 + Vert.x test support</text>

  <path class="line" d="M325 340 L325 565" stroke="#2563eb" marker-end="url(#arrow)"/>
  <path class="line" d="M790 340 L790 565" stroke="#2563eb" marker-end="url(#arrow)"/>
  <path class="line" d="M1255 340 L1255 565" stroke="#2563eb" marker-end="url(#arrow)"/>
</svg>
