<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="1180" viewBox="0 0 1680 1180" role="img" aria-labelledby="title desc">
  <title id="title">Tenant-Scoped Leader Scheduler Sequence</title>
  <desc id="desc">A logical tick selects tenants fairly, creates tenant-scoped lock names, executes or skips jobs based on lease state, handles stale handoff, and records bounded metrics.</desc>
  <defs>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#64748B" flood-opacity="0.14"/>
    </filter>
    <style>
      .title{font-family:"Architects Daughter";font-size:42px;fill:#263238}.subtitle,.message,.footer,.role{font-family:"Comic Mono";fill:#36464F}.subtitle{font-size:17px}.participant{font-family:"Architects Daughter";font-size:20px;fill:#1F3138}.role{font-size:12px;fill:#546A73}.message{font-size:13px}.footer{font-size:14px;fill:#60727D}.frame{fill:#FBFCF8;stroke:#41545D;stroke-width:3}.box{fill:#FFFFFF;stroke:#546E7A;stroke-width:2}.lifeline{stroke:#9AAAB1;stroke-width:2;stroke-dasharray:7 8;stroke-linecap:round}.activation{fill:#EAF6EF;stroke:#6F9278;stroke-width:1.5}.call,.return{fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.normal{stroke:#4F86C6;marker-end:url(#seq-blue)}.state{stroke:#2D948C;marker-end:url(#seq-teal)}.fair{stroke:#6E8F4F;marker-end:url(#seq-green)}.branchCall{stroke:#D08A39;marker-end:url(#seq-amber)}.failure{stroke:#B86868;stroke-dasharray:12 8;marker-end:url(#seq-red)}.return{stroke:#2D948C;stroke-width:2.6;stroke-dasharray:8 6;marker-end:url(#seq-teal)}.labelPill{fill:#FFFFFF;stroke:#D7E0E4;stroke-width:1.5}.blueLabel{stroke:#9CC2D1}.tealLabel{stroke:#9DCBC6}.greenLabel{stroke:#B6C9A4}.amberLabel{stroke:#D8B574}.redLabel{stroke:#D9ABAB}.badge{stroke-width:1.8}.blueBadge{fill:#EAF4F8;stroke:#4F86C6}.tealBadge{fill:#EBFAF8;stroke:#2D948C}.greenBadge{fill:#EEF7F0;stroke:#6E8F4F}.amberBadge{fill:#FFF7E8;stroke:#D08A39}.redBadge{fill:#FFF0F0;stroke:#B86868}.badgeText{font-family:"Comic Mono";font-size:12px;font-weight:700}.blueText{fill:#2F6F8E}.tealText{fill:#247C75}.greenText{fill:#55783F}.amberText{fill:#9A641F}.redText{fill:#9D4F4F}.alt{fill:none;stroke:#D08A39;stroke-width:2.2;stroke-dasharray:12 8}.divider{stroke:#D08A39;stroke-width:1.8;stroke-dasharray:9 7;opacity:.72}.branch{fill:#FFFFFF;stroke:#D08A39;stroke-width:1.6}.branchText{font-family:"Architects Daughter";font-size:18px;fill:#8A5A22}
    </style>
    <marker id="seq-blue" viewBox="0 0 10 10" markerWidth="16" markerHeight="16" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#4F86C6" stroke="#4F86C6" stroke-dasharray="none" style="stroke-dasharray:none" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="seq-teal" viewBox="0 0 10 10" markerWidth="16" markerHeight="16" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#2D948C" stroke="#2D948C" stroke-dasharray="none" style="stroke-dasharray:none" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="seq-green" viewBox="0 0 10 10" markerWidth="16" markerHeight="16" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#6E8F4F" stroke="#6E8F4F" stroke-dasharray="none" style="stroke-dasharray:none" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="seq-amber" viewBox="0 0 10 10" markerWidth="16" markerHeight="16" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#D08A39" stroke="#D08A39" stroke-dasharray="none" style="stroke-dasharray:none" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="seq-red" viewBox="0 0 10 10" markerWidth="16" markerHeight="16" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#B86868" stroke="#B86868" stroke-dasharray="none" style="stroke-dasharray:none" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect x="24" y="24" width="1632" height="1132" rx="20" class="frame"/>
  <text x="840" y="76" text-anchor="middle" class="title">Tenant-Scoped Leader Scheduler Sequence</text>
  <text x="840" y="108" text-anchor="middle" class="subtitle">A logical tick makes fairness, tenant lock names, stale handoff, and metric cardinality visible.</text>

  <g filter="url(#shadow)"><rect x="55" y="154" width="210" height="74" rx="10" class="box"/><text x="160" y="184" text-anchor="middle" class="participant">Logical Tick</text><text x="160" y="208" text-anchor="middle" class="role">scenario input</text></g>
  <g filter="url(#shadow)"><rect x="335" y="154" width="210" height="74" rx="10" class="box"/><text x="440" y="184" text-anchor="middle" class="participant">Fair Queue</text><text x="440" y="208" text-anchor="middle" class="role">lastSelectedTick</text></g>
  <g filter="url(#shadow)"><rect x="615" y="154" width="210" height="74" rx="10" class="box"/><text x="720" y="184" text-anchor="middle" class="participant">Scheduler Lab</text><text x="720" y="208" text-anchor="middle" class="role">pure reducer</text></g>
  <g filter="url(#shadow)"><rect x="895" y="154" width="210" height="74" rx="10" class="box"/><text x="1000" y="184" text-anchor="middle" class="participant">Tenant Lock</text><text x="1000" y="208" text-anchor="middle" class="role">namespace planner</text></g>
  <g filter="url(#shadow)"><rect x="1175" y="154" width="210" height="74" rx="10" class="box"/><text x="1280" y="184" text-anchor="middle" class="participant">Lease State</text><text x="1280" y="208" text-anchor="middle" class="role">owner window</text></g>
  <g filter="url(#shadow)"><rect x="1415" y="154" width="210" height="74" rx="10" class="box"/><text x="1520" y="184" text-anchor="middle" class="participant">Report</text><text x="1520" y="208" text-anchor="middle" class="role">events + meters</text></g>

  <line x1="160" y1="228" x2="160" y2="1068" class="lifeline"/>
  <line x1="440" y1="228" x2="440" y2="1068" class="lifeline"/>
  <line x1="720" y1="228" x2="720" y2="1068" class="lifeline"/>
  <line x1="1000" y1="228" x2="1000" y2="1068" class="lifeline"/>
  <line x1="1280" y1="228" x2="1280" y2="1068" class="lifeline"/>
  <line x1="1520" y1="228" x2="1520" y2="1068" class="lifeline"/>
  <rect class="activation" x="432" y="296" width="16" height="188" rx="6"/>
  <rect class="activation" x="712" y="376" width="16" height="548" rx="6"/>
  <rect class="activation" x="992" y="456" width="16" height="188" rx="6"/>
  <rect class="activation" x="1272" y="536" width="16" height="374" rx="6"/>
  <rect class="activation" x="1512" y="928" width="16" height="76" rx="6"/>

  <rect x="216" y="260" width="260" height="34" rx="17" class="labelPill blueLabel"/><circle cx="240" cy="277" r="13" class="badge blueBadge"/><text x="240" y="282" text-anchor="middle" class="badgeText num blueText">1</text><text x="264" y="282" class="message blueText">due tenants for tick</text><path data-connector="seq-1" d="M 160 326 L 440 326" class="call normal"/>
  <rect x="468" y="340" width="278" height="34" rx="17" class="labelPill greenLabel"/><circle cx="492" cy="357" r="13" class="badge greenBadge"/><text x="492" y="362" text-anchor="middle" class="badgeText num greenText">2</text><text x="516" y="362" class="message greenText">select oldest tenants</text><path data-connector="seq-2" d="M 440 406 L 720 406" class="call fair"/>
  <rect x="750" y="420" width="278" height="34" rx="17" class="labelPill blueLabel"/><circle cx="774" cy="437" r="13" class="badge blueBadge"/><text x="774" y="442" text-anchor="middle" class="badgeText num blueText">3</text><text x="798" y="442" class="message blueText">plan tenant lock name</text><path data-connector="seq-3" d="M 720 486 L 1000 486" class="call normal"/>
  <rect x="1030" y="500" width="278" height="34" rx="17" class="labelPill tealLabel"/><circle cx="1054" cy="517" r="13" class="badge tealBadge"/><text x="1054" y="522" text-anchor="middle" class="badgeText num tealText">4</text><text x="1078" y="522" class="message tealText">read active lease</text><path data-connector="seq-4" d="M 1000 566 L 1280 566" class="call state"/>
  <rect x="1002" y="580" width="306" height="34" rx="17" class="labelPill tealLabel"/><circle cx="1026" cy="597" r="13" class="badge tealBadge"/><text x="1026" y="602" text-anchor="middle" class="badgeText num tealText">5</text><text x="1050" y="602" class="message tealText">owned, skipped, or free</text><path data-connector="seq-5" d="M 1280 646 L 720 646" class="return"/>
  <rect x="748" y="660" width="296" height="34" rx="17" class="labelPill blueLabel"/><circle cx="772" cy="677" r="13" class="badge blueBadge"/><text x="772" y="682" text-anchor="middle" class="badgeText num blueText">6</text><text x="796" y="682" class="message blueText">execute or skip job</text><path data-connector="seq-6" d="M 720 726 L 1280 726" class="call normal"/>

  <rect x="78" y="790" width="1524" height="226" rx="16" class="alt"/>
  <rect x="116" y="774" width="248" height="32" rx="16" class="branch"/>
  <text x="240" y="796" text-anchor="middle" class="branchText">alt stale or failed action</text>
  <line x1="78" y1="894" x2="1602" y2="894" class="divider"/>
  <rect x="1008" y="806" width="342" height="34" rx="17" class="labelPill amberLabel"/><circle cx="1032" cy="823" r="13" class="badge amberBadge"/><text x="1032" y="828" text-anchor="middle" class="badgeText num amberText">7</text><text x="1056" y="828" class="message amberText">stale owner hands off lease</text><path data-connector="seq-7" d="M 720 872 L 1280 872" class="call branchCall"/>
  <rect x="1282" y="910" width="314" height="34" rx="17" class="labelPill redLabel"/><circle cx="1306" cy="927" r="13" class="badge redBadge"/><text x="1306" y="932" text-anchor="middle" class="badgeText num redText">8</text><text x="1330" y="932" class="message redText">record failure or handoff</text><path data-connector="seq-8" d="M 1280 976 L 1520 976" class="call failure"/>

  <rect x="96" y="1090" width="1488" height="34" rx="12" fill="#FFFFFF" stroke="#CCD7DA" stroke-width="2"/>
  <text x="840" y="1113" text-anchor="middle" class="footer">Reader contract: labels stay above call lines, arrowheads match line colors, and the alt body is transparent.</text>
</svg>
