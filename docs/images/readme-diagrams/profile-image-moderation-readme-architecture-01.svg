<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820">
<rect width="1400" height="820" fill="#FBF8EF"/>
<defs>
<style><![CDATA[
text{font-family:"Architects Daughter","Comic Mono";fill:#27364A}.title{font-size:34px;font-weight:700}.subtitle{font-size:17px;fill:#41516A;font-weight:700}.cardTitle{font-size:21px;font-weight:700}.cardText{font-size:14px;fill:#41516A;font-weight:700}.caption{font-size:14px;fill:#4F5F70;font-weight:700}.frame{fill:none;stroke:#D3C7B2;stroke-width:2.2;rx:28}.card{stroke:#6B7C93;stroke-width:2.2;rx:20}.blueCard{fill:#EEF6FF}.creamCard{fill:#FFFAF0}.greenCard{fill:#EEF8ED}.redCard{fill:#FFF0F0}.amberCard{fill:#FFF6E8}.blue{stroke:#4F86C6;stroke-width:4;fill:none;stroke-linecap:round}.green{stroke:#6D8C3F;stroke-width:4;fill:none;stroke-linecap:round}.red{stroke:#A65A5A;stroke-width:4;fill:none;stroke-linecap:round}.brown{stroke:#7F6038;stroke-width:4;fill:none;stroke-linecap:round;stroke-dasharray:10 8}.legend{font-size:14px;fill:#41516A;font-weight:700}
]]></style>
<marker id="arrow-blue" viewBox="0 0 10 10" markerWidth="14" markerHeight="14" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#4F86C6" stroke="#4F86C6" stroke-dasharray="none" style="stroke-dasharray:none"/></marker>
<marker id="arrow-green" viewBox="0 0 10 10" markerWidth="14" markerHeight="14" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#6D8C3F" stroke="#6D8C3F" stroke-dasharray="none" style="stroke-dasharray:none"/></marker>
<marker id="arrow-red" viewBox="0 0 10 10" markerWidth="14" markerHeight="14" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#A65A5A" stroke="#A65A5A" stroke-dasharray="none" style="stroke-dasharray:none"/></marker>
<marker id="arrow-brown" viewBox="0 0 10 10" markerWidth="14" markerHeight="14" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#7F6038" stroke="#7F6038" stroke-dasharray="none" style="stroke-dasharray:none"/></marker>
</defs>
<text x="70" y="64" class="title">Profile Image Moderation Architecture</text>
<text x="70" y="96" class="subtitle">S3-ready storage keeps originals private; bluetape4k-image policy rejects banned symbols/text before a profile URL becomes public.</text>
<rect class="frame" x="44" y="124" width="1312" height="590"/>

<g class="node" data-node="client"><rect class="card creamCard" x="74" y="235" width="210" height="122"/><text class="cardTitle" x="179" y="287" text-anchor="middle">Client</text><text class="cardText" x="179" y="319" text-anchor="middle">upload + poll</text></g>
<g class="node" data-node="api"><rect class="card creamCard" x="362" y="215" width="250" height="162"/><text class="cardTitle" x="487" y="271" text-anchor="middle">Spring MVC API</text><text class="cardText" x="487" y="304" text-anchor="middle">POST 202 / GET state</text><text class="cardText" x="487" y="330" text-anchor="middle">bounded coroutines</text></g>
<g class="node" data-node="storage"><rect class="card blueCard" x="706" y="205" width="276" height="182"/><text class="cardTitle" x="844" y="260" text-anchor="middle">S3-ready ImageStorage</text><text class="cardText" x="844" y="293" text-anchor="middle">local default, S3 in prod</text><text class="cardText" x="844" y="319" text-anchor="middle">private / pending / public keys</text></g>
<g class="node" data-node="moderation"><rect class="card amberCard" x="1066" y="210" width="250" height="172"/><text class="cardTitle" x="1191" y="265" text-anchor="middle">Moderation Adapter</text><text class="cardText" x="1191" y="298" text-anchor="middle">Rekognition + custom labels</text><text class="cardText" x="1191" y="324" text-anchor="middle">maps to bluetape4k policy</text></g>

<g class="node" data-node="state"><rect class="card greenCard" x="362" y="500" width="250" height="132"/><text class="cardTitle" x="487" y="552" text-anchor="middle">State Store</text><text class="cardText" x="487" y="584" text-anchor="middle">userId + uploadId CAS</text></g>
<g class="node" data-node="resolver"><rect class="card redCard" x="706" y="492" width="276" height="148"/><text class="cardTitle" x="844" y="546" text-anchor="middle">URL Resolver</text><text class="cardText" x="844" y="579" text-anchor="middle">deny private keys</text><text class="cardText" x="844" y="605" text-anchor="middle">default when rejected</text></g>
<g class="node" data-node="metrics"><rect class="card greenCard" x="1066" y="505" width="250" height="122"/><text class="cardTitle" x="1191" y="557" text-anchor="middle">Micrometer</text><text class="cardText" x="1191" y="589" text-anchor="middle">low-cardinality tags</text></g>

<path class="blue" data-connector="client-api" d="M284 296 L362 296" marker-end="url(#arrow-blue)"/>
<path class="blue" data-connector="api-storage" d="M612 296 L706 296" marker-end="url(#arrow-blue)"/>
<path class="brown" data-connector="storage-moderation" d="M982 296 L1066 296" marker-end="url(#arrow-brown)"/>
<path class="green" data-connector="storage-resolver" d="M844 387 L844 492" marker-end="url(#arrow-green)"/>
<path class="red" data-connector="moderation-resolver" d="M1191 382 L1191 434 Q 1191 456 1169 456 L928 456 Q 906 456 906 468 L906 492" marker-end="url(#arrow-red)"/>
<path class="green" data-connector="state-resolver" d="M612 566 L706 566" marker-end="url(#arrow-green)"/>
<path class="blue" data-connector="resolver-metrics" d="M982 566 L1066 566" marker-end="url(#arrow-blue)"/>

<text x="70" y="754" class="legend">Legend: blue upload/storage flow, brown external moderation adapter, green approved/current state, red rejected/default fallback.</text>
<text x="70" y="782" class="caption">Demo detector runs locally; production swaps in S3 object input plus Rekognition, Custom Labels, or OCR/text moderation.</text>
</svg>
