<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760"><rect width="1280" height="760" fill="#f7f3ea"/><defs><style><![CDATA[
text{font-family:"Architects Daughter","Comic Mono";fill:#27364a}.title{font-size:28px;font-weight:700}.subtitle{font-size:15px;fill:#41516a}.participant{font-size:15px;font-weight:700}.role{font-size:12px;fill:#66758a}.nodeTitle{font-size:18px;font-weight:700}.nodeText{font-size:13px;fill:#41516a}.node rect,.box{stroke:#6b7c93;stroke-width:2;rx:18}.frame{fill:none;stroke:#d3c7b2;stroke-width:2;rx:24}.lifeline{stroke:#b7c1cf;stroke-width:2;stroke-dasharray:7 9}.activation{fill:#fffaf0;stroke:#8a98aa;stroke-width:1.6;rx:5}.labelPill,.pill{fill:#fffaf0;stroke:#8a98aa;stroke-width:1.4;rx:12}.num{font-size:12px;font-weight:700}.message{font-size:13px}.alt{fill:none;stroke:#a86f2a;stroke-width:2;stroke-dasharray:8 8;rx:18}.branchDivider{stroke:#a86f2a;stroke-width:1.5;stroke-dasharray:6 8}.call{stroke:#4f86c6;stroke-width:4;fill:none;stroke-linecap:round}.return{stroke:#6d8c3f;stroke-width:4;fill:none;stroke-linecap:round}.error{stroke:#a65a5a;stroke-width:4;fill:none;stroke-linecap:round}
]]></style>
<marker id="seqArrow-blue" viewBox="0 0 10 10" markerWidth="16" markerHeight="16" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#4f86c6" stroke="#4f86c6" stroke-dasharray="none" style="stroke-dasharray:none"/></marker>
<marker id="seqArrow-green" viewBox="0 0 10 10" markerWidth="16" markerHeight="16" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#6d8c3f" stroke="#6d8c3f" stroke-dasharray="none" style="stroke-dasharray:none"/></marker>
<marker id="seqArrow-red" viewBox="0 0 10 10" markerWidth="16" markerHeight="16" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#a65a5a" stroke="#a65a5a" stroke-dasharray="none" style="stroke-dasharray:none"/></marker></defs><rect class="frame" x="40" y="105" width="1200" height="560"/><text x="60" y="62" class="title">Profile Image Moderation Architecture</text><text x="60" y="90" class="subtitle">Private originals stay hidden; pending blur is temporary; approval is the only public profile image.</text><g class="node" data-node="client"><rect class="card" x="70" y="170" width="210" height="110" fill="#fffaf0"/><text x="100" y="215" class="nodeTitle">Client</text><text x="100" y="246" class="nodeText">Upload + poll</text></g><g class="node" data-node="api"><rect class="card" x="360" y="150" width="250" height="150" fill="#fffaf0"/><text x="390" y="195" class="nodeTitle">Spring MVC API</text><text x="390" y="226" class="nodeText">POST 202 / GET state</text></g><g class="node" data-node="storage"><rect class="card" x="710" y="135" width="260" height="170" fill="#eef6ff"/><text x="740" y="180" class="nodeTitle">ImageStorage</text><text x="740" y="211" class="nodeText">private, pending, public</text></g><g class="node" data-node="moderator"><rect class="card" x="1030" y="165" width="190" height="120" fill="#fff3e6"/><text x="1060" y="210" class="nodeTitle">Fake Moderator</text><text x="1060" y="241" class="nodeText">1s local decision</text></g><g class="node" data-node="state"><rect class="card" x="360" y="420" width="250" height="130" fill="#eef8ed"/><text x="390" y="465" class="nodeTitle">State Store</text><text x="390" y="496" class="nodeText">userId + uploadId CAS</text></g><g class="node" data-node="resolver"><rect class="card" x="710" y="420" width="260" height="130" fill="#fff0f0"/><text x="740" y="465" class="nodeTitle">URL Resolver</text><text x="740" y="496" class="nodeText">deny private keys</text></g><g class="node" data-node="metrics"><rect class="card" x="1030" y="430" width="190" height="110" fill="#eef8ed"/><text x="1060" y="475" class="nodeTitle">Micrometer</text><text x="1060" y="506" class="nodeText">low-cardinality tags</text></g><g class="edge" data-edge="client-&gt;api" data-label="upload"><path data-connector="client-api" d="M280 225 L360 225" stroke="#4f86c6" stroke-width="4" fill="none" stroke-linecap="round" marker-end="url(#seqArrow-blue)"/></g><g class="edge" data-edge="api-&gt;storage" data-label="store objects"><path data-connector="api-storage" d="M610 225 L710 225" stroke="#4f86c6" stroke-width="4" fill="none" stroke-linecap="round" marker-end="url(#seqArrow-blue)"/></g><g class="edge" data-edge="storage-&gt;moderator" data-label="moderate"><path data-connector="storage-moderator" d="M970 225 L1030 225" stroke="#4f86c6" stroke-width="4" fill="none" stroke-linecap="round" marker-end="url(#seqArrow-blue)"/></g><g class="edge" data-edge="moderator-&gt;resolver" data-label="reject fallback"><path data-connector="moderator-resolver" d="M1125 285 L1125 340 Q 1125 360 1105 360 L920 360 Q 900 360 900 380 L900 420" stroke="#a65a5a" stroke-width="4" fill="none" stroke-linecap="round" marker-end="url(#seqArrow-red)"/></g><g class="edge" data-edge="storage-&gt;resolver" data-label="approved key"><path data-connector="storage-resolver" d="M840 305 L840 420" stroke="#6d8c3f" stroke-width="4" fill="none" stroke-linecap="round" marker-end="url(#seqArrow-green)"/></g><g class="edge" data-edge="state-&gt;resolver" data-label="current state"><path data-connector="state-resolver" d="M610 485 L710 485" stroke="#6d8c3f" stroke-width="4" fill="none" stroke-linecap="round" marker-end="url(#seqArrow-green)"/></g><g class="edge" data-edge="resolver-&gt;metrics" data-label="emit meters"><path data-connector="resolver-metrics" d="M970 485 L1030 485" stroke="#4f86c6" stroke-width="4" fill="none" stroke-linecap="round" marker-end="url(#seqArrow-blue)"/></g><text x="60" y="710" class="subtitle">Legend: blue upload/storage, green approved/public state, red rejected/default fallback.</text></svg>