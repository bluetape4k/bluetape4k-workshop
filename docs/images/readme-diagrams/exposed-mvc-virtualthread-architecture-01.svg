<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="860" viewBox="0 0 1200 860" role="img" aria-label="Exposed MVC Virtual Thread Architecture">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#1f2937" flood-opacity="0.10"/></filter>
  <marker id="arrow" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse">
    <path d="M2,2 L12,7 L2,12 Z" fill="#758297"/>
  </marker>
  <marker id="arrowOrange" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse">
    <path d="M2,2 L12,7 L2,12 Z" fill="#E67E22"/>
  </marker>
  <style>
    .canvas{fill:#f7f9fc}.frame{fill:#fff;stroke:#d8e0ea;stroke-width:1.5}
    .title{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:34px;fill:#102033}
    .subtitle{font-family:"Comic Sans MS","Comic Neue",Arial,sans-serif;font-size:15px;fill:#536273}
    .label{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:20px;fill:#102033}
    .mono{font-family:"Comic Sans MS","Comic Neue",Arial,sans-serif;font-size:13px;fill:#536273}
    .bandlabel{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:15px;fill:#758297}
    .card{stroke-width:2;filter:url(#shadow)}
    .line{stroke:#758297;stroke-width:2;fill:none;marker-end:url(#arrow)}
    .vtline{stroke:#E67E22;stroke-width:2;fill:none;marker-end:url(#arrowOrange);stroke-dasharray:6,3}
  </style>
</defs>
<rect class="canvas" width="1200" height="860"/>
<rect class="frame" x="28" y="24" width="1144" height="812" rx="20"/>

<text class="title" x="52" y="68">Exposed MVC Virtual Thread</text>
<text class="subtitle" x="52" y="92">Spring MVC + Virtual Threads + Exposed JDBC · No @Transactional</text>

<!-- Client -->
<g transform="translate(280,108)">
  <rect class="card" x="0" y="0" width="150" height="48" rx="12" fill="#E0ECFF" stroke="#4A7ADB"/>
  <text class="label" x="75" y="32" text-anchor="middle">HTTP Client</text>
</g>

<!-- Layer bands -->
<rect x="52" y="192" width="700" height="108" rx="8" fill="#E8F3FF" stroke="#B8D4F0" stroke-width="1"/>
<text class="bandlabel" x="66" y="212">Presentation</text>
<rect x="52" y="332" width="700" height="108" rx="8" fill="#EAF7EF" stroke="#B0DAC0" stroke-width="1"/>
<text class="bandlabel" x="66" y="352">Service</text>
<rect x="52" y="472" width="700" height="108" rx="8" fill="#F1ECFF" stroke="#C8B8E8" stroke-width="1"/>
<text class="bandlabel" x="66" y="492">Repository</text>
<rect x="52" y="612" width="700" height="108" rx="8" fill="#FFF3D9" stroke="#E8D5A0" stroke-width="1"/>
<text class="bandlabel" x="66" y="632">Schema</text>

<!-- VT Infrastructure panel -->
<rect x="800" y="192" width="340" height="248" rx="14" fill="#FFF5EB" stroke="#E8C5A0" stroke-width="1.2"/>
<text class="bandlabel" x="816" y="212" style="fill:#E67E22">Virtual Thread Infrastructure</text>

<g transform="translate(820,222)">
  <rect class="card" x="0" y="0" width="300" height="72" rx="12" fill="#FFF0E0" stroke="#E67E22"/>
  <text class="label" x="150" y="28" text-anchor="middle">TomcatConfig</text>
  <text class="mono" x="150" y="50" text-anchor="middle">ProtocolHandlerCustomizer</text>
</g>
<g transform="translate(820,332)">
  <rect class="card" x="0" y="0" width="300" height="72" rx="12" fill="#FFF0E0" stroke="#E67E22"/>
  <text class="label" x="150" y="28" text-anchor="middle">VT Executor</text>
  <text class="mono" x="150" y="50" text-anchor="middle">newVirtualThreadPerTaskExecutor</text>
</g>

<!-- Controllers -->
<g transform="translate(80,222)">
  <rect class="card" x="0" y="0" width="300" height="72" rx="12" fill="#E8F3FF" stroke="#5B8DEF"/>
  <text class="label" x="150" y="28" text-anchor="middle">AuthorController</text>
  <text class="mono" x="150" y="50" text-anchor="middle">@RestController</text>
</g>
<g transform="translate(420,222)">
  <rect class="card" x="0" y="0" width="300" height="72" rx="12" fill="#E8F3FF" stroke="#5B8DEF"/>
  <text class="label" x="150" y="28" text-anchor="middle">OrderController</text>
  <text class="mono" x="150" y="50" text-anchor="middle">@RestController</text>
</g>

<!-- Services -->
<g transform="translate(80,362)">
  <rect class="card" x="0" y="0" width="300" height="72" rx="12" fill="#EAF7EF" stroke="#58A978"/>
  <text class="label" x="150" y="28" text-anchor="middle">AuthorService</text>
  <text class="mono" x="150" y="50" text-anchor="middle">virtualFuture { transaction {} }</text>
</g>
<g transform="translate(420,362)">
  <rect class="card" x="0" y="0" width="300" height="72" rx="12" fill="#EAF7EF" stroke="#58A978"/>
  <text class="label" x="150" y="28" text-anchor="middle">OrderService</text>
  <text class="mono" x="150" y="50" text-anchor="middle">virtualFuture { transaction {} }</text>
</g>

<!-- Repositories -->
<g transform="translate(80,502)">
  <rect class="card" x="0" y="0" width="300" height="72" rx="12" fill="#F1ECFF" stroke="#8A72D6"/>
  <text class="label" x="150" y="28" text-anchor="middle">AuthorRepository</text>
  <text class="mono" x="150" y="50" text-anchor="middle">LongAuditableJdbcRepository</text>
</g>
<g transform="translate(420,502)">
  <rect class="card" x="0" y="0" width="300" height="72" rx="12" fill="#F1ECFF" stroke="#8A72D6"/>
  <text class="label" x="150" y="28" text-anchor="middle">OrderRepository</text>
  <text class="mono" x="150" y="50" text-anchor="middle">LongJdbcRepository</text>
</g>

<!-- Schema -->
<g transform="translate(80,642)">
  <rect class="card" x="0" y="0" width="300" height="72" rx="12" fill="#FFF3D9" stroke="#D6A441"/>
  <text class="label" x="150" y="28" text-anchor="middle">AuthorTable / BookTable</text>
  <text class="mono" x="150" y="50" text-anchor="middle">AuditableLongIdTable + LongIdTable</text>
</g>
<g transform="translate(420,642)">
  <rect class="card" x="0" y="0" width="300" height="72" rx="12" fill="#FFF3D9" stroke="#D6A441"/>
  <text class="label" x="150" y="28" text-anchor="middle">OrderTable / ProductTable</text>
  <text class="mono" x="150" y="50" text-anchor="middle">LongIdTable · FOR UPDATE</text>
</g>

<!-- Database -->
<g transform="translate(260,758)">
  <ellipse cx="130" cy="10" rx="130" ry="16" fill="#FDECEF" stroke="#DC6B82" stroke-width="2"/>
  <rect x="0" y="10" width="260" height="36" fill="#FDECEF" stroke="#DC6B82" stroke-width="2"/>
  <line x1="0" y1="10" x2="0" y2="46" stroke="#DC6B82" stroke-width="2"/>
  <line x1="260" y1="10" x2="260" y2="46" stroke="#DC6B82" stroke-width="2"/>
  <ellipse cx="130" cy="46" rx="130" ry="16" fill="#FDECEF" stroke="#DC6B82" stroke-width="2"/>
  <text class="label" x="130" y="42" text-anchor="middle">PostgreSQL</text>
</g>

<!-- ARROWS -->
<path class="line" d="M325,156 L325,178 L230,178 L230,220"/>
<path class="line" d="M385,156 L385,178 L570,178 L570,220"/>

<path class="line" d="M230,294 L230,360"/>
<path class="line" d="M570,294 L570,360"/>

<path class="line" d="M230,434 L230,500"/>
<path class="line" d="M570,434 L570,500"/>

<path class="line" d="M230,574 L230,640"/>
<path class="line" d="M570,574 L570,640"/>

<path class="line" d="M230,714 L230,740 L340,740 L340,756"/>
<path class="line" d="M570,714 L570,740 L440,740 L440,756"/>

<!-- VT Executor → Services (below services, enter from bottom) -->
<path class="vtline" d="M970,404 L970,452 L230,452 L230,436"/>
<path class="vtline" d="M970,404 L970,452 L570,452 L570,436"/>
<!-- TomcatConfig → VT Executor -->
<path class="vtline" d="M970,294 L970,330"/>
</svg>
