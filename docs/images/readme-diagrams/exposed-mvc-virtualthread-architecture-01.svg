<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="960" viewBox="0 0 1400 960" role="img" aria-label="Exposed MVC Virtual Thread Architecture">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#1f2937" flood-opacity="0.10"/></filter>
  <marker id="arrow" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse">
    <path d="M2,2 L12,7 L2,12 Z" fill="#758297"/>
  </marker>
  <marker id="arrowOrange" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse">
    <path d="M2,2 L12,7 L2,12 Z" fill="#E67E22"/>
  </marker>
  <marker id="arrowFK" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse">
    <path d="M2,2 L12,7 L2,12 Z" fill="#45A7A1"/>
  </marker>
  <style>
    .canvas{fill:#f7f9fc}.frame{fill:#fff;stroke:#d8e0ea;stroke-width:1.5}
    .title{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:34px;fill:#102033}
    .subtitle{font-family:"Comic Sans MS","Comic Neue",Arial,sans-serif;font-size:14px;fill:#536273}
    .label{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:18px;fill:#102033}
    .mono{font-family:"Comic Sans MS","Comic Neue",Arial,sans-serif;font-size:11px;fill:#536273}
    .bandlabel{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:14px;fill:#758297}
    .card{stroke-width:2;filter:url(#shadow)}
    .line{stroke:#758297;stroke-width:2;fill:none;marker-end:url(#arrow)}
    .vtline{stroke:#E67E22;stroke-width:2;fill:none;marker-end:url(#arrowOrange);stroke-dasharray:6,3}
    .fkline{stroke:#45A7A1;stroke-width:1.8;fill:none;marker-end:url(#arrowFK);stroke-dasharray:6,3}
  </style>
</defs>
<rect class="canvas" width="1400" height="960"/>
<rect class="frame" x="28" y="24" width="1344" height="912" rx="20"/>

<text class="title" x="52" y="68">Exposed MVC Virtual Thread</text>
<text class="subtitle" x="52" y="92">Spring MVC + Virtual Threads + Exposed JDBC · No @Transactional · virtualFuture { transaction {} }</text>

<!-- Client (below subtitle, no overlap with domain labels) -->
<g transform="translate(380,112)">
  <rect class="card" x="0" y="0" width="160" height="48" rx="12" fill="#E0ECFF" stroke="#4A7ADB"/>
  <text class="label" x="80" y="32" text-anchor="middle">HTTP Client</text>
</g>

<!-- Domain group labels (below client) -->
<rect x="52" y="186" width="550" height="18" rx="4" fill="#E8F3FF" stroke="none"/>
<text class="bandlabel" x="327" y="200" text-anchor="middle" style="fill:#5B8DEF">Author / Book Domain</text>
<rect x="618" y="186" width="480" height="18" rx="4" fill="#EAF7EF" stroke="none"/>
<text class="bandlabel" x="858" y="200" text-anchor="middle" style="fill:#58A978">Order / Product Domain</text>

<!--
  BOUNDING BOXES for crossing verification:
  Ctrl: AuthorCtrl x=72-312 y=222-290, BookCtrl x=332-572 y=222-290,
        OrderCtrl x=592-832 y=222-290, ProductCtrl x=852-1092 y=222-290
  Svc:  AuthorSvc x=72-552 y=362-430, OrderSvc x=592-1092 y=362-430
  Repo: AuthorRepo x=72-262 y=502-570, BookRepo x=278-468 y=502-570,
        OrderRepo x=484-674 y=502-570, OrderLineRepo x=690-880 y=502-570,
        ProductRepo x=896-1086 y=502-570
  Table: same x as repo, y=642-710
  VT panel: x=1110-1340, y=192-400
  Gaps: y=300-332 (Pres→Svc), y=440-472 (Svc→Repo), y=580-612 (Repo→Schema)
-->

<!-- ===== Layer 1: Presentation ===== -->
<rect x="52" y="212" width="1048" height="108" rx="8" fill="#E8F3FF" stroke="#B8D4F0" stroke-width="1"/>
<text class="bandlabel" x="66" y="232">Presentation</text>

<g transform="translate(72,242)">
  <rect class="card" x="0" y="0" width="240" height="68" rx="10" fill="#E8F3FF" stroke="#5B8DEF"/>
  <text class="label" x="120" y="26" text-anchor="middle">AuthorController</text>
  <text class="mono" x="120" y="46" text-anchor="middle">@RestController /api/v1/authors</text>
</g>
<g transform="translate(332,242)">
  <rect class="card" x="0" y="0" width="240" height="68" rx="10" fill="#E8F3FF" stroke="#5B8DEF"/>
  <text class="label" x="120" y="26" text-anchor="middle">BookController</text>
  <text class="mono" x="120" y="46" text-anchor="middle">@RestController /api/v1/books</text>
</g>
<g transform="translate(592,242)">
  <rect class="card" x="0" y="0" width="240" height="68" rx="10" fill="#E8F3FF" stroke="#5B8DEF"/>
  <text class="label" x="120" y="26" text-anchor="middle">OrderController</text>
  <text class="mono" x="120" y="46" text-anchor="middle">@RestController /api/v1/orders</text>
</g>
<g transform="translate(852,242)">
  <rect class="card" x="0" y="0" width="240" height="68" rx="10" fill="#E8F3FF" stroke="#5B8DEF"/>
  <text class="label" x="120" y="26" text-anchor="middle">ProductController</text>
  <text class="mono" x="120" y="46" text-anchor="middle">@RestController /api/v1/products</text>
</g>

<!-- ===== Layer 2: Service ===== -->
<rect x="52" y="352" width="1048" height="108" rx="8" fill="#EAF7EF" stroke="#B0DAC0" stroke-width="1"/>
<text class="bandlabel" x="66" y="372">Service</text>

<g transform="translate(72,382)">
  <rect class="card" x="0" y="0" width="480" height="68" rx="10" fill="#EAF7EF" stroke="#58A978"/>
  <text class="label" x="240" y="26" text-anchor="middle">AuthorService</text>
  <text class="mono" x="240" y="46" text-anchor="middle">virtualFuture(executor) { transaction(db) {} }</text>
</g>
<g transform="translate(592,382)">
  <rect class="card" x="0" y="0" width="500" height="68" rx="10" fill="#EAF7EF" stroke="#58A978"/>
  <text class="label" x="250" y="26" text-anchor="middle">OrderService</text>
  <text class="mono" x="250" y="46" text-anchor="middle">virtualFuture { transaction {} } · lock ordering · forUpdate</text>
</g>

<!-- ===== VT Infrastructure panel (right side) ===== -->
<rect x="1120" y="212" width="230" height="248" rx="14" fill="#FFF5EB" stroke="#E8C5A0" stroke-width="1.2"/>
<text class="bandlabel" x="1136" y="232" style="fill:#E67E22">Virtual Thread Infra</text>

<g transform="translate(1130,242)">
  <rect class="card" x="0" y="0" width="210" height="68" rx="10" fill="#FFF0E0" stroke="#E67E22"/>
  <text class="label" x="105" y="26" text-anchor="middle">TomcatConfig</text>
  <text class="mono" x="105" y="46" text-anchor="middle">ProtocolHandlerCustomizer</text>
</g>
<g transform="translate(1130,342)">
  <rect class="card" x="0" y="0" width="210" height="68" rx="10" fill="#FFF0E0" stroke="#E67E22"/>
  <text class="label" x="105" y="26" text-anchor="middle">VT Executor</text>
  <text class="mono" x="105" y="46" text-anchor="middle">newVirtualThreadPerTask</text>
</g>

<!-- ===== Layer 3: Repository ===== -->
<rect x="52" y="492" width="1048" height="108" rx="8" fill="#F1ECFF" stroke="#C8B8E8" stroke-width="1"/>
<text class="bandlabel" x="66" y="512">Repository</text>

<g transform="translate(72,522)">
  <rect class="card" x="0" y="0" width="190" height="68" rx="10" fill="#F1ECFF" stroke="#8A72D6"/>
  <text class="label" x="95" y="26" text-anchor="middle">AuthorRepository</text>
  <text class="mono" x="95" y="46" text-anchor="middle">VirtualFuture&lt;T&gt;</text>
</g>
<g transform="translate(278,522)">
  <rect class="card" x="0" y="0" width="190" height="68" rx="10" fill="#F1ECFF" stroke="#8A72D6"/>
  <text class="label" x="95" y="26" text-anchor="middle">BookRepository</text>
  <text class="mono" x="95" y="46" text-anchor="middle">VirtualFuture&lt;T&gt;</text>
</g>
<g transform="translate(484,522)">
  <rect class="card" x="0" y="0" width="190" height="68" rx="10" fill="#F1ECFF" stroke="#8A72D6"/>
  <text class="label" x="95" y="26" text-anchor="middle">OrderRepository</text>
  <text class="mono" x="95" y="46" text-anchor="middle">VirtualFuture&lt;T&gt;</text>
</g>
<g transform="translate(690,522)">
  <rect class="card" x="0" y="0" width="190" height="68" rx="10" fill="#F1ECFF" stroke="#8A72D6"/>
  <text class="label" x="95" y="26" text-anchor="middle">OrderLineRepo</text>
  <text class="mono" x="95" y="46" text-anchor="middle">VirtualFuture&lt;T&gt;</text>
</g>
<g transform="translate(896,522)">
  <rect class="card" x="0" y="0" width="190" height="68" rx="10" fill="#F1ECFF" stroke="#8A72D6"/>
  <text class="label" x="95" y="26" text-anchor="middle">ProductRepository</text>
  <text class="mono" x="95" y="46" text-anchor="middle">VirtualFuture&lt;T&gt; · forUpdate</text>
</g>

<!-- ===== Layer 4: Schema ===== -->
<rect x="52" y="632" width="1048" height="108" rx="8" fill="#FFF3D9" stroke="#E8D5A0" stroke-width="1"/>
<text class="bandlabel" x="66" y="652">Schema</text>

<g transform="translate(72,662)">
  <rect class="card" x="0" y="0" width="190" height="68" rx="10" fill="#FFF3D9" stroke="#D6A441"/>
  <text class="label" x="95" y="22" text-anchor="middle">AuthorTable</text>
  <text class="mono" x="95" y="42" text-anchor="middle">Table("authors")</text>
  <text class="mono" x="95" y="58" text-anchor="middle">id · name · email</text>
</g>
<g transform="translate(278,662)">
  <rect class="card" x="0" y="0" width="190" height="68" rx="10" fill="#FFF3D9" stroke="#D6A441"/>
  <text class="label" x="95" y="22" text-anchor="middle">BookTable</text>
  <text class="mono" x="95" y="42" text-anchor="middle">Table("books")</text>
  <text class="mono" x="95" y="58" text-anchor="middle">FK → Author</text>
</g>
<g transform="translate(484,662)">
  <rect class="card" x="0" y="0" width="190" height="68" rx="10" fill="#FFF3D9" stroke="#D6A441"/>
  <text class="label" x="95" y="22" text-anchor="middle">OrderTable</text>
  <text class="mono" x="95" y="42" text-anchor="middle">Table("orders")</text>
  <text class="mono" x="95" y="58" text-anchor="middle">status enum</text>
</g>
<g transform="translate(690,662)">
  <rect class="card" x="0" y="0" width="190" height="68" rx="10" fill="#FFF3D9" stroke="#D6A441"/>
  <text class="label" x="95" y="22" text-anchor="middle">OrderLineTable</text>
  <text class="mono" x="95" y="42" text-anchor="middle">Table("order_lines")</text>
  <text class="mono" x="95" y="58" text-anchor="middle">FK → Order, Product</text>
</g>
<g transform="translate(896,662)">
  <rect class="card" x="0" y="0" width="190" height="68" rx="10" fill="#FFF3D9" stroke="#D6A441"/>
  <text class="label" x="95" y="22" text-anchor="middle">ProductTable</text>
  <text class="mono" x="95" y="42" text-anchor="middle">Table("products")</text>
  <text class="mono" x="95" y="58" text-anchor="middle">stock + price</text>
</g>

<!-- ===== Database ===== -->
<g transform="translate(420,790)">
  <ellipse cx="140" cy="10" rx="140" ry="16" fill="#FDECEF" stroke="#DC6B82" stroke-width="2"/>
  <rect x="0" y="10" width="280" height="36" fill="#FDECEF" stroke="#DC6B82" stroke-width="2"/>
  <line x1="0" y1="10" x2="0" y2="46" stroke="#DC6B82" stroke-width="2"/>
  <line x1="280" y1="10" x2="280" y2="46" stroke="#DC6B82" stroke-width="2"/>
  <ellipse cx="140" cy="46" rx="140" ry="16" fill="#FDECEF" stroke="#DC6B82" stroke-width="2"/>
  <text class="label" x="140" y="42" text-anchor="middle">PostgreSQL</text>
</g>

