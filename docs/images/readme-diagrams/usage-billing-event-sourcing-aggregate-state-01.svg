<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="950" viewBox="0 0 1600 950" role="img" aria-labelledby="title desc"><title id="title">Aggregate State Diagram</title><desc id="desc">Each aggregate owns a small invariant; cross-stream history stays append-only.</desc><defs><filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#64748B" flood-opacity="0.14"/></filter><marker id="seq-blue" viewBox="0 0 10 10" markerWidth="14" markerHeight="14" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#4F86C6" stroke="#4F86C6" stroke-dasharray="none"/></marker><marker id="seq-green" viewBox="0 0 10 10" markerWidth="14" markerHeight="14" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#6E8F4F" stroke="#6E8F4F" stroke-dasharray="none"/></marker><marker id="seq-amber" viewBox="0 0 10 10" markerWidth="14" markerHeight="14" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#9B7D54" stroke="#9B7D54" stroke-dasharray="none"/></marker><marker id="seq-red" viewBox="0 0 10 10" markerWidth="14" markerHeight="14" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#B86868" stroke="#B86868" stroke-dasharray="none"/></marker><marker id="seq-purple" viewBox="0 0 10 10" markerWidth="14" markerHeight="14" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#8065A8" stroke="#8065A8" stroke-dasharray="none"/></marker><marker id="seq-teal" viewBox="0 0 10 10" markerWidth="14" markerHeight="14" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#2D948C" stroke="#2D948C" stroke-dasharray="none"/></marker><style>
  .bg{fill:#F8FAFC}.frame{fill:#FFF;stroke:#CAD6DF;stroke-width:2}.alt{fill:none;stroke:#DFC69A;stroke-width:2}.zone{stroke-width:2}.blueZone{fill:#EFF6FF;stroke:#A8C7EA}.greenZone{fill:#F0F8F0;stroke:#B8D7AE}.purpleZone{fill:#F8F3FF;stroke:#D7C3EF}.amberZone{fill:#FFF7E8;stroke:#DFC69A}.title{font-family:"Architects Daughter";font-size:40px;fill:#263238}.subtitle,.body,.small,.msg,.footer{font-family:"Comic Mono";fill:#3E4C59}.subtitle{font-size:17px}.zoneTitle{font-family:"Architects Daughter";font-size:25px;fill:#344154}.cardTitle,.participant{font-family:"Architects Daughter";font-size:22px;fill:#16202A}.body{font-size:15px}.small{font-size:13px;fill:#5B6975}.footer{font-size:14px;fill:#60727D}.card{fill:#FFF;stroke:#9FB0BC;stroke-width:2}.blueCard{fill:#EFF6FF;stroke:#4F86C6}.greenCard{fill:#F0F8F0;stroke:#6E8F4F}.amberCard{fill:#FFF7E8;stroke:#9B7D54}.redCard{fill:#FFF0F0;stroke:#B86868}.purpleCard{fill:#F8F3FF;stroke:#8065A8}.edgePath{fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.blueEdge{stroke:#4F86C6;marker-end:url(#seq-blue)}.greenEdge{stroke:#6E8F4F;marker-end:url(#seq-green)}.amberEdge{stroke:#9B7D54;marker-end:url(#seq-amber)}.redEdge{stroke:#B86868;marker-end:url(#seq-red)}.purpleEdge{stroke:#8065A8;marker-end:url(#seq-purple)}.tealEdge{stroke:#2D948C;marker-end:url(#seq-teal)}.dashed{stroke-dasharray:9 7}.lifeline{stroke:#9AAAB1;stroke-width:2;stroke-dasharray:7 8}.activation{fill:#EAF6EF;stroke:#6F9278;stroke-width:1.5}.labelPill{fill:#FFF;stroke:#D7E0E4;stroke-width:1.5}.badge{font-family:"Comic Mono";font-size:13px;font-weight:700}.frameLabel{font-family:"Architects Daughter";font-size:18px;fill:#8B6A3E}
</style></defs><rect class="bg" width="1600" height="950"/><rect class="frame" x="28" y="24" width="1544" height="902" rx="22"/><text class="title" x="800" y="66" text-anchor="middle">Aggregate State Diagram</text><text class="subtitle" x="800" y="98" text-anchor="middle">Each aggregate owns a small invariant; cross-stream history stays append-only.</text><rect class="zone greenZone" x="70" y="130" width="1460" height="690" rx="22"/><text class="zoneTitle" x="98" y="172">Allowed transitions</text><g class="node" data-node="meter-empty" filter="url(#shadow)"><rect class="card blueCard" x="110" y="215" width="220" height="86" rx="15"/><text class="cardTitle" x="220" y="248" text-anchor="middle">Meter.Empty</text><text class="body" x="220" y="276" text-anchor="middle">no price</text></g><g class="node" data-node="meter-active" filter="url(#shadow)"><rect class="card greenCard" x="430" y="215" width="250" height="86" rx="15"/><text class="cardTitle" x="555" y="248" text-anchor="middle">Meter.Active</text><text class="body" x="555" y="276" text-anchor="middle">append PriceActivated</text></g><g class="edge" data-edge="meter-register" data-label="MeterRegistered"><path data-connector="meter-register" class="edgePath greenEdge" d="M330 258 L430 258"/></g><g class="node" data-node="usage-empty" filter="url(#shadow)"><rect class="card blueCard" x="820" y="215" width="220" height="86" rx="15"/><text class="cardTitle" x="930" y="248" text-anchor="middle">Usage.Empty</text><text class="body" x="930" y="276" text-anchor="middle">source not seen</text></g><g class="node" data-node="usage-accepted" filter="url(#shadow)"><rect class="card greenCard" x="1140" y="215" width="250" height="86" rx="15"/><text class="cardTitle" x="1265" y="248" text-anchor="middle">Usage.Accepted</text><text class="body" x="1265" y="276" text-anchor="middle">terminal identity</text></g><g class="edge" data-edge="usage-accept" data-label="UsageAccepted"><path data-connector="usage-accept" class="edgePath greenEdge" d="M1040 258 L1140 258"/></g><g class="node" data-node="period-empty" filter="url(#shadow)"><rect class="card blueCard" x="110" y="405" width="220" height="86" rx="15"/><text class="cardTitle" x="220" y="438" text-anchor="middle">Period.Empty</text><text class="body" x="220" y="466" text-anchor="middle">not opened</text></g><g class="node" data-node="period-open" filter="url(#shadow)"><rect class="card greenCard" x="410" y="405" width="220" height="86" rx="15"/><text class="cardTitle" x="520" y="438" text-anchor="middle">Period.Open</text><text class="body" x="520" y="466" text-anchor="middle">accept usage</text></g><g class="node" data-node="period-closing" filter="url(#shadow)"><rect class="card amberCard" x="710" y="405" width="240" height="86" rx="15"/><text class="cardTitle" x="830" y="438" text-anchor="middle">Period.Closing</text><text class="body" x="830" y="466" text-anchor="middle">cursor + total</text></g><g class="node" data-node="period-final" filter="url(#shadow)"><rect class="card greenCard" x="1030" y="405" width="250" height="86" rx="15"/><text class="cardTitle" x="1155" y="438" text-anchor="middle">Period.Finalized</text><text class="body" x="1155" y="466" text-anchor="middle">terminal amount</text></g><g class="edge" data-edge="period-open-edge" data-label="BillingPeriodOpened"><path data-connector="period-open-edge" class="edgePath greenEdge" d="M330 448 L410 448"/></g><g class="edge" data-edge="period-close-edge" data-label="BillingCloseStarted"><path data-connector="period-close-edge" class="edgePath amberEdge" d="M630 448 L710 448"/></g><g class="edge" data-edge="period-final-edge" data-label="BillingPeriodFinalized"><path data-connector="period-final-edge" class="edgePath greenEdge" d="M950 448 L1030 448"/></g><g class="node" data-node="invoice-empty" filter="url(#shadow)"><rect class="card blueCard" x="110" y="605" width="220" height="86" rx="15"/><text class="cardTitle" x="220" y="638" text-anchor="middle">Invoice.Empty</text><text class="body" x="220" y="666" text-anchor="middle">not issued</text></g><g class="node" data-node="invoice-issued" filter="url(#shadow)"><rect class="card greenCard" x="430" y="605" width="250" height="86" rx="15"/><text class="cardTitle" x="555" y="638" text-anchor="middle">Invoice.Issued</text><text class="body" x="555" y="666" text-anchor="middle">terminal snapshot</text></g><g class="edge" data-edge="invoice-issue" data-label="InvoiceIssued"><path data-connector="invoice-issue" class="edgePath greenEdge" d="M330 648 L430 648"/></g><g class="node" data-node="adjust-empty" filter="url(#shadow)"><rect class="card blueCard" x="820" y="605" width="220" height="86" rx="15"/><text class="cardTitle" x="930" y="638" text-anchor="middle">Adjustment.Empty</text><text class="body" x="930" y="666" text-anchor="middle">no correction</text></g><g class="node" data-node="adjust-posted" filter="url(#shadow)"><rect class="card amberCard" x="1140" y="605" width="250" height="86" rx="15"/><text class="cardTitle" x="1265" y="638" text-anchor="middle">Adjustment.Posted</text><text class="body" x="1265" y="666" text-anchor="middle">DEBIT or CREDIT</text></g><g class="edge" data-edge="adjust-post" data-label="AdjustmentPosted"><path data-connector="adjust-post" class="edgePath amberEdge" d="M1040 648 L1140 648"/></g><rect class="frame" x="190" y="850" width="1220" height="48" rx="13"/><text class="body" x="800" y="881" text-anchor="middle">Forbidden: reopen finalized period, mutate invoice, overwrite usage, or edit an adjustment.</text></svg>