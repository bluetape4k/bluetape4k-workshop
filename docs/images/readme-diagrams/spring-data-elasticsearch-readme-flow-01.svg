<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="980" viewBox="0 0 1800 980">
  <defs>
    <style>
      .canvas { fill: #fbfcff; }
      .title { font-family: "Architects Daughter", "Comic Sans MS", cursive; font-size: 42px; fill: #102033; }
      .subtitle { font-family: "Comic Mono", "SFMono-Regular", monospace; font-size: 16px; fill: #536270; }
      .lane-title { font-family: "Architects Daughter", "Comic Sans MS", cursive; font-size: 28px; fill: #263445; }
      .card-title { font-family: "Architects Daughter", "Comic Sans MS", cursive; font-size: 26px; fill: #102033; }
      .card-small { font-family: "Comic Mono", "SFMono-Regular", monospace; font-size: 15px; fill: #394959; }
      .tiny { font-family: "Comic Mono", "SFMono-Regular", monospace; font-size: 13px; fill: #5b6978; }
      .lane-blue { fill: #eef6ff; stroke: #9cc8ff; }
      .lane-green { fill: #eefaf2; stroke: #9ad8ae; }
      .lane-orange { fill: #fff8eb; stroke: #ffc879; }
      .lane-red { fill: #fff1f0; stroke: #ffaaa3; }
      .card-blue { fill: #ffffff; stroke: #2f6df6; }
      .card-green { fill: #ffffff; stroke: #18964a; }
      .card-orange { fill: #ffffff; stroke: #f07d22; }
      .card-red { fill: #ffffff; stroke: #f04438; }
      .line-blue { fill: none; stroke: #2f6df6; stroke-width: 3.2; stroke-linecap: round; stroke-linejoin: round; }
      .line-green { fill: none; stroke: #18a558; stroke-width: 3.2; stroke-linecap: round; stroke-linejoin: round; }
      .line-orange { fill: none; stroke: #f07d22; stroke-width: 3.2; stroke-linecap: round; stroke-linejoin: round; }
      .line-red { fill: none; stroke: #f04438; stroke-width: 3.2; stroke-linecap: round; stroke-linejoin: round; }
    </style>
    <marker id="arrow-blue-flow" viewBox="0 0 14 14" refX="12" refY="7" markerWidth="12" markerHeight="12" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 1 1 L 13 7 L 1 13 Z" fill="#2f6df6"/>
    </marker>
    <marker id="arrow-green-flow" viewBox="0 0 14 14" refX="12" refY="7" markerWidth="12" markerHeight="12" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 1 1 L 13 7 L 1 13 Z" fill="#18a558"/>
    </marker>
    <marker id="arrow-orange-flow" viewBox="0 0 14 14" refX="12" refY="7" markerWidth="12" markerHeight="12" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 1 1 L 13 7 L 1 13 Z" fill="#f07d22"/>
    </marker>
    <marker id="arrow-red-flow" viewBox="0 0 14 14" refX="12" refY="7" markerWidth="12" markerHeight="12" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 1 1 L 13 7 L 1 13 Z" fill="#f04438"/>
    </marker>
  </defs>

  <rect class="canvas" x="0" y="0" width="1800" height="980"/>
  <rect x="24" y="24" width="1752" height="932" rx="22" fill="#ffffff" stroke="#d7e0eb" stroke-width="2"/>

  <text class="title" x="900" y="72" text-anchor="middle">Elasticsearch query paths</text>
  <text class="subtitle" x="900" y="102" text-anchor="middle">The tests compare repository methods, criteria queries, geo search, and reactive streams over one document index.</text>

  <rect class="lane-blue" x="80" y="150" width="1640" height="150" rx="18" stroke-width="2"/>
  <text class="lane-title" x="116" y="197">Startup data</text>
  <rect class="card-blue" x="330" y="198" width="290" height="72" rx="10" stroke-width="2"/>
  <text class="card-title" x="475" y="229" text-anchor="middle">PostConstruct</text>
  <text class="card-small" x="475" y="252" text-anchor="middle">build five Conference docs</text>
  <rect class="card-blue" x="760" y="198" width="290" height="72" rx="10" stroke-width="2"/>
  <text class="card-title" x="905" y="229" text-anchor="middle">repository.saveAll</text>
  <text class="card-small" x="905" y="252" text-anchor="middle">write sample documents</text>
  <rect class="card-red" x="1190" y="190" width="300" height="88" rx="10" stroke-width="2"/>
  <g transform="translate(1226 207) scale(0.72)">
    <circle cx="34" cy="34" r="30" fill="#00bfb3"/>
    <path d="M 17 36 A 18 18 0 0 1 52 30" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round"/>
    <path d="M 20 47 A 18 18 0 0 0 53 45" fill="none" stroke="#f2c94c" stroke-width="8" stroke-linecap="round"/>
    <circle cx="54" cy="31" r="8" fill="#343741"/>
  </g>
  <text class="card-title" x="1370" y="226" text-anchor="middle">conference-index</text>
  <text class="card-small" x="1370" y="251" text-anchor="middle">Elasticsearch OSS</text>
  <path class="line-blue" d="M 620 234 L 748 234" marker-end="url(#arrow-blue-flow)"/>
  <path class="line-red" d="M 1050 234 L 1178 234" marker-end="url(#arrow-red-flow)"/>

  <rect class="lane-green" x="80" y="340" width="1640" height="150" rx="18" stroke-width="2"/>
  <text class="lane-title" x="116" y="387">Repository search</text>
  <rect class="card-green" x="330" y="388" width="290" height="72" rx="10" stroke-width="2"/>
  <text class="card-title" x="475" y="419" text-anchor="middle">findAll()</text>
  <text class="card-small" x="475" y="442" text-anchor="middle">load all conferences</text>
  <rect class="card-green" x="760" y="388" width="290" height="72" rx="10" stroke-width="2"/>
  <text class="card-title" x="905" y="419" text-anchor="middle">findByName()</text>
  <text class="card-small" x="905" y="442" text-anchor="middle">derived query method</text>
  <rect class="card-green" x="1190" y="388" width="300" height="72" rx="10" stroke-width="2"/>
  <text class="card-title" x="1340" y="419" text-anchor="middle">assert documents</text>
  <text class="card-small" x="1340" y="442" text-anchor="middle">size and field mapping</text>
  <path class="line-green" d="M 620 424 L 748 424" marker-end="url(#arrow-green-flow)"/>
  <path class="line-green" d="M 1050 424 L 1178 424" marker-end="url(#arrow-green-flow)"/>

  <rect class="lane-orange" x="80" y="530" width="1640" height="150" rx="18" stroke-width="2"/>
  <text class="lane-title" x="116" y="577">Criteria search</text>
  <rect class="card-orange" x="330" y="578" width="290" height="72" rx="10" stroke-width="2"/>
  <text class="card-title" x="475" y="609" text-anchor="middle">CriteriaQuery</text>
  <text class="card-small" x="475" y="632" text-anchor="middle">keywords contains java</text>
  <rect class="card-orange" x="760" y="578" width="290" height="72" rx="10" stroke-width="2"/>
  <text class="card-title" x="905" y="609" text-anchor="middle">date and geo filters</text>
  <text class="card-small" x="905" y="632" text-anchor="middle">after date, within range</text>
  <rect class="card-orange" x="1190" y="578" width="300" height="72" rx="10" stroke-width="2"/>
  <text class="card-title" x="1340" y="609" text-anchor="middle">SearchHits</text>
  <text class="card-small" x="1340" y="632" text-anchor="middle">content is Conference</text>
  <path class="line-orange" d="M 620 614 L 748 614" marker-end="url(#arrow-orange-flow)"/>
  <path class="line-orange" d="M 1050 614 L 1178 614" marker-end="url(#arrow-orange-flow)"/>

  <rect class="lane-red" x="80" y="720" width="1640" height="150" rx="18" stroke-width="2"/>
  <text class="lane-title" x="116" y="767">Reactive comparison</text>
  <rect class="card-red" x="330" y="768" width="290" height="72" rx="10" stroke-width="2"/>
  <text class="card-title" x="475" y="799" text-anchor="middle">ReactiveRepository</text>
  <text class="card-small" x="475" y="822" text-anchor="middle">Flux&lt;Conference&gt;</text>
  <rect class="card-red" x="760" y="768" width="290" height="72" rx="10" stroke-width="2"/>
  <text class="card-title" x="905" y="799" text-anchor="middle">asFlow()</text>
  <text class="card-small" x="905" y="822" text-anchor="middle">Kotlin coroutine tests</text>
  <rect class="card-red" x="1190" y="768" width="300" height="72" rx="10" stroke-width="2"/>
  <text class="card-title" x="1340" y="799" text-anchor="middle">same assertions</text>
  <text class="card-small" x="1340" y="822" text-anchor="middle">disabled on Jackson mismatch</text>
  <path class="line-red" d="M 620 804 L 748 804" marker-end="url(#arrow-red-flow)"/>
  <path class="line-red" d="M 1050 804 L 1178 804" marker-end="url(#arrow-red-flow)"/>
</svg>
