    <text x="1563.0" y="186" text-anchor="middle" class="participant">pingpong</text>
    <text x="1563.0" y="211" text-anchor="middle" class="role">request topic</text></g>
  <line x1="1563.0" y1="232" x2="1563.0" y2="712" class="lifeline"/>
  <g filter="url(#shadow)"><rect x="1770.0" y="156" width="258" height="76" rx="10" class="header"/>
    <text x="1899.0" y="186" text-anchor="middle" class="participant">listenerContainer</text>
    <text x="1899.0" y="211" text-anchor="middle" class="role">group repliesGroup</text></g>
  <line x1="1899.0" y1="232" x2="1899.0" y2="712" class="lifeline"/>
  <g filter="url(#shadow)"><rect x="2106.0" y="156" width="258" height="76" rx="10" class="header"/>
    <text x="2235.0" y="186" text-anchor="middle" class="participant">PongHandler</text>
    <text x="2235.0" y="211" text-anchor="middle" class="role">@KafkaListener / returns pong</text></g>
  <line x1="2235.0" y1="232" x2="2235.0" y2="712" class="lifeline"/>
  <g filter="url(#shadow)"><rect x="2442.0" y="156" width="258" height="76" rx="10" class="header"/>
    <text x="2571.0" y="186" text-anchor="middle" class="participant">@SendTo</text>
    <text x="2571.0" y="211" text-anchor="middle" class="role">reply header</text></g>
