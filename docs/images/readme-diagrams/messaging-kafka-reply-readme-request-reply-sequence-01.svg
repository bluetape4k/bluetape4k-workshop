  <rect x="24" y="24" width="2742" height="752" rx="20" class="frame"/>
  <text id="titleText" x="1395.0" y="76" text-anchor="middle" class="title">ReplyingKafkaTemplate request-reply path</text>
  <text x="1395.0" y="106" text-anchor="middle" class="subtitle">The request goes through pingpong; the @SendTo reply returns through the dedicated replies listener container.</text>
  <g filter="url(#shadow)"><rect x="90.0" y="156" width="258" height="76" rx="10" class="header"/>
    <text x="219.0" y="186" text-anchor="middle" class="participant">GET /ping</text>
    <text x="219.0" y="211" text-anchor="middle" class="role">HTTP request</text></g>
  <line x1="219.0" y1="232" x2="219.0" y2="712" class="lifeline"/>
  <g filter="url(#shadow)"><rect x="426.0" y="156" width="258" height="76" rx="10" class="header"/>
    <text x="555.0" y="186" text-anchor="middle" class="participant">HTTP 200</text>
    <text x="555.0" y="211" text-anchor="middle" class="role">pong at timestamp</text></g>
  <line x1="555.0" y1="232" x2="555.0" y2="712" class="lifeline"/>
