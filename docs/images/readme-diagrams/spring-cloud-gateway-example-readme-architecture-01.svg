  <rect class="canvas" width="2045.029" height="940"/>
  <rect class="frame" x="26.674" y="24" width="1991.68" height="892" rx="26"/>
  <text class="title" x="1022.514" y="74" text-anchor="middle">Gateway routes and filter state</text>
  <text class="subtitle" x="1022.514" y="108" text-anchor="middle">Route predicates choose the path; filters rewrite, protect, rate-limit, or proxy before forwarding upstream.</text>

  <rect class="layer" x="93.36" y="154" width="1858.309" height="150" fill="#EFF6FF" stroke="#BFDBFE"/>
  <text class="layerTitle" x="137.817" y="198">Request predicates</text>
  <g filter="url(#shadow)"><rect x="177.829" y="220" width="277.857" height="62" rx="14" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.889"/><text class="cardTitle" x="316.757" y="258" text-anchor="middle">Path /get</text></g>
  <g filter="url(#shadow)"><rect x="577.943" y="220" width="311.2" height="62" rx="14" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.889"/><text class="cardTitle" x="733.543" y="258" text-anchor="middle">Host predicates</text></g>
  <g filter="url(#shadow)"><rect x="1022.514" y="220" width="333.429" height="62" rx="14" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.889"/><text class="cardTitle" x="1189.229" y="258" text-anchor="middle">Limited /anything</text></g>
  <g filter="url(#shadow)"><rect x="1500.429" y="220" width="277.857" height="62" rx="14" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.889"/><text class="cardTitle" x="1639.357" y="258" text-anchor="middle">WebSocket /echo</text></g>

  <rect class="layer" x="93.36" y="366" width="1858.309" height="200" fill="#F0FDF4" stroke="#BBF7D0"/>
  <text class="layerTitle" x="137.817" y="410">Gateway filter chain</text>
  <g filter="url(#shadow)"><rect x="172.271" y="448" width="311.2" height="82" rx="14" fill="#FFFFFF" stroke="#16A34A" stroke-width="1.889"/><text class="cardTitle" x="327.871" y="482" text-anchor="middle">PrefixPath</text>  <text class="cardText" x="327.871" y="508" text-anchor="middle">/httpbin</text></g>
  <g filter="url(#shadow)"><rect x="594.614" y="448" width="322.314" height="82" rx="14" fill="#FFFFFF" stroke="#16A34A" stroke-width="1.889"/><text class="cardTitle" x="755.771" y="482" text-anchor="middle">RewritePath</text><text class="cardText" x="755.771" y="508" text-anchor="middle">/foo/{segment}</text></g>
  <g filter="url(#shadow)"><rect x="1033.629" y="438" width="333.429" height="102" rx="14" fill="#FFFFFF" stroke="#16A34A" stroke-width="1.889"/><text class="cardTitle" x="1200.343" y="472" text-anchor="middle">CircuitBreaker</text><text class="cardText" x="1200.343" y="498" text-anchor="middle">slowcmd</text><text class="cardText" x="1200.343" y="522" text-anchor="middle">optional fallback URI</text></g>
  <g filter="url(#shadow)"><rect x="1489.314" y="438" width="311.2" height="102" rx="14" fill="#FFFFFF" stroke="#16A34A" stroke-width="1.889"/><text class="cardTitle" x="1644.914" y="472" text-anchor="middle">RequestRateLimiter</text><text class="cardText" x="1644.914" y="498" text-anchor="middle">UserKeyResolver</text><text class="cardText" x="1644.914" y="522" text-anchor="middle">X-BLUETAPE4K-UID</text></g>

  <rect class="layer" x="93.36" y="640" width="1858.309" height="160" fill="#FFF7ED" stroke="#FED7AA"/>
  <text class="layerTitle" x="137.817" y="684">Targets and state</text>
  <g filter="url(#shadow)"><rect x="188.943" y="716" width="333.429" height="58" rx="14" fill="#FFFFFF" stroke="#EA580C" stroke-width="1.889"/>  <text class="cardTitle" x="355.657" y="753" text-anchor="middle">nghttp2 httpbin</text></g>
  <g filter="url(#shadow)"><rect x="655.743" y="704" width="333.429" height="82" rx="14" fill="#FFFFFF" stroke="#EA580C" stroke-width="1.889"/><text class="cardTitle" x="822.457" y="738" text-anchor="middle">FallbackController</text><text class="cardText" x="822.457" y="764" text-anchor="middle">/circuitbreaker/fallback</text></g>
  <g filter="url(#shadow)">
    <rect x="1122.543" y="704" width="322.314" height="82" rx="14" fill="#FFFFFF" stroke="#DC2626" stroke-width="1.889"/><image data-bluetape4k-icon="redis" data-source="docs/icons/redis/redis-icon.svg" x="1136.5" y="715.0" width="30" height="30" href="data:image/svg+xml;base64," preserveAspectRatio="xMidYMid meet"/><text class="cardTitle" x="1322.6" y="738" text-anchor="middle">Redis</text><text class="cardText" x="1322.6" y="764" text-anchor="middle">rate-limit buckets</text>
  </g>
  <g filter="url(#shadow)"><rect x="1531.549" y="716" width="366.771" height="58" rx="14" fill="#FFFFFF" stroke="#EA580C" stroke-width="1.889"/><text class="cardTitle" x="1714.934" y="753" text-anchor="middle">ws://localhost:9000</text></g>

