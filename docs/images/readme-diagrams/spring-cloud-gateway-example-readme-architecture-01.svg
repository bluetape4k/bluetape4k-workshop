<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1840" height="940" viewBox="0 0 1840 940" role="img" aria-label="Spring Cloud Gateway route architecture">
  <defs>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="124%"><feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#64748B" flood-opacity="0.15"/></filter>
    <marker id="arrowBlue" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 14 7 L 0 14 Z" fill="#2563EB"/></marker>
    <marker id="arrowGreen" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 14 7 L 0 14 Z" fill="#16A34A"/></marker>
    <marker id="arrowOrange" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 14 7 L 0 14 Z" fill="#EA580C"/></marker>
    <style>
      .canvas{fill:#F8FAFC}.frame{fill:#FFFFFF;stroke:#D6E0E8;stroke-width:1.4}.layer{stroke-width:1.6;rx:24}
      .title{font-family:"Architects Daughter";font-size:42px;fill:#102033}.subtitle{font-family:"Comic Mono";font-size:16px;fill:#51606F}
      .layerTitle{font-family:"Architects Daughter";font-size:31px;fill:#243447}.cardTitle{font-family:"Architects Daughter";font-size:30px;fill:#102033}
      .cardText{font-family:"Comic Mono";font-size:15px;fill:#415166}.line{fill:none;stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round}
      .label{font-family:"Comic Mono";font-size:14px;fill:#334155}
    </style>
  </defs>
  <rect class="canvas" width="1840" height="940"/>
  <rect class="frame" x="24" y="24" width="1792" height="892" rx="26"/>
  <text class="title" x="920" y="74" text-anchor="middle">Gateway routes and filter state</text>
  <text class="subtitle" x="920" y="108" text-anchor="middle">Route predicates choose the path; filters rewrite, protect, rate-limit, or proxy before forwarding upstream.</text>

  <rect class="layer" x="84" y="154" width="1672" height="150" fill="#EFF6FF" stroke="#BFDBFE"/>
  <text class="layerTitle" x="124" y="198">Request predicates</text>
  <g filter="url(#shadow)"><rect x="160" y="220" width="250" height="62" rx="14" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.7"/><text class="cardTitle" x="285" y="258" text-anchor="middle">Path /get</text></g>
  <g filter="url(#shadow)"><rect x="520" y="220" width="280" height="62" rx="14" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.7"/><text class="cardTitle" x="660" y="258" text-anchor="middle">Host predicates</text></g>
  <g filter="url(#shadow)"><rect x="920" y="220" width="300" height="62" rx="14" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.7"/><text class="cardTitle" x="1070" y="258" text-anchor="middle">Limited /anything</text></g>
  <g filter="url(#shadow)"><rect x="1350" y="220" width="250" height="62" rx="14" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.7"/><text class="cardTitle" x="1475" y="258" text-anchor="middle">WebSocket /echo</text></g>

  <rect class="layer" x="84" y="366" width="1672" height="200" fill="#F0FDF4" stroke="#BBF7D0"/>
  <text class="layerTitle" x="124" y="410">Gateway filter chain</text>
  <g filter="url(#shadow)"><rect x="155" y="448" width="280" height="82" rx="14" fill="#FFFFFF" stroke="#16A34A" stroke-width="1.7"/><text class="cardTitle" x="295" y="482" text-anchor="middle">PrefixPath</text><text class="cardText" x="295" y="508" text-anchor="middle">/httpbin</text></g>
  <g filter="url(#shadow)"><rect x="535" y="448" width="290" height="82" rx="14" fill="#FFFFFF" stroke="#16A34A" stroke-width="1.7"/><text class="cardTitle" x="680" y="482" text-anchor="middle">RewritePath</text><text class="cardText" x="680" y="508" text-anchor="middle">/foo/{segment}</text></g>
  <g filter="url(#shadow)"><rect x="930" y="438" width="300" height="102" rx="14" fill="#FFFFFF" stroke="#16A34A" stroke-width="1.7"/><text class="cardTitle" x="1080" y="472" text-anchor="middle">CircuitBreaker</text><text class="cardText" x="1080" y="498" text-anchor="middle">slowcmd</text><text class="cardText" x="1080" y="522" text-anchor="middle">optional fallback URI</text></g>
  <g filter="url(#shadow)"><rect x="1340" y="438" width="280" height="102" rx="14" fill="#FFFFFF" stroke="#16A34A" stroke-width="1.7"/><text class="cardTitle" x="1480" y="472" text-anchor="middle">RequestRateLimiter</text><text class="cardText" x="1480" y="498" text-anchor="middle">UserKeyResolver</text><text class="cardText" x="1480" y="522" text-anchor="middle">X-BLUETAPE4K-UID</text></g>

  <rect class="layer" x="84" y="640" width="1672" height="160" fill="#FFF7ED" stroke="#FED7AA"/>
  <text class="layerTitle" x="124" y="684">Targets and state</text>
  <g filter="url(#shadow)"><rect x="170" y="716" width="300" height="58" rx="14" fill="#FFFFFF" stroke="#EA580C" stroke-width="1.7"/><text class="cardTitle" x="320" y="753" text-anchor="middle">nghttp2 httpbin</text></g>
  <g filter="url(#shadow)"><rect x="590" y="704" width="300" height="82" rx="14" fill="#FFFFFF" stroke="#EA580C" stroke-width="1.7"/><text class="cardTitle" x="740" y="738" text-anchor="middle">FallbackController</text><text class="cardText" x="740" y="764" text-anchor="middle">/circuitbreaker/fallback</text></g>
  <g filter="url(#shadow)">
    <rect x="1010" y="704" width="290" height="82" rx="14" fill="#FFFFFF" stroke="#DC2626" stroke-width="1.7"/>
    <g transform="translate(1040 724)"><path d="M 0 14 L 34 0 L 68 14 L 34 28 Z" fill="#DC2626"/><path d="M 0 28 L 34 14 L 68 28 L 34 42 Z" fill="#EF4444"/><path d="M 0 42 L 34 28 L 68 42 L 34 56 Z" fill="#F87171"/></g>
    <text class="cardTitle" x="1190" y="738" text-anchor="middle">Redis</text><text class="cardText" x="1190" y="764" text-anchor="middle">rate-limit buckets</text>
  </g>
  <g filter="url(#shadow)"><rect x="1378" y="716" width="330" height="58" rx="14" fill="#FFFFFF" stroke="#EA580C" stroke-width="1.7"/><text class="cardTitle" x="1543" y="753" text-anchor="middle">ws://localhost:9000</text></g>

  <path class="line" d="M 285 282 L 285 448" stroke="#2563EB" marker-end="url(#arrowBlue)"/>
  <path class="line" d="M 660 282 L 660 448" stroke="#2563EB" marker-end="url(#arrowBlue)"/>
  <path class="line" d="M 1070 282 L 1070 438" stroke="#2563EB" marker-end="url(#arrowBlue)"/>
  <path class="line" d="M 1475 282 L 1475 438" stroke="#2563EB" marker-end="url(#arrowBlue)"/>
  <path class="line" d="M 295 530 L 295 606 L 320 606 L 320 716" stroke="#16A34A" marker-end="url(#arrowGreen)"/>
  <path class="line" d="M 680 530 L 680 606 L 320 606" stroke="#16A34A"/>
  <path class="line" d="M 1080 540 L 1080 606 L 740 606 L 740 704" stroke="#EA580C" marker-end="url(#arrowOrange)"/>
  <text class="label" x="910" y="588" text-anchor="middle">fallback branch</text>
  <path class="line" d="M 1480 540 L 1480 606 L 1155 606 L 1155 704" stroke="#EA580C" marker-end="url(#arrowOrange)"/>
  <path class="line" d="M 1530 540 L 1530 690 L 1543 690 L 1543 716" stroke="#16A34A" marker-end="url(#arrowGreen)"/>
</svg>
