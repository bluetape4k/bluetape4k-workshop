  <text class="label" x="1011.4" y="588" text-anchor="middle">fallback branch</text>
  <path class="line" d="M 1644.914 540 L 1644.914 596 Q 1644.914 606 1633.8 606 L 1294.814 606 Q 1283.7 606 1283.7 616 L 1283.7 704" stroke="#EA580C" marker-end="url(#arrowOrange)" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="line" d="M 1700.486 540 L 1700.486 684.5 Q 1700.486 690 1706.599 690 L 1708.821 690 Q 1714.934 690 1714.934 695.5 L 1714.934 716" stroke="#16A34A" marker-end="url(#arrowGreen)" stroke-linecap="round" stroke-linejoin="round"/>
