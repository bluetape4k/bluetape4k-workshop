<svg xmlns="http://www.w3.org/2000/svg" width="960" height="500" viewBox="0 0 960 500" role="img" aria-label="Exposed DAO Web Transaction Sequence">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#1f2937" flood-opacity="0.10"/></filter>
  <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth">
    <path d="M1,1 L8,4.5 L1,8 Z" fill="#758297"/>
  </marker>
  <style>
    .canvas{fill:#f7f9fc}.frame{fill:#fff;stroke:#d8e0ea;stroke-width:1.5}
    .title{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:38px;font-weight:400;fill:#102033}
    .subtitle{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:14px;font-weight:400;fill:#536273}
    .smallLabel{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:21px;font-weight:400;fill:#102033}
    .mono{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#102033}
    .small{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#536273}
    .strong{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#102033}
    .card{stroke-width:2.1;filter:url(#shadow)}
    .lifeline{stroke:#b0bbca;stroke-width:1.5;stroke-dasharray:6 4;fill:none}
    .reqArrow{stroke:#5B8DEF;stroke-width:2.1;fill:none;marker-end:url(#arrow)}
    .rspArrow{stroke:#45A7A1;stroke-width:2.1;stroke-dasharray:7 4;fill:none;marker-end:url(#arrow)}
  </style>
</defs>
<rect class="canvas" width="960" height="500"/>
<rect class="frame" x="24" y="20" width="912" height="456" rx="18"/>
<text class="title" x="44" y="62">DAO Web Transaction Sequence</text>
<text class="subtitle" x="44" y="84">UserController → UserService → transaction{insert{}} → UserTable (H2) → 201 Created</text>

<!-- Lifeline headers -->
<rect class="card" x="24" y="96" width="160" height="48" rx="14" fill="#E8F3FF" stroke="#5B8DEF"/>
<text class="smallLabel" style="font-size:17px" x="104" y="126" text-anchor="middle">UserController</text>
<line class="lifeline" x1="104" y1="144" x2="104" y2="472"/>

<rect class="card" x="240" y="96" width="160" height="48" rx="14" fill="#EAF7EF" stroke="#58A978"/>
<text class="smallLabel" x="320" y="126" text-anchor="middle">UserService</text>
<line class="lifeline" x1="320" y1="144" x2="320" y2="472"/>

<rect class="card" x="456" y="96" width="160" height="48" rx="14" fill="#FFF3D9" stroke="#D6A441"/>
<text class="smallLabel" x="536" y="120" text-anchor="middle">transaction{}</text>
<text class="small" x="536" y="136" text-anchor="middle">(Exposed TX)</text>
<line class="lifeline" x1="536" y1="144" x2="536" y2="472"/>

<rect class="card" x="672" y="96" width="160" height="48" rx="14" fill="#FDECEF" stroke="#DC6B82"/>
<text class="smallLabel" x="752" y="120" text-anchor="middle">UserTable</text>
<text class="small" x="752" y="136" text-anchor="middle">(H2)</text>
<line class="lifeline" x1="752" y1="144" x2="752" y2="472"/>

<!-- Sequence steps -->
<!-- 1: POST /users -->
<rect x="108" y="162" width="180" height="28" rx="8" fill="#fff" opacity="0.95"/>
<text class="strong" x="116" y="180">1. POST /users {name, age}</text>
<path class="reqArrow" d="M104,190 L318,190"/>

<!-- 2: create(request) -->
<rect x="324" y="200" width="140" height="28" rx="8" fill="#fff" opacity="0.95"/>
<text class="strong" x="332" y="218">2. create(request)</text>
<path class="reqArrow" d="M320,228 L534,228"/>

<!-- 3: begin transaction -->
<rect x="444" y="238" width="180" height="28" rx="8" fill="#fff" opacity="0.95"/>
<text class="strong" x="452" y="256">3. transaction { insert { } }</text>
<path class="reqArrow" d="M536,266 L750,266"/>

<!-- 4: INSERT INTO -->
<rect x="600" y="276" width="220" height="28" rx="8" fill="#fff" opacity="0.95"/>
<text class="strong" x="608" y="294">4. INSERT INTO users …</text>

<!-- 5: generated id response -->
<rect x="560" y="316" width="160" height="28" rx="8" fill="#fff" opacity="0.95"/>
<text class="strong" x="568" y="334">5. generated UserId</text>
<path class="rspArrow" d="M750,344 L538,344"/>

<!-- 6: UserEntity -->
<rect x="324" y="354" width="140" height="28" rx="8" fill="#fff" opacity="0.95"/>
<text class="strong" x="332" y="372">6. UserEntity</text>
<path class="rspArrow" d="M536,382 L322,382"/>

<!-- 7: UserCreateResponse -->
<rect x="108" y="392" width="180" height="28" rx="8" fill="#fff" opacity="0.95"/>
<text class="strong" x="116" y="410">7. UserCreateResponse</text>
<path class="rspArrow" d="M320,420 L106,420"/>

<!-- 8: 201 Created -->
<rect x="44" y="432" width="120" height="28" rx="8" fill="#fff" opacity="0.95"/>
<text class="strong" x="52" y="450">8. 201 Created</text>
</svg>
