<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="820" viewBox="0 0 1680 820">
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .title { font-family: 'Architects Daughter', 'Comic Sans MS', cursive; font-size: 34px; fill: #172033; }
      .layer-title { font-family: 'Architects Daughter', 'Comic Sans MS', cursive; font-size: 26px; fill: #344154; }
      .card-title { font-family: 'Architects Daughter', 'Comic Sans MS', cursive; font-size: 27px; fill: #101827; }
      .body { font-family: 'Comic Mono', 'Comic Sans MS', monospace; font-size: 18px; fill: #364152; }
      .small { font-family: 'Comic Mono', 'Comic Sans MS', monospace; font-size: 16px; fill: #4b5563; }
      .layer { stroke-width: 1.5; rx: 24; ry: 24; }
      .card { fill: #fff; stroke: #cbd5e1; stroke-width: 1.5; rx: 18; ry: 18; }
      .line { fill: none; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
    </style>
    <marker id="arrow-blue" viewBox="0 0 11.6667 11.6667" markerWidth="14" markerHeight="14" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse" data-role="primary" data-tip-direction="positive-x">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#2563eb" stroke-dasharray="none" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 11.6667 11.6667" markerWidth="14" markerHeight="14" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse" data-role="primary" data-tip-direction="positive-x">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#059669" stroke-dasharray="none" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect class="bg" width="1680" height="820"/>
  <text class="title" x="70" y="70">Vert.x WebClient Example Flow</text>

  <rect class="layer" x="70" y="120" width="1540" height="170" fill="#eff6ff" stroke="#bfdbfe"/>
  <text class="layer-title" x="105" y="165">Local server fixtures</text>
  <rect class="card" x="125" y="200" width="330" height="60"/>
  <text class="body" x="155" y="237">SimpleServer</text>
  <rect class="card" x="495" y="200" width="330" height="60"/>
  <text class="body" x="525" y="237">CoroutineServer</text>
  <rect class="card" x="865" y="200" width="330" height="60"/>
  <text class="body" x="895" y="237">PostStringServer</text>
  <rect class="card" x="1235" y="200" width="330" height="60"/>
  <text class="body" x="1265" y="237">JsonServer</text>

  <rect class="layer" x="70" y="355" width="1540" height="190" fill="#f0fdf4" stroke="#bbf7d0"/>
  <text class="layer-title" x="105" y="400">WebClient requests</text>
  <rect class="card" x="180" y="445" width="360" height="60"/>
  <text class="body" x="210" y="482">GET + BodyCodec.string()</text>
  <rect class="card" x="660" y="445" width="360" height="60"/>
  <text class="body" x="690" y="482">PUT body + BodyHandler</text>
  <rect class="card" x="1140" y="445" width="360" height="60"/>
  <text class="body" x="1170" y="482">JSON BodyCodec mapping</text>

  <rect class="layer" x="70" y="610" width="1540" height="130" fill="#fefce8" stroke="#fde68a"/>
  <text class="layer-title" x="105" y="655">Coroutine test harness</text>
  <rect class="card" x="320" y="675" width="430" height="50"/>
  <text class="small" x="350" y="706">send().coAwait() avoids callback nesting</text>
  <rect class="card" x="930" y="675" width="430" height="50"/>
  <text class="small" x="960" y="706">withSuspendTestContext reports failures</text>

  <path class="line" d="M290 260 L290 445" stroke="#2563eb" marker-end="url(#arrow-blue)" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="line" d="M 660 260 L 660 320 Q 660 330 650 330 L 370 330 Q 360 330 360 340 L 360 445" stroke="#2563eb" marker-end="url(#arrow-blue)" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="line" d="M 1030 260 L 1030 320 Q 1030 330 1020 330 L 850 330 Q 840 330 840 340 L 840 445" stroke="#2563eb" marker-end="url(#arrow-blue)" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="line" d="M1400 260 L1400 445" stroke="#2563eb" marker-end="url(#arrow-blue)" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="line" d="M360 505 L360 675" stroke="#059669" marker-end="url(#arrow-green)" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="line" d="M 840 505 L 840 575 Q 840 585 830 585 L 545 585 Q 535 585 535 595 L 535 675" stroke="#059669" marker-end="url(#arrow-green)" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="line" d="M 1320 505 L 1320 575 Q 1320 585 1310 585 L 1155 585 Q 1145 585 1145 595 L 1145 675" stroke="#059669" marker-end="url(#arrow-green)" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
