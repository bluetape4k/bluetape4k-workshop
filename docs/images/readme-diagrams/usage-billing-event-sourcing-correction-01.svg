</style></defs><rect class="bg" width="1600" height="950"/><rect class="frame" x="28" y="24" width="1544" height="902" rx="22"/><text class="title" x="800" y="66" text-anchor="middle">Billing Correction Without History Rewrite</text><text class="subtitle" x="800" y="98" text-anchor="middle">Late facts add debit or credit evidence; issued history remains immutable.</text><rect class="zone amberZone" x="70" y="140" width="1460" height="650" rx="22"/><text class="zoneTitle" x="98" y="182">Append-only correction flow</text><g class="node" data-node="original" filter="url(#shadow)"><rect class="card purpleCard" x="110" y="280" width="300" height="110" rx="15"/><text class="cardTitle" x="260" y="313" text-anchor="middle">Original rated usage</text><text class="body" x="260" y="341" text-anchor="middle">UsageRated + provenance</text><text class="body" x="260" y="363" text-anchor="middle">never updated</text></g><g class="node" data-node="finding" filter="url(#shadow)"><rect class="card amberCard" x="520" y="280" width="300" height="110" rx="15"/><text class="cardTitle" x="670" y="313" text-anchor="middle">Operator finding</text><text class="body" x="670" y="341" text-anchor="middle">late usage or overcharge</text><text class="body" x="670" y="363" text-anchor="middle">digest + observed position</text></g><g class="node" data-node="adjust" filter="url(#shadow)"><rect class="card blueCard" x="930" y="280" width="300" height="110" rx="15"/><text class="cardTitle" x="1080" y="313" text-anchor="middle">Adjustment stream</text><text class="body" x="1080" y="341" text-anchor="middle">DEBIT or CREDIT</text><text class="body" x="1080" y="363" text-anchor="middle">reason + source link</text></g><g class="node" data-node="view" filter="url(#shadow)"><rect class="card greenCard" x="1240" y="550" width="270" height="110" rx="15"/><text class="cardTitle" x="1375" y="583" text-anchor="middle">ACTIVE projection</text><text class="body" x="1375" y="611" text-anchor="middle">original +/- adjustment</text><text class="body" x="1375" y="633" text-anchor="middle">generation scoped</text></g><g class="node" data-node="reconcile" filter="url(#shadow)"><rect class="card amberCard" x="690" y="550" width="320" height="110" rx="15"/><text class="cardTitle" x="850" y="583" text-anchor="middle">Reconciliation</text><text class="body" x="850" y="611" text-anchor="middle">replay expected total</text><text class="body" x="850" y="633" text-anchor="middle">compare provenance</text></g><g class="edge" data-edge="original-finding" data-label="inspect immutable evidence"><path data-connector="original-finding" class="edgePath amberEdge dashed" d="M410 335 L520 335"/></g><g class="edge" data-edge="finding-adjust" data-label="digest still current"><path data-connector="finding-adjust" class="edgePath blueEdge" d="M820 335 L930 335"/></g><g class="edge" data-edge="original-view" data-label="project debit"><path data-connector="original-view" class="edgePath greenEdge" style="marker-end:none" d="M260 390 L260 685 Q 260 700 275 700 L1360 700 Q 1375 700 1375 685 L1375 660"/><polygon data-connector-head="original-view" data-arrow-direction="up" points="1375,660 1367,674 1383,674" fill="#6E8F4F" stroke="#6E8F4F" stroke-dasharray="none" style="stroke-dasharray:none"/></g><g class="edge" data-edge="adjust-view" data-label="project signed delta"><path data-connector="adjust-view" class="edgePath greenEdge" style="marker-end:none" d="M1080 390 L1080 480 Q 1080 495 1095 495 L1355 495 Q 1370 495 1370 550"/><polygon data-connector-head="adjust-view" data-arrow-direction="down" points="1370,550 1362,536 1378,536" fill="#6E8F4F" stroke="#6E8F4F" stroke-dasharray="none" style="stroke-dasharray:none"/></g><g class="edge" data-edge="view-reconcile" data-label="actual total"><path data-connector="view-reconcile" class="edgePath amberEdge" d="M1240 605 L1010 605"/></g><g class="edge" data-edge="original-reconcile" data-label="replay expected"><path data-connector="original-reconcile" class=