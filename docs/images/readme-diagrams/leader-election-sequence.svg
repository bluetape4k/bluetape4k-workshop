<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="560" viewBox="0 0 1040 560" role="img" aria-label="Leader Election Sequence Diagram">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#1f2937" flood-opacity="0.09"/></filter>
  <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth">
    <path d="M1,1 L8,4.5 L1,8 Z" fill="#758297"/>
  </marker>
  <style>
    .canvas{fill:#f7f9fc}.frame{fill:#fff;stroke:#d8e0ea;stroke-width:1.5}
    .title{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:38px;font-weight:400;fill:#102033}
    .subtitle{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:14px;font-weight:400;fill:#536273}
    .smallLabel{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:21px;font-weight:400;fill:#102033}
    .mono{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#102033}
    .small{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#536273}
    .card{stroke-width:2.1;filter:url(#shadow)}
    .line{stroke:#758297;stroke-width:2.1;fill:none;marker-end:url(#arrow)}
    .lifeline{stroke:#b0bbca;stroke-width:1.5;stroke-dasharray:6 4;fill:none}
    .reqArrow{stroke:#5B8DEF;stroke-width:2.1;fill:none;marker-end:url(#arrow)}
    .rspArrow{stroke:#45A7A1;stroke-width:2.1;stroke-dasharray:7 4;fill:none;marker-end:url(#arrow)}
    .msgLabel{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:13px;fill:#102033}
  </style>
</defs>
<rect class="canvas" width="1040" height="560"/>
<rect class="frame" x="24" y="20" width="992" height="516" rx="20"/>

<!-- Title -->
<text class="title" x="48" y="66">Leader Election Sequence</text>
<text class="subtitle" x="48" y="90">@Scheduled · LeaderElector · Redis SETNX atomic lock</text>

<!-- 5 Participants: Client, ScheduledTrigger, LeaderScheduledJobService, LeaderElector, Redis -->
<!-- x positions: Client=86, ScheduledTrigger=250, LeaderScheduledJobService=450, LeaderElector=660, Redis=874 -->
<rect class="card" x="26" y="108" width="120" height="56" rx="12" fill="#E8F3FF" stroke="#5B8DEF"/>
<text class="smallLabel" x="86" y="139" text-anchor="middle">Client</text>

<rect class="card" x="170" y="108" width="160" height="56" rx="12" fill="#EAF7EF" stroke="#58A978"/>
<text class="smallLabel" x="250" y="132" text-anchor="middle">Scheduled</text>
<text class="small" x="250" y="151" text-anchor="middle">Trigger</text>

<rect class="card" x="354" y="108" width="192" height="56" rx="12" fill="#FFF3D9" stroke="#D6A441"/>
<text class="smallLabel" x="450" y="132" text-anchor="middle">LeaderScheduled</text>
<text class="small" x="450" y="151" text-anchor="middle">JobService</text>

<rect class="card" x="566" y="108" width="188" height="56" rx="12" fill="#F1ECFF" stroke="#8A72D6"/>
<text class="smallLabel" x="660" y="132" text-anchor="middle">LeaderElector</text>
<text class="small" x="660" y="151" text-anchor="middle">Lettuce</text>

<rect class="card" x="778" y="108" width="192" height="56" rx="12" fill="#FDECEF" stroke="#DC6B82"/>
<text class="smallLabel" x="874" y="132" text-anchor="middle">Redis</text>
<text class="small" x="874" y="151" text-anchor="middle">Testcontainers</text>

<!-- Lifelines -->
<line class="lifeline" x1="86" y1="164" x2="86" y2="530"/>
<line class="lifeline" x1="250" y1="164" x2="250" y2="530"/>
<line class="lifeline" x1="450" y1="164" x2="450" y2="530"/>
<line class="lifeline" x1="660" y1="164" x2="660" y2="530"/>
<line class="lifeline" x1="874" y1="164" x2="874" y2="530"/>

<!-- Message 1: scheduled trigger fires -->
<text class="msgLabel" x="89" y="202" fill="#5B8DEF">① scheduled trigger fires</text>
<path class="reqArrow" d="M86 212 L250 212"/>

<!-- Message 2: runIfLeader(lockName) -->
<text class="msgLabel" x="253" y="242" fill="#5B8DEF">② runIfLeader(lockName)</text>
<path class="reqArrow" d="M250 252 L450 252"/>

<!-- Message 3: acquireLock -->
<text class="msgLabel" x="453" y="282" fill="#5B8DEF">③ acquireLock(lockName)</text>
<path class="reqArrow" d="M450 292 L660 292"/>

<!-- Message 3b: SETNX leader:{lockName} -->
<text class="msgLabel" x="663" y="322" fill="#5B8DEF">④ SETNX leader:{lockName} (atomic)</text>
<path class="reqArrow" d="M660 332 L874 332"/>

<!-- Message 4: lock acquired true -->
<text class="msgLabel" x="663" y="362" fill="#45A7A1">⑤ true → leader wins</text>
<path class="rspArrow" d="M874 372 L660 372"/>

<text class="msgLabel" x="453" y="402" fill="#45A7A1">⑥ lock acquired</text>
<path class="rspArrow" d="M660 412 L450 412"/>

<!-- Message 5: job.execute() → CacheWarmupJob / StaleWorkflowCleanup -->
<text class="msgLabel" x="253" y="442" fill="#5B8DEF">⑦ job.execute() → CacheWarmupJob / StaleWorkflowCleanup</text>
<path class="reqArrow" d="M450 452 L250 452"/>

<!-- Message 6: DEL leader:{lockName} -->
<text class="msgLabel" x="453" y="482" fill="#5B8DEF">⑧ DEL leader:{lockName} (release)</text>
<path class="reqArrow" d="M450 492 L660 492"/>
<path class="reqArrow" d="M660 504 L874 504"/>

<!-- Message 7: next instance SETNX false note -->
<text class="msgLabel" x="89" y="525" fill="#536273">⑨ next instance: SETNX → false (already leader)</text>
</svg>
