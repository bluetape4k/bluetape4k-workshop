<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-label="Leader Election Sequence Diagram">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%">
    <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#1f2937" flood-opacity="0.09"/>
  </filter>
  <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="strokeWidth">
    <path d="M 1 1 L 9 4 L 1 7" fill="none" stroke="#6B7280" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
  <marker id="arrowBack" markerWidth="10" markerHeight="8" refX="1" refY="4" orient="auto" markerUnits="strokeWidth">
    <path d="M 9 1 L 1 4 L 9 7" fill="none" stroke="#6B7280" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
  <marker id="arrowGreen" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="strokeWidth">
    <path d="M 1 1 L 9 4 L 1 7" fill="none" stroke="#059669" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
  <marker id="arrowRed" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="strokeWidth">
    <path d="M 1 1 L 9 4 L 1 7" fill="none" stroke="#EF4444" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
  <style>
    * { font-family: -apple-system, "Segoe UI", Roboto, Inter, Arial, sans-serif; }
    .canvas { fill: #f8fafc; }
    .frame { fill: #ffffff; stroke: #e2e8f0; stroke-width: 1.5; }
    .title { font-size: 20px; font-weight: 700; fill: #0f172a; }
    .subtitle { font-size: 13px; fill: #64748b; }
    .participant { font-size: 13px; font-weight: 600; fill: #1e293b; }
    .msg { font-size: 12px; fill: #374151; }
    .msg-mono { font-size: 11px; font-family: "SF Mono", "Fira Code", monospace; fill: #374151; }
    .msg-ok { font-size: 11px; font-family: "SF Mono", "Fira Code", monospace; fill: #059669; font-weight: 600; }
    .msg-fail { font-size: 11px; font-family: "SF Mono", "Fira Code", monospace; fill: #EF4444; font-weight: 600; }
    .note { font-size: 11px; fill: #374151; }
    .note-box { fill: #FFF7ED; stroke: #FDE68A; stroke-width: 1.2; }
    .loop-box { fill: none; stroke: #CBD5E1; stroke-width: 1.2; stroke-dasharray: 6 4; }
    .section-label { font-size: 10px; font-weight: 600; fill: #94A3B8; }
  </style>
</defs>

<rect class="canvas" width="1200" height="620"/>
<rect class="frame" x="20" y="20" width="1160" height="590" rx="16"/>

<!-- Title -->
<text class="title" x="44" y="56">Leader Election — Sequence Diagram</text>
<text class="subtitle" x="44" y="74">@Scheduled trigger → Redis SET NX EX competition → elected leader executes job</text>

<!-- ══════════════════════ PARTICIPANTS ══════════════════════ -->
<!-- Instance 1 -->
<rect x="60" y="92" width="160" height="50" rx="10" fill="#DBEAFE" stroke="#3B82F6" stroke-width="1.8" filter="url(#shadow)"/>
<text class="participant" x="140" y="113" text-anchor="middle">Instance 1</text>
<text font-size="10" x="140" y="130" text-anchor="middle" fill="#3B82F6">(future leader)</text>
<line x1="140" y1="142" x2="140" y2="582" stroke="#93C5FD" stroke-width="1.5" stroke-dasharray="8 6"/>

<!-- Instance 2 -->
<rect x="300" y="92" width="160" height="50" rx="10" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5" filter="url(#shadow)"/>
<text class="participant" x="380" y="113" text-anchor="middle">Instance 2</text>
<text font-size="10" x="380" y="130" text-anchor="middle" fill="#94A3B8">(follower)</text>
<line x1="380" y1="142" x2="380" y2="582" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="8 6"/>

<!-- Instance 3 -->
<rect x="540" y="92" width="160" height="50" rx="10" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5" filter="url(#shadow)"/>
<text class="participant" x="620" y="113" text-anchor="middle">Instance 3</text>
<text font-size="10" x="620" y="130" text-anchor="middle" fill="#94A3B8">(follower)</text>
<line x1="620" y1="142" x2="620" y2="582" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="8 6"/>

<!-- Redis -->
<rect x="850" y="92" width="200" height="50" rx="10" fill="#FED7AA" stroke="#D97706" stroke-width="1.8" filter="url(#shadow)"/>
<text class="participant" x="950" y="113" text-anchor="middle">Redis</text>
<text font-size="10" x="950" y="130" text-anchor="middle" fill="#D97706">Single-Key Lock</text>
<line x1="950" y1="142" x2="950" y2="582" stroke="#FDBA74" stroke-width="1.5" stroke-dasharray="8 6"/>

<!-- ══════════════════════ MESSAGES ══════════════════════ -->

<!-- Step 1: @Scheduled triggers (activation bars) -->
<text class="section-label" x="44" y="168">@Scheduled trigger fires simultaneously on all instances</text>

<!-- Activation bars at ~172 -->
<rect x="134" y="172" width="12" height="268" rx="3" fill="#DBEAFE" stroke="#3B82F6" stroke-width="1.2"/>
<rect x="374" y="172" width="12" height="98" rx="3" fill="#E5E7EB" stroke="#9CA3AF" stroke-width="1.2"/>
<rect x="614" y="172" width="12" height="98" rx="3" fill="#E5E7EB" stroke="#9CA3AF" stroke-width="1.2"/>

<!-- All 3 → Redis: SET NX EX (concurrent) -->
<line x1="146" y1="188" x2="940" y2="188" stroke="#6B7280" stroke-width="1.5" marker-end="url(#arrow)"/>
<text class="msg-mono" x="540" y="183" text-anchor="middle">SET cache-warmup NX EX 30</text>

<line x1="386" y1="210" x2="940" y2="210" stroke="#9CA3AF" stroke-width="1.3" marker-end="url(#arrow)"/>
<text class="msg-mono" x="665" y="205" text-anchor="middle">SET cache-warmup NX EX 30</text>

<line x1="626" y1="230" x2="940" y2="230" stroke="#9CA3AF" stroke-width="1.3" marker-end="url(#arrow)"/>
<text class="msg-mono" x="780" y="225" text-anchor="middle">SET cache-warmup NX EX 30</text>

<!-- Redis → Instance 1: OK -->
<line x1="940" y1="260" x2="152" y2="260" stroke="#059669" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrowBack)"/>
<text class="msg-ok" x="540" y="255" text-anchor="middle">OK  →  lock acquired</text>

<!-- Redis → Instance 2: FAIL (nil) -->
<line x1="940" y1="280" x2="392" y2="280" stroke="#EF4444" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrowBack)"/>
<text class="msg-fail" x="665" y="275" text-anchor="middle">nil  →  lock held by another</text>

<!-- Redis → Instance 3: FAIL (nil) -->
<line x1="940" y1="300" x2="632" y2="300" stroke="#EF4444" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrowBack)"/>
<text class="msg-fail" x="785" y="295" text-anchor="middle">nil  →  skipped</text>

<!-- Instance 2 & 3: return (skip) -->
<text class="msg" x="380" y="328" text-anchor="middle" fill="#94A3B8">return (skip)</text>
<text class="msg" x="620" y="328" text-anchor="middle" fill="#94A3B8">return (skip)</text>

<!-- Instance 1: execute job -->
<rect x="108" y="344" width="64" height="24" rx="8" fill="#D1FAE5" stroke="#059669" stroke-width="1.2"/>
<text font-size="10" font-weight="600" x="140" y="360" text-anchor="middle" fill="#065F46">LEADER</text>

<text class="section-label" x="44" y="392">Instance 1 (leader) executes the job</text>
<rect x="136" y="398" width="12" height="60" rx="2" fill="#D1FAE5" stroke="#059669" stroke-width="1"/>
<text class="msg" x="155" y="418">execute()  —  CacheWarmupJob</text>
<text class="msg" x="155" y="438" fill="#059669">log: [LEADER] cache-warmup executed</text>

<!-- finally: DEL lock -->
<line x1="146" y1="470" x2="940" y2="470" stroke="#6B7280" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#arrow)"/>
<text class="msg-mono" x="540" y="465" text-anchor="middle">DEL cache-warmup  (finally block)</text>

<line x1="940" y1="490" x2="152" y2="490" stroke="#059669" stroke-width="1.3" stroke-dasharray="5 3" marker-end="url(#arrowBack)"/>
<text class="msg-ok" x="540" y="485" text-anchor="middle">OK  →  lock released</text>

<!-- ══════════════════════ NOTE at bottom ══════════════════════ -->
<rect x="160" y="518" width="880" height="52" rx="10" class="note-box" filter="url(#shadow)"/>
<text class="note" x="600" y="540" text-anchor="middle" font-weight="600">Next scheduling cycle — any instance can become leader</text>
<text class="note" x="600" y="558" text-anchor="middle" fill="#64748b">The lock is expired (DEL or TTL). All instances retry SET NX EX. A different instance may win.</text>
</svg>
