<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="560" viewBox="0 0 1040 560" role="img" aria-label="Leader Election Sequence Diagram">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#1f2937" flood-opacity="0.09"/></filter>
  <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth">
    <path d="M1,1 L8,4.5 L1,8 Z" fill="#758297"/>
  </marker>
  <style>
    .canvas{fill:#f7f9fc}.frame{fill:#fff;stroke:#d8e0ea;stroke-width:1.5}
    .title{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:38px;font-weight:400;fill:#102033}
    .subtitle{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:14px;font-weight:400;fill:#536273}
    .smallLabel{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:21px;font-weight:400;fill:#102033}
    .mono{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#102033}
    .small{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#536273}
    .card{stroke-width:2.1;filter:url(#shadow)}
    .line{stroke:#758297;stroke-width:2.1;fill:none;marker-end:url(#arrow)}
    .lifeline{stroke:#b0bbca;stroke-width:1.5;stroke-dasharray:6 4;fill:none}
    .reqArrow{stroke:#5B8DEF;stroke-width:2.1;fill:none;marker-end:url(#arrow)}
    .rspArrow{stroke:#45A7A1;stroke-width:2.1;stroke-dasharray:7 4;fill:none;marker-end:url(#arrow)}
    .msgLabel{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:13px;fill:#102033}
  </style>
</defs>
<rect class="canvas" width="1040" height="560"/>
<rect class="frame" x="24" y="20" width="992" height="516" rx="20"/>

<!-- Title -->
<text class="title" x="48" y="66">Leader Election Sequence</text>
<text class="subtitle" x="48" y="90">@Scheduled · LeaderElector · Redis SETNX atomic lock</text>

<!-- Participants -->
<!-- x positions: ScheduledTrigger=110, LeaderScheduledJobService=290, LeaderElector=490, Redis=690, Job=890 -->
<rect class="card" x="26" y="108" width="168" height="56" rx="12" fill="#E8F3FF" stroke="#5B8DEF"/>
<text class="smallLabel" x="110" y="132" text-anchor="middle">Scheduled</text>
<text class="small" x="110" y="151" text-anchor="middle">Trigger</text>

<rect class="card" x="206" y="108" width="168" height="56" rx="12" fill="#EAF7EF" stroke="#58A978"/>
<text class="smallLabel" x="290" y="132" text-anchor="middle">LeaderScheduled</text>
<text class="small" x="290" y="151" text-anchor="middle">JobService</text>

<rect class="card" x="406" y="108" width="168" height="56" rx="12" fill="#FFF3D9" stroke="#D6A441"/>
<text class="smallLabel" x="490" y="132" text-anchor="middle">LeaderElector</text>
<text class="small" x="490" y="151" text-anchor="middle">Lettuce</text>

<rect class="card" x="606" y="108" width="168" height="56" rx="12" fill="#FDECEF" stroke="#DC6B82"/>
<text class="smallLabel" x="690" y="132" text-anchor="middle">Redis</text>
<text class="small" x="690" y="151" text-anchor="middle">Testcontainers</text>

<rect class="card" x="806" y="108" width="168" height="56" rx="12" fill="#F1ECFF" stroke="#8A72D6"/>
<text class="smallLabel" x="890" y="132" text-anchor="middle">Job</text>
<text class="small" x="890" y="151" text-anchor="middle">LeaderGuardedJob</text>

<!-- Lifelines -->
<line class="lifeline" x1="110" y1="164" x2="110" y2="530"/>
<line class="lifeline" x1="290" y1="164" x2="290" y2="530"/>
<line class="lifeline" x1="490" y1="164" x2="490" y2="530"/>
<line class="lifeline" x1="690" y1="164" x2="690" y2="530"/>
<line class="lifeline" x1="890" y1="164" x2="890" y2="530"/>

<!-- Message 1: scheduled trigger fires -->
<text class="msgLabel" x="113" y="202" fill="#5B8DEF">① scheduled trigger fires</text>
<path class="reqArrow" d="M110 212 L290 212"/>

<!-- Message 2: runIfLeader(lockName) -->
<text class="msgLabel" x="293" y="242" fill="#5B8DEF">② runIfLeader(lockName)</text>
<path class="reqArrow" d="M290 252 L490 252"/>

<!-- Message 3: SETNX leader:{lockName} -->
<text class="msgLabel" x="493" y="282" fill="#5B8DEF">③ SETNX leader:{lockName} (atomic)</text>
<path class="reqArrow" d="M490 292 L690 292"/>

<!-- Message 4: lock acquired true -->
<text class="msgLabel" x="493" y="322" fill="#45A7A1">④ true → leader wins</text>
<path class="rspArrow" d="M690 332 L490 332"/>

<!-- Message 5: job.execute() -->
<text class="msgLabel" x="493" y="362" fill="#5B8DEF">⑤ job.execute()</text>
<path class="reqArrow" d="M490 372 L890 372"/>

<!-- Message 5b: run jobs -->
<text class="msgLabel" x="750" y="395" fill="#8A72D6">run CacheWarmupJob / StaleWorkflowCleanup</text>

<!-- Message 6: DEL leader:{lockName} -->
<text class="msgLabel" x="493" y="422" fill="#5B8DEF">⑥ DEL leader:{lockName} (release)</text>
<path class="reqArrow" d="M490 432 L690 432"/>

<!-- Message 7: next instance SETNX false -->
<text class="msgLabel" x="113" y="462" fill="#536273">⑦ next instance: SETNX → false (already leader)</text>
<path class="rspArrow" d="M490 472 L290 472"/>
<path class="rspArrow" d="M290 484 L110 484"/>
</svg>
