<!-- Infrastructure -->
<rect class="card" x="652" y="188" width="270" height="172" rx="14" fill="#FDECEF" stroke="#DC6B82"/>
<text class="smallLabel" x="787" y="216" text-anchor="middle">Infrastructure</text>
<text class="small" x="787" y="237" text-anchor="middle">Redis (Redisson/Lettuce)</text>
<text class="small" x="787" y="255" text-anchor="middle">Kafka · Kafka Reply</text>
<text class="small" x="787" y="273" text-anchor="middle">Micrometer Observation</text>
<text class="small" x="787" y="291" text-anchor="middle">Distributed Tracing</text>
<text class="small" x="787" y="309" text-anchor="middle">AWS S3 / Spring Cloud</text>
