<text class="small" x="787" y="345" text-anchor="middle">Gatling Performance Tests</text>

<!-- Arrows from top band to middle cols -->
<line class="line" x1="200" y1="152" x2="171" y2="188"/>
<line class="line" x1="480" y1="152" x2="479" y2="188"/>
<line class="line" x1="760" y1="152" x2="787" y2="188"/>

