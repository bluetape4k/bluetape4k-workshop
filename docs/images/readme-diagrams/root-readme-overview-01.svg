<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-label="Workshop Architecture Overview">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#1f2937" flood-opacity="0.09"/></filter>
  <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth">
    <path d="M1,1 L8,4.5 L1,8 Z" fill="#758297"/>
  </marker>
  <style>
    .canvas{fill:#f7f9fc}.frame{fill:#fff;stroke:#d8e0ea;stroke-width:1.5}
    .title{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:38px;font-weight:400;fill:#102033}
    .subtitle{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:14px;font-weight:400;fill:#536273}
    .smallLabel{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:21px;font-weight:400;fill:#102033}
    .mono{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#102033}
    .small{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#536273}
    .card{stroke-width:2.1;filter:url(#shadow)}
    .line{stroke:#758297;stroke-width:2.1;fill:none;marker-end:url(#arrow)}
  </style>
</defs>
<rect class="canvas" width="960" height="520"/>
<rect class="frame" x="24" y="20" width="912" height="476" rx="20"/>

<!-- Title -->
<text class="title" x="48" y="66">Workshop Overview</text>
<text class="subtitle" x="48" y="90">All modules · Kotlin 2.3 + Java 25 + Spring Boot 4 + bluetape4k 1.5</text>

<!-- Top: Workshop description band -->
<rect class="card" x="36" y="104" width="886" height="48" rx="14" fill="#E8F3FF" stroke="#5B8DEF"/>
<text class="smallLabel" x="479" y="124" text-anchor="middle">bluetape4k Workshop — Backend Examples using bluetape4k Libraries</text>
<text class="small" x="479" y="143" text-anchor="middle">aws · exposed · gateway · gatling · messaging · observability · ratelimit · reactive · redis · spring-boot · spring-data · vertx · virtualthreads</text>

<!-- Middle 3-col -->
<!-- Backend Frameworks -->
<rect class="card" x="36" y="188" width="270" height="172" rx="14" fill="#EAF7EF" stroke="#58A978"/>
<text class="smallLabel" x="171" y="216" text-anchor="middle">Backend Frameworks</text>
<text class="small" x="171" y="237" text-anchor="middle">Spring Boot 4 WebFlux</text>
<text class="small" x="171" y="255" text-anchor="middle">Spring MVC · Coroutines</text>
<text class="small" x="171" y="273" text-anchor="middle">Resilience4j · Rate Limit</text>
<text class="small" x="171" y="291" text-anchor="middle">Spring Security MVC/WebFlux</text>
<text class="small" x="171" y="309" text-anchor="middle">Vert.x · Virtual Threads</text>
<text class="small" x="171" y="327" text-anchor="middle">Spring Cloud Gateway</text>
<text class="small" x="171" y="345" text-anchor="middle">Quarkus · Mutiny Reactive</text>

<!-- Data Access -->
<rect class="card" x="344" y="188" width="270" height="172" rx="14" fill="#FFF3D9" stroke="#D6A441"/>
<text class="smallLabel" x="479" y="216" text-anchor="middle">Data Access</text>
<text class="small" x="479" y="237" text-anchor="middle">JetBrains Exposed ORM</text>
<text class="small" x="479" y="255" text-anchor="middle">Spring Data R2DBC</text>
<text class="small" x="479" y="273" text-anchor="middle">Spring Data JPA / QueryDSL</text>
