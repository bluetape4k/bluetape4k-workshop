<text class="smallLabel" x="246" y="424" text-anchor="middle">bluetape4k Libraries</text>
<text class="small" x="246" y="444" text-anchor="middle">bluetape4k-logging · bluetape4k-junit5</text>
<text class="small" x="246" y="462" text-anchor="middle">bluetape4k-coroutines · bluetape4k-exposed</text>

<rect class="card" x="502" y="396" width="420" height="80" rx="14" fill="#E9F7F6" stroke="#45A7A1"/>
<text class="smallLabel" x="712" y="424" text-anchor="middle">Testcontainers + Test Stack</text>
<text class="small" x="712" y="444" text-anchor="middle">PostgreSQL · Redis · Kafka · MongoDB</text>
