<text x="1060" y="974" class="small" text-anchor="start">Add one operational concern at a time.</text>
<rect x="1124" y="986" width="178" height="66" rx="14" class="pill-purple"/>
<text x="1213.0" y="1024" class="pill-title" text-anchor="middle">Resilience</text>
<text x="1213.0" y="1042" class="pill-sub" text-anchor="middle">system pattern</text>
<rect x="1342" y="986" width="168" height="66" rx="14" class="pill-purple"/>
<text x="1426.0" y="1024" class="pill-title" text-anchor="middle">Tracing</text>
<text x="1426.0" y="1042" class="pill-sub" text-anchor="middle">system pattern</text>
<rect x="1540" y="986" width="210" height="66" rx="14" class="pill-purple"/>
<text x="1645.0" y="1024" class="pill-title" text-anchor="middle">Leader / Graph</text>
<text x="1645.0" y="1042" class="pill-sub" text-anchor="middle">system pattern</text>
<path d="M 960 468 L 960 548" class="flow-blue" marker-end="url(#arrow-blue)" stroke-linecap="round" stroke-linejoin="round"/>
<text x="990" y="512" class="label" text-anchor="start">select module</text>
<path d="M 520 790 L 520 882" class="flow-green" marker-end="url(#arrow-green)" stroke-linecap="round" stroke-linejoin="round"/>
