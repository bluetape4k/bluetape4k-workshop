<rect x="56" y="48" width="1808" height="1164" rx="34" class="frame"/>
<text x="960.0" y="128" class="title" text-anchor="middle">Bluetape4k Workshop Overview</text>
<text x="960.0" y="178" class="subtitle" text-anchor="middle">Pick a learning domain, run a small module, then graduate to container-backed production patterns.</text>
<rect x="122" y="230" width="1676" height="238" rx="22" class="layer-blue"/>
<text x="164" y="288" class="layer-title" text-anchor="start">Choose a learning domain</text>
<text x="164" y="322" class="small" text-anchor="start">Start from the backend problem you want to practice.</text>
<rect x="500" y="352" width="222" height="86" rx="14" class="pill-blue"/>
<text x="611.0" y="390" class="pill-title" text-anchor="middle">Data access</text>
<text x="611.0" y="422" class="pill-sub" text-anchor="middle">Exposed / R2DBC</text>
<rect x="760" y="352" width="222" height="86" rx="14" class="pill-blue"/>
<text x="871.0" y="390" class="pill-title" text-anchor="middle">Spring Boot</text>
<text x="871.0" y="422" class="pill-sub" text-anchor="middle">cache / web / resilience</text>
<rect x="1020" y="352" width="222" height="86" rx="14" class="pill-blue"/>
<text x="1131.0" y="390" class="pill-title" text-anchor="middle">Messaging</text>  <text x="1131.0" y="422" class="pill-sub" text-anchor="middle">Kafka / outbox</text>
<rect x="1280" y="352" width="222" height="86" rx="14" class="pill-blue"/>
<text x="1391.0" y="390" class="pill-title" text-anchor="middle">Ops patterns</text>
<text x="1391.0" y="422" class="pill-sub" text-anchor="middle">observability / security</text>
<rect x="122" y="548" width="1676" height="242" rx="22" class="layer-green"/>
<text x="164" y="606" class="layer-title" text-anchor="start">Run the smallest useful example</text>
<text x="164" y="640" class="small" text-anchor="start">Basic modules are fast; advanced modules add containers and cross-layer behavior.</text>
<rect x="280" y="656" width="252" height="88" rx="14" class="pill-green"/>
<text x="406.0" y="694" class="pill-title" text-anchor="middle">Basic path</text>
<text x="406.0" y="726" class="pill-sub" text-anchor="middle">in-memory or one infra</text>
<rect x="590" y="656" width="252" height="88" rx="14" class="pill-green"/>
<text x="716.0" y="694" class="pill-title" text-anchor="middle">Advanced path</text>
<text x="716.0" y="726" class="pill-sub" text-anchor="middle">multi-layer examples</text>
<rect x="900" y="656" width="252" height="88" rx="14" class="pill-green"/><image data-bluetape4k-icon="database" data-source="docs/icons/generic/database-server.svg" x="912" y="683" width="34" height="34" href="data:image/svg+xml;base64," preserveAspectRatio="xMidYMid meet"/>
<text x="1026.0" y="694" class="pill-title" text-anchor="middle">Container proof</text>  <text x="1026.0" y="726" class="pill-sub" text-anchor="middle">PostgreSQL / Redis / Kafka</text>
<rect x="1210" y="656" width="252" height="88" rx="14" class="pill-green"/><image data-bluetape4k-icon="localstack" data-source="docs/icons/testcontainers/aws/localstack.svg" x="1222" y="683" width="34" height="34" href="data:image/svg+xml;base64," preserveAspectRatio="xMidYMid meet"/>
<text x="1336.0" y="694" class="pill-title" text-anchor="middle">Local cloud</text>  <text x="1336.0" y="726" class="pill-sub" text-anchor="middle">LocalStack / S3 / SQS</text>
<rect x="122" y="882" width="780" height="194" rx="22" class="layer-amber"/>
<text x="164" y="940" class="layer-title" text-anchor="start">Framework and runtime choices</text>
<text x="164" y="974" class="small" text-anchor="start">Pick the runtime lane after the example proves the core behavior.</text>
<rect x="238" y="986" width="156" height="66" rx="14" class="pill-amber"/>
<text x="316.0" y="1024" class="pill-title" text-anchor="middle">MVC</text>
<text x="316.0" y="1042" class="pill-sub" text-anchor="middle">runtime lane</text>
<rect x="436" y="986" width="178" height="66" rx="14" class="pill-amber"/>
