<path d="M 532 700 L 590 700" class="flow-green" marker-end="url(#arrow-green)" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M 842 700 L 900 700" class="flow-green" marker-end="url(#arrow-green)" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M 1152 700 L 1210 700" class="flow-green" marker-end="url(#arrow-green)" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="150" y="1140" width="1620" height="54" rx="16" class="footer"/>
<text x="960.0" y="1174" class="note" text-anchor="middle">Source code is the authority; README diagrams show what to run, what it proves, and when to move deeper.</text>
