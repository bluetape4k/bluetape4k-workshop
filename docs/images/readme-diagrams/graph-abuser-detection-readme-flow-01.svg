<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1260" height="760" viewBox="0 0 1260 760" role="img" aria-label="graph-abuser-detection cluster detection flow">
  <defs>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#64748B" flood-opacity="0.18"/>
    </filter>
    <marker id="arrowMain" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 12 6 L 0 12 Z" fill="#2563EB"/>
    </marker>
    <marker id="arrowSide" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 12 6 L 0 12 Z" fill="#B45309"/>
    </marker>
    <style>
      .canvas { fill: #F8FAFC; }
      .frame { fill: #FFFFFF; stroke: #D6E0E8; stroke-width: 1.4; }
      .title { font-family: "Architects Daughter"; font-size: 34px; fill: #102033; }
      .subtitle { font-family: "Comic Mono"; font-size: 14px; fill: #51606F; }
      .sectionTitle { font-family: "Architects Daughter"; font-size: 22px; fill: #102033; }
      .cardTitle { font-family: "Architects Daughter"; font-size: 24px; fill: #102033; }
      .cardText { font-family: "Comic Mono"; font-size: 14px; fill: #415166; }
      .noteText { font-family: "Comic Mono"; font-size: 13px; fill: #5A6472; }
      .line { fill: none; stroke-width: 3.4; stroke-linecap: round; stroke-linejoin: round; }
      .labelBox { fill: #FFFFFF; stroke: #CFD8E3; stroke-width: 1; opacity: 0.96; }
      .label { font-family: "Comic Mono"; font-size: 12px; fill: #243244; dominant-baseline: middle; }
    </style>
  </defs>
  <rect class="canvas" width="1260" height="760"/>
  <rect class="frame" x="18" y="18" width="1224" height="724" rx="24"/>
  <text class="title" x="630" y="58" text-anchor="middle">findAbuseCluster flow</text>
  <text class="subtitle" x="630" y="84" text-anchor="middle">Seed user -> shared identifiers -> reverse traversal -> cluster result</text>

  <rect x="76" y="116" width="760" height="560" rx="22" fill="#EAF3FF" stroke="#9DB9D8" stroke-width="1.5"/>
  <text class="sectionTitle" x="110" y="153">Main path</text>

  <g filter="url(#shadow)">
    <rect x="310" y="126" width="290" height="78" rx="14" fill="#FFFFFF" stroke="#8DA9C2" stroke-width="1.5"/>
    <text class="cardTitle" x="455" y="156" text-anchor="middle">Seed User</text>
    <text class="cardText" x="455" y="181" text-anchor="middle">user-1 graph vertex id</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="310" y="266" width="290" height="94" rx="14" fill="#F7FFF9" stroke="#87B99A" stroke-width="1.5"/>
    <text class="cardTitle" x="455" y="298" text-anchor="middle">Outgoing identifier edges</text>
    <text class="cardText" x="455" y="324" text-anchor="middle">USES_DEVICE, USES_IP</text>
    <text class="cardText" x="455" y="345" text-anchor="middle">HAS_PHONE, USES_PAYMENT</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="310" y="424" width="290" height="94" rx="14" fill="#FFF8E8" stroke="#C99A35" stroke-width="1.5"/>
    <text class="cardTitle" x="455" y="456" text-anchor="middle">Shared identifiers</text>
    <text class="cardText" x="455" y="482" text-anchor="middle">device-A and ipA in seed data</text>
    <text class="cardText" x="455" y="503" text-anchor="middle">distinct by graph id</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="310" y="582" width="290" height="76" rx="14" fill="#FDF2F8" stroke="#D9779B" stroke-width="1.5"/>
    <text class="cardTitle" x="455" y="611" text-anchor="middle">AbuseCluster</text>
    <text class="cardText" x="455" y="636" text-anchor="middle">users exclude the seed user</text>
  </g>

  <path class="line" d="M 455 204 L 455 266" stroke="#2563EB" marker-end="url(#arrowMain)"/>
  <path class="line" d="M 455 360 L 455 424" stroke="#2563EB" marker-end="url(#arrowMain)"/>
  <path class="line" d="M 455 518 L 455 582" stroke="#2563EB" marker-end="url(#arrowMain)"/>
  <rect class="labelBox" x="500" y="224" width="166" height="24" rx="12"/>
  <text class="label" x="583" y="237" text-anchor="middle">Direction.OUTGOING</text>
  <rect class="labelBox" x="500" y="382" width="166" height="24" rx="12"/>
  <text class="label" x="583" y="395" text-anchor="middle">Direction.INCOMING</text>
  <rect class="labelBox" x="500" y="542" width="144" height="24" rx="12"/>
  <text class="label" x="572" y="555" text-anchor="middle">dedupe result</text>

  <rect x="874" y="116" width="310" height="560" rx="22" fill="#FFF7E8" stroke="#D8B86E" stroke-width="1.5"/>
  <text class="sectionTitle" x="910" y="153">Separate query paths</text>
  <g filter="url(#shadow)">
    <rect x="918" y="190" width="222" height="88" rx="14" fill="#FFFFFF" stroke="#C99A35" stroke-width="1.5"/>
    <text class="cardTitle" x="1029" y="222" text-anchor="middle">explainSuspicion</text>
    <text class="cardText" x="1029" y="248" text-anchor="middle">returns identifier paths</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="918" y="348" width="222" height="88" rx="14" fill="#FFFFFF" stroke="#C99A35" stroke-width="1.5"/>
    <text class="cardTitle" x="1029" y="380" text-anchor="middle">Referral loops</text>
    <text class="cardText" x="1029" y="406" text-anchor="middle">REFERRED_BY cycles only</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="918" y="506" width="222" height="88" rx="14" fill="#FFFFFF" stroke="#C99A35" stroke-width="1.5"/>
    <text class="cardTitle" x="1029" y="538" text-anchor="middle">PageRank</text>
    <text class="cardText" x="1029" y="564" text-anchor="middle">rank User vertices</text>
  </g>

  <path class="line" d="M 600 313 L 744 313 L 744 234 L 918 234" stroke="#B45309" marker-end="url(#arrowSide)"/>
  <path class="line" d="M 600 471 L 780 471 L 780 392 L 918 392" stroke="#B45309" marker-end="url(#arrowSide)"/>
  <path class="line" d="M 600 620 L 816 620 L 816 550 L 918 550" stroke="#B45309" marker-end="url(#arrowSide)"/>

  <text class="noteText" x="630" y="706" text-anchor="middle">Referral edges do not participate in identifier BFS; they have their own cycle-detection query.</text>
</svg>
