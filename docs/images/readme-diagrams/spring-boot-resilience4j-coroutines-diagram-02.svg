<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" role="img" aria-label="Resilience4j Coroutines Architecture">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#1f2937" flood-opacity="0.10"/></filter>
  <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth">
    <path d="M1,1 L8,4.5 L1,8 Z" fill="#758297"/>
  </marker>
  <style>
    .canvas{fill:#f7f9fc}.frame{fill:#fff;stroke:#d8e0ea;stroke-width:1.5}
    .title{font-family:"Architects Daughter";font-size:38px;font-weight:400;fill:#102033}
    .subtitle{font-family:"Comic Mono";font-size:14px;font-weight:400;fill:#536273}
    .smallLabel{font-family:"Architects Daughter";font-size:21px;font-weight:400;fill:#102033}
    .mono{font-family:"Comic Mono";font-size:12px;font-weight:400;fill:#102033}
    .small{font-family:"Comic Mono";font-size:12px;font-weight:400;fill:#536273}
    .card{stroke-width:2.1;filter:url(#shadow)}
    .line{stroke:#758297;stroke-width:2.1;fill:none;marker-end:url(#arrow)}
    .dashed{stroke:#758297;stroke-width:2.1;stroke-dasharray:7 5;fill:none;marker-end:url(#arrow)}
  </style>
</defs>
<rect class="canvas" width="960" height="480"/>
<rect class="frame" x="24" y="20" width="912" height="440" rx="22"/>

<!-- Title -->
<text class="title" x="48" y="68">Resilience4j + Coroutines</text>
<text class="subtitle" x="52" y="92">HTTP Clients → AOP Proxy → Controllers → Services (suspend / reactive)</text>

<!-- HTTP Clients (top center) -->
<g transform="translate(330,116)">
  <rect class="card" x="0" y="0" width="300" height="68" rx="12" fill="#E8F3FF" stroke="#5B8DEF"/>
  <text class="smallLabel" x="150" y="30" text-anchor="middle">HTTP Clients</text>
  <text class="small" x="150" y="52" text-anchor="middle">WebTestClient · curl · httpie</text>
</g>

<!-- Arrows: HTTP Clients → fork bus → Controllers (orthogonal L-shape) -->
<!-- HTTP Clients bottom center = (480, 184); bus at y=206; controllers top at y=224 -->
<path class="line" d="M480,184 L480,206 L238,206 L238,224"/>
<path class="line" d="M480,184 L480,206 L722,206 L722,224"/>

<!-- Controllers - left (sync/reactive) -->
<g transform="translate(48,224)">
  <rect class="card" x="0" y="0" width="380" height="92" rx="12" fill="#EAF7EF" stroke="#58A978"/>
  <text class="smallLabel" x="190" y="26" text-anchor="middle">Sync / Reactive Controllers</text>
  <text class="mono" x="190" y="50" text-anchor="middle">BackendA/B/CController</text>
  <text class="small" x="190" y="72" text-anchor="middle">Mono · Flux · CompletableFuture · RateLimiter</text>
</g>

<!-- Controllers - right (coroutine) -->
<g transform="translate(532,224)">
  <rect class="card" x="0" y="0" width="380" height="92" rx="12" fill="#E8F3FF" stroke="#5B8DEF"/>
  <text class="smallLabel" x="190" y="26" text-anchor="middle">Coroutine Controllers</text>
  <text class="mono" x="190" y="50" text-anchor="middle">SuspendBackendA/BController</text>
  <text class="small" x="190" y="72" text-anchor="middle">suspend · Flow · Bulkhead · Retry</text>
</g>

<!-- Dashed arrows from controller bottoms to AOP badge top -->
<!-- Sync Controller bottom center = (238, 316); Coroutine Controller bottom center = (722, 316) -->
<!-- AOP badge top: y=336, left edge x=310, right entry x=400, left entry x=560 -->
<path class="dashed" d="M238,316 L238,326 L380,326 L380,336"/>
<path class="dashed" d="M722,316 L722,326 L580,326 L580,336"/>

<!-- AOP Proxy badge (center) -->
<!-- translate(310,336), width=340, height=44 → x=310–650, y=336–380 -->
<g transform="translate(310,336)">
  <rect x="0" y="0" width="340" height="44" rx="20" fill="#F3E5F5" stroke="#CE93D8" stroke-width="2"/>
  <text class="smallLabel" x="170" y="27" text-anchor="middle" fill="#6A1B9A">Resilience4j AOP Proxy</text>
</g>

<!-- Arrows: AOP → Services (orthogonal, via bottom bus at y=392) -->
<!-- AOP badge bottom = y=380; left exit x=338 (310+28), right exit x=622 (650-28) -->
<!-- Sync Services top center = (238, 400); Coroutine Services top center = (722, 400) -->
<path class="line" d="M338,380 L338,392 L238,392 L238,400"/>
<path class="line" d="M622,380 L622,392 L722,392 L722,400"/>

<!-- Services -->
<g transform="translate(48,400)">
  <rect class="card" x="0" y="0" width="380" height="52" rx="12" fill="#FFF3D9" stroke="#D6A441"/>
  <text class="smallLabel" x="190" y="28" text-anchor="middle">Sync / Reactive Services</text>
  <text class="small" x="190" y="46" text-anchor="middle">BackendA/B/CService · Mono · Flux</text>
</g>
<g transform="translate(532,400)">
  <rect class="card" x="0" y="0" width="380" height="52" rx="12" fill="#FFF3D9" stroke="#D6A441"/>
  <text class="smallLabel" x="190" y="28" text-anchor="middle">Coroutine Services</text>
  <text class="small" x="190" y="46" text-anchor="middle">BackendACoService · suspend · Flow</text>
</g>
</svg>
