<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1020" viewBox="0 0 1800 1020" role="img" aria-labelledby="title desc"><title id="title">Fence Takeover Sequence</title><desc id="desc">Worker A pauses with fence 41, Worker B takes fence 42 and commits, then PostgreSQL rejects resumed fence 41.</desc><defs>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="124%"><feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#64748B" flood-opacity="0.13"/></filter>
    <style>
      .bg{fill:#F8FAFC}.frame{fill:#FFFFFF;stroke:#CAD6DF;stroke-width:2}.layer{stroke-width:2}.blueLayer{fill:#EFF6FF;stroke:#A8C7EA}.greenLayer{fill:#F0F8F0;stroke:#B8D7AE}.amberLayer{fill:#FFF7E8;stroke:#DFC69A}.purpleLayer{fill:#F8F3FF;stroke:#D7C3EF}.title{font-family:"Architects Daughter";font-size:42px;fill:#263238}.subtitle,.body,.small,.footer,.msg{font-family:"Comic Mono";fill:#3E4C59}.subtitle{font-size:18px}.layerTitle{font-family:"Architects Daughter";font-size:26px;fill:#344154}.cardTitle,.participant{font-family:"Architects Daughter";font-size:23px;fill:#16202A}.body{font-size:16px}.small{font-size:13px;fill:#5B6975}.footer{font-size:14px;fill:#60727D}.card{fill:#FFFFFF;stroke:#9FB0BC;stroke-width:2}.blueCard{fill:#EFF6FF;stroke:#4F86C6}.greenCard{fill:#F0F8F0;stroke:#6E8F4F}.amberCard{fill:#FFF7E8;stroke:#9B7D54}.redCard{fill:#FFF0F0;stroke:#B86868}.purpleCard{fill:#F8F3FF;stroke:#8065A8}.connector{fill:none;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round}.blueEdge{stroke:#4F86C6;marker-end:url(#arrow-blue)}.greenEdge{stroke:#6E8F4F;marker-end:url(#arrow-green)}.amberEdge{stroke:#9B7D54;marker-end:url(#arrow-amber)}.redEdge{stroke:#B86868;marker-end:url(#arrow-red)}.purpleEdge{stroke:#8065A8;marker-end:url(#arrow-purple)}.tealEdge{stroke:#2D948C;marker-end:url(#arrow-teal)}.dashed{stroke-dasharray:10 8}.lifeline{stroke:#9AAAB1;stroke-width:2;stroke-dasharray:7 8}.activation{fill:#EAF6EF;stroke:#6F9278;stroke-width:1.5}.label{fill:#FFFFFF;stroke:#D7E0E4;stroke-width:1.5}.badge{font-family:"Comic Mono";font-size:13px;font-weight:700}.legend{font-family:"Comic Mono";font-size:14px;fill:#475569}
    </style>
    <marker id="arrow-blue" viewBox="0 0 10 10" markerWidth="14" markerHeight="14" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#4F86C6" stroke="#4F86C6" stroke-dasharray="none"/></marker><marker id="arrow-green" viewBox="0 0 10 10" markerWidth="14" markerHeight="14" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#6E8F4F" stroke="#6E8F4F" stroke-dasharray="none"/></marker><marker id="arrow-amber" viewBox="0 0 10 10" markerWidth="14" markerHeight="14" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#9B7D54" stroke="#9B7D54" stroke-dasharray="none"/></marker><marker id="arrow-red" viewBox="0 0 10 10" markerWidth="14" markerHeight="14" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#B86868" stroke="#B86868" stroke-dasharray="none"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" markerWidth="14" markerHeight="14" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#8065A8" stroke="#8065A8" stroke-dasharray="none"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" markerWidth="14" markerHeight="14" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#2D948C" stroke="#2D948C" stroke-dasharray="none"/></marker>
  </defs><rect class="bg" width="1800" height="1020"/><rect class="frame" x="30" y="25" width="1740" height="960" rx="22"/><text class="title" x="900" y="70" text-anchor="middle">Lease Overrun: A41 Pauses, B42 Commits, A41 Rejects</text><text class="subtitle" x="900" y="104" text-anchor="middle">A lease says who may try now; PostgreSQL fencing decides whose write is still current.</text>
  <g filter="url(#shadow)"><rect class="card" x="50" y="150" width="280" height="78" rx="12"/><text class="participant" x="190" y="182" text-anchor="middle">Worker A</text><text class="small" x="190" y="207" text-anchor="middle">stale generation</text></g><line class="lifeline" x1="190" y1="228" x2="190" y2="930"/><g filter="url(#shadow)"><rect class="card" x="410" y="150" width="280" height="78" rx="12"/><text class="participant" x="550" y="182" text-anchor="middle">Redis Lua Lease</text><text class="small" x="550" y="207" text-anchor="middle">monotonic counter</text></g><line class="lifeline" x1="550" y1="228" x2="550" y2="930"/><g filter="url(#shadow)"><rect class="card" x="770" y="150" width="280" height="78" rx="12"/><text class="participant" x="910" y="182" text-anchor="middle">Worker B</text><text class="small" x="910" y="207" text-anchor="middle">takeover generation</text></g><line class="lifeline" x1="910" y1="228" x2="910" y2="930"/><g filter="url(#shadow)"><rect class="card" x="1130" y="150" width="280" height="78" rx="12"/><text class="participant" x="1270" y="182" text-anchor="middle">Fenced Service</text><text class="small" x="1270" y="207" text-anchor="middle">Exposed transaction</text></g><line class="lifeline" x1="1270" y1="228" x2="1270" y2="930"/><g filter="url(#shadow)"><rect class="card" x="1490" y="150" width="280" height="78" rx="12"/><text class="participant" x="1630" y="182" text-anchor="middle">PostgreSQL</text><text class="small" x="1630" y="207" text-anchor="middle">durable authority</text></g><line class="lifeline" x1="1630" y1="228" x2="1630" y2="930"/>
  <rect class="activation" x="182" y="300" width="16" height="510" rx="6"/><rect class="activation" x="902" y="470" width="16" height="240" rx="6"/><rect class="activation" x="1262" y="540" width="16" height="340" rx="6"/><rect class="activation" x="1622" y="600" width="16" height="270" rx="6"/>
  <rect class="label" x="236" y="286" width="268" height="34" rx="17"/><circle cx="258" cy="303" r="13" fill="#FFFFFF" stroke="#4F86C6" stroke-width="2"/><text class="badge" x="258" y="308" text-anchor="middle">1</text><text class="msg" x="280" y="308">acquire resource fence</text><g class="edge" data-edge="sequence-1" data-label="acquire resource fence"><path data-connector="sequence-1" class="connector purpleEdge" d="M 190 330 L 550 330"/></g><rect class="label" x="222.5" y="356" width="295" height="34" rx="17"/><circle cx="244.5" cy="373" r="13" fill="#FFFFFF" stroke="#4F86C6" stroke-width="2"/><text class="badge" x="244.5" y="378" text-anchor="middle">2</text><text class="msg" x="266.5" y="378">return fence 41; A pauses</text><g class="edge" data-edge="sequence-2" data-label="return fence 41; A pauses"><path data-connector="sequence-2" class="connector tealEdge" d="M 550 400 L 190 400"/></g><rect class="label" x="591.5" y="456" width="277" height="34" rx="17"/><circle cx="613.5" cy="473" r="13" fill="#FFFFFF" stroke="#4F86C6" stroke-width="2"/><text class="badge" x="613.5" y="478" text-anchor="middle">3</text><text class="msg" x="635.5" y="478">take over expired lease</text><g class="edge" data-edge="sequence-3" data-label="take over expired lease"><path data-connector="sequence-3" class="connector purpleEdge" d="M 910 500 L 550 500"/></g><rect class="label" x="564.5" y="526" width="331" height="34" rx="17"/><circle cx="586.5" cy="543" r="13" fill="#FFFFFF" stroke="#4F86C6" stroke-width="2"/><text class="badge" x="586.5" y="548" text-anchor="middle">4</text><text class="msg" x="608.5" y="548">increment and return fence 42</text><g class="edge" data-edge="sequence-4" data-label="increment and return fence 42"><path data-connector="sequence-4" class="connector tealEdge" d="M 550 570 L 910 570"/></g><rect class="label" x="960" y="596" width="260" height="34" rx="17"/><circle cx="982" cy="613" r="13" fill="#FFFFFF" stroke="#4F86C6" stroke-width="2"/><text class="badge" x="982" y="618" text-anchor="middle">5</text><text class="msg" x="1004" y="618">execute with fence 42</text><g class="edge" data-edge="sequence-5" data-label="execute with fence 42"><path data-connector="sequence-5" class="connector greenEdge" d="M 910 640 L 1270 640"/></g><rect class="label" x="1275.5" y="666" width="349" height="34" rx="17"/><circle cx="1297.5" cy="683" r="13" fill="#FFFFFF" stroke="#4F86C6" stroke-width="2"/><text class="badge" x="1297.5" y="688" text-anchor="middle">6</text><text class="msg" x="1319.5" y="688">accept fence 42 only when newer</text><g class="edge" data-edge="sequence-6" data-label="accept fence 42 only when newer"><path data-connector="sequence-6" class="connector greenEdge" d="M 1270 710 L 1630 710"/></g><rect class="label" x="1248.5" y="726" width="403" height="34" rx="17"/><circle cx="1270.5" cy="743" r="13" fill="#FFFFFF" stroke="#4F86C6" stroke-width="2"/><text class="badge" x="1270.5" y="748" text-anchor="middle">7</text><text class="msg" x="1292.5" y="748">commit resource + checkpoint + outbox</text><g class="edge" data-edge="sequence-7" data-label="commit resource + checkpoint + outbox"><path data-connector="sequence-7" class="connector tealEdge" d="M 1630 770 L 1270 770"/></g><rect class="label" x="551" y="796" width="358" height="34" rx="17"/><circle cx="573" cy="813" r="13" fill="#FFFFFF" stroke="#4F86C6" stroke-width="2"/><text class="badge" x="573" y="818" text-anchor="middle">8</text><text class="msg" x="595" y="818">resume and execute with fence 41</text><g class="edge" data-edge="sequence-8" data-label="resume and execute with fence 41"><path data-connector="sequence-8" class="connector redEdge" d="M 190 840 L 1270 840"/></g><rect class="label" x="1284.5" y="856" width="331" height="34" rx="17"/><circle cx="1306.5" cy="873" r="13" fill="#FFFFFF" stroke="#4F86C6" stroke-width="2"/><text class="badge" x="1306.5" y="878" text-anchor="middle">9</text><text class="msg" x="1328.5" y="878">stale fence changes zero rows</text><g class="edge" data-edge="sequence-9" data-label="stale fence changes zero rows"><path data-connector="sequence-9" class="connector redEdge" d="M 1270 900 L 1630 900"/></g>
  <text class="footer" x="900" y="960" text-anchor="middle">Result: B42 is durable; A41 becomes REJECTED(STALE_FENCE), even if A still believes it once held leadership.</text></svg>