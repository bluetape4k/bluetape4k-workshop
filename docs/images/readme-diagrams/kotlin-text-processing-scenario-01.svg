<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-label="Text Processing Scenarios">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#1f2937" flood-opacity="0.10"/></filter>
  <marker id="arrow" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse">
    <path d="M2,2 L12,7 L2,12 Z" fill="#758297"/>
  </marker>
  <style>
    .canvas{fill:#f7f9fc}.frame{fill:#fff;stroke:#d8e0ea;stroke-width:1.5}
    .title{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:32px;fill:#102033}
    .subtitle{font-family:"Comic Sans MS","Comic Neue",Arial,sans-serif;font-size:14px;fill:#536273}
    .label{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:20px;fill:#102033}
    .mono{font-family:"Comic Sans MS","Comic Neue",Arial,sans-serif;font-size:12px;fill:#536273}
    .card{stroke-width:2;filter:url(#shadow)}
    .line{stroke:#758297;stroke-width:2;fill:none;marker-end:url(#arrow)}
  </style>
</defs>
<rect class="canvas" width="1200" height="440"/>
<rect class="frame" x="28" y="24" width="1144" height="392" rx="20"/>

<text class="title" x="52" y="68">3 Text Processing Scenarios</text>
<text class="subtitle" x="52" y="90">bluetape4k-text: AhoCorasick keyword search · Lingua language detection · text normalization</text>

<!-- Input text -->
<g transform="translate(52,120)">
  <rect class="card" x="0" y="0" width="200" height="220" rx="12" fill="#E0ECFF" stroke="#4A7ADB"/>
  <text class="label" x="100" y="32" text-anchor="middle">Input Text</text>
  <text class="mono" x="100" y="60" text-anchor="middle">user content</text>
  <text class="mono" x="100" y="80" text-anchor="middle">multi-language</text>
  <text class="mono" x="100" y="100" text-anchor="middle">raw whitespace</text>
</g>

<!-- 3 processing scenarios -->
<g transform="translate(340,110)">
  <rect class="card" x="0" y="0" width="320" height="90" rx="12" fill="#FDECEF" stroke="#DC6B82"/>
  <text class="label" x="160" y="28" text-anchor="middle">AbuseWordFilter</text>
  <text class="mono" x="160" y="50" text-anchor="middle">AhoCorasick automaton · O(text + matches)</text>
  <text class="mono" x="160" y="68" text-anchor="middle">containsAbuse · filterText · findMatches</text>
</g>
<g transform="translate(340,226)">
  <rect class="card" x="0" y="0" width="320" height="90" rx="12" fill="#EAF7EF" stroke="#58A978"/>
  <text class="label" x="160" y="28" text-anchor="middle">LanguageDetectionService</text>
  <text class="mono" x="160" y="50" text-anchor="middle">Lingua-backed · Korean / English / Japanese</text>
  <text class="mono" x="160" y="68" text-anchor="middle">detectLanguage · detectMultiple</text>
</g>
<g transform="translate(340,340)">
  <rect class="card" x="0" y="0" width="320" height="68" rx="12" fill="#FFF3D9" stroke="#D6A441"/>
  <text class="label" x="160" y="28" text-anchor="middle">TextNormalizer</text>
  <text class="mono" x="160" y="50" text-anchor="middle">whitespace normalize · keyword extraction</text>
</g>

<!-- Output results -->
<g transform="translate(760,110)">
  <rect class="card" x="0" y="0" width="340" height="90" rx="12" fill="#FDECEF" stroke="#DC6B82"/>
  <text class="label" x="170" y="28" text-anchor="middle">Filtered Content</text>
  <text class="mono" x="170" y="50" text-anchor="middle">"No **** allowed" (masked)</text>
  <text class="mono" x="170" y="68" text-anchor="middle">2 AhoCorasickMatch objects</text>
</g>
<g transform="translate(760,226)">
  <rect class="card" x="0" y="0" width="340" height="90" rx="12" fill="#EAF7EF" stroke="#58A978"/>
  <text class="label" x="170" y="28" text-anchor="middle">Language Result</text>
  <text class="mono" x="170" y="50" text-anchor="middle">KOREAN (confidence: 0.98)</text>
  <text class="mono" x="170" y="68" text-anchor="middle">per-paragraph detection</text>
</g>
<g transform="translate(760,340)">
  <rect class="card" x="0" y="0" width="340" height="68" rx="12" fill="#FFF3D9" stroke="#D6A441"/>
  <text class="label" x="170" y="28" text-anchor="middle">Normalized Text</text>
  <text class="mono" x="170" y="50" text-anchor="middle">trimmed · collapsed · keywords list</text>
</g>

<!-- ARROWS -->
<path class="line" d="M252,200 L252,155 L338,155"/>
<path class="line" d="M252,230 L252,271 L338,271"/>
<path class="line" d="M252,310 L252,374 L338,374"/>

<path class="line" d="M660,155 L758,155"/>
<path class="line" d="M660,271 L758,271"/>
<path class="line" d="M660,374 L758,374"/>
</svg>
