<svg xmlns="http://www.w3.org/2000/svg" width="1540" height="760" viewBox="0 0 1540 760">
  <defs>
    <style>
      .bg{fill:#f8fafc}.title{font-family:'Architects Daughter','Comic Sans MS',cursive;font-size:34px;fill:#18212f}
      .card-title{font-family:'Architects Daughter','Comic Sans MS',cursive;font-size:27px;fill:#101827}
      .body{font-family:'Comic Mono','Comic Sans MS',monospace;font-size:18px;fill:#364152}.card{fill:#fff;stroke:#cbd5e1;stroke-width:1.5;rx:18;ry:18}.line{fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L11,6 L1,11 Z" fill="#2563eb" stroke-dasharray="none"/></marker>
    <marker id="arrow-green" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L11,6 L1,11 Z" fill="#059669" stroke-dasharray="none"/></marker>
  </defs>
  <rect class="bg" width="1540" height="760"/>
  <text class="title" x="70" y="70">Common Security Request Flow</text>
  <rect class="card" x="120" y="145" width="360" height="80"/>
  <text class="card-title" x="150" y="190">Request</text>
  <text class="body" x="260" y="190">/ or /user/** or API</text>
  <rect class="card" x="590" y="145" width="360" height="80"/>
  <text class="card-title" x="620" y="190">Security chain</text>
  <rect class="card" x="1060" y="145" width="360" height="80"/>
  <text class="card-title" x="1090" y="190">Decision</text>

  <rect class="card" x="220" y="360" width="360" height="95"/>
  <text class="card-title" x="250" y="402">Public route</text>
  <text class="body" x="250" y="430">permitAll</text>
  <rect class="card" x="590" y="520" width="360" height="95"/>
  <text class="card-title" x="620" y="562">Form login</text>
  <text class="body" x="620" y="590">MVC or WebFlux session</text>
  <rect class="card" x="960" y="360" width="360" height="95"/>
  <text class="card-title" x="990" y="402">JWT resource</text>
  <text class="body" x="990" y="430">Bearer token required</text>

  <path class="line" d="M480 185 L590 185" stroke="#2563eb" marker-end="url(#arrow)" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="line" d="M950 185 L1060 185" stroke="#2563eb" marker-end="url(#arrow)" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="line" d="M770 225 L400 360" stroke="#059669" marker-end="url(#arrow-green)" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="line" d="M770 225 L770 520" stroke="#2563eb" marker-end="url(#arrow)" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="line" d="M770 225 L1140 360" stroke="#2563eb" marker-end="url(#arrow)" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
