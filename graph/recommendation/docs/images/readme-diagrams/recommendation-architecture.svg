<?xml version="1.0" encoding="utf-8"?>
<!-- graph/recommendation — clean layer-band architecture, reference-image style -->
<!-- Layers: Domain Model → Service → Algorithms → Backends, with inter-layer arrows only -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 780" width="800" height="780">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M1,1 L8,4.5 L1,8 Z" fill="#4a4a4a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M1,1 L8,4.5 L1,8 Z" fill="#2471a3"/>
    </marker>
    <marker id="arr-purple" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M1,1 L8,4.5 L1,8 Z" fill="#7d3c98"/>
    </marker>
  </defs>

  <!-- ─── Outer frame ────────────────────────────────────────────────────── -->
  <rect width="800" height="780" rx="16" fill="white" stroke="#c8d4e0" stroke-width="1.5"/>

  <!-- ─── Title bar ──────────────────────────────────────────────────────── -->
  <rect x="0" y="0" width="800" height="52" rx="16" fill="#2c3e50"/>
  <rect x="0" y="36" width="800" height="16" fill="#2c3e50"/>
  <text x="400" y="27" text-anchor="middle" font-family="'Architects Daughter',sans-serif"
        font-size="18" font-weight="bold" fill="#ffffff">graph/recommendation — Architecture</text>
  <text x="400" y="45" text-anchor="middle" font-family="'Comic Mono',monospace"
        font-size="10" fill="#aed6f1">Collaborative Filtering · FOAF on FOLLOWS · TinkerGraph / Neo4j / Memgraph</text>

  <!-- ═══════════════════════════════════════════════════════════════════════ -->
  <!-- LAYER 1: Domain Model (y=58..200, h=142) -->
  <rect x="12" y="58" width="776" height="142" rx="10"
        fill="#e8f4fb" stroke="#7fb8d8" stroke-width="1.5"/>
  <text x="24" y="77" font-family="'Architects Daughter',sans-serif"
        font-size="12" font-weight="bold" fill="#2471a3">Domain Model</text>
  <text x="24" y="92" font-family="'Comic Mono',monospace"
        font-size="9" fill="#5d8faa">Property Graph vertices · edges: PURCHASED (rating, purchasedAt) · FOLLOWS</text>

  <!-- User vertex card (x=22, y=98, w=260, h=88) -->
  <rect x="22" y="98" width="260" height="88" rx="8"
        fill="white" stroke="#85c1e9" stroke-width="1"/>
  <text x="152" y="122" text-anchor="middle" font-family="'Architects Daughter',sans-serif"
        font-size="15" font-weight="bold" fill="#154360">User</text>
  <text x="152" y="140" text-anchor="middle" font-family="'Comic Mono',monospace"
        font-size="10" fill="#1a5276">userId · name</text>
  <text x="152" y="157" text-anchor="middle" font-family="'Comic Mono',monospace"
        font-size="9" fill="#7d3c98">↺ FOLLOWS (directed self-loop)</text>
  <text x="152" y="172" text-anchor="middle" font-family="'Comic Mono',monospace"
        font-size="9" fill="#e67e22">→ PURCHASED edges to Product</text>

  <!-- Product vertex card (x=298, y=98, w=478, h=88) -->
  <rect x="298" y="98" width="478" height="88" rx="8"
        fill="white" stroke="#85c1e9" stroke-width="1"/>
  <text x="537" y="122" text-anchor="middle" font-family="'Architects Daughter',sans-serif"
        font-size="15" font-weight="bold" fill="#145a32">Product</text>
  <text x="537" y="140" text-anchor="middle" font-family="'Comic Mono',monospace"
        font-size="10" fill="#196f3d">productId · name · category</text>
  <text x="537" y="157" text-anchor="middle" font-family="'Comic Mono',monospace"
        font-size="9" fill="#e67e22">← PURCHASED from User  ·  properties: rating, purchasedAt</text>
  <text x="537" y="172" text-anchor="middle" font-family="'Comic Mono',monospace"
        font-size="9" fill="#5d8faa">target of collaborative filtering (co-buyer graph)</text>

  <!-- ═══════════════════════════════════════════════════════════════════════ -->
  <!-- ARROW 1: Domain → Service (y=200..244) -->
  <line x1="400" y1="202" x2="400" y2="240"
        stroke="#4a4a4a" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="304" y="210" width="192" height="16" rx="4" fill="white" opacity="0.92"/>
  <text x="400" y="221" text-anchor="middle" font-family="'Comic Mono',monospace"
        font-size="9" fill="#4a4a4a">vertex IDs as service inputs</text>

  <!-- ═══════════════════════════════════════════════════════════════════════ -->
  <!-- LAYER 2: Service Layer (y=244..374, h=130) -->
  <rect x="12" y="244" width="776" height="130" rx="10"
        fill="#fef9e7" stroke="#e8c840" stroke-width="1.5"/>
  <text x="24" y="263" font-family="'Architects Daughter',sans-serif"
        font-size="12" font-weight="bold" fill="#9a7d0a">Service Layer</text>
  <text x="24" y="278" font-family="'Comic Mono',monospace"
        font-size="9" fill="#8e7220">blocking + coroutine service entry points · both call the same algorithms</text>

  <!-- RecommendationService card (x=22, y=284, w=364, h=78) -->
  <rect x="22" y="284" width="364" height="78" rx="8"
        fill="white" stroke="#d4ac0d" stroke-width="1"/>
  <text x="204" y="307" text-anchor="middle" font-family="'Architects Daughter',sans-serif"
        font-size="12" font-weight="bold" fill="#6e2f0a">RecommendationService</text>
  <text x="204" y="323" text-anchor="middle" font-family="'Comic Mono',monospace"
        font-size="9" fill="#7e5109">blocking · uses GraphOperations</text>
  <text x="204" y="338" text-anchor="middle" font-family="'Comic Mono',monospace"
        font-size="9" fill="#7e5109">addUser · addProduct · purchase · follow</text>
  <text x="204" y="353" text-anchor="middle" font-family="'Comic Mono',monospace"
        font-size="9" fill="#d4ac0d">recommendProducts() · recommendFollows()</text>

  <!-- RecommendationSuspendService card (x=402, y=284, w=374, h=78) -->
  <rect x="402" y="284" width="374" height="78" rx="8"
        fill="white" stroke="#e59866" stroke-width="1"/>
  <text x="589" y="307" text-anchor="middle" font-family="'Architects Daughter',sans-serif"
        font-size="12" font-weight="bold" fill="#6e2f0a">RecommendationSuspendService</text>
  <text x="589" y="323" text-anchor="middle" font-family="'Comic Mono',monospace"
        font-size="9" fill="#7e5109">suspend · uses GraphSuspendOperations</text>
  <text x="589" y="338" text-anchor="middle" font-family="'Comic Mono',monospace"
        font-size="9" fill="#7e5109">suspend addUser · addProduct · purchase · follow</text>
  <text x="589" y="353" text-anchor="middle" font-family="'Comic Mono',monospace"
        font-size="9" fill="#d35400">suspend recommendProducts · recommendFollows</text>

  <!-- ═══════════════════════════════════════════════════════════════════════ -->
  <!-- ARROWS 2: Service → Algorithm (y=374..432, h=58) -->
  <!-- Left: solid dark — blocking service calls -->
  <line x1="340" y1="376" x2="340" y2="428"
        stroke="#4a4a4a" stroke-width="2" marker-end="url(#arr)"/>
  <!-- Right: dashed dark — suspend service calls -->
  <line x1="460" y1="376" x2="460" y2="428"
        stroke="#4a4a4a" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#arr)"/>
  <!-- Labels -->
  <rect x="110" y="388" width="212" height="16" rx="4" fill="white" opacity="0.92"/>
  <text x="216" y="399" text-anchor="middle" font-family="'Comic Mono',monospace"
        font-size="9" fill="#4a4a4a">blocking calls (—)</text>
  <rect x="478" y="388" width="212" height="16" rx="4" fill="white" opacity="0.92"/>
  <text x="584" y="399" text-anchor="middle" font-family="'Comic Mono',monospace"
        font-size="9" fill="#4a4a4a">suspend calls (- - -)</text>

  <!-- ═══════════════════════════════════════════════════════════════════════ -->
  <!-- LAYER 3: Recommendation Algorithms (y=432..562, h=130) -->
  <rect x="12" y="432" width="776" height="130" rx="10"
        fill="#eafbea" stroke="#6cc070" stroke-width="1.5"/>
  <text x="24" y="451" font-family="'Architects Daughter',sans-serif"
        font-size="12" font-weight="bold" fill="#1a7a2e">Recommendation Algorithms</text>
  <text x="24" y="466" font-family="'Comic Mono',monospace"
        font-size="9" fill="#2e8040">shared logic · each callable via blocking and suspend API</text>

  <!-- recommendProducts() card (x=22, y=472, w=370, h=78) -->
  <rect x="22" y="472" width="370" height="78" rx="8"
        fill="white" stroke="#2e86c1" stroke-width="1"/>
  <text x="207" y="493" text-anchor="middle" font-family="'Architects Daughter',sans-serif"
        font-size="11" font-weight="bold" fill="#154360">recommendProducts(userVertexId, limit)</text>
  <text x="207" y="509" text-anchor="middle" font-family="'Comic Mono',monospace"
        font-size="10" fill="#1b4f72">Collaborative Filtering</text>
  <text x="207" y="524" text-anchor="middle" font-family="'Comic Mono',monospace"
        font-size="9" fill="#1b4f72">co-buyer: User←PURCHASED→Product</text>
  <text x="207" y="539" text-anchor="middle" font-family="'Comic Mono',monospace"
        font-size="9" fill="#2e86c1">score = distinct co-buyer count · limit: 1..100</text>

  <!-- recommendFollows() card (x=408, y=472, w=368, h=78) -->
  <rect x="408" y="472" width="368" height="78" rx="8"
        fill="white" stroke="#1e8449" stroke-width="1"/>
  <text x="592" y="493" text-anchor="middle" font-family="'Architects Daughter',sans-serif"
        font-size="11" font-weight="bold" fill="#145a32">recommendFollows(userVertexId, limit)</text>
  <text x="592" y="509" text-anchor="middle" font-family="'Comic Mono',monospace"
        font-size="10" fill="#196f3d">FOAF on FOLLOWS graph</text>
  <text x="592" y="524" text-anchor="middle" font-family="'Comic Mono',monospace"
        font-size="9" fill="#196f3d">2-hop: seed→follows→follows candidates</text>
  <text x="592" y="539" text-anchor="middle" font-family="'Comic Mono',monospace"
        font-size="9" fill="#1e8449">mutualFollowCount score · limit: 1..100</text>

  <!-- ═══════════════════════════════════════════════════════════════════════ -->
  <!-- ARROWS 3: Algorithm → Backends (y=562..622, h=60) -->
  <!-- Left: solid blue — GraphOperations (blocking) -->
  <line x1="330" y1="564" x2="330" y2="618"
        stroke="#2471a3" stroke-width="2.5" marker-end="url(#arr-blue)"/>
  <!-- Right: dashed purple — GraphSuspendOperations (suspend) -->
  <line x1="470" y1="564" x2="470" y2="618"
        stroke="#7d3c98" stroke-width="2.5" stroke-dasharray="7,3" marker-end="url(#arr-purple)"/>
  <!-- Labels -->
  <rect x="108" y="576" width="204" height="28" rx="5"
        fill="white" opacity="0.92" stroke="#2471a3" stroke-width="0.8"/>
  <text x="210" y="587" text-anchor="middle" font-family="'Comic Mono',monospace"
        font-size="9" font-weight="bold" fill="#2471a3">GraphOperations</text>
  <text x="210" y="599" text-anchor="middle" font-family="'Comic Mono',monospace"
        font-size="9" fill="#2471a3">(blocking API)</text>
  <rect x="490" y="576" width="210" height="28" rx="5"
        fill="white" opacity="0.92" stroke="#7d3c98" stroke-width="0.8"/>
  <text x="595" y="587" text-anchor="middle" font-family="'Comic Mono',monospace"
        font-size="9" font-weight="bold" fill="#7d3c98">GraphSuspendOperations</text>
  <text x="595" y="599" text-anchor="middle" font-family="'Comic Mono',monospace"
        font-size="9" fill="#7d3c98">(suspend API)</text>

  <!-- ═══════════════════════════════════════════════════════════════════════ -->
  <!-- LAYER 4: Graph Backends (y=622..750, h=128) -->
  <rect x="12" y="622" width="776" height="128" rx="10"
        fill="#fdecea" stroke="#f08080" stroke-width="1.5"/>
  <text x="24" y="641" font-family="'Architects Daughter',sans-serif"
        font-size="12" font-weight="bold" fill="#922b21">Graph Backends</text>
  <text x="24" y="656" font-family="'Comic Mono',monospace"
        font-size="9" fill="#a04040">TinkerPop-compatible · both GraphOperations and GraphSuspendOperations available per backend</text>

  <!-- TinkerGraph card (x=22, y=662, w=238, h=76) -->
  <rect x="22" y="662" width="238" height="76" rx="8"
        fill="white" stroke="#ca6f1e" stroke-width="1"/>
  <text x="141" y="683" text-anchor="middle" font-family="'Architects Daughter',sans-serif"
        font-size="13" font-weight="bold" fill="#6e2f0a">TinkerGraph</text>
  <text x="141" y="699" text-anchor="middle" font-family="'Comic Mono',monospace"
        font-size="9" fill="#7e5109">in-memory · no Docker required</text>
  <text x="141" y="714" text-anchor="middle" font-family="'Comic Mono',monospace"
        font-size="9" fill="#7e5109">:graph-recommendation:test</text>
  <text x="141" y="729" text-anchor="middle" font-family="'Comic Mono',monospace"
        font-size="9" fill="#ca6f1e">unit test default</text>

  <!-- Neo4j card (x=276, y=662, w=238, h=76) -->
  <rect x="276" y="662" width="238" height="76" rx="8"
        fill="white" stroke="#cb4335" stroke-width="1"/>
  <text x="395" y="683" text-anchor="middle" font-family="'Architects Daughter',sans-serif"
        font-size="13" font-weight="bold" fill="#7b241c">Neo4j</text>
  <text x="395" y="699" text-anchor="middle" font-family="'Comic Mono',monospace"
        font-size="9" fill="#922b21">Neo4jServer.Launcher.neo4j</text>
  <text x="395" y="714" text-anchor="middle" font-family="'Comic Mono',monospace"
        font-size="9" fill="#922b21">Testcontainer · @Tag("integration")</text>
  <text x="395" y="729" text-anchor="middle" font-family="'Comic Mono',monospace"
        font-size="9" fill="#cb4335">:integrationTest task</text>

  <!-- Memgraph card (x=530, y=662, w=246, h=76) -->
  <rect x="530" y="662" width="246" height="76" rx="8"
        fill="white" stroke="#a93226" stroke-width="1"/>
  <text x="653" y="683" text-anchor="middle" font-family="'Architects Daughter',sans-serif"
        font-size="13" font-weight="bold" fill="#7b241c">Memgraph</text>
  <text x="653" y="699" text-anchor="middle" font-family="'Comic Mono',monospace"
        font-size="9" fill="#78281f">MemgraphServer.Launcher</text>
  <text x="653" y="714" text-anchor="middle" font-family="'Comic Mono',monospace"
        font-size="9" fill="#78281f">Testcontainer · AuthTokens.none()</text>
  <text x="653" y="729" text-anchor="middle" font-family="'Comic Mono',monospace"
        font-size="9" fill="#a93226">:integrationTest task</text>

  <!-- ─── Legend strip ──────────────────────────────────────────────────── -->
  <rect x="12" y="758" width="776" height="20" rx="6"
        fill="#ecf0f1" stroke="#bdc3c7" stroke-width="1"/>
  <!-- GraphOperations: solid blue -->
  <line x1="28"  y1="768" x2="55"  y2="768" stroke="#2471a3" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="60"  y="772" font-family="'Comic Mono',monospace" font-size="9" fill="#2471a3">GraphOperations (blocking)</text>
  <!-- GraphSuspendOps: purple dashed -->
  <line x1="230" y1="768" x2="257" y2="768" stroke="#7d3c98" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arr-purple)"/>
  <text x="262" y="772" font-family="'Comic Mono',monospace" font-size="9" fill="#7d3c98">GraphSuspendOps (suspend)</text>
  <!-- service blocking -->
  <line x1="435" y1="768" x2="462" y2="768" stroke="#4a4a4a" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="467" y="772" font-family="'Comic Mono',monospace" font-size="9" fill="#4a4a4a">service → algo (blocking)</text>
  <!-- service suspend -->
  <line x1="620" y1="768" x2="647" y2="768" stroke="#4a4a4a" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arr)"/>
  <text x="652" y="772" font-family="'Comic Mono',monospace" font-size="9" fill="#4a4a4a">service → algo (suspend)</text>
</svg>
