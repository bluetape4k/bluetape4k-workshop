<?xml version="1.0" encoding="utf-8"?>
<!-- hand-authored from Graphviz plain layout (recommendation-architecture.dot) -->
<!-- Graphviz node order: User, Product, RecService, RecSuspend, CF, FOAF, TinkerGraph, Neo4j, Memgraph -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 640" width="800" height="640">
  <defs>
    <!-- filled triangular arrowheads — markerWidth=9, markerHeight=9, refX=8, refY=4.5 -->
    <marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M1,1 L8,4.5 L1,8 Z" fill="#2c3e50"/>
    </marker>
    <marker id="arr-orange" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M1,1 L8,4.5 L1,8 Z" fill="#e67e22"/>
    </marker>
    <marker id="arr-purple" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M1,1 L8,4.5 L1,8 Z" fill="#7d3c98"/>
    </marker>
    <marker id="arr-gray" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M1,1 L8,4.5 L1,8 Z" fill="#85929e"/>
    </marker>
  </defs>

  <!-- ─── Outer frame ──────────────────────────────────────────────────── -->
  <rect width="800" height="640" rx="12" fill="#f8f9fa" stroke="#b0c4d8" stroke-width="2"/>

  <!-- ─── Title bar ────────────────────────────────────────────────────── -->
  <rect x="0" y="0" width="800" height="50" rx="12" fill="#2c3e50"/>
  <rect x="0" y="38" width="800" height="12" fill="#2c3e50"/>
  <text x="400" y="28" text-anchor="middle" font-family="'Architects Daughter',sans-serif"
        font-size="18" font-weight="bold" fill="#ffffff">graph/recommendation — Architecture</text>
  <text x="400" y="44" text-anchor="middle" font-family="'Comic Mono',monospace"
        font-size="10" fill="#aed6f1">Collaborative Filtering · FOAF on FOLLOWS · TinkerGraph / Neo4j / Memgraph</text>

  <!-- ═══════════════════════════════════════════════════════════════════ -->
  <!-- BAND 1: Domain Model (y=56..188) -->
  <rect x="12" y="56" width="776" height="132" rx="8"
        fill="#eaf4fb" stroke="#85c1e9" stroke-width="1.5"/>
  <text x="24" y="73" font-family="'Architects Daughter',sans-serif"
        font-size="11" font-weight="bold" fill="#2471a3">Domain Model</text>

  <!-- User vertex — Graphviz: node User 1.43 7.60 center -->
  <ellipse cx="200" cy="122" rx="100" ry="36" fill="#aed6f1" stroke="#2471a3" stroke-width="1.5"/>
  <text x="200" y="117" text-anchor="middle"
        font-family="'Architects Daughter',sans-serif" font-size="14" font-weight="bold" fill="#154360">User</text>
  <text x="200" y="133" text-anchor="middle"
        font-family="'Comic Mono',monospace" font-size="9" fill="#1a5276">userId, name</text>

  <!-- FOLLOWS self-loop on User -->
  <path d="M 183,87 C 158,58 200,48 228,70 L 218,86"
        stroke="#7d3c98" stroke-width="1.5" stroke-dasharray="4,2"
        fill="none" marker-end="url(#arr-purple)"/>
  <rect x="163" y="47" width="68" height="16" rx="4" fill="white" opacity="0.9"/>
  <text x="197" y="58" text-anchor="middle"
        font-family="'Comic Mono',monospace" font-size="9" fill="#7d3c98">FOLLOWS</text>

  <!-- Product vertex — Graphviz: node Product 1.68 5.70 -->
  <ellipse cx="600" cy="122" rx="140" ry="36" fill="#a9dfbf" stroke="#1e8449" stroke-width="1.5"/>
  <text x="600" y="117" text-anchor="middle"
        font-family="'Architects Daughter',sans-serif" font-size="14" font-weight="bold" fill="#145a32">Product</text>
  <text x="600" y="133" text-anchor="middle"
        font-family="'Comic Mono',monospace" font-size="9" fill="#196f3d">productId, name, category</text>

  <!-- PURCHASED edge User→Product -->
  <path d="M 300,115 L 460,115" stroke="#e67e22" stroke-width="2"
        fill="none" marker-end="url(#arr-orange)"/>
  <rect x="326" y="100" width="135" height="16" rx="4" fill="white" opacity="0.9"/>
  <text x="393" y="111" text-anchor="middle"
        font-family="'Comic Mono',monospace" font-size="9" fill="#e67e22">PURCHASED (rating)</text>

  <!-- ═══════════════════════════════════════════════════════════════════ -->
  <!-- BAND 2: Service Layer (y=196..306) -->
  <rect x="12" y="196" width="776" height="110" rx="8"
        fill="#fef9e7" stroke="#f4d03f" stroke-width="1.5"/>
  <text x="24" y="213" font-family="'Architects Daughter',sans-serif"
        font-size="11" font-weight="bold" fill="#9a7d0a">Service Layer</text>

  <!-- RecommendationService — cx=200 -->
  <rect x="50" y="218" width="240" height="78" rx="8"
        fill="#f9e79f" stroke="#d4ac0d" stroke-width="1.5"/>
  <text x="170" y="242" text-anchor="middle"
        font-family="'Architects Daughter',sans-serif" font-size="12" font-weight="bold" fill="#6e2f0a">RecommendationService</text>
  <text x="170" y="259" text-anchor="middle"
        font-family="'Comic Mono',monospace" font-size="9" fill="#7e5109">blocking · GraphOperations</text>
  <text x="170" y="274" text-anchor="middle"
        font-family="'Comic Mono',monospace" font-size="9" fill="#7e5109">addUser · addProduct · purchase · follow</text>
  <text x="170" y="289" text-anchor="middle"
        font-family="'Comic Mono',monospace" font-size="9" fill="#d4ac0d">recommendProducts() · recommendFollows()</text>

  <!-- RecommendationSuspendService — cx=620 -->
  <rect x="510" y="218" width="262" height="78" rx="8"
        fill="#fad7a0" stroke="#e59866" stroke-width="1.5"/>
  <text x="641" y="242" text-anchor="middle"
        font-family="'Architects Daughter',sans-serif" font-size="12" font-weight="bold" fill="#6e2f0a">RecommendationSuspendService</text>
  <text x="641" y="259" text-anchor="middle"
        font-family="'Comic Mono',monospace" font-size="9" fill="#7e5109">suspend · GraphSuspendOperations</text>
  <text x="641" y="274" text-anchor="middle"
        font-family="'Comic Mono',monospace" font-size="9" fill="#7e5109">suspend addUser · addProduct · purchase · follow</text>
  <text x="641" y="289" text-anchor="middle"
        font-family="'Comic Mono',monospace" font-size="9" fill="#d35400">suspend recommendProducts · recommendFollows</text>

  <!-- Domain→Service (input hint, dotted gray) -->
  <line x1="200" y1="158" x2="170" y2="218"
        stroke="#85929e" stroke-width="1" stroke-dasharray="3,3" marker-end="url(#arr-gray)"/>
  <line x1="600" y1="158" x2="641" y2="218"
        stroke="#85929e" stroke-width="1" stroke-dasharray="3,3" marker-end="url(#arr-gray)"/>

  <!-- ═══════════════════════════════════════════════════════════════════ -->
  <!-- BAND 3: Algorithm Layer (y=314..434) -->
  <rect x="12" y="314" width="776" height="120" rx="8"
        fill="#eafbea" stroke="#82e0aa" stroke-width="1.5"/>
  <text x="24" y="331" font-family="'Architects Daughter',sans-serif"
        font-size="11" font-weight="bold" fill="#1a7a2e">Recommendation Algorithms</text>

  <!-- recommendProducts CF rect — cx=170 -->
  <rect x="42" y="338" width="255" height="88" rx="8"
        fill="#d6eaf8" stroke="#2e86c1" stroke-width="1.5"/>
  <text x="169" y="360" text-anchor="middle"
        font-family="'Architects Daughter',sans-serif" font-size="12" font-weight="bold" fill="#154360">recommendProducts(userVertexId, limit)</text>
  <text x="169" y="377" text-anchor="middle"
        font-family="'Comic Mono',monospace" font-size="10" fill="#1b4f72">Collaborative Filtering</text>
  <text x="169" y="393" text-anchor="middle"
        font-family="'Comic Mono',monospace" font-size="9" fill="#1b4f72">co-buyer: User←PURCHASED→Product</text>
  <text x="169" y="408" text-anchor="middle"
        font-family="'Comic Mono',monospace" font-size="9" fill="#1b4f72">score = distinct co-buyer count</text>
  <text x="169" y="420" text-anchor="middle"
        font-family="'Comic Mono',monospace" font-size="9" fill="#2e86c1">limit: 1..100 (MAX_RECOMMENDATION_LIMIT)</text>

  <!-- recommendFollows FOAF rect — cx=630 -->
  <rect x="503" y="338" width="255" height="88" rx="8"
        fill="#d5f5e3" stroke="#1e8449" stroke-width="1.5"/>
  <text x="630" y="360" text-anchor="middle"
        font-family="'Architects Daughter',sans-serif" font-size="12" font-weight="bold" fill="#145a32">recommendFollows(userVertexId, limit)</text>
  <text x="630" y="377" text-anchor="middle"
        font-family="'Comic Mono',monospace" font-size="10" fill="#196f3d">FOAF on FOLLOWS graph</text>
  <text x="630" y="393" text-anchor="middle"
        font-family="'Comic Mono',monospace" font-size="9" fill="#196f3d">2-hop: seed→follows→follows</text>
  <text x="630" y="408" text-anchor="middle"
        font-family="'Comic Mono',monospace" font-size="9" fill="#196f3d">mutualFollowCount = intermediary count</text>
  <text x="630" y="420" text-anchor="middle"
        font-family="'Comic Mono',monospace" font-size="9" fill="#1e8449">limit: 1..100 (MAX_RECOMMENDATION_LIMIT)</text>

  <!-- Service→Algorithm connectors (orthogonal) -->
  <!-- RecService → CF (straight down, solid) -->
  <line x1="170" y1="296" x2="169" y2="338"
        stroke="#2c3e50" stroke-width="1.5" marker-end="url(#arr)"/>
  <!-- RecSuspend → FOAF (straight down, dashed) -->
  <line x1="641" y1="296" x2="630" y2="338"
        stroke="#2c3e50" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arr)"/>
  <!-- RecService → FOAF (right-angle, solid) -->
  <path d="M 290,257 L 484,257 L 484,382 L 503,382"
        stroke="#2c3e50" stroke-width="1" fill="none" marker-end="url(#arr)"/>
  <!-- RecSuspend → CF (right-angle, dashed) -->
  <path d="M 510,263 L 316,263 L 316,382 L 297,382"
        stroke="#2c3e50" stroke-width="1" stroke-dasharray="5,3" fill="none" marker-end="url(#arr)"/>

  <!-- ═══════════════════════════════════════════════════════════════════ -->
  <!-- BAND 4: Graph Backends (y=442..604) -->
  <rect x="12" y="442" width="776" height="162" rx="8"
        fill="#fdecea" stroke="#f1948a" stroke-width="1.5"/>
  <text x="24" y="459" font-family="'Architects Daughter',sans-serif"
        font-size="11" font-weight="bold" fill="#922b21">Graph Backends</text>

  <!-- TinkerGraph cylinder (cx=155) -->
  <rect x="73"  y="472" width="164" height="90" fill="#f5cba7" stroke="#ca6f1e" stroke-width="1.5"/>
  <ellipse cx="155" cy="472" rx="82" ry="14" fill="#fde3c3" stroke="#ca6f1e" stroke-width="1.5"/>
  <ellipse cx="155" cy="562" rx="82" ry="14" fill="#e8936a" stroke="#ca6f1e" stroke-width="1.5"/>
  <ellipse cx="155" cy="472" rx="82" ry="14" fill="#fde3c3" stroke="#ca6f1e" stroke-width="1.5"/>
  <text x="155" y="514" text-anchor="middle"
        font-family="'Architects Daughter',sans-serif" font-size="13" font-weight="bold" fill="#6e2f0a">TinkerGraph</text>
  <text x="155" y="531" text-anchor="middle"
        font-family="'Comic Mono',monospace" font-size="9" fill="#7e5109">in-memory · no Docker</text>
  <text x="155" y="546" text-anchor="middle"
        font-family="'Comic Mono',monospace" font-size="9" fill="#7e5109">default test task</text>

  <!-- Neo4j cylinder (cx=400) -->
  <rect x="318" y="472" width="164" height="90" fill="#fadbd8" stroke="#cb4335" stroke-width="1.5"/>
  <ellipse cx="400" cy="472" rx="82" ry="14" fill="#fde8e7" stroke="#cb4335" stroke-width="1.5"/>
  <ellipse cx="400" cy="562" rx="82" ry="14" fill="#e97b6e" stroke="#cb4335" stroke-width="1.5"/>
  <ellipse cx="400" cy="472" rx="82" ry="14" fill="#fde8e7" stroke="#cb4335" stroke-width="1.5"/>
  <text x="400" y="514" text-anchor="middle"
        font-family="'Architects Daughter',sans-serif" font-size="13" font-weight="bold" fill="#7b241c">Neo4j</text>
  <text x="400" y="531" text-anchor="middle"
        font-family="'Comic Mono',monospace" font-size="9" fill="#922b21">Neo4jServer.Launcher.neo4j</text>
  <text x="400" y="546" text-anchor="middle"
        font-family="'Comic Mono',monospace" font-size="9" fill="#922b21">:integrationTest</text>

  <!-- Memgraph cylinder (cx=645) -->
  <rect x="563" y="472" width="164" height="90" fill="#f1948a" stroke="#a93226" stroke-width="1.5"/>
  <ellipse cx="645" cy="472" rx="82" ry="14" fill="#f5b7b1" stroke="#a93226" stroke-width="1.5"/>
  <ellipse cx="645" cy="562" rx="82" ry="14" fill="#cd6155" stroke="#a93226" stroke-width="1.5"/>
  <ellipse cx="645" cy="472" rx="82" ry="14" fill="#f5b7b1" stroke="#a93226" stroke-width="1.5"/>
  <text x="645" y="514" text-anchor="middle"
        font-family="'Architects Daughter',sans-serif" font-size="13" font-weight="bold" fill="#7b241c">Memgraph</text>
  <text x="645" y="531" text-anchor="middle"
        font-family="'Comic Mono',monospace" font-size="9" fill="#78281f">MemgraphServer.Launcher</text>
  <text x="645" y="546" text-anchor="middle"
        font-family="'Comic Mono',monospace" font-size="9" fill="#78281f">AuthTokens.none()</text>

  <!-- Algorithm→Backend connectors (orthogonal) -->
  <!-- CF → TinkerGraph (straight down) -->
  <line x1="155" y1="426" x2="155" y2="458"
        stroke="#2c3e50" stroke-width="1.5" marker-end="url(#arr)"/>
  <!-- CF → Neo4j (right then down) -->
  <path d="M 260,400 L 400,400 L 400,458"
        stroke="#2c3e50" stroke-width="1" fill="none" marker-end="url(#arr)"/>
  <!-- CF → Memgraph (right then down) -->
  <path d="M 270,415 L 645,415 L 645,458"
        stroke="#2c3e50" stroke-width="1" fill="none" marker-end="url(#arr)"/>
  <!-- FOAF → Memgraph (straight down) -->
  <line x1="645" y1="426" x2="645" y2="458"
        stroke="#2c3e50" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arr)"/>
  <!-- FOAF → Neo4j (left then down, dashed) -->
  <path d="M 540,405 L 400,405 L 400,458"
        stroke="#2c3e50" stroke-width="1" stroke-dasharray="5,3" fill="none" marker-end="url(#arr)"/>
  <!-- FOAF → TinkerGraph (far left, dashed) -->
  <path d="M 520,420 L 155,420 L 155,458"
        stroke="#2c3e50" stroke-width="1" stroke-dasharray="5,3" fill="none" marker-end="url(#arr)"/>

  <!-- ─── Legend strip ─────────────────────────────────────────────────── -->
  <rect x="12" y="612" width="776" height="22" rx="6"
        fill="#ecf0f1" stroke="#bdc3c7" stroke-width="1"/>
  <!-- blocking call -->
  <line x1="30"  y1="623" x2="60"  y2="623" stroke="#2c3e50" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="65"  y="627" font-family="'Comic Mono',monospace" font-size="9" fill="#2c3e50">blocking call</text>
  <!-- suspend call -->
  <line x1="168" y1="623" x2="198" y2="623" stroke="#2c3e50" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arr)"/>
  <text x="203" y="627" font-family="'Comic Mono',monospace" font-size="9" fill="#2c3e50">suspend call</text>
  <!-- PURCHASED -->
  <line x1="308" y1="623" x2="338" y2="623" stroke="#e67e22" stroke-width="1.5" marker-end="url(#arr-orange)"/>
  <text x="343" y="627" font-family="'Comic Mono',monospace" font-size="9" fill="#e67e22">PURCHASED edge</text>
  <!-- FOLLOWS -->
  <path d="M 456,623 C 468,614 486,614 474,623" stroke="#7d3c98" stroke-width="1.5" stroke-dasharray="4,2" fill="none" marker-end="url(#arr-purple)"/>
  <text x="490" y="627" font-family="'Comic Mono',monospace" font-size="9" fill="#7d3c98">FOLLOWS self-loop</text>
  <!-- input -->
  <line x1="613" y1="623" x2="643" y2="623" stroke="#85929e" stroke-width="1" stroke-dasharray="3,3" marker-end="url(#arr-gray)"/>
  <text x="648" y="627" font-family="'Comic Mono',monospace" font-size="9" fill="#85929e">vertex input</text>
</svg>
