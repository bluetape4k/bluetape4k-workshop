<svg xmlns="http://www.w3.org/2000/svg" width="860" height="560" viewBox="0 0 860 560">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M1,1 L8,4.5 L1,8 Z" fill="#6080a8"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M1,1 L8,4.5 L1,8 Z" fill="#52a872"/>
    </marker>
  </defs>

  <!-- Canvas -->
  <rect width="860" height="560" rx="14" fill="#f8fafc" stroke="#c8d4e8" stroke-width="1.5"/>

  <!-- Title -->
  <text x="430" y="36" text-anchor="middle"
        font-family="Architects Daughter"
        font-size="19" fill="#1e2d4e" font-weight="bold">Module Architecture</text>
  <text x="430" y="56" text-anchor="middle"
        font-family="Comic Mono"
        font-size="11" fill="#64748b">graph/social-network — layer view</text>

  <!-- ══════════════ Layer 1: Schema ══════════════ -->
  <rect x="20" y="70" width="820" height="100" rx="8" fill="#edf2ff" stroke="#aabce0" stroke-width="1.2"/>
  <text x="34" y="88" font-family="Architects Daughter"
        font-size="12" fill="#3050a0">Schema Layer</text>

  <!-- PersonLabel -->
  <rect x="30" y="92" width="140" height="64" rx="6" fill="#dde8ff" stroke="#8aaade" stroke-width="1.2"/>
  <text x="100" y="115" text-anchor="middle"
        font-family="Architects Daughter" font-size="13" fill="#1a2d6a" font-weight="bold">PersonLabel</text>
  <text x="100" y="132" text-anchor="middle"
        font-family="Comic Mono" font-size="10" fill="#607090">VertexLabel</text>
  <text x="100" y="148" text-anchor="middle"
        font-family="Comic Mono" font-size="9" fill="#607090">personId · name · title</text>

  <!-- CompanyLabel -->
  <rect x="185" y="92" width="140" height="64" rx="6" fill="#d8f0e0" stroke="#80be90" stroke-width="1.2"/>
  <text x="255" y="115" text-anchor="middle"
        font-family="Architects Daughter" font-size="13" fill="#1a3a2a" font-weight="bold">CompanyLabel</text>
  <text x="255" y="132" text-anchor="middle"
        font-family="Comic Mono" font-size="10" fill="#3a6040">VertexLabel</text>
  <text x="255" y="148" text-anchor="middle"
        font-family="Comic Mono" font-size="9" fill="#3a6040">companyId · name</text>

  <!-- KnowsLabel -->
  <rect x="340" y="92" width="140" height="64" rx="6" fill="#fde8d8" stroke="#d89060" stroke-width="1.2"/>
  <text x="410" y="115" text-anchor="middle"
        font-family="Architects Daughter" font-size="13" fill="#6a1a00" font-weight="bold">KnowsLabel</text>
  <text x="410" y="132" text-anchor="middle"
        font-family="Comic Mono" font-size="10" fill="#804020">EdgeLabel</text>
  <text x="410" y="148" text-anchor="middle"
        font-family="Comic Mono" font-size="9" fill="#804020">KNOWS · since · strength</text>

  <!-- FollowsLabel -->
  <rect x="495" y="92" width="140" height="64" rx="6" fill="#fde8d8" stroke="#d89060" stroke-width="1.2"/>
  <text x="565" y="115" text-anchor="middle"
        font-family="Architects Daughter" font-size="13" fill="#6a1a00" font-weight="bold">FollowsLabel</text>
  <text x="565" y="132" text-anchor="middle"
        font-family="Comic Mono" font-size="10" fill="#804020">EdgeLabel</text>
  <text x="565" y="148" text-anchor="middle"
        font-family="Comic Mono" font-size="9" fill="#804020">FOLLOWS</text>

  <!-- WorksAtLabel -->
  <rect x="650" y="92" width="178" height="64" rx="6" fill="#fde8d8" stroke="#d89060" stroke-width="1.2"/>
  <text x="739" y="115" text-anchor="middle"
        font-family="Architects Daughter" font-size="13" fill="#6a1a00" font-weight="bold">WorksAtLabel</text>
  <text x="739" y="132" text-anchor="middle"
        font-family="Comic Mono" font-size="10" fill="#804020">EdgeLabel</text>
  <text x="739" y="148" text-anchor="middle"
        font-family="Comic Mono" font-size="9" fill="#804020">WORKS_AT · role · startDate</text>

  <!-- ══════════════ Layer 2: Service ══════════════ -->
  <rect x="20" y="195" width="820" height="100" rx="8" fill="#edfaf0" stroke="#90c8a0" stroke-width="1.2"/>
  <text x="34" y="213" font-family="Architects Daughter"
        font-size="12" fill="#1a6a30">Service Layer</text>

  <!-- SocialNetworkService (Blocking) -->
  <rect x="50" y="217" width="340" height="64" rx="6" fill="#c8f0d0" stroke="#60b070" stroke-width="1.5"/>
  <text x="220" y="241" text-anchor="middle"
        font-family="Architects Daughter" font-size="14" fill="#0a3a18" font-weight="bold">SocialNetworkService</text>
  <text x="220" y="258" text-anchor="middle"
        font-family="Comic Mono" font-size="11" fill="#2a5a30">Blocking — returns List / GraphPath</text>
  <text x="220" y="273" text-anchor="middle"
        font-family="Comic Mono" font-size="10" fill="#3a7040">addPerson · connect · recommendConnections</text>

  <!-- SocialNetworkSuspendService (Coroutine) -->
  <rect x="470" y="217" width="370" height="64" rx="6" fill="#b0f0c8" stroke="#40a860" stroke-width="1.5"/>
  <text x="655" y="241" text-anchor="middle"
        font-family="Architects Daughter" font-size="14" fill="#0a3a18" font-weight="bold">SocialNetworkSuspendService</text>
  <text x="655" y="258" text-anchor="middle"
        font-family="Comic Mono" font-size="11" fill="#1a4a28">Coroutine — suspend / Flow&lt;T&gt;</text>
  <text x="655" y="273" text-anchor="middle"
        font-family="Comic Mono" font-size="10" fill="#2a6040">addPerson · connect · findAllConnectionPaths</text>

  <!-- ══════════════ Layer 3: Graph Operations ══════════════ -->
  <rect x="20" y="320" width="820" height="100" rx="8" fill="#fff8e8" stroke="#d0a840" stroke-width="1.2"/>
  <text x="34" y="338" font-family="Architects Daughter"
        font-size="12" fill="#806010">Graph Operations  (bluetape4k-graph)</text>

  <!-- GraphBlockingOperations -->
  <rect x="50" y="342" width="340" height="64" rx="6" fill="#fde8b0" stroke="#c8901a" stroke-width="1.5"/>
  <text x="220" y="367" text-anchor="middle"
        font-family="Architects Daughter" font-size="13" fill="#4a3000" font-weight="bold">GraphBlockingOperations</text>
  <text x="220" y="384" text-anchor="middle"
        font-family="Comic Mono" font-size="10" fill="#6a4010">addVertex · addEdge · neighbors</text>
  <text x="220" y="398" text-anchor="middle"
        font-family="Comic Mono" font-size="10" fill="#6a4010">shortestPath · allPaths</text>

  <!-- GraphSuspendOperations -->
  <rect x="470" y="342" width="370" height="64" rx="6" fill="#fce8a0" stroke="#b88010" stroke-width="1.5"/>
  <text x="655" y="367" text-anchor="middle"
        font-family="Architects Daughter" font-size="13" fill="#4a3000" font-weight="bold">GraphSuspendOperations</text>
  <text x="655" y="384" text-anchor="middle"
        font-family="Comic Mono" font-size="10" fill="#5a3808">suspend addVertex · suspend addEdge</text>
  <text x="655" y="398" text-anchor="middle"
        font-family="Comic Mono" font-size="10" fill="#5a3808">Flow&lt;GraphVertex&gt; neighbors</text>

  <!-- ══════════════ Layer 4: Backends ══════════════ -->
  <rect x="20" y="445" width="820" height="100" rx="8" fill="#f0f0f4" stroke="#a0a8c0" stroke-width="1.2"/>
  <text x="34" y="463" font-family="Architects Daughter"
        font-size="12" fill="#404868">Backends</text>

  <!-- TinkerGraph -->
  <rect x="55" y="467" width="210" height="64" rx="6" fill="#e8e8f0" stroke="#8888b0" stroke-width="1.5"/>
  <text x="160" y="491" text-anchor="middle"
        font-family="Architects Daughter" font-size="13" fill="#2a2a50" font-weight="bold">TinkerGraph</text>
  <text x="160" y="508" text-anchor="middle"
        font-family="Comic Mono" font-size="10" fill="#404870">in-memory, no Docker</text>
  <text x="160" y="522" text-anchor="middle"
        font-family="Comic Mono" font-size="10" fill="#404870">default unit tests</text>

  <!-- Neo4j -->
  <rect x="325" y="467" width="210" height="64" rx="6" fill="#e0e8f8" stroke="#6888c0" stroke-width="1.5"/>
  <text x="430" y="491" text-anchor="middle"
        font-family="Architects Daughter" font-size="13" fill="#1a2a60" font-weight="bold">Neo4j</text>
  <text x="430" y="508" text-anchor="middle"
        font-family="Comic Mono" font-size="10" fill="#304070">Testcontainers</text>
  <text x="430" y="522" text-anchor="middle"
        font-family="Comic Mono" font-size="10" fill="#304070">@Tag("integration")</text>

  <!-- Memgraph -->
  <rect x="595" y="467" width="210" height="64" rx="6" fill="#e0f0e8" stroke="#60a878" stroke-width="1.5"/>
  <text x="700" y="491" text-anchor="middle"
        font-family="Architects Daughter" font-size="13" fill="#1a3a28" font-weight="bold">Memgraph</text>
  <text x="700" y="508" text-anchor="middle"
        font-family="Comic Mono" font-size="10" fill="#2a5040">Testcontainers</text>
  <text x="700" y="522" text-anchor="middle"
        font-family="Comic Mono" font-size="10" fill="#2a5040">@Tag("integration")</text>

  <!-- ══ Arrows: Service → GraphOps ══ -->
  <!-- SocialNetworkService bottom (220, 281) → GraphBlockingOperations top (220, 342) -->
  <line x1="220" y1="281" x2="220" y2="342" stroke="#6080a8" stroke-width="2" marker-end="url(#arr)"/>
  <!-- SocialNetworkSuspendService bottom (655, 281) → GraphSuspendOperations top (655, 342) -->
  <line x1="655" y1="281" x2="655" y2="342" stroke="#6080a8" stroke-width="2" marker-end="url(#arr)"/>

  <!-- ══ Arrows: GraphOps → Backends (one arrow per ops section) ══ -->
  <!-- GraphBlockingOperations bottom-center → Backends layer top -->
  <line x1="220" y1="406" x2="220" y2="445" stroke="#52a872" stroke-width="2" marker-end="url(#arr-green)"/>
  <!-- GraphSuspendOperations bottom-center → Backends layer top -->
  <line x1="655" y1="406" x2="655" y2="445" stroke="#52a872" stroke-width="2" marker-end="url(#arr-green)"/>
</svg>
