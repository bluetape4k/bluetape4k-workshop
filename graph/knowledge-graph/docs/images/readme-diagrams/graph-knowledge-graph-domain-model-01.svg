<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="600" viewBox="0 0 1120 600" role="img" aria-label="Knowledge Graph Domain Model">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#1f2937" flood-opacity="0.10"/></filter>
  <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L8,4.5 L1,8 Z" fill="#5F7FA8"/></marker>
  <marker id="arrowGreen" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L8,4.5 L1,8 Z" fill="#4F9F74"/></marker>
  <marker id="arrowTeal" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L8,4.5 L1,8 Z" fill="#319795"/></marker>
  <marker id="arrowAmber" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L8,4.5 L1,8 Z" fill="#C9851B"/></marker>
  <style><![CDATA[
    .canvas{fill:#F7F9FC} .frame{fill:#FFFFFF;stroke:#D7E0EA;stroke-width:1.4} .card{stroke-width:1.6;filter:url(#shadow)}
    .title{font-family:"Architects Daughter";font-size:29px;fill:#152238} .subtitle{font-family:"Comic Mono";font-size:13px;fill:#607086}
    .label{font-family:"Architects Daughter";font-size:17px;font-weight:bold;fill:#152238} .mono{font-family:"Comic Mono";font-size:11px;fill:#526277}
    .note{font-family:"Comic Mono";font-size:10px;fill:#6A788A;font-style:italic} .band{font-family:"Architects Daughter";font-size:14px;fill:#415168}
    .pill{fill-opacity:.94;stroke-width:1.1} .pilltext{font-family:"Comic Mono";font-size:10px;fill:#203040}
  ]]></style>
</defs>
<rect class="canvas" width="1120" height="600"/>
<rect class="frame" x="18" y="18" width="1084" height="564" rx="18"/>
<text class="title" x="560.0" y="53.0" text-anchor="middle">Knowledge Graph Domain Model</text>
<text class="subtitle" x="560.0" y="75.0" text-anchor="middle">Document, Entity, and Concept labels with directed edge semantics</text>
<path class="route" id="document_to_entity_mentions" d="M 308.0,211.0 L 368.0,211.0 L 368.0,203.0 L 430.0,203.0" fill="none" stroke="#319795" stroke-width="2.2" marker-end="url(#arrowTeal)"/>
<path class="route" id="entity_to_entity_related" d="M 560.0,290.0 L 560.0,330.0 L 560.0,330.0 L 560.0,370.0" fill="none" stroke="#5F7FA8" stroke-width="2.2" marker-end="url(#arrow)"/>
<path class="route" id="entity_to_concept_is_a" d="M 690.0,203.0 L 752.0,203.0 L 752.0,211.0 L 812.0,211.0" fill="none" stroke="#C9851B" stroke-width="2.2" marker-end="url(#arrowAmber)"/>
<rect class="pill" x="289.5" y="181.0" width="157" height="24" rx="12" fill="#FFFFFF" stroke="#319795"/>
<text class="pilltext" x="368.0" y="197.0" text-anchor="middle">MENTIONS confidence</text>
<rect class="pill" x="467.5" y="305.0" width="185" height="24" rx="12" fill="#FFFFFF" stroke="#5F7FA8"/>
<text class="pilltext" x="560.0" y="321.0" text-anchor="middle">RELATED_TO relationType</text>
<rect class="pill" x="716.0" y="181.0" width="72" height="24" rx="12" fill="#FFFFFF" stroke="#C9851B"/>
<text class="pilltext" x="752.0" y="197.0" text-anchor="middle">IS_A</text>
<g id="document">
  <rect class="card" x="58" y="154" width="250" height="174" rx="4" fill="#E1ECFF" stroke="#7398D4"/>
  <rect x="58" y="154" width="250" height="42" rx="4" fill="#D7E2F5" stroke="#7398D4"/>
  <rect x="58" y="183" width="250" height="13" fill="#D7E2F5"/>
<text class="label" x="183.0" y="181.0" text-anchor="middle">Document</text>
  <line x1="58" y1="196" x2="308" y2="196" stroke="#7398D4" stroke-width="1"/>
<text class="mono" x="76.0" y="217.0" text-anchor="start">documentId : String</text>
<text class="mono" x="76.0" y="234.0" text-anchor="start">title      : String</text>
<text class="mono" x="76.0" y="251.0" text-anchor="start">source     : String</text>
<text class="note" x="76.0" y="312.0" text-anchor="start">VertexLabel("Document")</text>
</g>
<g id="entity">
  <rect class="card" x="430" y="116" width="260" height="174" rx="4" fill="#DDF4E8" stroke="#5DAA7B"/>
  <rect x="430" y="116" width="260" height="42" rx="4" fill="#D3EADE" stroke="#5DAA7B"/>
  <rect x="430" y="145" width="260" height="13" fill="#D3EADE"/>
<text class="label" x="560.0" y="143.0" text-anchor="middle">Entity</text>
  <line x1="430" y1="158" x2="690" y2="158" stroke="#5DAA7B" stroke-width="1"/>
<text class="mono" x="448.0" y="179.0" text-anchor="start">entityId   : String</text>
<text class="mono" x="448.0" y="196.0" text-anchor="start">name       : String</text>
<text class="mono" x="448.0" y="213.0" text-anchor="start">entityType : String</text>
<text class="note" x="448.0" y="274.0" text-anchor="start">VertexLabel("Entity")</text>
</g>
<g id="entity_target">
  <rect class="card" x="430" y="370" width="260" height="174" rx="4" fill="#DDF4E8" stroke="#5DAA7B"/>
  <rect x="430" y="370" width="260" height="42" rx="4" fill="#D3EADE" stroke="#5DAA7B"/>
  <rect x="430" y="399" width="260" height="13" fill="#D3EADE"/>
<text class="label" x="560.0" y="397.0" text-anchor="middle">Entity</text>
  <line x1="430" y1="412" x2="690" y2="412" stroke="#5DAA7B" stroke-width="1"/>
<text class="mono" x="448.0" y="433.0" text-anchor="start">entityId   : String</text>
<text class="mono" x="448.0" y="450.0" text-anchor="start">name       : String</text>
<text class="mono" x="448.0" y="467.0" text-anchor="start">entityType : String</text>
<text class="note" x="448.0" y="528.0" text-anchor="start">semantic target</text>
</g>
<g id="concept">
  <rect class="card" x="812" y="154" width="250" height="174" rx="4" fill="#FFF1D2" stroke="#D59A32"/>
  <rect x="812" y="154" width="250" height="42" rx="4" fill="#F5E7C8" stroke="#D59A32"/>
  <rect x="812" y="183" width="250" height="13" fill="#F5E7C8"/>
<text class="label" x="937.0" y="181.0" text-anchor="middle">Concept</text>
  <line x1="812" y1="196" x2="1062" y2="196" stroke="#D59A32" stroke-width="1"/>
<text class="mono" x="830.0" y="217.0" text-anchor="start">conceptId : String</text>
<text class="mono" x="830.0" y="234.0" text-anchor="start">name      : String</text>
<text class="mono" x="830.0" y="251.0" text-anchor="start">domain    : String</text>
<text class="note" x="830.0" y="312.0" text-anchor="start">VertexLabel("Concept")</text>
</g>
</svg>
