<path class="route" id="suspend_service_to_graph_suspend_ops" d="M 874.0,336.0 L 874.0,360.0 L 801.0,360.0 L 801.0,398.0" fill="none" stroke="#4F9F74" stroke-width="2.2" marker-end="url(#arrowGreen)"/>
<path class="route" id="graph_ops_to_tinkergraph" d="M 390.0,486.0 L 390.0,500.0 L 217.0,500.0 L 217.0,538.0" fill="none" stroke="#C9851B" stroke-width="2.2" marker-end="url(#arrowAmber)"/>
<path class="route" id="graph_ops_to_neo4j" d="M 390.0,486.0 L 390.0,500.0 L 581.0,500.0 L 581.0,538.0" fill="none" stroke="#C9851B" stroke-width="2.2" marker-end="url(#arrowAmber)"/>
<path class="route" id="graph_suspend_ops_to_neo4j" d="M 801.0,486.0 L 801.0,500.0 L 581.0,500.0 L 581.0,538.0" fill="none" stroke="#C9851B" stroke-width="2.2" marker-end="url(#arrowAmber)"/>
<path class="route" id="graph_suspend_ops_to_memgraph" d="M 801.0,486.0 L 801.0,500.0 L 945.0,500.0 L 945.0,538.0" fill="none" stroke="#C9851B" stroke-width="2.2" marker-end="url(#arrowAmber)"/>
<g id="schema">
