<svg xmlns="http://www.w3.org/2000/svg" width="820" height="510" viewBox="0 0 820 510">
  <defs>
    <marker id="a-d" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1,1 L7,4 L1,7 Z" fill="#c04010"/></marker>
    <marker id="a-p" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1,1 L7,4 L1,7 Z" fill="#a07800"/></marker>
    <marker id="a-h" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1,1 L7,4 L1,7 Z" fill="#008858"/></marker>
    <marker id="a-i" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1,1 L7,4 L1,7 Z" fill="#5828a8"/></marker>
    <marker id="a-r" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1,1 L7,4 L1,7 Z" fill="#909090"/></marker>
  </defs>

  <!-- Canvas -->
  <rect width="820" height="510" rx="14" fill="#f8fafc" stroke="#c8d4e8" stroke-width="1.5"/>

  <!-- Title -->
  <text x="410" y="34" text-anchor="middle"
        font-family="'Architects Daughter',Georgia,serif"
        font-size="18" fill="#1e2d4e" font-weight="bold">Fraud Detection — Example Scenario</text>
  <text x="410" y="52" text-anchor="middle"
        font-family="'Comic Mono','Courier New',monospace"
        font-size="11" fill="#64748b">Users sharing identifiers form an abuse cluster</text>

  <!-- ── Abuse cluster zone (UserA + UserB share Device + Payment) ── -->
  <rect x="24" y="68" width="772" height="310" rx="10"
        fill="#fff2f2" stroke="#d84040" stroke-width="1.6" stroke-dasharray="7,4"/>
  <text x="38" y="84"
        font-family="'Architects Daughter',Georgia,serif"
        font-size="11" fill="#b02020">⚠  Abuse Cluster</text>

  <!-- ════════ USER NODES (left, x=34–214) ════════ -->
  <!-- User A -->
  <rect x="34" y="92" width="180" height="68" rx="8" fill="#ffd0d0" stroke="#c84040" stroke-width="1.5"/>
  <rect x="34" y="92" width="180" height="30" rx="8" fill="#ffb0b0" stroke="#c84040" stroke-width="1.5"/>
  <rect x="34" y="110" width="180" height="12" fill="#ffb0b0"/>
  <text x="124" y="110" text-anchor="middle"
        font-family="'Architects Daughter',Georgia,serif" font-size="14" fill="#7a0000" font-weight="bold">User A  🚨</text>
  <text x="50"  y="137" font-family="'Comic Mono','Courier New',monospace" font-size="10" fill="#600000">userId: "userA" · Fraudster</text>
  <text x="50"  y="152" font-family="'Comic Mono','Courier New',monospace" font-size="10" fill="#600000">country: "KR"</text>

  <!-- User B -->
  <rect x="34" y="210" width="180" height="68" rx="8" fill="#ffe0c0" stroke="#b06020" stroke-width="1.5"/>
  <rect x="34" y="210" width="180" height="30" rx="8" fill="#ffc080" stroke="#b06020" stroke-width="1.5"/>
  <rect x="34" y="228" width="180" height="12" fill="#ffc080"/>
  <text x="124" y="228" text-anchor="middle"
        font-family="'Architects Daughter',Georgia,serif" font-size="14" fill="#603000" font-weight="bold">User B  ⚠</text>
  <text x="50"  y="254" font-family="'Comic Mono','Courier New',monospace" font-size="10" fill="#603000">userId: "userB" · Accomplice</text>
  <text x="50"  y="269" font-family="'Comic Mono','Courier New',monospace" font-size="10" fill="#603000">country: "KR"</text>

  <!-- REFERRED_BY A→B (small left-side arc) -->
  <path d="M 50,160 Q 14,195 50,210" fill="none" stroke="#909090" stroke-width="1.4" stroke-dasharray="4,3" marker-end="url(#a-r)"/>
  <text x="4" y="191" font-family="'Comic Mono','Courier New',monospace" font-size="8" fill="#808080" transform="rotate(-90 4,191)">REF</text>

  <!-- User C (outside abuse cluster) -->
  <rect x="34" y="395" width="180" height="68" rx="8" fill="#d8ecff" stroke="#4878b0" stroke-width="1.5"/>
  <rect x="34" y="395" width="180" height="30" rx="8" fill="#b0d0f0" stroke="#4878b0" stroke-width="1.5"/>
  <rect x="34" y="413" width="180" height="12" fill="#b0d0f0"/>
  <text x="124" y="413" text-anchor="middle"
        font-family="'Architects Daughter',Georgia,serif" font-size="14" fill="#1a2e60" font-weight="bold">User C  ✓</text>
  <text x="50"  y="439" font-family="'Comic Mono','Courier New',monospace" font-size="10" fill="#1a2e60">userId: "userC" · Legitimate?</text>
  <text x="50"  y="454" font-family="'Comic Mono','Courier New',monospace" font-size="10" fill="#1a2e60">country: "US"</text>

  <!-- ════════ IDENTIFIER NODES (right, x=606–786) ════════ -->
  <!-- Device-1 (shared A+B) -->
  <rect x="606" y="88" width="186" height="72" rx="8" fill="#d0e8ff" stroke="#3870c8" stroke-width="2"/>
  <rect x="606" y="88" width="186" height="30" rx="8" fill="#a0c8f0" stroke="#3870c8" stroke-width="2"/>
  <rect x="606" y="106" width="186" height="12" fill="#a0c8f0"/>
  <text x="699" y="106" text-anchor="middle"
        font-family="'Architects Daughter',Georgia,serif" font-size="13" fill="#0a2060" font-weight="bold">Device-1  ⚠</text>
  <text x="622" y="132" font-family="'Comic Mono','Courier New',monospace" font-size="10" fill="#0a2060">deviceId: "dev-abc"</text>
  <text x="622" y="147" font-family="'Comic Mono','Courier New',monospace" font-size="10" fill="#0a2060">platform: "android"</text>

  <!-- Payment (shared A+B) -->
  <rect x="606" y="205" width="186" height="72" rx="8" fill="#fff0b0" stroke="#a08000" stroke-width="2"/>
  <rect x="606" y="205" width="186" height="30" rx="8" fill="#ffe070" stroke="#a08000" stroke-width="2"/>
  <rect x="606" y="223" width="186" height="12" fill="#ffe070"/>
  <text x="699" y="223" text-anchor="middle"
        font-family="'Architects Daughter',Georgia,serif" font-size="13" fill="#503000" font-weight="bold">Payment  ⚠</text>
  <text x="622" y="248" font-family="'Comic Mono','Courier New',monospace" font-size="10" fill="#503000">paymentToken: "tok-xyz"</text>
  <text x="622" y="263" font-family="'Comic Mono','Courier New',monospace" font-size="10" fill="#503000">(PCI-safe token)</text>

  <!-- Phone (A only) -->
  <rect x="606" y="300" width="186" height="68" rx="8" fill="#d0f0d8" stroke="#30a058" stroke-width="1.5"/>
  <rect x="606" y="300" width="186" height="30" rx="8" fill="#a0e0b0" stroke="#30a058" stroke-width="1.5"/>
  <rect x="606" y="318" width="186" height="12" fill="#a0e0b0"/>
  <text x="699" y="318" text-anchor="middle"
        font-family="'Architects Daughter',Georgia,serif" font-size="13" fill="#0a3818" font-weight="bold">Phone  (A only)</text>
  <text x="622" y="343" font-family="'Comic Mono','Courier New',monospace" font-size="10" fill="#0a3818">phone: "sha256:a3f…"</text>
  <text x="622" y="358" font-family="'Comic Mono','Courier New',monospace" font-size="10" fill="#0a3818">(E.164 hashed)</text>

  <!-- IP (shared A+B+C) -->
  <rect x="606" y="390" width="186" height="72" rx="8" fill="#ead0ff" stroke="#6030a8" stroke-width="2"/>
  <rect x="606" y="390" width="186" height="30" rx="8" fill="#c090f0" stroke="#6030a8" stroke-width="2"/>
  <rect x="606" y="408" width="186" height="12" fill="#c090f0"/>
  <text x="699" y="408" text-anchor="middle"
        font-family="'Architects Daughter',Georgia,serif" font-size="13" fill="#280058" font-weight="bold">IP Address  ⚠</text>
  <text x="622" y="433" font-family="'Comic Mono','Courier New',monospace" font-size="10" fill="#280058">ip: "10.0.0.1"</text>
  <text x="622" y="448" font-family="'Comic Mono','Courier New',monospace" font-size="10" fill="#280058">shared: A + B + C</text>

  <!-- ════════ EDGES — straight diagonal lines ════════ -->
  <!-- UserA(214,126) → Device(606,124): USES_DEVICE orange -->
  <line x1="214" y1="126" x2="606" y2="124" stroke="#c04010" stroke-width="2.2" marker-end="url(#a-d)"/>
  <!-- UserB(214,244) → Device(606,140): USES_DEVICE orange -->
  <line x1="214" y1="244" x2="606" y2="140" stroke="#c04010" stroke-width="2.2" marker-end="url(#a-d)"/>

  <!-- UserA(214,140) → Payment(606,241): USES_PAYMENT gold -->
  <line x1="214" y1="140" x2="606" y2="241" stroke="#a07800" stroke-width="2.2" marker-end="url(#a-p)"/>
  <!-- UserB(214,258) → Payment(606,257): USES_PAYMENT gold -->
  <line x1="214" y1="258" x2="606" y2="257" stroke="#a07800" stroke-width="2.2" marker-end="url(#a-p)"/>

  <!-- UserA(214,152) → Phone(606,334): HAS_PHONE teal -->
  <line x1="214" y1="152" x2="606" y2="334" stroke="#008858" stroke-width="2" marker-end="url(#a-h)"/>

  <!-- UserA(214,160) → IP(606,424): USES_IP purple -->
  <line x1="214" y1="160" x2="606" y2="424" stroke="#5828a8" stroke-width="2" marker-end="url(#a-i)"/>
  <!-- UserB(214,270) → IP(606,430): USES_IP purple -->
  <line x1="214" y1="270" x2="606" y2="430" stroke="#5828a8" stroke-width="2" marker-end="url(#a-i)"/>
  <!-- UserC(214,429) → IP(606,436): USES_IP purple dashed -->
  <line x1="214" y1="429" x2="606" y2="436" stroke="#5828a8" stroke-width="1.8" stroke-dasharray="6,3" marker-end="url(#a-i)"/>

  <!-- ════════ Legend ════════ -->
  <rect x="24" y="476" width="772" height="26" rx="7" fill="#f0f4ff" stroke="#b0b8d8" stroke-width="1"/>
  <line x1="44" y1="489" x2="70" y2="489" stroke="#c04010" stroke-width="2.5"/>
  <text x="76" y="493" font-family="'Comic Mono','Courier New',monospace" font-size="10" fill="#333">USES_DEVICE</text>
  <line x1="176" y1="489" x2="202" y2="489" stroke="#a07800" stroke-width="2.5"/>
  <text x="208" y="493" font-family="'Comic Mono','Courier New',monospace" font-size="10" fill="#333">USES_PAYMENT</text>
  <line x1="316" y1="489" x2="342" y2="489" stroke="#008858" stroke-width="2.5"/>
  <text x="348" y="493" font-family="'Comic Mono','Courier New',monospace" font-size="10" fill="#333">HAS_PHONE</text>
  <line x1="434" y1="489" x2="460" y2="489" stroke="#5828a8" stroke-width="2.5"/>
  <text x="466" y="493" font-family="'Comic Mono','Courier New',monospace" font-size="10" fill="#333">USES_IP</text>
  <line x1="524" y1="489" x2="550" y2="489" stroke="#909090" stroke-width="1.8" stroke-dasharray="5,3"/>
  <text x="556" y="493" font-family="'Comic Mono','Courier New',monospace" font-size="10" fill="#333">REFERRED_BY</text>
  <text x="660" y="493" font-family="'Comic Mono','Courier New',monospace" font-size="10" fill="#c02020">⚠ = shared</text>
</svg>
