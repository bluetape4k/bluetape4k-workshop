spring:
    aot:
        enabled: true
    application:
        name: cache-resilience-demo
    data:
        redis:
            host: ${testcontainers.redis.host:localhost}
            port: ${testcontainers.redis.port:6379}
            lettuce:
                pool:
                    enabled: true
                    max-active: 16
                    max-idle: 4
                    min-idle: 1

server:
    port: 8090

info:
    name: ${spring.application.name}
    description: Redis + Resilience4j CircuitBreaker + Caffeine fallback demo

management:
    endpoints:
        web:
            exposure:
                include: "*"
    endpoint:
        health:
            show-details: always
    health:
        circuitbreakers:
            enabled: true

resilience4j.circuitbreaker:
    instances:
        redis-cache:
            registerHealthIndicator: true
            slidingWindowSize: 5
            minimumNumberOfCalls: 3
            failureRateThreshold: 60
            waitDurationInOpenState: 5s
            permittedNumberOfCallsInHalfOpenState: 2
            automaticTransitionFromOpenToHalfOpenEnabled: true
            eventConsumerBufferSize: 20
