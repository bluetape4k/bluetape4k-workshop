workshop:
  profile-image-moderation:
    public-base-url: http://localhost:8080/public-images
    default-image-url: http://localhost:8080/public-images/profile-images/default/default-profile.jpg
    max-input-bytes: 10485760
    max-pixels: 25000000
    max-width: 6000
    max-height: 6000
    request-concurrency: 4
    moderation-concurrency: 2
    processing-timeout: 10s
    moderation-timeout: 3s
    decision-delay: 1s
    rejected-filename-marker: reject

bluetape4k:
  images:
    storage:
      backend: local
      max-size-bytes: 10485760
      local:
        root-dir: ${java.io.tmpdir}/bluetape4k-profile-images

management:
  endpoints:
    web:
      exposure:
        include: health,metrics
