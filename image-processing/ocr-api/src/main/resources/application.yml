spring:
  application:
    name: image-ocr-api
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

workshop:
  ocr:
    native-enabled: false
    max-upload-bytes: 5242880
    max-image-pixels: 12000000
    timeout: 10s
    languages:
      - eng
    tessdata-path:
    tiff:
      max-encoded-bytes: 5242880
      max-pages: 16
      max-pixels-per-page: 12000000
      max-total-pixels: 64000000
      max-decoded-side: 8192
      max-metadata-bytes: 2097152
      max-result-text-chars: 1000000
      max-result-entries: 100000
